meta:
  title: "Дели трошкове у 140 валута, претворене или посебно"
  description: "Унеси сваки трошак у валути у којој си платио, води стања посебно или претварај по курсу који видиш и можеш променити, а затим се поравнај кратким списком уплата."
h1: "Дели трошкове у 140 валута"
navLabel: "Више валута"
lead: "Евра, јени и онај један такси у батима. Side Badger прима сваки трошак у валути у којој си платио, држи стања у реду и може да претвара кад се група радије поравна једном. Ради у 140 валута и природно пристаје [групним путовањима](page:use-case/group-trips)."
cta:
  heading: "Донеси своја евра, донеси своје јене"
  body: "Направи кориснички налог, оснуј групу и додај први трошак у било којој валути коју си случајно имао у руци."
  button: "Направи бесплатан налог"
problem:
  heading: "Унеси како је плаћено"
  body: "Путовање се ретко плаћа у једној валути. Хотел је резервисан код куће у фунтама, вечера плаћена у јенима, а кафа на аеродрому у ономе што се користило на преседању. Ручно претварати све пре него што то уопште упишеш начин је на који се табеле напуштају. У Side Badger-у сваки трошак уносиш у валути са рачуна, а сваки износ прати правила своје валуте, па јени немају децимале, а динари имају три. Недавно коришћене валуте су прве на списку."
workflow:
  heading: "Држи валуте посебно или претварај успут"
  steps:
    - title: "Додај трошак у његовој валути"
      body: "Изабери валуту, упиши износ, реци ко је платио и ко је делио. Ништа друго није потребно. То је подразумевано и чува изворни износ тачно онако како си га унео."
      shot: S07
      shotAlt: "Образац трошка са унетим износом у јенима"
    - title: "Прати стање за сваку валуту"
      body: "Стања се воде посебно по валути, а свако има сопствени кратак списак предложених уплата. Фунте се поравнавају у фунтама, а јени у јенима."
      shot: S10
      shotAlt: "Екран стања са поједностављеним дуговима у две валуте"
    - title: "Или претвори кад се група радије поравна једном"
      body: "Изабери другу валуту при уносу трошка и Side Badger га може претворити по актуелном девизном курсу, који можеш променити у онај који је важио при размени. Претворени износ придружује се стању у тој валути. Претварање је избор који група доноси, никад нешто што се дешава иза твојих леђа."
options:
  heading: "Курс који видиш и можеш променити"
  items:
    - title: "Курс је приказан"
      body: "Кад претвараш, курс и претворени износ појављују се у обрасцу, па нико не мора веровати броју на реч."
    - title: "Упиши свој"
      body: "Добио си бољи курс у мењачници или гори на аеродрому? Измени курс у онај који је важио и претворени износ се ажурира."
    - title: "Изворник остаје"
      body: "Изворни износ остаје уз трошак, поред претвореног, за свакога ко пита колико је било у јенима."
    - title: "Претварање је бесплатно"
      body: "Претварање не кошта ништа. Нема накнаде за унос трошка у другој валути."
