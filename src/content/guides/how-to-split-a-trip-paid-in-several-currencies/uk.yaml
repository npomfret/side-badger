meta:
  title: "Як поділити поїздку, оплачену в кількох валютах | Side Badger"
  description: "Фунти за готель, єни за рамен. Розраховуйтеся в кожній валюті окремо або конвертуйте за курсом, який бачите. Обидва шляхи з розрахунками."
h1: "Як поділити поїздку, оплачену в кількох валютах"
navLabel: "Поїздки в кількох валютах"
lead: "Вносьте кожну витрату у валюті, якою платили, а потім оберіть шлях. Або тримайте валюти окремо й розраховуйтеся в кожній її власними грошима, або конвертуйте за актуальним курсом обміну й розраховуйтеся один раз. Та сама поїздка до Японії дає чотири платежі першим способом і два другим."
cta:
  heading: "Вносьте в тих грошах, якими платили"
  body: "Створіть безкоштовний обліковий запис, заведіть групу для поїздки й додавайте кожну витрату в тій валюті, що була на чеку. Хочете спершу подробиці? Дивіться [кілька валют](page:feature/multiple-currencies) або [що входить у безкоштовне](page:pricing)."
sections:
  - heading: "Троє друзів, один готель і дуже багато єн"
    body: "Зої, Кенджі та Лусі проводять тиждень у Японії в [груповій поїздці](page:use-case/group-trips), і кожна витрата ділиться порівну на трьох. Зої забронювала готель ще вдома, у фунтах, за 600 £. Лусі купила проїзні на потяг у Токіо за 90 000 ¥. Кенджі заплатив за вечір рамену, 9 000 ¥, і щодня про це нагадує. Ніхто не хоче конвертувати три чеки на пероні. Для розрахунків тут 1 ¥ дорівнює 0,005 £: це кругла цифра, вигадана для цього посібника. У застосунку ви використаєте актуальний курс обміну або введете той, за яким справді обміняли."
  - heading: "Вносьте кожну в тих грошах, що на чеку"
    body: "Цей крок однаковий для будь-якого шляху. Поки що нічого конвертувати не треба."
    items:
      - "**Створіть групу.** На панелі оберіть **Створити групу**, назвіть її на честь поїздки, потім оберіть **Запросити інших** і надішліть посилання або QR-код."
      - "**Додайте готель.** Оберіть **Додати витрату** і введіть 600, обравши фунти як валюту поруч із сумою. Під **Хто заплатив?** виберіть Зої. Залиште всіх трьох у **Розділити між**, не чіпайте **Як розділити** на **Порівну** й оберіть **Зберегти витрату**."
      - "**Додайте єни.** Зробіть те саме для проїзних (платила Лусі) і рамену (платив Кенджі), обравши єни як валюту. Єни не мають десяткових знаків, тож форма їх і не просить."
  - heading: "Шлях перший: тримати валюти окремо"
    body: "Side Badger веде окремий баланс для кожної валюти й не зараховує одну проти іншої. У фунтах готель коштує по 200 £ на людину, тож Кенджі та Лусі винні Зої по 200 £. В єнах проїзні та рамен разом дають 99 000 ¥, тобто по 33 000 ¥ на кожного. Лусі заплатила 90 000 ¥ і має отримати 57 000 ¥. Зої не платила єнами й винна 33 000 ¥. Кенджі заплатив 9 000 ¥, тож винен 24 000 ¥."
    items:
      - "**Фунти.** Кенджі платить Зої 200 £, і Лусі платить Зої 200 £."
      - "**Єни.** Зої платить Лусі 33 000 ¥, і Кенджі платить Лусі 24 000 ¥."
      - "**Усього чотири платежі.** Зої та Лусі винні одна одній у двох валютах, які не скасовують одна одну. Курс тут ні до чого, тож і сперечатися нема про що."
      - "**Винні єни, платите фунтами.** Той, у кого немає єн, усе одно може заплатити фунтами. Коли записуєте платіж, відкрийте **Інша валюта?**, оберіть **Конвертувати в** фунти й перевірте курс. 33 000 ¥ Зої за курсом цього посібника дорівнюють 165 £, і баланс в єнах усе одно зійдеться."
      - "**Запишіть кожен платіж.** Платіть одне одному як зручно, потім оберіть **Розрахуватися** і скористайтеся **Записати розрахунок**. Більше про [розрахунок](page:feature/settle-up)."
  - heading: "Шлях другий: конвертувати по ходу"
    body: "Якщо група воліє бачити по одній цифрі на людину, конвертуйте, коли вносите витрату."
    items:
      - "**Конвертуйте у формі.** У **Додати витрату** оберіть **Конвертувати в** і виберіть фунти. Side Badger покаже курс і конвертовану суму, позначену знаком ≈. Змініть курс, якщо у вас був інший. Початкова сума в єнах лишається біля витрати."
      - "**Читайте у фунтах.** За 1 ¥ = 0,005 £ проїзні стають 450 £, а рамен 45 £. З готелем за 600 £ це 600 £ + 450 £ + 45 £ = 1 095 £, або 365 £ на людину. Зої заплатила 600 £, тож їй винні 235 £. Лусі заплатила 450 £ і має отримати 85 £. Кенджі заплатив 45 £ і винен 320 £."
      - "**Два платежі.** Обидва від Кенджі: 235 £ Зої та 85 £ Лусі. Зої та Лусі більше взагалі не платять одна одній."
      - "**Або задайте валюту групи.** Щоб пропустити зайвий крок, відкрийте **Налаштування** групи, знайдіть **Налаштування валюти** й оберіть **Автоматично конвертувати витрати в**. Кожна нова витрата тоді конвертуватиметься в цю валюту, і курс, як і раніше, видно й можна змінити."
  - heading: "Який шлях обрати?"
    items:
      - "**Тримайте окремо**, коли в людей ще є єни в гаманцях або коли ви не хочете сперечатися про курс. Ціна цього: більше платежів, і не в одній валюті."
      - "**Конвертуйте**, коли група живе в одній валюті й хоче одну цифру на людину та коротший список, як-от два перекази Кенджі. Ціна цього: група довіряє курсу, а курс фіксується на кожній витраті в момент збереження."
      - "**Вирішуйте заздалегідь.** Валюта групи конвертує лише нові та скопійовані витрати. Вона не повернеться й не впорядкує те, що ви вже внесли."
  - heading: "Курс і ліміт"
    items:
      - "**Курс фіксується під час збереження.** Старі витрати ніколи не переоцінюються, тож баланс не пливе разом із ринком. Витрати, внесені в різні дні, можуть мати різні курси, тож якщо група хоче один курс на всю поїздку, домовтеся про нього й вводьте щоразу."
      - "**Немає курсу? Введіть свій.** Side Badger отримує актуальний курс обміну, де може, але не для кожної пари його гарантовано. Якщо курсу немає або в обмінному пункті вам дали кращий, введіть власний."
      - "**999 999,99 за витрату, у її власній валюті.** Один ліміт, якими б не були гроші. В єнах це трохи менше ніж 1 000 000 ¥, близько 5 000 £ за курсом цього посібника. У валюті з великими числами, як-от індонезійська рупія, один рахунок може досягти ліміту швидше. Розділіть рахунок на дві витрати або внесіть його в іншій валюті й конвертуйте."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він ніколи не переказує й не обмінює гроші. Ви платите одне одному як зручно, а потім записуєте платіж."
      - "У ньому 140 валют. Криптовалют і металів серед них немає."
