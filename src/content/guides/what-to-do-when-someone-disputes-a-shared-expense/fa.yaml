meta:
  title: "وقتی کسی یک هزینه مشترک را زیر سؤال می‌برد چه کنیم | Side Badger"
  description: "پیام کنایه‌دار نفرستید. هزینه را زیر سؤال ببرید تا وقتی حرف می‌زنید از مانده همه بیرون بماند. با £45 شراب مهمانی، گام‌به‌گام حساب شده."
h1: "وقتی کسی یک هزینه مشترک را زیر سؤال می‌برد چه کنیم"
navLabel: "هزینه‌های مورد اختلاف"
lead: "به‌جای فرستادن یک پیام کنایه‌دار، روی هزینه یک سؤال مطرح کنید. تا وقتی سؤال باز است، کل هزینه از مانده همه بیرون می‌ماند. در نظرها درباره‌اش حرف بزنید، اگر گروه موافق بود تقسیم را ویرایش کنید و بگذارید کسی که پرسیده، یا یک مدیر، سؤال را ببندد."
cta:
  heading: "سؤال ناجور را مؤدبانه بپرسید"
  body: "یک حساب رایگان بسازید، برای خانه یک گروه شروع کنید و از یک مدیر بخواهید پرسش درباره هزینه را روشن کند، که تا وقتی کسی روشنش نکند خاموش است. اول تور می‌خواهید؟ ببینید [چطور کار می‌کند](page:how-it-works) یا [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing)."
sections:
  - heading: "سه هم‌خانه و £45 شراب"
    body: "بعد از مهمانی، تام شراب را به گروه خانه اضافه می‌کند. £45 است، تام پرداخت کرده و مساوی بین تام، پریا و عایشه تقسیم شده، یعنی £15 برای هر نفر. عایشه نمی‌نوشد. تام آن را برای مهمانی خرید و مهمانی برای [خانه](page:use-case/housemates) بود، پس کار اشتباهی نکرده. عایشه هم اگر بپرسد اشتباه نمی‌کند. اینجا هیچ‌کس آدم بد قصه نیست. فقط £15 شراب مورد اختلاف است و کلی راه برای ناجور کردنش. یک پیام کنایه‌دار به کل خانه یکی از آن راه‌هاست. یک سؤال روی هزینه راه ملایم‌تری است."
  - heading: "یک سؤال چه می‌کند"
    body: "عایشه هزینه را باز می‌کند و یک سؤال مطرح می‌کند. کل هزینه از مانده همه بیرون می‌افتد، نه فقط سهم او، و چیز دیگری تحت تأثیر قرار نمی‌گیرد. خرید بزرگ (£84) و نظافتچی (£60) هنوز حساب می‌شوند، که می‌شود £28 + £20 = £48 برای هر نفر. پس تا وقتی شراب معلق است، عایشه £48 بدهکار است، تام £36 طلبکار است و پریا £12 طلبکار است. خانه هر چه درباره شراب تصمیم بگیرد، در این فاصله مانده هیچ‌کس آن را شامل نمی‌شود. هر کس دیگری هم که در هزینه است می‌تواند سؤال خودش را مطرح کند. شراب فقط وقتی به مانده‌ها برمی‌گردد که آخرین سؤالی که روی آن باز است بسته شود، و سؤال را کسی که پرسیده یا یک مدیر می‌بندد."
  - heading: "حرف زدن، بعد درست کردن"
    body: "سؤال عایشه در نظرهای هزینه می‌نشیند، پس پاسخ‌ها درست زیر آن قرار می‌گیرند. [با هم برنامه بریزید](page:feature/plan-together) درباره نظرها و سؤال‌ها بیشتر دارد. تام و پریا آن را می‌خوانند و خانه با هم گپ می‌زند. تصمیم می‌گیرند شراب مال تام و پریا بود، چون آن‌ها نوشیدند. خانه‌ای دیگر شاید تقسیم سه‌نفره را نگه می‌داشت، یا چیزی در میانه توافق می‌کرد، و آن هم اشکالی نداشت. Side Badger آنچه را توافق می‌کنید ذخیره می‌کند و درباره شراب نظری ندارد. تام هزینه را ویرایش می‌کند تا مساوی بین خودش و پریا تقسیم شود، یعنی £22.50 برای هر نفر (£45 ÷ 2). عایشه دیگر در آن نیست، پس سؤالش با نسخه قدیمی می‌رود و شراب به مانده‌ها برمی‌گردد. نسخه قبلی نگه داشته می‌شود."
  - heading: "خواندن نتیجه"
    body: "با برگشتن شراب، تام £58.50 طلبکار است، پریا £10.50 بدهکار است و عایشه £48 بدهکار است. Side Badger دو پرداخت پیشنهاد می‌دهد، هر دو به تام. £48 عایشه همان عددی است که در زمان معلق بودن شراب داشت، چون او در آن نیست. پریا از £12 طلبکار به £10.50 بدهکار رسیده، یعنی همان نصف شراب که £22.50 است. اگر تقسیم سه‌نفره می‌ماند، عایشه £63 بدهکار می‌شد (£28 + £20 + £15). کل این اختلاف £15 می‌ارزید. هر طور دوست دارید به هم پرداخت کنید، بعد هر پرداخت را زیر **تسویه حساب** ثبت کنید. [تسویه حساب](page:feature/settle-up) بقیه‌اش را توضیح می‌دهد."
  - heading: "طوری بنویسید که مردم با شما حرف بزنند"
    body: "سؤال عایشه: «من اصلاً از آن شراب نخوردم. می‌شود تقسیم را بررسی کنیم؟» کوتاه است، هزینه را نام می‌برد و به‌جای متهم کردن می‌پرسد. چند عادت کمک می‌کند."
    items:
      - "**درباره هزینه بپرسید، نه درباره آدم.** «می‌شود تقسیم شراب را بررسی کنیم؟» گفتگو را شروع می‌کند. «چرا هزینه شراب شما را به حساب من گذاشته‌اید؟» نوع دیگرش را شروع می‌کند."
      - "**بگویید چه می‌خواهید.** «می‌شود فقط بین کسانی باشد که نوشیدند؟» به گروه چیزی می‌دهد که با آن موافق شود یا جوابش را بدهد."
      - "**در یک یا دو جمله دلیل بیاورید.** فیلد **سؤال شما** است و نمی‌شود خالی بماند."
      - "**پاسخ‌ها را یک‌جا نگه دارید.** جواب‌ها در نظرهای هزینه می‌روند، کنار عددهایی که درباره‌شان هستند."
  - heading: "در Side Badger راه بیندازیدش"
    items:
      - "**سؤال‌ها را روشن کنید.** به‌طور پیش‌فرض خاموش‌اند. یک مدیر **تنظیمات** گروه را باز می‌کند، زیر **ویژگی‌ها** در زبانه **عمومی**، **اجازه پرسش درباره هزینه‌ها** را روشن می‌کند و **ذخیره** را انتخاب می‌کند. خاموش کردنش بعداً همه سؤال‌های باز را پاک می‌کند."
      - "**یکی مطرح کنید.** هزینه را باز کنید و کنار نام خودتان در تقسیم، **یک سؤال دارم** را انتخاب کنید. دلیلتان را در **سؤال شما** بنویسید و دوباره **یک سؤال دارم** را انتخاب کنید. فقط افرادی که در هزینه هستند می‌توانند این کار را بکنند. حالا هزینه نشان **زیر سؤال** دارد."
      - "**ببینید چه چیزی معلق است.** در فهرست هزینه‌ها، **فقط زیر سؤال** هزینه‌هایی را نشان می‌دهد که سؤال باز دارند."
      - "**اگر گروه موافق است، درستش کنید.** هزینه را باز کنید، **ویرایش** را انتخاب کنید، **تقسیم بین** را تغییر دهید و **به‌روزرسانی هزینه** را انتخاب کنید. اینکه چه کسی می‌تواند ویرایش کند به مجوزهای گروه بستگی دارد."
      - "**اگر چیزی برای درست کردن نیست، ببندیدش.** کسی که پرسیده می‌تواند از دکمه بستن روی نشان **زیر سؤال** خودش، با برچسب **بستن سؤال**، استفاده کند و مدیر هم همین‌طور. هزینه با بسته شدن آخرین سؤالش به مانده‌ها برمی‌گردد."
  - heading: "وقتی همه‌چیز آن‌قدر مرتب نیست"
    items:
      - "**ویرایش، کسی را که پرسیده در هزینه نگه می‌دارد.** اگر کسی که پرسیده هنوز در هزینه است، سؤالش به نسخه ویرایش‌شده منتقل می‌شود و منتظر می‌ماند تا خودش، یا یک مدیر، آن را ببندد. درست کردن مبلغ با توافق بر سر درست شدنش یکی نیست."
      - "**شما در هزینه نبودید.** فقط افراد حاضر در یک هزینه می‌توانند آن را زیر سؤال ببرند. اگر چیزی به نظرتان درست نیست، در نظرهای آن بگویید یا از کسی که اضافه‌اش کرده بپرسید."
      - "**کسی می‌خواهد از گروه برود.** یک سؤال باز جلوی رفتن افراد آن هزینه را می‌گیرد. سؤال را ببندید، یا هزینه را طوری ویرایش کنید که دیگر در آن نباشند، تا بتوانند بروند."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "تصمیم نمی‌گیرد چه کسی حق دارد. هزینه را از مانده‌ها بیرون نگه می‌دارد و آنچه را توافق می‌کنید ذخیره می‌کند."
      - "از کسی نمی‌خواهد پیش از آنکه هزینه‌ها حساب شوند تأییدشان کند. فقط هزینه‌ای که زیر سؤال رفته معلق می‌شود."
      - "نمی‌تواند بخشی از یک هزینه را نگه دارد. زیر سؤالش ببرید و کل آن از مانده‌ها بیرون می‌رود."
      - "پول را جابه‌جا نمی‌کند. هر طور دوست دارید به هم پرداخت می‌کنید و ثبتش می‌کنید."
