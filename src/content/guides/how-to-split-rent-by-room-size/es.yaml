faq:
  heading: "Preguntas"
  items:
    - q: "¿Y si alguien tiene una habitación más grande pero con menos luz?"
      a: "La superficie es solo el punto de partida, así que el grupo puede acordar un ajuste. Quita un punto o dos a la habitación oscura, repártelos entre los demás y comprueba que los porcentajes siguen sumando 100. Side Badger guarda lo que acordéis y no lo juzga."
    - q: "¿También hay que dividir las facturas según el tamaño de la habitación?"
      a: "Normalmente no. La luz y el internet los usa todo el mundo, así que dividir a partes iguales es más sencillo, como en el ejemplo de arriba. Si un compañero está en casa todo el día, el grupo puede acordar otra cosa, como importes exactos. [Dividir gastos](page:feature/split-expenses) explica las opciones."
    - q: "¿Podemos cambiar la división más adelante?"
      a: "Sí, para los gastos nuevos. Cambia los porcentajes al copiar el alquiler y los meses anteriores se quedan como estaban. Para corregir un gasto pasado, edítalo si los permisos del grupo lo permiten, y avisa antes a la casa, porque los saldos cambian. La versión anterior se conserva."
