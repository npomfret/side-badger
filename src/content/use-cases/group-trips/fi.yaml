featuresHeading: Mihin matka nojaa
faq:
  heading: Kysymyksiä
  items:
    - q: Voiko illallisen ohittaneet jättää pois?
      a: Kyllä. Valitse, ketkä kuuluivat kuhunkin kuluun, ja vain heiltä peritään se.
    - q: Toimiiko se ilman kenttää?
      a: Ei. Side Badger tarvitsee yhteyden, joten lisää kulut, kun olet taas wifin ääressä.
    - q: Tarvitseeko jokainen asentaa jotain?
      a: Ei. Se toimii selaimessa. Lähetä kutsulinkki, niin ihmiset liittyvät puhelimillaan.
    - q: Mitä valuuttakurssia se käyttää?
      a: Nykyistä valuuttakurssia, kun syötät kulun, tai omaasi, jos sait eri kurssin. Kurssi lukitaan, kun kulu tallennetaan, joten vanhoja kuluja ei koskaan arvosteta uudelleen.
    - q: Voimmeko jäädyttää ryhmän matkan jälkeen?
      a: Kyllä. Ylläpitäjä voi lukita ryhmän, jotta luvut pysyvät paikoillaan.
    - q: Onko summilla rajaa?
      a: Kyllä. 999 999,99 kulua kohden omassa valuutassaan.
