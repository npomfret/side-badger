meta:
  title: "Dělte náklady ve 140 měnách, převedené nebo zvlášť"
  description: "Zadávejte každý výdaj v měně, ve které jste platili, vedte zůstatky zvlášť nebo převádějte podle kurzu, který vidíte a můžete změnit, a pak se vyrovnejte krátkým seznamem plateb."
h1: "Dělte náklady ve 140 měnách"
navLabel: "Více měn"
lead: "Eura, jeny a ten jeden taxík v bahtech. Side Badger přijme každý výdaj v měně, ve které jste platili, udrží zůstatky v pořádku a umí převádět, když se skupina raději vyrovná jednou. Funguje ve 140 měnách a přirozeně se hodí na [skupinové výlety](page:use-case/group-trips)."
cta:
  heading: "Přineste svá eura, přineste své jeny"
  body: "Vytvořte účet, založte skupinu a přidejte první výdaj v jakékoli měně, kterou jste zrovna měli v ruce."
  button: "Vytvořit účet zdarma"
problem:
  heading: "Zadejte to tak, jak se platilo"
  body: "Výlet se málokdy platí v jedné měně. Hotel se rezervoval doma v librách, večeře se platila v jenech a káva na letišti v čemkoli, co se na mezipřistání používalo. Přepočítávat všechno ručně, než to vůbec zadáte, je způsob, jak se tabulky opouštějí. V Side Badger zadáváte každý výdaj v měně z účtenky a každá částka se řídí pravidly své měny, takže jeny nemají desetinná místa a dináry mají tři. Naposledy používané měny jsou v seznamu první."
workflow:
  heading: "Vedte měny zvlášť, nebo převádějte průběžně"
  steps:
    - title: "Přidejte výdaj v jeho vlastní měně"
      body: "Vyberte měnu, napište částku, řekněte, kdo platil a kdo se podílel. Nic dalšího není třeba. Je to výchozí volba a uchová původní částku přesně tak, jak jste ji zadali."
      shot: S07
      shotAlt: "Formulář výdaje se zadanou částkou v jenech"
    - title: "Sledujte zůstatek pro každou měnu"
      body: "Zůstatky se vedou zvlášť pro každou měnu a každý má vlastní krátký seznam navržených plateb. Libry se vyrovnávají v librách a jeny v jenech."
      shot: S10
      shotAlt: "Obrazovka zůstatků se zjednodušenými dluhy ve dvou měnách"
    - title: "Nebo převádějte, když se skupina raději vyrovná jednou"
      body: "Při zadávání výdaje vyberte jinou měnu a Side Badger ho může převést podle aktuálního směnného kurzu, který můžete změnit na ten, který platil při výměně. Převedená částka se přidá k zůstatku v této měně. Převod je volba, kterou skupina dělá, nikdy ne něco, co se děje za vašimi zády."
options:
  heading: "Kurz, který vidíte a můžete změnit"
  items:
    - title: "Kurz je vidět"
      body: "Když převádíte, kurz a převedená částka se objeví ve formuláři, takže nikdo nemusí věřit číslu na slovo."
    - title: "Napište vlastní"
      body: "Dostali jste lepší kurz na přepážce nebo horší na letišti? Upravte kurz na ten, který platil, a převedená částka se aktualizuje."
    - title: "Originál zůstává"
      body: "Původní částka zůstává u výdaje vedle převedené, pro každého, kdo se zeptá, kolik to bylo v jenech."
    - title: "Převod zdarma"
      body: "Převod nic nestojí. Za zadání výdaje v jiné měně se neplatí žádný poplatek."
