# son los datos del brief; todas las cifras de la prosa salen de él o de la aritmética que se muestra. Las
# cifras del pago parcial (200 € ahora, 148 € pendientes) son las del propio brief, y la comprobación del cero
# de más es el ejemplo de 348 € con un cero añadido.
