faq:
  heading: Frågor
  items:
    - q: Kan jag ifrågasätta bara min andel?
      a: Nej. En fråga håller ute hela utgiften, för alla som ingår i den. Om bara delningen är fel är lösningen att redigera delningen.
    - q: Vem kan stänga en fråga?
      a: Den som frågade, eller en gruppadministratör. Om den som lade in utgiften inte är administratör kan hen inte stänga den å frågarens vägnar.
    - q: Raderar en redigering av en utgift originalet?
      a: Nej. Den tidigare versionen sparas. Vem som får redigera avgörs av gruppens behörigheter, så det är värt att säga till huset först, eftersom saldona ändras.
