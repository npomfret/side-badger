faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "బహుమతి ఖరీదు కంటే ఎక్కువ వసూలైతే?"
      a: "కచ్చితమైన మొత్తాలు ధరకు సరిపోయేలా కలవాలి, కాబట్టి అవి సరిపోయే వరకు వాటాలను తగ్గించండి. లేదా అదనపు డబ్బును పూలు లాంటి నిజమైన దానికి వాడి, ఉదాహరణలోని కార్డు, ర్యాపింగ్ లాగా దాన్ని రెండో ఖర్చుగా నమోదు చేయండి."
    - q: "గ్రూప్‌లో చేరకుండానే ఎవరైనా చందా వేయగలరా?"
      a: "లెక్కలో ఉండాలంటే కాదు. విభజనలో ఉన్న ప్రతి ఒక్కరికీ ఉచిత ఖాతా ఉండాలి, గ్రూప్‌లో ఉండాలి. నగదు మాత్రమే ఉన్నవాళ్ల కోసం, Priya దాన్ని తీసుకుని గ్రూప్ ఇంకా బాకీ ఉన్న మొత్తానికి బహుమతిని నమోదు చేయవచ్చు. ఉదాహరణకు, Sam ఆమెకు £40 నగదు ఇస్తే, ఆమె £200 నమోదు చేసి తనకు, Omarకు, Lenaకు మధ్య 60, 60, 80గా విభజిస్తుంది."
    - q: "ప్రతి వ్యక్తి ఎంత వేయాలో పోల్ నిర్ణయించగలదా?"
      a: "లేదు. పోల్ మొత్తం గ్రూప్‌కు ఒక అంకెను ఒప్పిస్తుంది, బడ్జెట్ లాంటిది. ప్రతి వ్యక్తి వాటాను మీరు మీ మధ్య ఒప్పుకుని, తర్వాత ఖర్చులో **కచ్చితమైన మొత్తాలు**గా టైప్ చేస్తారు."
