meta:
  title: Hvad Side Badger kan og ikke kan
  description: Deling, afregning og flere valutaer, plus grupper, lister og afstemninger. Hele pakken og en ærlig liste over, hvad Side Badger ikke kan.
h1: Hvad Side Badger kan
navLabel: Funktioner
lead: Alt, hvad der er i kassen, og det, der ikke er.
intro: Her er hele pakken. Regnearket har vi udeladt med vilje. Start med de tre opgaver, Side Badger klarer hver dag, og gå så resten af listen igennem, og se den korte liste over det, den ikke gør.
cta:
  heading: Kan den, hvad din gruppe har brug for?
  body: Opret en gratis konto, og prøv den først med en lille gruppe.
  button: Opret en gratis konto
cardsHeading: De tre opgaver i detaljer
sections:
  - heading: Kvitteringsscanning
    body: Tag et billede af kvitteringen, så udfylder Side Badger total, dato og sted, så du kan tjekke dem. Kvitteringsbilleder læses af Googles AI-tjeneste.
  - heading: Grupper og rettigheder
    body: Lav en gruppe til hvert hus, hver tur og hver begivenhed, med op til 50 personer i. Inviter folk med et link eller en QR-kode. I en større gruppe kan du gøre nogen til seer, som ser alt og ikke ændrer noget.
  - heading: Lister og afstemninger
    body: Hav den fælles indkøbsliste lige ved siden af indkøbsregningerne. Sæt villa-kandidaterne til afstemning, anonymt, hvis du vil.
  - heading: Alt det andet
    items:
      - "**Live opdateringer:** tilføj en udgift, og alle ser den med det samme."
      - "**Sprog:** brug Side Badger på 39 sprog. Alle i gruppen kan vælge deres eget."
      - "**Startskærm:** ingen app store nødvendig. Log ind, og føj så Side Badger til din startskærm, så åbner den som en app. Indstillinger i appen viser dig hvordan."
      - "**Feedback:** fundet en fejl? Fortæl os det inde fra appen, og se vores svar dér."
  - heading: Hvad Side Badger ikke gør
    items:
      - "**Flytte penge.** Side Badger rører aldrig dine penge. Betal hinanden, som I vil. Betalingsanmodninger er planlagt."
      - "**Gentage regninger.** Der er ingen tilbagevendende udgifter. Kopiér sidste måneds regning med to tryk."
      - "**Dele pr. vare.** Én betaler pr. udgift. Del ligeligt, efter nøjagtige beløb eller i procent."
      - "**Leveres som native app.** Den virker i din browser. Log ind, og føj den så til din startskærm."
      - "**Virke offline.** Den kræver en forbindelse."
      - "**Sende beskeder på e-mail eller sms.** Notifikationer vises i appen. Pushnotifikationer er planlagt."
      - "**Tegne diagrammer eller budgetter.** Den holder regnskab med, hvem der skylder hvem, og det er hele tricket."
      - "**Logge ind med Google eller Apple.** Tilmeld dig med e-mail. Login med Google og Apple er planlagt."
      - "**Lukke folk ind uden en konto.** Alle i gruppen skal have en gratis konto."
faq:
  heading: Spørgsmål
  items:
    - q: Kan jeg betale via Side Badger?
      a: Nej. Side Badger fører regnskabet og rører aldrig dine penge. Betal hinanden, som I vil, og registrer så betalingen.
    - q: Findes der en mobilapp?
      a: Ikke i en app store. Side Badger kører i din browser. Log ind på din telefon, og føj den så til din startskærm, så den åbner som en app. Indstillinger i appen viser dig hvordan.
    - q: Kan jeg dele pr. vare?
      a: Nej. Hver udgift har én betaler, og du deler den ligeligt, efter nøjagtige beløb eller i procent.
    - q: Virker den offline?
      a: Nej, den kræver en forbindelse.
    - q: Skal alle i gruppen have en konto?
      a: Ja. Alle i gruppen skal have en gratis konto, og det eneste, du skal bruge for at tilmelde dig, er en e-mailadresse.
