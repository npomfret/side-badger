sections:
  - heading: Money talk, next to the money
    body: "Shared money comes with chatter, doubts and plans. Side Badger keeps all three next to the numbers, so nobody has to scroll back through the chat."
    items:
      - "**Comments where they belong.** Comment on the group itself, or on any expense, list or poll, and keep the conversation next to the thing it's about."
      - "**Receipts and photos.** Keep up to three receipts on each expense, and add photos or PDFs to comments on the group, a list or a poll."
      - "**Questions, not arguments.** An admin can switch on questions, then anyone in an expense can ask about it. It stays out of the balances until it's sorted."
      - "**Lists and polls.** Keep the shared shopping list next to the shopping bills, and put the villa shortlist to a vote, anonymously if you like."
      - "**A little applause.** React to expenses, payments and comments, and celebrate a payment when it lands."
  - heading: Your group, your rules
    body: "Splitwise's help centre says it doesn't support group admins or special permissions. Side Badger has roles and permissions, for the groups that need someone keeping the numbers tidy."
    items:
      - "**Admins, members and viewers.** Make someone a viewer: they see everything and change nothing."
      - "**Two presets, or your own.** Start with Open collaboration or Managed group, or set each permission yourself: who edits and deletes expenses, edits lists, invites and lets new people in."
      - "**Approval to join.** Turn on approval and an admin lets each person in."
      - "**The group's own settings.** Limit it to the currencies you're actually using, pick its default currency and give it a header image."
      - "**Lock it when it's over.** The numbers stay put until an admin unlocks it."
  - heading: Free here, paid there
    body: "Splitwise Pro is Splitwise's paid plan, and its own Pro page sells three things that cost nothing in Side Badger."
    items:
      - "**Receipt scanning.** Splitwise Pro scans a photo of your receipt. Side Badger does it for free, with no scan credits: it fills in the total, date and place for you to check."
      - "**Currency conversion.** Splitwise Pro converts a group's expenses to your default currency when you tap Convert. Side Badger converts each expense as you enter it, at a current exchange rate or the one you actually got, and the original amount stays on the expense."
      - "**No daily limits.** Splitwise Pro sells unlimited expenses, and its help centre says free users can add up to 4 expenses each day. Side Badger has no daily limits."
  - heading: Your bank stays out of it
    body: "Side Badger doesn't connect to your bank or ask for your bank details. It keeps the record of who owes whom; you pay each other however you like, then record the payment. No bank login to hand over, so one less thing to keep safe."
  - heading: One app, in your browser and on your phone
    body: "Side Badger runs in your browser. Sign in, add it to your home screen, and it opens like an app. It's the same app either way, so a new feature is on your phone the next time you open it, with no app-store update to wait for."
  - heading: And a few party tricks
    items:
      - "**Ask your assistant.** Side Badger works with ChatGPT and Claude: ask yours to add an expense, scan a receipt or record a payment."
      - "**Everyone in their own language.** Side Badger speaks 39 languages and each person picks their own. Splitwise's home page says 7+. It handles 133 currencies too, for the trip that goes everywhere."
      - "**Help without leaving the app.** Stuck, or found a bug? Tell us from the app and read our reply right there."
  - heading: Where Splitwise still wins
    body: "We'd rather you picked the right app than found out later. If your group needs one of these, Splitwise has it and Side Badger doesn't."
    items:
      - "**App-store apps.** Side Badger lives in your browser and on your home screen, not in the app stores."
      - "**Offline mode.** Side Badger needs a connection."
      - "**Payments in the app.** In some countries Splitwise can move the money too. Side Badger only keeps the record."
      - "**Splitting by shares or by item.** Side Badger has one payer per expense, split equally, by exact amounts or by percentage. Its receipt scanning doesn't assign items to people."
      - "**Charts and default splits.** Splitwise Pro has both. Side Badger keeps the count of who owes whom, and that's the whole trick."
  - heading: Moving your group over
    body: "There is no importer, so a move means a fresh start. Settle up in Splitwise first, then create a group in Side Badger and invite everyone with a link or a QR code. Everyone in the group needs a free account, and all it takes to sign up is an email address."
table:
  heading: Side by side
  caption: "Splitwise details as of {date}, from Splitwise's own pages."
  sourceLabel: Source
  columns:
    feature: What
    other: Splitwise, per its own pages
    sideBadger: Side Badger
  rows:
    - feature: What it costs
      other: "Splitwise Pro is a monthly or yearly subscription. Yearly plans include a Trip Pass, which gives a trip group Pro features for 30 days."
      sideBadger: "Free."
      source: pro-help
    - feature: Expenses per day
      other: "Its help centre says free users can add up to 4 expenses each day. Pro has no daily limit."
      sideBadger: "No daily limits."
      source: pro-help
    - feature: Group roles and permissions
      other: "Its help centre says it doesn't support group admins or special permissions."
      sideBadger: "Admins, members and viewers. Two presets or your own permissions, approval to join, and a lock for when it's over."
      source: permissions-help
    - feature: Receipt scanning
      other: "A Pro feature. Scans a photo of a receipt, and Pro's itemisation lets you assign the items to people."
      sideBadger: "Free, with no scan credits. It fills in the total, date and place for you to check, and doesn't assign items to people."
      source: pro
    - feature: Currency conversion
      other: "A Pro feature. Tap Convert and Splitwise converts a group's expenses to your default currency at that moment's exchange rate."
      sideBadger: "Free. Convert each expense as you enter it, at a current exchange rate or the one you actually got. The original amount stays on the expense."
      source: currencies-help
    - feature: Currencies and languages
      other: "100+ currencies and 7+ languages, as its home page puts it."
      sideBadger: "133 currencies and 39 languages. Everyone in the group can pick their own language."
      source: home
    - feature: Where you use it
      other: "Apps for iPhone and Android, and the web."
      sideBadger: "In your browser. Sign in, then add it to your home screen and it opens like an app. Not in the app stores."
      source: home
    - feature: Ways to split
      other: "Equally, by exact amounts, by percentage, by shares, by adjustment or itemised."
      sideBadger: "Equally, by exact amounts or by percentage, with one payer per expense. Not by shares or by item."
      source: split-help
    - feature: Offline use
      other: "Lists an offline mode among its core features."
      sideBadger: "No. It needs a connection."
      source: home
    - feature: Payments and your bank
      other: "In some places it can send money from inside the app: Splitwise Pay in the US, Venmo for US dollar balances, PayPal, and Pay by Bank in select European countries, which connects a personal checking account."
      sideBadger: "Never touches your money and doesn't ask for your bank details. Pay each other however you like, then record the payment."
      source: payments-help
    - feature: Charts and default splits
      other: "Both are Pro features."
      sideBadger: "Neither."
      source: pro
faq:
  heading: Questions
  items:
    - q: Is Side Badger a free alternative to Splitwise?
      a: "For splitting bills in a group, yes, and it does more than the maths: comments, questions, lists, polls and group roles, with receipt scanning and currency conversion free. If you need an app-store app, offline use or payments inside the app, Splitwise does those and Side Badger doesn't."
    - q: Where do the Splitwise details come from?
      a: "Splitwise's own pages: its home page, its Pro page and its help centre. Each row of the table links to the page it came from, and the date above the table says when we read them. We check them every quarter."
    - q: Will Side Badger stay free?
      a: "Everything in Side Badger is free today. If that ever changes, we'll give you notice first. The [pricing page](page:pricing) has the details."
    - q: Does everyone in my group have to switch?
      a: "Yes. Everyone in a group needs a free Side Badger account, and they can join with a link or a QR code."
    - q: Does Side Badger have a mobile app?
      a: "Not in an app store. It runs in your browser: sign in on your phone, then add it to your home screen so it opens like an app. [How it works](page:how-it-works) shows how."
