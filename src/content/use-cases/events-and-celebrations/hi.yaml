featuresHeading: "इसमें इस्तेमाल होने वाले फीचर्स"
faq:
  heading: "सवाल"
  items:
    - q: "क्या मेहमान बिना जुड़े ग्रुप देख सकते हैं?"
      a: "नहीं। लोग लिंक या QR कोड और एक मुफ्त अकाउंट से जुड़ते हैं, इसलिए ग्रुप वे अंदर आने के बाद ही देख सकते हैं।"
    - q: "क्या Side Badger पैसे इकट्ठा कर सकता है?"
      a: "नहीं। Side Badger हिसाब रखता है और पैसे कभी नहीं भेजता। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर पेमेंट रिकॉर्ड करें। यह मुफ्त है, बिना विज्ञापन और रोज़ाना की किसी सीमा के; [कीमत](page:pricing) देखें।"
    - q: "क्या वोट गुमनाम हो सकते हैं?"
      a: "हाँ। पोल बनाते समय आप छिपा सकते हैं कि किसने किसे वोट दिया। सेटिंग्स सिर्फ पहले वोट से पहले बदली जा सकती हैं।"
    - q: "क्या लोग अलग-अलग रकम दे सकते हैं?"
      a: "हाँ। खर्च को सटीक राशि से बांटें, ताकि हर व्यक्ति का हिस्सा वही आंकड़ा हो जिस पर आपने सहमति बनाई थी, या जो शामिल नहीं थे उन्हें बाहर रखें।"
    - q: "क्या एक आयोजक हिसाब-किताब रख सकता है?"
      a: "हाँ। मैनेज्ड ग्रुप प्रीसेट इस्तेमाल करें, ताकि सिर्फ क्रिएटर और एडमिन खर्च बदलें और एडमिन नए सदस्यों को मंज़ूरी दें।"
