featuresHeading: "Funkce, které pár využívá"
faq:
  heading: "Otázky"
  items:
    - q: "Můžeme nastavit 60/40 jednou pro všechno?"
      a: "Ne. Rozdělení patří ke každému výdaji. Nastavte procenta u prvního, pak ho příště zkopírujte a změňte, co je jinak. [Dělení výdajů](page:feature/split-expenses) popisuje všechny tři způsoby dělení."
    - q: "Napojuje se to na naši banku?"
      a: "Ne. Side Badger se vašich peněz nikdy nedotkne. Platíte si, jak chcete, a pak platbu zaznamenáte, jak vysvětluje [vyrovnání](page:feature/settle-up)."
    - q: "Může naši skupinu vidět někdo jiný?"
      a: "Jen její členové a skupina páru má dva. Připojit se může každý, kdo použije platný odkaz s pozvánkou, takže ho sdílejte s jedním člověkem a dejte mu krátkou platnost."
    - q: "Co když jsme každý zaplatili část téhož účtu?"
      a: "Výdaj má jednoho plátce. Zaznamenejte dva výdaje, jeden za každého z vás, a zůstatek vyjde stejně."
    - q: "Bude to mému protějšku připomínat platbu?"
      a: "Ne. Připomínky neexistují, takže šťouchnutí zůstává na vás. Aspoň oba budete koukat na stejné číslo."
    - q: "Co se stane, až přestaneme sdílet náklady?"
      a: "Vyrovnejte zůstatek a zaznamenejte platbu, aby nikdo nic nedlužil. Pak může administrátor skupinu uzamknout, čímž čísla zůstanou, jak jsou, nebo ji uzavřít nadobro, čímž se stane nepřístupnou všem. Uzavřete ji, až ani jeden z vás nebude potřebovat historii."
