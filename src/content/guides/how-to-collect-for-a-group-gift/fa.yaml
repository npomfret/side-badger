faq:
  heading: "پرسش‌ها"
  items:
    - q: "اگر بیشتر از قیمت هدیه جمع کنیم چه؟"
      a: "مبلغ‌های دقیق باید جمعشان برابر قیمت شود، پس سهم‌ها را کم کنید تا برابر شود. یا اضافه را خرج چیزی واقعی کنید، مثل گل، و آن را مثل کارت و کاغذ کادو در مثال به‌عنوان هزینه دوم وارد کنید."
    - q: "کسی می‌تواند بدون پیوستن به گروه سهم بگذارد؟"
      a: "اگر می‌خواهید در شمارش باشد، نه. هر کس در تقسیم هست به یک حساب رایگان نیاز دارد و باید در گروه باشد. برای کسی که فقط پول نقد دارد، پریا می‌تواند آن را بگیرد و هدیه را به مبلغی که گروه هنوز بدهکار است وارد کند. مثلاً اگر سام £40 پول نقد به او داده باشد، او £200 وارد می‌کند و آن را 60، 60 و 80 بین خودش، عمر و لنا تقسیم می‌کند."
    - q: "نظرسنجی می‌تواند تعیین کند هر نفر چقدر بگذارد؟"
      a: "نه. نظرسنجی روی یک عدد برای کل گروه توافق می‌کند، مثل بودجه. سهم هر نفر را خودتان بین خودتان توافق می‌کنید، بعد به‌صورت **مبالغ دقیق** در هزینه تایپش می‌کنید."
