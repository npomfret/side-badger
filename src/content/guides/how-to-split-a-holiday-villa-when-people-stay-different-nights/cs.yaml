faq:
  heading: "Otázky k vile"
  items:
    - q: "Co když někdo zruší účast?"
      a: "Odeberte jeho noci, přepočítejte a upravte výdaj za vilu tak, aby přesné částky zase daly dohromady cenu. Předchozí verze se uchovává a úprava se zobrazí v aktivitě skupiny, takže nikdo nemění číslo potichu. Kdo smí upravovat, závisí na oprávněních skupiny."
    - q: "Má ten, kdo vilu zarezervoval, platit méně?"
      a: "To je na skupině. Rezervace je dřina a skupiny se liší v tom, jestli si zaslouží slevu. Ať se dohodnete na čemkoli, promítněte to do přesných částek a zapište to do poznámky u výdaje nebo do komentáře vedle něj, aby si nikdo nemusel pamatovat, co bylo domluveno."
    - q: "Můžeme poplatky za úklid dělit jinak?"
      a: "Ano. Poplatek zadejte jako samostatný výdaj a dejte mu vlastní rozdělení. Rovnoměrné dělení se hodí na paušální poplatek za celý dům. Přesné částky se hodí pro skupinu, která chce, aby poplatek také odpovídal nocím."
