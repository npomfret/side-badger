meta:
  title: Split costs in 140 currencies, converted or kept separate
  description: Enter each expense in the currency you paid in, keep balances separate or convert at a rate you can see and change, then settle up with a short list of payments.
h1: Split costs in 140 currencies
navLabel: Multiple currencies
lead: Euros, yen, and that one taxi in baht. Side Badger takes each expense in the currency you paid in, keeps the balances straight, and can convert when your group would rather settle once. It works in 140 currencies, and it is a natural fit for [group trips](page:use-case/group-trips).
cta:
  heading: Bring your euros, bring your yen
  body: Create an account, start a group and add the first expense in whatever currency you happened to be holding.
  button: Create a free account
problem:
  heading: Enter it as you paid it
  body: A trip is never paid for in one currency. The hotel was booked at home, dinner was in cash, and the taxi took cards only. Converting everything by hand before you can even type it in is how spreadsheets get abandoned. In Side Badger you enter each expense in the currency on the receipt, and every amount follows its currency's rules, so yen have no decimals and dinars have three. Your recently used currencies come first in the list.
workflow:
  heading: Keep currencies separate, or convert as you go
  steps:
    - title: Add the expense in its own currency
      body: Choose the currency, type the amount, say who paid and who shared it. Nothing else is needed. This is the default, and it keeps the original amount exactly as you entered it.
      shot: S07
      shotAlt: The expense form with a yen amount entered
    - title: Watch a balance for each currency
      body: Balances are kept separately per currency, and each one gets its own short list of suggested payments. Pounds are settled in pounds and yen in yen.
      shot: S10
      shotAlt: The balances screen with simplified debts in two currencies
    - title: Or convert, when the group would rather settle once
      body: Pick another currency as you enter the expense and Side Badger can convert it at a current exchange rate, which you can change to the rate you actually got. The converted amount joins the balance in that currency. Conversion is a choice the group makes, never something that happens behind your back.
options:
  heading: A rate you can see and change
  items:
    - title: The rate is shown
      body: When you convert, the rate and the converted amount appear on the form, so nobody has to take a number on trust.
    - title: Type your own
      body: Got a better rate from a cash desk, or a worse one from an airport? Edit the rate to the one you actually got and the converted amount updates.
    - title: The original stays
      body: The original amount stays on the expense, next to the converted one, for anyone who asks what it was in yen.
    - title: Free to convert
      body: Converting costs nothing. There is no fee for entering an expense in another currency.
example:
  heading: Four friends in Japan, settled two ways
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
