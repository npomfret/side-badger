meta:
  title: Hatiin ang gastos nang pantay, eksakto, o ayon sa porsyento | Side Badger
  description: Hatiin ang pinagsasaluhang gastos nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento, at huwag isama ang hindi kasali. Libre, walang ad at walang pang-araw-araw na limitasyon.
h1: Hatiin ang gastos nang pantay, eksakto, o ayon sa porsyento
navLabel: Hatiin ang gastos
lead: Hindi lahat ay 50/50. Kaya iyan ng Side Badger. Sabihin kung sino ang nagbayad, piliin ang mga nagsalo sa gastos, at hatiin ito **nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento**. Hiwalay ang tampuhan.
cta:
  heading: Hatiin nang maayos ang susunod
  body: Gumawa ng libreng account, magsimula ng grupo, at idagdag ang gastos na matagal mo nang gustong ayusin. Hindi sigurado sa susunod na mangyayari? Tingnan ang [paano ito gumagana](page:how-it-works), o ang [saklaw ng libre](page:pricing).
  button: Gumawa ng libreng account
problem:
  heading: Hindi lahat ay 50/50
  body: Sumusunod ang upa sa laki ng kuwarto. Sumusunod ang regalo sa kung sino ang nangako ng ano. Sumusunod ang hapunan sa kung sino ang nanatili para sa panghimagas. Gumagana ang paghahati sa dalawa hanggang sa unang bayarin na hindi ganoon, at saka may magbubukas ng spreadsheet. Itinatala ng Side Badger kung sino ang nagbayad, sino ang nagsalo, at kung paano hinati, kaya tama ang mga balanse nang hindi kailangang mag-long division ng kahit sino sa mesa.
workflow:
  heading: Pagdaragdag ng gastos, mula simula hanggang wakas
  steps:
    - title: Sabihin kung sino ang nagbayad at para saan
      body: Ilagay ang halaga, maikling paglalarawan, at ang taong nagbayad. Isang tao ang nagbabayad sa bawat gastos, kaya tapat ang aritmetika.
      shot: S05
      shotAlt: Ang expense form na may upa ng cottage na hinati ayon sa porsyento sa tatlong tao
    - title: Piliin ang paghahati
      body: Pumili ng pantay, eksaktong halaga, o porsyento. Dapat umabot sa 100 ang kabuuan ng mga porsyento, at dapat umabot sa kabuuan ang mga eksaktong halaga.
      shot: S06
      shotAlt: Ang expense form na may eksaktong halaga para sa bawat tao sa isang regalo
    - title: Idagdag ang kuwento
      body: Itakda ang petsa, magdagdag ng label, lugar, at tala. Pareho ang detalyeng nakikita ng lahat sa grupo, at puwede silang magkomento mismo roon.
      shot: S08
      shotAlt: Isang gastos na may mga detalye, thread ng komento, at ang orihinal na halagang inilagay
    - title: Magtanong kung may mukhang mali
      body: Kung in-on ng grupo ang mga tanong sa gastos, sinumang kasali sa isang gastos ay maaaring magtanong tungkol dito, at maipapakita ng listahan ng mga gastos ang mga may tanong lang.
      shot: S18
      shotAlt: Ang listahan ng mga gastos na may badge na Kinukuwestyon at ang filter na Kinukuwestyon lang
options:
  heading: Tatlong paraan ng paghahati
  items:
    - title: Nang pantay
      body: Ang default para sa hapunan, taxi, at anumang pantay na pinagsaluhan. Kung hindi eksaktong mahahati ang kabuuan, napupunta sa isang tao nang random ang sobrang sentimo, hindi laging iisang tao. Sa taxi sa ibaba, si Ana iyon.
    - title: Ayon sa eksaktong halaga
      body: I-type kung magkano ang utang ng bawat tao. Maganda ito para sa regalong iba-iba ang piniling presyo ng bawat isa, o sa tindahang mas marami ang laman ng cart ng isa kaysa sa pinagsamang grocery. Dapat umabot sa kabuuan ang mga halaga.
    - title: Ayon sa porsyento
      body: Bigyan ang bawat tao ng bahagi ng kabuuan. Klasiko ang upa ayon sa laki ng kuwarto, kung saan pinakamalaki ang bayad ng pinakamalaking kuwarto at walang nagkukunwari.
