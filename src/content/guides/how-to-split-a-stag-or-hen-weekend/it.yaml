faq:
  heading: "Domande"
  items:
    - q: "Il testimone o la damigella d'onore pagano di più?"
      a: "Solo se il gruppo è d'accordo. L'app non dà a nessuno un ruolo speciale nei conti. Se qualcuno copre di più, scegli **Importi esatti** o **Percentuale** sotto **Come dividere** e inserisci le quote concordate."
    - q: "E le bevande che alcuni non hanno preso?"
      a: "Aggiungi le bevande come spesa a parte e spunta solo chi le ha bevute. Se ognuno ne ha prese quantità diverse, scegli **Importi esatti** e digita la quota di ciascuno. Nessuno paga ciò che non ha preso."
    - q: "L'ospite d'onore può vedere il gruppo più tardi?"
      a: "Sì, quando la sorpresa è finita. Invita l'ospite d'onore, poi un admin può impostare il suo ruolo su **Visitatore** sotto **Sicurezza e permessi** nelle impostazioni del gruppo. Un visitatore vede tutto e non cambia nulla, quindi aspetta che non ci siano più segreti. Per unirsi serve un account gratuito."
