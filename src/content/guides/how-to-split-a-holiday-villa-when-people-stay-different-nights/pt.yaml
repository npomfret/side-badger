faq:
  heading: "Perguntas sobre a villa"
  items:
    - q: "E se alguém cancelar?"
      a: "Tira as noites dessa pessoa, refaz as contas e edita a despesa da villa para os valores exatos voltarem a somar o preço. A versão anterior fica guardada e a edição aparece na atividade do grupo, por isso ninguém muda um número em silêncio. Quem pode editar depende das permissões do grupo."
    - q: "Quem fez a reserva deve pagar menos?"
      a: "Cabe ao grupo decidir. Reservar dá trabalho, e os grupos divergem sobre se isso merece um desconto. Seja o que for que combinarem, ponham-no nos valores exatos e escrevam-no numa nota da despesa, ou num comentário junto dela, para ninguém ter de se lembrar do acordo."
    - q: "Podemos dividir a taxa de limpeza de outra forma?"
      a: "Sim. Introduz a taxa como uma despesa separada e dá-lhe a sua própria divisão. Em partes iguais serve para uma taxa fixa para a casa toda. Os valores exatos servem para um grupo que quer que a taxa também siga as noites."
