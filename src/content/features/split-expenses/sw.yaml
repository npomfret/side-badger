meta:
  title: "Gawanya gharama kwa usawa, kiasi halisi au asilimia | Side Badger"
  description: "Gawanya gharama ya pamoja kwa usawa, kwa kiasi halisi au kwa asilimia, na mwache nje asiyekuwepo. Bure, bila matangazo na bila vikomo vya kila siku."
h1: "Gawanya gharama kwa usawa, kiasi halisi au asilimia"
navLabel: "Kugawanya gharama"
lead: "Si kila kitu ni 50/50. Side Badger inalimudu hilo. Sema nani alilipa, chagua watu walioshiriki gharama, na uigawanye **kwa usawa, kwa kiasi halisi au kwa asilimia**. Vinyongo vinauzwa kando."
cta:
  heading: "Gawanya ile inayofuata ipasavyo"
  body: "Fungua akaunti ya bure, anzisha kikundi na ongeza gharama uliyokuwa unataka kuimaliza. Huna uhakika nini hufuata? Tazama [inavyofanya kazi](page:how-it-works), au angalia [kile ambacho bure inajumuisha](page:pricing)."
  button: "Fungua akaunti ya bure"
problem:
  heading: "Si kila kitu ni 50/50"
  body: "Kodi hufuata ukubwa wa chumba. Zawadi hufuata nani aliahidi nini. Chakula cha jioni hufuata nani alibaki hadi dessert. Kugawanya bili nusu kwa nusu hufaa hadi bili ya kwanza isiyokuwa hivyo, kisha mtu fulani anafungua lahajedwali. Side Badger hurekodi nani alilipa, nani alishiriki gharama na jinsi inavyogawanyika, ili salio litoke sawa bila mtu yeyote kufanya mgawanyo mrefu mezani."
workflow:
  heading: "Kuongeza gharama, kuanzia mwanzo hadi mwisho"
  steps:
    - title: "Sema nani alilipa na kwa nini"
      body: "Weka kiasi, maelezo mafupi na mtu aliyelipa. Mtu mmoja analipa kila gharama, jambo linalofanya hesabu kuwa ya haki."
      shot: S05
      shotAlt: "Fomu ya gharama yenye kodi ya nyumba ya mashambani iliyogawanywa kwa asilimia kati ya watu watatu"
    - title: "Chagua mgawanyo"
      body: "Chagua usawa, kiasi halisi au asilimia. Asilimia lazima zijumlishe 100, na kiasi halisi lazima kijumlishe jumla."
      shot: S06
      shotAlt: "Fomu ya gharama yenye kiasi halisi kilichowekwa kwa kila mtu kwa zawadi"
    - title: "Ongeza hadithi"
      body: "Weka tarehe, ongeza lebo, mahali na maelezo. Kila mtu kwenye kikundi anaona maelezo yale yale, na anaweza kutoa maoni hapo hapo."
      shot: S08
      shotAlt: "Gharama yenye maelezo yake, mjadala wa maoni na kiasi cha awali ilichowekwa"
    - title: "Uliza swali ikiwa kitu kinaonekana si sawa"
      body: "Kikundi kikiwasha maswali ya gharama, yeyote aliyejumuishwa kwenye gharama anaweza kuiuliza swali, na orodha ya gharama inaweza kuonyesha zile zilizoulizwa tu."
      shot: S18
      shotAlt: "Orodha ya gharama yenye beji ya Inahojiwa na kichujio cha Inahojiwa tu"
options:
  heading: "Njia tatu za kugawanya"
  items:
    - title: "Kwa usawa"
      body: "Chaguo-msingi kwa vyakula vya jioni, teksi na kila kitu ambacho kila mtu alishiriki sawasawa. Jumla isipogawanyika vizuri, senti inayobaki huenda kwa mtu mmoja kwa bahati nasibu, si yule yule kila mara. Kwenye teksi iliyo hapa chini, ni Ana."
    - title: "Kwa kiasi halisi"
      body: "Andika kila mtu anadaiwa kiasi gani. Nzuri kwa zawadi ambayo kila mtu alichagua bei tofauti, au duka ambapo kikapu cha mtu mmoja kilikuwa na zaidi ya mboga za pamoja. Kiasi lazima kijumlishe jumla."
    - title: "Kwa asilimia"
      body: "Mpe kila mtu sehemu ya jumla. Kodi kwa ukubwa wa chumba ndiyo ya kawaida, chumba kikubwa zaidi kikilipa sehemu kubwa zaidi na hakuna anayejifanya vinginevyo."
