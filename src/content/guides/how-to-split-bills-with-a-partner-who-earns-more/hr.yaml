meta:
  title: "Podjela računa s partnerom koji više zarađuje | Side Badger"
  description: "50/50 postaje neugodno kad jedno zarađuje daleko više. Podijeli zajedničke račune prema prihodima, s izračunima za dvoje i bez tablice."
h1: "Kako podijeliti račune s partnerom koji više zarađuje"
navLabel: "Partner koji više zarađuje"
lead: "Zbroji svoje neto plaće, izračunaj udio svake osobe u ukupnom iznosu i zaokruži na cijele postotke. Maya neto zarađuje 2.800 £, a Jon 1.700 £, pa zajedničke račune dijele 62/38. Upiši te postotke na zajednički trošak u Side Badgeru i kopiraj ga kad god dođe isti račun."
cta:
  heading: "Izračunaj jednom"
  body: "Napravi besplatan korisnički račun, osnuj grupu za vas dvoje i unesi najamninu sa svojim postocima. Najamnina sljedećeg mjeseca je kopija. Želiš li prvo kratak obilazak? Pogledaj [kako radi](page:how-it-works) ili [što je sve besplatno](page:pricing)."
sections:
  - heading: "Dvije plaće, jedan stan, jedna pristojna šutnja"
    body: "Maya i Jon žive zajedno. Maya mjesečno neto zarađuje 2.800 £, a Jon 1.700 £. Dvije godine dijelili su sve 50/50 jer je tako bilo jednostavno i nijedno od njih nije htjelo biti ono koje će to otvoriti. Onda je Jon pogledao samu najamninu. Polovica od 1.400 £ je 700 £, što je četvrtina Mayine neto plaće i 41 % njegove. Nitko nije bio nepravedan. Nitko nije izračunao. Mnogi [parovi](page:use-case/couples) na kraju stignu do toga. Uz hranu iz dostave dogovorili su da zajednički računi trebaju otprilike jednako zagristi u svaku plaću."
  - heading: "Metoda, s prikazanim računima"
    body: "Četiri koraka, jedan kalkulator i razgovor koji ste ionako trebali odraditi."
    items:
      - "**Dogovorite što se računa kao plaća.** Maya i Jon koriste neto plaću, novac koji svaki mjesec legne na račun. Zajedno to je 2.800 £ + 1.700 £ = 4.500 £."
      - "**Izračunaj svaki udio.** Mayin je 2.800 ÷ 4.500, što je 62,2 %. Jonov je 1.700 ÷ 4.500, što je 37,8 %."
      - "**Zaokruži na cijele postotke.** 62,2 % postaje 62, a 37,8 % postaje 38. Kod dvoje ljudi zaokruži jednu brojku i oduzmi je od 100 da dobiješ drugu, pa će zbroj uvijek biti 100."
      - "**Provjeri što to znači.** Na najamninu od 1.400 £ Maya plaća 868 £ (62 %), a Jon 532 £ (38 %). To je otprilike 31 % neto plaće svakog od njih. Pola-pola uzelo bi 25 % Mayine plaće i 41 % Jonove."
  - heading: "Kako izgleda mjesec"
    body: "Maya je platila najamninu od 1.400 £, a Jon ostalih 216 £. Mayin udio u mjesecu je 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, a ona je platila 1.400 £, pa joj se duguje 402,40 £. Jonov udio je 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, a on je platio 216 £, pa duguje 402,40 £. Side Badger predlaže jednu uplatu, od Jona Mayi, u iznosu od 402,40 £, a [poravnanje](page:feature/settle-up) je bilježi nakon što je izvršena. Uz podjelu 50/50 isti bi mjesec značio da Jon Mayi uplaćuje 592,00 £."
  - heading: "Postavi u Side Badgeru"
    body: "Deset minuta, većinom potrošeno na postotke."
    items:
      - "**Napravi grupu.** Na nadzornoj ploči odaberi **Kreiraj grupu** i imenuj je po stanu. Odaberi **Pozovi druge** i pošalji Jonu poveznicu ili QR kod. On se prijavi ili napravi besplatan korisnički račun i odabere ime pod kojim želi biti prikazan u ovoj grupi. Grupu vide samo članovi, pa je ova samo za vas dvoje."
      - "**Dodaj najamninu.** Odaberi **Dodaj trošak**. Upiši opis i iznos, a pod **Tko je platio?** odaberi Mayu. Oboje ostavi pod **Podijeli između**, zatim pod **Kako podijeliti** odaberi **Postotak** i upiši 62 i 38. Obrazac te upozori ako postoci zajedno ne daju 100. Odaberi **Spremi trošak**."
      - "**Dodaj ostale račune.** Energija i internet unose se na isti način, s Jonom kao platiteljem i istim brojkama 62 i 38. Hrana iz dostave zaseban je trošak, s **Kako podijeliti** ostavljenim na **Jednako**."
      - "**Kopiraj sljedeći mjesec.** Otvori prošlomjesečnu najamninu i odaberi **Kopiraj trošak**. Kopija zadržava platitelja, iznos i podjelu, a preuzima današnji datum. Promijeni iznos ako se najamnina promijenila, zatim odaberi **Kreiraj kopiju**. Račun za energiju radi na isti način."
      - "**Provjeri tko kome duguje.** Pokazuje ga odjeljak **Stanja**, koji predlaže i kratak popis uplata. Platite si kako god želite, a zatim zabilježite uplatu pod **Poravnaj**."
  - heading: "50/50, prema prihodima ili račun po račun"
    body: "Nema točnog odgovora, samo onaj s kojim oboje možete živjeti. Tri uobičajena."
    items:
      - "**Pola-pola za sve.** Najlakše za voditi, a odgovara parovima čije su plaće blizu."
      - "**Prema prihodima za sve zajedničko.** Ono što rade Maya i Jon. Jedan razgovor, jedan par postotaka."
      - "**Račun po račun.** Najamnina i računi prema prihodima, odmori i poslastice 50/50 ili kako god se dogovorite, a svaki račun dobiva pravilo koje mu odgovara."
  - heading: "Dogovorite što se računa kao zajedničko"
    body: "Svađe su obično oko popisa, a ne oko postotaka. Najamnina, energija, internet, tjedna kupnja i kauč u većini domova ulaze u zajedničko. Mayina članarina u teretani i Jonova pretplata na nogomet možda ne. Dogovorite popis jednom, zapišite ga i u grupu stavljajte samo zajedničke troškove."
  - heading: "Hrana iz dostave ostaje 50/50, namjerno"
    body: "Poslastice su sitne i neobavezne i nitko ne bi smio trebati kalkulator da naruči okruglice. U Side Badgeru je hrana iz dostave samo još jedan trošak. Jon plaća 36 £, **Kako podijeliti** ostaje na **Jednako** i oboje duguju po 18 £."
  - heading: "Kad se nečija plaća promijeni"
    body: "Povišica, novi posao ili odsustvo s posla mijenjaju račun. Nove postotke izračunaj na isti način i koristi ih od sljedećeg troška. Raniji troškovi ostaju kakvi su bili. Kopiraj prošlomjesečnu najamninu, promijeni postotke, zatim odaberi **Kreiraj kopiju**. Da ispraviš trošak koji je već unesen, uredi ga ako to dopuštaju dopuštenja grupe i prvo to reci partneru, jer se stanja mijenjaju. Prethodna verzija ostaje sačuvana. Dogovorite kad ćete ponovno računati, primjerice jednom godišnje, i poravnajte se prije prelaska da se stara podjela zatvori čistim stanjem."
  - heading: "Što Side Badger ovdje ne radi"
    items:
      - "Nikad ne pita koliko tko zarađuje i ne računa postotke. Ti upisuješ brojke o kojima ste se dogovorili."
      - "Ne može postaviti zadanu podjelu za cijelu grupu. Postoci idu na svaki trošak, pa kopiraj onaj koji ih već ima."
      - "Nema ponavljajućih računa, pa svaki put kopiraš prošlomjesečnu najamninu."
      - "Nikad ne premješta novac. Platite si kako god želite i zabilježite uplatu."
