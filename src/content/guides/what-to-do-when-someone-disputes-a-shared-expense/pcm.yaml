      amount: 45
      split:
        method: equal
        shares:
          tom: 1
          priya: 1
faq:
  heading: "Question dem"
  items:
    - q: "I fit question just my share?"
      a: "No. Question dey hold out di whole expense, for everybody wey dey inside am. If na only di split wrong, di fix na to edit di split."
    - q: "Who fit close question?"
      a: "Di person wey ask, or group admin. If di person wey add di expense no be admin, e no fit close am for di questioner."
    - q: "To edit expense dey wipe out di original?"
      a: "No. Di earlier version dey kept. Di group permissions dey decide who fit edit, so e good to tell di house first, because di balances go change."
