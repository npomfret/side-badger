meta:
  title: "Verdeel uitgaven gelijk, exact of op percentage | Side Badger"
  description: "Verdeel een gedeelde kost gelijk, op exacte bedragen of op percentage, en laat wie er niet bij was buiten beschouwing. Gratis, zonder advertenties en zonder dagelijkse limieten."
h1: "Verdeel uitgaven gelijk, exact of op percentage"
navLabel: "Uitgaven verdelen"
lead: "Niet alles is fifty-fifty. Side Badger kan dat aan. Zeg wie betaald heeft, kies de mensen die de kost deelden en verdeel ze **gelijk, op exacte bedragen of op percentage**. Wrok apart te verkrijgen."
cta:
  heading: "Verdeel de volgende goed"
  body: "Maak een gratis account aan, start een groep en voeg de uitgave toe die je al een tijdje wilde regelen. Benieuwd wat er daarna gebeurt? Zie [zo werkt het](page:how-it-works), of bekijk [wat gratis dekt](page:pricing)."
  button: "Maak een gratis account"
problem:
  heading: "Niet alles is fifty-fifty"
  body: "De huur volgt de grootte van de kamer. Een cadeau volgt wie wat beloofd had. Een diner volgt wie bleef voor het dessert. Een rekening door twee delen werkt tot de eerste rekening waarbij dat niet kan, en dan opent iemand een spreadsheet. Side Badger noteert wie betaald heeft, wie de kost deelde en hoe die verdeeld wordt, zodat de saldi kloppen zonder dat iemand aan tafel staartdelingen moet maken."
workflow:
  heading: "Een uitgave toevoegen, van begin tot eind"
  steps:
    - title: "Zeg wie betaald heeft en waarvoor"
      body: "Vul het bedrag in, een korte omschrijving en de persoon die betaald heeft. Eén persoon betaalt per uitgave, en dat houdt de rekensom eerlijk."
      shot: S05
      shotAlt: "Het uitgavenformulier met de huur van een cottage, verdeeld op percentage tussen drie personen"
    - title: "Kies de verdeling"
      body: "Kies gelijk, exacte bedragen of percentages. Percentages moeten samen 100 zijn en exacte bedragen moeten samen het totaal zijn."
      shot: S06
      shotAlt: "Het uitgavenformulier met voor elke persoon een exact bedrag ingevuld voor een cadeau"
    - title: "Voeg het verhaal toe"
      body: "Stel de datum in en voeg labels, een plaats en een notitie toe. Iedereen in de groep ziet dezelfde details en kan er meteen op reageren."
      shot: S08
      shotAlt: "Een uitgave met haar details, een reactiedraad en het oorspronkelijke bedrag zoals het ingevoerd werd"
    - title: "Stel een vraag als iets niet klopt"
      body: "Als de groep uitgavenvragen heeft ingeschakeld, kan iedereen die bij een uitgave betrokken is ze in vraag stellen, en de uitgavenlijst kan enkel de betwiste tonen."
      shot: S18
      shotAlt: "De uitgavenlijst met een badge In vraag gesteld en het filter Alleen in vraag gesteld"
options:
  heading: "Drie manieren om te verdelen"
  items:
    - title: "Gelijk"
      body: "De standaard voor diners, taxi’s en alles wat iedereen gelijk deelde. Als het totaal niet mooi deelbaar is, gaat de overschietende cent willekeurig naar één persoon, niet altijd dezelfde. In de taxi hieronder is dat Ana."
    - title: "Op exacte bedragen"
      body: "Typ wat elke persoon schuldig is. Handig voor het cadeau waarbij iedereen een andere prijs koos, of de winkel waar het karretje van één persoon meer bevatte dan de gedeelde boodschappen. De bedragen moeten samen het totaal zijn."
    - title: "Op percentage"
      body: "Geef elke persoon een deel van het totaal. Huur naar kamergrootte is de klassieker, waarbij de grootste kamer het grootste deel betaalt en niemand doet alsof het anders is."
