meta:
  title: "रूममेट्स के साथ घर के बिल बांटें"
  description: "किराया कमरे के आकार के हिसाब से बांटें, बिजली और किराना बराबर, और हर महीने देखें कि किसे किसका देना है। रूममेट्स के लिए हिसाब रखने का मुफ्त तरीका।"
h1: "रूममेट्स के साथ घर के बिल बांटें"
navLabel: "रूममेट्स"
lead: "उस रूममेट के लिए जो टॉयलेट रोल लाता है, और उन रूममेट्स के लिए जिन्हें यह होते कभी दिखता ही नहीं। Side Badger **रूममेट्स और फ्लैटमेट्स** के किराए, बिलों और सामान का एक चलता हुआ हिसाब रखता है, ताकि किसी को किसी के पीछे न पड़ना पड़े और फ्रिज फिर से बस एक फ्रिज रह सके।"
cta:
  heading: "अपने घर से शुरू करें"
  body: "अकाउंट बनाएं, घर के लिए एक ग्रुप बनाएं और सबको इनवाइट लिंक भेजें। इस महीने के बिल आज रात ही जुड़ सकते हैं।"
scenario:
  heading: "घर सेट करें"
  body: "घर के लिए एक ग्रुप बनाएं, वह नाम चुनें जो आप चाहते हैं लोग उसमें देखें, और सबको लिंक या QR कोड से बुलाएं। ग्रुप खुला हो सकता है, जहां सब जोड़ते और बदलते हैं, या मैनेज्ड, जहां नए सदस्यों को एडमिन की मंज़ूरी चाहिए और सिर्फ क्रिएटर और एडमिन खर्च बदल सकते हैं, जो उस रूममेट के लिए ठीक है जो हिसाब-किताब रखता है। जो सिर्फ संख्याएं देखना चाहता है वह व्यूअर हो सकता है, जो सब कुछ देखता है पर कुछ बदलता नहीं। नया खर्च सबको तुरंत दिखता है, इसलिए “बाद में जोड़ दूंगा” के छिपने की जगहें कम हो जाती हैं।"
sections:
  - heading: "किराया और बिल"
    body: "किराया शायद ही कभी चार से बराबर बंटता है, क्योंकि बेडरूम बराबर नहीं होते। उसे प्रतिशत से बांटें, ताकि बड़ा कमरा ज़्यादा दे और खिड़की वाली अलमारी कम। प्रतिशत का जोड़ 100 होना चाहिए। जो बिल सब इस्तेमाल करते हैं उन्हें बराबर बांटें, और जिस रूममेट का किसी खर्च में हाथ नहीं था उसे उससे बाहर रखा जा सकता है। जब बराबर बंटवारे में कुछ पैसे बच जाते हैं, तो वे किसी एक व्यक्ति को रैंडम तरीके से जाते हैं। दोहराए जाने वाले बिल नहीं हैं, इसलिए हर महीने पिछले महीने का किराया कॉपी करें, तारीख बदलें और आगे बढ़ें।"
  - heading: "साझा खरीदारी"
    body: "साझा खरीदारी की सूची को खरीदारी के बिलों वाले ग्रुप में ही रखें, और सामान ट्रॉली में आते ही उसे टिक करते जाएं। जो खरीदारी करे वह रसीद का कुल एक खर्च के रूप में जोड़े और उसे बराबर बांटे, या सिर्फ उन लोगों के बीच जो वह चीज़ खाएंगे। जो ओट मिल्क कोई और नहीं पीता उसे कौन खरीदता रहता है, यह घर का आपसी मामला ही रहेगा, पर कम से कम खर्च की सूची सही होगी। सूचियां कौन बना और बदल सकता है, यह ग्रुप की अनुमतियां तय करती हैं। किराया, बिल और खरीदारी साथ रखें तो चार लोगों के घर में महीना कुछ ऐसा बनता है: Jo £2,000 किराया देता है, जो कमरे के आकार के हिसाब से 30%, 25%, 25% और 20% में बंटता है, फिर Kwame बिजली के £120 देता है, Lena इंटरनेट के £40 और Matt किराने के £80, हर एक बराबर बंटा। Jo को £1,340 मिलने बाकी रहते हैं, और Side Badger तीन पेमेंट सुझाता है, सब Jo को।"
  - heading: "घर के खर्च बांटने के उचित तरीके"
    items:
      - "**बराबर** उन चीज़ों के लिए ठीक है जो सब लगभग बराबर इस्तेमाल करते हैं, जैसे इंटरनेट, सफाई का सामान और साझा खरीदारी। यह तेज़ है, और हिसाब पर किसी को बहस नहीं करनी पड़ती।"
      - "**कमरे के आकार से** किराए के लिए ठीक है, क्योंकि कमरे अलग होते हैं और उनके लिए लोग जितना देने को तैयार होते हैं वह भी। प्रतिशत एक बार तय करें, जब कोई रहने आए, और हर महीने उन्हें दोबारा इस्तेमाल करें।"
      - "**इस्तेमाल के हिसाब से** उन बिलों के लिए ठीक है जहां कोई एक साफ तौर पर ज़्यादा इस्तेमाल करता है, जैसे होम-ऑफिस की हीटिंग का बिल या स्ट्रीमिंग अकाउंट जो सिर्फ दो लोग देखते हैं। जिनका उसमें कोई हाथ नहीं था उन्हें बाहर रखें, या हर व्यक्ति के लिए सटीक राशि डालें।"
      - "जो भी चुनें, उसे पहले बिल से पहले तय करें, पहली बहस के बाद नहीं, और नियम कहीं ऐसी जगह लिख दें जहां पूरा घर देख सके।"
  - heading: "जब कोई घर छोड़े"
    body: "वे पहले हिसाब चुकता करते हैं। जब तक किसी का कुछ देना या पाना बाकी है वह ग्रुप नहीं छोड़ सकता, इसलिए जाने वाला पेमेंट देता है या पाता है, आप उसे रिकॉर्ड करते हैं, और फिर वह चला जाता है। बाकी रूममेट्स के लिए ग्रुप चलाते रहें और नए व्यक्ति को लिंक से बुलाएं। जब घर ही खत्म हो जाए, तो एडमिन ग्रुप को लॉक कर सकता है ताकि संख्याएं वहीं रहें, या उसे हमेशा के लिए बंद कर सकता है, जिससे वह सबके लिए पहुंच से बाहर हो जाता है, इसलिए ऐसा तभी करें जब किसी को हिस्ट्री की ज़रूरत न रहे।"
exampleAfter: 2
