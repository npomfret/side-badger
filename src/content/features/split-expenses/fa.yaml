sections:
  - heading: "فقط کسانی که بودند"
    body: "هزینه را بین همه تقسیم کنید یا فقط بین کسانی که در آن سهیم بودند. افراد را از هزینه‌هایی که در آن نبودند کنار بگذارید و مانده‌ها همین را نشان می‌دهند. هم‌خانه‌ای که تمام هفته نبود بدهکار غذای بیرون‌بر نیست، که [هم‌خانه‌ها](page:use-case/housemates) آن را عدالت ابتدایی می‌دانند."
  - heading: "جزئیاتی که بعداً از دعوا جلوگیری می‌کنند"
    items:
      - "**تاریخ** و یک زمان اختیاری را تعیین کنید. میان‌برهایی مثل امروز، دیروز، امروز صبح و دیشب کمی از تایپ کردن کم می‌کنند."
      - "تا سه **برچسب** برای دسته‌بندی هزینه‌ها اضافه کنید، مثل خواربار یا سفر."
      - "**مکان** را اضافه کنید. پیوند نقشه را بچسبانید تا نام مکان خودش پر شود."
      - "یک **یادداشت** برای داستان پشت عدد اضافه کنید، و اگر داستان لازم داشت کمی قالب‌بندی."
      - "از **نظرها** استفاده کنید تا گفتگو کنار همان هزینه‌ای بماند که درباره‌اش است، نه در رشته چتی که هیچ‌کس به عقب برنمی‌گردد."
  - heading: "کپی کنید، ویرایش کنید و ببینید چه تغییر کرد"
    body: "به‌جای تایپ دوباره، اجاره ماه قبل را کپی کنید و فقط تفاوت‌ها را عوض کنید. اگر عددی اشتباه بود، هزینه را ویرایش کنید. نسخه قبلی نگه داشته می‌شود و ویرایش در فعالیت گروه دیده می‌شود، پس هیچ‌کس بی‌سروصدا عددی را عوض نمی‌کند. اینکه هر نفر اجازه ویرایش چه چیزی را دارد به مجوزهای گروه بستگی دارد."
  - heading: "وقتی چیزی درست به نظر نمی‌رسد"
    body: "گروه می‌تواند پرسش درباره هزینه‌ها را روشن کند. هر کسی که در یک هزینه سهم دارد می‌تواند پرسشی مطرح کند و دلیلش را بگوید و هزینه از مانده‌ها بیرون می‌ماند تا وقتی که پرسنده یا یک مدیر آن را ببندد. به‌طور پیش‌فرض خاموش است و مدیر آن را برای گروه روشن می‌کند. برای [مراسم و جشن‌ها](page:use-case/events-and-celebrations) مناسب است، جایی که بیعانه‌ای که کسی یادش نیست ناگهان به همه ربط پیدا می‌کند."
limits:
  heading: "محدودیت‌ها"
  items:
    - "برای هر هزینه یک نفر پرداخت می‌کند. اگر دو نفر پرداخت کردند، دو هزینه ثبت کنید."
    - "تقسیم بر اساس قلم و تقسیم بر اساس سهم وجود ندارد. مساوی، مبلغ دقیق و درصد همان چیزی است که هست."
    - "درصدها باید جمعشان 100 شود."
    - "هر هزینه می‌تواند تا 999,999.99 به ارز خودش باشد، با ارقام اعشار معمول همان ارز."
    - "هزینه‌ها خودشان تکرار نمی‌شوند. به‌جایش هزینه ماه قبل را کپی کنید."
    - "تاریخ‌ها نمی‌توانند در آینده یا بیش از 10 سال پیش باشند."
    - "هزینه‌ای که شامل کسی باشد که از گروه رفته است فقط‌خواندنی می‌شود."
useCasesHeading: "تقسیم از این نوع کجا کمک می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "آیا دو نفر می‌توانند یک هزینه را پرداخت کنند؟"
      a: "در یک هزینه نه. دو هزینه ثبت کنید، یکی برای هر پرداخت‌کننده، و مانده‌ها همان درمی‌آیند."
    - q: "می‌توانم یک رسید را بر اساس قلم‌ها تقسیم کنم؟"
      a: "نه. تقسیم مساوی، با مبلغ دقیق یا با درصد است. برای صورت‌حسابی با اقلام متفاوت، آنچه هر نفر بدهکار است را به‌صورت مبلغ دقیق وارد کنید."
    - q: "می‌توانم یک تقسیم پیش‌فرض تعیین کنم؟"
      a: "نه. یک هزینه قبلی را کپی کنید تا تقسیمش دوباره استفاده شود و تفاوت‌ها را عوض کنید."
    - q: "آیا صورت‌حساب‌ها می‌توانند هر ماه تکرار شوند؟"
      a: "نه. به‌جایش هزینه ماه قبل را کپی کنید که چند ثانیه طول می‌کشد."
    - q: "چه کسی می‌تواند یک هزینه را ویرایش کند؟"
      a: "هر کسی که مجوزهای گروه اجازه بدهد. هر ویرایش در فعالیت گروه دیده می‌شود، پس تغییرها هیچ‌وقت بی‌صدا نیستند."
    - q: "بعد از آن بر سر مانده‌ها چه می‌آید؟"
      a: "با آمدن هزینه‌ها به‌روز می‌شوند و [تسویه حساب](page:feature/settle-up) آن‌ها را به فهرست کوتاهی از پرداخت‌ها تبدیل می‌کند. اگر هزینه‌ای به ارز دیگری است، [چند ارز](page:feature/multiple-currencies) را ببینید."
