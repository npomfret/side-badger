faq:
  heading: "Pitanja"
  items:
    - q: "Što je pravednije, veličina sobe ili primanja?"
      a: "Nijedno nije uvijek pravednije. Veličina sobe odgovara cimerima koji plaćaju prostor u kojem spavaju. Primanja odgovaraju parovima i prijateljima s vrlo različitim plaćama. Dogovorite se prije prvog dana najamnine, a ne poslije."
    - q: "Treba li račune dijeliti na isti način?"
      a: "Za cimere obično ne. Svi koriste energiju i internet, pa je jednako jednostavnije, kao u primjeru. Pri podjeli prema primanjima kalkulator računima daje iste udjele kao i najamnini."
    - q: "Mogu li koristiti kvadratne stope?"
      a: "Da. Odaberi ft² i upiši površine u kvadratnim stopama. Jedinica je samo oznaka, a udjeli ispadnu isti sve dok svi koriste istu jedinicu."
    - q: "Je li kalkulator besplatan?"
      a: "Da. Besplatan je. Bez oglasa. Bez dnevnih ograničenja. Ni korisnički račun ti ne treba."
