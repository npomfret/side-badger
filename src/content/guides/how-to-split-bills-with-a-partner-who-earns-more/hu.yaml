faq:
  heading: "Kérdések"
  items:
    - q: "Bruttó vagy nettó fizetést használjunk?"
      a: "A csoport dönt. A nettó a gyakoribb, mert ez az a pénz, amelyet ténylegesen el lehet költeni. A bruttó fizetés figyelmen kívül hagyja, hogy az adó, a nyugdíj-hozzájárulás és a hiteltörlesztés különböző fizetésekből különböző összegeket visz el. Bármelyiket választjátok, mindkettőtökre ugyanazt a mércét használjátok."
    - q: "Látja a Side Badger a jövedelmünket?"
      a: "Nem. Csak százalékokat adsz meg, fizetést soha. A százalékokat a csoport tagjai látják, egy párnál ez ti ketten vagytok."
    - q: "Beállíthatjuk egyszer a 62/38-at mindenre?"
      a: "A felosztás költségenként állítható be, nem csoportonként. Másolj le egy költséget, amelyen már rajta van a 62 és a 38, aztán változtasd meg, ami eltér. A többi lehetőségről a [költségek felosztása](page:feature/split-expenses) oldalon olvashatsz."
