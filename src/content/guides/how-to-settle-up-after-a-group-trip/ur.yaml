faq:
  heading: "سوالات"
  items:
    - q: "ادائیگی کون ریکارڈ کرے، ادا کرنے والا یا وصول کرنے والا؟"
      a: "ادائیگی ریکارڈ کرنے کے لیے اخراجات میں ترمیم کی اجازت چاہیے، اور فارم پوچھتا ہے **کس نے ادائیگی کی؟** اور **ادائیگی کس نے وصول کی؟** بعد میں اس میں ترمیم صرف وہی کر سکتا ہے جس نے اسے ریکارڈ کیا، اس لیے عموماً سب سے آسان یہ ہے کہ ادا کرنے والا فوری تصفیہ کے بٹن سے خود ریکارڈ کرے۔"
    - q: "اگر سفر دو کرنسیوں میں چلا ہو تو؟"
      a: "بیلنس ہر کرنسی کے لحاظ سے رکھے جاتے ہیں، اس لیے یورو کا قرض یورو ہی رہتا ہے اور ہر کرنسی کو ادائیگیوں کی اپنی مختصر فہرست ملتی ہے، جب تک اخراجات درج کرتے وقت تبدیل نہ کیے گئے ہوں۔ [کئی کرنسیاں](page:guide/how-to-split-a-trip-paid-in-several-currencies) دونوں طریقے دکھاتا ہے۔"
    - q: "ہمیں سفر کے دوران حساب برابر کرنا چاہیے یا آخر میں؟"
      a: "دونوں چلتے ہیں۔ ہر ریکارڈ شدہ ادائیگی بیلنس بدلتی ہے، اس لیے سفر کے بیچ کی ادائیگی بھی آخری فہرست میں شمار ہوتی ہے۔ آخر میں کرنا آسان ہے، کیونکہ [پورا سفر](page:use-case/group-trips) ایک جگہ ہوتا ہے۔"
