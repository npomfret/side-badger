meta:
  title: "ज़्यादा कमाने वाले पार्टनर के साथ बिल कैसे बांटें | Side Badger"
  description: "जब एक की कमाई कहीं ज़्यादा हो, तो 50/50 अटपटा हो जाता है। साझा बिल आमदनी के हिसाब से बांटें, दो लोगों के हिसाब के साथ, स्प्रेडशीट के बिना।"
h1: "ज़्यादा कमाने वाले पार्टनर के साथ बिल कैसे बांटें"
navLabel: "ज़्यादा कमाने वाला पार्टनर"
lead: "अपनी टेक-होम पे जोड़ें, कुल में हर व्यक्ति का हिस्सा निकालें और उसे पूरे प्रतिशत में गोल करें। Maya की टेक-होम पे £2,800 है और Jon की £1,700, इसलिए वे साझा बिल 62/38 में बांटते हैं। वे प्रतिशत Side Badger में किसी साझा खर्च पर डालें, फिर जब भी वही बिल आए उसे कॉपी करें।"
cta:
  heading: "हिसाब एक बार करें"
  body: "मुफ्त अकाउंट बनाएं, आप दोनों के लिए एक ग्रुप शुरू करें और अपने प्रतिशत के साथ किराया डालें। अगले महीने का किराया बस एक कॉपी है। पहले टूर चाहिए? [यह कैसे काम करता है](page:how-it-works) देखें, या जानें कि [मुफ्त में क्या-क्या मिलता है](page:pricing)।"
sections:
  - heading: "दो तनख्वाहें, एक फ्लैट, एक शिष्ट चुप्पी"
    body: "Maya और Jon साथ रहते हैं। Maya की महीने की टेक-होम पे £2,800 है और Jon की £1,700। दो साल तक उन्होंने सब कुछ 50/50 बांटा, क्योंकि यह सीधा था और कोई भी यह बात छेड़ने वाला नहीं बनना चाहता था। फिर Jon ने सिर्फ़ किराए को देखा। £1,400 का आधा £700 है, जो Maya की टेक-होम पे का एक-चौथाई है और Jon की टेक-होम पे का 41%। किसी ने कुछ अनुचित नहीं किया था। बस किसी ने हिसाब नहीं लगाया था। बहुत से [कपल्स](page:use-case/couples) देर-सबेर यहां पहुंचते हैं। टेकअवे खाते हुए वे इस पर राज़ी हुए कि साझा बिल दोनों की कमाई से मिलता-जुलता हिस्सा खाएं।"
  - heading: "तरीका, हिसाब के साथ"
    body: "चार कदम, एक कैलकुलेटर और एक बातचीत जो आपको वैसे भी करनी ही थी।"
    items:
      - "**तय करें कि आमदनी में क्या गिना जाए।** Maya और Jon टेक-होम पे लेते हैं, यानी वह पैसा जो हर महीने बैंक में आता है। दोनों मिलाकर £2,800 + £1,700 = £4,500 होता है।"
      - "**हर व्यक्ति का हिस्सा निकालें।** Maya का 2,800 ÷ 4,500 है, यानी 62.2%। Jon का 1,700 ÷ 4,500 है, यानी 37.8%।"
      - "**पूरे प्रतिशत में गोल करें।** 62.2% का 62 हो जाता है और 37.8% का 38। दो लोगों के साथ, एक आंकड़ा गोल करें और उसे 100 में से घटाकर दूसरा निकालें, तो जोड़ हमेशा 100 रहता है।"
      - "**देखें इसका मतलब क्या है।** £1,400 के किराए पर Maya £868 (62%) देती है और Jon £532 (38%)। यह हर व्यक्ति की टेक-होम पे का करीब 31% है। आधा-आधा बांटने पर Maya की पे का 25% और Jon की पे का 41% जाता।"
  - heading: "महीने का हिसाब पढ़ें"
    body: "Maya ने £1,400 का किराया दिया और Jon ने बाकी £216। Maya का महीने का हिस्सा £868.00 + £111.60 + £18.00 = £997.60 है, और उसने £1,400 दिए, इसलिए उसे £402.40 मिलने हैं। Jon का हिस्सा £532.00 + £68.40 + £18.00 = £618.40 है, और उसने £216 दिए, इसलिए उसे £402.40 देने हैं। Side Badger एक पेमेंट सुझाता है, Jon से Maya को, £402.40 की, और पेमेंट हो जाने पर उसे [हिसाब चुकता करना](page:feature/settle-up) में रिकॉर्ड किया जाता है। 50/50 बांटते तो इसी महीने में Jon को Maya को £592.00 देने पड़ते।"
  - heading: "Side Badger में सेट करें"
    body: "दस मिनट, जिनका ज़्यादातर हिस्सा प्रतिशत तय करने में जाता है।"
    items:
      - "**ग्रुप बनाएं।** डैशबोर्ड पर **समूह बनाएं** चुनें और उसे फ्लैट का नाम दें। **दूसरों को आमंत्रित करें** चुनें और Jon को लिंक या QR कोड भेजें। वह साइन इन करता है या मुफ्त अकाउंट बनाता है, और वह नाम चुनता है जो वह इस ग्रुप में दिखाना चाहता है। किसी ग्रुप को सिर्फ़ उसके सदस्य देख सकते हैं, इसलिए यह ग्रुप बस आप दोनों का है।"
      - "**किराया जोड़ें।** **व्यय जोड़ें** चुनें। विवरण और राशि डालें, और **किसने भुगतान किया?** में Maya को चुनें। **विभाजित करें** में दोनों लोगों को रहने दें, फिर **विभाजन कैसे करें** में **प्रतिशत** चुनें और 62 और 38 टाइप करें। अगर प्रतिशत का जोड़ 100 न हो, तो फ़ॉर्म बता देता है। **व्यय सहेजें** चुनें।"
      - "**बाकी बिल जोड़ें।** बिजली और ब्रॉडबैंड भी इसी तरह जाते हैं, पेमेंट करने वाले के रूप में Jon और वही 62 और 38 के साथ। टेकअवे अपना अलग खर्च है, जिसमें **विभाजन कैसे करें** को **समान रूप से** पर रहने दें।"
      - "**अगले महीने कॉपी करें।** पिछले महीने का किराया खोलें और **व्यय कॉपी करें** चुनें। कॉपी में पेमेंट करने वाला, राशि और बंटवारा वही रहते हैं, और तारीख आज की हो जाती है। किराया बदला हो तो राशि बदलें, फिर **कॉपी बनाएं** चुनें। बिजली का बिल भी इसी तरह चलता है।"
      - "**देखें किसे किसका देना है।** **शेष** सेक्शन यह दिखाता है और पेमेंट की एक छोटी सूची सुझाता है। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर **हिसाब बराबर करें** में पेमेंट रिकॉर्ड करें।"
  - heading: "50/50, आमदनी के हिसाब से, या बिल-दर-बिल"
    body: "कोई एक सही जवाब नहीं है, बस वही जिसके साथ आप दोनों जी सकें। तीन आम तरीके।"
    items:
      - "**हर चीज़ में आधा-आधा।** इसे निभाना सबसे आसान है, और यह उन कपल्स के लिए ठीक है जिनकी कमाई करीब-करीब बराबर है।"
      - "**साझा हर चीज़ आमदनी के हिसाब से।** Maya और Jon यही करते हैं। एक बातचीत, प्रतिशतों की एक जोड़ी।"
      - "**बिल-दर-बिल।** किराया और बिल आमदनी के हिसाब से, छुट्टियां और ट्रीट 50/50 या जो भी आप तय करें, और हर बिल को वही नियम जो उसके लिए ठीक बैठे।"
  - heading: "तय करें कि साझा क्या है"
    body: "बहस अक्सर सूची पर होती है, प्रतिशत पर नहीं। ज़्यादातर घरों में किराया, बिजली, ब्रॉडबैंड, हफ्ते की खरीदारी और सोफा साझा गिने जाते हैं। Maya की जिम मेंबरशिप और Jon का फुटबॉल सब्सक्रिप्शन शायद न गिने जाएं। सूची एक बार तय करें, उसे लिख लें और ग्रुप में सिर्फ़ साझा खर्च डालें।"
  - heading: "टेकअवे जानबूझकर 50/50 रहता है"
    body: "ट्रीट छोटे और वैकल्पिक होते हैं, और डंपलिंग मंगाने के लिए किसी को कैलकुलेटर नहीं चाहिए। Side Badger में टेकअवे बस एक और खर्च है। Jon £36 देता है, **विभाजन कैसे करें** **समान रूप से** पर रहता है और दोनों के £18 बनते हैं।"
  - heading: "जब किसी की कमाई बदले"
    body: "तनख्वाह में बढ़ोतरी, नई नौकरी या काम से छुट्टी हिसाब बदल देती है। नए प्रतिशत उसी तरह निकालें और अगले खर्च से इस्तेमाल करें। पुराने खर्च जैसे थे वैसे रहते हैं। पिछले महीने का किराया कॉपी करें, प्रतिशत बदलें, फिर **कॉपी बनाएं** चुनें। जो खर्च पहले से दर्ज है उसे सुधारने के लिए, अगर ग्रुप की अनुमतियां इजाज़त दें तो उसे एडिट करें, और पहले अपने पार्टनर को बता दें, क्योंकि बैलेंस बदल जाते हैं। पहले वाला वर्शन सुरक्षित रहता है। तय करें कि आप दोबारा हिसाब कब लगाएंगे, जैसे साल में एक बार, और बदलाव से पहले हिसाब चुकता कर लें ताकि पुराना बंटवारा साफ गिनती के साथ बंद हो।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह कभी नहीं पूछता कि कोई कितना कमाता है, और प्रतिशत भी नहीं निकालता। आप वे आंकड़े टाइप करते हैं जिन पर आप सहमत हुए हैं।"
      - "यह पूरे ग्रुप के लिए डिफ़ॉल्ट बंटवारा तय नहीं कर सकता। प्रतिशत हर खर्च पर जाते हैं, इसलिए ऐसा खर्च कॉपी करें जिसमें वे पहले से हों।"
      - "इसमें दोहराए जाने वाले बिल नहीं हैं, इसलिए हर बार पिछले महीने का किराया कॉपी करें।"
      - "यह कभी पैसे नहीं भेजता। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं और उसे रिकॉर्ड करते हैं।"
exampleAfter: 2
