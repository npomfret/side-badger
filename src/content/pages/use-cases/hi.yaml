meta:
  title: "रूममेट्स, ट्रिप और पार्टी के लिए Side Badger"
  description: "रूममेट्स के साथ, ग्रुप ट्रिप पर, और पार्टी, शादी और ग्रुप गिफ्ट के लिए खर्च बांटें। देखें कि हर तरह के ग्रुप के लिए Side Badger क्या करता है।"
h1: "आपके तरह के ग्रुप के लिए Side Badger"
navLabel: "इस्तेमाल के मौके"
lead: "रूममेट्स, छुट्टियां, बैचलर पार्टी। अपनी अफरा-तफरी चुनें, फिर देखें कि आप जैसा ग्रुप हिसाब कैसे रखता है।"
intro: "हर ग्रुप खर्च थोड़े अलग तरीके से बांटता है। ये पेज पहले खर्च से लेकर आखिरी रिकॉर्ड किए गए पेमेंट तक एक **असली-सा परिदृश्य** चलाते हैं, पूरे हिसाब के साथ, ताकि आप देख सकें कि आपके अपने ग्रुप का क्या बनेगा।"
cta:
  heading: "अपनी तरह का ग्रुप मिला?"
  body: "अकाउंट बनाएं, ग्रुप शुरू करें और पहला खर्च जोड़ें। इसमें कुछ ही मिनट लगते हैं।"
  button: "मुफ्त अकाउंट बनाएं"
cardsHeading: "अपनी स्थिति के सबसे करीब वाली चुनें"
sections:
  - heading: "ग्रुप ट्रिप"
    body: "पाउंड में फ्लाइट, यूरो में विला, और एक डिनर जो सिर्फ तीन लोगों ने खाया। ग्रुप को पाउंड में बदलने के लिए सेट करें, तो लिस्बन में चार दोस्तों के तीन पेमेंट में हिसाब हो जाता है, जबकि करेंसी अलग रखने पर छह पेमेंट लगते हैं। [ग्रुप ट्रिप का खर्च बांटें](page:use-case/group-trips)।"
  - heading: "रूममेट्स"
    body: "एक व्यक्ति मकान-मालिक को देता है, दूसरे को बिजली का बिल याद रहता है, और टॉयलेट रोल किसने खरीदा इस पर कोई सहमत नहीं। किराया कमरे के आकार के हिसाब से बंटे और बाकी बिल बराबर, तो चार रूममेट्स महीने के अंत में तीन पेमेंट पर पहुंचते हैं, सब उसे जिसने किराया दिया। [रूममेट्स के साथ घर के बिल बांटें](page:use-case/housemates)।"
  - heading: "पार्टी, शादी और ग्रुप गिफ्ट"
    body: "छह लोग गिफ्ट पर वोट करते हैं, एक उसे खरीदता है, और सब एक जितना नहीं देते। सटीक राशि से बंटा £150 का गिफ्ट खरीदने वाले को पांच पेमेंट दिलाता है, कुल £120। [इवेंट का खर्च बांटें](page:use-case/events-and-celebrations)।"
  - heading: "कपल्स"
    body: "बोरिंग खर्च साझा करें, डेट नाइट को तिमाही हिसाब-किताब की मीटिंग बनाए बिना। किराया 60/40 में बंटा और किराना बराबर, तो आप दोनों के बीच बस एक पेमेंट बचता है।"
  - heading: "पहले देखें यह कैसे काम करता है"
    body: "ऊपर के हर उदाहरण में वही कदम हैं, ग्रुप बनाने से लेकर पेमेंट रिकॉर्ड करने तक। [यह कैसे काम करता है](page:how-it-works) उन्हें समझाता है, और [कीमत](page:pricing) बताता है कि इसकी कीमत क्या है, यानी कुछ नहीं, कोई विज्ञापन नहीं और रोज़ाना की कोई सीमा नहीं।"
faq:
  heading: "सवाल"
  items:
    - q: "क्या ग्रुप में सबको अकाउंट चाहिए?"
      a: "हाँ। लोग लिंक या QR कोड और एक मुफ्त अकाउंट से जुड़ते हैं।"
    - q: "क्या Side Badger पैसे इकट्ठा कर सकता है?"
      a: "नहीं। आप जैसे चाहें पेमेंट करें, फिर पेमेंट रिकॉर्ड करें ताकि बैलेंस सही रहें।"
    - q: "क्या मुझे एक ही तरह का ग्रुप चुनना होगा?"
      a: "नहीं। ये इस्तेमाल के मौके उदाहरण हैं, सेटिंग नहीं। हर ग्रुप में वही फीचर्स हैं, इसलिए जो मेल खाए वही मिलाकर इस्तेमाल करें।"
