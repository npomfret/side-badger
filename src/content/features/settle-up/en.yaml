exampleAfter: 0
sections:
  - heading: Record a payment
    body: When someone pays, record it against the right person. The quick-settle buttons fill in the amount from your suggested payments, and you can add a note such as "bank transfer" (up to 500 characters). Pay only part of what you owe and the rest stays on the balance. If you enter too little or too much, Side Badger warns you before you save. Recording a payment needs permission to edit expenses, and the date cannot be in the future.
  - heading: Paid in a different currency?
    body: Balances stay in the currency they were paid in, so a euro debt stays a euro debt. Owe euros, pay in pounds? Convert the payment as you enter it, at a current exchange rate or at the rate you actually got. The rate is fixed when the payment is saved. [Multiple currencies](page:feature/multiple-currencies) covers how conversion works, and [group trips](page:use-case/group-trips) shows it in use.
  - heading: History you can check
    body: Every recorded payment stays in the group history with its date, amount and note. Only the person who recorded a payment can edit it, and they or a group admin can delete it. A payment involving someone who has left the group is locked. For a worked housemate scenario, see [housemates](page:use-case/housemates).
limits:
  heading: What Side Badger doesn't do
  items:
    - Side Badger does not move money, send payment links or send payment requests. A payment in the app is a record of a payment made elsewhere.
    - The suggested payments come from a simple matching method, applied per currency. It always suggests fewer payments than there are people with a balance in that currency (four people, three payments at most), but it does not always find the smallest possible number.
    - You cannot switch the suggestions off. **Show all** lists every suggested payment in the group, not just yours.
    - Currencies are never netted against each other unless the expenses were converted when they were entered.
    - There are no reminders, so chasing a payment is still up to you.
useCasesHeading: Where settling up matters
faq:
  heading: Questions
  items:
    - q: Does Side Badger send the money?
      a: No. Pay each other however you like, then record the payment in Side Badger so the balance updates.
    - q: Can I turn the suggested payments off?
      a: No. Simplification stays on, and **Show all** lists every suggested payment in the group, not just the ones that involve you.
    - q: Why are euros and pounds kept separate?
      a: Balances stay in the currency you paid in unless you convert when you enter an expense or payment. Debts in different currencies are never netted against each other.
    - q: What if someone pays only part of what they owe?
      a: Record the part they paid. The rest stays on the balance until it is paid.
    - q: Is this always the smallest possible number of payments?
      a: Not guaranteed. It always suggests fewer payments than there are people with a balance in that currency, so for four people it never suggests more than three. In the housemates example, that is two payments, where paying each person back directly took six.
