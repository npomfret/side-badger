meta:
  title: "수입이 더 많은 파트너와 생활비 나누는 방법 | 사이드 배저"
  description: "50/50은 한 사람이 훨씬 더 벌면 어색해집니다. 공동 비용을 수입 비율로 나누세요. 두 사람의 계산식을 보여 드리고, 스프레드시트는 필요 없습니다."
h1: "수입이 더 많은 파트너와 생활비 나누는 방법"
navLabel: "수입이 더 많은 파트너"
lead: "실수령액을 합산하고, 전체에서 각자가 차지하는 몫을 구해 정수 퍼센트로 반올림하세요. Maya의 월 실수령액은 £2,800, Jon의 월 실수령액은 £1,700입니다. 그래서 두 사람은 공동 비용을 62/38로 나눕니다. 사이드 배저의 공동 지출에 그 비율을 입력하고, 같은 청구서가 돌아올 때마다 복사하세요."
cta:
  heading: "계산은 한 번만"
  body: "무료 계정을 만들고, 두 사람을 위한 그룹을 만들어 합의한 비율로 월세를 넣으세요. 다음 달 월세는 복사하면 끝입니다. 먼저 둘러보고 싶다면 [사용 방법](page:how-it-works)이나 [무료로 제공되는 것](page:pricing)을 보세요."
sections:
  - heading: "월급 둘, 집 하나, 정중한 침묵 하나"
    body: "Maya와 Jon은 함께 삽니다. Maya의 월 실수령액은 £2,800이고 Jon은 £1,700입니다. 두 사람은 2년 동안 모든 것을 50/50으로 나눴어요. 간단했고, 아무도 먼저 말을 꺼내고 싶지 않았으니까요. 그러다 Jon이 월세만 따로 들여다봤습니다. £1,400의 절반은 £700이고, 이는 Maya 실수령액의 4분의 1이며 자기 실수령액의 41%였어요. 불공평하게 군 사람은 없었습니다. 다만 아무도 계산을 해 보지 않았을 뿐이에요. 많은 [커플](page:use-case/couples)이 결국 여기에 이릅니다. 두 사람은 배달 음식을 먹으며, 공동 비용이 각자의 월급에서 비슷한 비중을 차지해야 한다는 데 합의했어요."
  - heading: "계산 방법, 식을 전부 보여 드립니다"
    body: "네 단계, 계산기 하나, 어차피 한 번은 나눠야 했을 대화 하나면 됩니다."
    items:
      - "**무엇을 수입으로 칠지 합의하세요.** Maya와 Jon은 실수령액, 즉 매달 은행 계좌에 들어오는 돈을 씁니다. 합치면 £2,800 + £1,700 = £4,500입니다."
      - "**각자의 몫을 구하세요.** Maya는 2,800 ÷ 4,500으로 62.2%입니다. Jon은 1,700 ÷ 4,500으로 37.8%입니다."
      - "**정수 퍼센트로 반올림하세요.** 62.2%는 62, 37.8%는 38이 됩니다. 두 사람이라면 한쪽만 반올림하고 100에서 빼서 다른 쪽을 구하면 합이 항상 100이 됩니다."
      - "**그 의미를 확인하세요.** £1,400 월세에서 Maya가 내는 돈은 £868(62%), Jon이 내는 돈은 £532(38%)입니다. 각자 실수령액의 약 31%예요. 반반이었다면 Maya는 실수령액의 25%, Jon은 41%를 냈을 것입니다."
  - heading: "이번 달 살펴보기"
    body: "Maya가 월세 £1,400를 냈고, Jon이 나머지 £216를 냈습니다. Maya의 이번 달 몫은 £868.00 + £111.60 + £18.00 = £997.60이고, £1,400를 냈으니 £402.40를 받아야 합니다. Jon의 몫은 £532.00 + £68.40 + £18.00 = £618.40이고, £216를 냈으니 £402.40를 내야 합니다. 사이드 배저는 Jon이 Maya에게 £402.40를 보내는 결제 한 건을 제안하고, 결제가 이루어지면 [정산하기](page:feature/settle-up)로 그것을 기록합니다. 50/50으로 나눴다면 같은 달에 Jon이 Maya에게 내야 할 돈은 £592.00였을 겁니다."
  - heading: "사이드 배저에서 설정하기"
    body: "10분이면 되는데, 대부분은 비율을 정하는 데 쓰입니다."
    items:
      - "**그룹 만들기.** 대시보드에서 **그룹 만들기**를 누르고 집 이름으로 그룹 이름을 붙이세요. **다른 사람 초대**를 눌러 Jon에게 링크나 QR 코드를 보냅니다. Jon은 로그인하거나 무료 계정을 만들고, 이 그룹에서 보일 이름을 고릅니다. 그룹은 멤버만 볼 수 있으므로, 이 그룹은 두 사람만의 공간입니다."
      - "**월세 추가하기.** **비용 추가**를 누르세요. 설명과 금액을 입력하고, **누가 지불했나요?**에서 Maya를 고릅니다. **분할 대상**에는 두 사람을 모두 그대로 두고, **분할 방법**에서 **백분율**을 고른 다음 62와 38을 입력하세요. 합이 100이 아니면 양식이 알려 줍니다. **비용 저장**을 누르세요."
      - "**나머지 비용 추가하기.** 전기·가스 요금과 인터넷도 같은 방법으로 넣되, Jon을 결제자로 하고 같은 62와 38을 쓰세요. 배달 음식은 별도 지출이고, **분할 방법**은 **균등**으로 둡니다."
      - "**다음 달에 복사하기.** 지난달 월세를 열고 **비용 복사**를 누르세요. 복사본은 결제자, 금액, 분할 방식을 그대로 가져오고 날짜는 오늘로 정해집니다. 월세가 바뀌었다면 금액을 바꾸고 **복사본 만들기**를 누르세요. 전기·가스 요금도 같은 방식으로 하면 됩니다."
      - "**누가 누구에게 빚졌는지 확인하기.** **잔액** 섹션에서 볼 수 있고, 짧은 결제 목록도 제안해 줍니다. 원하는 방법으로 서로 지불한 다음, **정산하기**에서 결제를 기록하세요."
  - heading: "50/50, 수입 비례, 아니면 청구서마다"
    body: "정답은 없습니다. 두 사람이 모두 받아들일 수 있는 답이 있을 뿐이에요. 흔한 세 가지를 소개합니다."
    items:
      - "**모든 것을 반반.** 가장 유지하기 쉽고, 수입이 비슷한 커플에게 맞습니다."
      - "**공동 비용 전부를 수입 비례로.** Maya와 Jon이 하는 방식입니다. 대화 한 번, 비율 한 쌍으로 끝납니다."
      - "**청구서마다.** 월세와 공과금은 수입 비례로, 휴가와 간식은 반반이나 합의한 다른 방식으로 나누세요. 청구서마다 맞는 규칙을 적용합니다."
  - heading: "무엇이 공동 비용인지 합의하세요"
    body: "다툼은 보통 비율이 아니라 목록에서 생깁니다. 월세, 전기·가스 요금, 인터넷, 주간 장보기, 소파는 대부분의 집에서 공동 비용으로 칩니다. Maya의 헬스장 회원권과 Jon의 축구 구독은 아닐 수 있어요. 목록을 한 번 합의하고, 적어 두고, 공동 비용만 그룹에 넣으세요."
  - heading: "배달 음식은 일부러 반반으로"
    body: "간식은 소소하고 선택 사항이라, 만두를 주문하는 데 계산기가 필요해서는 안 됩니다. 사이드 배저에서 배달 음식은 그냥 또 하나의 지출입니다. Jon이 £36를 결제하고 **분할 방법**을 **균등**으로 두면, 두 사람 모두 £18씩 내야 합니다."
  - heading: "누군가의 수입이 바뀔 때"
    body: "연봉 인상, 이직, 휴직은 계산을 바꿉니다. 같은 방법으로 새 비율을 구하고 다음 지출부터 쓰세요. 이전 지출은 그대로 남습니다. 지난달 월세를 복사하고, 비율을 바꾸고, **복사본 만들기**를 누르세요. 이미 들어간 지출을 바로잡으려면 그룹의 권한이 허용하는 경우 수정하되, 잔액이 바뀌므로 먼저 파트너에게 알리세요. 이전 버전은 보관됩니다. 언제 다시 계산할지는 예를 들어 1년에 한 번으로 합의하고, 바꾸기 전에 정산해서 예전 비율이 깔끔한 계산으로 마무리되게 하세요."
  - heading: "이 경우 사이드 배저가 하지 않는 일"
    items:
      - "수입이 얼마인지 묻지 않고, 비율도 계산해 주지 않습니다. 합의한 숫자를 직접 입력하세요."
      - "그룹 전체의 기본 분할을 정할 수 없습니다. 비율은 지출마다 들어가므로, 이미 비율이 들어 있는 지출을 복사하세요."
      - "반복 청구서가 없으므로 매번 지난달 월세를 복사합니다."
      - "돈을 옮기지 않습니다. 원하는 방법으로 서로 지불하고 기록하세요."
exampleAfter: 2
example:
  heading: "Maya와 Jon의 집에서의 한 달"
  currency: GBP
  people:
    - id: maya
      name: Maya
    - id: jon
      name: Jon
  expenses:
    - label: "월세"
      payer: maya
      amount: 1400
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "전기·가스 요금과 인터넷"
      payer: jon
      amount: 180
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "배달 음식"
      payer: jon
      amount: 36
      split:
        method: equal
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "세전 소득과 실수령액 중 무엇을 써야 하나요?"
      a: "그룹이 정합니다. 실수령액은 실제로 쓸 수 있는 돈이라 흔히 쓰입니다. 세전 소득은 세금, 연금 납입액, 대출 상환금이 월급마다 서로 다른 금액을 가져간다는 점을 무시합니다. 무엇을 고르든 두 사람에게 같은 기준을 쓰세요."
    - q: "사이드 배저가 우리 수입을 보나요?"
      a: "아니요. 비율만 입력하고 월급은 절대 입력하지 않습니다. 비율은 그룹의 멤버에게 보이는데, 커플이라면 두 사람이에요."
    - q: "62/38을 한 번만 정해서 모든 지출에 쓸 수 있나요?"
      a: "분할은 그룹이 아니라 지출마다 정합니다. 이미 62와 38이 들어 있는 지출을 복사하고 달라진 부분만 바꾸세요. 다른 옵션은 [지출 나누기](page:feature/split-expenses)에서 설명합니다."
