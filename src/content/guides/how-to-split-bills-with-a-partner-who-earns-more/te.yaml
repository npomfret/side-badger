meta:
  title: "ఎక్కువ సంపాదించే భాగస్వామితో బిల్లులు ఎలా పంచాలి | Side Badger"
  description: "ఇద్దరిలో ఒకరు చాలా ఎక్కువ సంపాదిస్తే 50/50 ఇబ్బందిగా ఉంటుంది. ఉమ్మడి బిల్లులను ఆదాయం ప్రకారం పంచండి, ఇద్దరికి లెక్కలతో, స్ప్రెడ్‌షీట్ లేకుండా."
h1: "ఎక్కువ సంపాదించే భాగస్వామితో బిల్లులు ఎలా పంచాలి"
navLabel: "ఎక్కువ సంపాదించే భాగస్వామి"
lead: "ఇద్దరి చేతికి వచ్చే జీతం కలపండి, మొత్తంలో ప్రతి ఒక్కరి వాటా లెక్క వేసి, పూర్తి శాతాలకు మార్చండి. Maya చేతికి £2,800, Jon చేతికి £1,700 వస్తాయి, కాబట్టి వాళ్లు ఉమ్మడి బిల్లులను 62/38గా పంచుకుంటారు. ఆ శాతాలను Side Badgerలో ఉమ్మడి ఖర్చుపై నమోదు చేయండి, అదే బిల్లు మళ్లీ వచ్చినప్పుడల్లా కాపీ చేయండి."
cta:
  heading: లెక్క ఒక్కసారే వేయండి
  body: "ఉచిత ఖాతా తెరిచి, ఇద్దరికీ ఒక గ్రూప్ చేసి, మీ శాతాలతో అద్దెను నమోదు చేయండి. వచ్చే నెల అద్దె ఒక కాపీ మాత్రమే. ముందు పరిచయం కావాలా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) చూడండి, లేదా [ఉచితంలో ఏమేం ఉన్నాయో](page:pricing) చూడండి."
sections:
  - heading: "రెండు జీతాలు, ఒక ఫ్లాట్, ఒక మర్యాదైన మౌనం"
    body: "Maya, Jon కలిసి ఉంటారు. Maya నెలకు £2,800 చేతికి తీసుకుంటుంది, Jon £1,700. రెండేళ్లు వాళ్లు అన్నిటినీ 50/50గా పంచారు, ఎందుకంటే అది సులువు, ఎవరూ ఆ మాట తీయాలనుకోలేదు. తర్వాత Jon అద్దెను విడిగా చూశాడు. £1,400లో సగం £700, అది Maya చేతికి వచ్చే జీతంలో నాలుగో వంతు, అతనిది అయితే 41%. ఎవరూ అన్యాయంగా ప్రవర్తించలేదు. ఎవరూ లెక్క వేయలేదు అంతే. చాలా [జంటలు](page:use-case/couples) చివరికి ఇక్కడికి వస్తాయి. టేకవే తింటూ వాళ్లు ఒప్పుకున్నారు, ఉమ్మడి బిల్లులు ఇద్దరి జీతాల నుంచి దాదాపు ఒకే మోతాదులో కొరకాలని."
  - heading: "పద్ధతి, లెక్కలతో సహా"
    body: "నాలుగు దశలు, ఒక కాలిక్యులేటర్, ఎలాగూ చేయాల్సిన ఒక సంభాషణ."
    items:
      - "**ఏది జీతంగా లెక్కో ఒప్పుకోండి.** Maya, Jon చేతికి వచ్చే జీతాన్ని వాడతారు, అంటే ప్రతి నెలా బ్యాంక్‌లో పడే డబ్బు. రెండూ కలిపితే £2,800 + £1,700 = £4,500."
      - "**ప్రతి ఒక్కరి వాటా లెక్క వేయండి.** Maya వాటా 2,800 ÷ 4,500, అంటే 62.2%. Jon వాటా 1,700 ÷ 4,500, అంటే 37.8%."
      - "**పూర్తి శాతాలకు మార్చండి.** 62.2% 62 అవుతుంది, 37.8% 38 అవుతుంది. ఇద్దరే కాబట్టి, ఒక సంఖ్యను రౌండ్ చేసి 100 నుంచి తీసేస్తే రెండో సంఖ్య వస్తుంది, అవి ఎప్పుడూ 100 అవుతాయి."
      - "**దాని అర్థం సరిచూడండి.** £1,400 అద్దెలో Maya £868 (62%), Jon £532 (38%) చెల్లిస్తారు. అది ఒక్కొక్కరి చేతికి వచ్చే జీతంలో దాదాపు 31%. చెరి సగం అయితే Mayaకు 25%, Jonకు 41% అయ్యేది."
  - heading: "నెలను చదవడం"
    body: "Maya £1,400 అద్దె చెల్లించింది, మిగతా £216 Jon చెల్లించాడు. నెలలో Maya వాటా £868.00 + £111.60 + £18.00 = £997.60, ఆమె £1,400 చెల్లించింది, కాబట్టి ఆమెకు £402.40 రావాలి. Jon వాటా £532.00 + £68.40 + £18.00 = £618.40, అతను £216 చెల్లించాడు, కాబట్టి £402.40 ఇవ్వాలి. Side Badger ఒక పేమెంట్‌ను సూచిస్తుంది, Jon నుంచి Mayaకు £402.40, అది జరిగాక [లెక్క తేల్చడం](page:feature/settle-up) దాన్ని రికార్డ్ చేస్తుంది. 50/50 అయి ఉంటే అదే నెలలో Jon Mayaకు £592.00 ఇవ్వాల్సి వచ్చేది."
  - heading: "Side Badgerలో సెట్ చేయడం"
    body: "పది నిమిషాలు, అందులో ఎక్కువ శాతాల గురించే."
    items:
      - "**గ్రూప్ చేయండి.** డాష్‌బోర్డ్‌లో **సమూహాన్ని సృష్టించు** ఎంచుకుని ఫ్లాట్ పేరు పెట్టండి. **ఇతరులను ఆహ్వానించండి** ఎంచుకుని Jonకు లింక్ లేదా QR కోడ్ పంపండి. అతను సైన్ ఇన్ అవుతాడు లేదా ఉచిత ఖాతా తెరుస్తాడు, ఈ గ్రూప్‌లో తనకు కనిపించాల్సిన పేరును ఎంచుకుంటాడు. గ్రూప్‌ను సభ్యులు మాత్రమే చూడగలరు, కాబట్టి ఇది మీ ఇద్దరికే."
      - "**అద్దెను జోడించండి.** **ఖర్చును జోడించు** ఎంచుకోండి. వివరణ, మొత్తం నింపి, **ఎవరు చెల్లించారు?** కింద Mayaను ఎంచుకోండి. **ఎవరి మధ్య విభజించాలి** కింద ఇద్దరినీ ఉంచి, **ఎలా విభజించాలి** కింద **శాతం** ఎంచుకుని 62, 38 టైప్ చేయండి. శాతాల మొత్తం 100 కాకపోతే ఫారం చూపిస్తుంది. **ఖర్చును సేవ్ చేయి** ఎంచుకోండి."
      - "**మిగతా బిల్లులను జోడించండి.** కరెంటు, బ్రాడ్‌బ్యాండ్ అదే విధంగా వెళ్తాయి, Jon చెల్లింపుదారుగా, అవే 62, 38తో. టేకవే దాని సొంత ఖర్చు, **ఎలా విభజించాలి**ను **సమానం**గా వదిలేయండి."
      - "**వచ్చే నెల కాపీ చేయండి.** గత నెల అద్దెను తెరిచి **ఖర్చును కాపీ చేయి** ఎంచుకోండి. కాపీలో చెల్లించినవారు, మొత్తం, పంపకం అలాగే ఉంటాయి, తేదీ ఈ రోజుది అవుతుంది. అద్దె మారితే మొత్తం మార్చి, **కాపీని సృష్టించు** ఎంచుకోండి. కరెంటు బిల్లు కూడా ఇలాగే."
      - "**ఎవరు ఎవరికి బాకీనో చూడండి.** **బ్యాలెన్స్‌లు** విభాగం చూపించి, పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుని, ఆ పేమెంట్‌ను **సెటిల్ చేయి** కింద రికార్డ్ చేయండి."
  - heading: "50/50, ఆదాయం ప్రకారం, లేదా బిల్లు బిల్లుకు"
    body: "సరైన సమాధానం అంటూ లేదు, మీ ఇద్దరూ సరేనన్నదే ఉంది. మూడు సాధారణ ఎంపికలు."
    items:
      - "**అన్నిటికీ చెరి సగం.** ఉంచుకోవడానికి సులువు, జీతాలు దాదాపు సమానంగా ఉండే జంటలకు సరిపోతుంది."
      - "**ఉమ్మడి అన్నిటికీ ఆదాయం ప్రకారం.** Maya, Jon చేసేది ఇదే. ఒక సంభాషణ, ఒక జత శాతాలు."
      - "**బిల్లు బిల్లుకు.** అద్దె, బిల్లులు ఆదాయం ప్రకారం, హాలిడేలు, చిన్న సరదాలు 50/50 లేదా మీరు ఒప్పుకున్నట్టు, ప్రతి బిల్లుకు దానికి సరిపోయే నియమం."
  - heading: "ఉమ్మడి అంటే ఏమిటో ఒప్పుకోండి"
    body: "వాదనలు సాధారణంగా శాతాల గురించి కాదు, జాబితా గురించే. చాలా ఇళ్లలో అద్దె, కరెంటు, బ్రాడ్‌బ్యాండ్, వారపు సరుకులు, సోఫా ఉమ్మడి ఖర్చులే. Maya జిమ్ సభ్యత్వం, Jon ఫుట్‌బాల్ సబ్‌స్క్రిప్షన్ అలా కాకపోవచ్చు. జాబితాను ఒకసారి ఒప్పుకుని, రాసి పెట్టి, ఉమ్మడి ఖర్చులను మాత్రమే గ్రూప్‌లో ఉంచండి."
  - heading: "టేకవే ఉద్దేశపూర్వకంగానే 50/50"
    body: "సరదా ఖర్చులు చిన్నవి, ఐచ్ఛికమైనవి, మోమోలు ఆర్డర్ చేయడానికి ఎవరికీ కాలిక్యులేటర్ అక్కర్లేదు. Side Badgerలో టేకవే మరొక ఖర్చు మాత్రమే. Jon £36 చెల్లిస్తాడు, **ఎలా విభజించాలి** **సమానం**గానే ఉంటుంది, ఇద్దరూ చెరి £18 ఇవ్వాలి."
  - heading: "ఒకరి జీతం మారినప్పుడు"
    body: "జీతం పెరగడం, కొత్త ఉద్యోగం, లేదా పని నుంచి విరామం లెక్కను మారుస్తాయి. కొత్త శాతాలను అదే విధంగా లెక్క వేసి, వచ్చే ఖర్చు నుంచి వాడండి. ముందటి ఖర్చులు ఉన్నట్టే ఉంటాయి. గత నెల అద్దెను కాపీ చేసి, శాతాలు మార్చి, **కాపీని సృష్టించు** ఎంచుకోండి. ఇప్పటికే నమోదైన దాన్ని సరిచేయాలంటే, గ్రూప్ అనుమతులు ఒప్పుకుంటే సవరించండి, బ్యాలెన్స్‌లు మారతాయి కాబట్టి ముందు మీ భాగస్వామికి చెప్పండి. ముందటి వెర్షన్ ఉంచబడుతుంది. ఎప్పుడు మళ్లీ లెక్క వేయాలో ఒప్పుకోండి, ఉదాహరణకు ఏడాదికి ఒకసారి, మారే ముందు లెక్క తేల్చుకోండి, అప్పుడు పాత పంపకం శుభ్రమైన లెక్కతో ముగుస్తుంది."
  - heading: "ఇక్కడ Side Badger చేయనివి"
    items:
      - "ఇది ఎవరు ఎంత సంపాదిస్తారో అడగదు, శాతాలను లెక్క వేయదు. మీరు ఒప్పుకున్న అంకెలను మీరు టైప్ చేస్తారు."
      - "మొత్తం గ్రూప్‌కు డిఫాల్ట్ పంపకాన్ని సెట్ చేయలేరు. శాతాలు ప్రతి ఖర్చుపై ఉంటాయి, కాబట్టి అవి ఉన్న ఖర్చును కాపీ చేయండి."
      - "ఇందులో పునరావృత బిల్లులు లేవు, కాబట్టి ప్రతిసారీ గత నెల అద్దెను కాపీ చేస్తారు."
      - "ఇది డబ్బు కదపదు. మీరు ఒకరికొకరు మీకు నచ్చిన విధంగా చెల్లించుకుని రికార్డ్ చేస్తారు."
exampleAfter: 2
