meta:
  title: Side Badger per coinquilini, viaggi e feste
  description: Dividi le spese con i coinquilini, nei viaggi di gruppo e per feste, matrimoni e regali collettivi. Scopri cosa fa Side Badger per ogni tipo di gruppo.
h1: Side Badger per il tuo tipo di gruppo
navLabel: Casi d'uso
lead: Coinquilini, vacanze, addii al nubilato. Scegli il tuo caos, poi guarda come un gruppo come il tuo tiene il conto.
intro: Ogni gruppo divide le spese in modo un po' diverso. Queste pagine seguono uno **scenario realistico** dalla prima spesa all'ultimo pagamento registrato, con i conti in vista, così puoi vedere dove arriverebbe il tuo gruppo.
cta:
  heading: Hai trovato il tuo tipo di gruppo?
  body: Crea un account, avvia un gruppo e aggiungi la prima spesa. Bastano un paio di minuti.
  button: Crea un account gratuito
cardsHeading: Scegli la situazione più vicina alla tua
sections:
  - heading: Viaggi di gruppo
    body: Voli in sterline, una villa in euro e una cena a cui hanno partecipato in tre. Imposta il gruppo per convertire in sterline e quattro amici a Lisbona finiscono con tre pagamenti, invece di sei quando le valute restano separate. [Dividi le spese dei viaggi di gruppo](page:use-case/group-trips).
  - heading: Coinquilini
    body: Una persona paga il padrone di casa, un'altra si ricorda della bolletta dell'energia e nessuno è d'accordo su chi abbia comprato la carta igienica. Con l'affitto diviso in base alla dimensione delle stanze e le altre bollette in parti uguali, quattro coinquilini chiudono il mese con tre pagamenti, tutti a chi ha pagato l'affitto. [Dividi le spese di casa con i coinquilini](page:use-case/housemates).
  - heading: Feste, matrimoni e regali collettivi
    body: Sei persone votano il regalo, una lo compra e non tutti contribuiscono con la stessa cifra. Un regalo da 150 £ diviso per importi esatti lascia cinque pagamenti a chi l'ha comprato, 120 £ in tutto. [Dividi le spese di un evento](page:use-case/events-and-celebrations).
  - heading: Coppie
    body: Dividete le spese noiose senza trasformare la serata romantica in una revisione finanziaria trimestrale. Affitto diviso 60/40 e spesa in parti uguali si riducono a un solo pagamento tra voi due.
  - heading: Guarda prima come funziona
    body: Tutti gli esempi qui sopra seguono gli stessi passaggi, dalla creazione di un gruppo alla registrazione dei pagamenti. [Come funziona](page:how-it-works) li illustra, e i [prezzi](page:pricing) dicono quanto costa, cioè niente, senza pubblicità e senza limiti giornalieri.
faq:
  heading: Domande
  items:
    - q: Serve un account a tutti nel gruppo?
      a: Sì. Le persone si uniscono con un link o un codice QR e un account gratuito.
    - q: Side Badger può raccogliere i soldi?
      a: No. Paghi come preferisci, poi registri il pagamento perché i saldi restino giusti.
    - q: Devo scegliere un solo tipo di gruppo?
      a: No. I casi d'uso sono esempi, non impostazioni. Ogni gruppo ha le stesse funzionalità, quindi usa la combinazione che fa per te.
