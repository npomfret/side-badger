sections:
  - heading: "Beth mae Splitwise yn ei wneud yn dda"
    body: "Os oes angen ap brodorol, defnydd all-lein neu daliadau y tu mewn i'r ap ar eich grŵp, Splitwise yw'r dewis call, a byddai'n well gennym i chi ei ddewis na darganfod yn nes ymlaen. Mae ei dudalennau ei hun yn rhestru:"
    items:
      - "**Apiau a defnydd all-lein.** Apiau iPhone ac Android yn ogystal â'r we, a modd all-lein."
      - "**Mwy o ffyrdd o rannu.** Cyfrannau, addasiadau a rhaniadau fesul eitem, yn ogystal â chyfartal, union a chanran."
      - "**Treuliau cylchol.** Gosodwch y rhent i ailadrodd ac anghofiwch amdano."
      - "**Taliadau yn yr ap.** Mewn rhai gwledydd gall symud yr arian hefyd, drwy Splitwise Pay, Venmo, PayPal neu Pay by Bank."
  - heading: "Am ddim yma, â thâl yno"
    body: "Splitwise Pro yw cynllun taledig Splitwise, ac mae ei dudalen Pro ei hun yn gwerthu pedwar peth sy'n costio dim yn Side Badger."
    items:
      - "**Sganio derbynebau.** Mae Splitwise Pro yn sganio llun o'ch derbynneb. Mae Side Badger yn gwneud hynny am ddim, heb gredydau sganio: mae'n llenwi'r cyfanswm, y dyddiad a'r lle i chi eu gwirio. Mae delweddau derbynebau yn cael eu darllen gan wasanaeth AI Google."
      - "**Trosi arian cyfred.** Mae Splitwise Pro yn trosi treuliau grŵp i'ch arian cyfred diofyn pan fyddwch yn tapio “Convert”. Mae Side Badger yn trosi pob cost wrth i chi ei rhoi i mewn, ar gyfradd gyfnewid gyfredol neu'r un a gawsoch mewn gwirionedd, ac mae'r swm gwreiddiol yn aros ar y gost."
      - "**Dim hysbysebion.** Mae Splitwise yn rhestru profiad hollol ddi-hysbyseb fel nodwedd Pro. Does gan Side Badger ddim hysbysebion."
      - "**Dim cyfyngiadau dyddiol.** Mae Splitwise Pro yn gwerthu treuliau diderfyn, ac mae ei ganolfan gymorth yn dweud y gall defnyddwyr di-dâl ychwanegu hyd at 4 cost bob dydd. Does gan Side Badger ddim cyfyngiadau dyddiol."
  - heading: "Yr hyn sydd gan Splitwise nad oes gan Side Badger"
    body: "Nid pob nodwedd Splitwise yw hon, dim ond y rhai sy'n tueddu i benderfynu'r mater. Mae gan dudalennau Splitwise ei hun y rhestr lawn. Dyma ble mae Side Badger yn dod yn brin."
    items:
      - "**Apiau brodorol.** Mae Side Badger yn gweithio yn eich porwr. Mewngofnodwch, yna ychwanegwch ef at eich sgrin gartref ac mae'n agor fel ap."
      - "**Modd all-lein.** Mae angen cysylltiad ar Side Badger."
      - "**Taliadau yn yr ap.** Dyw Side Badger byth yn cyffwrdd â'ch arian. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad."
      - "**Treuliau cylchol.** Does gan Side Badger ddim. Copïwch rent y mis diwethaf yn lle ei deipio eto."
      - "**Rhannu yn ôl cyfrannau neu fesul eitem.** Mae gan Side Badger un talwr fesul cost, wedi'i rannu'n gyfartal, yn ôl symiau union neu yn ôl canran. Dyw ei sganio derbynebau ddim yn neilltuo eitemau i bobl."
      - "**Siartiau a rhaniadau diofyn.** Mae gan Splitwise Pro y ddau. Mae Side Badger yn cadw'r cyfrif o bwy sy'n ddyledus i bwy, a dyna'r holl gamp."
  - heading: "Symud eich grŵp drosodd"
    body: "Does dim mewnforiwr, felly mae symud yn golygu dechrau o'r newydd. Setlwch yn Splitwise yn gyntaf, yna crëwch grŵp yn Side Badger a gwahoddwch bawb gyda dolen neu god QR. Mae angen cyfrif am ddim ar bawb yn y grŵp, a chyfeiriad e-bost yw'r cyfan sydd ei angen i gofrestru."
