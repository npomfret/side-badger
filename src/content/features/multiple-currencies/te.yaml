meta:
  title: "140 కరెన్సీలలో ఖర్చులు పంచండి, మార్చి లేదా విడిగా ఉంచి"
  description: "ప్రతి ఖర్చును మీరు చెల్లించిన కరెన్సీలో నమోదు చేయండి, బ్యాలెన్స్‌లను విడిగా ఉంచండి లేదా మీరు చూడగల, మార్చగల రేటుతో మార్చండి, తర్వాత పేమెంట్ల చిన్న జాబితాతో లెక్క తేల్చండి."
h1: "140 కరెన్సీలలో ఖర్చులు పంచండి"
navLabel: "అనేక కరెన్సీలు"
lead: "యూరోలు, యెన్, బాట్‌లో చెల్లించిన ఆ ఒక్క ట్యాక్సీ. Side Badger ప్రతి ఖర్చును మీరు చెల్లించిన కరెన్సీలోనే తీసుకుంటుంది, బ్యాలెన్స్‌లను సరిగ్గా ఉంచుతుంది, మీ గ్రూప్ ఒకేసారి లెక్క తేల్చుకోవాలనుకుంటే మార్చగలదు. ఇది 140 కరెన్సీలలో పనిచేస్తుంది, [గ్రూప్ ట్రిప్‌లకు](page:use-case/group-trips) సహజంగా సరిపోతుంది."
cta:
  heading: "మీ యూరోలను తీసుకురండి, మీ యెన్‌ను తీసుకురండి"
  body: "ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి ఖర్చును మీ చేతిలో ఏ కరెన్సీ ఉంటే అందులోనే జోడించండి."
  button: "ఉచిత ఖాతా తెరవండి"
problem:
  heading: "మీరు చెల్లించినట్టే నమోదు చేయండి"
  body: "ట్రిప్‌కు చెల్లింపు ఒకే కరెన్సీలో అరుదుగా ఉంటుంది. హోటల్ ఇంటి నుండి పౌండ్లలో బుక్ అయింది, డిన్నర్ యెన్‌లో చెల్లించారు, ఎయిర్‌పోర్ట్ కాఫీ లేఓవర్‌లో ఏ కరెన్సీ నడిస్తే అందులో. టైప్ చేయడానికి ముందే అన్నింటినీ చేతితో మార్చడం వల్లే స్ప్రెడ్‌షీట్‌లు వదిలేస్తారు. Side Badgerలో మీరు ప్రతి ఖర్చును రసీదు మీద ఉన్న కరెన్సీలో నమోదు చేస్తారు, ప్రతి మొత్తం తన కరెన్సీ నియమాలను అనుసరిస్తుంది, కాబట్టి యెన్‌కు దశాంశాలు ఉండవు, దినార్‌కు మూడు ఉంటాయి. మీరు ఇటీవల వాడిన కరెన్సీలు జాబితాలో ముందు వస్తాయి."
workflow:
  heading: "కరెన్సీలను విడిగా ఉంచండి, లేదా వెళ్తూ మార్చండి"
  steps:
    - title: "ఖర్చును దాని సొంత కరెన్సీలో జోడించండి"
      body: "కరెన్సీ ఎంచుకోండి, మొత్తం టైప్ చేయండి, ఎవరు చెల్లించారో, ఎవరు పంచుకున్నారో చెప్పండి. ఇంకేమీ అవసరం లేదు. ఇదే డిఫాల్ట్, ఇది అసలు మొత్తాన్ని మీరు నమోదు చేసినట్టే ఉంచుతుంది."
      shot: S07
      shotAlt: "యెన్ మొత్తం నమోదు చేసిన ఖర్చు ఫారం"
    - title: "ప్రతి కరెన్సీకి బ్యాలెన్స్ చూడండి"
      body: "బ్యాలెన్స్‌లు ప్రతి కరెన్సీకి విడిగా ఉంచబడతాయి, ప్రతిదానికి సూచించిన పేమెంట్ల సొంత చిన్న జాబితా వస్తుంది. పౌండ్లు పౌండ్లలో, యెన్ యెన్‌లో తేలుతాయి."
      shot: S10
      shotAlt: "రెండు కరెన్సీలలో సరళీకృత అప్పులతో బ్యాలెన్స్ స్క్రీన్"
    - title: "లేదా గ్రూప్ ఒకేసారి లెక్క తేల్చుకోవాలనుకుంటే మార్చండి"
      body: "ఖర్చు నమోదు చేసేటప్పుడు మరో కరెన్సీని ఎంచుకోండి, Side Badger దాన్ని ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో మార్చగలదు, మీకు నిజంగా వచ్చిన రేటుకు మీరు దాన్ని మార్చుకోవచ్చు. మార్చిన మొత్తం ఆ కరెన్సీలోని బ్యాలెన్స్‌లో చేరుతుంది. మార్పిడి గ్రూప్ తీసుకునే నిర్ణయం, మీ వెనక జరిగేది కాదు."
options:
  heading: "మీరు చూడగల, మార్చగల రేటు"
  items:
    - title: "రేటు చూపబడుతుంది"
      body: "మీరు మార్చినప్పుడు, రేటు, మార్చిన మొత్తం ఫారంలో కనిపిస్తాయి, కాబట్టి ఎవరూ ఏ అంకెనూ గుడ్డిగా నమ్మాల్సిన పనిలేదు."
    - title: "మీ సొంత రేటు టైప్ చేయండి"
      body: "క్యాష్ డెస్క్‌లో మంచి రేటు వచ్చిందా, లేదా ఎయిర్‌పోర్ట్‌లో చెడ్డది వచ్చిందా? రేటును మీకు నిజంగా వచ్చినదానికి మార్చండి, మార్చిన మొత్తం అప్‌డేట్ అవుతుంది."
    - title: "అసలు మొత్తం అలాగే ఉంటుంది"
      body: "అసలు మొత్తం ఖర్చులో మార్చిన మొత్తం పక్కనే ఉంటుంది, యెన్‌లో అది ఎంతో అడిగే వాళ్ల కోసం."
    - title: "మార్చడం ఉచితం"
      body: "మార్చడానికి ఏమీ ఖర్చు కాదు. ఖర్చును మరో కరెన్సీలో నమోదు చేయడానికి ఫీజు లేదు."
example:
  heading: "జపాన్‌లో నలుగురు స్నేహితులు, రెండు విధాలుగా లెక్క తేల్చడం"
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: chloe
      name: Chloé
    - id: dev
      name: Dev
  expenses:
    - label: "హోటల్, ఇంటి నుండి బుక్ చేసినది"
      payer: ana
      amount: 1200
      split:
        method: equal
    - label: "జపాన్‌లో డిన్నర్"
      payer: ben
      amount: 40000
      currency: JPY
      split:
        method: equal
    - label: "రైలు టికెట్లు"
      payer: chloe
      amount: 24000
      currency: JPY
      split:
        method: equal
    - label: "ఆలయ ప్రవేశం"
      payer: dev
      amount: 4000
      currency: JPY
      split:
        method: equal
  conversion:
    rates:
      JPY: 0.005
sections:
  - heading: "మొత్తం గ్రూప్‌కు ఒకే కరెన్సీ"
    body: "మీ గ్రూప్ దీని గురించి ఆలోచించకూడదనుకుంటే, ఒక గ్రూప్ కరెన్సీని ఎంచుకోండి, ఫారం ప్రతి కొత్త ఖర్చును దానిలోకి మారుస్తుంది, మీరు ఇప్పటికీ చూడగల, మార్చగల రేటుతో. ఇది కొత్త, కాపీ చేసిన ఖర్చులకు మాత్రమే వర్తిస్తుంది. సవరణలు, ఉన్న ఖర్చులు ఉన్నట్టే ఉంటాయి, కాబట్టి ఇప్పటికే నమోదైనదేదీ మీకు తెలియకుండా మారదు."
  - heading: "యూరోలు ఇవ్వాలి, పౌండ్లలో చెల్లించండి"
    body: "యెన్‌లో చెల్లించారు, పౌండ్లలో తేల్చుతారా? సరే. పేమెంట్ రికార్డ్ చేసేటప్పుడు దాన్ని కూడా మార్చవచ్చు, కాబట్టి యూరోలు ఇవ్వాల్సిన వ్యక్తి పౌండ్లలో చెల్లించవచ్చు, యూరో బ్యాలెన్స్ ఇంకా సరిగ్గానే వస్తుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత రికార్డ్ చేయండి."
  - heading: "గ్రూప్ కోసం నియమాలు"
    body: "గ్రూప్‌ను మీరు నిజంగా వాడుతున్న కరెన్సీలకు పరిమితం చేయండి, ఫారం సరైనదానిపై తెరుచుకునేలా ఒక డిఫాల్ట్ సెట్ చేయండి. పోర్చుగల్ సెలవులకు డిన్నర్ బిల్లు పక్కన మరో 139 ఎంపికలు అవసరం లేదు, [విదేశంలో పెళ్లి](page:use-case/events-and-celebrations)కి బహుశా రెండు చాలు."
limits:
  heading: "పరిమితులు"
  items:
    - "ఖర్చు సేవ్ అయినప్పుడు రేటు స్థిరపడుతుంది. పాత ఖర్చుల విలువ ఎప్పుడూ తిరిగి లెక్కించబడదు."
    - "Side Badger వీలైన చోట ప్రస్తుత రేటును తెచ్చుకుంటుంది. ప్రతి జంటకూ రేటు ఉంటుందని హామీ లేదు, మీరు ఎప్పుడైనా రేటును మీరే టైప్ చేయవచ్చు."
    - "గ్రూప్ ఆటో-కన్వర్ట్ కొత్త, కాపీ చేసిన ఖర్చులకు మాత్రమే వర్తిస్తుంది, సవరణలకు లేదా ఉన్న ఖర్చులకు కాదు."
    - "ప్రతి ఖర్చు దాని సొంత కరెన్సీలో 999,999.99కి పరిమితం."
    - "140 కరెన్సీలు ఉన్నాయి. క్రిప్టోకరెన్సీలు, లోహాలు వాటిలో లేవు."
    - "Side Badger పేమెంట్లను రికార్డ్ చేస్తుంది. డబ్బును ఎప్పుడూ కదిలించదు, మార్చదు."
useCasesHeading: "ఇది ఎక్కడ ఉపయోగపడుతుంది"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "మీరు ఏ ఎక్స్ఛేంజ్ రేటును వాడతారు?"
      a: "ప్రస్తుత ఎక్స్ఛేంజ్ రేటు, ఖర్చు నమోదు చేసినప్పుడు అందుబాటులో ఉన్నచోట తెచ్చుకుంటారు. మీకు నిజంగా వచ్చిన రేటుకు మీరు దాన్ని మార్చవచ్చు, మార్చిన మొత్తం అప్‌డేట్ అవుతుంది."
    - q: "పాత ఖర్చుల విలువ తిరిగి లెక్కించబడుతుందా?"
      a: "లేదు. ఖర్చు సేవ్ అయినప్పుడు రేటు స్థిరపడుతుంది, కాబట్టి మార్కెట్ కదిలినందుకు బ్యాలెన్స్ జారదు."
    - q: "మీరు క్రిప్టోకు మద్దతు ఇస్తారా?"
      a: "లేదు. 140 కరెన్సీలు ఉన్నాయి, క్రిప్టోకరెన్సీలు వాటిలో లేవు."
    - q: "నేను 2,000,000 ఇండోనేషియన్ రూపియా ఎందుకు నమోదు చేయలేను?"
      a: "ప్రతి ఖర్చు దాని సొంత కరెన్సీలో 999,999.99కి పరిమితం. దాన్ని మరో కరెన్సీలో నమోదు చేసి మార్చండి, లేదా రెండు ఖర్చులుగా విభజించండి."
    - q: "మార్చడానికి ఏమైనా ఖర్చవుతుందా?"
      a: "లేదు. Side Badger లోని మిగతా వాటిలాగే మార్చడం ఉచితం. [ధరలు](page:pricing) చూడండి."
    - q: "నేను తప్పనిసరిగా మార్చాలా?"
      a: "లేదు. మీరు లేదా మీ గ్రూప్ మార్చాలని ఎంచుకుంటే తప్ప కరెన్సీలు విడిగానే ఉంటాయి, ప్రతి కరెన్సీకి పేమెంట్ల సొంత చిన్న జాబితా వస్తుంది."
