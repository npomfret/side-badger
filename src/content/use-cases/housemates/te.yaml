faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "అద్దె తనంతట తాను పునరావృతం కాగలదా?"
      a: "లేదు, పునరావృత బిల్లులు లేవు. గత నెల అద్దెను కొన్ని ట్యాప్‌లలో కాపీ చేయండి, తేదీ మార్చండి, పని అయిపోయింది."
    - q: "మేము గది పరిమాణం ప్రకారం పంచవచ్చా?"
      a: "అవును, శాతంతో. ప్రతి రూమ్‌మేట్‌కు వాళ్ల గదిని ప్రతిబింబించే వాటా ఇవ్వండి, వాటాల మొత్తం 100 కావాలి. పంచడానికి ఇతర మార్గాలను [ఖర్చుల పంపకం](page:feature/split-expenses) వివరిస్తుంది."
    - q: "బాకీ ఉండగా రూమ్‌మేట్ ఇల్లు ఖాళీ చేస్తే?"
      a: "లెక్క తేల్చుకునే వరకు వాళ్లు గ్రూప్ వదలలేరు, ఎందుకంటే ఇవ్వాల్సినవి లేదా రావాల్సినవి ఉన్నంత వరకు ఎవరూ గ్రూప్ వదలలేరు. అందరి లెక్క సరిపోయే వరకు అంకెలు నిజాయితీగా ఉంటాయి."
    - q: "Side Badger బిల్లులు చెల్లిస్తుందా?"
      a: "లేదు. ఇది లెక్క ఉంచుతుంది, పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది. మీరు మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుంటారు, తర్వాత రికార్డ్ చేస్తారు, [లెక్క తేల్చడం](page:feature/settle-up) వివరించినట్టు."
    - q: "ఒక రూమ్‌మేట్ లెక్కలు చూడవచ్చా?"
      a: "అవును. వాళ్లను అడ్మిన్‌ను చేసి మేనేజ్డ్ గ్రూప్ వాడండి, అక్కడ కొత్త సభ్యులకు ఆమోదం కావాలి, సృష్టికర్తలు, అడ్మిన్లు మాత్రమే ఖర్చులను మార్చగలరు."
