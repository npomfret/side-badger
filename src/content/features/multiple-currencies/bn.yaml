sections:
  - heading: "পুরো গ্রুপের জন্য একটি মুদ্রা"
    body: "আপনার গ্রুপ এ নিয়ে ভাবতে না চাইলে একটি গ্রুপ-মুদ্রা বেছে নিন, ফর্ম প্রতিটি নতুন খরচ সেটিতে রূপান্তর করবে, এমন রেটে যা আপনি এখনও দেখতে ও বদলাতে পারেন। এটি শুধু নতুন আর কপি করা খরচে প্রযোজ্য। সম্পাদনা আর আগের খরচ যেমন আছে তেমনই থাকে, যাতে আগে রেকর্ড করা কিছুই আপনার অজান্তে না বদলায়।"
  - heading: "ইউরো দিতে হবে, পেমেন্ট পাউন্ডে"
    body: "ইয়েনে দিয়েছেন, পাউন্ডে মেটাবেন? ঠিক আছে। পেমেন্ট রেকর্ড করার সময় সেটাও রূপান্তর করা যায়, তাই যার ইউরো দেওয়ার আছে সে পাউন্ডে দিতে পারে আর ইউরোর ব্যালেন্স তবুও ঠিক আসে। যেভাবে খুশি একে অপরকে দিন, তারপর রেকর্ড করুন।"
  - heading: "গ্রুপের নিয়ম"
    body: "গ্রুপকে সেই মুদ্রাগুলোতেই সীমিত রাখুন যা আপনি আসলে ব্যবহার করছেন, আর একটি ডিফল্ট ঠিক করুন যাতে ফর্ম সঠিকটিতে খোলে। পর্তুগালের ছুটিতে ডিনারের বিলের পাশে আরও 139টি বিকল্পের দরকার নেই, আর [বিদেশে বিয়েতে](page:use-case/events-and-celebrations) সম্ভবত দুটি লাগে।"
limits:
  heading: "সীমা"
  items:
    - "খরচ সেভ হওয়ার সময় রেট স্থির হয়ে যায়। পুরনো খরচের মূল্য কখনও নতুন করে ধরা হয় না।"
    - "Side Badger যেখানে পারে সেখানে বর্তমান রেট আনে। প্রতিটি জোড়ার জন্য রেটের নিশ্চয়তা নেই, আর আপনি সবসময় নিজেও রেট লিখতে পারেন।"
    - "গ্রুপ অটো-কনভার্ট শুধু নতুন আর কপি করা খরচে প্রযোজ্য, সম্পাদনা বা আগের খরচে নয়।"
    - "প্রতিটি খরচ তার নিজস্ব মুদ্রায় 999,999.99-এ সীমিত।"
    - "140টি মুদ্রা আছে। ক্রিপ্টোকারেন্সি আর ধাতু তার মধ্যে নেই।"
    - "Side Badger পেমেন্ট রেকর্ড করে। এটি কখনও টাকা নাড়াচাড়া বা বিনিময় করে না।"
useCasesHeading: "যেখানে এটি কাজে লাগে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "আপনারা কোন এক্সচেঞ্জ রেট ব্যবহার করেন?"
      a: "বর্তমান এক্সচেঞ্জ রেট, যেখানে পাওয়া যায় সেখানে খরচ লেখার সময় আনা হয়। আসলে যে রেট পেয়েছেন তাতে আপনি বদলাতে পারেন, আর রূপান্তরিত পরিমাণ হালনাগাদ হয়।"
    - q: "পুরনো খরচের কি নতুন করে মূল্য ধরা হয়?"
      a: "না। খরচ সেভ হওয়ার সময় রেট স্থির হয়ে যায়, তাই বাজার নড়েছে বলে ব্যালেন্স সরে যায় না।"
    - q: "আপনারা কি ক্রিপ্টো সমর্থন করেন?"
      a: "না। 140টি মুদ্রা আছে, আর ক্রিপ্টোকারেন্সি তার মধ্যে নেই।"
    - q: "আমি 2,000,000 ইন্দোনেশীয় রুপিয়াহ কেন লিখতে পারি না?"
      a: "প্রতিটি খরচ তার নিজস্ব মুদ্রায় 999,999.99-এ সীমিত। অন্য মুদ্রায় লিখে রূপান্তর করুন, বা দুটি খরচে ভাগ করে নিন।"
    - q: "রূপান্তরে কি কিছু খরচ হয়?"
      a: "না। রূপান্তর বিনামূল্যে, Side Badger-এর বাকি সবকিছুর মতো। দেখুন [দাম](page:pricing)।"
    - q: "আমাকে কি রূপান্তর করতেই হবে?"
      a: "না। আপনি বা আপনার গ্রুপ রূপান্তর বেছে না নিলে মুদ্রাগুলো আলাদা থাকে, আর প্রতিটি মুদ্রা পেমেন্টের নিজস্ব ছোট তালিকা পায়।"
