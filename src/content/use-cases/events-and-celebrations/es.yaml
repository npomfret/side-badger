featuresHeading: Las funciones que usa esto
faq:
  heading: Preguntas
  items:
    - q: ¿Pueden los invitados ver el grupo sin unirse?
      a: No. La gente se une con un enlace o un código QR y una cuenta gratis, así que puede ver el grupo una vez dentro.
    - q: ¿Puede Side Badger recoger el dinero?
      a: No. Side Badger lleva la cuenta y nunca mueve dinero. Pagaos como queráis y después registrad el pago. Es gratis, sin anuncios y sin límites diarios; consulta [precios](page:pricing).
    - q: ¿Pueden ser anónimos los votos?
      a: Sí. Al crear una encuesta puedes ocultar quién votó qué. Los ajustes solo se pueden cambiar antes del primer voto.
    - q: ¿Puede cada persona aportar una cantidad distinta?
      a: Sí. Divide un gasto por importes exactos, para que la parte de cada persona sea la cifra que acordasteis, o deja fuera a quien no participó.
    - q: ¿Puede quien organiza llevar las cuentas?
      a: Sí. Usa el ajuste preestablecido de grupo administrado, para que solo quien creó cada gasto y los administradores cambien gastos y los administradores aprueben a los miembros nuevos.
