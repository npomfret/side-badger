    - feature: Scanarea chitanțelor
      other: O funcție Pro. Scanează o fotografie a unei chitanțe, iar împărțirea pe articole din Pro te lasă să atribui articolele persoanelor.
      sideBadger: Gratuit, fără credite de scanare. Completează totalul, data și locul ca să le verifici și nu atribuie articole persoanelor.
