sections:
  - heading: "Bir ödemeyi kaydedin"
    body: "Biri ödediğinde, bunu doğru kişinin karşısına kaydedin. Hızlı ödeşme düğmeleri tutarı önerilen ödemelerinizden doldurur ve “banka havalesi” gibi bir not ekleyebilirsiniz (en fazla 500 karakter). Borcunuzun yalnızca bir kısmını öderseniz geri kalanı bakiyede kalır. Çok az veya çok fazla girerseniz Side Badger kaydetmeden önce sizi uyarır. Ödeme kaydetmek harcamaları düzenleme izni gerektirir ve tarih gelecekte olamaz."
  - heading: "Farklı bir para biriminde mi ödendi?"
    body: "Bakiyeler ödenen para biriminde kalır; yani euro borcu euro borcu olarak kalır. Euro borçlusunuz ama sterlinle mi ödüyorsunuz? Ödemeyi girerken güncel bir döviz kuruyla veya gerçekte uygulanan kurla çevirin. Kur, ödeme kaydedildiğinde sabitlenir. [Birden fazla para birimi](page:feature/multiple-currencies) çevirmenin nasıl çalıştığını anlatır, [grup gezileri](page:use-case/group-trips) ise kullanımda gösterir."
  - heading: "Kontrol edebileceğiniz geçmiş"
    body: "Kaydedilen her ödeme tarihi, tutarı ve notuyla grup geçmişinde kalır. Bir ödemeyi yalnızca onu kaydeden kişi düzenleyebilir, onu kaydeden veya bir grup yöneticisi silebilir. Gruptan ayrılmış biri dahil olan bir ödeme kilitlidir. Örnek bir ev arkadaşı senaryosu için [ev arkadaşları](page:use-case/housemates) sayfasına bakın."
limits:
  heading: "Side Badger'ın yapmadıkları"
  items:
    - "Side Badger para taşımaz, ödeme bağlantısı veya ödeme isteği göndermez. Uygulamadaki bir ödeme, başka bir yerde yapılmış bir ödemenin kaydıdır."
    - "Önerilen ödemeler, her para birimi için ayrı uygulanan basit bir eşleştirme yönteminden gelir. Her zaman, o para biriminde bakiyesi olan kişi sayısından daha az ödeme önerir (dört kişide en fazla üç), ama her zaman mümkün olan en küçük sayıyı bulmaz."
    - "Önerileri kapatamazsınız. **Tümünü göster** yalnızca sizinkileri değil, gruptaki her önerilen ödemeyi listeler."
    - "Harcamalar girişte çevrilmediyse para birimleri hiçbir zaman birbirinden mahsup edilmez."
    - "Hatırlatma yok, bu yüzden ödemenin peşine düşmek hâlâ size kalır."
useCasesHeading: "Hesaplaşmanın önemli olduğu yerler"
faq:
  heading: "Sorular"
  items:
    - q: "Side Badger parayı gönderir mi?"
      a: "Hayır. Birbirinize istediğiniz yolla ödeyin, sonra bakiye güncellensin diye ödemeyi Side Badger'da kaydedin."
    - q: "Önerilen ödemeleri kapatabilir miyim?"
      a: "Hayır. Sadeleştirme açık kalır ve **Tümünü göster** yalnızca sizi ilgilendirenleri değil, gruptaki her önerilen ödemeyi listeler."
    - q: "Euro ve sterlin neden ayrı tutuluyor?"
      a: "Bir harcama veya ödemeyi girerken çevirmediğiniz sürece bakiyeler ödediğiniz para biriminde kalır. Farklı para birimlerindeki borçlar hiçbir zaman birbirinden mahsup edilmez."
    - q: "Biri borcunun yalnızca bir kısmını öderse ne olur?"
      a: "Ödediği kısmı kaydedin. Geri kalanı ödenene kadar bakiyede kalır."
    - q: "Bu her zaman mümkün olan en az ödeme sayısı mı?"
      a: "Garanti edilmez. Her zaman o para biriminde bakiyesi olan kişi sayısından daha az ödeme önerir; dört kişide asla üçten fazla önermez. Ev arkadaşları örneğinde bu iki ödemedir; herkese doğrudan geri ödeme altı ödeme gerektiriyordu."
