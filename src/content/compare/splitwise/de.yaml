sections:
  - heading: Geldgespräche direkt beim Geld
    body: Wo es um gemeinsames Geld geht, wird geredet, gezweifelt und geplant. Side Badger hält alle drei direkt neben den Zahlen, damit niemand im Gruppenchat zurückscrollen muss.
    items:
      - "**Kommentare, wo sie hingehören.** Kommentiere die Gruppe selbst oder jede Ausgabe, Liste und Umfrage, und führe das Gespräch direkt bei der Sache, um die es geht."
      - "**Belege und Fotos.** Hänge bis zu drei Belege an jede Ausgabe und füge Kommentaren zur Gruppe, zu einer Liste oder zu einer Umfrage Fotos oder PDFs hinzu."
      - "**Fragen statt Streit.** Ein Admin kann Fragen einschalten, dann kann jede Person in einer Ausgabe dazu eine Frage stellen. Sie bleibt aus den Salden heraus, bis sie geklärt ist."
      - "**Listen und Umfragen.** Führe die gemeinsame Einkaufsliste neben den Einkaufsrechnungen und lass über die Villa-Auswahl abstimmen, auf Wunsch anonym."
      - "**Ein bisschen Applaus.** Reagiere auf Ausgaben, Zahlungen und Kommentare und feiere eine Zahlung, wenn sie eintrifft."
  - heading: Deine Gruppe, deine Regeln
    body: Laut Splitwises Hilfe-Center unterstützt es weder Gruppen-Admins noch besondere Berechtigungen. Side Badger hat Rollen und Berechtigungen, für die Gruppen, die jemanden brauchen, der die Zahlen in Ordnung hält.
    items:
      - "**Admins, Mitglieder und Betrachter.** Mach jemanden zum Betrachter: Die Person sieht alles und ändert nichts."
      - "**Zwei Voreinstellungen oder deine eigene.** Starte mit Offene Zusammenarbeit oder Verwaltete Gruppe, oder lege jede Berechtigung selbst fest: wer Ausgaben bearbeitet und löscht, Listen bearbeitet, einlädt und neue Leute hereinlässt."
      - "**Beitritt nach Freigabe.** Schalte die Freigabe ein, und ein Admin lässt jede Person einzeln herein."
      - "**Die Einstellungen der Gruppe.** Beschränke sie auf die Währungen, die du wirklich nutzt, wähle ihre Standardwährung und gib ihr ein Titelbild."
      - "**Sperren, wenn alles vorbei ist.** Die Zahlen bleiben, wie sie sind, bis ein Admin die Sperre aufhebt."
  - heading: Hier kostenlos, dort bezahlt
    body: Splitwise Pro ist der bezahlte Plan von Splitwise, und seine eigene Pro-Seite verkauft drei Dinge, die in Side Badger nichts kosten.
    items:
      - "**Belegscan.** Splitwise Pro scannt ein Foto deines Belegs. Side Badger macht das kostenlos und ohne Scan-Guthaben: Es trägt Summe, Datum und Ort ein, damit du sie prüfen kannst."
      - "**Währungsumrechnung.** Splitwise Pro rechnet die Ausgaben einer Gruppe in deine Standardwährung um, wenn du auf „Umrechnen“ tippst. Side Badger rechnet jede Ausgabe beim Eingeben um, zu einem aktuellen Wechselkurs oder dem, den du tatsächlich bekommen hast, und der Originalbetrag bleibt an der Ausgabe."
      - "**Keine Tageslimits.** Splitwise Pro verkauft unbegrenzte Ausgaben, und laut seinem Hilfe-Center können in der kostenlosen Version bis zu 4 Ausgaben pro Tag hinzugefügt werden. Side Badger hat keine Tageslimits."
  - heading: Deine Bank bleibt draußen
    body: Side Badger verbindet sich nicht mit deiner Bank und fragt nicht nach deinen Bankdaten. Es führt Buch darüber, wer wem was schuldet; du zahlst den anderen, wie du willst, und erfasst dann die Zahlung. Kein Bank-Login, den du herausgeben musst, also eine Sorge weniger.
  - heading: Eine App, im Browser und auf dem Handy
    body: Side Badger läuft in deinem Browser. Melde dich an, füge es zum Home-Bildschirm hinzu, und es öffnet sich wie eine App. Es ist in beiden Fällen dieselbe App, eine neue Funktion ist also beim nächsten Öffnen auf deinem Handy, ohne App-Store-Update, auf das du warten musst.
  - heading: Und ein paar Partytricks
    items:
      - "**Frag deinen Assistenten.** Side Badger funktioniert mit ChatGPT und Claude: Bitte deinen Assistenten, eine Ausgabe hinzuzufügen, einen Beleg zu scannen oder eine Zahlung zu erfassen."
      - "**Alle in ihrer eigenen Sprache.** Side Badger spricht 39 Sprachen, und jede Person wählt ihre eigene. Splitwises Startseite nennt 7+. Mit 133 Währungen kommt es auch klar, für die Reise, die überallhin geht."
      - "**Hilfe, ohne die App zu verlassen.** Hängst du irgendwo oder hast einen Fehler gefunden? Sag es uns aus der App und lies unsere Antwort gleich dort."
  - heading: Wo Splitwise weiterhin vorn liegt
    body: Uns ist lieber, du nimmst die richtige App, als dass du es später merkst. Wenn deine Gruppe eines davon braucht, hat Splitwise es und Side Badger nicht.
    items:
      - "**App-Store-Apps.** Side Badger lebt in deinem Browser und auf deinem Home-Bildschirm, nicht in den App-Stores."
      - "**Offline-Modus.** Side Badger braucht eine Verbindung."
      - "**Zahlungen in der App.** In manchen Ländern kann Splitwise das Geld auch bewegen. Side Badger führt nur Buch."
      - "**Teilen nach Anteilen oder nach Posten.** Side Badger hat pro Ausgabe eine zahlende Person, gleichmäßig, nach genauen Beträgen oder in Prozent geteilt. Der Belegscan weist Posten nicht Personen zu."
      - "**Diagramme und Standardaufteilungen.** Beides hat Splitwise Pro. Side Badger führt die Rechnung, wer wem was schuldet, und das ist der ganze Trick."
  - heading: Deine Gruppe umziehen
    body: Es gibt keinen Import, ein Umzug bedeutet also einen Neuanfang. Rechne zuerst in Splitwise ab, lege dann eine Gruppe in Side Badger an und lade alle per Link oder QR-Code ein. Alle in der Gruppe brauchen ein kostenloses Konto, und zur Anmeldung genügt eine E-Mail-Adresse.
