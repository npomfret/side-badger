meta:
  title: "Αριθμομηχανή ενοικίου: ανά δωμάτιο ή εισόδημα | Side Badger"
  description: "Μεγαλύτερο δωμάτιο, μεγαλύτερο μερίδιο; Βγάλτε πόσα πληρώνει κάθε συγκάτοικος, ανά δωμάτιο ή εισόδημα. Τρέχει στο πρόγραμμα περιήγησής σας, χωρίς αποθήκευση ή αποστολή."
h1: "Αριθμομηχανή διαχωρισμού ενοικίου"
navLabel: "Αριθμομηχανή ενοικίου"
lead: "Μεγαλύτερο υπνοδωμάτιο, μεγαλύτερο μερίδιο; Πληκτρολογήστε το ενοίκιο και δείτε πόσα πληρώνει ο καθένας, ανάλογα με το δωμάτιο ή το εισόδημα, μέχρι το τελευταίο λεπτό. Τρέχει στο πρόγραμμα περιήγησής σας, δεν αποθηκεύει τίποτα και δεν μετακινεί χρήματα. Όταν το σπίτι θέλει να κρατιέται ο λογαριασμός, [χωρίστε τα έξοδα](page:feature/split-expenses) στο Side Badger και μετά αντιγράψτε το ενοίκιο κάθε μήνα."
cta:
  heading: "Συμφωνήστε τα ποσοστά μία φορά. Αντιγράφετέ τα για πάντα."
  body: "Αυτή η αριθμομηχανή τα ξεχνά όλα μόλις κλείσετε την καρτέλα, όπως ακριβώς ο συγκάτοικος που πλήρωσε σίγουρα το ίντερνετ. Μια ομάδα στο Side Badger κρατά το ενοίκιο, τους λογαριασμούς και ποιος έχει πληρώσει τι. Είναι δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
sections:
  - heading: "Δύο τρόποι να μοιράσετε το ενοίκιο"
    items:
      - "**Ανάλογα με το μέγεθος του δωματίου.** Ένα μέρος του ενοικίου πληρώνει την κουζίνα, το μπάνιο και το σαλόνι, που τα χρησιμοποιούν όλοι. Εσείς διαλέγετε αυτό το μερίδιο (40% για αρχή) και μοιράζεται εξίσου. Το υπόλοιπο πηγαίνει ανάλογα με το εμβαδόν του υπνοδωματίου, ώστε το μεγάλο δωμάτιο να πληρώνει περισσότερα και το αποθηκάκι να παίρνει την έκπτωση που του αξίζει."
      - "**Ανάλογα με το εισόδημα.** Ο καθένας πληρώνει τόσο μερίδιο του ενοικίου όσο μερίδιο του συνολικού εισοδήματος βγάζει. Αν προσθέσετε κοινούς λογαριασμούς, ακολουθούν τα ίδια μερίδια."
  - heading: "Πώς βγαίνουν οι πράξεις"
    body: "Κάθε άτομο παίρνει πρώτα ένα ακριβές μερίδιο και μετά ένα ακέραιο ποσοστό, γιατί οι ακέραιοι αριθμοί πληκτρολογούνται και συζητιούνται ευκολότερα. Η στρογγυλοποίηση γίνεται με τη μέθοδο του μεγαλύτερου υπολοίπου: ο καθένας κρατά τον ακέραιο αριθμό κάτω από το μερίδιό του και οι μονάδες που περισσεύουν πάνε σε όποιον έχασε τα περισσότερα. Τα ποσοστά κάνουν πάντα συνολικά 100. Στο διαμέρισμα παρακάτω, το κοινό 40% είναι 13,33% ανά άτομο. Το δωμάτιο της Πρίγια είναι 16 από τα 38 m² του διαμερίσματος, οπότε 60% × 16/38 κάνει 25,26%, και με το 13,33% βγαίνει 38,6%, που στρογγυλοποιείται σε 39%. Ο Τομ και η Αΐσα βγαίνουν στο 32% και στο 29% και 39 + 32 + 29 κάνει 100. Κάθε ποσό είναι αυτό το ποσοστό του ενοικίου: το 39% των 1.950 £ είναι 760,50 £."
  - heading: "Μετά πληκτρολογήστε το στο Side Badger"
    body: "Για όλη την ιστορία, μετροταινία συμπεριλαμβανομένης, δείτε [πώς να μοιράσετε το ενοίκιο ανάλογα με το μέγεθος του δωματίου](page:guide/how-to-split-rent-by-room-size) ή, για ζευγάρια, [όταν ο σύντροφος βγάζει περισσότερα](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
    items:
      - "**Προσθέστε το ενοίκιο.** Στην ομάδα σας, επιλέξτε **Προσθήκη Εξόδου**, διαλέξτε στο πεδίο **Ποιος πλήρωσε;** ποιος πλήρωσε τον ιδιοκτήτη και κρατήστε όλους στο πεδίο **Μοιράζεται μεταξύ**."
      - "**Επιλέξτε Ποσοστό.** Στο πεδίο **Τρόπος διαχωρισμού** επιλέξτε **Ποσοστό** και πληκτρολογήστε τα ακέραια ποσοστά. Η φόρμα το επισημαίνει αν δεν κάνουν συνολικά 100."
      - "**Αντιγράψτε το τον επόμενο μήνα.** Ανοίξτε το ενοίκιο του προηγούμενου μήνα και επιλέξτε **Αντιγραφή εξόδου**. Ο διαχωρισμός έρχεται μαζί του."
  - heading: "Τι δεν κάνει η αριθμομηχανή"
    items:
      - "**Δεν μετράει τα δωμάτιά σας.** Το εμβαδόν είναι αφετηρία. Ένα δωμάτιο με δικό του μπάνιο αξίζει περισσότερο από το ίδιο εμβαδόν χωρίς, και ένα αποθηκάκι που χωράει ένα κρεβάτι και μια αισιόδοξη καρέκλα αξίζει λιγότερο."
      - "**Δεν αποφασίζει τι μετράει ως εισόδημα.** Καθαρά ή μεικτά, μισθός ή δεύτερη δουλειά: αποφασίζει η ομάδα. Χρησιμοποιήστε την ίδια περίοδο για όλους."
      - "**Δεν αποθηκεύει τίποτα.** Κλείστε την καρτέλα και τα ποσά χάνονται. Για να τα κρατήσετε, αντιγράψτε τον σύνδεσμο. Κρατά τα ποσά σας μετά το #, που τα προγράμματα περιήγησης δεν στέλνουν ποτέ σε διακομιστή, και όποιος τον έχει μπορεί να τα διαβάσει."
      - "**Δεν μετακινεί χρήματα.** Πληρώνετε τον ιδιοκτήτη όπως θέλετε."
      - "**Δεν ανακατεύει νομίσματα και δεν ξεπερνά τα όρια.** Διαλέξτε ένα νόμισμα. Δέχεται από 2 έως 10 άτομα και ενοίκιο έως 999.999,99, όπως η εφαρμογή."
