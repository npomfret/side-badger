faq:
  heading: "Запитання"
  items:
    - q: "Яким курсом обміну користується Side Badger?"
      a: "Актуальним курсом обміну, який отримується, коли ви вносите витрату, якщо він доступний. Його можна змінити на той, за яким ви справді обміняли."
    - q: "Чи може група триматися фунтів та єн?"
      a: "Так. У **Налаштуваннях** групи ввімкніть **Обмежити валюти для цієї групи** в розділі **Налаштування валюти**, оберіть **Дозволені валюти** й задайте **Валюта за замовчуванням для нових витрат**. Менше варіантів у списку, менше помилок біля каси."
    - q: "Чи обов'язково взагалі конвертувати?"
      a: "Ні. Валюти лишаються окремими, доки ви чи ваша група не вирішите конвертувати, і кожна валюта отримує власний короткий список платежів."
