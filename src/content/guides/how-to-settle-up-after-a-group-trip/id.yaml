faq:
  heading: "Pertanyaan"
  items:
    - q: "Siapa yang sebaiknya mencatat pembayaran, yang membayar atau yang dibayar?"
      a: "Mencatat pembayaran memerlukan izin untuk mengubah pengeluaran, dan formulir menanyakan **Siapa yang membayar?** dan **Siapa yang menerima pembayaran?** Hanya orang yang mencatatnya yang bisa mengubahnya nanti, jadi biasanya paling mudah jika pembayar yang mencatat, dengan tombol penyelesaian cepat."
    - q: "Bagaimana jika perjalanannya memakai dua mata uang?"
      a: "Saldo disimpan per mata uang, jadi utang euro tetap utang euro dan setiap mata uang mendapat daftar singkatnya sendiri, kecuali pengeluaran dikonversi saat dimasukkan. [Beberapa mata uang](page:guide/how-to-split-a-trip-paid-in-several-currencies) menunjukkan kedua caranya."
    - q: "Sebaiknya melunasi selama perjalanan atau di akhir?"
      a: "Keduanya bisa. Setiap pembayaran yang dicatat mengubah saldo, jadi pembayaran di tengah perjalanan ikut dihitung dalam daftar akhir. Di akhir lebih sederhana, karena [seluruh perjalanan](page:use-case/group-trips) ada di satu tempat."
