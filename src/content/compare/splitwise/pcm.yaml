faq:
  heading: "Question dem"
  items:
    - q: "Side Badger na free alternative to Splitwise?"
      a: "To share bills for group, yes. Receipt scanning, currency conversion and no ads free, with no daily limits. If you need native app, offline use, recurring expenses or payments inside di app, Splitwise dey do dose ones and Side Badger no dey do dem."
    - q: "Where di Splitwise details come from?"
      a: "Splitwise own pages: im home page, im Pro page and im help centre. Each row of di table link to di page wey e come from, and di date wey dey above di table talk when we read dem. We dey check dem every quarter."
    - q: "Side Badger go stay free?"
      a: "Everything for Side Badger free today, and no paid tier dey. If dat one ever change, we go give you notice first. Di [pricing page](page:pricing) get di details."
    - q: "Everybody for my group must switch?"
      a: "Yes. Everybody for group need free Side Badger account, and dem fit join with link or QR code."
    - q: "Side Badger get mobile app?"
      a: "No for app store. E dey run for your browser: sign in for your phone, then add am to your home screen so e go open like an app. [How e dey work](page:how-it-works) show how."
