sections:
  - heading: "Komentáře a reakce, vedle čísel"
    body: "Každý výdaj má své vlákno komentářů, stejně tak skupina, každý seznam i každé hlasování. Zeptejte se, proč taxík stál tolik, přímo pod taxíkem, ne v chatu, ke kterému se nikdo nevrací. Přidejte fotku účtenky nebo PDF s rezervací a pak zareagujte palcem nahoru, srdcem, smíchem, údivem, smutkem nebo oslavou u výdajů, plateb a komentářů. Oslavte platbu, když dorazí. Blíž k potlesku se Side Badger nedostane."
  - heading: "Zpochybněte výdaj bez hádky"
    body: "Když má skupina zapnuté dotazy k výdajům, může kdokoli, koho se výdaj týká, zvolit **Mám dotaz** a říct proč. Dotaz se zveřejní jako komentář k výdaji, výdaj dostane štítek **Zpochybněno** a celý výdaj vypadne ze zůstatků všech, dokud se dotaz nevyřeší."
    items:
      - "**Zapnutí.** Ve výchozím stavu je vypnuto. Administrátor zapne **Povolit dotazy k výdajům** v nastavení skupiny, v části **Funkce**."
      - "**Uzavření.** Ten, kdo se ptal, nebo administrátor zvolí **Uzavřít dotaz**. Pokud stejný výdaj zpochybnilo víc lidí, vrátí se do zůstatků, až se uzavře poslední dotaz."
      - "**Úprava.** Když se výdaj upraví, otevřený dotaz se přenese na novou verzi pro každého, kdo v něm pořád má podíl. U toho, koho úprava vynechá, dotaz končí se starou verzí, takže mu nezbývá nic k uzavření."
      - "**Hledání.** Seznam výdajů má filtr **Pouze zpochybněno**. Není to schvalovací krok: zadrženy jsou jen výdaje, které někdo zpochybní, a všechno ostatní se počítá, hned jak je přidáno."
  - heading: "Jak dotaz probíhá"
    body: "Tom přidá 45 £ za víno na večírek, rozdělené mezi všechny tři spolubydlící. Aisha nepila, takže vznese dotaz a dokud je otevřený, víno se nepočítá nikomu. Dům se shodne, že víno je Tomovo a Priyino, a Tom rozdělení upraví na ně dva. Aisha už ve výdaji není, takže její dotaz končí u dřívější verze, která se uchová, a víno se okamžitě vrací do zůstatků po 22,50 £ místo po 15 £. Kdyby Aisha ve výdaji zůstala, její dotaz by se přenesl a čekal, až ho uzavře ona nebo administrátor. Níže Aisha dluží 48 £, což je 28 £ z nákupu a 20 £ z úklidu, a Priya dluží 10,50 £, což je její podíl 70,50 £ (28 £, 20 £ a 22,50 £) minus 60 £, které zaplatila. Přesně ten druh hádky, jaký znají [spolubydlící](page:use-case/housemates). Jak dotaz formulovat, najdete v návodu [co dělat, když někdo zpochybní sdílený výdaj](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Sdílené seznamy, na nákup"
    body: "Založte ve skupině seznam, pojmenujte ho třeba Nákupní seznam, přidávejte položky a odškrtávejte je. Přetažením změňte pořadí, sledujte, jak roste počet hotových, a seznam okomentujte, když někdo koupí špatné ovesné mléko. Hotový seznam uklidíte archivací (**Zobrazit archivované** ho vrátí) nebo seznam zkopírujete a použijete znovu. Sdílený nákupní seznam držte vedle účtů za nákupy, aby seznam říkal, co koupit, a výdaj, kolik to stálo. Kdo smí seznamy vytvářet a upravovat, závisí na oprávněních skupiny, což vysvětluje stránka [skupiny a oprávnění](page:feature/groups-and-permissions)."
  - heading: "Hlasování, na přání anonymní"
    body: "Zeptejte se skupiny na něco, co rozhoduje o účtu, třeba která vila, kolik utratit za dárek nebo jestli stojí výlet lodí za to. Hlasování má otázku a dvě až deset možností. Sami zvolíte, kolik hlasů má každý člověk, od jedné volby až po deset, a zda je hlasování anonymní. **Anonymní hlasování** skryje, kdo pro co hlasoval, a po prvním hlasu už ho nelze změnit. Lidé mohou svůj hlas změnit nebo odebrat, dokud se hlasování neuzavře, a pokud skupina změní názor, můžete ho znovu otevřít. Výběr vily je přesně to, z čeho se skládají [skupinové výlety](page:use-case/group-trips), a domluva na rozpočtu dárku je klasika pro [akce a oslavy](page:use-case/events-and-celebrations)."
  - heading: "Aktivita skupiny, aby se nic nezměnilo potichu"
    body: "Každá skupina má historii aktivity a zvonek oznámení sbírá aktivitu ze všech vašich skupin na jednom místě. Přidáte výdaj a všichni ho hned vidí, bez obnovování stránky, a aktivita ukazuje, co se změnilo a kdo to změnil. To zahrnuje přidané, upravené nebo smazané výdaje, vznesené a uzavřené dotazy, komentáře, změny seznamů a hlasování a zaznamenané platby."
  - heading: "Push oznámení, pokud je chcete"
    body: "Push oznámení jsou volitelná. Zapněte je v **Nastavení** účtu, v části **Oznámení**, a vaše zařízení vám dá vědět, když ve vašich skupinách vznikne nová aktivita, třeba nový výdaj nebo komentář. Každé zařízení se zapíná zvlášť a prohlížeč se nejdřív zeptá na povolení. Na iPhonu nebo iPadu fungují jen v aplikaci přidané na plochu, což vysvětluje stránka o [webové aplikaci](page:feature/web-app). Berte je jako pohodlí, ne jako slib, protože doručení není zaručeno."
limits:
  heading: "Omezení"
  items:
    - "Komentáře, seznamy a hlasování jsou pro peníze skupiny. [Podmínky služby](page:terms) žádají, aby všechno, co zveřejníte, souviselo s financemi skupiny, takže je to místo pro plánování výdajů, ne obecný chat ani aplikace na úkoly."
    - "Komentář může mít až 500 znaků a až tři přílohy, které jsou obrázky nebo PDF do 5 MB každá. Komentář může smazat jen jeho autor."
    - "Dotazy k výdajům jsou ve výchozím stavu vypnuté a administrátor je zapíná pro každou skupinu zvlášť. Výdaj mohou zpochybnit jen lidé, kteří jsou v něm zahrnuti, vypnutím funkce se smažou všechny otevřené dotazy a nikdo nemůže skupinu opustit, dokud má výdaj, jehož je součástí, otevřený dotaz."
    - "Skupina může mít až 100 seznamů, každý s až 200 položkami o délce až 500 znaků. Oprávnění skupiny určují, kdo může seznamy vytvářet, upravovat a mazat, a uzamčená skupina žádné změny nepovoluje."
    - "Skupina může mít až 50 hlasování, každé se dvěma až deseti možnostmi a až deseti hlasy na člověka. Hlasování nemají žádnou lhůtu a samy se neuzavírají."
    - "Historie aktivity se uchovává 90 dní."
    - "Push oznámení jsou volitelná pro každý účet a každé zařízení. Vyžadují prohlížeč, který je podporuje, a vaše povolení, na iPhonu a iPadu fungují jen z aplikace přidané na plochu a doručení není zaručeno. Neexistují žádná e-mailová ani SMS upozornění na aktivitu a žádné připomínky plateb, takže vymáhání platby zůstává na vás."
useCasesHeading: "Kde pomáhá plánovat spolu"
faq:
  heading: "Otázky"
  items:
    - q: "Mohou být hlasy anonymní?"
      a: "Ano. Při vytváření hlasování zapněte **Anonymní hlasování** a skryje, kdo pro co hlasoval. Rozhodněte se před prvním hlasem, protože to pak nelze změnit."
    - q: "Může se hlasování uzavřít samo?"
      a: "Ne. Hlasování nemá lhůtu, takže ten, kdo ho vytvořil, zvolí **Uzavřít hlasování**, jakmile se skupina rozhodne. Když skupina změní názor, **Znovu otevřít hlasování** ho vrátí."
    - q: "Kolik položek může seznam obsahovat?"
      a: "Až 200 položek na seznam a až 100 seznamů na skupinu. Každá položka může mít až 500 znaků, což je spousta ovesného mléka."
    - q: "Kdo může uzavřít dotaz a co se mezitím děje s výdajem?"
      a: "Ten, kdo se ptal, nebo administrátor skupiny. Dokud je dotaz otevřený, celý výdaj je mimo zůstatky všech. Vrací se, když se uzavře poslední otevřený dotaz k němu, nebo když úprava vyřadí z výdaje člověka, který se ptal."
    - q: "Mohu seznamy a komentáře používat jako aplikaci na úkoly nebo skupinový chat?"
      a: "Ne. Komentáře, seznamy a hlasování jsou pro peníze skupiny, což žádají [podmínky služby](page:terms). Myslete na nákupní seznamy, rozpočtová hlasování a „proč je tohle 45 £?“."
    - q: "Bude mi Side Badger psát e-mailem o aktivitě?"
      a: "Ne. Žádná e-mailová ani SMS upozornění na aktivitu neexistují. Push oznámení můžete zapnout na každém zařízení a zvonek oznámení v aplikaci ukazuje, co je nového."
