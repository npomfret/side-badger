faq:
  heading: "Kérdések"
  items:
    - q: "Megkérdőjelezhetem csak a saját részemet?"
      a: "Nem. Egy kérdés az egész költséget kiveszi, mindenkinek, aki benne van. Ha csak a felosztás rossz, a megoldás a felosztás szerkesztése."
    - q: "Ki zárhat le egy kérdést?"
      a: "Aki feltette, vagy egy csoportadminisztrátor. Ha a költséget felvivő személy nem adminisztrátor, nem zárhatja le a kérdező helyett."
    - q: "A szerkesztés törli az eredetit?"
      a: "Nem. A korábbi változat megmarad. Hogy ki szerkeszthet, a csoport jogosultságai döntik el, ezért érdemes előbb szólni a háznak, mert az egyenlegek változnak."
