sections:
  - heading: "Catat pembayaran"
    body: "Saat seseorang membayar, catat untuk orang yang tepat. Tombol lunasi cepat mengisi jumlah dari pembayaran yang disarankan, dan Anda bisa menambahkan catatan seperti \"transfer bank\" (hingga 500 karakter). Bayar hanya sebagian dari utang Anda dan sisanya tetap di saldo. Jika Anda memasukkan terlalu sedikit atau terlalu banyak, Side Badger memperingatkan sebelum Anda menyimpan. Mencatat pembayaran memerlukan izin untuk mengubah pengeluaran, dan tanggalnya tidak boleh di masa depan."
  - heading: "Dibayar dalam mata uang lain?"
    body: "Saldo tetap dalam mata uang saat dibayarkan, jadi utang euro tetap utang euro. Berutang euro, membayar dalam pound? Konversikan pembayarannya saat memasukkan, dengan kurs terkini atau kurs yang benar-benar Anda dapatkan. Kurs ditetapkan saat pembayaran disimpan. [Beberapa mata uang](page:feature/multiple-currencies) menjelaskan cara kerja konversi, dan [perjalanan grup](page:use-case/group-trips) menunjukkan penggunaannya."
  - heading: "Riwayat yang bisa Anda periksa"
    body: "Setiap pembayaran yang dicatat tetap ada di riwayat grup dengan tanggal, jumlah, dan catatannya. Hanya orang yang mencatat pembayaran yang bisa mengubahnya, dan mereka atau admin grup bisa menghapusnya. Pembayaran yang melibatkan orang yang sudah keluar dari grup dikunci. Untuk skenario teman serumah yang lengkap, lihat [teman serumah](page:use-case/housemates)."
limits:
  heading: "Yang tidak dilakukan Side Badger"
  items:
    - "Side Badger tidak memindahkan uang, mengirim tautan pembayaran, atau mengirim permintaan pembayaran. Pembayaran di aplikasi adalah catatan pembayaran yang dilakukan di tempat lain."
    - "Pembayaran yang disarankan berasal dari metode pencocokan sederhana, yang diterapkan per mata uang. Selalu disarankan lebih sedikit pembayaran daripada jumlah orang yang memiliki saldo dalam mata uang itu (empat orang, paling banyak tiga pembayaran), tetapi tidak selalu menemukan jumlah yang paling kecil."
    - "Anda tidak bisa mematikan saran. **Tampilkan semua** mencantumkan setiap pembayaran yang disarankan di grup, bukan hanya milik Anda."
    - "Mata uang tidak pernah dikurangkan satu sama lain kecuali pengeluarannya dikonversi saat dimasukkan."
    - "Tidak ada pengingat, jadi menagih pembayaran tetap urusan Anda."
useCasesHeading: "Di mana pelunasan penting"
faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah Side Badger mengirim uangnya?"
      a: "Tidak. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya di Side Badger agar saldo diperbarui."
    - q: "Bisakah saya mematikan pembayaran yang disarankan?"
      a: "Tidak. Penyederhanaan tetap aktif, dan **Tampilkan semua** mencantumkan setiap pembayaran yang disarankan di grup, bukan hanya yang melibatkan Anda."
    - q: "Mengapa euro dan pound dipisahkan?"
      a: "Saldo tetap dalam mata uang yang Anda gunakan untuk membayar kecuali Anda mengonversi saat memasukkan pengeluaran atau pembayaran. Utang dalam mata uang berbeda tidak pernah dikurangkan satu sama lain."
    - q: "Bagaimana jika seseorang hanya membayar sebagian dari utangnya?"
      a: "Catat bagian yang dibayarkan. Sisanya tetap di saldo sampai dibayar."
    - q: "Apakah ini selalu jumlah pembayaran paling sedikit yang mungkin?"
      a: "Tidak dijamin. Selalu disarankan lebih sedikit pembayaran daripada jumlah orang yang memiliki saldo dalam mata uang itu, jadi untuk empat orang tidak pernah lebih dari tiga. Pada contoh teman serumah, itu dua pembayaran, sedangkan membayar kembali tiap orang secara langsung memerlukan enam."
