meta:
  title: "గ్రూప్ ఖర్చులకు ఉమ్మడి జాబితాలు, పోల్స్ | Side Badger"
  description: "ఖర్చులపై కామెంట్ చేయండి, అనుమానం ఉన్నదాన్ని ప్రశ్నించండి, ఉమ్మడి సరుకుల జాబితా ఉంచండి, విల్లాపై ఓటు వేయండి. ఖర్చును కలిసి ప్లాన్ చేయండి, తర్వాత పంచండి. ఉచితం, ప్రకటనలు లేవు."
h1: "కలిసి ప్లాన్ చేయండి, తర్వాత పంచండి"
navLabel: "కలిసి ప్లాన్ చేయండి"
lead: "సరుకుల జాబితా, సరుకుల బిల్లు, చివరికి మాటలు కలిశాయి. ఖర్చు చేయడానికి ముందు, తర్వాత డబ్బు గురించి మాట్లాడుకోవడానికి Side Badger మీ గ్రూప్‌కు ఒక చోటు ఇస్తుంది: ప్రతి ఖర్చుపై కామెంట్లు, తప్పుగా కనిపించేవాటిని ప్రశ్నించే మార్గం, పెద్ద నిర్ణయాలకు ఉమ్మడి జాబితాలు, పోల్స్. తర్వాత మామూలుగా [ఖర్చులను పంచండి](page:feature/split-expenses)."
cta:
  heading: "ప్లాన్ చేయండి, తర్వాత పంచండి"
  body: "ఉచిత ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి జాబితా, పోల్ లేదా ప్రశ్నను డబ్బు పక్కనే పెట్టండి. తర్వాత ఏం జరుగుతుందో తెలియదా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) చూడండి."
problem:
  heading: "చాట్ ఒక చోట, బిల్లు ఇంకో చోట"
  body: "గ్రూప్ ఖర్చు సాధారణంగా రెండు చోట్ల ఉంటుంది. అంకెలు ఒక చోట, ఆ అంకెల గురించిన వాదన మంగళవారమే పైకి జారిపోయిన చాట్‌లో. సరుకుల జాబితా ఒక ఫ్రిజ్ ఫోటో. విల్లాను చాలామంది వేసిన థంబ్స్-అప్‌తో నిర్ణయించారు, బహుశా. Side Badger ప్లానింగ్‌ను గ్రూప్‌లోనే, అది సంబంధించిన ఖర్చుల పక్కనే ఉంచుతుంది: ఖర్చు ఉన్న చోట కామెంట్, షాపింగ్ ఉన్న చోట జాబితా, పెద్ద నిర్ణయానికి పోల్, ఒక పేరా రాయకుండా “ఆగండి, ఇది సరైనదేనా?” అనడానికి ఒక మార్గం. ఇవన్నీ గ్రూప్ డబ్బు గురించే ఉంటాయి, గ్రూప్ ఉన్నది అందుకే."
workflow:
  heading: "విల్లా ఓటు నుండి సరుకుల బిల్లు వరకు"
  steps:
    - title: "పెద్ద నిర్ణయాన్ని ఓటుకు పెట్టండి"
      body: "బిల్లును నిర్ణయించే విషయానికి, ఏ విల్లా లాంటి దానికి, పోల్ జోడించండి. రెండు నుండి పది ఎంపికలు పెట్టండి, ప్రతి వ్యక్తికి ఎన్ని ఓట్లో చెప్పండి, అందరూ వేశాక పోల్‌ను ముగించండి, గెలిచినది గుర్తు పడుతుంది."
      shot: S17
      shotAlt: "గెలిచిన ఎంపిక గుర్తుతో, ప్రతి ఎంపిక పక్కన ఓట్ల సంఖ్యతో ముగిసిన పోల్"
    - title: "సరుకుల జాబితాను కలిసి రాయండి"
      body: "ఉమ్మడి జాబితా మొదలుపెట్టండి, వస్తువులు జోడించండి, ట్రాలీలోకి చేరినప్పుడు టిక్ చేయండి. షాపింగ్ తర్వాత ఖర్చుగా నమోదవుతుంది."
      shot: S16
      shotAlt: "కొన్ని వస్తువులు టిక్ చేసి, పురోగతి లెక్కతో ఉమ్మడి సరుకుల జాబితా"
    - title: "ఖర్చు ఉన్న చోటే దాని గురించి మాట్లాడండి"
      body: "ఖర్చుపైనే కామెంట్ చేయండి, రసీదు జోడించండి, ఎమోజీతో రియాక్ట్ అవ్వండి. సంభాషణ అది సంబంధించిన అంకె పక్కనే ఉంటుంది."
      shot: S08
      shotAlt: "వివరాలు, రసీదు థంబ్‌నెయిల్, కామెంట్ థ్రెడ్, ఎమోజీ రియాక్షన్లతో ఒక ఖర్చు"
    - title: "తేడాగా అనిపించిన దాన్ని ప్రశ్నించండి"
      body: "గ్రూప్ ఖర్చు ప్రశ్నలను ఆన్ చేసి ఉంటే, ఒక ఖర్చులో ఉన్న ఎవరైనా **నాకు ఒక ప్రశ్న ఉంది** ఎంచుకోవచ్చు. ప్రశ్న తేలే వరకు ఆ ఖర్చు బ్యాలెన్స్‌ల నుండి బయటే ఉంటుంది."
      shot: S18
      shotAlt: "ప్రశ్నించబడింది బ్యాడ్జ్, ప్రశ్నించబడినవి మాత్రమే ఫిల్టర్‌తో ఖర్చుల జాబితా"
    - title: "ఏం మారిందో, ఎవరు మార్చారో చూడండి"
      body: "యాక్టివిటీ ఫీడ్, నోటిఫికేషన్ల బెల్ మీ గ్రూప్‌లన్నింటిలో కొత్తగా ఏముందో చూపుతాయి. మీకు కావాలంటే పుష్ నోటిఫికేషన్లు కూడా ఉన్నాయి."
      shot: S19
      shotAlt: "ఇటీవలి కార్యకలాపాల జాబితాతో నోటిఫికేషన్ల డ్రాప్‌డౌన్"
