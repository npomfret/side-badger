sections:
  - heading: Κουβέντα για λεφτά, δίπλα στα λεφτά
    body: Τα κοινά χρήματα φέρνουν πολλή κουβέντα, αμφιβολίες και σχέδια. Το Side Badger τα κρατά και τα τρία δίπλα στους αριθμούς, ώστε κανείς να μη χρειάζεται να γυρνά πίσω στο group chat.
    items:
      - "**Σχόλια εκεί που ανήκουν.** Σχολιάστε την ίδια την ομάδα ή οποιοδήποτε έξοδο, λίστα ή ψηφοφορία, και κρατήστε τη συζήτηση δίπλα σε αυτό που αφορά."
      - "**Αποδείξεις και φωτογραφίες.** Κρατήστε έως τρεις αποδείξεις σε κάθε έξοδο και προσθέστε φωτογραφίες ή PDF στα σχόλια της ομάδας, μιας λίστας ή μιας ψηφοφορίας."
      - "**Ερωτήσεις, όχι καβγάδες.** Ένας διαχειριστής μπορεί να ενεργοποιήσει τις ερωτήσεις και τότε όποιος συμμετέχει σε ένα έξοδο μπορεί να ρωτήσει γι' αυτό. Μένει εκτός των υπολοίπων μέχρι να ξεκαθαρίσει."
      - "**Λίστες και ψηφοφορίες.** Κρατήστε την κοινή λίστα για ψώνια δίπλα στους λογαριασμούς των ψωνιών και βάλτε σε ψηφοφορία τη σύντομη λίστα με τις βίλες, ανώνυμα αν θέλετε."
      - "**Λίγο χειροκρότημα.** Αντιδράστε σε έξοδα, πληρωμές και σχόλια και γιορτάστε μια πληρωμή όταν φτάσει."
  - heading: Η ομάδα σας, οι κανόνες σας
    body: Το κέντρο βοήθειας του Splitwise λέει ότι δεν υποστηρίζει διαχειριστές ομάδας ούτε ειδικά δικαιώματα. Το Side Badger έχει ρόλους και δικαιώματα, για τις ομάδες που χρειάζονται κάποιον να κρατά τους αριθμούς τακτοποιημένους.
    items:
      - "**Διαχειριστές, μέλη και θεατές.** Κάντε κάποιον θεατή: βλέπει τα πάντα και δεν αλλάζει τίποτα."
      - "**Δύο προεπιλογές, ή τα δικά σας.** Ξεκινήστε με Ανοιχτή συνεργασία ή Διαχειριζόμενη ομάδα, ή ορίστε μόνοι σας κάθε δικαίωμα: ποιος επεξεργάζεται και διαγράφει έξοδα, επεξεργάζεται λίστες, προσκαλεί και αφήνει νέα άτομα να μπουν."
      - "**Έγκριση για να μπουν.** Ενεργοποιήστε την έγκριση και ένας διαχειριστής αφήνει κάθε άτομο να μπει."
      - "**Οι ρυθμίσεις της ίδιας της ομάδας.** Περιορίστε την στα νομίσματα που πραγματικά χρησιμοποιείτε, διαλέξτε το προεπιλεγμένο νόμισμά της και δώστε της μια εικόνα κεφαλίδας."
      - "**Κλειδώστε την όταν τελειώσει.** Οι αριθμοί μένουν όπως είναι μέχρι να την ξεκλειδώσει ένας διαχειριστής."
  - heading: Δωρεάν εδώ, επί πληρωμή εκεί
    body: Το Splitwise Pro είναι το επί πληρωμή πλάνο του Splitwise και η δική του σελίδα Pro πουλά τρία πράγματα που δεν κοστίζουν τίποτα στο Side Badger.
    items:
      - "**Σάρωση αποδείξεων.** Το Splitwise Pro σαρώνει μια φωτογραφία της απόδειξής σας. Το Side Badger το κάνει δωρεάν, χωρίς πιστώσεις σάρωσης: συμπληρώνει το σύνολο, την ημερομηνία και το μέρος για να τα ελέγξετε."
      - "**Μετατροπή νομισμάτων.** Το Splitwise Pro μετατρέπει τα έξοδα μιας ομάδας στο προεπιλεγμένο σας νόμισμα όταν πατήσετε «Convert». Το Side Badger μετατρέπει κάθε έξοδο καθώς το καταχωρίζετε, με μια τρέχουσα συναλλαγματική ισοτιμία ή με αυτήν που πήρατε πραγματικά, και το αρχικό ποσό μένει στο έξοδο."
      - "**Χωρίς ημερήσια όρια.** Το Splitwise Pro πουλά απεριόριστα έξοδα και το κέντρο βοήθειάς του λέει ότι οι δωρεάν χρήστες μπορούν να προσθέτουν έως 4 έξοδα την ημέρα. Το Side Badger δεν έχει ημερήσια όρια."
  - heading: Η τράπεζά σας μένει έξω
    body: Το Side Badger δεν συνδέεται με την τράπεζά σας και δεν ζητά τα τραπεζικά σας στοιχεία. Κρατά το αρχείο του ποιος χρωστά σε ποιον· πληρώνετε ο ένας τον άλλον όπως θέλετε και μετά καταγράφετε την πληρωμή. Κανένα τραπεζικό στοιχείο σύνδεσης να παραδώσετε, άρα ένα πράγμα λιγότερο να φυλάτε.
  - heading: Μία εφαρμογή, στο πρόγραμμα περιήγησης και στο κινητό
    body: Το Side Badger τρέχει στο πρόγραμμα περιήγησής σας. Συνδεθείτε, προσθέστε το στην αρχική οθόνη και ανοίγει σαν εφαρμογή. Είναι η ίδια εφαρμογή και στις δύο περιπτώσεις, οπότε μια νέα λειτουργία βρίσκεται στο κινητό σας την επόμενη φορά που θα το ανοίξετε, χωρίς ενημέρωση από το κατάστημα εφαρμογών να περιμένετε.
  - heading: Και μερικές ευχάριστες εκπλήξεις
    items:
      - "**Ρωτήστε τον βοηθό σας.** Το Side Badger δουλεύει με το ChatGPT και το Claude: ζητήστε από τον δικό σας να προσθέσει ένα έξοδο, να σαρώσει μια απόδειξη ή να καταγράψει μια πληρωμή."
      - "**Ο καθένας στη δική του γλώσσα.** Το Side Badger μιλά 39 γλώσσες και ο καθένας διαλέγει τη δική του. Η αρχική σελίδα του Splitwise λέει 7+. Χειρίζεται και 133 νομίσματα, για το ταξίδι που πάει παντού."
      - "**Βοήθεια χωρίς να φύγετε από την εφαρμογή.** Κολλήσατε ή βρήκατε κάποιο σφάλμα; Πείτε το μας από την εφαρμογή και διαβάστε την απάντησή μας ακριβώς εκεί."
  - heading: Εκεί που το Splitwise κερδίζει ακόμα
    body: Προτιμούμε να διαλέξετε τη σωστή εφαρμογή παρά να το ανακαλύψετε αργότερα. Αν η ομάδα σας χρειάζεται κάτι από αυτά, το Splitwise το έχει και το Side Badger όχι.
    items:
      - "**Εφαρμογές από κατάστημα εφαρμογών.** Το Side Badger ζει στο πρόγραμμα περιήγησής σας και στην αρχική οθόνη σας, όχι στα καταστήματα εφαρμογών."
      - "**Λειτουργία χωρίς σύνδεση.** Το Side Badger χρειάζεται σύνδεση."
      - "**Πληρωμές στην εφαρμογή.** Σε ορισμένες χώρες το Splitwise μπορεί να μετακινήσει και τα χρήματα. Το Side Badger κρατά μόνο το αρχείο."
      - "**Διαχωρισμός με μερίδια ή ανά είδος.** Το Side Badger έχει έναν πληρωτή ανά έξοδο, που χωρίζεται εξίσου, με ακριβή ποσά ή με ποσοστά. Η σάρωση αποδείξεών του δεν αναθέτει είδη σε άτομα."
      - "**Γραφήματα και προεπιλεγμένοι διαχωρισμοί.** Το Splitwise Pro έχει και τα δύο. Το Side Badger κρατά τον λογαριασμό ποιος χρωστά σε ποιον, και αυτό είναι όλο το κόλπο."
  - heading: Πώς μεταφέρετε την ομάδα σας
    body: Δεν υπάρχει εργαλείο εισαγωγής, οπότε η μετακίνηση σημαίνει νέα αρχή. Κλείστε πρώτα τους λογαριασμούς στο Splitwise, μετά δημιουργήστε μια ομάδα στο Side Badger και προσκαλέστε όλους με σύνδεσμο ή κωδικό QR. Ο καθένας στην ομάδα χρειάζεται δωρεάν λογαριασμό και για την εγγραφή αρκεί μια διεύθυνση email.
table:
  heading: Δίπλα δίπλα
  caption: Στοιχεία του Splitwise στις {date}, από τις δικές του σελίδες.
  sourceLabel: Πηγή
  columns:
    feature: Τι
    other: Splitwise, σύμφωνα με τις δικές του σελίδες
    sideBadger: Side Badger
  rows:
    - feature: Πόσο κοστίζει
      other: Το Splitwise Pro είναι μηνιαία ή ετήσια συνδρομή. Τα ετήσια πλάνα περιλαμβάνουν ένα Trip Pass, που δίνει σε μια ομάδα ταξιδιού τις λειτουργίες Pro για 30 ημέρες.
      sideBadger: Δωρεάν.
      source: pro-help
    - feature: Έξοδα ανά ημέρα
      other: Το κέντρο βοήθειάς του λέει ότι οι δωρεάν χρήστες μπορούν να προσθέτουν έως 4 έξοδα την ημέρα. Το Pro δεν έχει ημερήσιο όριο.
      sideBadger: Χωρίς ημερήσια όρια.
      source: pro-help
    - feature: Ρόλοι και δικαιώματα ομάδας
      other: Το κέντρο βοήθειάς του λέει ότι δεν υποστηρίζει διαχειριστές ομάδας ούτε ειδικά δικαιώματα.
      sideBadger: Διαχειριστές, μέλη και θεατές. Δύο προεπιλογές ή δικά σας δικαιώματα, έγκριση για να μπει κάποιος και κλείδωμα για όταν τελειώσει.
      source: permissions-help
    - feature: Σάρωση αποδείξεων
      other: Λειτουργία του Pro. Σαρώνει μια φωτογραφία απόδειξης και ο διαχωρισμός ανά είδος του Pro σάς επιτρέπει να αναθέτετε τα είδη σε άτομα.
      sideBadger: Δωρεάν, χωρίς πιστώσεις σάρωσης. Συμπληρώνει το σύνολο, την ημερομηνία και το μέρος για να τα ελέγξετε και δεν αναθέτει είδη σε άτομα.
      source: pro
    - feature: Μετατροπή νομισμάτων
      other: Λειτουργία του Pro. Πατάτε «Convert» και το Splitwise μετατρέπει τα έξοδα μιας ομάδας στο προεπιλεγμένο σας νόμισμα με την ισοτιμία της στιγμής εκείνης.
      sideBadger: Δωρεάν. Μετατρέψτε κάθε έξοδο καθώς το καταχωρίζετε, με μια τρέχουσα συναλλαγματική ισοτιμία ή με αυτήν που πήρατε πραγματικά. Το αρχικό ποσό μένει στο έξοδο.
      source: currencies-help
    - feature: Νομίσματα και γλώσσες
      other: 100+ νομίσματα και 7+ γλώσσες, όπως τα διατυπώνει η αρχική του σελίδα.
      sideBadger: 133 νομίσματα και 39 γλώσσες. Ο καθένας στην ομάδα μπορεί να διαλέξει τη δική του γλώσσα.
      source: home
    - feature: Πού το χρησιμοποιείτε
      other: Εφαρμογές για iPhone και Android, και το web.
      sideBadger: Στο πρόγραμμα περιήγησής σας. Συνδεθείτε και μετά προσθέστε το στην αρχική οθόνη και ανοίγει σαν εφαρμογή. Όχι στα καταστήματα εφαρμογών.
      source: home
    - feature: Τρόποι διαχωρισμού
      other: Εξίσου, με ακριβή ποσά, με ποσοστά, με μερίδια, με προσαρμογή ή ανά είδος.
      sideBadger: Εξίσου, με ακριβή ποσά ή με ποσοστά, με έναν πληρωτή ανά έξοδο. Όχι με μερίδια ούτε ανά είδος.
      source: split-help
    - feature: Χρήση χωρίς σύνδεση
      other: Παραθέτει λειτουργία χωρίς σύνδεση ανάμεσα στις βασικές του λειτουργίες.
      sideBadger: Όχι. Χρειάζεται σύνδεση.
      source: home
    - feature: Πληρωμές και η τράπεζά σας
      other: "Σε ορισμένα μέρη μπορεί να στείλει χρήματα μέσα από την εφαρμογή: Splitwise Pay στις ΗΠΑ, Venmo για υπόλοιπα σε δολάρια ΗΠΑ, PayPal και Pay by Bank σε επιλεγμένες ευρωπαϊκές χώρες, που συνδέει έναν προσωπικό τρεχούμενο λογαριασμό."
      sideBadger: Δεν αγγίζει ποτέ τα χρήματά σας και δεν ζητά τα τραπεζικά σας στοιχεία. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή.
      source: payments-help
    - feature: Γραφήματα και προεπιλεγμένοι διαχωρισμοί
      other: Και τα δύο είναι λειτουργίες του Pro.
      sideBadger: Κανένα από τα δύο.
      source: pro
faq:
  heading: Ερωτήσεις
  items:
    - q: Είναι το Side Badger δωρεάν εναλλακτική του Splitwise;
      a: "Για το μοίρασμα λογαριασμών σε μια ομάδα, ναι, και κάνει περισσότερα από τα μαθηματικά: σχόλια, ερωτήσεις, λίστες, ψηφοφορίες και ρόλους ομάδας, με δωρεάν σάρωση αποδείξεων και μετατροπή νομισμάτων. Αν χρειάζεστε εφαρμογή από κατάστημα εφαρμογών, χρήση χωρίς σύνδεση ή πληρωμές μέσα στην εφαρμογή, αυτά τα κάνει το Splitwise και όχι το Side Badger."
    - q: Από πού προέρχονται τα στοιχεία για το Splitwise;
      a: "Από τις δικές του σελίδες: την αρχική του σελίδα, τη σελίδα Pro και το κέντρο βοήθειάς του. Κάθε γραμμή του πίνακα παραπέμπει στη σελίδα από την οποία προήλθε και η ημερομηνία πάνω από τον πίνακα λέει πότε τις διαβάσαμε. Τις ελέγχουμε κάθε τρίμηνο."
    - q: Θα μείνει δωρεάν το Side Badger;
      a: Τα πάντα στο Side Badger είναι σήμερα δωρεάν. Αν αυτό αλλάξει ποτέ, θα σας ειδοποιήσουμε πρώτα. Η [σελίδα τιμών](page:pricing) έχει τις λεπτομέρειες.
    - q: Πρέπει να αλλάξουν όλοι στην ομάδα μου;
      a: Ναι. Ο καθένας σε μια ομάδα χρειάζεται δωρεάν λογαριασμό στο Side Badger και μπορεί να μπει με σύνδεσμο ή κωδικό QR.
    - q: Έχει το Side Badger εφαρμογή για κινητό;
      a: "Όχι σε κατάστημα εφαρμογών. Τρέχει στο πρόγραμμα περιήγησής σας: συνδεθείτε στο τηλέφωνό σας και μετά προσθέστε το στην αρχική οθόνη ώστε να ανοίγει σαν εφαρμογή. Το [πώς λειτουργεί](page:how-it-works) δείχνει πώς."
