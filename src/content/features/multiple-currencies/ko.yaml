      JPY: 0.005
sections:
  - heading: "그룹 전체를 한 통화로"
    body: "그룹이 신경 쓰고 싶지 않다면 그룹 통화를 정하세요. 폼이 새 지출을 그 통화로 환산하며, 환율은 여전히 직접 보고 바꿀 수 있습니다. 이는 새 지출과 복사한 지출에만 적용됩니다. 수정이나 기존 지출은 그대로 두므로, 이미 기록된 내용이 갑자기 바뀌는 일은 없습니다."
  - heading: "유로를 줘야 하는데, 파운드로 지불하기"
    body: "엔으로 결제하고 파운드로 정산하나요? 괜찮습니다. 결제를 기록할 때 그 결제도 환산할 수 있어서, 유로를 줘야 하는 사람이 파운드로 지불해도 유로 잔액은 제대로 맞습니다. 원하는 방법으로 서로 지불한 다음 기록하세요."
  - heading: "그룹 규칙"
    body: "그룹이 실제로 쓰는 통화로 제한하고, 폼이 알맞은 통화로 열리도록 기본값을 정하세요. 포르투갈 휴가에 저녁 계산서 옆으로 나머지 139개 선택지는 필요 없고, [해외 결혼식](page:use-case/events-and-celebrations)이라면 아마 두 개면 충분합니다."
limits:
  heading: "한도"
  items:
    - "환율은 지출을 저장할 때 고정됩니다. 이전 지출은 절대 재평가되지 않습니다."
    - "사이드 배저는 가능한 경우 현재 환율을 가져옵니다. 모든 통화 쌍에 환율이 있다고 보장하지는 않으며, 환율은 언제든 직접 입력할 수 있습니다."
    - "그룹 자동 환산은 새 지출과 복사한 지출에만 적용되고, 수정이나 기존 지출에는 적용되지 않습니다."
    - "지출은 해당 통화로 최대 999,999.99까지입니다."
    - "통화는 140개입니다. 암호화폐와 금속은 포함되지 않습니다."
    - "사이드 배저는 결제를 기록합니다. 돈을 옮기거나 환전하지 않습니다."
useCasesHeading: "도움이 되는 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "어떤 환율을 사용하나요?"
      a: "현재 환율을 사용하며, 지출을 입력할 때 제공되는 경우 가져옵니다. 실제로 적용받은 환율로 바꿀 수 있고, 환산 금액이 업데이트됩니다."
    - q: "이전 지출도 재평가되나요?"
      a: "아니요. 환율은 지출을 저장할 때 고정되므로, 시장이 움직여도 잔액이 변하지 않습니다."
    - q: "암호화폐를 지원하나요?"
      a: "아니요. 통화는 140개이며 암호화폐는 포함되지 않습니다."
    - q: "인도네시아 루피아 2,000,000을 왜 입력할 수 없나요?"
      a: "지출은 해당 통화로 최대 999,999.99까지입니다. 다른 통화로 입력해 환산하거나 지출을 두 건으로 나누세요."
    - q: "환산에 비용이 드나요?"
      a: "아니요. 환산은 사이드 배저의 다른 기능처럼 무료입니다. [가격](page:pricing)을 참고하세요."
    - q: "꼭 환산해야 하나요?"
      a: "아니요. 여러분이나 그룹이 환산하기로 하지 않는 한 통화는 따로 유지되며, 통화마다 짧은 결제 목록이 생깁니다."
