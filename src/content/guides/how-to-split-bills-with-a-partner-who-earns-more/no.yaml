faq:
  heading: "Spørsmål"
  items:
    - q: "Bør vi bruke bruttolønn eller lønn etter skatt?"
      a: "Det avgjør gruppen. Lønn etter skatt er vanlig, fordi det er pengene du faktisk har å rutte med. Bruttolønn overser at skatt, pensjonsinnskudd og nedbetaling av lån tar ulike beløp ut av ulike lønninger. Uansett hva dere velger, bruk samme mål for begge."
    - q: "Ser Side Badger inntektene våre?"
      a: "Nei. Du legger bare inn prosenter, aldri lønninger. Prosentene er synlige for medlemmene i gruppen, og for et par er det dere to."
    - q: "Kan vi sette 62/38 én gang for alt?"
      a: "Fordelingen settes per utgift, ikke per gruppe. Kopier en utgift som allerede har 62 og 38, og endre det som er annerledes. [Dele utgifter](page:feature/split-expenses) tar for seg de andre valgene."
