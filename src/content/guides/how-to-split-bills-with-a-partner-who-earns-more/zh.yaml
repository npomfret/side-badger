meta:
  title: 伴侣收入更高，账单怎么分摊 | Side Badger
  description: 两人收入悬殊时，对半分就尴尬了。改按收入分摊共同账单，两个人的算式一目了然，不用电子表格。
h1: 伴侣收入更高，账单怎么分摊
navLabel: 伴侣收入更高
lead: 把你们的税后收入加起来，算出每个人占总数的份额，再取整成整数百分比。Maya 税后月入 £2,800，Jon 是 £1,700，所以他们按 62/38 分摊共同账单。把这些百分比录入 Side Badger 的共同支出，之后每次遇到同一笔账单就复制。
cta:
  heading: 算一次就够了
  body: 创建免费账户，为你们两个人建一个群组，把房租连同你们的百分比录进去。下个月的房租只需复制。想先看看全貌？请见[使用方式](page:how-it-works)或[免费版包含什么](page:pricing)。
sections:
  - heading: 两份工资，一套房，一阵礼貌的沉默
    body: Maya 和 Jon 住在一起。Maya 每月税后收入 £2,800，Jon 是 £1,700。两年来，他们所有开销都对半分，因为这样简单，而且谁也不想先开口。后来 Jon 单独看了看房租。£1,400 的一半是 £700，占 Maya 税后收入的四分之一，却占他的 41%。谁也没有不公平，只是谁也没算过这笔账。很多[情侣](page:use-case/couples)迟早都会走到这一步。一顿外卖的工夫，他们谈妥了：共同账单对各自工资的占比应该差不多。
  - heading: 方法，算式全展示
    body: 四个步骤，一个计算器，和一场你们本来就该有的对话。
    items:
      - "**商定什么算收入。**Maya 和 Jon 用的是税后收入，也就是每个月实际到账的钱。合计 £2,800 + £1,700 = £4,500。"
      - "**算出各自的份额。**Maya 的是 2,800 ÷ 4,500，即 62.2%。Jon 的是 1,700 ÷ 4,500，即 37.8%。"
      - "**取整成整数百分比。**62.2% 记为 62，37.8% 记为 38。两个人的话，取整其中一个数，再用 100 减去它得到另一个，加起来就一定是 100。"
      - "**核对一下意味着什么。**£1,400 的房租，Maya 付 £868（62%），Jon 付 £532（38%）。这相当于每个人税后收入的约 31%。如果各付一半，就是 Maya 的 25% 和 Jon 的 41%。"
  - heading: 看看这个月的账
    body: Maya 付了 £1,400 的房租，Jon 付了另外的 £216。Maya 这个月的份额是 £868.00 + £111.60 + £18.00 = £997.60，她付了 £1,400，所以可收 £402.40。Jon 的份额是 £532.00 + £68.40 + £18.00 = £618.40，他付了 £216，所以欠 £402.40。Side Badger 建议一笔付款，由 Jon 付给 Maya £402.40，付完后用[结算](page:feature/settle-up)记录下来。如果对半分，同一个月 Jon 要付给 Maya £592.00。
  - heading: 在 Side Badger 里设置
    body: 十分钟，大部分时间都花在百分比上。
    items:
      - "**建群组。**在仪表盘上选择**创建群组**，用这套房的名字命名。选择**邀请他人**，把链接或二维码发给 Jon。他登录或创建免费账户，并选择自己在这个群组里想显示的名字。群组只有成员才看得到，所以这个群组里只有你们两个人。"
      - "**添加房租。**选择**添加费用**。填写描述和金额，在**谁付的钱？**里选 Maya。**分摊给**里保留两个人，再在**如何拆分**里选择**百分比**，输入 62 和 38。如果百分比加起来不是 100，表单会提示。选择**保存费用**。"
      - "**添加其他账单。**能源费和网费用同样的方式录入，付款人是 Jon，百分比同样是 62 和 38。外卖是单独的一笔支出，**如何拆分**保持**平分**。"
      - "**下个月复制。**打开上个月的房租，选择**复制费用**。副本会保留付款人、金额和分摊方式，日期用今天的。如果房租变了，就改一下金额，然后选择**创建副本**。能源费的做法一样。"
      - "**查看谁欠谁。**在**余额**部分就能看到，它还会建议一份简短的付款清单。你们想怎么付就怎么付，然后在**结算**里记录这笔付款。"
  - heading: 对半分、按收入分，还是一笔一笔来
    body: 没有标准答案，只有你们俩都能接受的那个。常见的有三种。
    items:
      - "**所有开销都对半分。**最容易坚持，适合收入相近的情侣。"
      - "**所有共同开销都按收入分。**Maya 和 Jon 就是这样。谈一次，定一对百分比。"
      - "**一笔一笔来。**房租和账单按收入分，度假和小享受对半分或按你们商定的其他方式，每笔账单用最适合它的规则。"
  - heading: 商定什么算共同开销
    body: 争论往往出在清单上，而不是百分比上。房租、能源费、网费、每周采购和沙发，在大多数家庭里都算共同开销。Maya 的健身房会员和 Jon 的足球订阅就未必。把清单商定一次，写下来，群组里只放共同的费用。
  - heading: 外卖有意保持对半
    body: 小享受金额不大，又不是必需的，点个饺子不该还要用计算器。在 Side Badger 里，外卖只是另一笔支出。Jon 付了 £36，**如何拆分**保持**平分**，每人欠 £18。
  - heading: 收入变了怎么办
    body: 加薪、换工作或休假都会改变这道算术题。用同样的方法算出新的百分比，从下一笔支出开始使用。之前的支出保持原样。复制上个月的房租，改一下百分比，然后选择**创建副本**。要更正已录入的某一笔，在群组权限允许的情况下可以编辑，并先告诉你的伴侣，因为余额会随之变化。之前的版本会保留。商定什么时候重新计算，比如每年一次，并在切换之前先结清，这样旧的分摊方式就以一份干净的账收尾。
  - heading: Side Badger 在这里不做的事
    items:
      - 它从不询问任何人赚多少，也不会替你算百分比。你输入的是你们谈好的数字。
      - 它不能给整个群组设一个默认分摊方式。百分比是设在每笔支出上的，所以复制一笔已经带有这些百分比的支出就行。
      - 它没有定期账单，所以每个月要复制上个月的房租。
      - 它从不转移资金。你们想怎么付就怎么付，然后记录下来。
