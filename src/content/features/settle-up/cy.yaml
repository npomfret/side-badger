meta:
  title: "Setlo gyda llai o daliadau | Side Badger"
  description: "Gweld pwy sy'n ddyledus i bwy yn eich grŵp, cael rhestr fer o daliadau sy'n setlo pawb, a chofnodi pob taliad wrth iddo ddigwydd. Am ddim i'w ddefnyddio."
h1: "Setlo gyda llai o daliadau"
navLabel: "Setlo"
lead: "Mae Side Badger yn cadw balans cyfredol i bawb yn y grŵp ac yn awgrymu rhestr fer o daliadau sy'n ei setlo. Rydych chi'n talu eich gilydd sut bynnag y dymunwch, yna'n ei gofnodi. Os ydych am weld sut mae'r rhifau'n cael eu rhannu yn gyntaf, dechreuwch â [rhannu treuliau](page:feature/split-expenses)."
cta:
  heading: "Yn barod i ddatglymu pwy sy'n ddyledus i bwy?"
  body: "Creu cyfrif, cychwyn grŵp ac ychwanegu'r gost gyntaf. Bydd y balansau'n gwneud y gweddill."
problem:
  heading: "Balansau sy'n diweddaru wrth fynd"
  body: "Mae pob cost yn newid pwy sy'n ddyledus i bwy, felly mae Side Badger yn cadw'r balansau'n gyfredol wrth i gostau a thaliadau gael eu hychwanegu. Mae pawb yn y grŵp yn gweld newid ar unwaith, ac yn gweld beth newidiodd a phwy a'i newidiodd. Cedwir balansau fesul arian cyfred, felly mae ewros a phunnoedd yn aros yn eu colofnau eu hunain oni bai bod cost wedi'i throsi pan gafodd ei rhoi. Yn ddiofyn, rydych yn gweld y dyledion sy'n eich cynnwys chi; mae **Dangos y cyfan** yn rhestru'r grŵp cyfan."
workflow:
  heading: "Tri cham i sgwâr"
  steps:
    - title: "Gweld pwy sy'n ddyledus i bwy"
      body: "Agorwch falansau'r grŵp i weld beth sy'n ddyledus gennych, beth sy'n ddyledus i chi, a rhestr fer o daliadau sy'n setlo pawb, wedi'i gweithio fesul arian cyfred. Mae costau a holwyd yn aros allan o'r symiau nes eu datrys. Yn enghraifft y cyd-letywyr isod, mae chwe thaliad yn dod yn ddau."
      shot: S10
      shotAlt: "Sgrin y balansau yn dangos dyledion wedi'u symleiddio mewn dau arian cyfred, gyda Dangos y cyfan wedi'i droi ymlaen"
    - title: "Talu sut bynnag y dymunwch, yna ei gofnodi"
      body: "Trosglwyddiad banc, arian parod, ffafr sy'n ddyledus o'r gwyliau diwethaf. Dyw Side Badger ddim yn symud yr arian. Unwaith y bydd wedi newid dwylo, cofnodwch y taliad ac mae'r balans yn diweddaru i bawb."
      shot: S11
      shotAlt: "Y ffurflen daliad gyda botymau setlo cyflym a'r hysbysiad a ddangosir ar gyfer taliad rhannol"
    - title: "Gwirio ei fod wedi cyrraedd"
      body: "Mae'r taliad yn mynd i hanes y grŵp, lle gall pawb yn y grŵp ei weld ac ymateb gydag emoji. Dathlwch daliad pan fydd yn cyrraedd."
      shot: S12
      shotAlt: "Hanes y taliadau gydag ymatebion emoji ar daliad"
