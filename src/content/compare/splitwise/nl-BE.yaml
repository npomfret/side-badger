sections:
  - heading: "Wat Splitwise goed doet"
    body: "Heeft je groep een native app, offline gebruik of betalingen in de app nodig, dan is Splitwise de verstandige keuze, en we zien liever dat je die kiest dan dat je het later ontdekt. De eigen pagina’s van Splitwise noemen:"
    items:
      - "**Apps en offline gebruik.** Apps voor iPhone en Android naast het web, en een offlinemodus."
      - "**Meer manieren om te verdelen.** Aandelen, aanpassingen en verdelingen per item, bovenop gelijk, exact en percentage."
      - "**Terugkerende uitgaven.** Laat de huur zich herhalen en vergeet ze."
      - "**Betalingen in de app.** In sommige landen kan het ook het geld verplaatsen, via Splitwise Pay, Venmo, PayPal of Pay by Bank."
  - heading: "Hier gratis, daar betalend"
    body: "Splitwise Pro is het betaalde abonnement van Splitwise, en de eigen Pro-pagina verkoopt vier dingen die in Side Badger niets kosten."
    items:
      - "**Bonnetjes scannen.** Splitwise Pro scant een foto van je bonnetje. Side Badger doet het gratis, zonder scancredits: het vult het totaal, de datum en de plaats in zodat jij ze kunt nakijken. Bonnetjes worden gelezen door de AI-dienst van Google."
      - "**Valuta’s omrekenen.** Splitwise Pro rekent de uitgaven van een groep om naar je standaardvaluta wanneer je op “Convert” tikt. Side Badger rekent elke uitgave om terwijl je ze invoert, tegen een actuele wisselkoers of de koers die je echt kreeg, en het oorspronkelijke bedrag blijft bij de uitgave staan."
      - "**Geen advertenties.** Splitwise noemt een volledig advertentievrije ervaring als Pro-functie. Side Badger heeft geen advertenties."
      - "**Geen dagelijkse limieten.** Splitwise Pro verkoopt onbeperkte uitgaven, en volgens het helpcentrum kunnen gratis gebruikers tot 4 uitgaven per dag toevoegen. Side Badger heeft geen dagelijkse limieten."
  - heading: "Wat Splitwise heeft en Side Badger niet"
    body: "Dit zijn niet alle functies van Splitwise, enkel de functies die de keuze meestal bepalen. De eigen pagina’s van Splitwise hebben de volledige lijst. Hier schiet Side Badger tekort."
    items:
      - "**Native apps.** Side Badger werkt in je browser. Log in en voeg het dan toe aan je startscherm, dan opent het als een app."
      - "**Offlinemodus.** Side Badger heeft een verbinding nodig."
      - "**Betalingen in de app.** Side Badger raakt je geld nooit aan. Betaal elkaar zoals je wilt en registreer daarna de betaling."
      - "**Terugkerende uitgaven.** Side Badger heeft die niet. Kopieer de huur van vorige maand in plaats van ze opnieuw in te typen."
      - "**Verdelen op aandelen of per item.** Side Badger heeft één betaler per uitgave, gelijk verdeeld, op exacte bedragen of op percentage. Het scannen van bonnetjes wijst geen items aan mensen toe."
      - "**Grafieken en standaardverdelingen.** Splitwise Pro heeft beide. Side Badger houdt bij wie wie iets schuldig is, en dat is de hele truc."
  - heading: "Je groep overbrengen"
    body: "Er is geen importfunctie, dus verhuizen betekent opnieuw beginnen. Reken eerst af in Splitwise, maak dan een groep aan in Side Badger en nodig iedereen uit met een link of een QR-code. Iedereen in de groep heeft een gratis account nodig, en een e-mailadres is alles wat je nodig hebt om je te registreren."
