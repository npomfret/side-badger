faq:
  heading: "Питања"
  items:
    - q: "Шта ако скупимо више него што поклон кошта?"
      a: "Тачни износи морају давати цену, па смањуј уделе док не дају. Или потроши вишак на нешто стварно, као цвеће, и унеси то као други трошак, попут честитке и папира у примеру."
    - q: "Може ли неко да да прилог без придруживања групи?"
      a: "Не ако желиш да буде у рачуници. Свима у подели треба бесплатан налог и да буду у групи. За некога ко има само готовину, Прија би могла да је узме и унесе поклон за оно што група још дугује. На пример, ако јој Сем да 40 £ у готовини, унела би 200 £ и поделила 60, 60 и 80 између себе, Омара и Лене."
    - q: "Може ли анкета да одреди колико свако даје?"
      a: "Не. Анкета договара износ за целу групу, као што је буџет. Свачији удео ви договарате међу собом, а онда га укуцате у трошак као **Тачни износи**."
