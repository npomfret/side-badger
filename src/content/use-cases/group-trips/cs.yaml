featuresHeading: "Na čem výlet stojí"
faq:
  heading: "Otázky"
  items:
    - q: "Lze vynechat lidi, kteří vynechali večeři?"
      a: "Ano. Vyberte, kdo se na každém výdaji podílel, a jen těm se účtuje."
    - q: "Funguje to bez signálu?"
      a: "Ne. Side Badger potřebuje připojení, takže náklady přidejte, až budete zpátky na wifi."
    - q: "Musí si každý něco instalovat?"
      a: "Ne. Běží v prohlížeči. Pošlete odkaz s pozvánkou a lidé se připojí z telefonů."
    - q: "Jaký směnný kurz používá?"
      a: "Aktuální směnný kurz při zadání výdaje, nebo váš vlastní, pokud jste měli jiný. Kurz se zafixuje při uložení výdaje, takže staré výdaje se nikdy nepřeceňují."
    - q: "Můžeme skupinu po výletu zmrazit?"
      a: "Ano. Správce může skupinu zamknout, aby čísla zůstala."
    - q: "Existuje limit částek?"
      a: "Ano. 999 999,99 na výdaj, ve své měně."
