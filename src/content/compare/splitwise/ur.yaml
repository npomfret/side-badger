sections:
  - heading: "پیسوں کی باتیں، پیسوں کے ساتھ"
    body: "مشترکہ پیسوں کے ساتھ گپ شپ، الجھنیں اور منصوبے بھی آتے ہیں۔ Side Badger تینوں کو اعداد کے ساتھ رکھتا ہے، تاکہ کسی کو چیٹ میں پیچھے تک اسکرول نہ کرنا پڑے۔"
    items:
      - "**تبصرے وہیں جہاں ان کی جگہ ہے۔** گروپ پر یا کسی بھی خرچے، فہرست یا پول پر تبصرہ کریں، اور بات اسی چیز کے ساتھ رہتی ہے جس کے بارے میں ہے۔"
      - "**رسیدیں اور تصویریں۔** ہر خرچے پر تین رسیدیں تک رکھیں، اور گروپ، کسی فہرست یا پول کے تبصروں میں تصویریں یا PDF شامل کریں۔"
      - "**جھگڑے نہیں، سوال۔** ایڈمن سوالات آن کر سکتا ہے، پھر خرچے میں شامل کوئی بھی اس کے بارے میں پوچھ سکتا ہے۔ جب تک بات سلجھ نہ جائے، وہ بیلنس سے باہر رہتا ہے۔"
      - "**فہرستیں اور پول۔** خریداری کے بلوں کے ساتھ مشترکہ خریداری کی فہرست رکھیں، اور ولا کی مختصر فہرست ووٹ پر ڈالیں، چاہیں تو گمنام طور پر۔"
      - "**تھوڑی سی داد۔** خرچوں، ادائیگیوں اور تبصروں پر ردعمل دیں، اور ادائیگی پہنچ جائے تو جشن منائیں۔"
  - heading: "آپ کا گروپ، آپ کے قاعدے"
    body: "Splitwise کا ہیلپ سینٹر کہتا ہے کہ وہ گروپ ایڈمنز یا خصوصی اجازتوں کی سہولت نہیں دیتا۔ Side Badger میں کردار اور اجازتیں ہیں، ان گروپس کے لیے جنہیں حساب ٹھیک رکھنے والا کوئی چاہیے۔"
    items:
      - "**ایڈمن، رکن اور ناظر۔** کسی کو ناظر بنائیں: وہ سب کچھ دیکھتا ہے اور کچھ نہیں بدلتا۔"
      - "**دو پری سیٹ، یا اپنی مرضی۔** «کھلا تعاون» یا «منظم گروپ» سے شروع کریں، یا ہر اجازت خود طے کریں: خرچوں میں کون ترمیم کرے اور حذف کرے، فہرستیں کون بدلے، کون مدعو کرے اور نئے لوگوں کو کون آنے دے۔"
      - "**شمولیت کے لیے منظوری۔** منظوری آن کریں اور ایڈمن ہر شخص کو اندر آنے دیتا ہے۔"
      - "**گروپ کی اپنی ترتیبات۔** اسے صرف ان کرنسیوں تک محدود کریں جو آپ واقعی استعمال کر رہے ہیں، اس کی ڈیفالٹ کرنسی چنیں اور اوپر کی تصویر لگائیں۔"
      - "**ختم ہونے پر لاک کر دیں۔** اعداد اپنی جگہ رہتے ہیں جب تک ایڈمن گروپ ان لاک نہ کرے۔"
  - heading: "یہاں مفت، وہاں ادائیگی سے"
    body: "Splitwise Pro ، Splitwise کا ادائیگی والا پلان ہے، اور اس کا اپنا Pro صفحہ تین چیزیں بیچتا ہے جن پر Side Badger میں ایک پیسہ نہیں لگتا۔"
    items:
      - "**رسید اسکین۔** Splitwise Pro آپ کی رسید کی تصویر اسکین کرتا ہے۔ Side Badger یہ مفت کرتا ہے، بغیر اسکین کریڈٹس کے: یہ کل رقم، تاریخ اور جگہ آپ کے جانچنے کے لیے بھر دیتا ہے۔"
      - "**کرنسی تبدیلی۔** Splitwise Pro جب آپ Convert دباتے ہیں تو گروپ کے اخراجات آپ کی ڈیفالٹ کرنسی میں تبدیل کر دیتا ہے۔ Side Badger ہر خرچے کو اسے لکھتے وقت تبدیل کرتا ہے، موجودہ ایکسچینج ریٹ پر یا اس ریٹ پر جو آپ کو واقعی ملا، اور اصل رقم خرچے پر رہتی ہے۔"
      - "**کوئی یومیہ حد نہیں۔** Splitwise Pro لامحدود اخراجات بیچتا ہے، اور اس کا ہیلپ سینٹر کہتا ہے کہ مفت صارفین روزانہ 4 اخراجات تک شامل کر سکتے ہیں۔ Side Badger میں کوئی یومیہ حد نہیں۔"
  - heading: "آپ کا بینک اس سے باہر رہتا ہے"
    body: "Side Badger آپ کے بینک سے نہیں جڑتا اور آپ سے بینک کی تفصیلات نہیں مانگتا۔ وہ صرف یہ ریکارڈ رکھتا ہے کہ کس کو کس کا دینا ہے؛ آپ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ادائیگی ریکارڈ کریں۔ بینک لاگ اِن دینا ہی نہیں پڑتا، تو سنبھالنے کی ایک فکر کم۔"
  - heading: "ایک ایپ، آپ کے براؤزر میں بھی اور فون پر بھی"
    body: "Side Badger آپ کے براؤزر میں چلتا ہے۔ سائن ان کریں، اسے ہوم اسکرین میں شامل کریں، اور یہ ایپ کی طرح کھلتا ہے۔ دونوں جگہ ایک ہی ایپ ہے، اس لیے نئی خصوصیت آپ کے فون پر اگلی بار کھولنے ہی پر موجود ہوتی ہے، ایپ اسٹور کی اپ ڈیٹ کا انتظار کیے بغیر۔"
  - heading: "اور کچھ چھوٹے ٹرکس"
    items:
      - "**اپنے اسسٹنٹ سے کہیں۔** Side Badger ChatGPT اور Claude کے ساتھ کام کرتا ہے: اپنے اسسٹنٹ سے کہیں کہ خرچہ شامل کرے، رسید اسکین کرے یا ادائیگی ریکارڈ کرے۔"
      - "**ہر کوئی اپنی زبان میں۔** Side Badger 39 زبانیں بولتا ہے اور ہر شخص اپنی زبان چنتا ہے۔ Splitwise کے ہوم پیج پر 7+ لکھا ہے۔ یہ 133 کرنسیاں بھی سنبھالتا ہے، اس سفر کے لیے جو ہر جگہ جاتا ہے۔"
      - "**ایپ چھوڑے بغیر مدد۔** کہیں اٹک گئے یا کوئی خرابی ملی؟ ایپ سے ہمیں بتائیں اور ہمارا جواب وہیں پڑھیں۔"
  - heading: "جہاں Splitwise اب بھی آگے ہے"
    body: "ہم چاہیں گے کہ آپ صحیح ایپ چنیں بجائے اس کے کہ بعد میں پتا چلے۔ اگر آپ کے گروپ کو ان میں سے کچھ چاہیے تو Splitwise کے پاس ہے اور Side Badger کے پاس نہیں۔"
    items:
      - "**ایپ اسٹور کی ایپس۔** Side Badger آپ کے براؤزر اور ہوم اسکرین پر رہتا ہے، ایپ اسٹورز میں نہیں۔"
      - "**آف لائن موڈ۔** Side Badger کو کنکشن چاہیے۔"
      - "**ایپ کے اندر ادائیگیاں۔** کچھ ممالک میں Splitwise رقم بھی منتقل کر سکتا ہے۔ Side Badger صرف ریکارڈ رکھتا ہے۔"
      - "**حصوں یا آئٹم کے حساب سے تقسیم۔** Side Badger میں ہر خرچے کا ایک ادا کرنے والا ہوتا ہے، خرچے کو برابر، عین رقم یا فیصد کے مطابق بانٹا جاتا ہے۔ اس کی رسید اسکین آئٹمز کو لوگوں میں تقسیم نہیں کرتی۔"
      - "**چارٹس اور ڈیفالٹ تقسیمیں۔** Splitwise Pro میں دونوں ہیں۔ Side Badger یہ حساب رکھتا ہے کہ کس کو کس کا دینا ہے، اور بس یہی سارا کمال ہے۔"
  - heading: "اپنا گروپ منتقل کرنا"
    body: "امپورٹ کی سہولت نہیں ہے، اس لیے منتقل ہونے کا مطلب نئی شروعات ہے۔ پہلے Splitwise میں حساب برابر کریں، پھر Side Badger میں گروپ بنائیں اور سب کو لنک یا QR کوڈ سے مدعو کریں۔ گروپ میں ہر ایک کو مفت اکاؤنٹ چاہیے، اور سائن اپ کے لیے بس ایک ای میل ایڈریس درکار ہے۔"
