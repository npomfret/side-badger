meta:
  title: "रसीद स्कैन करके खर्च जोड़ें | Side Badger"
  description: "रसीद बैजर को पढ़ने दें। वह कुल राशि, तारीख और जगह भर देता है ताकि आप जांच सकें, बिना किसी स्कैन क्रेडिट के। इमेज Google की AI सेवा पढ़ती है।"
h1: "रसीद स्कैन करें, ब्योरा जांचें, बांटें"
navLabel: "रसीद स्कैन करना"
lead: "रसीद बैजर को पढ़ने दें, और उसका होमवर्क जांचें। नए खर्च में फोटो जोड़ें और Side Badger कुल राशि, तारीख और जगह भर देता है ताकि आप जांच सकें। फिर आप उसे किसी भी दूसरे खर्च की तरह [बांटते](page:feature/split-expenses) हैं। स्कैन करना मुफ्त है, और स्कैन क्रेडिट नहीं हैं। यह एक खर्च भरता है और बिल को आइटम के हिसाब से नहीं बांटता। रसीद की इमेज Google की AI सेवा पढ़ती है।"
cta:
  heading: "खींचो। जांचो। बांटो।"
  body: "मुफ्त अकाउंट बनाएं, ग्रुप शुरू करें और रसीद की फोटो के साथ खर्च जोड़ें। देखें कि वह क्या भरता है, जो गलत हो उसे बदलें, और जब संतुष्ट हों तो सेव करें।"
problem:
  heading: "टैक्सी की कतार में रसीद टाइप करना कोई नहीं चाहता"
  body: "ट्रिप और बड़ी रातें कागज़ के साथ आती हैं। डिनर, टैक्सी, वह राउंड जो छह में बदल गया। ठंडे अंगूठों से, पीछे लगी कतार के सामने, हर रसीद फोन में टाइप करना ही वह तरीका है जिससे खर्च भुला दिए जाते हैं। इसलिए Side Badger आपके लिए रसीद पढ़ लेगा। पहला ड्राफ्ट वह बनाता है और जांच आप करते हैं। यह [ग्रुप ट्रिप](page:use-case/group-trips) और [इवेंट और जश्न](page:use-case/events-and-celebrations) के लिए ठीक बैठता है, जहां रसीदें इतनी तेज़ी से जमा होती हैं कि कोई उन्हें निपटाना नहीं चाहता।"
workflow:
  heading: "फोटो से खर्च तक तीन कदम में"
  steps:
    - title: "नए खर्च में रसीद जोड़ें"
      body: "नया खर्च शुरू करें और **रसीद स्कैन करें** पर टैप करें, या अपने डैशबोर्ड पर **रसीद स्कैन करें** क्विक एक्शन इस्तेमाल करें। फोटो खींचें या पहले से मौजूद कोई चुन लें। फॉर्म पर **रसीद या संलग्नक जोड़ें** भी काम करता है।"
    - title: "उसे रसीद पढ़ने दें"
      body: "जब तक Side Badger का AI इमेज पढ़ता है, फॉर्म पर **रसीद का विश्लेषण हो रहा है...** दिखता है। फिर वह जो मिला उसे भर देता है, जैसे विवरण, कुल राशि, करेंसी, तारीख, समय और जगह। जो आप पहले से टाइप कर चुके थे उसे वह नहीं छूता।"
      shot: S09
      shotAlt: "नए खर्च का फॉर्म, जिसमें रसीद का विश्लेषण हो रहा है... दिख रहा है, फिर वही फॉर्म भरे हुए ब्योरे के साथ"
    - title: "जांचें, फिर बांटें"
      body: "फॉर्म को कागज़ से मिलाएं। जो गलत हो उसे ठीक करें, बताएं किसने पेमेंट किया और किसने खर्च बांटा, बंटवारे का तरीका चुनें और सेव करें। जब तक आप सेव नहीं करते, खर्च बनता नहीं। बंटवारे के बारे में [खर्च बांटना](page:feature/split-expenses) बताता है।"
options:
  heading: "विकल्प"
  items: []
sections:
  - heading: "वह क्या भरता है"
    body: "नए खर्च में रसीद की इमेज जोड़ें और ये फील्ड भर सकते हैं। किसने पेमेंट किया, किसने खर्च बांटा और कैसे बांटना है, यह अब भी आपके हाथ में है।"
    items:
      - "खर्च का **विवरण**।"
      - "**कुल राशि**।"
      - "**करेंसी**, अगर आपका ग्रुप इसकी अनुमति देता है।"
      - "**तारीख** और **समय**।"
      - "**जगह**।"
      - "रसीद की एक टेक्स्ट कॉपी **नोट्स** में, ताकि कागज़ वाली रसीद फीकी पड़ जाए या धुलाई में चली जाए तब काम आए।"
  - heading: "आपको अब भी क्या जांचना है"
    body: "सब कुछ। जो वह भरता है उसे ड्राफ्ट मानें। कुल राशि को कागज़ से मिलाएं, फिर करेंसी, तारीख और जगह देखें। धुंधली फोटो और मुड़े-तुड़े कागज़ किसी भी पढ़ने वाले को चकमा दे सकते हैं, और हम यह वादा नहीं करते कि वह हर रसीद सही पढ़ेगा, इसलिए सेव करने से पहले ज़रूर देख लें। कुछ गलत हो तो उसके ऊपर टाइप कर दें। अगर रसीद येन में है और ग्रुप पाउंड में हिसाब चुकता करता है, तो आगे क्या होता है यह [कई करेंसी](page:feature/multiple-currencies) बताता है।"
  - heading: "रसीद को खर्च के साथ रखें"
    body: "स्कैन की हो या नहीं, रसीद खर्च के साथ रह सकती है। फोटो या PDF जोड़ें, हर खर्च पर तीन तक और हर एक 10 MB तक। ग्रुप के सदस्य उन्हें खर्च पर देखते हैं। इमेज थंबनेल के रूप में दिखती हैं जो व्यूअर में खुलती हैं, और PDF लिंक के रूप में खुलते हैं। आपकी स्कैन की हुई फोटो भी जुड़ जाती है, जब तक आप सेव करने से पहले उसे हटा न दें। जब कोई पूछे कि उस डिनर का असल खर्च कितना था, तो सबूत वहीं मौजूद है।"
  - heading: "आपकी रसीद कहां जाती है"
    body: "रसीद की इमेज Google की AI सेवा पढ़ती है। फॉर्म भरने के लिए इमेज को Google की US मल्टी-रीजन में Google Vertex AI (Gemini) पढ़ता है। नए खर्च में इमेज जोड़ें और वह पढ़ ली जाती है। PDF, या पहले से मौजूद खर्च में जोड़ी गई फोटो, बिना पढ़े स्टोर की जाती है। जुड़ी हुई रसीदें ग्रुप के सदस्यों को दिखती हैं, इसलिए अगर किसी रसीद में कुछ ऐसा है जो आप साझा नहीं करना चाहते, तो फोटो छोड़ दें और वह खर्च हाथ से टाइप करें।"
limits:
  heading: "सीमाएं"
  items:
    - "सिर्फ इमेज। JPEG, PNG और WebP, और HEIC कन्वर्ट होने के बाद। PDF को खर्च से जोड़ा जा सकता है पर उन्हें पढ़ा नहीं जाता।"
    - "स्कैन सिर्फ नए खर्चों के लिए है। पहले से मौजूद खर्च पर आप रसीदें जोड़ सकते हैं, पर कुछ पढ़ा नहीं जाता।"
    - "यह सिर्फ वे फील्ड भरता है जिन्हें आपने छुआ नहीं है, और करेंसी तभी जब आपका ग्रुप इसकी अनुमति देता है।"
    - "यह आइटम के हिसाब से नहीं बांटता और लाइन आइटम लोगों को नहीं सौंपता। यह एक खर्च भरता है और उसे आप हमेशा की तरह बांटते हैं।"
    - "इसका कोई वादा नहीं कि जो वह भरता है वह सही है, या कि स्कैन हर बार चलेगा। सेव करने से पहले जांच लें, और अगर स्कैन विफल हो या उपलब्ध न हो तो खर्च हाथ से जोड़ें।"
    - "एक खर्च में तीन अटैचमेंट तक हो सकते हैं, हर एक 10 MB तक, JPEG, PNG, WebP, HEIC या PDF के रूप में।"
    - "रसीद की इमेज Google की US मल्टी-रीजन में Google Vertex AI (Gemini) पढ़ता है, और जुड़ी हुई रसीदें ग्रुप के सदस्यों को दिखती हैं।"
useCasesHeading: "जहां रसीदें जमा होती हैं"
faq:
  heading: "सवाल"
  items:
    - q: "क्या यह रसीद को आइटम के हिसाब से बांट सकता है?"
      a: "नहीं। यह कुल राशि समेत खर्च भरता है, और आप उसे बराबर, सटीक राशि या प्रतिशत से बांटते हैं। ऐसे बिल के लिए जिसमें सबने अलग-अलग ऑर्डर किया, हर व्यक्ति का देना सटीक राशि के रूप में डालें। ब्योरा [खर्च बांटना](page:feature/split-expenses) में है।"
    - q: "क्या यह PDF पढ़ सकता है?"
      a: "नहीं। आप खर्च में PDF जोड़ सकते हैं ताकि वह संख्याओं के साथ रहे, पर सिर्फ इमेज पढ़ी जाती हैं।"
    - q: "क्या स्कैन की कोई सीमा है?"
      a: "स्कैन क्रेडिट खत्म होने का कोई डर नहीं, और स्कैन करना मुफ्त है। फाइलों की सीमाएं हैं: हर खर्च पर तीन अटैचमेंट और हर एक 10 MB तक। बाकी [मुफ्त में क्या-क्या मिलता है](page:pricing) में है।"
    - q: "मेरी रसीद कौन देख सकता है?"
      a: "ग्रुप के सदस्य खर्च से जुड़ी रसीदें देख सकते हैं। रसीद की इमेज Google की AI सेवा भी पढ़ती है, इसी से फॉर्म भरता है।"
    - q: "क्या मैं ऐसे खर्च की रसीद स्कैन कर सकता हूँ जो मैं पहले जोड़ चुका हूँ?"
      a: "नहीं, स्कैन नए खर्चों के लिए है। आप मौजूदा खर्च में रसीद जोड़ सकते हैं, और वह बिना पढ़े स्टोर होती है।"
    - q: "अगर वह कुछ गलत भर दे तो?"
      a: "उसके ऊपर टाइप कर दें। सेव करने तक हर फील्ड एडिट हो सकता है, और वैसे भी आपको सब जांचना चाहिए। अगर स्कैन विफल हो या उपलब्ध न हो, तो खर्च हमेशा की तरह हाथ से जोड़ें।"
