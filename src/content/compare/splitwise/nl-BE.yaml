meta:
  title: "Side Badger vs Splitwise: wat gratis is, vergeleken | Side Badger"
  description: "Een gratis Splitwise-alternatief, eerlijk vergeleken. Bonnetjes scannen, omrekenen en geen advertenties kosten niets, en we noemen wat Splitwise beter doet."
h1: "Side Badger vs Splitwise: wat gratis is, vergeleken"
navLabel: "Side Badger vs Splitwise"
lead: "Iemand in je groep heeft waarschijnlijk al gezegd: “gebruik gewoon Splitwise”. Terecht. Side Badger is een gratis webapp met bonnetjes scannen, valuta’s omrekenen en geen advertenties, en zonder abonnement om ze te ontgrendelen. Welke bij je groep past, hangt af van wat die nodig heeft, dus hier is de vergelijking, met de kant van Splitwise enkel gehaald uit de eigen pagina’s van Splitwise."
cta:
  heading: "Probeer het op je volgende gedeelde rekening"
  body: "Maak een gratis account aan, start een groep en voeg één echte uitgave toe. Is het niets voor jou, dan ben je een paar minuten kwijt, geen abonnement."
asOf: 2026-10-21
asOfNote: "We lazen de eigen pagina’s van Splitwise op {date}, zodat jij dat niet hoeft te doen, en alles wat hier over Splitwise staat komt daaruit. Elke rij van de tabel verwijst naar de bron ervan. Het aanbod verandert, dus we controleren elk kwartaal opnieuw, en als de pagina’s van Splitwise iets anders zeggen dan deze, geloof dan hen."
