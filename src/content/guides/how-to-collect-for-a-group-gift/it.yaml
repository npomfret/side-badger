faq:
  heading: "Domande"
  items:
    - q: "E se raccogliamo più di quanto costa il regalo?"
      a: "Gli importi esatti devono sommare al prezzo, quindi riduci le quote finché tornano. Oppure metti il sovrappiù in qualcosa di concreto, come dei fiori, e inseriscilo come seconda spesa, come il biglietto e la carta da regalo nell'esempio."
    - q: "Qualcuno può contribuire senza entrare nel gruppo?"
      a: "Non se vuoi che sia nel conto. Tutti quelli nella divisione hanno bisogno di un account gratuito e di stare nel gruppo. Per chi ha solo contanti, Priya potrebbe prenderli e inserire il regalo per quello che il gruppo deve ancora. Per esempio, se Sam le desse 40 £ in contanti, lei inserirebbe un regalo da 200 £ diviso 60, 60 e 80 tra sé, Omar e Lena."
    - q: "Il sondaggio può decidere quanto mette ciascuno?"
      a: "No. Un sondaggio concorda una cifra per l'intero gruppo, come il budget. La quota di ciascuno la concordate tra voi, poi la scrivi nella spesa come **Importi esatti**."
