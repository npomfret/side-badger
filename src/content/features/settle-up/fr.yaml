sections:
  - heading: "Enregistrer un paiement"
    body: "Quand quelqu'un paie, enregistrez-le pour la bonne personne. Les boutons de règlement rapide remplissent le montant à partir de vos paiements suggérés, et vous pouvez ajouter une note comme « virement bancaire » (jusqu'à 500 caractères). Si vous ne payez qu'une partie de ce que vous devez, le reste demeure dans le solde. Si vous saisissez trop peu ou trop, Side Badger vous prévient avant d'enregistrer. Enregistrer un paiement demande la permission de modifier les dépenses, et la date ne peut pas être dans le futur."
  - heading: "Payé dans une autre devise ?"
    body: "Les soldes restent dans la devise où ils ont été payés, donc une dette en euros reste une dette en euros. Vous devez des euros mais payez en livres ? Convertissez le paiement à la saisie, à un taux de change actuel ou au taux que vous avez réellement obtenu. Le taux est fixé quand le paiement est enregistré. [Plusieurs devises](page:feature/multiple-currencies) explique comment fonctionne la conversion, et les [voyages en groupe](page:use-case/group-trips) la montrent à l'œuvre."
  - heading: "Un historique que vous pouvez vérifier"
    body: "Chaque paiement enregistré reste dans l'historique du groupe avec sa date, son montant et sa note. Seule la personne qui a enregistré un paiement peut le modifier, et elle ou un admin du groupe peut le supprimer. Un paiement qui concerne quelqu'un qui a quitté le groupe est verrouillé. Pour un scénario détaillé entre colocataires, voir [colocataires](page:use-case/housemates)."
limits:
  heading: "Ce que Side Badger ne fait pas"
  items:
    - "Side Badger ne fait pas circuler l'argent, n'envoie pas de liens de paiement et n'envoie pas de demandes de paiement. Un paiement dans l'appli est l'enregistrement d'un paiement fait ailleurs."
    - "Les paiements suggérés viennent d'une méthode d'appariement simple, appliquée par devise. Elle suggère toujours moins de paiements qu'il n'y a de personnes avec un solde dans cette devise (quatre personnes, trois paiements au plus), mais elle ne trouve pas toujours le plus petit nombre possible."
    - "Vous ne pouvez pas désactiver les suggestions. **Tout afficher** liste tous les paiements suggérés du groupe, pas seulement les vôtres."
    - "Les devises ne sont jamais compensées entre elles, sauf si les dépenses ont été converties à la saisie."
    - "Il n'y a pas de rappels, donc relancer un paiement reste à votre charge."
useCasesHeading: "Là où régler les comptes compte"
faq:
  heading: Questions
  items:
    - q: "Side Badger envoie-t-il l'argent ?"
      a: "Non. Remboursez-vous comme vous voulez, puis enregistrez le paiement dans Side Badger pour que le solde se mette à jour."
    - q: "Puis-je désactiver les paiements suggérés ?"
      a: "Non. La simplification reste activée, et **Tout afficher** liste tous les paiements suggérés du groupe, pas seulement ceux qui vous concernent."
    - q: "Pourquoi les euros et les livres sont-ils séparés ?"
      a: "Les soldes restent dans la devise où vous avez payé, sauf si vous convertissez en saisissant une dépense ou un paiement. Les dettes dans des devises différentes ne sont jamais compensées entre elles."
    - q: "Et si quelqu'un ne paie qu'une partie de ce qu'il doit ?"
      a: "Enregistrez la partie payée. Le reste demeure dans le solde jusqu'à ce qu'il soit payé."
    - q: "Est-ce toujours le plus petit nombre de paiements possible ?"
      a: "Ce n'est pas garanti. Il suggère toujours moins de paiements qu'il n'y a de personnes avec un solde dans cette devise, donc pour quatre personnes jamais plus de trois. Dans l'exemple des colocataires, cela fait deux paiements, là où rembourser chaque personne directement en demandait six."
