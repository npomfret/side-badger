sections:
  - heading: "Money gist, beside di money"
    body: "Where shared money dey, gist, doubt and plans dey too. Side Badger dey keep all three beside di numbers, so nobody go need scroll go back inside di chat."
    items:
      - "**Comments for where dem suppose dey.** Drop comment for di group itself, or for any expense, list or poll, and keep di yarn beside di thing wey e dey about."
      - "**Receipts and photos.** Keep up to three receipts for each expense, and add photos or PDFs to comments for di group, a list or a poll."
      - "**Questions, no be quarrel.** Admin fit turn on questions, then anybody wey dey inside di expense fit ask about am. E go stay out of di balances until dem don settle am."
      - "**Lists and polls.** Put di shared shopping list beside di shopping bills, and make people vote for di villa shortlist, anonymous if you like."
      - "**Small clap.** React to expenses, payments and comments, and clap for payment when e land."
  - heading: "Your group, your rules"
    body: "Splitwise help centre talk say e no support group admins or special permissions. Side Badger get roles and permissions, for di groups wey need person to keep di numbers neat."
    items:
      - "**Admin, member and viewer dem.** Make person viewer: im go see everything but e no go fit change anything."
      - "**Two presets, or make your own.** Start with Open collaboration or Managed group, or set each permission yourself: who fit edit and delete expenses, edit lists, invite and let new people enter."
      - "**Approval to join.** Turn on approval and admin go let each person enter."
      - "**Di group own settings.** Limit am to di currencies wey una really dey use, choose im default currency and give am header picture."
      - "**Lock am when e don finish.** Di numbers go stay as dem be until admin unlock am."
  - heading: "Free here, pay there"
    body: "Splitwise Pro na Splitwise paid plan, and im own Pro page dey sell three things wey no cost anything for Side Badger."
    items:
      - "**Receipt scanning.** Splitwise Pro dey scan photo of your receipt. Side Badger dey do am free, with no scan credits: e go fill di total, date and place make you just check am."
      - "**Currency conversion.** Splitwise Pro dey change group expenses to your default currency when you tap Convert. Side Badger dey change each expense as you dey put am, with current exchange rate or di one wey you really get, and di original amount go still dey for di expense."
      - "**No daily limit.** Splitwise Pro dey sell unlimited expenses, and im help centre talk say free users fit add up to 4 expenses each day. Side Badger no get any daily limit."
  - heading: "Your bank no dey inside dis one"
    body: "Side Badger no dey connect to your bank and e no dey ask for your bank details. E dey keep record of who owe who; una go pay each other anyhow una like, then record di payment. No bank login to give anybody, so na one less thing to worry about."
  - heading: "One app, for your browser and your phone"
    body: "Side Badger dey run for your browser. Sign in, add am to your home screen, and e go open like app. Na di same app either way, so new feature go dey your phone di next time you open am, no app-store update to wait for."
  - heading: "And small party tricks"
    items:
      - "**Ask your assistant.** Side Badger dey work with ChatGPT and Claude: tell yours make e add expense, scan receipt or record payment."
      - "**Everybody for dia own language.** Side Badger dey speak 39 languages and each person dey choose im own. Splitwise home page talk say 7+. E dey handle 133 currencies too, for di trip wey dey go everywhere."
      - "**Help without to comot from di app.** You dey stuck, or you see bug? Tell us from di app and read our reply for there."
  - heading: "Where Splitwise still dey win"
    body: "We prefer make you choose di right app pass make you find out later. If your group need any of dese ones, Splitwise get am and Side Badger no get."
    items:
      - "**App-store apps.** Side Badger dey live for your browser and your home screen, no be for di app stores."
      - "**Offline mode.** Side Badger need connection."
      - "**Payments inside di app.** For some countries Splitwise fit move di money too. Side Badger just dey keep di record."
      - "**Sharing by shares or by item.** Side Badger get one payer for each expense, wey una go share equally, by exact amounts or by percentage. Im receipt scanning no dey assign items to people."
      - "**Charts and default split dem.** Splitwise Pro get both. Side Badger just dey keep count of who owe who, and na so di whole trick be."
  - heading: "How to move your group come here"
    body: "No importer dey, so to move mean say you go start fresh. Settle up for Splitwise first, then create group for Side Badger and invite everybody with link or QR code. Everybody for di group need free account, and email address na all e take to sign up."
