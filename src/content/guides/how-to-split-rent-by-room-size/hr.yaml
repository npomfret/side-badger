meta:
  title: "Kako podijeliti najamninu prema veličini sobe | Side Badger"
  description: "Veća soba, veći udio. Odvoji zajedničke prostorije, ostatak podijeli prema površini i postotke upiši jednom. Izračun prikazan za troje cimera."
h1: "Kako podijeliti najamninu prema veličini sobe"
navLabel: "Najamnina po veličini sobe"
lead: "Odredi koliki dio najamnine otpada na zajedničke prostorije i podijeli ga jednako, a ostatak podijeli prema površini svake spavaće sobe. Zaokruži na cijele postotke, jednom ih upiši uz najamninu u Side Badgeru i svaki mjesec kopiraj trošak."
cta:
  heading: "Upiši najamninu jednom"
  body: "Napravi besplatan korisnički račun, osnuj grupu za stan i upiši najamninu s postocima o kojima ste se dogovorili. Sljedeći mjesec je kopija. Želiš li prvo kratak obilazak? Pogledaj [kako radi](page:how-it-works) ili [što je sve besplatno](page:pricing)."
sections:
  - heading: "Troje ljudi, jedan stan, jedna svađa"
    body: "Priya, Tom i Aisha dijele stan koji košta 1.950 £ mjesečno. Godinu dana dijelili su ga na troje jer je tako bilo lako. Onda je Aisha izmjerila svoju sobu. Priyina soba ima 16 m², Tomova 12 m², a Aishina 10 m², pa je Aisha plaćala isto što i Priya, a njezina je soba za više od trećine manja. Nitko nije bio nerazuman. Nitko nije izračunao. Uz večeru iz dostave najprije su dogovorili jedno pravilo. Od najamnine 40 % plaća kuhinju, kupaonicu i dnevni boravak, koje koriste sva troje."
  - heading: "Metoda, s prikazanim računima"
    body: "Četiri koraka, jedna mjerna vrpca i kalkulator na telefonu."
    items:
      - "**Odvoji zajednički dio.** Grupa se dogovori koji dio najamnine ide na prostorije koje koriste svi. Za ovaj stan to je 40 %, što je 13,33 % po osobi među troje ljudi."
      - "**Ostatak podijeli prema površini.** Preostalih 60 % ide prema veličini spavaće sobe. Spavaće sobe zajedno imaju 38 m² (16 + 12 + 10), pa je Priyin dio 60 % × 16/38, što je 25,26 %."
      - "**Zbroji dva dijela.** Priya: 25,26 % + 13,33 % = 38,6 %. Tom: 60 % × 12/38 = 18,95 %, plus 13,33 % je 32,3 %. Aisha: 60 % × 10/38 = 15,79 %, plus 13,33 % je 29,1 %."
      - "**Zaokruži i provjeri.** Cijele postotke lakše je upisati i lakše se oko njih raspravlja, pa 38,6 % postaje 39 %, 32,3 % postaje 32 %, a 29,1 % postaje 29 %. Provjeri je li 39 + 32 + 29 jednako 100. Ako zaokruživanje završi na 99 ili 101, grupa se dogovori čiji se iznos pomiče za jedan postotni bod."
  - heading: "Kako izgleda mjesec u stanu"
    body: "Najamnina od 39 %, 32 % i 29 % iznosi 760,50 £, 624,00 £ i 565,50 £. Priya je platila stanodavcu, pa joj se tijekom mjeseca duguje 1.142,50 £, dok Tom duguje 566,00 £, a Aisha 576,50 £. Side Badger predlaže dvije uplate, obje Priyi."
  - heading: "Postavi u Side Badgeru"
    body: "Jedna večer, većinom potrošena na raspravu o tih 40 %."
    items:
      - "**Napravi grupu.** Na nadzornoj ploči odaberi **Kreiraj grupu** i imenuj je po stanu. Odaberi **Pozovi druge** i pošalji poveznicu ili QR kod. Svatko se prijavi ili napravi besplatan korisnički račun i odabere ime pod kojim želi biti prikazan u ovoj grupi."
      - "**Dodaj najamninu.** Odaberi **Dodaj trošak**. Upiši opis i iznos, a pod **Tko je platio?** odaberi osobu koja je platila stanodavcu. Sve troje ostavi pod **Podijeli između**, zatim pod **Kako podijeliti** odaberi **Postotak** i upiši 39, 32 i 29. Obrazac te upozori ako postoci zajedno ne daju 100. Odaberi **Spremi trošak**."
      - "**Dodaj račune.** Energija i internet zasebni su troškovi sa svojim platiteljima. **Kako podijeliti** ostavi na **Jednako**."
      - "**Kopiraj sljedeći mjesec.** Otvori prošlomjesečnu najamninu i odaberi **Kopiraj trošak**. Kopija zadržava platitelja, iznos i podjelu, a preuzima današnji datum. Promijeni iznos ako se najamnina promijenila, zatim odaberi **Kreiraj kopiju**."
      - "**Provjeri tko kome duguje.** Pokazuje ga odjeljak **Stanja**. Platite si kako god želite, a zatim zabilježite uplatu pod **Poravnaj**."
  - heading: "Sobe s kupaonicom, sobice i ljudi koji odlaze"
    items:
      - "**Sobe s vlastitom kupaonicom i sobice.** Površina je samo polazište. Soba s vlastitom kupaonicom vrijedi više od iste površine bez nje, a sobica u koju stanu krevet i jedna optimistična stolica vrijedi manje. Prilagodi postotke dogovorom, provjeri da im je zbroj i dalje 100 i konačne brojke zapiši negdje gdje ih vidi cijeli stan."
      - "**Netko se iseli sredinom mjeseca.** Izračunaj što svaka osoba duguje za taj mjesec i unesi najamninu tog mjeseca s **Točni iznosi** umjesto **Postotak**. Iznosi se moraju zbrajati u najamninu. Učini to prije nego što osoba ode. Nitko ne može napustiti grupu dok duguje ili mu se duguje novac, a trošak u kojem sudjeluje netko tko je otišao postaje samo za čitanje."
      - "**Netko se useli.** Ponovno izmjeri, ponovi račun s novim veličinama soba i nove postotke koristi od sljedeće najamnine. Raniji mjeseci ostaju kakvi su bili."
  - heading: "Što Side Badger ovdje ne radi"
    items:
      - "Ne mjeri tvoje sobe niti bira postotke. Površine i tih 40 % dogovara grupa."
      - "Nema ponavljajućih računa, pa svaki put kopiraš prošlomjesečnu najamninu."
      - "Nikad ne premješta novac i ne plaća stanodavcu. Platite si kako god želite i zabilježite uplatu."
      - "Ne zna što piše u vašem ugovoru o najmu. Vodi evidenciju među ljudima u grupi."
