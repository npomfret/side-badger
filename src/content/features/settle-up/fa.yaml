sections:
  - heading: "ثبت یک پرداخت"
    body: "وقتی کسی پرداخت می‌کند، آن را روی فرد درست ثبت کنید. دکمه‌های تسویه سریع مبلغ را از پرداخت‌های پیشنهادی شما پر می‌کنند و می‌توانید یادداشتی مثل «انتقال بانکی» اضافه کنید (تا 500 نویسه). اگر فقط بخشی از بدهی را بپردازید، بقیه روی مانده می‌ماند. اگر مبلغ را کمتر یا بیشتر از حد وارد کنید، Side Badger پیش از ذخیره هشدار می‌دهد. ثبت پرداخت به مجوز ویرایش هزینه‌ها نیاز دارد و تاریخ نمی‌تواند در آینده باشد."
  - heading: "به ارز دیگری پرداخت کردید؟"
    body: "مانده‌ها به همان ارزی که پرداخت شده‌اند می‌مانند، پس بدهی یورویی یورویی می‌ماند. یورو بدهکارید و به پوند می‌پردازید؟ پرداخت را هنگام ثبت تبدیل کنید، با نرخ تبدیل روز یا با نرخی که واقعاً گرفتید. نرخ هنگام ذخیره پرداخت ثابت می‌شود. [چند ارز](page:feature/multiple-currencies) توضیح می‌دهد تبدیل چطور کار می‌کند و [سفرهای گروهی](page:use-case/group-trips) آن را در عمل نشان می‌دهد."
  - heading: "تاریخچه‌ای که می‌توانید بررسی کنید"
    body: "هر پرداخت ثبت‌شده با تاریخ، مبلغ و یادداشتش در تاریخچه گروه می‌ماند. فقط کسی که پرداخت را ثبت کرده می‌تواند آن را ویرایش کند و خودش یا مدیر گروه می‌تواند حذفش کند. پرداختی که شامل کسی باشد که از گروه رفته قفل می‌شود. برای یک سناریوی کامل هم‌خانه‌ها، [هم‌خانه‌ها](page:use-case/housemates) را ببینید."
limits:
  heading: "کارهایی که Side Badger نمی‌کند"
  items:
    - "Side Badger پول جابه‌جا نمی‌کند، پیوند پرداخت نمی‌فرستد و درخواست پرداخت نمی‌فرستد. پرداخت در برنامه ثبتِ پرداختی است که جای دیگری انجام شده."
    - "پرداخت‌های پیشنهادی از یک روش ساده تطبیق می‌آیند که برای هر ارز اعمال می‌شود. همیشه کمتر از تعداد افراد دارای مانده در آن ارز پرداخت پیشنهاد می‌دهد (چهار نفر، حداکثر سه پرداخت)، اما همیشه کمترین تعداد ممکن را پیدا نمی‌کند."
    - "نمی‌توانید پیشنهادها را خاموش کنید. **نمایش همه** هر پرداخت پیشنهادی گروه را فهرست می‌کند، نه فقط مال شما را."
    - "ارزها هرگز با هم خنثی نمی‌شوند، مگر اینکه هزینه‌ها هنگام ورود تبدیل شده باشند."
    - "یادآوری وجود ندارد، پس پیگیری یک پرداخت هنوز با خود شماست."
useCasesHeading: "جایی که تسویه حساب مهم است"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "آیا Side Badger پول را می‌فرستد؟"
      a: "نه. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را در Side Badger ثبت کنید تا مانده به‌روز شود."
    - q: "می‌توانم پرداخت‌های پیشنهادی را خاموش کنم؟"
      a: "نه. ساده‌سازی روشن می‌ماند و **نمایش همه** هر پرداخت پیشنهادی گروه را فهرست می‌کند، نه فقط آن‌هایی که به شما مربوط است."
    - q: "چرا یورو و پوند جدا نگه داشته می‌شوند؟"
      a: "مانده‌ها به همان ارزی که با آن پرداخت کرده‌اید می‌مانند، مگر اینکه هنگام ورود هزینه یا پرداخت تبدیل کنید. بدهی‌ها در ارزهای مختلف هرگز با هم خنثی نمی‌شوند."
    - q: "اگر کسی فقط بخشی از بدهی‌اش را بپردازد چه؟"
      a: "بخشی را که پرداخته ثبت کنید. بقیه روی مانده می‌ماند تا پرداخت شود."
    - q: "آیا این همیشه کمترین تعداد ممکن پرداخت است؟"
      a: "تضمین نیست. همیشه کمتر از تعداد افراد دارای مانده در آن ارز پرداخت پیشنهاد می‌دهد، پس برای چهار نفر هیچ‌وقت بیش از سه تا پیشنهاد نمی‌دهد. در مثال هم‌خانه‌ها این دو پرداخت است، در حالی که بازپرداخت مستقیم به هر نفر شش پرداخت می‌شد."
