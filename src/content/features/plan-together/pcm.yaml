meta:
  title: "Shared lists, polls and comments for group money | Side Badger"
  description: "Comment on expenses, question di odd one, keep shared shopping list and vote on di villa. Plan di spending together, then share am. Free, no ads."
h1: "Plan am together, share am after"
navLabel: "Plan am together"
lead: "Di shopping list and di shopping bill, finally dey talk to each other. Side Badger give your group place to talk about di money before and after dem spend am, with comments on every expense, way to question di ones wey look wrong, shared lists and polls for di big decisions. Then you go [share expenses](page:feature/split-expenses) as usual."
cta:
  heading: "Plan am, then share am"
  body: "Create free account, start group and put di first list, poll or question right next to di money. You no sure wetin go happen next? See [how e dey work](page:how-it-works)."
problem:
  heading: "Di chat dey one side, di bill dey another side"
  body: "Group spending usually dey stay for two places. Di numbers dey one place, and di argument about di numbers dey inside chat wey don scroll go since Tuesday. Di shopping list na photo of fridge. Dem decide di villa with thumbs-up from most people, probably. Side Badger dey keep di planning inside di group, next to di expenses wey e dey about, so comment dey where di cost dey, list dey where di shop dey, poll dey for di big decision, and way dey to talk say “hold on, dis one correct?” without writing long paragraph. All of am dey stay about di group money, na wetin di group dey for."
workflow:
  heading: "From di villa vote reach di shopping bill"
  steps:
    - title: "Put di big decision to vote"
      body: "Add poll for di decision wey go set di bill, like which villa. Pick two to ten options, talk how many votes each person get, then close am when everybody don vote and di winner go dey marked."
      shot: S17
      shotAlt: "Closed poll with di winning option marked and number of votes beside each option"
    - title: "Write di shopping list together"
      body: "Start shared list, add di items and tick dem off as dem reach di trolley. Di shop go enter afterwards as expense."
      shot: S16
      shotAlt: "Shared shopping list with some items wey dem don tick and progress count"
    - title: "Talk about di cost where e dey stay"
      body: "Comment on di expense itself, attach di receipt and react with emoji. Di conversation go stay next to di number wey e dey about."
      shot: S08
      shotAlt: "Expense with im details, receipt thumbnail, comment thread and emoji reactions"
    - title: "Question di one wey look off"
      body: "If di group don switch on expense questions, anybody wey dey inside expense fit choose **I get question**. Di expense go stay out of di balances until dem deal with di question."
      shot: S18
      shotAlt: "Di expenses list with Questioned badge and di Only questioned filter"
    - title: "See wetin change, and who change am"
      body: "Di activity feed and di notifications bell dey show wetin new across your groups. Push notifications dey there if you want dem."
      shot: S19
      shotAlt: "Di notifications dropdown with list of recent activity"
