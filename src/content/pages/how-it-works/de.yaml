meta:
  title: So funktioniert Side Badger | Gruppenausgaben in fünf Schritten teilen
  description: Gruppe erstellen, Leute einladen, Ausgaben erfassen und abrechnen. Sieh, was zwischen "jemand hat bezahlt" und "wir sind quitt" passiert, mit einem durchgerechneten Beispiel.
h1: So funktioniert Side Badger
navLabel: So funktioniert es
lead: Was passiert zwischen "jemand hat bezahlt" und "wir sind quitt"? Fünf Schritte, keine Tabelle und ein Dachs, der vor allem dekorativ ist. Hier ist die ganze Reise, von der ersten Gruppe bis zur letzten erfassten Zahlung. Mehr zu den einzelnen Schritten findest du unter [Ausgaben teilen](page:feature/split-expenses) und [Abrechnen](page:feature/settle-up).
cta:
  heading: Von "Ich übernehm das" bis "wir sind quitt"
  body: Erstelle ein kostenloses Konto, starte eine Gruppe und füge die erste Ausgabe hinzu. Der Dachs urteilt nicht über den Beleg.
  button: Kostenloses Konto erstellen
steps:
  - title: Gruppe erstellen
    body: Lege für jedes Haus, jede Reise und jedes Event eine eigene Gruppe an, damit die Miete nie in derselben Liste landet wie das Hochzeitsgeschenk. Gib ihr einen Namen, wähle den Namen, unter dem dich die anderen sehen, und beschränke auf Wunsch die erlaubten Währungen. Dein Dashboard zeigt dann alle Gruppen und deinen Stand in jeder davon auf einem Bildschirm.
    shot: S02
    shotAlt: Der Dialog zum Erstellen einer Gruppe mit geöffnetem Abschnitt für Währungsbeschränkungen
  - title: Leute einladen
    body: Teile einen Beitrittslink oder zeige einen QR-Code und lege fest, wie lange er gilt, von 15 Minuten bis zu 5 Tagen. Wer beitritt, braucht ein kostenloses Konto und eine bestätigte E-Mail-Adresse, und eine Gruppe fasst bis zu 50 Personen. Wenn du auswählen willst, wer hereinkommt, schalte die Freigabe ein, und ein Admin lässt jede Person durch.
    shot: S03
    shotAlt: Der Einladungsdialog auf dem Link-Tab mit QR-Code und Ablaufoptionen
  - title: Ausgaben direkt erfassen
    body: Sag, wer bezahlt hat, wie viel und für wen. Teile gleichmäßig, nach genauen Beträgen oder in Prozent und lass alle weg, die nicht dabei waren. Füge die Ausgabe hinzu, und alle sehen sie sofort, dazu was sich geändert hat und wer es geändert hat.
    shot: S05
    shotAlt: Das Ausgabenformular mit Prozentaufteilung, die die Miete nach Zimmergröße verteilt
  - title: Salden im Blick behalten
    body: Side Badger führt für jede Währung einen laufenden Saldo, damit du auf einen Blick siehst, wer wem was schuldet. Statt alle ein Netz kleiner Schulden entwirren zu lassen, schlägt es eine kurze Liste von Zahlungen vor, die die Gruppe ausgleicht.
    shot: S10
    shotAlt: Der Salden-Bildschirm mit vereinfachten Schulden in zwei Währungen und eingeschaltetem "Alle anzeigen"
  - title: Außerhalb der App abrechnen, in der App erfassen
    body: Side Badger bewegt nie Geld. Zahlt einander, wie ihr wollt, und erfasst dann die Zahlung, damit die Salden nachziehen und sich die Bildschirme aller ohne Neuladen aktualisieren. "Abrechnen" heißt einfach, dass die Salden null anzeigen. Niemand kann eine Gruppe verlassen, solange er noch Geld schuldet oder bekommt, wer also zur Tür will, rechnet zuerst ab.
    shot: S11
    shotAlt: Das Zahlungsformular mit Schnellausgleich-Schaltflächen und dem Hinweis bei Teilzahlung
requirements:
  heading: Was du brauchst
  items:
    - Ein kostenloses Konto. Du brauchst nur eine E-Mail-Adresse und ein Passwort, und du bestätigst die E-Mail-Adresse, bevor du etwas hinzufügen kannst.
    - Mindestens 18 Jahre.
    - Einen aktuellen Browser auf dem Handy oder Computer und eine Verbindung. Side Badger ist keine App aus dem App-Store und funktioniert nicht offline.
    - Optional einen Platz auf deinem Home-Bildschirm. Du brauchst keinen App-Store, denn du kannst Side Badger zum Home-Bildschirm oder Dock hinzufügen, und es öffnet sich wie eine App.
