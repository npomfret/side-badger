meta:
  title: "Μοιραστείτε τα έξοδα ενός ομαδικού ταξιδιού, σε 140 νομίσματα"
  description: "Παρακολουθήστε ποιος πλήρωσε τι σε ένα ομαδικό ταξίδι, καταχωρίστε έξοδα στο τοπικό νόμισμα, μετατρέψτε τα ή όχι και τακτοποιηθείτε μία φορά στο τέλος. Δωρεάν, στο πρόγραμμα περιήγησης."
h1: "Μοιραστείτε τα έξοδα ενός ομαδικού ταξιδιού, σε 140 νομίσματα"
navLabel: "Ομαδικά ταξίδια"
lead: "Παρακολουθήστε τη βίλα, τα ταξί και τον έναν γύρο κοκτέιλ που κανείς δεν θυμάται να προσφέρθηκε να πληρώσει. Το Side Badger κρατά το τρέχον σκορ όσο λείπετε, [τα βγάζει πέρα με λίρες, ευρώ και 138 ακόμη νομίσματα](page:feature/multiple-currencies) και σας δίνει μια [σύντομη λίστα πληρωμών](page:feature/settle-up) όταν γυρίσετε σπίτι."
cta:
  heading: "Μαθηματικά διακοπών, έτοιμα πριν ξεθωριάσει το μαύρισμα"
  body: "Δημιουργήστε μια ομάδα, στείλτε τον σύνδεσμο πρόσκλησης στα άτομα του ταξιδιού και προσθέτετε έξοδα καθώς προκύπτουν."
  button: "Δημιουργία δωρεάν λογαριασμού"
scenario:
  heading: "Όλοι πλήρωσαν κάτι, σε κάποιο νόμισμα"
  body: "Κάποιος έκλεισε τις πτήσεις, κάποιος άλλος έβαλε τη βίλα στην κάρτα του και ένας τρίτος κάλυψε το δείπνο με μετρητά. Την τρίτη μέρα κανείς δεν ξέρει ποιος είναι μπροστά. Το ερώτημα είναι απλό, ακόμη κι αν η απάντηση συνήθως ζει σε ένα φύλλο εργασίας που κανείς δεν θέλει να ανοίξει. Ποιος πλήρωσε τι, σε ποιο νόμισμα και πώς τακτοποιούνται όλοι μία φορά στο τέλος;"
sections:
  - heading: "Πριν φύγετε"
    body: "Βάλτε σε ψηφοφορία τη σύντομη λίστα βιλών, ανώνυμα αν θέλετε, ώστε η απόφαση να ανήκει στην ομάδα και όχι σε όποιον μουτρώνει περισσότερο. Μετά κρατήστε την κοινή λίστα ψωνιών δίπλα στους λογαριασμούς των ψωνιών, ώστε κανείς να μην αγοράσει τρία σωληνάρια αντηλιακό και κανέναν προσαρμογέα πρίζας."
  - heading: "Όσο λείπετε"
    body: "Προσθέτετε κάθε έξοδο καθώς προκύπτει, στο νόμισμα στο οποίο πληρώθηκε. Φωτογραφίστε την απόδειξη και το Side Badger συμπληρώνει το σύνολο, την ημερομηνία και τον τόπο για να τα ελέγξετε· οι εικόνες αποδείξεων διαβάζονται από την υπηρεσία AI της Google. Μετατρέψτε το ποσό με μια τρέχουσα συναλλαγματική ισοτιμία, την οποία μπορείτε να αλλάξετε σε αυτήν που ίσχυσε στην πραγματικότητα, και το αρχικό ποσό μένει στο έξοδο. Ή αφήστε τα ευρώ ως ευρώ και αποφασίστε αργότερα. Η ομάδα μπορεί επίσης να διαλέξει ένα νόμισμα και τα νέα έξοδα μετατρέπονται σε αυτό αυτόματα."
  - heading: "Δεν έκαναν όλοι τα πάντα"
    body: "Κάποιοι έχασαν το δείπνο, κάποιοι δεν πήγαν στη βαρκάδα. Αφήστε τους έξω από τα κόστη στα οποία δεν συμμετείχαν και χωρίστε τα υπόλοιπα [εξίσου, με ακριβή ποσά ή με ποσοστά](page:feature/split-expenses). Κανείς δεν πληρώνει το κομμάτι του ταξιδιού που κοιμήθηκε."
  - heading: "Τακτοποιηθείτε όταν γυρίσετε σπίτι"
    body: "Το Side Badger προτείνει μια σύντομη λίστα πληρωμών που τακτοποιεί όλους. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε το. Με μικτά νομίσματα, κρατήστε το καθένα ξεχωριστά ή μετατρέψτε στην πορεία· το παράδειγμα της Λισαβόνας παρακάτω δείχνει και τα δύο."
  - heading: "Bachelor και bachelorette"
    body: "Ένα Σαββατοκύριακο με τιμώμενο πρόσωπο θέλει λίγο παραπάνω διαχείριση. Κάντε την ομάδα διαχειριζόμενη, όπου οι διαχειριστές εγκρίνουν τα νέα μέλη και μόνο οι δημιουργοί και οι διαχειριστές αλλάζουν έξοδα. Χρησιμοποιήστε ακριβή ποσά για το μερίδιο του τιμώμενου προσώπου, περιορίστε την ομάδα στα νομίσματα που πράγματι χρησιμοποιείτε και κλειδώστε την ομάδα όταν τελειώσει, ώστε τα νούμερα να μείνουν στη θέση τους."
exampleAfter: 4
example:
  heading: "Τέσσερις φίλοι στη Λισαβόνα"
  currency: GBP
  people:
    - id: ana
      name: Άνα
    - id: ben
      name: Μπεν
    - id: chloe
      name: Κλόε
    - id: dev
      name: Ντεβ
  expenses:
    - label: "Πτήσεις"
      payer: ana
      amount: 480
      split:
        method: equal
    - label: "Βίλα"
      payer: ben
      amount: 900
      currency: EUR
      split:
        method: equal
    - label: "Δείπνο"
      payer: chloe
      amount: 120
      currency: EUR
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "Εκδρομή με καράβι"
      payer: dev
      amount: 160
      currency: EUR
      split:
        method: equal
  conversion:
    rates:
      EUR: 0.85
featuresHeading: "Πάνω σε τι στηρίζεται ένα ταξίδι"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορούν να μείνουν έξω όσοι έχασαν το δείπνο;"
      a: "Ναι. Διαλέξτε ποιοι συμμετείχαν σε κάθε έξοδο και χρεώνονται μόνο αυτοί."
    - q: "Λειτουργεί χωρίς σήμα;"
      a: "Όχι. Το Side Badger χρειάζεται σύνδεση, οπότε προσθέστε τα έξοδα όταν ξαναβρείτε wifi."
    - q: "Χρειάζεται να εγκαταστήσει κάτι ο καθένας;"
      a: "Όχι. Τρέχει στο πρόγραμμα περιήγησης. Στείλτε τον σύνδεσμο πρόσκλησης και τα άτομα μπαίνουν από τα κινητά τους."
    - q: "Ποια συναλλαγματική ισοτιμία χρησιμοποιεί;"
      a: "Μια τρέχουσα συναλλαγματική ισοτιμία όταν καταχωρίζετε το έξοδο ή τη δική σας, αν πήρατε διαφορετική. Η ισοτιμία κλειδώνει όταν αποθηκευτεί το έξοδο, οπότε τα παλιά έξοδα δεν επανεκτιμώνται ποτέ."
    - q: "Μπορούμε να παγώσουμε την ομάδα μετά το ταξίδι;"
      a: "Ναι. Ένας διαχειριστής μπορεί να κλειδώσει την ομάδα ώστε τα νούμερα να μείνουν στη θέση τους."
    - q: "Υπάρχει όριο στα ποσά;"
      a: "Ναι. 999.999,99 ανά έξοδο, στο δικό του νόμισμα."
