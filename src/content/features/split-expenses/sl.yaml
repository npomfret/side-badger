meta:
  title: "Deli stroške enako, točno ali po odstotkih | Side Badger"
  description: "Skupni strošek razdeli enako, po točnih zneskih ali po odstotkih in izpusti vsakogar, ki ga ni bilo zraven. Brezplačno, brez oglasov in brez dnevnih omejitev."
h1: "Deli stroške enako, točno ali po odstotkih"
navLabel: "Delitev stroškov"
lead: "Vsega ne moreš deliti 50/50. Side Badger se znajde. Povej, kdo je plačal, izberi osebe, ki so strošek delile, in ga razdeli **enako, po točnih zneskih ali po odstotkih**. Zamere se prodajajo posebej."
cta:
  heading: "Razdeli naslednjega kot se spodobi"
  body: "Ustvari brezplačen uporabniški račun, ustanovi skupino in dodaj strošek, ki ga že dolgo nameravaš urediti. Ne veš, kaj sledi? Poglej, [kako deluje](page:how-it-works), ali preveri, [kaj vključuje brezplačna različica](page:pricing)."
problem:
  heading: "Vsega ne moreš deliti 50/50"
  body: "Najemnina sledi velikosti sobe. Darilo sledi temu, kdo je kaj obljubil. Večerja sledi temu, kdo je ostal na sladico. Delitev računa na pol deluje do prvega računa, ki ni tak, in takrat nekdo odpre preglednico. Side Badger beleži, kdo je plačal, kdo je strošek delil in kako se deli, zato stanja pridejo prav in nikomur ni treba pri mizi pisno deliti."
workflow:
  heading: "Dodajanje stroška od začetka do konca"
  steps:
    - title: "Povej, kdo je plačal in za kaj"
      body: "Vnesi znesek, kratek opis in osebo, ki je plačala. Za vsak strošek plača ena oseba, kar ohranja račune poštene."
      shot: S05
      shotAlt: "Obrazec za strošek z najemnino za kočo, procentualno razdeljeno med tri osebe"
    - title: "Izberi delitev"
      body: "Izberi enako, točne zneske ali odstotke. Odstotki morajo skupaj dati 100, točni zneski pa skupni znesek."
      shot: S06
      shotAlt: "Obrazec za strošek s točnimi zneski, vnesenimi za vsako osebo pri darilu"
    - title: "Dodaj zgodbo"
      body: "Nastavi datum, dodaj oznake, kraj in opombo. Vsi v skupini vidijo enake podrobnosti in lahko tam takoj komentirajo."
      shot: S08
      shotAlt: "Strošek s podrobnostmi, nitjo komentarjev in izvirnim zneskom, v katerem je bil vnesen"
    - title: "Postavi vprašanje, če se kaj ne zdi prav"
      body: "Če je skupina vklopila vprašanja o stroških, lahko vsak, ki je zajet v strošku, nanj postavi vprašanje, seznam stroškov pa lahko prikaže samo tiste, ki so pod vprašajem."
      shot: S18
      shotAlt: "Seznam stroškov z oznako Postavljeno pod vprašaj in filtrom Samo postavljeno pod vprašaj"
options:
  heading: "Trije načini delitve"
  items:
    - title: "Enako"
      body: "Privzeto za večerje, taksije in vse, kar so vsi delili enakomerno. Če se znesek ne deli brez ostanka, preostali cent pripade eni osebi naključno, ne vedno isti. V spodnjem taksiju je to Ana."
    - title: "Po točnih zneskih"
      body: "Vpiši, koliko komu dolguje. Dobro za darilo, kjer je vsak izbral drugo ceno, ali nakup, kjer je imel v košarici nekdo več kot skupna živila. Zneski morajo skupaj dati skupni znesek."
    - title: "Po odstotkih"
      body: "Vsakemu daj delež celote. Najemnina po velikosti sobe je klasika: največja soba plača največji delež in nihče se ne pretvarja drugače."
