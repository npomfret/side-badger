meta:
  title: "چطور هزینه سفری را که با چند ارز پرداخت شده تقسیم کنیم | Side Badger"
  description: "پوند برای هتل، ین برای رامن. هر ارز را جدا تسویه کنید یا با نرخی که می‌بینید تبدیل کنید. هر دو راه با حساب‌وکتاب کامل نشان داده شده."
h1: "چطور هزینه سفری را که با چند ارز پرداخت شده تقسیم کنیم"
navLabel: "سفر با چند ارز"
lead: "هر هزینه را با ارزی که پرداخت کرده‌اید وارد کنید، بعد یک مسیر انتخاب کنید. یا ارزها را جدا نگه دارید و هرکدام را با پول خودش تسویه کنید، یا با نرخ تبدیل روز تبدیل کنید و یک‌بار تسویه کنید. همین سفر ژاپن به روش اول چهار پرداخت می‌شود و به روش دوم دو پرداخت."
cta:
  heading: "با همان پولی که پرداخت کردید وارد کنید"
  body: "یک حساب رایگان بسازید، برای سفر یک گروه شروع کنید و هر هزینه را با هر ارزی که روی رسید بود اضافه کنید. اول جزئیات می‌خواهید؟ [چند ارز](page:feature/multiple-currencies) یا [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing) را ببینید."
sections:
  - heading: "سه دوست، یک هتل و مقدار زیادی ین"
    body: "زویی، کنجی و لوسی یک هفته را در یک [سفر گروهی](page:use-case/group-trips) در ژاپن می‌گذرانند و هر هزینه مساوی بین هر سه نفر تقسیم می‌شود. زویی هتل را از خانه و با پوند رزرو کرد، به مبلغ £600. لوسی در توکیو پاس‌های قطار را به مبلغ ¥90,000 خرید. کنجی شب رامن را حساب کرد، ¥9,000، و از آن به بعد هر روز یادآوری‌اش کرده است. هیچ‌کس نمی‌خواهد سه رسید را روی سکوی ایستگاه تبدیل کند. برای محاسبه‌های اینجا ¥1 برابر £0.005 است، نرخی گرد که برای همین راهنما ساخته شده. در برنامه از نرخ تبدیل روز استفاده می‌کنید، یا نرخی را که واقعاً گرفته‌اید می‌نویسید."
  - heading: "هر کدام را با پولی که روی رسید است وارد کنید"
    body: "این بخش را هر مسیری که انتخاب کنید انجام دهید. هنوز چیزی لازم نیست تبدیل شود."
    items:
      - "**گروه را بسازید.** در داشبورد **ایجاد گروه** را انتخاب کنید، نام سفر را رویش بگذارید، بعد **دعوت دیگران** را انتخاب کنید و لینک یا کد QR را بفرستید."
      - "**هتل را اضافه کنید.** **افزودن هزینه** را انتخاب کنید و 600 را وارد کنید، با پوند به‌عنوان ارز کنار مبلغ. زیر **چه کسی پرداخت کرد؟** زویی را انتخاب کنید. هر سه نفر را زیر **تقسیم بین** نگه دارید، **نحوه تقسیم** را روی **به طور مساوی** بگذارید و **ذخیره هزینه** را انتخاب کنید."
      - "**ین را اضافه کنید.** همین کار را برای پاس‌های قطار (لوسی پرداخت کرد) و رامن (کنجی پرداخت کرد) انجام دهید، با ین به‌عنوان ارز. ین اعشار ندارد، پس فرم اعشاری نمی‌خواهد."
  - heading: "مسیر اول: ارزها را جدا نگه دارید"
    body: "Side Badger برای هر ارز یک مانده نگه می‌دارد و یکی را با دیگری خنثی نمی‌کند. به پوند، هتل برای هر نفر £200 می‌شود، پس کنجی و لوسی هرکدام £200 به زویی بدهکارند. به ین، پاس‌های قطار و رامن روی هم ¥99,000 می‌شود، یعنی ¥33,000 برای هر نفر. لوسی ¥90,000 پرداخت کرده و ¥57,000 طلبکار است. زویی هیچ ینی پرداخت نکرده و ¥33,000 بدهکار است. کنجی ¥9,000 پرداخت کرده، پس ¥24,000 بدهکار است."
    items:
      - "**پوند.** کنجی £200 به زویی می‌پردازد و لوسی £200 به زویی می‌پردازد."
      - "**ین.** زویی ¥33,000 به لوسی می‌پردازد و کنجی ¥24,000 به لوسی می‌پردازد."
      - "**روی هم چهار پرداخت.** زویی و لوسی در دو ارز به هم بدهکارند که همدیگر را خنثی نمی‌کنند. نرخی در کار نیست، پس چیزی برای بحث کردن نمی‌ماند."
      - "**ین بدهکارید، با پوند می‌پردازید.** کسی که ین ندارد باز هم می‌تواند با پوند بپردازد. هنگام ثبت پرداخت، **ارز دیگر؟** را باز کنید، **تبدیل به** پوند را انتخاب کنید و نرخ را بررسی کنید. ¥33,000 زویی با نرخ این راهنما £165 می‌شود و مانده ین باز هم درست درمی‌آید."
      - "**هر پرداخت را ثبت کنید.** هر طور دوست دارید به هم پرداخت کنید، بعد **تسویه حساب** را انتخاب کنید و از **ثبت تسویه حساب** استفاده کنید. درباره [تسویه حساب](page:feature/settle-up) بیشتر بخوانید."
  - heading: "مسیر دوم: همراه با ثبت تبدیل کنید"
    body: "اگر گروه ترجیح می‌دهد برای هر نفر فقط یک عدد ببیند، هنگام ثبت هزینه تبدیل کنید."
    items:
      - "**روی فرم تبدیل کنید.** در **افزودن هزینه**، **تبدیل به** را انتخاب کنید و پوند را بگذارید. Side Badger نرخ و مبلغ تبدیل‌شده را نشان می‌دهد، با علامت ≈. اگر نرخ دیگری گرفته‌اید، نرخ را ویرایش کنید. مبلغ اصلی ین روی هزینه می‌ماند."
      - "**پوندها را بخوانید.** با ¥1 = £0.005، پاس‌های قطار £450 می‌شود و رامن £45. با هتل £600، این می‌شود £600 + £450 + £45 = £1,095، یعنی £365 برای هر نفر. زویی £600 پرداخت کرده، پس £235 طلبکار است. لوسی £450 پرداخت کرده و £85 طلبکار است. کنجی £45 پرداخت کرده و £320 بدهکار است."
      - "**دو پرداخت.** هر دو از کنجی: £235 به زویی و £85 به لوسی. زویی و لوسی دیگر اصلاً به هم پرداخت نمی‌کنند."
      - "**یا یک ارز گروه تعیین کنید.** برای دور زدن این مرحله اضافه، **تنظیمات** گروه را باز کنید، **تنظیمات ارز** را پیدا کنید و **تبدیل خودکار هزینه‌ها به** را انتخاب کنید. بعد هر هزینه جدید به آن ارز تبدیل می‌شود، باز هم با نرخی که می‌توانید ببینید و تغییر دهید."
  - heading: "کدام مسیر را بروید؟"
    items:
      - "**جدا نگه دارید** وقتی افراد هنوز ین در کیف پولشان دارند، یا وقتی ترجیح می‌دهید سر نرخ بحث نکنید. هزینه‌اش پرداخت‌های بیشتر است، آن هم با بیش از یک ارز."
      - "**تبدیل کنید** وقتی گروه با یک ارز زندگی می‌کند و برای هر نفر یک عدد و فهرستی کوتاه‌تر می‌خواهد، مثل دو انتقال کنجی. هزینه‌اش این است که گروه به یک نرخ اعتماد می‌کند و نرخ روی هر هزینه هنگام ذخیره ثابت می‌شود."
      - "**زود تصمیم بگیرید.** ارز گروه فقط هزینه‌های جدید و کپی‌شده را تبدیل می‌کند. به عقب برنمی‌گردد که آنچه را قبلاً وارد کرده‌اید مرتب کند."
  - heading: "نرخ، و سقف"
    items:
      - "**نرخ هنگام ذخیره ثابت می‌شود.** هزینه‌های قدیمی هرگز دوباره ارزش‌گذاری نمی‌شوند، پس مانده فقط به این دلیل که بازار جابه‌جا شده تغییر نمی‌کند. هزینه‌هایی که در روزهای مختلف وارد می‌شوند می‌توانند نرخ‌های مختلف داشته باشند، پس اگر گروه یک نرخ برای کل سفر می‌خواهد، آن را توافق کنید و هر بار خودتان بنویسید."
      - "**نرخی نیست؟ یکی خودتان بنویسید.** Side Badger هر جا بتواند نرخ تبدیل روز را می‌گیرد، اما برای هر جفت ارز تضمینی نیست. اگر نرخی نبود، یا باجه صرافی نرخ بهتری به شما داد، نرخ خودتان را بنویسید."
      - "**999,999.99 برای هر هزینه، به ارز خودش.** یک سقف، با هر پولی. به ین این کمی کمتر از ¥1,000,000 است، حدود £5,000 با نرخ این راهنما. در ارزی با عددهای بزرگ، مثل روپیه اندونزی، یک صورت‌حساب می‌تواند زودتر به آن برسد. صورت‌حساب را به دو هزینه تقسیم کنید، یا آن را با ارز دیگری وارد و تبدیل کنید."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "هرگز پول را جابه‌جا یا معاوضه نمی‌کند. هر طور دوست دارید به هم پرداخت می‌کنید، بعد پرداخت را ثبت می‌کنید."
      - "140 ارز دارد. ارزهای دیجیتال و فلزات جزو آن‌ها نیستند."
