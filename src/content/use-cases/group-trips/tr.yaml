meta:
  title: "Grup gezisi masraflarını 140 para biriminde bölüşün"
  description: "Bir grup gezisinde kimin neyi ödediğini takip edin, masrafları yerel para biriminde girin, çevirin ya da çevirmeyin ve sonunda bir kerede ödeşin. Ücretsiz, tarayıcıda."
h1: "Grup gezisi masraflarını 140 para biriminde bölüşün"
navLabel: "Grup gezileri"
lead: "Villayı, taksileri ve kimsenin ödemeyi üstlendiğini hatırlamadığı o bir tur kokteyli takip edin. Side Badger siz yokken hesabı tutar, [sterlin, euro ve 138 başka para birimini](page:feature/multiple-currencies) idare eder ve eve dönünce size [kısa bir ödeme listesi](page:feature/settle-up) verir."
cta:
  heading: "Bronzluk solmadan bitmiş tatil matematiği"
  body: "Bir grup kurun, davet bağlantısını gezideki kişilere gönderin ve masrafları oluştukça ekleyin."
  button: "Ücretsiz hesap oluştur"
scenario:
  heading: "Herkes bir şey ödedi, bir para biriminde"
  body: "Biri uçuşları ayırttı, bir başkası villayı kartına yazdırdı, üçüncüsü akşam yemeğini nakit kapattı. Üçüncü güne gelindiğinde kimin önde olduğunu kimse bilmiyor. Soru basit, cevap genellikle kimsenin açmak istemediği bir tabloda yaşasa da: kim neyi hangi para biriminde ödedi ve herkes sonunda bir kerede nasıl ödeşiyor?"
sections:
  - heading: "Gitmeden önce"
    body: "Villa kısa listesini oylamaya sunun, isterseniz anonim olarak; karar, en uzun küsen kişiye değil gruba ait olsun. Sonra ortak alışveriş listesini alışveriş faturalarının yanında tutun ki kimse üç tüp güneş kremi alıp priz adaptörü almamış olmasın."
  - heading: "Siz yokken"
    body: "Her masrafı oluştuğunda, ödendiği para biriminde ekleyin. Makbuzun fotoğrafını çekin, Side Badger toplamı, tarihi ve yeri sizin kontrol etmeniz için doldursun; makbuz görselleri Google'ın yapay zeka hizmeti tarafından okunur. Tutarı gerçekte uygulanan kura değiştirebileceğiniz güncel bir döviz kuruyla çevirin; orijinal tutar harcamada kalır. Ya da eurolar euro kalsın, sonra karar verin. Grup tek bir para birimi de seçebilir ve yeni harcamalar otomatik olarak ona çevrilir."
  - heading: "Herkes her şeyi yapmadı"
    body: "Bazıları yemeği kaçırdı, bazıları tekneye binmedi. Onları katılmadıkları masraflardan çıkarın ve gerisini [eşit, tam tutarlarla veya yüzdelerle](page:feature/split-expenses) bölüşün. Kimse gezinin uyuyarak geçirdiği kısmı için ödemez."
  - heading: "Eve dönünce ödeşin"
    body: "Side Badger herkesi ödeştiren kısa bir ödeme listesi önerir. Birbirinize istediğiniz yolla ödeyin, sonra kaydedin. Karışık para birimlerinde her birini ayrı tutun ya da giderken çevirin; aşağıdaki Lizbon örneği ikisini de gösterir."
  - heading: "Bekarlığa veda hafta sonları"
    body: "Onur konuğu olan bir hafta sonu biraz daha yönetim ister. Yöneticilerin yeni üyeleri onayladığı ve harcamaları yalnızca oluşturanların ve yöneticilerin değiştirebildiği yönetilen bir grup yapın. Onur konuğunun payı için tam tutarlar kullanın, grubu gerçekten kullandığınız para birimleriyle sınırlayın ve bittiğinde rakamlar yerinde kalsın diye grubu kilitleyin."
exampleAfter: 4
