faq:
  heading: "أسئلة"
  items:
    - q: "هل نستطيع ضبط 60/40 مرة واحدة لكل شيء؟"
      a: "لا. التقسيم يخص كل مصروف. اضبط النسب في أول مصروف، ثم انسخه في المرة القادمة وغيّر ما يختلف. ويتناول [تقسيم المصروفات](page:feature/split-expenses) الطرق الثلاث للتقسيم."
    - q: "هل يرتبط ببنكنا؟"
      a: "لا. لا يلمس Side Badger مالك أبداً. تدفعان لبعضكما بالطريقة التي تناسبكما، ثم تسجّلان ذلك، كما يشرح [تسوية الحسابات](page:feature/settle-up)."
    - q: "هل يستطيع أحد آخر رؤية مجموعتنا؟"
      a: "أعضاؤها فقط، ومجموعة الزوجين فيها عضوان. ومن يستخدم رابط دعوة ما زال صالحاً يستطيع الانضمام، لذا شاركه مع شخص واحد واجعل مدته قصيرة."
    - q: "ماذا لو دفعنا كل منا جزءاً من الفاتورة نفسها؟"
      a: "للمصروف دافع واحد. سجّلا مصروفين، واحداً لكل منكما، فيخرج الرصيد نفسه."
    - q: "هل سيذكّر شريكي بالدفع؟"
      a: "لا. لا توجد تذكيرات، فمهمة التذكير تبقى عليك. وعلى الأقل ستنظران كلاكما إلى الرقم نفسه."
    - q: "ماذا يحدث حين نتوقف عن تقاسم التكاليف؟"
      a: "سوّيا الرصيد وسجّلا الدفعة، فلا يدين أحدكما بشيء. ثم يستطيع المشرف قفل المجموعة، فتبقى الأرقام كما هي، أو إغلاقها نهائياً، فتصبح غير متاحة للجميع. لا تغلقاها إلا حين لا يحتاج أي منكما إلى السجل."
