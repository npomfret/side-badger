faq:
  heading: Kysymyksiä
  items:
    - q: Kumpi on reilumpi, huoneen koko vai tulot?
      a: Ei aina kumpikaan. Huoneen koko sopii kämppiksille, jotka maksavat tilasta, jossa nukkuvat. Tulot sopivat pareille ja ystäville, joiden palkat ovat hyvin erilaiset. Sopikaa asia ennen ensimmäistä vuokrapäivää, ei sen jälkeen.
    - q: Pitäisikö laskut jakaa samalla tavalla?
      a: Kämppiksillä yleensä ei. Kaikki käyttävät sähköä ja laajakaistaa, joten tasajako on yksinkertaisempi, kuten esimerkissä. Tulojen mukaan laskuri antaa laskuille samat osuudet kuin vuokralle.
    - q: Voinko käyttää neliöjalkoja?
      a: Kyllä. Valitse ft² ja kirjoita pinta-alat neliöjalkoina. Yksikkö on vain nimike, ja osuudet tulevat samoiksi, kunhan kaikki käyttävät samaa yksikköä.
    - q: Onko laskuri ilmainen?
      a: Kyllä. Ilmainen. Ei mainoksia. Ei päivittäisiä rajoja. Et tarvitse myöskään tiliä.
