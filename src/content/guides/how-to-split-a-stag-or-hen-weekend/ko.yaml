faq:
  heading: "자주 묻는 질문"
  items:
    - q: "베스트맨이나 신부 들러리 대표는 더 내나요?"
      a: "그룹이 합의할 때만요. 앱은 계산에서 누구에게도 특별한 역할을 주지 않습니다. 누군가 더 많이 부담한다면 **분할 방법**에서 **정확한 금액**이나 **백분율**을 고르고 합의한 몫을 입력하세요."
    - q: "어떤 사람들이 마시지 않은 술은 어떻게 하나요?"
      a: "술을 별도 지출로 추가하고 마신 사람에게만 체크하세요. 모두 마신 양이 다르다면 **정확한 금액**을 고르고 각자의 몫을 입력하세요. 마시지 않은 것에 돈을 내는 사람은 없습니다."
    - q: "나중에 주인공도 그룹을 볼 수 있나요?"
      a: "네, 서프라이즈가 끝난 뒤에요. 초대하고 나면 관리자가 그룹 설정의 **보안 및 권한**에서 그 사람을 **뷰어**로 만들 수 있어요. 뷰어는 모든 것을 보지만 아무것도 바꾸지 못하니, 비밀이 하나도 남지 않을 때까지 기다리세요. 참여하려면 무료 계정이 필요합니다."
