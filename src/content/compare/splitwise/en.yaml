faq:
  heading: Questions
  items:
    - q: Is Side Badger a free alternative to Splitwise?
      a: "For splitting bills in a group, yes. Receipt scanning, currency conversion and no ads are free, with no daily limits. If you need a native app, offline use, recurring expenses or payments inside the app, Splitwise does those and Side Badger doesn't."
    - q: Where do the Splitwise details come from?
      a: "Splitwise's own pages: its home page, its Pro page and its help centre. Each row of the table links to the page it came from, and the date above the table says when we read them. We check them every quarter."
    - q: Will Side Badger stay free?
      a: "Everything in Side Badger is free today, and there is no paid tier. If that ever changes, we'll give you notice first. The [pricing page](page:pricing) has the details."
    - q: Does everyone in my group have to switch?
      a: "Yes. Everyone in a group needs a free Side Badger account, and they can join with a link or a QR code."
    - q: Does Side Badger have a mobile app?
      a: "Not in an app store. It runs in your browser: sign in on your phone, then add it to your home screen so it opens like an app. [How it works](page:how-it-works) shows how."
