featuresHeading: "الميزات التي يستخدمها هذا"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يستطيع الضيوف رؤية المجموعة دون الانضمام؟"
      a: "لا. ينضم الناس برابط أو برمز QR وبحساب مجاني، فيرون المجموعة بعد دخولهم."
    - q: "هل يستطيع Side Badger جمع المال؟"
      a: "لا. يحتفظ Side Badger بالحساب ولا ينقل المال أبداً. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة. وهو مجاني، بلا إعلانات وبلا حدود يومية؛ انظر [الأسعار](page:pricing)."
    - q: "هل يمكن أن تكون الأصوات سرية؟"
      a: "نعم. حين تنشئ استطلاعاً يمكنك إخفاء من صوّت لماذا. ولا يمكن تغيير الإعدادات إلا قبل أول صوت."
    - q: "هل يستطيع الناس المساهمة بمبالغ مختلفة؟"
      a: "نعم. قسّم المصروف بمبالغ محددة، لتكون حصة كل شخص هي الرقم الذي اتفقتم عليه، أو استبعد من لم يشاركوا."
    - q: "هل يستطيع المنظِّم أن يمسك الدفاتر؟"
      a: "نعم. استخدم إعداد المجموعة المُدارة، فلا يغيّر المصروفات إلا المنشئون والمشرفون، ويوافق المشرفون على الأعضاء الجدد."
