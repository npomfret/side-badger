meta:
  title: "Sut mae Side Badger yn gweithio | Rhannu treuliau grŵp mewn pum cam"
  description: "Creu grŵp, gwahodd pobl, ychwanegu treuliau a setlo. Gweld beth sy'n digwydd rhwng “mae rhywun wedi talu” a “rydyn ni'n sgwâr”, gydag enghraifft wedi'i gweithio."
h1: "Sut mae Side Badger yn gweithio"
navLabel: "Sut mae'n gweithio"
lead: "Beth sy'n digwydd rhwng “mae rhywun wedi talu” a “rydyn ni'n sgwâr”? Pum cam, dim taenlen, ac un mochyn daear sydd gan amlaf yn addurniadol. Dyma'r daith gyfan, o'r grŵp cyntaf i'r taliad olaf a gofnodwyd. I gael y manylion am unrhyw gam, gweler [rhannu treuliau](page:feature/split-expenses) a [setlo](page:feature/settle-up)."
cta:
  heading: "O “fe dalaf i am hwn” i “rydyn ni'n sgwâr”"
  body: "Creu cyfrif am ddim, cychwyn grŵp ac ychwanegu'r gost gyntaf. Fydd y mochyn daear ddim yn barnu'r dderbynneb."
steps:
  - title: "Creu grŵp"
    body: "Gwnewch un grŵp ar gyfer pob tŷ, taith neu ddigwyddiad, fel nad yw'r rhent byth yn mynd yn yr un rhestr â'r anrheg briodas. Rhowch enw iddo, dewiswch yr enw rydych chi am i bobl ei weld ac, os dymunwch, cyfyngwch ar yr arian cyfred y mae'n ei dderbyn. Yna mae eich dangosfwrdd yn dangos pob grŵp, a ble rydych chi'n sefyll ym mhob un, ar un sgrin."
    shot: S02
    shotAlt: "Y deialog creu grŵp gyda'r adran cyfyngiadau arian cyfred ar agor"
  - title: "Gwahodd eich pobl"
    body: "Rhannwch ddolen ymuno neu dangoswch god QR, a gosodwch am ba hyd y mae'n para, o 15 munud hyd at 5 diwrnod. Mae angen cyfrif am ddim ac e-bost wedi'i wirio ar bawb sy'n ymuno, ac mae grŵp yn dal hyd at 50 o bobl. Os ydych am reoli pwy sy'n dod i mewn, trowch gymeradwyaeth ymlaen ac mae gweinyddwr yn gadael pob person i mewn."
    shot: S03
    shotAlt: "Y deialog gwahodd ar y tab dolen, yn dangos cod QR a'r dewisiadau terfyn amser"
  - title: "Ychwanegu treuliau wrth iddynt ddigwydd"
    body: "Dywedwch pwy dalodd, faint, ac ar gyfer pwy yr oedd. Rhannwch yn gyfartal, yn ôl symiau union neu yn ôl canran, a gadewch allan unrhyw un nad oedd yn rhan ohoni. Ychwanegwch y gost ac mae pawb yn ei gweld ar unwaith, ynghyd â beth a newidiodd a phwy a'i newidiodd."
    shot: S05
    shotAlt: "Y ffurflen gost gyda rhaniad yn ôl canran, yn rhannu'r rhent yn ôl maint ystafell"
  - title: "Gwylio'r balansau"
    body: "Mae Side Badger yn cadw balans cyfredol ar gyfer pob arian cyfred, fel y gallwch weld pwy sy'n ddyledus i bwy ar un olwg. Yn hytrach na gadael i bawb ddatrys gwe o ddyledion bach, mae'n awgrymu rhestr fer o daliadau sy'n setlo'r grŵp."
    shot: S10
    shotAlt: "Sgrin y balansau yn dangos dyledion wedi'u symleiddio mewn dau arian cyfred, gyda Dangos y cyfan wedi'i droi ymlaen"
  - title: "Setlo y tu allan i'r ap, cofnodi y tu mewn iddo"
    body: "Dyw Side Badger byth yn symud arian. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad fel bod y balansau'n dal i fyny, ac mae sgrin pawb yn diweddaru heb adnewyddu. Ystyr “setlo” yn syml yw bod y balansau'n dangos sero. All neb adael grŵp tra byddan nhw mewn dyled neu fod arian yn ddyledus iddyn nhw, felly mae unrhyw un sy'n anelu am y drws yn setlo gyntaf."
    shot: S11
    shotAlt: "Y ffurflen daliad gyda botymau setlo cyflym a'r hysbysiad taliad rhannol"
requirements:
  heading: "Beth sydd ei angen arnoch"
  items:
    - "Cyfrif am ddim. Cyfeiriad e-bost a chyfrinair yw'r cyfan sydd ei angen, ac rydych yn gwirio'r e-bost cyn y gallwch ychwanegu unrhyw beth."
    - "Bod yn 18 oed neu'n hŷn."
    - "Porwr modern ar ffôn neu gyfrifiadur, a chysylltiad. Nid ap o siop apiau yw Side Badger ac nid yw'n gweithio all-lein."
    - "Os dymunwch, lle ar eich sgrin gartref. Does dim angen siop apiau: mewngofnodwch, yna ychwanegwch Side Badger at eich sgrin gartref neu ddoc ac mae'n agor fel ap. Mae Gosodiadau yn yr ap yn dangos i chi sut."
