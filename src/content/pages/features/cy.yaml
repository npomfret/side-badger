meta:
  title: "Beth mae Side Badger yn ei wneud a ddim yn ei wneud"
  description: "Rhannu, setlo a sawl arian cyfred, ynghyd â grwpiau, rhestrau a pholau. Y pecyn llawn, a rhestr onest o'r hyn y mae Side Badger yn ei adael allan."
h1: "Beth mae Side Badger yn ei wneud"
navLabel: "Nodweddion"
lead: "Popeth yn y bocs, a'r hyn nad yw ynddo."
intro: "Dyma'r pecyn llawn. Rydyn ni wedi gadael y daenlen allan yn fwriadol. Dechreuwch â'r tair swydd y mae Side Badger yn eu gwneud bob dydd, yna edrychwch ar weddill y rhestr a'r rhestr fer o bethau nad yw'n eu gwneud."
cta:
  heading: "Ydy e'n gwneud yr hyn sydd ei angen ar eich grŵp?"
  body: "Creu cyfrif am ddim a rhoi cynnig arni gyda grŵp bach yn gyntaf."
  button: "Creu cyfrif am ddim"
cardsHeading: "Y tair swydd, yn fanwl"
sections:
  - heading: "Sganio derbynebau"
    body: "Tynnwch lun o'r dderbynneb ac mae Side Badger yn llenwi'r cyfanswm, y dyddiad a'r lle i chi eu gwirio. Mae delweddau derbynebau yn cael eu darllen gan wasanaeth AI Google."
  - heading: "Grwpiau a chaniatâd"
    body: "Gwnewch grŵp ar gyfer pob tŷ, taith neu ddigwyddiad, gyda hyd at 50 o bobl ynddo. Gwahoddwch bobl gyda dolen neu god QR. Mewn grŵp mwy, gwnewch rywun yn wyliwr, sy'n gweld popeth ac nad yw'n newid dim."
  - heading: "Rhestrau a pholau"
    body: "Cadwch y rhestr siopa a rennir wrth ymyl y biliau siopa. Rhowch restr fer y fila i bleidlais, yn ddienw os dymunwch."
  - heading: "Popeth arall"
    items:
      - "**Diweddariadau byw:** ychwanegwch gost ac mae pawb yn ei gweld ar unwaith."
      - "**Ieithoedd:** defnyddiwch Side Badger mewn 39 iaith. Gall pawb yn y grŵp ddewis eu hiaith eu hunain."
      - "**Sgrin gartref:** dim angen siop apiau. Mewngofnodwch, yna ychwanegwch Side Badger at eich sgrin gartref ac mae'n agor fel ap. Mae Gosodiadau yn yr ap yn dangos i chi sut."
      - "**Adborth:** wedi dod o hyd i fyg? Dywedwch wrthon ni o'r tu mewn i'r ap a gweld ein hateb yno."
  - heading: "Beth nad yw Side Badger yn ei wneud"
    items:
      - "**Symud arian.** Dyw Side Badger byth yn cyffwrdd â'ch arian. Talwch eich gilydd sut bynnag y dymunwch. Mae ceisiadau am daliad wedi'u cynllunio."
      - "**Ailadrodd biliau.** Does dim treuliau cylchol. Copïwch fil y mis diwethaf mewn dau dap."
      - "**Rhannu fesul eitem.** Un talwr fesul cost. Rhannwch yn gyfartal, yn union neu yn ôl canran."
      - "**Cynnig ap brodorol.** Mae'n gweithio yn eich porwr. Mewngofnodwch, yna ychwanegwch ef at eich sgrin gartref."
      - "**Gweithio all-lein.** Mae angen cysylltiad."
      - "**Anfon hysbysiadau drwy e-bost neu neges destun.** Mae hysbysiadau'n ymddangos yn yr ap. Mae hysbysiadau gwthio wedi'u cynllunio."
      - "**Lluniadu siartiau neu gyllidebau.** Mae'n cadw cyfrif o bwy sy'n ddyledus i bwy, a dyna'r holl gamp."
      - "**Mewngofnodi gyda Google neu Apple.** Cofrestrwch gydag e-bost. Mae mewngofnodi gyda Google ac Apple wedi'i gynllunio."
      - "**Gadael pobl i mewn heb gyfrif.** Mae angen cyfrif am ddim ar bawb yn y grŵp."
faq:
  heading: "Cwestiynau"
  items:
    - q: "Alla i dalu drwy Side Badger?"
      a: "Na. Mae Side Badger yn cadw'r cyfrif ac nid yw'n cyffwrdd â'ch arian. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad."
    - q: "Oes ap symudol?"
      a: "Nid mewn siop apiau. Mae Side Badger yn rhedeg yn eich porwr. Mewngofnodwch ar eich ffôn, yna ychwanegwch ef at eich sgrin gartref fel ei fod yn agor fel ap. Mae Gosodiadau yn yr ap yn dangos i chi sut."
    - q: "Alla i rannu fesul eitem?"
      a: "Na. Mae gan bob cost un talwr, ac rydych chi'n ei rhannu'n gyfartal, yn union neu yn ôl canran."
    - q: "Ydy e'n gweithio all-lein?"
      a: "Nac ydy, mae angen cysylltiad."
    - q: "Oes angen cyfrif ar bawb yn y grŵp?"
      a: "Oes. Mae angen cyfrif am ddim ar bawb yn y grŵp, a chyfeiriad e-bost yw'r cyfan sydd ei angen i gofrestru."
