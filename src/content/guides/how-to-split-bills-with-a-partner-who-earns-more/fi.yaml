faq:
  heading: "Kysymyksiä"
  items:
    - q: "Pitäisikö käyttää brutto- vai nettopalkkaa?"
      a: "Ryhmä päättää. Nettopalkka on yleinen, koska se on raha, jonka voit oikeasti käyttää. Bruttopalkka ei ota huomioon, että vero, eläkemaksut ja lainanlyhennykset vievät eri palkoista eri summat. Kumman tahansa valitsetkin, käytä samaa mittaria teille molemmille."
    - q: "Näkeekö Side Badger tulomme?"
      a: "Ei. Syötät vain prosentit, et koskaan palkkoja. Prosentit näkyvät ryhmän jäsenille, ja parille se tarkoittaa teitä kahta."
    - q: "Voimmeko asettaa 62/38 kerran kaikelle?"
      a: "Jako asetetaan kulukohtaisesti, ei ryhmäkohtaisesti. Kopioi kulu, jossa on jo 62 ja 38, ja muuta se, mikä eroaa. [Kulujen jako](page:feature/split-expenses) kertoo muista vaihtoehdoista."
