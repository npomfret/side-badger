faq:
  heading: "Perguntas"
  items:
    - q: "A calculadora é grátis?"
      a: "Sim. Grátis. Sem anúncios. Sem limites diários. Também não precisas de uma conta."
    - q: "Guarda o que escrevo?"
      a: "Não. Nada é guardado nem enviado para lado nenhum. Para manteres os valores, usa Copiar link e guarda o link nalgum sítio."
    - q: "Quem pode ver o link que copio?"
      a: "Quem o tiver. Os valores vivem no próprio link, depois do #, por isso partilha-o só com as pessoas que os devem ver."
    - q: "Movimenta dinheiro?"
      a: "Não. Calcula quem deve pagar a quem, e vocês pagam-se como preferirem. O Side Badger também nunca toca no teu dinheiro. Vê [acertar contas](page:feature/settle-up)."
    - q: "Posso dividir uma viagem paga em duas moedas?"
      a: "Aqui não, porque um cálculo tem uma só moeda. Num grupo, cada moeda mantém o seu próprio saldo. Vê [várias moedas](page:feature/multiple-currencies)."
    - q: "E se os valores não somarem?"
      a: "A calculadora avisa-te por baixo da despesa e não mostra resultado até somarem. Os valores exatos têm de somar o total, e as percentagens têm de dar 100."
