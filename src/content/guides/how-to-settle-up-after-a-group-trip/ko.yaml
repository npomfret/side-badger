faq:
  heading: "자주 묻는 질문"
  items:
    - q: "결제는 낸 사람이 기록해야 하나요, 받은 사람이 기록해야 하나요?"
      a: "결제를 기록하려면 지출 수정 권한이 필요하며, 양식은 **누가 지불했나요?**와 **누가 결제를 받았나요?**를 묻습니다. 기록한 사람만 나중에 수정할 수 있으므로, 대개는 낸 사람이 빠른 정산 버튼으로 기록하는 것이 가장 간단해요."
    - q: "여행에서 통화를 두 가지 썼다면요?"
      a: "잔액은 통화별로 관리되므로 유로 빚은 유로 빚으로 남고, 입력할 때 환산한 지출이 아니라면 통화마다 짧은 목록이 따로 생깁니다. [여러 통화로 낸 여행](page:guide/how-to-split-a-trip-paid-in-several-currencies)에서 두 방식을 모두 볼 수 있어요."
    - q: "정산은 여행 중에 하는 게 좋을까요, 끝나고 하는 게 좋을까요?"
      a: "둘 다 괜찮습니다. 기록된 결제는 모두 잔액을 바꾸므로, 여행 중에 한 결제도 최종 목록에 반영됩니다. 끝나고 하면 [여행 전체](page:use-case/group-trips)가 한곳에 모여 있어서 더 간단해요."
