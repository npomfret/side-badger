featuresHeading: "امکاناتی که این استفاده می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "آیا مهمان‌ها می‌توانند بدون پیوستن گروه را ببینند؟"
      a: "نه. افراد با لینک یا کد QR و یک حساب رایگان می‌پیوندند، پس بعد از ورود می‌توانند گروه را ببینند."
    - q: "آیا Side Badger می‌تواند پول جمع کند؟"
      a: "نه. Side Badger حساب را نگه می‌دارد و هرگز پول جابه‌جا نمی‌کند. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را ثبت کنید. رایگان است، بدون تبلیغات و بدون محدودیت روزانه؛ [قیمت‌ها](page:pricing) را ببینید."
    - q: "آیا رأی‌ها می‌توانند ناشناس باشند؟"
      a: "بله. وقتی نظرسنجی می‌سازید می‌توانید پنهان کنید چه کسی به چه چیزی رأی داده. تنظیمات فقط پیش از اولین رأی قابل تغییرند."
    - q: "آیا افراد می‌توانند مبلغ‌های متفاوت بدهند؟"
      a: "بله. هزینه را با مبلغ دقیق تقسیم کنید تا سهم هر نفر همان عددی باشد که توافق کردید، یا کسانی را که درگیر نبودند کنار بگذارید."
    - q: "آیا برگزارکننده می‌تواند دفتر را نگه دارد؟"
      a: "بله. از پیش‌تنظیم گروه مدیریت‌شده استفاده کنید تا فقط سازنده‌ها و مدیرها هزینه‌ها را تغییر دهند و مدیرها اعضای جدید را تأیید کنند."
