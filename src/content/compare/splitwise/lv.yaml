faq:
  heading: "Jautājumi"
  items:
    - q: "Vai Side Badger ir bezmaksas alternatīva Splitwise?"
      a: "Rēķinu sadalei grupā – jā. Čeku skenēšana, valūtu konvertēšana un reklāmu trūkums ir bez maksas, bez dienas ierobežojumiem. Ja vajadzīga vietējā lietotne, lietošana bezsaistē, atkārtoti izdevumi vai maksājumi lietotnes iekšienē, tos dara Splitwise, bet Side Badger ne."
    - q: "No kurienes nāk Splitwise dati?"
      a: "No Splitwise paša lapām: tā sākumlapas, Pro lapas un palīdzības centra. Katra tabulas rinda ir saistīta ar lapu, no kuras tā nākusi, un datums virs tabulas norāda, kad mēs tās lasījām. Mēs tās pārbaudām katru ceturksni."
    - q: "Vai Side Badger paliks bez maksas?"
      a: "Viss Side Badger šodien ir bez maksas, un maksas līmeņa nav. Ja tas kādreiz mainīsies, mēs jūs iepriekš brīdināsim. Detaļas sniedz [cenu lapa](page:pricing)."
    - q: "Vai jāpāriet visiem manā grupā?"
      a: "Jā. Ikvienam grupā vajadzīgs bezmaksas Side Badger konts, un viņi var pievienoties ar saiti vai QR kodu."
    - q: "Vai Side Badger ir mobilā lietotne?"
      a: "Ne lietotņu veikalā. Tas darbojas jūsu pārlūkprogrammā: pierakstieties tālrunī, tad pievienojiet to sākuma ekrānam, lai tas atvērtos kā lietotne. Kā to izdarīt, parāda [kā tas darbojas](page:how-it-works)."
