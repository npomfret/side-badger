meta:
  title: "كيف تقسّم رحلة دُفعت بعدة عملات | Side Badger"
  description: "الجنيهات للفندق، والين للرامن. سوِّ كل عملة على حدة أو حوّل بسعر تراه. الطريقتان محسوبتان خطوة بخطوة والمعادلات ظاهرة."
h1: "كيف تقسّم رحلة دُفعت بعدة عملات"
navLabel: "رحلات بعدة عملات"
lead: "أدخل كل مصروف بالعملة التي دفعت بها، ثم اختر طريقاً. أبقِ العملات منفصلة وسوِّ كل واحدة منها بعملتها نفسها، أو حوّل بسعر صرف حالي وسوِّ الحساب مرة واحدة. رحلة اليابان نفسها تنتهي بأربع دفعات في الطريقة الأولى ودفعتين في الثانية."
cta:
  heading: "أدخله بالعملة التي دفعت بها"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة للرحلة، وأضف كل مصروف بأي عملة كانت مكتوبة على الإيصال. تريد التفاصيل أولاً؟ انظر [العملات المتعددة](page:feature/multiple-currencies) أو [ما الذي يشمله الاستخدام المجاني](page:pricing)."
sections:
  - heading: "ثلاثة أصدقاء، وفندق واحد، وكمية هائلة من الين"
    body: "تقضي زوي وكينجي ولوسي أسبوعاً في اليابان في [رحلة جماعية](page:use-case/group-trips)، وتُقسَّم كل التكاليف بالتساوي بينهم ثلاثتهم. حجزت زوي الفندق من البيت بالجنيه الإسترليني، بمبلغ £600. واشترت لوسي تذاكر القطار في طوكيو بمبلغ ¥90,000. ودفع كينجي ثمن ليلة الرامن، ¥9,000، ولم يكفّ عن ذكرها كل يوم منذ ذلك الحين. لا أحد يريد تحويل ثلاثة إيصالات على رصيف محطة. وفي حسابات هذا الدليل، ¥1 يساوي £0.005، وهو سعر مدوَّر ابتكرناه لهذا الدليل. أما في التطبيق فتستخدم سعر صرف حالياً، أو تكتب السعر الذي حصلت عليه فعلاً."
  - heading: "أدخل كل واحد بالعملة المكتوبة على الإيصال"
    body: "هذه الخطوة واحدة مهما كان الطريق الذي تختاره. لا شيء يحتاج إلى تحويل بعد."
    items:
      - "**أنشئ المجموعة.** من لوحة التحكم اختر **إنشاء مجموعة**، وسمِّها باسم الرحلة، ثم اختر **دعوة الآخرين** وأرسل الرابط أو رمز QR."
      - "**أضف الفندق.** اختر **إضافة مصروف** واكتب 600، مع الجنيه الإسترليني عملةً بجانب المبلغ. تحت **من دفع؟** اختر زوي. أبقِ الثلاثة جميعاً تحت **تقسيم بين**، واترك **كيفية التقسيم** على **بالتساوي** واختر **حفظ المصروف**."
      - "**أضف الين.** افعل الشيء نفسه لتذاكر القطار (دفعت لوسي) والرامن (دفع كينجي)، مع الين عملةً. الين بلا كسور عشرية، لذا لا يطلب النموذج أي كسور."
  - heading: "الطريق الأول: أبقِ العملات منفصلة"
    body: "يحتفظ Side Badger برصيد لكل عملة، ولا يقاصّ إحداها بالأخرى. بالجنيه، نصيب كل واحد من الفندق £200، فيدين كينجي ولوسي لزوي بمبلغ £200 لكل منهما. وبالين، تبلغ تذاكر القطار والرامن ¥99,000، أي ¥33,000 للفرد. دفعت لوسي ¥90,000 ومستحق لها ¥57,000. ولم تدفع زوي شيئاً بالين وعليها ¥33,000. ودفع كينجي ¥9,000، فعليه ¥24,000."
    items:
      - "**بالجنيه.** يدفع كينجي لزوي £200 وتدفع لوسي لزوي £200."
      - "**بالين.** تدفع زوي للوسي ¥33,000 ويدفع كينجي للوسي ¥24,000."
      - "**أربع دفعات في المجموع.** تدين زوي ولوسي لبعضهما بعملتين مختلفتين لا تُقاصّ إحداهما بالأخرى. ولا يدخل سعر صرف في الأمر، فلا شيء للجدال حوله."
      - "**عليك ين وتدفع بالجنيه.** من ليس لديه ين يستطيع مع ذلك الدفع بالجنيه الإسترليني. وحين تسجّل الدفعة، افتح **عملة مختلفة؟** واختر **تحويل إلى** ثم الجنيه الإسترليني وراجع السعر. مبلغ زوي البالغ ¥33,000 يساوي £165 بسعر هذا الدليل، ويخرج رصيد الين صحيحاً مع ذلك."
      - "**سجّل كل دفعة.** ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم اختر **تسوية** واستخدم **تسجيل تسوية**. وللمزيد انظر [تسوية الحسابات](page:feature/settle-up)."
  - heading: "الطريق الثاني: حوّل أولاً بأول"
    body: "إذا كانت المجموعة تفضّل أن ترى رقماً واحداً لكل شخص، فحوّل عند إدخال المصروف."
    items:
      - "**حوّل في النموذج.** في **إضافة مصروف** اختر **تحويل إلى** وحدّد الجنيه الإسترليني. يعرض Side Badger السعر والمبلغ المحوَّل، ومعه علامة ≈. عدّل السعر إن حصلت على سعر مختلف. ويبقى مبلغ الين الأصلي مع المصروف."
      - "**اقرأ الجنيهات.** عند ¥1 = £0.005، تصبح تذاكر القطار £450 والرامن £45. ومع الفندق بمبلغ £600، يكون المجموع £600 + £450 + £45 = £1,095، أي £365 للفرد. دفعت زوي £600، فمستحق لها £235. ودفعت لوسي £450 ومستحق لها £85. ودفع كينجي £45 وعليه £320."
      - "**دفعتان.** كلتاهما من كينجي: £235 إلى زوي و£85 إلى لوسي. ولم تعد زوي ولوسي تدفعان لبعضهما أي شيء."
      - "**أو حدّد عملة للمجموعة.** لتتجاوز هذه الخطوة الإضافية، افتح **الإعدادات** الخاصة بالمجموعة، وابحث عن **إعدادات العملة** واختر **تحويل المصروفات تلقائيًا إلى**. فيُحوَّل كل مصروف جديد بعد ذلك إلى تلك العملة، وبسعر ما زال بإمكانك رؤيته وتغييره."
  - heading: "أي طريق تختار؟"
    items:
      - "**أبقِها منفصلة** حين يكون لدى الناس ين في محافظهم، أو حين تفضّلون ألا تتجادلوا حول سعر. الثمن دفعات أكثر، وبأكثر من عملة."
      - "**حوّل** حين تتعامل المجموعة عادةً بعملة واحدة وتريد رقماً واحداً لكل شخص وقائمة أقصر، مثل تحويلَي كينجي. الثمن أن تثق المجموعة بسعر، وأن السعر يُثبَّت على كل مصروف عند حفظه."
      - "**قرّروا مبكراً.** عملة المجموعة لا تحوّل إلا المصروفات الجديدة والمنسوخة. ولا تعود لترتّب ما أدخلتموه من قبل."
  - heading: "السعر، والسقف"
    items:
      - "**يُثبَّت السعر عند الحفظ.** لا يُعاد تقييم المصروفات القديمة أبداً، فلا ينحرف الرصيد لمجرد أن السوق تحرّك. وقد تحمل مصروفات أُدخلت في أيام مختلفة أسعاراً مختلفة، فإن أرادت المجموعة سعراً واحداً للرحلة كلها، فاتفقوا عليه واكتبوه في كل مرة."
      - "**لا يوجد سعر؟ اكتب واحداً.** يجلب Side Badger سعر صرف حالياً حيثما أمكن، لكن وجود سعر لكل زوج من العملات ليس مضموناً. فإن لم يوجد سعر، أو أعطاك مكتب صرافة سعراً أفضل، فاكتب سعرك أنت."
      - "**999,999.99 لكل مصروف، بعملته الخاصة.** سقف واحد مهما كانت العملة. وبالين هو أقل بقليل من ¥1,000,000، أي نحو £5,000 بسعر هذا الدليل. وفي عملة ذات أرقام كبيرة، مثل الروبية الإندونيسية، قد تبلغ فاتورة واحدة السقف أسرع. قسّم الفاتورة إلى مصروفين، أو أدخلها بعملة أخرى وحوّل."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا ينقل المال ولا يصرفه أبداً. تدفعون لبعضكم بالطريقة التي تناسبكم، ثم تسجّلون الدفعة."
      - "فيه 140 عملة. والعملات المشفّرة والمعادن ليست بينها."
