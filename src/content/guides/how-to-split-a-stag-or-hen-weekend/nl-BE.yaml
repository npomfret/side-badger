faq:
  heading: "Vragen"
  items:
    - q: "Betaalt de getuige meer?"
      a: "Alleen als de groep het afspreekt. De app geeft niemand een speciale rol in de sommen. Als iemand meer op zich neemt, kies dan **Exacte bedragen** of **Percentage** bij **Hoe te verdelen** en voer de aandelen in die jullie afspraken."
    - q: "En de drankjes die sommige mensen niet dronken?"
      a: "Voeg de drankjes toe als eigen uitgave en vink enkel de mensen aan die ze dronken. Als iedereen een ander bedrag had, kies dan **Exacte bedragen** en typ het aandeel van elke persoon. Niemand betaalt voor wat hij of zij niet had."
    - q: "Kan de eregast de groep later zien?"
      a: "Ja, zodra de verrassing voorbij is. Nodig de eregast uit, dan kan een beheerder haar of hem **Kijker** maken onder **Beveiliging en machtigingen** in de groepsinstellingen. Een kijker ziet alles en verandert niets, dus wacht tot niets meer geheim is. Om lid te worden is een gratis account nodig."
