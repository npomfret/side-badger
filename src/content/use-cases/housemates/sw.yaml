faq:
  heading: "Maswali"
  items:
    - q: "Je, kodi inaweza kujirudia yenyewe?"
      a: "Hapana, hakuna bili zinazojirudia. Nakili kodi ya mwezi uliopita kwa kugusa mara chache, badilisha tarehe na umemaliza."
    - q: "Je, tunaweza kugawanya kwa ukubwa wa chumba?"
      a: "Ndiyo, kwa asilimia. Mpe kila mpangaji mwenza sehemu inayoakisi chumba chake, mradi sehemu zijumlishe 100. [Kugawanya gharama](page:feature/split-expenses) kunaeleza njia nyingine za kugawanya."
    - q: "Je, mpangaji mwenza akihama akiwa na deni?"
      a: "Hawezi kuondoka kwenye kikundi hadi amalize hesabu, kwa sababu hakuna anayeweza kuondoka akiwa anadaiwa au anadai pesa. Nambari hubaki za kweli hadi kila mtu awe sawa."
    - q: "Je, Side Badger inalipa bili?"
      a: "Hapana. Inaweka hesabu na kupendekeza orodha fupi ya malipo. Mnalipana mtakavyo, kisha mnarekodi, kama [kumaliza hesabu](page:feature/settle-up) kunavyoeleza."
    - q: "Je, mpangaji mmoja mwenza anaweza kuweka hesabu?"
      a: "Ndiyo. Mfanye msimamizi na utumie kikundi kinachosimamiwa, ambapo wanachama wapya wanahitaji idhini na ni waundaji na wasimamizi tu wanaoweza kubadilisha gharama."
