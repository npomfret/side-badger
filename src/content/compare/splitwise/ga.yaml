meta:
  title: "Side Badger vs Splitwise: an grúpa ar fad, ní díreach na suimeanna | Side Badger"
  description: "Rogha saor in aisce seachas Splitwise don ghrúpa ar fad: tráchtanna, ceisteanna, liostaí, vótaíochtaí agus róil cheart, móide scanadh admhálacha agus tiontú airgeadra saor in aisce."
h1: "Side Badger vs Splitwise: an grúpa ar fad, ní díreach na suimeanna"
navLabel: "Side Badger agus Splitwise"
lead: "Is dócha go ndúirt duine i do ghrúpa “úsáid Splitwise”. Cothrom go leor: tá sé go maith ag na suimeanna. Déanann Side Badger na suimeanna freisin, agus ansin tugann sé áit don ghrúpa iad a phlé: tráchtanna, ceisteanna, liostaí, vótaíochtaí agus róil ghrúpa cheart. Tagann scanadh admhálacha agus tiontú airgeadra saor in aisce."
cta:
  heading: "Bain triail as ar do chéad bhille comhroinnte eile"
  body: "Cruthaigh cuntas saor in aisce, déan grúpa agus cuir costas fíor amháin leis. Mura bhfuil sé duitse, chaith tú cúpla nóiméad, ní síntiús."
asOf: 2026-11-22
asOfNote: "Léamar leathanaigh Splitwise féin ar {date} ionas nach gcaithfeadh tú, agus tagann gach rud anseo faoi Splitwise astu. Nascann gach sraith den tábla lena fhoinse. Athraíonn pleananna, mar sin seiceálaimid arís gach ráithe, agus má easaontaíonn leathanaigh Splitwise leis an leathanach seo, creid iadsan."
