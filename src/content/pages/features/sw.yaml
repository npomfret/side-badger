meta:
  title: "Kile Side Badger inachofanya na isichofanya"
  description: "Kugawanya gharama, kumaliza hesabu na sarafu nyingi, pamoja na vikundi, orodha na kura za maoni. Zana zote, na orodha ya kweli ya yale Side Badger imeyaacha."
h1: "Kile Side Badger inachofanya"
navLabel: "Vipengele"
lead: "Kila kitu kilichomo, na kisichomo."
intro: "Hizi hapa zana zote. Tuliacha lahajedwali kwa makusudi. Anza na kazi tatu ambazo Side Badger hufanya kila siku, kisha angalia orodha nyingine na orodha fupi ya mambo isiyofanya."
cta:
  heading: "Je, inafanya kile kikundi chako kinachohitaji?"
  body: "Fungua akaunti ya bure na ujaribu kwanza na kikundi kidogo."
  button: "Fungua akaunti ya bure"
cardsHeading: "Kazi tatu, kwa undani"
sections:
  - heading: "Kuchanganua risiti"
    body: "Piga picha risiti na Side Badger itajaza jumla, tarehe na mahali ili uvihakiki. Picha za risiti husomwa na huduma ya AI ya Google."
  - heading: "Vikundi na ruhusa"
    body: "Tengeneza kikundi kwa kila nyumba, safari au tukio, chenye hadi watu 50. Alika watu kwa kiungo au msimbo wa QR. Kwenye kikundi kikubwa, mfanye mtu kuwa mtazamaji, anayeona kila kitu bila kubadilisha chochote."
  - heading: "Orodha na kura za maoni"
    body: "Weka orodha ya ununuzi ya pamoja karibu na bili za ununuzi. Peleka orodha fupi ya villa kwenye kura, bila kujulikana ukipenda."
  - heading: "Kila kitu kingine"
    items:
      - "**Masasisho ya moja kwa moja:** ongeza gharama na kila mtu anaiona mara moja."
      - "**Lugha:** tumia Side Badger kwa lugha 39. Kila mtu kwenye kikundi anaweza kuchagua yake."
      - "**Skrini ya mwanzo:** hakuna haja ya duka la programu. Ongeza Side Badger kwenye skrini yako ya mwanzo na inafunguka kama programu."
      - "**Maoni:** umekuta hitilafu? Tuambie ukiwa ndani ya programu na uone jibu letu huko."
  - heading: "Kile Side Badger isichofanya"
    items:
      - "**Kusogeza pesa.** Side Badger haigusi pesa zako kamwe. Lipaneni mtakavyo. Maombi ya malipo yamepangwa."
      - "**Kurudia bili.** Hakuna gharama zinazojirudia. Nakili bili ya mwezi uliopita kwa kugusa mara mbili."
      - "**Kugawanya kwa bidhaa.** Mlipaji mmoja kwa kila gharama. Gawanya kwa usawa, kwa kiasi halisi au kwa asilimia."
      - "**Kutoa programu asilia.** Inafanya kazi kwenye kivinjari chako. Iongeze kwenye skrini yako ya mwanzo."
      - "**Kufanya kazi nje ya mtandao.** Inahitaji muunganisho."
      - "**Kutuma tahadhari kwa barua pepe au ujumbe mfupi.** Arifa zinaonekana ndani ya programu. Arifa za kusukuma zimepangwa."
      - "**Kuchora chati au bajeti.** Inaweka hesabu ya nani anadaiwa na nani, na hiyo ndiyo hila nzima."
      - "**Kuingia kwa Google au Apple.** Jisajili kwa barua pepe. Kuingia kwa Google na Apple kumepangwa."
      - "**Kuwaruhusu watu bila akaunti.** Kila mtu kwenye kikundi anahitaji akaunti ya bure."
faq:
  heading: "Maswali"
  items:
    - q: "Je, ninaweza kulipa kupitia Side Badger?"
      a: "Hapana. Side Badger inaweka hesabu na haigusi pesa zako kamwe. Lipaneni mtakavyo, kisha rekodi malipo."
    - q: "Je, kuna programu ya simu?"
      a: "Si kwenye duka la programu. Side Badger inafanya kazi kwenye kivinjari chako, na unaweza kuiongeza kwenye skrini yako ya mwanzo ili ifunguke kama programu."
    - q: "Je, ninaweza kugawanya kwa bidhaa?"
      a: "Hapana. Kila gharama ina mlipaji mmoja, na unaigawanya kwa usawa, kwa kiasi halisi au kwa asilimia."
    - q: "Je, inafanya kazi nje ya mtandao?"
      a: "Hapana, inahitaji muunganisho."
    - q: "Je, kila mtu kwenye kikundi anahitaji akaunti?"
      a: "Ndiyo. Kila mtu kwenye kikundi anahitaji akaunti ya bure, na unachohitaji kujisajili ni anwani ya barua pepe tu."
