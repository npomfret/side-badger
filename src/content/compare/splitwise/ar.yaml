sections:
  - heading: "ما يجيده Splitwise"
    body: "إذا كانت مجموعتك تحتاج إلى تطبيق أصلي أو عمل دون اتصال أو دفعات داخل التطبيق، فإن Splitwise هو الخيار المعقول، ونفضّل أن تختاره على أن تكتشف ذلك لاحقاً. وتذكر صفحاته نفسها:"
    items:
      - "**تطبيقات وعمل دون اتصال.** تطبيقات iPhone وAndroid إضافة إلى الويب، ووضع دون اتصال."
      - "**طرق تقسيم أكثر.** الحصص والتعديلات والتقسيم بحسب البنود، إضافة إلى التقسيم بالتساوي وبمبالغ محددة وبنسبة مئوية."
      - "**مصروفات متكررة.** اضبط الإيجار ليتكرر وانسَ أمره."
      - "**دفعات داخل التطبيق.** يستطيع في بعض البلدان نقل المال أيضاً، عبر Splitwise Pay أو Venmo أو PayPal أو Pay by Bank."
  - heading: "مجاني هنا، مدفوع هناك"
    body: "Splitwise Pro هو خطة Splitwise المدفوعة، وتبيع صفحة Pro الخاصة به أربعة أشياء لا تكلّف شيئاً في Side Badger."
    items:
      - "**مسح الإيصالات.** يمسح Splitwise Pro صورة إيصالك. أما Side Badger فيفعل ذلك مجاناً، بلا أرصدة للمسح: فهو يملأ الإجمالي والتاريخ والمكان لتراجعها. وتُقرأ صور الإيصالات بواسطة خدمة الذكاء الاصطناعي من Google."
      - "**تحويل العملات.** يحوّل Splitwise Pro مصروفات المجموعة إلى عملتك الافتراضية حين تضغط «Convert». أما Side Badger فيحوّل كل مصروف أثناء إدخاله، بسعر صرف حالي أو بالسعر الذي حصلت عليه فعلاً، ويبقى المبلغ الأصلي على المصروف."
      - "**بلا إعلانات.** يذكر Splitwise تجربة خالية تماماً من الإعلانات ضمن ميزات Pro. أما Side Badger فلا إعلانات فيه."
      - "**بلا حدود يومية.** يبيع Splitwise Pro مصروفات غير محدودة، ويذكر مركز المساعدة فيه أن المستخدمين المجانيين يستطيعون إضافة 4 مصروفات كحد أقصى كل يوم. أما Side Badger فلا حدود يومية فيه."
  - heading: "ما لدى Splitwise وليس لدى Side Badger"
    body: "هذه ليست كل ميزات Splitwise، بل التي ترجّح الكفة غالباً. وفي صفحات Splitwise نفسها القائمة الكاملة. وهنا مواضع تقصير Side Badger."
    items:
      - "**التطبيقات الأصلية.** يعمل Side Badger في متصفحك. سجّل الدخول ثم أضفه إلى شاشتك الرئيسية ليفتح كأنه تطبيق."
      - "**وضع عدم الاتصال.** يحتاج Side Badger إلى اتصال."
      - "**الدفعات داخل التطبيق.** لا يلمس Side Badger أموالك أبداً. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة."
      - "**المصروفات المتكررة.** لا يوجد في Side Badger منها شيء. انسخ إيجار الشهر الماضي بدل أن تكتبه من جديد."
      - "**التقسيم بالحصص أو بالبند.** في Side Badger دافع واحد لكل مصروف، يُقسَّم بالتساوي أو بمبالغ محددة أو بنسبة مئوية. ولا يوزّع مسح الإيصالات فيه البنود على الأشخاص."
      - "**المخططات والتقسيمات الافتراضية.** في Splitwise Pro الاثنان. أما Side Badger فيحتفظ بحساب من يدين لمن، وهذه هي الحيلة كلها."
  - heading: "نقل مجموعتك إليه"
    body: "لا توجد أداة استيراد، فالانتقال يعني بداية جديدة. سوِّ الحسابات في Splitwise أولاً، ثم أنشئ مجموعة في Side Badger وادعُ الجميع برابط أو برمز QR. ويحتاج كل فرد في المجموعة إلى حساب مجاني، وكل ما يلزم للتسجيل هو عنوان بريد إلكتروني."
