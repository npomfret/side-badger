faq:
  heading: "Spørsmål"
  items:
    - q: "Hvilken valutakurs bruker Side Badger?"
      a: "En gjeldende valutakurs, hentet når du legger inn utgiften der en er tilgjengelig. Du kan endre den til kursen du faktisk fikk."
    - q: "Kan gruppen holde seg til pund og yen?"
      a: "Ja. Under gruppens **Innstillinger** slår du på **Begrens valutaer for denne gruppen** under **Valutainnstillinger**, velger **Tillatte valutaer** og setter **Standardvaluta for nye utgifter**. Færre valg i listen, færre feilgjetninger i kassen."
    - q: "Må vi i det hele tatt konvertere?"
      a: "Nei. Valutaene holdes adskilt med mindre du eller gruppen velger å konvertere, og hver valuta får sin egen korte liste over betalinger."
