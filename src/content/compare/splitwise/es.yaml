sections:
  - heading: Hablar de dinero, junto al dinero
    body: El dinero compartido trae charla, dudas y planes. Side Badger los guarda los tres junto a los números, para que nadie tenga que volver atrás en el chat del grupo.
    items:
      - "**Comentarios donde toca.** Comenta en el propio grupo o en cualquier gasto, lista o encuesta, y deja la conversación junto a lo que trata."
      - "**Recibos y fotos.** Guarda hasta tres recibos en cada gasto y añade fotos o PDF a los comentarios del grupo, de una lista o de una encuesta."
      - "**Preguntas, no discusiones.** Un administrador puede activar las preguntas, y entonces cualquiera que esté en un gasto puede preguntar por él. Se queda fuera de los saldos hasta que se aclare."
      - "**Listas y encuestas.** Lleva la lista de la compra compartida junto a las tickets de la compra, y somete a votación la preselección de villas, de forma anónima si quieres."
      - "**Un poco de aplauso.** Reacciona a gastos, pagos y comentarios, y celebra un pago cuando llega."
  - heading: Tu grupo, tus reglas
    body: El centro de ayuda de Splitwise dice que no admite administradores de grupo ni permisos especiales. Side Badger tiene roles y permisos, para los grupos que necesitan a alguien que mantenga las cuentas en orden.
    items:
      - "**Administradores, miembros y espectadores.** Haz a alguien espectador: lo ve todo y no cambia nada."
      - "**Dos preajustes, o los tuyos.** Empieza con Colaboración abierta o Grupo administrado, o define tú cada permiso: quién edita y borra gastos, edita listas, invita y deja entrar a gente nueva."
      - "**Aprobación para entrar.** Activa la aprobación y un administrador deja entrar a cada persona."
      - "**Los ajustes del propio grupo.** Límitalo a las monedas que de verdad usas, elige su moneda predeterminada y ponle una imagen de encabezado."
      - "**Bloquéalo cuando se acabe.** Los números se quedan como están hasta que un administrador lo desbloquee."
  - heading: Gratis aquí, de pago allí
    body: Splitwise Pro es el plan de pago de Splitwise, y su propia página de Pro vende tres cosas que no cuestan nada en Side Badger.
    items:
      - "**Escaneo de recibos.** Splitwise Pro escanea la foto de tu recibo. Side Badger lo hace gratis, sin créditos de escaneo: rellena el total, la fecha y el lugar para que lo revises."
      - "**Conversión de monedas.** Splitwise Pro convierte los gastos de un grupo a tu moneda predeterminada cuando tocas Convertir. Side Badger convierte cada gasto al introducirlo, con un tipo de cambio actual o con el que de verdad conseguiste, y el importe original se queda en el gasto."
      - "**Sin límites diarios.** Splitwise Pro vende gastos ilimitados, y su centro de ayuda dice que quienes usan el plan gratuito pueden añadir hasta 4 gastos al día. Side Badger no tiene límites diarios."
  - heading: Tu banco se queda al margen
    body: Side Badger no se conecta a tu banco ni te pide los datos de tu banco. Lleva el registro de quién debe a quién; pagas a los demás como quieras y después registras el pago. Sin ningún acceso al banco que entregar, una cosa menos que proteger.
  - heading: Una app, en tu navegador y en tu móvil
    body: Side Badger funciona en tu navegador. Inicia sesión, añádelo a tu pantalla de inicio y se abre como una app. Es la misma app en los dos sitios, así que una función nueva está en tu móvil la próxima vez que lo abras, sin esperar a ninguna actualización de la tienda de aplicaciones.
  - heading: Y unas cuantas sorpresas
    items:
      - "**Pregunta a tu asistente.** Side Badger funciona con ChatGPT y Claude: pídele al tuyo que añada un gasto, escanee un recibo o registre un pago."
      - "**Cada cual en su idioma.** Side Badger habla 39 idiomas y cada persona elige el suyo. La página de inicio de Splitwise dice 7+. También maneja 133 monedas, para el viaje que va a todas partes."
      - "**Ayuda sin salir de la app.** ¿Algo se atasca o has encontrado un fallo? Cuéntanoslo desde la app y lee allí mismo nuestra respuesta."
  - heading: Donde Splitwise sigue ganando
    body: Preferimos que elijas la app adecuada a que lo descubras más tarde. Si tu grupo necesita alguna de estas cosas, Splitwise la tiene y Side Badger no.
    items:
      - "**Apps de tienda de aplicaciones.** Side Badger vive en tu navegador y en tu pantalla de inicio, no en las tiendas de aplicaciones."
      - "**Modo sin conexión.** Side Badger necesita conexión."
      - "**Pagos en la app.** En algunos países Splitwise también puede mover el dinero. Side Badger solo lleva el registro."
      - "**Dividir por participaciones o por artículo.** Side Badger tiene un solo pagador por gasto, dividido a partes iguales, por importes exactos o por porcentaje. Su escaneo de recibos no asigna artículos a personas."
      - "**Gráficos y divisiones predeterminadas.** Splitwise Pro tiene ambos. Side Badger lleva la cuenta de quién debe a quién, y ese es todo el truco."
  - heading: Pasar tu grupo a Side Badger
    body: No hay importador, así que mudarse significa empezar de cero. Salda cuentas primero en Splitwise, luego crea un grupo en Side Badger e invita a todo el mundo con un enlace o un código QR. Todo el mundo en el grupo necesita una cuenta gratis, y para registrarse solo hace falta una dirección de correo electrónico.
table:
  heading: Lado a lado
  caption: Datos de Splitwise a fecha de {date}, tomados de las propias páginas de Splitwise.
  sourceLabel: Fuente
  columns:
    feature: Qué
    other: Splitwise, según sus propias páginas
    sideBadger: Side Badger
  rows:
    - feature: Cuánto cuesta
      other: Splitwise Pro es una suscripción mensual o anual. Los planes anuales incluyen un Trip Pass, que da a un grupo de viaje las funciones de Pro durante 30 días.
      sideBadger: Gratis.
      source: pro-help
    - feature: Gastos por día
      other: Su centro de ayuda dice que quienes usan el plan gratuito pueden añadir hasta 4 gastos al día. Pro no tiene límite diario.
      sideBadger: Sin límites diarios.
      source: pro-help
    - feature: Roles y permisos del grupo
      other: Su centro de ayuda dice que no admite administradores de grupo ni permisos especiales.
      sideBadger: Administradores, miembros y espectadores. Dos preajustes o tus propios permisos, aprobación para entrar y un bloqueo para cuando se acabe.
      source: permissions-help
    - feature: Escaneo de recibos
      other: Una función de Pro. Escanea la foto de un recibo, y el desglose por artículos de Pro permite asignar los artículos a personas.
      sideBadger: Gratis, sin créditos de escaneo. Rellena el total, la fecha y el lugar para que lo revises, y no asigna artículos a personas.
      source: pro
    - feature: Conversión de monedas
      other: Una función de Pro. Toca Convertir y Splitwise convierte los gastos de un grupo a tu moneda predeterminada al tipo de cambio de ese momento.
      sideBadger: Gratis. Convierte cada gasto al introducirlo, con un tipo de cambio actual o con el que de verdad conseguiste. El importe original se queda en el gasto.
      source: currencies-help
    - feature: Monedas e idiomas
      other: 100+ monedas y 7+ idiomas, como dice su página de inicio.
      sideBadger: 133 monedas y 39 idiomas. Cada persona del grupo puede elegir su idioma.
      source: home
    - feature: Dónde se usa
      other: Apps para iPhone y Android, y la web.
      sideBadger: En tu navegador. Inicia sesión y luego añádelo a tu pantalla de inicio y se abre como una app. No está en las tiendas de aplicaciones.
      source: home
    - feature: Formas de dividir
      other: A partes iguales, por importes exactos, por porcentaje, por participaciones, por ajuste o por artículos.
      sideBadger: A partes iguales, por importes exactos o por porcentaje, con un solo pagador por gasto. No por participaciones ni por artículo.
      source: split-help
    - feature: Uso sin conexión
      other: Incluye un modo sin conexión entre sus funciones principales.
      sideBadger: No. Necesita conexión.
      source: home
    - feature: Pagos y tu banco
      other: "En algunos lugares puede enviar dinero desde dentro de la app: Splitwise Pay en EE. UU., Venmo para saldos en dólares estadounidenses, PayPal y Pay by Bank en determinados países europeos, que conecta una cuenta corriente personal."
      sideBadger: Nunca toca tu dinero ni te pide los datos de tu banco. Paga a los demás como quieras y después registra el pago.
      source: payments-help
    - feature: Gráficos y divisiones predeterminadas
      other: Ambos son funciones de Pro.
      sideBadger: Ninguno.
      source: pro
faq:
  heading: Preguntas
  items:
    - q: ¿Es Side Badger una alternativa gratuita a Splitwise?
      a: "Para dividir gastos en un grupo, sí, y hace más que las cuentas: comentarios, preguntas, listas, encuestas y roles de grupo, con escaneo de recibos y conversión de monedas gratis. Si necesitas una app de tienda de aplicaciones, uso sin conexión o pagos dentro de la app, Splitwise los ofrece y Side Badger no."
    - q: ¿De dónde salen los datos de Splitwise?
      a: "De las propias páginas de Splitwise: su página de inicio, su página de Pro y su centro de ayuda. Cada fila de la tabla enlaza con la página de la que salió, y la fecha de encima de la tabla dice cuándo las leímos. Las comprobamos cada trimestre."
    - q: ¿Seguirá siendo gratis Side Badger?
      a: Todo en Side Badger es gratis hoy. Si eso cambia alguna vez, te avisaremos antes. La [página de precios](page:pricing) tiene los detalles.
    - q: ¿Tiene que cambiarse todo mi grupo?
      a: Sí. Todo el mundo en un grupo necesita una cuenta gratis de Side Badger, y puede unirse con un enlace o un código QR.
    - q: ¿Tiene Side Badger una app móvil?
      a: "No en una tienda de aplicaciones. Funciona en tu navegador: inicia sesión en el móvil y luego añádelo a tu pantalla de inicio para que se abra como una app. [Cómo funciona](page:how-it-works) lo muestra."
