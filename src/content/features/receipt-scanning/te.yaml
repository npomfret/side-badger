meta:
  title: "రసీదు స్కాన్ చేసి ఖర్చు జోడించండి | Side Badger"
  description: "రసీదును బ్యాడ్జర్ చదవనివ్వండి. మొత్తం, తేదీ, స్థలం మీరు సరిచూసుకోవడానికి నింపుతుంది, స్కాన్ క్రెడిట్లు లేవు. చిత్రాన్ని Google AI సేవ చదువుతుంది."
h1: "రసీదు స్కాన్ చేయండి, వివరాలు సరిచూడండి, పంచండి"
navLabel: "రసీదు స్కానింగ్"
lead: "రసీదును బ్యాడ్జర్ చదవనివ్వండి, దాని హోంవర్క్‌ను మీరు సరిచూడండి. కొత్త ఖర్చుకు ఫోటో జోడించండి, Side Badger మొత్తం, తేదీ, స్థలం నింపుతుంది, మీరు సరిచూసుకోవచ్చు. తర్వాత ఇతర ఖర్చుల్లాగే [పంచండి](page:feature/split-expenses). స్కానింగ్ ఉచితం, స్కాన్ క్రెడిట్లు లేవు. ఇది ఒక ఖర్చును నింపుతుంది, బిల్లును వస్తువుల వారీగా పంచదు. రసీదు చిత్రాలను Google AI సేవ చదువుతుంది."
cta:
  heading: "ఫోటో తీయండి. సరిచూడండి. పంచండి."
  body: "ఉచిత ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, రసీదు ఫోటోతో ఖర్చు జోడించండి. అది ఏం నింపిందో చూడండి, తప్పున్నదాన్ని మార్చండి, నచ్చాక సేవ్ చేయండి."
problem:
  heading: "టాక్సీ క్యూలో రసీదును ఎవరూ టైప్ చేయాలనుకోరు"
  body: "ట్రిప్‌లు, పెద్ద రాత్రులు కాగితంతో వస్తాయి. డిన్నర్, టాక్సీ, ఆరుగురికి పెరిగిన రౌండ్. చల్లబడిన వేళ్లతో, వెనక క్యూ ఉండగా, ప్రతిదాన్ని ఫోన్‌లో టైప్ చేయడమే ఖర్చులు మరచిపోవడానికి కారణం. కాబట్టి Side Badger మీకోసం రసీదును చదువుతుంది. మొదటి చిత్తుప్రతి అది చేస్తుంది, సరిచూసే పని మీది. ఎవరూ ఎదుర్కోవాలనుకోనంత వేగంగా రసీదులు పోగయ్యే [గ్రూప్ ట్రిప్‌లు](page:use-case/group-trips), [వేడుకలు](page:use-case/events-and-celebrations)కు ఇది సరిపోతుంది."
workflow:
  heading: "ఫోటో నుండి ఖర్చు వరకు మూడు దశలు"
  steps:
    - title: "కొత్త ఖర్చుకు రసీదు జోడించండి"
      body: "కొత్త ఖర్చు మొదలుపెట్టి **రసీదు స్కాన్ చేయండి** నొక్కండి, లేదా మీ డాష్‌బోర్డ్‌లోని **రసీదు స్కాన్ చేయండి** క్విక్ యాక్షన్ వాడండి. ఫోటో తీయండి, లేదా ఇప్పటికే ఉన్నదాన్ని ఎంచుకోండి. ఫారమ్‌లోని **రసీదు లేదా అటాచ్‌మెంట్‌ని జోడించు** కూడా పనిచేస్తుంది."
    - title: "రసీదును చదవనివ్వండి"
      body: "Side Badger AI చిత్రాన్ని చదువుతున్నప్పుడు ఫారమ్ **రసీదు విశ్లేషించబడుతోంది...** అని చూపుతుంది. తర్వాత అది కనుగొన్నవాటిని నింపుతుంది: వివరణ, మొత్తం, కరెన్సీ, తేదీ, సమయం, స్థలం లాంటివి. మీరు ఇప్పటికే టైప్ చేసినవాటిని ముట్టుకోదు."
      shot: S09
      shotAlt: "రసీదు విశ్లేషించబడుతోంది... అని చూపుతున్న కొత్త ఖర్చు ఫారమ్, తర్వాత వివరాలు నిండిన అదే ఫారమ్"
    - title: "సరిచూడండి, తర్వాత పంచండి"
      body: "ఫారమ్‌ను కాగితంతో పోల్చండి. తప్పున్నదాన్ని సరిచేయండి, ఎవరు చెల్లించారో, ఎవరు ఖర్చు పంచుకున్నారో చెప్పండి, ఎలా పంచాలో ఎంచుకుని సేవ్ చేయండి. మీరు సేవ్ చేసే వరకు ఖర్చు ఉనికిలోకి రాదు. పంచడం గురించి [ఖర్చుల పంపకం](page:feature/split-expenses) చెబుతుంది."
options:
  heading: "ఎంపికలు"
  items: []
sections:
  - heading: "అది ఏం నింపుతుంది"
    body: "కొత్త ఖర్చుకు రసీదు చిత్రాన్ని జోడించండి, ఈ ఫీల్డ్‌లు నిండవచ్చు. ఎవరు చెల్లించారు, ఎవరు ఖర్చు పంచుకున్నారు, ఎలా పంచాలి అన్నవి ఇంకా మీ చేతిలోనే."
    items:
      - "ఖర్చుకు ఒక **వివరణ**."
      - "**మొత్తం**."
      - "**కరెన్సీ**, మీ గ్రూప్ అనుమతిస్తే."
      - "**తేదీ**, **సమయం**."
      - "**స్థలం**."
      - "కాగితం రసీదు వెలిసిపోయినా లేదా ఉతుకులో పడినా, **నోట్స్**లో రసీదు టెక్స్ట్ కాపీ."
  - heading: "మీరు ఇంకా సరిచూడాల్సినవి"
    body: "అన్నీ. అది నింపేదాన్ని చిత్తుప్రతిగా చూడండి. మొత్తాన్ని కాగితంతో సరిచూడండి, తర్వాత కరెన్సీ, తేదీ, స్థలాన్ని. అస్పష్టమైన ఫోటోలు, నలిగిన కాగితం ఏ పాఠకుడినైనా మోసం చేయగలవు, ప్రతి రసీదును అది సరిగ్గా చదువుతుందని మేము హామీ ఇవ్వము, కాబట్టి సేవ్ చేసే ముందు దయచేసి చూడండి. ఏదైనా తప్పుంటే దానిపై టైప్ చేయండి. రసీదు యెన్‌లో ఉండి, గ్రూప్ పౌండ్లలో లెక్క తేల్చుకుంటే, తర్వాత ఏమవుతుందో [అనేక కరెన్సీలు](page:feature/multiple-currencies) చెబుతుంది."
  - heading: "రసీదును ఖర్చుతో పాటు ఉంచండి"
    body: "స్కాన్ చేసినా చేయకపోయినా, రసీదు ఖర్చుతో పాటే ఉండవచ్చు. ఫోటోలు లేదా PDFలను జోడించండి, ఒక్కో ఖర్చుకు మూడు వరకు, ఒక్కొక్కటి 10 MB వరకు. గ్రూప్ సభ్యులు వాటిని ఖర్చుపై చూస్తారు. చిత్రాలు వ్యూయర్‌లో తెరిచే థంబ్‌నెయిల్స్‌గా కనిపిస్తాయి, PDFలు లింక్‌లుగా తెరుచుకుంటాయి. మీరు స్కాన్ చేసిన ఫోటో కూడా జోడించబడుతుంది, సేవ్ చేసే ముందు తీసేస్తే తప్ప. ఆ డిన్నర్‌కు నిజంగా ఎంత అయిందని ఎవరైనా అడిగినప్పుడు, రుజువు అక్కడే ఉంటుంది."
  - heading: "మీ రసీదు ఎక్కడికి వెళ్తుంది"
    body: "రసీదు చిత్రాలను Google AI సేవ చదువుతుంది. ఫారమ్ నింపడానికి, చిత్రాన్ని Google యొక్క US మల్టీ-రీజియన్‌లో Google Vertex AI (Gemini) చదువుతుంది. కొత్త ఖర్చుకు చిత్రాన్ని జోడిస్తే అది చదవబడుతుంది. PDF, లేదా ఇప్పటికే ఉన్న ఖర్చుకు జోడించిన ఫోటో, చదవకుండానే నిల్వ చేయబడుతుంది. జోడించిన రసీదులు గ్రూప్ సభ్యులకు కనిపిస్తాయి, కాబట్టి రసీదులో మీరు పంచుకోకూడదనుకునేది ఉంటే, ఫోటోను వదిలేసి ఆ ఖర్చును టైప్ చేయండి."
limits:
  heading: "పరిమితులు"
  items:
    - "చిత్రాలు మాత్రమే. JPEG, PNG, WebP, మార్చిన తర్వాత HEIC. PDFలను ఖర్చుకు జోడించవచ్చు కానీ అవి చదవబడవు."
    - "స్కానింగ్ కొత్త ఖర్చులకు మాత్రమే. ఇప్పటికే ఉన్న ఖర్చుకు రసీదులు జోడించవచ్చు, కానీ ఏదీ చదవబడదు."
    - "మీరు ముట్టుకోని ఫీల్డ్‌లను మాత్రమే అది నింపుతుంది, కరెన్సీని మీ గ్రూప్ అనుమతిస్తేనే."
    - "ఇది వస్తువుల వారీగా పంచదు, వస్తువులను వ్యక్తులకు కేటాయించదు. ఇది ఒక ఖర్చును నింపుతుంది, దాన్ని మీరు మామూలుగా పంచుతారు."
    - "అది నింపేది సరైనదని, లేదా స్కానింగ్ ప్రతిసారీ పనిచేస్తుందని హామీ లేదు. సేవ్ చేసే ముందు సరిచూడండి, స్కానింగ్ విఫలమైతే లేదా అందుబాటులో లేకపోతే ఖర్చును చేత్తో జోడించండి."
    - "ఒక ఖర్చుకు మూడు అటాచ్‌మెంట్ల వరకు ఉండవచ్చు, ఒక్కొక్కటి 10 MB వరకు, JPEG, PNG, WebP, HEIC లేదా PDF."
    - "రసీదు చిత్రాలను Google యొక్క US మల్టీ-రీజియన్‌లో Google Vertex AI (Gemini) చదువుతుంది, జోడించిన రసీదులు గ్రూప్ సభ్యులకు కనిపిస్తాయి."
useCasesHeading: "రసీదులు పోగయ్యే చోట"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "రసీదును వస్తువుల వారీగా పంచగలదా?"
      a: "లేదు. ఇది మొత్తంతో సహా ఖర్చును నింపుతుంది, దాన్ని మీరు సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచుతారు. అందరూ వేర్వేరుగా ఆర్డర్ చేసిన బిల్లుకు, ప్రతి వ్యక్తి ఇవ్వాల్సినదాన్ని కచ్చితమైన మొత్తాలుగా నమోదు చేయండి. వివరాలు [ఖర్చుల పంపకం](page:feature/split-expenses)లో ఉన్నాయి."
    - q: "PDFని చదవగలదా?"
      a: "లేదు. అంకెలతో పాటు ప్రయాణించేలా ఖర్చుకు PDFని జోడించవచ్చు, కానీ చిత్రాలు మాత్రమే చదవబడతాయి."
    - q: "స్కాన్‌లకు పరిమితి ఉందా?"
      a: "అయిపోయే స్కాన్ క్రెడిట్లు లేవు, స్కానింగ్ ఉచితం. ఫైళ్లకు పరిమితులు ఉన్నాయి: ఒక్కో ఖర్చుకు మూడు అటాచ్‌మెంట్ల వరకు, ఒక్కొక్కటి 10 MB. మిగతాది [ఉచితంలో ఏముంది](page:pricing)లో ఉంది."
    - q: "నా రసీదును ఎవరు చూడగలరు?"
      a: "ఖర్చుకు జోడించిన రసీదులను గ్రూప్ సభ్యులు చూడగలరు. రసీదు చిత్రాలను Google AI సేవ కూడా చదువుతుంది, ఫారమ్ అలా నిండుతుంది."
    - q: "ఇప్పటికే జోడించిన ఖర్చుకు రసీదు స్కాన్ చేయవచ్చా?"
      a: "లేదు, స్కానింగ్ కొత్త ఖర్చులకు. ఇప్పటికే ఉన్న ఖర్చుకు రసీదును జోడించవచ్చు, అది చదవకుండానే నిల్వ చేయబడుతుంది."
    - q: "అది తప్పు నింపితే?"
      a: "దానిపై టైప్ చేయండి. మీరు సేవ్ చేసే వరకు ప్రతి ఫీల్డ్ సవరించదగినదే, ఏదేమైనా అన్నింటినీ సరిచూడాలి. స్కానింగ్ విఫలమైతే లేదా అందుబాటులో లేకపోతే, మామూలుగా ఖర్చును చేత్తో జోడించండి."
