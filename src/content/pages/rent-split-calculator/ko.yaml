meta:
  title: "월세 나누기 계산기: 방 크기별 또는 소득별 | 사이드 배저"
  description: "큰 방은 더 많이 낼까요? 방 크기별 또는 소득별로 룸메이트마다 얼마씩 내는지 계산하세요. 브라우저에서 작동하며 아무것도 저장하거나 전송하지 않아요."
h1: "월세 나누기 계산기"
navLabel: "월세 나누기 계산기"
lead: "침실이 크면 몫도 클까요? 월세를 입력하면 방 크기별 또는 소득별로 각자 얼마씩 내는지 한 푼 단위까지 보여 줍니다. 브라우저에서 작동하고, 아무것도 저장하지 않으며, 돈을 옮기지도 않아요. 집에서 계산을 계속 기록해 두고 싶다면 사이드 배저에서 [지출을 나누고](page:feature/split-expenses) 매달 월세를 복사하세요."
cta:
  heading: "비율은 한 번만 정하세요. 복사는 영원히."
  body: "이 계산기는 탭을 닫으면 모든 걸 잊어버려요. 인터넷 요금은 분명 자기가 냈다던 그 룸메이트처럼요. 사이드 배저 그룹은 월세, 공과금, 누가 무엇을 냈는지를 보관합니다. 무료이며 광고도, 일일 한도도 없습니다."
sections:
  - heading: "월세를 나누는 두 가지 방법"
    items:
      - "**방 크기별.** 월세의 일부는 모두가 쓰는 주방, 욕실, 거실 몫입니다. 그 비율은 직접 정하고(처음에는 40%), 똑같이 나눠요. 나머지는 침실 면적에 따라 나누므로 큰 방은 더 내고, 수납장만 한 방은 마땅히 받을 할인을 받습니다."
      - "**소득별.** 각자 벌어들이는 소득의 비중과 같은 비율로 월세를 냅니다. 공용 공과금을 추가하면 같은 비율로 따라갑니다."
  - heading: "계산 방법"
    body: "각 사람은 먼저 정확한 몫을 받고, 그다음 소수점 없는 백분율을 받습니다. 정수가 입력하기도, 옥신각신하기도 쉬우니까요. 반올림은 최대 잔여법을 씁니다. 모두 자기 몫의 정수 부분을 먼저 가져가고, 남은 퍼센트포인트는 내림으로 가장 많이 깎인 사람에게 돌아갑니다. 백분율의 합은 항상 100이에요. 아래 집에서 공용 몫 40%는 한 사람당 13.33%입니다. Priya의 방은 집 전체 38 m² 중 16 m²이므로 60% × 16/38은 25.26%이고, 여기에 13.33%를 더하면 38.6%, 반올림하면 39%예요. Tom과 Aisha는 32%와 29%가 되고, 39 + 32 + 29는 100입니다. 각자의 금액은 월세에 이 백분율을 곱한 값이에요. £1,950의 39%는 £760.50입니다."
  - heading: "그다음 사이드 배저에 입력하기"
    body: "줄자까지 동원한 전체 이야기는 [방 크기별 월세 나누는 방법](page:guide/how-to-split-rent-by-room-size)을, 커플이라면 [소득이 더 많은 파트너와 생활비 나누기](page:guide/how-to-split-bills-with-a-partner-who-earns-more)를 참고하세요."
    items:
      - "**월세 추가하기.** 그룹에서 **비용 추가**를 선택하고, **누가 지불했나요?** 항목에서 집주인에게 낸 사람을 고르고, **분할 대상**에는 모두를 그대로 두세요."
      - "**백분율 선택하기.** **분할 방법**에서 **백분율**을 선택하고 소수점 없는 백분율을 입력하세요. 합이 100이 아니면 양식이 알려 줍니다."
      - "**다음 달에 복사하기.** 지난달 월세를 열고 **비용 복사**를 선택하세요. 분할 방식도 함께 복사돼요."
  - heading: "계산기가 하지 않는 일"
    items:
      - "**방 크기 재기.** 바닥 면적은 출발점일 뿐이에요. 전용 욕실이 딸린 방은 같은 면적이어도 욕실이 없는 방보다 가치가 높고, 침대 하나와 희망에 찬 의자 하나가 겨우 들어가는 작은 방은 가치가 낮습니다."
      - "**소득의 기준 정하기.** 실수령액이든 세전이든, 월급이든 부업이든 그룹이 정합니다. 모두 같은 기간을 기준으로 하세요."
      - "**저장하기.** 탭을 닫으면 금액은 사라집니다. 남기려면 링크를 복사하세요. 링크에는 주소의 # 뒤에 금액이 담기는데, 브라우저는 이 부분을 서버로 보내지 않아요. 링크를 가진 사람은 누구나 볼 수 있습니다."
      - "**돈 옮기기.** 집주인에게는 원하는 방법으로 지불하세요."
      - "**통화 섞기, 한도 넘기기.** 통화는 하나만 고르세요. 2명에서 10명까지, 월세는 최대 999,999.99까지 입력할 수 있고 앱과 같습니다."
exampleAfter: 2
