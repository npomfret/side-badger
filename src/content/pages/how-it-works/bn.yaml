sections:
  - heading: "39টি ভাষা, আর আরও মানুষের জন্য তৈরি"
    body: "Side Badger ব্যবহার করুন 39টি ভাষায়, ডান থেকে বামে লেখা আরবি, ফার্সি আর উর্দুসহ। গ্রুপের প্রত্যেকে নিজের ভাষা বেছে নিতে পারে, তাই গ্রুপের পৃষ্ঠা একজনের জন্য আরবিতে আর পরের জনের জন্য ইংরেজিতে হতে পারে। এটি কীবোর্ড আর স্ক্রিন-রিডার ব্যবহারকারীদের কথা ভেবেও তৈরি, আর সদস্যদের রঙের সঙ্গে প্যাটার্নও থাকে, যাতে সবুজ আর লাল আলাদা করতে না হয়।"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "সবার কি অ্যাকাউন্ট লাগবে?"
      a: "হ্যাঁ, একটি বিনামূল্যের অ্যাকাউন্ট। প্রত্যেকে কিছু যোগ করার আগে নিজের ইমেইল যাচাই করে।"
    - q: "এর কি কোনো অ্যাপ আছে?"
      a: "এটি ব্রাউজারে চলে, আর আপনি হোম স্ক্রিনে বা ডকে যোগ করতে পারেন যাতে এটি অ্যাপের মতো খোলে। অ্যাপ-স্টোরের সংস্করণ নেই, অফলাইন মোডও নেই।"
    - q: "Side Badger কি টাকা পাঠায়?"
      a: "না। এটি হিসাব রাখে আর পেমেন্ট সাজেস্ট করে, আর আপনারা যেভাবে খুশি একে অপরকে দেন। তারপর পেমেন্টটা রেকর্ড করেন। দেখুন [হিসাব মেটানো](page:feature/settle-up)।"
    - q: "কেউ কি দেনা রেখে চলে যেতে পারে?"
      a: "না। যতক্ষণ কারও দেওয়ার বা পাওয়ার বাকি আছে, সে গ্রুপ ছাড়তে পারে না, তাই আগে হিসাব মেটাতে হয়।"
    - q: "একটি গ্রুপে কতজন যোগ দিতে পারে?"
      a: "একটি গ্রুপে 50 জন পর্যন্ত। তাদের লিঙ্ক বা QR কোড দিয়ে ডাকুন, আর অ্যাডমিন প্রত্যেককে ঢুকতে দেবেন এমন চাইলে অনুমোদন চালু করুন।"
    - q: "একাধিক মুদ্রার ট্রিপ হলে কী হবে?"
      a: "ব্যালেন্স প্রতিটি মুদ্রার জন্য আলাদা রাখা হয়। দেখুন [একাধিক মুদ্রা](page:feature/multiple-currencies)।"
