sections:
  - heading: "Zaznamenejte platbu"
    body: "Když někdo zaplatí, zaznamenejte to u správné osoby. Tlačítka rychlého vyrovnání doplní částku z vašich navržených plateb a můžete přidat poznámku, například „bankovní převod“ (až 500 znaků). Zaplatíte-li jen část toho, co dlužíte, zbytek zůstane na zůstatku. Pokud zadáte příliš málo nebo příliš mnoho, Side Badger vás před uložením upozorní. Zaznamenání platby vyžaduje oprávnění upravovat výdaje a datum nesmí být v budoucnosti."
  - heading: "Platba v jiné měně?"
    body: "Zůstatky zůstávají v měně, ve které se platilo, takže dluh v eurech zůstane dluhem v eurech. Dlužíte eura, ale platíte v librách? Platbu při zadávání převeďte, podle aktuálního směnného kurzu nebo kurzu, který platil při výměně. Kurz se zafixuje při uložení platby. Jak funguje převod, popisuje stránka [více měn](page:feature/multiple-currencies) a [skupinové výlety](page:use-case/group-trips) ho ukazují v praxi."
  - heading: "Historie, kterou si můžete ověřit"
    body: "Každá zaznamenaná platba zůstává v historii skupiny s datem, částkou a poznámkou. Platbu může upravit jen ten, kdo ji zaznamenal, a smazat ji může on nebo správce skupiny. Platba, které se týká někdo, kdo opustil skupinu, je zamčená. Ukázkový scénář se spolubydlícími najdete u [spolubydlících](page:use-case/housemates)."
limits:
  heading: "Co Side Badger nedělá"
  items:
    - "Side Badger nepřesouvá peníze, neposílá odkazy na platbu ani žádosti o platbu. Platba v aplikaci je záznam platby provedené jinde."
    - "Navržené platby vycházejí z jednoduché metody párování, použité zvlášť pro každou měnu. Vždy navrhne méně plateb, než je lidí se zůstatkem v dané měně (u čtyř lidí nejvýš tři), ale nenajde vždy nejmenší možný počet."
    - "Návrhy nelze vypnout. **Zobrazit vše** vypíše každou navrženou platbu ve skupině, nejen vaše."
    - "Měny se nikdy navzájem nezapočítávají, pokud nebyly výdaje při zadání převedeny."
    - "Neexistují žádné připomínky, takže vymáhání platby je stále na vás."
useCasesHeading: "Kde na vyrovnání záleží"
faq:
  heading: "Otázky"
  items:
    - q: "Posílá Side Badger peníze?"
      a: "Ne. Platíte si, jak chcete, a pak platbu zaznamenáte v Side Badger, aby se zůstatek aktualizoval."
    - q: "Mohu navržené platby vypnout?"
      a: "Ne. Zjednodušení zůstává zapnuté a **Zobrazit vše** vypíše každou navrženou platbu ve skupině, nejen ty, které se týkají vás."
    - q: "Proč jsou eura a libry vedeny zvlášť?"
      a: "Zůstatky zůstávají v měně, ve které jste platili, pokud nepřevedete při zadání výdaje nebo platby. Dluhy v různých měnách se nikdy navzájem nezapočítávají."
    - q: "Co když někdo zaplatí jen část toho, co dluží?"
      a: "Zaznamenejte zaplacenou část. Zbytek zůstane na zůstatku, dokud nebude zaplacen."
    - q: "Je to vždy nejmenší možný počet plateb?"
      a: "Není to zaručeno. Vždy navrhne méně plateb, než je lidí se zůstatkem v dané měně, takže u čtyř lidí nikdy více než tři. V příkladu se spolubydlícími jsou to dvě platby tam, kde přímé vracení každému zvlášť vyžadovalo šest."
