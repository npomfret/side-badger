meta:
  title: "Cad a dhéanann agus nach ndéanann Side Badger"
  description: "Roinnt, socrú suas agus ilairgeadraí, móide grúpaí, liostaí agus vótaí. An trealamh iomlán, agus liosta macánta de na rudaí a fhágann Side Badger ar lár."
h1: "Cad a dhéanann Side Badger"
navLabel: "Gnéithe"
lead: "Gach rud sa bhosca, agus an méid nach bhfuil ann."
intro: "Seo an trealamh iomlán. D'fhágamar an scarbhileog ar lár d'aon ghnó. Roghnaigh gné thíos don leagan fada, nó féach go tapa ar an gcuid eile den liosta agus an liosta gearr de na rudaí nach ndéanann Side Badger."
cta:
  heading: "An ndéanann sé an rud a theastaíonn ó do ghrúpa?"
  body: "Cruthaigh cuntas saor in aisce agus bain triail as le grúpa beag ar dtús."
cardsHeading: "Gach gné, go mion"
sections:
  - heading: "Scanadh admhálacha"
    body: "Tóg grianghraf den admháil agus líonann Side Badger isteach an t-iomlán, an dáta agus an áit duit le seiceáil. Léann seirbhís AI Google íomhánna admhálacha. [Conas a oibríonn scanadh admhálacha](page:feature/receipt-scanning)."
  - heading: "Grúpaí agus ceadanna"
    body: "Déan grúpa do gach teach, turas nó imeacht, le suas le 50 duine ann. Tabhair cuireadh do dhaoine le nasc nó le cód QR. I ngrúpa níos mó, déan breathnóir de dhuine éigin, a fheiceann gach rud agus nach n-athraíonn aon rud. Tá an cló beag ar [grúpaí agus ceadanna](page:feature/groups-and-permissions)."
  - heading: "Liostaí agus vótaí"
    body: "Coinnigh an liosta siopadóireachta comhroinnte in aice leis na billí siopadóireachta. Cuir liosta gearr na dtithe saoire chun vótála, gan ainm más maith leat. Clúdaíonn [pleanáil le chéile](page:feature/plan-together) tráchtanna, ceisteanna, liostaí agus vótaí."
  - heading: "Gach rud eile"
    items:
      - "**Nuashonruithe beo:** cuir costas leis agus feiceann gach duine é gan mhoill."
      - "**Teangacha:** úsáid Side Badger i 39 teanga. Is féidir le gach duine sa ghrúpa a dteanga féin a roghnú."
      - "**Scáileán baile:** níl siopa aipeanna de dhíth. Sínigh isteach, ansin cuir Side Badger le do scáileán baile agus osclaíonn sé cosúil le haip. Taispeánann Socruithe san aip duit conas. [Tuilleadh faoin aip ghréasáin](page:feature/web-app)."
      - "**Fógraí:** cas fógraí brú air i Socruithe chun fógra a fháil nuair a bhíonn gníomhaíocht nua i do ghrúpaí. Ar iPhone agus iPad, cuir Side Badger le do scáileán baile ar dtús."
      - "**Aiseolas:** fuair tú fabht? Inis dúinn ón aip féin agus féach ár bhfreagra ansin."
  - heading: "Cad nach ndéanann Side Badger"
    items:
      - "**Airgead a bhogadh.** Ní théann Side Badger i dteagmháil le d'airgead choíche. Íocaigí a chéile ar an gcaoi is fearr libh. Tá iarratais ar íocaíocht beartaithe."
      - "**Billí a athrá.** Níl aon chostais athfhillteacha ann. Cóipeáil bille na míosa seo caite le dhá thapáil."
      - "**Roinnt de réir míre.** Íocann duine amháin as gach costas. Roinn go cothrom, go cruinn nó de réir céatadáin."
      - "**Aip dhúchasach a sheoladh.** Oibríonn sé i do bhrabhsálaí. Sínigh isteach, ansin cuir le do scáileán baile é."
      - "**Oibriú as líne.** Teastaíonn nasc uaidh."
      - "**Foláirimh a sheoladh trí ríomhphost nó téacs.** Taispeántar gníomhaíocht nua san aip, agus mar fhógraí brú má chasann tú air iad."
      - "**Cairteacha nó buiséid a tharraingt.** Coinníonn sé cuntas ar cé atá i bhfiacha le cé, agus sin an cleas ar fad."
      - "**Síniú isteach le Google nó Apple.** Cláraigh le ríomhphost. Tá síniú isteach le Google agus Apple beartaithe."
      - "**Daoine a ligean isteach gan chuntas.** Teastaíonn cuntas saor in aisce ó gach duine sa ghrúpa."
faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir liom íoc trí Side Badger?"
      a: "Ní féidir. Coinníonn Side Badger an cuntas agus ní théann sé i dteagmháil le d'airgead choíche. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht."
    - q: "An bhfuil aip mhóibíleach ann?"
      a: "Ní i siopa aipeanna. Ritheann Side Badger i do bhrabhsálaí. Sínigh isteach ar do ghuthán, ansin cuir le do scáileán baile é ionas go n-osclaíonn sé cosúil le haip. Taispeánann Socruithe san aip duit conas."
    - q: "An féidir liom roinnt de réir míre?"
      a: "Ní féidir. Tá duine amháin ag íoc as gach costas, agus roinneann tú go cothrom é, de réir suimeanna cruinne nó de réir céatadáin."
    - q: "An n-oibríonn sé as líne?"
      a: "Ní oibríonn, teastaíonn nasc uaidh."
    - q: "An gcaithfidh cuntas a bheith ag gach duine sa ghrúpa?"
      a: "Caithfidh. Teastaíonn cuntas saor in aisce ó gach duine sa ghrúpa, agus níl uait chun clárú ach seoladh ríomhphoist."
