sections:
  - heading: "Ένα νόμισμα για όλη την ομάδα"
    body: "Αν η ομάδα προτιμά να μην το σκέφτεται, διαλέξτε ένα νόμισμα ομάδας και η φόρμα μετατρέπει σε αυτό κάθε νέο έξοδο, με ισοτιμία που εξακολουθείτε να βλέπετε και να αλλάζετε. Αυτό ισχύει μόνο για νέα και αντιγραμμένα έξοδα. Οι επεξεργασίες και τα υπάρχοντα έξοδα μένουν όπως είναι, ώστε τίποτα ήδη καταγεγραμμένο να μην αλλάζει κάτω από τα πόδια σας."
  - heading: "Χρωστάτε ευρώ, πληρώνετε σε λίρες"
    body: "Πληρώσατε σε γεν και τακτοποιείστε σε λίρες; Μια χαρά. Όταν καταγράφετε μια πληρωμή, μπορείτε να τη μετατρέψετε κι αυτήν, ώστε όποιος χρωστά ευρώ να πληρώσει σε λίρες και το υπόλοιπο σε ευρώ να βγαίνει και πάλι σωστό. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε το."
  - heading: "Κανόνες για την ομάδα"
    body: "Περιορίστε μια ομάδα στα νομίσματα που πράγματι χρησιμοποιείτε και ορίστε μια προεπιλογή ώστε η φόρμα να ανοίγει στο σωστό. Οι διακοπές στην Πορτογαλία δεν χρειάζονται 139 άλλες επιλογές δίπλα στον λογαριασμό του δείπνου και ένας [γάμος στο εξωτερικό](page:use-case/events-and-celebrations) πιθανόν χρειάζεται δύο."
limits:
  heading: "Όρια"
  items:
    - "Η ισοτιμία κλειδώνει όταν αποθηκευτεί το έξοδο. Τα παλιά έξοδα δεν επανεκτιμώνται ποτέ."
    - "Το Side Badger φέρνει μια τρέχουσα ισοτιμία όπου μπορεί. Δεν είναι εγγυημένη για κάθε ζεύγος και μπορείτε πάντα να πληκτρολογήσετε εσείς την ισοτιμία."
    - "Η αυτόματη μετατροπή ομάδας ισχύει μόνο για νέα και αντιγραμμένα έξοδα, όχι για επεξεργασίες ή υπάρχοντα έξοδα."
    - "Κάθε έξοδο έχει όριο 999.999,99 στο δικό του νόμισμα."
    - "Υπάρχουν 140 νομίσματα. Κρυπτονομίσματα και μέταλλα δεν περιλαμβάνονται."
    - "Το Side Badger καταγράφει πληρωμές. Δεν μετακινεί ούτε ανταλλάσσει ποτέ χρήματα."
useCasesHeading: "Πού βοηθά αυτό"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Ποια συναλλαγματική ισοτιμία χρησιμοποιείτε;"
      a: "Μια τρέχουσα συναλλαγματική ισοτιμία, που φέρνει όταν καταχωρίζετε το έξοδο όπου είναι διαθέσιμη. Μπορείτε να την αλλάξετε σε αυτήν που ίσχυσε στην πραγματικότητα και το μετατρεμμένο ποσό ενημερώνεται."
    - q: "Επανεκτιμώνται τα παλιά έξοδα;"
      a: "Όχι. Η ισοτιμία κλειδώνει όταν αποθηκευτεί το έξοδο, οπότε ένα υπόλοιπο δεν παρασύρεται επειδή κινήθηκε η αγορά."
    - q: "Υποστηρίζετε κρυπτονομίσματα;"
      a: "Όχι. Υπάρχουν 140 νομίσματα και τα κρυπτονομίσματα δεν περιλαμβάνονται."
    - q: "Γιατί δεν μπορώ να βάλω 2.000.000 ινδονησιακές ρουπίες;"
      a: "Κάθε έξοδο έχει όριο 999.999,99 στο δικό του νόμισμα. Καταχωρίστε το σε άλλο νόμισμα και μετατρέψτε ή χωρίστε το σε δύο έξοδα."
    - q: "Κοστίζει κάτι η μετατροπή;"
      a: "Όχι. Η μετατροπή είναι δωρεάν, όπως και τα υπόλοιπα του Side Badger. Δείτε τις [τιμές](page:pricing)."
    - q: "Πρέπει να μετατρέπω;"
      a: "Όχι. Τα νομίσματα μένουν ξεχωριστά εκτός αν εσείς ή η ομάδα σας επιλέξετε να μετατρέπετε και κάθε νόμισμα έχει τη δική του σύντομη λίστα πληρωμών."
