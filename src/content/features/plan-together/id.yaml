meta:
  title: "Daftar, jajak pendapat, dan komentar untuk grup | Side Badger"
  description: "Komentari pengeluaran, pertanyakan yang janggal, buat daftar belanja, dan pilih vila lewat jajak pendapat. Rencanakan dulu, lalu bagi. Gratis, tanpa iklan."
h1: "Rencanakan bersama, bagi sesudahnya"
navLabel: "Rencanakan bersama"
lead: "Daftar belanja dan tagihan belanja, akhirnya mau saling bicara. Side Badger memberi grup Anda tempat membicarakan uang sebelum dan sesudah dibelanjakan, dengan komentar di setiap pengeluaran, cara mempertanyakan yang tampak salah, daftar bersama, dan jajak pendapat untuk keputusan besar. Lalu Anda [membagi pengeluaran](page:feature/split-expenses) seperti biasa."
cta:
  heading: "Rencanakan dulu, lalu bagi"
  body: "Buat akun gratis, mulai grup, dan taruh daftar, jajak pendapat, atau pertanyaan pertama tepat di samping uangnya. Tidak yakin apa yang terjadi selanjutnya? Lihat [cara kerja](page:how-it-works)."
problem:
  heading: "Obrolannya di sini, tagihannya di sana"
  body: "Pengeluaran grup biasanya hidup di dua tempat. Angkanya di satu tempat, dan pertengkaran soal angka itu ada di obrolan yang sudah tergulir jauh sejak hari Selasa. Daftar belanja adalah foto kulkas. Vila diputuskan lewat acungan jempol dari sebagian besar orang, mungkin. Side Badger menyimpan perencanaan di dalam grup, di samping pengeluaran yang dibahas, jadi ada komentar di tempat biaya itu berada, daftar di tempat belanja itu terjadi, jajak pendapat untuk keputusan besar, dan cara untuk bilang \"tunggu, ini benar?\" tanpa menulis satu paragraf. Semuanya tetap berkisar pada uang grup, karena itulah gunanya grup."
workflow:
  heading: "Dari memilih vila sampai tagihan belanja"
  steps:
    - title: "Putuskan hal besar lewat pemungutan suara"
      body: "Tambahkan jajak pendapat untuk keputusan yang menentukan tagihan, seperti vila mana. Pilih dua sampai sepuluh pilihan, tentukan berapa suara yang didapat tiap orang, lalu tutup saat semua sudah memilih dan pemenangnya ditandai."
      shot: S17
      shotAlt: "Jajak pendapat yang sudah ditutup dengan pilihan pemenang ditandai dan jumlah suara di samping tiap pilihan"
    - title: "Tulis daftar belanja bersama"
      body: "Mulai daftar bersama, tambahkan barang, dan centang saat masuk troli. Belanjaannya dimasukkan sesudahnya sebagai pengeluaran."
      shot: S16
      shotAlt: "Daftar belanja bersama dengan beberapa barang yang sudah dicentang dan hitungan kemajuan"
    - title: "Bicarakan biaya di tempatnya berada"
      body: "Beri komentar pada pengeluarannya sendiri, lampirkan struk, dan beri reaksi dengan emoji. Percakapan tetap berada di samping angka yang dibahas."
      shot: S08
      shotAlt: "Sebuah pengeluaran dengan detailnya, gambar mini struk, utas komentar, dan reaksi emoji"
    - title: "Pertanyakan yang tampak janggal"
      body: "Jika grup mengaktifkan pertanyaan pengeluaran, siapa pun yang termasuk dalam sebuah pengeluaran bisa memilih **Saya punya pertanyaan**. Pengeluaran itu tetap di luar saldo sampai pertanyaannya ditangani."
      shot: S18
      shotAlt: "Daftar pengeluaran dengan lencana Dipertanyakan dan filter Hanya dipertanyakan"
    - title: "Lihat apa yang berubah, dan siapa yang mengubahnya"
      body: "Umpan aktivitas dan lonceng notifikasi menampilkan yang baru di seluruh grup Anda. Notifikasi push tersedia jika Anda mau."
      shot: S19
      shotAlt: "Dropdown notifikasi dengan daftar aktivitas terbaru"
