meta:
  title: "बिना डाउनलोड वाला बिल बांटने का ऐप | Side Badger"
  description: "आपका फोन भरा है, हम समझते हैं। Side Badger आपके ब्राउज़र में चलता है, बिना ऐप स्टोर और बिना डाउनलोड के। इसे होम स्क्रीन पर जोड़ें और यह ऐप की तरह खुलता है।"
h1: "कोई ऐप स्टोर नहीं। कोई डाउनलोड नहीं। फिर भी ऐप जैसा"
navLabel: "वेब ऐप"
lead: "Side Badger आपके ब्राउज़र में रहता है। खोजने के लिए कोई ऐप स्टोर नहीं और पहले डाउनलोड करने के लिए कुछ नहीं। फोन या कंप्यूटर पर साइन इन करें, अपने ग्रुप के साथ ऑनलाइन खर्च बांटें, और जब इसे एक टैप की दूरी पर चाहिए तो इसे अपनी होम स्क्रीन या Dock में जोड़ लें।"
cta:
  heading: "खोलें। साइन इन करें। ग्रुप शुरू करें।"
  body: "अकाउंट बनाएं, ग्रुप शुरू करें और पहला खर्च जोड़ें, सब उसी ब्राउज़र से जो आपके पास पहले से खुला है। पहले टूर चाहिए? [यह कैसे काम करता है](page:how-it-works) देखें, या [मुफ्त में क्या-क्या मिलता है](page:pricing) जांचें।"
problem:
  heading: "आपका फोन भरा है। हम समझते हैं।"
  body: "उसमें कहीं एक ही सूर्यास्त की चार हज़ार फोटो हैं और स्टोरेज की एक चेतावनी, जिसे आप महीनों से स्वाइप करके हटाते आ रहे हैं। आखिरी चीज़ जो उसे चाहिए, वह एक और ऐप है, वह भी सिर्फ एक डिनर बांटने के लिए। इसलिए Side Badger एक वेब ऐप है। यह फोन या कंप्यूटर पर किसी आधुनिक ब्राउज़र में चलता है। फोन पर यह मोबाइल लेआउट इस्तेमाल करता है, जिसमें ग्रुप पेज टैब में बंटा होता है और कंट्रोल टच के हिसाब से बने हैं। कुछ एक्स्ट्रा, जैसे इसे होम स्क्रीन पर जोड़ना, आपके ब्राउज़र पर निर्भर करते हैं, और हम बताते हैं कि कहां।"
workflow:
  heading: "ब्राउज़र टैब से होम स्क्रीन तक तीन कदम में"
  steps:
    - title: "इसे खोलें और साइन इन करें"
      body: "अपने ब्राउज़र में Side Badger पर जाएं और साइन इन करें। आपको सिर्फ एक ईमेल पता और पासवर्ड चाहिए, और कुछ भी जोड़ने से पहले आप ईमेल वेरिफाई करते हैं। ग्रुप में सबको अकाउंट चाहिए, इसलिए जिन्हें आप बुलाएंगे वे भी यही करेंगे।"
    - title: "इसे होम स्क्रीन या Dock में जोड़ें"
      body: "साइन इन करने के बाद ऐप खुद को इंस्टॉल करने की पेशकश करता है। जहां आपका ब्राउज़र अनुमति देता है वहां आपको **इंस्टॉल करें** बटन मिलता है, और जहां नहीं देता वहां **तरीका दिखाएं**। छूट गया, या मना कर दिया था? **सेटिंग्स** में **होम स्क्रीन या Dock में जोड़ें** के नीचे यही मदद मौजूद है। iPhone या iPad पर सेटिंग्स पहले iPhone के कदम दिखाती है और बाकी डिवाइस **अन्य डिवाइस** के नीचे रखती है। किसी भी तरह, उसके बाद ऐप अपनी अलग विंडो में खुलता है।"
      shot: S20
      shotAlt: "सेटिंग्स का होम स्क्रीन या Dock में जोड़ें सेक्शन, जिसमें ऐप को डिवाइस में जोड़ने के कदम हैं"
    - title: "सूचनाएं चालू करें, अगर चाहें"
      body: "सूचनाएं तब तक बंद रहती हैं जब तक आप उन्हें चालू न करें, और हर डिवाइस अलग से चालू होता है। सूचनाओं की घंटी जो **चालू करें** बटन देती है उसे इस्तेमाल करें, या **सेटिंग्स** में **पुश सूचनाएं** का स्विच। iPhone या iPad पर पहले ऐप को होम स्क्रीन से खोलें। वहां सूचनाएं सिर्फ इसी तरह काम करती हैं।"
      shot: S19
      shotAlt: "खुला हुआ सूचनाओं का ड्रॉपडाउन, जिसमें ग्रुप की हाल की गतिविधि की सूची है"
options:
  heading: "डिवाइस के हिसाब से इसे कैसे जोड़ें"
  items:
    - title: "iPhone और iPad"
      body: "शेयर करें बटन पर टैप करें, ऊपर की ओर तीर वाला एक वर्ग। न दिखे तो पहले तीन बिंदुओं (•••) पर टैप करें, फिर शेयर करें। नीचे स्क्रोल करें और **होम स्क्रीन में जोड़ें** पर टैप करें। **वेब ऐप के रूप में खोलें** को चालू रखें, फिर **जोड़ें** पर टैप करें। अगर कोई लिंक किसी दूसरे ऐप के अंदर खुला हो, तो पेज को पहले Safari में खोलें, क्योंकि वह अंदर बना ब्राउज़र इसे जोड़ नहीं सकता।"
    - title: "Android"
      body: "ब्राउज़र का मेनू खोलें और **होम स्क्रीन पर जोड़ें** या **ऐप इंस्टॉल करें** चुनें।"
    - title: "कंप्यूटर पर Chrome या Edge"
      body: "ब्राउज़र का मेनू खोलें और इस साइट को ऐप के रूप में इंस्टॉल करने का विकल्प चुनें। तब इसे अपनी अलग विंडो और अपना आइकन मिलता है।"
    - title: "Mac पर Safari"
      body: "**फ़ाइल** चुनें, फिर **Dock में जोड़ें**।"
sections:
  - heading: "सूचनाएं, सिर्फ तभी जब आप मांगें"
    body: "पुश सूचनाएं वैकल्पिक हैं। उन्हें चालू करें और जब आपके ग्रुप में कोई नई गतिविधि हो, जैसे कोई खर्च जोड़े, कमेंट करे या पेमेंट रिकॉर्ड करे, तो आपको सूचना मिलती है। वे एक-एक डिवाइस करके, सूचनाओं की घंटी से या **सेटिंग्स** से चालू होती हैं, और आप उन्हें वहीं से फिर बंद कर सकते हैं। उन्हें ऐसा ब्राउज़र चाहिए जो उन्हें सपोर्ट करे, और आपकी अनुमति। अगर आपके ब्राउज़र ने साइट के लिए उन्हें ब्लॉक कर रखा है, तो पहले ब्राउज़र की सेटिंग्स में उन्हें अनुमति दें। iPhone या iPad पर वे सिर्फ होम स्क्रीन में जोड़े गए ऐप से काम करती हैं, ब्राउज़र टैब से नहीं। डिलीवरी की गारंटी नहीं है, इसलिए सूचना को इशारा समझें, वादा नहीं। फ़ीड में क्या दिखता है, इसके लिए [मिलकर प्लान करें](page:feature/plan-together) देखें।"
  - heading: "लाइव अपडेट, रीफ्रेश बटन नहीं"
    body: "खर्च जोड़ें और सबको वह तुरंत दिखता है, साथ में यह भी कि क्या बदला और किसने बदला। हर ग्रुप अपनी गतिविधि हिस्ट्री रखता है, और सूचनाओं की घंटी आपके सभी ग्रुप की गतिविधि दिखाती है। किसी को पूछना नहीं पड़ता कि आपने अभी जो जोड़ा वह देखा या नहीं। वह उनकी स्क्रीन पर है।"
  - heading: "39 भाषाएं, हर किसी की अपनी"
    body: "Side Badger को 39 भाषाओं में इस्तेमाल करें, जिनमें दाएं से बाएं लिखी जाने वाली अरबी, फ़ारसी और उर्दू भी हैं। ग्रुप में हर कोई अपनी भाषा चुनता है, इसलिए वही ग्रुप पेज एक व्यक्ति के लिए अरबी में हो सकता है और अगले के लिए अंग्रेज़ी में। ग्रुप को सिर्फ संख्याओं पर सहमत होना है।"
  - heading: "सिर्फ एक तरह के यूज़र के लिए नहीं बना"
    body: "Side Badger कीबोर्ड और स्क्रीन-रीडर इस्तेमाल करने वालों को ध्यान में रखकर बनाया गया है। सदस्यों के रंगों के साथ पैटर्न आते हैं, इसलिए आपको हरे और लाल में फर्क नहीं करना पड़ता।"
    items:
      - "स्किप लिंक, ताकि कीबोर्ड यूज़र सीधे कंटेंट पर पहुंच सकें।"
      - "डायलॉग कीबोर्ड फ़ोकस संभालते हैं।"
      - "कंट्रोल पर लेबल लगे हैं, स्क्रीन रीडर के लिए।"
      - "दाएं से बाएं लिखी जाने वाली भाषाओं के लिए लेआउट पलट जाते हैं।"
limits:
  heading: "वेब ऐप क्या नहीं करता"
  items:
    - "ऑफ़लाइन इस्तेमाल नहीं है। Side Badger को कनेक्शन चाहिए, इसलिए वह बिना वाईफ़ाई के हवाई जहाज़ में आपका ग्रुप नहीं खोलेगा।"
    - "ऐप स्टोर में कोई ऐप नहीं है और न कोई नेटिव iPhone या Android ऐप। Side Badger एक वेब ऐप है, और इसे होम स्क्रीन या Dock में जोड़ना ही ऐप जैसा वर्शन पाने का तरीका है।"
    - "इसे होम स्क्रीन या Dock में जोड़ना आपके ब्राउज़र पर निर्भर करता है। मेनू के नाम ब्राउज़र और वर्शन के हिसाब से बदलते हैं, और कुछ ब्राउज़र इसे देते ही नहीं।"
    - "पुश सूचनाएं हर डिवाइस के लिए वैकल्पिक हैं, और उन्हें ऐसा ब्राउज़र चाहिए जो उन्हें सपोर्ट करे, और आपकी अनुमति। iPhone या iPad पर वे सिर्फ होम स्क्रीन में जोड़े गए ऐप से काम करती हैं। डिलीवरी की गारंटी नहीं है।"
    - "कोई ईमेल या टेक्स्ट अलर्ट और पेमेंट के रिमाइंडर नहीं हैं। नई गतिविधि ऐप में दिखती है, और आप चालू करें तो पुश सूचनाओं के रूप में भी। पेमेंट के पीछे पड़ना अब भी आपके हाथ में है।"
    - "गतिविधि 90 दिन रखी जाती है।"
    - "आप ईमेल पते और पासवर्ड से साइन इन करते हैं। Google या Apple साइन-इन नहीं है, और आपकी उम्र 18 साल या उससे ज़्यादा होनी चाहिए।"
    - "हम यह दावा नहीं करते कि Side Badger पूरी तरह एक्सेसिबल है, या वह किसी औपचारिक एक्सेसिबिलिटी मानक पर खरा उतरता है। अगर कुछ आपके रास्ते में आए, तो हमें ऐप के भीतर से बताएं और हमारा जवाब आपको वहीं दिखेगा।"
useCasesHeading: "जहां ऐप की ज़रूरत न होना काम आता है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या किसी ऐप स्टोर में Side Badger का ऐप है?"
      a: "नहीं। Side Badger एक वेब ऐप है। आप इसे अपने ब्राउज़र में खोलते हैं, और इसे होम स्क्रीन या Dock में जोड़ सकते हैं ताकि यह ऐप की तरह खुले। ऐप स्टोर से डाउनलोड करने के लिए कुछ नहीं है।"
    - q: "क्या मैं ऐप डाउनलोड किए बिना बिल बांट सकता हूँ?"
      a: "हाँ। फोन या कंप्यूटर के ब्राउज़र में Side Badger खोलें, साइन इन करें और ग्रुप शुरू करें। इसे होम स्क्रीन या Dock में जोड़ना वैकल्पिक है।"
    - q: "क्या यह ऑफ़लाइन चलता है?"
      a: "नहीं। Side Badger को कनेक्शन चाहिए, तब भी जब वह होम स्क्रीन या Dock में जोड़ा गया हो।"
    - q: "मेरे iPhone पर सूचनाएं क्यों नहीं आ रहीं?"
      a: "iPhone या iPad पर सूचनाएं सिर्फ होम स्क्रीन में जोड़े गए ऐप से काम करती हैं, ब्राउज़र टैब से नहीं। उसे जोड़ें, होम स्क्रीन के आइकन से खोलें, फिर **सेटिंग्स** में सूचनाएं चालू करें। डिलीवरी की गारंटी नहीं है, इसलिए अगर कोई सूचना गुम हो जाए, तो ग्रुप की गतिविधि हिस्ट्री फिर भी दिखाती है कि क्या जोड़ा गया।"
    - q: "क्या मुझे सूचनाएं चालू करनी ही होंगी?"
      a: "नहीं। वे तब तक बंद रहती हैं जब तक आप उन्हें एक-एक डिवाइस करके चालू न करें। उनके बिना भी नई गतिविधि ऐप में दिखती है, और ऐप खुला होने पर सबको बदलाव तुरंत दिखता है।"
    - q: "क्या ग्रुप में सबको अकाउंट चाहिए?"
      a: "हाँ। आपको सिर्फ एक ईमेल पता और पासवर्ड चाहिए, और कुछ भी जोड़ने से पहले आप ईमेल वेरिफाई करते हैं। ग्रुप में जुड़ने वाला हर व्यक्ति यही करता है, जिस भी फोन या कंप्यूटर पर वह चाहे।"
