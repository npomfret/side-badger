faq:
  heading: "Vragen"
  items:
    - q: "Wat als iemand een grotere kamer heeft maar minder licht?"
      a: "Vloeroppervlakte is maar het beginpunt, dus de groep kan afspreken om bij te sturen. Haal een punt of twee af van de donkere kamer, geef ze aan de anderen en controleer of de percentages nog steeds samen 100 zijn. Side Badger bewaart wat jullie afspreken en oordeelt er niet over."
    - q: "Moeten de rekeningen ook naar kamergrootte verdeeld worden?"
      a: "Meestal niet. Energie en internet worden door iedereen gebruikt, dus een gelijke verdeling is eenvoudiger, zoals in het voorbeeld hierboven. Is één huisgenoot de hele dag thuis, dan kan de groep iets anders afspreken, zoals exacte bedragen. [Uitgaven verdelen](page:feature/split-expenses) behandelt de opties."
    - q: "Kunnen we de verdeling later nog wijzigen?"
      a: "Ja, voor nieuwe uitgaven. Pas de percentages aan wanneer je de huur kopieert en eerdere maanden blijven zoals ze waren. Om een oude uitgave te corrigeren, bewerk je ze als de machtigingen van de groep het toelaten, en zeg het eerst aan je huisgenoten, want de saldi veranderen. De eerdere versie blijft bewaard."
