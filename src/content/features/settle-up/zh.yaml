meta:
  title: 用更少的付款笔数结清 | Side Badger
  description: 看看群组里谁欠谁，得到一份让所有人结清的简短付款清单，并随时记录每一笔付款。免费使用。
h1: 用更少的付款笔数结清
navLabel: 结算
lead: Side Badger 为群组里的每个人保持一份持续更新的余额，并建议一份简短的付款清单来结清。你们想怎么付就怎么付，然后记录下来。如果想先看看数字是怎么分的，请从[分摊支出](page:feature/split-expenses)开始。
cta:
  heading: 准备好理清谁欠谁了吗？
  body: 创建账户，建一个群组，添加第一笔支出。余额会接手后面的事。
problem:
  heading: 随时更新的余额
  body: 每笔支出都会改变谁欠谁，所以每当有支出和付款加入，Side Badger 都会让余额保持最新。群组里每个人都能立即看到变化，以及改了什么、是谁改的。余额按货币分别记录，所以欧元和英镑各在各的栏里，除非某笔支出在录入时做了换算。默认情况下你只看到与你相关的债务；**显示全部**会列出整个群组。
workflow:
  heading: 三步两清
  steps:
    - title: 看看谁欠谁
      body: 打开群组余额，查看你欠多少、别人欠你多少，以及一份让所有人结清的简短付款清单，按货币分别算出。被质疑的支出在问题解决之前不计入。在下面的室友示例中，六笔付款变成了两笔。
      shot: S10
      shotAlt: 余额界面，显示两种货币的简化债务，并已开启“显示全部”
    - title: 想怎么付就怎么付，然后记录下来
      body: 银行转账、现金，或是上次假期欠下的人情。Side Badger 不转移资金。钱到手之后，记录这笔付款，所有人的余额都会更新。
      shot: S11
      shotAlt: 付款表单，带有快速结算按钮和部分付款时显示的提示
    - title: 确认已经到账
      body: 付款会进入群组历史，群组里每个人都能看到，还能用表情回应。付款到账时，不妨庆祝一下。
      shot: S12
      shotAlt: 付款历史，一笔付款上带有表情回应
