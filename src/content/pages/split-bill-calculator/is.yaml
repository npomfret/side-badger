faq:
  heading: "Spurningar"
  items:
    - q: "Er reiknivélin ókeypis?"
      a: "Já. Ókeypis. Engar auglýsingar. Engin dagleg takmörk. Þú þarft ekki heldur aðgang."
    - q: "Vistar hún það sem ég slæ inn?"
      a: "Nei. Ekkert er vistað eða sent neitt. Til að halda tölunum skaltu nota „Afrita tengil“ og vista tengilinn einhvers staðar."
    - q: "Hver getur séð tengilinn sem ég afrita?"
      a: "Hver sá sem hefur hann. Tölurnar eru í tengilinum sjálfum, fyrir aftan #, svo deildu honum aðeins með þeim sem mega sjá þær."
    - q: "Flytur hún peninga?"
      a: "Nei. Hún reiknar út hver ætti að borga hverjum og þið borgið hvert öðru eins og ykkur hentar. Side Badger snertir heldur aldrei peningana þína. Sjá [uppgjör](page:feature/settle-up)."
    - q: "Get ég skipt ferð sem var greidd í tveimur gjaldmiðlum?"
      a: "Ekki hér, því útreikningur hefur einn gjaldmiðil. Í hópi heldur hver gjaldmiðill sína eigin stöðu. Sjá [marga gjaldmiðla](page:feature/multiple-currencies)."
    - q: "Hvað ef upphæðirnar ganga ekki upp?"
      a: "Reiknivélin segir frá því undir útgjaldinu og sýnir enga niðurstöðu fyrr en þær gera það. Nákvæmar upphæðir verða að ná heildarupphæðinni og prósentur verða að vera samtals 100."
