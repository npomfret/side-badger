faq:
  heading: "Fragen"
  items:
    - q: "Zahlt der Trauzeuge oder die Trauzeugin mehr?"
      a: "Nur, wenn die Gruppe es so vereinbart. Die App gibt niemandem eine Sonderrolle bei der Rechnung. Übernimmt jemand mehr, wähle unter **Wie aufteilen** den Eintrag **Genaue Beträge** oder **Prozentsatz** und gib die vereinbarten Anteile ein."
    - q: "Was ist mit Getränken, die manche nicht hatten?"
      a: "Trage die Getränke als eigene Ausgabe ein und hake nur die Leute an, die sie hatten. Hatten alle unterschiedlich viel, wähle **Genaue Beträge** und gib den Anteil jeder Person ein. Bezahlt wird nur, was man auch hatte."
    - q: "Kann der Ehrengast die Gruppe später sehen?"
      a: "Ja, sobald die Überraschung vorbei ist. Lade die Person ein, dann kann ein Admin sie in den Einstellungen der Gruppe unter **Sicherheit & Berechtigungen** zum **Betrachter** machen. Ein Betrachter sieht alles und ändert nichts, warte also, bis nichts mehr geheim ist. Die Person braucht ein kostenloses Konto, um beizutreten."
