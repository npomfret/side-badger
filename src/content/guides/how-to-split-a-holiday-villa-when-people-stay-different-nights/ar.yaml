faq:
  heading: "أسئلة عن الفيلا"
  items:
    - q: "ماذا لو ألغى أحدهم؟"
      a: "أزل لياليه، وأعد الحسابات، وعدّل مصروف الفيلا ليساوي مجموع المبالغ الدقيقة السعر من جديد. تُحفظ النسخة السابقة ويظهر التعديل في نشاط المجموعة، فلا يغيّر أحد رقماً بصمت. ومن يحق له التعديل يتوقف على أذونات المجموعة."
    - q: "هل يدفع من تولّى الحجز أقل؟"
      a: "هذا للمجموعة أن تقرره. الحجز مهمة مرهقة، وتختلف المجموعات في ما إذا كان يستحق خصماً. وأياً كان ما تتفقون عليه، ضعوه في المبالغ الدقيقة واكتبوه في ملاحظة على المصروف، أو في تعليق بجانبه، حتى لا يضطر أحد إلى تذكّر الاتفاق."
    - q: "هل نقسّم رسوم التنظيف بطريقة مختلفة؟"
      a: "نعم. أدخل الرسوم مصروفاً منفصلاً وامنحها تقسيمها الخاص. يناسب التقسيم بالتساوي رسماً ثابتاً على البيت كله. وتناسب المبالغ الدقيقة مجموعة تريد أن تتبع الرسوم الليالي أيضاً."
