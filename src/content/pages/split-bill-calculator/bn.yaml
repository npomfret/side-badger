faq:
  heading: "প্রশ্ন"
  items:
    - q: "ক্যালকুলেটরটি কি বিনামূল্যে?"
      a: "হ্যাঁ। বিনামূল্যে। কোনো বিজ্ঞাপন নেই। দৈনিক কোনো সীমা নেই। অ্যাকাউন্টও লাগে না।"
    - q: "আমি যা লিখি তা কি সেভ হয়?"
      a: "না। কিছুই সেভ বা কোথাও পাঠানো হয় না। সংখ্যাগুলো রেখে দিতে “লিঙ্ক কপি করুন” চাপুন আর লিঙ্কটা কোথাও সেভ করে রাখুন।"
    - q: "আমি যে লিঙ্ক কপি করি তা কে দেখতে পারে?"
      a: "যার কাছে সেটা থাকবে সে-ই। সংখ্যাগুলো থাকে লিঙ্কের ভেতরেই, # চিহ্নের পরে, তাই লিঙ্কটা শুধু তাদেরই পাঠান যাদের সেগুলো দেখার কথা।"
    - q: "এটি কি টাকা নাড়াচাড়া করে?"
      a: "না। কে কাকে দেবে এটি তা বের করে দেয়, আর আপনারা যেভাবে খুশি একে অপরকে দেন। Side Badger-ও আপনার টাকা কখনও ছোঁয় না। দেখুন [হিসাব মেটানো](page:feature/settle-up)।"
    - q: "দুটি মুদ্রায় দেওয়া ট্রিপের খরচ কি ভাগ করা যায়?"
      a: "এখানে নয়, কারণ একটি হিসাবে একটিই মুদ্রা থাকে। গ্রুপে প্রতিটি মুদ্রার ব্যালেন্স আলাদা থাকে। দেখুন [একাধিক মুদ্রা](page:feature/multiple-currencies)।"
    - q: "পরিমাণগুলো না মিললে কী হবে?"
      a: "খরচের নিচেই ক্যালকুলেটর সেটা জানিয়ে দেয়, আর মিল না হওয়া পর্যন্ত কোনো ফলাফল দেখায় না। সঠিক পরিমাণগুলোর যোগফল মোটের সমান হতে হবে, আর শতাংশের যোগফল হতে হবে 100।"
