meta:
  title: "Side Badger কী করে আর কী করে না"
  description: "খরচ ভাগ, হিসাব মেটানো আর একাধিক মুদ্রা, সঙ্গে গ্রুপ, তালিকা আর পোল। পুরো সরঞ্জাম, আর Side Badger যা বাদ রেখেছে তার সৎ তালিকা।"
h1: "Side Badger কী করে"
navLabel: "ফিচার"
lead: "বাক্সে যা আছে, আর যা নেই।"
intro: "এই হলো পুরো সরঞ্জাম। স্প্রেডশিটটা আমরা ইচ্ছে করেই বাদ দিয়েছি। শুরু করুন সেই তিনটি কাজ দিয়ে যা Side Badger রোজ করে, তারপর বাকি তালিকা দেখুন, আর যা সে করে না তার ছোট তালিকাটিও।"
cta:
  heading: "আপনার গ্রুপের যা দরকার, এতে কি তা আছে?"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন আর আগে একটি ছোট গ্রুপে চেষ্টা করে দেখুন।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
cardsHeading: "তিনটি কাজ, বিস্তারিত"
sections:
  - heading: "রসিদ স্ক্যান"
    body: "রসিদের ছবি তুলুন, Side Badger মোট, তারিখ আর জায়গা ভরে দেবে, আপনি দেখে নেবেন। রসিদের ছবি Google-এর AI পরিষেবা পড়ে।"
  - heading: "গ্রুপ ও অনুমতি"
    body: "প্রতিটি বাড়ি, ট্রিপ বা অনুষ্ঠানের জন্য একটি গ্রুপ খুলুন, তাতে 50 জন পর্যন্ত থাকতে পারে। মানুষজনকে লিঙ্ক বা QR কোড দিয়ে ডাকুন। বড় গ্রুপে কাউকে ভিউয়ার করুন, যে সব দেখে কিন্তু কিছু বদলায় না।"
  - heading: "তালিকা ও পোল"
    body: "বাজারের বিলের পাশেই যৌথ বাজারের তালিকা রাখুন। ভিলার বাছাই তালিকা ভোটে দিন, চাইলে নাম না জানিয়ে।"
  - heading: "বাকি সব"
    items:
      - "**লাইভ আপডেট:** খরচ যোগ করলেই সবাই সঙ্গে সঙ্গে দেখতে পায়।"
      - "**ভাষা:** Side Badger ব্যবহার করুন 39টি ভাষায়। গ্রুপের প্রত্যেকে নিজের ভাষা বেছে নিতে পারে।"
      - "**হোম স্ক্রিন:** অ্যাপ স্টোরের দরকার নেই। Side Badger হোম স্ক্রিনে যোগ করুন, এটি অ্যাপের মতো খোলে।"
      - "**ফিডব্যাক:** বাগ পেয়েছেন? অ্যাপের ভেতর থেকেই জানান আর আমাদের উত্তর সেখানেই দেখুন।"
  - heading: "Side Badger যা করে না"
    items:
      - "**টাকা নাড়াচাড়া।** Side Badger আপনার টাকা কখনও ছোঁয় না। যেভাবে খুশি একে অপরকে দিন। পেমেন্ট অনুরোধের পরিকল্পনা আছে।"
      - "**বিল পুনরাবৃত্তি।** পুনরাবৃত্ত খরচ নেই। গত মাসের বিল দুই ট্যাপে কপি করুন।"
      - "**আইটেম ধরে ভাগ।** প্রতি খরচে একজনই পেমেন্টকারী। সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করুন।"
      - "**নেটিভ অ্যাপ।** এটি আপনার ব্রাউজারে চলে। হোম স্ক্রিনে যোগ করে নিন।"
      - "**অফলাইনে কাজ।** সংযোগ লাগে।"
      - "**ইমেইল বা টেক্সটে সতর্কবার্তা।** বিজ্ঞপ্তি অ্যাপের ভেতরে দেখা যায়। পুশ বিজ্ঞপ্তির পরিকল্পনা আছে।"
      - "**চার্ট বা বাজেট আঁকা।** কে কার কাছে ঋণী তার হিসাব রাখে, আর পুরো কৌশলটা ওইটুকুই।"
      - "**Google বা Apple দিয়ে সাইন ইন।** ইমেইল দিয়ে সাইন আপ করুন। Google আর Apple সাইন-ইনের পরিকল্পনা আছে।"
      - "**অ্যাকাউন্ট ছাড়া কাউকে ঢুকতে দেওয়া।** গ্রুপের প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট লাগে।"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "Side Badger দিয়ে কি পেমেন্ট করা যায়?"
      a: "না। Side Badger হিসাব রাখে আর আপনার টাকা কখনও ছোঁয় না। যেভাবে খুশি একে অপরকে দিন, তারপর পেমেন্টটা রেকর্ড করুন।"
    - q: "মোবাইল অ্যাপ আছে কি?"
      a: "অ্যাপ স্টোরে নেই। Side Badger আপনার ব্রাউজারে চলে, আর হোম স্ক্রিনে যোগ করলে এটি অ্যাপের মতো খোলে।"
    - q: "আইটেম ধরে ভাগ করা যায় কি?"
      a: "না। প্রতিটি খরচে একজন পেমেন্টকারী থাকে, আর সেটা সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করা হয়।"
    - q: "অফলাইনে কাজ করে কি?"
      a: "না, সংযোগ লাগে।"
    - q: "গ্রুপের প্রত্যেকের কি অ্যাকাউন্ট লাগবে?"
      a: "হ্যাঁ। গ্রুপের প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট লাগে, আর সাইন আপ করতে শুধু একটি ইমেইল ঠিকানাই যথেষ্ট।"
