example:
  heading: "アパートのある1か月"
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: tom
      name: Tom
    - id: aisha
      name: Aisha
  expenses:
    - label: "家賃"
      payer: priya
      amount: 1950
      split:
        method: percent
        shares:
          priya: 39
          tom: 32
          aisha: 29
    - label: "エネルギー代"
      payer: tom
      amount: 105
      split:
        method: equal
    - label: "ブロードバンド"
      payer: aisha
      amount: 36
      split:
        method: equal
faq:
  heading: "よくある質問"
  items:
    - q: "部屋は広いけれど日当たりが悪い人がいたら？"
      a: "床面積はあくまで出発点なので、グループで合意して調整できます。暗い部屋から1、2ポイント引いて、ほかの人に振り分け、合計がまだ100になるか確認してください。Side Badgerは合意した内容をそのまま保存し、良し悪しは判断しません。"
    - q: "光熱費やインターネット代も、部屋の広さで分けるべきですか？"
      a: "たいていは必要ありません。エネルギー代とブロードバンドは全員が使うので、上の例のように均等に分けるほうが簡単です。ルームメイトの1人が一日中家にいるなら、金額指定など別の分け方にグループで合意しても構いません。選択肢は[割り勘の仕方](page:feature/split-expenses)で説明しています。"
    - q: "あとから分け方を変えられますか？"
      a: "はい、新しい支出については変えられます。家賃をコピーするときに割合を変えれば、それ以前の月はそのままです。過去の支出を直したい場合は、グループの権限で許可されていれば編集できますが、残高が変わるので、先に家の人に伝えましょう。以前のバージョンは保存されます。"
