      other: Fitur Pro. Ketuk Convert dan Splitwise mengonversi pengeluaran grup ke mata uang bawaan Anda dengan kurs pada saat itu.
      sideBadger: Gratis. Konversikan tiap pengeluaran saat memasukkannya, dengan kurs terkini atau kurs yang benar-benar Anda dapatkan. Jumlah aslinya tetap ada di pengeluaran.
      source: currencies-help
    - feature: Mata uang dan bahasa
      other: 100+ mata uang dan 7+ bahasa, seperti tertulis di halaman berandanya.
      sideBadger: 133 mata uang dan 39 bahasa. Setiap orang di grup bisa memilih bahasanya sendiri.
      source: home
    - feature: Tempat memakainya
      other: Aplikasi untuk iPhone dan Android, serta web.
      sideBadger: "Di peramban Anda. Masuk, lalu tambahkan ke layar utama dan ia terbuka seperti aplikasi. Tidak ada di toko aplikasi."
      source: home
    - feature: Cara membagi
      other: Rata, menurut jumlah pasti, persentase, bagian, penyesuaian, atau per item.
      sideBadger: Rata, menurut jumlah pasti, atau persentase, dengan satu pembayar per pengeluaran. Tidak menurut bagian atau per item.
      source: split-help
    - feature: Penggunaan offline
      other: Mencantumkan mode offline di antara fitur intinya.
      sideBadger: Tidak. Memerlukan koneksi.
      source: home
    - feature: Pembayaran dan bank Anda
      other: "Di beberapa tempat Splitwise bisa mengirim uang dari dalam aplikasinya: Splitwise Pay di AS, Venmo untuk saldo dolar AS, PayPal, dan Pay by Bank di beberapa negara Eropa tertentu, yang menghubungkan rekening bank pribadi."
      sideBadger: "Tidak pernah menyentuh uang Anda dan tidak meminta detail bank Anda. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya."
      source: payments-help
    - feature: Grafik dan pembagian bawaan
      other: Keduanya fitur Pro.
      sideBadger: Tidak keduanya.
      source: pro
faq:
  heading: Pertanyaan
  items:
    - q: Apakah Side Badger alternatif gratis untuk Splitwise?
      a: "Untuk membagi tagihan dalam grup, ya, dan lebih dari sekadar hitungan: komentar, pertanyaan, daftar, jajak pendapat, dan peran grup, dengan pemindaian struk dan konversi mata uang gratis. Jika Anda memerlukan aplikasi toko aplikasi, penggunaan offline, atau pembayaran di dalam aplikasi, Splitwise punya dan Side Badger tidak."
    - q: Dari mana rincian Splitwise berasal?
      a: "Dari halaman Splitwise sendiri: halaman berandanya, halaman Pro-nya, dan pusat bantuannya. Setiap baris tabel menaut ke halaman asalnya, dan tanggal di atas tabel menyebut kapan kami membacanya. Kami memeriksanya setiap kuartal."
    - q: Apakah Side Badger akan tetap gratis?
      a: Semua yang ada di Side Badger gratis saat ini. Jika itu berubah, kami akan memberi tahu Anda lebih dulu. [Halaman harga](page:pricing) memuat rinciannya.
    - q: Apakah semua orang di grup saya harus pindah?
      a: Ya. Setiap orang di grup perlu akun Side Badger gratis, dan mereka bisa bergabung dengan tautan atau kode QR.
    - q: Apakah Side Badger punya aplikasi seluler?
      a: "Bukan di toko aplikasi. Ia berjalan di peramban Anda: masuk di ponsel, lalu tambahkan ke layar utama agar terbuka seperti aplikasi. [Cara kerja](page:how-it-works) menunjukkan caranya."
