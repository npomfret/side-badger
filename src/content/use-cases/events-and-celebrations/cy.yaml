faq:
  heading: "Cwestiynau"
  items:
    - q: "All gwesteion weld y grŵp heb ymuno?"
      a: "Na. Mae pobl yn ymuno gyda dolen neu god QR a chyfrif am ddim, felly gallant weld y grŵp unwaith y maent i mewn."
    - q: "All Side Badger gasglu'r arian?"
      a: "Na. Mae Side Badger yn cadw'r cyfrif ac nid yw byth yn symud arian. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad. Mae am ddim, heb hysbysebion a heb gyfyngiadau dyddiol; gweler [prisiau](page:pricing)."
    - q: "All pleidleisiau fod yn ddienw?"
      a: "Gallant. Wrth greu pôl gallwch guddio pwy bleidleisiodd dros beth. Dim ond cyn y bleidlais gyntaf y gall y gosodiadau newid."
    - q: "All pobl gyfrannu symiau gwahanol?"
      a: "Gallant. Rhannwch gost yn ôl symiau union, fel mai cyfran pob person yw'r ffigur y cytunwyd arno, neu gadewch allan y bobl nad oeddent yn rhan ohoni."
    - q: "All trefnydd gadw'r llyfrau?"
      a: "Gall. Defnyddiwch y rhagosodiad grŵp rheoledig, fel mai dim ond crewyr a gweinyddwyr sy'n newid costau a bod gweinyddwyr yn cymeradwyo aelodau newydd."
