meta:
  title: "Számoljatok el kevesebb kifizetéssel | Side Badger"
  description: "Nézd meg, ki kinek tartozik a csoportodban, kapj egy rövid kifizetéslistát, amely mindenkit elszámoltat, és rögzítsd az egyes kifizetéseket, ahogy megtörténnek. Ingyenes."
h1: "Számoljatok el kevesebb kifizetéssel"
navLabel: "Elszámolás"
lead: "A Side Badger folyamatos egyenleget vezet a csoport mindenkijének, és egy rövid kifizetéslistát javasol, amely rendezi. Fizettek egymásnak, ahogy akartok, aztán rögzítitek. Ha előbb azt szeretnéd látni, hogyan oszlanak meg az összegek, kezdd a [költségek felosztásával](page:feature/split-expenses)."
cta:
  heading: "Készen állsz kibogozni, ki kinek tartozik?"
  body: "Hozz létre fiókot, indíts csoportot, és add hozzá az első költséget. Az egyenlegek elintézik a többit."
problem:
  heading: "Egyenlegek, amelyek menet közben frissülnek"
  body: "Minden költség megváltoztatja, ki kinek tartozik, ezért a Side Badger naprakészen tartja az egyenlegeket, ahogy a költségek és kifizetések érkeznek. A csoport minden tagja azonnal látja a változást, és azt is, hogy mi változott, és ki változtatta. Az egyenlegeket pénznemenként vezetjük, így az euró és a font a saját oszlopában marad, hacsak egy költséget nem váltottak át bevitelkor. Alapértelmezés szerint a téged érintő tartozásokat látod; az **Összes megjelenítése** az egész csoportot kilistázza."
workflow:
  heading: "Három lépés a kvittségig"
  steps:
    - title: "Nézd meg, ki kinek tartozik"
      body: "Nyisd meg a csoport egyenlegeit, hogy lásd, mivel tartozol, mivel tartoznak neked, és egy rövid kifizetéslistát, amely mindenkit elszámoltat, pénznemenként kiszámolva. A kérdőre vont költségek kimaradnak az összegekből, amíg nem rendeződnek. Az alábbi lakótársas példában hat kifizetésből kettő lesz."
      shot: S10
      shotAlt: "Az egyenlegek képernyője egyszerűsített tartozásokkal két pénznemben, az Összes megjelenítése bekapcsolva"
    - title: "Fizess, ahogy akarsz, aztán rögzítsd"
      body: "Banki átutalás, készpénz, egy szívesség a múlt nyaralásról. A Side Badger nem mozgatja a pénzt. Amint gazdát cserélt, rögzítsd a kifizetést, és az egyenleg mindenkinél frissül."
      shot: S11
      shotAlt: "A kifizetési űrlap gyors rendezés gombokkal és a részleges kifizetésnél megjelenő értesítéssel"
    - title: "Ellenőrizd, hogy megérkezett"
      body: "A kifizetés bekerül a csoport előzményeibe, ahol a csoport bármely tagja láthatja, és emojival reagálhat rá. Ünnepeld meg a kifizetést, amikor megérkezik."
      shot: S12
      shotAlt: "A kifizetési előzmények emoji reakciókkal egy kifizetésen"
