meta:
  title: "Side Badger για συγκάτοικους, ταξίδια και πάρτι"
  description: "Μοιραστείτε έξοδα με συγκατοίκους, σε ομαδικά ταξίδια και για πάρτι, γάμους και κοινά δώρα. Δείτε τι κάνει το Side Badger για κάθε είδος ομάδας."
h1: "Side Badger για το δικό σας είδος ομάδας"
navLabel: "Περιπτώσεις χρήσης"
lead: "Συγκάτοικοι, διακοπές, bachelor party. Διαλέξτε το χάος σας και δείτε πώς μια ομάδα σαν τη δική σας κρατά τον λογαριασμό."
intro: "Κάθε ομάδα μοιράζει τα έξοδα λίγο διαφορετικά. Αυτές οι σελίδες ακολουθούν ένα **ρεαλιστικό σενάριο** από το πρώτο έξοδο ως την τελευταία καταγεγραμμένη πληρωμή, με τους υπολογισμούς σε προβολή, ώστε να δείτε σε τι θα κατέληγε η δική σας ομάδα."
cta:
  heading: "Βρήκατε το είδος της ομάδας σας;"
  body: "Δημιουργήστε λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το πρώτο έξοδο. Παίρνει λίγα λεπτά."
  button: "Δημιουργία δωρεάν λογαριασμού"
cardsHeading: "Διαλέξτε την κατάσταση που μοιάζει περισσότερο με τη δική σας"
sections:
  - heading: "Ομαδικά ταξίδια"
    body: "Πτήσεις σε λίρες, βίλα σε ευρώ και ένα δείπνο που έφαγαν μόνο τρία άτομα. Ορίστε την ομάδα να μετατρέπει σε λίρες και τέσσερις φίλοι στη Λισαβόνα καταλήγουν με τρεις πληρωμές αντί για έξι, όσες βγαίνουν όταν τα νομίσματα τηρούνται ξεχωριστά. [Μοιραστείτε τα έξοδα ενός ομαδικού ταξιδιού](page:use-case/group-trips)."
  - heading: "Συγκάτοικοι"
    body: "Ένα άτομο πληρώνει τον ιδιοκτήτη, ένα άλλο θυμάται τον λογαριασμό του ρεύματος και κανείς δεν συμφωνεί ποιος αγόρασε το χαρτί υγείας. Με το ενοίκιο χωρισμένο ανάλογα με το μέγεθος του δωματίου και τους άλλους λογαριασμούς εξίσου, τέσσερις συγκάτοικοι κλείνουν τον μήνα με τρεις πληρωμές, όλες προς όποιον πλήρωσε το ενοίκιο. [Μοιραστείτε τους λογαριασμούς του σπιτιού με συγκατοίκους](page:use-case/housemates)."
  - heading: "Πάρτι, γάμοι και κοινά δώρα"
    body: "Έξι άτομα ψηφίζουν το δώρο, ένα το αγοράζει και δεν συνεισφέρουν όλοι το ίδιο ποσό. Ένα δώρο των £150 χωρισμένο με ακριβή ποσά αφήνει πέντε πληρωμές προς το άτομο που το αγόρασε, £120 συνολικά. [Μοιραστείτε τα έξοδα μιας εκδήλωσης](page:use-case/events-and-celebrations)."
  - heading: "Ζευγάρια"
    body: "Μοιραστείτε τα βαρετά έξοδα χωρίς να κάνετε το ραντεβού τριμηνιαίο οικονομικό απολογισμό. Ενοίκιο χωρισμένο 60/40 και ψώνια εξίσου ανάγονται σε μία πληρωμή ανάμεσά σας."
  - heading: "Δείτε πρώτα πώς λειτουργεί"
    body: "Κάθε παράδειγμα παραπάνω χρησιμοποιεί τα ίδια βήματα, από τη δημιουργία της ομάδας ως την καταγραφή των πληρωμών. Το [πώς λειτουργεί](page:how-it-works) τα διατρέχει και οι [τιμές](page:pricing) λένε πόσο κοστίζει, δηλαδή τίποτα, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Χρειάζεται λογαριασμό ο καθένας στην ομάδα;"
      a: "Ναι. Τα άτομα μπαίνουν με σύνδεσμο ή κωδικό QR και δωρεάν λογαριασμό."
    - q: "Μπορεί το Side Badger να μαζέψει τα χρήματα;"
      a: "Όχι. Πληρώνετε όπως θέλετε και μετά καταγράφετε την πληρωμή ώστε τα υπόλοιπα να μένουν σωστά."
    - q: "Πρέπει να διαλέξω ένα είδος ομάδας;"
      a: "Όχι. Οι περιπτώσεις χρήσης είναι παραδείγματα, όχι ρυθμίσεις. Κάθε ομάδα έχει τις ίδιες λειτουργίες, οπότε χρησιμοποιήστε όποιον συνδυασμό ταιριάζει."
