meta:
  title: "Nola kitatu taldeko bidaia baten ondoren | Side Badger"
  description: "Kitatu denak sakabanatu aurretik. Hamar zor korapilatu lau ordainketa bihurtzen dira, erregistratuta, eta zati bat ordaintzea ere ondo dago. Bost lagunen kontuak."
h1: "Nola kitatu taldeko bidaia baten ondoren"
navLabel: "Kitatu bidaiaren ondoren"
lead: "Kitatu denak sakabanatu aurretik. Gehitu azken gastua, ireki taldearen saldoak eta ordaindu zor duzuna ordainketa-zerrenda laburretik, nahi duzun moduan. Gero erregistratu ordainketa bakoitza Side Badger-en, saldoa taldeko guztiarentzat garbitu dadin. Bost lagun eta bost gastu direnean, hamar zor korapilatu lau ordainketa bihurtzen dira."
cta:
  heading: "Itxi kontuak argazkiak iritsi aurretik"
  body: "Sortu doako kontu bat, hasi talde bat hurrengo bidaiarako eta gehitu kostu bakoitza gertatu ahala. Ordainketa-zerrenda laburra zain egongo da aireportura iristen zarenerako. Lehenago ikusi nahi duzu [kitatzeak nola funtzionatzen duen](page:feature/settle-up)?"
sections:
  - heading: "Bost lagun, bost gastu, irteera-areto bat"
    body: "Mo, Ines, Raf, Tess eta Uma aste bat pasatu zuten kostaldean. Mok apartamentua erreserbatu zuen eta erosketak egin zituen, Inesek itsasontzi-bidaia ordaindu zuen eta Rafek afari handia hartu zuen bere gain. Tessek aireportuko taxia hartu zuen Umarekin eta Morekin, Inesek eta Rafek trena zutelako. Umaren txartela etxean geratu zen, beraz ez zuen ezer ordaindu. Bost gastu dira eta 1.700 € guztira, eta irteera-aretoan inork ezin zuen esan nor zegoen aurretik."
  - heading: "Hamar zor, lau ordainketa"
    body: "Apartamentua, itsasontzia, afaria eta erosketak bost lagunen artean berdin banatzen dira. Hau da, 200 €, 50 €, 60 € eta 18 € bakoitzeko, beraz Inesek eta Rafek 328 € zor dituzte bakoitzak. Taxia hiruren artean partekatzen da, 20 € bakoitzeko, beraz Mok, Tessek eta Umak 348 € zor dituzte. Mok 1.090 € ordaindu zituen eta 348 € zor ditu, beraz 742 € zor zaizkio. Gainerako guztiek zor zutena baino gutxiago ordaindu zuten. Umari 348 € falta zaizkio, Tessi 288 €, Inesi 78 € eta Rafi 28 €, eta horiek guztiek Moren 742 € osatzen dituzte. Pertsona bikote bakoitza zuzenean kitatzen baduzu, hamar zor bereizi lortzen dituzu. Side Badger-ek lau ordainketa proposatzen ditu horren ordez, denak Moren alde."
  - heading: "Kitatu denak sakabanatu aurretik"
    body: "Une onena azken arratsaldea edo etxerako bidaia da, denak oraindik leku berean daudenean eta 28 €-ko zor bat aipatzeko erraza denean. Gehitu gastu guztiak lehenik, taxia barne. Inork ezin du taldea utzi dirua zor duen edo zor zaion bitartean, beraz kontua noizbait itxi beharko da hala ere."
    items:
      - "**Egiaztatu zerrenda.** Ireki taldea eta begiratu **Balantzeak**. Lehenespenez, zu ukitzen zaituzten zorrak ikusten dituzu. Aukeratu **Erakutsi guztiak** talde osoaren zerrenda ikusteko."
      - "**Ordaindu nahi duzun moduan.** Banku-transferentzia, eskudirua, azken oporraldiko zor bat. Side Badger-ek ez du dirua mugitzen."
      - "**Erregistratu.** Aukeratu **Kitatu**. **Likidazio azkarra** azpian botoi bakoitza zure proposatutako ordainketetako bat da, eta bat aukeratzeak zenbatekoa betetzen du. Gehitu **Oharra**, adibidez banku-transferentzia, egiaztatu **Data** (ezin da etorkizunekoa izan) eta aukeratu **Erregistratu likidazioa**."
      - "**Ikusi nola garbitzen den.** Saldoa denentzat eguneratzen da. Azken ordainketa sartzen denean, **Balantzeak** atalean **Dena kitatuta!** ageri da."
  - heading: "Orain zati bat ordaindu, gainerakoa gero"
    body: "Umak 200 € bidal ditzake gaur gauean eta gainerakoa hilaren amaieran. 200 € erregistratzen ditu, eta formularioak ohartarazten dio ondoren Moni 148 € zor dizkiola oraindik, hau da, 348 € ken 200 €. Gordetzen badu, 148 € bere saldoan geratzen dira gainerakoa erregistratu arte. Ohartarazpenak beste norabidean ere funtzionatzen du. Zero bat soberan sartzen bada eta 348 € 3.480 € bihurtzen badira, formularioak dio Moni 348 € bakarrik zor dizkiola eta gordetzeak kontrako norabidean zor bat sortuko lukeela. Konpondu zeroa gorde aurretik."
  - heading: "Akatsak konpontzen, eta ordainketak ospatzen"
    items:
      - "**Ordainketa oker bat.** Ordainketa erregistratu duenak bakarrik edita dezake. Berak edo taldeko administratzaile batek ezaba dezake, eta gero berriro erregistratu daiteke."
      - "**Nabarmentzeko ordainketa bat.** Erregistratutako ordainketa bakoitza **Likidazioak** atalean dago bere data eta oharrarekin, non taldeko guztiek ikus dezaketen eta erreakzionatu. Mok **Ospatu** aukeratu dezake Umaren azken 148 € iristen direnean."
      - "**Amaiera.** Saldo guztiak zeroan daudenean, administratzaile batek taldea blokeatu dezake zenbakiak lekuan geratzeko."
  - heading: "Side Badger-ek hemen egiten ez duena"
    items:
      - "Ez du inoiz dirurik mugitzen. Ez du ordainketa-estekarik edo ordainketa-eskaerarik, beraz aplikazioko ordainketa bat beste nonbait egindako baten erregistroa da."
      - "Ez du gogorarazpenik bidaltzen. Berandu dagoen ordainketa bati jarraitzea zure esku geratzen da."
      - "Ez du epemugarik ezartzen. Umaren 148 €-etik geratzen dena noiz ordaindu behar den taldeak adosteko da."
      - "Proposatutako ordainketak zerrenda labur bat dira, ez ahalik eta laburrenaren promesa. Moneta bakoitzeko kalkulatzen dira, beraz euroetan eta libera esterlinetan ordaindutako bidaia batek bakoitzarentzat zerrenda bana du."
