featuresHeading: De funktioner, et par bruger
faq:
  heading: Spørgsmål
  items:
    - q: Kan vi sætte 60/40 én gang for alt?
      a: Nej. Delingen hører til hver udgift. Sæt procenterne på den første, og kopiér den så næste gang, og ret det, der er anderledes. [Del udgifter](page:feature/split-expenses) gennemgår alle tre måder at dele på.
    - q: Er den koblet til vores bank?
      a: Nej. Side Badger rører aldrig jeres penge. I betaler hinanden, som I vil, og registrerer det så, som [gør op](page:feature/settle-up) forklarer.
    - q: Kan andre se vores gruppe?
      a: Kun dens medlemmer, og et pars gruppe har to. Alle med et gyldigt invitationslink kan deltage, så del det med én person, og giv det en kort udløbstid.
    - q: Hvad hvis vi hver betalte en del af den samme regning?
      a: En udgift har én betaler. Registrer to udgifter, én for hver af jer, så bliver saldoen den samme.
    - q: Minder den min partner om at betale?
      a: Nej. Der er ingen påmindelser, så det er stadig dig, der skal puffe. I kigger i det mindste begge på det samme tal.
    - q: Hvad sker der, når vi holder op med at dele udgifter?
      a: Gør saldoen op, og registrer betalingen, så ingen skylder noget. Så kan en administrator låse gruppen, hvilket beholder tallene, som de er, eller lukke den for altid, hvilket gør den utilgængelig for alle. Luk den kun, når ingen af jer har brug for historikken.
