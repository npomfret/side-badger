featuresHeading: "Amire egy utazás támaszkodik"
faq:
  heading: "Kérdések"
  items:
    - q: "Ki lehet hagyni azokat, akik kihagyták a vacsorát?"
      a: "Igen. Válaszd ki, ki vett részt az egyes költségekben, és csak őket terheli."
    - q: "Működik térerő nélkül?"
      a: "Nem. A Side Badgernek kapcsolat kell, így add hozzá a költségeket, ha visszatértél a wifire."
    - q: "Kell mindenkinek telepítenie valamit?"
      a: "Nem. A böngészőben fut. Küldd el a meghívó linket, és az emberek a telefonjukról csatlakoznak."
    - q: "Melyik árfolyamot használja?"
      a: "Egy aktuális árfolyamot a költség megadásakor, vagy a sajátodat, ha mást kaptál. Az árfolyam a költség mentésekor rögzül, így a régi költségeket sosem értékeljük újra."
    - q: "Befagyaszthatjuk a csoportot az utazás után?"
      a: "Igen. Egy adminisztrátor zárolhatja a csoportot, hogy a számok a helyükön maradjanak."
    - q: "Van korlátja az összegeknek?"
      a: "Igen. 999 999,99 költségenként, a saját pénznemében."
