meta:
  title: "Hvernig á að skipta leigu eftir stærð herbergja | Side Badger"
  description: "Stærra herbergi, stærri hlutur. Taktu sameiginlegu rýmin frá, skiptu afganginum eftir gólffleti og settu prósenturnar inn einu sinni. Útreikningar fyrir þrjá."
h1: "Hvernig á að skipta leigu eftir stærð herbergja"
navLabel: "Leiga eftir stærð herbergja"
lead: "Ákveddu hve stór hluti leigunnar fer í sameiginlegu rýmin og skiptu þeim hluta jafnt. Skiptu svo afganginum eftir gólffleti hvers svefnherbergis. Námundaðu í heilar prósentur, settu þær inn á leiguna í Side Badger einu sinni og afritaðu útgjaldið í hverjum mánuði."
cta:
  heading: "Settu leiguna inn einu sinni"
  body: "Stofnaðu ókeypis aðgang, búðu til hóp fyrir íbúðina og skráðu leiguna með prósentunum sem þið komuð ykkur saman um. Næsti mánuður er afrit. Viltu fá kynninguna fyrst? Sjáðu [hvernig þetta virkar](page:how-it-works) eða skoðaðu [hvað ókeypis nær yfir](page:pricing)."
sections:
  - heading: "Þrjár manneskjur, ein íbúð, eitt rifrildi"
    body: "Priya, Tom og Aisha deila íbúð sem kostar 1.950 £ á mánuði. Í heilt ár skiptu þau leigunni í þrennt, því það var einfalt. Svo mældi Aisha herbergið sitt. Priya er með 16 m² herbergi, Tom með 12 m² og Aisha með 10 m², þannig að Aisha borgaði það sama og Priya fyrir herbergi sem var meira en þriðjungi minna. Enginn hafði verið ósanngjarn. Enginn hafði reiknað dæmið. Yfir skyndibita komu þau sér fyrst saman um eina reglu. Af leigunni fara 40% í eldhúsið, baðherbergið og stofuna, sem öll þrjú nota."
  - heading: "Aðferðin, með öllum útreikningum"
    body: "Fjögur skref, eitt málband og reiknivél í símanum."
    items:
      - "**Taktu sameiginlega hlutann frá.** Hópurinn ákveður hve stór hluti leigunnar fer í rýmin sem allir nota. Fyrir þessa íbúð eru það 40%, sem er 13,33% á hvert þeirra þriggja."
      - "**Skiptu afganginum eftir gólffleti.** Hin 60% skiptast eftir stærð svefnherbergja. Svefnherbergin eru samtals 38 m² (16 + 12 + 10), svo hjá Priya verður þetta 60% × 16/38, sem er 25,26%."
      - "**Leggðu hlutana tvo saman.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, að viðbættum 13,33% eru það 32,3%. Aisha: 60% × 10/38 = 15,79%, að viðbættum 13,33% eru það 29,1%."
      - "**Námundaðu og athugaðu.** Heilar prósentur er auðveldara að slá inn og rífast um, svo 38,6% verða 39%, 32,3% verða 32% og 29,1% verða 29%. Athugaðu að 39 + 32 + 29 sé 100. Ef námundunin endar í 99 eða 101 ákveður hópurinn hvers tala færist um eitt prósentustig."
  - heading: "Mánuðurinn í íbúðinni"
    body: "Leiga með 39%, 32% og 29% verður 760,50 £, 624,00 £ og 565,50 £. Priya greiddi leigusalanum, svo yfir mánuðinn á hún inni 1.142,50 £, á meðan Tom skuldar 566,00 £ og Aisha skuldar 576,50 £. Side Badger leggur til tvær greiðslur, báðar til Priya."
  - heading: "Settu þetta upp í Side Badger"
    body: "Eitt kvöld, að mestu í að ræða þessi 40%."
    items:
      - "**Búðu til hópinn.** Veldu **Búa til hóp** á stjórnborðinu og nefndu hann eftir íbúðinni. Veldu **Bjóða öðrum** og sendu tengilinn eða QR-kóðann. Allir skrá sig inn eða stofna ókeypis aðgang og velja nafnið sem þeir vilja að birtist í þessum hópi."
      - "**Bættu leigunni við.** Veldu **Skrá útgjöld**. Sláðu inn lýsingu og upphæð og veldu þann sem greiddi leigusalanum undir **Hver greiddi?** Hafðu alla þrjá áfram undir **Skipta á milli**, veldu svo **Prósenta** undir **Hvernig á að skipta** og sláðu inn 39, 32 og 29. Eyðublaðið lætur vita ef prósenturnar ná ekki samtals 100. Veldu **Vista útgjöld**."
      - "**Bættu reikningunum við.** Rafmagn og internet eru sitt hvort útgjaldið, hvort með sínum greiðanda. Láttu **Hvernig á að skipta** vera á **Jafnt**."
      - "**Afritaðu leiguna í næsta mánuði.** Opnaðu leigu síðasta mánaðar og veldu **Afrita útgjöld**. Afritið heldur greiðandanum, upphæðinni og skiptingunni og fær dagsetningu dagsins í dag. Breyttu upphæðinni ef leigan breyttist og veldu svo **Búa til afrit**."
      - "**Athugaðu hver skuldar hverjum.** Hlutinn **Staða** sýnir það. Borgið hvert öðru eins og ykkur hentar og skráið greiðsluna svo undir **Gera upp**."
  - heading: "Herbergi með sérbaði, kompur og fólk á förum"
    items:
      - "**Herbergi með sérbaði og kompur.** Gólfflötur er upphafspunktur. Herbergi með eigin baðherbergi er meira virði en jafnstórt herbergi án þess, og kompa sem rúmar rúm og vongóðan stól er minna virði. Hnikaðu prósentunum til eftir samkomulagi, athugaðu að þær nái enn samtals 100 og skrifaðu lokatölurnar niður þar sem öll íbúðin sér þær."
      - "**Einhver flytur út um miðjan mánuð.** Reiknaðu út hvað hver og einn skuldar fyrir þann mánuð og skráðu leigu þess mánaðar með **Nákvæmar upphæðir** í stað **Prósenta**. Upphæðirnar verða að ná leigunni. Gerðu það áður en viðkomandi fer. Enginn getur yfirgefið hóp á meðan hann skuldar eða á inni pening, og útgjald sem snertir manneskju sem hefur yfirgefið hópinn verður aðeins til lestrar."
      - "**Einhver flytur inn.** Mældu aftur, reiknaðu upp á nýtt með nýju herbergisstærðunum og notaðu nýju prósenturnar frá næstu leigu. Fyrri mánuðir haldast eins og þeir voru."
  - heading: "Það sem Side Badger gerir ekki hér"
    items:
      - "Það mælir ekki herbergin þín og velur ekki prósenturnar. Gólfflatarmálið og 40% eru atriði sem hópurinn þarf að koma sér saman um."
      - "Það eru engir endurteknir reikningar, svo þú afritar leigu síðasta mánaðar í hvert skipti."
      - "Það flytur aldrei peninga og borgar ekki leigusalanum. Þið borgið hvert öðru eins og ykkur hentar og skráið það."
      - "Það veit ekki hvað leigusamningurinn segir. Það heldur utan um stöðuna milli fólksins í hópnum."
