sections:
  - heading: "Seulement ceux qui étaient là"
    body: "Partagez un coût entre tout le monde, ou seulement entre ceux qui y ont participé. Laissez de côté les personnes qui n'étaient pas concernées par un coût, et les soldes en tiennent compte. Le colocataire absent toute la semaine ne doit rien pour le plat à emporter, ce que les [colocataires](page:use-case/housemates) reconnaîtront comme de la justice élémentaire."
  - heading: "Les détails qui évitent les disputes plus tard"
    items:
      - "Indiquez la **date** et une heure facultative. Des raccourcis comme aujourd'hui, hier, ce matin et hier soir évitent de saisir."
      - "Ajoutez jusqu'à trois **étiquettes** pour regrouper les dépenses, comme courses ou voyage."
      - "Ajoutez le **lieu**. Collez un lien de carte et le nom du lieu se remplit tout seul."
      - "Ajoutez une **note** pour l'histoire derrière le chiffre, avec un peu de mise en forme si l'histoire l'exige."
      - "Utilisez les **commentaires** pour garder la conversation à côté de la dépense concernée, plutôt que dans un fil de discussion que personne ne remonte."
  - heading: "Copier, modifier, et voir ce qui a changé"
    body: "Copiez le loyer du mois dernier au lieu de le ressaisir, puis changez ce qui diffère. Si un chiffre était faux, modifiez la dépense. La version précédente est conservée et la modification apparaît dans l'activité du groupe, donc personne ne change un chiffre en douce. Ce que chacun a le droit de modifier dépend des permissions du groupe."
  - heading: "Quand quelque chose semble faux"
    body: "Un groupe peut activer les questions sur les dépenses. Toute personne concernée par une dépense peut soulever une question et dire pourquoi, et la dépense reste hors des soldes jusqu'à ce que la personne qui l'a posée, ou un admin, la clôture. C'est désactivé par défaut et un admin l'active pour le groupe. Cela convient aux [événements et fêtes](page:use-case/events-and-celebrations), où l'acompte dont personne ne se souvient devient soudain l'affaire de tous."
limits:
  heading: Limites
  items:
    - "Une seule personne paie chaque dépense. Si deux personnes ont payé, enregistrez deux dépenses."
    - "Il n'y a pas de partage par article ni par parts. À parts égales, par montants exacts et par pourcentages, c'est tout ce qu'il y a."
    - "Les pourcentages doivent faire 100 au total."
    - "Une dépense peut aller jusqu'à 999,999.99 dans sa propre devise, avec les décimales habituelles de cette devise."
    - "Les dépenses ne peuvent pas se répéter toutes seules. Copiez plutôt celle du mois dernier."
    - "Les dates ne peuvent pas être dans le futur ni remonter à plus de 10 ans."
    - "Une dépense qui concerne quelqu'un qui a quitté le groupe passe en lecture seule."
useCasesHeading: "Où ce type de partage aide"
faq:
  heading: Questions
  items:
    - q: "Deux personnes peuvent-elles payer une même dépense ?"
      a: "Pas dans une seule dépense. Enregistrez-en deux, une par payeur, et les soldes tombent pareil."
    - q: "Puis-je partager un reçu par article ?"
      a: "Non. Un partage se fait à parts égales, par montants exacts ou par pourcentage. Pour une facture avec des articles différents, saisissez ce que chacun doit en montants exacts."
    - q: "Puis-je définir un partage par défaut ?"
      a: "Non. Copiez une dépense précédente pour réutiliser son partage, et changez ce qui diffère."
    - q: "Les factures peuvent-elles se répéter chaque mois ?"
      a: "Non. Copiez plutôt la dépense du mois dernier, ce qui prend quelques secondes."
    - q: "Qui peut modifier une dépense ?"
      a: "Ceux que les permissions du groupe autorisent. Chaque modification apparaît dans l'activité du groupe, donc rien ne change en silence."
    - q: "Que deviennent les soldes ensuite ?"
      a: "Ils se mettent à jour à mesure que les dépenses arrivent, et [régler les comptes](page:feature/settle-up) les transforme en une courte liste de paiements. Si une dépense est dans une autre devise, voir [plusieurs devises](page:feature/multiple-currencies)."
