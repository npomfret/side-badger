meta:
  title: "Скануйте чек, щоб додати витрату | Side Badger"
  description: "Нехай борсук прочитає чек. Він заповнить суму, дату й місце, а ви перевірите, без кредитів на скани. Зображення читає ШІ-сервіс Google."
h1: "Скануйте чек, перевіряйте дані, діліть"
navLabel: "Сканування чеків"
lead: "Нехай борсук прочитає чек, а ви перевірите його домашнє завдання. Додайте фото до нової витрати, і Side Badger заповнить суму, дату й місце, щоб ви їх перевірили. Потім ви [ділите її](page:feature/split-expenses) як будь-яку іншу витрату. Сканування безкоштовне, без кредитів на скани. Воно заповнює одну витрату й не ділить рахунок за позиціями. Зображення чеків читає ШІ-сервіс Google."
cta:
  heading: "Сфотографуйте. Перевірте. Поділіть."
  body: "Створіть безкоштовний обліковий запис, заведіть групу й додайте витрату з фото чека. Подивіться, що воно заповнить, виправте все хибне й збережіть, коли будете задоволені."
problem:
  heading: "Ніхто не хоче вбивати чек вручну в черзі на таксі"
  body: "Подорожі й бурхливі вечори приходять із папером. Вечеря, таксі, раунд, що перетворився на шість. Вбивати кожен у телефон холодними пальцями, коли за спиною черга, — так витрати й забуваються. Тому Side Badger прочитає чек за вас. Він робить чернетку, а ви перевіряєте. Це пасує [груповим подорожам](page:use-case/group-trips) і [подіям та святам](page:use-case/events-and-celebrations), де чеки накопичуються швидше, ніж будь-кому хочеться з ними розбиратися."
workflow:
  heading: "Від фото до витрати за три кроки"
  steps:
    - title: "Додайте чек до нової витрати"
      body: "Почніть нову витрату й торкніться **Сканувати чек** або скористайтеся швидкою дією **Сканувати чек** на панелі. Зробіть фото або виберіть наявне. Працює й **Додати чек або вкладення** у формі."
    - title: "Дайте йому прочитати чек"
      body: "Поки ШІ Side Badger читає зображення, форма показує **Аналіз чека...**. Потім вона заповнює те, що знайшла, як-от опис, суму, валюту, дату, час і місце. Те, що ви вже ввели, лишається недоторканим."
      shot: S09
      shotAlt: "Форма нової витрати з написом «Аналіз чека...», а потім та сама форма із заповненими даними"
    - title: "Перевірте, а потім поділіть"
      body: "Порівняйте форму з папером. Виправте все хибне, вкажіть, хто платив і хто ділив вартість, оберіть спосіб розподілу й збережіть. Доки ви не збережете, витрати не існує. Про розподіл розповідає [розподіл витрат](page:feature/split-expenses)."
options:
  heading: "Варіанти"
  items: []
sections:
  - heading: "Що воно заповнює"
    body: "Додайте зображення чека до нової витрати, і ці поля можуть заповнитися. Хто платив, хто ділив вартість і як розподілити, лишається за вами."
    items:
      - "**Опис** витрати."
      - "**Загальна сума**."
      - "**Валюта**, якщо ваша група це дозволяє."
      - "**Дата** і **час**."
      - "**Місце**."
      - "Текстова копія чека в **примітках**, на випадок, коли паперовий вицвіте або піде в прання."
  - heading: "Що ви все одно перевіряєте"
    body: "Усе. Вважайте те, що воно заповнило, чернеткою. Звірте суму з папером, потім валюту, дату й місце. Розмиті фото й пожмаканий папір можуть обдурити будь-якого читача, і ми не обіцяємо, що він правильно прочитає кожен чек, тож, будь ласка, дивіться, перш ніж зберігати. Якщо щось не так, перепишіть. Якщо чек у єнах, а група розраховується у фунтах, що буде далі, пояснюють [кілька валют](page:feature/multiple-currencies)."
  - heading: "Тримайте чек разом із витратою"
    body: "Зісканований чи ні, чек може лишатися біля витрати. Додавайте фото або PDF, до трьох на витрату й до 10 МБ кожне. Учасники групи бачать їх біля витрати. Зображення показуються мініатюрами, що відкриваються у засобі перегляду, а PDF відкриваються як посилання. Фото, яке ви скануєте, теж додається, якщо не видалити його перед збереженням. Коли хтось питає, скільки насправді коштувала та вечеря, доказ просто тут."
  - heading: "Куди йде ваш чек"
    body: "Зображення чеків читає ШІ-сервіс Google. Щоб заповнити форму, зображення читає Google Vertex AI (Gemini) у мультирегіоні Google в США. Додайте зображення до нової витрати, і його буде прочитано. PDF або фото, додане до вже наявної витрати, зберігається без читання. Додані чеки бачать учасники групи, тож якщо на чеку є щось, чим ви не хотіли б ділитися, пропустіть фото й введіть цю витрату вручну."
limits:
  heading: "Обмеження"
  items:
    - "Лише зображення. JPEG, PNG і WebP, а також HEIC після перетворення. PDF можна додати до витрати, але їх не читають."
    - "Сканування лише для нових витрат. До наявної витрати можна додавати чеки, але нічого не читається."
    - "Воно заповнює лише поля, яких ви не торкалися, а валюту лише якщо група це дозволяє."
    - "Воно не ділить за позиціями й не призначає позиції людям. Воно заповнює одну витрату, а ви ділите її як зазвичай."
    - "Немає обіцянки, що заповнене правильне чи що сканування спрацює щоразу. Перевіряйте перед збереженням і додайте витрату вручну, якщо сканування не вдалося чи недоступне."
    - "До витрати можна додати до трьох вкладень, кожне до 10 МБ, у форматі JPEG, PNG, WebP, HEIC або PDF."
    - "Зображення чеків читає Google Vertex AI (Gemini) у мультирегіоні Google в США, а додані чеки бачать учасники групи."
useCasesHeading: "Де накопичуються чеки"
faq:
  heading: "Запитання"
  items:
    - q: "Чи може воно ділити чек за позиціями?"
      a: "Ні. Воно заповнює витрату, зокрема суму, а ви ділите її порівну, за точними сумами або у відсотках. Якщо кожен замовляв різне, введіть, скільки винен кожен, як точні суми. Подробиці в [розподілі витрат](page:feature/split-expenses)."
    - q: "Чи може воно прочитати PDF?"
      a: "Ні. Ви можете додати PDF до витрати, щоб він ішов разом із цифрами, але читаються лише зображення."
    - q: "Чи є ліміт на скани?"
      a: "Кредитів на скани, що можуть закінчитися, немає, і сканування безкоштовне. Обмеження мають файли: до трьох вкладень на витрату й по 10 МБ кожне. Решту читайте в [що входить у безкоштовне](page:pricing)."
    - q: "Хто може бачити мій чек?"
      a: "Учасники групи бачать чеки, додані до витрати. Зображення чеків також читає ШІ-сервіс Google, так форма й заповнюється."
    - q: "Чи можна відсканувати чек для витрати, яку я вже додав?"
      a: "Ні, сканування для нових витрат. Ви все одно можете додати чек до наявної витрати, і він зберігається без читання."
    - q: "Що, якщо воно заповнить щось хибно?"
      a: "Перепишіть. Кожне поле можна редагувати, доки ви не збережете, і перевіряти варто все одно. Якщо сканування не вдалося чи недоступне, додайте витрату вручну, як зазвичай."
