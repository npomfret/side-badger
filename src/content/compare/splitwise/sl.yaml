      source: pro-help
    - feature: Vloge in dovoljenja v skupini
      other: Njegov center za pomoč pravi, da ne podpira administratorjev skupin ali posebnih dovoljenj.
      sideBadger: Administratorji, člani in gledalci. Dve prednastavitvi ali lastna dovoljenja, odobritev za vstop in zaklep, ko je konec.
      source: permissions-help
    - feature: Skeniranje računov
      other: Funkcija Pro. Skenira fotografijo računa, razčlenitev po postavkah v Pro pa omogoča dodelitev postavk ljudem.
      sideBadger: Brezplačno, brez kreditov za skeniranje. Izpolni skupni znesek, datum in kraj, da jih preveriš, postavk pa ne dodeljuje ljudem.
