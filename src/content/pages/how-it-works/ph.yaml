sections:
  - heading: 39 wika, at ginawa para sa mas maraming tao
    body: Gamitin ang Side Badger sa 39 wika, kasama ang right-to-left na Arabic, Persian, at Urdu. Makakapili ang bawat isa sa grupo ng sarili niyang wika, kaya puwedeng Arabic ang group page para sa isa at English para sa susunod. Ginawa rin ito para sa mga gumagamit ng keyboard at screen reader, at may kasamang pattern ang mga kulay ng miyembro, kaya hindi mo na kailangang ibukod ang berde sa pula.
faq:
  heading: Mga tanong
  items:
    - q: Kailangan ba ng account ng lahat?
      a: Oo, libre ito. Bini-verify ng bawat tao ang email niya bago magdagdag ng anuman.
    - q: May app ba?
      a: Gumagana ito sa browser, at maidaragdag mo ito sa home screen o dock para bumukas na parang app. Walang bersyon sa app store at walang offline mode.
    - q: Naglilipat ba ng pera ang Side Badger?
      a: Hindi. Nagbibilang lang ito at nagmumungkahi ng mga bayad, at kayo ang bahalang magbayaran sa paraang gusto ninyo. Saka ninyo itatala ang bayad. Tingnan ang [settle up](page:feature/settle-up).
    - q: Puwede bang umalis ang may utang?
      a: Hindi. Walang makakaalis sa grupo habang may utang pa o may sisingilin pa, kaya mag-settle muna sila.
    - q: Ilang tao ang puwedeng sumali sa isang grupo?
      a: Hanggang 50 tao sa isang grupo. Imbitahan sila gamit ang link o QR code, at i-on ang approval kung gusto mong papasukin ng admin ang bawat tao.
    - q: Paano ang mga biyaheng may higit sa isang pera?
      a: Magkakahiwalay na iniingatan ang mga balanse sa bawat pera. Tingnan ang [maraming pera](page:feature/multiple-currencies).
