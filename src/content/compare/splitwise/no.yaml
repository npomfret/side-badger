meta:
  title: "Side Badger mot Splitwise: gratisdelene sammenlignet | Side Badger"
  description: "Gratis Splitwise-alternativ, rettferdig sammenlignet. Kvitteringsskanning, valutakonvertering og ingen annonser er gratis, og vi viser hva Splitwise gjør bedre."
h1: "Side Badger mot Splitwise: gratisdelene sammenlignet"
navLabel: Side Badger mot Splitwise
lead: "Noen i gruppen din har sikkert sagt «bare bruk Splitwise». Greit nok. Side Badger er en gratis nettapp med kvitteringsskanning, valutakonvertering og ingen annonser, og uten abonnement for å låse dem opp. Hvilken som passer gruppen din, avhenger av hva den trenger, så her er sammenligningen, med Splitwises side hentet bare fra Splitwises egne sider."
cta:
  heading: Prøv det på neste felles regning
  body: "Opprett en gratis konto, lag en gruppe og legg til én ekte utgift. Hvis det ikke er noe for deg, har du brukt noen minutter, ikke et abonnement."
asOf: 2026-10-21
asOfNote: "Vi leste Splitwises egne sider {date} så du slipper det, og alt her om Splitwise kommer fra dem. Hver rad i tabellen lenker til kilden sin. Planer endres, så vi sjekker på nytt hvert kvartal, og hvis Splitwises sider er uenige med denne, tro dem."
