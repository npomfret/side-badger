meta:
  title: "Side Badger vs Splitwise: todo el grupo, no solo las cuentas | Side Badger"
  description: "Alternativa gratis a Splitwise para todo el grupo: comentarios, preguntas, listas, encuestas y roles de verdad, además de escaneo de recibos y conversión de monedas gratis."
h1: "Side Badger vs Splitwise: todo el grupo, no solo las cuentas"
navLabel: Side Badger vs Splitwise
lead: "Es probable que alguien de tu grupo haya dicho alguna vez «usa Splitwise y ya». Es razonable: con las cuentas se defiende bien. Side Badger también hace las cuentas, y luego le da al grupo un sitio donde hablarlas: comentarios, preguntas, listas, encuestas y roles de grupo de verdad. El escaneo de recibos y la conversión de monedas vienen gratis."
cta:
  heading: Pruébalo en tu próximo gasto compartido
  body: Crea una cuenta gratis, haz un grupo y añade un gasto de verdad. Si no es para ti, habrás gastado unos minutos, no una suscripción.
asOf: 2026-11-22
asOfNote: Leímos las páginas de Splitwise el {date} para que no tengas que hacerlo tú, y todo lo que aquí se dice de Splitwise sale de ellas. Cada fila de la tabla enlaza con su fuente. Los planes cambian, así que volvemos a comprobarlo cada trimestre, y si las páginas de Splitwise no coinciden con esta, fíate de ellas.
