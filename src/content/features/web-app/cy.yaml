meta:
  title: "Ap rhannu biliau heb ei lawrlwytho | Side Badger"
  description: "Ffôn yn llawn? Rydym yn deall. Mae Side Badger yn rhedeg yn y porwr: dim siop apiau, dim lawrlwytho. Ychwanegwch ef at y sgrin gartref ac mae'n agor fel ap."
h1: "Dim siop apiau. Dim lawrlwytho. Yn teimlo fel ap o hyd"
navLabel: "Ap gwe"
lead: "Mae Side Badger yn byw yn eich porwr. Does dim siop apiau i chwilio ynddi a dim byd i'w lawrlwytho yn gyntaf. Mewngofnodwch ar ffôn neu gyfrifiadur, rhannwch gostau ar-lein gyda'ch grŵp, ac ychwanegwch ef at eich sgrin gartref neu'ch doc pan fyddwch am ei gael un tap i ffwrdd."
cta:
  heading: "Ei agor. Mewngofnodi. Cychwyn grŵp."
  body: "Creu cyfrif, cychwyn grŵp ac ychwanegu'r gost gyntaf, y cyfan o'r porwr sydd gennych ar agor eisoes. Eisiau'r daith yn gyntaf? Gweler [sut mae'n gweithio](page:how-it-works), neu edrychwch ar [beth mae am ddim yn ei gynnwys](page:pricing)."
problem:
  heading: "Mae eich ffôn yn llawn. Rydym yn deall."
  body: "Yn rhywle arno mae pedair mil o luniau o'r un machlud a rhybudd storio rydych wedi bod yn ei sweipio o'r neilltu ers y gwanwyn. Y peth olaf sydd ei angen arno yw ap arall, dim ond i rannu un swper. Felly mae Side Badger yn ap gwe. Mae'n rhedeg mewn porwr modern ar ffôn neu gyfrifiadur. Ar ffôn mae'n defnyddio cynlluniau symudol, gyda thudalen y grŵp wedi'i rhannu'n dabiau a rheolyddion sy'n gyfeillgar i gyffwrdd. Mae rhai ychwanegion, fel ei ychwanegu at eich sgrin gartref, yn dibynnu ar eich porwr, ac rydym yn dweud ble."
workflow:
  heading: "O dab porwr i sgrin gartref mewn tri cham"
  steps:
    - title: "Ei agor a mewngofnodi"
      body: "Ewch i Side Badger yn eich porwr a mewngofnodwch. Y cyfan sydd ei angen yw cyfeiriad e-bost a chyfrinair, ac rydych yn dilysu'r e-bost cyn y gallwch ychwanegu unrhyw beth. Mae angen cyfrif ar bawb yn y grŵp, felly bydd y bobl rydych yn eu gwahodd yn gwneud yr un peth."
    - title: "Ei ychwanegu at eich sgrin gartref neu'ch doc"
      body: "Unwaith y byddwch wedi mewngofnodi, mae'r ap yn cynnig gosod ei hun. Cewch fotwm **Gosod** lle mae eich porwr yn caniatáu hynny, a **Dangos sut** lle nad yw'n gwneud hynny. Wedi colli'r cynnig, neu wedi dweud na? Mae gan **Gosodiadau** yr un cymorth o dan **Ychwanegu at y Sgrin Gartref neu'r Doc**. Ar iPhone neu iPad, mae Gosodiadau yn dangos camau'r iPhone yn gyntaf ac yn cuddio'r dyfeisiau eraill o dan **Dyfeisiau eraill**. Y naill ffordd neu'r llall, mae'r ap wedyn yn agor mewn ffenest ei hun."
      shot: S20
      shotAlt: "Adran Ychwanegu at y Sgrin Gartref neu'r Doc yn Gosodiadau, gyda'r camau ar gyfer ychwanegu'r ap at ddyfais"
    - title: "Troi hysbysiadau ymlaen, os hoffech eu cael"
      body: "Mae hysbysiadau wedi'u diffodd nes i chi eu troi ymlaen, a chaiff pob dyfais ei throi ymlaen ar wahân. Defnyddiwch y botwm **Troi ymlaen** y mae cloch yr hysbysiadau yn ei gynnig, neu'r switsh **Hysbysiadau gwthio** yn **Gosodiadau**. Ar iPhone neu iPad, agorwch yr ap o'r Sgrin Gartref yn gyntaf. Dyna'r unig le y mae hysbysiadau'n gweithio yno."
      shot: S19
      shotAlt: "Cwymplen yr hysbysiadau ar agor, yn rhestru gweithgaredd diweddar yn y grŵp"
options:
  heading: "Sut i'w ychwanegu, dyfais wrth ddyfais"
  items:
    - title: "iPhone ac iPad"
      body: "Tapiwch y botwm Rhannu, sef sgwâr â saeth yn pwyntio i fyny. Os na allwch ei weld, tapiwch y tri dot (•••) yn gyntaf, yna Rhannu. Sgroliwch i lawr a thapiwch **Ychwanegu at y Sgrin Gartref**. Gadewch **Agor fel Ap Gwe** wedi'i droi ymlaen, yna tapiwch **Ychwanegu**. Os agorodd dolen y tu mewn i ap arall, agorwch y dudalen yn Safari yn gyntaf, oherwydd na all y porwr adeiledig hwnnw ei hychwanegu."
    - title: "Android"
      body: "Agorwch ddewislen y porwr a dewiswch **Ychwanegu at y sgrin gartref** neu **Gosod ap**."
    - title: "Chrome neu Edge ar gyfrifiadur"
      body: "Agorwch ddewislen y porwr a dewiswch yr opsiwn i osod y wefan hon fel ap. Yna mae'n cael ei ffenest ei hun a'i eicon ei hun."
    - title: "Safari ar Mac"
      body: "Dewiswch **Ffeil**, yna **Ychwanegu at y Doc**."
sections:
  - heading: "Hysbysiadau, dim ond os gofynnwch amdanynt"
    body: "Mae hysbysiadau gwthio yn ddewisol. Trowch nhw ymlaen a chewch hysbysiad pan fydd gweithgaredd newydd yn eich grwpiau, fel rhywun yn ychwanegu cost, yn gadael sylw neu'n cofnodi taliad. Cânt eu troi ymlaen un ddyfais ar y tro, o gloch yr hysbysiadau neu o **Gosodiadau**, a gallwch eu diffodd eto yno. Maent angen porwr sy'n eu cefnogi a'ch caniatâd. Os yw eich porwr wedi eu blocio ar gyfer y wefan, caniatewch nhw yng ngosodiadau'r porwr yn gyntaf. Ar iPhone neu iPad dim ond o'r ap sydd wedi'i ychwanegu at y Sgrin Gartref y maent yn gweithio, nid o dab porwr. Nid oes sicrwydd y byddant yn cyrraedd, felly ystyriwch hysbysiad fel procio bach, nid addewid. I weld beth sy'n ymddangos yn y ffrwd, gweler [cynllunio gyda'ch gilydd](page:feature/plan-together)."
  - heading: "Diweddariadau byw, dim botwm adnewyddu"
    body: "Ychwanegwch gost a bydd pawb yn ei gweld ar unwaith, ynghyd â beth newidiodd a phwy a'i newidiodd. Mae pob grŵp yn cadw hanes gweithgaredd, ac mae cloch yr hysbysiadau yn dangos gweithgaredd ar draws eich holl grwpiau. Does dim rhaid i neb ofyn a ydych wedi gweld y peth rydych newydd ei ychwanegu. Mae ar eu sgrin."
  - heading: "39 iaith, pob person â'i iaith ei hun"
    body: "Defnyddiwch Side Badger mewn 39 iaith, gan gynnwys Arabeg, Perseg ac Wrdw o'r dde i'r chwith. Mae pawb yn y grŵp yn dewis eu hiaith eu hunain, felly gall yr un dudalen grŵp fod yn Arabeg i un person ac yn Saesneg i'r nesaf. Yr unig beth y mae'n rhaid i'r grŵp gytuno arno yw'r rhifau."
  - heading: "Wedi'i adeiladu ar gyfer mwy nag un math o ddefnyddiwr"
    body: "Mae Side Badger wedi'i adeiladu gyda defnyddwyr bysellfwrdd a darllenydd sgrin mewn golwg. Mae lliwiau aelodau'n dod â phatrymau, fel nad oes rhaid i chi wahaniaethu rhwng gwyrdd a choch."
    items:
      - "Dolenni hepgor, fel y gall defnyddwyr bysellfwrdd neidio'n syth i'r cynnwys."
      - "Mae deialogau'n rheoli ffocws y bysellfwrdd."
      - "Mae rheolyddion wedi'u labelu, ar gyfer darllenwyr sgrin."
      - "Mae cynlluniau'n troi ar gyfer ieithoedd o'r dde i'r chwith."
