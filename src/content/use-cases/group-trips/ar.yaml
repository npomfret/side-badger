meta:
  title: "قسّم تكاليف رحلات المجموعات بـ 140 عملة"
  description: "تتبّع من دفع ماذا في رحلة جماعية، وأدخل التكاليف بالعملة المحلية، وحوّلها أو لا، وسوِّ الحسابات مرة واحدة في النهاية. مجاني، في متصفحك."
h1: "قسّم تكاليف رحلات المجموعات بـ 140 عملة"
navLabel: "رحلات المجموعات"
lead: "تتبّع الفيلا وسيارات الأجرة وجولة المشروبات التي لا يتذكر أحد أنه تطوّع لدفعها. يحتفظ Side Badger بالحساب الجاري وأنتم في الخارج، و[يتعامل مع الجنيه الإسترليني واليورو و138 عملة أخرى](page:feature/multiple-currencies)، ويعطيك [قائمة قصيرة من الدفعات](page:feature/settle-up) حين تعودون إلى البيت."
cta:
  heading: "حسابات العطلة، تنتهي قبل أن يتلاشى السمار"
  body: "أنشئ مجموعة، وأرسل رابط الدعوة إلى المسافرين، وأضف التكاليف حين تحدث."
scenario:
  heading: "الجميع دفعوا شيئاً، بعملة ما"
  body: "حجز أحدهم تذاكر الطيران، ودفع آخر ثمن الفيلا ببطاقته، وتكفّل ثالث بالعشاء نقداً. وبحلول اليوم الثالث لا يعرف أحد من هو المتقدّم. السؤال بسيط، وإن كانت الإجابة تعيش عادةً في جدول بيانات لا يريد أحد فتحه. من دفع ماذا، وبأي عملة، وكيف يسوّي الجميع حساباتهم مرة واحدة في النهاية؟"
sections:
  - heading: "قبل أن تسافروا"
    body: "اعرضوا قائمة الفيلات المختصرة على التصويت، بسرّية إن شئتم، ليكون القرار للمجموعة لا لمن يغضب أطول. ثم أبقوا قائمة التسوق المشتركة بجانب فواتير التسوق، حتى لا يشتري أحد ثلاث علب واقي شمس ولا يشتري أي محوّل كهربائي."
  - heading: "وأنتم في الخارج"
    body: "أضف كل تكلفة حين تحدث، بالعملة التي دفعت بها. صوّر الإيصال ويملأ Side Badger الإجمالي والتاريخ والمكان لتراجعها؛ وتُقرأ صور الإيصالات بواسطة خدمة الذكاء الاصطناعي من Google. حوّل المبلغ بسعر صرف حالي، يمكنك تغييره إلى السعر الذي حصلت عليه فعلاً، ويبقى المبلغ الأصلي مع المصروف. أو اترك اليورو يورو وقرّر لاحقاً. ويمكن للمجموعة أيضاً اختيار عملة واحدة، فتتحول إليها المصروفات الجديدة تلقائياً."
  - heading: "ليس كل واحد فعل كل شيء"
    body: "بعضهم تخطّى العشاء، وبعضهم تخلّف عن رحلة القارب. استبعدهم من التكاليف التي لم يكونوا طرفاً فيها، وقسّموا الباقي [بالتساوي أو بمبالغ محددة أو بنسبة مئوية](page:feature/split-expenses). لا أحد يدفع عن الجزء من الرحلة الذي قضاه نائماً."
  - heading: "سوّوا الحساب حين تصلون البيت"
    body: "يقترح Side Badger قائمة قصيرة من الدفعات تسوّي حساب الجميع. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا ذلك. ومع عملات مختلطة، أبقِ كل عملة منفصلة أو حوّل أولاً بأول؛ ويعرض مثال لشبونة أدناه الطريقتين."
  - heading: "حفلات توديع العزوبية"
    body: "عطلة نهاية أسبوع مع ضيف الشرف تحتاج إلى قدر أكبر من الترتيب. اجعلها مجموعة مُدارة، حيث يوافق المشرفون على الأعضاء الجدد ولا يغيّر المصروفات إلا المنشئون والمشرفون. استخدم مبالغ محددة لحصة ضيف الشرف، واقصر المجموعة على العملات التي تستخدمونها فعلاً، وأقفل المجموعة حين تنتهي ليبقى كل رقم في مكانه."
exampleAfter: 4
