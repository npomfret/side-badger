meta:
  title: "공동 지출을 위한 공유 목록, 투표, 댓글 | 사이드 배저"
  description: "지출에 댓글을 달고, 수상한 지출엔 질문하고, 공유 장보기 목록을 만들고, 빌라는 투표로 정하세요. 함께 계획하고 나누세요. 무료, 광고 없음."
h1: "함께 계획하고, 나중에 나누세요"
navLabel: "함께 계획하기"
lead: "장보기 목록과 장보기 비용이 드디어 대화를 시작했습니다. 사이드 배저는 그룹이 돈을 쓰기 전과 후에 돈 이야기를 나눌 곳을 줍니다. 모든 지출에 달 수 있는 댓글, 이상해 보이는 지출에 질문하는 방법, 큰 결정을 위한 공유 목록과 투표까지요. 그런 다음 평소처럼 [지출을 나누세요](page:feature/split-expenses)."
cta:
  heading: "계획하고, 나누세요"
  body: "무료 계정을 만들고, 그룹을 시작하고, 첫 목록, 투표, 질문을 돈 바로 옆에 두세요. 그다음이 궁금하다면 [사용 방법](page:how-it-works)을 보세요."
problem:
  heading: "대화는 저쪽에, 계산서는 이쪽에"
  body: "그룹의 지출은 보통 두 곳에 나뉘어 있습니다. 숫자는 한곳에 있고, 그 숫자를 둘러싼 말다툼은 화요일에 스크롤 저편으로 사라진 채팅방에 있어요. 장보기 목록은 냉장고 사진 한 장이고요. 빌라는 대부분의 사람이 누른 엄지척으로 정해졌을 겁니다, 아마도. 사이드 배저는 계획을 그룹 안에, 그것이 다루는 지출 바로 옆에 둡니다. 비용이 있는 곳에는 댓글이, 장 볼 곳에는 목록이, 큰 결정에는 투표가 있고, 문단을 쓰지 않고도 “잠깐, 이거 맞아?”라고 말할 방법이 있어요. 전부 그룹의 돈에 관한 이야기로 남는데, 그룹은 원래 그걸 위해 있는 거니까요."
workflow:
  heading: "빌라 투표에서 장보기 비용까지"
  steps:
    - title: "큰 결정은 투표에 부치기"
      body: "빌라 선택처럼 비용을 좌우하는 결정을 위해 투표를 추가하세요. 옵션을 두 개에서 열 개 사이로 고르고, 한 사람이 몇 표를 갖는지 정한 다음, 모두 참여하면 투표를 종료하세요. 우승 옵션이 표시됩니다."
      shot: S17
      shotAlt: "우승 옵션이 표시되고 옵션마다 득표 수가 보이는 종료된 투표"
    - title: "장보기 목록을 함께 쓰기"
      body: "공유 목록을 시작하고, 항목을 추가하고, 카트에 담길 때마다 체크하세요. 장 본 비용은 나중에 지출로 넣습니다."
      shot: S16
      shotAlt: "일부 항목이 체크되고 진행 개수가 표시된 공유 장보기 목록"
    - title: "비용 이야기는 그 비용이 있는 곳에서"
      body: "지출 자체에 댓글을 달고, 영수증을 첨부하고, 이모지로 반응하세요. 대화가 그 숫자 바로 옆에 남습니다."
      shot: S08
      shotAlt: "세부 정보, 영수증 썸네일, 댓글 스레드, 이모지 반응이 있는 지출"
    - title: "이상해 보이는 지출엔 질문하기"
      body: "그룹에서 지출 질문 기능을 켰다면, 지출에 포함된 사람은 누구나 **질문이 있습니다**를 고를 수 있습니다. 질문이 해결될 때까지 그 지출은 잔액에서 제외됩니다."
      shot: S18
      shotAlt: "‘질문됨’ 배지와 ‘질문된 것만’ 필터가 보이는 지출 목록"
    - title: "무엇이 바뀌었는지, 누가 바꿨는지 보기"
      body: "활동 피드와 알림 벨이 내 모든 그룹의 새 소식을 보여 줍니다. 원한다면 푸시 알림도 쓸 수 있어요."
      shot: S19
      shotAlt: "최근 활동 목록이 있는 알림 드롭다운"
options:
  heading: "옵션"
  items: []
example:
  heading: "룸메이트 세 명, 질문이 제기된 와인값 하나"
  currency: GBP
  people:
