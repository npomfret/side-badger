    - feature: Gruppenrollen und Berechtigungen
      other: Laut seinem Hilfe-Center unterstützt es weder Gruppen-Admins noch besondere Berechtigungen.
      sideBadger: Admins, Mitglieder und Betrachter. Zwei Voreinstellungen oder eigene Berechtigungen, Beitritt nach Freigabe und eine Sperre, wenn alles vorbei ist.
      source: permissions-help
    - feature: Belegscan
      other: Eine Pro-Funktion. Scannt ein Foto eines Belegs, und die Aufschlüsselung nach Posten in Pro lässt dich die Posten Personen zuweisen.
      sideBadger: Kostenlos und ohne Scan-Guthaben. Es trägt Summe, Datum und Ort ein, damit du sie prüfen kannst, und weist Posten nicht Personen zu.
      source: pro
    - feature: Währungsumrechnung
      other: Eine Pro-Funktion. Tippe auf „Umrechnen“, und Splitwise rechnet die Ausgaben einer Gruppe zum Wechselkurs des jeweiligen Augenblicks in deine Standardwährung um.
      sideBadger: Kostenlos. Rechne jede Ausgabe beim Eingeben um, zu einem aktuellen Wechselkurs oder dem, den du tatsächlich bekommen hast. Der Originalbetrag bleibt an der Ausgabe.
      source: currencies-help
    - feature: Währungen und Sprachen
      other: 100+ Währungen und 7+ Sprachen, wie es seine Startseite nennt.
      sideBadger: 133 Währungen und 39 Sprachen. Alle in der Gruppe können ihre eigene Sprache wählen.
      source: home
    - feature: Wo du es nutzt
      other: Apps für iPhone und Android sowie das Web.
      sideBadger: In deinem Browser. Melde dich an und füge es dann zum Home-Bildschirm hinzu, und es öffnet sich wie eine App. Nicht in den App-Stores.
      source: home
    - feature: Arten zu teilen
      other: Gleichmäßig, nach genauen Beträgen, in Prozent, nach Anteilen, nach Anpassung oder nach Posten.
      sideBadger: Gleichmäßig, nach genauen Beträgen oder in Prozent, mit einer zahlenden Person pro Ausgabe. Nicht nach Anteilen oder nach Posten.
      source: split-help
    - feature: Offline-Nutzung
      other: Führt einen Offline-Modus unter seinen Kernfunktionen auf.
      sideBadger: Nein. Es braucht eine Verbindung.
      source: home
    - feature: Zahlungen und deine Bank
      other: "An manchen Orten kann es Geld direkt aus der App senden: Splitwise Pay in den USA, Venmo für Salden in US-Dollar, PayPal und Pay by Bank in ausgewählten europäischen Ländern, das ein privates Girokonto verbindet."
      sideBadger: Fasst dein Geld nie an und fragt nicht nach deinen Bankdaten. Zahl den anderen, wie du willst, und erfasse dann die Zahlung.
      source: payments-help
    - feature: Diagramme und Standardaufteilungen
      other: Beides sind Pro-Funktionen.
      sideBadger: Keines von beiden.
      source: pro
faq:
  heading: Fragen
  items:
    - q: Ist Side Badger eine kostenlose Alternative zu Splitwise?
      a: "Zum Teilen von Rechnungen in einer Gruppe: ja, und es kann mehr als rechnen: Kommentare, Fragen, Listen, Umfragen und Gruppenrollen, mit kostenlosem Belegscan und kostenloser Währungsumrechnung. Brauchst du eine App aus dem App-Store, Offline-Nutzung oder Zahlungen in der App, kann Splitwise das und Side Badger nicht."
    - q: Woher stammen die Angaben zu Splitwise?
      a: "Von Splitwises eigenen Seiten: seiner Startseite, seiner Pro-Seite und seinem Hilfe-Center. Jede Zeile der Tabelle verlinkt auf die Seite, von der sie stammt, und das Datum über der Tabelle sagt, wann wir sie gelesen haben. Wir prüfen sie jedes Quartal."
    - q: Bleibt Side Badger kostenlos?
      a: Heute ist alles in Side Badger kostenlos. Sollte sich das je ändern, sagen wir vorher Bescheid. Die [Preisseite](page:pricing) hat die Einzelheiten.
    - q: Müssen alle in meiner Gruppe wechseln?
      a: Ja. Alle in einer Gruppe brauchen ein kostenloses Side-Badger-Konto, und sie können per Link oder QR-Code beitreten.
    - q: Hat Side Badger eine mobile App?
      a: "Nicht in einem App-Store. Es läuft in deinem Browser: Melde dich auf dem Handy an und füge es dann zum Home-Bildschirm hinzu, damit es sich wie eine App öffnet. [So funktioniert es](page:how-it-works) zeigt, wie."
