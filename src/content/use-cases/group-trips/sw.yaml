meta:
  title: "Gawanya gharama za safari ya kikundi, kwa sarafu 140"
  description: "Fuatilia nani alilipa nini kwenye safari ya kikundi, weka gharama kwa sarafu ya hapo, zibadilishe au la, na maliza hesabu mara moja mwishoni. Bure, kwenye kivinjari chako."
h1: "Gawanya gharama za safari ya kikundi, kwa sarafu 140"
navLabel: "Safari za kikundi"
lead: "Fuatilia villa, teksi, na raundi ile ya vinywaji ambayo hakuna anayekumbuka kujitolea kununua. Side Badger huweka hesabu inayoendelea ukiwa safarini, [hushughulikia pauni, euro na sarafu nyingine 138](page:feature/multiple-currencies), na kukupa [orodha fupi ya malipo](page:feature/settle-up) ukirudi nyumbani."
cta:
  heading: "Hesabu za likizo, zimekamilika kabla ngozi haijarudi rangi yake"
  body: "Unda kikundi, tuma kiungo cha mwaliko kwa watu walio kwenye safari, na ongeza gharama zinapotokea."
  button: "Fungua akaunti ya bure"
scenario:
  heading: "Kila mtu alilipia kitu, kwa sarafu fulani"
  body: "Mtu mmoja alihifadhi tiketi za ndege, mwingine alilipia villa kwa kadi, na wa tatu alilipia chakula cha jioni kwa pesa taslimu. Kufikia siku ya tatu hakuna anayejua nani yuko mbele. Swali ni rahisi, ingawa jibu mara nyingi liko kwenye lahajedwali ambayo hakuna anayetaka kuifungua. Nani alilipa nini, kwa sarafu gani, na kila mtu anamaliza hesabu vipi mara moja mwishoni?"
sections:
  - heading: "Kabla ya kwenda"
    body: "Peleka orodha fupi ya villa kwenye kura, bila kujulikana ukipenda, ili uamuzi uwe wa kikundi si wa yule anayenuna kwa muda mrefu zaidi. Kisha weka orodha ya ununuzi ya pamoja karibu na bili za ununuzi, ili hakuna anayenunua mirija mitatu ya mafuta ya jua na hakuna adapta ya plagi."
  - heading: "Ukiwa safarini"
    body: "Ongeza kila gharama inapotokea, kwa sarafu uliyolipia. Piga picha risiti na Side Badger itajaza jumla, tarehe na mahali ili uvihakiki; picha za risiti husomwa na huduma ya AI ya Google. Badilisha kiasi kwa kiwango cha sasa cha kubadilisha fedha, ambacho unaweza kukibadilisha kiwe kiwango ulichopata kwa kweli, na kiasi cha awali kinabaki kwenye gharama. Au acha euro zibaki euro na uamue baadaye. Kikundi pia kinaweza kuchagua sarafu moja, na gharama mpya hubadilishwa kuwa hiyo kiotomatiki."
  - heading: "Si kila mtu alifanya kila kitu"
    body: "Wengine waliruka chakula cha jioni, wengine hawakuenda kwenye safari ya boti. Waache nje ya gharama ambazo hawakuhusika nazo, na ugawanye zilizobaki [kwa usawa, kwa kiasi halisi au kwa asilimia](page:feature/split-expenses). Hakuna anayelipia sehemu ya safari aliyoitumia akiwa amelala."
  - heading: "Maliza hesabu ukifika nyumbani"
    body: "Side Badger hupendekeza orodha fupi ya malipo inayomaliza hesabu za kila mtu. Lipaneni mtakavyo, kisha rekodi. Kukiwa na sarafu mchanganyiko, ziweke kando au zibadilishe unavyoendelea; mfano wa Lisbon hapa chini unaonyesha zote mbili."
  - heading: "Wikendi za kuaga ukapera"
    body: "Wikendi ya mbali yenye mgeni wa heshima inahitaji usimamizi kidogo zaidi. Ifanye kikundi kinachosimamiwa, ambapo wasimamizi wanaidhinisha wanachama wapya na ni waundaji na wasimamizi tu wanaoweza kubadilisha gharama. Tumia kiasi halisi kwa sehemu ya mgeni wa heshima, punguza kikundi kwa sarafu mnazotumia kweli, na funga kikundi kikiisha ili nambari zibaki palepale."
