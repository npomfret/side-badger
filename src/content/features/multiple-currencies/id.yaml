meta:
  title: "Bagi biaya dalam 140 mata uang, dikonversi atau dipisahkan"
  description: "Catat setiap pengeluaran dalam mata uang yang Anda pakai untuk membayar, pisahkan saldo atau konversi dengan kurs yang bisa Anda lihat dan ubah, lalu lunasi dengan daftar pembayaran singkat."
h1: "Bagi biaya dalam 140 mata uang"
navLabel: "Beberapa mata uang"
lead: "Euro, yen, dan satu taksi dalam baht itu. Side Badger menerima setiap pengeluaran dalam mata uang yang Anda pakai untuk membayar, menjaga saldo tetap rapi, dan bisa mengonversi saat grup Anda lebih suka melunasi sekali saja. Berfungsi dalam 140 mata uang, dan sangat cocok untuk [perjalanan grup](page:use-case/group-trips)."
cta:
  heading: "Bawa euro Anda, bawa yen Anda"
  body: "Buat akun, mulai grup, dan tambahkan pengeluaran pertama dalam mata uang apa pun yang kebetulan Anda pegang."
  button: "Buat akun gratis"
problem:
  heading: "Catat seperti saat Anda membayar"
  body: "Perjalanan jarang dibayar dalam satu mata uang. Hotel dipesan dari rumah dalam pound, makan malam dibayar dalam yen, dan kopi bandara dalam mata uang apa pun tempat transit. Mengonversi semuanya secara manual sebelum bisa mengetiknya adalah cara spreadsheet ditinggalkan. Di Side Badger Anda mencatat tiap pengeluaran dalam mata uang yang tertera di struk, dan setiap jumlah mengikuti aturan mata uangnya, jadi yen tanpa desimal dan dinar punya tiga. Mata uang yang baru Anda pakai muncul lebih dulu di daftar."
workflow:
  heading: "Pisahkan mata uang, atau konversi seiring berjalan"
  steps:
    - title: "Tambahkan pengeluaran dalam mata uangnya sendiri"
      body: "Pilih mata uang, ketik jumlah, sebutkan siapa yang membayar dan siapa yang ikut. Tidak perlu yang lain. Ini bawaannya, dan jumlah aslinya tersimpan persis seperti yang Anda masukkan."
      shot: S07
      shotAlt: "Formulir pengeluaran dengan jumlah dalam yen yang dimasukkan"
    - title: "Pantau saldo untuk setiap mata uang"
      body: "Saldo disimpan terpisah per mata uang, dan masing-masing mendapat daftar pembayaran yang disarankan sendiri. Pound dilunasi dalam pound dan yen dalam yen."
      shot: S10
      shotAlt: "Layar saldo dengan utang yang disederhanakan dalam dua mata uang"
    - title: "Atau konversi, saat grup lebih suka melunasi sekali saja"
      body: "Pilih mata uang lain saat memasukkan pengeluaran dan Side Badger dapat mengonversinya dengan kurs terkini, yang bisa Anda ubah ke kurs yang benar-benar Anda dapatkan. Jumlah yang dikonversi bergabung ke saldo dalam mata uang itu. Konversi adalah pilihan yang dibuat grup, tidak pernah sesuatu yang terjadi di belakang Anda."
options:
  heading: "Kurs yang bisa Anda lihat dan ubah"
  items:
    - title: "Kurs ditampilkan"
      body: "Saat Anda mengonversi, kurs dan jumlah yang dikonversi muncul di formulir, jadi tak ada yang perlu percaya begitu saja pada sebuah angka."
    - title: "Ketik sendiri"
      body: "Dapat kurs lebih baik dari tempat penukaran, atau lebih buruk dari bandara? Ubah kurs ke yang benar-benar Anda dapatkan dan jumlah yang dikonversi diperbarui."
    - title: "Aslinya tetap ada"
      body: "Jumlah asli tetap ada di pengeluaran, di samping yang dikonversi, bagi siapa pun yang bertanya berapa itu dalam yen."
    - title: "Konversi gratis"
      body: "Mengonversi tidak dipungut biaya. Tidak ada biaya untuk memasukkan pengeluaran dalam mata uang lain."
