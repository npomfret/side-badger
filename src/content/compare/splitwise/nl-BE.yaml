meta:
  title: "Side Badger vs Splitwise: de hele groep, niet alleen de sommen | Side Badger"
  description: "Een gratis Splitwise-alternatief voor de hele groep: opmerkingen, vragen, lijsten, peilingen en echte rollen, plus gratis bonnetjes scannen en valuta’s omrekenen."
h1: "Side Badger vs Splitwise: de hele groep, niet alleen de sommen"
navLabel: "Side Badger vs Splitwise"
lead: "Iemand in je groep heeft waarschijnlijk al gezegd: “gebruik gewoon Splitwise”. Terecht: het is goed in het rekenwerk. Side Badger doet het rekenwerk ook, en geeft de groep daarna een plek om het te bespreken: opmerkingen, vragen, lijsten, peilingen en echte groepsrollen. Bonnetjes scannen en valuta’s omrekenen zijn gratis."
cta:
  heading: "Probeer het op je volgende gedeelde rekening"
  body: "Maak een gratis account aan, start een groep en voeg één echte uitgave toe. Is het niets voor jou, dan ben je een paar minuten kwijt, geen abonnement."
asOf: 2026-11-22
asOfNote: "We lazen de eigen pagina’s van Splitwise op {date}, zodat jij dat niet hoeft te doen, en alles wat hier over Splitwise staat komt daaruit. Elke rij van de tabel verwijst naar de bron ervan. Het aanbod verandert, dus we controleren elk kwartaal opnieuw, en als de pagina’s van Splitwise iets anders zeggen dan deze, geloof dan vooral hen."
