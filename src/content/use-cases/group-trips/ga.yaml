meta:
  title: "Roinn costais turais ghrúpa, i 140 airgeadra"
  description: "Rianaigh cé a d'íoc as cad ar thuras grúpa, cuir costais isteach san airgeadra áitiúil, tiontaigh iad nó ná déan, agus socraigh uair amháin ag an deireadh. Saor in aisce, i do bhrabhsálaí."
h1: "Roinn costais turais ghrúpa, i 140 airgeadra"
navLabel: "Turais ghrúpa"
lead: "Rianaigh an teach saoire, an tacsaí, agus an babhta cocktail amháin nach cuimhin le héinne gur thairg sé é a cheannach. Coinníonn Side Badger an cuntas reatha agus tú ar shiúl, [láimhseálann sé punt, euro agus 138 airgeadra eile](page:feature/multiple-currencies), agus tugann sé [liosta gearr íocaíochtaí](page:feature/settle-up) duit nuair a thagann tú abhaile."
cta:
  heading: "Matamaitic na saoire, déanta sula n-imíonn an donnú"
  body: "Cruthaigh grúpa, seol an nasc cuiridh chuig na daoine ar an turas, agus cuir costais leis de réir mar a tharlaíonn siad."
scenario:
  heading: "D'íoc gach duine as rud éigin, in airgeadra éigin"
  body: "Chuir duine éigin na heitiltí in áirithe, chuir duine eile an teach saoire ar chárta, agus chlúdaigh tríú duine an dinnéar in airgead tirim. Faoin tríú lá níl a fhios ag aon duine cé atá chun cinn. Tá an cheist simplí, cé go mbíonn an freagra de ghnáth i scarbhileog nach dteastaíonn ó aon duine a oscailt. Cé a d'íoc as cad, i gcén airgeadra, agus conas a shocraíonn gach duine uair amháin ag an deireadh?"
sections:
  - heading: "Sula dtéann tú"
    body: "Cuir liosta gearr na dtithe saoire chun vótála, gan ainm más maith leat, ionas gur leis an ngrúpa an cinneadh agus ní leis an té is faide a bhíonn crosta. Ansin coinnigh an liosta siopadóireachta comhroinnte in aice leis na billí siopadóireachta, ionas nach gceannóidh aon duine trí phíopa ola gréine agus gan adaptóir pluga."
  - heading: "Agus tú ar shiúl"
    body: "Cuir gach costas leis de réir mar a tharlaíonn sé, san airgeadra inar íoc tú é. Tóg grianghraf den admháil agus líonann Side Badger isteach an t-iomlán, an dáta agus an áit duit le seiceáil; léann seirbhís AI Google íomhánna admhálacha. Tiontaigh an tsuim ar ráta malairte reatha, rud is féidir leat a athrú go dtí an ráta a fuair tú i ndáiríre, agus fanann an tsuim bhunaidh ar an gcostas. Nó fág na euro mar euro agus socraigh níos déanaí. Is féidir le grúpa airgeadra amháin a roghnú freisin, agus tiontaítear costais nua isteach ann go huathoibríoch."
  - heading: "Ní dhearna gach duine gach rud"
    body: "Scipeáil roinnt daoine an dinnéar, shuigh roinnt eile an bád amach. Fág amach iad ó na costais nach raibh siad páirteach iontu, agus roinn an chuid eile [go cothrom, de réir suimeanna cruinne nó de réir céatadáin](page:feature/split-expenses). Ní íocann aon duine as an gcuid den turas a chaith siad ina gcodladh."
  - heading: "Socraigh nuair a bhíonn tú sa bhaile"
    body: "Molann Side Badger liosta gearr íocaíochtaí a shocraíonn gach duine. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead é. Le hairgeadraí measctha, coinnigh gach ceann ar leith nó tiontaigh de réir a chéile; taispeánann sampla Liospóin thíos an dá cheann."
  - heading: "Deireadh seachtaine stag agus hen"
    body: "Teastaíonn beagán níos mó riaracháin ó dheireadh seachtaine ar shiúl le haoi onóra. Déan grúpa bainistithe de, áit a gceadaíonn riarthóirí baill nua agus nach féidir ach le cruthaitheoirí agus riarthóirí costais a athrú. Úsáid suimeanna cruinne do sciar an aoi onóra, cuir teorainn leis an ngrúpa leis na hairgeadraí atá á n-úsáid agat i ndáiríre, agus glasáil an grúpa nuair a bhíonn sé thart ionas go bhfanann na huimhreacha mar atá."
exampleAfter: 4
