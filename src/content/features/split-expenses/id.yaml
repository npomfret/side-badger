sections:
  - heading: "Hanya orang yang hadir"
    body: "Bagi biaya di antara semua orang, atau hanya orang yang ikut menanggungnya. Keluarkan orang dari biaya yang bukan bagian mereka, dan saldo mencerminkannya. Teman serumah yang pergi sepanjang minggu tidak berutang untuk makanan bungkus, yang akan diakui [teman serumah](page:use-case/housemates) sebagai keadilan dasar."
  - heading: "Detail yang menghindarkan pertengkaran nanti"
    items:
      - "Atur **tanggal** dan waktu opsional. Pintasan seperti hari ini, kemarin, pagi tadi, dan semalam menghemat ketikan."
      - "Tambahkan hingga tiga **label** untuk mengelompokkan pengeluaran, seperti belanjaan atau perjalanan."
      - "Tambahkan **tempat**. Tempelkan tautan peta dan nama tempat terisi sendiri."
      - "Tambahkan **catatan** untuk cerita di balik angkanya, dengan sedikit pemformatan jika ceritanya memerlukan."
      - "Lampirkan hingga tiga **struk** sebagai foto atau PDF, supaya buktinya tetap menyatu dengan pengeluaran."
      - "Gunakan **komentar** untuk menjaga percakapan di samping pengeluaran yang dibicarakan, bukan di utas obrolan yang tak pernah digulir kembali."
  - heading: "Salin, ubah, dan lihat apa yang berubah"
    body: "Salin sewa bulan lalu daripada mengetiknya lagi, lalu ubah yang berbeda. Jika sebuah angka salah, ubah pengeluarannya. Versi sebelumnya disimpan dan perubahan muncul di aktivitas grup, jadi tak ada yang mengubah angka diam-diam. Apa yang boleh diubah seseorang bergantung pada izin grup."
  - heading: "Saat ada yang terlihat salah"
    body: "Sebuah grup bisa mengaktifkan pertanyaan pengeluaran. Siapa pun yang termasuk dalam sebuah pengeluaran bisa mengajukan pertanyaan dan menyebut alasannya, dan pengeluaran itu tetap di luar saldo sampai orang yang bertanya, atau admin, menutupnya. Fitur ini nonaktif secara bawaan dan admin mengaktifkannya untuk grup. Cocok untuk [acara dan perayaan](page:use-case/events-and-celebrations), tempat deposit yang tak diingat siapa pun tiba-tiba menjadi urusan semua orang."
limits:
  heading: "Batas"
  items:
    - "Satu orang membayar untuk setiap pengeluaran. Jika dua orang membayar, catat dua pengeluaran."
    - "Tidak ada pembagian per item dan tidak ada pembagian per bagian. Yang ada hanya rata, jumlah pasti, dan persentase."
    - "Persentase harus berjumlah 100."
    - "Satu pengeluaran bisa mencapai 999.999,99 dalam mata uangnya sendiri, dengan angka desimal yang lazim untuk mata uang itu."
    - "Pengeluaran tidak bisa berulang sendiri. Salin yang bulan lalu."
    - "Tanggal tidak boleh di masa depan atau lebih dari 10 tahun lalu."
    - "Pengeluaran yang melibatkan orang yang sudah keluar dari grup menjadi hanya-baca."
useCasesHeading: "Di mana pembagian seperti ini membantu"
faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah dua orang membayar satu pengeluaran?"
      a: "Tidak dalam satu pengeluaran. Catat dua, satu untuk tiap pembayar, dan saldonya sama saja."
    - q: "Bisakah saya membagi struk per item?"
      a: "Tidak. Pembagian bisa rata, berdasarkan jumlah pasti, atau persentase. Untuk tagihan dengan item berbeda-beda, masukkan yang harus dibayar tiap orang sebagai jumlah pasti."
    - q: "Bisakah saya mengatur pembagian bawaan?"
      a: "Tidak. Salin pengeluaran sebelumnya untuk memakai ulang pembagiannya, dan ubah yang berbeda."
    - q: "Bisakah tagihan berulang tiap bulan?"
      a: "Tidak. Salin pengeluaran bulan lalu, yang hanya butuh beberapa detik."
    - q: "Siapa yang bisa mengubah pengeluaran?"
      a: "Siapa pun yang diizinkan oleh izin grup. Setiap perubahan muncul di aktivitas grup, jadi perubahan tidak pernah diam-diam."
    - q: "Apa yang terjadi pada saldo setelahnya?"
      a: "Saldo diperbarui saat pengeluaran masuk, dan [pelunasan](page:feature/settle-up) mengubahnya menjadi daftar pembayaran singkat. Jika sebuah pengeluaran dalam mata uang lain, lihat [beberapa mata uang](page:feature/multiple-currencies)."
