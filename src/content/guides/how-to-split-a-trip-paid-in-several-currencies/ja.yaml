meta:
  title: 複数の通貨で払った旅行を割り勘する方法 | Side Badger
  description: ホテルはポンド、ラーメンは円。通貨ごとに別々に精算するか、確認できるレートで換算するか。どちらの方法も、計算つきで解説します。
h1: 複数の通貨で払った旅行を割り勘する方法
navLabel: 複数通貨の旅行
lead: 各支出を支払った通貨で入力し、そのあと進め方を選びます。通貨を別々のままにして、それぞれをその通貨で精算するか、現在の為替レートで換算して一度で精算するか。同じ日本旅行が、前者なら4回、後者なら2回の支払いになります。
cta:
  heading: 支払ったお金のまま入力しよう
  body: 無料アカウントを作成し、旅行のグループを始めて、レシートに書かれていた通貨のまま各支出を追加しましょう。先に詳しく知りたい方は、[複数の通貨](page:feature/multiple-currencies)や[無料で使える範囲](page:pricing)をご覧ください。
sections:
  - heading: 友だち3人、ホテル1軒、そして大量の円
    body: Zoe、Kenji、Lucyの3人が、[グループ旅行](page:use-case/group-trips)で1週間日本に滞在し、費用はすべて3人で均等に分けます。Zoeは自宅でホテルをポンドで予約し、£600でした。Lucyは東京で鉄道パスを¥90,000で購入しました。Kenjiはラーメンの夜を¥9,000で支払い、それ以来、毎日その話をしています。駅のホームで3枚のレシートを換算したい人はいません。ここでの計算では、¥1は£0.005です。このガイドのために決めた、キリのいいレートです。アプリでは、現在の為替レートを使うか、実際に適用されたレートを入力します。
  - heading: レシートに書かれたお金のまま入力する
    body: どちらの進め方を選んでも、この部分は同じです。まだ換算するものはありません。
    items:
      - "**グループを作る。** ダッシュボードで**グループを作成**を選び、旅行にちなんだ名前を付けてから、**他の人を招待**を選んで、リンクまたはQRコードを送ります。"
      - "**ホテルを追加する。** **経費を追加**を選び、600を入力して、金額の隣の通貨にポンドを指定します。「**誰が支払いましたか？**」でZoeを選びます。**割り勘相手**は3人全員のままにして、**割り勘方法**は**均等**のまま、**経費を保存**を選びます。"
      - "**円の分を追加する。** 鉄道パス（Lucyが支払い）とラーメン（Kenjiが支払い）も同じように入力し、通貨は円にします。円には小数がないので、フォームも小数を求めません。"
  - heading: "ルート1：通貨を別々にしておく"
    body: Side Badgerは通貨ごとに残高を管理し、ある通貨を別の通貨と相殺することはありません。ポンドでは、ホテルは1人£200なので、KenjiとLucyはそれぞれZoeに£200を借りています。円では、鉄道パスとラーメンの合計が¥99,000で、1人あたり¥33,000です。Lucyは¥90,000を支払ったので、¥57,000を受け取る側です。Zoeは円を支払っていないので、¥33,000を借りています。Kenjiは¥9,000を支払ったので、¥24,000を借りています。
    items:
      - "**ポンド。** KenjiがZoeに£200、LucyがZoeに£200を支払います。"
      - "**円。** ZoeがLucyに¥33,000、KenjiがLucyに¥24,000を支払います。"
      - "**合計4回の支払い。** ZoeとLucyは、相殺されない2つの通貨で互いに借りています。レートは関係しないので、揉めるところがありません。"
      - "**円を借りていて、ポンドで支払う。** 円を持っていない人も、ポンドで支払えます。支払いを記録するときに「**別の通貨ですか？**」を開き、**変換先**にポンドを選んで、レートを確認します。このガイドのレートでは、Zoeの¥33,000は£165で、円の残高はきちんと合います。"
      - "**各支払いを記録する。** 支払いは好きな方法で行い、そのあと**精算する**を選んで**精算を記録**を使います。詳しくは[精算](page:feature/settle-up)をご覧ください。"
  - heading: "ルート2：入力しながら換算する"
    body: グループとして1人1つの数字で見たいなら、支出を入力するときに換算します。
    items:
      - "**フォームで換算する。** **経費を追加**で**変換先**を選び、ポンドを指定します。Side Badgerがレートと換算後の金額を、≈を付けて表示します。別のレートが適用された場合は、レートを編集してください。元の円の金額は支出に残ります。"
      - "**ポンドで見る。** ¥1 = £0.005なら、鉄道パスは£450、ラーメンは£45になります。£600のホテルと合わせると、£600 + £450 + £45 = £1,095で、1人あたり£365です。Zoeは£600を支払ったので、£235を受け取る側です。Lucyは£450を支払い、£85を受け取る側です。Kenjiは£45を支払ったので、£320を借りています。"
      - "**支払いは2回。** どちらもKenjiからで、Zoeに£235、Lucyに£85です。ZoeとLucyは、もう互いに支払う必要がまったくありません。"
      - "**または、グループの通貨を設定する。** この手間を省くには、グループの**設定**を開き、**通貨設定**で**自動的に経費を変換**に通貨を選びます。以後、新しい支出はその通貨に換算されますが、レートは引き続き確認も変更もできます。"
  - heading: どちらのルートにする？
    items:
      - "**別々にしておく**のは、財布にまだ円が残っている人がいるときや、レートで揉めたくないときです。代わりに、支払いの回数が増え、通貨も複数になります。"
      - "**換算する**のは、グループが普段1つの通貨で暮らしていて、1人につき1つの数字と、Kenjiの2回の振込のような短いリストがほしいときです。代わりに、グループが1つのレートを信頼することになり、そのレートは支出を保存した時点で固定されます。"
      - "**早めに決める。** グループの通貨で換算されるのは、新規とコピーした支出だけです。すでに入力したものをさかのぼって整えることはありません。"
  - heading: レートと、上限
    items:
      - "**レートは保存した時点で固定される。** 過去の支出が再評価されることはないので、相場が動いたせいで残高がずれることはありません。別の日に入力した支出には別のレートが付くことがあるため、旅行全体で1つのレートにしたいときは、グループで決めて、毎回入力してください。"
      - "**レートがない？ 自分で入力する。** Side Badgerは可能な場合に現在の為替レートを取得しますが、すべての通貨の組み合わせで取得できる保証はありません。取得できないときや、両替所のほうが良いレートだったときは、自分で入力してください。"
      - "**1件の支出につき、その通貨で999,999.99まで。** どの通貨でも上限は1つです。円では¥1,000,000弱で、このガイドのレートでは約£5,000です。インドネシアルピアのように数字の大きい通貨では、1枚の請求書でもっと早く上限に達することがあります。請求書を2つの支出に分けるか、別の通貨で入力して換算してください。"
  - heading: ここでSide Badgerにできないこと
    items:
      - お金を動かしたり、両替したりすることはありません。支払いは好きな方法で行い、そのあと支払いを記録します。
      - 通貨は140種類です。暗号資産や貴金属は含まれません。
