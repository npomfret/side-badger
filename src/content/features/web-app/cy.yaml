faq:
  heading: "Cwestiynau"
  items:
    - q: "Oes ap Side Badger mewn siop apiau?"
      a: "Nac oes. Ap gwe yw Side Badger. Rydych yn ei agor yn eich porwr, a gallwch ei ychwanegu at eich sgrin gartref neu'ch doc fel ei fod yn agor fel ap. Does dim byd i'w lawrlwytho o siop apiau."
    - q: "Alla i rannu biliau heb lawrlwytho ap?"
      a: "Gallwch. Agorwch Side Badger mewn porwr ar eich ffôn neu gyfrifiadur, mewngofnodwch, a chychwynnwch grŵp. Mae ei ychwanegu at eich sgrin gartref neu'ch doc yn ddewisol."
    - q: "Ydy Side Badger yn gweithio all-lein?"
      a: "Nac ydy. Mae angen cysylltiad ar Side Badger, hyd yn oed pan fydd wedi'i ychwanegu at eich sgrin gartref neu'ch doc."
    - q: "Pam nad ydw i'n cael hysbysiadau ar fy iPhone?"
      a: "Ar iPhone neu iPad, dim ond o'r ap sydd wedi'i ychwanegu at y Sgrin Gartref y mae hysbysiadau'n gweithio, nid o dab porwr. Ychwanegwch ef, agorwch ef o eicon y Sgrin Gartref, yna trowch hysbysiadau ymlaen yn **Gosodiadau**. Nid oes sicrwydd y byddant yn cyrraedd, felly os bydd un yn mynd ar goll, mae hanes gweithgaredd y grŵp yn dal i ddangos beth a ychwanegwyd."
    - q: "Oes rhaid i mi droi hysbysiadau ymlaen?"
      a: "Nac oes. Maent wedi'u diffodd nes i chi eu troi ymlaen, un ddyfais ar y tro. Hebddynt, mae gweithgaredd newydd yn dal i ymddangos yn yr ap, ac mae pawb yn gweld newid ar unwaith pan fydd ar agor ganddynt."
    - q: "Oes angen cyfrif ar bawb yn y grŵp?"
      a: "Oes. Y cyfan sydd ei angen yw cyfeiriad e-bost a chyfrinair, ac rydych yn dilysu'r e-bost cyn y gallwch ychwanegu unrhyw beth. Mae pawb sy'n ymuno â grŵp yn gwneud yr un peth, ar ba bynnag ffôn neu gyfrifiadur a hoffant."
