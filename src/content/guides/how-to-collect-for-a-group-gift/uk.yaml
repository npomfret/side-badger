meta:
  title: "Як збирати гроші на спільний подарунок | Side Badger"
  description: "Кожен скидається по-різному, а б'є по картці одна людина. Проведіть опитування про бюджет, внесіть точні суми, і Side Badger порахує все сам."
h1: "Як збирати гроші на спільний подарунок"
navLabel: "Збір на подарунок"
lead: "Збір на спільний подарунок означає, що одна людина викладає гроші наперед, а решта винні їй свій внесок. Домовтеся про бюджет через опитування, нехай покупець оплатить подарунок власною карткою, а потім внесіть його як одну витрату з [точними сумами](page:feature/split-expenses), тобто з цифрою для кожного. Side Badger покаже, хто скільки винен покупцю, а кожен надсилає свою частку як зручно."
cta:
  heading: "Пустіть капелюха по колу без капелюха"
  body: "Створіть групу, не додавайте до неї іменинницю чи іменинника й внесіть подарунок з точними сумами. Side Badger безкоштовний, без реклами та щоденних обмежень. Хочете спершу екскурсію? Дивіться [як це працює](page:how-it-works) або [що входить у безкоштовне](page:pricing)."
sections:
  - heading: "Четверо друзів, один програвач, чотири різні суми"
    body: "Бі виповнюється 30, і вона хоче програвач вінілу. Прія, Омар, Лена та Сем дарують його їй. Прія знаходить один за 240 £ і купує його власною карткою, бо хтось має почати першим. Четверо скидаються нерівно. Прія й Омар вкладають по 60 £, Лена 80 £, Сем 40 £. Ніхто не пояснює свою цифру, і ніхто не питає. Омар ще купує листівку й обгортковий папір за 12 £. Підписують листівку всі четверо, тож цю витрату ділять порівну."
  - heading: "Домовтеся про бюджет, перш ніж хтось натисне «Купити»"
    body: "Опитування про бюджет рятує від суперечки про програвач за 400 £. У групі оберіть **Додати опитування** й запитайте, скільки має коштувати подарунок. Зробіть варіантами суми, як-от до 150 £, до 200 £ і до 250 £. Увімкніть **Анонімне голосування**, яке ховає, хто за що голосував, щоб нікому не доводилося вголос відстоювати меншу цифру. Налаштування не можна змінити, коли надійшов перший голос, тож перевірте їх заздалегідь. Опитування саме не закривається. Коли всі проголосували, оберіть **Закрити опитування**, і з'явиться **Переможець**. Опитування погоджує загальну суму. Частку кожного воно не визначає."
  - heading: "Читаємо підсумок"
    body: "Подарунок ділиться як 60 £, 60 £, 80 £ і 40 £, що разом дає 240 £ з чека. Листівка й обгортка діляться на чотирьох по 3 £. Рахунок Прії становить 60 £ + 3 £, тобто 63 £, а заплатила вона 240 £, тож їй винні 177 £. Рахунок Омара теж 63 £, але він заплатив 12 £, тож винен 51 £. Лена винна 80 £ + 3 £, тобто 83 £, а Сем 40 £ + 3 £, тобто 43 £. Ці три суми разом дають 177 £ Прії. Якби все лишити як є, борги розбіглися б по групі п'ятьма напрямками. Side Badger натомість пропонує три платежі, усі Прії. Подробиці в розділі про [розрахунок](page:feature/settle-up)."
  - heading: "Вносимо в Side Badger"
    body: "Робота Прії займає хвилин п'ять."
    items:
      - "**Створіть групу.** На панелі оберіть **Створити групу**. Оберіть **Запросити інших** і надішліть посилання або QR-код тим, хто скидається, і більше нікому."
      - "**Додайте подарунок.** Оберіть **Додати витрату**, опишіть її, введіть 240 і під **Хто заплатив?** виберіть Прію. Залиште всіх чотирьох у **Розділити між**, потім у **Як розділити** оберіть **Точні суми** й уведіть 60, 60, 80 і 40. Суми мають разом дорівнювати 240. За бажання прикріпіть підтвердження замовлення. Оберіть **Зберегти витрату**."
      - "**Додайте листівку.** Омар сам додає 12 £, обирає себе під **Хто заплатив?** і лишає **Як розділити** на **Порівну**, з усіма чотирма людьми, позначеними галочкою."
      - "**Порахуйте, потім платіть.** Кожен дивиться **Баланси**, де видно, хто кому винен, і надсилає Прії свою частку як зручно. Потім записує її через **Розрахуватися** та **Записати розрахунок**. Швидкий розрахунок сам підставляє суму."
  - heading: "Спершу купити чи спершу зібрати"
    body: "Side Badger не тримає загальну касу, тож «збір» насправді означає підрахунок. Працюють два порядки."
    items:
      - "**Спершу купити.** Покупець платить, вносить витрату за справжньою ціною, і кожен одразу бачить свою частку. Так охайніше, але покупець несе витрату, доки люди не заплатять, тож оберіть того, хто може собі це дозволити."
      - "**Спершу зібрати.** Люди надсилають покупцеві свою цифру до покупки. Коли ціна відома, внесіть подарунок, а потім записуйте кожен платіж з датою, коли гроші справді надійшли. Спершу додайте подарунок, щоб кожному платежу було до якого балансу прив'язатися."
      - "**Ціна змінюється.** Доставка, промокод, пізнє подорожчання. Відредагуйте подарунок і змініть точні суми так, щоб вони й далі дорівнювали ціні. Попередня версія зберігається, але спершу скажіть групі, бо їхні баланси зміняться."
  - heading: "Тримайте Бі осторонь"
    body: "Групу бачать лише її учасники, тож Бі не бачить групи, до якої не входить. Запрошуйте тих, хто скидається, і нікого більше. Посилання діє, доки не спливе його строк, і ви можете обрати будь-що від 15 хвилин до 5 днів, тож оберіть короткий і надішліть туди, де Бі його не побачить. Посилання показує попередній перегляд групи кожному, хто його відкриє, тож назвіть групу якось нудно, наприклад «Суботня каса», і не згадуйте ім'я Бі ні в назвах витрат, ні у варіантах опитування."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він не тримає й не збирає гроші. Внески йдуть покупцеві банківським переказом, готівкою чи чим завгодно, а потім хтось їх записує."
      - "Він не надсилає нагадувань про платежі. Підштовхувати того, хто ще не заплатив, як і раніше, має людина."
      - "Він не обчислює нічию частку. Опитування погоджує бюджет, а варіанта «поділити те, що лишилося» немає, тож кожну суму ви вводите самі."
      - "У кожної витрати один платник. Якщо двоє купили різні частини подарунка, внесіть дві витрати."
      - "Кожен, хто бере участь у розподілі, потребує безкоштовного облікового запису й місця в групі."
exampleAfter: 2
