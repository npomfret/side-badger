meta:
  title: "تقسیم هزینه‌ها در 140 ارز، تبدیل‌شده یا جداگانه"
  description: "هر هزینه را با ارزی که پرداخت کرده‌اید وارد کنید، مانده‌ها را جدا نگه دارید یا با نرخی که می‌بینید و می‌توانید عوض کنید تبدیل کنید، و بعد با فهرست کوتاهی از پرداخت‌ها تسویه کنید."
h1: "تقسیم هزینه‌ها در 140 ارز"
navLabel: "چند ارز"
lead: "یورو، ین، و همان یک تاکسی که به بات بود. Side Badger هر هزینه را با ارزی که پرداخت کرده‌اید می‌پذیرد، مانده‌ها را مرتب نگه می‌دارد و وقتی گروه ترجیح می‌دهد یک‌جا تسویه کند می‌تواند تبدیل کند. در 140 ارز کار می‌کند و برای [سفرهای گروهی](page:use-case/group-trips) طبیعی است."
cta:
  heading: "یوروهایتان را بیاورید، ین‌هایتان را هم"
  body: "یک حساب بسازید، گروه را شروع کنید و اولین هزینه را با هر ارزی که اتفاقاً در دست داشتید اضافه کنید."
problem:
  heading: "همان‌طور که پرداخت کردید وارد کنید"
  body: "سفر به‌ندرت با یک ارز پرداخت می‌شود. هتل از خانه با پوند رزرو شد، شام با ین حساب شد و قهوه فرودگاه با هر ارزی که توقف بین‌راهی داشت. اینکه همه‌چیز را پیش از تایپ کردن دستی تبدیل کنید همان چیزی است که جدول‌ها را رها شده می‌کند. در Side Badger هر هزینه را با ارزی که روی رسید است وارد می‌کنید و هر مبلغ از قواعد ارز خودش پیروی می‌کند، پس ین اعشار ندارد و دینار سه رقم اعشار دارد. ارزهایی که اخیراً استفاده کرده‌اید اول فهرست می‌آیند."
workflow:
  heading: "ارزها را جدا نگه دارید یا همراه با ثبت تبدیل کنید"
  steps:
    - title: "هزینه را با ارز خودش اضافه کنید"
      body: "ارز را انتخاب کنید، مبلغ را بنویسید و بگویید چه کسی پرداخت کرد و چه کسانی سهیم بودند. چیز دیگری لازم نیست. این حالت پیش‌فرض است و مبلغ اصلی را دقیقاً همان‌طور که وارد کردید نگه می‌دارد."
      shot: S07
      shotAlt: "فرم هزینه با مبلغ به ین"
    - title: "برای هر ارز یک مانده ببینید"
      body: "مانده‌ها برای هر ارز جداگانه نگه داشته می‌شوند و هرکدام فهرست کوتاه پرداخت‌های پیشنهادی خودش را دارد. پوندها با پوند تسویه می‌شوند و ین‌ها با ین."
      shot: S10
      shotAlt: "صفحه مانده‌ها با بدهی‌های ساده‌شده در دو ارز"
    - title: "یا وقتی گروه ترجیح می‌دهد یک‌جا تسویه کند، تبدیل کنید"
      body: "هنگام ثبت هزینه ارز دیگری را انتخاب کنید و Side Badger می‌تواند آن را با نرخ تبدیل روز تبدیل کند که می‌توانید به نرخی که واقعاً گرفته‌اید تغییرش دهید. مبلغ تبدیل‌شده به مانده آن ارز اضافه می‌شود. تبدیل انتخابی است که گروه می‌کند، نه چیزی که پشت سر شما اتفاق بیفتد."
options:
  heading: "نرخی که می‌بینید و می‌توانید تغییر دهید"
  items:
    - title: "نرخ نشان داده می‌شود"
      body: "وقتی تبدیل می‌کنید، نرخ و مبلغ تبدیل‌شده روی فرم دیده می‌شوند، پس کسی مجبور نیست عددی را چشم‌بسته قبول کند."
    - title: "نرخ خودتان را بنویسید"
      body: "از صرافی نرخ بهتر گرفتید، یا از فرودگاه نرخ بدتر؟ نرخ را به همان که واقعاً گرفتید تغییر دهید تا مبلغ تبدیل‌شده به‌روز شود."
    - title: "مبلغ اصلی می‌ماند"
      body: "مبلغ اصلی کنار مبلغ تبدیل‌شده روی هزینه می‌ماند، برای کسی که بپرسد به ین چقدر بود."
    - title: "تبدیل رایگان است"
      body: "تبدیل هزینه‌ای ندارد. برای وارد کردن هزینه به ارز دیگر کارمزدی نیست."
