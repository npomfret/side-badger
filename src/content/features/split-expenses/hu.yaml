sections:
  - heading: "Csak azok, akik ott voltak"
    body: "Oszd fel a költséget mindenki között, vagy csak azok között, akik osztoztak rajta. Hagyd ki az embereket azokból a költségekből, amelyekben nem vettek részt, és az egyenlegek ezt tükrözik. Az a lakótárs, aki egész héten távol volt, nem tartozik az elvitelért, amit a [lakótársak](page:use-case/housemates) alapvető igazságosságként ismernek fel."
  - heading: "A részletek, amelyek később vitát spórolnak"
    items:
      - "Állítsd be a **dátumot** és opcionálisan az időt. Az olyan gyorsparancsok, mint a ma, a tegnap, a ma reggel és a tegnap este, spórolnak egy kis gépeléssel."
      - "Adj hozzá legfeljebb három **címkét** a költségek csoportosításához, például bevásárlás vagy utazás."
      - "Add meg a **helyet**. Illessz be egy térképlinket, és a hely neve magától kitöltődik."
      - "Írj egy **megjegyzést** a szám mögötti történetről, némi formázással, ha a történet megkívánja."
      - "Csatolj legfeljebb három **nyugtát** fényképként vagy PDF-ként, hogy a bizonyíték a költségnél maradjon."
      - "Használd a **kommenteket**, hogy a beszélgetés a költség mellett maradjon, amelyről szól, és ne egy csevegőszálban, amelyhez senki nem görget vissza."
  - heading: "Másolj, szerkessz, és nézd meg, mi változott"
    body: "Másold le a múlt havi lakbért ahelyett, hogy újra begépelnéd, és változtasd meg, ami más. Ha egy szám rossz volt, szerkeszd a költséget. A korábbi változat megmarad, a szerkesztés pedig megjelenik a csoport tevékenységében, így senki nem változtat meg egy számot csendben. Hogy ki mit szerkeszthet, a csoport jogosultságaitól függ."
  - heading: "Amikor valami rossznak tűnik"
    body: "Egy csoport bekapcsolhatja a költségkérdéseket. Bárki, aki szerepel egy költségben, feltehet egy kérdést, és megmondhatja, miért, a költség pedig kimarad az egyenlegekből, amíg a kérdező vagy egy adminisztrátor le nem zárja. Alapértelmezés szerint ki van kapcsolva, és egy adminisztrátor kapcsolja be a csoportnak. Jól jön a [rendezvényekhez és ünnepekhez](page:use-case/events-and-celebrations), ahol a foglaló, amelyre senki nem emlékszik, hirtelen mindenki ügye lesz."
limits:
  heading: "Korlátok"
  items:
    - "Minden költséget egy ember fizet. Ha ketten fizettek, rögzíts két költséget."
    - "Nincs tételenkénti felosztás és nincs részarányos felosztás. Az egyenlő, a pontos összegek és a százalékok léteznek."
    - "A százalékoknak együtt 100-at kell kiadniuk."
    - "Egy költség legfeljebb 999 999,99 lehet a saját pénznemében, az adott pénznem szokásos tizedesjegyeivel."
    - "A költségek nem ismétlődnek maguktól. Másold le helyette a múlt havit."
    - "A dátum nem lehet a jövőben, és nem lehet 10 évnél régebbi."
    - "Az a költség, amelyben olyasvalaki érintett, aki elhagyta a csoportot, csak olvashatóvá válik."
useCasesHeading: "Hol segít ez a fajta felosztás"
faq:
  heading: "Kérdések"
  items:
    - q: "Fizethet két ember egy költséget?"
      a: "Nem egy költségben. Rögzíts kettőt, egyet-egyet minden fizetőnek, és az egyenlegek ugyanúgy jönnek ki."
    - q: "Feloszthatok egy nyugtát tételenként?"
      a: "Nem. A felosztás egyenlő, pontos összegek szerinti vagy százalékos. Különböző tételekből álló számlánál írd be pontos összegekként, mennyivel tartozik az egyes ember."
    - q: "Beállíthatok alapértelmezett felosztást?"
      a: "Nem. Másolj le egy korábbi költséget, hogy újra használd a felosztását, és változtasd meg, ami más."
    - q: "Ismétlődhetnek a számlák havonta?"
      a: "Nem. Másold le helyette a múlt havi költséget, ami pár másodperc."
    - q: "Ki szerkeszthet egy költséget?"
      a: "Aki a csoport jogosultságai szerint megteheti. Minden szerkesztés megjelenik a csoport tevékenységében, így a változtatások sosem csendesek."
    - q: "Mi történik utána az egyenlegekkel?"
      a: "Frissülnek, ahogy a költségek érkeznek, az [elszámolás](page:feature/settle-up) pedig egy rövid kifizetéslistává alakítja őket. Ha egy költség másik pénznemben van, lásd a [több pénznemet](page:feature/multiple-currencies)."
