meta:
  title: "Ділення рахунків без завантаження застосунку | Side Badger"
  description: "Телефон повний, розуміємо. Side Badger працює в браузері, без магазину застосунків і завантаження. Додайте на головний екран, і він відкриватиметься як застосунок."
h1: "Без магазину застосунків. Без завантаження. Але як застосунок"
navLabel: "Вебзастосунок"
lead: "Side Badger живе у вашому браузері. Не треба шукати в магазині застосунків і нічого завантажувати наперед. Заходьте з телефона чи комп'ютера, діліть витрати онлайн зі своєю групою й додайте його на головний екран чи в Dock, коли хочете мати під рукою одним дотиком."
cta:
  heading: "Відкрийте. Увійдіть. Заведіть групу."
  body: "Створіть обліковий запис, заведіть групу й додайте першу витрату, не виходячи з браузера, який уже відкритий. Хочете спершу екскурсію? Дивіться [як це працює](page:how-it-works) або [що входить у безкоштовне](page:pricing)."
problem:
  heading: "Телефон повний. Розуміємо."
  body: "Десь на ньому чотири тисячі фото одного й того самого заходу сонця та попередження про пам'ять, яке ви відсуваєте з весни. Останнє, що йому потрібне, — ще один застосунок лише заради однієї вечері. Тому Side Badger є вебзастосунком. Він працює в сучасному браузері на телефоні чи комп'ютері. На телефоні він використовує мобільні макети, де сторінка групи поділена на вкладки, і зручні для дотику елементи керування. Деякі додаткові можливості, як-от додавання на головний екран, залежать від вашого браузера, і ми кажемо, де саме."
workflow:
  heading: "Від вкладки браузера до головного екрана за три кроки"
  steps:
    - title: "Відкрийте й увійдіть"
      body: "Перейдіть до Side Badger у браузері й увійдіть. Усе, що потрібно, — адреса електронної пошти й пароль, а перш ніж щось додавати, пошту треба підтвердити. Кожен у групі потребує облікового запису, тож люди, яких ви запросите, зроблять те саме."
    - title: "Додайте на головний екран або в Dock"
      body: "Щойно ви ввійшли, застосунок пропонує встановити себе. Там, де браузер дозволяє, є кнопка **Установити**, а там, де ні, — **Покажіть, як**. Пропустили або відмовилися? У **Налаштуваннях** така сама підказка є в розділі **Додати на головний екран або в Dock**. На iPhone чи iPad Налаштування спершу показують кроки для iPhone, а інші пристрої ховають під **Інші пристрої**. У будь-якому разі застосунок потім відкривається у власному вікні."
      shot: S20
      shotAlt: "Розділ «Додати на головний екран або в Dock» у Налаштуваннях із кроками додавання застосунку на пристрій"
    - title: "Увімкніть сповіщення, якщо хочете"
      body: "Сповіщення вимкнені, доки ви їх не ввімкнете, і кожен пристрій вмикається окремо. Скористайтеся кнопкою **Ввімкнути** на дзвіночку сповіщень або перемикачем **Push-сповіщення** в **Налаштуваннях**. На iPhone чи iPad спершу відкрийте застосунок з головного екрана. Лише там сповіщення й працюють."
      shot: S19
      shotAlt: "Відкритий випадний список сповіщень із переліком останньої активності в групі"
options:
  heading: "Як додати, пристрій за пристроєм"
  items:
    - title: "iPhone і iPad"
      body: "Торкніться кнопки «Поділитися», квадрата зі стрілкою вгору. Якщо її не видно, спершу торкніться трьох крапок (•••), потім «Поділитися». Прокрутіть униз і торкніться **На початковий екран**. Залиште ввімкненим **Відкрити як вебзастосунок**, потім торкніться **Додати**. Якщо посилання відкрилося всередині іншого застосунку, спершу відкрийте сторінку в Safari, бо вбудований браузер додати її не може."
    - title: "Android"
      body: "Відкрийте меню браузера й виберіть **Додати на головний екран** або **Установити застосунок**."
    - title: "Chrome чи Edge на комп'ютері"
      body: "Відкрийте меню браузера й виберіть варіант установлення цього сайту як застосунку. Тоді він матиме власне вікно та власну іконку."
    - title: "Safari на Mac"
      body: "Виберіть **Файл**, потім **Додати до Dock**."
sections:
  - heading: "Сповіщення лише якщо ви попросите"
    body: "Push-сповіщення необов'язкові. Увімкніть їх, і ви отримуватимете сповіщення про нову активність у ваших групах, наприклад коли хтось додав витрату, залишив коментар чи записав платіж. Вони вмикаються по одному пристрою за раз, з дзвіночка сповіщень або з **Налаштувань**, і там же їх можна вимкнути. Їм потрібен браузер, що їх підтримує, і ваш дозвіл. Якщо браузер заблокував їх для сайту, спершу дозвольте в налаштуваннях браузера. На iPhone чи iPad вони працюють лише із застосунку, доданого на головний екран, а не з вкладки браузера. Доставку не гарантовано, тож вважайте сповіщення підштовхуванням, а не обіцянкою. Що з'являється в стрічці, читайте в [плануйте разом](page:feature/plan-together)."
  - heading: "Живі оновлення, без кнопки оновити"
    body: "Додайте витрату, і всі побачать її одразу, разом із тим, що змінилося і хто це змінив. Кожна група веде історію активності, а дзвіночок сповіщень показує активність в усіх ваших групах. Нікому не доведеться питати, чи ви бачили те, що щойно додали. Воно вже на їхньому екрані."
  - heading: "39 мов, кожен має свою"
    body: "Користуйтеся Side Badger 39 мовами, зокрема арабською, перською й урду, що пишуться справа наліво. Кожен у групі обирає свою, тож та сама сторінка групи може бути арабською в однієї людини й англійською в наступної. Єдине, на чому має погодитися група, — це цифри."
  - heading: "Створено для різних користувачів"
    body: "Side Badger створено з думкою про користувачів клавіатури та програм зчитування з екрана. Кольори учасників мають візерунки, тож не доведеться розрізняти зелений і червоний."
    items:
      - "Посилання для пропуску, щоб користувачі клавіатури могли одразу перейти до вмісту."
      - "Діалоги керують фокусом клавіатури."
      - "Елементи керування мають підписи для програм зчитування з екрана."
      - "Макети віддзеркалюються для мов, що пишуться справа наліво."
limits:
  heading: "Чого вебзастосунок не робить"
  items:
    - "Офлайн-режиму немає. Side Badger потребує підключення, тож у літаку без wifi він вашу групу не відкриє."
    - "Немає застосунку в магазині й рідного застосунку для iPhone чи Android. Side Badger є вебзастосунком, а додавання на головний екран чи в Dock — спосіб отримати версію, схожу на застосунок."
    - "Додавання на головний екран чи в Dock залежить від браузера. Назви меню різняться між браузерами та версіями, а деякі браузери цього не пропонують."
    - "Push-сповіщення вмикаються окремо для кожного пристрою й потребують браузера, що їх підтримує, та вашого дозволу. На iPhone чи iPad вони працюють лише із застосунку, доданого на головний екран. Доставку не гарантовано."
    - "Сповіщень електронною поштою чи SMS і нагадувань про платежі немає. Нова активність показується в застосунку, а також push-сповіщеннями, якщо ви їх увімкнете. Наздоганяти платіж усе одно вам."
    - "Активність зберігається 90 днів."
    - "Ви входите за адресою електронної пошти й паролем. Входу через Google чи Apple немає, і вам має бути 18 років або більше."
    - "Ми не стверджуємо, що Side Badger повністю доступний чи відповідає формальному стандарту доступності. Якщо щось заважає, повідомте нам просто із застосунку, і відповідь ви побачите там же."
useCasesHeading: "Де допомагає відсутність застосунку"
faq:
  heading: "Запитання"
  items:
    - q: "Чи є Side Badger у магазині застосунків?"
      a: "Ні. Side Badger є вебзастосунком. Ви відкриваєте його в браузері й можете додати на головний екран чи в Dock, щоб він відкривався як застосунок. Нічого завантажувати з магазину застосунків не треба."
    - q: "Чи можна ділити рахунки без завантаження застосунку?"
      a: "Так. Відкрийте Side Badger у браузері на телефоні чи комп'ютері, увійдіть і заведіть групу. Додавання на головний екран чи в Dock необов'язкове."
    - q: "Чи працює він офлайн?"
      a: "Ні. Side Badger потребує підключення, навіть коли його додано на головний екран чи в Dock."
    - q: "Чому я не отримую сповіщень на iPhone?"
      a: "На iPhone чи iPad сповіщення працюють лише із застосунку, доданого на головний екран, а не з вкладки браузера. Додайте його, відкрийте за іконкою на головному екрані, потім ввімкніть сповіщення в **Налаштуваннях**. Доставку не гарантовано, тож якщо якесь пропало, історія активності групи все одно покаже, що додали."
    - q: "Чи мушу я вмикати сповіщення?"
      a: "Ні. Вони вимкнені, доки ви їх не ввімкнете, по одному пристрою за раз. Без них нова активність усе одно показується в застосунку, і всі бачать зміну одразу, коли він відкритий."
    - q: "Чи потрібен обліковий запис кожному в групі?"
      a: "Так. Усе, що потрібно, — адреса електронної пошти й пароль, а перш ніж щось додавати, пошту треба підтвердити. Кожен, хто приєднується до групи, робить те саме, на будь-якому телефоні чи комп'ютері."
