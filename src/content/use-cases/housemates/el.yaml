meta:
  title: "Μοιραστείτε τους λογαριασμούς του σπιτιού με συγκατοίκους"
  description: "Χωρίστε το ενοίκιο ανάλογα με το μέγεθος του δωματίου, το ρεύμα και τα ψώνια εξίσου και δείτε κάθε μήνα ποιος χρωστά σε ποιον. Ένας δωρεάν τρόπος να κρατούν οι συγκάτοικοι τον λογαριασμό."
h1: "Μοιραστείτε τους λογαριασμούς του σπιτιού με συγκατοίκους"
navLabel: "Συγκάτοικοι"
lead: "Για τον συγκάτοικο που αγοράζει το χαρτί υγείας και τους συγκατοίκους που δεν το βλέπουν ποτέ να γίνεται. Το Side Badger κρατά έναν τρέχοντα λογαριασμό για το ενοίκιο, τους λογαριασμούς και τα ψώνια των **συγκατοίκων**, ώστε κανείς να μην κυνηγά κανέναν και το ψυγείο να ξαναγίνει απλώς ψυγείο."
cta:
  heading: "Ξεκινήστε με το δικό σας σπίτι"
  body: "Δημιουργήστε λογαριασμό, φτιάξτε μια ομάδα για το σπίτι και στείλτε σε όλους τον σύνδεσμο πρόσκλησης. Οι λογαριασμοί αυτού του μήνα μπορούν να μπουν απόψε."
scenario:
  heading: "Στήστε το σπίτι"
  body: "Φτιάξτε μια ομάδα για το σπίτι, διαλέξτε το όνομα που θέλετε να βλέπουν οι άλλοι και προσκαλέστε όλους με σύνδεσμο ή κωδικό QR. Η ομάδα μπορεί να είναι ανοιχτή, όπου όλοι προσθέτουν και επεξεργάζονται, ή διαχειριζόμενη, όπου τα νέα μέλη χρειάζονται έγκριση διαχειριστή και μόνο οι δημιουργοί και οι διαχειριστές αλλάζουν έξοδα, κάτι που ταιριάζει στον συγκάτοικο που κρατά τα βιβλία. Όποιος θέλει απλώς να βλέπει τους αριθμούς μπορεί να είναι θεατής, που βλέπει τα πάντα και δεν αλλάζει τίποτα. Όλοι βλέπουν ένα νέο έξοδο αμέσως, οπότε το «θα το προσθέσω αργότερα» έχει λιγότερα μέρη να κρυφτεί."
sections:
  - heading: "Ενοίκιο και λογαριασμοί"
    body: "Το ενοίκιο σπάνια διαιρείται με το τέσσερα, επειδή τα υπνοδωμάτια δεν είναι ίδια. Χωρίστε το με ποσοστά, ώστε το μεγάλο δωμάτιο να πληρώνει περισσότερα και η ντουλάπα με παράθυρο λιγότερα. Τα ποσοστά πρέπει να κάνουν συνολικά 100. Οι λογαριασμοί που χρησιμοποιούν όλοι παίρνουν εξίσου διαχωρισμό και ένας συγκάτοικος που δεν είχε μέρος σε ένα έξοδο μπορεί να μείνει έξω από αυτό. Όταν ένας εξίσου διαχωρισμός αφήνει ένα περιττό λεπτό, πηγαίνει σε ένα άτομο τυχαία. Δεν υπάρχουν επαναλαμβανόμενοι λογαριασμοί, οπότε κάθε μήνα αντιγράφετε το ενοίκιο του προηγούμενου μήνα, αλλάζετε την ημερομηνία και συνεχίζετε."
  - heading: "Τα κοινά ψώνια"
    body: "Κρατήστε την κοινή λίστα ψωνιών στην ίδια ομάδα με τους λογαριασμούς των ψωνιών και τσεκάρετε τα είδη καθώς φτάνουν στο καλάθι. Όποιος κάνει τα ψώνια προσθέτει το σύνολο της απόδειξης ως έξοδο και το χωρίζει εξίσου ή μόνο ανάμεσα στα άτομα που θα το φάνε. Το ποιος αγοράζει συνέχεια το γάλα βρώμης που δεν πίνει κανείς άλλος μένει υπόθεση του σπιτιού, αλλά τουλάχιστον η λίστα εξόδων θα είναι ακριβής. Τα δικαιώματα της ομάδας ορίζουν ποιος μπορεί να δημιουργεί και να επεξεργάζεται λίστες. Βάλτε μαζί το ενοίκιο, τους λογαριασμούς και τα ψώνια και βγαίνει ένας μήνας σαν τον παρακάτω, σε ένα σπίτι τεσσάρων: η Τζο πληρώνει 2.000 £ ενοίκιο, χωρισμένο 30%, 25%, 25% και 20% ανάλογα με το δωμάτιο, μετά ο Κουάμε πληρώνει 120 £ για ρεύμα, η Λένα 40 £ για ίντερνετ και ο Ματ 80 £ για ψώνια, καθένα χωρισμένο εξίσου. Η Τζο καταλήγει να της οφείλονται 1.340 £ και το Side Badger προτείνει τρεις πληρωμές, όλες προς την Τζο."
  - heading: "Δίκαιοι τρόποι να χωρίσετε τα έξοδα του σπιτιού"
    items:
      - "**Εξίσου** ταιριάζει σε ό,τι χρησιμοποιούν όλοι περίπου το ίδιο, όπως το ίντερνετ, τα καθαριστικά και τα κοινά ψώνια. Είναι γρήγορο και κανείς δεν χρειάζεται να μαλώσει για τα μαθηματικά."
      - "**Ανάλογα με το δωμάτιο** ταιριάζει στο ενοίκιο, επειδή τα δωμάτια διαφέρουν και διαφέρει και το πόσα είναι διατεθειμένοι να πληρώσουν οι άνθρωποι γι' αυτά. Συμφωνήστε τα ποσοστά μία φορά, όταν μπαίνει κάποιος, και χρησιμοποιήστε τα κάθε μήνα."
      - "**Ανάλογα με τη χρήση** ταιριάζει σε λογαριασμούς όπου ένα άτομο σαφώς χρησιμοποιεί περισσότερο, όπως ο λογαριασμός θέρμανσης ενός γραφείου στο σπίτι ή μια συνδρομή streaming που βλέπουν δύο άτομα. Αφήστε έξω όσους δεν είχαν μέρος ή βάλτε ακριβή ποσά για τον καθένα."
      - "Όποιον κι αν διαλέξετε, συμφωνήστε τον πριν από τον πρώτο λογαριασμό και όχι μετά τον πρώτο καβγά, και γράψτε τον κανόνα κάπου που τον βλέπει όλο το σπίτι."
  - heading: "Όταν κάποιος μετακομίζει"
    body: "Τακτοποιείται πρώτα. Κανείς δεν μπορεί να αφήσει μια ομάδα όσο χρωστά ή του χρωστούν χρήματα, οπότε όποιος φεύγει πληρώνει ή πληρώνεται, εσείς το καταγράφετε και μετά φεύγει. Συνεχίστε την ομάδα για τους συγκατοίκους που μένουν και προσκαλέστε το νέο άτομο με σύνδεσμο. Όταν τελειώσει το ίδιο το σπίτι, ένας διαχειριστής μπορεί να κλειδώσει την ομάδα ώστε τα νούμερα να μείνουν στη θέση τους ή να την κλείσει οριστικά, κάτι που την κάνει απρόσιτη για όλους, οπότε κάντε το μόνο όταν κανείς δεν χρειάζεται το ιστορικό."
exampleAfter: 2
