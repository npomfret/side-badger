meta:
  title: "Діліть витрати групової поїздки у 140 валютах"
  description: "Ведіть облік, хто що оплатив у груповій поїздці, вводьте витрати в місцевій валюті, конвертуйте їх чи ні й розрахуйтеся раз наприкінці. Безкоштовно, у браузері."
h1: "Діліть витрати групової поїздки у 140 валютах"
navLabel: "Групові поїздки"
lead: "Ведіть облік вілли, таксі й того одного раунду коктейлів, який ніхто не пам'ятає, щоб вигукував «я плачу». Side Badger веде поточний рахунок, поки ви в дорозі, [упорається з фунтами, євро та 138 іншими валютами](page:feature/multiple-currencies) і дасть вам [короткий список платежів](page:feature/settle-up), коли ви повернетеся додому."
cta:
  heading: "Канікулярна арифметика, закрита, поки не зійшла засмага"
  body: "Створіть групу, надішліть посилання із запрошенням людям із поїздки й додавайте витрати в міру їх виникнення."
  button: "Створити безкоштовний обліковий запис"
scenario:
  heading: "Кожен за щось заплатив, у якійсь валюті"
  body: "Хтось забронював перельоти, хтось інший поставив віллу на картку, а третя людина покрила вечерю готівкою. До третього дня ніхто не знає, хто в плюсі. Питання просте, хоч відповідь зазвичай живе в таблиці, яку ніхто не хоче відкривати. Хто що оплатив, у якій валюті й як усі розраховуються раз наприкінці?"
sections:
  - heading: "Перед від'їздом"
    body: "Винесіть добірку вілл на голосування, за бажання анонімно, щоб рішення належало групі, а не тому, хто довше дується. Потім тримайте спільний список покупок поруч із чеками за покупки, щоб ніхто не купив три тюбики сонцезахисного крему й жодного перехідника для розетки."
  - heading: "Поки ви в дорозі"
    body: "Додавайте кожну витрату, коли вона виникає, у валюті, в якій її оплачено. Сфотографуйте чек, і Side Badger заповнить загальну суму, дату та місце, щоб ви їх перевірили; зображення чеків читає ШІ-сервіс Google. Конвертуйте суму за актуальним курсом обміну, який можна змінити на той, що діяв під час обміну, а початкова сума лишиться біля витрати. Або залиште євро як євро й вирішіть пізніше. Група також може обрати одну валюту, і нові витрати конвертуватимуться в неї автоматично."
  - heading: "Не кожен робив усе"
    body: "Дехто пропустив вечерю, дехто не плив на човні. Пропустіть їх у витратах, до яких вони не причетні, а решту розділіть [порівну, за точними сумами або у відсотках](page:feature/split-expenses). Ніхто не платить за ту частину поїздки, яку проспав."
  - heading: "Розрахуйтеся, коли повернетеся додому"
    body: "Side Badger підказує короткий список платежів, який розраховує всіх. Платіть одне одному як зручно, а потім запишіть. З різними валютами ведіть кожну окремо або конвертуйте на ходу; лісабонський приклад нижче показує обидва варіанти."
  - heading: "Парубочі та дівочі вікенди"
    body: "Вікенд із почесним гостем потребує трохи більше адміністрування. Зробіть керовану групу, де адміністратори схвалюють нових учасників, а витрати можуть змінювати лише творці й адміністратори. Для частки почесного гостя використовуйте точні суми, обмежте групу валютами, якими ви справді користуєтеся, і заблокуйте групу, коли все скінчиться, щоб цифри лишилися на місці."
exampleAfter: 4
example:
  heading: "Четверо друзів у Лісабоні"
  currency: GBP
  people:
    - id: ana
      name: Ана
    - id: ben
      name: Бен
    - id: chloe
      name: Хлоя
    - id: dev
      name: Дев
  expenses:
    - label: "Перельоти"
      payer: ana
      amount: 480
      split:
        method: equal
    - label: "Вілла"
      payer: ben
      amount: 900
      currency: EUR
      split:
        method: equal
    - label: "Вечеря"
      payer: chloe
      amount: 120
      currency: EUR
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "Прогулянка на човні"
      payer: dev
      amount: 160
      currency: EUR
      split:
        method: equal
  conversion:
    rates:
      EUR: 0.85
featuresHeading: "На чому тримається поїздка"
faq:
  heading: "Запитання"
  items:
    - q: "Чи можна виключити тих, хто пропустив вечерю?"
      a: "Так. Оберіть, хто брав участь у кожній витраті, і лише їм її нараховують."
    - q: "Чи працює без зв'язку?"
      a: "Ні. Side Badger потрібне з'єднання, тож додайте витрати, коли повернетеся до wifi."
    - q: "Чи потрібно всім щось встановлювати?"
      a: "Ні. Він працює в браузері. Надішліть посилання із запрошенням, і люди приєднаються зі своїх телефонів."
    - q: "Який курс обміну він використовує?"
      a: "Актуальний курс обміну під час введення витрати або ваш власний, якщо у вас був інший. Курс фіксується, коли витрату збережено, тож старі витрати ніколи не переоцінюються."
    - q: "Чи можна заморозити групу після поїздки?"
      a: "Так. Адміністратор може заблокувати групу, щоб цифри лишилися на місці."
    - q: "Чи є обмеження на суми?"
      a: "Так. 999 999,99 на витрату, у її власній валюті."
