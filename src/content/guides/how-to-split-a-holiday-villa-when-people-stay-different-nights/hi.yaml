faq:
  heading: "विला के सवाल"
  items:
    - q: "अगर कोई कैंसिल कर दे तो?"
      a: "उनकी रातें हटाएं, हिसाब दोबारा लगाएं और विला का खर्च एडिट करें ताकि सटीक राशियों का जोड़ फिर कीमत के बराबर हो जाए। पहले वाला वर्शन सुरक्षित रहता है और एडिट ग्रुप की एक्टिविटी में दिखता है, इसलिए कोई चुपके से कोई संख्या नहीं बदलता। कौन एडिट कर सकता है, यह ग्रुप की अनुमतियों पर निर्भर है।"
    - q: "क्या बुकिंग करने वाला कम दे?"
      a: "यह ग्रुप तय करे। बुकिंग करना एक झंझट का काम है, और ग्रुप इस पर अलग-अलग राय रखते हैं कि इसके बदले छूट मिलनी चाहिए या नहीं। जो भी तय हो, उसे सटीक राशियों में डालें और खर्च पर एक नोट में, या उसके पास कमेंट में, लिख दें, ताकि किसी को सौदा याद न रखना पड़े।"
    - q: "क्या सफाई शुल्क अलग तरह से बांट सकते हैं?"
      a: "हाँ। शुल्क को अलग खर्च के रूप में डालें और उसे उसका अपना बंटवारा दें। पूरे घर के एक तय शुल्क के लिए बराबर बंटवारा ठीक रहता है। जो ग्रुप चाहता है कि शुल्क भी रातों के हिसाब से चले, उसके लिए सटीक राशियाँ ठीक हैं।"
