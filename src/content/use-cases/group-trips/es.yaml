featuresHeading: En qué se apoya un viaje
faq:
  heading: Preguntas
  items:
    - q: ¿Se puede dejar fuera a quien se saltó la cena?
      a: Sí. Elige quién participó en cada gasto y solo esas personas lo pagan.
    - q: ¿Funciona sin cobertura?
      a: No. Side Badger necesita conexión, así que añade los gastos cuando vuelvas a tener wifi.
    - q: ¿Tiene que instalar algo todo el mundo?
      a: No. Funciona en el navegador. Envía el enlace de invitación y la gente se une desde el móvil.
    - q: ¿Qué tipo de cambio usa?
      a: Un tipo de cambio actual al introducir el gasto, o el tuyo si te aplicaron otro. El tipo queda fijado al guardar el gasto, así que los gastos antiguos nunca se revalorizan.
    - q: ¿Podemos congelar el grupo después del viaje?
      a: Sí. Un administrador puede bloquear el grupo para que los números no se muevan.
    - q: ¿Hay un límite en los importes?
      a: Sí. 999,999.99 por gasto, en su propia moneda.
