meta:
  title: "Nola bildu talde-opari baterako dirua | Side Badger"
  description: "Denek zenbateko desberdina jartzen dute eta norbaiten txartelak hartzen du kolpea. Egin aurrekontu-inkesta, sartu zenbateko zehatzak, utzi kontuak Side Badger-i."
h1: "Nola bildu talde-opari baterako dirua"
navLabel: "Talde-opari baterako dirua"
lead: "Talde-opari baterako dirua biltzea da pertsona batek dirua aurreratzea eta gainerako guztiek bere ekarpena zor izatea. Adostu aurrekontu bat inkesta batekin, utzi erosleak oparia bere txartelean jartzen, eta gero sartu gastu bakar gisa [zenbateko zehatzekin](page:feature/split-expenses), pertsona bakoitzarentzat zifra bat. Side Badger-ek erosleari nork zer zor dion erakusten du, eta bakoitzak bere zatia nahi duen moduan bidaltzen du."
cta:
  heading: "Pasa kapela, kapelarik gabe"
  body: "Egin talde bat, utzi oparia jasoko duena kanpoan eta sartu oparia zenbateko zehatzekin. Side Badger doakoa da, iragarkirik gabe eta eguneko mugarik gabe. Lehenik ikuspegi orokorra nahi duzu? Ikusi [nola funtzionatzen duen](page:how-it-works) edo [doakoak zer hartzen duen](page:pricing)."
sections:
  - heading: "Lau lagun, diskojogailu bat, lau zenbateko desberdin"
    body: "Bea 30 urte betetzen ari da eta diskojogailu bat nahi du. Priya, Omar, Lena eta Sam dira oparia egingo diotenak. Priyak 240 £-ko diskojogailu bat aurkitzen du eta bere txartelean erosten du, norbaitek lehena izan behar duelako. Lauek ez dute berdin jartzen. Priyak eta Omarrek 60 £ jartzen dute bakoitzak, Lenak 80 £ eta Samek 40 £. Inork ez du bere zifra azaltzen eta inork ez du galdetzen. Omarrek txartel bat eta biltzeko papera ere erosten ditu 12 £-ren truke. Lauek sinatzen dute txartela, beraz hori berdin banatzen da."
  - heading: "Adostu aurrekontua inork “Erosi” sakatu baino lehen"
    body: "Aurrekontu-inkesta batek 400 £-ko diskojogailu baten inguruko eztabaida aurrezten du. Taldean, aukeratu **Gehitu inkesta** eta galdetu zenbat kostatu behar duen oparia. Egin aukerak zenbatekoak, adibidez 150 £ arte, 200 £ arte eta 250 £ arte. Aktibatu **Boto anonimoa**, nork zer bozkatu duen ezkutatzen duena, inork zifra txikiago bat ozen defendatu behar izan ez dezan. Lehen botoa eman ondoren ezin dira ezarpenak aldatu, beraz egiaztatu lehenago. Inkesta ez da bere kabuz ixten. Denek bozkatu dutenean, aukeratu **Itxi inkesta** eta **Irabazlea** agertzen da. Inkestak guztizkoa adosten du. Ez du inoren zatia ezartzen."
  - heading: "Zenbaketa irakurtzen"
    body: "Oparia 60 £, 60 £, 80 £ eta 40 £ banatzen da, eta horiek tiketeko 240 £ batzen dituzte. Txartelak eta biltzeko paperak lau lagunen artean banatuta 3 £ dira bakoitzeko. Priyaren zatia 60 £ + 3 £ da, hau da, 63 £, eta berak 240 £ ordaindu zituen, beraz 177 £ zor zaizkio. Omarren zatia ere 63 £ da, baina berak 12 £ ordaindu zituen, beraz 51 £ zor ditu. Lenak 80 £ + 3 £ zor ditu, hau da, 83 £, eta Samek 40 £ + 3 £, hau da, 43 £. Hiru horiek Priyari zor zaizkion 177 £ batzen dituzte. Horrela utzita, zorrak bost norabidetan ibiliko lirateke taldean zehar. Side Badger-ek hiru ordainketa proposatzen ditu horren ordez, denak Priyarentzat. [Kitatzeak](page:feature/settle-up) xehetasunak ditu."
  - heading: "Sartu Side Badger-en"
    body: "Priyaren aldea bost minutu inguru behar ditu."
    items:
      - "**Egin taldea.** Arbelean aukeratu **Sortu taldea**. Aukeratu **Gonbidatu beste batzuk** eta bidali esteka edo QR kodea dirua jartzen ari direnei, eta beste inori ez."
      - "**Gehitu oparia.** Aukeratu **Gehitu gastua**, deskribatu, idatzi 240 eta **Nork ordaindu du?** atalean aukeratu Priya. Mantendu lauak **Banatu honen artean** atalean, gero **Nola banatu** atalean aukeratu **Zenbateko zehatzak** eta idatzi 60, 60, 80 eta 40. Zenbatekoek 240 batu behar dute. Erantsi eskaeraren baieztapena nahi baduzu. Aukeratu **Gorde gastua**."
      - "**Gehitu txartela.** Omarrek berak gehitzen ditu 12 £, **Nork ordaindu du?** atalean bere burua aukeratzen du eta **Nola banatu** eremua **Berdin-berdin** aukeran uzten du, lau pertsonak markatuta."
      - "**Zenbatu, gero ordaindu.** Denek **Balantzeak** egiaztatzen dituzte, nork nori zor dion erakusten duena, eta Priyari bere zatia bidaltzen diote nahi duten moduan. Gero erregistratu **Kitatu** eta **Erregistratu likidazioa** erabilita. **Likidazio azkarra** aukerak zenbatekoa betetzen du."
  - heading: "Erosi lehenengo, edo bildu lehenengo"
    body: "Side Badger-ek ez du kutxa komunik gordetzen, beraz “bildu” esateak benetan “zenbatu” esan nahi du. Bi ordenak funtzionatzen dute."
    items:
      - "**Erosi lehenengo.** Erosleak ordaintzen du, benetako prezioan gehitzen du gastua eta denek berehala ikusten dute bere zatia. Txukunagoa da, baina erosleak kostua bere gain hartzen du jendeak ordaindu arte, beraz aukeratu hori ahal duen eroslea."
      - "**Bildu lehenengo.** Jendeak bere zifra erosleari bidaltzen dio erosi aurretik. Prezioa duzunean, sartu oparia, eta gero erregistratu ordainketa bakoitza dirua benetan mugitu zen egunarekin. Gehitu oparia lehenik, ordainketa bakoitzak non lurreratu saldo bat izan dezan."
      - "**Prezioa aldatzen da.** Bidalketa, deskontu-kode bat, azken orduko prezio-igoera. Editatu oparia eta aldatu zenbateko zehatzak oraindik batzen dutela ziurtatuta. Aurreko bertsioa gordetzen da, baina esan taldeari lehenik, saldoak aldatzen direlako."
  - heading: "Utzi Bea kanpoan"
    body: "Taldeko kideek bakarrik ikus dezakete taldea, beraz Beak ezin du ikusi sartuta ez dagoen talde bat. Gonbidatu dirua jartzen duten pertsonak eta beste inor ez. Esteka batek iraungi arte funtzionatzen du, eta 15 minututik 5 egunera bitarteko edozein epe aukeratu dezakezu, beraz aukeratu labur bat eta bidali Beak ikusiko ez duen toki batean. Estekak taldearen aurrebista erakusten dio irekitzen duenari, beraz jarri taldeari izen aspergarri bat, hala nola Larunbateko kutxa, eta ez sartu Bearen izena gastuen etiketetan ezta inkestako aukeretan ere."
  - heading: "Side Badger-ek hemen egiten ez duena"
    items:
      - "Ez du dirua gordetzen ezta biltzen ere. Ekarpenak erosleari doaz banku-transferentziaz, eskudirutan edo erabiltzen duzuen edozein bidez, eta gero norbaitek erregistratzen ditu."
      - "Ez du ordainketa-gogorarazpenik bidaltzen. Ordaindu ez duenari bultza egitea gizakion lana da oraindik."
      - "Ez du inoren zatia kalkulatzen. Inkesta batek aurrekontua adosten du eta ez dago “banatu geratzen dena” aukerarik, beraz zenbateko bakoitza idazten duzu."
      - "Gastu bakoitzak ordaintzaile bakarra du. Bi pertsonek opariaren zati desberdinak erosi badituzte, sartu bi gastu."
      - "Banaketan dagoen guztiak doako kontu bat eta taldean leku bat behar ditu."
