faq:
  heading: "Question dem"
  items:
    - q: "Which one fairer, room size or income?"
      a: "Neither, always. Room size suit flatmates wey dey pay for di space wey dem dey sleep inside. Income suit couples and friends wey get very different pay. Agree am before di first rent day, no be after."
    - q: "We go share di bills di same way?"
      a: "For flatmates, usually no. Everybody dey use di light and broadband, so equal-equal simpler, like for di example. By income, di calculator go give di bills di same shares as di rent."
    - q: "I fit use square feet?"
      a: "Yes. Choose ft² and type your areas for square feet. Di unit na only label, and di shares go come out di same as long as everybody use one."
    - q: "Di calculator free?"
      a: "Yes. Free. No ads. No daily limits. You no need account too."
