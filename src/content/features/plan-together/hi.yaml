sections:
  - heading: "कमेंट और रिएक्शन, संख्याओं के बगल में"
    body: "हर खर्च का अपना कमेंट थ्रेड होता है, और ग्रुप, हर सूची और हर पोल का भी। टैक्सी इतनी महंगी क्यों थी, यह टैक्सी के नीचे पूछें, उस चैट में नहीं जिसे कोई वापस स्क्रॉल नहीं करता। रसीद की फोटो या बुकिंग का PDF जोड़ें, फिर खर्चों, पेमेंट और कमेंट पर थम्स-अप, दिल, हंसी, वाह, उदास या जश्न से रिएक्ट करें। पेमेंट पहुंचे तो जश्न मनाएं। तालियों की गड़गड़ाहट के सबसे करीब Side Badger यहीं पहुंचता है।"
  - heading: "बिना झगड़ा शुरू किए खर्च पर सवाल उठाएं"
    body: "जब ग्रुप ने खर्च पर सवाल चालू किए हों, तो खर्च में शामिल कोई भी व्यक्ति **मेरा एक प्रश्न है** चुनकर वजह बता सकता है। सवाल खर्च पर कमेंट के रूप में पोस्ट होता है, खर्च पर **प्रश्नित** बैज लग जाता है, और सवाल सुलझने तक पूरा खर्च सबके बैलेंस से बाहर हो जाता है।"
    items:
      - "**इसे चालू करना।** यह डिफ़ॉल्ट रूप से बंद है। कोई एडमिन ग्रुप की सेटिंग्स में **सुविधाएँ** के नीचे **खर्च संबंधी प्रश्नों की अनुमति दें** चालू करता है।"
      - "**इसे बंद करना।** सवाल पूछने वाला या कोई एडमिन **प्रश्न बंद करें** चुनता है। अगर कई लोगों ने एक ही खर्च पर सवाल उठाया हो, तो आखिरी सवाल बंद होने पर वह बैलेंस में वापस आ जाता है।"
      - "**इसे एडिट करना।** जब कोई खर्च एडिट होता है, तो खुला सवाल उन सबके लिए नए वर्शन पर आगे चला जाता है जिनका उसमें अब भी हिस्सा है। जिन्हें एडिट खर्च से बाहर कर दे, उनका सवाल पुराने वर्शन के साथ खत्म हो जाता है, इसलिए उनके बंद करने के लिए कुछ नहीं बचता।"
      - "**उन्हें ढूंढना।** खर्चों की सूची में **केवल प्रश्नित** फिल्टर है। यह अप्रूवल का कदम नहीं है: सिर्फ वही खर्च रुकते हैं जिन पर कोई सवाल उठाता है, और बाकी सब जोड़ते ही गिना जाने लगता है।"
  - heading: "सवाल कैसे आगे बढ़ता है"
    body: "Tom £45 की पार्टी वाइन जोड़ता है, तीनों रूममेट्स में बंटी हुई। Aisha ने पी नहीं थी, इसलिए वह सवाल उठाती है, और जब तक वह खुला है वाइन किसी के बैलेंस में नहीं गिनी जाती। घर तय करता है कि वाइन Tom और Priya की है, तो Tom बंटवारा बदलकर दोनों के बीच कर देता है। Aisha अब खर्च में नहीं है, इसलिए उसका सवाल पुराने वर्शन के साथ खत्म हो जाता है, जो सुरक्षित रखा जाता है, और वाइन तुरंत बैलेंस में लौट आती है, हर एक के £22.50 पर, £15 की जगह। अगर Aisha खर्च में बनी रहती, तो उसका सवाल आगे चला जाता और उसके या किसी एडमिन के बंद करने का इंतज़ार करता। नीचे, Aisha के £48 में खरीदारी के £28 और क्लीनर के £20 हैं, और Priya का £10.50 उसके £70.50 के हिस्से (£28, £20 और £22.50) में से उसके दिए £60 घटाकर निकलता है। बिल्कुल [रूममेट्स](page:use-case/housemates) वाली किस्म की बहस। सवाल को कैसे शब्द दें, इसके लिए [जब कोई साझा खर्च पर विवाद करे तो क्या करें](page:guide/what-to-do-when-someone-disputes-a-shared-expense) देखें।"
  - heading: "साझा सूचियां, खरीदारी के लिए"
    body: "ग्रुप में एक सूची शुरू करें, उसे खरीदारी की सूची जैसा कोई नाम दें, आइटम जोड़ें और उन्हें टिक करें। आइटम को बेहतर क्रम में खींचें, प्रगति की गिनती बढ़ती देखें और जब कोई गलत ओट मिल्क ले आए तो सूची पर कमेंट करें। पूरी हो चुकी सूची को संग्रहीत करके किनारे कर दें (**संग्रहीत दिखाएं** उसे वापस लाता है), या किसी सूची को दोबारा इस्तेमाल के लिए कॉपी करें। साझा खरीदारी की सूची को खरीदारी के बिलों के पास रखें, ताकि सूची बताए क्या खरीदना है और खर्च बताए कितने का पड़ा। सूचियां कौन बना और एडिट कर सकता है, यह ग्रुप की अनुमतियों पर निर्भर करता है, जिन्हें [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) समझाता है।"
  - heading: "पोल, चाहें तो गुमनाम"
    body: "ग्रुप से कुछ ऐसा पूछें जो बिल तय करता है, जैसे कौन-सा विला, तोहफे पर कितना खर्च करना है या नाव की सैर लायक है या नहीं। पोल में एक सवाल और दो से दस विकल्प होते हैं। आप चुनते हैं कि हर व्यक्ति के कितने वोट होंगे, एक वोट से लेकर दस वोट तक, और मतदान गुमनाम होगा या नहीं। **गुमनाम मतदान** छिपाता है कि किसने किसे वोट दिया, और पहला वोट पड़ जाने के बाद इसे बदला नहीं जा सकता। पोल बंद होने तक लोग अपना वोट बदल या हटा सकते हैं, और अगर ग्रुप का मन बदल जाए तो आप उसे दोबारा खोल सकते हैं। विला चुनना ही तो [ग्रुप ट्रिप](page:use-case/group-trips) का असली काम है, और तोहफे का बजट तय करना [इवेंट और जश्न](page:use-case/events-and-celebrations) का पुराना क्लासिक।"
  - heading: "गतिविधि फ़ीड, ताकि कुछ चुपके से न बदले"
    body: "हर ग्रुप की एक गतिविधि हिस्ट्री होती है, और सूचनाओं की घंटी आपके सभी ग्रुप की गतिविधि एक जगह इकट्ठा करती है। खर्च जोड़ें और सबको वह तुरंत दिखता है, बिना रीफ्रेश किए, और फ़ीड बताती है कि क्या बदला और किसने बदला। इसमें जोड़े, एडिट किए या हटाए गए खर्च, उठाए और बंद किए गए सवाल, कमेंट, सूची और पोल के बदलाव, और रिकॉर्ड किए गए पेमेंट आते हैं।"
  - heading: "पुश सूचनाएं, अगर आप चाहें"
    body: "पुश सूचनाएं वैकल्पिक हैं। उन्हें अपनी अकाउंट **सेटिंग्स** में **सूचनाएं** के नीचे चालू करें, और जब आपके ग्रुप में कोई नई गतिविधि हो, जैसे नया खर्च या कमेंट, तो आपका डिवाइस आपको बता देता है। हर डिवाइस अलग से चालू होता है, और आपका ब्राउज़र पहले अनुमति मांगता है। iPhone या iPad पर वे सिर्फ होम स्क्रीन में जोड़े गए ऐप में काम करती हैं, जिसे [वेब ऐप](page:feature/web-app) पेज समझाता है। इन्हें सुविधा समझें, वादा नहीं, क्योंकि डिलीवरी की गारंटी नहीं है।"
limits:
  heading: "सीमाएं"
  items:
    - "कमेंट, सूचियां और पोल ग्रुप के पैसों के लिए हैं। [सेवा की शर्तें](page:terms) कहती हैं कि पोस्ट की गई हर चीज़ ग्रुप के वित्त से जुड़ी हो, इसलिए यह खर्च की प्लानिंग की जगह है, आम चैट या टू-डू ऐप नहीं।"
    - "एक कमेंट 500 अक्षर तक का हो सकता है, तीन अटैचमेंट तक, जो इमेज या PDF हों और हर एक 5 MB तक का। कमेंट सिर्फ लिखने वाला हटा सकता है।"
    - "खर्च पर सवाल डिफ़ॉल्ट रूप से बंद हैं, और एडमिन उन्हें हर ग्रुप के लिए चालू करता है। सवाल सिर्फ खर्च में शामिल लोग उठा सकते हैं, इस सुविधा को बंद करने पर हर खुला सवाल हट जाता है, और जब तक किसी के हिस्से वाले खर्च पर खुला सवाल है, वह ग्रुप नहीं छोड़ सकता।"
    - "एक ग्रुप में 100 सूचियां तक हो सकती हैं, हर एक में 200 आइटम तक, और हर आइटम 500 अक्षर तक का। ग्रुप की अनुमतियां तय करती हैं कि सूचियां कौन बना, एडिट और हटा सकता है, और लॉक किए ग्रुप में कोई बदलाव नहीं हो सकता।"
    - "एक ग्रुप में 50 पोल तक हो सकते हैं, हर एक में दो से दस विकल्प और हर व्यक्ति के दस वोट तक। पोल की कोई डेडलाइन नहीं होती और वे अपने आप बंद नहीं होते।"
    - "गतिविधि हिस्ट्री 90 दिन रखी जाती है।"
    - "पुश सूचनाएं हर अकाउंट और हर डिवाइस के लिए वैकल्पिक हैं। उन्हें ऐसा ब्राउज़र चाहिए जो उन्हें सपोर्ट करे, और आपकी अनुमति। iPhone और iPad पर वे सिर्फ होम स्क्रीन में जोड़े गए ऐप से काम करती हैं, और डिलीवरी की गारंटी नहीं है। गतिविधि के लिए कोई ईमेल या टेक्स्ट अलर्ट नहीं हैं और पेमेंट के रिमाइंडर भी नहीं, इसलिए पेमेंट के पीछे पड़ना अब भी आपके हाथ में है।"
useCasesHeading: "जहां साथ मिलकर प्लान करना काम आता है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या वोट गुमनाम हो सकते हैं?"
      a: "हाँ। पोल बनाते समय **गुमनाम मतदान** चालू करें और यह छिप जाएगा कि किसने किसे वोट दिया। पहला वोट पड़ने से पहले तय कर लें, क्योंकि बाद में इसे बदला नहीं जा सकता।"
    - q: "क्या पोल अपने आप बंद हो सकता है?"
      a: "नहीं। पोल की कोई डेडलाइन नहीं होती, इसलिए ग्रुप के फैसला कर लेने पर उसे बनाने वाला व्यक्ति **पोल बंद करें** चुनता है। अगर ग्रुप का मन बदल जाए, तो **पोल फिर से खोलें** उसे वापस ले आता है।"
    - q: "एक सूची में कितने आइटम हो सकते हैं?"
      a: "हर सूची में 200 आइटम तक और हर ग्रुप में 100 सूचियां तक। हर आइटम 500 अक्षर तक का हो सकता है, जो काफी सारा ओट मिल्क है।"
    - q: "सवाल कौन बंद कर सकता है, और तब तक खर्च का क्या होता है?"
      a: "सवाल पूछने वाला, या ग्रुप का कोई एडमिन। जब तक सवाल खुला है, पूरा खर्च सबके बैलेंस से बाहर रहता है। वह तब वापस जाता है जब उस पर आखिरी खुला सवाल बंद हो जाए, या जब कोई एडिट सवाल पूछने वाले को खर्च से बाहर कर दे।"
    - q: "क्या मैं सूचियों और कमेंट को टू-डू ऐप या ग्रुप चैट की तरह इस्तेमाल कर सकता हूँ?"
      a: "नहीं। कमेंट, सूचियां और पोल ग्रुप के पैसों के लिए हैं, जैसा [सेवा की शर्तें](page:terms) कहती हैं। खरीदारी की सूचियां, बजट के पोल और “यह £45 क्यों है?” जैसे सवाल सोचें।"
    - q: "क्या Side Badger मुझे गतिविधि के बारे में ईमेल करेगा?"
      a: "नहीं। गतिविधि के लिए कोई ईमेल या टेक्स्ट अलर्ट नहीं हैं। आप हर डिवाइस पर पुश सूचनाएं चालू कर सकते हैं, और ऐप में सूचनाओं की घंटी दिखाती है कि नया क्या है।"
