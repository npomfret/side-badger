meta:
  title: "140টি মুদ্রায় খরচ ভাগ করুন, রূপান্তর করে বা আলাদা রেখে"
  description: "প্রতিটি খরচ যে মুদ্রায় দিয়েছেন সেই মুদ্রায় লিখুন, ব্যালেন্স আলাদা রাখুন বা এমন রেটে রূপান্তর করুন যা আপনি দেখতে ও বদলাতে পারেন, তারপর পেমেন্টের একটি ছোট তালিকায় হিসাব মেটান।"
h1: "140টি মুদ্রায় খরচ ভাগ করুন"
navLabel: "একাধিক মুদ্রা"
lead: "ইউরো, ইয়েন, আর বাহ্টে দেওয়া সেই এক ট্যাক্সি। Side Badger প্রতিটি খরচ সেই মুদ্রাতেই নেয় যাতে আপনি দিয়েছেন, ব্যালেন্স সোজা রাখে, আর আপনার গ্রুপ একবারে হিসাব মেটাতে চাইলে রূপান্তরও করতে পারে। এটি 140টি মুদ্রায় কাজ করে, আর [গ্রুপ ট্রিপের](page:use-case/group-trips) জন্য একেবারে মানানসই।"
cta:
  heading: "আপনার ইউরো আনুন, আপনার ইয়েন আনুন"
  body: "অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম খরচটা যে মুদ্রা হাতে ছিল সেটাতেই যোগ করুন।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
problem:
  heading: "যেভাবে দিয়েছেন সেভাবেই লিখুন"
  body: "ট্রিপের খরচ একটি মুদ্রায় খুব কমই হয়। হোটেল বুক হয়েছিল বাড়ি থেকে পাউন্ডে, ডিনার দেওয়া হয়েছে ইয়েনে, আর এয়ারপোর্টের কফি ছিল লে-ওভারের জায়গায় যা চলে তাতে। লেখার আগেই সবকিছু হাতে রূপান্তর করতে হলে স্প্রেডশিট ছেড়ে দেওয়াই হয়। Side Badger-এ আপনি প্রতিটি খরচ রসিদে যে মুদ্রা আছে সেটাতেই লেখেন, আর প্রতিটি পরিমাণ তার মুদ্রার নিয়ম মানে, তাই ইয়েনে দশমিক নেই আর দিনারে তিনটি। সম্প্রতি ব্যবহার করা মুদ্রাগুলো তালিকায় আগে আসে।"
workflow:
  heading: "মুদ্রা আলাদা রাখুন, অথবা চলতে চলতে রূপান্তর করুন"
  steps:
    - title: "খরচটা তার নিজের মুদ্রায় যোগ করুন"
      body: "মুদ্রা বেছে নিন, পরিমাণ লিখুন, বলুন কে দিয়েছে আর কে ভাগ করেছে। আর কিছু লাগে না। এটাই ডিফল্ট, আর এটি মূল পরিমাণ ঠিক যেভাবে লিখেছেন সেভাবেই রাখে।"
      shot: S07
      shotAlt: "খরচের ফর্ম, ইয়েনের একটি পরিমাণ লেখা"
    - title: "প্রতিটি মুদ্রার জন্য আলাদা ব্যালেন্স দেখুন"
      body: "ব্যালেন্স রাখা হয় মুদ্রা ধরে আলাদাভাবে, আর প্রতিটির জন্য সাজেস্ট করা পেমেন্টের নিজস্ব ছোট তালিকা থাকে। পাউন্ডের হিসাব মেটে পাউন্ডে, ইয়েনের ইয়েনে।"
      shot: S10
      shotAlt: "ব্যালেন্সের স্ক্রিন, দুটি মুদ্রায় সহজ করা দেনা"
    - title: "অথবা রূপান্তর করুন, গ্রুপ একবারে হিসাব মেটাতে চাইলে"
      body: "খরচ লেখার সময় অন্য একটি মুদ্রা বেছে নিন, Side Badger সেটিকে বর্তমান এক্সচেঞ্জ রেটে রূপান্তর করতে পারে, যেটা আপনি আসলে যে রেট পেয়েছেন তাতে বদলাতে পারেন। রূপান্তরিত পরিমাণ সেই মুদ্রার ব্যালেন্সে যোগ হয়। রূপান্তর গ্রুপের একটি সিদ্ধান্ত, আপনার অগোচরে কিছু ঘটে না।"
options:
  heading: "এমন একটি রেট যা আপনি দেখতে ও বদলাতে পারেন"
  items:
    - title: "রেট দেখানো হয়"
      body: "রূপান্তর করলে রেট আর রূপান্তরিত পরিমাণ ফর্মে দেখা যায়, তাই কাউকে চোখ বুজে কোনো সংখ্যা বিশ্বাস করতে হয় না।"
    - title: "নিজের রেট লিখুন"
      body: "ক্যাশ ডেস্কে ভালো রেট পেয়েছেন, বা এয়ারপোর্টে খারাপ? রেটটা আসলে যা পেয়েছেন সেটায় বদলান, রূপান্তরিত পরিমাণ হালনাগাদ হবে।"
    - title: "মূল পরিমাণ থাকে"
      body: "মূল পরিমাণ খরচে রূপান্তরিত পরিমাণের পাশেই থাকে, যারা জানতে চায় ইয়েনে সেটা কত ছিল।"
    - title: "রূপান্তর বিনামূল্যে"
      body: "রূপান্তরে কিছু খরচ হয় না। অন্য মুদ্রায় খরচ লেখার জন্য কোনো ফি নেই।"
