meta:
  title: "다운로드 없이 쓰는 지출 나누기 앱 | 사이드 배저"
  description: "휴대폰이 꽉 찬 거, 압니다. 사이드 배저는 브라우저에서 실행되어 앱 스토어도 다운로드도 필요 없어요. 홈 화면에 추가하면 앱처럼 열립니다."
h1: "앱 스토어도, 다운로드도 없이. 그래도 앱처럼"
navLabel: "웹 앱"
lead: "사이드 배저는 브라우저 안에 있습니다. 검색할 앱 스토어도, 먼저 받을 것도 없어요. 휴대폰이나 컴퓨터에서 로그인해 그룹과 온라인으로 지출을 나누고, 한 번 탭으로 열고 싶을 때는 홈 화면이나 Dock에 추가하세요."
cta:
  heading: "열고, 로그인하고, 그룹을 시작하세요"
  body: "이미 열려 있는 브라우저에서 계정을 만들고, 그룹을 시작하고, 첫 지출을 추가하세요. 먼저 둘러보고 싶다면 [사용 방법](page:how-it-works)을 보거나 [무료로 제공되는 것](page:pricing)을 확인하세요."
problem:
  heading: "휴대폰이 꽉 찼죠. 압니다."
  body: "그 안 어딘가에는 똑같은 석양 사진 4천 장과 봄부터 계속 넘겨 온 저장 공간 경고가 있습니다. 저녁 한 번 나누자고 앱을 또 설치하는 건 휴대폰이 가장 바라지 않는 일이에요. 그래서 사이드 배저는 웹 앱입니다. 휴대폰이나 컴퓨터의 최신 브라우저에서 실행됩니다. 휴대폰에서는 그룹 페이지가 탭으로 나뉜 모바일 레이아웃과 터치하기 편한 컨트롤을 씁니다. 홈 화면에 추가하는 것 같은 일부 추가 기능은 브라우저에 따라 달라지는데, 어디서 그런지는 저희가 알려 드립니다."
workflow:
  heading: "브라우저 탭에서 홈 화면까지 세 단계"
  steps:
    - title: "열고 로그인하기"
      body: "브라우저에서 사이드 배저에 접속해 로그인하세요. 이메일 주소와 비밀번호만 있으면 되고, 무언가를 추가하려면 먼저 이메일을 인증해야 합니다. 그룹의 모든 사람에게 계정이 필요하므로, 초대받는 사람들도 똑같이 하게 됩니다."
    - title: "홈 화면이나 Dock에 추가하기"
      body: "로그인하면 앱이 스스로 설치를 제안합니다. 브라우저가 허용하는 곳에는 **설치** 버튼이, 허용하지 않는 곳에는 **방법 보기**가 나타나요. 놓쳤거나 아니라고 했나요? **설정**의 **홈 화면 또는 Dock에 추가**에 같은 안내가 있습니다. iPhone이나 iPad에서는 설정이 iPhone 단계를 먼저 보여 주고 다른 기기는 **다른 기기** 아래에 접어 둡니다. 어느 쪽이든 앱은 그다음부터 별도의 창에서 열립니다."
      shot: S20
      shotAlt: "기기에 앱을 추가하는 단계가 있는 설정의 ‘홈 화면 또는 Dock에 추가’ 섹션"
    - title: "알림은 원할 때만 켜기"
      body: "알림은 켜기 전까지 꺼져 있고, 기기마다 따로 켭니다. 알림 벨에 나오는 **켜기** 버튼이나 **설정**의 **푸시 알림** 스위치를 쓰세요. iPhone이나 iPad에서는 먼저 홈 화면에서 앱을 여세요. 거기서만 알림이 작동합니다."
      shot: S19
      shotAlt: "그룹의 최근 활동이 나열된 알림 드롭다운"
options:
  heading: "기기별 추가 방법"
  items:
    - title: "iPhone 및 iPad"
      body: "위쪽을 가리키는 화살표가 있는 사각형인 공유 버튼을 탭하세요. 보이지 않으면 먼저 점 세 개(•••)를 탭한 다음 공유를 탭하세요. 아래로 스크롤해서 **홈 화면에 추가**를 탭하세요. **웹 앱으로 열기**를 켜 둔 상태에서 **추가**를 탭하세요. 링크가 다른 앱 안에서 열렸다면 먼저 Safari에서 페이지를 여세요. 그 앱의 내장 브라우저로는 추가할 수 없기 때문입니다."
    - title: "Android"
      body: "브라우저 메뉴를 열고 **홈 화면에 추가** 또는 **앱 설치**를 선택하세요."
    - title: "컴퓨터의 Chrome 또는 Edge"
      body: "브라우저 메뉴를 열고 이 사이트를 앱으로 설치하는 옵션을 선택하세요. 그러면 자기만의 창과 아이콘이 생깁니다."
    - title: "Safari를 사용하는 Mac"
      body: "**파일**을 선택한 다음 **Dock에 추가**를 선택하세요."
sections:
  - heading: "알림은 요청한 경우에만"
    body: "푸시 알림은 선택 사항입니다. 켜면 누군가 지출을 추가하거나, 댓글을 남기거나, 결제를 기록하는 등 그룹에 새 활동이 있을 때 알림을 받습니다. 알림은 기기마다 따로, 알림 벨이나 **설정**에서 켜고, 같은 곳에서 다시 끌 수 있어요. 알림을 지원하는 브라우저와 여러분의 허락이 필요합니다. 브라우저가 이 사이트의 알림을 막아 두었다면, 먼저 브라우저 설정에서 허용하세요. iPhone이나 iPad에서는 브라우저 탭이 아니라 홈 화면에 추가한 앱에서만 작동합니다. 전달은 보장되지 않으니, 알림은 약속이 아니라 슬쩍 찔러 주는 것으로 여기세요. 피드에 무엇이 나타나는지는 [함께 계획하기](page:feature/plan-together)를 보세요."
  - heading: "실시간 업데이트, 새로 고침 버튼 없이"
    body: "지출을 추가하면 모두에게 무엇이 바뀌었는지, 누가 바꿨는지와 함께 바로 보입니다. 각 그룹은 활동 내역을 남기고, 알림 벨은 내 모든 그룹의 활동을 보여 줍니다. 방금 추가한 걸 봤는지 아무도 물을 필요가 없어요. 이미 그들의 화면에 있으니까요."
  - heading: "39개 언어, 사람마다 각자"
    body: "사이드 배저는 오른쪽에서 왼쪽으로 쓰는 아랍어, 페르시아어, 우르두어를 포함해 39개 언어로 쓸 수 있습니다. 그룹의 모든 사람이 각자 언어를 고르므로, 같은 그룹 페이지가 한 사람에게는 아랍어로, 다음 사람에게는 영어로 보일 수 있어요. 그룹이 합의해야 하는 건 숫자뿐입니다."
  - heading: "한 가지 유형의 사용자만을 위해 만들지 않았습니다"
    body: "사이드 배저는 키보드와 스크린 리더 사용자를 염두에 두고 만들었습니다. 멤버 색상에는 패턴이 함께 붙으므로 초록과 빨강을 구분하지 않아도 됩니다."
    items:
      - "키보드 사용자가 바로 콘텐츠로 이동할 수 있는 건너뛰기 링크."
      - "대화상자가 키보드 포커스를 관리합니다."
      - "스크린 리더를 위해 컨트롤에 라벨이 있습니다."
      - "오른쪽에서 왼쪽으로 쓰는 언어에서는 레이아웃이 좌우 반전됩니다."
limits:
  heading: "웹 앱이 하지 않는 일"
  items:
    - "오프라인으로는 쓸 수 없습니다. 사이드 배저에는 연결이 필요하므로, 와이파이 없는 비행기 안에서는 그룹이 열리지 않아요."
    - "앱 스토어 앱도, 네이티브 iPhone이나 Android 앱도 없습니다. 사이드 배저는 웹 앱이고, 홈 화면이나 Dock에 추가하는 것이 앱처럼 쓰는 방법입니다."
    - "홈 화면이나 Dock에 추가하는 것은 브라우저에 따라 달라집니다. 메뉴 이름은 브라우저와 버전마다 다르고, 일부 브라우저는 이 기능을 제공하지 않습니다."
    - "푸시 알림은 기기마다 직접 켜야 하며, 알림을 지원하는 브라우저와 여러분의 허락이 필요합니다. iPhone과 iPad에서는 홈 화면에 추가한 앱에서만 작동합니다. 전달은 보장되지 않습니다."
    - "이메일이나 문자 알림도, 결제 독촉도 없습니다. 새 활동은 앱에 표시되고, 켜 두면 푸시 알림으로도 옵니다. 결제를 챙기는 일은 여전히 여러분 몫입니다."
    - "활동은 90일 동안 남습니다."
    - "이메일 주소와 비밀번호로 로그인합니다. Google이나 Apple 로그인은 없고, 만 18세 이상이어야 합니다."
    - "사이드 배저가 완전히 접근 가능하다거나 공식 접근성 표준을 충족한다고 주장하지 않습니다. 불편한 점이 있다면 앱 안에서 알려 주세요. 답변도 거기서 보실 수 있습니다."
useCasesHeading: "앱이 필요 없어서 좋은 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "앱 스토어에 사이드 배저 앱이 있나요?"
      a: "아니요. 사이드 배저는 웹 앱입니다. 브라우저에서 열고, 홈 화면이나 Dock에 추가해 앱처럼 열 수 있어요. 앱 스토어에서 내려받을 것은 없습니다."
    - q: "앱을 내려받지 않고 비용을 나눌 수 있나요?"
      a: "네. 휴대폰이나 컴퓨터의 브라우저에서 사이드 배저를 열고, 로그인하고, 그룹을 시작하세요. 홈 화면이나 Dock에 추가하는 건 선택 사항입니다."
    - q: "오프라인에서도 작동하나요?"
      a: "아니요. 홈 화면이나 Dock에 추가했더라도 사이드 배저에는 연결이 필요합니다."
    - q: "iPhone에서 알림이 오지 않는 이유는 뭔가요?"
      a: "iPhone이나 iPad에서는 브라우저 탭이 아니라 홈 화면에 추가한 앱에서만 알림이 작동합니다. 앱을 추가하고, 홈 화면 아이콘으로 연 다음, **설정**에서 알림을 켜세요. 전달은 보장되지 않으므로 하나가 빠지더라도, 그룹의 활동 내역에는 무엇이 추가됐는지 남아 있습니다."
    - q: "알림을 꼭 켜야 하나요?"
      a: "아니요. 켜기 전까지는 꺼져 있고, 기기마다 하나씩 켭니다. 알림이 없어도 새 활동은 앱에 표시되고, 앱을 열어 둔 사람은 변경 사항을 바로 봅니다."
    - q: "그룹의 모든 사람에게 계정이 필요한가요?"
      a: "네. 이메일 주소와 비밀번호만 있으면 되고, 무언가를 추가하려면 먼저 이메일을 인증해야 합니다. 그룹에 가입하는 모든 사람이 원하는 휴대폰이나 컴퓨터에서 똑같이 합니다."
