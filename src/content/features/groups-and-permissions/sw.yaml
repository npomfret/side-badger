meta:
  title: "Usimamizi wa kikundi na ruhusa za gharama | Side Badger"
  description: "Alika watu kwa kiungo au msimbo wa QR, idhinisha nani anajiunga, weka watazamaji, weka ruhusa na funga kikundi kikiisha. Kikundi chako, sheria zako, kwa busara."
h1: "Usimamizi wa kikundi na ruhusa: sheria zako, kwa busara"
navLabel: "Vikundi na ruhusa"
lead: "Vikundi vingine vinahitaji mweka hazina. Side Badger ina mpangilio wa hilo. Alika watu kwa kiungo au msimbo wa QR, amua nani anaingia, na uchague nani anaweza kubadilisha nambari. Kikundi kidogo cha marafiki kinaweza kupuuza yote, kwa sababu vikundi vipya huanza vikiwa wazi kabisa."
cta:
  heading: "Tayari kuendesha kikundi nadhifu?"
  body: "Fungua akaunti, anzisha kikundi na utume kiungo cha mwaliko. Kiache wazi, au kaza sheria kikundi kinapokua au kuwa na mambo mengi ya kuzingatia."
problem:
  heading: "Mtu lazima aweke nambari nadhifu"
  body: "Wapangaji wenza wanne wanaweza kuendelea kwa kuaminiana. Wageni thelathini wa wikendi ya harusi huenda hawawezi. Tengeneza kikundi kwa kila nyumba, safari au tukio, chenye hadi watu 50, na kila kikundi kina wanachama wake, majukumu yake na sheria zake. Dashibodi yako inaviorodhesha vyote, pamoja na hali yako katika kila kimoja, kwenye skrini moja. Vikundi vingi havigusi mipangilio kamwe. Vile vinavyoigusa kwa kawaida vina mtu aliyejipanga vya kutosha kuitaka."
workflow:
  heading: "Kutoka kikundi tupu hadi kikundi kilichofungwa"
  steps:
    - title: "Alika kwa kiungo au msimbo wa QR"
      body: "Fungua **Alika wengine**, chagua kiungo kidumu kwa muda gani (dakika 15, saa 1, siku 1 au siku 5), kisha nakili kiungo au onyesha msimbo wa QR ili watu waskani. Unaweza pia kuwaalika watu mnaoshiriki nao kikundi kingine, ukiwa ndani ya programu."
      shot: S03
      shotAlt: "Dirisha la mwaliko lenye kiungo cha kikundi, msimbo wake wa QR na chaguo la kiungo kidumu kwa muda gani"
    - title: "Wacha waangalie kabla ya kujiunga"
      body: "Yeyote mwenye kiungo anaingia au anafungua akaunti, anaona muhtasari wa kikundi na anachagua jina atakalotumia humo. Kisha anabonyeza **Jiunge na Kikundi**."
      shot: S04
      shotAlt: "Muhtasari wa kujiunga na kikundi, unaoonyeshwa kwa mtu aliyeingia kabla hajajiunga"
    - title: "Idhinisha nani anajiunga"
      body: "Washa idhini na watu wanaotumia kiungo wanasubiri kama wanachama wanaosubiri hadi msimamizi awaruhusu kuingia. Wasimamizi huwapata chini ya **Wanachama Wanaosubiri** katika **Usalama**, na kuchagua **Idhinisha** au **Kataa**. Hadi hapo, mtu anayesubiri hawezi kuona chochote kwenye kikundi."
      shot: S14
      shotAlt: "Wanachama wanaosubiri msimamizi awaidhinishe au awakatae"
    - title: "Chagua nani anaweza kubadilisha nini"
      body: "Chagua **Wazi** au **Inayosimamiwa**, au weka ruhusa moja moja. Kisha mpe kila mtu jukumu: msimamizi, mwanachama au mtazamaji. Wasimamizi pekee wanaweza kubadilisha ruhusa na majukumu."
      shot: S13
      shotAlt: "Kichupo cha usalama cha mipangilio ya kikundi chenye chaguo-msingi mbili na ruhusa maalum"
    - title: "Kifunge kikiisha"
      body: "Safari ikiisha na nambari zikitulia, msimamizi anaweza kuwasha **Funga kikundi**. Hakuna anayeweza kuongeza au kubadilisha gharama, kurekodi malipo wala kuhariri orodha na kura, na bango linasema hivyo. Hakuna atakayeongeza teksi ya kuchelewa kimyakimya. Ikijitokeza moja, msimamizi anaweza kukifungua kikundi."
      shot: S15
      shotAlt: "Kikundi kinachoonyesha bango linalosema kimefungwa"
options:
  heading: "Wasimamizi, wanachama na watazamaji"
  items:
    - title: "Msimamizi"
      body: "Anaendesha kikundi. Wasimamizi huidhinisha wanachama wapya, hubadilisha majukumu na ruhusa, hufunga na kufungua kikundi, na kukifunga kabisa. Anayeunda kikundi huanza kama msimamizi wake, na kikundi hakibaki bila msimamizi, kwa sababu msimamizi wa mwisho hawezi kushushwa cheo."
    - title: "Mwanachama"
      body: "Anashiriki. Kile mwanachama anachoweza kufanya kinategemea ruhusa za kikundi. Katika kikundi cha **Wazi** ni karibu kila kitu. Katika kikundi **Kinachosimamiwa**, wanachama wanaweza kubadilisha gharama na orodha walizounda wenyewe tu."
    - title: "Mtazamaji"
      body: "Anaona kila kitu na habadilishi chochote. Mtazamaji hawezi kuongeza au kuhariri gharama au orodha, kualika watu, kubadilisha mipangilio wala kugusa picha ya kichwa. Inafaa kwa mtu anayetaka kutazama nambari na kuahidi kutozichezea."
sections:
  - heading: "Wazi, inayosimamiwa au sheria zako mwenyewe"
    body: "Vikundi vipya huanza na **Wazi**, ambapo kila mtu anaweza kualika watu, kubadilisha gharama na kuhariri orodha, na wanachama wapya hujiunga moja kwa moja. **Inayosimamiwa** ni kwa wakati mtu anahitaji kuwa mtu mzima. Unaweza pia kuweka ruhusa saba moja moja, na kubadilisha moja kwa mkono hubadilisha kikundi kuwa maalum. Chochote utakachochagua, wasimamizi pekee wanaweza kubadilisha ruhusa zenyewe, na kila badiliko linaonekana kwenye mlisho wa shughuli. Nyumba ya [wapangaji wenza](page:use-case/housemates) inaweza kuacha kila kitu wazi. [Tukio au sherehe](page:use-case/events-and-celebrations) kubwa mara nyingi inataka Inayosimamiwa, ili mtu awe msimamizi wa nani anajiunga. Mgeni kwa haya yote? [Jinsi inavyofanya kazi](page:how-it-works) inaeleza safari nzima, kuanzia gharama ya kwanza hadi hesabu kumalizika."
    items:
      - "**Nani anaweza kuhariri gharama.** Wazi: mwanachama yeyote. Inayosimamiwa: waundaji na wasimamizi."
      - "**Nani anaweza kufuta gharama.** Wazi: mwanachama yeyote. Inayosimamiwa: waundaji na wasimamizi."
      - "**Nani anaweza kuhariri orodha.** Wazi: mwanachama yeyote. Inayosimamiwa: waundaji na wasimamizi."
      - "**Nani anaweza kualika wanachama.** Wazi: mwanachama yeyote. Inayosimamiwa: wasimamizi pekee."
      - "**Idhini ya wanachama wapya.** Wazi: ya moja kwa moja. Inayosimamiwa: idhini ya msimamizi inahitajika."
      - "**Nani anaweza kudhibiti mipangilio.** Wazi: mwanachama yeyote. Inayosimamiwa: wasimamizi pekee."
      - "**Nani anaweza kubadilisha picha ya kichwa.** Wazi: mwanachama yeyote. Inayosimamiwa: wasimamizi pekee."
  - heading: "Jina lako, picha yako, picha yako ya kichwa"
    body: "Kila kikundi kina orodha yake ya wahusika. Chagua jina ambalo watu wanaliona katika kila kikundi (herufi 2 hadi 50, na la kipekee ndani ya kikundi) na ni picha ipi ya wasifu wako utakayovaa humo. Kuwa **Sudi** nyumbani na **Sudi (mwenye gari)** safarini. Yeyote anayeruhusiwa kubadilisha mipangilio anaweza kubadilisha jina la kikundi na kuhariri maelezo yake. Picha ya kichwa, yaani JPEG, PNG, GIF au WebP hadi MB 10, ina ruhusa yake yenyewe."
  - heading: "Hifadhi, funga au komesha"
    body: "Njia tatu za kuweka kikundi pembeni, kuanzia ndogo hadi nzito zaidi."
    items:
      - "**Hifadhi** huficha kikundi kwenye dashibodi yako mwenyewe, na si ya mtu mwingine yeyote. Bado unaweza kukifungua na kukitumia kama kawaida, na **Ondoa kwenye hifadhi** kinakirudisha."
      - "**Funga kikundi** husimamisha mabadiliko hadi msimamizi akifungue. Kila mtu bado anaweza kusoma kikundi na historia yake."
      - "**Funga kikundi kabisa** ni cha kudumu, na kwa kila mtu. Ni msimamizi pekee anayeweza kufanya hivyo, kwa kuandika jina la kikundi kuthibitisha, na hakuna anayeweza kukifungua tena."
  - heading: "Kuondoka kwenye kikundi"
    body: "Yeyote anaweza kuondoka akishamaliza hesabu. Huwezi kuondoka ukiwa na deni au unadai pesa hata katika sarafu moja, wakati swali wazi kuhusu gharama linakuhusu, au ikiwa wewe ni msimamizi wa mwisho au mwanachama pekee. [Rekodi malipo](page:feature/settle-up), tatua [swali la gharama](page:guide/what-to-do-when-someone-disputes-a-shared-expense), au mfanye mtu mwingine msimamizi, kisha uende. Ili kurudi, utahitaji mwaliko mpya."
limits:
  heading: "Kwa busara: maandishi madogo"
  items:
    - "Kikundi kinaweza kuwa na hadi watu 50."
    - "Wasimamizi pekee wanaweza kubadilisha ruhusa na majukumu. Msimamizi wa mwisho hawezi kushushwa cheo."
    - "Kuweka uhariri wa gharama kuwa **Wasimamizi pekee** pia kunamaanisha kwamba wasimamizi pekee wanaweza kuongeza gharama."
    - "Kufunga kunazuia mabadiliko ya gharama, malipo mapya, orodha na kura. Kila mtu bado anaweza kusoma kikundi na historia yake, na kuitikia malipo."
    - "Kukifunga kabisa ni cha kudumu. Programu haina njia ya kufungua tena kikundi kilichofungwa kabisa."
    - "Kutengeneza kiungo kipya cha mwaliko hakufuti vya zamani. Kila kiungo kinadumu hadi kuisha kwake, kwa hivyo chagua kifupi ukiwa na wasiwasi kitaishia wapi."
    - "Mialiko ya ndani ya programu inaorodhesha watu kutoka vikundi vyako 10 vya hivi karibuni vinavyoendelea. Wengine wanahitaji kiungo, na nani anaweza kualika kunategemea ruhusa za kikundi."
    - "Kujiunga kunahitaji akaunti, na watu lazima wathibitishe barua pepe kabla ya kuongeza chochote."
useCasesHeading: "Mahali ambapo mpangilio kidogo unasaidia"
faq:
  heading: "Maswali"
  items:
    - q: "Je, mtazamaji anaweza kuongeza gharama?"
      a: "Hapana. Mtazamaji anaona kila kitu na habadilishi chochote. Hawezi kuongeza au kuhariri gharama au orodha, kualika watu wala kubadilisha mipangilio."
    - q: "Je, mtu anaweza kuondoka akiwa na deni?"
      a: "Hapana. Hakuna anayeweza kuondoka kwenye kikundi akiwa na deni au anadai pesa hata katika sarafu moja. Maliza hesabu kwanza, kisha uende."
    - q: "Kikundi kikifungwa kabisa, nini kinatokea?"
      a: "Hakuna anayeweza kukifungua tena. Ni msimamizi pekee anayeweza kukifunga kabisa kikundi, lazima aandike jina la kikundi kuthibitisha, na kikundi hakipatikani tena kwa mtu yeyote. Ukitaka tu kusimamisha mabadiliko, kifunge. Ukitaka tu kiondoke kwenye dashibodi yako mwenyewe, kihifadhi."
    - q: "Je, naweza kutendua kufunga?"
      a: "Ndiyo. Msimamizi anaweza kukifungua kikundi, na mabadiliko yanaanza kufanya kazi tena."
    - q: "Je, lazima niidhinishe watu kabla hawajajiunga?"
      a: "Ikiwa tu unataka. Vikundi vipya huanza na Wazi, ambapo watu wanaotumia kiungo hujiunga moja kwa moja. Washa idhini ya msimamizi, au chagua Inayosimamiwa, na kila mtu anasubiri hadi msimamizi amruhusu kuingia."
    - q: "Kikundi kinaweza kuwa na watu wangapi?"
      a: "Hadi 50."
