meta:
  title: Del utgiftene til fester, bryllup og felles gaver
  description: Del kostnadene til en fest, et bryllup eller en felles gave når folk bidrar med ulike beløp. Stem over planen, del etter nøyaktige beløp og se hvem som skylder hvem.
h1: Del utgiftene til fester, bryllup og felles gaver
navLabel: Arrangementer og feiringer
lead: Del depositum, pynt og nødparaplyer. La seteplanen være opp til noen modigere. Side Badger holder **hvem som bidro med hva** på ett sted, så arrangøren også kan nyte festen.
cta:
  heading: Start med neste feiring
  body: Opprett en konto, lag en gruppe for arrangementet og send invitasjonslenken. Side Badger er gratis, uten annonser og uten daglige grenser.
  button: Opprett en gratis konto
scenario:
  heading: Alle bidrar, ikke alltid med like mye
  body: Noen betaler depositumet for lokalet, noen andre kjøper kaken, og en tredje legger den felles gaven på sitt eget kort. Noen gjester kommer på alt, og noen kommer bare til middagen. Å føre et rettferdig regnskap over det i en chattråd er en jobb ingen har søkt på. En Side Badger-gruppe holder det hele, uansett hvilken blanding av beløp det er, og viser hver person hva de skylder eller har til gode. Se [slik fungerer det](page:how-it-works) for det grunnleggende, eller les videre for et arrangement.
sections:
  - heading: Bestem sammen
    body: Før noen penger flyttes, legger du valget frem i en **avstemning**. Legg til opptil 10 alternativer, som to lokaler eller tre gaveidéer, og la alle stemme. Du kan skjule hvem som stemte på hva, så hvert alternativ får en rettferdig behandling, og vinneren vises når avstemningen er lukket. Ingen trenger å bla tilbake gjennom førti meldinger for å finne ut hva som ble bestemt.
  - heading: Hvem som er med på hva
    body: Ikke alle betaler like mye, og ikke alle er med på alle kostnader. Del en utgift likt, etter prosent eller etter **nøyaktige beløp**, så hver persons andel er tallet dere ble enige om. La dem som ikke var involvert stå utenfor, som gjestene som hoppet over middagen eller vennene som ikke ble med på gaven. Hver utgift har én betaler, og alle andre i delingen skylder sin andel til vedkommende. Detaljene står på siden [dele utgifter](page:feature/split-expenses).
  - heading: Ta vare på papirarbeidet
    body: Legg notater til en utgift, for eksempel hva kostnaden dekket. Kommentarer blir stående **ved siden av utgiften** de handler om, så spørsmålet «var kaken 45 £ eller 54 £?» og svaret på det finnes på samme sted. Kommentarer kan være opptil 500 tegn, som er mer enn nok til et spørsmål om et depositum.
  - heading: Kontroll for arrangøren
    body: Åpent samarbeid lar ethvert medlem legge til og redigere utgifter, noe som går fint for en liten gave. For et bryllup eller en større fest velger du forhåndsinnstillingen **Administrert gruppe**. Administratorer godkjenner hvert nye medlem, og bare opprettere og administratorer kan endre utgifter. Inviter folk med en lenke eller QR-kode; med godkjenning på slipper en administrator inn hver enkelt, så gjestelisten forblir gjestelisten. Når arrangementet er over, låser du gruppen så tallene blir stående.
  - heading: Gjør opp etter festen
    body: Når den siste fakturaen er inne, viser saldoene **hvem som skylder hvem**, og Side Badger foreslår en kort liste over betalinger som gjør opp for alle. Betal hverandre slik dere vil, og registrer så betalingen i gruppen. Side Badger flytter aldri penger, så gruppen fører regnskapet mens overføringene skjer i deres egne nettbanker. Siden [gjøre opp](page:feature/settle-up) viser hvordan et virvar blir til en kort liste.
