meta:
  title: "Hvernig á að safna fyrir hópgjöf | Side Badger"
  description: "Allir leggja til mismikið og kortið hjá einum tekur skellinn. Haltu könnun um fjárhagsáætlun, skráðu nákvæmar upphæðir og láttu Side Badger reikna."
h1: "Hvernig á að safna fyrir hópgjöf"
navLabel: "Safnað fyrir hópgjöf"
lead: "Að safna fyrir hópgjöf þýðir að einn leggur út peningana og allir aðrir skulda honum sitt framlag. Komið ykkur saman um fjárhagsáætlun með könnun, látið kaupandann setja gjöfina á kortið sitt og skráið hana svo sem eitt útgjald með [nákvæmum upphæðum](page:feature/split-expenses), einni tölu fyrir hvern og einn. Side Badger sýnir hver skuldar kaupandanum hvað og allir senda sinn hlut eins og þeim hentar."
cta:
  heading: "Leggðu í púkkið án púkksins"
  body: "Búðu til hóp, hafðu þann sem fær gjöfina utan hans og skráðu gjöfina með nákvæmum upphæðum. Side Badger er ókeypis, án auglýsinga og án daglegra takmarka. Viltu fá yfirlit fyrst? Sjá [hvernig þetta virkar](page:how-it-works) eða [hvað ókeypis nær yfir](page:pricing)."
sections:
  - heading: "Fjórir vinir, einn plötuspilari, fjórar mismunandi upphæðir"
    body: "Bea verður þrítug og langar í plötuspilara. Priya, Omar, Lena og Sam ætla að gefa henni hann. Priya finnur einn á 240 £ og kaupir hann á sitt eigið kort, því einhver verður að ríða á vaðið. Þau fjögur leggja ekki jafnt til. Priya og Omar leggja til 60 £ hvort, Lena 80 £ og Sam 40 £. Enginn útskýrir sína tölu og enginn spyr. Omar kaupir líka kort og gjafapappír fyrir 12 £. Öll fjögur skrifa á kortið, svo því er skipt jafnt."
  - heading: "Ákveðið fjárhagsáætlunina áður en nokkur smellir á Kaupa"
    body: "Könnun um fjárhagsáætlun sparar þrætuna um 400 £ plötuspilara. Veldu **Bæta við könnun** í hópnum og spurðu hvað gjöfin eigi að kosta. Hafðu valkostina upphæðir, eins og allt að 150 £, allt að 200 £ og allt að 250 £. Kveiktu á valkostinum **Nafnlæg atkvæðagreiðsla**, sem felur hver kaus hvað, svo enginn þurfi að verja lægri tölu upphátt. Stillingunum er ekki hægt að breyta eftir fyrsta atkvæðið, svo athugaðu þær fyrst. Könnun lokar sér ekki sjálf. Þegar allir hafa kosið skaltu velja **Loka könnun** og þá birtist **Sigurvegari**. Könnunin ákveður heildarupphæðina. Hún ákveður ekki hlut neins."
  - heading: "Talningin lesin"
    body: "Gjöfin skiptist í 60 £, 60 £, 80 £ og 40 £, sem leggst saman í 240 £ á kvittuninni. Kortinu og gjafapappírnum er skipt á fjóra, 3 £ á mann. Priya ber 60 £ + 3 £, eða 63 £, af kostnaðinum og greiddi 240 £, svo hún á inni 177 £. Omar ber líka 63 £, en hann greiddi 12 £, svo hann skuldar 51 £. Lena skuldar 80 £ + 3 £, sem eru 83 £, og Sam skuldar 40 £ + 3 £, sem eru 43 £. Þessar þrjár skuldir eru samtals 177 £, sem er upphæðin sem Priya á inni. Ef skuldirnar fengju að standa óhreyfðar rynnu þær fimm leiðir á milli hópmeðlima. Side Badger leggur þess í stað til þrjár greiðslur, allar til Priya. [Uppgjör](page:feature/settle-up) segir nánar frá."
  - heading: "Settu það í Side Badger"
    body: "Þetta tekur Priya um fimm mínútur."
    items:
      - "**Búðu til hópinn.** Veldu **Búa til hóp** á stjórnborðinu. Veldu **Bjóða öðrum** og sendu tengilinn eða QR-kóðann til fólksins sem leggur til, og engra annarra."
      - "**Bættu við gjöfinni.** Veldu **Skrá útgjöld**, lýstu henni, sláðu inn 240 og veldu Priya undir **Hver greiddi?**. Hafðu alla fjóra undir **Skipta á milli**, veldu síðan **Nákvæmar upphæðir** undir **Hvernig á að skipta** og skrifaðu 60, 60, 80 og 40. Upphæðirnar verða að ná samtals 240. Hengdu við pöntunarstaðfestinguna ef þú vilt. Veldu **Vista útgjöld**."
      - "**Bættu við kortinu.** Omar bætir við 12 £ sjálfur, velur sjálfan sig undir **Hver greiddi?** og lætur **Hvernig á að skipta** vera á **Jafnt**, með alla fjóra hakaða við."
      - "**Teljið, borgið svo.** Allir skoða **Staða**, sem sýnir hver skuldar hverjum, og senda Priya sinn hlut eins og þeim hentar. Skráið það svo með **Gera upp** og **Skrá uppgjör**. Flýtiuppgjör fyllir út upphæðina."
  - heading: "Kaupa fyrst, eða safna fyrst"
    body: "Side Badger geymir ekki sjóðinn, svo „að safna“ þýðir í raun að telja. Tvær röðir ganga upp."
    items:
      - "**Kaupa fyrst.** Kaupandinn borgar, bætir útgjaldinu við á raunverði og allir sjá hlut sinn strax. Þetta er snyrtilegra, en kaupandinn ber kostnaðinn þar til fólk borgar, svo veldu kaupanda sem hefur efni á því."
      - "**Safna fyrst.** Fólk sendir sína tölu til kaupandans fyrir kaupin. Þegar verðið liggur fyrir skaltu skrá gjöfina og skrá svo hverja greiðslu með dagsetningunni þegar peningarnir fluttust í raun. Bættu gjöfinni við fyrst, svo hver greiðsla hafi stöðu til að lenda á."
      - "**Verðið breytist.** Sendingarkostnaður, afsláttarkóði, verðhækkun á síðustu stundu. Breyttu gjöfinni og lagaðu nákvæmu upphæðirnar svo þær leggist enn saman í rétta tölu. Fyrri útgáfan er geymd, en segðu hópnum fyrst frá, því staða þeirra breytist."
  - heading: "Haltu Beu utan við þetta"
    body: "Aðeins meðlimir hóps geta séð hann, svo Bea sér ekki hóp sem hún er ekki í. Bjóddu fólkinu sem leggur til og engum öðrum. Tengill virkar þar til hann rennur út og þú getur valið allt frá 15 mínútum upp í 5 daga, svo veldu stuttan og sendu hann þar sem Bea sér hann ekki. Tengillinn sýnir forskoðun á hópnum fyrir þann sem opnar hann, svo gefðu hópnum leiðinlegt nafn, eins og „Laugardagspúkkið“, og haltu nafni Beu líka utan við heiti útgjalda og valkosti í könnunum."
  - heading: "Það sem Side Badger gerir ekki hér"
    items:
      - "Það geymir hvorki né innheimtir peningana. Framlög fara til kaupandans með millifærslu, reiðufé eða hverju sem þið notið, og svo skráir einhver þau."
      - "Það sendir engar greiðsluáminningar. Að ýta við þeim sem hefur ekki borgað er enn mannlegt verk."
      - "Það reiknar ekki út hlut neins. Könnun ákveður fjárhagsáætlunina og það er enginn valkostur um að „skipta því sem eftir er“, svo þú slærð inn hverja upphæð."
      - "Hvert útgjald hefur einn greiðanda. Ef tveir keyptu sitt hvorn hluta gjafarinnar skaltu skrá tvö útgjöld."
      - "Allir í skiptingunni þurfa ókeypis aðgang og sæti í hópnum."
