faq:
  heading: Spørgsmål
  items:
    - q: Hvad er mest fair, værelsesstørrelse eller indkomst?
      a: Ingen af dem er altid mest fair. Værelsesstørrelse passer til bofæller, der betaler for den plads, de sover på. Indkomst passer til par og venner med meget forskellig løn. Aftal det før første huslejedag, ikke bagefter.
    - q: Skal regningerne deles på samme måde?
      a: For bofæller normalt ikke. Alle bruger energi og bredbånd, så ligeligt er enklere, som i eksemplet. Ved indkomst giver beregneren regningerne de samme andele som huslejen.
    - q: Kan jeg bruge kvadratfod?
      a: Ja. Vælg ft², og skriv dine arealer i kvadratfod. Enheden er kun en etiket, og andelene bliver de samme, så længe alle bruger den samme enhed.
    - q: Er beregneren gratis?
      a: Ja. Gratis. Ingen reklamer. Ingen daglige grænser. Du behøver heller ikke en konto.
