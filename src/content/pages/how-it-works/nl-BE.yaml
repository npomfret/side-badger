sections:
  - heading: "39 talen, en gebouwd voor meer mensen"
    body: "Gebruik Side Badger in 39 talen, waaronder het van rechts naar links geschreven Arabisch, Perzisch en Urdu. Iedereen in de groep kan zijn eigen taal kiezen, dus de groepspagina kan voor de ene persoon in het Arabisch zijn en voor de volgende in het Engels. Het is ook gebouwd met toetsenbord- en schermlezergebruikers in gedachten, en ledenkleuren komen met patronen, zodat je groen en rood niet uit elkaar hoeft te houden."
faq:
  heading: "Vragen"
  items:
    - q: "Heeft iedereen een account nodig?"
      a: "Ja, een gratis. Elke persoon bevestigt het e-mailadres voordat ze iets toevoegen."
    - q: "Is er een app?"
      a: "Het draait in de browser. Log in en voeg het daarna toe aan je startscherm of dock zodat het opent als een app. In de instellingen van de app zie je hoe. Er is geen versie voor de appstore en geen offlinemodus."
    - q: "Verplaatst Side Badger geld?"
      a: "Nee. Het houdt de rekening bij en stelt betalingen voor, en jullie betalen elkaar zoals jullie willen. Daarna registreer je de betaling. Zie [afrekenen](page:feature/settle-up)."
    - q: "Kan iemand vertrekken met een openstaande schuld?"
      a: "Nee. Niemand kan een groep verlaten zolang die nog geld schuldig is of tegoed heeft, dus eerst afrekenen."
    - q: "Hoeveel mensen kunnen meedoen aan een groep?"
      a: "Tot 50 personen in een groep. Nodig ze uit met een link of een QR-code, en zet goedkeuring aan als je wilt dat een beheerder elke persoon binnenlaat."
    - q: "Wat met reizen met meer dan één valuta?"
      a: "Saldi worden per valuta apart bijgehouden. Zie [meerdere valuta’s](page:feature/multiple-currencies)."
