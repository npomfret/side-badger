faq:
  heading: "Galderak"
  items:
    - q: "Zer kanbio-tasa erabiltzen du Side Badger-ek?"
      a: "Egungo kanbio-tasa bat, gastua sartzen duzunean lortua, eskuragarri dagoen lekuan. Benetan lortu zenuen tasara alda dezakezu."
    - q: "Taldeak libera esterlinetan eta yenetan geratu al daiteke?"
      a: "Bai. Taldearen **Ezarpenak** atalean, aktibatu **Mugatu monetak talde honetarako** **Moneta ezarpenak** azpian, aukeratu **Baimendutako monetak** eta ezarri **Moneta lehenetsia gastu berrietarako**. Zerrendan aukera gutxiago, kutxan moneta oker gutxiago."
    - q: "Bihurtu behar al dugu?"
      a: "Ez. Monetak bereizita geratzen dira zuk edo zure taldeak bihurtzea aukeratzen ez baduzue, eta moneta bakoitzak ordainketen zerrenda labur propioa du."
