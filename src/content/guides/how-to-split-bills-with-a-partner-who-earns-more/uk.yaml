faq:
  heading: "Запитання"
  items:
    - q: "Брати дохід до сплати податків чи на руки?"
      a: "Вирішує група. Гроші на руки беруть найчастіше, бо це кошти, якими ви справді можете розпоряджатися. Дохід до податків не враховує, що податки, пенсійні внески й виплати за кредитами забирають різні суми з різних зарплат. Що б ви не обрали, використовуйте однакову міру для обох."
    - q: "Чи бачить Side Badger наші доходи?"
      a: "Ні. Ви вводите лише відсотки, ніколи зарплати. Відсотки видно учасникам групи, а для пари це ви двоє."
    - q: "Чи можна один раз задати 62/38 для всього?"
      a: "Розподіл задається для витрати, а не для групи. Скопіюйте витрату, де вже є 62 і 38, і змініть те, що відрізняється. Про інші варіанти читайте в [розподілі витрат](page:feature/split-expenses)."
