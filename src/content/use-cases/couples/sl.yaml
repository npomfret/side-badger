featuresHeading: "Funkcije, ki jih uporablja par"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali lahko 60/40 nastaviva enkrat za vse?"
      a: "Ne. Delitev pripada vsakemu strošku posebej. Odstotke nastavi pri prvem, nato ga naslednjič kopiraj in spremeni, kar je drugače. [Delitev stroškov](page:feature/split-expenses) pokriva vse tri načine delitve."
    - q: "Ali se poveže z najino banko?"
      a: "Ne. Side Badger se nikoli ne dotakne vajinega denarja. Plačata si, kakor želita, nato zabeležita, kot pojasnjuje [poravnava](page:feature/settle-up)."
    - q: "Ali lahko kdo drug vidi najino skupino?"
      a: "Samo njeni člani, v skupini para pa sta dva. Vsak, ki uporabi veljavno povezavo za povabilo, se lahko pridruži, zato jo deli z eno osebo in nastavi kratek rok veljavnosti."
    - q: "Kaj, če sva vsak plačala del istega računa?"
      a: "Strošek ima enega plačnika. Zabeleži dva stroška, enega za vsakega od vaju, in stanje ostane enako."
    - q: "Ali bo partnerja opomnil, naj plača?"
      a: "Ne. Opomnikov ni, zato je rahel sunek še vedno tvoj. Vsaj oba bosta gledala isto številko."
    - q: "Kaj se zgodi, ko nehava deliti stroške?"
      a: "Poravnajta stanje in zabeležita plačilo, da nihče nič ne dolguje. Nato lahko administrator skupino zaklene, kar ohrani številke, kakršne so, ali jo za vedno zapre, zaradi česar je vsem nedostopna. Zapri jo samo, ko nobeden od vaju ne potrebuje zgodovine."
