sections:
  - heading: Erregistratu ordainketa bat
    body: Norbaitek ordaintzen duenean, erregistratu dagokion pertsonaren aurka. Likidazio azkarreko botoiek zenbatekoa betetzen dute proposatutako ordainketetatik, eta ohar bat gehi dezakezu, adibidez “banku-transferentzia” (gehienez 500 karaktere). Zor duzunaren zati bat bakarrik ordaintzen baduzu, gainerakoa saldoan geratzen da. Gutxiegi edo gehiegi sartzen baduzu, Side Badger-ek abisatzen dizu gorde aurretik. Ordainketa bat erregistratzeko gastuak editatzeko baimena behar da, eta data ezin da etorkizunekoa izan.
  - heading: Beste moneta batean ordaindu duzu?
    body: Saldoak ordaindu ziren monetan geratzen dira, beraz euro-zorrak euro-zor izaten jarraitzen du. Euroak zor dituzu eta libera esterlinetan ordaindu nahi duzu? Bihurtu ordainketa sartzean, egungo kanbio-tasa batekin edo benetan lortu zenuen tasarekin. Tasa ordainketa gordetzen denean finkatzen da. [Moneta anitz](page:feature/multiple-currencies) orrian bihurketak nola funtzionatzen duen azaltzen da, eta [taldeko bidaiak](page:use-case/group-trips) orrian erabileran ikusten da.
  - heading: Egiazta dezakezun historia
    body: Erregistratutako ordainketa bakoitza taldearen historian geratzen da bere data, zenbateko eta oharrarekin. Ordainketa erregistratu zuenak bakarrik edita dezake, eta hark edo taldeko administratzaile batek ezaba dezake. Taldea utzi duen norbait sartuta dagoen ordainketa blokeatuta dago. Etxekideen adibide landu baterako, ikusi [etxekideak](page:use-case/housemates).
limits:
  heading: Side Badger-ek egiten ez duena
  items:
    - Side Badger-ek ez du dirurik mugitzen, ez ordainketa-estekarik eta ez ordainketa-eskaerarik bidaltzen. Aplikazioko ordainketa bat beste nonbait egindako ordainketa baten erregistroa da.
    - Proposatutako ordainketak parekatze-metodo sinple batetik datoz, moneta bakoitzeko aplikatuta. Moneta horretan saldoa duten pertsonak baino ordainketa gutxiago proposatzen ditu beti (lau pertsona, gehienez hiru ordainketa), baina ez du beti aurkitzen ordainketa kopuru txikiena posiblea.
    - Ezin dituzu proposamenak desaktibatu. **Erakutsi guztiak** aukerak taldeko proposatutako ordainketa guztiak zerrendatzen ditu, ez zureak bakarrik.
    - Monetak ez dira inoiz elkarren artean konpentsatzen, gastuak sartzean bihurtu ez badira.
    - Ez dago gogorarazpenik, beraz ordainketa bat jarraitzea zure esku geratzen da.
useCasesHeading: Kitatzeak non axola duen
faq:
  heading: Galderak
  items:
    - q: Side Badger-ek dirua bidaltzen al du?
      a: Ez. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa Side Badger-en saldoa eguneratzeko.
    - q: Proposatutako ordainketak desaktiba ditzaket?
      a: Ez. Sinplifikazioa aktibatuta geratzen da, eta **Erakutsi guztiak** aukerak taldeko proposatutako ordainketa guztiak zerrendatzen ditu, ez zuri dagozkionak bakarrik.
    - q: Zergatik gordetzen dira euroak eta libera esterlinak bereizita?
      a: Saldoak ordaindu zenuen monetan geratzen dira, gastu edo ordainketa bat sartzean bihurtzen ez baduzu. Moneta desberdinetako zorrak ez dira inoiz elkarren artean konpentsatzen.
    - q: Zer gertatzen da norbaitek zor duenaren zati bat bakarrik ordaintzen badu?
      a: Erregistratu ordaindu duen zatia. Gainerakoa saldoan geratzen da ordaindu arte.
    - q: Ordainketa kopuru txikiena posiblea al da beti?
      a: Ez dago bermatuta. Moneta horretan saldoa duten pertsonak baino ordainketa gutxiago proposatzen ditu beti, beraz lau pertsonarentzat ez du inoiz hiru baino gehiago proposatzen. Etxekideen adibidean, bi ordainketa dira, pertsona bakoitzari zuzenean itzultzeak sei behar zituen lekuan.
