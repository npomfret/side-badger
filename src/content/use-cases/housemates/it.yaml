featuresHeading: Le funzionalità che usa una casa
faq:
  heading: Domande
  items:
    - q: L'affitto può ripetersi in automatico?
      a: No, non ci sono conti ricorrenti. Copia l'affitto del mese scorso in un paio di tocchi, cambia la data e hai finito.
    - q: Possiamo dividere in base alla dimensione delle stanze?
      a: Sì, per percentuale. Dai a ogni coinquilino una quota che rifletta la sua stanza, purché le quote sommino a 100. [Dividere le spese](page:feature/split-expenses) spiega gli altri modi di dividere.
    - q: E se un coinquilino se ne va con dei debiti?
      a: Non può lasciare il gruppo finché non ha saldato, perché nessuno può andarsene finché deve o deve ricevere denaro. I numeri restano onesti finché tutti non sono pari.
    - q: Side Badger paga le bollette?
      a: No. Tiene il conto e suggerisce una breve lista di pagamenti. Vi pagate come vi fa più comodo, poi lo registrate, come spiega [saldare i conti](page:feature/settle-up).
    - q: Un coinquilino può tenere i conti?
      a: Sì. Rendilo admin e usa un gruppo gestito, dove i nuovi membri hanno bisogno di approvazione e solo i creatori e gli admin possono modificare le spese.
