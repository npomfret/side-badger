faq:
  heading: "Ceisteanna"
  items:
    - q: "Ar cheart dúinn pá comhlán nó pá glan a úsáid?"
      a: "Socraíonn an grúpa. Is coitianta pá glan, mar is é an t-airgead atá le caitheamh agat i ndáiríre. Ní thugann pá comhlán aird ar an bhfíric go mbaineann cáin, ranníocaíochtaí pinsin agus aisíocaíochtaí iasachta méideanna difriúla as pá difriúla. Cibé ceann a roghnaíonn tú, úsáid an tomhas céanna don bheirt agaibh."
    - q: "An bhfeiceann Side Badger ár n-ioncam?"
      a: "Ní fheiceann. Ní chuireann tú isteach ach céatadáin, ní pá riamh. Is féidir le baill an ghrúpa na céatadáin a fheiceáil, agus le lánúin is sibhse an bheirt."
    - q: "An féidir linn 62/38 a shocrú uair amháin do gach rud?"
      a: "Socraítear an roinnt in aghaidh an chostais, ní in aghaidh an ghrúpa. Cóipeáil costas a bhfuil 62 agus 38 air cheana, ansin athraigh cad atá difriúil. Clúdaíonn [roinn costais](page:feature/split-expenses) na roghanna eile."
