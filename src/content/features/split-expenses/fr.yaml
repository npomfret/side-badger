meta:
  title: "Partager les dépenses à parts égales, par montants exacts ou par pourcentage | Side Badger"
  description: "Partagez un coût commun à parts égales, par montants exacts ou par pourcentage, en laissant de côté ceux qui n'étaient pas là. Gratuit, sans publicité et sans limite quotidienne."
h1: "Partager les dépenses à parts égales, par montants exacts ou par pourcentage"
navLabel: "Partager les dépenses"
lead: "Tout n'est pas du 50/50. Side Badger s'en accommode. Dites qui a payé, choisissez les personnes qui partagent le coût, et partagez **à parts égales, par montants exacts ou par pourcentage**. Rancunes vendues séparément."
cta:
  heading: "Partagez la prochaine dépense comme il faut"
  body: "Créez un compte gratuit, lancez un groupe et ajoutez la dépense que vous repoussez depuis un moment. Vous ne savez pas ce qui se passe ensuite ? Voyez [comment ça marche](page:how-it-works), ou regardez [ce que couvre la gratuité](page:pricing)."
  button: "Créer un compte gratuit"
problem:
  heading: "Tout n'est pas du 50/50"
  body: "Le loyer suit la taille de la chambre. Un cadeau suit celui qui a promis quoi. Un dîner suit celui qui est resté pour le dessert. Couper une facture en deux marche jusqu'à la première facture qui ne s'y prête pas, et là quelqu'un ouvre un tableur. Side Badger enregistre qui a payé, qui partage le coût et comment il se divise, pour que les soldes tombent juste sans que personne ne pose une division à table."
workflow:
  heading: "Ajouter une dépense, du début à la fin"
  steps:
    - title: "Dites qui a payé et pour quoi"
      body: "Saisissez le montant, une courte description et la personne qui a payé. Une seule personne paie chaque dépense, ce qui garde l'arithmétique honnête."
      shot: S05
      shotAlt: "Le formulaire de dépense avec le loyer d'un cottage partagé par pourcentage entre trois personnes"
    - title: "Choisissez le partage"
      body: "Choisissez à parts égales, par montants exacts ou par pourcentages. Les pourcentages doivent faire 100 au total, et les montants exacts doivent égaler le total."
      shot: S06
      shotAlt: "Le formulaire de dépense avec des montants exacts saisis pour chaque personne, pour un cadeau"
    - title: "Ajoutez l'histoire"
      body: "Indiquez la date, ajoutez des étiquettes, un lieu et une note. Tout le groupe voit les mêmes détails et peut commenter sur place."
      shot: S08
      shotAlt: "Une dépense avec ses détails, un fil de commentaires et le montant d'origine tel qu'il a été saisi"
    - title: "Soulevez une question si quelque chose cloche"
      body: "Si le groupe a activé les questions sur les dépenses, toute personne concernée par une dépense peut la remettre en question, et la liste des dépenses peut n'afficher que celles qui sont contestées."
      shot: S18
      shotAlt: "La liste des dépenses avec un badge « Questionné » et le filtre « Uniquement questionné »"
options:
  heading: "Trois façons de partager"
  items:
    - title: "À parts égales"
      body: "Le choix par défaut pour les dîners, les taxis et tout ce que tout le monde a partagé à égalité. Si le total ne se divise pas rond, le centime en trop va à une personne au hasard, pas toujours la même. Dans le taxi ci-dessous, c'est Ana."
    - title: "Par montants exacts"
      body: "Saisissez ce que chacun doit. Pratique pour le cadeau où chacun a choisi un prix différent, ou le magasin où le caddie de l'un contenait plus que les courses communes. Les montants doivent égaler le total."
    - title: "Par pourcentage"
      body: "Donnez à chacun une part du total. Le loyer selon la taille de la chambre est le grand classique : la plus grande chambre paie la plus grosse part et personne ne fait semblant du contraire."
