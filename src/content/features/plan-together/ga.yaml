meta:
  title: "Liostaí, vótaíochtaí agus tráchtanna do chostais ghrúpa | Side Badger"
  description: "Déan trácht ar chostais, ceistigh an costas corr, coinnigh liosta siopadóireachta comhroinnte agus vótáil ar an teach saoire. Pleanáil le chéile, ansin roinn. Saor in aisce, gan fógraí."
h1: "Pleanáil le chéile, roinn ina dhiaidh sin"
navLabel: "Pleanáil le chéile"
lead: "Tá liosta na siopadóireachta agus bille na siopadóireachta ag caint le chéile faoi dheireadh. Tugann Side Badger áit do do ghrúpa chun labhairt faoin airgead roimh agus tar éis é a chaitheamh, le tráchtanna ar gach costas, bealach chun ceist a chur faoi na cinn a bhfuil cuma mhícheart orthu, liostaí comhroinnte agus vótaíochtaí do na cinntí móra. Ansin [roinneann tú costais](page:feature/split-expenses) mar is gnách."
cta:
  heading: "Pleanáil é, ansin roinn é"
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa agus cuir an chéad liosta, vótaíocht nó ceist díreach in aice an airgid. Nach bhfuil tú cinnte cad a tharlaíonn ina dhiaidh sin? Féach [conas a oibríonn sé](page:how-it-works)."
problem:
  heading: "Tá an comhrá anseo, tá an bille ansiúd"
  body: "Is minic go gcónaíonn caiteachas grúpa in dhá áit. Tá na huimhreacha in aon áit amháin, agus an argóint faoi na huimhreacha i gcomhrá a scrollaigh amach Dé Máirt. Is grianghraf de chuisneoir an liosta siopadóireachta. Socraíodh an teach saoire le hordóg in airde ó fhormhór na ndaoine, is dócha. Coinníonn Side Badger an phleanáil sa ghrúpa, in aice leis na costais a bhaineann léi, mar sin tá trácht san áit a bhfuil an costas, liosta san áit a bhfuil an siopa, vótaíocht don chinneadh mór, agus bealach chun a rá “fan, an bhfuil sé seo ceart?” gan alt a scríobh. Fanann an t-iomlán ag plé le hairgead an ghrúpa, agus sin an fáth a bhfuil an grúpa ann."
workflow:
  heading: "Ón vótáil ar an teach saoire go bille na siopadóireachta"
  steps:
    - title: "Cuir an cinneadh mór chun vótála"
      body: "Cuir vótaíocht leis don chinneadh a shocraíonn an bille, mar cén teach saoire. Roghnaigh idir dhá rogha agus deich rogha, abair cé mhéad vóta a fhaigheann gach duine, ansin dún í nuair atá gach duine tar éis vótáil, agus marcáiltear an buaiteoir."
      shot: S17
      shotAlt: "Vótaíocht dhúnta agus an rogha bhuaiteach marcáilte, agus líon na vótaí in aice le gach rogha"
    - title: "Scríobh an liosta siopadóireachta le chéile"
      body: "Tosaigh liosta comhroinnte, cuir na míreanna leis agus cuir tic orthu de réir mar a shroicheann siad an tralaí. Téann an siopa isteach ina dhiaidh sin mar chostas."
      shot: S16
      shotAlt: "Liosta siopadóireachta comhroinnte agus roinnt míreanna ticeáilte, agus comhaireamh dul chun cinn"
    - title: "Labhair faoin gcostas san áit a bhfuil sé"
      body: "Déan trácht ar an gcostas féin, ceangail an admháil agus imoibrigh le emoji. Fanann an comhrá in aice leis an uimhir a bhfuil sé faoi."
      shot: S08
      shotAlt: "Costas lena shonraí, mionsamhail den admháil, snáithe tráchta agus imoibrithe emoji"
    - title: "Ceistigh an ceann a bhfuil cuma aisteach air"
      body: "Má chuir an grúpa ceisteanna costais ar siúl, is féidir le duine ar bith atá san áireamh i gcostas **Tá ceist agam** a roghnú. Fanann an costas as na hiarmhéideanna go dtí go réitítear an cheist."
      shot: S18
      shotAlt: "An liosta costas le suaitheantas Ceistithe agus an scagaire Ceistithe amháin"
    - title: "Féach cad a athraigh, agus cé a d'athraigh é"
      body: "Taispeánann an sruth gníomhaíochta agus cloigín na bhfógraí cad atá nua i do ghrúpaí go léir. Tá fógraí brú ar fáil má theastaíonn siad uait."
      shot: S19
      shotAlt: "An roghchlár anuas fógraí agus liosta de ghníomhaíocht le déanaí"
