faq:
  heading: "Villa soruları"
  items:
    - q: "Biri iptal ederse?"
      a: "Gecelerini çıkarın, hesapları yeniden yapın ve villa harcamasını, tam tutarlar yeniden fiyatı verecek şekilde düzenleyin. Önceki sürüm saklanır ve düzenleme grubun etkinliğinde görünür; yani kimse bir rakamı sessizce değiştirmez. Kimin düzenleyebileceği grubun izinlerine bağlıdır."
    - q: "Rezervasyonu yapan daha az mı ödemeli?"
      a: "Buna grup karar verir. Rezervasyon yapmak bir iştir ve gruplar bunun indirim hak edip etmediği konusunda ayrışır. Ne üzerinde anlaşırsanız anlaşın, tam tutarlara koyun ve harcamaya bir not olarak ya da yanına bir yorum olarak yazın; böylece kimsenin anlaşmayı hatırlaması gerekmez."
    - q: "Temizlik ücretlerini farklı bölüşebilir miyiz?"
      a: "Evet. Ücreti ayrı bir harcama olarak girin ve ona kendi bölüşümünü verin. Eşit bölüşüm bütün ev için sabit bir ücrete uyar. Tam tutarlar, ücretin de gecelere göre dağılmasını isteyen bir gruba uyar."
