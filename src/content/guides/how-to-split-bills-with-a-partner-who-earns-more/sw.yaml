faq:
  heading: "Maswali"
  items:
    - q: "Je, tutumie mshahara kamili au wa mkononi?"
      a: "Kikundi kinaamua. Wa mkononi ni wa kawaida, kwa sababu ni pesa mliyonayo kweli ya kutumia. Mshahara kamili unapuuza kwamba kodi, michango ya pensheni na malipo ya mikopo huchukua kiasi tofauti kutoka mishahara tofauti. Chochote mtakachochagua, tumieni kipimo kilekile kwa nyote wawili."
    - q: "Je, Side Badger inaona vipato vyetu?"
      a: "Hapana. Unaingiza asilimia tu, si mishahara kamwe. Asilimia zinaonekana kwa wanachama wa kikundi, na kwa wapenzi hiyo ni ninyi wawili."
    - q: "Je, tunaweza kuweka 62/38 mara moja kwa kila kitu?"
      a: "Mgawanyo unawekwa kwa kila gharama, si kwa kikundi. Nakili gharama ambayo tayari ina 62 na 38, kisha ubadilishe kinachotofautiana. [Kugawanya gharama](page:feature/split-expenses) kunaeleza chaguo nyingine."
