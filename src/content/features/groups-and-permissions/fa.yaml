meta:
  title: "مدیریت گروه و مجوزها برای هزینه‌های مشترک | Side Badger"
  description: "با لینک یا کد QR دعوت کنید، عضوها را تأیید کنید، بیننده تعیین کنید، مجوزها را تنظیم کنید و وقتی تمام شد گروه را قفل کنید. گروه شما، قوانین شما، در حد معقول."
h1: "مدیریت گروه و مجوزها: قوانین شما، در حد معقول"
navLabel: "گروه‌ها و مجوزها"
lead: "بعضی گروه‌ها خزانه‌دار لازم دارند. Side Badger برای این هم تنظیمی دارد. با لینک یا کد QR دعوت کنید، تصمیم بگیرید چه کسی وارد شود و انتخاب کنید چه کسی می‌تواند اعداد را تغییر دهد. گروه کوچکی از دوستان می‌تواند همه‌اش را نادیده بگیرد، چون گروه‌های جدید کاملاً باز شروع می‌شوند."
cta:
  heading: "آماده‌اید گروهی مرتب را اداره کنید؟"
  body: "یک حساب بسازید، گروه را شروع کنید و لینک دعوت را بفرستید. بازش بگذارید، یا وقتی گروه بزرگ‌تر یا سخت‌گیرتر شد قوانین را محکم‌تر کنید."
problem:
  heading: "یک نفر باید حساب‌وکتاب را مرتب نگه دارد"
  body: "چهار هم‌خانه می‌توانند با اعتماد کار را راه بیندازند. سی مهمان در آخر هفته یک عروسی احتمالاً نمی‌توانند. برای هر خانه، سفر یا مراسم یک گروه بسازید، با حداکثر 50 نفر، و هر گروه اعضا، نقش‌ها و قوانین خودش را دارد. داشبورد شما همه را فهرست می‌کند، همراه با اینکه در هر کدام کجا ایستاده‌اید، در یک صفحه. بیشتر گروه‌ها هرگز به تنظیمات دست نمی‌زنند. آن‌هایی که می‌زنند معمولاً کسی را دارند که آن‌قدر منظم هست که تنظیمات را بخواهد."
workflow:
  heading: "از گروه خالی تا گروه قفل‌شده"
  steps:
    - title: "با لینک یا کد QR دعوت کنید"
      body: "**دعوت دیگران** را باز کنید، انتخاب کنید لینک چقدر معتبر بماند (15 دقیقه، 1 ساعت، 1 روز یا 5 روز) و بعد لینک را کپی کنید یا کد QR را نشان دهید تا اسکن کنند. از داخل برنامه می‌توانید افرادی را هم دعوت کنید که از قبل در گروهی دیگر با آن‌ها شریکید."
      shot: S03
      shotAlt: "پنجره دعوت با لینک گروه، کد QR آن و گزینه مدت اعتبار لینک"
    - title: "بگذارید پیش از پیوستن نگاهی بیندازند"
      body: "هر کسی که لینک را دارد وارد می‌شود یا حساب می‌سازد، پیش‌نمایشی از گروه می‌بیند و نامی را که می‌خواهد در آن داشته باشد انتخاب می‌کند. بعد **عضویت در گروه** را می‌زند."
      shot: S04
      shotAlt: "پیش‌نمایش پیوستن به یک گروه، که پیش از پیوستن به فردِ واردشده نشان داده می‌شود"
    - title: "تأیید کنید چه کسی عضو شود"
      body: "تأیید را روشن کنید تا افرادی که از لینک استفاده می‌کنند به‌عنوان اعضای در انتظار منتظر بمانند تا یک مدیر راهشان بدهد. مدیرها آن‌ها را در بخش **اعضای در انتظار** از **امنیت و دسترسی‌ها** پیدا می‌کنند و **تایید** یا **رد** را انتخاب می‌کنند. تا آن موقع، فرد در انتظار هیچ چیزی را در گروه نمی‌بیند."
      shot: S14
      shotAlt: "اعضای در انتظار که منتظر تأیید یا ردِ مدیر هستند"
    - title: "انتخاب کنید چه کسی چه چیزی را تغییر دهد"
      body: "**همکاری باز** یا **گروه مدیریت شده** را انتخاب کنید، یا مجوزها را یکی‌یکی تنظیم کنید. بعد به هر نفر یک نقش بدهید: مدیر، عضو یا بیننده. فقط مدیرها می‌توانند مجوزها و نقش‌ها را تغییر دهند."
      shot: S13
      shotAlt: "تب امنیت در تنظیمات گروه، با دو پیش‌تنظیم و مجوزهای سفارشی"
    - title: "وقتی تمام شد قفلش کنید"
      body: "وقتی سفر تمام شد و اعداد جا افتادند، یک مدیر می‌تواند **قفل کردن گروه** را روشن کند. هیچ‌کس نمی‌تواند هزینه اضافه یا ویرایش کند، پرداخت ثبت کند یا فهرست‌ها و نظرسنجی‌ها را ویرایش کند، و یک بنر این را می‌گوید. هیچ‌کس نمی‌تواند بی‌سروصدا یک تاکسی دیروقت را اضافه کند. اگر واقعاً یکی پیدا شد، مدیر می‌تواند قفل گروه را باز کند."
      shot: S15
      shotAlt: "گروهی که بنر قفل‌بودنش را نشان می‌دهد"
options:
  heading: "مدیرها، عضوها و بیننده‌ها"
  items:
    - title: "مدیر"
      body: "گروه را اداره می‌کند. مدیرها اعضای جدید را تأیید می‌کنند، نقش‌ها و مجوزها را تغییر می‌دهند، گروه را قفل می‌کنند، قفلش را باز می‌کنند و آن را می‌بندند. هر که گروهی بسازد در آغاز مدیر آن است و گروه هرگز بدون مدیر نمی‌ماند، چون آخرین مدیر را نمی‌شود تنزل داد."
    - title: "عضو"
      body: "مشارکت می‌کند. آنچه یک عضو می‌تواند انجام دهد به مجوزهای گروه بستگی دارد. در گروه همکاری باز تقریباً همه‌چیز است. در گروه مدیریت‌شده، اعضا فقط هزینه‌ها و فهرست‌هایی را که خودشان ساخته‌اند می‌توانند تغییر دهند."
    - title: "بیننده"
      body: "همه‌چیز را می‌بیند و چیزی را تغییر نمی‌دهد. بیننده نمی‌تواند هزینه یا فهرست اضافه یا ویرایش کند، کسی را دعوت کند، تنظیمات را تغییر دهد یا به تصویر سربرگ دست بزند. به درد کسی می‌خورد که می‌خواهد اعداد را تماشا کند و قول می‌دهد با آن‌ها ور نرود."
sections:
  - heading: "باز، مدیریت‌شده یا قوانین خودتان"
    body: "گروه‌های جدید با **همکاری باز** شروع می‌شوند، که در آن همه می‌توانند افراد را دعوت کنند، هزینه‌ها را تغییر دهند و فهرست‌ها را ویرایش کنند و اعضای جدید خودکار می‌پیوندند. **گروه مدیریت شده** برای وقتی است که یک نفر باید آدم بزرگ‌تر باشد. می‌توانید هفت مجوز را یکی‌یکی هم تنظیم کنید، و تغییر دادن یکی با دست گروه را به سفارشی تبدیل می‌کند. هر چه انتخاب کنید، فقط مدیرها می‌توانند خود مجوزها را تغییر دهند و هر تغییر در تاریخچه فعالیت دیده می‌شود. جمع [هم‌خانه‌ها](page:use-case/housemates) می‌توانند همه‌چیز را باز بگذارند. یک [مراسم یا جشن](page:use-case/events-and-celebrations) بزرگ اغلب گروه مدیریت‌شده می‌خواهد، تا یک نفر مسئول ورود افراد باشد. در این کارها تازه‌واردید؟ [نحوه کار](page:how-it-works) کل مسیر را، از اولین هزینه تا تسویه‌شدن حساب، مرور می‌کند."
    items:
      - "**چه کسی می‌تواند هزینه‌ها را ویرایش کند.** همکاری باز: هر عضو. گروه مدیریت‌شده: سازنده‌ها و مدیرها."
      - "**چه کسی می‌تواند هزینه‌ها را حذف کند.** همکاری باز: هر عضو. گروه مدیریت‌شده: سازنده‌ها و مدیرها."
      - "**چه کسی می‌تواند لیست‌ها را ویرایش کند.** همکاری باز: هر عضو. گروه مدیریت‌شده: سازنده‌ها و مدیرها."
      - "**چه کسی می‌تواند اعضا را دعوت کند.** همکاری باز: هر عضو. گروه مدیریت‌شده: فقط مدیرها."
      - "**تایید عضو جدید.** همکاری باز: خودکار. گروه مدیریت‌شده: تأیید مدیر لازم است."
      - "**چه کسی می‌تواند تنظیمات را تغییر دهد.** همکاری باز: هر عضو. گروه مدیریت‌شده: فقط مدیرها."
      - "**چه کسی می‌تواند تصویر سربرگ را تغییر دهد.** همکاری باز: هر عضو. گروه مدیریت‌شده: فقط مدیرها."
  - heading: "نام شما، عکس شما، تصویر سربرگ شما"
    body: "هر گروه فهرست بازیگران خودش را دارد. نامی را که دیگران در هر گروه می‌بینند انتخاب کنید (2 تا 50 نویسه، و در گروه تکراری نباشد) و اینکه با کدام‌یک از عکس‌های نمایه‌تان آنجا حاضر شوید. در خانه **سام** باشید و در سفر **سام (ماشین‌دار)**. هر کسی که اجازه تغییر تنظیمات را دارد می‌تواند گروه را تغییر نام دهد و توضیحش را ویرایش کند. تصویر سربرگ، یک JPEG، PNG، GIF یا WebP تا 10 MB، مجوز مخصوص خودش را دارد."
  - heading: "آرشیو، قفل یا بستن"
    body: "سه راه برای کنار گذاشتن یک گروه، از کم‌اهمیت‌تر تا جدی‌تر."
    items:
      - "**آرشیو** گروه را از داشبورد خودتان پنهان می‌کند، نه از داشبورد کس دیگری. هنوز می‌توانید بازش کنید و مثل قبل استفاده کنید، و **خروج گروه از آرشیو** برش می‌گرداند."
      - "**قفل** تغییرات را یخ می‌زند تا وقتی که مدیر قفل را باز کند. همه هنوز می‌توانند گروه و تاریخچه‌اش را بخوانند."
      - "**بستن** دائمی است، و برای همه. فقط مدیر می‌تواند انجامش دهد، با تایپ کردن نام گروه برای تأیید، و هیچ‌کس دیگر نمی‌تواند گروه را باز کند."
  - heading: "ترک یک گروه"
    body: "هر کسی پس از تسویه حساب می‌تواند گروه را ترک کند. تا وقتی حتی در یک ارز بدهکار یا طلبکارید، تا وقتی پرسشی باز درباره یک هزینه شما را درگیر کرده، یا اگر آخرین مدیر یا تنها عضو هستید، نمی‌توانید بروید. [پرداخت را ثبت کنید](page:feature/settle-up)، [پرسش درباره هزینه](page:guide/what-to-do-when-someone-disputes-a-shared-expense) را حل کنید، یا یک نفر دیگر را مدیر کنید، بعد بروید. برای برگشتن به دعوت‌نامه جدید نیاز دارید."
limits:
  heading: "در حد معقول: نوشته‌های ریز"
  items:
    - "یک گروه تا 50 نفر را در خود جا می‌دهد."
    - "فقط مدیرها می‌توانند مجوزها و نقش‌ها را تغییر دهند. آخرین مدیر را نمی‌شود تنزل داد."
    - "تنظیم ویرایش هزینه‌ها روی **فقط مدیران** یعنی فقط مدیرها می‌توانند هزینه اضافه هم بکنند."
    - "قفل جلوی تغییر هزینه‌ها، پرداخت‌های جدید، فهرست‌ها و نظرسنجی‌ها را می‌گیرد. همه هنوز می‌توانند گروه و تاریخچه‌اش را بخوانند و به پرداخت‌ها واکنش نشان دهند."
    - "بستن دائمی است. برنامه راهی برای بازگشایی گروه بسته‌شده ندارد."
    - "ساختن لینک دعوت جدید لینک‌های قبلی را لغو نمی‌کند. هر لینک تا انقضای خودش می‌ماند، پس وقتی نگران جایی هستید که ممکن است لینک به آن برسد، لینکی کوتاه‌مدت انتخاب کنید."
    - "دعوت‌های داخل برنامه افراد را از 10 گروه فعال اخیر شما فهرست می‌کنند. بقیه به لینک نیاز دارند و اینکه چه کسی می‌تواند دعوت کند به مجوزهای گروه بستگی دارد."
    - "پیوستن حساب لازم دارد و افراد باید پیش از افزودن هر چیزی ایمیلشان را تأیید کنند."
useCasesHeading: "جایی که کمی نظم کمک می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "بیننده می‌تواند هزینه اضافه کند؟"
      a: "نه. بیننده همه‌چیز را می‌بیند و چیزی را تغییر نمی‌دهد. نمی‌تواند هزینه یا فهرست اضافه یا ویرایش کند، کسی را دعوت کند یا تنظیمات را تغییر دهد."
    - q: "کسی می‌تواند وقتی بدهکار است گروه را ترک کند؟"
      a: "نه. هیچ‌کس نمی‌تواند تا وقتی حتی در یک ارز بدهکار یا طلبکار است گروه را ترک کند. اول تسویه حساب کنید، بعد بروید."
    - q: "وقتی گروه بسته می‌شود چه می‌شود؟"
      a: "هیچ‌کس نمی‌تواند دوباره بازش کند. فقط مدیر می‌تواند گروه را ببندد، برای تأیید باید نام گروه را تایپ کند و گروه برای همه در دسترس نخواهد بود. اگر فقط می‌خواهید جلوی تغییرات را بگیرید، قفلش کنید. اگر فقط می‌خواهید از داشبورد خودتان برود، آرشیوش کنید."
    - q: "می‌توانم قفل را برگردانم؟"
      a: "بله. مدیر می‌تواند قفل گروه را باز کند و تغییرات دوباره کار می‌کنند."
    - q: "باید پیش از پیوستن افراد تأییدشان کنم؟"
      a: "فقط اگر بخواهید. گروه‌های جدید با همکاری باز شروع می‌شوند، که در آن افرادی که از لینک استفاده می‌کنند خودکار می‌پیوندند. تأیید مدیر را روشن کنید، یا گروه مدیریت‌شده را انتخاب کنید، و هر نفر منتظر می‌ماند تا مدیر راهش بدهد."
    - q: "چند نفر می‌توانند در یک گروه باشند؟"
      a: "تا 50 نفر."
