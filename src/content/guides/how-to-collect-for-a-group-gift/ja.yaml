meta:
  title: みんなでの贈り物の費用を集める方法 | Side Badger
  description: 出す金額はそれぞれ違い、カードを切るのは一人だけ。予算を投票で決め、金額指定で入力すれば、計算はSide Badgerにおまかせです。
h1: みんなでの贈り物の費用を集める方法
navLabel: 贈り物の費用を集める
lead: みんなでの贈り物の費用を集めるとは、1人がお金を立て替え、ほかの全員がその人に自分の出し分を借りている、ということです。予算は投票で決め、買う人が自分のカードで贈り物を購入し、それを[金額指定](page:feature/split-expenses)で1つの支出として入力します。金額は1人ずつ決めます。Side Badgerが、誰が買った人にいくら借りているかを表示するので、各自が好きな方法で自分の分を送ります。
cta:
  heading: 集金袋を回さずに、お金を集めよう
  body: グループを作り、贈り物をもらう本人は入れずに、贈り物を金額指定で入力しましょう。Side Badgerは無料で、広告も1日の制限もありません。先に全体を知りたい方は、[使い方](page:how-it-works)や[無料で使える範囲](page:pricing)をご覧ください。
sections:
  - heading: 友だち4人、レコードプレーヤー1台、4通りの金額
    body: Beaは30歳になり、レコードプレーヤーを欲しがっています。Priya、Omar、Lena、Samの4人が贈ることにしました。Priyaが£240のものを見つけ、誰かが最初に動かなければならないので、自分のカードで購入します。4人の出し分は同じではありません。PriyaとOmarは£60ずつ、Lenaは£80、Samは£40を出します。誰も自分の金額の理由を説明せず、誰も尋ねません。Omarはカードとラッピングペーパーも£12で買いました。カードには4人全員が署名するので、こちらは均等に分けます。
  - heading: 誰かが購入ボタンを押す前に予算を決める
    body: 予算を投票で決めれば、£400のターンテーブルをめぐる言い合いを避けられます。グループで**投票を追加**を選び、プレゼントにいくらかけるかを尋ねます。選択肢は、£150まで、£200まで、£250までのように金額にします。**匿名投票**をオンにすると、誰が何に投票したかが非表示になるので、小さい金額を選んだ人がその理由を人前で説明する必要がなくなります。最初の1票が入ると設定は変更できなくなるので、先に確認してください。投票は自動では終了しません。全員が投票したら**投票を終了**を選ぶと、**優勝**が表示されます。投票で決まるのは合計額であり、誰の負担分も決まりません。
  - heading: 金額を数える
    body: 贈り物は£60、£60、£80、£40に分かれ、合計はレシートの£240になります。カードとラッピングは4人で分け、1人£3です。Priyaの負担は£60 + £3で£63、支払ったのは£240なので、£177を受け取る側になります。Omarの負担も£63ですが、支払ったのは£12なので、£51を借りています。Lenaは£80 + £3の£83、Samは£40 + £3の£43を借りています。この3人の合計が、Priyaの£177になります。そのままだと、貸し借りは5つの組み合わせで、グループ内を行き交います。Side Badgerは代わりに、すべてPriya宛ての3回の支払いを提案します。詳しくは[精算](page:feature/settle-up)をご覧ください。
  - heading: Side Badgerに入力する
    body: Priya側の作業は、5分ほどです。
    items:
      - "**グループを作る。** ダッシュボードで**グループを作成**を選びます。**他の人を招待**を選び、リンクまたはQRコードを、お金を出す人たちだけに送ります。ほかの人には送りません。"
      - "**贈り物を追加する。** **経費を追加**を選び、内容を書いて、240を入力し、「**誰が支払いましたか？**」でPriyaを選びます。**割り勘相手**は4人全員のままにして、**割り勘方法**で**正確な金額**を選び、60、60、80、40を入力します。金額の合計は240になる必要があります。ご希望なら、注文確認を添付できます。**経費を保存**を選びます。"
      - "**カードを追加する。** Omarが自分で£12を追加し、「**誰が支払いましたか？**」で自分を選び、**割り勘方法**は**均等**のまま、4人全員にチェックを入れておきます。"
      - "**数えてから、支払う。** 全員が、誰が誰に借りているかが表示される**残高**を確認し、好きな方法でPriyaに自分の分を送ります。そのあと**精算する**と**精算を記録**で記録します。クイック精算を使うと、金額が自動で入力されます。"
  - heading: 先に買うか、先に集めるか
    body: Side Badgerは集めたお金を預かるわけではないので、「集める」というのは実際には数えることです。進め方は2通りあります。
    items:
      - "**先に買う。** 買う人が支払い、実際の価格で支出を追加すると、全員が自分の負担分をすぐに見られます。すっきりしますが、みんなが支払うまで買う人が費用を抱えるので、それができる人を買う人に選びましょう。"
      - "**先に集める。** 購入の前に、各自が自分の金額を買う人に送ります。価格が決まったら贈り物を入力し、そのあと、お金が実際に動いた日付で各支払いを記録します。どの支払いにも対応する残高があるように、先に贈り物を追加してください。"
      - "**価格が変わる。** 送料、割引コード、直前の値上げなど。贈り物を編集し、金額指定の数字を、合計が合うように変更します。以前のバージョンは残りますが、全員の残高が変わるので、先にグループに伝えましょう。"
  - heading: Beaには内緒にする
    body: グループを見られるのはメンバーだけなので、Beaは自分が入っていないグループを見ることができません。お金を出す人だけを招待し、ほかの人は招待しないでください。リンクは有効期限が切れるまで使え、期限は15分から5日まで選べるので、短めに設定して、Beaの目に入らない場所で送りましょう。リンクを開いた人には、グループのプレビューが表示されます。グループには「土曜の集金」のような地味な名前を付け、支出のラベルや投票の選択肢にもBeaの名前を入れないようにしてください。
  - heading: ここでSide Badgerにできないこと
    items:
      - お金を預かったり、集めたりはしません。出し分は、銀行振込や現金など、使っている方法で買う人に渡り、そのあと誰かが記録します。
      - 支払いのリマインダーは送りません。まだ支払っていない人にそっと声をかけるのは、今も人間の仕事です。
      - 誰の負担分も計算してくれません。投票で決まるのは予算で、「残りを分ける」という選択肢はないので、各金額は自分で入力します。
      - 1つの支出につき支払う人は1人です。贈り物の別々の部分を2人が買った場合は、2つの支出を入力してください。
      - 分割に含まれる全員が、無料アカウントを持ち、グループのメンバーである必要があります。
exampleAfter: 2
example:
  heading: Beaのレコードプレーヤーと、カード
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: omar
      name: Omar
    - id: lena
      name: Lena
    - id: sam
      name: Sam
  expenses:
    - label: 贈り物
      payer: priya
      amount: 240
      split:
        method: exact
        shares:
          priya: 60
          omar: 60
          lena: 80
          sam: 40
    - label: カードとラッピング
      payer: omar
      amount: 12
      split:
        method: equal
faq:
  heading: よくある質問
  items:
    - q: 集まった金額が贈り物の値段を超えたら？
      a: 金額指定の数字は値段と合計が合う必要があるので、合うまで負担分を減らしてください。あるいは、余った分を花束など実際のものに回し、例のカードとラッピングのように、2つ目の支出として入力します。
    - q: グループに参加せずに出し合えますか？
      a: 数に入れたいなら、できません。分割に含まれる全員に、無料アカウントとグループへの参加が必要です。現金しか持っていない人の場合は、Priyaがその現金を受け取り、グループがまだ負担する金額で贈り物を入力する方法があります。たとえば、Samが現金で£40を渡した場合、Priyaは£200を入力し、自分、Omar、Lenaの3人で60、60、80に分けます。
    - q: 投票で、1人いくら出すかを決められますか？
      a: いいえ。投票で決まるのは、予算のようなグループ全体の数字です。各自の負担分は自分たちで話し合って決め、そのあと**正確な金額**として支出に入力します。
