meta:
  title: "Jak działa Side Badger | Dziel wydatki grupy w pięciu krokach"
  description: "Załóż grupę, zaproś ludzi, dodawaj wydatki i rozlicz się. Zobacz, co dzieje się między „ktoś zapłacił” a „jesteśmy kwita”, na przykładzie krok po kroku."
h1: "Jak działa Side Badger"
navLabel: "Jak to działa"
lead: "Co dzieje się między „ktoś zapłacił” a „jesteśmy kwita”? Pięć kroków, żadnego arkusza i jeden borsuk, który jest głównie ozdobą. Oto cała droga, od pierwszej grupy do ostatniej zarejestrowanej płatności. Szczegóły każdego kroku znajdziesz w [dzieleniu wydatków](page:feature/split-expenses) i [rozliczaniu](page:feature/settle-up)."
cta:
  heading: "Od „ja zapłacę” do „jesteśmy kwita”"
  body: "Załóż darmowe konto, utwórz grupę i dodaj pierwszy wydatek. Borsuk nie oceni paragonu."
  button: "Załóż darmowe konto"
steps:
  - title: "Utwórz grupę"
    body: "Zrób osobną grupę dla każdego domu, wyjazdu i wydarzenia, żeby czynsz nie wylądował na tej samej liście co prezent ślubny. Nadaj jej nazwę, wybierz imię, pod którym ludzie będą cię widzieć, i jeśli chcesz, ogranicz waluty, które przyjmuje. Twój pulpit pokazuje potem wszystkie grupy i twoją sytuację w każdej, na jednym ekranie."
    shot: S02
    shotAlt: "Okno tworzenia grupy z otwartą sekcją ograniczeń walutowych"
  - title: "Zaproś swoich ludzi"
    body: "Udostępnij link do dołączenia albo pokaż kod QR i ustaw, jak długo działa: od 15 minut do 5 dni. Każdy, kto dołącza, potrzebuje darmowego konta i zweryfikowanego adresu e-mail, a w grupie może być do 50 osób. Jeśli chcesz decydować, kto wchodzi, włącz zatwierdzanie, a administrator wpuści każdą osobę."
    shot: S03
    shotAlt: "Okno zaproszenia na karcie z linkiem, z kodem QR i wyborem czasu ważności"
  - title: "Dodawaj wydatki na bieżąco"
    body: "Wpisz, kto zapłacił, ile i za kogo. Podziel po równo, według dokładnych kwot albo procentowo i pomiń każdego, kto w tym nie uczestniczył. Dodaj wydatek, a wszyscy zobaczą go od razu, razem z informacją, co się zmieniło i kto to zmienił."
    shot: S05
    shotAlt: "Formularz wydatku z podziałem procentowym czynszu według wielkości pokoju"
  - title: "Patrz na salda"
    body: "Side Badger prowadzi bieżące saldo osobno dla każdej waluty, więc od razu widać, kto komu jest winien. Zamiast zostawiać wszystkich z plątaniną drobnych długów, podpowiada krótką listę płatności, która rozlicza grupę."
    shot: S10
    shotAlt: "Ekran sald z uproszczonymi długami w dwóch walutach i włączonym przyciskiem Pokaż wszystko"
  - title: "Rozlicz się poza aplikacją, zapisz to w aplikacji"
    body: "Side Badger nigdy nie przesyła pieniędzy. Płaćcie sobie, jak chcecie, a potem zarejestruj płatność, żeby salda się zaktualizowały, a ekran każdego odświeżył się bez przeładowania. „Rozliczone” oznacza po prostu, że salda wynoszą zero. Nikt nie może opuścić grupy, dopóki jest komuś winien pieniądze albo ktoś jest winien jemu, więc kto zmierza do wyjścia, najpierw się rozlicza."
    shot: S11
    shotAlt: "Formularz płatności z przyciskami szybkiego rozliczenia i komunikatem o częściowej płatności"
requirements:
  heading: "Czego potrzebujesz"
  items:
    - "Darmowego konta. Wystarczy adres e-mail i hasło, a przed dodaniem czegokolwiek weryfikujesz e-mail."
    - "Ukończonych 18 lat."
    - "Nowoczesnej przeglądarki w telefonie albo komputerze i połączenia z internetem. Side Badger nie jest aplikacją ze sklepu i nie działa offline."
    - "Opcjonalnie miejsca na ekranie głównym. Sklep z aplikacjami nie jest potrzebny, bo po zalogowaniu możesz dodać Side Badger do ekranu głównego albo docka, a otwiera się jak aplikacja. Jak to zrobić, pokażą Ustawienia w aplikacji."
