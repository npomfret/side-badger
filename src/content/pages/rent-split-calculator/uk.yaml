example:
  heading: "Одна квартира, один місяць"
  currency: GBP
  people:
    - id: priya
      name: Прія
    - id: tom
      name: Том
    - id: aisha
      name: Аїша
  expenses:
    - label: "оренда"
      payer: priya
      amount: 1950
      split:
        method: percent
        shares:
          priya: 39
          tom: 32
          aisha: 29
    - label: "рахунок за енергію"
      payer: tom
      amount: 105
      split:
        method: equal
    - label: "інтернет"
      payer: aisha
      amount: 36
      split:
        method: equal
faq:
  heading: "Запитання"
  items:
    - q: "Що чесніше: розмір кімнати чи дохід?"
      a: "Жоден спосіб не чесніший за всіх обставин. Розмір кімнати пасує сусідам, які платять за простір, де сплять. Дохід пасує парам і друзям із дуже різною зарплатою. Домовтеся до першого дня оплати, а не після."
    - q: "Чи ділити рахунки так само?"
      a: "Для сусідів зазвичай ні. Енергією та інтернетом користуються всі, тож порівну простіше, як у прикладі. За доходом калькулятор дає рахункам такі самі частки, як і оренді."
    - q: "Чи можна використовувати квадратні фути?"
      a: "Так. Оберіть ft² і вводьте площі в квадратних футах. Одиниця — лише підпис, і частки виходять однаковими, якщо всі користуються однією."
    - q: "Чи безкоштовний калькулятор?"
      a: "Так. Безкоштовно. Без реклами. Без денних обмежень. Обліковий запис теж не потрібен."
