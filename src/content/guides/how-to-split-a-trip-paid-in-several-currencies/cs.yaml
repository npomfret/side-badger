faq:
  heading: "Otázky"
  items:
    - q: "Jaký směnný kurz Side Badger používá?"
      a: "Aktuální směnný kurz, který se načte při zadání výdaje, pokud je k dispozici. Můžete ho změnit na kurz, který jste skutečně dostali."
    - q: "Může se skupina držet jen liber a jenů?"
      a: "Ano. V **Nastavení** skupiny zapněte pod **Nastavení měny** volbu **Omezit měny pro tuto skupinu**, vyberte **Povolené měny** a nastavte **Výchozí měna pro nové výdaje**. Méně možností v seznamu, méně chybných tipů u pokladny."
    - q: "Musíme vůbec převádět?"
      a: "Ne. Měny zůstávají odděleně, pokud se vy nebo vaše skupina nerozhodnete převádět, a každá měna dostane vlastní krátký seznam plateb."
