meta:
  title: "Deli stroške zabav, porok in skupnih daril"
  description: "Deli stroške zabave, poroke ali skupnega darila, ko ljudje prispevajo različne zneske. Glasujte o načrtu, deli po točnih zneskih in poglej, kdo komu dolguje."
h1: "Deli stroške zabav, porok in skupnih daril"
navLabel: "Dogodki in praznovanja"
lead: "Razdeli polog, okraske in zasilne dežnike. Razporeditev sedežev prepusti kateremu pogumnejšemu. Side Badger na enem mestu hrani, **kdo je koliko prispeval**, da se lahko zabava tudi organizator."
cta:
  heading: "Začni z naslednjim praznovanjem"
  body: "Ustvari uporabniški račun, ustanovi skupino za dogodek in pošlji povezavo za povabilo. Side Badger je brezplačen, brez oglasov in brez dnevnih omejitev."
  button: "Ustvari brezplačen račun"
scenario:
  heading: "Vsak prispeva, ne vedno enako"
  body: "Nekdo plača polog za prostor, nekdo drug kupi torto, tretji pa skupno darilo plača z lastno kartico. Nekateri gostje pridejo na vse, nekateri le na večerjo. Pošteno štetje tega v klepetu je delo, za katero se nihče ni prijavil. Skupina v Side Badger drži vse, ne glede na mešanico zneskov, in vsakomur pokaže, koliko dolguje ali koliko mu dolgujejo. Osnove najdeš pri [kako deluje](page:how-it-works), ali pa beri naprej o dogodku."
sections:
  - heading: "Odločajte skupaj"
    body: "Preden se premakne kakršen koli denar, izbiro daj v **anketo**. Dodaj do 10 možnosti, na primer dva prostora ali tri ideje za darilo, in vsi naj glasujejo. Skriješ lahko, kdo je za kaj glasoval, da vsaka možnost dobi pošteno priložnost, zmagovalec pa se pokaže, ko je anketa zaprta. Nihče ne rabi listati čez štirideset sporočil, da izve, kaj je bilo odločeno."
  - heading: "Kdo je pri čem"
    body: "Vsi ne plačajo enako in vsi ne sodelujejo pri vsakem strošku. Strošek razdeli enako, po odstotkih ali po **točnih zneskih**, da je delež vsake osebe znesek, o katerem ste se dogovorili. Izpusti vsakogar, ki ni sodeloval, na primer goste, ki so izpustili večerjo, ali prijatelje, ki se niso pridružili darilu. Vsak strošek ima enega plačnika, vsi ostali v delitvi pa mu dolgujejo svoj delež. Podrobnosti so na strani [delitev stroškov](page:feature/split-expenses)."
  - heading: "Ohrani papirologijo"
    body: "K stroškom dodajaj opombe, na primer kaj je strošek pokril. Komentarji ostanejo **ob strošku**, na katerega se nanašajo, zato sta vprašanje „je bila torta £45 ali £54?“ in njen odgovor na istem mestu. Komentarji so lahko dolgi do 500 znakov, kar za vprašanje o pologu povsem zadošča."
  - heading: "Nadzor za organizatorja"
    body: "Odprto sodelovanje omogoča vsakemu članu dodajanje in urejanje stroškov, kar je za majhno darilo v redu. Za poroko ali večjo zabavo izberi prednastavitev **Upravljana skupina**. Skrbniki potrdijo vsakega novega člana, stroške pa lahko spreminjajo samo ustanovitelji in skrbniki. Ljudi povabi s povezavo ali kodo QR; ob vklopljenem potrjevanju skrbnik vsako osebo spusti noter, zato seznam gostov ostane seznam gostov. Ko je dogodek mimo, skupino zakleni, da številke ostanejo."
  - heading: "Poravnajte se po zabavi"
    body: "Ko prispe zadnji račun, stanja pokažejo, **kdo komu dolguje**, Side Badger pa predlaga kratek seznam plačil, ki poravna vse. Plačajte si, kakor želite, nato plačilo zabeležite v skupini. Side Badger nikoli ne premika denarja, zato skupina vodi štetje, nakazila pa potekajo v vaših bančnih aplikacijah. Stran [poravnava](page:feature/settle-up) pokaže, kako se zmešnjava spremeni v kratek seznam."
