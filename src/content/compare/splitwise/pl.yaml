sections:
  - heading: Rozmowy o pieniądzach, obok pieniędzy
    body: Wspólne pieniądze to też pogaduchy, wątpliwości i plany. Side Badger trzyma wszystkie trzy obok liczb, więc nikt nie musi cofać się po czacie.
    items:
      - "**Komentarze tam, gdzie ich miejsce.** Komentuj samą grupę albo dowolny wydatek, listę czy ankietę i trzymaj rozmowę przy tym, czego dotyczy."
      - "**Paragony i zdjęcia.** Trzymaj do trzech paragonów przy każdym wydatku i dodawaj zdjęcia lub pliki PDF do komentarzy w grupie, na liście albo w ankiecie."
      - "**Pytania zamiast kłótni.** Administrator może włączyć pytania, a wtedy każdy, kto jest w wydatku, może o niego zapytać. Wydatek zostaje poza saldami, dopóki sprawa nie jest wyjaśniona."
      - "**Listy i ankiety.** Trzymaj wspólną listę zakupów obok rachunków za zakupy i zrób głosowanie nad krótką listą willi, anonimowo, jeśli wolisz."
      - "**Trochę oklasków.** Reaguj na wydatki, płatności i komentarze, a gdy płatność wpadnie, zaklaszcz."
  - heading: Twoja grupa, twoje zasady
    body: Centrum pomocy Splitwise mówi, że nie obsługuje administratorów grup ani specjalnych uprawnień. Side Badger ma role i uprawnienia, dla grup, które potrzebują kogoś, kto pilnuje porządku w liczbach.
    items:
      - "**Administratorzy, członkowie i widzowie.** Zrób z kogoś widza: widzi wszystko i niczego nie zmienia."
      - "**Dwa gotowe zestawy albo własne ustawienia.** Zacznij od Otwartej współpracy albo Grupy zarządzanej, albo ustaw każde uprawnienie osobno: kto edytuje i usuwa wydatki, edytuje listy, zaprasza i wpuszcza nowe osoby."
      - "**Zatwierdzanie dołączenia.** Włącz zatwierdzanie, a administrator wpuszcza każdą osobę osobno."
      - "**Własne ustawienia grupy.** Ogranicz ją do walut, których naprawdę używasz, wybierz jej domyślną walutę i dodaj zdjęcie nagłówka."
      - "**Zablokuj, gdy już po wszystkim.** Liczby zostają, jak są, dopóki administrator ich nie odblokuje."
  - heading: Tu za darmo, tam płatne
    body: Splitwise Pro to płatny plan Splitwise, a jego własna strona Pro sprzedaje trzy rzeczy, które w Side Badger nic nie kosztują.
    items:
      - "**Skanowanie paragonów.** Splitwise Pro skanuje zdjęcie paragonu. Side Badger robi to za darmo, bez pakietów skanów: uzupełnia sumę, datę i miejsce do sprawdzenia."
      - "**Przeliczanie walut.** Splitwise Pro przelicza wydatki grupy na twoją domyślną walutę, gdy dotkniesz Przelicz. Side Badger przelicza każdy wydatek przy wpisywaniu, po aktualnym kursie albo po tym, który faktycznie obowiązywał, a oryginalna kwota zostaje przy wydatku."
      - "**Bez dziennego limitu.** Splitwise Pro sprzedaje nieograniczoną liczbę wydatków, a jego centrum pomocy mówi, że darmowi użytkownicy mogą dodawać do 4 wydatków dziennie. Side Badger nie ma dziennego limitu."
  - heading: Twój bank zostaje poza grą
    body: "Side Badger nie łączy się z twoim bankiem i nie prosi o dane twojego banku. Prowadzi rejestr, kto komu jest winien; płacisz, jak chcesz, a potem rejestrujesz płatność. Żadnego logowania do banku, więc o jedną rzecz mniej do pilnowania."
  - heading: Jedna aplikacja, w przeglądarce i na telefonie
    body: Side Badger działa w przeglądarce. Zaloguj się, dodaj go do ekranu głównego, a otworzy się jak aplikacja. To ta sama aplikacja tu i tu, więc nowa funkcja jest na twoim telefonie przy najbliższym otwarciu aplikacji, bez czekania na aktualizację ze sklepu.
  - heading: I kilka popisowych sztuczek
    items:
      - "**Zapytaj swojego asystenta.** Side Badger współpracuje z ChatGPT i Claude: poproś swojego, żeby dodał wydatek, zeskanował paragon albo zarejestrował płatność."
      - "**Każdy w swoim języku.** Side Badger mówi w 39 językach, a każda osoba wybiera własny. Strona główna Splitwise mówi o 7+. Obsługuje też 133 waluty, na wyjazd, który zabierze cię wszędzie."
      - "**Pomoc bez wychodzenia z aplikacji.** Coś nie działa albo trafił ci się błąd? Napisz do nas z aplikacji i od razu tam przeczytaj naszą odpowiedź."
  - heading: W czym Splitwise nadal wygrywa
    body: Lepiej od razu wybrać właściwą aplikację, niż przekonać się o tym później. Jeśli twoja grupa potrzebuje którejś z tych rzeczy, Splitwise to ma, a Side Badger nie.
    items:
      - "**Aplikacje ze sklepu.** Side Badger działa w przeglądarce i na ekranie głównym, a nie w sklepach z aplikacjami."
      - "**Tryb offline.** Side Badger potrzebuje połączenia."
      - "**Płatności w aplikacji.** W niektórych krajach Splitwise potrafi też przesyłać pieniądze. Side Badger tylko prowadzi rejestr."
      - "**Dzielenie według udziałów lub pozycji.** W Side Badger każdy wydatek ma jednego płatnika i dzieli się go po równo, według dokładnych kwot albo procentowo. Skanowanie paragonów nie przypisuje pozycji do osób."
      - "**Wykresy i domyślne podziały.** Splitwise Pro ma jedno i drugie. Side Badger prowadzi rachunek, kto komu jest winien, i na tym cała sztuczka polega."
  - heading: Przenosiny grupy
    body: Nie ma importera, więc przenosiny oznaczają nowy start. Najpierw rozlicz się w Splitwise, potem utwórz grupę w Side Badger i zaproś wszystkich linkiem lub kodem QR. Każdy w grupie potrzebuje darmowego konta, a do rejestracji wystarczy adres e-mail.
table:
  heading: Obok siebie
  caption: Dane o Splitwise z dnia {date}, ze stron samego Splitwise.
  sourceLabel: Źródło
  columns:
    feature: Co
    other: Splitwise, według jego własnych stron
    sideBadger: Side Badger
  rows:
    - feature: Ile kosztuje
      other: Splitwise Pro to subskrypcja miesięczna lub roczna. Plany roczne zawierają Trip Pass, który daje grupie wyjazdowej funkcje Pro na 30 dni.
      sideBadger: Za darmo.
      source: pro-help
    - feature: Wydatki dziennie
      other: Jego centrum pomocy mówi, że darmowi użytkownicy mogą dodawać do 4 wydatków dziennie. Pro nie ma dziennego limitu.
      sideBadger: Bez dziennego limitu.
      source: pro-help
    - feature: Role i uprawnienia w grupie
      other: Jego centrum pomocy mówi, że nie obsługuje administratorów grup ani specjalnych uprawnień.
      sideBadger: Administratorzy, członkowie i widzowie. Dwa gotowe zestawy albo własne uprawnienia, zatwierdzanie dołączenia i blokada na koniec.
      source: permissions-help
    - feature: Skanowanie paragonów
      other: Funkcja Pro. Skanuje zdjęcie paragonu, a podział na pozycje w Pro pozwala przypisać pozycje do osób.
      sideBadger: Za darmo, bez pakietów skanów. Uzupełnia sumę, datę i miejsce do sprawdzenia i nie przypisuje pozycji do osób.
      source: pro
    - feature: Przeliczanie walut
      other: Funkcja Pro. Dotknij Przelicz, a Splitwise przeliczy wydatki grupy na twoją domyślną walutę po kursie z tej chwili.
      sideBadger: Za darmo. Przeliczaj każdy wydatek przy wpisywaniu, po aktualnym kursie albo po tym, który faktycznie obowiązywał. Oryginalna kwota zostaje przy wydatku.
      source: currencies-help
    - feature: Waluty i języki
      other: 100+ walut i 7+ języków, jak ujmuje to jego strona główna.
      sideBadger: 133 waluty i 39 języków. Każdy w grupie może wybrać własny język.
      source: home
    - feature: Gdzie z tego korzystasz
      other: Aplikacje na iPhone'a i Androida oraz wersja internetowa.
      sideBadger: W przeglądarce. Zaloguj się, dodaj go do ekranu głównego i otworzy się jak aplikacja. Nie ma go w sklepach z aplikacjami.
      source: home
    - feature: Sposoby dzielenia
      other: Po równo, według dokładnych kwot, procentowo, według udziałów, według korekty lub według pozycji.
      sideBadger: Po równo, według dokładnych kwot albo procentowo, z jednym płatnikiem na wydatek. Nie według udziałów ani pozycji.
      source: split-help
    - feature: Praca offline
      other: Wymienia tryb offline wśród swoich podstawowych funkcji.
      sideBadger: Nie. Potrzebuje połączenia.
      source: home
    - feature: Płatności i twój bank
      other: "W niektórych miejscach potrafi wysyłać pieniądze z poziomu aplikacji: Splitwise Pay w USA, Venmo dla sald w dolarach amerykańskich, PayPal oraz Pay by Bank w wybranych krajach europejskich, który łączy osobiste konto bieżące."
      sideBadger: Nigdy nie dotyka twoich pieniędzy i nie prosi o dane banku. Płać, jak chcesz, a potem zarejestruj płatność.
      source: payments-help
    - feature: Wykresy i domyślne podziały
      other: Jedno i drugie to funkcje Pro.
      sideBadger: Nie ma ani jednego, ani drugiego.
      source: pro
faq:
  heading: Pytania
  items:
    - q: Czy Side Badger to darmowa alternatywa dla Splitwise?
      a: "Do dzielenia rachunków w grupie tak, i robi więcej niż rozliczenia: komentarze, pytania, listy, ankiety i role w grupie, a skanowanie paragonów i przeliczanie walut są za darmo. Jeśli potrzebujesz aplikacji ze sklepu, pracy offline albo płatności w aplikacji, robi to Splitwise, a Side Badger nie."
    - q: Skąd pochodzą dane o Splitwise?
      a: "Ze stron samego Splitwise: jego strony głównej, strony Pro i centrum pomocy. Każdy wiersz tabeli odsyła do strony, z której pochodzi, a data nad tabelą mówi, kiedy je czytaliśmy. Sprawdzamy je co kwartał."
    - q: Czy Side Badger pozostanie darmowy?
      a: Wszystko w Side Badger jest dziś darmowe. Jeśli to się kiedyś zmieni, najpierw damy ci znać. Szczegóły ma [strona z cennikiem](page:pricing).
    - q: Czy wszyscy w mojej grupie muszą się przesiąść?
      a: Tak. Każdy w grupie potrzebuje darmowego konta w Side Badger i może dołączyć linkiem lub kodem QR.
    - q: Czy Side Badger ma aplikację mobilną?
      a: "Nie w sklepie z aplikacjami. Działa w przeglądarce: zaloguj się na telefonie, a potem dodaj go do ekranu głównego, żeby otwierał się jak aplikacja. [Jak to działa](page:how-it-works) pokazuje jak."
