meta:
  title: "Comment faire la collecte pour un cadeau de groupe | Side Badger"
  description: "Chacun met une somme différente et une seule carte encaisse. Votez le budget, saisissez des montants exacts, Side Badger fait les calculs."
h1: "Comment faire la collecte pour un cadeau de groupe"
navLabel: "Collecte pour un cadeau"
lead: "Une collecte pour un cadeau de groupe, c'est une personne qui avance l'argent et tous les autres qui lui doivent leur participation. Convenez d'un budget avec un sondage, laissez l'acheteur mettre le cadeau sur sa carte, puis saisissez-le comme une seule dépense en [montants exacts](page:feature/split-expenses), un chiffre par personne. Side Badger montre qui doit quoi à l'acheteur, et chacun envoie sa part comme il veut."
cta:
  heading: "Faites passer le chapeau, sans le chapeau"
  body: "Faites un groupe, laissez de côté la personne qui reçoit le cadeau et saisissez le présent en montants exacts. Side Badger est gratuit, sans publicité et sans limite quotidienne. Vous voulez d'abord faire le tour ? Voyez [comment ça marche](page:how-it-works) ou [ce que couvre la gratuité](page:pricing)."
sections:
  - heading: "Quatre amis, une platine vinyle, quatre sommes différentes"
    body: "Bea fête ses 30 ans et veut une platine vinyle. Priya, Omar, Lena et Sam la lui offrent. Priya en trouve une à 240 £ et l'achète avec sa propre carte bancaire, parce qu'il faut bien que quelqu'un se lance. Les quatre ne participent pas à parts égales. Priya et Omar mettent 60 £ chacun, Lena 80 £ et Sam 40 £. Personne n'explique son chiffre et personne ne demande. Omar achète aussi une carte de vœux et du papier cadeau pour 12 £. Les quatre signent la carte, donc celle-ci est partagée à parts égales."
  - heading: "Convenez du budget avant que quiconque clique sur Acheter"
    body: "Un sondage sur le budget évite la dispute au sujet d'une platine à 400 £. Dans le groupe, choisissez **Ajouter Sondage** et demandez combien le cadeau devrait coûter. Faites de vos options des montants, par exemple jusqu'à 150 £, jusqu'à 200 £ et jusqu'à 250 £. Activez **Vote anonyme**, qui cache qui a voté pour quoi, pour que personne n'ait à défendre un chiffre plus bas à voix haute. Les réglages du sondage ne peuvent plus changer une fois le premier vote enregistré ; vérifiez-les donc d'abord. Un sondage ne se ferme pas tout seul. Quand tout le monde a voté, choisissez **Fermer sondage** et le **Gagnant** s'affiche. Le sondage met d'accord sur le total. Il ne détermine la part de personne."
  - heading: "Lire le décompte"
    body: "Le cadeau se partage en 60 £, 60 £, 80 £ et 40 £, ce qui fait bien les 240 £ du reçu. La carte et le papier cadeau se partagent en quatre, à 3 £ chacun. La part de Priya est de 60 £ + 3 £, soit 63 £, et elle a payé 240 £, ce qui lui laisse 177 £ à recevoir. La part d'Omar est elle aussi de 63 £, mais il a payé 12 £, donc il doit 51 £. Lena doit 80 £ + 3 £, soit 83 £, et Sam doit 40 £ + 3 £, soit 43 £. Ces trois montants font les 177 £ de Priya. Laissées telles quelles, les dettes emprunteraient cinq chemins à travers le groupe. Side Badger suggère plutôt trois paiements, tous pour Priya. [Régler les comptes](page:feature/settle-up) donne le détail."
  - heading: "Saisissez-le dans Side Badger"
    body: "Du côté de Priya, il faut compter environ cinq minutes."
    items:
      - "**Faites le groupe.** Sur le tableau de bord, choisissez **Créer Groupe**. Choisissez **Inviter d'Autres** et envoyez le lien ou le code QR aux personnes qui participent, et à personne d'autre."
      - "**Ajoutez le cadeau.** Choisissez **Ajouter Dépense**, décrivez-la, saisissez 240 et, sous **Qui a payé ?**, choisissez Priya. Gardez les quatre personnes sous **Divisé entre**, puis, sous **Comment diviser**, choisissez **Montants exacts** et tapez 60, 60, 80 et 40. Les montants doivent faire 240 au total. Joignez la confirmation de commande si vous voulez. Choisissez **Enregistrer Dépense**."
      - "**Ajoutez la carte.** Omar ajoute lui-même les 12 £, se choisit sous **Qui a payé ?** et laisse **Comment diviser** sur **Égal**, avec les quatre personnes cochées."
      - "**Comptez, puis payez.** Chacun consulte les **Soldes**, qui montrent qui doit quoi à qui, et envoie sa part à Priya comme il veut. Puis enregistrez-la avec **Régler** et **Enregistrer Règlement**. Le règlement rapide remplit le montant."
  - heading: "Acheter d'abord, ou collecter d'abord"
    body: "Side Badger ne détient pas la cagnotte, donc « collecter » veut surtout dire compter. Deux façons de s'y prendre marchent."
    items:
      - "**Acheter d'abord.** L'acheteur paie, ajoute la dépense au vrai prix et chacun voit sa part tout de suite. C'est plus propre, mais l'acheteur porte le coût jusqu'à ce que les autres paient ; choisissez donc un acheteur qui peut se le permettre."
      - "**Collecter d'abord.** Chacun envoie sa somme à l'acheteur avant l'achat. Une fois le prix connu, saisissez le cadeau, puis enregistrez chaque paiement avec la date à laquelle l'argent a vraiment bougé. Ajoutez d'abord le cadeau, pour que chaque paiement ait un solde auquel se rattacher."
      - "**Le prix bouge.** La livraison, un code de réduction, une hausse de dernière minute. Modifiez le cadeau et changez les montants exacts pour qu'ils fassent toujours le compte. La version précédente est conservée, mais prévenez d'abord le groupe, car les soldes de chacun changent."
  - heading: "Tenez Bea à l'écart"
    body: "Seuls les membres d'un groupe peuvent le voir, donc Bea ne peut pas voir un groupe dont elle ne fait pas partie. Invitez les personnes qui participent, et personne d'autre. Un lien fonctionne jusqu'à son expiration, et vous pouvez choisir n'importe quelle durée de 15 minutes à 5 jours ; prenez-en donc une courte et envoyez-le là où Bea ne le verra pas. Le lien montre un aperçu du groupe à quiconque l'ouvre, alors donnez au groupe un nom banal, comme Cagnotte du samedi, et gardez aussi le nom de Bea hors des intitulés de dépenses et des options du sondage."
  - heading: "Ce que Side Badger ne fait pas ici"
    items:
      - "Il ne détient ni ne collecte l'argent. Les participations vont à l'acheteur par virement, en espèces ou par tout autre moyen que vous utilisez, puis quelqu'un les enregistre."
      - "Il n'envoie aucun rappel de paiement. Relancer celui qui n'a pas payé reste un travail humain."
      - "Il ne calcule la part de personne. Un sondage fixe le budget et il n'existe pas d'option « partager le reste », donc vous tapez chaque montant."
      - "Chaque dépense a un seul payeur. Si deux personnes ont acheté des parties différentes du cadeau, saisissez deux dépenses."
      - "Toute personne dans le partage a besoin d'un compte gratuit et d'une place dans le groupe."
