faq:
  heading: "Kérdések"
  items:
    - q: "Melyik igazságosabb, a szobaméret vagy a jövedelem?"
      a: "Egyik sem mindig. A szobaméret azoknak a lakótársaknak való, akik azért a helyért fizetnek, ahol alszanak. A jövedelem pároknak és olyan barátoknak való, akiknek nagyon különbözik a fizetésük. Az első lakbérnap előtt egyezzetek meg benne, ne utána."
    - q: "A számlákat is ugyanígy kell megosztani?"
      a: "Lakótársaknál általában nem. Az áramot és az internetet mindenki használja, ezért az egyenlő felosztás egyszerűbb, ahogy a példában is. Jövedelem szerint a kalkulátor a számláknak ugyanazokat a részeket adja, mint a lakbérnek."
    - q: "Használhatok négyzetlábat?"
      a: "Igen. Válaszd a ft² lehetőséget, és négyzetlábban írd be a területeket. A mértékegység csak címke, és a részek ugyanúgy jönnek ki, amíg mindenki ugyanazt használja."
    - q: "Ingyenes a kalkulátor?"
      a: "Igen. Ingyenes. Hirdetések nélkül. Napi korlátok nélkül. Fiók sem kell hozzá."
