faq:
  heading: "Întrebări"
  items:
    - q: "Este calculatorul gratuit?"
      a: "Da. Gratuit. Fără reclame. Fără limite zilnice. Nici cont nu îți trebuie."
    - q: "Salvează ce scriu?"
      a: "Nu. Nimic nu se salvează și nimic nu se trimite nicăieri. Ca să-ți păstrezi cifrele, folosește Copiază linkul și salvează linkul undeva."
    - q: "Cine poate vedea linkul pe care îl copiez?"
      a: "Oricine îl are. Cifrele se află chiar în link, după #, așa că dă-l doar celor care ar trebui să le vadă."
    - q: "Mută bani?"
      a: "Nu. Calculează cine ar trebui să plătească cui, iar voi vă plătiți unii altora cum preferați. Nici Side Badger nu se atinge de banii tăi. Vezi [decontarea](page:feature/settle-up)."
    - q: "Pot împărți o excursie plătită în două valute?"
      a: "Nu aici, pentru că un calcul are o singură valută. Într-un grup, fiecare valută își ține propriul sold. Vezi [mai multe valute](page:feature/multiple-currencies)."
    - q: "Ce se întâmplă dacă sumele nu dau totalul?"
      a: "Calculatorul spune asta sub cheltuială și nu arată niciun rezultat până când se potrivesc. Sumele exacte trebuie să dea împreună totalul, iar procentele trebuie să dea 100."
