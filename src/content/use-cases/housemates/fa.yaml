faq:
  heading: "پرسش‌ها"
  items:
    - q: "اجاره می‌تواند خودکار تکرار شود؟"
      a: "نه، قبض تکراری وجود ندارد. اجاره ماه قبل را با چند ضربه کپی کنید، تاریخ را عوض کنید و تمام."
    - q: "می‌توانیم بر اساس اندازه اتاق تقسیم کنیم؟"
      a: "بله، با درصد. به هر هم‌خانه سهمی بدهید که اتاقش را نشان دهد، به شرط اینکه جمع سهم‌ها 100 شود. [تقسیم هزینه‌ها](page:feature/split-expenses) روش‌های دیگر تقسیم را توضیح می‌دهد."
    - q: "اگر هم‌خانه‌ای بدهکار اسباب‌کشی کند چه؟"
      a: "تا تسویه نکرده نمی‌تواند از گروه خارج شود، چون تا وقتی کسی بدهکار یا طلبکار است نمی‌تواند برود. اعداد تا صاف شدن حساب همه صادق می‌مانند."
    - q: "آیا Side Badger قبض‌ها را می‌پردازد؟"
      a: "نه. حساب را نگه می‌دارد و فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد. هر طور دوست دارید به هم پرداخت می‌کنید، بعد ثبتش می‌کنید، همان‌طور که [تسویه حساب](page:feature/settle-up) توضیح می‌دهد."
    - q: "می‌شود یک هم‌خانه دفتر را نگه دارد؟"
      a: "بله. او را مدیر کنید و از گروه مدیریت‌شده استفاده کنید، که اعضای جدید به تأیید نیاز دارند و فقط سازنده‌ها و مدیرها می‌توانند هزینه‌ها را تغییر دهند."
