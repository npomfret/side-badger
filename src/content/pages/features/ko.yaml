meta:
  title: "사이드 배저가 하는 일, 하지 않는 일"
  description: "지출 나누기, 정산, 여러 통화는 물론 그룹, 리스트, 투표까지. 전체 기능과, 사이드 배저가 제공하지 않는 것에 대한 솔직한 목록입니다."
h1: "사이드 배저가 하는 일"
navLabel: "기능"
lead: "상자 안에 든 것 전부, 그리고 들어 있지 않은 것까지."
intro: "전체 구성을 소개합니다. 스프레드시트는 일부러 뺐어요. 사이드 배저가 매일 하는 세 가지 일부터 보고, 나머지 목록과 제공하지 않는 기능의 짧은 목록도 확인해 보세요."
cta:
  heading: "우리 그룹에 필요한 기능이 있나요?"
  body: "무료 계정을 만들고 먼저 작은 그룹으로 사용해 보세요."
  button: "무료 계정 만들기"
cardsHeading: "세 가지 핵심 기능 자세히 보기"
sections:
  - heading: "영수증 스캔"
    body: "영수증을 찍으면 사이드 배저가 합계, 날짜, 장소를 채워 주니 확인만 하면 됩니다. 영수증 이미지는 Google의 AI 서비스가 읽습니다."
  - heading: "그룹과 권한"
    body: "집, 여행, 행사마다 최대 50명까지 그룹을 만드세요. 링크나 QR 코드로 사람들을 초대할 수 있어요. 더 큰 그룹에서는 모든 것을 볼 수 있지만 아무것도 바꿀 수 없는 보기 전용 멤버를 지정할 수 있습니다."
  - heading: "리스트와 투표"
    body: "공유 장보기 목록을 장보기 비용 옆에 두세요. 빌라 후보는 원하면 익명으로 투표에 부칠 수 있어요."
  - heading: "그 밖의 기능"
    items:
      - "**실시간 업데이트:** 지출을 추가하면 모두가 바로 확인할 수 있습니다."
      - "**언어:** 사이드 배저를 39개 언어로 사용할 수 있습니다. 그룹원마다 자신의 언어를 고를 수 있어요."
      - "**홈 화면:** 앱 스토어는 필요 없어요. 로그인한 다음 사이드 배저를 홈 화면에 추가하면 앱처럼 열립니다. 방법은 앱의 설정에서 알려 줘요."
      - "**피드백:** 버그를 찾으셨나요? 앱 안에서 알려 주시면 그곳에서 답변을 확인할 수 있어요."
  - heading: "사이드 배저가 하지 않는 일"
    items:
      - "**돈 옮기기.** 사이드 배저는 여러분의 돈을 절대 건드리지 않습니다. 원하는 방법으로 서로 지불하세요. 결제 요청 기능은 계획 중입니다."
      - "**청구서 반복.** 반복 지출은 없습니다. 지난달 청구서는 두 번 탭해서 복사하세요."
      - "**품목별 분할.** 지출 하나에 결제자는 한 명입니다. 똑같이, 정확한 금액으로, 또는 비율로 나누세요."
      - "**네이티브 앱 제공.** 브라우저에서 작동합니다. 로그인한 다음 홈 화면에 추가하세요."
      - "**오프라인 작동.** 인터넷 연결이 필요합니다."
      - "**이메일이나 문자 알림 발송.** 알림은 앱 안에 표시됩니다. 푸시 알림은 계획 중입니다."
      - "**차트나 예산 그리기.** 누가 누구에게 빚졌는지 기록하는 것, 그게 전부입니다."
      - "**Google이나 Apple로 로그인.** 이메일로 가입하세요. Google 및 Apple 로그인은 계획 중입니다."
      - "**계정 없이 참여하기.** 그룹의 모든 사람에게 무료 계정이 필요합니다."
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "사이드 배저로 결제할 수 있나요?"
      a: "아니요. 사이드 배저는 금액을 기록할 뿐 돈은 건드리지 않습니다. 원하는 방법으로 서로 지불한 다음 결제를 기록하세요."
    - q: "모바일 앱이 있나요?"
      a: "앱 스토어에는 없어요. 사이드 배저는 브라우저에서 실행됩니다. 휴대폰에서 로그인한 다음 홈 화면에 추가하면 앱처럼 열립니다. 방법은 앱의 설정에서 알려 줘요."
    - q: "품목별로 나눌 수 있나요?"
      a: "아니요. 지출 하나에 결제자는 한 명이고, 똑같이, 정확한 금액으로, 또는 비율로 나눕니다."
    - q: "오프라인에서도 작동하나요?"
      a: "아니요, 인터넷 연결이 필요합니다."
    - q: "그룹의 모든 사람에게 계정이 필요한가요?"
      a: "네. 그룹의 모든 사람에게 무료 계정이 필요하며, 가입에는 이메일 주소만 있으면 됩니다."
