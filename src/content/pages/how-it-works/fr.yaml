        method: equal
sections:
  - heading: "39 langues, et pensé pour plus de monde"
    body: "Utilisez Side Badger en 39 langues, dont l'arabe, le persan et l'ourdou, qui s'écrivent de droite à gauche. Chaque membre du groupe peut choisir la sienne, donc la page du groupe peut être en arabe pour l'un et en anglais pour le suivant. Il est aussi conçu pour les utilisateurs de clavier et de lecteur d'écran, et les couleurs des membres s'accompagnent de motifs, pour que vous n'ayez pas à distinguer le vert du rouge."
faq:
  heading: Questions
  items:
    - q: "Faut-il un compte pour tout le monde ?"
      a: "Oui, un compte gratuit. Chaque personne vérifie son e-mail avant d'ajouter quoi que ce soit."
    - q: "Y a-t-il une appli ?"
      a: "Elle fonctionne dans le navigateur. Connectez-vous, puis ajoutez-la à votre écran d'accueil ou à votre dock pour qu'elle s'ouvre comme une appli. Les Paramètres de l'appli vous montrent comment. Il n'y a pas de version dans les boutiques d'applications ni de mode hors connexion."
    - q: "Side Badger fait-il circuler l'argent ?"
      a: "Non. Il tient le compte et suggère des paiements, et vous vous remboursez comme vous voulez. Vous enregistrez ensuite le paiement. Voir [régler les comptes](page:feature/settle-up)."
    - q: "Peut-on partir en devant de l'argent ?"
      a: "Non. Personne ne peut quitter un groupe tant qu'il doit de l'argent ou qu'on lui en doit, donc il règle d'abord."
    - q: "Combien de personnes peuvent rejoindre un groupe ?"
      a: "Jusqu'à 50 personnes par groupe. Invitez-les avec un lien ou un code QR, et activez l'approbation si vous voulez qu'un admin laisse entrer chaque personne."
    - q: "Et pour les voyages avec plus d'une devise ?"
      a: "Les soldes sont tenus séparément pour chaque devise. Voir [plusieurs devises](page:feature/multiple-currencies)."
