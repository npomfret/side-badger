meta:
  title: Dela hushållsräkningarna med rumskamrater
  description: Dela hyran efter rummens storlek, dela el och matinköp lika och se vem som är skyldig vem varje månad. Ett gratis sätt för rumskamrater och kollektiv att hålla räkningen.
h1: Dela hushållsräkningarna med rumskamrater
navLabel: Rumskamrater
lead: För rumskamraten som köper toapappret, och rumskamraterna som aldrig ser det hända. Side Badger håller en löpande räkning på hyran, räkningarna och inköpen för **rumskamrater och kollektiv**, så att ingen behöver jaga någon och kylskåpet kan gå tillbaka till att bara vara ett kylskåp.
cta:
  heading: Börja med ditt eget hushåll
  body: Skapa ett konto, gör en grupp för hushållet och skicka inbjudningslänken till alla. Den här månadens räkningar kan läggas in i kväll.
  button: Skapa ett gratiskonto
scenario:
  heading: Ställ in hushållet
  body: Gör en grupp för hushållet, välj det namn du vill att folk ska se dig under och bjud in alla med en länk eller QR-kod. Gruppen kan vara öppen, där alla lägger till och redigerar, eller hanterad, där nya medlemmar behöver en administratörs godkännande och bara skapare och administratörer kan ändra utgifter, vilket passar rumskamraten som sköter bokföringen. Den som bara vill följa siffrorna kan vara tittare, som ser allt och ändrar inget. Alla ser en ny utgift direkt, så "jag lägger in den senare" har färre ställen att gömma sig på.
sections:
  - heading: Hyra och räkningar
    body: "Hyran går sällan jämnt att dela på fyra, eftersom sovrum inte är lika stora. Dela den i procent, så att det stora rummet betalar mer och garderoben med fönster betalar mindre. Procenten måste bli 100 tillsammans. Räkningar som alla använder får en lika delning, och en rumskamrat som inte var med på en utgift kan lämnas utanför den. När en lika delning lämnar ett udda öre hamnar det hos en person på slumpen. Det finns inga återkommande räkningar, så varje månad kopierar du förra månadens hyra, ändrar datumet och fortsätter."
  - heading: Det gemensamma inköpet
    body: "Ha den gemensamma inköpslistan i samma grupp som inköpsnotorna och bocka av saker när de hamnar i vagnen. Den som handlar lägger in kvittots summa som en utgift och delar den lika, eller bara mellan de som ska äta det. Vem som fortsätter köpa havremjölken som ingen annan dricker är fortfarande en fråga för hushållet, men åtminstone blir utgiftslistan korrekt. Gruppens behörigheter avgör vem som kan skapa och redigera listor. Lägg ihop hyran, räkningarna och inköpen så får du en månad som den nedan, i ett hushåll på fyra: Jo betalar 2 000 £ i hyra, delad 30 %, 25 %, 25 % och 20 % efter rummens storlek, sedan betalar Kwame 120 £ för el, Lena 40 £ för internet och Matt 80 £ för matinköp, alla delade lika. Jo har 1 340 £ att få, och Side Badger föreslår tre betalningar, alla till Jo."
  - heading: Rättvisa sätt att dela hushållskostnader
    items:
      - "**Lika** passar det som alla använder ungefär lika mycket, till exempel internet, städmaterial och de gemensamma inköpen. Det går fort, och ingen behöver gräla om matten."
      - "**Efter rummens storlek** passar hyran, eftersom rum skiljer sig åt och det gör också vad folk vill betala för dem. Kom överens om procenten en gång, när någon flyttar in, och återanvänd dem varje månad."
      - "**Efter användning** passar räkningar där en person tydligt använder mer, till exempel uppvärmningen av ett hemmakontor eller ett streamingkonto som bara två personer tittar på. Lämna utanför de som inte var med, eller ange exakta belopp för varje person."
      - "Vilket du än väljer, kom överens om det före den första räkningen snarare än efter det första gnabbet, och skriv ner regeln någonstans där hela hushållet ser den."
  - heading: När någon flyttar ut
    body: De gör upp först. Ingen kan lämna en grupp så länge hen är skyldig eller har pengar att få, så den som flyttar betalar eller får betalt, du registrerar det och sedan går hen. Låt gruppen leva vidare för de rumskamrater som blir kvar och bjud in den nya med en länk. När själva hushållet är slut kan en administratör låsa gruppen så att siffrorna ligger kvar, eller stänga den för gott, vilket gör den oåtkomlig för alla, så gör det först när ingen behöver historiken längre.
