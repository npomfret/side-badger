featuresHeading: "As funcionalidades que um casal usa"
faq:
  heading: "Perguntas"
  items:
    - q: "Podemos definir 60/40 uma vez para tudo?"
      a: "Não. A divisão pertence a cada despesa. Define as percentagens na primeira, depois copia-a da próxima vez e altera o que for diferente. [Dividir despesas](page:feature/split-expenses) explica as três formas de dividir."
    - q: "Liga-se ao nosso banco?"
      a: "Não. O Side Badger nunca toca no vosso dinheiro. Paguem-se como preferirem e depois registem, como explica [acertar contas](page:feature/settle-up)."
    - q: "Mais alguém pode ver o nosso grupo?"
      a: "Só os membros, e o grupo de um casal tem dois. Quem usar um link de convite ativo pode entrar, por isso partilha-o com uma só pessoa e dá-lhe um prazo curto."
    - q: "E se cada um pagou parte da mesma conta?"
      a: "Uma despesa tem um só pagador. Registem duas despesas, uma para cada um, e o saldo sai igual."
    - q: "Vai lembrar a minha cara-metade de pagar?"
      a: "Não. Não há lembretes, por isso o empurrãozinho continua a ser vosso. Pelo menos os dois vão olhar para o mesmo número."
    - q: "O que acontece quando deixamos de partilhar custos?"
      a: "Acertem o saldo e registem o pagamento, para ninguém dever nada. Depois um administrador pode bloquear o grupo, o que mantém os números como estão, ou fechá-lo de vez, o que o torna inacessível para todos. Fechem-no só quando nenhum dos dois precisar do histórico."
