      source: pro-help
    - feature: Peran dan izin grup
      other: Pusat bantuannya menyebut tidak mendukung admin grup atau izin khusus.
      sideBadger: Administrator, anggota, dan pengamat. Dua preset atau izin buatan sendiri, persetujuan untuk bergabung, dan kunci untuk saat sudah selesai.
