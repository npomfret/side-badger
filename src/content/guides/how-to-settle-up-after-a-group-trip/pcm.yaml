faq:
  heading: "Question dem"
  items:
    - q: "Who suppose record payment, di person wey pay or di person wey collect?"
      a: "To record payment need permission to edit expenses, and di form dey ask **Who pay?** and **Who collect money?** Na only di person wey record am fit edit am later, so e usually simple pass if di payer do am, with di Kwik settul button."
    - q: "Wetin if di trip use two currencies?"
      a: "Balances dey kept per currency, so euro debt go stay euro debt and each currency go get im own short list, unless dem convert expenses when dem enter dem. [Several currencies](page:guide/how-to-split-a-trip-paid-in-several-currencies) show both ways."
    - q: "We suppose settle during di trip or for di end?"
      a: "Any one fit work. Every payment wey dem record dey change di balances, so payment wey dem make for middle of di trip go count towards di final list. For di end simple pass, because [di whole trip](page:use-case/group-trips) dey one place."
