faq:
  heading: "پرسش‌ها"
  items:
    - q: "چه کسی باید پرداخت را ثبت کند، پرداخت‌کننده یا دریافت‌کننده؟"
      a: "ثبت پرداخت به مجوز ویرایش هزینه‌ها نیاز دارد و فرم می‌پرسد **چه کسی پرداخت کرد؟** و **چه کسی پرداخت را دریافت کرد؟** بعداً فقط کسی که ثبتش کرده می‌تواند آن را ویرایش کند، پس معمولاً ساده‌تر است که پرداخت‌کننده این کار را بکند، با دکمه تسویه سریع."
    - q: "اگر سفر با دو ارز پیش رفته باشد چه؟"
      a: "مانده‌ها برای هر ارز جداگانه نگه داشته می‌شوند، پس بدهی یورویی یورویی می‌ماند و هر ارز فهرست کوتاه خودش را می‌گیرد، مگر اینکه هزینه‌ها هنگام ورود تبدیل شده باشند. [چند ارز](page:guide/how-to-split-a-trip-paid-in-several-currencies) هر دو روش را نشان می‌دهد."
    - q: "وسط سفر تسویه کنیم یا آخرش؟"
      a: "هر دو جواب می‌دهد. هر پرداخت ثبت‌شده مانده‌ها را تغییر می‌دهد، پس پرداختی که وسط سفر انجام شود در فهرست نهایی حساب می‌شود. آخر سفر ساده‌تر است، چون [کل سفر](page:use-case/group-trips) یک‌جاست."
