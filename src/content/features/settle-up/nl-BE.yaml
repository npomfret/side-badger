sections:
  - heading: "Een betaling registreren"
    body: "Wanneer iemand betaalt, registreer je het bij de juiste persoon. De knoppen voor snel afrekenen vullen het bedrag in uit je voorgestelde betalingen, en je kunt een notitie toevoegen zoals “bankoverschrijving” (tot 500 tekens). Betaal je maar een deel van wat je schuldig bent, dan blijft de rest op het saldo staan. Voer je te weinig of te veel in, dan waarschuwt Side Badger je voor je opslaat. Een betaling registreren vraagt toestemming om uitgaven te bewerken, en de datum kan niet in de toekomst liggen."
  - heading: "In een andere valuta betaald?"
    body: "Saldi blijven in de valuta waarin ze betaald werden, dus een schuld in euro blijft een schuld in euro. Euro’s schuldig, maar betalen in pond? Reken de betaling om terwijl je ze invoert, tegen een actuele wisselkoers of tegen de koers die je echt kreeg. De koers ligt vast op het moment dat de betaling wordt opgeslagen. [Meerdere valuta’s](page:feature/multiple-currencies) legt uit hoe omrekenen werkt, en [groepsreizen](page:use-case/group-trips) toont het in gebruik."
  - heading: "Een geschiedenis die je kunt controleren"
    body: "Elke geregistreerde betaling blijft in de groepsgeschiedenis staan met haar datum, bedrag en notitie. Alleen de persoon die een betaling registreerde kan ze bewerken, en die persoon of een groepsbeheerder kan ze verwijderen. Een betaling met iemand die de groep verlaten heeft, is vergrendeld. Voor een uitgewerkt scenario met huisgenoten, zie [huisgenoten](page:use-case/housemates)."
limits:
  heading: "Wat Side Badger niet doet"
  items:
    - "Side Badger verplaatst geen geld, stuurt geen betaallinks en stuurt geen betalingsverzoeken. Een betaling in de app is een registratie van een betaling die elders gebeurd is."
    - "De voorgestelde betalingen komen uit een eenvoudige matchingmethode, per valuta toegepast. Die stelt altijd minder betalingen voor dan er mensen met een saldo in die valuta zijn (vier mensen, hoogstens drie betalingen), maar vindt niet altijd het kleinst mogelijke aantal."
    - "Je kunt de suggesties niet uitschakelen. **Alles tonen** toont elke voorgestelde betaling in de groep, niet alleen die van jou."
    - "Valuta’s worden nooit tegen elkaar verrekend, tenzij de uitgaven bij het invoeren omgerekend werden."
    - "Er zijn geen herinneringen, dus een betaling opvolgen blijft aan jou."
useCasesHeading: "Waar afrekenen telt"
faq:
  heading: "Vragen"
  items:
    - q: "Stuurt Side Badger het geld?"
      a: "Nee. Betaal elkaar zoals je wilt en registreer de betaling dan in Side Badger, zodat het saldo bijgewerkt wordt."
    - q: "Kan ik de voorgestelde betalingen uitschakelen?"
      a: "Nee. Vereenvoudiging blijft aan, en **Alles tonen** toont elke voorgestelde betaling in de groep, niet enkel die waarbij jij betrokken bent."
    - q: "Waarom worden euro’s en ponden apart gehouden?"
      a: "Saldi blijven in de valuta waarin je betaalde, tenzij je omrekent bij het invoeren van een uitgave of betaling. Schulden in verschillende valuta’s worden nooit tegen elkaar verrekend."
    - q: "Wat als iemand maar een deel betaalt van wat hij of zij schuldig is?"
      a: "Registreer het deel dat betaald werd. De rest blijft op het saldo staan tot het betaald is."
    - q: "Is dit altijd het kleinst mogelijke aantal betalingen?"
      a: "Niet gegarandeerd. Het stelt altijd minder betalingen voor dan er mensen met een saldo in die valuta zijn, dus voor vier mensen nooit meer dan drie. In het voorbeeld met huisgenoten zijn dat twee betalingen, waar iedereen rechtstreeks terugbetalen er zes vroeg."
