faq:
  heading: 常见问题
  items:
    - q: 按房间大小和按收入，哪种更公平？
      a: 没有哪一种永远更公平。按房间大小适合各自为睡的空间付钱的室友；按收入适合收入差距很大的情侣和朋友。请在第一个交租日之前谈好，而不是之后。
    - q: 账单也要这样分摊吗？
      a: 对室友来说，通常不用。能源和宽带大家都用，所以平均分摊更简单，就像算例里那样。按收入时，计算器会让账单沿用与房租相同的份额。
    - q: 可以用平方英尺吗？
      a: 可以。选择 ft²，再用平方英尺输入面积。单位只是个标签，只要所有人用同一个单位，算出的份额都一样。
    - q: 这个计算器免费吗？
      a: 免费。无广告。无每日限制。你也不需要账户。
