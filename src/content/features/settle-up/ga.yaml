sections:
  - heading: "Taifead íocaíocht"
    body: "Nuair a íocann duine, taifead í in aghaidh an duine cheart. Líonann na cnaipí Socrú gasta an tsuim ó do chuid íocaíochtaí molta, agus is féidir leat nóta a chur leis mar “aistriú bainc” (suas le 500 carachtar). Má íocann tú cuid den mhéid atá dlite agat amháin, fanann an chuid eile ar an iarmhéid. Má chuireann tú isteach méid ró-bheag nó ró-mhór, tugann Side Badger rabhadh duit sula sábhálann tú. Teastaíonn cead costais a chur in eagar chun íocaíocht a thaifeadadh, agus ní féidir leis an dáta a bheith sa todhchaí."
  - heading: "Íoctha in airgeadra eile?"
    body: "Fanann iarmhéideanna san airgeadra inar íocadh iad, mar sin fanann fiach in euro ina fhiach in euro. An bhfuil euro dlite agat, ach tú ag íoc i bpunt? Tiontaigh an íocaíocht agus tú á cur isteach, ar ráta malairte reatha nó ar an ráta a fuair tú i ndáiríre. Socraítear an ráta nuair a shábhálaítear an íocaíocht. Clúdaíonn [ilairgeadraí](page:feature/multiple-currencies) conas a oibríonn tiontú, agus taispeánann [turais ghrúpa](page:use-case/group-trips) in úsáid é."
  - heading: "Stair is féidir a sheiceáil"
    body: "Fanann gach íocaíocht a taifeadadh i stair an ghrúpa lena dáta, a suim agus a nóta. Ní féidir ach leis an duine a thaifead íocaíocht í a chur in eagar, agus is féidir leis an duine sin nó le riarthóir grúpa í a scriosadh. Glasáiltear íocaíocht a bhaineann le duine a d'fhág an grúpa. I gcás cás oibrithe comhchónaitheoirí, féach [comhchónaitheoirí](page:use-case/housemates)."
limits:
  heading: "Cad nach ndéanann Side Badger"
  items:
    - "Ní bhogann Side Badger airgead, ní sheolann sé naisc íocaíochta ná iarratais ar íocaíocht. Is taifead d'íocaíocht a rinneadh in áit eile é íocaíocht san aip."
    - "Tagann na híocaíochtaí molta ó mhodh meaitseála simplí, a chuirtear i bhfeidhm in aghaidh an airgeadra. Molann sé i gcónaí níos lú íocaíochtaí ná mar atá daoine le hiarmhéid san airgeadra sin (ceathrar, trí íocaíocht ar a mhéad), ach ní aimsíonn sé i gcónaí an líon is lú is féidir."
    - "Ní féidir leat na moltaí a mhúchadh. Liostaíonn **Taispeáin iad go léir** gach íocaíocht mholta sa ghrúpa, ní hamháin na cinn atá agatsa."
    - "Ní chealaítear airgeadraí in aghaidh a chéile mura ndearnadh na costais a thiontú nuair a cuireadh isteach iad."
    - "Níl aon mheabhrúcháin ann, mar sin is ortsa atá sé fós duine a spreagadh chun íoc."
useCasesHeading: "Cá bhfuil tábhacht le socrú suas"
faq:
  heading: "Ceisteanna"
  items:
    - q: "An seolann Side Badger an t-airgead?"
      a: "Ní sheolann. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht i Side Badger ionas go nuashonrófar an t-iarmhéid."
    - q: "An féidir liom na híocaíochtaí molta a mhúchadh?"
      a: "Ní féidir. Fanann an simpliú ar siúl, agus liostaíonn **Taispeáin iad go léir** gach íocaíocht mholta sa ghrúpa, ní hamháin na cinn a bhaineann leatsa."
    - q: "Cén fáth a gcoinnítear euro agus punt ar leith?"
      a: "Fanann iarmhéideanna san airgeadra inar íoc tú mura dtiontaíonn tú nuair a chuireann tú costas nó íocaíocht isteach. Ní chealaítear fiacha in airgeadraí éagsúla in aghaidh a chéile choíche."
    - q: "Cad má íocann duine cuid den mhéid atá dlite amháin?"
      a: "Taifead an chuid a íocadh. Fanann an chuid eile ar an iarmhéid go n-íoctar é."
    - q: "An é seo an líon íocaíochtaí is lú is féidir i gcónaí?"
      a: "Níl sé cinnte. Molann sé i gcónaí níos lú íocaíochtaí ná mar atá daoine le hiarmhéid san airgeadra sin, mar sin do cheathrar ní mholann sé níos mó ná trí cinn riamh. Sa sampla comhchónaitheoirí, is dhá íocaíocht é sin, i gcás ina raibh sé cinn de dhíth chun gach duine a aisíoc go díreach."
