sections:
  - heading: Det Splitwise gjør bra
    body: "Trenger gruppen din en egen app, bruk uten nett eller betalinger inne i appen, er Splitwise det fornuftige valget, og vi vil heller at du velger det enn at du oppdager det senere. Splitwises egne sider oppgir:"
    items:
      - "**Apper og bruk uten nett.** Apper for iPhone og Android i tillegg til nettet, og en frakoblet modus."
      - "**Flere måter å dele på.** Andeler, justeringer og deling per vare, i tillegg til likt, nøyaktig og etter prosent."
      - "**Gjentakende utgifter.** La husleien gjentas av seg selv, og glem den."
      - "**Betalinger i appen.** I noen land kan den flytte pengene også, via Splitwise Pay, Venmo, PayPal eller Pay by Bank."
  - heading: Gratis her, betalt der
    body: "Splitwise Pro er Splitwises betalte plan, og Splitwises egen Pro-side selger fire ting som ikke koster noe i Side Badger."
    items:
      - "**Kvitteringsskanning.** Splitwise Pro skanner et bilde av kvitteringen din. Side Badger gjør det gratis, uten skannekreditter: den fyller inn sum, dato og sted, slik at du kan sjekke. Kvitteringsbilder leses av Googles AI-tjeneste."
      - "**Valutakonvertering.** Splitwise Pro konverterer en gruppes utgifter til standardvalutaen din når du trykker på Konverter. Side Badger konverterer hver utgift mens du legger den inn, med en gjeldende valutakurs eller den du faktisk fikk, og det opprinnelige beløpet blir stående på utgiften."
      - "**Ingen annonser.** Splitwise oppgir en helt annonsefri opplevelse som en Pro-funksjon. Side Badger har ingen annonser."
      - "**Ingen daglige grenser.** Splitwise Pro selger ubegrensede utgifter, og hjelpesenteret deres sier at gratisbrukere kan legge til opptil 4 utgifter hver dag. Side Badger har ingen daglige grenser."
  - heading: Det Splitwise har som Side Badger ikke har
    body: "Dette er ikke alle Splitwises funksjoner, bare de som ofte avgjør. Splitwises egne sider har hele listen. Her er der Side Badger kommer til kort."
    items:
      - "**Egne apper.** Side Badger fungerer i nettleseren. Logg inn, og legg den til på startskjermen, så åpnes den som en app."
      - "**Frakoblet modus.** Side Badger trenger en tilkobling."
      - "**Betalinger i appen.** Side Badger rører aldri pengene dine. Betal hverandre slik dere vil, og registrer så betalingen."
      - "**Gjentakende utgifter.** Side Badger har ingen. Kopier forrige måneds husleie i stedet for å skrive den inn på nytt."
      - "**Deling etter andeler eller per vare.** Side Badger har én betaler per utgift, delt likt, etter nøyaktige beløp eller etter prosent. Kvitteringsskanningen tildeler ikke varer til personer."
      - "**Diagrammer og standarddelinger.** Splitwise Pro har begge. Side Badger fører regnskapet over hvem som skylder hvem, og det er hele trikset."
  - heading: Flytte gruppen over
    body: "Det finnes ingen importfunksjon, så en flytting betyr en ny start. Gjør opp i Splitwise først, opprett så en gruppe i Side Badger og inviter alle med en lenke eller en QR-kode. Alle i gruppen trenger en gratis konto, og alt som skal til for å registrere seg, er en e-postadresse."
