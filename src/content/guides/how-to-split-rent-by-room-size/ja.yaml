meta:
  title: "部屋の広さで家賃を分ける方法 | Side Badger"
  description: "広い部屋は、負担も大きめに。共用部分を先に取り分け、残りを床面積で分けて、割合は一度入力するだけ。3人の計算例つきです。"
h1: "部屋の広さで家賃を分ける方法"
navLabel: "部屋の広さで家賃"
lead: "家賃のうち共用スペースにあてる分を決めて均等に分け、残りを各寝室の床面積で分けます。割合は整数に丸め、Side Badgerの家賃の支出に一度だけ入力して、毎月その支出をコピーしましょう。"
cta:
  heading: "家賃は一度入れるだけ"
  body: "無料アカウントを作成し、アパートのグループを始めて、合意した割合で家賃を入力しましょう。来月はコピーするだけです。先に全体を知りたい方は、[使い方](page:how-it-works)または[無料で使える範囲](page:pricing)をご覧ください。"
sections:
  - heading: "3人、1つのアパート、1つの言い争い"
    body: "Priya、Tom、Aishaは月£1,950のアパートをシェアしています。1年間は、簡単だからという理由で3等分にしていました。ところがAishaが自分の寝室を測ってみたのです。Priyaの部屋は16 m²、Tomの部屋は12 m²、Aishaの部屋は10 m²。つまりAishaは、Priyaより3分の1以上も狭い部屋に、Priyaと同じ額を払っていたことになります。誰も理不尽だったわけではありません。ただ、誰も計算していなかっただけです。テイクアウトを囲みながら、まず1つルールを決めました。家賃のうち40%は、3人とも使うキッチン、バスルーム、リビングの分とする、というものです。"
  - heading: "計算の手順（式つき）"
    body: "4つのステップ。必要なのは巻き尺1本と、スマホの電卓だけです。"
    items:
      - "**共用部分を先に取り分ける。** 全員が使う部屋の分として、家賃のうちどれだけをあてるかをグループで決めます。このアパートでは40%で、3人で分けると1人13.33%です。"
      - "**残りを床面積で分ける。** 残りの60%は寝室の広さで分けます。寝室は合計38 m²（16 + 12 + 10）なので、Priyaの分は60% × 16/38で、25.26%です。"
      - "**2つを足す。** Priya：25.26% + 13.33% = 38.6%。Tom：60% × 12/38 = 18.95%に13.33%を足して32.3%。Aisha：60% × 10/38 = 15.79%に13.33%を足して29.1%。"
      - "**丸めて確認する。** 整数のパーセントのほうが入力しやすく、話し合いもしやすいので、38.6%は39%、32.3%は32%、29.1%は29%にします。39 + 32 + 29が100になることを確認してください。丸めた結果が99や101になる場合は、誰の数字を1ポイント動かすかをグループで決めます。"
  - heading: "アパートの1か月を読み解く"
    body: "家賃を39%、32%、29%で分けると、£760.50、£624.00、£565.50になります。Priyaが大家さんに支払ったので、1か月を通すとPriyaは£1,142.50を受け取る側になり、Tomは£566.00、Aishaは£576.50を支払う側になります。Side Badgerは2回の支払いを提案し、どちらもPriya宛てです。"
  - heading: "Side Badgerで設定する"
    body: "所要時間は一晩。その大半は、40%についての話し合いに使われます。"
    items:
      - "**グループを作る。** ダッシュボードで**グループを作成**を選び、アパートの名前を付けます。**他の人を招待**を選んで、リンクまたはQRコードを送ります。全員がサインインするか無料アカウントを作成し、このグループで表示したい名前を選びます。"
      - "**家賃を追加する。** **経費を追加**を選びます。説明と金額を入力し、**誰が支払いましたか？**で大家さんに支払った人を選びます。**割り勘相手**は3人全員のままにして、**割り勘方法**で**パーセンテージ**を選び、39、32、29と入力します。パーセンテージの合計が100でない場合は、フォームが警告します。**経費を保存**を選びます。"
      - "**請求を追加する。** エネルギー代とブロードバンドは、それぞれ支払った人が違う別々の支出です。**割り勘方法**は**均等**のままにします。"
      - "**来月はコピーする。** 先月の家賃を開いて**経費をコピー**を選びます。コピーには支払った人、金額、分け方がそのまま引き継がれ、日付は今日になります。家賃が変わった場合は金額を変更してから、**コピーを作成**を選びます。"
      - "**誰が誰に借りているかを確認する。** **残高**セクションに表示されます。支払いは好きな方法で行い、そのあと**精算する**で支払いを記録します。"
  - heading: "専用バスルーム付きの部屋、納戸のような部屋、出ていく人"
    items:
      - "**専用バスルーム付きの部屋と、納戸のような部屋。** 床面積はあくまで出発点です。専用バスルームのある部屋は、同じ広さでバスルームのない部屋より価値が高く、ベッドと「置けたらいいな」という椅子がやっと入る納戸のような部屋は、価値が低くなります。合意のうえで割合を調整し、合計がまだ100になるか確認して、最終的な数字を家の全員が見える場所に書いておきましょう。"
      - "**月の途中で誰かが引っ越すとき。** その月に各自が払う額を計算し、その月の家賃は**パーセンテージ**ではなく**正確な金額**で入力します。金額の合計は家賃と一致する必要があります。出ていく前に済ませてください。債務や債権が残っている間はグループを退出できず、退出した人が関わる支出は読み取り専用になります。"
      - "**誰かが入居するとき。** もう一度測り、新しい部屋の広さで計算し直して、次の家賃から新しい割合を使います。それ以前の月はそのままです。"
  - heading: "ここでSide Badgerにできないこと"
    items:
      - "部屋を測ったり、割合を決めたりはしません。床面積と40%は、グループで合意するものです。"
      - "定期的な請求はないので、毎回先月の家賃をコピーします。"
      - "お金を動かすことはなく、大家さんに支払うこともありません。支払いは好きな方法で行い、そのあと記録します。"
      - "賃貸契約書の内容は知りません。記録するのは、グループ内の人同士の貸し借りだけです。"
