meta:
  title: "Side Badger mod Splitwise: hele gruppen, ikke kun regnestykkerne | Side Badger"
  description: "Et gratis Splitwise-alternativ til hele gruppen: kommentarer, spørgsmål, lister, afstemninger og ordentlige roller, plus gratis kvitteringsscanning og valutaomregning."
h1: "Side Badger mod Splitwise: hele gruppen, ikke kun regnestykkerne"
navLabel: Side Badger mod Splitwise
lead: "Nogen i din gruppe har sikkert sagt »brug bare Splitwise«. Fair nok: den er god til regnestykkerne. Side Badger klarer også regnestykkerne og giver så gruppen et sted at tale dem igennem: kommentarer, spørgsmål, lister, afstemninger og ordentlige grupperoller. Kvitteringsscanning og valutaomregning er gratis."
cta:
  heading: Prøv den på din næste fælles regning
  body: Opret en gratis konto, lav en gruppe, og tilføj én rigtig udgift. Hvis den ikke er noget for dig, har du brugt et par minutter, ikke et abonnement.
asOf: 2026-11-22
asOfNote: Vi læste Splitwises egne sider den {date}, så du ikke behøver, og alt her om Splitwise stammer derfra. Hver række i tabellen linker til sin kilde. Priserne og planerne ændrer sig, så vi tjekker igen hvert kvartal, og hvis Splitwises sider er uenige med denne, så tro på dem.
