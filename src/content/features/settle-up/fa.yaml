meta:
  title: "تسویه حساب با پرداخت‌های کمتر | Side Badger"
  description: "ببینید در گروه‌تان چه کسی به چه کسی بدهکار است، فهرست کوتاهی از پرداخت‌ها بگیرید که همه را تسویه کند و هر پرداخت را همان لحظه ثبت کنید. استفاده رایگان."
h1: "تسویه حساب با پرداخت‌های کمتر"
navLabel: "تسویه حساب"
lead: "Side Badger برای هر عضو گروه یک مانده جاری نگه می‌دارد و فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد که آن را تسویه می‌کند. هر طور دوست دارید به هم پرداخت می‌کنید و بعد ثبتش می‌کنید. اگر می‌خواهید ابتدا ببینید عددها چطور تقسیم می‌شوند، از [تقسیم هزینه‌ها](page:feature/split-expenses) شروع کنید."
cta:
  heading: "آماده‌اید گره بدهی‌ها را باز کنید؟"
  body: "یک حساب بسازید، گروه را شروع کنید و اولین هزینه را اضافه کنید. بقیه‌اش با مانده‌هاست."
  button: "ساخت حساب رایگان"
problem:
  heading: "مانده‌هایی که همراه شما به‌روز می‌شوند"
  body: "هر هزینه تغییر می‌دهد که چه کسی به چه کسی بدهکار است، پس Side Badger با اضافه شدن هزینه‌ها و پرداخت‌ها مانده‌ها را به‌روز نگه می‌دارد. هر تغییری را همه اعضا بلافاصله می‌بینند، همراه با اینکه چه چیزی تغییر کرده و چه کسی تغییر داده. مانده‌ها برای هر ارز جداگانه نگه داشته می‌شوند، پس یورو و پوند در ستون خودشان می‌مانند، مگر اینکه هزینه‌ای هنگام ورود تبدیل شده باشد. به‌طور پیش‌فرض بدهی‌هایی را می‌بینید که به شما مربوط است؛ **نمایش همه** کل گروه را فهرست می‌کند."
workflow:
  heading: "سه مرحله تا صاف شدن حساب"
  steps:
    - title: "ببینید چه کسی به چه کسی بدهکار است"
      body: "مانده‌های گروه را باز کنید تا ببینید چقدر بدهکارید، چقدر طلبکارید و فهرست کوتاهی از پرداخت‌ها که همه را تسویه می‌کند، برای هر ارز محاسبه‌شده. هزینه‌های زیر پرسش تا روشن شدن از محاسبه بیرون می‌مانند. در مثال هم‌خانه‌ها پایین، شش پرداخت به دو پرداخت تبدیل می‌شود."
      shot: S10
      shotAlt: "صفحه مانده‌ها با بدهی‌های ساده‌شده در دو ارز، با «نمایش همه» روشن"
    - title: "هر طور دوست دارید پرداخت کنید، بعد ثبت کنید"
      body: "انتقال بانکی، پول نقد، یا لطفی که از تعطیلات قبل مانده. Side Badger پول را جابه‌جا نمی‌کند. وقتی پول دست‌به‌دست شد، پرداخت را ثبت کنید تا مانده برای همه به‌روز شود."
      shot: S11
      shotAlt: "فرم پرداخت با دکمه‌های تسویه سریع و اعلانی که برای پرداخت جزئی نشان داده می‌شود"
    - title: "مطمئن شوید نشست"
      body: "پرداخت به تاریخچه گروه می‌رود، جایی که همه اعضا آن را می‌بینند و می‌توانند با ایموجی واکنش نشان دهند. وقتی پرداختی رسید جشنش بگیرید."
      shot: S12
      shotAlt: "تاریخچه پرداخت‌ها با واکنش‌های ایموجی روی یک پرداخت"
