sections:
  - heading: "39 jezika, napravljeno za više ljudi"
    body: "Koristi Side Badger na 39 jezika, uključujući arapski, perzijski i urdu, koji se pišu zdesna nalijevo. Svatko u grupi može odabrati svoj, pa stranica grupe može biti na arapskom za jednu osobu, a na engleskom za sljedeću. Napravljen je i s mišlju na korisnike tipkovnice i čitača zaslona, a boje članova imaju uzorke, pa ne moraš razlikovati zeleno od crvenog."
faq:
  heading: "Pitanja"
  items:
    - q: "Treba li svatko korisnički račun?"
      a: "Da, besplatan. Svaka osoba potvrđuje svoju e-adresu prije nego što išta doda."
    - q: "Postoji li aplikacija?"
      a: "Radi u pregledniku, a možeš je dodati na početni zaslon ili u dock da se otvara kao aplikacija. Nema verzije iz trgovine aplikacijama ni načina rada izvan mreže."
    - q: "Premješta li Side Badger novac?"
      a: "Ne. Vodi evidenciju i predlaže uplate, a vi si plaćate kako god želite. Zatim zabilježiš uplatu. Vidi [poravnanje](page:feature/settle-up)."
    - q: "Može li netko otići dok duguje novac?"
      a: "Ne. Nitko ne može napustiti grupu dok duguje ili mu se duguje novac, pa se prvo poravna."
    - q: "Koliko se ljudi može pridružiti grupi?"
      a: "Do 50 osoba u grupi. Pozovi ih poveznicom ili QR kodom i uključi odobravanje ako želiš da administrator pušta svaku osobu unutra."
    - q: "A putovanja s više od jedne valute?"
      a: "Stanja se vode zasebno za svaku valutu. Vidi [više valuta](page:feature/multiple-currencies)."
