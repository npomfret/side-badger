faq:
  heading: Preguntas
  items:
    - q: ¿Es gratis la calculadora?
      a: Sí. Gratis. Sin anuncios. Sin límites diarios. Tampoco necesitas una cuenta.
    - q: ¿Guarda lo que escribo?
      a: No. No se guarda ni se envía nada a ningún sitio. Para conservar tus cifras, usa Copiar enlace y guarda el enlace en algún sitio.
    - q: ¿Quién puede ver el enlace que copio?
      a: Cualquiera que lo tenga. Las cifras viven en el propio enlace, después del #, así que compártelo solo con las personas que deban verlas.
    - q: ¿Mueve dinero?
      a: No. Calcula quién debería pagar a quién, y vosotros os pagáis como queráis. Side Badger tampoco toca nunca tu dinero. Mira [saldar cuentas](page:feature/settle-up).
    - q: ¿Puedo dividir un viaje pagado en dos monedas?
      a: Aquí no, porque un cálculo tiene una sola moneda. En un grupo, cada moneda lleva su propio saldo. Mira [varias monedas](page:feature/multiple-currencies).
    - q: ¿Y si los importes no cuadran?
      a: La calculadora lo dice debajo del gasto y no muestra ningún resultado hasta que cuadren. Los importes exactos tienen que sumar el total, y los porcentajes tienen que sumar 100.
