meta:
  title: "Co Side Badger umí a co ne"
  description: "Dělení, vyrovnání a více měn, k tomu skupiny, seznamy a hlasování. Celá výbava a upřímný seznam toho, co Side Badger vynechává."
h1: "Co Side Badger umí"
navLabel: "Funkce"
lead: "Všechno, co je v krabici, a co v ní není."
intro: "Tady je celá výbava. Tabulku jsme vynechali schválně. Vyberte si níže funkci a přečtěte si její dlouhou verzi, nebo si projděte zbytek seznamu a krátký seznam věcí, které Side Badger nedělá."
cta:
  heading: "Umí to, co vaše skupina potřebuje?"
  body: "Vytvořte si účet zdarma a nejdřív to vyzkoušejte s malou skupinou."
cardsHeading: "Každá funkce podrobně"
sections:
  - heading: "Skenování účtenek"
    body: "Vyfoťte účtenku a Side Badger doplní celkovou částku, datum a místo ke kontrole. Obrázky účtenek čte AI služba společnosti Google. [Jak funguje skenování účtenek](page:feature/receipt-scanning)."
  - heading: "Skupiny a oprávnění"
    body: "Založte skupinu pro každý dům, výlet nebo akci, až s 50 lidmi. Zvěte lidi odkazem nebo QR kódem. Ve větší skupině můžete někoho nastavit jako prohlížeče, který vidí všechno a nic nemění. Drobné písmo má stránka [Skupiny a oprávnění](page:feature/groups-and-permissions)."
  - heading: "Seznamy a hlasování"
    body: "Mějte společný nákupní seznam vedle účtů za nákupy. Nechte hlasovat o užším výběru vil, na přání anonymně. Komentáře, dotazy, seznamy a hlasování pokrývá stránka [Plánujte to společně](page:feature/plan-together)."
  - heading: "Všechno ostatní"
    items:
      - "**Živé aktualizace:** přidejte výdaj a všichni ho hned uvidí."
      - "**Jazyky:** používejte Side Badger ve 39 jazycích. Každý ve skupině si může vybrat vlastní."
      - "**Domovská obrazovka:** obchod s aplikacemi není potřeba. Přihlaste se, pak přidejte Side Badger na domovskou obrazovku a otevře se jako aplikace. Nastavení v aplikaci vám ukáže, jak na to. [Více o webové aplikaci](page:feature/web-app)."
      - "**Oznámení:** zapněte v Nastavení push oznámení a dostanete oznámení, když bude ve vašich skupinách nová aktivita. Na iPhonu a iPadu nejdřív přidejte Side Badger na domovskou obrazovku."
      - "**Zpětná vazba:** narazili jste na chybu? Napište nám přímo z aplikace a odpověď si přečtěte tam."
  - heading: "Co Side Badger nedělá"
    items:
      - "**Nepřesouvá peníze.** Side Badger se vašich peněz nikdy nedotkne. Zaplaťte si, jak chcete. Žádosti o platbu jsou v plánu."
      - "**Neopakuje účty.** Žádné opakované výdaje neexistují. Zkopírujte účet z minulého měsíce dvěma klepnutími."
      - "**Nedělí podle položek.** Za výdaj platí jedna osoba. Dělte rovnoměrně, přesně nebo procentuálně."
      - "**Nemá nativní aplikaci.** Funguje v prohlížeči. Přihlaste se, pak ho přidejte na domovskou obrazovku."
      - "**Nefunguje offline.** Potřebuje připojení."
      - "**Neposílá upozornění e-mailem ani SMS.** Nová aktivita se zobrazuje v aplikaci, a pokud je zapnete, i jako push oznámení."
      - "**Nekreslí grafy ani rozpočty.** Vede přehled, kdo komu dluží, a to je celý trik."
      - "**Nepřihlašuje přes Google ani Apple.** Zaregistrujte se e-mailem. Přihlášení přes Google a Apple je v plánu."
      - "**Nepustí lidi bez účtu.** Každý ve skupině potřebuje bezplatný účet."
faq:
  heading: "Otázky"
  items:
    - q: "Mohu platit přes Side Badger?"
      a: "Ne. Side Badger vede přehled a nikdy se nedotkne vašich peněz. Zaplaťte si, jak chcete, a pak platbu zaznamenejte."
    - q: "Existuje mobilní aplikace?"
      a: "Ne v obchodě s aplikacemi. Side Badger běží v prohlížeči. Přihlaste se na telefonu, pak ho přidejte na domovskou obrazovku, aby se otevíral jako aplikace. Nastavení v aplikaci vám ukáže, jak na to."
    - q: "Mohu dělit podle položek?"
      a: "Ne. Každý výdaj má jednoho plátce a dělí se rovnoměrně, přesně nebo procentuálně."
    - q: "Funguje to offline?"
      a: "Ne, potřebuje připojení."
    - q: "Potřebuje účet každý ve skupině?"
      a: "Ano. Každý ve skupině potřebuje bezplatný účet a k registraci stačí e-mailová adresa."
