meta:
  title: "Roinn billí tí le comhchónaitheoirí"
  description: "Roinn an cíos de réir méid an tseomra, roinn fuinneamh agus earraí grósaera go cothrom, agus féach cé atá i bhfiacha le cé gach mí. Bealach saor in aisce do chomhchónaitheoirí an chuntas a choinneáil."
h1: "Roinn billí tí le comhchónaitheoirí"
navLabel: "Comhchónaitheoirí"
lead: "Don chomhchónaitheoir a cheannaíonn an páipéar leithris, agus na comhchónaitheoirí nach bhfeiceann é ag tarlú riamh. Coinníonn Side Badger aon chuntas reatha amháin den chíos, na billí agus an tsiopadóireacht do **chomhchónaitheoirí** (agus comhroinnteoirí árasáin), ionas nach gcaithfidh aon duine a bheith ag leanúint aon duine eile agus gur féidir leis an gcuisneoir filleadh ar a bheith ina chuisneoir amháin."
cta:
  heading: "Tosaigh le do theach féin"
  body: "Cruthaigh cuntas, déan grúpa don teach agus seol an nasc cuiridh chuig gach duine. Is féidir billí na míosa seo a chur isteach anocht."
  button: "Cruthaigh cuntas saor in aisce"
scenario:
  heading: "Socraigh an teach"
  body: "Déan grúpa don teach, roghnaigh an t-ainm is mian leat a bheith feicthe ann, agus tabhair cuireadh do gach duine le nasc nó cód QR. Is féidir leis an ngrúpa a bheith oscailte, áit a gcuireann gach duine leis agus a chuireann in eagar, nó bainistithe, áit a dteastaíonn ceadú riarthóra ó bhaill nua agus nach féidir ach le cruthaitheoirí agus riarthóirí costais a athrú, rud a oireann don chomhchónaitheoir a choinníonn na leabhair. Is féidir le duine ar bith nach bhfuil uaidh ach féachaint ar na huimhreacha a bheith ina bhreathnóir, a fheiceann gach rud agus nach n-athraíonn aon rud. Feiceann gach duine costas nua gan mhoill, mar sin tá níos lú áiteanna ag “cuirfidh mé leis níos déanaí” le dul i bhfolach."
sections:
  - heading: "Cíos agus billí"
    body: "Is annamh a roinntear cíos ar cheathrar, mar ní roinneann seomraí leapa. Roinn de réir céatadáin é, ionas go n-íocann an seomra mór níos mó agus go n-íocann an cófra le fuinneog níos lú. Caithfidh na céatadáin 100 a dhéanamh le chéile. Faigheann billí a úsáideann gach duine roinnt chothrom, agus is féidir comhchónaitheoir nach raibh aon pháirt aige i gcostas a fhágáil amach as. Nuair a fhágann roinnt chothrom pingin chorr, téann sí chuig duine amháin go randamach. Ní féidir billí a athrá go huathoibríoch, mar sin gach mí cóipeálann tú cíos na míosa seo caite, athraíonn tú an dáta agus leanann tú ar aghaidh."
  - heading: "An tsiopadóireacht chomhroinnte"
    body: "Coinnigh an liosta siopadóireachta comhroinnte sa ghrúpa céanna leis na billí siopadóireachta, agus cuir tic ar earraí de réir mar a shroicheann siad an tralaí. Cuireann an té a dhéanann an tsiopadóireacht iomlán na hadmhála leis mar chostas agus roinneann go cothrom é, nó idir na daoine a ithfidh an rud amháin. Cé a choinníonn ag ceannach an bhainne coirce nach n-ólann aon duine eile é? Is ábhar don teach é sin fós, ach ar a laghad beidh liosta na gcostas cruinn. Socraíonn ceadanna an ghrúpa cé atá in ann liostaí a chruthú agus a chur in eagar. Cuir an cíos, na billí agus an tsiopadóireacht le chéile agus faigheann tú mí cosúil leis an gceann thíos, i dteach de cheathrar: íocann Seán £2,000 cíos, roinnte 30%, 25%, 25% agus 20% de réir méid an tseomra, ansin íocann Colm £120 as fuinneamh, Laoise £40 as an idirlíon agus Máirtín £80 as earraí grósaera, gach ceann roinnte go cothrom. Tá £1,340 dlite do Sheán ar deireadh, agus molann Side Badger trí íocaíocht, gach ceann acu chuig Seán."
  - heading: "Bealaí cothroma chun costais tí a roinnt"
    items:
      - "**Go cothrom** a oireann don rud a úsáideann gach duine thart ar an méid céanna, mar an t-idirlíon, soláthairtí glantacháin agus an tsiopadóireacht chomhchoiteann. Tá sé tapa, agus ní gá d'aon duine argóint a dhéanamh faoin matamaitic."
      - "**De réir méid an tseomra** a oireann don chíos, mar tá seomraí difriúil agus mar sin an méid atá daoine sásta íoc astu. Aontaigh na céatadáin uair amháin, nuair a bhogann duine isteach, agus athúsáid iad gach mí."
      - "**De réir úsáide** a oireann do bhillí ina n-úsáideann duine amháin i bhfad níos mó, mar bhille teasa oifige baile nó cuntas sruthaithe nach bhféachann ach beirt air. Fág amach na daoine nach raibh aon pháirt acu ann, nó cuir isteach suimeanna cruinne do gach duine."
      - "Cibé ceann a roghnaíonn tú, aontaigh é roimh an gcéad bhille seachas tar éis na chéad argóna, agus scríobh síos an riail áit éigin a fheiceann an teach ar fad í."
  - heading: "Nuair a bhogann duine amach"
    body: "Socraíonn siad ar dtús. Ní féidir le haon duine grúpa a fhágáil fad is atá airgead dlite acu nó dlite dóibh, mar sin íocann an duine atá ag imeacht, nó íoctar leis an duine sin, taifeadann tú é, agus ansin imíonn siad. Coinnigh an grúpa ar siúl do na comhchónaitheoirí atá fágtha agus tabhair cuireadh don duine nua le nasc. Nuair a bhíonn an teach féin críochnaithe, is féidir le riarthóir an grúpa a ghlasáil ionas go bhfanann na huimhreacha mar atá, nó é a dhúnadh go buan, rud a fhágann nach féidir le haon duine é a rochtain, mar sin ná déan sin ach nuair nach bhfuil stair de dhíth ar aon duine."
