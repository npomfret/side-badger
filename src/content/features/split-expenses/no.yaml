h1: Del utgifter likt, nøyaktig eller etter prosent
navLabel: Dele utgifter
lead: Ikke alt er 50/50. Side Badger klarer det. Si hvem som betalte, velg de som delte utgiften, og del den **likt, etter nøyaktige beløp eller etter prosent**. Nag selges separat.
cta:
  heading: Del den neste ordentlig
  body: Opprett en gratis konto, start en gruppe og legg til utgiften du har tenkt å få ryddet opp i. Usikker på hva som skjer videre? Se [slik fungerer det](page:how-it-works), eller sjekk [hva gratis dekker](page:pricing).
  button: Opprett en gratis konto
problem:
  heading: Ikke alt er 50/50
  body: Husleien følger størrelsen på rommet. En gave følger hvem som lovet hva. En middag følger hvem som ble sittende til dessert. Å dele en regning på midten fungerer til den første regningen som ikke lar seg dele slik, og da åpner noen et regneark. Side Badger registrerer hvem som betalte, hvem som delte utgiften og hvordan den fordeles, så saldoene blir riktige uten at noen driver med lang divisjon ved bordet.
workflow:
  heading: Å legge til en utgift, fra start til slutt
  steps:
    - title: Si hvem som betalte og hva for
      body: Skriv inn beløpet, en kort beskrivelse og personen som betalte. Én person betaler for hver utgift, noe som holder regnestykket ærlig.
      shot: S05
      shotAlt: Utgiftsskjemaet med husleien for en hytte delt etter prosent mellom tre personer
    - title: Velg delingen
      body: Velg likt, nøyaktige beløp eller prosent. Prosentene må summere seg til 100, og nøyaktige beløp må summere seg til totalen.
      shot: S06
      shotAlt: Utgiftsskjemaet med nøyaktige beløp lagt inn for hver person på en gave
    - title: Legg til historien
      body: Sett dato, legg til etiketter, et sted og et notat. Alle i gruppen ser de samme detaljene, og kan kommentere rett der.
      shot: S08
      shotAlt: En utgift med detaljer, en kommentartråd og det opprinnelige beløpet slik det ble lagt inn
    - title: Ta opp et spørsmål hvis noe ser rart ut
      body: Hvis gruppen har slått på utgiftsspørsmål, kan alle som er med i en utgift stille spørsmål ved den, og utgiftslisten kan vise bare de det er stilt spørsmål ved.
      shot: S18
      shotAlt: Utgiftslisten med merket «Stilt spørsmål ved» og filteret «Kun stilt spørsmål ved»
options:
  heading: Tre måter å dele på
  items:
    - title: Likt
      body: Standarden for middager, taxier og alt alle delte jevnt. Hvis summen ikke går opp, går den odde øren til én person tilfeldig, ikke alltid den samme. I taxien nedenfor er det Ana.
    - title: Etter nøyaktige beløp
      body: Skriv inn hva hver person skylder. Bra for gaven der alle valgte en ulik pris, eller butikken der én persons handlevogn rommet mer enn de felles dagligvarene. Beløpene må summere seg til totalen.
    - title: Etter prosent
      body: Gi hver person en andel av totalen. Husleie etter romstørrelse er klassikeren, der det største rommet betaler den største andelen og ingen som later som noe annet.
