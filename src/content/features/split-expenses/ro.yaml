meta:
  title: "Împarte cheltuielile egal, exact sau procentual | Side Badger"
  description: "Împarte un cost comun egal, pe sume exacte sau procentual și exclude pe cine nu a fost de față. Gratuit, fără reclame și fără limite zilnice."
h1: "Împarte cheltuielile egal, exact sau procentual"
navLabel: "Împărțirea cheltuielilor"
lead: "Nu totul se împarte 50/50. Side Badger se descurcă. Spune cine a plătit, alege oamenii care au împărțit costul și împarte-l **egal, pe sume exacte sau procentual**. Resentimentele se vând separat."
cta:
  heading: "Împarte-o pe următoarea cum trebuie"
  body: "Creează un cont gratuit, începe un grup și adaugă cheltuiala pe care tot amâni s-o rezolvi. Nu ești sigur ce urmează? Vezi [cum funcționează](page:how-it-works) sau uită-te la [ce acoperă gratuitul](page:pricing)."
problem:
  heading: "Nu totul se împarte 50/50"
  body: "Chiria urmează mărimea camerei. Un cadou urmează cine ce a promis. O cină urmează cine a rămas la desert. Să împarți o notă în două merge până la prima notă care nu se împarte așa, și atunci cineva deschide o foaie de calcul. Side Badger înregistrează cine a plătit, cine a împărțit costul și cum se împarte, așa că soldurile ies corecte fără ca cineva să facă împărțiri lungi la masă."
workflow:
  heading: "Adăugarea unei cheltuieli, de la cap la coadă"
  steps:
    - title: "Spune cine a plătit și pentru ce"
      body: "Introdu suma, o scurtă descriere și persoana care a plătit. O singură persoană plătește pentru fiecare cheltuială, ceea ce ține aritmetica onestă."
      shot: S05
      shotAlt: "Formularul de cheltuială cu chiria unei cabane împărțită procentual între trei persoane"
    - title: "Alege împărțirea"
      body: "Alege egal, sume exacte sau procente. Procentele trebuie să dea împreună 100, iar sumele exacte trebuie să dea împreună totalul."
      shot: S06
      shotAlt: "Formularul de cheltuială cu sume exacte introduse pentru fiecare persoană la un cadou"
    - title: "Adaugă povestea"
      body: "Setează data, adaugă etichete, un loc și o notă. Toți din grup văd aceleași detalii și pot comenta chiar acolo."
      shot: S08
      shotAlt: "O cheltuială cu detaliile ei, un fir de comentarii și suma inițială așa cum a fost introdusă"
    - title: "Ridică o întrebare dacă ceva pare în neregulă"
      body: "Dacă grupul a activat întrebările despre cheltuieli, oricine e inclus într-o cheltuială o poate pune sub semnul întrebării, iar lista de cheltuieli poate arăta doar pe cele puse sub semnul întrebării."
      shot: S18
      shotAlt: "Lista de cheltuieli cu o insignă „Pus în discuție” și filtrul „Doar pus în discuție”"
options:
  heading: "Trei moduri de a împărți"
  items:
    - title: "Egal"
      body: "Implicit pentru cine, taxiuri și tot ce au împărțit toți în mod egal. Dacă totalul nu se împarte exact, restul de un ban ajunge la o persoană aleasă la întâmplare, nu mereu aceeași. În taxiul de mai jos, e Ana."
    - title: "Pe sume exacte"
      body: "Scrie cât datorează fiecare. Bun pentru cadoul la care fiecare a ales alt preț sau pentru magazinul în care coșul cuiva a avut mai mult decât cumpărăturile comune. Sumele trebuie să dea împreună totalul."
    - title: "Procentual"
      body: "Dă fiecărei persoane o parte din total. Chiria după mărimea camerei e clasicul, cu camera cea mai mare plătind cea mai mare parte și nimeni prefăcându-se altfel."
