sections:
  - heading: "O que o Splitwise faz bem"
    body: "Se o teu grupo precisa de uma app nativa, de uso offline ou de pagamentos dentro da app, o Splitwise é a escolha sensata, e preferimos que o escolhas a descobrires mais tarde. As páginas dele indicam:"
    items:
      - "**Apps e uso offline.** Apps para iPhone e Android, além da web, e um modo offline."
      - "**Mais formas de dividir.** Quotas, ajustes e divisões por item, além de partes iguais, valores exatos e percentagem."
      - "**Despesas recorrentes.** Define a renda para se repetir e esquece-te dela."
      - "**Pagamentos na app.** Em alguns países, também pode movimentar o dinheiro, através do Splitwise Pay, Venmo, PayPal ou Pay by Bank."
  - heading: "Grátis aqui, pago lá"
    body: "O Splitwise Pro é o plano pago do Splitwise, e a sua própria página Pro vende quatro coisas que não custam nada no Side Badger."
    items:
      - "**Leitura de recibos.** O Splitwise Pro lê uma foto do teu recibo. O Side Badger faz isso de graça, sem créditos de leitura: preenche o total, a data e o local para tu confirmares. As imagens dos recibos são lidas pelo serviço de IA da Google."
      - "**Conversão de moedas.** O Splitwise Pro converte as despesas de um grupo para a tua moeda por defeito quando tocas em Converter. O Side Badger converte cada despesa à medida que a introduzes, a uma taxa de câmbio atual ou à que realmente tiveste, e o valor original fica na despesa."
      - "**Sem anúncios.** O Splitwise indica uma experiência totalmente sem anúncios como funcionalidade Pro. O Side Badger não tem anúncios."
      - "**Sem limites diários.** O Splitwise Pro vende despesas ilimitadas, e o seu centro de ajuda diz que os utilizadores gratuitos podem adicionar até 4 despesas por dia. O Side Badger não tem limites diários."
  - heading: "O que o Splitwise tem e o Side Badger não"
    body: "Não são todas as funcionalidades do Splitwise, só as que costumam decidir. As páginas do próprio Splitwise têm a lista completa. Aqui está onde o Side Badger fica aquém."
    items:
      - "**Apps nativas.** O Side Badger funciona no navegador. Inicia sessão e depois adiciona-o ao ecrã principal e ele abre como uma app."
      - "**Modo offline.** O Side Badger precisa de ligação."
      - "**Pagamentos na app.** O Side Badger nunca toca no teu dinheiro. Paguem-se como preferirem e depois registem o pagamento."
      - "**Despesas recorrentes.** O Side Badger não tem. Copia a renda do mês passado em vez de a escreveres outra vez."
      - "**Dividir por quotas ou por item.** O Side Badger tem um só pagador por despesa, dividida em partes iguais, por valores exatos ou por percentagem. A leitura de recibos não atribui itens a pessoas."
      - "**Gráficos e divisões por defeito.** O Splitwise Pro tem ambos. O Side Badger mantém a conta de quem deve a quem, e esse é o truque todo."
  - heading: "Mudar o teu grupo para cá"
    body: "Não há importador, por isso mudar é recomeçar do zero. Primeiro acerta as contas no Splitwise, depois cria um grupo no Side Badger e convida toda a gente com um link ou um código QR. Todas as pessoas do grupo precisam de uma conta grátis, e para se registarem basta um endereço de e-mail."
