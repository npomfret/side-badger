meta:
  title: 割り勘グループの管理と権限 | Side Badger
  description: リンクやQRコードで招待し、参加を承認し、閲覧者を決め、権限を設定して、終わったらグループをロック。グループはあなたのルールで、ほどほどに。
h1: グループの管理と権限：ルールは自分たちで、ほどほどに
navLabel: グループと権限
lead: 会計係が必要なグループもあります。Side Badgerには、そのための設定があります。リンクまたはQRコードで人を招待し、誰が入れるかを決め、誰が数字を変更できるかを選べます。友だち同士の小さなグループなら、すべて無視して構いません。新しいグループは最初から全面オープンだからです。
cta:
  heading: きちんとしたグループ運営、始めませんか？
  body: アカウントを作成し、グループを始めて、招待リンクを送りましょう。そのままオープンにしておくことも、グループが大きくなったり、細かいことを気にする人が増えたりしたら、ルールを締めることもできます。
problem:
  heading: 誰かが数字を整えておく必要がある
  body: ルームメイト4人なら、信頼だけで回せます。結婚式の週末に集まる30人のゲストでは、おそらく無理でしょう。家、旅行、イベントごとにグループを作れます（1グループ最大50人）。グループごとに、メンバー、役割、ルールがそれぞれあります。ダッシュボードには、すべてのグループと、それぞれのグループでの自分の状況が、1画面で一覧表示されます。ほとんどのグループは設定に触れません。触れるグループには、たいてい、それを使いたくなるほど几帳面な人がいます。
workflow:
  heading: 空のグループから、ロックしたグループまで
  steps:
    - title: リンクまたはQRコードで招待する
      body: "**他の人を招待**を開き、リンクの有効期間（15分、1時間、1日、5日）を選んで、リンクをコピーするか、QRコードを表示して読み取ってもらいます。すでに別のグループで一緒の人は、アプリ内から招待することもできます。"
      shot: S03
      shotAlt: グループのリンク、そのQRコード、リンクの有効期間の選択が表示された招待ダイアログ
    - title: 参加する前にのぞいてもらう
      body: "リンクを持つ人は、ログインするかアカウントを作成し、グループのプレビューを見て、グループ内で使う名前を選びます。そのあと**グループに参加**を押します。"
      shot: S04
      shotAlt: ログイン済みの人が参加する前に表示される、グループの参加プレビュー
    - title: 参加者を承認する
      body: "承認をオンにすると、リンクを使った人は、管理者が許可するまで保留中のメンバーとして待ちます。管理者は**セキュリティと権限**の**保留中のメンバー**で確認し、**承認**または**拒否**を選びます。それまで、保留中の人はグループの中身を何も見られません。"
      shot: S14
      shotAlt: 管理者による承認または拒否を待っている保留中のメンバー
    - title: 誰が何を変更できるかを決める
      body: "**オープンコラボレーション**か**管理グループ**を選ぶか、権限を1つずつ設定します。そのうえで、一人ひとりに管理者、メンバー、閲覧者の役割を割り当てます。権限と役割を変更できるのは管理者だけです。"
      shot: S13
      shotAlt: 2つのプリセットとカスタム権限が表示された、グループ設定のセキュリティタブ
    - title: 終わったらロックする
      body: "旅行が終わり、数字が落ち着いたら、管理者は**グループをロック**のスイッチをオンにできます。誰も支出の追加や変更、支払いの記録、リストや投票の編集ができなくなり、バナーでもそう表示されます。あとからこっそりタクシー代を足すことはできません。本当に遅れて出てきた分があれば、管理者がグループのロックを解除できます。"
      shot: S15
      shotAlt: ロックされていることを知らせるバナーが表示されたグループ
options:
  heading: 管理者、メンバー、閲覧者
  items:
    - title: 管理者
      body: グループを運営します。管理者は、新しいメンバーの承認、役割と権限の変更、グループのロックとロック解除、グループの閉鎖ができます。グループを作った人は最初から管理者で、最後の管理者は降格できないため、管理者のいないグループにはなりません。
    - title: メンバー
      body: 参加します。メンバーにできることは、グループの権限によって決まります。オープンコラボレーションのグループでは、ほぼ何でもできます。管理グループでは、メンバーが変更できるのは、自分で作成した支出とリストだけです。
    - title: 閲覧者
      body: すべてを見られて、何も変更できません。閲覧者は、支出やリストの追加・編集、人の招待、設定の変更、ヘッダー画像の操作ができません。数字を見守りたいだけで、いじらないと約束する人にぴったりです。
sections:
  - heading: オープン、管理、または独自のルール
    body: 新しいグループは**オープンコラボレーション**から始まります。誰でも人を招待し、支出を変更し、リストを編集でき、新しいメンバーは自動的に参加します。**管理グループ**は、誰かがおとな役になる必要があるときのためのものです。7つの権限を1つずつ設定することもでき、1つを手動で変えると、グループはカスタムに切り替わります。どれを選んでも、権限そのものを変更できるのは管理者だけで、変更はすべてアクティビティフィードに表示されます。[ルームメイト](page:use-case/housemates)の家なら、すべてオープンのままで構いません。大きな[イベントやお祝い](page:use-case/events-and-celebrations)では、誰が参加するかを誰かが管理できるよう、管理グループが向いていることがよくあります。初めてですか？[使い方](page:how-it-works)で、最初の支出から精算までの流れを一通りご覧いただけます。
    items:
      - "**経費を編集できるユーザー。**オープンコラボレーション：すべてのメンバー。管理グループ：作成者と管理者。"
      - "**経費を削除できるユーザー。**オープンコラボレーション：すべてのメンバー。管理グループ：作成者と管理者。"
      - "**リストを編集できるユーザー。**オープンコラボレーション：すべてのメンバー。管理グループ：作成者と管理者。"
      - "**メンバーを招待できるユーザー。**オープンコラボレーション：すべてのメンバー。管理グループ：管理者のみ。"
      - "**新しいメンバーの承認。**オープンコラボレーション：自動。管理グループ：管理者の承認が必要。"
      - "**設定を変更できるユーザー。**オープンコラボレーション：すべてのメンバー。管理グループ：管理者のみ。"
      - "**ヘッダー画像を変更できるユーザー。**オープンコラボレーション：すべてのメンバー。管理グループ：管理者のみ。"
  - heading: あなたの名前、写真、ヘッダー画像
    body: グループごとに、自分だけの配役表があります。各グループで人に表示される名前（2〜50文字、グループ内で重複しないこと）と、そこで使うプロフィール写真を選べます。家では**Sam**、旅行では**Sam（車持ち）**というように。設定を変更できる人は、グループ名の変更と説明の編集ができます。ヘッダー画像（10MBまでのJPEG、PNG、GIF、WebP）には、専用の権限があります。
  - heading: アーカイブ、ロック、閉鎖
    body: グループを片付ける3つの方法を、軽いものから重いものの順に紹介します。
    items:
      - "**アーカイブ**すると、自分のダッシュボードからだけグループが非表示になり、ほかの人のダッシュボードには影響しません。これまでどおり開いて使うこともでき、**グループのアーカイブを解除**で元に戻せます。"
      - "**ロック**すると、管理者が解除するまで変更できなくなります。全員がグループとその履歴を読むことはできます。"
      - "**閉鎖**は取り消せず、全員に適用されます。できるのは管理者だけで、確認のためにグループ名を入力します。閉鎖したグループは、誰も二度と開けません。"
  - heading: グループを退出する
    body: 精算が済めば、誰でも退出できます。1つの通貨だけでも借りや貸しが残っている間、自分が含まれる支出に未解決の質問がある間、または自分が最後の管理者か唯一のメンバーである場合は、退出できません。[支払いを記録](page:feature/settle-up)するか、[支出への質問](page:guide/what-to-do-when-someone-disputes-a-shared-expense)を解決するか、ほかの人を管理者にしてから退出してください。戻るには、新しい招待が必要です。
limits:
  heading: ほどほどに：細かい注意書き
  items:
    - 1つのグループには最大50人が参加できます。
    - 権限と役割を変更できるのは管理者だけです。最後の管理者は降格できません。
    - 支出の編集を**管理者のみ**に設定すると、支出を追加できるのも管理者だけになります。
    - ロックすると、支出の変更、新しい支払い、リストと投票の変更ができなくなります。全員がグループとその履歴を読むことはでき、支払いへのリアクションもできます。
    - 閉鎖は取り消せません。アプリには、閉鎖したグループを再び開く方法がありません。
    - 新しい招待リンクを作っても、古いリンクは無効になりません。各リンクはそれぞれの有効期限まで使えるので、リンクがどこに渡るか心配なときは、短い期間を選んでください。
    - アプリ内の招待には、最近アクティブだった10グループの人が一覧表示されます。それ以外の人にはリンクが必要で、誰が招待できるかはグループの権限によります。
    - 参加にはアカウントが必要で、何かを追加する前にメールアドレスの確認が必要です。
useCasesHeading: ちょっとした秩序が役立つ場面
faq:
  heading: よくある質問
  items:
    - q: 閲覧者は支出を追加できますか？
      a: いいえ。閲覧者はすべてを見られますが、何も変更できません。支出やリストの追加・編集、人の招待、設定の変更はできません。
    - q: お金を借りたままグループを退出できますか？
      a: いいえ。1つの通貨だけでも借りや貸しが残っている間は、誰も退出できません。先に精算してから退出してください。
    - q: グループを閉鎖するとどうなりますか？
      a: 二度と誰も開けません。グループを閉鎖できるのは管理者だけで、確認のためにグループ名を入力する必要があり、グループは全員が利用できなくなります。変更を止めたいだけなら、ロックしてください。自分のダッシュボードから消したいだけなら、アーカイブしてください。
    - q: ロックを元に戻せますか？
      a: はい。管理者がグループのロックを解除すれば、再び変更できます。
    - q: 参加の前に、必ず承認する必要がありますか？
      a: そうしたい場合だけです。新しいグループはオープンコラボレーションから始まり、リンクを使った人は自動的に参加します。管理者の承認をオンにするか、管理グループを選ぶと、一人ひとりが管理者の許可を待つことになります。
    - q: グループには何人まで参加できますか？
      a: 最大50人です。
