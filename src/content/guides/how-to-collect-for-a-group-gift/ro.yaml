meta:
  title: "Cum strângi bani pentru un cadou comun | Side Badger"
  description: "Fiecare dă altă sumă, iar cardul unuia duce greul. Votați bugetul într-un sondaj, introduceți sume exacte și lăsați Side Badger să facă socotelile."
h1: "Cum strângi bani pentru un cadou comun"
navLabel: "Strânge bani pentru un cadou"
lead: "A strânge bani pentru un cadou comun înseamnă că o persoană plătește din buzunar, iar ceilalți îi datorează contribuția lor. Stabiliți bugetul printr-un sondaj, lăsați-l pe cumpărător să pună cadoul pe cardul lui, apoi introduceți-l ca o singură cheltuială cu [sume exacte](page:feature/split-expenses), câte o cifră pentru fiecare. Side Badger arată cine ce îi datorează cumpărătorului, iar fiecare își trimite partea cum preferă."
cta:
  heading: "Colectă fără pălărie"
  body: "Fă un grup fără cel care primește cadoul și introdu cadoul cu sume exacte. Side Badger este gratuit, fără reclame și fără limite zilnice. Vrei mai întâi un tur? Vezi [cum funcționează](page:how-it-works) sau [ce acoperă gratuitul](page:pricing)."
sections:
  - heading: "Patru prieteni, un pick-up, patru sume diferite"
    body: "Bea împlinește 30 de ani și vrea un pick-up pentru viniluri. Priya, Omar, Lena și Sam i-l cumpără. Priya găsește unul de 240 £ și îl cumpără cu cardul ei, pentru că cineva trebuie să înceapă. Cei patru nu contribuie egal. Priya și Omar dau câte 60 £, Lena 80 £ și Sam 40 £. Nimeni nu-și explică cifra și nimeni nu întreabă. Omar mai cumpără o felicitare și hârtie de împachetat cu 12 £. Toți patru semnează felicitarea, așa că aceea se împarte egal."
  - heading: "Stabiliți bugetul înainte ca cineva să apese pe Cumpără"
    body: "Un sondaj pentru buget scutește de cearta despre un pick-up de 400 £. În grup alege **Adaugă Sondaj** și întreabă cât ar trebui să coste cadoul. Fă din opțiuni sume, de exemplu până la 150 £, până la 200 £ și până la 250 £. Activează **Vot anonim**, care ascunde cine a votat ce, ca nimeni să nu fie nevoit să-și apere cu voce tare o sumă mai mică. Setările nu se mai pot schimba după primul vot, așa că verifică-le mai întâi. Un sondaj nu se închide singur. Când au votat toți, alege **Închide sondajul** și apare **Câștigător**. Sondajul stabilește totalul. Nu stabilește partea nimănui."
  - heading: "Cum citești socoteala"
    body: "Cadoul se împarte 60 £, 60 £, 80 £ și 40 £, ceea ce dă cele 240 £ de pe chitanță. Felicitarea și hârtia de împachetat se împart în patru, câte 3 £ fiecare. Partea lui Priya este 60 £ + 3 £, adică 63 £, iar ea a plătit 240 £, deci i se datorează 177 £. Partea lui Omar este tot 63 £, dar el a plătit 12 £, deci datorează 51 £. Lena datorează 80 £ + 3 £, adică 83 £, iar Sam datorează 40 £ + 3 £, adică 43 £. Cei trei dau împreună cele 177 £ ale lui Priya. Lăsate în pace, datoriile ar merge în cinci direcții prin grup. Side Badger sugerează în schimb trei plăți, toate către Priya. [Decontarea](page:feature/settle-up) are detaliile."
  - heading: "Pune totul în Side Badger"
    body: "Partea lui Priya durează vreo cinci minute."
    items:
      - "**Fă grupul.** În panoul principal alege **Creează Grup**. Alege **Invită pe alții** și trimite linkul sau codul QR celor care contribuie, și nimănui altcuiva."
      - "**Adaugă cadoul.** Alege **Adaugă Cheltuială**, descrie-l, scrie 240, iar la **Cine a plătit?** alege-o pe Priya. Lasă-i pe toți patru la **Împarte între**, apoi la **Cum se împarte** alege **Sume exacte** și scrie 60, 60, 80 și 40. Sumele trebuie să dea împreună 240. Atașează confirmarea comenzii, dacă vrei. Alege **Salvează Cheltuiala**."
      - "**Adaugă felicitarea.** Omar adaugă singur cele 12 £, se alege pe el la **Cine a plătit?** și lasă **Cum se împarte** pe **Egal**, cu toți cei patru bifați."
      - "**Numărați, apoi plătiți.** Fiecare verifică **Solduri**, care arată cine cui datorează, și îi trimite lui Priya partea lui cum preferă. Apoi înregistrează plata cu **Decontează** și **Înregistrează Decontarea**. Decontarea rapidă completează suma."
  - heading: "Cumperi întâi sau strângi întâi"
    body: "Side Badger nu ține fondul comun, așa că „a strânge” înseamnă de fapt „a număra”. Merg două ordini."
    items:
      - "**Cumperi întâi.** Cumpărătorul plătește, adaugă cheltuiala la prețul real și toți își văd partea imediat. E mai ordonat, dar cumpărătorul duce costul până plătesc ceilalți, așa că alegeți un cumpărător care își permite."
      - "**Strângi întâi.** Oamenii îi trimit cumpărătorului cifra lor înainte de achiziție. Când aveți prețul, introduceți cadoul, apoi înregistrați fiecare plată cu data la care au mișcat banii de fapt. Adăugați cadoul primul, ca fiecare plată să aibă un sold în care să intre."
      - "**Prețul se mișcă.** Livrarea, un cod de reducere, o scumpire de ultim moment. Editează cadoul și schimbă sumele exacte, ca să dea în continuare totalul. Versiunea anterioară se păstrează, dar spune-le mai întâi celorlalți, pentru că li se schimbă soldurile."
  - heading: "Ține-o pe Bea departe de asta"
    body: "Doar membrii unui grup îl pot vedea, deci Bea nu poate vedea un grup în care nu e. Invită-i pe cei care contribuie și pe nimeni altcineva. Un link funcționează până expiră, și poți alege orice durată, de la 15 minute la 5 zile, așa că alege una scurtă și trimite-l undeva unde Bea nu-l va vedea. Linkul arată o previzualizare a grupului oricui îl deschide, așa că dă grupului un nume plictisitor, de exemplu „Fondul de sâmbătă”, și nu pune numele Beei nici în etichetele cheltuielilor, nici în opțiunile sondajului."
  - heading: "Ce nu face Side Badger aici"
    items:
      - "Nu ține și nu strânge banii. Contribuțiile ajung la cumpărător prin transfer bancar, numerar sau ce folosiți, iar apoi cineva le înregistrează."
      - "Nu trimite mementouri de plată. Să-l îmboldești pe cel care n-a plătit rămâne tot treaba oamenilor."
      - "Nu calculează partea nimănui. Un sondaj stabilește bugetul și nu există o opțiune „împarte ce rămâne”, așa că scrii tu fiecare sumă."
      - "Fiecare cheltuială are un singur plătitor. Dacă două persoane au cumpărat părți diferite din cadou, introdu două cheltuieli."
      - "Toți cei din împărțire au nevoie de un cont gratuit și de un loc în grup."
