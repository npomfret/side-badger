meta:
  title: "कम पेमेंट में हिसाब चुकता करें | Side Badger"
  description: "देखें कि आपके ग्रुप में किसे किसका देना है, सबका हिसाब निपटाने वाली पेमेंट की छोटी सूची पाएं, और हर पेमेंट होते ही रिकॉर्ड करें। इस्तेमाल मुफ्त है।"
h1: "कम पेमेंट में हिसाब चुकता करें"
navLabel: "हिसाब चुकता करें"
lead: "Side Badger ग्रुप में सबका चलता हुआ बैलेंस रखता है और पेमेंट की एक छोटी सूची सुझाता है जिससे हिसाब निपट जाए। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं, फिर उसे रिकॉर्ड करते हैं। अगर पहले देखना चाहते हैं कि संख्याएं कैसे बंटती हैं, तो [खर्च बांटना](page:feature/split-expenses) से शुरू करें।"
cta:
  heading: "सुलझाने के लिए तैयार कि किसे किसका देना है?"
  body: "अकाउंट बनाएं, ग्रुप शुरू करें और पहला खर्च जोड़ें। आगे का काम बैलेंस संभाल लेंगे।"
  button: "मुफ्त अकाउंट बनाएं"
problem:
  heading: "बैलेंस जो साथ-साथ अपडेट होते हैं"
  body: "हर खर्च बदल देता है कि किसे किसका देना है, इसलिए खर्च और पेमेंट जुड़ते ही Side Badger बैलेंस को ताज़ा रखता है। ग्रुप में सबको बदलाव तुरंत दिखता है, साथ में यह भी कि क्या बदला और किसने बदला। बैलेंस हर करेंसी के हिसाब से रखे जाते हैं, इसलिए यूरो और पाउंड अपने-अपने कॉलम में रहते हैं, जब तक कि कोई खर्च दर्ज करते समय बदला न गया हो। डिफ़ॉल्ट रूप से आपको वे उधारियां दिखती हैं जिनमें आप शामिल हैं; **सभी दिखाएं** पूरे ग्रुप की सूची देता है।"
workflow:
  heading: "बराबरी तक तीन कदम"
  steps:
    - title: "देखें किसे किसका देना है"
      body: "ग्रुप के बैलेंस खोलकर देखें कि आपको क्या देना है, आपको क्या मिलना है, और पेमेंट की वह छोटी सूची जो सबका हिसाब निपटाती है, हर करेंसी के हिसाब से निकाली हुई। सवाल उठाए गए खर्च तब तक हिसाब से बाहर रहते हैं जब तक वे निपट न जाएं। नीचे रूममेट्स के उदाहरण में छह पेमेंट घटकर दो रह जाते हैं।"
      shot: S10
      shotAlt: "बैलेंस की स्क्रीन, जिसमें दो करेंसी में सरल की गई उधारियां दिख रही हैं और सभी दिखाएं चालू है"
    - title: "जैसे चाहें पेमेंट करें, फिर रिकॉर्ड करें"
      body: "बैंक ट्रांसफर, कैश, पिछली छुट्टी का कोई एहसान। Side Badger पैसे नहीं भेजता। पैसा हाथ बदलने के बाद पेमेंट रिकॉर्ड करें और बैलेंस सबके लिए अपडेट हो जाता है।"
      shot: S11
      shotAlt: "पेमेंट का फॉर्म, जिसमें त्वरित निपटान बटन और आंशिक पेमेंट की सूचना दिख रही है"
    - title: "देखें कि पहुंच गया"
      body: "पेमेंट ग्रुप की हिस्ट्री में जाता है, जहां ग्रुप में सब उसे देख सकते हैं और इमोजी से रिएक्ट कर सकते हैं। पेमेंट पहुंचे तो जश्न मनाएं।"
      shot: S12
      shotAlt: "पेमेंट की हिस्ट्री, जिसमें एक पेमेंट पर इमोजी रिएक्शन हैं"
