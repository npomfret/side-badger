meta:
  title: "Dziel rachunki domowe ze współlokatorami"
  description: "Dziel czynsz według wielkości pokoju, energię i zakupy po równo i sprawdzaj co miesiąc, kto komu jest winien. Darmowy sposób dla współlokatorów na prowadzenie rachunku."
h1: "Dziel rachunki domowe ze współlokatorami"
navLabel: "Współlokatorzy"
lead: "Dla współlokatora, który kupuje papier toaletowy, i współlokatorów, którzy nigdy tego nie widzą. Side Badger prowadzi jeden bieżący rachunek czynszu, opłat i zakupów dla **współlokatorów**, więc nikt nie musi nikogo ścigać, a lodówka może znów być tylko lodówką."
cta:
  heading: "Zacznij od własnego domu"
  body: "Załóż konto, utwórz grupę dla domu i wyślij wszystkim link z zaproszeniem. Rachunki z tego miesiąca mogą wejść jeszcze dziś wieczorem."
  button: "Załóż darmowe konto"
scenario:
  heading: "Urządź dom"
  body: "Utwórz grupę dla domu, wybierz imię, pod którym chcesz być widoczny, i zaproś wszystkich linkiem lub kodem QR. Grupa może być otwarta, gdzie każdy dodaje i edytuje, albo zarządzana, gdzie nowi członkowie wymagają zatwierdzenia administratora, a wydatki mogą zmieniać tylko twórcy i administratorzy, co pasuje do współlokatora prowadzącego księgi. Każdy, kto chce tylko patrzeć na liczby, może być widzem, który widzi wszystko i niczego nie zmienia. Każdy widzi nowy wydatek od razu, więc „dodam to później” ma mniej kryjówek."
sections:
  - heading: "Czynsz i rachunki"
    body: "Czynsz rzadko dzieli się przez cztery, bo pokoje nie są takie same. Podziel go procentowo, żeby duży pokój płacił więcej, a schowek z oknem mniej. Procenty muszą dawać w sumie 100. Rachunki, z których wszyscy korzystają, dostają równy podział, a współlokator, który nie brał udziału w wydatku, może zostać z niego pominięty. Gdy równy podział zostawia ostatni grosz, trafia on do jednej losowej osoby. Nie ma rachunków cyklicznych, więc co miesiąc kopiujesz zeszłomiesięczny czynsz, zmieniasz datę i jedziesz dalej."
  - heading: "Wspólne zakupy"
    body: "Trzymaj wspólną listę zakupów w tej samej grupie co rachunki za zakupy i odhaczaj pozycje, gdy trafią do wózka. Kto robi zakupy, dodaje sumę z paragonu jako wydatek i dzieli ją po równo albo tylko między osoby, które to zjedzą. Kto wciąż kupuje mleko owsiane, którego nikt inny nie pije, pozostaje sprawą domu, ale przynajmniej lista wydatków będzie dokładna. Uprawnienia grupy decydują, kto może tworzyć i edytować listy. Złóż czynsz, rachunki i zakupy razem, a dostaniesz miesiąc taki jak poniżej, w domu czworga: Jo płaci 2 000 £ czynszu, dzielonego 30%, 25%, 25% i 20% według wielkości pokoju, potem Kwame płaci 120 £ za energię, Lena 40 £ za internet, a Matt 80 £ za zakupy, każde dzielone po równo. Jo kończy z saldem 1 340 £ do odzyskania, a Side Badger podpowiada trzy płatności, wszystkie do Jo."
  - heading: "Uczciwe sposoby dzielenia kosztów domowych"
    items:
      - "**Po równo** pasuje do tego, z czego wszyscy korzystają mniej więcej tak samo, jak internet, środki czystości i wspólne zakupy. Jest szybkie i nikt nie musi się kłócić o matematykę."
      - "**Według wielkości pokoju** pasuje do czynszu, bo pokoje się różnią, a także to, ile ludzie chcą za nie płacić. Ustal procenty raz, gdy ktoś się wprowadza, i używaj ich co miesiąc."
      - "**Według użycia** pasuje do rachunków, gdzie jedna osoba wyraźnie używa więcej, jak rachunek za ogrzewanie domowego biura albo konto streamingowe oglądane przez dwie osoby. Pomiń osoby, które nie brały w tym udziału, albo wpisz dokładne kwoty dla każdej."
      - "Jakkolwiek zdecydujesz, ustal to przed pierwszym rachunkiem, a nie po pierwszej kłótni, i zapisz zasadę w miejscu, które widzi cały dom."
  - heading: "Gdy ktoś się wyprowadza"
    body: "Najpierw się rozlicza. Nikt nie może opuścić grupy, dopóki jest komuś winien pieniądze albo ktoś jest winien jemu, więc wyprowadzający się płaci albo dostaje, ty to rejestrujesz i dopiero wtedy odchodzi. Prowadź grupę dalej dla pozostałych współlokatorów i zaproś nową osobę linkiem. Gdy sam dom się skończy, administrator może zablokować grupę, żeby liczby zostały na miejscu, albo zamknąć ją na dobre, co czyni ją niedostępną dla wszystkich, więc rób to dopiero, gdy nikt nie potrzebuje historii."
exampleAfter: 2
