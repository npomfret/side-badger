faq:
  heading: "Otázky"
  items:
    - q: "Máme použít hrubou, nebo čistou mzdu?"
      a: "To je na skupině. Běžně se používá čistá mzda, protože jsou to peníze, které skutečně máte k utrácení. Hrubá mzda přehlíží, že daně, penzijní příspěvky a splátky půjček ubírají z různých mezd různě. Ať zvolíte cokoli, použijte pro oba stejné měřítko."
    - q: "Vidí Side Badger naše příjmy?"
      a: "Ne. Zadáváte jen procenta, nikdy mzdy. Procenta vidí členové skupiny, a u páru jste to vy dva."
    - q: "Můžeme nastavit 62/38 jednou pro všechno?"
      a: "Rozdělení se nastavuje u každého výdaje, ne u skupiny. Zkopírujte výdaj, který už má 62 a 38, a změňte, co se liší. Další možnosti shrnuje [dělení výdajů](page:feature/split-expenses)."
