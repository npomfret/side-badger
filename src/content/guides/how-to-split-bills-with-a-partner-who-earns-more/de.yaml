faq:
  heading: "Fragen"
  items:
    - q: "Sollen wir Brutto- oder Nettoeinkommen nehmen?"
      a: "Das entscheidet ihr. Netto ist üblich, weil es das Geld ist, das ihr tatsächlich ausgeben könnt. Das Bruttogehalt ignoriert, dass Steuern, Rentenbeiträge und Kreditrückzahlungen bei verschiedenen Gehältern unterschiedlich viel abziehen. Was ihr auch wählt, nehmt für euch beide dasselbe Maß."
    - q: "Sieht Side Badger unser Einkommen?"
      a: "Nein. Du gibst nur Prozentsätze ein, nie Gehälter. Die Prozentsätze sind für die Mitglieder der Gruppe sichtbar, und bei einem Paar seid das ihr zwei."
    - q: "Können wir 62/38 einmal für alles festlegen?"
      a: "Die Aufteilung wird pro Ausgabe festgelegt, nicht pro Gruppe. Kopiere eine Ausgabe, die schon 62 und 38 hat, und ändere, was abweicht. [Ausgaben teilen](page:feature/split-expenses) zeigt die anderen Möglichkeiten."
