faq:
  heading: "প্রশ্ন"
  items:
    - q: "বেস্ট ম্যান বা মেইড অব অনার কি বেশি দেবে?"
      a: "শুধু গ্রুপ রাজি থাকলে। অঙ্কের হিসাবে অ্যাপ কাউকে কোনো বিশেষ ভূমিকা দেয় না। কেউ বেশি দিলে **কীভাবে ভাগ হবে** অংশে **সঠিক পরিমাণ** বা **শতাংশ** বেছে নিয়ে আপনাদের ঠিক করা ভাগগুলো লিখুন।"
    - q: "কেউ কেউ যে পানীয় নেয়নি, তার কী হবে?"
      a: "পানীয়গুলো আলাদা খরচ হিসেবে যোগ করুন আর শুধু যারা নিয়েছে তাদের টিক দিন। সবাই আলাদা পরিমাণ নিলে **সঠিক পরিমাণ** বেছে প্রত্যেকের ভাগ লিখুন। যা কেউ নেয়নি তার টাকা কেউ দেয় না।"
    - q: "বিশেষ অতিথি কি পরে গ্রুপটা দেখতে পারে?"
      a: "হ্যাঁ, চমক শেষ হলে। তাকে আমন্ত্রণ জানান, তারপর গ্রুপের সেটিংসে **নিরাপত্তা ও পারমিশন** অংশে অ্যাডমিন তাকে **দর্শক** করে দিতে পারেন। দর্শক সব দেখে কিন্তু কিছুই বদলাতে পারে না, তাই কিছু আর গোপন না থাকা পর্যন্ত অপেক্ষা করুন। যোগ দিতে তার একটি বিনামূল্যের অ্যাকাউন্ট লাগবে।"
