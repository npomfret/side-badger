meta:
  title: Dela utgifter lika, exakt eller i procent | Side Badger
  description: Dela en gemensam kostnad lika, efter exakta belopp eller i procent, och lämna utanför den som inte var med. Gratis, utan annonser och utan dagliga gränser.
h1: Dela utgifter lika, exakt eller i procent
navLabel: Dela utgifter
lead: Allt är inte 50/50. Side Badger klarar det. Ange vem som betalade, välj de som delade på kostnaden och dela den **lika, efter exakta belopp eller i procent**. Gräl säljs separat.
cta:
  heading: Dela nästa utgift ordentligt
  body: Skapa ett gratiskonto, starta en grupp och lägg till den utgift du länge menat att reda ut. Osäker på vad som händer sedan? Se [så fungerar det](page:how-it-works), eller kolla [vad gratis omfattar](page:pricing).
  button: Skapa ett gratiskonto
problem:
  heading: Allt är inte 50/50
  body: Hyran följer rummets storlek. En present följer vem som lovade vad. En middag följer vem som blev kvar till efterrätten. Att dela en räkning på mitten funkar tills den första räkningen som inte går att dela så, och då öppnar någon ett kalkylblad. Side Badger registrerar vem som betalade, vilka som delade på kostnaden och hur den fördelas, så att saldona blir rätt utan att någon behöver göra långdivision vid bordet.
workflow:
  heading: Att lägga till en utgift, från början till slut
  steps:
    - title: Ange vem som betalade och för vad
      body: Skriv in beloppet, en kort beskrivning och personen som betalade. En person betalar för varje utgift, vilket håller räkningen ärlig.
      shot: S05
      shotAlt: Utgiftsformuläret med en stugehyra delad i procent mellan tre personer
    - title: Välj delning
      body: Välj lika, exakta belopp eller procent. Procenten måste bli 100 tillsammans, och de exakta beloppen måste bli lika med totalen.
      shot: S06
      shotAlt: Utgiftsformuläret med exakta belopp ifyllda för varje person på en present
    - title: Lägg till historien
      body: Ange datum, lägg till etiketter, en plats och en anteckning. Alla i gruppen ser samma uppgifter och kan kommentera direkt där.
      shot: S08
      shotAlt: En utgift med sina uppgifter, en kommentarstråd och det ursprungliga belopp den lades in med
    - title: Ställ en fråga om något ser fel ut
      body: Om gruppen har slagit på utgiftsfrågor kan alla som ingår i en utgift ifrågasätta den, och utgiftslistan kan visa bara de ifrågasatta.
      shot: S18
      shotAlt: Utgiftslistan med en Ifrågasatt-etikett och filtret Endast ifrågasatt
options:
  heading: Tre sätt att dela
  items:
    - title: Lika
      body: Standardvalet för middagar, taxiresor och allt som alla delade jämnt på. Om totalen inte går jämnt upp hamnar det udda öret hos en person på slumpen, inte alltid samma. I taxin nedan är det Ana.
    - title: Efter exakta belopp
      body: Skriv in vad var och en är skyldig. Bra för presenten där alla valde olika pris, eller butiken där en persons kundvagn innehöll mer än de gemensamma matvarorna. Beloppen måste bli lika med totalen.
    - title: I procent
      body: Ge varje person en andel av totalen. Hyra efter rummens storlek är klassikern, där det största rummet betalar störst andel och ingen låtsas något annat.
