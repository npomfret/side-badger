meta:
  title: "Mit tud és mit nem tud a Side Badger"
  description: "Felosztás, elszámolás és több pénznem, plusz csoportok, listák és szavazások. A teljes felszereltség, és egy őszinte lista arról, amit a Side Badger kihagy."
h1: "Mit tud a Side Badger"
navLabel: "Funkciók"
lead: "Minden, ami a dobozban van, és ami nincs."
intro: "Itt a teljes felszereltség. A táblázatot szándékosan kihagytuk. Kezdd a három feladattal, amelyet a Side Badger minden nap elvégez, aztán nézd meg a lista többi részét és a rövid listát arról, amit nem csinál."
cta:
  heading: "Azt tudja, amire a csoportodnak szüksége van?"
  body: "Hozz létre ingyenes fiókot, és először egy kis csoporttal próbáld ki."
  button: "Ingyenes fiók létrehozása"
cardsHeading: "A három feladat részletesen"
sections:
  - heading: "Nyugtaszkennelés"
    body: "Fotózd le a nyugtát, és a Side Badger kitölti az összeget, a dátumot és a helyet, hogy ellenőrizhesd. A nyugták képeit a Google AI-szolgáltatása olvassa."
  - heading: "Csoportok és jogosultságok"
    body: "Csinálj csoportot minden házhoz, utazáshoz vagy eseményhez, legfeljebb 50 emberrel. Hívj meg embereket linkkel vagy QR-kóddal. Egy nagyobb csoportban valakit megfigyelővé tehetsz, aki mindent lát, és semmit nem változtat."
  - heading: "Listák és szavazások"
    body: "Tartsd a közös bevásárlólistát a bevásárlási számlák mellett. Bocsásd szavazásra a villák szűkített listáját, ha szeretnéd, névtelenül."
  - heading: "Minden más"
    items:
      - "**Élő frissítések:** adj hozzá egy költséget, és mindenki azonnal látja."
      - "**Nyelvek:** használd a Side Badgert 39 nyelven. A csoport minden tagja kiválaszthatja a sajátját."
      - "**Kezdőképernyő:** nem kell alkalmazásbolt. Jelentkezz be, aztán add hozzá a Side Badgert a kezdőképernyődhöz, és úgy nyílik meg, mint egy alkalmazás. Az alkalmazás Beállítások menüje megmutatja, hogyan."
      - "**Visszajelzés:** hibát találtál? Írj nekünk az alkalmazásból, és ott olvasd el a válaszunkat."
  - heading: "Amit a Side Badger nem csinál"
    items:
      - "**Nem mozgat pénzt.** A Side Badger sosem nyúl a pénzedhez. Fizessetek egymásnak, ahogy akartok. A fizetési kérések tervben vannak."
      - "**Nem ismétel számlákat.** Nincsenek ismétlődő költségek. Másold le a múlt havi számlát két koppintással."
      - "**Nem oszt tételenként.** Egy költséget egy ember fizet. Oszd egyenlően, pontosan vagy százalékosan."
      - "**Nincs natív alkalmazása.** A böngészőben működik. Jelentkezz be, aztán add hozzá a kezdőképernyődhöz."
      - "**Nem működik offline.** Kapcsolat kell hozzá."
      - "**Nem küld e-mailes vagy SMS-es riasztást.** Az értesítések az alkalmazásban jelennek meg. A push-értesítések tervben vannak."
      - "**Nem rajzol grafikonokat vagy költségvetést.** Vezeti a számolást, ki kinek tartozik, és ez az egész trükk."
      - "**Nem lehet vele Google- vagy Apple-fiókkal belépni.** Regisztrálj e-mail-címmel. A Google- és Apple-belépés tervben van."
      - "**Nem enged be embereket fiók nélkül.** A csoport minden tagjának kell egy ingyenes fiók."
faq:
  heading: "Kérdések"
  items:
    - q: "Fizethetek a Side Badgeren keresztül?"
      a: "Nem. A Side Badger vezeti a számolást, és sosem nyúl a pénzedhez. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést."
    - q: "Van mobilalkalmazás?"
      a: "Alkalmazásboltban nincs. A Side Badger a böngészőben fut. Jelentkezz be a telefonodon, aztán add hozzá a kezdőképernyődhöz, hogy úgy nyíljon meg, mint egy alkalmazás. Az alkalmazás Beállítások menüje megmutatja, hogyan."
    - q: "Oszthatok tételenként?"
      a: "Nem. Minden költségnek egy fizetője van, és egyenlően, pontosan vagy százalékosan osztod fel."
    - q: "Működik offline?"
      a: "Nem, kapcsolat kell hozzá."
    - q: "A csoport minden tagjának kell fiók?"
      a: "Igen. A csoport minden tagjának kell egy ingyenes fiók, a regisztrációhoz pedig elég egy e-mail-cím."
