faq:
  heading: Spørgsmål
  items:
    - q: Er beregneren gratis?
      a: Ja. Gratis. Ingen reklamer. Ingen daglige grænser. Du behøver heller ikke en konto.
    - q: Gemmer den, hvad jeg skriver?
      a: Nej. Intet gemmes eller sendes nogen steder hen. Vil du beholde dine tal, så brug Kopiér link og gem linket et sted.
    - q: Hvem kan se det link, jeg kopierer?
      a: "Alle, der har det. Tallene ligger i selve linket, efter #, så del det kun med dem, der skal se dem."
    - q: Flytter den penge?
      a: Nej. Den regner ud, hvem der skal betale hvem, og I betaler hinanden, som I vil. Side Badger rører heller aldrig dine penge. Se [gør op](page:feature/settle-up).
    - q: Kan jeg dele en tur, der er betalt i to valutaer?
      a: Ikke her, for en beregning har én valuta. I en gruppe har hver valuta sin egen saldo. Se [flere valutaer](page:feature/multiple-currencies).
    - q: Hvad hvis beløbene ikke går op?
      a: Det siger beregneren under udgiften, og den viser intet resultat, før de gør. Nøjagtige beløb skal give totalen, og procenter skal give 100.
