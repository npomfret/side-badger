featuresHeading: "No que uma viagem se apoia"
faq:
  heading: "Perguntas"
  items:
    - q: "Quem saltou o jantar pode ficar de fora?"
      a: "Sim. Escolhe quem fez parte de cada despesa e só essas pessoas pagam por ela."
    - q: "Funciona sem rede?"
      a: "Não. O Side Badger precisa de ligação, por isso adiciona os custos quando voltares a ter wifi."
    - q: "Todos têm de instalar alguma coisa?"
      a: "Não. Funciona no navegador. Envia o link de convite e as pessoas entram a partir do telemóvel."
    - q: "Que taxa de câmbio usa?"
      a: "Uma taxa de câmbio atual quando introduzes a despesa, ou a tua, se tiveres tido outra. A taxa fica fixa quando a despesa é guardada, por isso as despesas antigas nunca são reavaliadas."
    - q: "Podemos congelar o grupo depois da viagem?"
      a: "Sim. Um administrador pode bloquear o grupo para os números ficarem como estão."
    - q: "Há limite para os valores?"
      a: "Sim. 999,999.99 por despesa, na sua própria moeda."
