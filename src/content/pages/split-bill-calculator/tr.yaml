faq:
  heading: "Sorular"
  items:
    - q: "Hesaplayıcı ücretsiz mi?"
      a: "Evet. Ücretsiz. Reklam yok. Günlük sınır yok. Hesap açmanız da gerekmez."
    - q: "Yazdıklarımı kaydeder mi?"
      a: "Hayır. Hiçbir şey kaydedilmez ya da bir yere gönderilmez. Rakamlarınızı saklamak için Bağlantıyı kopyala'yı kullanın ve bağlantıyı bir yere kaydedin."
    - q: "Kopyaladığım bağlantıyı kim görebilir?"
      a: "Bağlantıya sahip herkes. Rakamlar # işaretinden sonra bağlantının içinde durur; bu yüzden onu yalnızca görmesi gereken kişilerle paylaşın."
    - q: "Para taşır mı?"
      a: "Hayır. Kimin kime ödemesi gerektiğini hesaplar, siz birbirinize istediğiniz yolla ödersiniz. Side Badger da paranıza asla dokunmaz. [Hesaplaşma](page:feature/settle-up) sayfasına bakın."
    - q: "İki para biriminde ödenen bir geziyi bölebilir miyim?"
      a: "Burada olmaz, çünkü bir hesaplamanın tek para birimi var. Bir grupta her para biriminin kendi bakiyesi tutulur. [Birden fazla para birimi](page:feature/multiple-currencies) sayfasına bakın."
    - q: "Tutarlar toplamda tutmazsa ne olur?"
      a: "Hesaplayıcı bunu harcamanın altında söyler ve tutana kadar sonuç göstermez. Tam tutarların toplamı harcamaya eşit olmalı, yüzdelerin toplamı 100 etmeli."
