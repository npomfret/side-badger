meta:
  title: Hva Side Badger gjør og ikke gjør
  description: Deling, oppgjør og flere valutaer, pluss grupper, lister og avstemninger. Hele pakken, og en ærlig liste over hva Side Badger lar være.
h1: Hva Side Badger gjør
navLabel: Funksjoner
lead: Alt som er i boksen, og det som ikke er det.
intro: Her er hele pakken. Regnearket har vi utelatt med vilje. Velg en funksjon nedenfor for den lange versjonen, eller se raskt gjennom resten av listen og den korte listen over det Side Badger ikke gjør.
cta:
  heading: Gjør den det gruppen din trenger?
  body: Opprett en gratis konto og prøv den med en liten gruppe først.
cardsHeading: Hver funksjon, i detalj
sections:
  - heading: Kvitteringsskanning
    body: Ta bilde av kvitteringen, så fyller Side Badger inn sum, dato og sted, slik at du kan sjekke. Kvitteringsbilder leses av Googles AI-tjeneste. [Slik fungerer kvitteringsskanning](page:feature/receipt-scanning).
  - heading: Grupper og tillatelser
    body: Lag en gruppe for hvert hjem, hver tur eller hvert arrangement, med opptil 50 personer i. Inviter folk med en lenke eller en QR-kode. I en større gruppe kan du gjøre noen til seer, som ser alt og ikke endrer noe. [Grupper og tillatelser](page:feature/groups-and-permissions) har det med liten skrift.
  - heading: Lister og avstemninger
    body: Ha den felles handlelisten ved siden av handleregningene. Sett villakandidatene opp til avstemning, anonymt hvis du vil. [Planlegg det sammen](page:feature/plan-together) tar for seg kommentarer, spørsmål, lister og avstemninger.
  - heading: Alt det andre
    items:
      - "**Direkteoppdateringer:** legg til en utgift, så ser alle den med en gang."
      - "**Språk:** bruk Side Badger på 39 språk. Alle i gruppen kan velge sitt eget."
      - "**Startskjerm:** ingen appbutikk nødvendig. Logg inn, og legg deretter Side Badger til på startskjermen, så åpnes den som en app. Innstillinger i appen viser deg hvordan. [Mer om nettappen](page:feature/web-app)."
      - "**Varsler:** slå på pushvarsler i Innstillinger, så får du et varsel når det er ny aktivitet i gruppene dine. På iPhone og iPad legger du først Side Badger til på startskjermen."
      - "**Tilbakemelding:** funnet en feil? Si fra inne i appen og se svaret vårt der."
  - heading: Hva Side Badger ikke gjør
    items:
      - "**Flytte penger.** Side Badger rører aldri pengene dine. Betal hverandre slik dere vil. Betalingsforespørsler er planlagt."
      - "**Gjentakende regninger.** Det finnes ingen faste utgifter. Kopier forrige måneds regning med to trykk."
      - "**Dele per vare.** Én betaler per utgift. Del likt, nøyaktig eller etter prosent."
      - "**Levere en egen app.** Den fungerer i nettleseren. Logg inn, og legg den deretter til på startskjermen."
      - "**Fungere uten nett.** Den trenger en tilkobling."
      - "**Sende varsler på e-post eller SMS.** Ny aktivitet vises i appen, og som pushvarsler hvis du slår dem på."
      - "**Tegne diagrammer eller budsjetter.** Den fører regnskap over hvem som skylder hvem, og det er hele trikset."
      - "**Logge inn med Google eller Apple.** Registrer deg med e-post. Innlogging med Google og Apple er planlagt."
      - "**Slippe folk inn uten konto.** Alle i gruppen trenger en gratis konto."
faq:
  heading: Spørsmål
  items:
    - q: Kan jeg betale via Side Badger?
      a: Nei. Side Badger fører regnskapet og rører aldri pengene dine. Betal hverandre slik dere vil, og registrer så betalingen.
    - q: Finnes det en mobilapp?
      a: Ikke i en appbutikk. Side Badger kjører i nettleseren. Logg inn på telefonen, og legg den deretter til på startskjermen så den åpnes som en app. Innstillinger i appen viser deg hvordan.
    - q: Kan jeg dele per vare?
      a: Nei. Hver utgift har én betaler, og du deler den likt, nøyaktig eller etter prosent.
    - q: Fungerer det uten nett?
      a: Nei, det trenger en tilkobling.
    - q: Må alle i gruppen ha en konto?
      a: Ja. Alle i gruppen trenger en gratis konto, og alt du trenger for å registrere deg er en e-postadresse.
