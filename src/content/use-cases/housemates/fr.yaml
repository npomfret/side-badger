meta:
  title: "Partager les factures du foyer entre colocataires"
  description: "Répartissez le loyer selon la taille des chambres, partagez l'énergie et les courses à parts égales, et voyez qui doit quoi à qui chaque mois. Une façon gratuite pour les colocataires de tenir le compte."
h1: "Partager les factures du foyer entre colocataires"
navLabel: Colocataires
lead: "Pour le colocataire qui achète le papier toilette, et ceux qui ne voient jamais comment il arrive. Side Badger tient un seul compte courant du loyer, des factures et des courses pour les **colocataires**, pour que personne n'ait à relancer personne et que le frigo redevienne un simple frigo."
cta:
  heading: "Commencez par votre propre logement"
  body: "Créez un compte, faites un groupe pour le logement et envoyez à tout le monde le lien d'invitation. Les factures de ce mois peuvent y entrer dès ce soir."
  button: "Créer un compte gratuit"
scenario:
  heading: "Installez le logement"
  body: "Faites un groupe pour le logement, choisissez le nom sous lequel vous voulez qu'on vous voie, et invitez tout le monde avec un lien ou un code QR. Le groupe peut être ouvert, où chacun ajoute et modifie, ou géré, où les nouveaux membres ont besoin de l'approbation d'un admin et où seuls les créateurs et les admins peuvent modifier les dépenses, ce qui convient au colocataire qui tient les comptes. Celui qui veut juste regarder les chiffres peut être lecteur : il voit tout et ne change rien. Chacun voit une nouvelle dépense tout de suite, donc « je l'ajouterai plus tard » a moins de cachettes."
sections:
  - heading: "Le loyer et les factures"
    body: "Le loyer se divise rarement par quatre, parce que les chambres ne sont pas pareilles. Partagez-le par pourcentage, pour que la grande chambre paie plus et le cagibi avec fenêtre moins. Les pourcentages doivent faire 100 au total. Les factures que tout le monde utilise se partagent à parts égales, et un colocataire qui n'a pas pris part à une dépense peut en être laissé de côté. Quand un partage à parts égales laisse un centime en trop, il va à une personne au hasard. Il n'y a pas de factures récurrentes, donc chaque mois vous copiez le loyer du mois dernier, changez la date et continuez."
  - heading: "Les courses communes"
    body: "Gardez la liste de courses partagée dans le même groupe que les factures de courses, et cochez les articles à mesure qu'ils arrivent dans le caddie. Celui qui fait les courses ajoute le total du reçu comme dépense et le partage à parts égales, ou seulement entre ceux qui mangeront la chose. Qui continue d'acheter le lait d'avoine que personne d'autre ne boit reste une affaire du foyer, mais au moins la liste des dépenses sera exacte. Les permissions du groupe décident qui peut créer et modifier les listes. Mettez ensemble le loyer, les factures et les courses et vous obtenez un mois comme celui ci-dessous, dans un logement de quatre : Jo paie £2,000 de loyer, réparti 30 %, 25 %, 25 % et 20 % selon la taille des chambres, puis Kwame paie £120 d'énergie, Lena £40 d'internet et Matt £80 de courses, chacun partagé à parts égales. Jo se retrouve avec £1,340 à recevoir, et Side Badger suggère trois paiements, tous pour Jo."
  - heading: "Des façons équitables de partager les coûts du foyer"
    items:
      - "**À parts égales** convient à ce que tout le monde utilise à peu près autant, comme internet, les produits d'entretien et les courses communes. C'est rapide, et personne n'a à se disputer sur les calculs."
      - "**Selon la taille de la chambre** convient au loyer, parce que les chambres diffèrent et que ce que chacun veut payer pour elles aussi. Convenez des pourcentages une fois, à l'arrivée de quelqu'un, et réutilisez-les chaque mois."
      - "**Selon l'usage** convient aux factures où une personne utilise clairement plus, comme le chauffage d'un bureau à domicile ou un compte de streaming que deux personnes regardent. Laissez de côté ceux qui n'y ont pas pris part, ou saisissez des montants exacts pour chacun."
      - "Quel que soit votre choix, convenez-en avant la première facture plutôt qu'après la première dispute, et écrivez la règle quelque part où tout le logement peut la voir."
  - heading: "Quand quelqu'un déménage"
    body: "Il règle d'abord. Personne ne peut quitter un groupe tant qu'il doit de l'argent ou qu'on lui en doit, donc celui qui part paie ou est payé, vous l'enregistrez, puis il s'en va. Continuez le groupe pour les colocataires qui restent et invitez la nouvelle personne avec un lien. Quand le logement lui-même est terminé, un admin peut verrouiller le groupe pour que les chiffres ne bougent plus, ou le fermer pour de bon, ce qui le rend inaccessible à tous : ne le faites donc que quand plus personne n'a besoin de l'historique."
exampleAfter: 2
