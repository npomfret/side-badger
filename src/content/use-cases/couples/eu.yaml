featuresHeading: Bikote batek erabiltzen dituen ezaugarriak
faq:
  heading: Galderak
  items:
    - q: 60/40 behin ezar dezakegu dena egiteko?
      a: Ez. Banaketa gastu bakoitzarena da. Ezarri ehunekoak lehenengoan, gero kopiatu hurrengoan eta aldatu desberdina dena. [Gastuak banatzeak](page:feature/split-expenses) hiru banaketa moduak azaltzen ditu.
    - q: Gure bankuarekin lotzen al da?
      a: Ez. Side Badger-ek ez du inoiz zure dirua ukitzen. Elkarri nahi duzuen moduan ordaintzen diozue, eta gero erregistratu, [kitatzeak](page:feature/settle-up) azaltzen duen bezala.
    - q: Beste inork ikus dezake gure taldea?
      a: Kideek bakarrik, eta bikote baten taldeak bi ditu. Gonbidapen-esteka bizi bat erabiltzen duen edonor batu daiteke, beraz partekatu pertsona bakar batekin eta jarri iraungitze labur bat.
    - q: Zer gertatzen da biok fakturaren zati bat ordaindu badugu?
      a: Gastu batek ordaintzaile bakarra du. Erregistratu bi gastu, bat zuetako bakoitzarentzat, eta saldoa berdin ateratzen da.
    - q: Nire bikotekideari ordaintzeko gogoraraziko al dio?
      a: Ez. Ez dago gogorarazpenik, beraz bultza txiki hori zurea izaten jarraitzen du. Behintzat biok zenbaki bera begiratuko duzue.
    - q: Zer gertatzen da kostuak partekatzeari uzten diogunean?
      a: Kitatu saldoa eta erregistratu ordainketa, inork ezer zor ez dezan. Gero administratzaile batek taldea blokea dezake, zenbakiak dauden bezala uzten dituena, edo betiko itxi, denentzat sartezina bihurtzen duena. Itxi bakarrik zuetako inork historiarik behar ez duenean.
