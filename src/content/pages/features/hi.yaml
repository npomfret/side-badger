meta:
  title: "Side Badger क्या करता है और क्या नहीं"
  description: "खर्च बांटना, हिसाब चुकता करना और कई करेंसी, साथ में ग्रुप, सूचियां और पोल। पूरी किट, और उन चीज़ों की ईमानदार सूची जो Side Badger में नहीं हैं।"
h1: "Side Badger क्या करता है"
navLabel: "फीचर्स"
lead: "डिब्बे में जो कुछ है, और जो नहीं है।"
intro: "यह रही पूरी किट। स्प्रेडशीट हमने जान-बूझकर छोड़ दी। लंबा वर्शन देखने के लिए नीचे कोई फीचर चुनें, या बाकी सूची और उन चीज़ों की छोटी सूची पर नज़र डालें जो Side Badger नहीं करता।"
cta:
  heading: "क्या यह वह सब करता है जो आपके ग्रुप को चाहिए?"
  body: "मुफ्त अकाउंट बनाएं और पहले किसी छोटे ग्रुप के साथ आज़माएं।"
cardsHeading: "हर फीचर, विस्तार से"
sections:
  - heading: "रसीद स्कैन"
    body: "रसीद की फोटो लें और Side Badger कुल राशि, तारीख और जगह भर देगा, जिसे आप जांच सकें। रसीद की इमेज Google की AI सेवा पढ़ती है। [रसीद स्कैन कैसे काम करता है](page:feature/receipt-scanning)।"
  - heading: "ग्रुप और अनुमतियां"
    body: "हर घर, ट्रिप या इवेंट के लिए एक ग्रुप बनाएं, जिसमें 50 लोग तक हो सकते हैं। लोगों को लिंक या QR कोड से बुलाएं। बड़े ग्रुप में किसी को व्यूअर बना दें, जो सब कुछ देखता है पर कुछ बदलता नहीं। बारीक शर्तें [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) में हैं।"
  - heading: "सूचियां और पोल"
    body: "साझा खरीदारी की सूची को खरीदारी के बिलों के पास रखें। विला की शॉर्टलिस्ट पर वोट कराएं, चाहें तो गुमनाम रूप से। [साथ मिलकर प्लान करें](page:feature/plan-together) में कमेंट, सवाल, सूचियां और पोल की बात है।"
  - heading: "बाकी सब कुछ"
    items:
      - "**लाइव अपडेट:** खर्च जोड़ते ही सबको वह तुरंत दिख जाता है।"
      - "**भाषाएं:** Side Badger को 39 भाषाओं में इस्तेमाल करें। ग्रुप का हर सदस्य अपनी भाषा चुन सकता है।"
      - "**होम स्क्रीन:** ऐप स्टोर की ज़रूरत नहीं। साइन इन करें, फिर Side Badger को अपनी होम स्क्रीन में जोड़ें और वह ऐप की तरह खुलता है। ऐप की सेटिंग्स में बताया गया है कि कैसे। [वेब ऐप के बारे में और जानें](page:feature/web-app)।"
      - "**सूचनाएं:** सेटिंग्स में पुश सूचनाएं चालू करें, ताकि आपके ग्रुप में नई गतिविधि होने पर आपको सूचना मिले। iPhone और iPad पर पहले Side Badger को अपनी होम स्क्रीन में जोड़ें।"
      - "**फीडबैक:** कोई बग मिला? ऐप के अंदर से हमें बताएं और हमारा जवाब वहीं देखें।"
  - heading: "Side Badger क्या नहीं करता"
    items:
      - "**पैसे भेजना।** Side Badger आपके पैसों को कभी हाथ नहीं लगाता। जैसे चाहें एक-दूसरे को पेमेंट करें। पेमेंट रिक्वेस्ट की योजना है।"
      - "**बिल दोहराना।** दोहराए जाने वाले खर्च नहीं हैं। पिछले महीने का बिल दो टैप में कॉपी करें।"
      - "**आइटम के हिसाब से बांटना।** हर खर्च का एक ही पेमेंट करने वाला। बराबर, सटीक राशि या प्रतिशत से बांटें।"
      - "**नेटिव ऐप देना।** यह आपके ब्राउज़र में चलता है। साइन इन करें, फिर इसे अपनी होम स्क्रीन में जोड़ें।"
      - "**ऑफलाइन चलना।** इसे कनेक्शन चाहिए।"
      - "**ईमेल या टेक्स्ट से अलर्ट भेजना।** नई गतिविधि ऐप में दिखती है, और पुश सूचनाएं चालू करने पर आपके डिवाइस पर भी।"
      - "**चार्ट या बजट बनाना।** यह हिसाब रखता है कि किसे किसका देना है, और पूरी तरकीब बस यही है।"
      - "**Google या Apple से साइन इन।** ईमेल से साइन अप करें। Google और Apple साइन-इन की योजना है।"
      - "**बिना अकाउंट के लोगों को अंदर आने देना।** ग्रुप में सबको एक मुफ्त अकाउंट चाहिए।"
faq:
  heading: "सवाल"
  items:
    - q: "क्या मैं Side Badger से पेमेंट कर सकता हूँ?"
      a: "नहीं। Side Badger हिसाब रखता है और आपके पैसों को कभी हाथ नहीं लगाता। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर पेमेंट रिकॉर्ड करें।"
    - q: "क्या मोबाइल ऐप है?"
      a: "ऐप स्टोर में नहीं। Side Badger आपके ब्राउज़र में चलता है। अपने फ़ोन पर साइन इन करें, फिर इसे अपनी होम स्क्रीन में जोड़ें ताकि यह ऐप की तरह खुले। ऐप की सेटिंग्स में बताया गया है कि कैसे।"
    - q: "क्या मैं आइटम के हिसाब से बांट सकता हूँ?"
      a: "नहीं। हर खर्च में एक ही पेमेंट करने वाला होता है, और आप उसे बराबर, सटीक राशि या प्रतिशत से बांटते हैं।"
    - q: "क्या यह ऑफलाइन चलता है?"
      a: "नहीं, इसे कनेक्शन चाहिए।"
    - q: "क्या ग्रुप में सबको अकाउंट चाहिए?"
      a: "हाँ। ग्रुप में सबको एक मुफ्त अकाउंट चाहिए, और साइन अप के लिए बस एक ईमेल पता काफी है।"
