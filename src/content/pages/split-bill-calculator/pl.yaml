faq:
  heading: "Pytania"
  items:
    - q: "Czy kalkulator jest darmowy?"
      a: "Tak. Za darmo. Bez reklam. Bez dziennych limitów. Konto też nie jest potrzebne."
    - q: "Czy zapisuje to, co wpiszę?"
      a: "Nie. Nic nie jest nigdzie zapisywane ani wysyłane. Żeby zachować liczby, użyj „Kopiuj link” i zapisz link w jakimś miejscu."
    - q: "Kto może zobaczyć skopiowany przeze mnie link?"
      a: "Każdy, kto go ma. Liczby są w samym linku, po znaku #, więc udostępniaj go tylko osobom, które powinny je zobaczyć."
    - q: "Czy przesyła pieniądze?"
      a: "Nie. Wylicza, kto komu powinien zapłacić, a płacicie sobie, jak chcecie. Side Badger też nigdy nie dotyka twoich pieniędzy. Zobacz [rozliczanie](page:feature/settle-up)."
    - q: "Czy mogę podzielić wyjazd opłacany w dwóch walutach?"
      a: "Tutaj nie, bo obliczenie ma jedną walutę. W grupie każda waluta ma własne saldo. Zobacz [wiele walut](page:feature/multiple-currencies)."
    - q: "Co, jeśli kwoty się nie zgadzają?"
      a: "Kalkulator mówi o tym pod wydatkiem i nie pokazuje wyniku, dopóki się nie zgodzą. Dokładne kwoty muszą dawać w sumie kwotę wydatku, a procenty muszą dawać 100."
