faq:
  heading: "سوالات"
  items:
    - q: "کیا ہمیں مجموعی تنخواہ لینی چاہیے یا ہاتھ میں آنے والی؟"
      a: "گروپ طے کرتا ہے۔ ہاتھ میں آنے والی عام ہے، کیونکہ وہی رقم ہے جو آپ کے پاس واقعی خرچ کرنے کو ہوتی ہے۔ مجموعی تنخواہ اس بات کو نظرانداز کرتی ہے کہ ٹیکس، پنشن کی کٹوتیاں اور قرض کی ادائیگیاں مختلف تنخواہوں سے مختلف رقم نکالتی ہیں۔ جو بھی چنیں، دونوں کے لیے ایک ہی پیمانہ استعمال کریں۔"
    - q: "کیا Side Badger ہماری آمدنی دیکھتا ہے؟"
      a: "نہیں۔ آپ صرف فیصد درج کرتے ہیں، تنخواہیں کبھی نہیں۔ فیصد گروپ کے ارکان کو نظر آتے ہیں، اور جوڑے کے لیے وہ آپ دونوں ہیں۔"
    - q: "کیا ہم 62/38 ایک بار سب کے لیے طے کر سکتے ہیں؟"
      a: "تقسیم ہر خرچے پر طے ہوتی ہے، گروپ پر نہیں۔ ایسا خرچہ کاپی کریں جس میں پہلے سے 62 اور 38 ہوں، پھر جو مختلف ہو اسے بدلیں۔ [اخراجات کی تقسیم](page:feature/split-expenses) دوسرے اختیارات بتاتا ہے۔"
