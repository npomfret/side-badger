sections:
  - heading: 整个群组用一种货币
    body: 如果你的群组不想为此费心，可以选一种群组货币，表单会按你仍能看到并能修改的汇率，把每笔新支出换算成它。这只适用于新建和复制的支出。编辑和已有的支出保持原样，所以已经记录的内容不会在你不知情时改变。
  - heading: 欠的是欧元，付的是英镑
    body: 用日元付的款，却想用英镑结算？没问题。记录付款时同样可以换算，所以欠欧元的人可以用英镑付款，欧元余额仍然算得对。你们想怎么付就怎么付，然后记录下来。
  - heading: 群组的规则
    body: 把群组限制在你们实际使用的货币上，再设一个默认货币，让表单打开就是正确的那个。去葡萄牙度假，晚餐账单旁边用不着另外 139 个选项，而[海外婚礼](page:use-case/events-and-celebrations)大概需要两个。
limits:
  heading: 限制
  items:
    - 汇率在保存支出时固定。旧的支出永远不会重新估值。
    - Side Badger 会尽可能获取当前汇率。并非每一对货币都保证有汇率，你随时可以自己输入汇率。
    - 群组自动换算只适用于新建和复制的支出，不适用于编辑或已有的支出。
    - 每笔支出以其自身货币计，上限为 999,999.99。
    - 共有 140 种货币。加密货币和金属不在其中。
    - Side Badger 只记录付款，从不转移或兑换资金。
useCasesHeading: 它在哪些场合有帮助
faq:
  heading: 常见问题
  items:
    - q: 你们用哪个汇率？
      a: 录入支出时获取的当前汇率（有汇率可用的情况下）。你可以把它改成你实际换到的汇率，换算后的金额会随之更新。
    - q: 旧的支出会重新估值吗？
      a: 不会。汇率在保存支出时固定，所以余额不会因为市场变动而漂移。
    - q: 支持加密货币吗？
      a: 不支持。共有 140 种货币，加密货币不在其中。
    - q: 为什么我不能输入 2,000,000 印尼盾？
      a: 每笔支出以其自身货币计，上限为 999,999.99。可以改用另一种货币录入再换算，或者拆成两笔支出。
    - q: 换算要花钱吗？
      a: 不要。换算和 Side Badger 的其他部分一样免费。参见[定价](page:pricing)。
    - q: 我必须换算吗？
      a: 不必。除非你或你的群组选择换算，否则各货币保持分开，每种货币都有自己的一份简短付款清单。
