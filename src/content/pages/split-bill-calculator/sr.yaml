meta:
  title: "Калкулатор поделе рачуна: ко коме дугује | Side Badger"
  description: "Ко је платио, ко дугује, ко коме плаћа: решено за пар секунди. Дели једнако, тачно или по процентима. Бесплатно, у прегледачу, без чувања и слања."
h1: "Калкулатор поделе рачуна"
navLabel: "Калкулатор поделе рачуна"
lead: "Унеси ко је шта платио, а калкулатор каже ко коме дугује, уз кратак списак уплата за поравнање. Ради у твом прегледачу, ништа не чува и не премешта новац. Ако твојој групи треба да рачуница преживи затворену картицу, [подела трошкова](page:feature/split-expenses) и [поравнање](page:feature/settle-up) у Side Badger-у раде исте рачуне и чувају их."
cta:
  heading: "Допадају ти се рачуни? Сачувај их."
  body: "Овај калкулатор заборавља све кад затвориш картицу, баш као онај ко је сигурно платио прошли пут. Side Badger група чува трошкове, ажурира стање свима и бележи уплате. Бесплатно је, без огласа и без дневних ограничења."
sections:
  - heading: "Како ради обрачун"
    body: "За сваки трошак калкулатор рачуна удео сваке особе. Можеш га поделити једнако, по тачним износима или по процентима, између особа које изабереш. Стање сваке особе је затим оно што је платила минус оно што дугује. Плус значи да група дугује њој, а минус да она дугује групи. Стања увек дају нулу, јер колико год је некоме дужно, толико други дугују."
  - heading: "Зашто је списак уплата кратак"
    body: "Нико не мора да поравнава сваки рачун посебно. Кад су позната сва стања, калкулатор упари особу која највише дугује са особом којој се највише дугује, поравна колико једна уплата може и наставља низ списак док сви не буду на нули. Никад му није потребно више уплата него што има људи са стањем, минус један, а често му треба мање него кад се поравнава рачун по рачун. Даје кратак списак уплата и не обећава да је то најкраћи могући."
  - heading: "Шта калкулатор не ради"
    items:
      - "**Не ради са више валута.** Изабери једну и користи је за цео обрачун. Апликација води посебно стање за сваку валуту и може претворити трошак по актуелном девизном курсу, који можеш променити."
      - "**Не чува ништа.** Затвориш картицу и бројеви нестану. Да их сачуваш, копирај везу. Она садржи твоје бројеве иза знака #, који твој прегледач никад не шаље серверу, а свако коме је пошаљеш може их прочитати."
      - "**Не премешта новац.** Каже ко коме треба да плати. Платите једни другима како год желите, а затим забележи уплату у апликацији ако ваша група тамо води рачуницу."
      - "**Не бира преостали цент насумично.** Кад се рачун не дели без остатка, преостали центи иду првим особама на списку, па збирови и даље излазе тачно. У апликацији преостали цент иде једној особи насумично, па то није увек иста особа."
      - "**Не прелази ограничења.** Калкулатор прихвата од 2 до 20 људи, а један трошак може износити до 999.999,99, као у апликацији."
exampleAfter: 2
