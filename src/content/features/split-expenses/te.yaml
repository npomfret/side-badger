meta:
  title: "ఖర్చులను సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచండి | Side Badger"
  description: "ఉమ్మడి ఖర్చును సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచండి, అక్కడ లేనివాళ్లను వదిలేయండి. ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
h1: "ఖర్చులను సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచండి"
navLabel: "ఖర్చుల పంపకం"
lead: "ప్రతిదీ 50/50 కాదు. Side Badger దాన్ని సంభాళిస్తుంది. ఎవరు చెల్లించారో చెప్పండి, ఖర్చును పంచుకున్న వాళ్లను ఎంచుకోండి, దాన్ని **సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో** పంచండి. పగలు విడిగా అమ్ముతారు."
cta:
  heading: "తర్వాతి ఖర్చును సరిగ్గా పంచండి"
  body: "ఉచిత ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, ఇన్నాళ్లు తేల్చాలనుకుంటున్న ఖర్చును జోడించండి. తర్వాత ఏమవుతుందో తెలియదా? [ఎలా పనిచేస్తుంది](page:how-it-works) చూడండి, లేదా [ఉచితంగా ఏం వస్తుందో](page:pricing) చూడండి."
  button: "ఉచిత ఖాతా తెరవండి"
problem:
  heading: "ప్రతిదీ 50/50 కాదు"
  body: "అద్దె గది పరిమాణాన్ని బట్టి ఉంటుంది. బహుమతి ఎవరు ఏం మాట ఇచ్చారో బట్టి ఉంటుంది. డిన్నర్ డెజర్ట్ వరకు ఎవరు ఉన్నారో బట్టి ఉంటుంది. బిల్లును సగం చేయడం, సగం కాని మొదటి బిల్లు వచ్చే వరకే పనిచేస్తుంది, ఆ తర్వాత ఎవరో స్ప్రెడ్‌షీట్ తెరుస్తారు. Side Badger ఎవరు చెల్లించారో, ఎవరు ఖర్చును పంచుకున్నారో, అది ఎలా విడిపోతుందో నమోదు చేస్తుంది, దాంతో బ్యాలెన్స్‌లు సరిగ్గా వస్తాయి, టేబుల్ దగ్గర ఎవరూ భాగహారం చేయాల్సిన పనిలేదు."
workflow:
  heading: "ఖర్చు జోడించడం, మొదటి నుండి చివరి వరకు"
  steps:
    - title: "ఎవరు చెల్లించారో, దేనికో చెప్పండి"
      body: "మొత్తం, చిన్న వివరణ, చెల్లించిన వ్యక్తిని నమోదు చేయండి. ప్రతి ఖర్చును ఒక్కరే చెల్లిస్తారు, దానివల్ల లెక్క నిజాయితీగా ఉంటుంది."
      shot: S05
      shotAlt: "ముగ్గురి మధ్య కాటేజ్ అద్దెను శాతంతో పంచిన ఖర్చు ఫారం"
    - title: "పంపకం ఎంచుకోండి"
      body: "సమానం, ఖచ్చితమైన మొత్తాలు లేదా శాతాలు ఎంచుకోండి. శాతాల మొత్తం 100 కావాలి, ఖచ్చితమైన మొత్తాలు కలిపితే మొత్తం ఖర్చు రావాలి."
      shot: S06
      shotAlt: "బహుమతికి ప్రతి వ్యక్తికి ఖచ్చితమైన మొత్తాలు నమోదు చేసిన ఖర్చు ఫారం"
    - title: "కథను కూడా జోడించండి"
      body: "తేదీ పెట్టండి, లేబుళ్లు, చోటు, నోట్ జోడించండి. గ్రూప్‌లో అందరికీ ఒకే వివరాలు కనిపిస్తాయి, అక్కడే కామెంట్ చేయవచ్చు."
      shot: S08
      shotAlt: "వివరాలు, కామెంట్ థ్రెడ్, నమోదు చేసిన అసలు మొత్తంతో ఒక ఖర్చు"
    - title: "ఏదైనా తేడాగా అనిపిస్తే ప్రశ్న లేవనెత్తండి"
      body: "గ్రూప్ ఖర్చు ప్రశ్నలను ఆన్ చేసి ఉంటే, ఖర్చులో ఉన్న ఎవరైనా దానిపై ప్రశ్న లేవనెత్తవచ్చు, ఖర్చుల జాబితాలో ప్రశ్న లేవనెత్తిన వాటిని మాత్రమే చూపవచ్చు."
      shot: S18
      shotAlt: "ప్రశ్న లేవనెత్తిన బ్యాడ్జ్, ప్రశ్న లేవనెత్తినవి మాత్రమే ఫిల్టర్‌తో ఖర్చుల జాబితా"
options:
  heading: "పంచడానికి మూడు పద్ధతులు"
  items:
    - title: "సమానంగా"
      body: "డిన్నర్లు, ట్యాక్సీలు, అందరూ సమానంగా పంచుకున్న ప్రతిదానికీ డిఫాల్ట్. మొత్తం సరిగ్గా భాగం కాకపోతే, మిగిలిన పైసా యాదృచ్ఛికంగా ఒకరికి వెళ్తుంది, ఎప్పుడూ ఒకరికే కాదు. కింద ఉన్న ట్యాక్సీలో అది Ana."
    - title: "ఖచ్చితమైన మొత్తాలతో"
      body: "ప్రతి వ్యక్తి ఎంత ఇవ్వాలో టైప్ చేయండి. అందరూ వేర్వేరు ధర ఎంచుకున్న బహుమతికి, లేదా ఒకరి ట్రాలీలో ఉమ్మడి సరుకుల కంటే ఎక్కువ ఉన్న షాపుకు మంచిది. మొత్తాలు కలిపితే మొత్తం ఖర్చు రావాలి."
    - title: "శాతంతో"
      body: "ప్రతి వ్యక్తికి మొత్తంలో ఒక వాటా ఇవ్వండి. గది పరిమాణం ప్రకారం అద్దె దీనికి క్లాసిక్ ఉదాహరణ, అతిపెద్ద గది అతిపెద్ద వాటా ఇస్తుంది, అలా కాదని ఎవరూ నటించరు."
example:
  heading: "ఒక కాటేజ్ వారాంతం, నాలుగు ఖర్చులు, మూడు పంపకాలు"
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: "గది పరిమాణం ప్రకారం కాటేజ్"
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: "డిన్నర్"
      payer: ben
      amount: 84
      split:
        method: equal
    - label: "సరుకులు"
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: "ఇంటికి తిరిగొచ్చే ట్యాక్సీ"
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: "అక్కడ ఉన్నవాళ్లు మాత్రమే"
    body: "ఖర్చును అందరి మధ్య పంచండి, లేదా దాన్ని పంచుకున్న వాళ్ల మధ్య మాత్రమే. భాగం కాని ఖర్చుల నుండి వాళ్లను వదిలేయండి, బ్యాలెన్స్‌లు అదే చూపుతాయి. వారమంతా ఊళ్లో లేని రూమ్‌మేట్ టేకవే డబ్బు ఇవ్వడు, దీన్ని [రూమ్‌మేట్లు](page:use-case/housemates) ప్రాథమిక న్యాయంగా గుర్తిస్తారు."
  - heading: "తర్వాతి వాదనలు తప్పించే వివరాలు"
    items:
      - "**తేదీ**, కావాలంటే సమయం పెట్టండి. ఈరోజు, నిన్న, ఈ ఉదయం, గత రాత్రి లాంటి షార్ట్‌కట్‌లు కొంత టైపింగ్ తప్పిస్తాయి."
      - "ఖర్చులను సమూహపరచడానికి మూడు వరకు **లేబుళ్లు** జోడించండి, సరుకులు లేదా ప్రయాణం లాంటివి."
      - "**చోటు** జోడించండి. మ్యాప్ లింక్ పేస్ట్ చేస్తే చోటు పేరు తనంతట తానే నిండుతుంది."
      - "అంకె వెనుక కథ కోసం **నోట్** జోడించండి, కథకు అవసరమైతే కొంత ఫార్మాటింగ్‌తో."
      - "సంభాషణను ఎవరూ వెనక్కి స్క్రోల్ చేయని చాట్ థ్రెడ్‌లో కాకుండా, అది దేని గురించో ఆ ఖర్చు పక్కనే ఉంచడానికి **కామెంట్‌లు** వాడండి."
  - heading: "కాపీ చేయండి, మార్చండి, ఏం మారిందో చూడండి"
    body: "గత నెల అద్దెను మళ్లీ టైప్ చేయకుండా కాపీ చేసి, తేడా ఉన్నదాన్ని మార్చండి. ఏదైనా అంకె తప్పయితే ఖర్చును సవరించండి. పాత వెర్షన్ ఉంచబడుతుంది, సవరణ గ్రూప్ కార్యకలాపంలో కనిపిస్తుంది, కాబట్టి ఎవరూ చప్పుడు లేకుండా అంకెను మార్చలేరు. ఎవరు ఏం సవరించవచ్చో గ్రూప్ అనుమతులపై ఆధారపడి ఉంటుంది."
  - heading: "ఏదైనా తప్పుగా అనిపించినప్పుడు"
    body: "గ్రూప్ ఖర్చు ప్రశ్నలను ఆన్ చేయవచ్చు. ఖర్చులో ఉన్న ఎవరైనా ప్రశ్న లేవనెత్తి కారణం చెప్పవచ్చు, ప్రశ్న అడిగిన వ్యక్తి లేదా ఒక అడ్మిన్ దాన్ని మూసివేసే వరకు ఆ ఖర్చు బ్యాలెన్స్‌ల నుండి బయటే ఉంటుంది. ఇది డిఫాల్ట్‌గా ఆఫ్‌లో ఉంటుంది, గ్రూప్ కోసం అడ్మిన్ దాన్ని ఆన్ చేస్తారు. ఎవరికీ గుర్తులేని డిపాజిట్ అకస్మాత్తుగా అందరి వ్యవహారం అయ్యే [ఈవెంట్లు, వేడుకలకు](page:use-case/events-and-celebrations) ఇది సరిపోతుంది."
limits:
  heading: "పరిమితులు"
  items:
    - "ప్రతి ఖర్చును ఒక్కరే చెల్లిస్తారు. ఇద్దరు చెల్లిస్తే రెండు ఖర్చులు నమోదు చేయండి."
    - "అంశాల వారీ పంపకం లేదు, వాటాల వారీ పంపకం లేదు. సమానం, ఖచ్చితమైన మొత్తాలు, శాతాలు మాత్రమే ఉన్నాయి."
    - "శాతాల మొత్తం 100 కావాలి."
    - "ఒక ఖర్చు దాని సొంత కరెన్సీలో 999,999.99 వరకు ఉండవచ్చు, ఆ కరెన్సీ సాధారణ దశాంశ స్థానాలతో."
    - "ఖర్చులు తమంతట తాము పునరావృతం కావు. బదులుగా గత నెలది కాపీ చేయండి."
    - "తేదీలు భవిష్యత్తులో లేదా 10 ఏళ్ల కంటే పాతవిగా ఉండకూడదు."
    - "గ్రూప్ వదిలి వెళ్లిన వ్యక్తి ఉన్న ఖర్చు చదవడానికి మాత్రమే అవుతుంది."
useCasesHeading: "ఇలా పంచడం ఎక్కడ ఉపయోగపడుతుంది"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "ఇద్దరు ఒకే ఖర్చు చెల్లించవచ్చా?"
      a: "ఒక ఖర్చులో కాదు. ప్రతి చెల్లింపుదారుకు ఒకటి చొప్పున రెండు నమోదు చేయండి, బ్యాలెన్స్‌లు అవే వస్తాయి."
    - q: "రసీదును అంశాల వారీగా పంచవచ్చా?"
      a: "లేదు. పంపకం సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో ఉంటుంది. వేర్వేరు అంశాలున్న బిల్లుకు, ప్రతి వ్యక్తి ఇవ్వాల్సినదాన్ని ఖచ్చితమైన మొత్తాలుగా నమోదు చేయండి."
    - q: "డిఫాల్ట్ పంపకం సెట్ చేయవచ్చా?"
      a: "లేదు. పాత ఖర్చును కాపీ చేసి దాని పంపకాన్ని మళ్లీ వాడండి, తేడా ఉన్నదాన్ని మార్చండి."
    - q: "బిల్లులు ప్రతి నెలా పునరావృతం కావచ్చా?"
      a: "లేదు. బదులుగా గత నెల ఖర్చును కాపీ చేయండి, కొన్ని సెకన్లు పడుతుంది."
    - q: "ఖర్చును ఎవరు సవరించవచ్చు?"
      a: "గ్రూప్ అనుమతులు ఎవరికి అనుమతిస్తే వాళ్లు. ప్రతి సవరణ గ్రూప్ కార్యకలాపంలో కనిపిస్తుంది, కాబట్టి మార్పులు ఎప్పుడూ చప్పుడు లేకుండా జరగవు."
    - q: "ఆ తర్వాత బ్యాలెన్స్‌లకు ఏమవుతుంది?"
      a: "ఖర్చులు వచ్చేకొద్దీ అవి అప్‌డేట్ అవుతాయి, [లెక్క తేల్చడం](page:feature/settle-up) వాటిని పేమెంట్ల చిన్న జాబితాగా మారుస్తుంది. ఖర్చు మరో కరెన్సీలో ఉంటే, [అనేక కరెన్సీలు](page:feature/multiple-currencies) చూడండి."
