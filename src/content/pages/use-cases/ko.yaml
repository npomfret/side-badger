meta:
  title: "룸메이트, 여행, 파티를 위한 사이드 배저"
  description: "룸메이트, 그룹 여행, 파티, 결혼식, 단체 선물 비용을 나눠 보세요. 그룹 유형마다 사이드 배저가 어떻게 도와주는지 확인하세요."
h1: "우리 그룹에 맞는 사이드 배저"
navLabel: "활용 사례"
lead: "룸메이트, 휴가, 파티. 우리 상황을 고르고, 비슷한 그룹이 어떻게 정산하는지 보세요."
intro: "그룹마다 비용을 나누는 방식이 조금씩 달라요. 이 페이지들은 첫 지출부터 마지막 결제 기록까지 **현실적인 시나리오**를 계산 과정과 함께 따라가므로, 우리 그룹이 어떤 결과를 얻을지 미리 볼 수 있습니다."
cta:
  heading: "우리 그룹과 맞는 사례를 찾으셨나요?"
  body: "계정을 만들고, 그룹을 시작하고, 첫 지출을 추가하세요. 몇 분이면 됩니다."
cardsHeading: "우리와 가장 비슷한 상황을 고르세요"
sections:
  - heading: "그룹 여행"
    body: "파운드로 산 항공권, 유로로 낸 빌라, 세 사람만 먹은 저녁. 그룹이 파운드로 환산하도록 설정하면 리스본의 네 친구는 통화를 따로 둘 때의 6건 대신 3건의 결제로 끝납니다. [그룹 여행 비용 나누기](page:use-case/group-trips)."
  - heading: "룸메이트"
    body: "한 명은 집주인에게 월세를 내고, 다른 한 명은 전기 요금을 기억하고, 화장지를 누가 샀는지는 아무도 동의하지 않아요. 월세는 방 크기에 따라, 나머지 공과금은 똑같이 나누면 룸메이트 네 명은 이번 달을 결제 3건으로 마치고, 모두 월세를 낸 사람에게 보냅니다. [룸메이트와 생활비 나누기](page:use-case/housemates)."
  - heading: "파티, 결혼식, 단체 선물"
    body: "여섯 명이 선물에 투표하고, 한 명이 사고, 모두가 같은 금액을 내지는 않아요. 정확한 금액으로 나눈 £150짜리 선물은 선물을 산 사람에게 가는 결제 5건, 총 £120으로 정리됩니다. [행사 비용 나누기](page:use-case/events-and-celebrations)."
  - heading: "커플"
    body: "지루한 생활비를 나누되, 데이트 날이 분기별 재무 점검이 되지 않게 하세요. 월세를 60/40으로, 장보기를 똑같이 나누면 둘 사이에 결제 한 건으로 정리됩니다. [커플끼리 비용 나누기](page:use-case/couples)."
  - heading: "먼저 사용 방법 보기"
    body: "위의 모든 예시는 그룹 만들기부터 결제 기록까지 같은 단계를 따릅니다. [사용 방법](page:how-it-works)에서 단계를 살펴보고, [가이드](page:guides)에서 까다로운 상황을 하나씩 풀어 보고, [가격](page:pricing)에서 비용을 확인하세요. 비용은 없고, 광고도 일일 한도도 없습니다."
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "그룹의 모든 사람에게 계정이 필요한가요?"
      a: "네. 링크나 QR 코드와 무료 계정으로 참여합니다."
    - q: "사이드 배저가 돈을 걷어 주나요?"
      a: "아니요. 원하는 방법으로 지불한 다음, 잔액이 맞도록 결제를 기록하세요."
    - q: "그룹 유형을 하나만 골라야 하나요?"
      a: "아니요. 활용 사례는 설정이 아니라 예시입니다. 모든 그룹이 같은 기능을 갖고 있으니 상황에 맞게 조합해서 쓰세요."
