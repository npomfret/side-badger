meta:
  title: Jaa kulut 140 valuutassa, muunnettuna tai erillään
  description: Syötä jokainen kulu valuutalla, jolla maksoit, pidä saldot erillään tai muunna kurssilla, jonka näet ja voit muuttaa, ja tasaa sitten tilit lyhyellä maksulistalla.
h1: Jaa kulut 140 valuutassa
navLabel: Useita valuuttoja
lead: Euroja, jenejä ja se yksi taksi bahteina. Side Badger ottaa jokaisen kulun siinä valuutassa, jolla maksoit, pitää saldot järjestyksessä ja voi muuntaa, kun ryhmä haluaa tasata kerralla. Se toimii 140 valuutassa ja sopii luontevasti [ryhmämatkoille](page:use-case/group-trips).
cta:
  heading: Tuo eurosi, tuo jenisi
  body: Luo tili, perusta ryhmä ja lisää ensimmäinen kulu missä valuutassa tahansa, joka sattui olemaan kädessä.
  button: Luo ilmainen tili
problem:
  heading: Syötä se niin kuin maksoit
  body: Matka maksetaan harvoin yhdellä valuutalla. Hotelli varattiin kotoa punnilla, illallinen maksettiin jeneillä ja lentokentän kahvi millä tahansa, mitä välilaskussa käytettiin. Kaiken muuntaminen käsin ennen kuin voit edes syöttää sitä on se, mihin taulukot kuolevat. Side Badgerissa syötät jokaisen kulun kuitin valuutalla, ja jokainen summa noudattaa valuuttansa sääntöjä, joten jeneillä ei ole desimaaleja ja dinaareilla on kolme. Viimeksi käyttämäsi valuutat tulevat listassa ensin.
workflow:
  heading: Pidä valuutat erillään tai muunna matkan varrella
  steps:
    - title: Lisää kulu sen omassa valuutassa
      body: Valitse valuutta, kirjoita summa, kerro kuka maksoi ja ketkä jakoivat. Muuta ei tarvita. Tämä on oletus, ja se säilyttää alkuperäisen summan täsmälleen sellaisena kuin syötit sen.
      shot: S07
      shotAlt: Kululomake, johon on syötetty summa jeneinä
    - title: Seuraa saldoa jokaiselle valuutalle
      body: Saldot pidetään erikseen valuutoittain, ja jokaisella on oma lyhyt maksulistansa. Punnat tasataan punnilla ja jenit jeneillä.
      shot: S10
      shotAlt: Saldonäkymä, jossa yksinkertaistetut velat kahdessa valuutassa
    - title: Tai muunna, kun ryhmä haluaa tasata kerralla
      body: Valitse toinen valuutta kulua syöttäessäsi, niin Side Badger voi muuntaa sen nykyisellä valuuttakurssilla, jonka voit vaihtaa kurssiin, jonka todella sait. Muunnettu summa liittyy kyseisen valuutan saldoon. Muunnos on ryhmän valinta, ei koskaan mitään, mikä tapahtuu selkäsi takana.
options:
  heading: Kurssi, jonka näet ja voit muuttaa
  items:
    - title: Kurssi näytetään
      body: Kun muunnat, kurssi ja muunnettu summa näkyvät lomakkeella, joten kenenkään ei tarvitse luottaa lukuun sokeasti.
    - title: Kirjoita oma
      body: Saitko vaihtopisteessä paremman kurssin tai lentokentällä huonomman? Muokkaa kurssi sellaiseksi kuin sait, niin muunnettu summa päivittyy.
    - title: Alkuperäinen säilyy
      body: Alkuperäinen summa säilyy kulussa muunnetun vieressä sille, joka kysyy, mitä se oli jeneinä.
    - title: Muunnos on ilmainen
      body: Muuntaminen ei maksa mitään. Kulun syöttämisestä toisessa valuutassa ei peritä maksua.
