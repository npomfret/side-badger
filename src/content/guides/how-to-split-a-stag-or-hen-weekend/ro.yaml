meta:
  title: "Cum împarți un weekend de burlaci sau burlăcițe | Side Badger"
  description: "Invitatul de onoare nu plătește nimic, iar luni încă vă vorbiți. Cum împarți un weekend de burlaci sau burlăcițe, cu socotelile incluse."
h1: "Cum împarți costul unui weekend de burlaci sau burlăcițe"
navLabel: "Weekend de burlaci/burlăcițe"
lead: "Invitatul de onoare nu plătește nimic, așa că restul grupului împarte fiecare cost [egal](page:feature/split-expenses) între ei. Exclude oamenii din costurile la care au renunțat și ține invitatul de onoare în afara grupului, ca surpriza să reziste."
cta:
  heading: "Ține socoteala, păstrează surpriza"
  body: "Fă un grup, trimite linkul tuturor, în afară de invitatul de onoare, și adaugă fiecare cost pe măsură ce apare. Side Badger este gratuit, fără reclame și fără limite zilnice."
sections:
  - heading: "Patru prieteni și o surpriză"
    body: "Hannah, Isla, Jess și Kat o duc pe Grace la weekendul ei de burlăcițe. Grace e invitata de onoare, deci nu plătește nimic. Nici nu e în grup, așa că nu poate vedea cât cheltuiesc prietenele pe ea. Hannah rezervă cabana, Isla plătește ziua la spa, Jess cina, iar Kat taxiul. Până duminică fiecare a plătit ceva și nimeni nu mai poate spune cine e în avantaj. Calculele sunt aceleași pentru un weekend de burlaci sau de burlăcițe, oricine ar fi invitatul de onoare."
  - heading: "Împarte la cei care plătesc, nu la cei care sunt de față"
    body: "Partea invitatului de onoare nu dispare. Se împarte. Cabana costă 720 £ și o plătesc patru prieteni, deci sunt 180 £ de fiecare, iar locul lui Grace e deja în cifra aceea. Cina costă 260 £, deci 65 £ de fiecare. Taxiul costă 44 £, deci 11 £ de fiecare. Cine sare peste ceva iese doar din acea cheltuială. Kat sare peste spa, așa că cei 360 £, care acoperă și locul lui Grace, se împart între Hannah, Isla și Jess, câte 120 £. Adună totul și Hannah, Isla și Jess datorează fiecare 376 £ din weekend, iar Kat datorează 256 £."
  - heading: "Configurează în Side Badger"
    items:
      - "Fă un grup pentru weekend și dă-i un nume plictisitor, de exemplu Weekend la cabană. Grace nu e membră, iar grupul îl pot vedea doar membrii lui."
      - "Alege **Invită pe alții** și trimite linkul sau arată codul QR doar acolo unde Grace nu le va vedea. Linkul arată o previzualizare a grupului înainte să se alăture cineva. Alege cât durează, de la 15 minute la 5 zile. Un link vechi funcționează până expiră, așa că nu-l lăsa mai mult decât ai nevoie."
      - "Pentru fiecare cost alege **Adaugă Cheltuială**, introdu suma și alege plătitorul la **Cine a plătit?** La **Împarte între** bifează oamenii care plătesc, lăsându-i deoparte pe cei care au sărit peste, cum e Kat la spa. La **Cum se împarte** alege **Egal**."
      - "Când ajungeți acasă, deschide **Solduri** în grup. Side Badger arată cine cui datorează și sugerează o listă scurtă de plăți. Aici sunt trei: Kat îi plătește lui Hannah 212 £, Jess îi plătește lui Hannah 116 £, iar Isla îi plătește lui Hannah 16 £. Plătiți-vă unii altora cum preferați, apoi folosiți **Decontează** ca să înregistrați fiecare plată."
  - heading: "Înainte să rezervi: un buget și un avans"
    body: "Stabiliți bugetul înainte să rezerve cineva. Alege **Adaugă Sondaj**, întreabă cât va cheltui grupul pe cabană și oferă câteva sume ca variante. Activează **Vot anonim** când îl creezi, ca să ascunzi cine a votat pentru ce, astfel încât nimeni să nu fie nevoit să apere cu voce tare un buget mai mic. Închide sondajul după ce au votat toți și apare câștigătorul. Apoi vine avansul. Cine rezervă îl plătește și îl adaugă ca o cheltuială, împărțită egal, iar restul de plată intră ca a doua cheltuială când scade. Ceilalți își pot trimite partea imediat și pot înregistra plata sau pot aștepta socoteala finală. Soldurile ies la fel în ambele cazuri."
  - heading: "Când cineva vine doar pentru o noapte"
    body: "Un prieten care apare doar sâmbătă nu ar trebui să plătească pentru vineri. Lasă-l în afara costurilor la care n-a participat. Unde costul depinde de cât stă fiecare, de exemplu o cameră, alege **Sume exacte** la **Cum se împarte** și scrie partea fiecăruia, care trebuie să dea împreună totalul. Calculează mai întâi un preț pe persoană pe noapte, apoi înmulțește-l cu nopțile în care stă fiecare. Pagina [excursii de grup](page:use-case/group-trips) are mai multe despre costurile care nu sunt la fel pentru toți."
  - heading: "Ce nu face Side Badger aici"
    items:
      - "Nu mută niciodată bani. Vă plătiți prin transfer bancar, numerar sau cum se potrivește, apoi înregistrați plata, ca soldurile să se actualizeze pentru toți."
      - "Nu trimite mementouri de plată. Un îndemn prietenesc în chatul grupului rămâne treaba unui om."
      - "Fiecare cheltuială are un singur plătitor, iar Side Badger nu poate împărți o chitanță rând cu rând. Dacă au plătit două carduri pentru cabană, introdu două cheltuieli. Dacă unii au comandat extra la cină, introdu extrele ca o cheltuială separată."
      - "Ține evidența banilor, nu a itinerarului. Sondajele și comentariile rămân pe costuri, deci planurile pentru weekend rămân în chatul grupului."
