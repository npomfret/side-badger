sections:
  - heading: "Doar oamenii care au fost acolo"
    body: "Împarte un cost între toți sau doar între cei care l-au împărțit. Exclude oamenii din costurile la care n-au participat, iar soldurile o reflectă. Colegul care a lipsit toată săptămâna nu datorează pentru mâncarea la pachet, lucru pe care [colegii de casă](page:use-case/housemates) îl vor recunoaște ca dreptate elementară."
  - heading: "Detaliile care evită certuri mai târziu"
    items:
      - "Setează **data** și, opțional, ora. Scurtăturile precum azi, ieri, azi dimineață și aseară economisesc din scris."
      - "Adaugă până la trei **etichete** ca să grupezi cheltuielile, de exemplu alimente sau călătorii."
      - "Adaugă **locul**. Lipește un link de hartă și numele locului se completează singur."
      - "Adaugă o **notă** pentru povestea din spatele cifrei, cu puțină formatare dacă povestea o cere."
      - "Atașează până la trei **chitanțe**, ca fotografii sau PDF-uri, ca dovada să rămână alături de cheltuială."
      - "Folosește **comentariile** ca să ții conversația lângă cheltuiala despre care e vorba, nu într-un fir de chat prin care nu mai derulează nimeni."
  - heading: "Copiază, editează și vezi ce s-a schimbat"
    body: "Copiază chiria lunii trecute în loc să o scrii din nou, apoi schimbă ce e diferit. Dacă o cifră a fost greșită, editează cheltuiala. Versiunea anterioară se păstrează, iar editarea apare în activitatea grupului, așa că nimeni nu schimbă o cifră pe tăcute. Ce are voie să editeze fiecare depinde de permisiunile grupului."
  - heading: "Când ceva pare în neregulă"
    body: "Un grup poate activa întrebările despre cheltuieli. Oricine e inclus într-o cheltuială poate ridica o întrebare și spune de ce, iar cheltuiala rămâne în afara soldurilor până când persoana care a întrebat, sau un administrator, o închide. Este dezactivată implicit și un administrator o activează pentru grup. Se potrivește la [evenimente și sărbători](page:use-case/events-and-celebrations), unde avansul pe care nu și-l amintește nimeni devine brusc treaba tuturor."
limits:
  heading: "Limite"
  items:
    - "O singură persoană plătește pentru fiecare cheltuială. Dacă au plătit două, înregistrează două cheltuieli."
    - "Nu există împărțire pe articole și nici împărțire pe părți. Egal, sume exacte și procente sunt tot ce există."
    - "Procentele trebuie să dea împreună 100."
    - "O cheltuială poate fi de până la 999.999,99 în propria valută, cu zecimalele obișnuite ale acelei valute."
    - "Cheltuielile nu se pot repeta singure. Copiază-o pe cea din luna trecută."
    - "Datele nu pot fi în viitor sau cu mai mult de 10 ani în urmă."
    - "O cheltuială la care participă cineva care a părăsit grupul devine doar pentru citire."
useCasesHeading: "Unde ajută o astfel de împărțire"
faq:
  heading: "Întrebări"
  items:
    - q: "Pot plăti două persoane pentru o singură cheltuială?"
      a: "Nu într-o singură cheltuială. Înregistrează două, câte una pentru fiecare plătitor, iar soldurile ies la fel."
    - q: "Pot împărți o chitanță pe articole?"
      a: "Nu. O împărțire este egală, pe sume exacte sau procentuală. Pentru o notă cu articole diferite, introdu ce datorează fiecare ca sume exacte."
    - q: "Pot seta o împărțire implicită?"
      a: "Nu. Copiază o cheltuială anterioară ca să-i refolosești împărțirea și schimbă ce e diferit."
    - q: "Pot facturile să se repete în fiecare lună?"
      a: "Nu. Copiază în schimb cheltuiala lunii trecute, ceea ce durează câteva secunde."
    - q: "Cine poate edita o cheltuială?"
      a: "Oricine are voie conform permisiunilor grupului. Fiecare editare apare în activitatea grupului, deci schimbările nu sunt niciodată pe tăcute."
    - q: "Ce se întâmplă cu soldurile după aceea?"
      a: "Se actualizează pe măsură ce sosesc cheltuielile, iar [decontarea](page:feature/settle-up) le transformă într-o listă scurtă de plăți. Dacă o cheltuială e în altă valută, vezi [mai multe valute](page:feature/multiple-currencies)."
