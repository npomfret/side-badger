meta:
  title: "Grup harcamaları için ortak listeler, anketler ve yorumlar | Side Badger"
  description: "Harcamalara yorum yapın, tuhaf olanı sorgulayın, ortak alışveriş listesi tutun ve villa için oy verin. Harcamayı birlikte planlayın, sonra bölüşün. Ücretsiz, reklamsız."
h1: "Birlikte planlayın, sonra bölüşün"
navLabel: "Birlikte planlama"
lead: "Alışveriş listesi ve alışveriş faturası, sonunda aynı dilden konuşuyor. Side Badger grubunuza parayla ilgili harcanmadan önce ve sonra konuşacak bir yer verir: her harcamaya yorumlar, yanlış görünenleri sorgulamanın bir yolu, ortak listeler ve büyük kararlar için anketler. Sonra her zamanki gibi [harcamaları bölüşürsünüz](page:feature/split-expenses)."
cta:
  heading: "Planlayın, sonra bölüşün"
  body: "Ücretsiz bir hesap oluşturun, bir grup kurun ve ilk listeyi, anketi ya da soruyu paranın hemen yanına koyun. Sonrasında ne olacağından emin değil misiniz? [Nasıl çalışır](page:how-it-works) sayfasına bakın."
problem:
  heading: "Sohbet burada, fatura orada"
  body: "Grup harcamaları genellikle iki yerde yaşar. Rakamlar bir yerde, rakamlar hakkındaki kavga ise salı günü kayıp giden bir sohbettedir. Alışveriş listesi bir buzdolabı fotoğrafıdır. Villaya çoğunluğun bir başparmak işaretiyle karar verdi, herhalde. Side Badger planlamayı grubun içinde, ilgili olduğu harcamaların yanında tutar: maliyetin olduğu yerde bir yorum, alışverişin olduğu yerde bir liste, büyük karar için bir anket ve bir paragraf yazmadan “dur bir dakika, bu doğru mu?” demenin bir yolu. Hepsi grubun parasıyla ilgili kalır; grup zaten bunun için var."
workflow:
  heading: "Villa oylamasından alışveriş faturasına"
  steps:
    - title: "Büyük kararı oya sunun"
      body: "Faturayı belirleyen karar için, örneğin hangi villa, bir anket ekleyin. İki ila on seçenek belirleyin, her kişinin kaç oyu olacağını söyleyin, herkes oyunu verince anketi kapatın; kazanan işaretlenir."
      shot: S17
      shotAlt: "Kazanan seçeneğin işaretlendiği ve her seçeneğin yanında oy sayısının görüldüğü kapatılmış bir anket"
    - title: "Alışveriş listesini birlikte yazın"
      body: "Ortak bir liste başlatın, ürünleri ekleyin ve sepete girdikçe işaretleyin. Alışveriş sonradan bir harcama olarak girer."
      shot: S16
      shotAlt: "Bazı ürünleri işaretlenmiş ve ilerleme sayısı olan ortak bir alışveriş listesi"
    - title: "Maliyeti olduğu yerde konuşun"
      body: "Harcamanın kendisine yorum yapın, makbuzu ekleyin ve emojiyle tepki verin. Konuşma, hakkında olduğu rakamın yanında kalır."
      shot: S08
      shotAlt: "Ayrıntıları, makbuz küçük resmi, yorum dizisi ve emoji tepkileri olan bir harcama"
    - title: "Tuhaf görüneni sorgulayın"
      body: "Grup harcama sorularını açtıysa, bir harcamada payı olan herkes **Bir sorum var**'ı seçebilir. Soru çözülene kadar harcama bakiyelerin dışında kalır."
      shot: S18
      shotAlt: "Sorgulandı rozeti ve Yalnızca sorgulanan filtresiyle harcama listesi"
    - title: "Neyin değiştiğini ve kimin değiştirdiğini görün"
      body: "Etkinlik akışı ve bildirim zili, gruplarınızda nelerin yeni olduğunu gösterir. İsterseniz anlık bildirimler de var."
      shot: S19
      shotAlt: "Son etkinliklerin listelendiği bildirimler açılır menüsü"
