featuresHeading: "آنچه یک سفر به آن تکیه دارد"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "کسانی که شام نبودند را می‌شود کنار گذاشت؟"
      a: "بله. انتخاب کنید چه کسانی در هر هزینه سهیم بودند و فقط از آن‌ها پول گرفته می‌شود."
    - q: "بدون آنتن کار می‌کند؟"
      a: "نه. Side Badger به اتصال نیاز دارد، پس هزینه‌ها را وقتی به وای‌فای رسیدید اضافه کنید."
    - q: "آیا همه باید چیزی نصب کنند؟"
      a: "نه. در مرورگر اجرا می‌شود. پیوند دعوت را بفرستید و افراد از گوشی‌شان می‌پیوندند."
    - q: "از کدام نرخ تبدیل استفاده می‌کند؟"
      a: "نرخ تبدیل روز هنگام وارد کردن هزینه، یا نرخ خودتان اگر نرخ دیگری گرفتید. نرخ هنگام ذخیره هزینه ثابت می‌شود، پس هزینه‌های قدیمی هرگز دوباره ارزش‌گذاری نمی‌شوند."
    - q: "می‌توانیم بعد از سفر گروه را قفل کنیم؟"
      a: "بله. مدیر می‌تواند گروه را قفل کند تا اعداد سر جایشان بمانند."
    - q: "برای مبلغ‌ها محدودیتی هست؟"
      a: "بله. 999,999.99 برای هر هزینه، به ارز خودش."
