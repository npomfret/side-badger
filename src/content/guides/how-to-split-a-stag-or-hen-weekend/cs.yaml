faq:
  heading: "Otázky"
  items:
    - q: "Platí svědek ženicha nebo svědkyně nevěsty víc?"
      a: "Jen pokud se na tom skupina shodne. Aplikace nedává nikomu v počtech zvláštní roli. Pokud někdo hradí víc, zvolte pod **Jak rozdělit** **Přesné částky** nebo **Procenta** a zadejte podíly, na kterých jste se dohodli."
    - q: "A co pití, které někteří nepili?"
      a: "Přidejte pití jako samostatný výdaj a zaškrtněte jen ty, kdo ho měli. Pokud každý měl jiné množství, zvolte **Přesné částky** a zadejte podíl každého. Nikdo neplatí za to, co neměl."
    - q: "Může oslavenec skupinu později vidět?"
      a: "Ano, až bude po překvapení. Pozvěte ho a správce ho pak může v nastavení skupiny pod **Zabezpečení a oprávnění** nastavit jako **Prohlížeč**. Prohlížeč vidí všechno a nic nemění, takže počkejte, až nebude nic tajné. K připojení potřebuje bezplatný účet."
