faq:
  heading: "Vragen"
  items:
    - q: "Welke wisselkoers gebruikt Side Badger?"
      a: "Een actuele wisselkoers, opgehaald wanneer je de uitgave invoert, waar er een beschikbaar is. Je kunt de koers veranderen in wat je echt kreeg."
    - q: "Kan de groep bij ponden en yen blijven?"
      a: "Ja. Zet in de **Instellingen** van de groep onder **Valuta-instellingen** de optie **Valuta's beperken voor deze groep** aan, kies de **Toegestane valuta’s** en stel de **Standaardvaluta voor nieuwe uitgaven** in. Minder opties in de lijst, minder verkeerde gokken aan de kassa."
    - q: "Moeten we sowieso omrekenen?"
      a: "Nee. Valuta’s blijven apart, tenzij jij of je groep ervoor kiest de bedragen om te rekenen, en elke valuta krijgt haar eigen korte lijst betalingen."
