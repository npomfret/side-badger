sections:
  - heading: コメントとリアクションは、数字のそばで
    body: すべての支出に専用のコメント欄があり、グループ、各リスト、各投票にもあります。タクシー代がなぜそんなにかかったのかは、誰もさかのぼらないチャットではなく、そのタクシーの支出の下で聞きましょう。レシートの写真や予約のPDFを添付でき、支出、支払い、コメントには、いいね、ハート、笑い、驚き、悲しい、お祝いのリアクションを付けられます。支払いが届いたら、お祝いしましょう。Side Badgerで拍手に一番近いのが、これです。
  - heading: 言い争いにならずに、支出に質問する
    body: "グループで支出への質問をオンにしている場合、支出に含まれる人なら誰でも**質問があります**を選んで、理由を添えられます。質問はその支出へのコメントとして投稿され、支出に**質問あり**のバッジが付き、支出全体が、質問が解決するまで全員の残高から外れます。"
    items:
      - "**オンにする。**初期設定ではオフです。管理者が、グループの設定の**機能**で**費用への質問を許可する**をオンにします。"
      - "**閉じる。**質問した人か管理者が**質問を閉じる**を選びます。複数の人が同じ支出に質問した場合は、最後の質問が閉じられた時点で、その支出が残高に戻ります。"
      - "**支出を編集したとき。**支出を編集すると、未解決の質問は、まだその支出に持ち分のある全員について、新しいバージョンに引き継がれます。編集で外れた人の質問は、古いバージョンとともに終わるので、その人が閉じるものは残りません。"
      - "**見つける。**支出リストには**質問ありのみ**フィルターがあります。これは承認の手順ではありません。保留されるのは誰かが質問した支出だけで、それ以外はすべて、追加された時点で計算に含まれます。"
  - heading: 質問の行方
    body: Tomが£45のパーティーのワインを追加し、ルームメイト3人全員で分けます。Aishaは飲まなかったので質問を出し、質問が解決するまで、そのワインは誰の分にも数えられません。家のみんなは、ワインはTomとPriyaのものだと同意し、Tomが分割を2人に編集します。Aishaはもうその支出に含まれないため、Aishaの質問は以前のバージョンとともに終わり（以前のバージョンは保存されます）、ワインはすぐに残高に戻って、1人£15ではなく、1人£22.50になります。Aishaがその支出に残っていたら、質問は引き継がれ、本人か管理者が閉じるのを待っていたはずです。下の例で、Aishaの£48は、買い物の£28と清掃代の£20の合計です。Priyaの£10.50は、自分の負担分£70.50（£28、£20、£22.50）から、支払った£60を引いた額です。いかにも[ルームメイト](page:use-case/housemates)らしい言い合いです。質問の書き方は、[共有の支出に誰かが異議を唱えたときの対処](page:guide/what-to-do-when-someone-disputes-a-shared-expense)をご覧ください。
  - heading: 買い物のための共有リスト
    body: "グループの中でリストを作り、「買い物リスト」などの名前を付けて、品目を追加し、チェックを入れていきます。品目をドラッグして並べ替え、進捗の数が増えていくのを眺め、誰かが違うオーツミルクを買ってきたら、リストにコメントしましょう。終わったリストはアーカイブして片付けられ（**アーカイブ済みを表示**で戻せます）、リストをコピーして使い回すこともできます。共有の買い物リストは買い物の請求書のそばに置くので、リストには買うものが、支出にはその費用が残ります。誰がリストを作成・編集できるかは、グループの権限で決まります。詳しくは[グループと権限](page:feature/groups-and-permissions)をご覧ください。"
  - heading: 投票は、希望すれば匿名で
    body: 請求額を左右することを、グループに聞いてみましょう。たとえば、どのヴィラにするか、贈り物にいくら使うか、ボートツアーに行く価値があるか、などです。投票には質問と、2〜10個の選択肢があります。一人あたりの票数は、単一選択から最大10票まで選べて、匿名にするかどうかも選べます。**匿名投票**は誰が何に投票したかを非表示にし、最初の投票が入ったあとは変更できません。終了するまでは、各自が自分の票を変更または取り消せて、グループの気が変わったときは投票を再開できます。ヴィラ選びは[グループ旅行](page:use-case/group-trips)そのものであり、贈り物の予算決めは[イベントやお祝い](page:use-case/events-and-celebrations)の定番です。
  - heading: アクティビティフィードで、こっそり変わることはない
    body: すべてのグループにアクティビティ履歴があり、通知のベルには、すべてのグループのアクティビティが1か所に集まります。支出を追加すると、更新しなくても全員にすぐ表示され、フィードには何が変わったか、誰が変えたかが表示されます。対象は、支出の追加・編集・削除、質問の提起と終了、コメント、リストと投票の変更、記録された支払いです。
  - heading: プッシュ通知は、ほしい人だけ
    body: プッシュ通知は任意です。アカウントの**設定**の**通知**でオンにすると、グループに新しい支出やコメントなどのアクティビティがあったときに、デバイスがお知らせします。オンにするのはデバイスごとで、最初にブラウザが許可を求めます。iPhoneとiPadでは、ホーム画面に追加したアプリでのみ動作します。詳しくは[Webアプリ](page:feature/web-app)のページをご覧ください。配信は保証されないので、約束ではなく、あくまで便利機能として考えてください。
limits:
  heading: 制限
  items:
    - コメント、リスト、投票は、グループのお金のためのものです。[利用規約](page:terms)では、投稿するものすべてがグループの金銭に関係することを求めているので、ここは支出を計画する場所であり、普通のチャットやToDoアプリではありません。
    - コメントは500文字までで、画像またはPDFの添付を最大3つ、それぞれ5MBまで付けられます。コメントを削除できるのは、投稿した本人だけです。
    - 支出への質問は初期設定でオフで、管理者がグループごとにオンにします。支出に質問できるのはその支出に含まれる人だけで、機能をオフにすると未解決の質問はすべて消え、自分が含まれる支出に未解決の質問がある間は、誰もグループを退出できません。
    - 1つのグループには最大100個のリストを作れ、各リストには最大200個の品目を入れられ、1つの品目は500文字までです。リストを作成、編集、削除できる人はグループの権限で決まり、ロックされたグループでは変更できません。
    - 1つのグループには最大50個の投票を作れ、各投票には2〜10個の選択肢があり、一人あたり最大10票です。投票に期限はなく、自動では終了しません。
    - アクティビティ履歴は90日間保存されます。
    - プッシュ通知は、アカウントごと、デバイスごとに自分でオンにする仕組みです。対応するブラウザとあなたの許可が必要で、iPhoneとiPadではホーム画面に追加したアプリからのみ動作し、配信は保証されません。アクティビティのメールやテキストメッセージの通知も、支払いのリマインダーもないので、支払いの催促は引き続きご自身で行ってください。
useCasesHeading: 一緒に計画すると役立つ場面
faq:
  heading: よくある質問
  items:
    - q: 投票を匿名にできますか？
      a: はい。投票を作成するときに**匿名投票**をオンにすると、誰が何に投票したかが非表示になります。最初の投票の前に決めてください。あとから変更できません。
    - q: 投票は自動で終了できますか？
      a: いいえ。投票に期限はないので、グループの意見が決まったら、作成した人が**投票を終了**で締め切ります。グループの気が変わったら、**投票を再開**で元に戻せます。
    - q: リストには何個の品目を入れられますか？
      a: 1つのリストに最大200個、1グループに最大100個のリストを作れます。1つの品目は500文字までで、オーツミルクの説明にしては十分すぎる長さです。
    - q: 質問は誰が閉じられますか？その間、支出はどうなりますか？
      a: 質問した人か、グループの管理者です。質問が未解決の間、支出全体が全員の残高から外れます。その支出の最後の未解決の質問が閉じられたとき、または編集によって質問した人が支出から外れたときに、残高に戻ります。
    - q: リストとコメントをToDoアプリやグループチャットとして使えますか？
      a: いいえ。コメント、リスト、投票はグループのお金のためのもので、それが[利用規約](page:terms)の求めることです。買い物リスト、予算の投票、「なんでこれが£45なの？」といった使い方を思い浮かべてください。
    - q: アクティビティについて、Side Badgerからメールが届きますか？
      a: いいえ。アクティビティのメールやテキストメッセージの通知はありません。デバイスごとにプッシュ通知をオンにでき、アプリの通知のベルで新しい動きを確認できます。
