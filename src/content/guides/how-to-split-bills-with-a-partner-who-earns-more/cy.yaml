meta:
  title: "Sut i rannu biliau gyda phartner sy'n ennill mwy | Side Badger"
  description: "Mae 50/50 yn lletchwith pan fo un ohonoch yn ennill llawer mwy. Rhannwch y biliau yn ôl incwm yn lle hynny, gyda'r symiau i ddau berson a dim taenlen."
h1: "Sut i rannu biliau gyda phartner sy'n ennill mwy"
navLabel: "Partner sy'n ennill mwy"
lead: "Adiwch eich cyflog net, gweithiwch allan gyfran pob person o'r cyfanswm a thalgrynnwch i ganrannau cyfan. Cyflog net Maya yw £2,800 a chyflog net Jon yw £1,700, felly maen nhw'n rhannu'r biliau a rennir 62/38. Rhowch y canrannau hynny ar gost a rennir yn Side Badger, yna copïwch hi pryd bynnag y daw'r un bil o gwmpas."
cta:
  heading: "Gwnewch y cyfrifiad unwaith"
  body: "Creu cyfrif am ddim, gwneud grŵp i'r ddau ohonoch a rhoi'r rhent i mewn gyda'ch canrannau. Copi yw rhent y mis nesaf. Eisiau'r daith yn gyntaf? Gweler [sut mae'n gweithio](page:how-it-works) neu [beth mae am ddim yn ei gynnwys](page:pricing)."
sections:
  - heading: "Dau gyflog, un fflat, un tawelwch cwrtais"
    body: "Mae Maya a Jon yn byw gyda'i gilydd. Cyflog net Maya yw £2,800 y mis a chyflog net Jon yw £1,700. Am ddwy flynedd roedden nhw'n rhannu popeth 50/50, am ei fod yn syml ac nad oedd yr un ohonyn nhw eisiau bod y cyntaf i sôn amdano. Yna edrychodd Jon ar y rhent ar ei ben ei hun. Hanner £1,400 yw £700, sef chwarter cyflog net Maya a 41% o'i gyflog ef. Doedd neb wedi bod yn annheg. Doedd neb wedi gwneud y cyfrifiad. Mae digon o [gyplau](page:use-case/couples) yn cyrraedd yma yn y pen draw. Dros bryd tecawê, cytunodd y ddau y dylai'r biliau a rennir gymryd tamaid tebyg o bob cyflog."
  - heading: "Y dull, gyda'r symiau wedi'u dangos"
    body: "Pedwar cam, un gyfrifiannell a sgwrs yr oeddech am ei chael beth bynnag."
    items:
      - "**Cytunwch beth sy'n cyfrif fel cyflog.** Mae Maya a Jon yn defnyddio cyflog net, yr arian sy'n glanio yn y banc bob mis. Gyda'i gilydd mae hynny'n £2,800 + £1,700 = £4,500."
      - "**Gweithiwch allan pob cyfran.** Cyfran Maya yw 2,800 ÷ 4,500, sef 62.2%. Cyfran Jon yw 1,700 ÷ 4,500, sef 37.8%."
      - "**Talgrynnwch i ganrannau cyfan.** Mae 62.2% yn dod yn 62 a 37.8% yn dod yn 38. Gyda dau berson, talgrynnwch un ffigur a thynnwch ef o 100 i gael y llall, ac maen nhw bob amser yn adio i 100."
      - "**Gwiriwch beth mae'n ei olygu.** Ar y rhent o £1,400, mae Maya yn talu £868 (62%) a Jon yn talu £532 (38%). Mae hynny tua 31% o gyflog net pob person. Byddai hanner yr un wedi cymryd 25% o gyflog Maya a 41% o gyflog Jon."
  - heading: "Darllen y mis"
    body: "Talodd Maya'r rhent o £1,400 a thalodd Jon y £216 arall. Cyfran Maya o'r mis yw £868.00 + £111.60 + £18.00 = £997.60, a thalodd hi £1,400, felly mae £402.40 yn ddyledus iddi. Cyfran Jon yw £532.00 + £68.40 + £18.00 = £618.40, a thalodd ef £216, felly mae £402.40 yn ddyledus ganddo. Mae Side Badger yn awgrymu un taliad, Jon i Maya, am £402.40, ac mae [setlo](page:feature/settle-up) yn ei gofnodi unwaith y bydd wedi'i wneud. Wedi'i rannu 50/50, byddai'r un mis wedi gweld Jon yn talu £592.00 i Maya."
  - heading: "Ei sefydlu yn Side Badger"
    body: "Deg munud, y rhan fwyaf ohonynt ar y canrannau."
    items:
      - "**Gwneud y grŵp.** Ar y dangosfwrdd dewiswch **Creu Grŵp** a'i enwi ar ôl y fflat. Dewiswch **Gwahodd Eraill** ac anfon y ddolen neu'r cod QR at Jon. Mae'n mewngofnodi neu'n creu cyfrif am ddim, ac yn dewis yr enw mae eisiau ei ddangos yn y grŵp hwn. Dim ond aelodau all weld grŵp, felly dim ond y ddau ohonoch sydd yn hwn."
      - "**Ychwanegu'r rhent.** Dewiswch **Ychwanegu Cost**. Rhowch y disgrifiad a'r swm, ac o dan **Pwy dalodd?** dewiswch Maya. Cadwch y ddau berson o dan **Rhannu rhwng**, yna o dan **Sut i rannu** dewiswch **Canran** a theipiwch 62 a 38. Mae'r ffurflen yn nodi hynny os nad yw'r canrannau'n adio i 100. Dewiswch **Cadw Cost**."
      - "**Ychwanegu'r biliau eraill.** Mae ynni a band eang yn mynd i mewn yn yr un ffordd, gyda Jon fel y talwr a'r un 62 a 38. Mae'r tecawê yn gost ar wahân, gyda **Sut i rannu** wedi'i adael ar **Cyfartal**."
      - "**Ei gopïo'r mis nesaf.** Agorwch rent y mis diwethaf a dewiswch **Copïo cost**. Mae'r copi'n cadw'r talwr, y swm a'r rhaniad, ac yn cymryd dyddiad heddiw. Newidiwch y swm os yw'r rhent wedi newid, yna dewiswch **Creu Copi**. Mae'r bil ynni'n gweithio yn yr un ffordd."
      - "**Gwirio pwy sy'n ddyledus i bwy.** Mae'r adran **Balansau** yn ei ddangos ac yn awgrymu rhestr fer o daliadau. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad o dan **Setlo**."
  - heading: "50/50, yn ôl incwm, neu fesul bil"
    body: "Does dim ateb cywir, dim ond yr un y gall y ddau ohonoch fyw gydag ef. Dyma dri chyffredin."
    items:
      - "**Hanner yr un ar gyfer popeth.** Y symlaf i'w gadw, ac mae'n addas i gyplau y mae eu cyflogau'n agos."
      - "**Yn ôl incwm ar gyfer popeth a rennir.** Yr hyn y mae Maya a Jon yn ei wneud. Un sgwrs, un pâr o ganrannau."
      - "**Bil wrth fil.** Rhent a biliau yn ôl incwm, gwyliau a danteithion 50/50 neu beth bynnag arall y cytunwch arno, a phob bil yn cael y rheol sy'n ei siwtio."
  - heading: "Cytunwch beth sy'n cyfrif fel un a rennir"
    body: "Mae'r dadleuon fel arfer am y rhestr, nid y canrannau. Mae rhent, ynni, band eang, y siopa wythnosol a'r soffa'n cyfrif fel costau a rennir yn y rhan fwyaf o gartrefi. Efallai nad yw aelodaeth campfa Maya a thanysgrifiad pêl-droed Jon yn gwneud hynny. Cytunwch ar y rhestr unwaith, ysgrifennwch hi i lawr a rhowch dim ond y costau a rennir yn y grŵp."
  - heading: "Mae'r tecawê yn aros yn 50/50, yn fwriadol"
    body: "Mae danteithion yn fach ac yn ddewisol, ac ni ddylai neb fod angen cyfrifiannell i archebu twmplenni. Yn Side Badger, cost arall yn unig yw'r tecawê. Mae Jon yn talu £36, mae **Sut i rannu** yn aros ar **Cyfartal** ac mae £18 yn ddyledus gan bob un ohonynt."
  - heading: "Pan fydd cyflog rhywun yn newid"
    body: "Mae codiad cyflog, swydd newydd neu amser i ffwrdd o'r gwaith yn newid y cyfrifiad. Gweithiwch allan y canrannau newydd yn yr un ffordd a'u defnyddio o'r gost nesaf. Mae costau cynharach yn aros fel yr oeddent. Copïwch rent y mis diwethaf, newidiwch y canrannau, yna dewiswch **Creu Copi**. I gywiro cost sydd eisoes i mewn, golygwch hi os yw caniatâd y grŵp yn gadael hynny, a dywedwch wrth eich partner yn gyntaf, oherwydd bod y balansau'n newid. Cedwir y fersiwn gynharach. Cytunwch pryd y byddwch yn ailgyfrifo, fel unwaith y flwyddyn, a setlwch cyn i chi newid fel bod yr hen raniad yn cau gyda chyfrif glân."
  - heading: "Beth nad yw Side Badger yn ei wneud yma"
    items:
      - "Dyw Side Badger byth yn gofyn beth mae neb yn ei ennill ac nid yw'n gweithio allan y canrannau. Rydych yn teipio'r ffigurau y cytunoch arnynt."
      - "Ni all Side Badger osod rhaniad diofyn ar gyfer y grŵp cyfan. Mae'r canrannau'n mynd ar bob cost, felly copïwch un sydd eisoes â nhw."
      - "Does dim biliau cylchol, felly rydych yn copïo rhent y mis diwethaf bob tro."
      - "Dyw Side Badger byth yn symud arian. Rydych yn talu eich gilydd sut bynnag y dymunwch ac yn ei gofnodi."
