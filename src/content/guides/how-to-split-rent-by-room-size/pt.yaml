meta:
  title: "Como dividir a renda pelo tamanho dos quartos | Side Badger"
  description: "Quarto maior, parte maior. Põe de lado as divisões comuns, divide o resto pela área e introduz as percentagens uma só vez. Contas feitas para três colegas."
h1: "Como dividir a renda pelo tamanho dos quartos"
navLabel: "Renda pelo tamanho do quarto"
lead: "Decide quanto da renda paga as divisões comuns e divide essa parte em partes iguais; depois divide o resto pela área de cada quarto. Arredonda para percentagens inteiras, introduz-as uma só vez na renda, no Side Badger, e copia a despesa todos os meses."
cta:
  heading: "Introduz a renda uma só vez"
  body: "Cria uma conta grátis, começa um grupo para o apartamento e introduz a renda com as percentagens que combinaram. O mês seguinte é uma cópia. Queres primeiro uma visita guiada? Vê [como funciona](page:how-it-works) ou [o que o grátis inclui](page:pricing)."
sections:
  - heading: "Três pessoas, um apartamento, uma discussão"
    body: "A Priya, o Tom e a Aisha partilham um apartamento por 1 950 £ por mês. Durante um ano dividiram a renda por três, porque era fácil. Depois a Aisha mediu o quarto dela. O quarto da Priya tem 16 m², o do Tom tem 12 m² e o da Aisha tem 10 m², por isso a Aisha pagava o mesmo que a Priya por um quarto mais de um terço mais pequeno. Ninguém tinha sido pouco razoável. Ninguém tinha feito a conta. Entre duas embalagens de comida para levar, combinaram primeiro uma regra. Da renda, 40% paga a cozinha, a casa de banho e a sala, que os três usam."
  - heading: "O método, com as contas à vista"
    body: "Quatro passos, uma fita métrica e a calculadora do telemóvel."
    items:
      - "**Põe de lado a parte comum.** O grupo combina que parte da renda paga as divisões que todos usam. No apartamento são 40%, ou seja, 13,33% para cada uma das três pessoas."
      - "**Divide o resto pela área.** Os outros 60% vão pelo tamanho do quarto. Os quartos somam 38 m² (16 + 12 + 10), por isso a parte da Priya é 60% × 16/38, ou seja, 25,26%."
      - "**Soma as duas partes.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, mais 13,33% dá 32,3%. Aisha: 60% × 10/38 = 15,79%, mais 13,33% dá 29,1%."
      - "**Arredonda e confirma.** As percentagens inteiras são mais fáceis de escrever e de discutir, por isso 38,6% passa a 39%, 32,3% passa a 32% e 29,1% passa a 29%. Confirma que 39 + 32 + 29 dá 100. Se o arredondamento der 99 ou 101, o grupo combina qual dos valores muda um ponto."
  - heading: "Ler o mês do apartamento"
    body: "Com a renda a 39%, 32% e 29%, as partes são 760,50 £, 624,00 £ e 565,50 £. A Priya pagou ao senhorio, por isso, ao longo do mês, tem 1 142,50 £ a receber, enquanto o Tom deve 566,00 £ e a Aisha deve 576,50 £. O Side Badger sugere dois pagamentos, ambos para a Priya."
  - heading: "Prepara tudo no Side Badger"
    body: "Uma noite, a maior parte passada a discutir os 40%."
    items:
      - "**Faz o grupo.** No painel, escolhe **Criar grupo** e dá-lhe o nome do apartamento. Escolhe **Convidar outras pessoas** e envia o link ou o código QR. Toda a gente inicia sessão ou cria uma conta grátis e escolhe o nome com que quer aparecer neste grupo."
      - "**Adiciona a renda.** Escolhe **Adicionar despesa**. Introduz a descrição e o valor e, em **Quem pagou?**, escolhe quem pagou ao senhorio. Mantém as três pessoas em **Dividir entre** e, em **Como dividir**, escolhe **Percentagem** e escreve 39, 32 e 29. O formulário avisa se as percentagens não somarem 100. Escolhe **Guardar despesa**."
      - "**Adiciona as contas.** A energia e a internet são despesas separadas, cada uma com o seu pagador. Deixa **Como dividir** em **Igual**."
      - "**Copia-a no mês seguinte.** Abre a renda do mês passado e escolhe **Copiar despesa**. A cópia mantém o pagador, o valor e a divisão, e fica com a data de hoje. Muda o valor se a renda mudou e depois escolhe **Criar cópia**."
      - "**Vê quem deve a quem.** A secção **Saldos** mostra-o. Paguem-se como preferirem e depois registem o pagamento em **Acertar contas**."
  - heading: "Quartos com casa de banho, quartos minúsculos e quem se vai embora"
    items:
      - "**Quartos com casa de banho e quartos minúsculos.** A área é só um ponto de partida. Um quarto com casa de banho própria vale mais do que o mesmo espaço sem ela, e um quarto minúsculo onde cabem uma cama e uma cadeira cheia de esperança vale menos. Ajustem as percentagens por acordo, confirmem que continuam a somar 100 e escrevam os valores finais num sítio que o apartamento todo veja."
      - "**Alguém sai a meio do mês.** Calcula o que cada pessoa deve por esse mês e introduz a renda desse mês em **Valores exatos** em vez de **Percentagem**. Os valores têm de somar a renda. Faz isso antes de a pessoa sair. Ninguém pode sair de um grupo enquanto deve ou tem dinheiro a receber, e uma despesa que envolva alguém que saiu passa a ser só de leitura."
      - "**Chega alguém novo.** Mede outra vez, refaz as contas com os novos tamanhos dos quartos e usa as novas percentagens a partir da renda seguinte. Os meses anteriores ficam como estavam."
  - heading: "O que o Side Badger não faz aqui"
    items:
      - "Não mede os teus quartos nem escolhe as percentagens. As áreas e os 40% são para o grupo combinar."
      - "Não tem contas recorrentes, por isso copias a renda do mês passado de cada vez."
      - "Nunca movimenta dinheiro nem paga ao senhorio. Pagam-se uns aos outros como preferirem e registam o pagamento."
      - "Não sabe o que diz o vosso contrato de arrendamento. Mantém a conta entre as pessoas do grupo."
