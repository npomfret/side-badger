featuresHeading: Worauf sich eine Reise stützt
faq:
  heading: Fragen
  items:
    - q: Können Leute, die das Abendessen ausgelassen haben, weggelassen werden?
      a: Ja. Wähle, wer an jeder Ausgabe beteiligt war, und nur sie werden dafür belastet.
    - q: Funktioniert es ohne Empfang?
      a: Nein. Side Badger braucht eine Verbindung, füge die Kosten also hinzu, sobald du wieder im WLAN bist.
    - q: Muss jede Person etwas installieren?
      a: Nein. Es läuft im Browser. Schick den Einladungslink, und die Leute treten vom Handy aus bei.
    - q: Welchen Wechselkurs verwendet es?
      a: Einen aktuellen Wechselkurs beim Erfassen der Ausgabe, oder deinen eigenen, wenn du einen anderen bekommen hast. Der Kurs wird beim Speichern der Ausgabe festgelegt, alte Ausgaben werden also nie neu bewertet.
    - q: Können wir die Gruppe nach der Reise einfrieren?
      a: Ja. Ein Admin kann die Gruppe sperren, damit die Zahlen stehen bleiben.
    - q: Gibt es ein Limit für Beträge?
      a: Ja. 999.999,99 pro Ausgabe, in der jeweiligen Währung.
