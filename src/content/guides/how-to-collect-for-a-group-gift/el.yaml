example:
  heading: "Το πικάπ της Μπίας και η κάρτα"
  currency: GBP
  people:
    - id: priya
      name: Πρίγια
    - id: omar
      name: Ομάρ
    - id: lena
      name: Λένα
    - id: sam
      name: Σαμ
  expenses:
