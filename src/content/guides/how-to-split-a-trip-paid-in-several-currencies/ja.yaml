faq:
  heading: よくある質問
  items:
    - q: どの為替レートを使いますか？
      a: 支出を入力したときに取得できる場合は、現在の為替レートです。実際に適用されたレートに変更できます。
    - q: グループでポンドと円だけに絞れますか？
      a: はい。グループの**設定**の**通貨設定**で**このグループの通貨を制限する**をオンにし、**許可された通貨**を選んで、**新しい経費のデフォルト通貨**を設定します。リストの選択肢が減れば、レジで迷って選び間違えることも減ります。
    - q: 必ず換算しなければなりませんか？
      a: いいえ。ご自身かグループが換算を選ばない限り、通貨は別々のままで、それぞれの通貨に短い支払いリストが用意されます。
