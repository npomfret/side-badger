meta:
  title: "ماشین‌حساب تقسیم اجاره: بر اساس اتاق یا درآمد | Side Badger"
  description: "اتاق بزرگ‌تر، سهم بزرگ‌تر؟ حساب کنید هر هم‌خانه چقدر می‌پردازد، بر اساس اندازه اتاق یا درآمد. در مرورگر شما اجرا می‌شود: چیزی ذخیره یا ارسال نمی‌شود."
h1: "ماشین‌حساب تقسیم اجاره"
navLabel: "ماشین‌حساب تقسیم اجاره"
lead: "اتاق خواب بزرگ‌تر، سهم بزرگ‌تر؟ اجاره را وارد کنید و ببینید هر نفر چقدر می‌پردازد، بر اساس اندازه اتاق یا درآمد، تا آخرین پنی. در مرورگر شما اجرا می‌شود، چیزی ذخیره نمی‌کند و پولی جابه‌جا نمی‌کند. وقتی خانه می‌خواهد حساب نگه داشته شود، در Side Badger [هزینه‌ها را تقسیم کنید](page:feature/split-expenses) و اجاره را هر ماه کپی کنید."
cta:
  heading: "درصدها را یک بار توافق کنید. برای همیشه کپی‌شان کنید."
  body: "این ماشین‌حساب وقتی زبانه را ببندید همه‌چیز را فراموش می‌کند، درست مثل هم‌خانه‌ای که مطمئن است اینترنت را خودش پرداخته. یک گروه در Side Badger اجاره، قبض‌ها و اینکه چه کسی چه چیزی را پرداخته نگه می‌دارد. رایگان است، بدون تبلیغات و بدون محدودیت روزانه."
sections:
  - heading: "دو روش برای تقسیم اجاره"
    items:
      - "**بر اساس اندازه اتاق.** بخشی از اجاره بابت آشپزخانه، حمام و اتاق نشیمن است که همه استفاده می‌کنند. شما آن سهم را تعیین می‌کنید (در ابتدا 40%) و مساوی تقسیم می‌شود. بقیه بر اساس مساحت اتاق خواب می‌رود، پس اتاق بزرگ بیشتر می‌دهد و اتاقک کوچک تخفیفی را می‌گیرد که حقش است."
      - "**بر اساس درآمد.** هر کس همان سهمی از اجاره را می‌پردازد که از کل درآمدها دارد. قبض‌های مشترک را هم اضافه کنید، از همین سهم‌ها پیروی می‌کنند."
  - heading: "حساب‌کتاب چطور کار می‌کند"
    body: "هر نفر ابتدا یک سهم دقیق می‌گیرد و بعد یک درصد صحیح، چون عدد صحیح هم راحت‌تر تایپ می‌شود و هم راحت‌تر سر آن بحث می‌شود. روش گرد کردن «بزرگ‌ترین باقی‌مانده» است: هر کس عدد صحیح زیر سهم خودش را نگه می‌دارد و درصدهای باقی‌مانده به کسی می‌رسد که بیشتر از همه از دست داده است. جمع درصدها همیشه 100 می‌شود. در آپارتمان پایین، 40% مشترک برای هر نفر 13.33% است. اتاق پریا 16 مترمربع از 38 مترمربع آپارتمان است، پس 60% × 16/38 برابر 25.26% می‌شود، با 13.33% روی هم 38.6% درمی‌آید که به 39% گرد می‌شود. تام و عایشه 32% و 29% درمی‌آیند و 39 + 32 + 29 برابر 100 است. هر مبلغ همان درصد از اجاره است: 39% از £1,950 برابر £760.50 است."
  - heading: "بعد آن را در Side Badger وارد کنید"
    body: "برای کل ماجرا، با متر و همه‌چیز، [نحوه تقسیم اجاره بر اساس اندازه اتاق](page:guide/how-to-split-rent-by-room-size) را ببینید، یا برای زوج‌ها [شریک زندگی با درآمد بیشتر](page:guide/how-to-split-bills-with-a-partner-who-earns-more) را."
    items:
      - "**اجاره را اضافه کنید.** در گروه‌تان **افزودن هزینه** را انتخاب کنید، زیر **چه کسی پرداخت کرد؟** بگویید چه کسی به صاحبخانه پرداخته و همه را زیر **تقسیم بین** نگه دارید."
      - "**درصد را انتخاب کنید.** زیر **نحوه تقسیم**، **درصد** را انتخاب کنید و درصدهای صحیح را تایپ کنید. اگر جمعشان 100 نشود، فرم هشدار می‌دهد."
      - "**ماه بعد کپی‌اش کنید.** اجاره ماه قبل را باز کنید و **کپی هزینه** را انتخاب کنید. تقسیم هم همراهش می‌آید."
  - heading: "کارهایی که ماشین‌حساب نمی‌کند"
    items:
      - "**اندازه‌گیری اتاق‌ها.** مساحت فقط نقطه شروع است. اتاقی با سرویس بهداشتی اختصاصی بیشتر از همان مساحت بدون آن می‌ارزد، و اتاقکی که فقط یک تخت و یک صندلی خوش‌بین در آن جا می‌شود کمتر."
      - "**تعیین اینکه چه چیزی درآمد حساب می‌شود.** خالص یا ناخالص، حقوق یا درآمد جانبی: گروه تصمیم می‌گیرد. برای همه از یک بازه زمانی استفاده کنید."
      - "**ذخیره کردن چیزی.** زبانه را ببندید، عددها از بین می‌روند. برای نگه داشتنشان لینک را کپی کنید. عددهای شما بعد از # در لینک هستند، که مرورگرها هرگز آن را به سرور نمی‌فرستند، و هر کسی که لینک را داشته باشد می‌تواند آن‌ها را بخواند."
      - "**جابه‌جا کردن پول.** هر طور دوست دارید به صاحبخانه پرداخت می‌کنید."
      - "**ترکیب ارزها یا عبور از محدودیت‌ها.** یک ارز انتخاب کنید. از 2 تا 10 نفر و اجاره‌ای تا 999,999.99 را می‌پذیرد، مثل برنامه."
