faq:
  heading: "Pertanyaan"
  items:
    - q: "Bagaimana jika uang yang terkumpul lebih dari harga hadiah?"
      a: "Jumlah pasti harus berjumlah sama dengan harganya, jadi kurangi bagian-bagiannya sampai cocok. Atau pakai kelebihannya untuk sesuatu yang nyata, seperti bunga, dan masukkan itu sebagai pengeluaran kedua, seperti kartu dan kertas kado pada contoh."
    - q: "Bisakah seseorang urunan tanpa bergabung ke grup?"
      a: "Tidak, jika Anda ingin mereka masuk hitungan. Semua orang dalam pembagian memerlukan akun gratis dan harus berada di grup. Untuk orang yang hanya punya uang tunai, Priya bisa menerimanya dan memasukkan hadiah sebesar yang masih harus dibayar grup. Misalnya, jika Sam memberinya £40 tunai, ia akan memasukkan £200 dan membaginya 60, 60, dan 80 antara dirinya, Omar, dan Lena."
    - q: "Bisakah jajak pendapat menentukan berapa yang diberikan tiap orang?"
      a: "Tidak. Jajak pendapat menyepakati satu angka untuk seluruh grup, seperti anggaran. Bagian tiap orang Anda sepakati bersama, lalu ketik ke pengeluaran sebagai **Jumlah pasti**."
