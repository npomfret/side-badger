      sideBadger: رایگان.
      source: pro-help
    - feature: هزینه در روز
      other: مرکز راهنمای خودش می‌گوید کاربران رایگان هر روز می‌توانند تا 4 هزینه اضافه کنند. Pro محدودیت روزانه ندارد.
      sideBadger: بدون محدودیت روزانه.
      source: pro-help
    - feature: نقش‌ها و مجوزهای گروه
      other: مرکز راهنمایش می‌گوید مدیر گروه و مجوزهای ویژه را پشتیبانی نمی‌کند.
      sideBadger: مدیر، عضو و بیننده. دو پیش‌فرض یا مجوزهای خودتان، تأیید برای پیوستن و قفلی برای وقتی که تمام شد.
      source: permissions-help
    - feature: اسکن رسید
      other: یکی از امکانات Pro. عکس رسید را اسکن می‌کند و قلم‌بندی Pro به شما اجازه می‌دهد قلم‌ها را به افراد اختصاص دهید.
      sideBadger: رایگان، بدون اعتبار اسکن. جمع کل، تاریخ و مکان را برای بررسی شما پر می‌کند و قلم‌ها را به افراد اختصاص نمی‌دهد.
      source: pro
    - feature: تبدیل ارز
      other: یکی از امکانات Pro. روی «Convert» بزنید تا Splitwise هزینه‌های یک گروه را با نرخ تبدیل همان لحظه به ارز پیش‌فرض شما تبدیل کند.
      sideBadger: رایگان. هر هزینه را همان موقع ورود تبدیل کنید، با یک نرخ تبدیل روز یا نرخی که واقعاً گرفته‌اید. مبلغ اصلی روی هزینه می‌ماند.
      source: currencies-help
    - feature: ارزها و زبان‌ها
      other: 100 ارز یا بیشتر و 7 زبان یا بیشتر، آن‌طور که صفحه اصلی‌اش می‌گوید.
      sideBadger: 133 ارز و 39 زبان. هر عضو گروه می‌تواند زبان خودش را انتخاب کند.
      source: home
    - feature: کجا از آن استفاده می‌کنید
      other: برنامه برای iPhone و Android، و وب.
      sideBadger: در مرورگر شما. وارد شوید و بعد آن را به صفحه اصلی گوشی اضافه کنید تا مثل یک برنامه باز شود. در فروشگاه‌های برنامه نیست.
      source: home
    - feature: روش‌های تقسیم
      other: مساوی، با مبلغ دقیق، با درصد، با سهم، با تعدیل یا قلم‌به‌قلم.
      sideBadger: مساوی، با مبلغ دقیق یا با درصد، با یک پرداخت‌کننده برای هر هزینه. نه با سهم و نه قلم‌به‌قلم.
      source: split-help
    - feature: کار آفلاین
      other: حالت آفلاین را جزو امکانات اصلی‌اش فهرست کرده است.
      sideBadger: نه. به اتصال نیاز دارد.
      source: home
    - feature: پرداخت‌ها و بانک شما
      other: "در برخی جاها می‌تواند از داخل برنامه پول بفرستد: Splitwise Pay در ایالات متحده، Venmo برای مانده‌های دلار آمریکا، PayPal، و Pay by Bank (که یک حساب جاری شخصی را وصل می‌کند) در چند کشور منتخب اروپایی."
      sideBadger: هرگز به پول شما دست نمی‌زند و اطلاعات بانکی شما را نمی‌خواهد. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را ثبت کنید.
      source: payments-help
    - feature: نمودارها و تقسیم‌های پیش‌فرض
      other: هر دو از امکانات Pro هستند.
      sideBadger: هیچ‌کدام.
      source: pro
faq:
  heading: پرسش‌ها
  items:
    - q: آیا Side Badger جایگزین رایگانی برای Splitwise است؟
      a: "برای تقسیم صورت‌حساب در یک گروه، بله، و فقط محاسبات نیست: نظر، سؤال، لیست، نظرسنجی و نقش‌های گروه، با اسکن رسید و تبدیل ارز رایگان. اگر برنامه فروشگاه برنامه، کار آفلاین یا پرداخت داخل برنامه لازم دارید، Splitwise این‌ها را انجام می‌دهد و Side Badger نه."
    - q: جزئیات Splitwise از کجا می‌آید؟
      a: "از صفحه‌های خود Splitwise: صفحه اصلی، صفحه Pro و مرکز راهنمایش. هر ردیف جدول به صفحه‌ای که از آن آمده لینک دارد و تاریخ بالای جدول می‌گوید چه زمانی آن‌ها را خوانده‌ایم. هر سه ماه یک بار بررسی‌شان می‌کنیم."
    - q: آیا Side Badger رایگان می‌ماند؟
      a: همه‌چیز در Side Badger امروز رایگان است. اگر روزی این تغییر کند، قبلاً به شما اطلاع می‌دهیم. [صفحه قیمت‌ها](page:pricing) جزئیات را دارد.
    - q: آیا همه اعضای گروه من باید عوض کنند؟
      a: بله. هر عضو یک گروه به یک حساب رایگان Side Badger نیاز دارد و با لینک یا کد QR می‌تواند بپیوندد.
    - q: آیا Side Badger برنامه موبایل دارد؟
      a: "در فروشگاه برنامه نه. در مرورگر شما اجرا می‌شود: روی گوشی وارد شوید و بعد آن را به صفحه اصلی گوشی اضافه کنید تا مثل یک برنامه باز شود. [نحوه کار](page:how-it-works) نشان می‌دهد چطور."
