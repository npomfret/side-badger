faq:
  heading: "자주 묻는 질문"
  items:
    - q: "계산기는 무료인가요?"
      a: "네. 무료이고, 광고도 일일 한도도 없습니다. 계정도 필요 없어요."
    - q: "입력한 내용이 저장되나요?"
      a: "아니요. 아무것도 저장되지도, 어디로 전송되지도 않습니다. 금액을 남기려면 링크 복사 버튼을 눌러 링크를 어딘가에 저장해 두세요."
    - q: "복사한 링크는 누가 볼 수 있나요?"
      a: "링크를 가진 사람은 누구나 볼 수 있어요. 금액은 주소의 # 뒤, 링크 안에 그대로 들어 있으니, 볼 수 있어야 하는 사람에게만 공유하세요."
    - q: "돈을 옮겨 주나요?"
      a: "아니요. 누가 누구에게 지불해야 하는지 계산할 뿐이고, 지불은 원하는 방법으로 서로 하면 돼요. 사이드 배저도 여러분의 돈을 절대 건드리지 않습니다. [정산하기](page:feature/settle-up)를 참고하세요."
    - q: "두 가지 통화로 결제한 여행도 나눌 수 있나요?"
      a: "여기서는 안 돼요. 계산 하나에 통화는 하나뿐이거든요. 그룹에서는 통화마다 잔액을 따로 관리합니다. [여러 통화](page:feature/multiple-currencies)를 참고하세요."
    - q: "금액의 합이 맞지 않으면요?"
      a: "계산기가 지출 아래에 알려 주고, 합이 맞을 때까지 결과를 보여 주지 않아요. 정확한 금액은 합이 총액과 같아야 하고, 비율은 합이 100이어야 합니다."
