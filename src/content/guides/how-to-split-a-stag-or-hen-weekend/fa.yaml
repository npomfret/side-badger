meta:
  title: "تقسیم هزینه آخر هفته مجردی داماد یا عروس | Side Badger"
  description: "مهمان افتخاری هیچ نمی‌دهد و دوشنبه هنوز همه با هم حرف می‌زنند. چطور هزینه آخر هفته مجردی را تقسیم کنیم، با حساب‌وکتاب."
h1: "تقسیم هزینه آخر هفته مجردی داماد یا عروس"
navLabel: "آخر هفته مجردی"
lead: "مهمان افتخاری هیچ نمی‌دهد، پس بقیه گروه هر هزینه را [مساوی](page:feature/split-expenses) بین خودشان تقسیم می‌کنند. کسانی را که از بعضی هزینه‌ها رد شدند از همان‌ها کنار بگذارید و مهمان افتخاری را بیرون گروه نگه دارید تا سورپرایز سالم بماند."
cta:
  heading: "حساب را نگه دارید، سورپرایز را هم"
  body: "یک گروه بسازید، لینک را برای همه جز مهمان افتخاری بفرستید و هر هزینه را همان لحظه اضافه کنید. Side Badger رایگان است، بدون تبلیغات و بدون محدودیت روزانه."
sections:
  - heading: "چهار دوست و یک سورپرایز"
    body: "هانا، ایلا، جس و کت گریس را برای آخر هفته مجردی‌اش می‌برند. گریس مهمان افتخاری است، پس برای هیچ چیز پول نمی‌دهد. او در گروه هم نیست، پس نمی‌تواند ببیند دوستانش برای او چقدر خرج می‌کنند. هانا کلبه را رزرو می‌کند، ایلا هزینه روز اسپا را می‌دهد، جس شام را حساب می‌کند و کت تاکسی را. تا یکشنبه همه برای چیزی پول داده‌اند و هیچ‌کس نمی‌تواند بگوید چه کسی جلو است. حساب برای مجردی داماد و مجردی عروس یکی است، هر که مهمان افتخاری باشد."
  - heading: "بر اساس کسانی که پول می‌دهند تقسیم کنید، نه کسانی که آنجا هستند"
    body: "سهم مهمان افتخاری ناپدید نمی‌شود. بین بقیه پخش می‌شود. کلبه £720 هزینه دارد و چهار دوست پولش را می‌دهند، پس هر نفر £180 است و جای گریس از قبل در این عدد حساب شده. شام £260 است، پس هر نفر £65. تاکسی £44 است، پس هر نفر £11. اگر کسی از چیزی رد شود، فقط از همان هزینه کنار گذاشته می‌شود. کت اسپا را رد می‌کند، پس £360 آن، که جای گریس را هم می‌پوشاند، بین هانا، ایلا و جس به £120 برای هر نفر تقسیم می‌شود. همه را جمع بزنید و هانا، ایلا و جس هرکدام £376 از آخر هفته را بدهکارند و کت £256."
  - heading: "در Side Badger راه بیندازیدش"
    items:
      - "برای آخر هفته یک گروه بسازید و اسمی خسته‌کننده برایش بگذارید، مثل «آخر هفته کلبه». گریس عضو نیست و فقط اعضای یک گروه می‌توانند آن را ببینند."
      - "**دعوت دیگران** را انتخاب کنید و لینک را بفرستید، یا کد QR را نشان دهید، فقط جایی که گریس نبیند. لینک پیش از پیوستن هر کس پیش‌نمایشی از گروه نشان می‌دهد. انتخاب کنید چه مدت اعتبار داشته باشد، از 15 دقیقه تا 5 روز. لینک قدیمی تا وقتی منقضی نشده کار می‌کند، پس بیشتر از آنچه لازم دارید نگذارید بماند."
      - "برای هر هزینه **افزودن هزینه** را انتخاب کنید، مبلغ را وارد کنید و زیر **چه کسی پرداخت کرد؟** پرداخت‌کننده را انتخاب کنید. زیر **تقسیم بین** کسانی را که پول می‌دهند تیک بزنید و هر کس را که از آن رد شده کنار بگذارید، مثل کت برای اسپا. زیر **نحوه تقسیم** گزینه **به طور مساوی** را انتخاب کنید."
      - "وقتی به خانه رسیدید بخش **موجودی‌ها** در گروه را باز کنید. Side Badger نشان می‌دهد چه کسی به چه کسی بدهکار است و فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد. اینجا سه پرداخت است: کت £212 به هانا می‌پردازد، جس £116 به هانا می‌پردازد و ایلا £16 به هانا می‌پردازد. هر طور دوست دارید به هم پرداخت کنید، بعد با **تسویه حساب** هر پرداخت را ثبت کنید."
  - heading: "پیش از رزرو، یک بودجه و یک بیعانه"
    body: "پیش از آنکه کسی رزرو کند روی بودجه توافق کنید. **افزودن نظرسنجی** را انتخاب کنید، بپرسید گروه برای کلبه چقدر خرج می‌کند و چند عدد را به‌عنوان گزینه بگذارید. هنگام ساختن نظرسنجی **رأی‌گیری ناشناس** را روشن کنید تا معلوم نباشد چه کسی به چه چیزی رأی داده، که کسی مجبور نشود بلند از بودجه کمتر دفاع کند. وقتی همه رأی دادند نظرسنجی را ببندید تا برنده دیده شود. بعد نوبت بیعانه است. هر که رزرو می‌کند آن را می‌پردازد و به‌عنوان هزینه اضافه می‌کند، مساوی تقسیم‌شده، و مبلغ باقی‌مانده وقتی سررسید می‌شود به‌عنوان هزینه دوم وارد می‌شود. بقیه می‌توانند سهمشان را همان لحظه بفرستند و پرداخت را ثبت کنند، یا تا شمارش نهایی صبر کنند. در هر دو صورت مانده‌ها یکی درمی‌آیند."
  - heading: "وقتی کسی فقط برای یک شب می‌آید"
    body: "دوستی که فقط برای شنبه می‌رسد نباید پول جمعه را بدهد. او را از هزینه‌هایی که در آن‌ها نبوده کنار بگذارید. جایی که هزینه به مدت ماندن هر نفر بستگی دارد، مثل یک اتاق، زیر **نحوه تقسیم** گزینه **مبالغ دقیق** را انتخاب کنید و سهم هر نفر را بنویسید که باید جمعش برابر کل شود. اول قیمت هر نفر در هر شب را حساب کنید، بعد در تعداد شب‌هایی که هر نفر می‌ماند ضرب کنید. صفحه [سفرهای گروهی](page:use-case/group-trips) درباره هزینه‌هایی که برای همه یکسان نیست بیشتر دارد."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "هرگز پول جابه‌جا نمی‌کند. با انتقال بانکی، نقد یا هر روشی که به کارتان می‌آید به هم پرداخت می‌کنید، بعد پرداخت را ثبت می‌کنید تا مانده‌ها برای همه به‌روز شوند."
      - "یادآوری پرداخت نمی‌فرستد. یک تلنگر دوستانه در چت گروه هنوز با یک آدم است."
      - "هر هزینه یک پرداخت‌کننده دارد و Side Badger نمی‌تواند یک رسید را خط‌به‌خط تقسیم کند. اگر دو کارت برای کلبه پرداخته‌اند، آن را دو هزینه وارد کنید. اگر بعضی‌ها سر شام چیزهای اضافه سفارش دادند، آن اضافه‌ها را هزینه جدا وارد کنید."
      - "حساب پول را نگه می‌دارد، نه برنامه سفر را. نظرسنجی‌ها و نظرها روی هزینه‌ها می‌مانند، پس برنامه آخر هفته در چت گروهتان می‌ماند."
