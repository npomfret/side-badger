meta:
  title: "Помоћ и подршка | Side Badger"
  description: "Заборављена лозинка, веза која не ради, погрешно забележена уплата? Кратки одговори на оно у чему људи запну у Side Badger-у и како до нас."
h1: "Помоћ и подршка, без чекања на линији"
navLabel: "Помоћ и подршка"
lead: "Кратки одговори на ствари у којима људи запну, од заборављене лозинке до трајног затварања групе. Сваки води на страницу која објашњава више. Не налазиш свој? Јави нам из апликације или нам пошаљи поруку."
cta:
  heading: "Тражиш помоћ, а остајеш због поделе?"
  body: "Још немаш кориснички налог? Оснуј групу, пошаљи везу и додај први трошак. Бесплатно, без огласа и без дневних ограничења."
groups:
  - heading: "Пријава"
    items:
      - q: "Заборављена лозинка?"
        a: "Деси се и најбољим јазавцима. На екрану **Пријава** изабери **Заборавили сте лозинку?**, унеси имејл свог налога, а затим прати везу у имејлу који ти шаљемо да изабереш нову. [Како ради](page:how-it-works) покрива шта још треба налогу."
      - q: "Регистрација је готова, али не могу ништа да додам. Зашто?"
        a: "Најчешће твој имејл још није потврђен, па отвори везу у имејлу за потврду или изабери **Поново пошаљи е-пошту за потврду** на траци са подсетником да добијеш нову. Ако је имејл потврђен, група је можда закључана или је дозволе не дозвољавају, а посматрач види све и ништа не мења, као што објашњавају [групе и дозволе](page:feature/groups-and-permissions)."
      - q: "Како да променим имејл или лозинку?"
        a: "У **Подешавањима** изабери **Промени е-пошту** или **Промени лозинку**. Обоје прво траже твоју тренутну лозинку, а нова имејл адреса мора се потврдити везом коју јој шаљемо. [Како ради](page:how-it-works) покрива налоге."
      - q: "Могу ли да се пријавим преко Гугла или Епла?"
        a: "Не. Све што ти треба је имејл адреса и лозинка од најмање 12 знакова, а на свом телефону или рачунару можеш означити **Запамти ме**. Страница [веб апликације](page:feature/web-app) покрива остало о почетку рада."
  - heading: "Придруживање групи"
    items:
      - q: "Неко ми је послао везу за позивницу. Како да се придружим?"
        a: "Отвори је, па се пријави или направи бесплатан кориснички налог. Видећеш преглед групе, изабраћеш име под којим те тамо виде и притиснути **Придружи се групи**. [Групе и дозволе](page:feature/groups-and-permissions) показују цео пут унутра."
      - q: "Пише „Чекање на одобрење“. Је ли нешто пошло наопако?"
        a: "Нимало. Ова група има администратора који пушта сваку особу унутра, па је твој захтев отишао њеним администраторима и не видиш шта је унутра док га један од њих не одобри. Љубазно подсећање уживо је дозвољено, а [групе и дозволе](page:feature/groups-and-permissions) објашњавају одобравање."
      - q: "Пише да је веза неважећа или да је истекла."
        a: "Везе за позивницу трају колико је изабрао ко их је направио, од 15 минута до 5 дана. Затражи нову везу од неког у групи или QR код ако сте у истој просторији. [Како ради](page:how-it-works) покрива позивнице."
  - heading: "Трошкови"
    items:
      - q: "Како да додам трошак?"
        a: "Отвори групу и изабери **Додај трошак**. Реци шта је било, колико, ко је платио и ко је делио, а затим подели једнако, по тачним износима или по процентима. [Подела трошкова](page:feature/split-expenses) пролази кроз сваку опцију."
      - q: "Може ли се кирија понављати сваког месеца?"
        a: "Не сама од себе, јер нема понављајућих трошкова. Отвори прошломесечни и изабери **Копирај трошак**, па образац стиже попуњен, спреман за нови датум и све што се променило. [Подела трошкова](page:feature/split-expenses) има више о копирању."
      - q: "Износ је погрешно укуцан. Могу ли да га исправим?"
        a: "Да. Измени трошак, под условом да ти дозволе групе то допуштају и да група није закључана. Ранија верзија се чува, па нико не мора да верује на реч шта се променило, као што објашњава [подела трошкова](page:feature/split-expenses)."
      - q: "Трошак изгледа погрешно и није мој. Шта сад?"
        a: "Изабери **Имам питање** на њему и реци зашто, па цео трошак остаје ван свачијих стања док особа која је питала, или администратор, не затвори питање. Нема таквог дугмета? Питање могу поставити само људи укључени у трошак, администратор прво мора да укључи **Дозволи питања о трошковима** у подешавањима групе, а [водич о оспореном трошку](page:guide/what-to-do-when-someone-disputes-a-shared-expense) има дипломатију."
  - heading: "Уплате"
    items:
      - q: "Да ли Side Badger шаље новац?"
        a: "Не, Side Badger никад не премешта новац. Платите једни другима како год желите, банковним трансфером, готовином или како вам одговара, па забележи уплату да се стања изједначе. [Како се поравнати после групног путовања](page:guide/how-to-settle-up-after-a-group-trip) пролази кроз то од почетка до краја."
      - q: "Како да забележим уплату?"
        a: "У групи изабери **Поравнај**, реци ко је платио и ко је примио, унеси износ или пусти да га попуни дугме **Брзо поравнање**, и изабери **Забележи поравнање**. Платио си само део? Забележи оно што је плаћено, а остатак остаје на стању, као што објашњава [поравнање](page:feature/settle-up)."
      - q: "Уплата је погрешно забележена. Могу ли да је исправим?"
        a: "Ко ју је забележио може је изменити из историје **Поравнања** у групи, а он или администратор може је обрисати, чиме се уклања са стања. Уплата у којој учествује неко ко је у међувремену напустио групу не може се мењати. [Поравнање](page:feature/settle-up) покрива историју."
  - heading: "Обавештења и почетни екран"
    items:
      - q: "Како да укључим обавештења?"
        a: "Укључи **Push обавештења** у **Подешавањима** и дозволи их кад те прегледач пита. Ако их је прегледач већ блокирао, прво их дозволи у његовим подешавањима. Сваки уређај се укључује посебно и испорука није загарантована, па обавештење схвати као подсетник, а не обећање, као што објашњава страница [веб апликације](page:feature/web-app)."
      - q: "Зашто обавештења не раде на мом iPhone-у?"
        a: "На iPhone-у или iPad-у раде само у апликацији додатој на почетни екран, никад у картици прегледача. Додај је, отвори је иконом са почетног екрана, па их укључи у **Подешавањима**. [Планирање заједно](page:feature/plan-together) показује о чему те обавештавају."
      - q: "Постоји ли апликација за преузимање?"
        a: "Не из продавнице апликација, јер Side Badger ради у твом прегледачу. Пријави се, па прати **Додај на почетни екран или у Dock** у **Подешавањима**, и отвара се као апликација, у сопственом прозору. Страница [веб апликације](page:feature/web-app) има кораке за сваки уређај."
  - heading: "Напуштање, архивирање, закључавање и затварање"
    items:
      - q: "Како да напустим групу?"
        a: "Поравнај се, па изабери **Напусти групу**. Не можеш отићи док дугујеш или ти се дугује новац, макар у једној валути, док трошак у коме учествујеш има отворено питање, нити ако си последњи администратор или једини члан, а за повратак је потребна нова позивница. [Групе и дозволе](page:feature/groups-and-permissions) имају појединости."
      - q: "Како да склоним стару групу са контролне табле?"
        a: "Изабери **Архивирај групу**. Нестаје са твоје контролне табле и ничије туђе, и даље је можеш отворити и користити, а **Врати групу из архиве** је враћа. [Групе и дозволе](page:feature/groups-and-permissions) пореде архивирање, закључавање и затварање."
      - q: "Путовање је готово. Можемо ли спречити да се бројеви мењају?"
        a: "Да. Администратор може укључити **Закључај групу** у подешавањима групе, па нико не може додавати ни мењати трошкове, бележити нове уплате ни мењати спискове и анкете док администратор не откључа. Сви и даље могу читати групу и њену историју, а ниједан закаснели такси се не увлачи, као што објашњавају [групе и дозволе](page:feature/groups-and-permissions)."
      - q: "Могу ли да обришем групу?"
        a: "Администратор је може затворити помоћу **Затвори групу**, након што укуца име групе ради потврде. Затварање је трајно и група постаје недоступна свима, па ако је само желиш склонити с очију, архивирај је. [Групе и дозволе](page:feature/groups-and-permissions) имају ситна слова."
contact:
  heading: "И даље не иде?"
  items:
    - q: "Грешка у апликацији или нешто да променимо?"
      a: "Јави нам из апликације. У менију налога изабери **Повратне информације**, затим **Пошаљи повратне информације**, па **Пријава грешке**, **Помоћ** или **Нова функција**. Приложи снимак екрана ако помаже, а кад одговоримо, наћи ћеш одговор у истој преписци."
    - q: "Више волиш имејл?"
      a: "Пиши на адресу испод. Реци о којој је групи реч, шта си урадио и шта си очекивао да се деси. Изјадај се слободно; лозинке нису дозвољене, па своју никад не шаљи."
  emailLabel: "Пиши нам на"
  email: support@sidebadger.me
