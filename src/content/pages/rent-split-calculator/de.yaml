faq:
  heading: Fragen
  items:
    - q: Was ist fairer, Zimmergröße oder Einkommen?
      a: Keins von beiden ist immer fairer. Die Zimmergröße passt zu Mitbewohnern, die für den Platz zahlen, in dem sie schlafen. Das Einkommen passt zu Paaren und Freunden mit sehr unterschiedlichem Gehalt. Einigt euch, bevor die erste Miete fällig wird, nicht danach.
    - q: Sollen die Rechnungen genauso geteilt werden?
      a: Bei Mitbewohnern meistens nicht. Alle nutzen Energie und Internet, also ist gleichmäßig einfacher, wie im Beispiel. Beim Einkommen gibt der Rechner den Rechnungen dieselben Anteile wie der Miete.
    - q: Kann ich Quadratfuß nutzen?
      a: Ja. Wähle ft² und gib deine Flächen in Quadratfuß ein. Die Einheit ist nur eine Beschriftung, und die Anteile kommen gleich heraus, solange alle dieselbe nutzen.
    - q: Ist der Rechner kostenlos?
      a: Ja. Kostenlos. Keine Werbung. Keine Tageslimits. Ein Konto brauchst du dafür auch nicht.
