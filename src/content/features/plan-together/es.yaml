faq:
  heading: Preguntas
  items:
    - q: ¿Pueden ser anónimos los votos?
      a: Sí. Activa **Votación anónima** al crear la encuesta y se oculta quién votó por qué. Decídelo antes del primer voto, porque después no se puede cambiar.
    - q: ¿Puede una encuesta cerrarse sola?
      a: No. Una encuesta no tiene fecha límite, así que la persona que la creó elige **Cerrar encuesta** cuando el grupo ha decidido. Si el grupo se lo piensa mejor, **Reabrir encuesta** la trae de vuelta.
    - q: ¿Cuántos artículos puede tener una lista?
      a: Hasta 200 artículos por lista y hasta 100 listas por grupo. Cada artículo puede tener hasta 500 caracteres, que es mucha leche de avena.
    - q: ¿Quién puede cerrar una pregunta y qué pasa mientras tanto con el gasto?
      a: La persona que preguntó, o un administrador del grupo. Mientras una pregunta está abierta, todo el gasto queda fuera de los saldos de todos. Vuelve a entrar cuando se cierra la última pregunta abierta sobre él, o cuando una edición saca del gasto a la persona que preguntó.
    - q: ¿Puedo usar las listas y los comentarios como app de tareas o como chat de grupo?
      a: No. Los comentarios, las listas y las encuestas son para el dinero del grupo, que es lo que piden los [términos](page:terms). Piensa en listas de la compra, encuestas de presupuesto y «¿por qué son 45 £ esto?».
    - q: ¿Me enviará Side Badger correos sobre la actividad?
      a: No. No hay alertas por correo electrónico ni por mensaje de texto para la actividad. Puedes activar las notificaciones push en cada dispositivo, y la campana de notificaciones de la app muestra lo nuevo.
