sections:
  - heading: "Samo ljudje, ki so bili zraven"
    body: "Strošek razdeli med vse ali samo med osebe, ki so ga delile. Ljudi izpusti iz stroškov, pri katerih niso sodelovali, in stanja bodo to upoštevala. Sostanovalec, ki ga ves teden ni bilo, ne dolguje za hrano s seboj, kar bodo [sostanovalci](page:use-case/housemates) prepoznali kot osnovno pravičnost."
  - heading: "Podrobnosti, ki pozneje prihranijo prepire"
    items:
      - "Nastavi **datum** in po želji uro. Bližnjice, kot so danes, včeraj, zjutraj in sinoči, prihranijo nekaj tipkanja."
      - "Dodaj do tri **oznake** za združevanje stroškov, na primer živila ali potovanje."
      - "Dodaj **kraj**. Prilepi povezavo do zemljevida in ime kraja se izpolni samo."
      - "Dodaj **opombo** z zgodbo za številko, z nekaj oblikovanja, če zgodba to zahteva."
      - "Priloži do tri **račune** kot fotografije ali PDF, da dokaz ostane pri strošku."
      - "Uporabljaj **komentarje**, da pogovor ostane ob strošku, o katerem govori, ne pa v klepetu, v katerega se nihče ne vrača."
  - heading: "Kopiraj, uredi in poglej, kaj se je spremenilo"
    body: "Kopiraj najemnino prejšnjega meseca, namesto da bi jo znova vpisoval, in spremeni, kar je drugače. Če je bila številka napačna, uredi strošek. Prejšnja različica se ohrani, urejanje pa se pokaže v dejavnosti skupine, zato nihče ne spremeni številke tiho. Kaj lahko kdo ureja, je odvisno od dovoljenj skupine."
  - heading: "Ko se kaj ne zdi prav"
    body: "Skupina lahko vklopi vprašanja o stroških. Vsak, ki je zajet v strošku, lahko postavi vprašanje in pove zakaj, strošek pa ostane zunaj stanj, dokler ga oseba, ki je vprašala, ali skrbnik ne zapre. Privzeto je izklopljeno, skrbnik pa ga vklopi za skupino. Primerno je za [dogodke in praznovanja](page:use-case/events-and-celebrations), kjer postane polog, ki se ga nihče ne spomni, nenadoma stvar vseh."
limits:
  heading: "Omejitve"
  items:
    - "Za vsak strošek plača ena oseba. Če sta plačali dve, zabeleži dva stroška."
    - "Delitve po postavkah ali po deležih ni. Na voljo so enako, točni zneski in odstotki."
    - "Odstotki morajo skupaj dati 100."
    - "Strošek je lahko do 999.999,99 v svoji valuti, z običajnim številom decimalnih mest te valute."
    - "Stroški se ne ponavljajo sami. Namesto tega kopiraj strošek prejšnjega meseca."
    - "Datumi ne smejo biti v prihodnosti ali starejši od 10 let."
    - "Strošek, v katerem je oseba, ki je zapustila skupino, postane samo za branje."
useCasesHeading: "Kje takšna delitev pomaga"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali lahko dve osebi plačata en strošek?"
      a: "Ne v enem strošku. Zabeleži dva, po enega za vsakega plačnika, in stanja bodo enaka."
    - q: "Ali lahko razdelim račun po postavkah?"
      a: "Ne. Delitev je enaka, po točnih zneskih ali po odstotkih. Pri računu z različnimi postavkami vpiši, koliko dolguje vsaka oseba, kot točne zneske."
    - q: "Ali lahko nastavim privzeto delitev?"
      a: "Ne. Kopiraj prejšnji strošek, da uporabiš njegovo delitev, in spremeni, kar je drugače."
    - q: "Ali se računi lahko ponavljajo vsak mesec?"
      a: "Ne. Namesto tega kopiraj strošek prejšnjega meseca, kar vzame nekaj sekund."
    - q: "Kdo lahko ureja strošek?"
      a: "Tisti, ki mu to dovoljujejo dovoljenja skupine. Vsako urejanje se pokaže v dejavnosti skupine, zato spremembe nikoli niso tihe."
    - q: "Kaj se potem zgodi s stanji?"
      a: "Posodabljajo se, ko prihajajo stroški, [poravnava](page:feature/settle-up) pa jih spremeni v kratek seznam plačil. Če je strošek v drugi valuti, glej [več valut](page:feature/multiple-currencies)."
