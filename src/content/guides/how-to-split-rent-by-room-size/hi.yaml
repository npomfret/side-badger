meta:
  title: "कमरे के आकार के हिसाब से किराया कैसे बांटें | Side Badger"
  description: "बड़ा कमरा, बड़ा हिस्सा। साझा कमरे अलग रखें, बाकी किराया फ़्लोर एरिया से बांटें और प्रतिशत एक बार डालें। तीन रूममेट्स के हिसाब के साथ।"
h1: "कमरे के आकार के हिसाब से किराया कैसे बांटें"
navLabel: "कमरे के आकार से किराया"
lead: "तय करें कि किराए का कितना हिस्सा साझा कमरों का है और उसे बराबर बांटें, फिर बाकी को हर बेडरूम के फ़्लोर एरिया के हिसाब से बांटें। प्रतिशत को पूरी संख्या में गोल करें, उन्हें Side Badger में किराए पर एक बार डालें, और हर महीने वह खर्च कॉपी करें।"
cta:
  heading: "किराया एक बार डालें"
  body: "मुफ्त अकाउंट बनाएं, फ्लैट के लिए ग्रुप शुरू करें और तय किए हुए प्रतिशत के साथ किराया डालें। अगला महीना बस एक कॉपी है। पहले टूर चाहिए? [यह कैसे काम करता है](page:how-it-works) देखें, या जानें कि [मुफ्त में क्या-क्या मिलता है](page:pricing)।"
sections:
  - heading: "तीन लोग, एक फ्लैट, एक बहस"
    body: "Priya, Tom और Aisha £1,950 महीने के किराए पर एक फ्लैट शेयर करते हैं। एक साल तक उन्होंने इसे तीन बराबर हिस्सों में बांटा, क्योंकि यह आसान था। फिर Aisha ने अपना बेडरूम नापा। Priya का कमरा 16 m² का है, Tom का 12 m² और Aisha का 10 m², यानी Aisha उतना ही दे रही थी जितना Priya अपने कमरे के लिए देती थी, जबकि Aisha का कमरा Priya के कमरे से एक-तिहाई से ज़्यादा छोटा है। किसी ने कोई बेजा बात नहीं की थी। बस किसी ने हिसाब नहीं लगाया था। टेकअवे खाते हुए उन्होंने सबसे पहले एक नियम तय किया। किराए का 40% रसोई, बाथरूम और लाउंज की कीमत है, जिन्हें तीनों इस्तेमाल करते हैं।"
  - heading: "तरीका, हिसाब के साथ"
    body: "चार कदम, एक नापने का फीता और फ़ोन का कैलकुलेटर।"
    items:
      - "**साझा हिस्सा अलग रखें।** ग्रुप तय करता है कि किराए का कितना हिस्सा उन कमरों का है जिन्हें सब इस्तेमाल करते हैं। इस फ्लैट में वह 40% है, यानी तीन लोगों में हर एक का 13.33%।"
      - "**बाकी को फ़्लोर एरिया से बांटें।** बाकी 60% बेडरूम के आकार के हिसाब से जाता है। बेडरूम मिलाकर 38 m² के हैं (16 + 12 + 10), इसलिए Priya का हिस्सा 60% × 16/38 है, यानी 25.26%।"
      - "**दोनों हिस्से जोड़ें।** Priya: 25.26% + 13.33% = 38.6%। Tom: 60% × 12/38 = 18.95%, उसमें 13.33% जोड़ें तो 32.3%। Aisha: 60% × 10/38 = 15.79%, उसमें 13.33% जोड़ें तो 29.1%।"
      - "**गोल करें और जांचें।** पूरे प्रतिशत टाइप करना और उन पर बहस करना आसान है, इसलिए 38.6% का 39%, 32.3% का 32% और 29.1% का 29% हो जाता है। जांचें कि 39 + 32 + 29 का जोड़ 100 है। अगर गोल करने पर आंकड़ा 99 या 101 आए, तो ग्रुप तय करता है कि किसका आंकड़ा एक अंक खिसकेगा।"
  - heading: "फ्लैट का महीना, पढ़कर"
    body: "39%, 32% और 29% पर किराया £760.50, £624.00 और £565.50 बनता है। मकान मालिक को Priya ने पेमेंट किया, इसलिए पूरे महीने में उसे £1,142.50 मिलने हैं, जबकि Tom को £566.00 और Aisha को £576.50 देने हैं। Side Badger दो पेमेंट सुझाता है, दोनों Priya को।"
  - heading: "Side Badger में सेट करें"
    body: "एक शाम, जिसका ज़्यादातर हिस्सा 40% पर बहस में निकल जाता है।"
    items:
      - "**ग्रुप बनाएं।** डैशबोर्ड पर **समूह बनाएं** चुनें और उसे फ्लैट का नाम दें। **दूसरों को आमंत्रित करें** चुनें और लिंक या QR कोड भेजें। सब साइन इन करते हैं या मुफ्त अकाउंट बनाते हैं, और वह नाम चुनते हैं जो वे इस ग्रुप में दिखाना चाहते हैं।"
      - "**किराया जोड़ें।** **व्यय जोड़ें** चुनें। विवरण और राशि डालें, और **किसने भुगतान किया?** में उसे चुनें जिसने मकान मालिक को पेमेंट किया। **विभाजित करें** में तीनों लोगों को रहने दें, फिर **विभाजन कैसे करें** में **प्रतिशत** चुनें और 39, 32 और 29 टाइप करें। अगर प्रतिशत का जोड़ 100 न हो, तो फ़ॉर्म बता देता है। **व्यय सहेजें** चुनें।"
      - "**बिल जोड़ें।** बिजली और ब्रॉडबैंड अलग खर्च हैं, जिनके पेमेंट करने वाले अपने हैं। **विभाजन कैसे करें** को **समान रूप से** पर रहने दें।"
      - "**अगले महीने कॉपी करें।** पिछले महीने का किराया खोलें और **व्यय कॉपी करें** चुनें। कॉपी में पेमेंट करने वाला, राशि और बंटवारा वही रहते हैं, और तारीख आज की हो जाती है। किराया बदला हो तो राशि बदलें, फिर **कॉपी बनाएं** चुनें।"
      - "**देखें किसे किसका देना है।** **शेष** सेक्शन यह दिखाता है। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर **हिसाब बराबर करें** में पेमेंट रिकॉर्ड करें।"
  - heading: "एन-सुइट, बॉक्स रूम और घर छोड़ते लोग"
    items:
      - "**एन-सुइट और बॉक्स रूम।** फ़्लोर एरिया बस शुरुआत है। जिस कमरे के साथ अपना बाथरूम हो, वह उतने ही क्षेत्रफल के बिना-बाथरूम वाले कमरे से ज़्यादा कीमती है, और जिस बॉक्स रूम में बस एक बिस्तर और एक उम्मीद भरी कुर्सी आती है वह कम कीमती है। सहमति से प्रतिशत बदलें, जांचें कि उनका जोड़ अब भी 100 है, और अंतिम आंकड़े ऐसी जगह लिख दें जहां पूरा फ्लैट देख सके।"
      - "**कोई महीने के बीच में घर छोड़े।** हिसाब लगाएं कि उस महीने हर किसी का कितना बनता है, और उस महीने का किराया **प्रतिशत** की जगह **सटीक राशियाँ** से डालें। राशियों का जोड़ किराए के बराबर होना चाहिए। यह उनके जाने से पहले करें। जब तक किसी का कुछ देना या पाना बाकी है वह ग्रुप नहीं छोड़ सकता, और जो खर्च किसी छोड़ चुके व्यक्ति से जुड़ा हो वह सिर्फ़ पढ़ने के लिए रह जाता है।"
      - "**कोई रहने आए।** दोबारा नापें, नए कमरों के आकार से हिसाब फिर से लगाएं और नए प्रतिशत अगले किराए से इस्तेमाल करें। पुराने महीने जैसे थे वैसे रहते हैं।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह आपके कमरे नहीं नापता और प्रतिशत नहीं चुनता। फ़्लोर एरिया और 40% ग्रुप को तय करने हैं।"
      - "इसमें दोहराए जाने वाले बिल नहीं हैं, इसलिए हर बार पिछले महीने का किराया कॉपी करें।"
      - "यह कभी पैसे नहीं भेजता और मकान मालिक को पेमेंट नहीं करता। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं और उसे रिकॉर्ड करते हैं।"
      - "यह नहीं जानता कि आपके किरायेदारी के समझौते में क्या लिखा है। यह ग्रुप के लोगों के बीच का हिसाब रखता है।"
exampleAfter: 2
