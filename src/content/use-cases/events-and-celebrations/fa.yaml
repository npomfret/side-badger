meta:
  title: "تقسیم هزینه‌های مهمانی، عروسی و کادوی گروهی"
  description: "هزینه‌های یک مهمانی، عروسی یا کادوی گروهی را وقتی هر کس مبلغ متفاوتی می‌دهد سهیم شوید. روی برنامه رأی بدهید، با مبلغ دقیق تقسیم کنید و ببینید چه کسی به چه کسی بدهکار است."
h1: "تقسیم هزینه‌های مهمانی، عروسی و کادوی گروهی"
navLabel: "مراسم و جشن‌ها"
lead: "بیعانه، تزئینات و چترهای اضطراری را تقسیم کنید. چیدمان میزها را به یک آدم شجاع‌تر بسپارید. Side Badger **اینکه چه کسی چقدر داده** را یک‌جا نگه می‌دارد تا برگزارکننده هم بتواند از مهمانی لذت ببرد."
cta:
  heading: "از جشن بعدی شروع کنید"
  body: "یک حساب بسازید، برای مراسم یک گروه درست کنید و لینک دعوت را بفرستید. Side Badger رایگان است، بدون تبلیغات و بدون محدودیت روزانه."
scenario:
  heading: "همه سهم می‌دهند، نه همیشه به یک اندازه"
  body: "یک نفر بیعانه سالن را می‌دهد، یکی دیگر کیک می‌خرد و سومی کادوی گروهی را با کارت خودش حساب می‌کند. بعضی مهمان‌ها همه‌چیز را می‌آیند و بعضی فقط شام. نگه داشتن حساب منصفانه این‌ها در یک رشته چت کاری است که کسی برایش درخواست نداده بود. یک گروه Side Badger همه را نگه می‌دارد، با هر ترکیبی از مبلغ‌ها، و به هر نفر نشان می‌دهد چقدر بدهکار است یا طلب دارد. برای مبانی [نحوه کار](page:how-it-works) را ببینید، یا برای یک مراسم ادامه دهید."
sections:
  - heading: "با هم تصمیم بگیرید"
    body: "پیش از آنکه پولی جابه‌جا شود، انتخاب را به یک **نظرسنجی** بسپارید. تا 10 گزینه اضافه کنید، مثل دو سالن یا سه ایده کادو، و بگذارید همه رأی بدهند. می‌توانید پنهان کنید چه کسی به چه چیزی رأی داده تا هر گزینه فرصت منصفانه بگیرد و برنده بعد از بسته شدن نظرسنجی دیده شود. کسی لازم نیست چهل پیام را به عقب برود تا بفهمد چه تصمیمی گرفته شده."
  - heading: "چه کسی در چه چیزی سهیم است"
    body: "همه یک اندازه نمی‌دهند و همه در هر هزینه سهم ندارند. یک هزینه را مساوی، درصدی یا **با مبلغ دقیق** تقسیم کنید تا سهم هر نفر همان عددی باشد که توافق کردید. هر کسی را که درگیر نبود کنار بگذارید، مثل مهمان‌هایی که شام را رد کردند یا دوستانی که به کادو نپیوستند. هر هزینه یک پرداخت‌کننده دارد و بقیه افراد تقسیم سهمشان را به او بدهکارند. جزئیات در صفحه [تقسیم هزینه‌ها](page:feature/split-expenses) است."
  - heading: "مدارک را نگه دارید"
    body: "به یک هزینه یادداشت اضافه کنید، مثلاً اینکه هزینه چه چیزی را پوشش می‌داد. نظرها **کنار هزینه‌ای** که درباره آن‌اند می‌مانند، پس پرسش «کیک £45 بود یا £54؟» و جوابش در یک جاست. نظرها تا 500 نویسه می‌شوند که برای پرسشی درباره بیعانه کافی است."
  - heading: "کنترل‌های برگزارکننده"
    body: "همکاری باز به هر عضو اجازه می‌دهد هزینه اضافه و ویرایش کند که برای یک کادوی کوچک خوب است. برای عروسی یا مهمانی بزرگ‌تر، پیش‌تنظیم **گروه مدیریت‌شده** را انتخاب کنید. مدیرها هر عضو جدید را تأیید می‌کنند و فقط سازنده‌ها و مدیرها می‌توانند هزینه‌ها را تغییر دهند. افراد را با لینک یا کد QR دعوت کنید؛ با روشن بودن تأیید، مدیر به هر نفر اجازه ورود می‌دهد، پس فهرست مهمان‌ها همان فهرست مهمان‌ها می‌ماند. وقتی مراسم تمام شد گروه را قفل کنید تا اعداد سر جایشان بمانند."
  - heading: "بعد از مهمانی تسویه کنید"
    body: "وقتی آخرین فاکتور رسید، مانده‌ها **چه کسی به چه کسی بدهکار است** را نشان می‌دهند و Side Badger فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد که همه را تسویه می‌کند. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را در گروه ثبت کنید. Side Badger هرگز پول جابه‌جا نمی‌کند، پس گروه حساب را نگه می‌دارد در حالی که انتقال‌ها در برنامه‌های بانکی خودتان انجام می‌شود. صفحه [تسویه حساب](page:feature/settle-up) نشان می‌دهد یک گره چطور به فهرست کوتاه تبدیل می‌شود."
