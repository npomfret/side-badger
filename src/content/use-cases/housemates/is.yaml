featuresHeading: "Eiginleikarnir sem heimili nota"
faq:
  heading: "Spurningar"
  items:
    - q: "Getur leigan endurtekið sig sjálfkrafa?"
      a: "Nei, það eru engir endurteknir reikningar. Afritaðu leigu síðasta mánaðar með nokkrum snertingum, breyttu dagsetningunni og þá ertu búin(n)."
    - q: "Getum við skipt eftir stærð herbergja?"
      a: "Já, í prósentum. Gefðu hverjum meðleigjanda hlut sem endurspeglar herbergið hans, svo lengi sem hlutirnir ná samtals 100. [Skipting útgjalda](page:feature/split-expenses) fjallar um hinar leiðirnar til að skipta."
    - q: "Hvað ef meðleigjandi flytur út með skuld?"
      a: "Hann getur ekki yfirgefið hópinn fyrr en hann hefur gert upp, því enginn getur farið á meðan hann skuldar eða á inni pening. Tölurnar haldast heiðarlegar þar til allir eru kvittir."
    - q: "Borgar Side Badger reikningana?"
      a: "Nei. Það heldur utan um stöðuna og leggur til stuttan lista yfir greiðslur. Þið borgið hvert öðru eins og ykkur hentar og skráið það svo, eins og [uppgjör](page:feature/settle-up) útskýrir."
    - q: "Getur einn meðleigjandi haldið bókhaldið?"
      a: "Já. Gerðu hann að stjórnanda og notaðu stýrðan hóp, þar sem nýir meðlimir þurfa samþykki og aðeins höfundar og stjórnendur geta breytt útgjöldum."
