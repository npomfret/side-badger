      other: "অফলাইন মোডকে নিজের মূল ফিচারগুলোর মধ্যে তালিকাভুক্ত করে।"
      sideBadger: "না। সংযোগ লাগে।"
      source: home
    - feature: "পেমেন্ট"
      other: "কিছু জায়গায় অ্যাপের ভেতর থেকেই টাকা পাঠানো যায়: যুক্তরাষ্ট্রে Splitwise Pay, মার্কিন ডলারের ব্যালেন্সের জন্য Venmo ও PayPal, আর বেছে নেওয়া কয়েকটি ইউরোপীয় দেশে Pay by Bank। অন্য জায়গায় বাইরে হওয়া পেমেন্ট আপনি রেকর্ড করেন।"
      sideBadger: "আপনার টাকা কখনও ছোঁয় না। যেভাবে খুশি একে অপরকে দিন, তারপর পেমেন্টটা রেকর্ড করুন।"
      source: payments-help
    - feature: "চার্ট আর ডিফল্ট ভাগ"
      other: "দুটোই Pro ফিচার।"
      sideBadger: "কোনোটাই নেই।"
      source: pro
faq:
  heading: "প্রশ্ন"
  items:
    - q: "Side Badger কি Splitwise-এর বিনামূল্যের বিকল্প?"
      a: "গ্রুপে বিল ভাগ করার জন্য, হ্যাঁ। রসিদ স্ক্যান, মুদ্রা রূপান্তর আর বিজ্ঞাপনহীনতা বিনামূল্যে, দৈনিক কোনো সীমা ছাড়া। নেটিভ অ্যাপ, অফলাইনে ব্যবহার, পুনরাবৃত্ত খরচ বা অ্যাপের ভেতরে পেমেন্ট দরকার হলে সেগুলো Splitwise করে, Side Badger করে না।"
    - q: "Splitwise-এর তথ্যগুলো কোথা থেকে নেওয়া?"
      a: "Splitwise-এর নিজের পৃষ্ঠাগুলো থেকে: এর হোম পেজ, Pro পৃষ্ঠা আর সহায়তা কেন্দ্র। টেবিলের প্রতিটি সারি যে পৃষ্ঠা থেকে এসেছে তার সঙ্গে যুক্ত, আর টেবিলের ওপরের তারিখ বলে আমরা কখন সেগুলো পড়েছি। প্রতি তিন মাসে আমরা আবার দেখি।"
    - q: "Side Badger কি বিনামূল্যে থাকবে?"
      a: "Side Badger-এর সবকিছু আজ বিনামূল্যে, আর কোনো পেইড স্তর নেই। এটা কখনও বদলালে আমরা আগে আপনাকে জানাব। বিস্তারিত আছে [দামের পৃষ্ঠায়](page:pricing)।"
    - q: "আমার গ্রুপের সবাইকে কি চলে আসতে হবে?"
      a: "হ্যাঁ। গ্রুপের প্রত্যেকের একটি বিনামূল্যের Side Badger অ্যাকাউন্ট লাগে, আর তারা লিঙ্ক বা QR কোড দিয়ে যোগ দিতে পারে।"
    - q: "Side Badger-এর কি মোবাইল অ্যাপ আছে?"
      a: "অ্যাপ স্টোরে নেই। এটি আপনার ব্রাউজারে চলে: ফোনে সাইন ইন করুন, তারপর হোম স্ক্রিনে যোগ করুন যাতে এটি অ্যাপের মতো খোলে। কীভাবে, তা দেখিয়ে দেয় [কীভাবে কাজ করে](page:how-it-works)।"
