meta:
  title: "Side Badger mājokļa biedriem, ceļojumiem un ballītēm"
  description: "Sadaliet izdevumus ar mājokļa biedriem, grupas ceļojumos, ballītēs, kāzās un kopīgām dāvanām. Skatiet, ko Side Badger dara katra veida grupai."
h1: "Side Badger jūsu veida grupai"
navLabel: "Pielietojums"
lead: "Mājokļa biedri, atvaļinājumi, vecmeitu ballītes. Izvēlieties savu jucekli un skatiet, kā tādai grupai kā jūsu tiek uzturēta uzskaite."
intro: "Katra grupa izdevumus sadala mazliet citādi. Šīs lapas seko **reālistiskam scenārijam** no pirmā izdevuma līdz pēdējam reģistrētajam maksājumam, ar parādītiem aprēķiniem, lai redzētu, ar ko beigtu jūsu pašu grupa."
cta:
  heading: "Atradāt savu grupas veidu?"
  body: "Izveidojiet kontu, sāciet grupu un pievienojiet pirmo izdevumu. Tas aizņem pāris minūtes."
  button: "Izveidot bezmaksas kontu"
cardsHeading: "Izvēlieties situāciju, kas vistuvāk jūsējai"
sections:
  - heading: "Grupu ceļojumi"
    body: "Lidojumi mārciņās, villa eiro un vakariņas, ko ēda tikai trīs cilvēki. Iestatiet grupu konvertēt uz mārciņām, un četri draugi Lisabonā beidz ar trim maksājumiem, nevis sešiem, kad valūtas tiek turētas atsevišķi. [Sadaliet grupas ceļojuma izmaksas](page:use-case/group-trips)."
  - heading: "Mājokļa biedri"
    body: "Viens maksā saimniekam, cits atceras rēķinu par enerģiju, un neviens nevar vienoties, kurš nopirka tualetes papīru. Ar īri, kas sadalīta pēc istabas lieluma, un pārējiem rēķiniem, kas sadalīti vienādi, četri mājokļa biedri mēnesi beidz ar trim maksājumiem, visiem tiem, kurš samaksāja īri. [Sadaliet mājsaimniecības rēķinus ar mājokļa biedriem](page:use-case/housemates)."
  - heading: "Ballītes, kāzas un kopīgas dāvanas"
    body: "Seši cilvēki balso par dāvanu, viens to nopērk, un ne visi iemaksā vienādi. Dāvana par 150 £, sadalīta pēc precīzām summām, atstāj piecus maksājumus personai, kas to nopirka, kopā 120 £. [Sadaliet pasākuma izmaksas](page:use-case/events-and-celebrations)."
  - heading: "Pāri"
    body: "Dalieties garlaicīgajos izdevumos, nepārvēršot randiņu vakaru par ceturkšņa finanšu pārskatu. Īre, sadalīta 60/40, un pārtikas pirkumi, sadalīti vienādi, saskaitās līdz vienam maksājumam starp jums abiem."
  - heading: "Vispirms redziet, kā tas darbojas"
    body: "Visi iepriekš minētie piemēri izmanto tos pašus soļus, no grupas izveides līdz maksājumu reģistrēšanai. [Kā tas darbojas](page:how-it-works) tos izved cauri, un [cenas](page:pricing) pasaka, cik tas maksā, proti, neko, bez reklāmām un bez dienas ierobežojumiem."
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai ikvienam grupā vajadzīgs konts?"
      a: "Jā. Cilvēki pievienojas ar saiti vai QR kodu un bezmaksas kontu."
    - q: "Vai Side Badger var savākt naudu?"
      a: "Nē. Jūs maksājat, kā vēlaties, tad reģistrējat maksājumu, lai atlikumi paliktu pareizi."
    - q: "Vai man jāizvēlas viens grupas veids?"
      a: "Nē. Pielietojuma piemēri ir piemēri, nevis iestatījumi. Katrai grupai ir tās pašas funkcijas, tāpēc izmantojiet jebkuru kombināciju, kas der."
