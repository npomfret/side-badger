sections:
  - heading: "سجّل دفعة"
    body: "حين يدفع أحد، سجّلها على الشخص الصحيح. تملأ أزرار التسوية السريعة المبلغ من دفعاتك المقترحة، ويمكنك إضافة ملاحظة مثل «تحويل مصرفي» (حتى 500 حرف). وإذا دفعت جزءاً فقط مما عليك فيبقى الباقي في الرصيد. وإذا أدخلت مبلغاً أقل أو أكثر من اللازم، ينبّهك Side Badger قبل أن تحفظ. ويتطلب تسجيل دفعة إذن تعديل المصروفات، ولا يمكن أن يكون التاريخ في المستقبل."
  - heading: "دفعت بعملة مختلفة؟"
    body: "تبقى الأرصدة بالعملة التي دُفعت بها، فيبقى دين اليورو ديناً باليورو. عليك يورو وتدفع بالجنيه؟ حوّل الدفعة وأنت تدخلها، بسعر صرف حالي أو بالسعر الذي حصلت عليه فعلاً. ويُثبَّت السعر عند حفظ الدفعة. يشرح [العملات المتعددة](page:feature/multiple-currencies) كيف يعمل التحويل، ويعرضه [رحلات المجموعات](page:use-case/group-trips) أثناء الاستخدام."
  - heading: "سجل يمكنك التحقق منه"
    body: "تبقى كل دفعة مسجَّلة في سجل المجموعة مع تاريخها ومبلغها وملاحظتها. لا يعدّل الدفعة إلا من سجّلها، ويمكنه هو أو مشرف المجموعة حذفها. وتُقفل أي دفعة تشمل شخصاً غادر المجموعة. ولسيناريو عملي لزملاء السكن، انظر [زملاء السكن](page:use-case/housemates)."
limits:
  heading: "ما لا يفعله Side Badger"
  items:
    - "لا ينقل Side Badger الأموال ولا يرسل روابط دفع ولا طلبات دفع. والدفعة في التطبيق هي تسجيل لدفعة تمت في مكان آخر."
    - "تأتي الدفعات المقترحة من طريقة مطابقة بسيطة تُطبَّق لكل عملة. وهي تقترح دائماً دفعات أقل من عدد الأشخاص الذين لهم رصيد بتلك العملة (أربعة أشخاص، وثلاث دفعات على الأكثر)، لكنها لا تجد دائماً أصغر عدد ممكن."
    - "لا يمكنك إيقاف الاقتراحات. و**إظهار الكل** يعرض كل دفعة مقترحة في المجموعة، لا دفعاتك وحدها."
    - "لا تُجرى مقاصّة بين العملات إلا إذا حُوِّلت المصروفات عند إدخالها."
    - "لا توجد تذكيرات، فمطالبة الناس بالدفع تبقى عليك."
useCasesHeading: "حيث تهم تسوية الحسابات"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يرسل Side Badger المال؟"
      a: "لا. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة في Side Badger ليتحدّث الرصيد."
    - q: "هل يمكنني إيقاف الدفعات المقترحة؟"
      a: "لا. يبقى التبسيط مفعَّلاً، و**إظهار الكل** يعرض كل دفعة مقترحة في المجموعة، لا التي تخصك وحدك."
    - q: "لماذا يُحفظ اليورو والجنيه منفصلين؟"
      a: "تبقى الأرصدة بالعملة التي دفعت بها ما لم تحوّل عند إدخال مصروف أو دفعة. ولا تُجرى مقاصّة بين ديون بعملات مختلفة."
    - q: "ماذا لو دفع أحد جزءاً فقط مما عليه؟"
      a: "سجّل الجزء الذي دفعه. ويبقى الباقي في الرصيد إلى أن يُدفع."
    - q: "هل هذا دائماً أصغر عدد ممكن من الدفعات؟"
      a: "ليس مضموناً. فهو يقترح دائماً دفعات أقل من عدد الأشخاص الذين لهم رصيد بتلك العملة، ففي حالة أربعة أشخاص لا يقترح أكثر من ثلاث. وفي مثال زملاء السكن هما دفعتان، بينما استغرق سداد كل شخص مباشرة ست دفعات."
