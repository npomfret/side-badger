meta:
  title: "Oszd meg a háztartási számlákat a lakótársaiddal"
  description: "Oszd fel a lakbért a szobák mérete szerint, az energiát és a bevásárlást egyenlően, és nézd meg minden hónapban, ki kinek tartozik. Ingyenes mód lakótársaknak a számolás vezetésére."
h1: "Oszd meg a háztartási számlákat a lakótársaiddal"
navLabel: "Lakótársak"
lead: "Annak a lakótársnak, aki megveszi a vécépapírt, és azoknak, akik sosem látják, hogy ez megtörténik. A Side Badger egyetlen folyamatos számolást vezet a lakbérről, a számlákról és a bevásárlásról **lakótársaknak**, így senkit nem kell hajkurászni, a hűtő pedig újra csak egy hűtő lehet."
cta:
  heading: "Kezdd a saját házaddal"
  body: "Hozz létre fiókot, csinálj csoportot a háznak, és küldd el mindenkinek a meghívó linket. Ennek a hónapnak a számlái már ma este bekerülhetnek."
  button: "Ingyenes fiók létrehozása"
scenario:
  heading: "Rendezd be a házat"
  body: "Csinálj csoportot a háznak, válaszd ki a nevet, amelyen látni akarnak benne, és hívj meg mindenkit linkkel vagy QR-kóddal. A csoport lehet nyitott, ahol mindenki hozzáad és szerkeszt, vagy felügyelt, ahol az új tagokat egy adminisztrátor hagyja jóvá, és a költségeket csak a létrehozók és az adminisztrátorok változtathatják, ami a könyvelést vezető lakótársnak megfelel. Aki csak a számokat akarja nézni, lehet megfigyelő, aki mindent lát, és semmit nem változtat. Mindenki azonnal látja az új költséget, így a „majd később hozzáadom” kevesebb helyen bújhat el."
sections:
  - heading: "Lakbér és számlák"
    body: "A lakbér ritkán osztható néggyel, mert a hálószobák nem egyformák. Oszd fel százalékosan, hogy a nagy szoba többet fizessen, az ablakos kamra pedig kevesebbet. A százalékoknak együtt 100-at kell kiadniuk. Azok a számlák, amelyeket mindenki használ, egyenlő felosztást kapnak, és az a lakótárs, akinek nem volt köze egy költséghez, kihagyható belőle. Ha az egyenlő felosztás egy felesleges fillért hagy, az véletlenszerűen egy emberhez kerül. Ismétlődő számlák nincsenek, ezért minden hónapban lemásolod a múlt havi lakbért, átírod a dátumot, és mész tovább."
  - heading: "A közös bevásárlás"
    body: "Tartsd a közös bevásárlólistát ugyanabban a csoportban, mint a bevásárlási számlákat, és pipáld ki a tételeket, ahogy a kosárba kerülnek. Aki a bevásárlást intézi, költségként hozzáadja a nyugta végösszegét, és egyenlően osztja fel, vagy csak azok között, akik meg fogják enni. Hogy ki veszi folyton a zabtejet, amit rajta kívül senki nem iszik, a ház ügye marad, de legalább a költséglista pontos lesz. A csoport jogosultságai döntik el, ki hozhat létre és szerkeszthet listákat. Tedd össze a lakbért, a számlákat és a bevásárlást, és kapsz egy hónapot, mint az alábbi, egy négyfős házban: Jo 2 000 £ lakbért fizet, a szobák mérete szerint 30%, 25%, 25% és 20% arányban elosztva, majd Kwame 120 £-t fizet az energiáért, Lena 40 £-t az internetért, Matt pedig 80 £-t a bevásárlásért, mindegyiket egyenlően elosztva. Jo-nak 1 340 £ jár vissza, és a Side Badger három kifizetést javasol, mind Jo-nak."
  - heading: "Igazságos módok a háztartási költségek felosztására"
    items:
      - "Az **egyenlő** ahhoz való, amit mindenki nagyjából egyformán használ, például az internethez, a tisztítószerekhez és a közös bevásárláshoz. Gyors, és senkinek nem kell a matekon vitatkoznia."
      - "A **szobaméret szerinti** a lakbérhez való, mert a szobák különböznek, és az is, mennyit hajlandók értük fizetni az emberek. Egyezzetek meg a százalékokban egyszer, amikor valaki beköltözik, és használjátok őket minden hónapban."
      - "A **használat szerinti** olyan számlákhoz való, ahol egy ember egyértelműen többet használ, például egy otthoni iroda fűtésszámlájához vagy egy streamingfiókhoz, amit ketten néznek. Hagyd ki azokat, akiknek nem volt részük benne, vagy írj be pontos összegeket mindenkinek."
      - "Bármelyiket választod, az első számla előtt egyezzetek meg, ne az első vita után, és írjátok le a szabályt valahová, ahol az egész ház látja."
  - heading: "Amikor valaki kiköltözik"
    body: "Előbb elszámol. Senki nem hagyhat el egy csoportot, amíg tartozik, vagy neki tartoznak, ezért a kiköltöző fizet vagy megkapja a pénzét, te rögzíted, és csak utána megy el. Vezesd tovább a csoportot a megmaradó lakótársaknak, és az új embert hívd meg linkkel. Amikor maga a ház véget ér, egy adminisztrátor zárolhatja a csoportot, hogy a számok a helyükön maradjanak, vagy végleg lezárhatja, amitől mindenki számára elérhetetlenné válik, ezért csak akkor tedd, ha senkinek nincs szüksége az előzményekre."
