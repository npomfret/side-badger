  title: How to settle up after a group trip | Side Badger
  description: Settle before everyone scatters. Ten tangled debts become four payments, recorded as they land, and a part payment is fine. Sums shown for five friends.
h1: How to settle up after a group trip
navLabel: Settle up after a trip
lead: Settle before everyone scatters. Add the last expense, open the group's balances and pay what you owe from the short list, however you like. Then record each payment in Side Badger so the balance clears for the whole group. For five friends and five expenses, ten tangled debts come down to four payments.
cta:
  heading: Close the books before the photos land
  body: Create a free account, start a group for the next trip and add each cost as it happens. The short list of payments is waiting by the time you reach the airport. Want to see [how settling up works](page:feature/settle-up) first?
sections:
  - heading: Five friends, five expenses, one departure lounge
    body: Mo, Ines, Raf, Tess and Uma spent a week on the coast. Mo booked the apartment and bought the groceries, Ines paid for the boat trip and Raf picked up the big dinner. Tess took the airport taxi with Uma and Mo, because Ines and Raf had the train. Uma's card stayed at home, so she paid for nothing. That is five expenses and €1,700 in all, and in the departure lounge nobody could say who was ahead.
  - heading: Ten debts, four payments
    body: The apartment, the boat, the dinner and the groceries are split equally five ways. That is €200, €50, €60 and €18 each, so Ines and Raf owe €328 apiece. The taxi is shared by three at €20 each, so Mo, Tess and Uma owe €348. Mo paid €1,090 and owes €348, which leaves him owed €742. Everyone else paid less than they owe. Uma is €348 short, Tess €288, Ines €78 and Raf €28, and those add up to Mo's €742. Settle each pair of people directly and you get ten separate debts. Side Badger suggests four payments instead, all to Mo.
  - heading: Settle before everyone scatters
    body: The best moment is the last evening or the ride home, while everyone is still in one place and a €28 debt is easy to mention. Add every expense first, taxi included. Nobody can leave a group while they owe or are owed money, so the count has to close at some point anyway.
    items:
      - "**Check the list.** Open the group and look at **Balances**. By default you see the debts that involve you. Choose **Show all** to see the whole group's list."
      - "**Pay however you like.** Bank transfer, cash, a favour owed from the last holiday. Side Badger doesn't move the money."
      - "**Record it.** Choose **Settle Up**. Under **Quick settle** each button is one of your suggested payments, and choosing one fills in the amount. Add a **Note** such as bank transfer, check the **Date** (it can't be in the future) and choose **Record Settlement**."
      - "**Watch it clear.** The balance updates for everyone. When the last payment is in, **Balances** reads **All settled up!**"
  - heading: Paying part now, the rest later
    body: Uma can send €200 tonight and the rest at the end of the month. She records €200, and the form warns her that she will still owe Mo €148 afterwards, which is €348 less €200. Save it and the €148 stays on her balance until she records the rest. The warning works the other way too. If a stray zero turns €348 into €3,480, the form says she only owes Mo €348 and that saving would create a debt in the opposite direction. Fix the zero before you save.
  - heading: Fixing mistakes, and cheering payments
    items:
      - "**A wrong payment.** Only the person who recorded a payment can edit it. They or a group admin can delete it, and then it can be recorded again."
      - "**A payment worth noticing.** Every recorded payment sits under **Settlements** with its date and note, where everyone in the group can see it and react. Mo can choose **Celebrate** when Uma's last €148 arrives."
      - "**The end.** With every balance at zero, an admin can lock the group so the numbers stay put."
  - heading: What Side Badger doesn't do here
    items:
      - It never moves money. It has no payment links or payment requests, so a payment in the app is a record of one made elsewhere.
      - It sends no reminders. Chasing a late payment is still up to you.
      - It doesn't set deadlines. When the rest of Uma's €148 is due is for the group to agree.
      - The suggested payments are a short list, not a promise of the shortest possible one. They are worked out per currency, so a trip paid in euros and pounds gets a list for each.
