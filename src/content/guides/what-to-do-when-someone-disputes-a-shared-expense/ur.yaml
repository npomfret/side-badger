faq:
  heading: "سوالات"
  items:
    - q: "کیا میں صرف اپنے حصے پر سوال اٹھا سکتا ہوں؟"
      a: "نہیں۔ سوال پورے خرچے کو روکتا ہے، اس میں شامل ہر شخص کے لیے۔ اگر صرف تقسیم غلط ہے تو حل تقسیم میں ترمیم ہے۔"
    - q: "سوال کون بند کر سکتا ہے؟"
      a: "جس نے پوچھا تھا، یا گروپ کا ایڈمن۔ اگر خرچہ شامل کرنے والا ایڈمن نہیں ہے تو وہ سوال پوچھنے والے کی جگہ اسے بند نہیں کر سکتا۔"
    - q: "کیا خرچے میں ترمیم اصل کو مٹا دیتی ہے؟"
      a: "نہیں۔ پہلے والا ورژن محفوظ رہتا ہے۔ کون ترمیم کر سکتا ہے یہ گروپ کی اجازتوں سے طے ہوتا ہے، اس لیے گھر والوں کو پہلے بتا دینا بہتر ہے، کیونکہ بیلنس بدلتے ہیں۔"
