meta:
  title: "Side Badger mot Splitwise: hela gruppen, inte bara summorna | Side Badger"
  description: "Ett gratis alternativ till Splitwise för hela gruppen: kommentarer, frågor, listor, omröstningar och riktiga roller, plus kvittoskanning och valutaomräkning gratis."
h1: "Side Badger mot Splitwise: hela gruppen, inte bara summorna"
navLabel: Side Badger mot Splitwise
lead: 'Någon i din grupp har troligen sagt "använd bara Splitwise". Rimligt nog: det är bra på matten. Side Badger räknar också, och ger sedan gruppen en plats att prata igenom det på: kommentarer, frågor, listor, omröstningar och riktiga grupproller. Kvittoskanning och valutaomräkning ingår gratis.'
cta:
  heading: Prova på din nästa gemensamma räkning
  body: Skapa ett gratiskonto, gör en grupp och lägg till en riktig utgift. Om det inte är något för dig har du lagt några minuter, inte en prenumeration.
asOf: 2026-11-22
asOfNote: Vi läste Splitwises egna sidor den {date} så att du slipper, och allt här om Splitwise kommer från dem. Varje rad i tabellen länkar till sin källa. Planer ändras, så vi kontrollerar igen varje kvartal, och om Splitwises sidor säger något annat än den här, tro dem.
