faq:
  heading: "سوالات"
  items:
    - q: "اگر ہم تحفے کی قیمت سے زیادہ جمع کر لیں تو؟"
      a: "عین رقموں کا مجموعہ قیمت کے برابر ہونا چاہیے، اس لیے حصے اتنے گھٹائیں کہ مجموعہ پورا ہو جائے۔ یا زائد رقم کسی حقیقی چیز پر لگا دیں، جیسے پھول، اور اسے دوسرے خرچے کے طور پر درج کریں، جیسے مثال میں کارڈ اور گفٹ ریپ۔"
    - q: "کیا کوئی گروپ میں شامل ہوئے بغیر رقم ڈال سکتا ہے؟"
      a: "نہیں، اگر آپ اسے گنتی میں رکھنا چاہتے ہیں۔ تقسیم میں شامل ہر شخص کو مفت اکاؤنٹ اور گروپ میں ہونا چاہیے۔ جس کے پاس صرف نقد ہو، اس کے لیے پریا اسے لے کر تحفہ اتنی رقم کا درج کر سکتی ہے جتنی گروپ کے ذمے ابھی باقی ہے۔ مثال کے طور پر اگر سیم اسے £40 نقد دے تو وہ £200 درج کرے گی اور اسے اپنے، عمر اور لینا میں 60، 60 اور 80 کے حساب سے تقسیم کرے گی۔"
    - q: "کیا پول طے کر سکتا ہے کہ ہر شخص کتنا ڈالے؟"
      a: "نہیں۔ پول پورے گروپ کے لیے ایک عدد طے کرتا ہے، جیسے بجٹ۔ ہر شخص کا حصہ آپس میں طے کرنا آپ کا کام ہے، پھر اسے خرچے میں **عین رقمیں** کے طور پر لکھیں۔"
