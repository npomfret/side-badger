meta:
  title: "پارٹیوں، شادیوں اور گروپ تحائف کے اخراجات تقسیم کریں"
  description: "پارٹی، شادی یا گروپ تحفے کے اخراجات تب بانٹیں جب لوگ مختلف رقوم ڈالیں۔ منصوبے پر ووٹ دیں، عین رقم کے مطابق تقسیم کریں اور دیکھیں کس کو کس کا دینا ہے۔"
h1: "پارٹیوں، شادیوں اور گروپ تحائف کے اخراجات تقسیم کریں"
navLabel: "تقریبات اور جشن"
lead: "ڈپازٹ، سجاوٹ اور ہنگامی چھتریاں تقسیم کریں۔ نشستوں کا انتظام کسی زیادہ بہادر پر چھوڑ دیں۔ Side Badger **کس نے کتنا ڈالا** ایک ہی جگہ رکھتا ہے، تاکہ منتظم بھی پارٹی سے لطف اٹھا سکے۔"
cta:
  heading: "اگلے جشن سے شروع کریں"
  body: "اکاؤنٹ بنائیں، تقریب کے لیے گروپ بنائیں اور دعوتی لنک بھیجیں۔ Side Badger مفت ہے، بغیر اشتہارات اور بغیر یومیہ حد کے۔"
scenario:
  heading: "سب حصہ ڈالتے ہیں، ہمیشہ ایک جتنا نہیں"
  body: "کوئی ہال کا ڈپازٹ دیتا ہے، کوئی اور کیک خریدتا ہے، اور تیسرا گروپ کا تحفہ اپنے کارڈ پر ڈال دیتا ہے۔ کچھ مہمان ہر چیز میں آتے ہیں اور کچھ صرف ڈنر پر۔ چیٹ کے دھاگے میں اس کا منصفانہ حساب رکھنا ایسا کام ہے جس کے لیے کسی نے درخواست نہیں دی تھی۔ Side Badger کا گروپ سب کچھ سنبھالتا ہے، رقوم کا ملاپ جیسا بھی ہو، اور ہر شخص کو دکھاتا ہے کہ اس کے ذمے کیا ہے یا اسے کیا ملنا ہے۔ بنیادی باتوں کے لیے [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں، یا کسی تقریب کے لیے پڑھتے رہیں۔"
sections:
  - heading: "مل کر فیصلہ کریں"
    body: "کوئی رقم ہلنے سے پہلے انتخاب کو **پول** پر رکھیں۔ 10 تک اختیارات شامل کریں، جیسے دو ہال یا تحفے کے تین آئیڈیاز، اور سب کو ووٹ دینے دیں۔ آپ چھپا سکتے ہیں کہ کس نے کس کو ووٹ دیا، تاکہ ہر اختیار کو منصفانہ سنوائی ملے، اور پول بند ہونے پر فاتح نظر آتا ہے۔ کسی کو یہ جاننے کے لیے چالیس پیغامات پیچھے نہیں جانا پڑتا کہ کیا طے ہوا۔"
  - heading: "کون کس میں شامل ہے"
    body: "ہر کوئی ایک جتنا ادا نہیں کرتا، اور ہر کوئی ہر خرچے کا حصہ نہیں ہوتا۔ خرچہ برابر، فیصد یا **عین رقم** کے مطابق تقسیم کریں، تاکہ ہر شخص کا حصہ وہی عدد ہو جس پر آپ نے اتفاق کیا۔ ان کو نکال دیں جو شامل نہیں تھے، جیسے وہ مہمان جنہوں نے ڈنر چھوڑا یا وہ دوست جو تحفے میں شامل نہیں ہوئے۔ ہر خرچے کا ایک ادا کرنے والا ہوتا ہے، اور تقسیم میں شامل باقی سب اس کے مقروض ہیں اپنے حصے کے۔ تفصیلات [اخراجات کی تقسیم](page:feature/split-expenses) کے صفحے پر ہیں۔"
  - heading: "کاغذات سنبھال کر رکھیں"
    body: "خرچے میں نوٹس شامل کریں، جیسے یہ خرچہ کس چیز کا تھا۔ تبصرے اس **خرچے کے ساتھ** رہتے ہیں جس کے بارے میں ہیں، اس لیے سوال «کیا کیک £45 کا تھا یا £54 کا؟» اور اس کا جواب ایک ہی جگہ رہتے ہیں۔ تبصرے 500 حروف تک ہو سکتے ہیں، جو ڈپازٹ کے بارے میں سوال کے لیے کافی ہے۔"
  - heading: "منتظم کے اختیارات"
    body: "کھلا تعاون کسی بھی رکن کو اخراجات شامل اور ترمیم کرنے دیتا ہے، جو چھوٹے تحفے کے لیے ٹھیک ہے۔ شادی یا بڑی پارٹی کے لیے **منظم گروپ** پری سیٹ چنیں۔ ایڈمن ہر نئے رکن کو منظور کرتے ہیں، اور صرف تخلیق کار اور ایڈمن اخراجات بدل سکتے ہیں۔ لوگوں کو لنک یا QR کوڈ سے مدعو کریں؛ منظوری آن ہو تو ایڈمن ہر شخص کو اندر آنے دیتا ہے، اس لیے مہمانوں کی فہرست مہمانوں کی فہرست ہی رہتی ہے۔ تقریب ختم ہونے پر گروپ مقفل کر دیں تاکہ اعداد اپنی جگہ رہیں۔"
  - heading: "پارٹی کے بعد حساب برابر کریں"
    body: "آخری رسید آ جائے تو بیلنس دکھاتے ہیں کہ **کس کو کس کا دینا ہے**، اور Side Badger ادائیگیوں کی ایک مختصر فہرست تجویز کرتا ہے جو سب کا حساب برابر کر دیتی ہے۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر گروپ میں ادائیگی ریکارڈ کریں۔ Side Badger کبھی رقم نہیں منتقل کرتا، اس لیے گروپ حساب رکھتا ہے جبکہ ٹرانسفر آپ کی اپنی بینکنگ ایپس میں ہوتے ہیں۔ [حساب برابر کرنا](page:feature/settle-up) کا صفحہ دکھاتا ہے کہ الجھن کیسے مختصر فہرست بن جاتی ہے۔"
