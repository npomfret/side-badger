meta:
  title: "Partager les frais dans 140 devises, converties ou séparées"
  description: "Saisissez chaque dépense dans la devise où vous avez payé, gardez les soldes séparés ou convertissez à un taux que vous voyez et pouvez modifier, puis réglez avec une courte liste de paiements."
h1: "Partager les frais dans 140 devises"
navLabel: "Plusieurs devises"
lead: "Des euros, des yens, et ce taxi en bahts. Side Badger prend chaque dépense dans la devise où vous avez payé, garde les soldes en ordre, et peut convertir quand votre groupe préfère régler en une fois. Il fonctionne dans 140 devises, et il convient naturellement aux [voyages en groupe](page:use-case/group-trips)."
cta:
  heading: "Apportez vos euros, apportez vos yens"
  body: "Créez un compte, lancez un groupe et ajoutez la première dépense dans la devise que vous aviez en poche."
  button: "Créer un compte gratuit"
problem:
  heading: "Saisissez-la comme vous l'avez payée"
  body: "Un voyage se paie rarement dans une seule devise. L'hôtel a été réservé chez vous en livres, le dîner payé en yens, et le café de l'aéroport dans ce que l'escale utilisait. Tout convertir à la main avant même de pouvoir saisir, c'est ainsi que les tableurs sont abandonnés. Dans Side Badger, vous saisissez chaque dépense dans la devise du reçu, et chaque montant suit les règles de sa devise : les yens n'ont pas de décimales et les dinars en ont trois. Vos devises récemment utilisées arrivent en premier dans la liste."
workflow:
  heading: "Gardez les devises séparées, ou convertissez au fil de l'eau"
  steps:
    - title: "Ajoutez la dépense dans sa propre devise"
      body: "Choisissez la devise, saisissez le montant, dites qui a payé et qui partage. Rien d'autre n'est nécessaire. C'est le réglage par défaut, et il garde le montant d'origine exactement tel que vous l'avez saisi."
      shot: S07
      shotAlt: "Le formulaire de dépense avec un montant en yens saisi"
    - title: "Suivez un solde par devise"
      body: "Les soldes sont tenus séparément par devise, et chacun a sa propre courte liste de paiements suggérés. Les livres se règlent en livres et les yens en yens."
      shot: S10
      shotAlt: "L'écran des soldes avec des dettes simplifiées dans deux devises"
    - title: "Ou convertissez, quand le groupe préfère régler en une fois"
      body: "Choisissez une autre devise en saisissant la dépense et Side Badger peut la convertir à un taux de change actuel, que vous pouvez changer pour le taux que vous avez réellement obtenu. Le montant converti rejoint le solde dans cette devise. La conversion est un choix que fait le groupe, jamais quelque chose qui se passe dans votre dos."
options:
  heading: "Un taux que vous voyez et pouvez modifier"
  items:
    - title: "Le taux est affiché"
      body: "Quand vous convertissez, le taux et le montant converti apparaissent sur le formulaire, donc personne n'a à croire un chiffre sur parole."
    - title: "Saisissez le vôtre"
      body: "Un meilleur taux au bureau de change, ou un moins bon à l'aéroport ? Modifiez le taux pour celui que vous avez réellement obtenu et le montant converti se met à jour."
    - title: "L'original reste"
      body: "Le montant d'origine reste sur la dépense, à côté du montant converti, pour quiconque demande combien c'était en yens."
    - title: "Convertir est gratuit"
      body: "Convertir ne coûte rien. Il n'y a aucun frais pour saisir une dépense dans une autre devise."
