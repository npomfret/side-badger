featuresHeading: 一个家会用到的功能
faq:
  heading: 常见问题
  items:
    - q: 房租可以自动重复吗？
      a: 不能，没有定期账单。点几下复制上个月的房租，改一下日期就行。
    - q: 可以按房间大小分摊吗？
      a: 可以，按比例。给每位室友一个能反映其房间的份额，只要份额加起来是 100。其他分摊方式见[分摊支出](page:feature/split-expenses)。
    - q: 如果有室友欠着钱搬走了呢？
      a: 结清之前他们不能退出群组，因为只要还欠钱或还有钱没收回，谁都不能退出。在大家两清之前，数字始终是诚实的。
    - q: Side Badger 会代付账单吗？
      a: 不会。它负责记账并建议一份简短的付款清单。你们想怎么付就怎么付，然后记录下来，详见[结算](page:feature/settle-up)。
    - q: 可以让一位室友来管账吗？
      a: 可以。让他成为管理员，并使用受管群组，新成员需要批准，只有创建者和管理员可以更改支出。
