sections:
  - heading: "Samo osobe koje su bile tamo"
    body: "Podijeli trošak među sve ili samo među osobe koje su ga dijelile. Izostavi ljude iz troškova u kojima nisu sudjelovali i stanja će to odražavati. Cimer koji je cijeli tjedan bio odsutan ne duguje za hranu za van, što će [cimeri](page:use-case/housemates) prepoznati kao osnovnu pravdu."
  - heading: "Pojedinosti koje poslije štede svađe"
    items:
      - "Postavi **datum** i po želji vrijeme. Prečaci poput danas, jučer, jutros i sinoć štede nešto tipkanja."
      - "Dodaj do tri **oznake** za grupiranje troškova, primjerice namirnice ili putovanja."
      - "Dodaj **mjesto**. Zalijepi poveznicu s karte i naziv mjesta ispuni se sam."
      - "Dodaj **bilješku** s pričom iza broja, uz malo oblikovanja ako priča to traži."
      - "Koristi **komentare** da razgovor ostane uz trošak na koji se odnosi, a ne u nizu poruka kojem se nitko ne vraća."
  - heading: "Kopiraj, uredi i vidi što se promijenilo"
    body: "Kopiraj prošlomjesečnu najamninu umjesto da je ponovno upisuješ, pa promijeni ono što je drukčije. Ako je broj bio pogrešan, uredi trošak. Ranija verzija se čuva, a uređivanje se prikazuje u aktivnosti grupe, pa nitko ne mijenja broj neprimjetno. Što tko smije uređivati ovisi o dopuštenjima grupe."
  - heading: "Kad nešto izgleda krivo"
    body: "Grupa može uključiti pitanja o troškovima. Svatko uključen u trošak može postaviti pitanje i reći zašto, a trošak ostaje izvan stanja dok ga osoba koja je pitala ili administrator ne zatvori. Isključeno je prema zadanim postavkama, a administrator ga uključuje za grupu. Pogodno je za [događaje i proslave](page:use-case/events-and-celebrations), gdje polog kojeg se nitko ne sjeća odjednom postaje briga svih."
limits:
  heading: "Ograničenja"
  items:
    - "Za svaki trošak plaća jedna osoba. Ako su platile dvije, zabilježi dva troška."
    - "Nema podjele po stavkama ni po udjelima. Postoje jednako, točni iznosi i postoci."
    - "Postoci moraju zajedno davati 100."
    - "Trošak može iznositi do 999.999,99 u svojoj valuti, s uobičajenim brojem decimala te valute."
    - "Troškovi se ne ponavljaju sami. Umjesto toga kopiraj prošlomjesečni."
    - "Datumi ne smiju biti u budućnosti ni stariji od 10 godina."
    - "Trošak u kojem sudjeluje netko tko je napustio grupu postaje samo za čitanje."
useCasesHeading: "Gdje ovakva podjela pomaže"
faq:
  heading: "Pitanja"
  items:
    - q: "Mogu li dvije osobe platiti jedan trošak?"
      a: "Ne u jednom trošku. Zabilježi dva, po jedan za svakog platitelja, i stanja će izaći jednako."
    - q: "Mogu li podijeliti račun po stavkama?"
      a: "Ne. Podjela je jednaka, po točnim iznosima ili po postocima. Za račun s različitim stavkama upiši koliko duguje svaka osoba, kao točne iznose."
    - q: "Mogu li postaviti zadanu podjelu?"
      a: "Ne. Kopiraj raniji trošak da ponovno upotrijebiš njegovu podjelu i promijeni ono što je drukčije."
    - q: "Mogu li se računi ponavljati svaki mjesec?"
      a: "Ne. Umjesto toga kopiraj prošlomjesečni trošak, što traje nekoliko sekundi."
    - q: "Tko može urediti trošak?"
      a: "Onaj kome to dopuštaju dopuštenja grupe. Svako uređivanje prikazuje se u aktivnosti grupe, pa promjene nikad nisu neprimjetne."
    - q: "Što se poslije događa sa stanjima?"
      a: "Ažuriraju se kako troškovi pristižu, a [poravnanje](page:feature/settle-up) ih pretvara u kratak popis uplata. Ako je trošak u drugoj valuti, vidi [više valuta](page:feature/multiple-currencies)."
