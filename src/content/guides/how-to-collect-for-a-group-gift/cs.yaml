faq:
  heading: "Otázky"
  items:
    - q: "Co když vybereme víc, než dárek stojí?"
      a: "Přesné částky se musí sečíst na cenu, takže podíly zkraťte, dokud to nesedí. Nebo přebytek použijte na něco skutečného, například na květiny, a zadejte to jako druhý výdaj, jako přáníčko s papírem v příkladu."
    - q: "Může někdo přispět, aniž by se připojil do skupiny?"
      a: "Ne, pokud ho chcete mít v počtu. Každý v rozdělení potřebuje bezplatný účet a místo ve skupině. U někoho, kdo má jen hotovost, ji může převzít Priya a zadat dárek v částce, kterou skupina ještě dluží. Například pokud jí Sam předá 40 £ v hotovosti, Priya zadá 200 £ a rozdělí je 60, 60 a 80 mezi sebe, Omara a Lenu."
    - q: "Může hlasování rozhodnout, kolik každý přispěje?"
      a: "Ne. Hlasování určí jedno číslo pro celou skupinu, například rozpočet. Podíl každého si domluvíte mezi sebou a pak ho zadáte do výdaje jako **Přesné částky**."
