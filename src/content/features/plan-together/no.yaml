meta:
  title: Lister, avstemninger og kommentarer for gruppen | Side Badger
  description: Kommenter utgifter, still spørsmål ved den rare, ha en delt handleliste og stem over villaen. Planlegg sammen, del etterpå. Gratis, uten annonser.
h1: Planlegg sammen, del etterpå
navLabel: Planlegg sammen
lead: Handlelisten og handleregningen, endelig på talefot. Side Badger gir gruppen et sted å snakke om pengene før og etter de er brukt, med kommentarer på hver utgift, en måte å stille spørsmål ved dem som ser feil ut, delte lister og avstemninger for de store valgene. Så [deler du utgifter](page:feature/split-expenses) som vanlig.
cta:
  heading: Planlegg det, del det
  body: Opprett en gratis konto, start en gruppe og legg den første listen, avstemningen eller det første spørsmålet rett ved siden av pengene. Usikker på hva som skjer videre? Se [slik fungerer det](page:how-it-works).
problem:
  heading: Chatten er her, regningen er der
  body: Gruppeutgifter lever vanligvis to steder. Tallene ligger ett sted, og krangelen om tallene ligger i en chat som rullet bort på tirsdag. Handlelisten er et bilde av et kjøleskap. Villaen ble avgjort med en tommel opp fra de fleste, antakelig. Side Badger holder planleggingen i gruppen, ved siden av utgiftene den handler om, så det finnes en kommentar der kostnaden er, en liste der handleturen er, en avstemning for det store valget, og en måte å si «vent litt, stemmer dette?» uten å skrive et helt avsnitt. Alt handler fortsatt om gruppens penger, som er det gruppen er til for.
workflow:
  heading: Fra villavalget til handleregningen
  steps:
    - title: Sett det store valget til avstemning
      body: Legg til en avstemning for avgjørelsen som bestemmer regningen, for eksempel hvilken villa. Velg to til ti alternativer, si hvor mange stemmer hver person får, og lukk den når alle har stemt, så markeres vinneren.
      shot: S17
      shotAlt: En lukket avstemning med vinneralternativet markert og antall stemmer ved siden av hvert alternativ
    - title: Skriv handlelisten sammen
      body: Start en delt liste, legg til varene og kryss dem av etter hvert som de havner i vogna. Handleturen legges inn som en utgift etterpå.
      shot: S16
      shotAlt: En delt handleliste med noen varer avkrysset og en fremdriftsteller
    - title: Snakk om kostnaden der den bor
      body: Kommenter selve utgiften, legg ved kvitteringen og reager med en emoji. Samtalen blir stående ved siden av tallet den handler om.
      shot: S08
      shotAlt: En utgift med detaljer, et miniatyrbilde av kvitteringen, en kommentartråd og emoji-reaksjoner
    - title: Still spørsmål ved den som ser rar ut
      body: Hvis gruppen har slått på utgiftsspørsmål, kan alle som er med i en utgift velge **Jeg har et spørsmål**. Utgiften holdes utenfor saldoene til spørsmålet er avklart.
      shot: S18
      shotAlt: Utgiftslisten med merket Stilt spørsmål ved og filteret Kun stilt spørsmål ved
    - title: Se hva som endret seg, og hvem som endret det
      body: Aktivitetsloggen og varselklokken viser hva som er nytt på tvers av gruppene dine. Pushvarsler finnes hvis du vil ha dem.
      shot: S19
      shotAlt: Varselmenyen med en liste over nylig aktivitet
