sections:
  - heading: Usapang pera, katabi ng pera
    body: Kasama ng pera ang daldalan, duda, at plano. Pinagsasama ng Side Badger ang tatlong iyon katabi ng mga numero, kaya hindi mo na kailangang mag-scroll pabalik sa group chat.
    items:
      - "**Mga komento sa tamang lugar.** Mag-komento sa mismong grupo, o sa kahit anong gastos, listahan, o poll, at ilagay ang usapan katabi ng pinag-uusapan."
      - "**Mga resibo at larawan.** Mag-imbak ng hanggang tatlong resibo sa bawat gastos, at magdagdag ng mga larawan o PDF sa mga komento sa grupo, isang listahan, o isang poll."
      - "**Mga tanong, hindi away.** Puwedeng i-on ng admin ang mga tanong, at kahit sino sa isang gastos ay puwede nang magtanong tungkol dito. Hindi ito kasama sa mga balanse hangga’t hindi pa naaayos."
      - "**Mga listahan at poll.** Itabi ang shared na listahan ng pamimili sa mga bill ng pamimili, at ipaboto ang shortlist ng villa, nang anonymous kung gusto mo."
      - "**Kaunting palakpak.** Mag-react sa mga gastos, bayad, at komento, at ipagdiwang ang bayad pagdating nito."
  - heading: Iyong grupo, iyong mga patakaran
    body: Sinasabi ng help center ng Splitwise na hindi nito sinusuportahan ang mga admin ng grupo o mga espesyal na pahintulot. May mga role at pahintulot ang Side Badger, para sa mga grupong kailangan ng taong mag-aayos ng mga numero.
    items:
      - "**Admin, miyembro, at tagamasid.** Gawing tagamasid ang isang tao: nakikita niya ang lahat at wala siyang mababago."
      - "**Dalawang preset, o gawa mo mismo.** Magsimula sa Bukas na kolaborasyon o Pinamamahalaang grupo, o itakda mo mismo ang bawat pahintulot: sino ang nag-e-edit at nagbubura ng mga gastos, nag-e-edit ng mga listahan, nag-iimbita, at nagpapapasok ng mga bagong tao."
      - "**Pag-apruba bago sumali.** I-on ang pag-apruba at papapasukin ng admin ang bawat tao."
      - "**Sariling mga setting ng grupo.** Limitahan ito sa mga perang talagang ginagamit mo, piliin ang default na pera nito, at lagyan ng larawan sa header."
      - "**I-lock kapag tapos na.** Mananatili ang mga numero hanggang i-unlock ng admin."
  - heading: Libre rito, may bayad doon
    body: Ang Splitwise Pro ang bayad na plano ng Splitwise, at tatlong bagay ang ibinebenta ng sarili nitong Pro page na walang bayad sa Side Badger.
    items:
      - "**Pag-scan ng resibo.** Sina-scan ng Splitwise Pro ang larawan ng resibo mo. Libre itong ginagawa ng Side Badger, walang scan credits: pinupunan nito ang kabuuan, petsa, at lugar para suriin mo."
      - "**Pag-convert ng pera.** Kino-convert ng Splitwise Pro ang mga gastos ng grupo sa default na pera mo kapag pinindot mo ang I-convert. Kino-convert ng Side Badger ang bawat gastos habang inilalagay mo ito, sa kasalukuyang exchange rate o sa aktuwal mong nakuha, at nananatili sa gastos ang orihinal na halaga."
      - "**Walang pang-araw-araw na limitasyon.** Ibinebenta ng Splitwise Pro ang walang limitasyong gastos, at sinasabi ng help center nito na hanggang 4 na gastos kada araw ang maidaragdag ng mga libreng user. Walang pang-araw-araw na limitasyon ang Side Badger."
  - heading: Hindi kasali ang bangko mo
    body: "Hindi kumokonekta ang Side Badger sa bangko mo at hindi nito hinihingi ang detalye ng bangko mo. Itinatala lang nito kung sino ang may utang kanino; magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad. Walang bank login na ibibigay, kaya isang alalahanin ang nabawasan."
  - heading: Isang app, sa browser at sa telepono mo
    body: Tumatakbo ang Side Badger sa browser mo. Mag-sign in, idagdag ito sa home screen, at bubukas ito na parang app. Iisang app ito sa alinmang paraan, kaya lumalabas sa telepono mo ang bagong feature sa susunod na buksan mo ang app, nang walang hinihintay na update sa app store.
  - heading: At ilang pakulo pa
    items:
      - "**Itanong sa assistant mo.** Gumagana ang Side Badger sa ChatGPT at Claude: ipadagdag sa assistant mo ang isang gastos, ipa-scan ang resibo, o ipatala ang isang bayad."
      - "**Bawat isa, sa sarili niyang wika.** 39 na wika ang sinasalita ng Side Badger at bawat tao ay pumipili ng sarili niya. Sinasabi ng home page ng Splitwise na 7+. Kaya rin nito ang 133 na pera, para sa biyaheng kung saan-saan pumupunta."
      - "**Tulong nang hindi umaalis sa app.** Naipit o may nakitang bug? Sabihin sa amin mula sa app at basahin agad doon ang sagot namin."
  - heading: Kung saan nananalo pa rin ang Splitwise
    body: Mas gusto naming mapili mo ang tamang app kaysa malaman mo na lang sa huli. Kung kailangan ng grupo mo ang alinman sa mga ito, mayroon ang Splitwise at wala ang Side Badger.
    items:
      - "**Mga app sa app store.** Nasa browser mo at sa home screen mo ang Side Badger, wala sa mga app store."
      - "**Offline mode.** Kailangan ng Side Badger ng koneksyon."
      - "**Mga pagbabayad sa loob ng app.** Sa ilang bansa, kayang maglipat ng pera ng Splitwise. Ang Side Badger, nagtatala lang."
      - "**Paghahati ayon sa shares o ayon sa item.** Isa ang nagbabayad sa bawat gastos sa Side Badger, na hinahati nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento. Hindi nag-a-assign ng mga item sa tao ang pag-scan nito ng resibo."
      - "**Mga tsart at default na paghahati.** May dalawa nito ang Splitwise Pro. Binibilang lang ng Side Badger kung sino ang may utang kanino, at iyon na ang buong pakulo."
  - heading: Paglipat ng grupo mo
    body: Walang importer, kaya ang paglipat ay panibagong simula. Mag-settle up muna sa Splitwise, saka gumawa ng grupo sa Side Badger at imbitahan ang lahat gamit ang link o QR code. Kailangan ng libreng account ng lahat sa grupo, at email address lang ang kailangan para mag-sign up.
