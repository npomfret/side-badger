sections:
  - heading: "Шта Splitwise ради добро"
    body: "Ако твојој групи треба изворна апликација, рад ван мреже или уплате унутар апликације, Splitwise је разуман избор, и радије бисмо да њега изабереш него да касније сазнаш. Његове странице наводе:"
    items:
      - "**Апликације и рад ван мреже.** Апликације за iPhone и Android поред веба, и режим ван мреже."
      - "**Више начина поделе.** Уделе, прилагођавања и поделу по ставкама, поред једнаке, тачне и по процентима."
      - "**Понављајући трошкови.** Подеси да се кирија понавља и заборави на њу."
      - "**Уплате у апликацији.** У неким земљама може и да премести новац, преко Splitwise Pay-а, Venmo-а, PayPal-а или Pay by Bank."
  - heading: "Бесплатно овде, плаћено тамо"
    body: "Splitwise Pro је Splitwise-ов плаћени план, а његова Pro страница продаје четири ствари које у Side Badger-у ништа не коштају."
    items:
      - "**Скенирање рачуна.** Splitwise Pro скенира слику твог рачуна. Side Badger то ради бесплатно, без кредита за скенирање: попуни укупан износ, датум и место да их провериш. Слике рачуна чита Гуглов AI сервис."
      - "**Претварање валута.** Splitwise Pro претвара трошкове групе у твоју подразумевану валуту кад додирнеш Convert. Side Badger претвара сваки трошак док га уносиш, по актуелном девизном курсу или оном који си заиста добио, а изворни износ остаје уз трошак."
      - "**Без огласа.** Splitwise наводи потпуно искуство без огласа као Pro функцију. Side Badger нема огласа."
      - "**Без дневних ограничења.** Splitwise Pro продаје неограничене трошкове, а његов центар за помоћ каже да бесплатни корисници могу додати до 4 трошка дневно. Side Badger нема дневних ограничења."
  - heading: "Шта Splitwise има, а Side Badger нема"
    body: "Ово нису све Splitwise-ове функције, само оне које обично одлуче. Splitwise-ове странице имају цео списак. Овде је оно у чему Side Badger заостаје."
    items:
      - "**Изворне апликације.** Side Badger ради у твом прегледачу. Пријави се, па га додај на почетни екран и отвара се као апликација."
      - "**Режим ван мреже.** Side Badger-у је потребна веза."
      - "**Уплате у апликацији.** Side Badger никад не дира твој новац. Платите једни другима како год желите, а затим забележи уплату."
      - "**Понављајући трошкови.** Side Badger их нема. Уместо да поново куцаш, копирај прошломесечну кирију."
      - "**Подела по уделима или по ставкама.** Side Badger има једног платиоца по трошку, подељеног једнако, по тачним износима или по процентима. Његово скенирање рачуна не додељује ставке људима."
      - "**Графикони и подразумеване поделе.** Splitwise Pro има обоје. Side Badger води евиденцију ко коме дугује, и то је цео трик."
  - heading: "Селидба твоје групе"
    body: "Нема увоза, па селидба значи нови почетак. Прво се поравнајте у Splitwise-у, затим направи групу у Side Badger-у и позови све везом или QR кодом. Свако у групи треба бесплатан кориснички налог, а за регистрацију је довољна имејл адреса."
