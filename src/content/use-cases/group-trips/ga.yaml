featuresHeading: "An rud a bhraitheann turas air"
faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir na daoine a scipeáil an dinnéar a fhágáil amach?"
      a: "Is féidir. Roghnaigh cé a bhí páirteach i ngach costas agus ní ghearrtar air ach iad sin."
    - q: "An n-oibríonn sé gan comhartha?"
      a: "Ní oibríonn. Teastaíonn nasc ó Side Badger, mar sin cuir na costais leis nuair a bhíonn tú ar ais ar an wifi."
    - q: "An gcaithfidh gach duine rud éigin a shuiteáil?"
      a: "Ní chaithfidh. Ritheann sé sa bhrabhsálaí. Seol an nasc cuiridh agus téann daoine isteach óna bhfóin."
    - q: "Cén ráta malairte a úsáideann sé?"
      a: "Ráta malairte reatha nuair a chuireann tú an costas isteach, nó do cheann féin má fuair tú ceann difriúil. Socraítear an ráta nuair a shábhálaítear an costas, mar sin ní athluacháiltear seanchostais choíche."
    - q: "An féidir linn an grúpa a reo tar éis an turais?"
      a: "Is féidir. Is féidir le riarthóir an grúpa a ghlasáil ionas go bhfanann na huimhreacha mar atá."
    - q: "An bhfuil teorainn ar shuimeanna?"
      a: "Tá. 999,999.99 in aghaidh an chostais, ina airgeadra féin."
