featuresHeading: Su cosa si appoggia un viaggio
faq:
  heading: Domande
  items:
    - q: Chi ha saltato la cena può essere escluso?
      a: Sì. Scegli chi faceva parte di ogni spesa e solo quelle persone la pagano.
    - q: Funziona senza segnale?
      a: No. Side Badger ha bisogno di una connessione, quindi aggiungi i costi quando torni sul wifi.
    - q: Tutti devono installare qualcosa?
      a: No. Funziona nel browser. Manda il link di invito e le persone si uniscono dal telefono.
    - q: Che tasso di cambio usa?
      a: Un tasso di cambio attuale quando inserisci la spesa, oppure il tuo se ne hai ottenuto uno diverso. Il tasso viene fissato quando la spesa è salvata, quindi le vecchie spese non vengono mai rivalutate.
    - q: Possiamo congelare il gruppo dopo il viaggio?
      a: Sì. Un admin può bloccare il gruppo così i numeri restano fermi.
    - q: C'è un limite agli importi?
      a: Sì. 999.999,99 per spesa, nella sua valuta.
