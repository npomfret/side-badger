faq:
  heading: "Fragen"
  items:
    - q: "Welchen Wechselkurs verwendet Side Badger?"
      a: "Einen aktuellen Wechselkurs, der beim Eingeben der Ausgabe abgerufen wird, wo einer verfügbar ist. Du kannst ihn auf den Kurs ändern, den du tatsächlich bekommen hast."
    - q: "Kann die Gruppe bei Pfund und Yen bleiben?"
      a: "Ja. Schalte in den **Einstellungen** der Gruppe unter **Währungseinstellungen** **Währungen für diese Gruppe einschränken** ein, wähle unter **Erlaubte Währungen** die Währungen aus und lege die **Standardwährung für neue Ausgaben** fest. Weniger Auswahl in der Liste, weniger Fehlgriffe an der Kasse."
    - q: "Müssen wir überhaupt umrechnen?"
      a: "Nein. Währungen bleiben getrennt, es sei denn, du oder deine Gruppe entscheidet sich fürs Umrechnen, und jede Währung bekommt ihre eigene kurze Liste von Zahlungen."
