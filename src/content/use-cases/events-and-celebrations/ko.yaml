featuresHeading: "이럴 때 쓰는 기능"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "손님이 참여하지 않고 그룹을 볼 수 있나요?"
      a: "아니요. 링크나 QR 코드와 무료 계정으로 참여하므로, 들어온 뒤에야 그룹을 볼 수 있습니다."
    - q: "사이드 배저가 돈을 걷어 주나요?"
      a: "아니요. 사이드 배저는 계산을 기록할 뿐 돈을 옮기지 않습니다. 원하는 방법으로 서로 지불한 다음 결제를 기록하세요. 무료이며 광고도 일일 한도도 없습니다. [가격](page:pricing)을 참고하세요."
    - q: "투표를 익명으로 할 수 있나요?"
      a: "네. 투표를 만들 때 누가 무엇에 투표했는지 숨길 수 있습니다. 설정은 첫 투표 전에만 바꿀 수 있어요."
    - q: "사람마다 다른 금액을 낼 수 있나요?"
      a: "네. 지출을 정확한 금액으로 나누면 각자의 몫이 합의한 금액 그대로가 되고, 관여하지 않은 사람은 뺄 수 있습니다."
    - q: "주최자가 장부를 맡을 수 있나요?"
      a: "네. 관리 그룹 프리셋을 쓰면 만든 사람과 관리자만 지출을 바꾸고, 관리자가 새 멤버를 승인합니다."
