faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "కాలిక్యులేటర్ ఉచితమా?"
      a: "అవును. ఉచితం. ప్రకటనలు లేవు. రోజువారీ పరిమితులు లేవు. ఖాతా కూడా అవసరం లేదు."
    - q: "నేను టైప్ చేసింది ఇది సేవ్ చేస్తుందా?"
      a: "లేదు. ఏదీ సేవ్ కాదు, ఎక్కడికీ పంపబడదు. మీ అంకెలను ఉంచుకోవాలంటే లింక్ కాపీ చేసి, ఆ లింక్‌ను ఎక్కడైనా భద్రపరచండి."
    - q: "నేను కాపీ చేసిన లింక్‌ను ఎవరు చూడగలరు?"
      a: "అది ఉన్నవాళ్లు ఎవరైనా. అంకెలు లింక్‌లోనే, # తర్వాత ఉంటాయి, కాబట్టి వాటిని చూడాల్సిన వాళ్లతో మాత్రమే పంచుకోండి."
    - q: "ఇది డబ్బును కదిలిస్తుందా?"
      a: "లేదు. ఎవరు ఎవరికి చెల్లించాలో అది లెక్కిస్తుంది, మీకు నచ్చిన విధంగా మీరు ఒకరికొకరు చెల్లించుకుంటారు. Side Badger కూడా మీ డబ్బును ఎప్పుడూ తాకదు. [లెక్క తేల్చడం](page:feature/settle-up) చూడండి."
    - q: "రెండు కరెన్సీలలో చెల్లించిన ట్రిప్‌ను పంచవచ్చా?"
      a: "ఇక్కడ కాదు, ఎందుకంటే ఒక లెక్కకు ఒకే కరెన్సీ ఉంటుంది. గ్రూప్‌లో ప్రతి కరెన్సీకి దాని సొంత బ్యాలెన్స్ ఉంటుంది. [అనేక కరెన్సీలు](page:feature/multiple-currencies) చూడండి."
    - q: "మొత్తాలు సరిపోకపోతే ఏమవుతుంది?"
      a: "కాలిక్యులేటర్ ఖర్చు కింద ఆ మాట చెబుతుంది, అవి సరిపోయే వరకు ఫలితం చూపదు. కచ్చితమైన మొత్తాలు ఖర్చు మొత్తానికి సరిపోవాలి, శాతాలు 100 కావాలి."
