sections:
  - heading: "Egy pénznem az egész csoportnak"
    body: "Ha a csoport inkább nem gondolkodna rajta, válassz csoportpénznemet, és az űrlap minden új költséget arra vált át, egy olyan árfolyamon, amelyet továbbra is látsz és módosíthatsz. Ez csak az új és a másolt költségekre vonatkozik. A szerkesztések és a meglévő költségek úgy maradnak, ahogy vannak, így semmi már rögzített nem változik meg alattad."
  - heading: "Eurót tartozol, fonttal fizetsz"
    body: "Jenben fizettek, fontban számoltok el? Semmi gond. Amikor kifizetést rögzítesz, azt is átválthatod, így aki eurót tartozik, fonttal fizethet, és az eurós egyenleg így is helyesen jön ki. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd."
  - heading: "Szabályok a csoportnak"
    body: "Korlátozd a csoportot azokra a pénznemekre, amelyeket tényleg használtok, és állíts be alapértelmezettet, hogy az űrlap a megfelelőn nyíljon meg. Egy portugáliai nyaralásnak nincs szüksége 139 másik lehetőségre a vacsoraszámla mellett, egy [külföldi esküvőnek](page:use-case/events-and-celebrations) pedig valószínűleg kettőre."
limits:
  heading: "Korlátok"
  items:
    - "Az árfolyam a költség mentésekor rögzül. A régi költségeket sosem értékeljük újra."
    - "A Side Badger lehetőség szerint aktuális árfolyamot kér le. Nem minden párosra garantált, és az árfolyamot mindig beírhatod te magad."
    - "A csoport automatikus átváltása csak az új és a másolt költségekre vonatkozik, a szerkesztésekre és a meglévő költségekre nem."
    - "Minden költség legfeljebb 999 999,99 lehet a saját pénznemében."
    - "140 pénznem van. A kriptovaluták és a fémek nincsenek köztük."
    - "A Side Badger kifizetéseket rögzít. Sosem mozgat és nem is vált pénzt."
useCasesHeading: "Hol segít ez"
faq:
  heading: "Kérdések"
  items:
    - q: "Melyik árfolyamot használjátok?"
      a: "Egy aktuális árfolyamot, amelyet a költség megadásakor kérünk le, ha elérhető. Átírhatod arra, amelyet ténylegesen kaptál, és az átváltott összeg frissül."
    - q: "Újraértékelődnek a régi költségek?"
      a: "Nem. Az árfolyam a költség mentésekor rögzül, így egy egyenleg nem sodródik el attól, hogy a piac elmozdult."
    - q: "Támogattok kriptót?"
      a: "Nem. 140 pénznem van, és a kriptovaluták nincsenek köztük."
    - q: "Miért nem tudok beírni 2 000 000 rúpiát?"
      a: "Minden költség legfeljebb 999 999,99 lehet a saját pénznemében. Add meg egy másik pénznemben és válts át, vagy oszd két költségre."
    - q: "Kerül valamibe az átváltás?"
      a: "Nem. Az átváltás ingyenes, mint a Side Badger többi része. Lásd az [árakat](page:pricing)."
    - q: "Kötelező átváltanom?"
      a: "Nem. A pénznemek külön maradnak, hacsak te vagy a csoportod nem dönt az átváltás mellett, és minden pénznemnek megvan a saját rövid kifizetéslistája."
