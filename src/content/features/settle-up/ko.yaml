meta:
  title: "더 적은 결제로 정산하기 | 사이드 배저"
  description: "그룹에서 누가 누구에게 빚졌는지 확인하고, 모두를 정산해 주는 짧은 결제 목록을 받아 보세요. 결제는 일어나는 대로 기록하면 됩니다. 무료로 사용할 수 있어요."
h1: "더 적은 결제로 정산하기"
navLabel: "정산하기"
lead: "사이드 배저는 그룹 모두의 잔액을 계속 기록하고, 이를 정산해 주는 짧은 결제 목록을 제안합니다. 지불은 원하는 방법으로 서로 하고, 그다음 기록하세요. 숫자가 어떻게 나뉘는지 먼저 보고 싶다면 [지출 나누기](page:feature/split-expenses)부터 시작하세요."
cta:
  heading: "누가 누구에게 빚졌는지 풀 준비가 되셨나요?"
  body: "계정을 만들고, 그룹을 시작하고, 첫 지출을 추가하세요. 그다음은 잔액이 알아서 이어 갑니다."
  button: "무료 계정 만들기"
problem:
  heading: "진행하는 대로 업데이트되는 잔액"
  body: "지출이 생길 때마다 누가 누구에게 빚졌는지가 바뀌므로, 사이드 배저는 지출과 결제가 추가될 때마다 잔액을 최신으로 유지합니다. 그룹의 모든 사람이 변경 사항을 바로 확인하고, 무엇이 바뀌었는지와 누가 바꿨는지도 볼 수 있어요. 잔액은 통화별로 관리되므로, 입력할 때 환산한 지출이 아니라면 유로와 파운드는 각자의 열에 따로 남습니다. 기본적으로 나와 관련된 빚이 보이고, **모두 보기**를 누르면 그룹 전체가 나옵니다."
workflow:
  heading: "정산까지 세 단계"
  steps:
    - title: "누가 누구에게 빚졌는지 보기"
      body: "그룹의 잔액을 열어 내가 줄 돈과 받을 돈, 그리고 통화별로 계산된, 모두를 정산해 주는 짧은 결제 목록을 확인하세요. 질문이 제기된 지출은 해결될 때까지 계산에서 제외됩니다. 아래 룸메이트 예시에서는 결제 6건이 2건으로 줄어듭니다."
      shot: S10
      shotAlt: "두 가지 통화로 간소화된 빚이 표시되고 ‘모두 보기’가 켜진 잔액 화면"
    - title: "원하는 방법으로 지불하고, 기록하기"
      body: "계좌 이체, 현금, 지난 휴가에서 진 신세. 사이드 배저는 돈을 옮기지 않습니다. 돈이 오가면 결제를 기록하세요. 그러면 모두의 잔액이 업데이트됩니다."
      shot: S11
      shotAlt: "빠른 정산 버튼과 일부 결제 안내가 보이는 결제 양식"
    - title: "제대로 반영됐는지 확인하기"
      body: "결제는 그룹 내역에 남아 그룹의 모든 사람이 볼 수 있고 이모지로 반응할 수 있어요. 결제가 도착하면 함께 축하하세요."
      shot: S12
      shotAlt: "결제에 이모지 반응이 달린 결제 내역"
