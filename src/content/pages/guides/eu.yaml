meta:
  title: "Kostuak bidezki banatzeko gidak | Side Badger"
  description: "Alokairua, opor-villak eta taldeko kostuak bidezki banatzeko gida praktikoak, bakoitza talde errealista batekin eta kalkuluak erakutsiz landua."
h1: "Kostuak bidezki banatzeko gidak"
navLabel: "Gidak"
lead: "Jendeak kalkulu-orri bat ireki aurretik egiten dituen galderak, erantzunda: talde errealista bat, kalkuluak eta aplikazioko urratsak."
intro: "Gida bakoitzak **fikziozko talde bat** jarraitzen du lehen gastutik azken ordainketa erregistratuaraino. Zenbakiak zuretzat landuta daude, eta urratsek pantailak aplikazioak izendatzen dituen bezala erabiltzen dituzte."
cta:
  heading: "Zure taldea honen antzekoa al da?"
  body: "Sortu kontu bat, hasi talde bat eta gehitu lehen gastua. Kalkuluak zuretzat egiten dira."
cardsHeading: "Aukeratu zure galdera"
