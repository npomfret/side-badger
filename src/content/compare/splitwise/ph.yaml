faq:
  heading: Mga tanong
  items:
    - q: Libreng alternatibo ba sa Splitwise ang Side Badger?
      a: "Sa paghahati ng bayarin sa grupo, oo. Libre ang pag-scan ng resibo, pag-convert ng pera, at walang ad, at walang pang-araw-araw na limitasyon. Kung kailangan mo ng native app, offline na paggamit, umuulit na gastos, o bayad sa loob ng app, ginagawa iyon ng Splitwise at hindi ng Side Badger."
    - q: Saan galing ang mga detalye tungkol sa Splitwise?
      a: "Sa sariling mga pahina ng Splitwise: ang home page, ang Pro page, at ang help center nito. May link ang bawat hanay ng talahanayan sa pahinang pinagmulan nito, at sinasabi ng petsa sa itaas ng talahanayan kung kailan namin binasa ang mga ito. Sinusuri namin ang mga ito kada quarter."
    - q: Mananatili bang libre ang Side Badger?
      a: "Libre ngayon ang lahat sa Side Badger, at walang bayad na tier. Kung magbago man ito, aabisuhan ka muna namin. Nasa [pahina ng presyo](page:pricing) ang mga detalye."
    - q: Kailangan bang lumipat ang lahat sa grupo ko?
      a: "Oo. Kailangan ng libreng account sa Side Badger ng lahat sa isang grupo, at puwede silang sumali gamit ang link o QR code."
    - q: May mobile app ba ang Side Badger?
      a: "Wala sa app store. Tumatakbo ito sa browser mo: mag-sign in sa telepono mo, saka idagdag ito sa home screen para bumukas na parang app. Ipinapakita ng [paano ito gumagana](page:how-it-works) kung paano."
