meta:
  title: "पार्टनर के साथ बिल बांटें, 50/50 या आमदनी से | Side Badger"
  description: "बोरिंग खर्च साझा करें, डेट नाइट को तिमाही हिसाब-किताब की मीटिंग बनाए बिना। 50/50, आमदनी से या बिल दर बिल बांटें, और देखें किसे किसका देना है। मुफ्त।"
h1: "कपल की तरह खर्च साझा करें, निष्पक्ष तरीके से"
navLabel: "कपल्स"
lead: "बोरिंग खर्च साझा करें, डेट नाइट को तिमाही हिसाब-किताब की मीटिंग बनाए बिना। Side Badger किराए, बिलों और खरीदारी की एक चलती गिनती रखता है, उन **कपल्स** के लिए जो एक घर, एक सोफ़ा और इस धुंधली याद को साझा करते हैं कि ब्रॉडबैंड का पैसा किसने दिया था। 50/50 बांटें, आमदनी के हिसाब से, या बिल दर बिल, और देखें किसे किसका देना है।"
cta:
  heading: "दो लोगों का ग्रुप शुरू करें"
  body: "अकाउंट बनाएं, ग्रुप बनाएं और अपने पार्टनर को इनवाइट लिंक भेजें। आज रात का टेकअवे पहला खर्च बन सकता है।"
scenario:
  heading: "निष्पक्ष का मतलब 50/50 होना ज़रूरी नहीं"
  body: "Sam और Alex एक घर साझा करते हैं। Sam की कमाई ज़्यादा है, इसलिए उन्होंने तय किया कि किराए का 60% Sam का और 40% Alex का होगा। मकान मालिक को पैसे देना Sam का काम है, खरीदारी Alex के ज़िम्मे है, और दोनों को काफी यकीन है कि आखिर में सब बराबर हो जाता है। “काफी यकीन” से ही किसी के फोन का एक नोट पुरानी बहस बन जाता है। इसलिए आप दोनों के लिए एक ग्रुप बनाएं, वह नाम चुनें जो आप चाहते हैं कि आपका पार्टनर देखे, और उन्हें इनवाइट लिंक या QR कोड भेजें। हर खर्च होते ही जोड़ें, बताएं किसने पेमेंट किया और वह कैसे बंटता है, और गिनती ग्रुप को रखने दें। हर छुट्टी के लिए अलग ग्रुप बनाएं ([ग्रुप ट्रिप](page:use-case/group-trips) देखें), ताकि फ्लाइट का खर्च किराने से अलग रहे।"
sections:
  - heading: "50/50, आमदनी से, या बिल दर बिल"
    body: "कोई बंटवारा हर किसी के लिए निष्पक्ष नहीं होता, बस वही होता है जिस पर आप दोनों सहमत हों, अच्छा हो कि पहले बिल से पहले, पहली आह के बाद नहीं। आम तौर पर ये तीन होते हैं।"
    items:
      - "**50/50।** **समान रूप से** चुनें और आप दोनों आधा-आधा देते हैं। यह तब ठीक बैठता है जब आपकी आमदनी करीब-करीब बराबर हो, और इसमें कोई गणित नहीं लगता।"
      - "**आमदनी के हिसाब से।** अगर आप में से एक ज़्यादा कमाता है, तो आने वाले पैसे में हर व्यक्ति के हिस्से के हिसाब से बांटें। पहले तय करें कि क्या गिना जाएगा (हाथ में आने वाली तनख्वाह आम चुनाव है), दोनों को जोड़ें और अपनी को कुल से भाग दें। अगर एक के हाथ में तीन हिस्से आते हैं और दूसरे के दो, तो वह 3 ÷ (3 + 2) = 60% है, यानी एक 60% देगा और दूसरा 40%। पूरे प्रतिशत तक गोल करें और उन्हें **प्रतिशत** में डालें, जहां उनका जोड़ 100 होना चाहिए। अपनी तनख्वाह डालने की कोई जगह नहीं है, इसलिए आप हमेशा सिर्फ प्रतिशत टाइप करते हैं।"
      - "**बिल दर बिल।** हर खर्च का अपना बंटवारा होता है, इसलिए आप मिला सकते हैं: किराया आमदनी के हिसाब से, किराना 50/50, और साझा तोहफा **सटीक राशियाँ** से अगर आप दोनों ने खुद चुना कि कितना डालना है।"
      - "**जब तनख्वाह बदले,** तो अगले खर्च से नए प्रतिशत इस्तेमाल करें। पुराने खर्चों में वही बंटवारा रहता है जिसके साथ वे डाले गए थे। असली सैलरी स्लिप के साथ गणित देखने के लिए [ज़्यादा कमाने वाले पार्टनर के साथ बिल कैसे बांटें](page:guide/how-to-split-bills-with-a-partner-who-earns-more) पढ़ें।"
  - heading: "महीने का लेखा-जोखा"
    body: "महीने में एक बार, या जब भी संख्याएं कुलबुलाने लगें, ग्रुप खोलें और **शेष** देखें। आप दोनों के बीच हर करेंसी में हमेशा सिर्फ एक पेमेंट बनता है, जिसे देना है उसकी तरफ से जिसे मिलना है उसके लिए। Sam और Alex का महीना देखिए। £1,500 का किराया Sam ने दिया, और उसमें Alex का 40% £600 है। £90 का किराना Alex ने लिया, जो बराबर बंटा, तो उसमें Sam का आधा £45 है। Side Badger एक को दूसरे से काट देता है, £600 में से £45 घटाकर, और Alex को Sam को £555 देने हैं। जैसे चाहें पेमेंट करें, बैंक ट्रांसफर से, कैश से या किसी एहसान से, फिर उसे **हिसाब बराबर करें** के तहत रिकॉर्ड करें ताकि बैलेंस वापस शून्य हो जाए। दोहराए जाने वाले बिल नहीं हैं, इसलिए पिछले महीने का किराया कॉपी करें, तारीख बदलें और आगे बढ़ें। Side Badger पैसे नहीं भेजता और रिमाइंडर भी नहीं भेजता, इसलिए याद दिलाने का काम अब भी आपका है।"
  - heading: "बस आप दोनों"
    body: "दो लोगों के ग्रुप में दो सदस्य होते हैं, और ग्रुप को सिर्फ उसके सदस्य देख सकते हैं। आपका पार्टनर इनवाइट लिंक या QR कोड से जुड़ता है। एक लिंक 15 मिनट से लेकर 5 दिन तक चल सकता है, इसलिए सबसे छोटा चुनें जो आपके पार्टनर को उसे इस्तेमाल करने का समय दे। नया लिंक बनाने से पुराने रद्द नहीं होते, इसलिए उन्हें ऐसी चैट में न छोड़ें जिसमें दूसरे लोग भी हों। जो भी चालू लिंक इस्तेमाल करे वह जुड़ सकता है, इसलिए पक्का करना हो तो अप्रूवल चालू करें और एडमिन हर व्यक्ति को अंदर आने दे। आपके पार्टनर को अपना खुद का अकाउंट चाहिए, जो मुफ्त है।"
exampleAfter: 2
