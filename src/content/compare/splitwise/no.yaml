sections:
  - heading: Pengeprat, ved siden av pengene
    body: "Felles penger kommer med prat, tvil og planer. Side Badger holder alle tre ved siden av tallene, så ingen må bla seg tilbake i chatten."
    items:
      - "**Kommentarer der de hører hjemme.** Kommenter selve gruppen, eller en hvilken som helst utgift, liste eller avstemning, og la samtalen stå ved siden av det den handler om."
      - "**Kvitteringer og bilder.** Ha opptil tre kvitteringer på hver utgift, og legg til bilder eller PDF-er i kommentarer på gruppen, en liste eller en avstemning."
      - "**Spørsmål, ikke krangel.** En administrator kan slå på spørsmål, så kan alle i en utgift spørre om den. Den holdes utenfor saldoene til det er avklart."
      - "**Lister og avstemninger.** Ha den felles handlelisten ved siden av handleregningene, og send villashortlisten til avstemning, anonymt hvis du vil."
      - "**Litt applaus.** Reager på utgifter, betalinger og kommentarer, og feir en betaling når den kommer inn."
  - heading: Din gruppe, dine regler
    body: "Splitwises hjelpesenter sier at den ikke støtter gruppeadministratorer eller spesielle tillatelser. Side Badger har roller og tillatelser, for gruppene som trenger noen som holder orden på tallene."
    items:
      - "**Administratorer, medlemmer og seere.** Gjør noen til seer: de ser alt og endrer ingenting."
      - "**To forhåndsinnstillinger, eller dine egne.** Start med Åpent samarbeid eller Administrert gruppe, eller still inn hver tillatelse selv: hvem som redigerer og sletter utgifter, redigerer lister, inviterer og slipper inn nye."
      - "**Godkjenning for å bli med.** Slå på godkjenning, så slipper en administrator inn hver enkelt."
      - "**Gruppens egne innstillinger.** Begrens den til valutaene dere faktisk bruker, velg standardvalutaen og gi den et bannerbilde."
      - "**Lås den når det er over.** Tallene blir stående til en administrator låser opp."
  - heading: Gratis her, betalt der
    body: "Splitwise Pro er Splitwises betalte abonnement, og Splitwises egen Pro-side tilbyr tre ting som ikke koster noe i Side Badger."
    items:
      - "**Kvitteringsskanning.** Splitwise Pro skanner et bilde av kvitteringen din. Side Badger gjør det gratis, uten skannekreditter: den fyller inn sum, dato og sted, slik at du kan sjekke."
      - "**Valutakonvertering.** Splitwise Pro konverterer en gruppes utgifter til standardvalutaen din når du trykker på Konverter. Side Badger konverterer hver utgift mens du legger den inn, med en gjeldende valutakurs eller den du faktisk fikk, og det opprinnelige beløpet blir stående på utgiften."
      - "**Ingen daglig grense.** Splitwise Pro tilbyr ubegrenset antall utgifter, og hjelpesenteret deres sier at gratisbrukere kan legge til opptil 4 utgifter hver dag. Side Badger har ingen daglig grense."
  - heading: Banken din holdes utenfor
    body: "Side Badger kobler seg ikke til banken din og ber ikke om bankopplysningene dine. Den fører oversikten over hvem som skylder hvem; dere betaler hverandre slik dere vil, og registrerer så betalingen. Ingen bankinnlogging å levere fra seg, så ett bekymringspunkt mindre."
  - heading: Én app, i nettleseren og på telefonen
    body: "Side Badger kjører i nettleseren. Logg inn, legg den til på startskjermen, så åpnes den som en app. Det er den samme appen uansett, så en ny funksjon er på telefonen din neste gang du åpner appen, uten at du må vente på en oppdatering fra appbutikken."
  - heading: Og noen festkunster
    items:
      - "**Spør assistenten din.** Side Badger fungerer med ChatGPT og Claude: be din legge til en utgift, skanne en kvittering eller registrere en betaling."
      - "**Alle på sitt eget språk.** Side Badger snakker 39 språk, og hver og en velger sitt eget. Splitwises hjemmeside oppgir 7+. Den håndterer også 133 valutaer, for turen som går til alle kanter."
      - "**Hjelp uten å forlate appen.** Står du fast, eller har du funnet en feil? Si fra i appen og les svaret vårt rett der."
  - heading: Der Splitwise fortsatt vinner
    body: "Vi vil heller at du velger riktig app enn at du oppdager det senere. Trenger gruppen din noe av dette, har Splitwise det og Side Badger ikke."
    items:
      - "**Apper fra appbutikken.** Side Badger bor i nettleseren og på startskjermen, ikke i appbutikkene."
      - "**Frakoblet modus.** Side Badger trenger en tilkobling."
      - "**Betalinger i appen.** I noen land kan Splitwise flytte pengene også. Side Badger fører bare oversikten."
      - "**Deling etter andeler eller per vare.** Side Badger har én betaler per utgift, delt likt, etter nøyaktige beløp eller etter prosent. Kvitteringsskanningen tildeler ikke varer til personer."
      - "**Diagrammer og standarddelinger.** Splitwise Pro har begge. Side Badger fører oversikten over hvem som skylder hvem, og det er hele trikset."
  - heading: Flytte gruppen over
    body: "Det finnes ingen importfunksjon, så en flytting betyr en ny start. Gjør opp i Splitwise først, opprett så en gruppe i Side Badger og inviter alle med en lenke eller en QR-kode. Alle i gruppen trenger en gratis konto, og alt som skal til for å registrere seg, er en e-postadresse."
