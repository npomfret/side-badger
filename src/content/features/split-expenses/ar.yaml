sections:
  - heading: "الحاضرون فقط"
    body: "قسّم التكلفة بين الجميع، أو بين من شاركوا فيها فقط. استبعد الناس من التكاليف التي لم يكونوا طرفاً فيها، فتعكس الأرصدة ذلك. زميل السكن الذي غاب طوال الأسبوع لا يدين بثمن الوجبة الجاهزة، وهذا ما سيعدّه [زملاء السكن](page:use-case/housemates) عدالة بديهية."
  - heading: "التفاصيل التي تجنّبك الخلافات لاحقاً"
    items:
      - "حدّد **التاريخ** ووقتاً اختيارياً. وتوفّر لك اختصارات مثل اليوم وأمس وصباح اليوم وليلة أمس بعض الكتابة."
      - "أضف ما يصل إلى ثلاثة **تصنيفات** لتجميع المصروفات، مثل البقالة أو السفر."
      - "أضف **المكان**. الصق رابط خريطة فيمتلئ اسم المكان من تلقاء نفسه."
      - "أضف **ملاحظة** للقصة وراء الرقم، مع بعض التنسيق إن احتاجت القصة إليه."
      - "استخدم **التعليقات** لإبقاء الحوار بجانب المصروف الذي يخصه، بدلاً من سلسلة دردشة لا يعود أحد لتصفّحها."
  - heading: "انسخ وعدّل، واطّلع على ما تغيّر"
    body: "انسخ إيجار الشهر الماضي بدلاً من كتابته من جديد، ثم غيّر ما اختلف. وإذا كان رقم خاطئاً فعدّل المصروف. تُحفظ النسخة السابقة ويظهر التعديل في نشاط المجموعة، فلا يغيّر أحد رقماً في صمت. وما يُسمح لكل شخص بتعديله يعتمد على أذونات المجموعة."
  - heading: "حين يبدو شيء غير صحيح"
    body: "يمكن للمجموعة تفعيل أسئلة المصروفات. يمكن لأي شخص مشمول في مصروف أن يطرح سؤالاً ويذكر السبب، ويبقى المصروف خارج الأرصدة إلى أن يغلقه من سأل أو مشرف. هذه الميزة معطّلة افتراضياً، ويفعّلها المشرف للمجموعة. وهي تناسب [المناسبات والاحتفالات](page:use-case/events-and-celebrations)، حيث يصبح العربون الذي لا يتذكره أحد شأناً يهم الجميع فجأة."
limits:
  heading: "الحدود"
  items:
    - "يدفع شخص واحد لكل مصروف. إذا دفع شخصان فسجّل مصروفين."
    - "لا يوجد تقسيم بحسب البند ولا بحسب الحصص. الموجود هو التقسيم بالتساوي أو بمبالغ محددة أو بنسب مئوية."
    - "يجب أن يكون مجموع النسب المئوية 100."
    - "يمكن أن يصل المصروف إلى 999,999.99 بعملته الخاصة، مع المنازل العشرية المعتادة لتلك العملة."
    - "لا تتكرر المصروفات من تلقاء نفسها. انسخ مصروف الشهر الماضي بدلاً من ذلك."
    - "لا يمكن أن تكون التواريخ في المستقبل أو قبل أكثر من 10 سنوات."
    - "يصبح المصروف الذي يشمل شخصاً غادر المجموعة للقراءة فقط."
useCasesHeading: "أين يفيد هذا النوع من التقسيم"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يمكن لشخصين أن يدفعا مصروفاً واحداً؟"
      a: "ليس في مصروف واحد. سجّل مصروفين، واحداً لكل دافع، وستخرج الأرصدة نفسها."
    - q: "هل يمكنني تقسيم إيصال بحسب البنود؟"
      a: "لا. التقسيم يكون بالتساوي أو بمبالغ محددة أو بنسبة مئوية. وفي فاتورة ذات بنود مختلفة، أدخل ما على كل شخص كمبالغ محددة."
    - q: "هل يمكنني ضبط تقسيم افتراضي؟"
      a: "لا. انسخ مصروفاً سابقاً لإعادة استخدام تقسيمه، وغيّر ما اختلف."
    - q: "هل يمكن أن تتكرر الفواتير كل شهر؟"
      a: "لا. انسخ مصروف الشهر الماضي بدلاً من ذلك، وهذا يستغرق بضع ثوانٍ."
    - q: "من يستطيع تعديل مصروف؟"
      a: "من تسمح له أذونات المجموعة. يظهر كل تعديل في نشاط المجموعة، فلا تحدث تغييرات صامتة."
    - q: "ماذا يحدث للأرصدة بعد ذلك؟"
      a: "تتحدّث مع وصول المصروفات، و[تسوية الحسابات](page:feature/settle-up) تحوّلها إلى قائمة قصيرة من الدفعات. وإذا كان المصروف بعملة أخرى فانظر [العملات المتعددة](page:feature/multiple-currencies)."
