sections:
  - heading: "결제 기록하기"
    body: "누군가 지불하면 알맞은 사람 앞으로 기록하세요. 빠른 정산 버튼은 제안된 결제에서 금액을 채워 주고, “계좌 이체” 같은 메모(최대 500자)를 남길 수도 있어요. 줄 돈의 일부만 지불하면 나머지는 잔액에 남습니다. 너무 적거나 많은 금액을 입력하면 저장하기 전에 사이드 배저가 알려 드려요. 결제를 기록하려면 지출 수정 권한이 필요하고, 날짜는 미래일 수 없습니다."
  - heading: "다른 통화로 지불했다면?"
    body: "잔액은 결제한 통화로 유지되므로 유로 빚은 유로 빚으로 남습니다. 유로를 줘야 하는데 파운드로 지불하나요? 결제를 입력할 때 환산하세요. 현재 환율이나 실제로 적용받은 환율 중에서 고를 수 있어요. 환율은 결제를 저장할 때 고정됩니다. 환산이 어떻게 작동하는지는 [여러 통화](page:feature/multiple-currencies)에서, 실제 사용 모습은 [그룹 여행](page:use-case/group-trips)에서 확인할 수 있어요."
  - heading: "확인할 수 있는 내역"
    body: "기록된 모든 결제는 날짜, 금액, 메모와 함께 그룹 내역에 남습니다. 결제를 수정할 수 있는 사람은 기록한 사람뿐이고, 삭제는 기록한 사람이나 그룹 관리자가 할 수 있습니다. 그룹을 나간 사람이 포함된 결제는 잠깁니다. 룸메이트 시나리오 예시는 [룸메이트](page:use-case/housemates)를 참고하세요."
limits:
  heading: "사이드 배저가 하지 않는 일"
  items:
    - "사이드 배저는 돈을 옮기거나, 결제 링크를 보내거나, 결제 요청을 보내지 않습니다. 앱에서의 결제는 다른 곳에서 이뤄진 결제의 기록입니다."
    - "제안되는 결제는 통화별로 적용되는 간단한 매칭 방식으로 계산됩니다. 해당 통화에 잔액이 있는 사람 수보다 항상 적은 결제를 제안하지만(네 명이면 최대 세 건), 가능한 최소 횟수를 항상 찾아내지는 않습니다."
    - "제안 기능은 끌 수 없습니다. **모두 보기**를 누르면 내 결제뿐 아니라 그룹의 모든 제안된 결제가 표시됩니다."
    - "지출을 입력할 때 환산하지 않았다면 통화끼리 서로 상쇄되지 않습니다."
    - "알림 기능이 없으므로 결제를 독촉하는 일은 여전히 여러분 몫입니다."
useCasesHeading: "정산이 중요한 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "사이드 배저가 돈을 보내 주나요?"
      a: "아니요. 원하는 방법으로 서로 지불한 다음, 잔액이 업데이트되도록 사이드 배저에 결제를 기록하세요."
    - q: "제안된 결제를 끌 수 있나요?"
      a: "아니요. 간소화는 항상 켜져 있고, **모두 보기**를 누르면 나와 관련된 결제뿐 아니라 그룹의 모든 제안된 결제가 표시됩니다."
    - q: "유로와 파운드는 왜 따로 관리되나요?"
      a: "지출이나 결제를 입력할 때 환산하지 않는 한 잔액은 결제한 통화로 유지됩니다. 서로 다른 통화의 빚은 절대 상쇄되지 않습니다."
    - q: "일부만 지불하면 어떻게 되나요?"
      a: "지불한 부분을 기록하세요. 나머지는 지불될 때까지 잔액에 남습니다."
    - q: "항상 가능한 가장 적은 결제 횟수인가요?"
      a: "보장되지는 않습니다. 해당 통화에 잔액이 있는 사람 수보다 항상 적은 결제를 제안하므로, 네 명이라면 세 건을 넘지 않아요. 룸메이트 예시에서는 한 사람씩 직접 갚으면 6건이던 것이 2건이 됩니다."
