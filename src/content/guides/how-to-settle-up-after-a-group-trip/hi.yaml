meta:
  title: "ग्रुप ट्रिप के बाद हिसाब कैसे चुकता करें | Side Badger"
  description: "सबके बिखरने से पहले हिसाब निपटाएं। दस उलझे कर्ज़ चार पेमेंट बन जाते हैं, होते ही रिकॉर्ड, और आंशिक पेमेंट भी चलता है। पांच दोस्तों का पूरा हिसाब।"
h1: "ग्रुप ट्रिप के बाद हिसाब कैसे चुकता करें"
navLabel: "ट्रिप के बाद हिसाब चुकता"
lead: "सबके बिखरने से पहले हिसाब चुकता करें। आखिरी खर्च जोड़ें, ग्रुप के बैलेंस खोलें और छोटी सूची में से जो आपको देना है उसका पेमेंट जैसे चाहें करें। फिर हर पेमेंट Side Badger में रिकॉर्ड करें ताकि पूरे ग्रुप के लिए बैलेंस साफ हो जाए। पांच दोस्तों और पांच खर्चों के लिए दस उलझे कर्ज़ चार पेमेंट में सिमट जाते हैं।"
cta:
  heading: "फोटो आने से पहले हिसाब बंद कर दें"
  body: "मुफ्त अकाउंट बनाएं, अगली ट्रिप के लिए ग्रुप शुरू करें और हर खर्च होते ही जोड़ें। एयरपोर्ट पहुंचते-पहुंचते पेमेंट की छोटी सूची तैयार मिलती है। पहले देखना चाहते हैं कि [हिसाब चुकता करना कैसे काम करता है](page:feature/settle-up)?"
sections:
  - heading: "पांच दोस्त, पांच खर्च, एक डिपार्चर लाउंज"
    body: "Mo, Ines, Raf, Tess और Uma ने समुद्र किनारे एक हफ्ता बिताया। Mo ने अपार्टमेंट बुक किया और किराना खरीदा, Ines ने नाव की सैर का पेमेंट किया और Raf ने बड़ा डिनर चुकाया। Tess ने Uma और Mo के साथ एयरपोर्ट की टैक्सी ली, क्योंकि Ines और Raf को ट्रेन पकड़नी थी। Uma का कार्ड घर पर रह गया था, इसलिए उसने कुछ नहीं चुकाया। यानी पांच खर्च और कुल €1,700, और डिपार्चर लाउंज में कोई नहीं बता पा रहा था कि कौन आगे है।"
  - heading: "दस कर्ज़, चार पेमेंट"
    body: "अपार्टमेंट, नाव, डिनर और किराना पांचों में बराबर बंटते हैं। यह €200, €50, €60 और €18 प्रति व्यक्ति है, इसलिए Ines और Raf, दोनों पर €328 बनते हैं। टैक्सी तीन लोगों में €20 प्रति व्यक्ति बंटती है, इसलिए Mo, Tess और Uma पर €348 बनते हैं। Mo ने €1,090 चुकाए और उसके हिस्से के €348 बनते हैं, इसलिए उसे €742 मिलने हैं। बाकी सबने जितना बनता था उससे कम चुकाया। Uma के €348 कम पड़ते हैं, Tess के €288, Ines के €78 और Raf के €28, और ये मिलकर Mo के €742 होते हैं। हर जोड़ी का सीधा हिसाब करें तो दस अलग कर्ज़ बनते हैं। Side Badger इसके बजाय चार पेमेंट सुझाता है, सब Mo को।"
  - heading: "सबके बिखरने से पहले हिसाब चुकता करें"
    body: "सबसे अच्छा मौका आखिरी शाम या घर लौटते समय का है, जब सब एक ही जगह होते हैं और €28 के कर्ज़ का ज़िक्र करना आसान होता है। पहले हर खर्च जोड़ें, टैक्सी समेत। जब तक किसी का कुछ देना या पाना बाकी है, वह ग्रुप नहीं छोड़ सकता, इसलिए गिनती को किसी न किसी वक्त बंद करना ही पड़ेगा।"
    items:
      - "**सूची देखें।** ग्रुप खोलें और **शेष** देखें। डिफ़ॉल्ट रूप से आपको वे कर्ज़ दिखते हैं जिनमें आप शामिल हैं। पूरे ग्रुप की सूची देखने के लिए **सभी दिखाएं** चुनें।"
      - "**जैसे चाहें पेमेंट करें।** बैंक ट्रांसफर, कैश, पिछली छुट्टी का कोई एहसान। Side Badger पैसे नहीं भेजता।"
      - "**रिकॉर्ड करें।** **हिसाब बराबर करें** चुनें। **त्वरित निपटान** के तहत हर बटन आपकी सुझाई गई पेमेंट में से एक है, और उसे चुनने से राशि भर जाती है। “बैंक ट्रांसफर” जैसा **नोट** जोड़ें, **तारीख** जांच लें (वह भविष्य की नहीं हो सकती) और **भुगतान रिकॉर्ड करें** चुनें।"
      - "**साफ होते देखें।** बैलेंस सबके लिए अपडेट हो जाता है। आखिरी पेमेंट आते ही **शेष** में **सब चुकता हो गया!** दिखता है।"
  - heading: "अभी कुछ, बाकी बाद में"
    body: "Uma आज रात €200 भेज सकती है और बाकी महीने के आखिर में। वह €200 रिकॉर्ड करती है, और फॉर्म उसे चेतावनी देता है कि इसके बाद भी उसे Mo को €148 देने रहेंगे, यानी €348 में से €200 घटाकर। सेव करें और €148 उसके बैलेंस पर तब तक रहता है जब तक वह बाकी रिकॉर्ड न कर दे। चेतावनी दूसरी तरफ भी काम करती है। अगर कोई फालतू शून्य €348 को €3,480 बना दे, तो फॉर्म बताता है कि उसे Mo को सिर्फ €348 देने हैं और सेव करने से उल्टी दिशा में कर्ज़ बन जाएगा। सेव करने से पहले शून्य ठीक कर लें।"
  - heading: "गलतियां सुधारना, और पेमेंट पर जश्न"
    items:
      - "**गलत पेमेंट।** पेमेंट को सिर्फ वही व्यक्ति एडिट कर सकता है जिसने उसे रिकॉर्ड किया। वह या ग्रुप का कोई एडमिन उसे हटा सकता है, और फिर उसे दोबारा रिकॉर्ड किया जा सकता है।"
      - "**ध्यान देने लायक पेमेंट।** हर रिकॉर्ड किया गया पेमेंट अपनी तारीख और नोट के साथ **भुगतान** में रहता है, जहां ग्रुप में सब उसे देख सकते हैं और रिएक्ट कर सकते हैं। जब Uma के आखिरी €148 पहुंचें, तो Mo **जश्न** चुन सकता है।"
      - "**अंत।** जब हर बैलेंस शून्य हो, तो एडमिन ग्रुप को लॉक कर सकता है ताकि संख्याएं वहीं रहें।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह पैसे कभी नहीं भेजता। इसमें पेमेंट लिंक या पेमेंट रिक्वेस्ट नहीं हैं, इसलिए ऐप में दर्ज पेमेंट कहीं और किए गए पेमेंट का रिकॉर्ड है।"
      - "यह रिमाइंडर नहीं भेजता। देर से होने वाले पेमेंट के पीछे पड़ना अब भी आपका काम है।"
      - "यह डेडलाइन तय नहीं करता। Uma के बाकी €148 कब देने हैं, यह ग्रुप आपस में तय करे।"
      - "सुझाए गए पेमेंट एक छोटी सूची हैं, सबसे छोटी संभव सूची का वादा नहीं। वे हर करेंसी के हिसाब से निकाले जाते हैं, इसलिए यूरो और पाउंड में चुकाई गई ट्रिप के लिए हर एक की अलग सूची बनती है।"
exampleAfter: 2
