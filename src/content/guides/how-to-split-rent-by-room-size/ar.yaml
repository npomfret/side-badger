meta:
  title: "كيف تقسّم الإيجار بحسب مساحة الغرف | Side Badger"
  description: "الغرفة الأكبر تدفع حصة أكبر. اعزل الغرف المشتركة، وقسّم الباقي بحسب المساحة، وأدخل النسب مرة واحدة. الحسابات كاملة لثلاثة من زملاء السكن."
h1: "كيف تقسّم الإيجار بحسب مساحة الغرف"
navLabel: "الإيجار بحسب مساحة الغرف"
lead: "حدّد كم من الإيجار يقابل الغرف المشتركة وقسّمه بالتساوي، ثم قسّم الباقي بحسب مساحة كل غرفة نوم. قرّب إلى نسب مئوية بأعداد صحيحة، وأدخلها على الإيجار في Side Badger مرة واحدة، ثم انسخ المصروف كل شهر."
cta:
  heading: "أدخل الإيجار مرة واحدة"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة للشقة، وأدخل الإيجار بالنسب التي اتفقتم عليها. والشهر القادم مجرد نسخة. تريد جولة أولاً؟ انظر [كيف يعمل](page:how-it-works) أو [ما الذي يشمله الاستخدام المجاني](page:pricing)."
sections:
  - heading: "ثلاثة أشخاص، وشقة واحدة، وجدال واحد"
    body: "تتشارك بريا وتوم وعائشة شقة بإيجار £1,950 في الشهر. وطوال سنة كاملة كانوا يقسّمونه على ثلاثة بالتساوي، لأن ذلك أسهل. ثم قاست عائشة غرفتها. غرفة بريا 16 م²، وغرفة توم 12 م²، وغرفة عائشة 10 م²، فكانت عائشة تدفع ما تدفعه بريا مقابل غرفة أصغر من غرفة بريا بأكثر من الثلث. لم يكن أحد غير معقول. ولم يُجرِ أحد الحساب. وبينما يتناولون وجبة جاهزة اتفقوا أولاً على قاعدة واحدة. من الإيجار، تذهب نسبة 40% مقابل المطبخ والحمام وغرفة الجلوس، التي يستخدمها الثلاثة جميعاً."
  - heading: "الطريقة، مع إظهار الحسابات"
    body: "أربع خطوات، ومتر قياس، وآلة حاسبة في الهاتف."
    items:
      - "**اعزل الجزء المشترك.** تتفق المجموعة على حصة من الإيجار تقابل الغرف التي يستخدمها الجميع. وفي هذه الشقة هي 40%، أي 13.33% لكل واحد من الثلاثة."
      - "**قسّم الباقي بحسب المساحة.** الـ 60% الأخرى تُقسَّم بحسب حجم غرف النوم. مجموع مساحات غرف النوم 38 م² (16 + 12 + 10)، فحصة بريا 60% × 16/38، أي 25.26%."
      - "**اجمع الجزأين.** بريا: 25.26% + 13.33% = 38.6%. توم: 60% × 12/38 = 18.95%، وبإضافة 13.33% تصبح 32.3%. عائشة: 60% × 10/38 = 15.79%، وبإضافة 13.33% تصبح 29.1%."
      - "**قرّب وتحقق.** النسب بأعداد صحيحة أسهل في الكتابة وفي الجدال حولها، فتتحول 38.6% إلى 39%، و32.3% إلى 32%، و29.1% إلى 29%. تحقق أن 39 + 32 + 29 يساوي 100. وإذا وقع تقريبكم على 99 أو 101، تتفق المجموعة على من تتحرك حصته بنقطة واحدة."
  - heading: "قراءة شهر الشقة"
    body: "يصبح الإيجار بنسب 39% و32% و29% مبالغ £760.50 و£624.00 و£565.50. دفعت بريا للمالك، فمستحق لها خلال الشهر £1,142.50، بينما يدين توم بمبلغ £566.00 وتدين عائشة بمبلغ £576.50. ويقترح Side Badger دفعتين، كلتاهما إلى بريا."
  - heading: "جهّزها في Side Badger"
    body: "أمسية واحدة، معظمها يذهب في مناقشة نسبة الـ 40%."
    items:
      - "**أنشئ المجموعة.** من لوحة التحكم اختر **إنشاء مجموعة** وسمِّها باسم الشقة. اختر **دعوة الآخرين** وأرسل الرابط أو رمز QR. يسجّل الجميع الدخول أو ينشئون حساباً مجانياً، ويختار كل واحد الاسم الذي يريد أن يظهر به في هذه المجموعة."
      - "**أضف الإيجار.** اختر **إضافة مصروف**. أدخل الوصف والمبلغ، وتحت **من دفع؟** اختر من دفع للمالك. أبقِ الأشخاص الثلاثة جميعاً تحت **تقسيم بين**، ثم تحت **كيفية التقسيم** اختر **نسبة مئوية** واكتب 39 و32 و29. ينبّهك النموذج إذا لم يكن مجموع النسب 100. اختر **حفظ المصروف**."
      - "**أضف الفواتير.** الطاقة والإنترنت مصروفان منفصلان لكل منهما دافعه. اترك **كيفية التقسيم** على **بالتساوي**."
      - "**انسخه الشهر القادم.** افتح إيجار الشهر الماضي واختر **نسخ المصروف**. تحتفظ النسخة بالدافع والمبلغ والتقسيم، وتأخذ تاريخ اليوم. غيّر المبلغ إذا تغيّر الإيجار، ثم اختر **إنشاء نسخة**."
      - "**اعرف من يدين لمن.** يعرضه قسم **الأرصدة**. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة تحت **تسوية**."
  - heading: "الغرف ذات الحمام الخاص والغرف الصغيرة ومن يغادر"
    items:
      - "**الغرف ذات الحمام الخاص والغرف الصغيرة.** المساحة نقطة بداية فقط. الغرفة التي فيها حمام خاص تساوي أكثر من الغرفة نفسها بلا حمام، والغرفة الصغيرة التي لا تتسع إلا لسرير وكرسي يأمل أن يجد مكاناً تساوي أقل. عدّلوا النسب بالاتفاق، وتأكدوا أن مجموعها ما زال 100، واكتبوا الأرقام النهائية في مكان يراه كل من في الشقة."
      - "**يغادر أحدهم في منتصف الشهر.** احسب ما يدين به كل شخص عن ذلك الشهر، وأدخل إيجار ذلك الشهر بـ**مبالغ دقيقة** بدلاً من **نسبة مئوية**. يجب أن يساوي مجموع المبالغ الإيجار. افعل ذلك قبل أن يرحل. لا يمكن لأحد مغادرة المجموعة ما دام عليه مبلغ أو له مبلغ، ويصبح أي مصروف يشمل شخصاً غادر للقراءة فقط."
      - "**ينتقل أحدهم للسكن.** قس من جديد، وأعد الحسابات بمساحات الغرف الجديدة، واستخدم النسب الجديدة من الإيجار التالي. تبقى الشهور السابقة كما كانت."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا يقيس غرفكم ولا يختار النسب. المساحات ونسبة الـ 40% تتفق عليها المجموعة."
      - "ليس فيه فواتير متكررة، فتنسخ إيجار الشهر الماضي كل مرة."
      - "لا ينقل المال أبداً ولا يدفع للمالك. تدفعون لبعضكم بالطريقة التي تناسبكم وتسجّلون ذلك."
      - "لا يعرف ما يقوله عقد الإيجار. يحتفظ بالحساب بين الأشخاص في المجموعة."
