featuresHeading: "একটি ট্রিপ যার ওপর ভর করে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "যারা ডিনার বাদ দিয়েছে তাদের কি বাদ রাখা যায়?"
      a: "হ্যাঁ। প্রতিটি খরচে কে অন্তর্ভুক্ত ছিল তা বেছে নিন, আর শুধু তাদেরই সেটার জন্য ধরা হয়।"
    - q: "সিগন্যাল ছাড়া কি চলে?"
      a: "না। Side Badger-এর সংযোগ লাগে, তাই ওয়াইফাই পেলে খরচ যোগ করুন।"
    - q: "সবাইকে কি কিছু ইনস্টল করতে হবে?"
      a: "না। এটি ব্রাউজারে চলে। আমন্ত্রণ লিঙ্ক পাঠান, মানুষজন নিজেদের ফোন থেকে যোগ দেবে।"
    - q: "এটি কোন এক্সচেঞ্জ রেট ব্যবহার করে?"
      a: "খরচ লেখার সময়ের বর্তমান এক্সচেঞ্জ রেট, বা আপনি অন্য রেট পেয়ে থাকলে আপনার নিজেরটা। খরচ সেভ হওয়ার সময় রেট স্থির হয়ে যায়, তাই পুরনো খরচের মূল্য কখনও নতুন করে ধরা হয় না।"
    - q: "ট্রিপের পর কি আমরা গ্রুপ জমাট করে রাখতে পারি?"
      a: "হ্যাঁ। অ্যাডমিন গ্রুপ লক করতে পারেন যাতে সংখ্যাগুলো যেখানে আছে সেখানেই থাকে।"
    - q: "পরিমাণের কি কোনো সীমা আছে?"
      a: "হ্যাঁ। প্রতি খরচে 999,999.99, তার নিজস্ব মুদ্রায়।"
