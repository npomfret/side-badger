meta:
  title: Side Badger für Mitbewohner, Reisen und Feiern
  description: Teile Kosten mit Mitbewohnern, auf Gruppenreisen und für Partys, Hochzeiten und Gruppengeschenke. Sieh, was Side Badger für jede Art von Gruppe tut.
h1: Side Badger für deine Art von Gruppe
navLabel: Anwendungsfälle
lead: Mitbewohner, Urlaub, Junggesellenabschied. Such dir dein Chaos aus und sieh, wie eine Gruppe wie deine den Überblick behält.
intro: Jede Gruppe teilt Kosten ein bisschen anders. Diese Seiten folgen einem **realistischen Szenario** von der ersten Ausgabe bis zur letzten erfassten Zahlung, samt Rechnung, damit du siehst, was deine eigene Gruppe am Ende hätte.
cta:
  heading: Deine Art von Gruppe gefunden?
  body: Erstelle ein Konto, starte eine Gruppe und füge die erste Ausgabe hinzu. Das dauert ein paar Minuten.
  button: Kostenloses Konto erstellen
cardsHeading: Wähle die Situation, die deiner am nächsten kommt
sections:
  - heading: Gruppenreisen
    body: Flüge in Pfund, eine Villa in Euro und ein Abendessen, bei dem nur drei mitgegessen haben. Stelle die Gruppe auf Umrechnung in Pfund ein, und vier Freunde in Lissabon kommen mit drei Zahlungen aus, statt mit sechs, wenn die Währungen getrennt bleiben. [Kosten für Gruppenreisen teilen](page:use-case/group-trips).
  - heading: Mitbewohner
    body: Eine Person zahlt den Vermieter, eine andere denkt an die Stromrechnung, und niemand weiß, wer das Klopapier gekauft hat. Mit der Miete nach Zimmergröße und den übrigen Rechnungen zu gleichen Teilen kommen vier Mitbewohner im Monat mit drei Zahlungen aus, alle an die Person, die die Miete bezahlt hat. [Haushaltskosten mit Mitbewohnern teilen](page:use-case/housemates).
  - heading: Partys, Hochzeiten und Gruppengeschenke
    body: Sechs Leute stimmen über das Geschenk ab, eine Person kauft es, und nicht alle steuern gleich viel bei. Ein Geschenk von 150 £, nach genauen Beträgen geteilt, ergibt fünf Zahlungen an die Person, die es gekauft hat, insgesamt 120 £. [Kosten eines Events teilen](page:use-case/events-and-celebrations).
  - heading: Paare
    body: Teilt die langweiligen Kosten, ohne aus dem Date-Abend ein Quartals-Finanzmeeting zu machen. Miete im Verhältnis 60/40 und Lebensmittel zu gleichen Teilen ergeben saldiert eine einzige Zahlung zwischen euch beiden.
  - heading: Erst mal sehen, wie es funktioniert
    body: Jedes Beispiel oben nutzt dieselben Schritte, vom Erstellen einer Gruppe bis zum Erfassen der Zahlungen. [So funktioniert es](page:how-it-works) führt dich durch sie, und [Preise](page:pricing) sagt, was es kostet, nämlich nichts, ohne Werbung und ohne Tageslimits.
faq:
  heading: Fragen
  items:
    - q: Braucht jede Person in der Gruppe ein Konto?
      a: Ja. Man tritt per Link oder QR-Code bei, mit einem kostenlosen Konto.
    - q: Kann Side Badger das Geld einsammeln?
      a: Nein. Du zahlst, wie du willst, und erfasst dann die Zahlung, damit die Salden stimmen.
    - q: Muss ich mich für eine Art von Gruppe entscheiden?
      a: Nein. Die Anwendungsfälle sind Beispiele, keine Einstellungen. Jede Gruppe hat dieselben Funktionen, nutze also die Kombination, die passt.
