meta:
  title: "Hvað á að gera ef útgjald er dregið í efa | Side Badger"
  description: "Slepptu hvössu skilaboðunum. Dragðu útgjaldið í efa og það fer úr stöðu allra á meðan þið ræðið málið. Útskýrt með 45 £ af veisluvíni."
h1: "Hvað á að gera þegar einhver dregur sameiginlegt útgjald í efa"
navLabel: "Útgjöld dregin í efa"
lead: "Berðu upp spurningu um útgjaldið í stað þess að senda hvöss skilaboð. Meðan spurningin er opin helst allt útgjaldið utan stöðu allra. Ræðið málið í athugasemdunum, breytið skiptingunni ef hópurinn er sammála og látið þann sem spurði, eða stjórnanda, loka spurningunni."
cta:
  heading: "Spyrðu vandræðalegu spurningarinnar kurteislega"
  body: "Stofnaðu ókeypis aðgang, búðu til hóp fyrir heimilið og biddu stjórnanda að kveikja á spurningum um útgjöld, sem eru slökkt þar til einhver kveikir á þeim. Viltu fá yfirlit fyrst? Sjá [hvernig þetta virkar](page:how-it-works) eða [hvað ókeypis nær yfir](page:pricing)."
sections:
  - heading: "Þrír meðleigjendur og 45 £ af víni"
    body: "Eftir veisluna bætir Tom víninu við hóp heimilisins. Það kostar 45 £, Tom greiddi og því er skipt jafnt á Tom, Priya og Aisha, sem eru 15 £ á mann. Aisha drekkur ekki. Tom keypti það fyrir veisluna og veislan var fyrir [heimilið](page:use-case/housemates), svo hann hefur ekkert gert rangt. Aisha gerir heldur ekkert rangt með því að spyrja. Enginn hér er skúrkur. Það eru bara 15 £ af víni í deilu og fullt af leiðum til að gera það vandræðalegt. Hvöss skilaboð til alls hússins eru ein þeirra. Spurning um útgjaldið er mildari leið."
  - heading: "Hvað spurning gerir"
    body: "Aisha opnar útgjaldið og setur fram spurningu. Allt útgjaldið fellur út úr stöðu allra, ekki bara hennar hluti, og ekkert annað breytist. Stóru innkaupin (84 £) og þrifin (60 £) gilda enn, sem eru 28 £ + 20 £ = 48 £ á mann. Á meðan vínið er í bið skuldar Aisha því 48 £, Tom á inni 36 £ og Priya á inni 12 £. Hvað sem heimilið ákveður um vínið er það ekki í stöðu neins á meðan. Hver annar í útgjaldinu getur líka sett fram sína eigin spurningu. Vínið fer aftur inn í stöðuna aðeins þegar síðustu opnu spurningunni um það er lokað, og spurningu lokar sá sem spurði eða stjórnandi."
  - heading: "Rætt um málið og það lagað"
    body: "Spurning Aisha lendir í athugasemdum útgjaldsins, svo svörin eru rétt fyrir neðan hana. [Skipuleggið saman](page:feature/plan-together) segir meira um athugasemdir og spurningar. Tom og Priya lesa hana og heimilið spjallar saman. Þau ákveða að Tom og Priya borgi vínið, því þau drukku það. Annað heimili gæti haldið skiptingunni á þrjá eða samið um eitthvað þar á milli, og það væri líka í lagi. Side Badger geymir það sem þið komist að samkomulagi um og hefur enga skoðun á víni. Tom breytir útgjaldinu þannig að því sé skipt jafnt á hann og Priya, sem eru 22,50 £ á mann (45 £ ÷ 2). Aisha er ekki lengur í því, svo spurning hennar fer með gömlu útgáfunni og vínið snýr aftur inn í stöðuna. Fyrri útgáfan er geymd."
  - heading: "Niðurstaðan lesin"
    body: "Með vínið aftur inni er staðan þessi: Tom á 58,50 £ inni, Priya skuldar 10,50 £ og Aisha skuldar 48 £. Side Badger leggur til tvær greiðslur, báðar til Tom. Þessi 48 £ hjá Aisha eru sama talan og hún hafði meðan vínið var í bið, því hún er ekki í því. Priya hefur farið úr því að eiga inni 12 £ í að skulda 10,50 £, en þar munar 22,50 £, helmingi hennar af víninu. Hefði skiptingin á þrjá staðið hefði Aisha skuldað 63 £ (28 £ + 20 £ + 15 £). Öll deilan snerist um 15 £. Borgið hvert öðru eins og ykkur hentar og skráið svo hverja greiðslu undir **Gera upp**. [Uppgjör](page:feature/settle-up) fer yfir afganginn."
  - heading: "Orðaðu það þannig að fólk haldi áfram að tala við þig"
    body: "Spurning Aisha: „Ég fékk ekkert af víninu. Getum við skoðað skiptinguna?“ Hún er stutt, nefnir útgjaldið og spyr frekar en að ásaka. Nokkrar venjur hjálpa."
    items:
      - "**Spyrðu um útgjaldið, ekki manneskjuna.** „Getum við athugað skiptinguna á víninu?“ kveikir samtal. „Af hverju er ég rukkuð fyrir vínið þitt?“ kveikir hina tegundina."
      - "**Segðu hvað þú vilt að gerist.** „Gæti það verið bara fólkið sem drakk það?“ gefur hópnum eitthvað til að samþykkja eða svara."
      - "**Gefðu ástæðu í einni eða tveimur setningum.** Reiturinn heitir **Spurning þín** og má ekki vera tómur."
      - "**Hafðu svörin á einum stað.** Svör fara í athugasemdir útgjaldsins, við hlið talnanna sem þau snúast um."
  - heading: "Settu það upp í Side Badger"
    items:
      - "**Kveiktu á spurningum.** Þær eru slökktar sjálfgefið. Stjórnandi opnar **Stillingar** hópsins, kveikir á **Leyfa spurningar um útgjöld** undir **Eiginleikar** á flipanum **Almennt** og velur **Vista**. Ef slökkt er á þeim síðar hreinsast allar opnar spurningar."
      - "**Settu fram eina.** Opnaðu útgjaldið og veldu **Ég er með spurningu** við hlið þíns eigin nafns í skiptingunni. Skrifaðu ástæðuna í **Spurning þín** og veldu **Ég er með spurningu** aftur. Aðeins fólk í útgjaldinu getur gert þetta. Útgjaldið sýnir þá merkið **Dregið í efa**."
      - "**Finndu það sem er í bið.** Í útgjaldalistanum sýnir **Aðeins dregið í efa** útgjöldin með opna spurningu."
      - "**Lagaðu það, ef hópurinn er sammála.** Opnaðu útgjaldið, veldu **Breyta**, breyttu **Skipta á milli** og veldu **Uppfæra útgjöld**. Hver getur breytt fer eftir heimildum hópsins."
      - "**Lokaðu henni, ef ekkert þarf að laga.** Sá sem spurði getur notað lokahnappinn á merkinu **Dregið í efa**, sem heitir **Loka spurningu**, og stjórnandi getur það líka. Útgjaldið snýr aftur í stöðuna þegar síðustu spurningunni um það er lokað."
  - heading: "Þegar það er ekki svona snyrtilegt"
    items:
      - "**Breytingin heldur spyrjandanum inni.** Ef sá sem spurði er enn í útgjaldinu flyst spurning viðkomandi yfir í breyttu útgáfuna og bíður eftir að viðkomandi, eða stjórnandi, loki henni. Að laga upphæðina er ekki það sama og að vera sammála um að málið sé leyst."
      - "**Þú varst ekki í útgjaldinu.** Aðeins fólk í útgjaldi getur dregið það í efa. Ef eitthvað lítur undarlega út fyrir þér skaltu segja það í athugasemdum þess eða spyrja þann sem bætti því við."
      - "**Einhver vill yfirgefa hópinn.** Opin spurning kemur í veg fyrir að fólkið í því útgjaldi geti yfirgefið hópinn. Lokaðu spurningunni, eða breyttu útgjaldinu svo það sé ekki lengur í því, og það getur farið."
  - heading: "Það sem Side Badger gerir ekki hér"
    items:
      - "Það ákveður ekki hver hefur rétt fyrir sér. Það heldur útgjaldinu utan stöðunnar og geymir það sem þið komist að samkomulagi um."
      - "Það biður engan að samþykkja útgjöld áður en þau gilda. Aðeins útgjald sem dregið er í efa er haldið."
      - "Það getur ekki haldið eftir hluta útgjalds. Dragðu það í efa og allt útgjaldið fer úr stöðunni."
      - "Það flytur ekki peninga. Þið borgið hvert öðru eins og ykkur hentar og skráið það."
