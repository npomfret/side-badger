faq:
  heading: "Запитання"
  items:
    - q: "Чи безкоштовний калькулятор?"
      a: "Так. Безкоштовно. Без реклами. Без денних обмежень. Обліковий запис теж не потрібен."
    - q: "Чи зберігає він те, що я вводжу?"
      a: "Ні. Нічого не зберігається й нікуди не надсилається. Щоб зберегти цифри, скористайтеся «Копіювати посилання» і збережіть посилання десь."
    - q: "Хто бачить посилання, яке я копіюю?"
      a: "Кожен, у кого воно є. Цифри живуть у самому посиланні, після #, тож діліться ним лише з тими, хто має їх бачити."
    - q: "Чи переказує він гроші?"
      a: "Ні. Він визначає, хто кому має заплатити, а ви платите одне одному як зручно. Side Badger теж ніколи не торкається ваших грошей. Див. [розрахунок](page:feature/settle-up)."
    - q: "Чи можна розділити поїздку, оплачену у двох валютах?"
      a: "Тут ні, бо в розрахунку одна валюта. У групі кожна валюта має власний баланс. Див. [кілька валют](page:feature/multiple-currencies)."
    - q: "А що, коли суми не сходяться?"
      a: "Калькулятор скаже про це під витратою й не покаже результату, доки суми не зійдуться. Точні суми мають давати в підсумку загальну суму, а відсотки — 100."
