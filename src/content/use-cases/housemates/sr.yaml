featuresHeading: "Функције које кућа користи"
faq:
  heading: "Питања"
  items:
    - q: "Може ли се кирија понављати аутоматски?"
      a: "Не, нема понављајућих рачуна. Копирај прошломесечну кирију у пар додира, промени датум и готово."
    - q: "Можемо ли делити према величини собе?"
      a: "Да, по процентима. Дај сваком цимеру удео који одражава његову собу, све док удели заједно дају 100. О другим начинима дељења прочитај у [подели трошкова](page:feature/split-expenses)."
    - q: "Шта ако се цимер исели док дугује новац?"
      a: "Не може напустити групу док се не поравна, јер нико не може отићи док дугује или му се дугује новац. Бројеви остају поштени док сви нису квит."
    - q: "Да ли Side Badger плаћа рачуне?"
      a: "Не. Води евиденцију и предлаже кратак списак уплата. Платите једни другима како год желите, а затим забележите, како објашњава [поравнање](page:feature/settle-up)."
    - q: "Може ли један цимер да води књиге?"
      a: "Да. Постави га за администратора и користи управљану групу, где нове чланове одобрава администратор, а трошкове могу мењати само оснивачи и администратори."
