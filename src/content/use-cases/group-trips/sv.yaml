featuresHeading: Det en resa lutar sig mot
faq:
  heading: Frågor
  items:
    - q: Kan de som hoppade över middagen lämnas utanför?
      a: Ja. Välj vilka som var med på varje utgift så debiteras bara de för den.
    - q: Fungerar det utan täckning?
      a: Nej. Side Badger behöver en uppkoppling, så lägg till kostnaderna när ni är på wifi igen.
    - q: Behöver alla installera något?
      a: Nej. Det körs i webbläsaren. Skicka inbjudningslänken så går folk med från sina mobiler.
    - q: Vilken växelkurs använder det?
      a: En aktuell växelkurs när du lägger in utgiften, eller din egen om du fick en annan. Kursen fastställs när utgiften sparas, så gamla utgifter omvärderas aldrig.
    - q: Kan vi frysa gruppen efter resan?
      a: Ja. En administratör kan låsa gruppen så att siffrorna ligger kvar.
    - q: Finns det en gräns för belopp?
      a: Ja. 999 999,99 per utgift, i dess egen valuta.
