meta:
  title: "Liste, sondaje și comentarii pentru cheltuieli | Side Badger"
  description: "Comentează cheltuieli, pune în discuție pe cea ciudată, ține o listă de cumpărături și votează vila. Planifică împreună, apoi împarte. Gratuit, fără reclame."
h1: "Planifică împreună, împarte după"
navLabel: "Planifică împreună"
lead: "Lista de cumpărături și nota de la cumpărături, în sfârșit în relații bune. Side Badger îi dă grupului tău un loc unde să vorbească despre bani înainte și după ce sunt cheltuiți, cu comentarii la fiecare cheltuială, o cale de a pune în discuție cheltuielile care par greșite, liste comune și sondaje pentru deciziile mari. Apoi [împarți cheltuielile](page:feature/split-expenses) ca de obicei."
cta:
  heading: "Planifică, apoi împarte"
  body: "Creează un cont gratuit, începe un grup și pune prima listă, primul sondaj sau prima întrebare chiar lângă bani. Nu ești sigur ce urmează? Vezi [cum funcționează](page:how-it-works)."
problem:
  heading: "Chatul e într-o parte, nota în alta"
  body: "Cheltuielile de grup trăiesc de obicei în două locuri. Cifrele sunt într-unul, iar cearta despre cifre e într-un chat îngropat de marți sub alte mesaje. Lista de cumpărături e o poză cu frigiderul. Vila a fost hotărâtă printr-un deget mare ridicat de cei mai mulți, probabil. Side Badger ține planificarea în grup, lângă cheltuielile la care se referă, așa că există un comentariu acolo unde e costul, o listă acolo unde e magazinul, un sondaj pentru decizia mare și o cale de a spune „stai puțin, e corect asta?” fără să scrii un paragraf. Totul rămâne despre banii grupului, că doar de-asta există grupul."
workflow:
  heading: "De la votul pentru vilă la nota de la cumpărături"
  steps:
    - title: "Pune decizia mare la vot"
      body: "Adaugă un sondaj pentru decizia care stabilește nota, cum ar fi ce vilă. Alege între două și zece opțiuni, spune câte voturi are fiecare persoană, apoi închide sondajul când au votat toți, iar câștigătorul este marcat."
      shot: S17
      shotAlt: "Un sondaj închis, cu opțiunea câștigătoare marcată și numărul de voturi lângă fiecare opțiune"
    - title: "Scrieți lista de cumpărături împreună"
      body: "Începe o listă comună, adaugă articolele și bifează-le pe măsură ce ajung în coș. Cumpărăturile intră după aceea ca o cheltuială."
      shot: S16
      shotAlt: "O listă de cumpărături comună, cu unele articole bifate și un contor de progres"
    - title: "Vorbiți despre cost acolo unde trăiește"
      body: "Comentează chiar la cheltuială, atașează chitanța și reacționează cu un emoji. Conversația rămâne lângă cifra despre care e vorba."
      shot: S08
      shotAlt: "O cheltuială cu detaliile ei, o miniatură a chitanței, un fir de comentarii și reacții emoji"
    - title: "Pune în discuție cheltuiala care pare ciudată"
      body: "Dacă grupul a activat întrebările despre cheltuieli, oricine e inclus într-o cheltuială poate alege **Am o întrebare**. Cheltuiala rămâne în afara soldurilor până când întrebarea e lămurită."
      shot: S18
      shotAlt: "Lista de cheltuieli cu o insignă „Pus în discuție” și filtrul „Doar pus în discuție”"
    - title: "Vezi ce s-a schimbat și cine a schimbat"
      body: "Fluxul de activitate și clopoțelul de notificări arată ce e nou în grupurile tale. Notificările push sunt acolo dacă le vrei."
      shot: S19
      shotAlt: "Meniul de notificări, cu o listă de activitate recentă"
