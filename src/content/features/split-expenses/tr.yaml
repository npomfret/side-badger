sections:
  - heading: "Yalnızca orada olanlar"
    body: "Bir masrafı herkes arasında veya yalnızca onu paylaşanlar arasında bölüşün. İnsanları katılmadıkları masraflardan çıkarın, bakiyeler bunu yansıtır. Bütün hafta evde olmayan ev arkadaşı paket yemek için borçlanmaz; [ev arkadaşları](page:use-case/housemates) bunu temel adalet olarak tanıyacaktır."
  - heading: "Sonradan tartışmayı önleyen ayrıntılar"
    items:
      - "**Tarihi** ve isteğe bağlı olarak saati belirleyin. Bugün, dün, bu sabah ve dün gece gibi kısayollar biraz yazmaktan kurtarır."
      - "Harcamaları gruplamak için market veya seyahat gibi en fazla üç **etiket** ekleyin."
      - "**Yeri** ekleyin. Bir harita bağlantısı yapıştırın, yerin adı kendiliğinden dolar."
      - "Rakamın arkasındaki hikâye için bir **not** ekleyin; hikâye gerektiriyorsa biraz biçimlendirmeyle."
      - "En fazla üç **fiş** ekleyin; fotoğraf ya da PDF olabilir, böylece kanıt harcamayla birlikte kalır."
      - "**Yorumları** kullanın; sohbet kimsenin dönüp bakmadığı bir mesaj dizisinde değil, ilgili olduğu harcamanın yanında kalsın."
  - heading: "Kopyalayın, düzenleyin ve neyin değiştiğini görün"
    body: "Geçen ayın kirasını yeniden yazmak yerine kopyalayın, sonra farklı olanı değiştirin. Bir rakam yanlışsa harcamayı düzenleyin. Önceki sürüm saklanır ve düzenleme grubun etkinliğinde görünür; yani kimse bir rakamı sessizce değiştirmez. Herkesin neyi düzenleyebileceği grubun izinlerine bağlıdır."
  - heading: "Bir şey yanlış göründüğünde"
    body: "Bir grup harcama sorularını açabilir. Bir harcamaya dahil olan herkes soru sorabilir ve nedenini söyleyebilir; soruyu soran kişi veya bir yönetici kapatana kadar harcama bakiyelerin dışında kalır. Varsayılan olarak kapalıdır ve bir yönetici bunu grup için açar. Kimsenin hatırlamadığı depozitonun bir anda herkesin işi olduğu [etkinlikler ve kutlamalar](page:use-case/events-and-celebrations) için uygundur."
limits:
  heading: "Sınırlar"
  items:
    - "Her harcamayı bir kişi öder. İki kişi ödediyse iki harcama kaydedin."
    - "Kaleme göre veya paylara göre bölüşüm yok. Eşit, tam tutarlar ve yüzdeler var."
    - "Yüzdelerin toplamı 100 olmalı."
    - "Bir harcama, o para biriminin olağan ondalık basamaklarıyla, kendi para biriminde en fazla 999.999,99 olabilir."
    - "Harcamalar kendiliğinden tekrarlanmaz. Bunun yerine geçen ayınkini kopyalayın."
    - "Tarihler gelecekte veya 10 yıldan eski olamaz."
    - "Gruptan ayrılmış biri dahil olan bir harcama salt okunur olur."
useCasesHeading: "Böyle bölüşümün işe yaradığı yerler"
faq:
  heading: "Sorular"
  items:
    - q: "İki kişi tek bir harcamayı ödeyebilir mi?"
      a: "Tek harcamada hayır. Her ödeyen için birer tane olmak üzere iki harcama kaydedin, bakiyeler aynı çıkar."
    - q: "Bir makbuzu kaleme göre bölebilir miyim?"
      a: "Hayır. Bölüşüm eşit, tam tutarlarla veya yüzdelerle yapılır. Farklı kalemleri olan bir hesap için her kişinin borcunu tam tutar olarak girin."
    - q: "Varsayılan bir bölüşüm ayarlayabilir miyim?"
      a: "Hayır. Bölüşümünü yeniden kullanmak için önceki bir harcamayı kopyalayın ve farklı olanı değiştirin."
    - q: "Faturalar her ay tekrarlanabilir mi?"
      a: "Hayır. Bunun yerine geçen ayın harcamasını kopyalayın, birkaç saniye sürer."
    - q: "Bir harcamayı kim düzenleyebilir?"
      a: "Grubun izinlerinin izin verdiği kişi. Her düzenleme grubun etkinliğinde görünür; yani değişiklikler asla sessiz olmaz."
    - q: "Sonrasında bakiyelere ne olur?"
      a: "Harcamalar geldikçe güncellenir ve [hesaplaşma](page:feature/settle-up) onları kısa bir ödeme listesine çevirir. Bir harcama başka bir para biriminde ise [birden fazla para birimi](page:feature/multiple-currencies) sayfasına bakın."
