meta:
  title: "Listes, sondages et commentaires sur les dépenses | Side Badger"
  description: "Commentez les dépenses, questionnez celle qui cloche, partagez une liste de courses, votez pour la villa. Planifiez, puis partagez. Gratuit, sans publicité."
h1: "Planifiez ensemble, partagez après"
navLabel: "Planifier ensemble"
lead: "La liste de courses et la facture des courses, enfin en bons termes. Side Badger donne à votre groupe un endroit où parler d'argent avant et après l'avoir dépensé, avec des commentaires sur chaque dépense, un moyen de questionner celles qui semblent fausses, des listes partagées et des sondages pour les grandes décisions. Ensuite, vous [partagez les dépenses](page:feature/split-expenses) comme d'habitude."
cta:
  heading: "Planifiez, puis partagez"
  body: "Créez un compte gratuit, lancez un groupe et mettez la première liste, le premier sondage ou la première question juste à côté de l'argent. Vous ne savez pas ce qui se passe ensuite ? Voyez [comment ça marche](page:how-it-works)."
problem:
  heading: "La discussion est ici, l'addition est là-bas"
  body: "Les dépenses de groupe vivent d'ordinaire à deux endroits. Les chiffres sont dans l'un, et la dispute sur les chiffres dans une discussion qui a défilé mardi. La liste de courses est une photo de frigo. La villa a été décidée par un pouce levé de la plupart des gens, probablement. Side Badger garde la planification dans le groupe, à côté des dépenses qu'elle concerne : il y a un commentaire là où est le coût, une liste là où sont les courses, un sondage pour la grande décision, et un moyen de dire « attendez, c'est bien ça ? » sans écrire un paragraphe. Tout cela reste centré sur l'argent du groupe, ce pour quoi le groupe existe."
workflow:
  heading: "Du vote pour la villa à la facture des courses"
  steps:
    - title: "Soumettez la grande décision à un vote"
      body: "Ajoutez un sondage pour la décision qui fixe la facture, comme le choix de la villa. Choisissez de deux à dix options, dites combien de votes chaque personne a, puis fermez-le quand tout le monde a voté, et le gagnant est marqué."
      shot: S17
      shotAlt: "Un sondage fermé avec l'option gagnante marquée et le nombre de votes à côté de chaque option"
    - title: "Écrivez la liste de courses à plusieurs"
      body: "Lancez une liste partagée, ajoutez les articles et cochez-les à mesure qu'ils arrivent dans le caddie. Les courses entrent ensuite comme une dépense."
      shot: S16
      shotAlt: "Une liste de courses partagée avec quelques articles cochés et un compteur de progression"
    - title: "Parlez du coût là où il vit"
      body: "Commentez la dépense elle-même, joignez le reçu et réagissez avec un emoji. La conversation reste à côté du chiffre dont elle parle."
      shot: S08
      shotAlt: "Une dépense avec ses détails, une miniature de reçu, un fil de commentaires et des réactions emoji"
    - title: "Questionnez la dépense qui semble louche"
      body: "Si le groupe a activé les questions sur les dépenses, toute personne incluse dans une dépense peut choisir **J'ai une question**. La dépense reste hors des soldes tant que la question n'est pas traitée."
      shot: S18
      shotAlt: "La liste des dépenses avec un badge « Questionné » et le filtre « Uniquement questionné »"
    - title: "Voyez ce qui a changé, et qui l'a changé"
      body: "Le fil d'activité et la cloche de notifications montrent ce qui est nouveau dans vos groupes. Les notifications push sont là si vous les voulez."
      shot: S19
      shotAlt: "Le menu déroulant des notifications avec une liste d'activité récente"
