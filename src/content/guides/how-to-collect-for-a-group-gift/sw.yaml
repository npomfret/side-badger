faq:
  heading: "Maswali"
  items:
    - q: "Je, tukikusanya zaidi ya gharama ya zawadi?"
      a: "Viasi halisi lazima vijumlishe bei, kwa hivyo punguzeni sehemu hadi vifanye hivyo. Au tumieni ziada kwa kitu halisi, kama maua, na kuiingiza kama gharama ya pili, kama kadi na karatasi ya kufungia kwenye mfano."
    - q: "Je, mtu anaweza kuchangia bila kujiunga na kikundi?"
      a: "Si ukitaka awe kwenye hesabu. Kila mtu aliye kwenye mgawanyo anahitaji akaunti ya bure na kuwa kwenye kikundi. Kwa mtu aliye na taslimu tu, Priya anaweza kuipokea na kuingiza zawadi kwa kile ambacho kikundi bado kinadaiwa. Kwa mfano, Sam akimpa £40 taslimu, angeingiza £200 na kuigawanya 60, 60 na 80 kati yake mwenyewe, Omar na Lena."
    - q: "Je, kura inaweza kuamua kila mtu achangie kiasi gani?"
      a: "Hapana. Kura inakubaliana nambari moja ya kikundi kizima, kama bajeti. Sehemu ya kila mtu mnakubaliana wenyewe, kisha mnaiandika kwenye gharama kama **Kiasi halisi**."
