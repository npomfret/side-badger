faq:
  heading: "Pitanja"
  items:
    - q: "Trebamo li koristiti bruto ili neto plaću?"
      a: "Odlučuje grupa. Neto je uobičajena jer je to novac koji stvarno možete potrošiti. Bruto plaća zanemaruje to što porez, mirovinski doprinosi i otplate kredita iz različitih plaća uzimaju različite iznose. Što god odaberete, koristite istu mjeru za oboje."
    - q: "Vidi li Side Badger naše prihode?"
      a: "Ne. Upisuješ samo postotke, nikad plaće. Postoci su vidljivi članovima grupe, a kod para to ste vas dvoje."
    - q: "Možemo li 62/38 postaviti jednom za sve?"
      a: "Podjela se postavlja po trošku, a ne po grupi. Kopiraj trošak koji već ima 62 i 38 i promijeni ono što se razlikuje. [Podjela troškova](page:feature/split-expenses) opisuje ostale opcije."
