meta:
  title: "Gawanya bili za nyumbani na wapangaji wenza"
  description: "Gawanya kodi kwa ukubwa wa chumba, shiriki umeme na mboga kwa usawa, na uone nani anadaiwa na nani kila mwezi. Njia ya bure kwa wapangaji wenza kuweka hesabu."
h1: "Gawanya bili za nyumbani na wapangaji wenza"
navLabel: "Wapangaji wenza"
lead: "Kwa mpangaji mwenza anayenunua karatasi ya choo, na wapangaji wenza ambao hawaoni likitokea. Side Badger huweka hesabu moja inayoendelea ya kodi, bili na ununuzi kwa **wapangaji wenza na wanaoishi pamoja**, ili hakuna anayelazimika kumfukuzia mwingine na friji irudi kuwa friji tu."
cta:
  heading: "Anza na nyumba yako mwenyewe"
  body: "Fungua akaunti, tengeneza kikundi cha nyumba na uwatumie wote kiungo cha mwaliko. Bili za mwezi huu zinaweza kuingia usiku wa leo."
  button: "Fungua akaunti ya bure"
scenario:
  heading: "Andaa nyumba"
  body: "Tengeneza kikundi cha nyumba, chagua jina unalotaka watu waliione, na waalike wote kwa kiungo au msimbo wa QR. Kikundi kinaweza kuwa wazi, ambapo kila mtu anaongeza na kuhariri, au kinachosimamiwa, ambapo wanachama wapya wanahitaji idhini ya msimamizi na ni waundaji na wasimamizi tu wanaoweza kubadilisha gharama, jambo linalomfaa mpangaji mwenza anayeweka hesabu. Yeyote anayetaka kutazama nambari tu anaweza kuwa mtazamaji, anayeona kila kitu bila kubadilisha chochote. Kila mtu anaona gharama mpya mara moja, kwa hivyo “nitaiongeza baadaye” ina sehemu chache za kujificha."
sections:
  - heading: "Kodi na bili"
    body: "Kodi mara chache hugawanyika kwa nne, kwa sababu vyumba vya kulala si sawa. Igawanye kwa asilimia, ili chumba kikubwa kilipe zaidi na kile kidogo chenye dirisha kilipe kidogo. Asilimia lazima zijumlishe 100. Bili ambazo kila mtu hutumia hugawanywa kwa usawa, na mpangaji mwenza ambaye hakuhusika katika gharama anaweza kuachwa nje. Mgawanyo wa usawa ukiacha senti isiyo na mwenyewe, huenda kwa mtu mmoja kwa bahati nasibu. Hakuna bili zinazojirudia, kwa hivyo kila mwezi nakili kodi ya mwezi uliopita, badilisha tarehe na uendelee."
  - heading: "Ununuzi wa pamoja"
    body: "Weka orodha ya ununuzi ya pamoja kwenye kikundi kimoja na bili za ununuzi, na weka tiki vitu vinapofika kwenye kikapu. Anayefanya ununuzi anaongeza jumla ya risiti kama gharama na kuigawanya kwa usawa, au kati ya watu watakaokula kitu hicho tu. Nani anaendelea kununua maziwa ya oat ambayo hakuna mwingine anayekunywa ni suala la nyumba, lakini angalau orodha ya gharama itakuwa sahihi. Ruhusa za kikundi huamua nani anaweza kuunda na kuhariri orodha. Weka kodi, bili na ununuzi pamoja na unapata mwezi kama huu, katika nyumba ya watu wanne: Jo analipa kodi ya £2,000, iliyogawanywa 30%, 25%, 25% na 20% kwa ukubwa wa chumba, kisha Kwame analipa £120 za umeme, Lena £40 za intaneti na Matt £80 za mboga, kila moja ikigawanywa kwa usawa. Jo anabaki akidai £1,340, na Side Badger inapendekeza malipo matatu, yote kwa Jo."
  - heading: "Njia za haki za kugawanya gharama za nyumbani"
    items:
      - "**Kwa usawa** inafaa kwa kile ambacho kila mtu hutumia kwa kiwango sawa, kama intaneti, vifaa vya kusafisha na ununuzi wa pamoja. Ni ya haraka, na hakuna anayehitaji kubishana kuhusu hesabu."
      - "**Kwa ukubwa wa chumba** inafaa kwa kodi, kwa sababu vyumba hutofautiana na vivyo hivyo kile ambacho watu wako tayari kulipia. Kubaliana asilimia mara moja, mtu anapohamia, na uzitumie tena kila mwezi."
      - "**Kwa matumizi** inafaa kwa bili ambapo mtu mmoja anatumia zaidi waziwazi, kama bili ya kupasha joto ofisi ya nyumbani au akaunti ya kutiririsha ambayo watu wawili tu wanatazama. Waache nje wasiohusika, au weka kiasi halisi kwa kila mtu."
      - "Chochote utakachochagua, kubaliana kabla ya bili ya kwanza badala ya baada ya mabishano ya kwanza, na andika kanuni mahali ambapo nyumba nzima inaweza kuiona."
  - heading: "Mtu anapohama"
    body: "Anamaliza hesabu kwanza. Hakuna anayeweza kuondoka kwenye kikundi akiwa anadaiwa au anadai pesa, kwa hivyo anayeondoka analipa au analipwa, mnarekodi, kisha anaondoka. Endeleeni na kikundi kwa wapangaji wenza waliobaki na mwalike mtu mpya kwa kiungo. Nyumba yenyewe ikiisha, msimamizi anaweza kufunga kikundi ili nambari zibaki palepale, au kukifunga kabisa, jambo linalokifanya kisifikike kwa kila mtu, kwa hivyo fanya hivyo tu wakati hakuna anayehitaji historia."
