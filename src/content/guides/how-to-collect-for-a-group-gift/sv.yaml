faq:
  heading: Frågor
  items:
    - q: Vad gör vi om vi samlar in mer än presenten kostar?
      a: De exakta beloppen måste bli lika med priset, så trimma andelarna tills de gör det. Eller lägg överskottet på något verkligt, till exempel blommor, och lägg in det som en andra utgift, som kortet och presentpappret i exemplet.
    - q: Kan någon bidra utan att gå med i gruppen?
      a: Inte om du vill ha med personen i uträkningen. Alla som ingår i delningen behöver ett gratis konto och ska vara med i gruppen. För någon som bara har kontanter kan Priya ta emot dem och lägga in presenten för det gruppen fortfarande är skyldig. Om Sam till exempel gav henne 40 £ i kontanter skulle hon lägga in 200 £ och dela det 60, 60 och 80 mellan sig själv, Omar och Lena.
    - q: Kan omröstningen avgöra hur mycket var och en bidrar med?
      a: Nej. En omröstning bestämmer en siffra för hela gruppen, till exempel budgeten. Var och ens andel bestämmer ni själva, och skriver sedan in i utgiften som **Exakta belopp**.
