meta:
  title: "파트너와 반반 또는 소득 비율로 비용 나누기 | 사이드 배저"
  description: "데이트 날이 분기별 재무 점검이 되지 않게 지루한 생활비를 나누세요. 반반, 소득 비율, 지출별로 나누고 누가 누구에게 줄지 확인하세요. 무료."
h1: "커플이 공정하게 비용 나누기"
navLabel: "커플"
lead: "데이트 날이 분기별 재무 점검이 되지 않게 지루한 생활비를 나누세요. 사이드 배저는 집과 소파, 그리고 인터넷 요금을 누가 냈는지에 대한 어렴풋한 기억을 함께 쓰는 **커플**을 위해 월세, 공과금, 장보기를 하나의 계산으로 이어 갑니다. 반반으로, 소득 비율로, 아니면 지출마다 따로 나누고 누가 누구에게 줄지 확인하세요."
cta:
  heading: "둘만의 그룹을 시작하세요"
  body: "계정을 만들고, 그룹을 만들고, 파트너에게 초대 링크를 보내세요. 오늘 밤 배달 음식이 첫 지출이 될 수 있어요."
scenario:
  heading: "공정하다고 꼭 반반은 아닙니다"
  body: "Sam과 Alex는 집을 함께 씁니다. Sam이 더 벌어서, 월세는 Sam이 60%를, Alex가 40%를 부담하기로 했어요. Sam은 집주인에게 월세를 내고, Alex는 장을 보고, 둘 다 결국 비슷하게 맞을 거라고 꽤 확신합니다. ‘꽤 확신’은 누군가의 휴대폰 메모가 고질적인 말다툼거리가 되는 출발점이죠. 그러니 두 사람의 그룹을 만들고, 파트너에게 보일 이름을 고르고, 초대 링크나 QR 코드를 보내세요. 비용은 생길 때마다 추가하고, 누가 결제했고 어떻게 나뉘는지 적은 다음 그룹이 계산을 이어 가게 하세요. 휴가는 그룹을 따로 만드세요([그룹 여행](page:use-case/group-trips) 참고). 그러면 항공권이 장보기 비용에 섞이지 않습니다."
sections:
  - heading: "반반, 소득 비율, 지출별로"
    body: "모두에게 공정한 분할이란 없고, 두 사람이 합의한 분할만 있습니다. 가급적 첫 한숨이 나온 뒤가 아니라 첫 청구서 전에요. 보통 이렇게 세 가지입니다."
    items:
      - "**반반(50/50).** **균등**을 고르면 각자 절반을 냅니다. 소득이 비슷할 때 공동 비용에 알맞고, 계산이 전혀 필요 없어요."
      - "**소득 비율로.** 한 사람이 더 번다면 각자의 수입 비중으로 나누세요. 먼저 무엇을 수입으로 칠지 합의하고(실수령액이 흔한 선택입니다), 두 사람의 금액을 더한 다음 내 금액을 합계로 나누세요. 두 사람의 실수령액 비율이 3 대 2라면 3 ÷ (3 + 2) = 60%이므로, 한 사람이 60%를, 다른 사람이 40%를 부담합니다. 정수 퍼센트로 반올림해 **백분율**에 입력하세요. 합이 100이 되어야 합니다. 급여를 입력할 곳은 없으므로, 입력하는 건 퍼센트뿐입니다."
      - "**지출별로.** 지출마다 자기만의 분할이 있으므로 섞어 쓸 수 있습니다. 월세는 소득 비율로, 장보기는 반반으로, 공동 선물은 각자 얼마를 넣을지 고른 경우 **정확한 금액**으로 하세요."
      - "**소득이 바뀌면** 다음 지출부터 새 비율을 쓰세요. 이전 지출은 입력했던 분할을 그대로 유지합니다. 실제 급여명세서로 계산하는 모습은 [더 버는 파트너와 비용을 나누는 방법](page:guide/how-to-split-bills-with-a-partner-who-earns-more)에서 읽어 보세요."
  - heading: "월말 결산"
    body: "한 달에 한 번, 또는 숫자가 근질거릴 때마다 그룹을 열어 **잔액**을 확인하세요. 두 사람이라면 통화마다 결제는 언제나 한 건, 줄 사람에게서 받을 사람에게로 가는 것뿐입니다. Sam과 Alex의 한 달을 봅시다. Sam이 월세 £1,500를 냈고, 그중 Alex의 40%는 £600입니다. Alex는 장보기 £90를 결제해 똑같이 나눴으므로 Sam의 절반은 £45입니다. 사이드 배저는 한쪽을 다른 쪽과 상쇄해, £600에서 £45를 뺀 £555를 Alex가 Sam에게 내도록 합니다. 계좌 이체든 현금이든 지난 신세를 갚는 것이든 원하는 방법으로 지불한 다음, **정산하기**에서 기록하면 잔액이 0으로 돌아갑니다. 반복 청구서는 없으므로 지난달 월세를 복사하고, 날짜를 바꾸고, 이어 가세요. 사이드 배저는 돈을 옮기지도 알림을 보내지도 않으니, 슬쩍 찔러 주는 일은 여전히 여러분 몫입니다."
  - heading: "둘만의 공간"
    body: "둘이서 쓰는 그룹은 멤버가 두 명이고, 그룹은 멤버만 볼 수 있습니다. 파트너는 초대 링크나 QR 코드로 가입해요. 링크는 15분에서 5일까지 유지할 수 있으니, 파트너가 쓰기에 충분한 가장 짧은 시간을 고르세요. 새 링크를 만들어도 기존 링크는 취소되지 않으니, 다른 사람이 있는 채팅방에 남겨 두지 마세요. 유효한 링크를 쓰는 사람은 누구나 가입할 수 있으므로, 확실히 하고 싶다면 승인을 켜서 관리자가 한 사람씩 들여보내게 하세요. 파트너에게도 자기 계정이 필요하며, 무료입니다."
exampleAfter: 2
example:
  heading: "이번 달 누가 누구에게 빚졌을까"
  currency: GBP
  people:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  expenses:
    - label: "월세"
      payer: sam
      amount: 1500
      split:
        method: percent
        shares:
          sam: 60
          alex: 40
    - label: "장보기"
      payer: alex
      amount: 90
      split:
        method: equal
featuresHeading: "커플이 쓰는 기능"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "60/40을 한 번만 설정해서 모든 지출에 쓸 수 있나요?"
      a: "아니요. 분할은 지출마다 따로입니다. 첫 지출에 비율을 설정한 다음, 다음에는 그 지출을 복사해서 달라진 부분만 바꾸세요. 세 가지 분할 방법은 [지출 나누기](page:feature/split-expenses)에서 모두 다룹니다."
    - q: "은행과 연결되나요?"
      a: "아니요. 사이드 배저는 여러분의 돈을 건드리지 않습니다. 원하는 방법으로 서로 지불한 다음 기록하세요. [정산하기](page:feature/settle-up)에서 설명합니다."
    - q: "다른 사람도 우리 그룹을 볼 수 있나요?"
      a: "멤버만 볼 수 있고, 커플의 그룹에는 멤버가 두 명 있습니다. 유효한 초대 링크를 쓰는 사람은 누구나 가입할 수 있으니, 한 사람에게만 공유하고 만료는 짧게 하세요."
    - q: "같은 계산서를 각자 일부씩 결제했다면요?"
      a: "지출에는 결제자가 한 명입니다. 두 사람 각각 한 건씩 지출 두 개를 기록하면 잔액은 똑같이 나옵니다."
    - q: "파트너에게 결제하라고 알려 주나요?"
      a: "아니요. 알림이 없으니 슬쩍 찔러 주는 일은 여전히 여러분 몫입니다. 적어도 둘이 같은 숫자를 보고 있을 거예요."
    - q: "비용을 같이 쓰지 않게 되면 어떻게 되나요?"
      a: "잔액을 정산하고 결제를 기록해서 아무도 빚지지 않게 하세요. 그다음 관리자가 그룹을 잠가 숫자를 그대로 두거나, 완전히 닫아서 모두가 접근할 수 없게 할 수 있습니다. 두 사람 모두 내역이 필요하지 않을 때만 닫으세요."
