featuresHeading: Hva en tur støtter seg på
faq:
  heading: Spørsmål
  items:
    - q: Kan de som hoppet over middagen stå utenfor?
      a: Ja. Velg hvem som var med på hver utgift, så er det bare de som belastes for den.
    - q: Fungerer det uten dekning?
      a: Nei. Side Badger trenger en tilkobling, så legg til kostnadene når du er på wifi igjen.
    - q: Må alle installere noe?
      a: Nei. Den kjører i nettleseren. Send invitasjonslenken, så blir folk med fra telefonen sin.
    - q: Hvilken valutakurs bruker den?
      a: En gjeldende valutakurs når du legger inn utgiften, eller din egen hvis du fikk en annen. Kursen låses når utgiften lagres, så gamle utgifter revurderes aldri.
    - q: Kan vi fryse gruppen etter turen?
      a: Ja. En administrator kan låse gruppen så tallene blir stående.
    - q: Er det en grense for beløp?
      a: Ja. 999 999,99 per utgift, i sin egen valuta.
