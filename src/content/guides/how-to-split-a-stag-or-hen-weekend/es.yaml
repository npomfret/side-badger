faq:
  heading: "Preguntas"
  items:
    - q: "¿Paga más el padrino o la dama de honor?"
      a: "Solo si el grupo lo acuerda. La app no da ningún papel especial a nadie en las cuentas. Si alguien cubre más, elige **Cantidades exactas** o **Porcentaje** en **Cómo dividir** y escribe las partes que acordasteis."
    - q: "¿Y las copas que algunos no tomaron?"
      a: "Añade las copas como un gasto aparte y marca solo a quienes las tomaron. Si cada uno tomó una cantidad distinta, elige **Cantidades exactas** y escribe la parte de cada persona. Nadie paga lo que no tomó."
    - q: "¿Puede ver la persona homenajeada el grupo más adelante?"
      a: "Sí, cuando la sorpresa haya pasado. Invítala y después un administrador puede hacerla **Espectador** en **Seguridad y permisos**, en la configuración del grupo. Un espectador lo ve todo y no cambia nada, así que espera a que ya no haya ningún secreto. Necesita una cuenta gratis para unirse."
