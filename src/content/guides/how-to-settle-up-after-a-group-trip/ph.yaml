faq:
  heading: Mga tanong
  items:
    - q: Sino ang dapat magtala ng bayad, ang nagbabayad o ang binabayaran?
      a: Kailangan ng pahintulot na mag-edit ng mga gastos para makapagtala ng bayad, at itinatanong ng form ang **Sino ang nagbayad?** at **Sino ang tumanggap ng bayad?** Ang nagtala lang ang makakapag-edit nito mamaya, kaya kadalasang pinakamadali kung ang nagbabayad ang magtatala, gamit ang quick-settle button.
    - q: Paano kung dalawang pera ang ginamit sa biyahe?
      a: Magkakahiwalay ang mga balanse sa bawat pera, kaya nananatiling utang na euro ang utang na euro at may sariling maikling listahan ang bawat pera, maliban kung na-convert ang mga gastos nang ilagay ang mga ito. Ipinapakita ng [maraming pera](page:guide/how-to-split-a-trip-paid-in-several-currencies) ang dalawang paraan.
    - q: Dapat ba kaming mag-settle habang nasa biyahe o sa dulo?
      a: Puwede ang alinman. Binabago ng bawat naitalang bayad ang mga balanse, kaya bahagi ng huling listahan ang bayad na ginawa sa kalagitnaan ng biyahe. Mas simple sa dulo, dahil nasa iisang lugar na ang [buong biyahe](page:use-case/group-trips).
