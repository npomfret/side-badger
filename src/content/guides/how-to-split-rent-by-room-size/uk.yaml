faq:
  heading: "Запитання"
  items:
    - q: "Що, якщо кімната більша, але в ній менше світла?"
      a: "Площа — лише відправна точка, тож група може домовитися про коригування. Заберіть пункт-два в темної кімнати, віддайте іншим і перевірте, що відсотки в сумі досі дають 100. Side Badger зберігає те, про що ви домовилися, і не судить."
    - q: "Чи варто ділити рахунки теж за розміром кімнат?"
      a: "Зазвичай ні. Енергією й інтернетом користуються всі, тож рівний розподіл простіший, як у прикладі вище. Якщо один сусід цілий день удома, група може домовитися про інше, наприклад про точні суми. Про варіанти читайте в [розподілі витрат](page:feature/split-expenses)."
    - q: "Чи можна змінити розподіл пізніше?"
      a: "Так, для нових витрат. Змініть відсотки, коли копіюєте оренду, а попередні місяці лишаться як були. Щоб виправити минулу витрату, відредагуйте її, якщо це дозволяють дозволи групи, і спершу скажіть про це в домі, бо баланси зміняться. Попередня версія зберігається."
