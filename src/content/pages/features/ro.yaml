meta:
  title: "Ce face și ce nu face Side Badger"
  description: "Împărțire, decontare și mai multe valute, plus grupuri, liste și sondaje. Setul complet și o listă sinceră a ceea ce Side Badger lasă pe dinafară."
h1: "Ce face Side Badger"
navLabel: "Funcții"
lead: "Tot ce e în cutie, și ce nu e."
intro: "Iată setul complet. Foaia de calcul am lăsat-o deoparte intenționat. Începe cu cele trei treburi pe care Side Badger le face zilnic, apoi uită-te la restul listei și la lista scurtă a lucrurilor pe care nu le face."
cta:
  heading: "Face ce are nevoie grupul tău?"
  body: "Creează un cont gratuit și încearcă mai întâi cu un grup mic."
  button: "Creează un cont gratuit"
cardsHeading: "Cele trei treburi, în detaliu"
sections:
  - heading: "Scanarea chitanțelor"
    body: "Fotografiază chitanța, iar Side Badger completează totalul, data și locul, ca să le verifici. Imaginile chitanțelor sunt citite de serviciul AI al Google."
  - heading: "Grupuri și permisiuni"
    body: "Fă câte un grup pentru fiecare casă, excursie sau eveniment, cu până la 50 de persoane. Invită oameni cu un link sau cu un cod QR. Într-un grup mai mare, fă pe cineva observator, care vede tot și nu schimbă nimic."
  - heading: "Liste și sondaje"
    body: "Ține lista de cumpărături comune lângă notele de plată pentru cumpărături. Pune la vot lista scurtă de vile, anonim dacă vrei."
  - heading: "Tot restul"
    items:
      - "**Actualizări în direct:** adaugi o cheltuială și toți o văd imediat."
      - "**Limbi:** folosește Side Badger în 39 de limbi. Fiecare om din grup și-o poate alege pe a lui."
      - "**Ecran de pornire:** fără magazin de aplicații. Adaugă Side Badger pe ecranul de pornire și se deschide ca o aplicație."
      - "**Feedback:** ai găsit un bug? Spune-ne din aplicație și vezi acolo răspunsul nostru."
  - heading: "Ce nu face Side Badger"
    items:
      - "**Nu mută bani.** Side Badger nu se atinge niciodată de banii tăi. Plătiți-vă unii altora cum preferați. Cererile de plată sunt planificate."
      - "**Nu repetă facturi.** Nu există cheltuieli recurente. Copiază factura lunii trecute în două atingeri."
      - "**Nu împarte pe articole.** Un singur plătitor pe cheltuială. Împarte egal, exact sau procentual."
      - "**Nu are aplicație nativă.** Funcționează în browser. Adaugă-l pe ecranul de pornire."
      - "**Nu funcționează offline.** Are nevoie de o conexiune."
      - "**Nu trimite alerte prin e-mail sau SMS.** Notificările apar în aplicație. Notificările push sunt planificate."
      - "**Nu desenează grafice sau bugete.** Ține evidența cine cui datorează, și atâta tot."
      - "**Nu are autentificare cu Google sau Apple.** Te înscrii cu e-mail. Autentificarea cu Google și Apple este planificată."
      - "**Nu lasă oameni înăuntru fără cont.** Fiecare om din grup are nevoie de un cont gratuit."
faq:
  heading: "Întrebări"
  items:
    - q: "Pot plăti prin Side Badger?"
      a: "Nu. Side Badger ține evidența și nu se atinge niciodată de banii tăi. Plătiți-vă unii altora cum preferați, apoi înregistrați plata."
    - q: "Există o aplicație mobilă?"
      a: "Nu într-un magazin de aplicații. Side Badger rulează în browser și îl poți adăuga pe ecranul de pornire, ca să se deschidă ca o aplicație."
    - q: "Pot împărți pe articole?"
      a: "Nu. Fiecare cheltuială are un singur plătitor și o împarți egal, exact sau procentual."
    - q: "Funcționează offline?"
      a: "Nu, are nevoie de o conexiune."
    - q: "Are fiecare din grup nevoie de un cont?"
      a: "Da. Fiecare din grup are nevoie de un cont gratuit, iar pentru înscriere ai nevoie doar de o adresă de e-mail."
