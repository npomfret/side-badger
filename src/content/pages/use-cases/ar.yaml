meta:
  title: "Side Badger لزملاء السكن والرحلات والحفلات"
  description: "قسّم التكاليف مع زملاء السكن، وفي رحلات المجموعات، وللحفلات وحفلات الزفاف والهدايا الجماعية. اطّلع على ما يفعله Side Badger لكل نوع من المجموعات."
h1: "Side Badger لنوع مجموعتك"
navLabel: "حالات الاستخدام"
lead: "زملاء السكن، والعطلات، وحفلات توديع العزوبية. اختر فوضاك، ثم اطّلع على كيف تحتفظ مجموعة مثل مجموعتك بالحساب."
intro: "كل مجموعة تقسّم التكاليف بطريقة مختلفة قليلاً. تتبع هذه الصفحات **سيناريو واقعياً** من أول مصروف إلى آخر دفعة مسجَّلة، مع عرض الحسابات، لترى ما ستنتهي إليه مجموعتك."
cta:
  heading: "هل وجدت نوع مجموعتك؟"
  body: "أنشئ حساباً، وابدأ مجموعة، وأضف أول مصروف. يستغرق ذلك بضع دقائق."
  button: "أنشئ حساباً مجانياً"
cardsHeading: "اختر الحالة الأقرب إلى حالتك"
sections:
  - heading: "رحلات المجموعات"
    body: "تذاكر طيران بالجنيه، وفيلا باليورو، وعشاء لم يأكله إلا ثلاثة. اضبط المجموعة على التحويل إلى الجنيه فينتهي أربعة أصدقاء في لشبونة بثلاث دفعات، بدلاً من ست حين تُبقى العملات منفصلة. [قسّم تكاليف رحلة المجموعة](page:use-case/group-trips)."
  - heading: "زملاء السكن"
    body: "يدفع أحدهم للمالك، ويتذكر آخر فاتورة الطاقة، ولا يتفق أحد على من اشترى ورق التواليت. مع إيجار مقسّم بحسب مساحة الغرفة وفواتير أخرى مقسّمة بالتساوي، ينهي أربعة زملاء سكن الشهر بثلاث دفعات، كلها لمن دفع الإيجار. [قسّم فواتير المنزل مع زملاء السكن](page:use-case/housemates)."
  - heading: "الحفلات وحفلات الزفاف والهدايا الجماعية"
    body: "ستة أشخاص يصوّتون على الهدية، وواحد يشتريها، وليس كل واحد يساهم بالمبلغ نفسه. هدية بـ £150 مقسّمة بمبالغ محددة تترك خمس دفعات لمن اشتراها، بمجموع £120. [قسّم تكاليف مناسبة](page:use-case/events-and-celebrations)."
  - heading: "الأزواج"
    body: "تقاسَما التكاليف المملة دون أن يتحول موعد العشاء إلى مراجعة مالية فصلية. إيجار مقسّم 60/40 وبقالة مقسّمة بالتساوي ينتهيان إلى دفعة واحدة بينكما."
  - heading: "شاهد كيف يعمل أولاً"
    body: "كل مثال أعلاه يستخدم الخطوات نفسها، من إنشاء مجموعة إلى تسجيل الدفعات. يشرحها [كيف يعمل](page:how-it-works)، وتوضح [الأسعار](page:pricing) كم يكلّف، وهو لا شيء، بلا إعلانات وبلا حدود يومية."
faq:
  heading: "أسئلة"
  items:
    - q: "هل يحتاج كل فرد في المجموعة إلى حساب؟"
      a: "نعم. ينضم الناس برابط أو برمز QR وبحساب مجاني."
    - q: "هل يستطيع Side Badger جمع المال؟"
      a: "لا. تدفعون بالطريقة التي تناسبكم، ثم تسجّلون الدفعة لتبقى الأرصدة صحيحة."
    - q: "هل عليّ اختيار نوع واحد من المجموعات؟"
      a: "لا. حالات الاستخدام أمثلة وليست إعدادات. كل مجموعة لها الميزات نفسها، فاستخدم ما يناسبك منها."
