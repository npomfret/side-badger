faq:
  heading: Questions
  items:
    - q: "Qui doit enregistrer un paiement, celui qui paie ou celui qui est payé ?"
      a: "Enregistrer un paiement demande la permission de modifier les dépenses, et le formulaire demande **Qui a payé ?** et **Qui a reçu le paiement ?** Seule la personne qui l'a enregistré peut le modifier ensuite, donc le plus simple est en général que ce soit le payeur, avec le bouton de règlement rapide."
    - q: "Et si le voyage s'est déroulé en deux devises ?"
      a: "Les soldes sont tenus par devise, donc une dette en euros reste une dette en euros et chaque devise a sa propre courte liste, sauf si les dépenses ont été converties à la saisie. [Plusieurs devises](page:guide/how-to-split-a-trip-paid-in-several-currencies) montre les deux façons."
    - q: "Faut-il régler pendant le voyage ou à la fin ?"
      a: "Les deux marchent. Chaque paiement enregistré change les soldes, donc un paiement fait en cours de voyage compte pour la liste finale. À la fin, c'est plus simple, parce que [tout le voyage](page:use-case/group-trips) est au même endroit."
