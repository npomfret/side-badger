featuresHeading: Le funzionalità che usa una coppia
faq:
  heading: Domande
  items:
    - q: Possiamo impostare 60/40 una volta per tutto?
      a: No. La divisione appartiene a ogni spesa. Imposta le percentuali sulla prima, poi copiala la volta dopo e cambia ciò che è diverso. [Dividere le spese](page:feature/split-expenses) spiega tutti e tre i modi di dividere.
    - q: Si collega alla nostra banca?
      a: No. Side Badger non tocca mai i tuoi soldi. Vi pagate come vi fa più comodo, poi lo registrate, come spiega [saldare i conti](page:feature/settle-up).
    - q: Qualcun altro può vedere il nostro gruppo?
      a: Solo i suoi membri, e quello di una coppia ne ha due. Chiunque usi un link di invito ancora attivo può entrare, quindi condividilo con una sola persona e dagli una scadenza breve.
    - q: E se abbiamo pagato ciascuno una parte dello stesso conto?
      a: Una spesa ha un solo pagatore. Registra due spese, una per ciascuno, e il saldo viene lo stesso.
    - q: Ricorderà al mio partner di pagare?
      a: No. Non ci sono promemoria, quindi sollecitare resta compito tuo. Almeno guarderete entrambi lo stesso numero.
    - q: Cosa succede quando smettiamo di dividere le spese?
      a: Saldate e registrate il pagamento, così nessuno deve più niente. Poi un admin può bloccare il gruppo, che tiene i numeri fermi, oppure chiuderlo per sempre, il che lo rende inaccessibile a tutti. Chiudilo solo quando a nessuno dei due serve lo storico.
