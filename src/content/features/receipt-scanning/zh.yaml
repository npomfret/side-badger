meta:
  title: 扫描收据，快速添加支出 | Side Badger
  description: 让獾来读收据。它会填好总额、日期和地点，供你核对，没有扫描额度限制。图片由 Google 的 AI 服务读取。
h1: 扫描收据，核对细节，再分摊
navLabel: 收据扫描
lead: 让獾来读收据，再检查它的作业。给新支出加一张照片，Side Badger 会填好总额、日期和地点，供你核对。然后像对待其他支出一样[分摊](page:feature/split-expenses)。扫描免费，没有扫描额度。它填的是一笔支出，不会按条目分摊账单。收据图片由 Google 的 AI 服务读取。
cta:
  heading: 拍下来，核对，再分摊。
  body: 创建免费账户，建一个群组，添加一笔带收据照片的支出。看看它填了什么，不对的地方改掉，满意了就保存。
problem:
  heading: 没人想在排队等出租车时敲收据
  body: 旅行和大型聚会都会带来纸质收据。晚餐、出租车、不知怎么喝到第六轮的那一轮酒。冻着手指对着手机一笔笔敲，身后还排着队，支出就是这样被遗忘的。所以 Side Badger 会替你读收据。它写初稿，由你来核对。它适合[团体旅行](page:use-case/group-trips)和[活动和庆祝](page:use-case/events-and-celebrations)，那里的收据堆得比谁都不想处理的速度还快。
workflow:
  heading: 三步从照片到支出
  steps:
    - title: 给新支出添加收据
      body: 开始一笔新支出，点击**扫描收据**，或者使用仪表板上的**扫描收据**快捷操作。拍一张照片，或选一张已有的。表单上的**添加收据或附件**也可以。
    - title: 让它读收据
      body: Side Badger 的 AI 读取图片时，表单会显示**正在分析收据...**。然后它会填入找到的内容，比如描述、总额、货币、日期、时间和地点。你已经输入的内容不会被动。
      shot: S09
      shotAlt: 新支出表单先显示“正在分析收据...”，然后是填好详情后的同一张表单
    - title: 核对，然后分摊
      body: 把表单和纸质收据对一对。不对的地方改掉，说明谁付了钱、谁分担了费用，选择分摊方式并保存。保存之前，这笔支出并不存在。[分摊支出](page:feature/split-expenses)介绍了分摊的做法。
options:
  heading: 选项
  items: []
sections:
  - heading: 它会填什么
    body: 给新支出添加收据图片后，下面这些字段可以自动填入。谁付了钱、谁分担费用、怎么分摊，仍然由你决定。
    items:
      - 这笔支出的**描述**。
      - "**总额**。"
      - "**货币**，前提是你的群组允许。"
      - "**日期**和**时间**。"
      - "**地点**。"
      - 在**备注**里保存一份收据的文字副本，以防纸质收据褪色或被洗衣机洗掉。
  - heading: 你仍然要核对什么
    body: 全部。把它填入的内容当作草稿。先对照纸质收据核对总额，再核对货币、日期和地点。模糊的照片和皱巴巴的纸会难倒任何阅读者，我们不保证它能读对每一张收据，所以保存前请看一眼。如果有不对的地方，直接改掉。如果收据是日元，而群组用英镑结算，[多种货币](page:feature/multiple-currencies)介绍了接下来会怎样。
  - heading: 把收据和支出放在一起
    body: 无论是否扫描过，收据都可以留在支出上。可以附上照片或 PDF，每笔支出最多三个，每个最大 10 MB。群组成员能在支出上看到它们。图片显示为缩略图，点击在查看器中打开，PDF 则以链接形式打开。你扫描的那张照片也会一并附上，除非保存前把它移除。有人问那顿晚餐到底花了多少，证据就在那里。
  - heading: 你的收据去了哪里
    body: 收据图片由 Google 的 AI 服务读取。为了填写表单，图片由位于 Google 美国多区域的 Google Vertex AI (Gemini) 读取。给新支出添加图片后，它就会被读取。PDF，或添加到已有支出上的照片，只会被存储，不会被读取。附上的收据对群组成员可见，所以如果收据上有你不想分享的内容，就别放照片，把这笔支出手动输入。
limits:
  heading: 限制
  items:
    - 仅限图片。支持 JPEG、PNG 和 WebP，HEIC 需要先转换。PDF 可以附加到支出上，但不会被读取。
    - 扫描只用于新支出。已有的支出可以附上收据，但不会读取任何内容。
    - 它只会填入你没有动过的字段，货币也只有在群组允许时才会填。
    - 它不会按条目分摊，也不会把明细分配给具体的人。它填的是一笔支出，你照常分摊。
    - 不保证它填的内容正确，也不保证每次都能扫描成功。保存前请核对；扫描失败或无法使用时，请手动添加支出。
    - 一笔支出最多有三个附件，每个最大 10 MB，格式为 JPEG、PNG、WebP、HEIC 或 PDF。
    - 收据图片由位于 Google 美国多区域的 Google Vertex AI (Gemini) 读取，附上的收据对群组成员可见。
useCasesHeading: 收据堆积的地方
faq:
  heading: 常见问题
  items:
    - q: 它能按条目分摊收据吗？
      a: 不能。它填的是这笔支出，包括总额，由你按平均、确切金额或百分比来分摊。如果一张账单上每个人点的东西不同，请把每个人该付的钱按确切金额输入。[分摊支出](page:feature/split-expenses)有详细说明。
    - q: 它能读 PDF 吗？
      a: 不能。你可以给支出附上 PDF，让它和数字待在一起，但只有图片会被读取。
    - q: 扫描有次数限制吗？
      a: 没有会用完的扫描额度，扫描也是免费的。文件确实有限制：每笔支出最多三个附件，每个最大 10 MB。其余内容见[免费包含什么](page:pricing)。
    - q: 谁能看到我的收据？
      a: 群组成员可以看到附在支出上的收据。收据图片还会由 Google 的 AI 服务读取，表单就是这样被填好的。
    - q: 已经添加的支出还能扫描收据吗？
      a: 不能，扫描只用于新支出。你仍然可以给已有的支出附上收据，它只会被存储，不会被读取。
    - q: 如果它填错了怎么办？
      a: 直接改掉。保存之前每个字段都可以编辑，而且你本来就该全部核对一遍。如果扫描失败或无法使用，像平常一样手动添加支出。
