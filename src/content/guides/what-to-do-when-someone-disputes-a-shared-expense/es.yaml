faq:
  heading: Preguntas
  items:
    - q: ¿Puedo cuestionar solo mi parte?
      a: No. Una pregunta retiene todo el gasto, para todos los que están en él. Si solo la división está mal, la solución es editar la división.
    - q: ¿Quién puede cerrar una pregunta?
      a: Quien la hizo, o un administrador del grupo. Si quien añadió el gasto no es administrador, no puede cerrarla en nombre de quien preguntó.
    - q: ¿Editar un gasto borra el original?
      a: No. Se conserva la versión anterior. Quién puede editar lo deciden los permisos del grupo, así que conviene avisar antes a la casa, porque los saldos cambian.
