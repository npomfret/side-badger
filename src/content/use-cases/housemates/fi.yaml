featuresHeading: Ominaisuudet, joita koti käyttää
faq:
  heading: Kysymyksiä
  items:
    - q: Voiko vuokra toistua automaattisesti?
      a: Ei, toistuvia laskuja ei ole. Kopioi viime kuun vuokra parilla napautuksella, vaihda päivämäärä ja homma on valmis.
    - q: Voimmeko jakaa huoneen koon mukaan?
      a: Kyllä, prosenteilla. Anna jokaiselle kämppikselle huonettaan vastaava osuus, kunhan osuuksien summa on 100. [Kulujen jako](page:feature/split-expenses) kertoo muista tavoista jakaa.
    - q: Entä jos kämppis muuttaa pois velkaa?
      a: Hän ei voi poistua ryhmästä, ennen kuin on tasannut, sillä kukaan ei voi lähteä, jos on velkaa tai hänelle ollaan velkaa. Luvut pysyvät rehellisinä, kunnes kaikki ovat tasoissa.
    - q: Maksaako Side Badger laskut?
      a: Ei. Se pitää kirjaa ja ehdottaa lyhyttä maksulistaa. Maksatte toisillenne miten haluatte ja kirjaatte sen sitten, kuten [tilien tasaus](page:feature/settle-up) selittää.
    - q: Voiko yksi kämppis pitää kirjaa?
      a: Kyllä. Tee hänestä ylläpitäjä ja käytä hallittua ryhmää, jossa uudet jäsenet tarvitsevat hyväksynnän ja vain luojat ja ylläpitäjät voivat muuttaa kuluja.
