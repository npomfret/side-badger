sections:
  - heading: "39 jezikov, narejeno za več ljudi"
    body: "Side Badger uporabljaj v 39 jezikih, vključno z arabščino, perzijščino in urdujščino, ki se pišejo od desne proti levi. Vsak v skupini lahko izbere svojega, tako da je stran skupine za eno osebo lahko v arabščini, za naslednjo pa v angleščini. Narejen je tudi z mislijo na uporabnike tipkovnice in bralnikov zaslona, barve članov pa imajo vzorce, zato ti ni treba ločevati zelene od rdeče."
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali vsak potrebuje uporabniški račun?"
      a: "Da, brezplačen. Vsaka oseba potrdi svoj e-poštni naslov, preden karkoli doda."
    - q: "Ali obstaja aplikacija?"
      a: "Deluje v brskalniku, dodaš pa jo lahko na začetni zaslon ali v dock, da se odpre kot aplikacija. Različice iz trgovine z aplikacijami ni in načina brez povezave tudi ne."
    - q: "Ali Side Badger premika denar?"
      a: "Ne. Vodi štetje in predlaga plačila, vi pa si plačate, kakor želite. Nato plačilo zabeležite. Glej [poravnavo](page:feature/settle-up)."
    - q: "Ali lahko nekdo odide, medtem ko dolguje denar?"
      a: "Ne. Nihče ne more zapustiti skupine, dokler komu dolguje ali mu je kdo dolžan denar, zato se najprej poravna."
    - q: "Koliko ljudi se lahko pridruži skupini?"
      a: "Do 50 oseb v skupini. Povabi jih s povezavo ali kodo QR in vklopi potrjevanje, če želiš, da skrbnik vsako osebo spusti noter."
    - q: "Kaj pa potovanja z več kot eno valuto?"
      a: "Stanja se vodijo ločeno za vsako valuto. Glej [več valut](page:feature/multiple-currencies)."
