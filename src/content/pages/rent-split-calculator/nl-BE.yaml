faq:
  heading: "Vragen"
  items:
    - q: "Wat is eerlijker, kamergrootte of inkomen?"
      a: "Geen van beide is altijd eerlijker. Kamergrootte past bij huisgenoten die betalen voor de ruimte waarin ze slapen. Inkomen past bij koppels en vrienden met heel verschillende lonen. Spreek het af vóór de eerste huurdag, niet erna."
    - q: "Moeten de rekeningen op dezelfde manier verdeeld worden?"
      a: "Bij huisgenoten meestal niet. Iedereen gebruikt energie en internet, dus gelijk verdelen is eenvoudiger, zoals in het voorbeeld. Naar inkomen geeft de calculator de rekeningen dezelfde aandelen als de huur."
    - q: "Kan ik vierkante voet gebruiken?"
      a: "Ja. Kies ft² en typ je oppervlaktes in vierkante voet. De eenheid is enkel een label, en de aandelen blijven dezelfde zolang iedereen dezelfde eenheid gebruikt."
    - q: "Is de calculator gratis?"
      a: "Ja. Gratis. Geen advertenties. Geen dagelijkse limieten. Je hebt ook geen account nodig."
