meta:
  title: "공유 지출에 이의가 있을 때 해야 할 일 | 사이드 배저"
  description: "뼈 있는 메시지는 접어 두세요. 대신 지출에 질문을 걸면 이야기하는 동안 모두의 잔액에서 빠집니다. 파티 와인 £45로 풀어 봤어요."
h1: "공유 지출에 이의가 있을 때 해야 할 일"
navLabel: "이의가 있는 지출"
lead: "뼈 있는 메시지를 보내는 대신 지출에 질문을 올리세요. 질문이 열려 있는 동안 그 지출 전체가 모두의 잔액에서 빠집니다. 댓글로 이야기를 나누고, 그룹이 동의하면 분할을 수정하고, 질문한 사람이나 관리자가 질문을 닫으면 됩니다."
cta:
  heading: "곤란한 질문도 공손하게"
  body: "무료 계정을 만들고, 집 그룹을 시작하고, 관리자에게 지출 질문을 켜 달라고 요청하세요. 누군가 켜기 전까지는 꺼져 있습니다. 먼저 둘러보고 싶다면 [사용 방법](page:how-it-works) 또는 [무료로 쓸 수 있는 범위](page:pricing)를 확인하세요."
sections:
  - heading: "룸메이트 셋과 £45짜리 와인"
    body: "파티가 끝난 뒤 Tom이 집 그룹에 와인을 추가합니다. £45이고 Tom이 결제했으며, Tom, Priya, Aisha가 똑같이 나눠서 1인당 £15입니다. Aisha는 술을 마시지 않아요. Tom은 파티를 위해 샀고 그 파티는 [집](page:use-case/housemates)을 위한 것이었으니, 잘못한 건 없습니다. Aisha가 묻는 것도 잘못이 아니고요. 여기에 악당은 없습니다. 그저 £15어치 와인이 논란일 뿐인데, 이걸 어색하게 만들 방법은 많아요. 집 전체에 보내는 뼈 있는 메시지가 그중 하나입니다. 지출에 올리는 질문은 더 부드러운 방법이에요."
  - heading: "질문을 올리면 어떻게 되나요"
    body: "Aisha가 지출을 열고 질문을 올립니다. 그러면 Aisha의 몫만이 아니라 지출 전체가 모두의 잔액에서 빠지고, 다른 것은 영향을 받지 않습니다. 대량 장보기(£84)와 청소 도우미(£60)는 그대로 반영되어 1인당 £28 + £20 = £48입니다. 그래서 와인이 보류된 동안 Aisha는 £48를 줘야 하고, Tom은 £36를 받을 돈이 있으며, Priya는 £12를 받을 돈이 있습니다. 집에서 와인을 어떻게 결정하든, 그동안은 누구의 잔액에도 와인이 포함되지 않습니다. 지출에 포함된 다른 사람도 각자 질문을 올릴 수 있어요. 와인은 그 지출에 열린 마지막 질문이 닫혀야 다시 잔액에 들어가며, 질문은 질문한 사람이나 관리자가 닫습니다."
  - heading: "이야기를 나누고, 고치기"
    body: "Aisha의 질문은 지출의 댓글에 올라가므로 답글이 바로 그 아래에 붙습니다. 댓글과 질문에 대한 자세한 내용은 [함께 계획하기](page:feature/plan-together)에서 확인하세요. Tom과 Priya가 질문을 읽고 집에서 이야기를 나눕니다. 와인은 마신 사람의 몫, 즉 Tom과 Priya의 몫이라고 결정하죠. 다른 집이라면 세 명이 나누는 방식을 유지하거나 그 중간쯤에서 합의할 수도 있고, 그것도 괜찮습니다. 사이드 배저는 여러분이 합의한 내용을 저장할 뿐, 와인에 대한 의견은 없어요. Tom은 지출을 수정해서 자신과 Priya가 똑같이 나누도록 하고, 1인당 £22.50입니다(£45 ÷ 2). Aisha는 더 이상 포함되지 않으므로 Aisha의 질문은 이전 버전과 함께 남고, 와인은 다시 잔액에 들어갑니다. 이전 버전은 보관됩니다."
  - heading: "결과 읽기"
    body: "와인이 다시 들어가면 Tom은 £58.50를 받을 돈이 있고, Priya는 £10.50를 줘야 하며, Aisha는 £48를 줘야 합니다. 사이드 배저는 결제 2건을 제안하며, 둘 다 Tom에게 갑니다. Aisha의 £48는 와인이 보류되었을 때와 같은 금액인데, Aisha는 와인에 포함되지 않기 때문이에요. Priya는 £12를 받을 돈이 있던 상태에서 £10.50를 줘야 하는 상태가 되었는데, 이는 와인의 절반인 £22.50 때문입니다. 세 명이 나누는 방식이 그대로였다면 Aisha는 £63(£28 + £20 + £15)를 줘야 했을 겁니다. 논란 전체가 £15짜리였어요. 원하는 방법으로 서로 지불한 다음 **정산하기**에서 결제마다 기록하세요. 나머지는 [정산하기](page:feature/settle-up)에서 다룹니다."
  - heading: "말이 끊기지 않게 표현하기"
    body: "Aisha의 질문은 이렇습니다. “와인을 전혀 안 마셨어요. 분할을 한번 볼 수 있을까요?” 짧고, 어느 지출인지 짚고, 따지지 않고 묻습니다. 몇 가지 습관이 도움이 돼요."
    items:
      - "**사람이 아니라 지출에 대해 물으세요.** “와인 분할을 한번 확인해 볼 수 있을까요?”는 대화를 시작합니다. “왜 제가 당신 와인 값을 내야 하죠?”는 다른 종류의 대화를 시작하고요."
      - "**어떻게 되면 좋을지 말하세요.** “마신 사람끼리만 나눌 수 있을까요?”는 그룹이 동의하거나 답할 거리를 줍니다."
      - "**이유를 한두 문장으로 적으세요.** 입력란은 **귀하의 질문**이며 비워 둘 수 없습니다."
      - "**답글은 한곳에 모으세요.** 답변은 해당 숫자 바로 옆, 지출의 댓글에 남깁니다."
  - heading: "사이드 배저에서 설정하기"
    items:
      - "**질문 켜기.** 기본값은 꺼짐입니다. 관리자가 그룹의 **설정**을 열고 **일반** 탭의 **기능**에서 **지출 질문 허용**을 켠 다음 **저장**을 선택합니다. 나중에 끄면 열려 있던 질문이 모두 지워집니다."
      - "**질문 올리기.** 지출을 열고 분할에서 내 이름 옆의 **질문이 있습니다**를 선택하세요. **귀하의 질문**에 이유를 적고 **질문이 있습니다**를 다시 선택합니다. 지출에 포함된 사람만 할 수 있어요. 그러면 지출에 **질문됨** 배지가 표시됩니다."
      - "**보류된 것 찾기.** 지출 목록에서 **질문된 것만**을 선택하면 열린 질문이 있는 지출이 표시됩니다."
      - "**그룹이 동의하면 고치기.** 지출을 열고 **편집**을 선택해 **분할 대상**을 바꾼 다음 **비용 업데이트**를 선택하세요. 누가 편집할 수 있는지는 그룹의 권한에 달려 있습니다."
      - "**고칠 게 없으면 닫기.** 질문한 사람은 **질문됨** 배지의 닫기 버튼(**질문 닫기**)을 사용할 수 있고, 관리자도 마찬가지입니다. 마지막 질문이 닫히면 지출이 잔액으로 돌아갑니다."
  - heading: "그렇게 깔끔하지 않을 때"
    items:
      - "**수정해도 질문한 사람이 남아 있을 때.** 질문한 사람이 여전히 지출에 포함되어 있다면 질문이 수정된 버전으로 이어지고, 그 사람이나 관리자가 닫을 때까지 기다립니다. 금액을 고쳤다고 해서 고쳐졌다는 데 동의한 것은 아니에요."
      - "**지출에 포함되지 않았다면.** 지출에 포함된 사람만 질문할 수 있습니다. 이상해 보이는 게 있으면 지출의 댓글에 적거나 추가한 사람에게 물어보세요."
      - "**그룹을 나가려는 사람이 있을 때.** 열린 질문이 있으면 그 지출에 포함된 사람은 나갈 수 없습니다. 질문을 닫거나, 그 사람이 더 이상 포함되지 않도록 지출을 수정하면 나갈 수 있어요."
  - heading: "사이드 배저가 하지 않는 일"
    items:
      - "누가 옳은지 판단하지 않습니다. 지출을 잔액에서 빼 두고, 여러분이 합의한 내용을 보관할 뿐입니다."
      - "지출이 반영되기 전에 승인을 요구하지 않습니다. 질문이 걸린 지출만 보류됩니다."
      - "지출의 일부만 보류할 수는 없습니다. 질문하면 지출 전체가 잔액에서 빠집니다."
      - "돈을 옮기지 않습니다. 원하는 방법으로 서로 지불하고 기록하세요."
exampleAfter: 3
