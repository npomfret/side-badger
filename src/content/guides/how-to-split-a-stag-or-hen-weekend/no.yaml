faq:
  heading: "Spørsmål"
  items:
    - q: "Betaler forloveren mer?"
      a: "Bare hvis gruppen blir enig om det. Appen gir ingen en spesiell rolle i regnestykket. Hvis noen dekker mer, velger du **Eksakte beløp** eller **Prosent** under **Hvordan fordele** og skriver inn andelene dere ble enige om."
    - q: "Hva med drikke noen ikke tok?"
      a: "Legg drikken inn som en egen utgift og kryss av bare for dem som hadde den. Hvis alle hadde ulik mengde, velger du **Eksakte beløp** og skriver inn hver persons andel. Ingen betaler for det de ikke hadde."
    - q: "Kan den som feires se gruppen senere?"
      a: "Ja, når overraskelsen er over. Inviter vedkommende, så kan en administrator gjøre vedkommende til **Seer** under **Sikkerhet og tillatelser** i gruppens innstillinger. En seer ser alt og endrer ingenting, så vent til ingenting lenger er hemmelig. Vedkommende trenger en gratis konto for å bli med."
