faq:
  heading: "Питања"
  items:
    - q: "Шта ако неко има већу собу, али мање светла?"
      a: "Површина је само полазна тачка, па се група може договорити да је прилагоди. Одузми поен-два тамној соби, дај их осталима и провери да проценти и даље дају 100. Side Badger чува оно око чега се договорите и не просуђује о томе."
    - q: "Да ли и рачуне треба делити према величини собе?"
      a: "Обично не. Струју и интернет користе сви, па је једнака подела једноставнија, као у примеру изнад. Ако је један цимер цео дан код куће, група може да се договори другачије, на пример тачним износима. Могућности описује [подела трошкова](page:feature/split-expenses)."
    - q: "Можемо ли касније да променимо поделу?"
      a: "Да, за нове трошкове. Промени проценте кад копираш кирију, а ранији месеци остају какви су били. Да исправиш прошли трошак, измени га ако то дозвољавају дозволе групе и прво обавести кућу, јер се стања мењају. Претходна верзија се чува."
