meta:
  title: Listen, Umfragen und Kommentare für Gruppenkosten | Side Badger
  description: Ausgaben kommentieren, die seltsame hinterfragen, eine gemeinsame Liste führen und über die Villa abstimmen. Erst planen, dann teilen. Kostenlos, ohne Werbung.
h1: Gemeinsam planen, danach teilen
navLabel: Gemeinsam planen
lead: Die Einkaufsliste und die Einkaufsrechnung reden endlich miteinander. Side Badger gibt deiner Gruppe einen Ort, um über das Geld zu sprechen, bevor und nachdem es ausgegeben ist, mit Kommentaren an jeder Ausgabe, einer Möglichkeit, Ausgaben zu hinterfragen, die falsch aussehen, sowie gemeinsamen Listen und Umfragen für die großen Entscheidungen. Danach [teilst du Ausgaben](page:feature/split-expenses) wie gewohnt.
cta:
  heading: Erst planen, dann teilen
  body: Erstelle ein kostenloses Konto, starte eine Gruppe und leg die erste Liste, Umfrage oder Frage direkt neben das Geld. Unsicher, was dann passiert? Lies [so funktioniert es](page:how-it-works).
problem:
  heading: Der Chat ist hier, die Rechnung ist dort
  body: "Gruppenausgaben leben meist an zwei Orten. Die Zahlen stehen an einem, und der Streit über die Zahlen steht in einem Chat, der am Dienstag weggescrollt ist. Die Einkaufsliste ist das Foto eines Kühlschranks. Die Villa wurde per Daumen hoch von den meisten beschlossen, vermutlich. Side Badger hält die Planung in der Gruppe, neben den Ausgaben, um die es geht: ein Kommentar dort, wo die Kosten sind, eine Liste dort, wo der Einkauf ist, eine Umfrage für die große Entscheidung und eine Möglichkeit, „Moment, stimmt das so?“ zu sagen, ohne einen Absatz zu schreiben. Alles bleibt beim Geld der Gruppe, wofür die Gruppe ja da ist."
workflow:
  heading: Von der Villa-Abstimmung bis zur Einkaufsrechnung
  steps:
    - title: Lass über die große Entscheidung abstimmen
      body: Füge eine Umfrage für die Entscheidung hinzu, die die Rechnung bestimmt, etwa welche Villa. Wähle zwei bis zehn Optionen, lege fest, wie viele Stimmen jede Person hat, und schließe sie, wenn alle abgestimmt haben. Dann ist die Gewinneroption markiert.
      shot: S17
      shotAlt: Eine geschlossene Umfrage mit markierter Gewinneroption und der Stimmenzahl neben jeder Option
    - title: Schreibt die Einkaufsliste gemeinsam
      body: Starte eine gemeinsame Liste, füge die Posten hinzu und hake sie ab, wenn sie im Einkaufswagen landen. Der Einkauf kommt danach als Ausgabe dazu.
      shot: S16
      shotAlt: Eine gemeinsame Einkaufsliste mit einigen abgehakten Posten und einem Fortschrittszähler
    - title: Rede über die Kosten dort, wo sie stehen
      body: Kommentiere die Ausgabe selbst, hänge den Beleg an und reagiere mit einem Emoji. Das Gespräch bleibt neben der Zahl, um die es geht.
      shot: S08
      shotAlt: Eine Ausgabe mit ihren Details, einer Belegvorschau, einem Kommentarverlauf und Emoji-Reaktionen
    - title: Hinterfrage die Ausgabe, die komisch aussieht
      body: Wenn die Gruppe Ausgabenfragen eingeschaltet hat, kann jede an einer Ausgabe beteiligte Person **Ich habe eine Frage** wählen. Die Ausgabe bleibt aus den Salden, bis die Frage geklärt ist.
      shot: S18
      shotAlt: Die Ausgabenliste mit einem Abzeichen „Hinterfragt“ und dem Filter „Nur hinterfragt“
    - title: Sieh, was sich geändert hat und wer es geändert hat
      body: Der Aktivitätsverlauf und die Benachrichtigungsglocke zeigen, was in deinen Gruppen neu ist. Push-Benachrichtigungen gibt es, wenn du sie willst.
      shot: S19
      shotAlt: Das Benachrichtigungs-Dropdown mit einer Liste der letzten Aktivitäten
