faq:
  heading: "Perguntas"
  items:
    - q: "Posso questionar só a minha parte?"
      a: "Não. Uma pergunta retém a despesa inteira, para todos os que estão nela. Se só a divisão está errada, a solução é editar a divisão."
    - q: "Quem pode fechar uma pergunta?"
      a: "Quem a fez, ou um administrador do grupo. Se quem adicionou a despesa não for administrador, não a pode fechar em nome de quem perguntou."
    - q: "Editar uma despesa apaga a original?"
      a: "Não. A versão anterior fica guardada. Quem pode editar é decidido pelas permissões do grupo, por isso vale a pena avisar a casa primeiro, porque os saldos mudam."
