faq:
  heading: "প্রশ্ন"
  items:
    - q: "অতিথিরা কি যোগ না দিয়ে গ্রুপ দেখতে পারে?"
      a: "না। মানুষজন লিঙ্ক বা QR কোড আর একটি বিনামূল্যের অ্যাকাউন্ট দিয়ে যোগ দেয়, তাই ভেতরে ঢোকার পরই গ্রুপ দেখতে পায়।"
    - q: "Side Badger কি টাকা তুলতে পারে?"
      a: "না। Side Badger হিসাব রাখে আর কখনও টাকা নাড়াচাড়া করে না। যেভাবে খুশি একে অপরকে দিন, তারপর পেমেন্টটা রেকর্ড করুন। এটি বিনামূল্যে, কোনো বিজ্ঞাপন ছাড়া আর দৈনিক কোনো সীমা ছাড়া; দেখুন [দাম](page:pricing)।"
    - q: "ভোট কি নাম না জানিয়ে হতে পারে?"
      a: "হ্যাঁ। পোল বানানোর সময় কে কাকে ভোট দিয়েছে তা লুকিয়ে রাখতে পারেন। সেটিং শুধু প্রথম ভোটের আগে বদলানো যায়।"
    - q: "মানুষ কি আলাদা আলাদা পরিমাণ দিতে পারে?"
      a: "হ্যাঁ। খরচ নির্দিষ্ট পরিমাণে ভাগ করুন, যাতে প্রত্যেকের ভাগ হয় সেই অঙ্ক যাতে আপনারা রাজি হয়েছিলেন, অথবা যারা জড়িত ছিল না তাদের বাদ দিন।"
    - q: "একজন আয়োজক কি হিসাব রাখতে পারে?"
      a: "হ্যাঁ। ম্যানেজড গ্রুপ প্রিসেট ব্যবহার করুন, যাতে শুধু নির্মাতা ও অ্যাডমিনরা খরচ বদলান আর অ্যাডমিনরা নতুন সদস্যদের অনুমোদন দেন।"
