faq:
  heading: "Ceisteanna"
  items:
    - q: "Cén ráta malairte a úsáideann Side Badger?"
      a: "Ráta malairte reatha, a fhaightear nuair a chuireann tú an costas isteach, má tá ceann ar fáil. Is féidir leat é a athrú go dtí an ráta a fuair tú i ndáiríre."
    - q: "An féidir leis an ngrúpa cloí le punt agus yen?"
      a: "Is féidir. I **Socruithe** an ghrúpa, cuir **Cuir srian ar airgeadraí don ghrúpa seo** ar siúl faoi **Socruithe Airgeadra**, roghnaigh faoi **Airgeadraí ceadaithe** na cinn atá uait agus socraigh an **Airgeadra réamhshocraithe do chostais nua**. Níos lú roghanna sa liosta, níos lú buille faoi thuairim mícheart ag an gcuntar."
    - q: "An gcaithfimid tiontú ar chor ar bith?"
      a: "Ní chaithfimid. Fanann airgeadraí ar leith mura roghnaíonn tusa nó do ghrúpa tiontú, agus faigheann gach airgeadra a liosta gearr féin d'íocaíochtaí."
