faq:
  heading: 常见问题
  items:
    - q: 这个计算器免费吗？
      a: 免费。无广告。无每日限制。你也不需要账户。
    - q: 它会保存我输入的内容吗？
      a: 不会。不会保存，也不会发送到任何地方。想保留你的数字，请使用“复制链接”，再把链接存在某个地方。
    - q: 谁能看到我复制的链接？
      a: "拿到它的任何人。数字就存在链接本身里，位于 # 之后，所以只把它分享给应该看到这些数字的人。"
    - q: 它会转移资金吗？
      a: 不会。它只算出谁该付给谁，你们想怎么付就怎么付。Side Badger 也从不经手你的钱。详见[结算](page:feature/settle-up)。
    - q: 可以分摊用两种货币支付的旅行吗？
      a: 这里不行，因为一次计算只有一种货币。在群组里，每种货币各有自己的余额。详见[多币种](page:feature/multiple-currencies)。
    - q: 如果金额对不上怎么办？
      a: 计算器会在那笔支出下面提示，并在对上之前不显示结果。确切金额必须合计等于总额，百分比必须合计为 100。
identicalApproved:
  - example.people.0.name
  - example.people.1.name
  - example.people.2.name
  - example.people.3.name
