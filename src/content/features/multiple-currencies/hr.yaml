meta:
  title: "Dijeli troškove u 140 valuta, pretvorene ili zasebno"
  description: "Unesi svaki trošak u valuti u kojoj si platio, vodi stanja zasebno ili pretvaraj po tečaju koji vidiš i možeš promijeniti, a zatim se poravnaj kratkim popisom uplata."
h1: "Dijeli troškove u 140 valuta"
navLabel: "Više valuta"
lead: "Eura, jeni i onaj jedan taksi u bahtima. Side Badger prima svaki trošak u valuti u kojoj si platio, drži stanja u redu i može pretvarati kad se grupa radije poravna jednom. Radi u 140 valuta i prirodno pristaje [grupnim putovanjima](page:use-case/group-trips)."
cta:
  heading: "Donesi svoja eura, donesi svoje jene"
  body: "Napravi korisnički račun, osnuj grupu i dodaj prvi trošak u bilo kojoj valuti koju si slučajno imao u ruci."
problem:
  heading: "Unesi kako je plaćeno"
  body: "Putovanje se rijetko plaća u jednoj valuti. Hotel je rezerviran kod kuće u funtama, večera plaćena u jenima, a kava na aerodromu u onome što se koristilo na presjedanju. Ručno pretvarati sve prije nego što to uopće upišeš način je na koji se tablice napuštaju. U Side Badgeru svaki trošak unosiš u valuti s računa, a svaki iznos slijedi pravila svoje valute, pa jeni nemaju decimale, a dinari imaju tri. Nedavno korištene valute su prve na popisu."
workflow:
  heading: "Drži valute zasebno ili pretvaraj usput"
  steps:
    - title: "Dodaj trošak u njegovoj valuti"
      body: "Odaberi valutu, upiši iznos, reci tko je platio i tko je dijelio. Ništa drugo nije potrebno. To je zadano i čuva izvorni iznos točno onako kako si ga unio."
      shot: S07
      shotAlt: "Obrazac troška s unesenim iznosom u jenima"
    - title: "Prati stanje za svaku valutu"
      body: "Stanja se vode zasebno po valuti, a svako ima vlastiti kratak popis predloženih uplata. Funte se poravnavaju u funtama, a jeni u jenima."
      shot: S10
      shotAlt: "Zaslon stanja s pojednostavljenim dugovima u dvije valute"
    - title: "Ili pretvori kad se grupa radije poravna jednom"
      body: "Odaberi drugu valutu pri unosu troška i Side Badger ga može pretvoriti po aktualnom tečaju, koji možeš promijeniti u onaj koji je vrijedio pri zamjeni. Pretvoreni iznos pridružuje se stanju u toj valuti. Pretvorba je izbor koji grupa donosi, nikad nešto što se događa iza tvojih leđa."
options:
  heading: "Tečaj koji vidiš i možeš promijeniti"
  items:
    - title: "Tečaj je prikazan"
      body: "Kad pretvaraš, tečaj i pretvoreni iznos pojavljuju se u obrascu, pa nitko ne mora vjerovati broju na riječ."
    - title: "Upiši svoj"
      body: "Dobio si bolji tečaj u mjenjačnici ili gori na aerodromu? Uredi tečaj u onaj koji je vrijedio i pretvoreni iznos se ažurira."
    - title: "Izvornik ostaje"
      body: "Izvorni iznos ostaje uz trošak, pokraj pretvorenog, za svakoga tko pita koliko je bilo u jenima."
    - title: "Pretvorba je besplatna"
      body: "Pretvaranje ne košta ništa. Nema naknade za unos troška u drugoj valuti."
