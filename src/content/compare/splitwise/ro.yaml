    - feature: Conversia valutară
      other: O funcție Pro. Atingi „Convertește”, iar Splitwise convertește cheltuielile unui grup în valuta ta implicită la cursul de schimb din acel moment.
      sideBadger: Gratuit. Convertești fiecare cheltuială pe măsură ce o introduci, la un curs de schimb actual sau la cel pe care l-ai primit de fapt. Suma inițială rămâne pe cheltuială.
      source: currencies-help
    - feature: Valute și limbi
      other: Peste 100 de valute și peste 7 limbi, cum spune pagina lui principală.
      sideBadger: 133 de valute și 39 de limbi. Fiecare persoană din grup își poate alege limba.
      source: home
    - feature: Unde îl folosești
      other: Aplicații pentru iPhone și Android, plus web.
      sideBadger: În browser. Conectează-te, apoi adaugă-l pe ecranul de pornire și se deschide ca o aplicație. Nu e în magazinele de aplicații.
      source: home
    - feature: Moduri de a împărți
      other: Egal, pe sume exacte, procentual, pe cote, prin ajustare sau pe articole.
      sideBadger: Egal, pe sume exacte sau procentual, cu un singur plătitor pe cheltuială. Nu pe cote și nu pe articole.
      source: split-help
    - feature: Utilizare offline
      other: Listează un mod offline printre funcțiile de bază.
      sideBadger: Nu. Are nevoie de o conexiune.
      source: home
    - feature: Plăți și banca ta
      other: "În unele locuri poate trimite bani din aplicație: Splitwise Pay în SUA, Venmo pentru solduri în dolari americani, PayPal și Pay by Bank în anumite țări europene; Pay by Bank conectează un cont curent personal."
      sideBadger: Nu se atinge niciodată de banii tăi și nu îți cere datele băncii. Plătește cum preferi, apoi înregistrează plata.
      source: payments-help
    - feature: Grafice și împărțiri implicite
      other: Ambele sunt funcții Pro.
      sideBadger: Niciuna.
      source: pro
faq:
  heading: Întrebări
  items:
    - q: Este Side Badger o alternativă gratuită la Splitwise?
      a: "Pentru împărțirea cheltuielilor într-un grup, da, și face mai mult decât calculele: comentarii, întrebări, liste, sondaje și roluri de grup, cu scanarea chitanțelor și conversia valutară gratuite. Dacă ai nevoie de o aplicație din magazin, de utilizare offline sau de plăți în aplicație, Splitwise le face, iar Side Badger nu."
    - q: De unde vin detaliile despre Splitwise?
      a: "Din paginile proprii ale Splitwise: pagina principală, pagina Pro și centrul de ajutor. Fiecare rând din tabel trimite la pagina din care vine, iar data de deasupra tabelului spune când le-am citit. Le verificăm în fiecare trimestru."
    - q: Va rămâne Side Badger gratuit?
      a: Tot ce este în Side Badger e gratuit astăzi. Dacă asta se schimbă vreodată, te anunțăm înainte. [Pagina de prețuri](page:pricing) are detaliile.
    - q: Trebuie să treacă toți din grupul meu la Side Badger?
      a: Da. Toți cei din grup au nevoie de un cont Side Badger gratuit și se pot alătura cu un link sau un cod QR.
    - q: Are Side Badger o aplicație mobilă?
      a: "Nu într-un magazin de aplicații. Rulează în browser: conectează-te de pe telefon, apoi adaugă-l pe ecranul de pornire ca să se deschidă ca o aplicație. [Cum funcționează](page:how-it-works) arată cum."
