meta:
  title: "Share expenses equal-equal, exactly or by percentage | Side Badger"
  description: "Share one cost equal-equal, by exact amounts or by percentage, and leave out anybody wey no dey there. Free, with no ads and no daily limits."
h1: "Share expenses equal-equal, exactly or by percentage"
navLabel: "Share expenses"
lead: "Not everything na 50/50. Side Badger fit handle am. Talk who pay, pick di people wey share di cost, and share am **equal-equal, by exact amounts or by percentage**. Grudge dem dey sell separately."
cta:
  heading: "Share di next one well"
  body: "Create free account, start group and add di expense wey you don dey wan sort out. You no sure wetin go happen next? See [how e dey work](page:how-it-works), or check [wetin free cover](page:pricing)."
  button: "Create free account"
problem:
  heading: "Not everything na 50/50"
  body: "Rent dey follow di size of di room. Gift dey follow who promise wetin. Dinner dey follow who stay reach dessert. To share bill half-half dey work until di first bill wey no be half, and then somebody go open spreadsheet. Side Badger dey record who pay, who share di cost and how e divide, so di balances go come out correct without anybody doing long division for table."
workflow:
  heading: "To add expense, from start to finish"
  steps:
    - title: "Talk who pay and for wetin"
      body: "Enter di amount, short description and di person wey pay. One person dey pay for each expense, and dat one dey keep di arithmetic honest."
      shot: S05
      shotAlt: "Di expense form with cottage rent wey dem share by percentage between three people"
    - title: "Pick di split"
      body: "Choose equal, exact amounts or percentages. Percentages must add up to 100, and exact amounts must add up to di total."
      shot: S06
      shotAlt: "Di expense form with exact amounts wey dem enter for each person for one gift"
    - title: "Add di story"
      body: "Set di date, add labels, place and note. Everybody for di group go see di same details, and fit comment right there."
      shot: S08
      shotAlt: "One expense with im details, comment thread and di original amount wey dem enter am as"
    - title: "Raise question if something look wrong"
      body: "If di group don turn on expense questions, anybody wey dey inside one expense fit question am, and di expenses list fit show only di Questioned ones."
      shot: S18
      shotAlt: "Di expenses list with Questioned badge and di Only questioned filter"
options:
  heading: "Three ways to share"
  items:
    - title: "Equal-equal"
      body: "Di default for dinners, taxis and anything wey everybody share evenly. If di total no divide clean, di odd penny go to one person at random, no be di same person every time. For di taxi below, na Ana."
    - title: "By exact amaunts"
      body: "Type wetin each person owe. E good for di gift wey everybody choose different price, or di shop wey one person trolley carry more than di shared groceries. Di amounts must add up to di total."
    - title: "By pasentej"
      body: "Give each person share of di total. Rent by room size na di classic, with di biggest room paying di biggest share and nobody dey pretend say e no be so."
example:
  heading: "One cottage weekend, four expenses, three splits"
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: "di cottage, by room size"
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: "dinner"
      payer: ben
      amount: 84
      split:
        method: equal
    - label: "chop shopping"
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: "di taxi go house"
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: "Only di people wey dey there"
    body: "Share one cost between everybody, or only di people wey share am. Leave people out of di costs wey dem no dey part of, and di balances go show am. Di housemate wey travel for all week no owe for di takeaway, wey [housemates](page:use-case/housemates) go recognise as basic justice."
  - heading: "Di details wey go save argument later"
    items:
      - "Set di **date** and optional time. Shortcuts like today, yesterday, dis morning and last night go save you some typing."
      - "Add up to three **labels** to group expenses, like chop shopping or travel."
      - "Add di **place**. Paste map link and di place name go fill by itself."
      - "Add **note** for di story behind di number, with some formatting if di story need am."
      - "Attach up to three **risit-dem**, as photo or PDF, so di proof go stay with di expense."
      - "Use di **comments** to keep di conversation next to di expense wey e dey about, no be for chat thread wey nobody dey scroll back to."
  - heading: "Copy, edit, and see wetin change"
    body: "Copy last month rent instead of to type am again, then change wetin different. If number wrong, edit di expense. Di earlier version dey kept and di edit show for di group activity, so nobody dey change number quietly. Wetin anybody fit edit depend on di group permissions."
  - heading: "When something look wrong"
    body: "Group fit turn on expense questions. Anybody wey dey inside one expense fit raise question and talk why, and di expense go stay out of di balances until di person wey ask, or admin, close am. E dey off by default and admin go turn am on for di group. E fit [events and celebrations](page:use-case/events-and-celebrations), where di deposit wey nobody remember suddenly become everybody business."
limits:
  heading: "Di limits"
  items:
    - "One person dey pay for each expense. If two people pay, record two expenses."
    - "No split by item and no split by shares. Equal, exact amounts and percentages na wetin dey."
    - "Di percentages must add up to 100."
    - "One expense fit reach 999,999.99 for im own currency, with dat currency usual decimal places."
    - "Expenses no fit repeat by themselves. Copy last month own instead."
    - "Dates no fit dey for future or more than 10 years ago."
    - "Expense wey involve person wey don leave di group go become read-only."
useCasesHeading: "Where to share like dis help"
faq:
  heading: "Question dem"
  items:
    - q: "Two people fit pay for one expense?"
      a: "No for one expense. Record two, one for each payer, and di balances go come out di same."
    - q: "I fit share receipt by item?"
      a: "No. Split na equal, by exact amounts or by percentage. For bill with different items, enter wetin each person owe as exact amounts."
    - q: "I fit set default split?"
      a: "No. Copy earlier expense to reuse im split, and change wetin different."
    - q: "Bills fit repeat every month?"
      a: "No. Copy last month expense instead, e dey take few seconds."
    - q: "Who fit edit expense?"
      a: "Whoever di group permissions allow. Every edit dey show for di group activity, so changes no dey ever silent."
    - q: "Wetin go happen to di balances afterwards?"
      a: "Dem go update as expenses dey come, and [settle up](page:feature/settle-up) go turn dem to short list of payments. If expense dey for another currency, see [multiple currencies](page:feature/multiple-currencies)."
