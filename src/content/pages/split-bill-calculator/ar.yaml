faq:
  heading: "أسئلة"
  items:
    - q: "هل الحاسبة مجانية؟"
      a: "نعم. مجانية. بلا إعلانات. بلا حدود يومية. ولا تحتاج إلى حساب أيضاً."
    - q: "هل تحفظ ما أكتبه؟"
      a: "لا. لا يُحفظ شيء ولا يُرسل إلى أي مكان. وللاحتفاظ بأرقامك استخدم «نسخ الرابط» واحفظ الرابط في مكان ما."
    - q: "من يستطيع رؤية الرابط الذي أنسخه؟"
      a: "كل من لديه الرابط. فالأرقام موجودة في الرابط نفسه، بعد علامة #، فلا تشاركه إلا مع من ينبغي أن يراها."
    - q: "هل تنقل الحاسبة المال؟"
      a: "لا. تحسب من ينبغي أن يدفع لمن، وتدفعون لبعضكم بالطريقة التي تناسبكم. وSide Badger لا يلمس أموالك أبداً هو الآخر. انظر [تسوية الحسابات](page:feature/settle-up)."
    - q: "هل أستطيع تقسيم رحلة دُفعت بعملتين؟"
      a: "ليس هنا، لأن الحساب الواحد له عملة واحدة. أما في المجموعة فلكل عملة رصيدها الخاص. انظر [العملات المتعددة](page:feature/multiple-currencies)."
    - q: "ماذا لو لم يتطابق مجموع المبالغ؟"
      a: "تنبّهك الحاسبة إلى ذلك تحت المصروف ولا تعرض أي نتيجة إلى أن يتطابق المجموع. فيجب أن يساوي مجموع المبالغ المحددة إجمالي المصروف، وأن يبلغ مجموع النسب 100."
