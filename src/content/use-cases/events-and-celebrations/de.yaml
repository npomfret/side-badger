featuresHeading: Die Funktionen, die das nutzt
faq:
  heading: Fragen
  items:
    - q: Können Gäste die Gruppe sehen, ohne beizutreten?
      a: Nein. Man tritt per Link oder QR-Code und mit einem kostenlosen Konto bei, und sieht die Gruppe erst, wenn man drin ist.
    - q: Kann Side Badger das Geld einsammeln?
      a: Nein. Side Badger führt die Rechnung und bewegt nie Geld. Zahlt einander, wie ihr wollt, und erfasst dann die Zahlung. Es ist kostenlos, ohne Werbung und ohne Tageslimits; siehe [Preise](page:pricing).
    - q: Können Abstimmungen anonym sein?
      a: Ja. Beim Erstellen einer Umfrage kannst du verbergen, wer wofür gestimmt hat. Die Einstellungen lassen sich nur vor der ersten Stimme ändern.
    - q: Können Leute unterschiedlich viel beisteuern?
      a: Ja. Teile eine Ausgabe nach genauen Beträgen, damit der Anteil jeder Person die Zahl ist, auf die ihr euch geeinigt habt, oder lass die weg, die nicht beteiligt waren.
    - q: Kann die Organisation die Bücher führen?
      a: Ja. Nutze die Voreinstellung für verwaltete Gruppen, sodass nur Ersteller und Admins Ausgaben ändern und Admins neue Mitglieder freigeben.
