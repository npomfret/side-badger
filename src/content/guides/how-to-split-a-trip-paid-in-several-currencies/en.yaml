faq:
  heading: Questions
  items:
    - q: Which exchange rate does Side Badger use?
      a: A current exchange rate, fetched when you enter the expense where one is available. You can change it to the rate you actually got.
    - q: Can the group stick to pounds and yen?
      a: Yes. In the group's **Settings**, turn on **Restrict currencies for this group** under **Currency Settings**, pick the **Permitted currencies** and set the **Default currency for new expenses**. Fewer options in the list, fewer wrong guesses at the till.
    - q: Do we have to convert at all?
      a: No. Currencies stay separate unless you or your group choose to convert, and each currency gets its own short list of payments.
