faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "నా వాటాను మాత్రమే ప్రశ్నించవచ్చా?"
      a: "లేదు. ప్రశ్న మొత్తం ఖర్చును, అందులో ఉన్న అందరికీ నిలుపుతుంది. విభజన మాత్రమే తప్పైతే, పరిష్కారం విభజనను సవరించడం."
    - q: "ప్రశ్నను ఎవరు మూసివేయగలరు?"
      a: "అడిగిన వ్యక్తి, లేదా గ్రూప్ అడ్మిన్. ఖర్చును జోడించిన వ్యక్తి అడ్మిన్ కాకపోతే, ప్రశ్నించినవాళ్ల తరఫున దాన్ని మూసివేయలేరు."
    - q: "ఖర్చును సవరిస్తే అసలుది చెరిగిపోతుందా?"
      a: "లేదు. పాత వెర్షన్ ఉంచబడుతుంది. ఎవరు సవరించవచ్చో గ్రూప్ అనుమతులు నిర్ణయిస్తాయి, కాబట్టి ముందు ఇంట్లో చెప్పడం మంచిది, ఎందుకంటే బ్యాలెన్స్‌లు మారతాయి."
