meta:
  title: Hatiin ang gastos sa 140 pera, na-convert o magkahiwalay
  description: Ilagay ang bawat gastos sa perang ginamit mo sa pagbayad, panatilihing magkahiwalay ang mga balanse o mag-convert sa rate na nakikita at mababago mo, saka mag-settle up sa maikling listahan ng mga bayad.
h1: Hatiin ang gastos sa 140 pera
navLabel: Maraming pera
lead: Euro, yen, at ang isang taxi na baht ang bayad. Tinatanggap ng Side Badger ang bawat gastos sa perang ginamit mo sa pagbayad, pinananatiling tama ang mga balanse, at puwedeng mag-convert kapag mas gusto ng grupo mong mag-settle nang isang beses. Gumagana ito sa 140 pera, at bagay na bagay ito sa mga [group trip](page:use-case/group-trips).
cta:
  heading: Dalhin ang euro mo, dalhin ang yen mo
  body: Gumawa ng account, magsimula ng grupo, at idagdag ang unang gastos sa anumang perang nasa kamay mo.
problem:
  heading: Ilagay ito ayon sa pagkabayad mo
  body: Bihirang iisang pera lang ang ginagamit sa isang biyahe. Na-book ang hotel sa pounds mula sa bahay, yen ang bayad sa hapunan, at kung anong pera ng layover ang ginamit sa kape sa airport. Ang pag-convert ng lahat nang mano-mano bago pa man ito mai-type ang dahilan kung bakit naiiwan ang mga spreadsheet. Sa Side Badger, inilalagay mo ang bawat gastos sa perang nasa resibo, at sinusunod ng bawat halaga ang mga patakaran ng perang iyon, kaya walang decimal ang yen at tatlo ang sa dinar. Nasa unahan ng listahan ang mga perang kamakailan mong ginamit.
workflow:
  heading: Panatilihing magkahiwalay ang mga pera, o mag-convert habang tumatakbo
  steps:
    - title: Idagdag ang gastos sa sarili nitong pera
      body: Piliin ang pera, i-type ang halaga, sabihin kung sino ang nagbayad at sino ang nagsalo. Wala nang ibang kailangan. Ito ang default, at pinananatili nito ang orihinal na halaga nang eksakto sa inilagay mo.
      shot: S07
      shotAlt: Ang expense form na may halagang yen
    - title: Bantayan ang balanse ng bawat pera
      body: Magkakahiwalay na iniingatan ang mga balanse sa bawat pera, at may sarili itong maikling listahan ng mga iminungkahing bayad. Sa pounds nagse-settle ang pounds at sa yen ang yen.
      shot: S10
      shotAlt: Ang screen ng mga balanse na may pinasimpleng mga utang sa dalawang pera
    - title: O mag-convert, kapag mas gusto ng grupo na mag-settle nang isang beses
      body: Pumili ng ibang pera habang inilalagay ang gastos at puwede itong i-convert ng Side Badger sa kasalukuyang exchange rate, na mababago mo sa rate na aktuwal mong nakuha. Sumasama sa balanse sa perang iyon ang na-convert na halaga. Desisyon ng grupo ang conversion, hindi isang bagay na nangyayari nang hindi mo alam.
options:
  heading: Rate na nakikita at mababago mo
  items:
    - title: Ipinapakita ang rate
      body: Kapag nag-convert ka, lumalabas sa form ang rate at ang na-convert na halaga, kaya walang kailangang basta maniwala sa numero.
    - title: I-type ang sarili mo
      body: May mas magandang rate ka sa cash desk, o mas pangit sa airport? Baguhin ang rate sa aktuwal mong nakuha at mag-a-update ang na-convert na halaga.
    - title: Nananatili ang orihinal
      body: Nananatili ang orihinal na halaga sa gastos, katabi ng na-convert, para sa sinumang magtatanong kung magkano iyon sa yen.
    - title: Libreng mag-convert
      body: Walang bayad ang pag-convert. Walang singil sa paglalagay ng gastos sa ibang pera.
