faq:
  heading: "Question dem"
  items:
    - q: "Wetin if somebody get bigger room but e no get plenty light?"
      a: "Floor area na just where to start, so di group fit agree to adjust. Take one point or two from di dark room, give dem to di others and check say di percentages still total 100. Side Badger go store whatever una agree and e no dey judge am."
    - q: "Di bills sef, we suppose share dem by room size?"
      a: "Usually no. Everybody dey use energy and broadband, so equal-equal split simpler, as for di example above. If one housemate dey house all day, di group fit agree something else, like exact amounts. [Share expenses](page:feature/split-expenses) cover di options."
    - q: "We fit change di split later?"
      a: "Yes, for new expenses. Change di percentages when you copy di rent and earlier months go stay as dem be. To correct past expense, edit am if di group permissions allow, and tell di house first, because di balances go change. Di earlier version dey kept."
