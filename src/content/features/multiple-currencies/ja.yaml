sections:
  - heading: グループ全体で1つの通貨に
    body: 通貨のことを考えたくないグループは、グループの通貨を1つ選ぶと、フォームが新しい支出を自動でその通貨に換算します。レートは引き続き確認も変更もできます。これが適用されるのは新規とコピーした支出のみで、編集や既存の支出はそのままなので、記録済みのものが知らないうちに変わることはありません。
  - heading: ユーロを借りて、ポンドで支払う
    body: 円で支払い、ポンドで精算したい？大丈夫です。支払いを記録するときに換算もできるので、ユーロを借りている人がポンドで支払っても、ユーロの残高はきちんと合います。支払いは好きな方法で行い、そのあと記録してください。
  - heading: グループのルール
    body: グループで実際に使っている通貨に絞り、フォームが正しい通貨で開くように初期設定を決めましょう。ポルトガルでの休暇に、夕食代の隣に他の139通貨の選択肢は要りませんし、[海外での結婚式](page:use-case/events-and-celebrations)でもおそらく2通貨あれば十分です。
limits:
  heading: 制限
  items:
    - レートは支出を保存した時点で固定されます。過去の支出が再評価されることはありません。
    - Side Badgerは可能な場合に現在のレートを取得します。すべての通貨の組み合わせで取得できる保証はなく、レートは常に自分で入力できます。
    - グループの自動換算が適用されるのは新規とコピーした支出のみで、編集や既存の支出には適用されません。
    - 各支出は、その通貨で999,999.99が上限です。
    - 通貨は140種類です。暗号資産や貴金属は含まれません。
    - Side Badgerは支払いを記録します。お金を動かしたり、両替したりすることはありません。
useCasesHeading: 役立つ場面
faq:
  heading: よくある質問
  items:
    - q: どの為替レートを使いますか？
      a: 支出を入力したときに取得できる場合は、現在の為替レートです。実際に適用されたレートに変更でき、換算後の金額も更新されます。
    - q: 過去の支出は再評価されますか？
      a: いいえ。レートは支出を保存した時点で固定されるので、相場が動いても残高がずれることはありません。
    - q: 暗号資産には対応していますか？
      a: いいえ。通貨は140種類で、暗号資産は含まれません。
    - q: 2,000,000ルピアを入力できないのはなぜですか？
      a: 各支出は、その通貨で999,999.99が上限です。別の通貨で入力して換算するか、2つの支出に分けてください。
    - q: 換算に費用はかかりますか？
      a: いいえ。Side Badgerの他の機能と同じく、換算は無料です。[料金](page:pricing)をご覧ください。
    - q: 必ず換算しなければなりませんか？
      a: いいえ。ご自身かグループが換算を選ばない限り、通貨は別々のままで、それぞれの通貨に短い支払いリストが用意されます。
