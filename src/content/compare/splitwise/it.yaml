sections:
  - heading: "Parlare di soldi, accanto ai soldi"
    body: "I soldi in comune portano chiacchiere, dubbi e piani. Side Badger li tiene tutti e tre accanto ai numeri, così nessuno deve scorrere all'indietro la chat di gruppo."
    items:
      - "**Commenti dove servono.** Commenta il gruppo stesso, o qualsiasi spesa, lista o sondaggio, e tieni la conversazione accanto a ciò di cui parla."
      - "**Scontrini e foto.** Tieni fino a tre scontrini per ogni spesa e aggiungi foto o PDF ai commenti sul gruppo, su una lista o su un sondaggio."
      - "**Domande, non litigi.** Un amministratore può attivare le domande, e poi chiunque in una spesa può chiedere (\"Ho una domanda\"). Resta fuori dai saldi finché non è chiarita."
      - "**Liste e sondaggi.** Tieni la lista della spesa accanto agli scontrini della spesa, e metti ai voti la selezione di ville, anche in forma anonima se vuoi."
      - "**Un po' di applausi.** Reagisci a spese, pagamenti e commenti, e festeggia un pagamento quando arriva."
  - heading: Il tuo gruppo, le tue regole
    body: "Il centro assistenza di Splitwise dice che non supporta amministratori di gruppo né permessi speciali. Side Badger ha ruoli e permessi, per i gruppi che hanno bisogno di qualcuno che tenga in ordine i conti."
    items:
      - "**Amministratori, membri e visitatori.** Fai di qualcuno un visitatore: vede tutto e non cambia niente."
      - "**Due preset, o i tuoi.** Parti da Collaborazione aperta o Gruppo gestito, oppure imposta tu ogni permesso: chi modifica ed elimina le spese, modifica le liste, invita e fa entrare nuove persone."
      - "**Approvazione per entrare.** Attiva l'approvazione e un amministratore fa entrare ogni persona."
      - "**Le impostazioni del gruppo.** Limitalo alle valute che usate davvero, scegli la sua valuta predefinita e dagli un'immagine dell'intestazione."
      - "**Bloccalo quando è finita.** I conti restano fermi finché un amministratore non lo sblocca."
  - heading: Gratis qui, a pagamento là
    body: Splitwise Pro è il piano a pagamento di Splitwise, e la sua pagina Pro vende tre cose che in Side Badger non costano nulla.
    items:
      - "**Scansione degli scontrini.** Splitwise Pro scansiona la foto del tuo scontrino. Side Badger lo fa gratis, senza crediti di scansione: compila totale, data e luogo perché tu li controlli."
      - "**Conversione di valuta.** Splitwise Pro converte le spese di un gruppo nella tua valuta predefinita quando tocchi Converti. Side Badger converte ogni spesa mentre la inserisci, a un tasso di cambio attuale o a quello che hai davvero ottenuto, e l'importo originale resta sulla spesa."
      - "**Nessun limite giornaliero.** Splitwise Pro vende spese illimitate, e il suo centro assistenza dice che gli utenti gratuiti possono aggiungere fino a 4 spese al giorno. Side Badger non ha limiti giornalieri."
  - heading: La tua banca ne resta fuori
    body: "Side Badger non si collega alla tua banca e non ti chiede i dati bancari. Tiene il registro di chi deve cosa a chi; vi pagate come preferite, poi registrate il pagamento. Nessun accesso alla banca da cedere, quindi una cosa in meno da proteggere."
  - heading: Un'app sola, nel browser e sul telefono
    body: "Side Badger funziona nel browser. Accedi, aggiungilo alla schermata Home e si apre come un'app. È la stessa app in entrambi i casi, quindi una novità è sul telefono alla prossima apertura, senza aspettare l'aggiornamento dello store."
  - heading: "E qualche asso nella manica"
    items:
      - "**Chiedi al tuo assistente.** Side Badger funziona con ChatGPT e Claude: chiedi al tuo di aggiungere una spesa, scansionare uno scontrino o registrare un pagamento."
      - "**Ognuno nella sua lingua.** Side Badger parla 39 lingue e ognuno sceglie la propria. La pagina iniziale di Splitwise dice 7+. Gestisce anche 133 valute, per il viaggio che va dappertutto."
      - "**Aiuto senza uscire dall'app.** Bloccato, o hai trovato un bug? Scrivici dall'app e leggi lì la nostra risposta."
  - heading: Dove Splitwise vince ancora
    body: Preferiamo che tu scelga l'app giusta piuttosto che lo scopra dopo. Se al tuo gruppo serve una di queste cose, Splitwise ce l'ha e Side Badger no.
    items:
      - "**App da store.** Side Badger vive nel browser e nella schermata Home, non negli store."
      - "**Modalità offline.** Side Badger ha bisogno di una connessione."
      - "**Pagamenti nell'app.** In alcuni paesi Splitwise può anche muovere i soldi. Side Badger tiene solo il registro."
      - "**Dividere per quote o per voce.** Side Badger ha un solo pagatore per spesa, divisa in parti uguali, per importi esatti o per percentuale. La sua scansione degli scontrini non assegna le voci alle persone."
      - "**Grafici e divisioni predefinite.** Splitwise Pro ha entrambi. Side Badger tiene il conto di chi deve cosa a chi, e il trucco è tutto lì."
  - heading: Portare qui il tuo gruppo
    body: Non esiste uno strumento di importazione, quindi spostarsi significa ricominciare da zero. Prima salda i conti in Splitwise, poi crea un gruppo in Side Badger e invita tutti con un link o un codice QR. Ognuno nel gruppo ha bisogno di un account gratuito, e per registrarsi basta un indirizzo email.
table:
  heading: Uno accanto all'altro
  caption: Dettagli di Splitwise al {date}, dalle pagine di Splitwise.
  sourceLabel: Fonte
  columns:
    feature: Cosa
    other: Splitwise, secondo le sue pagine
    sideBadger: Side Badger
  rows:
    - feature: Quanto costa
      other: Splitwise Pro è un abbonamento mensile o annuale. I piani annuali includono un Trip Pass, che dà a un gruppo di viaggio le funzioni Pro per 30 giorni.
      sideBadger: "Gratis."
      source: pro-help
    - feature: Spese al giorno
      other: Il suo centro assistenza dice che gli utenti gratuiti possono aggiungere fino a 4 spese al giorno. Pro non ha limite giornaliero.
      sideBadger: Nessun limite giornaliero.
      source: pro-help
    - feature: Ruoli e permessi del gruppo
      other: Il suo centro assistenza dice che non supporta amministratori di gruppo né permessi speciali.
      sideBadger: Amministratori, membri e visitatori. Due preset o permessi tuoi, approvazione per entrare e un blocco per quando è finita.
      source: permissions-help
    - feature: Scansione degli scontrini
      other: Una funzione Pro. Scansiona la foto di uno scontrino, e la suddivisione per voci di Pro permette di assegnare le voci alle persone.
      sideBadger: Gratis, senza crediti di scansione. Compila totale, data e luogo perché tu li controlli, e non assegna le voci alle persone.
      source: pro
    - feature: Conversione di valuta
      other: Una funzione Pro. Tocchi Converti e Splitwise converte le spese di un gruppo nella tua valuta predefinita al tasso di cambio di quel momento.
      sideBadger: Gratis. Converti ogni spesa mentre la inserisci, a un tasso di cambio attuale o a quello che hai davvero ottenuto. L'importo originale resta sulla spesa.
      source: currencies-help
    - feature: Valute e lingue
      other: 100+ valute e 7+ lingue, come dice la sua pagina iniziale.
      sideBadger: 133 valute e 39 lingue. Ognuno nel gruppo può scegliere la propria lingua.
      source: home
    - feature: Dove lo usi
      other: App per iPhone e Android, e il web.
      sideBadger: "Nel browser. Accedi, poi aggiungilo alla schermata Home e si apre come un'app. Non è negli store."
      source: home
    - feature: Modi di dividere
      other: In parti uguali, per importi esatti, per percentuale, per quote, per aggiustamento o per voce.
      sideBadger: In parti uguali, per importi esatti o per percentuale, con un solo pagatore per spesa. Non per quote né per voce.
      source: split-help
    - feature: Uso offline
      other: Elenca una modalità offline tra le sue funzioni principali.
      sideBadger: No. Serve una connessione.
      source: home
    - feature: Pagamenti e la tua banca
      other: "In alcuni paesi può inviare denaro dall'interno dell'app: Splitwise Pay negli Stati Uniti, Venmo per i saldi in dollari statunitensi, PayPal, e Pay by Bank in determinati paesi europei, che collega un conto corrente personale."
      sideBadger: "Non tocca mai i tuoi soldi e non ti chiede i dati bancari. Pagatevi come vi fa più comodo, poi registrate il pagamento."
      source: payments-help
    - feature: Grafici e divisioni predefinite
      other: Entrambi sono funzioni Pro.
      sideBadger: Nessuno dei due.
      source: pro
faq:
  heading: Domande
  items:
    - q: Side Badger è un'alternativa gratuita a Splitwise?
      a: "Per dividere le spese in un gruppo, sì, e fa più dei conti: commenti, domande, liste, sondaggi e ruoli di gruppo, con scansione degli scontrini e conversione delle valute gratuite. Se ti servono un'app da store, l'uso offline o i pagamenti dentro l'app, Splitwise li ha e Side Badger no."
    - q: Da dove vengono i dettagli su Splitwise?
      a: "Dalle pagine di Splitwise: la sua pagina iniziale, la pagina Pro e il centro assistenza. Ogni riga della tabella rimanda alla pagina da cui viene, e la data sopra la tabella dice quando le abbiamo lette. Le ricontrolliamo ogni trimestre."
    - q: Side Badger resterà gratuito?
      a: Tutto in Side Badger è gratuito oggi. Se la cosa dovesse cambiare, ti avviseremo prima. La [pagina dei prezzi](page:pricing) ha i dettagli.
    - q: Tutti nel mio gruppo devono passare a Side Badger?
      a: Sì. Ognuno in un gruppo ha bisogno di un account Side Badger gratuito, e può unirsi con un link o un codice QR.
    - q: Side Badger ha un'app per il telefono?
      a: "Non in uno store. Funziona nel browser: accedi dal telefono, poi aggiungilo alla schermata Home così si apre come un'app. [Come funziona](page:how-it-works) mostra come."
