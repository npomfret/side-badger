featuresHeading: "Bir evin kullandığı özellikler"
faq:
  heading: "Sorular"
  items:
    - q: "Kira otomatik olarak tekrarlanabilir mi?"
      a: "Hayır, yinelenen fatura yok. Geçen ayın kirasını birkaç dokunuşla kopyalayın, tarihi değiştirin, bitti."
    - q: "Oda büyüklüğüne göre bölüşebilir miyiz?"
      a: "Evet, yüzdelerle. Her ev arkadaşına odasını yansıtan bir pay verin; paylar toplamda 100 etsin. Diğer bölüşüm yolları için [harcamaları bölüşme](page:feature/split-expenses) sayfasına bakın."
    - q: "Bir ev arkadaşı borçluyken taşınırsa ne olur?"
      a: "Ödeşene kadar gruptan ayrılamaz, çünkü kimse borçluyken veya alacaklıyken ayrılamaz. Herkes başabaş olana kadar rakamlar dürüst kalır."
    - q: "Side Badger faturaları öder mi?"
      a: "Hayır. Hesabı tutar ve kısa bir ödeme listesi önerir. [Hesaplaşma](page:feature/settle-up) sayfasında açıklandığı gibi, birbirinize istediğiniz yolla ödersiniz, sonra kaydedersiniz."
    - q: "Bir ev arkadaşı defterleri tutabilir mi?"
      a: "Evet. Onu yönetici yapın ve yeni üyelerin onay gerektirdiği, harcamaları yalnızca oluşturanların ve yöneticilerin değiştirebildiği yönetilen bir grup kullanın."
