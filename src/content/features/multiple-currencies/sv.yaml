sections:
  - heading: En valuta för hela gruppen
    body: Om gruppen hellre slipper tänka på det väljer du en gruppvaluta, så räknar formuläret om varje ny utgift till den, med en kurs som du fortfarande kan se och ändra. Det gäller bara nya och kopierade utgifter. Redigeringar och befintliga utgifter lämnas som de är, så inget som redan är registrerat ändras under fötterna på dig.
  - heading: Skyldig euro, betala i pund
    body: Betalat i yen, men gör upp i pund? Inga problem. När du registrerar en betalning kan du räkna om även den, så att den som är skyldig euro kan betala i pund och eurosaldot ändå blir rätt. Betala varandra hur ni vill och registrera det sedan.
  - heading: Regler för gruppen
    body: Begränsa en grupp till de valutor ni faktiskt använder och ställ in en standard så att formuläret öppnas på rätt valuta. En semester i Portugal behöver inte 139 andra alternativ bredvid middagsnotan, och ett [bröllop utomlands](page:use-case/events-and-celebrations) behöver förmodligen två.
limits:
  heading: Gränser
  items:
    - Kursen fastställs när utgiften sparas. Gamla utgifter omvärderas aldrig.
    - Side Badger hämtar en aktuell kurs där det går. Alla valutapar är inte garanterade en, och du kan alltid skriva in kursen själv.
    - Gruppens automatiska omräkning gäller bara nya och kopierade utgifter, inte redigeringar eller befintliga utgifter.
    - Varje utgift är begränsad till 999 999,99 i sin egen valuta.
    - Det finns 140 valutor. Kryptovalutor och metaller ingår inte.
    - Side Badger registrerar betalningar. Det flyttar eller växlar aldrig pengar.
useCasesHeading: Där det här hjälper
faq:
  heading: Frågor
  items:
    - q: Vilken växelkurs använder ni?
      a: En aktuell växelkurs, hämtad när du lägger in utgiften där en finns tillgänglig. Du kan ändra den till den kurs du faktiskt fick, så uppdateras det omräknade beloppet.
    - q: Omvärderas gamla utgifter?
      a: Nej. Kursen fastställs när utgiften sparas, så ett saldo driver inte iväg för att marknaden gjorde det.
    - q: Stöder ni krypto?
      a: Nej. Det finns 140 valutor, och kryptovalutor ingår inte.
    - q: Varför kan jag inte skriva in 2 000 000 rupiah?
      a: Varje utgift är begränsad till 999 999,99 i sin egen valuta. Lägg in den i en annan valuta och räkna om, eller dela upp den i två utgifter.
    - q: Kostar omräkning något?
      a: Nej. Omräkning är gratis, precis som resten av Side Badger. Se [prissättning](page:pricing).
    - q: Måste jag räkna om?
      a: Nej. Valutorna förblir separata om inte du eller din grupp väljer att räkna om, och varje valuta får sin egen korta lista med betalningar.
