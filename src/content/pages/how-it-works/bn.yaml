meta:
  title: "Side Badger কীভাবে কাজ করে | পাঁচ ধাপে গ্রুপের খরচ ভাগ করুন"
  description: "গ্রুপ খুলুন, মানুষজনকে ডাকুন, খরচ যোগ করুন আর হিসাব মেটান। একটি পুরো উদাহরণ দিয়ে দেখুন “কেউ দিয়েছে” থেকে “হিসাব সমান” পর্যন্ত কী ঘটে।"
h1: "Side Badger কীভাবে কাজ করে"
navLabel: "কীভাবে কাজ করে"
lead: "“কেউ দিয়েছে” আর “হিসাব সমান” এর মাঝখানে কী ঘটে? পাঁচটি ধাপ, কোনো স্প্রেডশিট নয়, আর একটি ব্যাজার যে বেশিরভাগ সময় শুধু শোভা বাড়ায়। এই হলো পুরো যাত্রা, প্রথম গ্রুপ থেকে শেষ রেকর্ড করা পেমেন্ট পর্যন্ত। যেকোনো ধাপের খুঁটিনাটির জন্য দেখুন [খরচ ভাগ করা](page:feature/split-expenses) আর [হিসাব মেটানো](page:feature/settle-up)।"
cta:
  heading: "“এটা আমি দিয়ে দিচ্ছি” থেকে “হিসাব সমান” পর্যন্ত"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম খরচটা যোগ করুন। ব্যাজার আপনার রসিদ নিয়ে কোনো মন্তব্য করবে না।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
steps:
  - title: "গ্রুপ তৈরি করুন"
    body: "প্রতিটি বাড়ি, ট্রিপ বা অনুষ্ঠানের জন্য আলাদা গ্রুপ খুলুন, যাতে বাড়ি ভাড়া কখনও বিয়ের উপহারের তালিকায় না মেশে। একটা নাম দিন, মানুষজন আপনাকে যে নামে দেখবে সেটা বেছে নিন, আর চাইলে কোন মুদ্রা চলবে সেটা সীমিত করুন। এরপর আপনার ড্যাশবোর্ডে একটাই স্ক্রিনে সব গ্রুপ দেখা যায়, আর প্রতিটিতে আপনার অবস্থানও।"
    shot: S02
    shotAlt: "গ্রুপ তৈরির ডায়ালগ, মুদ্রার সীমা বিভাগটি খোলা"
  - title: "আপনার মানুষজনকে ডাকুন"
    body: "একটি যোগদানের লিঙ্ক শেয়ার করুন বা QR কোড দেখান, আর ঠিক করুন সেটা কতক্ষণ চলবে, 15 মিনিট থেকে 5 দিন পর্যন্ত। যে-ই যোগ দেবে তার একটি বিনামূল্যের অ্যাকাউন্ট আর যাচাই করা ইমেইল লাগবে, আর একটি গ্রুপে 50 জন পর্যন্ত থাকতে পারে। কে ঢুকছে তা নিজে যাচাই করতে চাইলে অনুমোদন চালু করুন, তখন অ্যাডমিন প্রত্যেককে ঢুকতে দেবেন।"
    shot: S03
    shotAlt: "আমন্ত্রণ ডায়ালগের লিঙ্ক ট্যাব, QR কোড আর মেয়াদের বিকল্পসহ"
  - title: "খরচ হওয়ামাত্র যোগ করুন"
    body: "বলুন কে দিয়েছে, কত দিয়েছে, আর কার জন্য। সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করুন, আর যে এতে ছিল না তাকে বাদ দিন। খরচ যোগ করলেই সবাই সঙ্গে সঙ্গে দেখতে পায়, সঙ্গে কী বদলেছে আর কে বদলেছে সেটাও।"
    shot: S05
    shotAlt: "খরচের ফর্ম, শতাংশে ভাগ করা, ঘরের আকার অনুযায়ী ভাড়া ভাগ হচ্ছে"
  - title: "ব্যালেন্সের দিকে নজর রাখুন"
    body: "Side Badger প্রতিটি মুদ্রার জন্য চলমান ব্যালেন্স রাখে, তাই এক নজরে দেখা যায় কে কার কাছে ঋণী। ছোট ছোট দেনার জট সবাইকে নিজেদেরই ছাড়াতে না দিয়ে, এটি পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে যাতে গ্রুপের হিসাব মিটে যায়।"
    shot: S10
    shotAlt: "ব্যালেন্সের স্ক্রিন, দুটি মুদ্রায় সহজ করা দেনা, সবাইকে দেখান চালু"
  - title: "অ্যাপের বাইরে হিসাব মেটান, ভেতরে রেকর্ড করুন"
    body: "Side Badger কখনও টাকা নাড়াচাড়া করে না। যেভাবে খুশি একে অপরকে দিন, তারপর পেমেন্ট রেকর্ড করুন যাতে ব্যালেন্স হালনাগাদ হয়, আর রিফ্রেশ ছাড়াই সবার স্ক্রিন বদলে যায়। “সেটল” মানে শুধু ব্যালেন্স শূন্য দেখানো। যতক্ষণ কারও দেওয়ার বা পাওয়ার বাকি আছে, সে গ্রুপ ছাড়তে পারে না, তাই বেরিয়ে যেতে চাইলে আগে হিসাব মেটাতে হয়।"
    shot: S11
    shotAlt: "পেমেন্টের ফর্ম, দ্রুত-সেটল বোতাম আর আংশিক পেমেন্টের নোটিসসহ"
requirements:
  heading: "আপনার কী লাগবে"
  items:
    - "একটি বিনামূল্যের অ্যাকাউন্ট। লাগবে শুধু একটি ইমেইল ঠিকানা আর পাসওয়ার্ড, আর কিছু যোগ করার আগে ইমেইলটি যাচাই করতে হয়।"
    - "বয়স 18 বা তার বেশি।"
    - "ফোনে বা কম্পিউটারে একটি আধুনিক ব্রাউজার, আর ইন্টারনেট সংযোগ। Side Badger অ্যাপ-স্টোরের অ্যাপ নয়, আর অফলাইনে কাজ করে না।"
    - "চাইলে হোম স্ক্রিনে একটি জায়গা। অ্যাপ স্টোরের দরকার নেই, কারণ Side Badger আপনার হোম স্ক্রিনে বা ডকে যোগ করা যায় আর এটি অ্যাপের মতো খোলে।"
