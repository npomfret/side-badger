faq:
  heading: "Sorular"
  items:
    - q: "Brüt mü net maaşı mı kullanmalıyız?"
      a: "Buna grup karar verir. Net maaş yaygındır, çünkü gerçekten harcayabileceğiniz paradır. Brüt maaş, verginin, emeklilik kesintilerinin ve kredi ödemelerinin farklı maaşlardan farklı miktarlar aldığı gerçeğini yok sayar. Hangisini seçerseniz seçin, ikiniz için aynı ölçüyü kullanın."
    - q: "Side Badger gelirlerimizi görüyor mu?"
      a: "Hayır. Yalnızca yüzdeleri girersiniz, maaşları asla. Yüzdeleri grubun üyeleri görebilir; bir çift için bu, ikinizsiniz."
    - q: "62/38'i her şey için bir kez belirleyebilir miyiz?"
      a: "Bölüşüm grup başına değil, harcama başına belirlenir. Zaten 62 ve 38 olan bir harcamayı kopyalayın, sonra farklı olanı değiştirin. Diğer seçenekler [harcamaları bölüşme](page:feature/split-expenses) sayfasında."
