sections:
  - heading: "Naudas runas blakus naudai"
    body: "Kopīgai naudai līdzi nāk pļāpas, šaubas un plāni. Side Badger tur visus trīs blakus skaitļiem, lai nevienam nav jāritina čats atpakaļ."
    items:
      - "**Komentāri tur, kur tiem jābūt.** Komentējiet pašu grupu vai jebkuru izdevumu, sarakstu vai aptauju un turiet sarunu blakus tam, par ko tā ir."
      - "**Čeki un foto.** Katram izdevumam var glabāt līdz trim čekiem, bet grupas, saraksta vai aptaujas komentāriem pievienot fotogrāfijas vai PDF."
      - "**Jautājumi, nevis strīdi.** Administrators var ieslēgt jautājumus, un tad ikviens izdevumā var par to pavaicāt. Tas paliek ārpus atlikumiem, kamēr nav atrisināts."
      - "**Saraksti un aptaujas.** Turiet kopīgo iepirkumu sarakstu blakus iepirkumu rēķiniem un nobalsojiet par villas īso sarakstu, ja vēlaties, anonīmi."
      - "**Nedaudz aplausu.** Reaģējiet uz izdevumiem, maksājumiem un komentāriem un nosvinējiet maksājumu, kad tas ienāk."
  - heading: "Jūsu grupa, jūsu noteikumi"
    body: "Splitwise palīdzības centrs saka, ka tas neatbalsta grupu administratorus vai īpašas atļaujas. Side Badger ir lomas un atļaujas, grupām, kurām vajag kādu, kas uztur skaitļus kārtībā."
    items:
      - "**Administratori, biedri un skatītāji.** Padariet kādu par skatītāju: viņam ir redzams viss, bet mainīt nevar neko."
      - "**Divi gatavi komplekti vai jūsu pašu iestatījumi.** Sāciet ar Atvērtu sadarbību vai Pārvaldītu grupu, vai iestatiet katru atļauju paši: kurš labo un dzēš izdevumus, labo sarakstus, uzaicina un ielaiž jaunus cilvēkus."
      - "**Apstiprinājums pievienošanās brīdī.** Ieslēdziet apstiprināšanu, un administrators ielaiž katru cilvēku."
      - "**Grupas pašas iestatījumi.** Ierobežojiet to ar valūtām, ko patiešām lietojat, izvēlieties tās noklusējuma valūtu un pievienojiet galvenes attēlu."
      - "**Bloķējiet, kad viss beidzies.** Skaitļi paliek mierā, kamēr administrators grupu atbloķē."
  - heading: "Šeit bez maksas, tur par maksu"
    body: "Splitwise Pro ir Splitwise maksas plāns, un tā paša Pro lapa par maksu piedāvā trīs lietas, kas Side Badger ir bez maksas."
    items:
      - "**Čeku skenēšana.** Splitwise Pro skenē jūsu čeka fotogrāfiju. Side Badger to dara bez maksas un bez skenēšanas kredītiem: tas aizpilda kopsummu, datumu un vietu, lai jūs tos pārbaudītu."
      - "**Valūtu konvertēšana.** Splitwise Pro konvertē grupas izdevumus uz jūsu noklusējuma valūtu, kad pieskaraties pogai „Konvertēt”. Side Badger konvertē katru izdevumu, kad to ievadāt, pēc pašreizējā valūtas kursa vai kursa, ko patiešām saņēmāt, un sākotnējā summa paliek pie izdevuma."
      - "**Bez dienas limita.** Splitwise Pro piedāvā neierobežotu izdevumu skaitu, un tā palīdzības centrs saka, ka bezmaksas lietotāji dienā var pievienot līdz 4 izdevumiem. Side Badger dienas limita nav."
  - heading: "Jūsu banka paliek malā"
    body: "Side Badger nesavienojas ar jūsu banku un neprasa jūsu bankas datus. Tas glabā uzskaiti, kurš kam ir parādā; jūs maksājat viens otram, kā vēlaties, un tad reģistrējat maksājumu. Nav bankas pieteikšanās datu, ko nodot, tāpēc vienas raizes mazāk."
  - heading: "Viena lietotne gan pārlūkprogrammā, gan tālrunī"
    body: "Side Badger darbojas jūsu pārlūkprogrammā. Pierakstieties, pievienojiet to sākuma ekrānam, un tas atveras kā lietotne. Abos gadījumos tā ir viena un tā pati lietotne, tāpēc jauna funkcija jūsu tālrunī parādās nākamreiz, kad to atverat, un nav jāgaida lietotņu veikala atjauninājums."
  - heading: "Un pāris ballītes triki"
    items:
      - "**Pavaicājiet savam asistentam.** Side Badger darbojas ar ChatGPT un Claude: palūdziet savam pievienot izdevumu, noskenēt čeku vai reģistrēt maksājumu."
      - "**Katrs savā valodā.** Side Badger runā 39 valodās, un katrs izvēlas savējo. Splitwise sākumlapā minētas 7+. Tas darbojas arī ar 133 valūtām, lai der ceļojumam, kas iet visur."
      - "**Palīdzība, neizejot no lietotnes.** Iestrēdzāt vai atradāt kļūdu? Pastāstiet mums no lietotnes un tur pat izlasiet mūsu atbildi."
  - heading: "Kur Splitwise joprojām uzvar"
    body: "Mēs labāk gribētu, lai jūs izvēlētos īsto lietotni, nekā vēlāk uzzinātu. Ja jūsu grupai vajadzīgs kaut kas no šī, Splitwise tas ir, bet Side Badger nav."
    items:
      - "**Lietotnes no lietotņu veikala.** Side Badger dzīvo jūsu pārlūkprogrammā un sākuma ekrānā, nevis lietotņu veikalos."
      - "**Bezsaistes režīms.** Side Badger vajadzīgs savienojums."
      - "**Maksājumi lietotnē.** Dažās valstīs Splitwise var arī pārskaitīt naudu. Side Badger tikai glabā uzskaiti."
      - "**Sadale pa daļām vai pa pozīcijām.** Side Badger katram izdevumam ir viens maksātājs, un to sadala vienādi, pēc precīzām summām vai procentuāli. Čeku skenēšana nepiešķir pozīcijas cilvēkiem."
      - "**Diagrammas un noklusējuma sadales.** Splitwise Pro ir abas. Side Badger uztur uzskaiti, kurš kam ir parādā, un tas arī ir viss triks."
  - heading: "Grupas pārcelšana"
    body: "Importēšanas rīka nav, tāpēc pārcelšanās nozīmē jaunu sākumu. Vispirms norēķinieties Splitwise, tad izveidojiet grupu Side Badger un uzaiciniet visus ar saiti vai QR kodu. Ikvienam grupā vajadzīgs bezmaksas konts, un reģistrācijai pietiek ar e-pasta adresi."
