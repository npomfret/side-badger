sections:
  - heading: "39 زبانیں، اور زیادہ لوگوں کے لیے بنایا گیا"
    body: "Side Badger کو 39 زبانوں میں استعمال کریں، جن میں دائیں سے بائیں لکھی جانے والی عربی، فارسی اور اردو شامل ہیں۔ گروپ کا ہر فرد اپنی زبان چن سکتا ہے، اس لیے گروپ کا صفحہ ایک شخص کے لیے عربی میں اور اگلے کے لیے انگریزی میں ہو سکتا ہے۔ اسے کی بورڈ اور اسکرین ریڈر استعمال کرنے والوں کو ذہن میں رکھ کر بھی بنایا گیا ہے، اور ارکان کے رنگ پیٹرن کے ساتھ آتے ہیں، تاکہ آپ کو سبز اور سرخ میں فرق نہ کرنا پڑے۔"
faq:
  heading: "سوالات"
  items:
    - q: "کیا ہر ایک کو اکاؤنٹ چاہیے؟"
      a: "جی ہاں، ایک مفت اکاؤنٹ۔ ہر شخص کچھ بھی شامل کرنے سے پہلے اپنی ای میل کی تصدیق کرتا ہے۔"
    - q: "کیا ایپ ہے؟"
      a: "یہ براؤزر میں چلتا ہے۔ سائن ان کریں، پھر اسے ہوم اسکرین یا ڈاک میں شامل کریں تاکہ یہ ایپ کی طرح کھلے۔ ایپ میں سیٹنگز آپ کو طریقہ دکھاتی ہیں۔ ایپ اسٹور کا ورژن نہیں ہے اور آف لائن موڈ بھی نہیں۔"
    - q: "کیا Side Badger رقم منتقل کرتا ہے؟"
      a: "نہیں۔ یہ حساب رکھتا ہے اور ادائیگیاں تجویز کرتا ہے، اور آپ جیسے چاہیں ایک دوسرے کو ادا کرتے ہیں۔ پھر آپ ادائیگی ریکارڈ کرتے ہیں۔ [حساب برابر کرنا](page:feature/settle-up) دیکھیں۔"
    - q: "کیا کوئی قرض کے ساتھ جا سکتا ہے؟"
      a: "نہیں۔ جب تک کسی کو دینا یا لینا ہو وہ گروپ نہیں چھوڑ سکتا، اس لیے وہ پہلے حساب برابر کرتا ہے۔"
    - q: "ایک گروپ میں کتنے لوگ شامل ہو سکتے ہیں؟"
      a: "ایک گروپ میں 50 افراد تک۔ انہیں لنک یا QR کوڈ سے مدعو کریں، اور اگر چاہتے ہیں کہ ایڈمن ہر شخص کو اندر آنے دے تو منظوری آن کریں۔"
    - q: "ایک سے زیادہ کرنسی والے سفروں کا کیا؟"
      a: "بیلنس ہر کرنسی کے لیے الگ رکھے جاتے ہیں۔ [متعدد کرنسیاں](page:feature/multiple-currencies) دیکھیں۔"
