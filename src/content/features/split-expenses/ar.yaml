meta:
  title: "قسّم المصروفات بالتساوي أو بمبالغ محددة أو بنسبة مئوية | Side Badger"
  description: "قسّم تكلفة مشتركة بالتساوي أو بمبالغ محددة أو بنسبة مئوية، واستبعد كل من لم يكن حاضراً. مجاني، بلا إعلانات وبلا حدود يومية."
h1: "قسّم المصروفات بالتساوي أو بمبالغ محددة أو بنسبة مئوية"
navLabel: "تقسيم المصروفات"
lead: "ليس كل شيء بالنصف. وSide Badger يتدبّر الأمر. حدّد من دفع، واختر من شارك في التكلفة، وقسّمها **بالتساوي أو بمبالغ محددة أو بنسبة مئوية**. أما الضغائن فتُباع بشكل منفصل."
cta:
  heading: "قسّم المصروف التالي كما ينبغي"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة، وأضف المصروف الذي كنت تنوي ترتيبه. لست متأكداً مما سيحدث بعد ذلك؟ انظر [كيف يعمل](page:how-it-works)، أو اطّلع على [ما تشمله الخدمة المجانية](page:pricing)."
  button: "أنشئ حساباً مجانياً"
problem:
  heading: "ليس كل شيء بالنصف"
  body: "الإيجار يتبع مساحة الغرفة. والهدية تتبع من وعد بماذا. والعشاء يتبع من بقي حتى الحلوى. تقسيم الفاتورة إلى نصفين ينفع إلى أن تأتي أول فاتورة لا تُقسَم هكذا، وعندها يفتح أحدهم جدول بيانات. يسجّل Side Badger من دفع ومن شارك في التكلفة وكيف تتوزع، فتخرج الأرصدة صحيحة دون أن يضطر أحد إلى القسمة الطويلة على الطاولة."
workflow:
  heading: "إضافة مصروف، من البداية إلى النهاية"
  steps:
    - title: "حدّد من دفع ولأي غرض"
      body: "أدخل المبلغ ووصفاً قصيراً واسم من دفع. يدفع شخص واحد لكل مصروف، وهذا يُبقي الحساب نزيهاً."
      shot: S05
      shotAlt: "نموذج المصروف مع إيجار كوخ مقسّم بنسبة مئوية بين ثلاثة أشخاص"
    - title: "اختر طريقة التقسيم"
      body: "اختر التقسيم بالتساوي أو بمبالغ محددة أو بنسب مئوية. يجب أن يكون مجموع النسب 100، وأن يكون مجموع المبالغ المحددة مساوياً للإجمالي."
      shot: S06
      shotAlt: "نموذج المصروف مع مبالغ محددة مدخلة لكل شخص في هدية"
    - title: "أضف القصة"
      body: "حدّد التاريخ، وأضف التصنيفات والمكان وملاحظة. يرى كل من في المجموعة التفاصيل نفسها، ويمكنه التعليق هناك مباشرة."
      shot: S08
      shotAlt: "مصروف بتفاصيله، وسلسلة تعليقات، والمبلغ الأصلي الذي أُدخل به"
    - title: "اطرح سؤالاً إن بدا شيء غير صحيح"
      body: "إذا فعّلت المجموعة أسئلة المصروفات، يمكن لأي شخص مشمول في مصروف أن يستفسر عنه، ويمكن لقائمة المصروفات أن تعرض المصروفات المطروحة للسؤال فقط."
      shot: S18
      shotAlt: "قائمة المصروفات مع شارة «مستفسر عنه» ومرشّح «المستفسر عنها فقط»"
options:
  heading: "ثلاث طرق للتقسيم"
  items:
    - title: "بالتساوي"
      body: "الخيار الافتراضي للعشاء وسيارات الأجرة وكل ما تقاسمه الجميع بالتساوي. وإذا لم ينقسم الإجمالي بدقة، يذهب الفلس الزائد إلى شخص واحد عشوائياً، لا إلى الشخص نفسه كل مرة. وفي سيارة الأجرة أدناه، هي آنا."
    - title: "بمبالغ محددة"
      body: "اكتب ما على كل شخص. مناسب للهدية التي اختار فيها كل واحد سعراً مختلفاً، أو للتسوق الذي حملت فيه عربة أحدهم أكثر من البقالة المشتركة. يجب أن يساوي مجموع المبالغ الإجمالي."
    - title: "بنسبة مئوية"
      body: "أعطِ كل شخص حصة من الإجمالي. وإيجار الغرف بحسب مساحتها هو المثال الكلاسيكي، فتدفع أكبر غرفة أكبر حصة ولا يتظاهر أحد بغير ذلك."
