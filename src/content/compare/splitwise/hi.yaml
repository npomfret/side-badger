    - feature: "ऑफलाइन इस्तेमाल"
      other: "ऑफलाइन मोड को अपने मुख्य फीचर में गिनाता है।"
      sideBadger: "नहीं। इसे कनेक्शन चाहिए।"
      source: home
    - feature: "पेमेंट और आपका बैंक"
      other: "कुछ जगहों पर यह ऐप के अंदर से पैसे भेज सकता है: अमेरिका में Splitwise Pay, अमेरिकी डॉलर के बैलेंस के लिए Venmo, PayPal, और चुनिंदा यूरोपीय देशों में Pay by Bank, जो एक निजी चालू खाते को जोड़ता है।"
      sideBadger: "आपके पैसों को कभी हाथ नहीं लगाता और आपसे बैंक की जानकारी नहीं मांगता। एक-दूसरे को जैसे चाहें पेमेंट करें, फिर पेमेंट रिकॉर्ड करें।"
      source: payments-help
    - feature: "चार्ट और डिफ़ॉल्ट बंटवारे"
      other: "दोनों Pro फीचर हैं।"
      sideBadger: "इनमें से कोई नहीं।"
      source: pro
faq:
  heading: "सवाल"
  items:
    - q: "क्या Side Badger, Splitwise का मुफ्त विकल्प है?"
      a: "ग्रुप में बिल बांटने के लिए, हाँ, और यह सिर्फ़ हिसाब से ज़्यादा करता है: टिप्पणियाँ, प्रश्न, सूचियाँ, पोल और ग्रुप की भूमिकाएं, साथ में मुफ्त रसीद स्कैन और करेंसी कन्वर्ज़न। अगर आपको ऐप-स्टोर वाला ऐप, ऑफलाइन इस्तेमाल या ऐप के अंदर पेमेंट चाहिए, तो Splitwise ये करता है और Side Badger नहीं।"
    - q: "Splitwise की जानकारी कहां से आती है?"
      a: "Splitwise के अपने पेजों से: उसका होम पेज, उसका Pro पेज और उसका हेल्प सेंटर। तालिका की हर पंक्ति उस पेज से जुड़ी है जहां से वह आई, और तालिका के ऊपर की तारीख बताती है कि हमने उन्हें कब पढ़ा। हम उन्हें हर तिमाही जांचते हैं।"
    - q: "क्या Side Badger मुफ्त रहेगा?"
      a: "Side Badger में आज सब कुछ मुफ्त है। अगर यह कभी बदला, तो हम पहले आपको सूचना देंगे। ब्योरा यहां है: [कीमत का पेज](page:pricing)।"
    - q: "क्या मेरे ग्रुप में सबको बदलना होगा?"
      a: "हाँ। ग्रुप में सबको एक मुफ्त Side Badger अकाउंट चाहिए, और वे लिंक या QR कोड से जुड़ सकते हैं।"
    - q: "क्या Side Badger का मोबाइल ऐप है?"
      a: "ऐप स्टोर में नहीं। यह आपके ब्राउज़र में चलता है: अपने फ़ोन पर साइन इन करें, फिर इसे अपनी होम स्क्रीन में जोड़ें ताकि यह ऐप की तरह खुले। कैसे, यह [यह कैसे काम करता है](page:how-it-works) में दिखाया गया है।"
