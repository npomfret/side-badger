featuresHeading: Funksjonene et hjem bruker
faq:
  heading: Spørsmål
  items:
    - q: Kan husleien gjentas automatisk?
      a: Nei, det finnes ingen gjentakende regninger. Kopier forrige måneds husleie med et par trykk, endre datoen, så er du ferdig.
    - q: Kan vi dele etter romstørrelse?
      a: Ja, etter prosent. Gi hver samboer en andel som gjenspeiler rommet deres, så lenge andelene summerer seg til 100. [Dele utgifter](page:feature/split-expenses) tar for seg de andre måtene å dele på.
    - q: Hva om en samboer flytter ut og skylder penger?
      a: De kan ikke forlate gruppen før de har gjort opp, fordi ingen kan forlate en gruppe mens de skylder eller har penger til gode. Tallene forblir ærlige til alle er kvitt.
    - q: Betaler Side Badger regningene?
      a: Nei. Den fører regnskapet og foreslår en kort liste over betalinger. Dere betaler hverandre slik dere vil, og registrerer det, slik [gjøre opp](page:feature/settle-up) forklarer.
    - q: Kan én samboer føre regnskapet?
      a: Ja. Gjør vedkommende til administrator og bruk en administrert gruppe, der nye medlemmer trenger godkjenning og bare opprettere og administratorer kan endre utgifter.
