meta:
  title: "کئی کرنسیوں میں ہوا سفر کیسے تقسیم کریں | Side Badger"
  description: "ہوٹل پاؤنڈ میں، رامین ین میں۔ ہر کرنسی الگ نمٹائیں یا ایسے ریٹ پر تبدیل کریں جو آپ دیکھ سکیں۔ دونوں طریقے مثال کے ساتھ، حساب دکھایا گیا۔"
h1: "کئی کرنسیوں میں ہوا سفر کیسے تقسیم کریں"
navLabel: "کئی کرنسیوں کے سفر"
lead: "ہر خرچہ اسی کرنسی میں درج کریں جس میں آپ نے ادا کیا، پھر راستہ چنیں۔ یا کرنسیاں الگ رکھیں اور ہر ایک کو اسی کے پیسوں میں نمٹائیں، یا موجودہ ایکسچینج ریٹ پر تبدیل کر کے ایک بار میں حساب برابر کریں۔ جاپان کے اسی سفر میں پہلے طریقے سے چار ادائیگیاں بنتی ہیں اور دوسرے سے دو۔"
cta:
  heading: جس پیسے میں ادا کیا اسی میں درج کریں
  body: "مفت اکاؤنٹ بنائیں، سفر کے لیے گروپ شروع کریں اور ہر خرچہ اسی کرنسی میں شامل کریں جو رسید پر لکھی تھی۔ پہلے تفصیل دیکھنی ہے؟ [متعدد کرنسیاں](page:feature/multiple-currencies) یا [مفت میں کیا کیا شامل ہے](page:pricing) دیکھیں۔"
sections:
  - heading: "تین دوست، ایک ہوٹل، بے شمار ین"
    body: "زوئی، کینجی اور لوسی [گروپ سفر](page:use-case/group-trips) پر جاپان میں ایک ہفتہ گزارتے ہیں، اور ہر خرچہ تینوں میں برابر بٹتا ہے۔ زوئی نے گھر سے ہوٹل پاؤنڈ میں بک کیا، £600 کا۔ لوسی نے ٹوکیو میں ریل پاس خریدے، ¥90,000 کے۔ کینجی نے رامین نائٹ کا بل دیا، ¥9,000، اور تب سے روز اس کا ذکر کرتا ہے۔ ریلوے پلیٹ فارم پر کھڑے ہو کر تین رسیدیں تبدیل کرنا کوئی نہیں چاہتا۔ یہاں کے حساب کے لیے ¥1 برابر £0.005 ہے، یہ اس گائیڈ کے لیے گھڑا ہوا ایک گول ریٹ ہے۔ ایپ میں آپ موجودہ ایکسچینج ریٹ استعمال کریں گے، یا وہ ریٹ لکھیں گے جو آپ کو واقعی ملا۔"
  - heading: "ہر خرچہ رسید والی کرنسی میں درج کریں"
    body: "یہ حصہ آپ جو بھی راستہ چنیں، ایک جیسا ہے۔ ابھی کچھ تبدیل کرنے کی ضرورت نہیں۔"
    items:
      - "**گروپ بنائیں۔** ڈیش بورڈ پر **گروپ بنائیں** چنیں، اسے سفر کا نام دیں، پھر **دوسروں کو مدعو کریں** چنیں اور لنک یا QR کوڈ بھیجیں۔"
      - "**ہوٹل شامل کریں۔** **خرچہ شامل کریں** چنیں اور 600 لکھیں، رقم کے ساتھ کرنسی پاؤنڈ رکھیں۔ **کس نے ادائیگی کی؟** کے نیچے زوئی کو چنیں۔ **کے درمیان تقسیم کریں** میں تینوں کو رہنے دیں، **کیسے تقسیم کریں** کو **برابر** پر رہنے دیں اور **خرچہ محفوظ کریں** چنیں۔"
      - "**ین والے شامل کریں۔** ریل پاس (لوسی نے ادا کیے) اور رامین (کینجی نے ادا کی) کے لیے بھی یہی کریں، کرنسی ین رکھ کر۔ ین میں اعشاریہ نہیں ہوتا، اس لیے فارم اس کے لیے جگہ نہیں مانگتا۔"
  - heading: "پہلا راستہ: کرنسیاں الگ رکھیں"
    body: "Side Badger ہر کرنسی کا الگ بیلنس رکھتا ہے اور ایک کو دوسری سے کاٹتا نہیں۔ پاؤنڈ میں ہوٹل ہر ایک کے حصے میں £200 آتا ہے، اس لیے کینجی اور لوسی دونوں پر زوئی کے £200 واجب ہیں۔ ین میں ریل پاس اور رامین کا کل ¥99,000 ہے، یعنی ہر ایک کے حصے میں ¥33,000۔ لوسی نے ¥90,000 دیے، اس لیے اسے ¥57,000 ملنے ہیں۔ زوئی نے کوئی ین نہیں دیا اور اس پر ¥33,000 واجب ہیں۔ کینجی نے ¥9,000 دیے، اس لیے اس پر ¥24,000 رہتے ہیں۔"
    items:
      - "**پاؤنڈ۔** کینجی زوئی کو £200 دیتا ہے اور لوسی زوئی کو £200 دیتی ہے۔"
      - "**ین۔** زوئی لوسی کو ¥33,000 دیتی ہے اور کینجی لوسی کو ¥24,000 دیتا ہے۔"
      - "**کل چار ادائیگیاں۔** زوئی اور لوسی ایک دوسرے کے مقروض ہیں دو کرنسیوں میں جو آپس میں کٹتی نہیں۔ کسی ریٹ کا دخل نہیں، اس لیے بحث کی گنجائش بھی نہیں۔"
      - "**ین دینے ہیں، ادائیگی پاؤنڈ میں۔** جس کے پاس ین نہ ہوں وہ پاؤنڈ میں بھی ادا کر سکتا ہے۔ ادائیگی ریکارڈ کرتے وقت **مختلف کرنسی؟** کھولیں، پاؤنڈ کے لیے **میں تبدیل کریں** چنیں اور ریٹ دیکھ لیں۔ اس گائیڈ کے ریٹ پر زوئی کے ¥33,000 برابر £165 ہیں، اور ین کا بیلنس پھر بھی درست نکلتا ہے۔"
      - "**ہر ادائیگی ریکارڈ کریں۔** جیسے چاہیں ایک دوسرے کو ادا کریں، پھر **تصفیہ کریں** چنیں اور **تصفیہ ریکارڈ کریں** استعمال کریں۔ [حساب برابر کرنے](page:feature/settle-up) کے بارے میں مزید وہاں ہے۔"
  - heading: "دوسرا راستہ: ساتھ ساتھ تبدیل کرتے جائیں"
    body: "اگر گروپ ہر ایک کے لیے ایک ہی عدد دیکھنا چاہے تو خرچہ درج کرتے وقت ہی تبدیل کر لیں۔"
    items:
      - "**فارم پر تبدیل کریں۔** **خرچہ شامل کریں** پر **میں تبدیل کریں** چنیں اور پاؤنڈ منتخب کریں۔ Side Badger ریٹ اور تبدیل شدہ رقم دکھاتا ہے، جس پر ≈ کا نشان ہوتا ہے۔ اگر آپ کو مختلف ریٹ ملا تو ریٹ بدل دیں۔ اصل ین کی رقم خرچے پر برقرار رہتی ہے۔"
      - "**پاؤنڈ پڑھیں۔** ¥1 = £0.005 پر ریل پاس £450 اور رامین £45 بنتے ہیں۔ £600 کے ہوٹل کے ساتھ کل £600 + £450 + £45 = £1,095 ہوا، یعنی £365 فی کس۔ زوئی نے £600 دیے، اس لیے اسے £235 ملنے ہیں۔ لوسی نے £450 دیے اور اسے £85 ملنے ہیں۔ کینجی نے £45 دیے اور اس پر £320 واجب ہیں۔"
      - "**دو ادائیگیاں۔** دونوں کینجی کی طرف سے: زوئی کو £235 اور لوسی کو £85۔ زوئی اور لوسی کو اب ایک دوسرے کو کچھ دینا ہی نہیں۔"
      - "**یا گروپ کی کرنسی طے کریں۔** یہ اضافی قدم چھوڑنے کے لیے گروپ کی **ترتیبات** کھولیں، **کرنسی کی ترتیبات** میں **اخراجات کو خودکار طور پر تبدیل کریں** چنیں۔ اس کے بعد ہر نیا خرچہ اسی کرنسی میں تبدیل ہوتا ہے، پھر بھی ایسے ریٹ پر جو آپ دیکھ اور بدل سکیں۔"
  - heading: "کون سا راستہ چنیں؟"
    items:
      - "**الگ رکھیں** جب لوگوں کے بٹوؤں میں ابھی ین پڑے ہوں، یا جب آپ ریٹ پر بحث نہ کرنا چاہیں۔ قیمت یہ ہے کہ ادائیگیاں زیادہ ہوں گی، اور ایک سے زیادہ کرنسیوں میں۔"
      - "**تبدیل کریں** جب گروپ ایک ہی کرنسی میں رہتا ہو اور ہر ایک کے لیے ایک عدد اور چھوٹی فہرست چاہے، جیسے کینجی کی دو منتقلیاں۔ قیمت یہ ہے کہ گروپ ایک ریٹ پر بھروسا کرتا ہے، اور ریٹ ہر خرچے پر اسی وقت طے ہو جاتا ہے جب وہ محفوظ ہو۔"
      - "**جلدی فیصلہ کریں۔** گروپ کی کرنسی صرف نئے اور کاپی کیے گئے اخراجات کو تبدیل کرتی ہے۔ جو آپ پہلے درج کر چکے ہیں اسے واپس جا کر ٹھیک نہیں کرتی۔"
  - heading: "ریٹ، اور حد"
    items:
      - "**ریٹ محفوظ کرتے وقت طے ہو جاتا ہے۔** پرانے اخراجات کی قدر کبھی دوبارہ نہیں لگتی، اس لیے مارکیٹ ہلنے سے بیلنس نہیں سرکتا۔ مختلف دنوں میں درج اخراجات پر مختلف ریٹ ہو سکتے ہیں، اس لیے اگر گروپ پورے سفر کے لیے ایک ریٹ چاہتا ہے تو اس پر اتفاق کریں اور ہر بار وہی لکھیں۔"
      - "**ریٹ نہیں ملا؟ خود لکھیں۔** Side Badger جہاں ممکن ہو موجودہ ایکسچینج ریٹ لے آتا ہے، لیکن ہر جوڑی کے لیے ریٹ کی ضمانت نہیں۔ اگر کوئی نہ ملے، یا کیش ڈیسک نے آپ کو بہتر ریٹ دیا ہو، تو اپنا ریٹ لکھ دیں۔"
      - "**فی خرچہ 999,999.99، اسی کی اپنی کرنسی میں۔** ایک ہی حد، کرنسی کوئی بھی ہو۔ ین میں یہ ¥1,000,000 سے ذرا کم ہے، اس گائیڈ کے ریٹ پر تقریباً £5,000۔ بڑے اعداد والی کرنسی میں، جیسے انڈونیشیائی روپیہ، ایک ہی بل اس تک جلدی پہنچ سکتا ہے۔ بل کو دو اخراجات میں بانٹ دیں، یا اسے کسی اور کرنسی میں درج کریں اور تبدیل کریں۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ پیسے کبھی نہیں بھیجتا اور نہ بدلتا ہے۔ آپ جیسے چاہیں ایک دوسرے کو ادا کرتے ہیں، پھر ادائیگی ریکارڈ کرتے ہیں۔"
      - "اس میں 140 کرنسیاں ہیں۔ کرپٹو کرنسیاں اور دھاتیں ان میں شامل نہیں۔"
