faq:
  heading: "Cwestiynau"
  items:
    - q: "A ddylem ni ddefnyddio cyflog gros neu gyflog net?"
      a: "Mater i'r grŵp yw hynny. Mae cyflog net yn gyffredin, oherwydd dyma'r arian sydd gennych mewn gwirionedd i'w wario. Mae cyflog gros yn anwybyddu'r ffaith bod treth, cyfraniadau pensiwn a thaliadau benthyciad yn cymryd symiau gwahanol allan o gyflogau gwahanol. Pa un bynnag a ddewiswch, defnyddiwch yr un mesur ar gyfer y ddau ohonoch."
    - q: "Ydy Side Badger yn gweld ein hincwm?"
      a: "Nac ydy. Rydych yn rhoi canrannau yn unig, byth gyflogau. Mae'r canrannau i'w gweld i aelodau'r grŵp, ac ar gyfer pâr, y ddau ohonoch yw hynny."
    - q: "Allwn ni osod 62/38 unwaith ar gyfer popeth?"
      a: "Mae'r rhaniad wedi'i osod fesul cost, nid fesul grŵp. Copïwch gost sydd eisoes â 62 a 38, yna newidiwch yr hyn sy'n wahanol. Mae [rhannu treuliau](page:feature/split-expenses) yn trafod y dewisiadau eraill."
