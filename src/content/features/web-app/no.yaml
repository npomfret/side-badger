meta:
  title: Del regninger uten å laste ned en app | Side Badger
  description: Telefonen din er full, vi skjønner det. Side Badger kjører i nettleseren, uten appbutikk og uten nedlasting. Legg den på startskjermen, så åpnes den som en app.
h1: Ingen appbutikk. Ingen nedlasting. Føles likevel som en app
navLabel: Nettapp
lead: Side Badger bor i nettleseren din. Det er ingen appbutikk å lete i og ingenting å laste ned først. Logg inn på en telefon eller en datamaskin, del utgifter på nett med gruppen din, og legg den på startskjermen eller i dokken når du vil ha den ett trykk unna.
cta:
  heading: Åpne den. Logg inn. Start en gruppe.
  body: Opprett en konto, start en gruppe og legg til den første utgiften, alt fra nettleseren du allerede har åpen. Vil du ha omvisningen først? Se [slik fungerer det](page:how-it-works), eller sjekk [hva gratis dekker](page:pricing).
problem:
  heading: Telefonen din er full. Vi skjønner det.
  body: Et sted der inne ligger fire tusen bilder av den samme solnedgangen og en lagringsadvarsel du har feid bort siden våren. Det siste den trenger, er enda en app, bare for å dele én middag. Så Side Badger er en nettapp. Den kjører i en moderne nettleser på en telefon eller en datamaskin. På en telefon bruker den mobillayouter, med gruppesiden delt i faner og knapper som er enkle å treffe med fingeren. Noen ekstrafunksjoner, som å legge den på startskjermen, avhenger av nettleseren din, og vi sier fra hvor.
workflow:
  heading: Fra nettleserfane til startskjerm i tre steg
  steps:
    - title: Åpne den og logg inn
      body: Gå til Side Badger i nettleseren og logg inn. Alt du trenger er en e-postadresse og et passord, og du bekrefter e-postadressen før du kan legge til noe. Alle i gruppen trenger en konto, så menneskene du inviterer, gjør det samme.
    - title: Legg den på startskjermen eller i dokken
      body: Når du er logget inn, tilbyr appen å installere seg selv. Du får en **Installer**-knapp der nettleseren din tillater det, og **Vis meg hvordan** der den ikke gjør det. Gikk du glipp av den, eller sa nei? **Innstillinger** har den samme hjelpen under **Legg til på Hjem-skjermen eller i Dock**. På en iPhone eller iPad viser Innstillinger iPhone-trinnene først og gjemmer de andre enhetene under **Andre enheter**. Uansett åpnes appen etter det i et eget vindu.
      shot: S20
      shotAlt: Delen Legg til på Hjem-skjermen eller i Dock i Innstillinger, med trinnene for å legge appen til på en enhet
    - title: Slå på varsler, hvis du vil ha dem
      body: Varsler er av til du slår dem på, og hver enhet slås på for seg. Bruk knappen **Slå på** som varselklokken tilbyr, eller bryteren **Pushvarsler** i **Innstillinger**. På en iPhone eller iPad åpner du først appen fra Hjem-skjermen. Det er det eneste stedet varsler fungerer der.
      shot: S19
      shotAlt: Varselmenyen åpen, med en liste over nylig aktivitet i gruppen
options:
  heading: Slik legger du den til, enhet for enhet
  items:
    - title: iPhone og iPad
      body: Trykk på Del-knappen, en firkant med en pil som peker oppover. Hvis du ikke ser den, trykk først på de tre prikkene (•••), deretter på Del. Rull ned og trykk på **Legg til på Hjem-skjermen**. La **Åpne som nettapp** stå på, og trykk så på **Legg til**. Hvis en lenke åpnet seg inne i en annen app, åpne siden i Safari først, for den innebygde nettleseren kan ikke legge den til.
    - title: Android
      body: Åpne nettlesermenyen og velg **Legg til på startskjermen** eller **Installer appen**.
    - title: Chrome eller Edge på en datamaskin
      body: Åpne nettlesermenyen og velg alternativet for å installere dette nettstedet som en app. Da får det sitt eget vindu og sitt eget ikon.
    - title: Safari på en Mac
      body: Velg **Arkiv**, deretter **Legg til i Dock**.
sections:
  - heading: Varsler, bare hvis du ber om dem
    body: Pushvarsler er valgfrie. Slå dem på, så får du et varsel når det er ny aktivitet i gruppene dine, for eksempel at noen legger til en utgift, skriver en kommentar eller registrerer en betaling. De slås på én enhet om gangen, fra varselklokken eller fra **Innstillinger**, og du kan slå dem av igjen der. De krever en nettleser som støtter dem og din tillatelse. Hvis nettleseren din har blokkert dem for nettstedet, tillat dem i nettleserens innstillinger først. På en iPhone eller iPad fungerer de bare fra appen som er lagt til på Hjem-skjermen, ikke fra en nettleserfane. Levering er ikke garantert, så se på et varsel som et lite dytt, ikke et løfte. For hva som dukker opp i loggen, se [planlegg sammen](page:feature/plan-together).
  - heading: Oppdateringer med en gang, ingen oppdateringsknapp
    body: Legg til en utgift, så ser alle den med en gang, sammen med hva som endret seg og hvem som endret det. Hver gruppe har en aktivitetshistorikk, og varselklokken viser aktivitet på tvers av alle gruppene dine. Ingen trenger å spørre om du har sett det du nettopp la inn. Det står på skjermen deres.
  - heading: 39 språk, og alle velger sitt eget
    body: Bruk Side Badger på 39 språk, inkludert arabisk, persisk og urdu, som skrives fra høyre mot venstre. Alle i gruppen velger sitt eget, så den samme gruppesiden kan være på arabisk for én person og på engelsk for den neste. Det eneste gruppen må bli enig om, er tallene.
  - heading: Bygget for mer enn én type bruker
    body: Side Badger er bygget med tastatur- og skjermleserbrukere i tankene. Medlemsfarger kommer med mønstre, så du trenger ikke skille grønt fra rødt.
    items:
      - Hopp-til-innhold-lenker, så tastaturbrukere kommer rett til innholdet.
      - Dialoger styrer tastaturfokuset.
      - Kontroller er merket, for skjermlesere.
      - Layoutene speilvendes for språk som skrives fra høyre mot venstre.
limits:
  heading: Hva nettappen ikke gjør
  items:
    - Det finnes ingen frakoblet bruk. Side Badger trenger en tilkobling, så den åpner ikke gruppen din på et fly uten wifi.
    - Det finnes ingen app i appbutikken og ingen egen iPhone- eller Android-app. Side Badger er en nettapp, og å legge den til på startskjermen eller i dokken er slik du får den appaktige versjonen.
    - Å legge den til på en startskjerm eller i en dokk avhenger av nettleseren din. Menynavnene varierer mellom nettlesere og versjoner, og noen nettlesere tilbyr det ikke.
    - Pushvarsler må slås på for hver enhet, og krever en nettleser som støtter dem og din tillatelse. På en iPhone eller iPad fungerer de bare fra appen som er lagt til på Hjem-skjermen. Levering er ikke garantert.
    - Det finnes ingen e-post- eller SMS-varsler og ingen betalingspåminnelser. Ny aktivitet vises i appen, og som pushvarsler hvis du slår dem på. Det er fortsatt opp til deg å purre på en betaling.
    - Aktivitet beholdes i 90 dager.
    - Du logger inn med en e-postadresse og et passord. Det finnes ingen innlogging med Google eller Apple, og du må være 18 år eller eldre.
    - Vi påstår ikke at Side Badger er fullt tilgjengelig, eller at den oppfyller en formell tilgjengelighetsstandard. Hvis noe står i veien for deg, si fra inne i appen, så ser du svaret vårt der.
useCasesHeading: Der det hjelper å slippe en app
faq:
  heading: Spørsmål
  items:
    - q: Finnes det en Side Badger-app i en appbutikk?
      a: Nei. Side Badger er en nettapp. Du åpner den i nettleseren, og du kan legge den på startskjermen eller i dokken så den åpnes som en app. Det er ingenting å laste ned fra en appbutikk.
    - q: Kan jeg dele regninger uten å laste ned en app?
      a: Ja. Åpne Side Badger i en nettleser på telefonen eller datamaskinen, logg inn og start en gruppe. Å legge den på startskjermen eller i dokken er valgfritt.
    - q: Fungerer den frakoblet?
      a: Nei. Side Badger trenger en tilkobling, selv når den er lagt til på startskjermen eller i dokken.
    - q: Hvorfor får jeg ikke varsler på iPhone?
      a: På en iPhone eller iPad fungerer varsler bare fra appen som er lagt til på Hjem-skjermen, ikke fra en nettleserfane. Legg den til, åpne den fra ikonet på Hjem-skjermen, og slå så på varsler i **Innstillinger**. Levering er ikke garantert, så hvis ett uteblir, viser gruppens aktivitetshistorikk fortsatt hva som ble lagt til.
    - q: Må jeg slå på varsler?
      a: Nei. De er av til du slår dem på, én enhet om gangen. Uten dem vises ny aktivitet fortsatt i appen, og alle ser en endring med en gang når de har den åpen.
    - q: Trenger alle i gruppen en konto?
      a: Ja. Alt du trenger er en e-postadresse og et passord, og du bekrefter e-postadressen før du kan legge til noe. Alle som blir med i en gruppe, gjør det samme, på hvilken telefon eller datamaskin de vil.
