featuresHeading: "Οι λειτουργίες που χρησιμοποιεί ένα ζευγάρι"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορούμε να ορίσουμε 60/40 μία φορά για όλα;"
      a: "Όχι. Ο διαχωρισμός ανήκει σε κάθε έξοδο. Ορίστε τα ποσοστά στο πρώτο, μετά αντιγράψτε το την επόμενη φορά και αλλάξτε ό,τι διαφέρει. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) καλύπτει και τους τρεις τρόπους διαχωρισμού."
    - q: "Συνδέεται με την τράπεζά μας;"
      a: "Όχι. Το Side Badger δεν αγγίζει ποτέ τα χρήματά σας. Πληρώνετε ο ένας τον άλλον όπως θέλετε και μετά το καταγράφετε, όπως εξηγεί η [εκκαθάριση](page:feature/settle-up)."
    - q: "Μπορεί κάποιος άλλος να δει την ομάδα μας;"
      a: "Μόνο τα μέλη της, και η ομάδα ενός ζευγαριού έχει δύο. Όποιος χρησιμοποιήσει έναν ενεργό σύνδεσμο πρόσκλησης μπορεί να μπει, οπότε μοιραστείτε τον με ένα άτομο και δώστε του σύντομη λήξη."
    - q: "Τι γίνεται αν πληρώσαμε ο καθένας ένα μέρος του ίδιου λογαριασμού;"
      a: "Ένα έξοδο έχει έναν πληρωτή. Καταχωρίστε δύο έξοδα, ένα για τον καθένα σας, και το υπόλοιπο βγαίνει το ίδιο."
    - q: "Θα υπενθυμίσει στον σύντροφό μου να πληρώσει;"
      a: "Όχι. Δεν υπάρχουν υπενθυμίσεις, οπότε το σκούντημα μένει δικό σας. Τουλάχιστον θα κοιτάτε και οι δύο τον ίδιο αριθμό."
    - q: "Τι γίνεται όταν σταματήσουμε να μοιραζόμαστε τα έξοδα;"
      a: "Τακτοποιήστε το υπόλοιπο και καταγράψτε την πληρωμή, ώστε κανείς να μη χρωστά τίποτα. Μετά ένας διαχειριστής μπορεί να κλειδώσει την ομάδα, που κρατά τους αριθμούς όπως είναι, ή να την κλείσει οριστικά, κάτι που την κάνει απρόσιτη για όλους. Κλείστε την μόνο όταν κανείς από τους δυο σας δεν χρειάζεται το ιστορικό."
