sections:
  - heading: "39 języków i dla jeszcze większej liczby osób"
    body: "Korzystaj z Side Badger w 39 językach, w tym w arabskim, perskim i urdu, pisanych od prawej do lewej. Każdy w grupie może wybrać własny, więc strona grupy może być po arabsku dla jednej osoby i po angielsku dla następnej. Aplikację zbudowano też z myślą o osobach korzystających z klawiatury i czytników ekranu, a kolory członków mają wzory, więc nie trzeba odróżniać zieleni od czerwieni."
faq:
  heading: "Pytania"
  items:
    - q: "Czy każdy potrzebuje konta?"
      a: "Tak, darmowego. Każda osoba weryfikuje swój e-mail, zanim cokolwiek doda."
    - q: "Czy jest aplikacja?"
      a: "Działa w przeglądarce. Zaloguj się, a potem dodaj ją do ekranu głównego albo docka, żeby otwierała się jak aplikacja. Jak to zrobić, pokażą Ustawienia w aplikacji. Nie ma wersji ze sklepu z aplikacjami ani trybu offline."
    - q: "Czy Side Badger przesyła pieniądze?"
      a: "Nie. Prowadzi rachunek i podpowiada płatności, a wy płacicie sobie, jak chcecie. Potem rejestrujesz płatność. Zobacz [rozliczanie](page:feature/settle-up)."
    - q: "Czy ktoś może wyjść, będąc komuś winien pieniądze?"
      a: "Nie. Nikt nie może opuścić grupy, dopóki jest komuś winien pieniądze albo ktoś jest winien jemu, więc najpierw się rozlicza."
    - q: "Ile osób może dołączyć do grupy?"
      a: "Do 50 osób w grupie. Zaproś je linkiem albo kodem QR i włącz zatwierdzanie, jeśli chcesz, żeby administrator wpuszczał każdą osobę."
    - q: "A wyjazdy z więcej niż jedną walutą?"
      a: "Salda są prowadzone osobno dla każdej waluty. Zobacz [wiele walut](page:feature/multiple-currencies)."
