meta:
  title: "Side Badger ile Splitwise: sadece rakamlar değil, tüm grup | Side Badger"
  description: "Tüm grup için ücretsiz bir Splitwise alternatifi: yorumlar, sorular, listeler, anketler ve gerçek roller, üstüne ücretsiz makbuz tarama ve para birimi çevirme."
h1: "Side Badger ile Splitwise: sadece rakamlar değil, tüm grup"
navLabel: Side Badger ile Splitwise
lead: "Grubunuzdan biri muhtemelen “Splitwise kullanın işte” demiştir. Anlaşılır: rakam işinde iyi. Side Badger da rakamları hesaplar, sonra gruba bunu konuşup halletmesi için bir yer verir: yorumlar, sorular, listeler, anketler ve gerçek grup rolleri. Makbuz tarama ve para birimi çevirme ücretsiz gelir."
cta:
  heading: Bir sonraki ortak faturanızda deneyin
  body: Ücretsiz bir hesap oluşturun, bir grup kurun ve gerçek bir harcama ekleyin. Size uymazsa abonelik değil, birkaç dakika harcamış olursunuz.
asOf: 2026-11-22
asOfNote: Siz okumak zorunda kalmayın diye Splitwise'ın kendi sayfalarını {date} tarihinde okuduk ve burada Splitwise hakkında yazılan her şey onlardan gelir. Tablonun her satırı kaynağına bağlanır. Planlar değişir, bu yüzden her çeyrekte yeniden kontrol ederiz; Splitwise'ın sayfaları bu sayfayla çelişirse onlara inanın.
