meta:
  title: "Wspólne listy, ankiety i komentarze do wydatków | Side Badger"
  description: "Komentuj wydatki, kwestionuj te dziwne, prowadź wspólną listę zakupów i głosuj nad willą. Zaplanujcie wydatki razem, potem je podzielcie. Za darmo, bez reklam."
h1: "Zaplanujcie razem, podzielcie potem"
navLabel: "Planowanie razem"
lead: "Lista zakupów i rachunek za zakupy wreszcie ze sobą rozmawiają. Side Badger daje twojej grupie miejsce do rozmów o pieniądzach przed wydaniem i po nim: komentarze przy każdym wydatku, sposób na zakwestionowanie tych, które wyglądają źle, wspólne listy i ankiety do wielkich decyzji. Potem [dzielicie wydatki](page:feature/split-expenses) jak zawsze."
cta:
  heading: "Zaplanuj, a potem podziel"
  body: "Załóż darmowe konto, utwórz grupę i dodaj pierwszą listę, ankietę albo pytanie tuż obok pieniędzy. Nie wiesz, co dalej? Zobacz [jak to działa](page:how-it-works)."
problem:
  heading: "Czat jest tu, rachunek tam"
  body: "Wspólne wydatki mieszkają zwykle w dwóch miejscach. Liczby są w jednym, a kłótnia o liczby w czacie, który przewinął się we wtorek. Lista zakupów to zdjęcie lodówki. O willi zdecydował kciuk w górę od większości osób, chyba. Side Badger trzyma planowanie w grupie, obok wydatków, których dotyczy, więc jest komentarz tam, gdzie koszt, lista tam, gdzie zakupy, ankieta do wielkiej decyzji i sposób, żeby powiedzieć „chwila, czy to się zgadza?”, bez pisania akapitu. Całość dotyczy pieniędzy grupy, bo po to ta grupa istnieje."
workflow:
  heading: "Od głosowania nad willą do rachunku za zakupy"
  steps:
    - title: "Poddaj wielką decyzję pod głosowanie"
      body: "Dodaj ankietę do decyzji, która wyznacza rachunek, na przykład którą willę wybrać. Podaj od dwóch do dziesięciu opcji, ustal, ile głosów ma każda osoba, a gdy wszyscy zagłosują, zamknij ją, żeby zwycięzca został oznaczony."
      shot: S17
      shotAlt: "Zamknięta ankieta z oznaczoną zwycięską opcją i liczbą głosów obok każdej opcji"
    - title: "Napiszcie razem listę zakupów"
      body: "Utwórz wspólną listę, dodaj pozycje i odhaczaj je, gdy trafią do wózka. Rachunek za zakupy dodajesz potem jako wydatek."
      shot: S16
      shotAlt: "Wspólna lista zakupów z kilkoma odhaczonymi pozycjami i licznikiem postępu"
    - title: "Rozmawiaj o koszcie tam, gdzie mieszka"
      body: "Skomentuj sam wydatek, załącz paragon i zareaguj emoji. Rozmowa zostaje obok liczby, której dotyczy."
      shot: S08
      shotAlt: "Wydatek ze szczegółami, miniaturą paragonu, wątkiem komentarzy i reakcjami emoji"
    - title: "Zakwestionuj ten, który wygląda dziwnie"
      body: "Jeśli grupa włączyła pytania do wydatków, każdy uwzględniony w wydatku może wybrać **Mam pytanie**. Wydatek zostaje poza saldami, dopóki pytanie nie zostanie wyjaśnione."
      shot: S18
      shotAlt: "Lista wydatków z plakietką Zakwestionowano i filtrem Tylko zakwestionowane"
    - title: "Zobacz, co się zmieniło i kto to zmienił"
      body: "Historia aktywności i dzwonek powiadomień pokazują, co nowego w twoich grupach. Powiadomienia push są do dyspozycji, jeśli ich chcesz."
      shot: S19
      shotAlt: "Rozwijane powiadomienia z listą ostatniej aktywności"
