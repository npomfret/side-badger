faq:
  heading: よくある質問
  items:
    - q: 計算機は無料ですか？
      a: はい。無料。広告なし。1日の制限なし。アカウントも不要です。
    - q: 入力した内容は保存されますか？
      a: いいえ。何も保存されず、どこにも送信されません。数字を残すには「リンクをコピー」を使い、そのリンクをどこかに保存してください。
    - q: コピーしたリンクは誰が見られますか？
      a: リンクを持っている人なら誰でも見られます。数字はリンクそのものの#の後ろに入っているので、見てよい人にだけ共有してください。
    - q: お金は動きますか？
      a: いいえ。誰が誰に払うべきかを計算するだけで、支払いは好きな方法で行います。Side Badgerもあなたのお金に触れることはありません。[精算](page:feature/settle-up)をご覧ください。
    - q: 2つの通貨で支払った旅行を割り勘できますか？
      a: ここではできません。1回の計算で使える通貨は1つだからです。グループでは、通貨ごとに別々の残高を管理します。[複数の通貨](page:feature/multiple-currencies)をご覧ください。
    - q: 金額が合わない場合は？
      a: 計算機が支出の下にその旨を表示し、合うまで結果は表示しません。金額指定は合計が総額と一致し、割合指定は合計が100になる必要があります。
