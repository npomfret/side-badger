sections:
  - heading: "お金の話は、お金のそばで"
    body: "お金を一緒に扱えば、おしゃべりも、疑問も、計画もついてきます。Side Badgerは、その3つを数字のそばに置くので、グループチャットをさかのぼる必要はありません。"
    items:
      - "**コメントは、あるべき場所に**。グループそのものにも、支出、リスト、投票のどれにもコメントでき、会話は話題のそばに残ります。"
      - "**レシートと写真**。1件の支出にレシートを最大3枚まで残せます。グループ、リスト、投票へのコメントには、写真やPDFも添付できます。"
      - "**言い争いではなく、質問を**。管理者が質問を有効にすると、支出に参加している人なら誰でもその支出について質問できます（「質問があります」）。解決するまでは、残高に含まれません。"
      - "**リストと投票**。共有の買い物リストを買い物の支出のそばに置き、別荘の候補は投票で決めましょう。お好みで匿名にもできます。"
      - "**ちょっとした拍手**。支出、支払い、コメントにリアクションでき、支払いが届いたらお祝いもできます。"
  - heading: グループのルールは、グループで決める
    body: "Splitwiseのヘルプセンターには、グループ管理者や特別な権限には対応していないと書かれています。Side Badgerには役割と権限があります。数字をきれいに保つ人が必要なグループのために。"
    items:
      - "**管理者、メンバー、閲覧者**。誰かを閲覧者にすれば、すべて見られて、何も変更できません。"
      - "**2つのプリセット、または自分で設定**。オープンコラボレーションか管理グループから始めるか、権限をひとつずつ自分で設定できます。支出の編集と削除、リストの編集、招待、新しい人の参加の許可を、誰ができるかを決められます。"
      - "**参加には承認を**。承認をオンにすると、管理者が一人ずつ参加を認めます。"
      - "**グループ独自の設定**。実際に使う通貨だけに絞り、既定の通貨を選び、ヘッダー画像を付けられます。"
      - "**終わったらロック**。管理者がロックを解除するまで、数字はそのままです。"
  - heading: こちらは無料、あちらは有料
    body: Splitwise ProはSplitwiseの有料プランで、そのProのページでは、Side Badgerなら無料の3つの機能が売りにされています。
    items:
      - "**レシートスキャン**。Splitwise Proはレシートの写真をスキャンします。Side Badgerは、スキャンのクレジットなしで無料です。合計・日付・場所を入力するので、確認してください。"
      - "**通貨の換算**。Splitwise Proは、「Convert」をタップすると、グループの支出を既定の通貨に換算します。Side Badgerは、各支出を入力するときに、現在の為替レートか、実際に得たレートで換算し、元の金額は支出にそのまま残ります。"
      - "**1日の制限なし**。Splitwise Proは無制限の支出を売りにしており、ヘルプセンターには、無料ユーザーが追加できる支出は1日あたり最大4件と書かれています。Side Badgerに1日の制限はありません。"
  - heading: 銀行は関わりません
    body: "Side Badgerは銀行と連携せず、銀行情報を求めることもありません。誰が誰にいくら借りているかの記録をつけるだけで、支払いは好きな方法で行い、そのあと記録します。銀行のログイン情報を預ける必要がないので、守るものがひとつ減ります。"
  - heading: ブラウザでもスマートフォンでも、同じ1つのアプリ
    body: "Side Badgerはブラウザで動作します。ログインしてホーム画面に追加すれば、アプリのように開きます。どちらでも同じアプリなので、新機能は次にアプリを開いたときにはスマートフォンに届いていて、アプリストアの更新を待つ必要はありません。"
  - heading: "さらに、ちょっとした小ワザも"
    items:
      - "**アシスタントに頼む**。Side BadgerはChatGPTやClaudeと連携します。支出の追加、レシートのスキャン、支払いの記録を、お使いのアシスタントに頼めます。"
      - "**みんなが自分の言語で**。Side Badgerは39言語に対応し、各自が自分の言語を選べます。Splitwiseのホームページには7以上と書かれています。通貨も133に対応しているので、どこへ行く旅行にも使えます。"
      - "**アプリを出ずにヘルプ**。困ったことや不具合があったら、アプリから知らせてください。返信もそのままアプリ内で読めます。"
  - heading: Splitwiseのほうが強いところ
    body: あとで気づくより、ぴったりのアプリを選んでほしいと思っています。グループにこれらのどれかが必要なら、Splitwiseにはあって、Side Badgerにはありません。
    items:
      - "**アプリストアのアプリ**。Side Badgerはブラウザとホーム画面で動作し、アプリストアにはありません。"
      - "**オフラインモード**。Side Badgerは接続が必要です。"
      - "**アプリ内での支払い**。国によっては、Splitwiseならお金の移動もできます。Side Badgerは記録をつけるだけです。"
      - "**持ち分や品目ごとの分割**。Side Badgerは1つの支出につき支払う人は1人で、均等、金額指定、割合指定で分割します。レシートスキャンでも、品目を人に割り当てることはありません。"
      - "**グラフと既定の分け方**。Splitwise Proには両方あります。Side Badgerは誰が誰に借りているかを記録するだけで、それがすべてです。"
  - heading: グループを移す
    body: インポート機能はないので、移行は新しいスタートになります。先にSplitwiseで精算し、そのあとSide Badgerでグループを作って、リンクまたはQRコードで全員を招待してください。グループの全員に無料アカウントが必要で、登録に必要なのはメールアドレスだけです。
table:
  heading: 並べて比較
  caption: Splitwiseの詳細は{date}時点のもので、Splitwise自身のページに基づきます。
  sourceLabel: 出典
  columns:
    feature: 項目
    other: Splitwise（同社ページによる）
    sideBadger: Side Badger
  rows:
    - feature: 料金
      other: Splitwise Proは月額または年額のサブスクリプションです。年額プランにはTrip Passが含まれ、旅行のグループが30日間Proの機能を使えます。
      sideBadger: "無料。"
      source: pro-help
    - feature: 1日あたりの支出数
      other: ヘルプセンターによると、無料ユーザーが追加できる支出は1日あたり最大4件です。Proに1日の制限はありません。
      sideBadger: 1日の制限なし。
      source: pro-help
    - feature: グループの役割と権限
      other: ヘルプセンターによると、グループ管理者や特別な権限には対応していません。
      sideBadger: 管理者、メンバー、閲覧者。2つのプリセットか自分で決める権限、参加の承認、終わったときのためのロックがあります。
      source: permissions-help
    - feature: レシートスキャン
      other: Proの機能です。レシートの写真をスキャンし、Proの品目分割で品目を人に割り当てられます。
      sideBadger: スキャンのクレジットなしで無料です。合計・日付・場所を入力するので、確認してください。品目を人に割り当てることはしません。
      source: pro
    - feature: 通貨の換算
      other: Proの機能です。「Convert」をタップすると、Splitwiseがグループの支出をその時点の為替レートで既定の通貨に換算します。
      sideBadger: 無料です。各支出を入力するときに、現在の為替レートか実際に得たレートで換算します。元の金額は支出にそのまま残ります。
      source: currencies-help
    - feature: 通貨と言語
      other: ホームページの表現では、100以上の通貨と7以上の言語。
      sideBadger: 133の通貨と39の言語。グループの全員が自分の言語を選べます。
      source: home
    - feature: 使う場所
      other: iPhoneとAndroidのアプリ、そしてウェブ。
      sideBadger: "ブラウザ上です。ログインしてからホーム画面に追加すれば、アプリのように開きます。アプリストアにはありません。"
      source: home
    - feature: 分け方
      other: 均等、金額指定、割合指定、持ち分、調整、品目ごと。
      sideBadger: 均等、金額指定、割合指定で、1つの支出につき支払う人は1人です。持ち分や品目ごとの分割はありません。
      source: split-help
    - feature: オフラインでの利用
      other: 主な機能のひとつとして、オフラインモードを挙げています。
      sideBadger: なし。接続が必要です。
      source: home
    - feature: 支払いと銀行
      other: 一部の地域では、アプリ内から送金できます。米国ではSplitwise Pay、米ドルの残高ではVenmo、PayPal、一部のヨーロッパの国ではPay by Bankで、個人の普通預金口座に接続します。
      sideBadger: "あなたのお金に触れることはなく、銀行情報を求めることもありません。支払いは好きな方法で行い、そのあと記録します。"
      source: payments-help
    - feature: グラフと既定の分け方
      other: どちらもProの機能です。
      sideBadger: どちらもありません。
      source: pro
faq:
  heading: よくある質問
  items:
    - q: Side BadgerはSplitwiseの無料の代替サービスですか？
      a: "グループで費用を割り勘する用途なら、そうです。しかも計算だけではありません。コメント、質問、リスト、投票、グループの役割があり、レシートスキャンと通貨の換算は無料です。アプリストアのアプリ、オフライン利用、アプリ内での支払いが必要なら、それらはSplitwiseにあり、Side Badgerにはありません。"
    - q: Splitwiseの情報はどこから来ていますか？
      a: Splitwise自身のページです。ホームページ、Proのページ、ヘルプセンターです。表の各行に元のページへのリンクがあり、表の上の日付が、それを読んだ日です。3か月ごとに確認しています。
    - q: Side Badgerはずっと無料ですか？
      a: Side Badgerのすべてが現在無料です。もしこれが変わる場合は、事前にお知らせします。詳しくは[料金のページ](page:pricing)をご覧ください。
    - q: グループの全員が乗り換える必要がありますか？
      a: はい。グループの全員に無料のSide Badgerアカウントが必要で、リンクまたはQRコードで参加できます。
    - q: Side Badgerにモバイルアプリはありますか？
      a: "アプリストアにはありません。ブラウザで動作します。スマートフォンでログインしてから、ホーム画面に追加すれば、アプリのように開きます。方法は[使い方](page:how-it-works)で紹介しています。"
