faq:
  heading: "Jautājumi"
  items:
    - q: "Kam jāreģistrē maksājums, maksātājam vai saņēmējam?"
      a: "Maksājuma reģistrēšanai vajadzīga atļauja labot izdevumus, un veidlapa jautā **Kas samaksāja?** un **Kas saņēma maksājumu?** Vēlāk to var rediģēt tikai tas, kas to reģistrēja, tāpēc parasti vienkāršāk, ja to dara maksātājs, izmantojot ātrā norēķina pogu."
    - q: "Ko darīt, ja ceļojums notika divās valūtās?"
      a: "Atlikumi tiek uzturēti katrā valūtā, tāpēc parāds eiro paliek parāds eiro, un katrai valūtai ir savs īss saraksts, ja vien izdevumi netika konvertēti, kad tie tika ievadīti. [Vairākas valūtas](page:guide/how-to-split-a-trip-paid-in-several-currencies) parāda abus veidus."
    - q: "Vai norēķināties ceļojuma laikā vai beigās?"
      a: "Der abi. Katrs reģistrētais maksājums maina atlikumus, tāpēc maksājums ceļojuma vidū skaitās galīgajā sarakstā. Beigās ir vienkāršāk, jo [viss ceļojums](page:use-case/group-trips) ir vienuviet."
