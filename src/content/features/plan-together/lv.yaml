faq:
  heading: "Jautājumi"
  items:
    - q: "Vai balsis var būt anonīmas?"
      a: "Jā. Veidojot aptauju, ieslēdziet **Anonīma balsošana**, un tā paslēpj, kurš par ko balsoja. Izlemiet pirms pirmās balss, jo vēlāk to nevar mainīt."
    - q: "Vai aptauja var aizvērties pati?"
      a: "Nē. Aptaujai nav termiņa, tāpēc tās veidotājs izvēlas **Aizvērt aptauju**, kad grupa ir izlēmusi. Ja grupa pārdomā, **Atvērt aptauju atkārtoti** to atgriež."
    - q: "Cik pozīciju var būt sarakstā?"
      a: "Līdz 200 pozīcijām sarakstā un līdz 100 sarakstiem grupā. Katra pozīcija var būt līdz 500 rakstzīmēm, kas ir daudz auzu piena."
    - q: "Kurš var aizvērt jautājumu, un kas tikmēr notiek ar izdevumu?"
      a: "Tas, kas jautāja, vai grupas administrators. Kamēr jautājums ir atvērts, viss izdevums ir ārpus visu atlikumiem. Tas atgriežas, kad tiek aizvērts pēdējais atvērtais jautājums par to vai kad labojums izņem jautātāju no izdevuma."
    - q: "Vai sarakstus un komentārus drīkst izmantot kā uzdevumu lietotni vai grupas tērzēšanu?"
      a: "Nē. Komentāri, saraksti un aptaujas ir paredzēti grupas naudai, ko prasa [lietošanas noteikumi](page:terms). Domājiet par iepirkumu sarakstiem, budžeta aptaujām un „kāpēc šis ir 45 £?”."
    - q: "Vai Side Badger sūtīs man e-pastus par aktivitāti?"
      a: "Nē. Aktivitātei nav e-pasta vai īsziņu brīdinājumu. Varat ieslēgt push paziņojumus katrā ierīcē, un paziņojumu zvaniņš lietotnē rāda, kas jauns."
