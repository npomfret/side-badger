faq:
  heading: "자주 묻는 질문"
  items:
    - q: "사이드 배저는 어떤 환율을 쓰나요?"
      a: "지출을 입력할 때 가져올 수 있는 경우 현재 환율을 가져옵니다. 실제로 적용받은 환율로 바꿀 수 있어요."
    - q: "그룹에서 파운드와 엔만 쓰게 할 수 있나요?"
      a: "네. 그룹의 **설정**에서 **통화 설정** 아래 **이 그룹의 통화 제한**을 켜고, **허용된 통화**를 고른 다음 **새 비용의 기본 통화**를 정하세요. 목록의 선택지가 적을수록 계산대에서 잘못 고를 일도 줄어요."
    - q: "꼭 환산해야 하나요?"
      a: "아니요. 여러분이나 그룹이 환산하기로 하지 않는 한 통화는 따로 유지되며, 통화마다 짧은 결제 목록이 생깁니다."
