meta:
  title: "Saraksti, aptaujas un komentāri grupas izdevumiem | Side Badger"
  description: "Komentējiet izdevumus, apšaubiet dīvainos, turiet kopīgu iepirkumu sarakstu un balsojiet par villu. Plānojiet izmaksas kopā, tad sadaliet. Bez maksas, bez reklāmām."
h1: "Plānojiet kopā, sadaliet pēc tam"
navLabel: "Plānojiet kopā"
lead: "Iepirkumu saraksts un iepirkumu rēķins beidzot runājas. Side Badger dod grupai vietu, kur parunāt par naudu pirms un pēc tam, kad tā iztērēta: komentāri pie katra izdevuma, veids, kā apšaubīt tos, kas šķiet nepareizi, kopīgi saraksti un aptaujas lielajiem lēmumiem. Tad jūs [sadalāt izdevumus](page:feature/split-expenses) kā parasti."
cta:
  heading: "Plānojiet, tad sadaliet"
  body: "Izveidojiet bezmaksas kontu, sāciet grupu un ielieciet pirmo sarakstu, aptauju vai jautājumu tieši blakus naudai. Neesat pārliecināti, kas notiks tālāk? Skatiet [kā tas darbojas](page:how-it-works)."
problem:
  heading: "Tērzēšana ir šeit, rēķins ir tur"
  body: "Grupas izdevumi parasti dzīvo divās vietās. Skaitļi ir vienā, bet strīds par skaitļiem ir tērzēšanā, kas otrdien aizritināta prom. Iepirkumu saraksts ir ledusskapja fotogrāfija. Villu izlēma, kad lielākā daļa, šķiet, uzlika īkšķi uz augšu. Side Badger plānošanu notur grupā, blakus izdevumiem, uz kuriem tā attiecas, tāpēc ir komentārs turpat, kur izmaksas, saraksts turpat, kur iepirkšanās, aptauja lielajam lēmumam un veids pateikt „pagaidiet, vai tas ir pareizi?”, nerakstot veselu rindkopu. Viss paliek par grupas naudu, un tieši tam grupa ir domāta."
workflow:
  heading: "No balsojuma par villu līdz iepirkumu rēķinam"
  steps:
    - title: "Nododiet lielo lēmumu balsojumam"
      body: "Pievienojiet aptauju lēmumam, kas nosaka rēķinu, piemēram, kuru villu izvēlēties. Izvēlieties no divām līdz desmit iespējām, norādiet, cik balsu ir katram cilvēkam, un aizveriet aptauju, kad visi ir nobalsojuši un uzvarētājs ir atzīmēts."
      shot: S17
      shotAlt: "Aizvērta aptauja ar atzīmētu uzvarošo variantu un balsu skaitu pie katra varianta"
    - title: "Rakstiet iepirkumu sarakstu kopā"
      body: "Sāciet kopīgu sarakstu, pievienojiet pozīcijas un atķeksējiet tās, kad tās nonāk ratos. Iepirkums pēc tam tiek pievienots kā izdevums."
      shot: S16
      shotAlt: "Kopīgs iepirkumu saraksts ar dažām atķeksētām pozīcijām un progresa skaitītāju"
    - title: "Parunājiet par izmaksām tur, kur tās dzīvo"
      body: "Komentējiet pašu izdevumu, pievienojiet čeku un reaģējiet ar emocijzīmi. Saruna paliek blakus skaitlim, par ko tā ir."
      shot: S08
      shotAlt: "Izdevums ar detaļām, čeka sīktēlu, komentāru pavedienu un emocijzīmju reakcijām"
    - title: "Apšaubiet to, kas šķiet nepareizs"
      body: "Ja grupa ir ieslēgusi izdevumu jautājumus, ikviens, kas iekļauts izdevumā, var izvēlēties **Man ir jautājums**. Izdevums paliek ārpus atlikumiem, kamēr jautājums nav nokārtots."
      shot: S18
      shotAlt: "Izdevumu saraksts ar zīmi „Apšaubīts” un filtru „Tikai apšaubīti”"
    - title: "Redziet, kas mainījies un kurš to mainīja"
      body: "Aktivitāšu plūsma un paziņojumu zvaniņš rāda, kas jauns jūsu grupās. Push paziņojumi ir pieejami, ja tos vēlaties."
      shot: S19
      shotAlt: "Paziņojumu nolaižamā izvēlne ar nesenās aktivitātes sarakstu"
