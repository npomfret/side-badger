meta:
  title: "Cum împarți chiria după mărimea camerei | Side Badger"
  description: "Cameră mai mare, parte mai mare. Pune deoparte încăperile comune, împarte restul după suprafață și introdu procentele o dată. Calcule pentru trei colegi."
h1: "Cum împarți chiria după mărimea camerei"
navLabel: "Chirie după mărimea camerei"
lead: "Hotărăște cât din chirie e pentru încăperile comune și împarte acea parte egal, apoi împarte restul după suprafața fiecărui dormitor. Rotunjește la procente întregi, introdu-le o singură dată pe chiria din Side Badger și copiază cheltuiala în fiecare lună."
cta:
  heading: "Introdu chiria o singură dată"
  body: "Creează un cont gratuit, fă un grup pentru apartament și introdu chiria cu procentele la care ați ajuns. Luna viitoare e o copie. Vrei mai întâi turul? Vezi [cum funcționează](page:how-it-works) sau [ce acoperă gratuitul](page:pricing)."
sections:
  - heading: "Trei oameni, un apartament, o ceartă"
    body: "Priya, Tom și Aisha împart un apartament cu 1.950 £ pe lună. Un an l-au împărțit în trei, pentru că era simplu. Apoi Aisha și-a măsurat dormitorul. Camera lui Priya are 16 m², a lui Tom 12 m², iar a Aishei 10 m², așa că Aisha plătea cât plătea Priya pentru o cameră cu mai mult de o treime mai mică. Nimeni nu fusese nerezonabil. Nimeni nu făcuse socoteala. La o mâncare comandată au convenit mai întâi o regulă. Din chirie, 40% e pentru bucătărie, baie și sufragerie, pe care le folosesc toți trei."
  - heading: "Metoda, cu socotelile arătate"
    body: "Patru pași, o ruletă și un calculator de telefon."
    items:
      - "**Pune deoparte partea comună.** Grupul stabilește ce parte din chirie revine încăperilor pe care le folosesc toți. Pentru apartament e 40%, adică 13,33% pentru fiecare dintre cei trei."
      - "**Împarte restul după suprafață.** Celelalte 60% se împart după mărimea dormitoarelor. Dormitoarele însumează 38 m² (16 + 12 + 10), așa că partea lui Priya este 60% × 16/38, adică 25,26%."
      - "**Adună cele două părți.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, plus 13,33% înseamnă 32,3%. Aisha: 60% × 10/38 = 15,79%, plus 13,33% înseamnă 29,1%."
      - "**Rotunjește și verifică.** Procentele întregi se scriu și se discută mai ușor, așa că 38,6% devine 39%, 32,3% devine 32%, iar 29,1% devine 29%. Verifică dacă 39 + 32 + 29 dă 100. Dacă rotunjirea ajunge la 99 sau 101, grupul hotărăște a cui cifră se mută cu un punct."
  - heading: "Luna din apartament, citită"
    body: "Chiria la 39%, 32% și 29% înseamnă 760,50 £, 624,00 £ și 565,50 £. Priya a plătit proprietarului, așa că pe toată luna i se datorează 1.142,50 £, în timp ce Tom datorează 566,00 £, iar Aisha 576,50 £. Side Badger sugerează două plăți, ambele către Priya."
  - heading: "Configurează în Side Badger"
    body: "O seară, din care cea mai mare parte se duce pe discuția despre cele 40%."
    items:
      - "**Fă grupul.** Pe panou alege **Creează Grup** și numește-l după apartament. Alege **Invită pe alții** și trimite linkul sau codul QR. Fiecare se autentifică sau își creează un cont gratuit și alege numele sub care vrea să apară în acest grup."
      - "**Adaugă chiria.** Alege **Adaugă Cheltuială**. Introdu descrierea și suma, iar la **Cine a plătit?** alege persoana care a plătit proprietarul. Ține-i pe toți trei la **Împarte între**, apoi la **Cum se împarte** alege **Procentaj** și scrie 39, 32 și 29. Formularul te avertizează dacă procentele nu dau împreună 100. Alege **Salvează Cheltuiala**."
      - "**Adaugă facturile.** Energia și internetul sunt cheltuieli separate, cu propriii plătitori. Lasă **Cum se împarte** pe **Egal**."
      - "**Copiază-o luna viitoare.** Deschide chiria lunii trecute și alege **Copiază cheltuiala**. Copia păstrează plătitorul, suma și împărțirea și ia data de azi. Schimbă suma dacă s-a schimbat chiria, apoi alege **Creează copie**."
      - "**Vezi cine cui datorează.** Secțiunea **Solduri** o arată. Plătiți-vă unii altora cum preferați, apoi înregistrați plata la **Decontează**."
  - heading: "Camere cu baie proprie, debarale și cine pleacă"
    items:
      - "**Camere cu baie proprie și debarale.** Suprafața este un punct de pornire. O cameră cu propria baie valorează mai mult decât aceeași suprafață fără ea, iar o debara în care încap un pat și un scaun optimist valorează mai puțin. Ajustează procentele de comun acord, verifică dacă tot dau 100 și scrie cifrele finale undeva unde le vede toată casa."
      - "**Cineva pleacă la mijlocul lunii.** Calculează cât datorează fiecare pentru luna aceea și introdu chiria lunii respective cu **Sume exacte** în loc de **Procentaj**. Sumele trebuie să dea împreună chiria. Fă asta înainte să plece. Nimeni nu poate părăsi un grup cât timp datorează sau i se datorează bani, iar o cheltuială la care participă cineva care a plecat devine doar pentru citire."
      - "**Se mută cineva nou.** Măsoară din nou, refă socotelile cu mărimile noilor camere și folosește noile procente de la următoarea chirie. Lunile anterioare rămân cum erau."
  - heading: "Ce nu face Side Badger aici"
    items:
      - "Nu îți măsoară camerele și nu alege procentele. Suprafețele și cele 40% rămân de stabilit de către grup."
      - "Nu are facturi recurente, așa că copiezi chiria lunii trecute de fiecare dată."
      - "Nu mută niciodată bani și nu plătește proprietarul. Vă plătiți unii altora cum preferați și înregistrați plata."
      - "Nu știe ce scrie în contractul tău de închiriere. Ține evidența între oamenii din grup."
