meta:
  title: "방 크기별로 월세 나누는 방법 | 사이드 배저"
  description: "방이 크면 몫도 큽니다. 공용 공간을 먼저 떼어 놓고, 나머지를 바닥 면적으로 나눠 비율을 한 번만 입력하세요. 룸메이트 세 명의 계산식을 보여 드립니다."
h1: "방 크기별로 월세 나누는 방법"
navLabel: "방 크기별 월세"
lead: "월세에서 모두가 쓰는 공용 공간 몫을 먼저 정해 똑같이 나누고, 나머지는 각 침실의 바닥 면적에 따라 나누세요. 정수 퍼센트로 반올림해서 사이드 배저의 월세 지출에 한 번만 입력하고, 매달 그 지출을 복사하면 됩니다."
cta:
  heading: "월세는 한 번만 입력하세요"
  body: "무료 계정을 만들고, 집 그룹을 시작하고, 합의한 비율로 월세를 입력하세요. 다음 달은 복사하면 끝입니다. 먼저 둘러보고 싶다면 [사용 방법](page:how-it-works)이나 [무료로 제공되는 것](page:pricing)을 보세요."
sections:
  - heading: "세 사람, 집 하나, 말다툼 하나"
    body: "Priya, Tom, Aisha는 월 £1,950짜리 집을 함께 씁니다. 1년 동안은 쉬우니까 셋이 똑같이 나눴어요. 그러다 Aisha가 자기 방을 재 봤습니다. Priya의 방은 16 m², Tom의 방은 12 m², Aisha의 방은 10 m²였으니, Aisha는 Priya보다 3분의 1 넘게 작은 방에 Priya와 같은 금액을 내고 있었던 거예요. 누가 무리한 요구를 한 건 아니었습니다. 다만 아무도 계산을 해 보지 않았을 뿐이죠. 세 사람은 배달 음식을 먹으며 먼저 규칙 하나에 합의했습니다. 월세의 40%는 셋 다 쓰는 주방, 욕실, 거실 값이라는 것입니다."
  - heading: "계산 방법, 식을 전부 보여 드립니다"
    body: "네 단계, 줄자 하나, 휴대폰 계산기 하나면 됩니다."
    items:
      - "**공용 부분을 먼저 떼어 놓으세요.** 모두가 쓰는 공간에 해당하는 월세의 몫을 그룹이 합의합니다. 이 집은 40%이고, 세 사람이 나누면 한 사람당 13.33%입니다."
      - "**나머지는 바닥 면적으로 나누세요.** 나머지 60%는 침실 크기에 따라 나뉩니다. 침실을 모두 합하면 38 m²(16 + 12 + 10)이고, Priya의 몫은 60% × 16/38, 즉 25.26%입니다."
      - "**두 몫을 더하세요.** Priya: 25.26% + 13.33% = 38.6%. Tom: 60% × 12/38 = 18.95%에 13.33%를 더하면 32.3%. Aisha: 60% × 10/38 = 15.79%에 13.33%를 더하면 29.1%."
      - "**반올림하고 확인하세요.** 정수 퍼센트가 입력하기도 따져 보기도 쉬우니, 38.6%는 39%, 32.3%는 32%, 29.1%는 29%가 됩니다. 39 + 32 + 29가 100인지 확인하세요. 반올림한 합이 99나 101이 되면, 누구의 숫자를 1포인트 옮길지 그룹이 합의합니다."
  - heading: "이 집의 한 달 살펴보기"
    body: "월세를 39%, 32%, 29%로 나누면 £760.50, £624.00, £565.50입니다. Priya가 집주인에게 월세를 냈으니 한 달 전체로 보면 Priya는 £1,142.50를 받아야 하고, Tom은 £566.00를, Aisha는 £576.50를 내야 합니다. 사이드 배저는 결제 두 건을 제안하며, 둘 다 Priya에게 갑니다."
  - heading: "사이드 배저에서 설정하기"
    body: "저녁 한 번이면 충분합니다. 시간은 대부분 40%를 두고 의견을 나누는 데 들어가겠지만요."
    items:
      - "**그룹 만들기.** 대시보드에서 **그룹 만들기**를 누르고 집 이름으로 그룹 이름을 붙이세요. **다른 사람 초대**를 눌러 링크나 QR 코드를 보냅니다. 모두 로그인하거나 무료 계정을 만들고, 이 그룹에서 보일 이름을 고릅니다."
      - "**월세 추가하기.** **비용 추가**를 누르세요. 설명과 금액을 입력하고, **누가 지불했나요?**에서 집주인에게 낸 사람을 고릅니다. **분할 대상**에는 세 사람을 모두 그대로 두고, **분할 방법**에서 **백분율**을 고른 다음 39, 32, 29를 입력하세요. 합이 100이 아니면 양식이 알려 줍니다. **비용 저장**을 누르세요."
      - "**공과금 추가하기.** 전기·가스 요금과 인터넷은 각자 결제자가 다른 별도 지출입니다. **분할 방법**은 **균등**으로 두세요."
      - "**다음 달에 복사하기.** 지난달 월세를 열고 **비용 복사**를 누르세요. 복사본은 결제자, 금액, 분할 방식을 그대로 가져오고 날짜는 오늘로 정해집니다. 월세가 바뀌었다면 금액을 바꾸고 **복사본 만들기**를 누르세요."
      - "**누가 누구에게 빚졌는지 확인하기.** **잔액** 섹션에서 볼 수 있습니다. 원하는 방법으로 서로 지불한 다음, **정산하기**에서 결제를 기록하세요."
  - heading: "욕실 딸린 방, 아주 작은 방, 이사 나가는 사람"
    items:
      - "**욕실 딸린 방과 아주 작은 방.** 바닥 면적은 출발점일 뿐입니다. 자기 욕실이 있는 방은 같은 면적이어도 없는 방보다 값어치가 높고, 침대 하나와 들어가길 바라며 놓은 의자 하나가 겨우 들어가는 작은 방은 값어치가 낮습니다. 합의에 따라 비율을 조정하고, 합이 여전히 100인지 확인한 뒤, 최종 숫자를 집 사람 모두가 볼 수 있는 곳에 적어 두세요."
      - "**한 달 중간에 누가 이사 나갈 때.** 그달에 각자 내야 할 금액을 계산해서, 그달 월세는 **백분율** 대신 **정확한 금액**으로 입력하세요. 금액의 합은 월세와 같아야 합니다. 떠나기 전에 하세요. 줄 돈이나 받을 돈이 있는 동안에는 누구도 그룹을 나갈 수 없고, 나간 사람이 포함된 지출은 읽기 전용이 됩니다."
      - "**새로 이사 올 때.** 방을 다시 재고 새 방 크기로 계산을 새로 해서, 다음 월세부터 새 비율을 쓰세요. 이전 달은 그대로 남습니다."
  - heading: "이 경우 사이드 배저가 하지 않는 일"
    items:
      - "방을 재 주지도, 비율을 정해 주지도 않습니다. 바닥 면적과 40%는 그룹이 합의할 몫입니다."
      - "반복 청구서가 없으므로 매번 지난달 월세를 복사합니다."
      - "돈을 옮기지 않으며 집주인에게 대신 내 주지도 않습니다. 원하는 방법으로 서로 지불하고 기록하세요."
      - "임대 계약서에 뭐라고 적혀 있는지는 알지 못합니다. 그룹에 속한 사람들 사이의 계산만 기록합니다."
exampleAfter: 2
