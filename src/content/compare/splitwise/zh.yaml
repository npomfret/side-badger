meta:
  title: "Side Badger 与 Splitwise：免费功能对比 | Side Badger"
  description: "公平对比一款免费的 Splitwise 替代品。收据扫描、货币换算和无广告在这里不花钱，我们也列出 Splitwise 做得更好的地方。"
h1: "Side Badger 与 Splitwise：免费功能对比"
navLabel: Side Badger 与 Splitwise
lead: "你们群组里多半有人说过“直接用 Splitwise 吧”。有道理。Side Badger 是一款免费的网页应用，有收据扫描、货币换算和无广告，不必订阅就能用。哪一个更适合你们，取决于群组需要什么，所以这里做了对比，Splitwise 一侧的内容只取自 Splitwise 自己的页面。"
cta:
  heading: 在你们下一笔共同账单上试试
  body: "创建免费账户，建一个群组，添加一笔真实的支出。如果不适合你，你也只花了几分钟，而不是一份订阅。"
asOf: 2026-10-21
asOfNote: "我们在 {date} 读过 Splitwise 自己的页面，免得你再去读，这里关于 Splitwise 的一切都来自这些页面。表格的每一行都链接到它的来源。方案会变，所以我们每季度复查一次，如果 Splitwise 的页面与本页不一致，请以它们为准。"
