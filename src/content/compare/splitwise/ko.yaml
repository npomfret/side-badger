meta:
  title: "사이드 배저 vs Splitwise: 무료 기능 비교 | 사이드 배저"
  description: "무료 Splitwise 대안을 공정하게 비교했어요. 영수증 스캔, 통화 환산, 광고 없음은 여기서 무료이고, Splitwise가 더 잘하는 점도 정리했습니다."
h1: "사이드 배저 vs Splitwise: 무료 기능 비교"
navLabel: "사이드 배저 vs Splitwise"
lead: "그룹의 누군가는 아마 “그냥 Splitwise 쓰자”고 말했을 거예요. 맞는 말이긴 해요. 사이드 배저는 영수증 스캔, 통화 환산, 광고 없음을 갖춘 무료 웹 앱이고, 이 기능들을 열기 위한 구독도 없습니다. 어느 쪽이 우리 그룹에 맞는지는 그룹에 필요한 것에 달려 있으니, Splitwise 쪽 내용은 Splitwise 자체 페이지에서만 가져와 비교해 보았어요."
cta:
  heading: "다음 공동 비용으로 써 보세요"
  body: "무료 계정을 만들고, 그룹을 만들고, 실제 지출 하나를 추가해 보세요. 맞지 않더라도 구독료가 아니라 몇 분을 쓴 것뿐이에요."
asOf: 2026-10-21
asOfNote: "여러분이 직접 읽지 않아도 되도록 {date}에 Splitwise 자체 페이지를 읽었고, 여기 적힌 Splitwise 관련 내용은 모두 그 페이지에서 가져왔습니다. 표의 각 행은 출처로 연결돼요. 요금제는 바뀔 수 있어 분기마다 다시 확인하며, Splitwise의 페이지가 이 페이지와 다르면 Splitwise 쪽을 믿으세요."
