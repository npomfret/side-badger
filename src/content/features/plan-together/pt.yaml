sections:
  - heading: "Comentários e reações, ao lado dos números"
    body: "Cada despesa tem a sua própria conversa de comentários, tal como o grupo, cada lista e cada sondagem. Pergunta porque custou tanto o táxi na própria despesa do táxi, e não numa conversa a que ninguém volta atrás. Junta uma fotografia do recibo ou um PDF da reserva e reage com polegar para cima, coração, riso, uau, tristeza ou celebração, em despesas, pagamentos e comentários. Celebra um pagamento quando ele chega. É o mais perto de uma salva de palmas que o Side Badger consegue."
  - heading: "Questiona uma despesa sem começar uma discussão"
    body: "Quando o grupo tem as perguntas sobre despesas ativadas, qualquer pessoa incluída numa despesa pode escolher **Tenho uma pergunta** e dizer porquê. A pergunta fica publicada como comentário na despesa, a despesa ganha um selo de **Questionado** e a despesa inteira sai dos saldos de todos até a pergunta ser resolvida."
    items:
      - "**Ativar.** Vêm desligadas por defeito. Um administrador ativa **Permitir perguntas sobre despesas** nas definições do grupo, em **Funcionalidades**."
      - "**Fechar uma pergunta.** Quem perguntou, ou um administrador, escolhe **Fechar pergunta**. Se várias pessoas questionaram a mesma despesa, ela volta aos saldos quando a última pergunta for fechada."
      - "**Editar a despesa.** Quando uma despesa é editada, uma pergunta em aberto passa para a nova versão para todos os que ainda têm uma parte nela. Quem a edição deixar de fora vê a sua pergunta terminar com a versão antiga, por isso não há nada que tenha de fechar."
      - "**Encontrar as perguntas.** A lista de despesas tem um filtro **Apenas questionado**. Isto não é um passo de aprovação: só ficam retidas as despesas que alguém questiona, e todas as outras contam assim que são adicionadas."
  - heading: "Como uma pergunta se resolve"
    body: "O Tom adiciona 45 £ de vinho da festa, divididos pelos três colegas de casa. A Aisha não bebeu, por isso levanta uma pergunta, e enquanto ela estiver aberta o vinho não conta para ninguém. A casa concorda que o vinho é do Tom e da Priya, por isso o Tom edita a divisão para os dois. A Aisha já não está na despesa, por isso a pergunta dela termina com a versão anterior, que fica guardada, e o vinho volta aos saldos logo, a 22,50 £ cada um em vez de 15 £ cada um. Se a Aisha tivesse ficado na despesa, a pergunta dela teria passado para a nova versão e esperaria que ela, ou um administrador, a fechasse. Abaixo, os 48 £ da Aisha são 28 £ das compras e 20 £ da limpeza, e os 10,50 £ da Priya são a sua parte de 70,50 £ (28 £, 20 £ e 22,50 £) menos os 60 £ que pagou. Uma discussão muito de [colegas de casa](page:use-case/housemates). Para saber como formular uma pergunta, vê [o que fazer quando alguém contesta uma despesa partilhada](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Listas partilhadas, para as compras"
    body: "Começa uma lista no grupo, dá-lhe um nome como Lista de compras, adiciona itens e vai riscando-os. Arrasta os itens para uma ordem melhor, vê a contagem do progresso subir e comenta na lista quando alguém comprar o leite de aveia errado. Arquiva uma lista terminada para a arrumares (**Mostrar arquivados** traz-a de volta), ou copia uma lista para a reutilizares. Mantém a lista de compras partilhada ao lado das contas das compras, para a lista dizer o que comprar e a despesa dizer quanto custou. Quem pode criar e editar listas depende das permissões do grupo, que [grupos e permissões](page:feature/groups-and-permissions) explica."
  - heading: "Sondagens, anónimas se quiseres"
    body: "Pergunta ao grupo algo que decide a conta, como qual a villa, quanto gastar no presente ou se o passeio de barco vale a pena. Uma sondagem tem uma pergunta e de duas a dez opções. Tu escolhes quantos votos cada pessoa tem, de uma escolha única até dez, e se a votação é anónima. A **Votação anónima** esconde quem votou em quê, e não pode ser alterada depois de entrar o primeiro voto. As pessoas podem alterar ou retirar o seu voto até a sondagem fechar, e podes reabri-la se o grupo se arrepender. Escolher a villa é exatamente de que são feitas as [viagens em grupo](page:use-case/group-trips), e combinar o orçamento do presente é um clássico dos [eventos e celebrações](page:use-case/events-and-celebrations)."
  - heading: "O histórico de atividade, para nada mudar em silêncio"
    body: "Cada grupo tem um histórico de atividade, e o sino de notificações reúne num só sítio a atividade de todos os teus grupos. Adiciona uma despesa e todos a veem logo, sem atualizar a página, e o histórico mostra o que mudou e quem mudou. Isso inclui despesas adicionadas, editadas ou apagadas, perguntas levantadas e fechadas, comentários, alterações a listas e sondagens e pagamentos registados."
  - heading: "Notificações push, se quiseres"
    body: "As notificações push são opcionais. Ativa-as nas **Definições** da tua conta, em **Notificações**, e o teu dispositivo avisa-te quando houver nova atividade nos teus grupos, como uma nova despesa ou um comentário. Cada dispositivo é ativado em separado, e o teu navegador pede primeiro permissão. No iPhone ou iPad só funcionam na app adicionada ao ecrã principal, o que a página da [app web](page:feature/web-app) explica. Trata-as como uma comodidade, não como uma promessa, porque a entrega não é garantida."
limits:
  heading: "Limites"
  items:
    - "Os comentários, as listas e as sondagens são para o dinheiro do grupo. Os [termos](page:terms) pedem que tudo o que for publicado diga respeito às finanças do grupo, por isso este é um sítio para planear os gastos, não uma conversa geral nem uma app de tarefas."
    - "Um comentário pode ter até 500 caracteres, com até três anexos que sejam imagens ou PDF de até 5 MB cada. Só quem escreveu um comentário o pode apagar."
    - "As perguntas sobre despesas vêm desligadas por defeito, e um administrador ativa-as em cada grupo. Só as pessoas incluídas numa despesa a podem questionar, desligar a funcionalidade apaga todas as perguntas em aberto e ninguém pode sair do grupo enquanto uma despesa de que faz parte tiver uma pergunta em aberto."
    - "Um grupo pode ter até 100 listas, cada uma com até 200 itens de até 500 caracteres. As permissões do grupo decidem quem pode criar, editar e apagar listas, e um grupo bloqueado não permite alterações."
    - "Um grupo pode ter até 50 sondagens, cada uma com duas a dez opções e até dez votos por pessoa. As sondagens não têm prazo e não fecham sozinhas."
    - "O histórico de atividade é guardado durante 90 dias."
    - "As notificações push são opcionais em cada conta e em cada dispositivo. Precisam de um navegador que as suporte e da tua permissão, no iPhone e no iPad só funcionam a partir da app adicionada ao ecrã principal, e a entrega não é garantida. Não há alertas por e-mail nem por SMS sobre a atividade e não há lembretes de pagamento, por isso andar atrás de um pagamento continua a ser contigo."
useCasesHeading: "Onde planear em conjunto ajuda"
faq:
  heading: "Perguntas"
  items:
    - q: "Os votos podem ser anónimos?"
      a: "Sim. Ativa a **Votação anónima** ao criar a sondagem e ela esconde quem votou em quê. Decide antes do primeiro voto, porque depois não se pode alterar."
    - q: "Uma sondagem pode fechar sozinha?"
      a: "Não. Uma sondagem não tem prazo, por isso quem a criou escolhe **Encerrar sondagem** quando o grupo tiver decidido. Se o grupo se arrepender, **Reabrir sondagem** traz-a de volta."
    - q: "Quantos itens cabem numa lista?"
      a: "Até 200 itens por lista e até 100 listas por grupo. Cada item pode ter até 500 caracteres, o que dá muito leite de aveia."
    - q: "Quem pode fechar uma pergunta, e o que acontece entretanto à despesa?"
      a: "Quem perguntou, ou um administrador do grupo. Enquanto uma pergunta está aberta, a despesa inteira fica fora dos saldos de todos. Volta a entrar quando a última pergunta em aberto sobre ela for fechada, ou quando uma edição tirar da despesa a pessoa que perguntou."
    - q: "Posso usar listas e comentários como app de tarefas ou conversa de grupo?"
      a: "Não. Os comentários, as listas e as sondagens são para o dinheiro do grupo, que é o que os [termos](page:terms) pedem. Pensa em listas de compras, sondagens de orçamento e “porque é que isto custa 45 £?”."
    - q: "O Side Badger vai enviar-me e-mails sobre a atividade?"
      a: "Não. Não há alertas por e-mail nem por SMS sobre a atividade. Podes ativar as notificações push em cada dispositivo, e o sino de notificações na app mostra o que há de novo."
