sections:
  - heading: "Sarafu moja kwa kikundi kizima"
    body: "Ikiwa kikundi chenu hakitaki kufikiria hili, chagua sarafu ya kikundi na fomu itabadilisha kila gharama mpya kuwa hiyo, kwa kiwango ambacho bado unaweza kuona na kubadilisha. Hii inatumika kwa gharama mpya na zilizonakiliwa tu. Uhariri na gharama zilizopo hubaki kama zilivyo, kwa hivyo hakuna kilichorekodiwa kinachobadilika bila wewe kujua."
  - heading: "Unadaiwa euro, lipa kwa pauni"
    body: "Ulilipa kwa yen, unamalizia kwa pauni? Sawa tu. Unaporekodi malipo unaweza kuyabadilisha pia, kwa hivyo anayedaiwa euro anaweza kulipa kwa pauni na salio la euro bado linatoka sawa. Lipaneni mtakavyo, kisha rekodi."
  - heading: "Kanuni za kikundi"
    body: "Punguza kikundi kwa sarafu mnazotumia kweli, na weka chaguo-msingi ili fomu ifunguke kwenye sarafu sahihi. Likizo nchini Ureno haihitaji chaguo nyingine 139 kando ya bili ya chakula cha jioni, na [harusi nje ya nchi](page:use-case/events-and-celebrations) huenda inahitaji mbili."
limits:
  heading: "Vikomo"
  items:
    - "Kiwango hurekebishwa gharama inapohifadhiwa. Gharama za zamani hazipimwi upya kamwe."
    - "Side Badger huchukua kiwango cha sasa pale inapowezekana. Si kila jozi ina uhakika wa kupata kimoja, na unaweza kuandika kiwango mwenyewe wakati wowote."
    - "Ubadilishaji wa kiotomatiki wa kikundi unatumika kwa gharama mpya na zilizonakiliwa tu, si kwa uhariri wala gharama zilizopo."
    - "Kila gharama ina kikomo cha 999,999.99 katika sarafu yake yenyewe."
    - "Kuna sarafu 140. Sarafu za kidijitali na metali hazimo."
    - "Side Badger hurekodi malipo. Haisogezi wala kubadilisha pesa kamwe."
useCasesHeading: "Mahali ambapo hii inasaidia"
faq:
  heading: "Maswali"
  items:
    - q: "Mnatumia kiwango gani cha kubadilisha fedha?"
      a: "Kiwango cha sasa cha kubadilisha fedha, kinachochukuliwa unapoweka gharama pale kinapopatikana. Unaweza kukibadilisha kiwe kiwango ulichopata kwa kweli, na kiasi kilichobadilishwa kinasasishwa."
    - q: "Je, gharama za zamani hupimwa upya?"
      a: "Hapana. Kiwango hurekebishwa gharama inapohifadhiwa, kwa hivyo salio halihami kwa sababu soko lilihama."
    - q: "Je, mnasaidia crypto?"
      a: "Hapana. Kuna sarafu 140, na sarafu za kidijitali hazimo."
    - q: "Kwa nini siwezi kuweka rupiah 2,000,000 za Indonesia?"
      a: "Kila gharama ina kikomo cha 999,999.99 katika sarafu yake yenyewe. Iweke kwa sarafu nyingine na ubadilishe, au igawe kuwa gharama mbili."
    - q: "Je, ubadilishaji una gharama yoyote?"
      a: "Hapana. Kubadilisha ni bure, kama Side Badger yote. Tazama [bei](page:pricing)."
    - q: "Je, lazima nibadilishe?"
      a: "Hapana. Sarafu hubaki tofauti isipokuwa wewe au kikundi chako mchague kubadilisha, na kila sarafu hupata orodha yake fupi ya malipo."
