meta:
  title: "تطبيق لتقسيم الفواتير بلا تنزيل | Side Badger"
  description: "هاتفك ممتلئ، نفهم ذلك. يعمل Side Badger في متصفحك، بلا متجر تطبيقات ولا تنزيل. أضفه إلى شاشتك الرئيسية فيُفتح كتطبيق."
h1: "لا متجر تطبيقات. لا تنزيل. ومع ذلك يبدو كتطبيق"
navLabel: "تطبيق الويب"
lead: "يعيش Side Badger في متصفحك. لا متجر تطبيقات تبحث فيه ولا شيء تنزّله أولاً. سجّل الدخول من هاتف أو كمبيوتر، وقسّم المصروفات عبر الإنترنت مع مجموعتك، وأضفه إلى شاشتك الرئيسية أو إلى Dock حين تريده على بعد لمسة واحدة."
cta:
  heading: "افتحه. سجّل الدخول. ابدأ مجموعة."
  body: "أنشئ حساباً، وابدأ مجموعة، وأضف أول مصروف، كل ذلك من المتصفح المفتوح لديك أصلاً. تريد الجولة أولاً؟ انظر [كيف يعمل](page:how-it-works)، أو اطّلع على [ما تشمله الخدمة المجانية](page:pricing)."
problem:
  heading: "هاتفك ممتلئ. نفهم ذلك."
  body: "فيه في مكان ما أربعة آلاف صورة للغروب نفسه وتحذير من امتلاء التخزين تتجاهله منذ الربيع. وآخر ما يحتاجه هو تطبيق إضافي لمجرد تقسيم عشاء واحد. لذلك Side Badger تطبيق ويب. يعمل في متصفح حديث على هاتف أو كمبيوتر. وعلى الهاتف يستخدم تخطيطات للجوال، مع صفحة المجموعة مقسّمة إلى علامات تبويب وعناصر تحكم مناسبة للمس. وبعض الإضافات، مثل إضافته إلى شاشتك الرئيسية، تعتمد على متصفحك، ونحن نذكر أين."
workflow:
  heading: "من علامة تبويب في المتصفح إلى الشاشة الرئيسية في ثلاث خطوات"
  steps:
    - title: "افتحه وسجّل الدخول"
      body: "افتح Side Badger في متصفحك وسجّل الدخول. كل ما تحتاجه عنوان بريد إلكتروني وكلمة مرور، وتتحقق من البريد قبل أن تتمكن من إضافة أي شيء. وكل من في المجموعة يحتاج إلى حساب، فمن تدعوهم سيفعلون الشيء نفسه."
    - title: "أضفه إلى شاشتك الرئيسية أو Dock"
      body: "بعد تسجيل الدخول يعرض التطبيق أن يثبّت نفسه. تجد زر **تثبيت** حيث يسمح متصفحك، و**أرني كيف** حيث لا يسمح. فاتتك الفرصة، أو قلت لا؟ تجد في **الإعدادات** المساعدة نفسها تحت **إضافة إلى الشاشة الرئيسية أو Dock**. وعلى iPhone أو iPad تعرض الإعدادات خطوات iPhone أولاً وتضع الأجهزة الأخرى تحت **أجهزة أخرى**. وفي الحالتين يُفتح التطبيق بعد ذلك في نافذة خاصة به."
      shot: S20
      shotAlt: "قسم «إضافة إلى الشاشة الرئيسية أو Dock» في الإعدادات، مع خطوات إضافة التطبيق إلى جهاز"
    - title: "فعّل الإشعارات، إن أردتها"
      body: "الإشعارات معطّلة إلى أن تفعّلها، ويُفعَّل كل جهاز على حدة. استخدم زر **تفعيل** الذي يعرضه جرس الإشعارات، أو مفتاح **الإشعارات الفورية** في **الإعدادات**. وعلى iPhone أو iPad افتح التطبيق من الشاشة الرئيسية أولاً. فهذا هو المكان الوحيد الذي تعمل فيه الإشعارات هناك."
      shot: S19
      shotAlt: "القائمة المنسدلة للإشعارات مفتوحة، تعرض النشاط الأخير في المجموعة"
options:
  heading: "كيف تضيفه، جهازاً جهازاً"
  items:
    - title: "iPhone وiPad"
      body: "اضغط على زر «مشاركة»، وهو مربع يشير سهم منه إلى الأعلى. إذا لم تجده، فاضغط على النقاط الثلاث (•••) أولاً، ثم على «مشاركة». مرّر للأسفل واضغط على **إضافة إلى الشاشة الرئيسية**. أبقِ **فتح كتطبيق ويب** مفعّلاً، ثم اضغط على **إضافة**. وإذا فُتح رابط داخل تطبيق آخر، فافتح الصفحة في Safari أولاً، لأن ذلك المتصفح المدمج لا يستطيع إضافتها."
    - title: "Android"
      body: "افتح قائمة المتصفح واختر **إضافة إلى الشاشة الرئيسية** أو **تثبيت التطبيق**."
    - title: "Chrome أو Edge على الكمبيوتر"
      body: "افتح قائمة المتصفح واختر خيار تثبيت هذا الموقع كتطبيق. فيحصل بعد ذلك على نافذته الخاصة وأيقونته الخاصة."
    - title: "Safari على Mac"
      body: "اختر **ملف**، ثم **إضافة إلى Dock**."
sections:
  - heading: "الإشعارات، فقط إن طلبتها"
    body: "الإشعارات الفورية اختيارية. فعّلها فيصلك إشعار حين يكون هناك نشاط جديد في مجموعاتك، مثل أن يضيف أحدهم مصروفاً أو يترك تعليقاً أو يسجّل دفعة. وتُفعَّل جهازاً جهازاً، من جرس الإشعارات أو من **الإعدادات**، ويمكنك إيقافها من هناك أيضاً. وتحتاج إلى متصفح يدعمها وإلى إذنك. وإذا كان متصفحك قد حظرها للموقع، فاسمح بها في إعدادات المتصفح أولاً. وعلى iPhone أو iPad لا تعمل إلا من التطبيق المضاف إلى الشاشة الرئيسية، لا من علامة تبويب في المتصفح. ووصولها غير مضمون، فاعتبر الإشعار تلميحاً لا وعداً. وعمّا يظهر في السجل، انظر [التخطيط معاً](page:feature/plan-together)."
  - heading: "تحديثات فورية، بلا زر تحديث"
    body: "أضف مصروفاً فيراه الجميع على الفور، مع ما تغيّر ومن غيّره. تحتفظ كل مجموعة بسجل نشاط، ويعرض جرس الإشعارات النشاط في كل مجموعاتك. لا يضطر أحد إلى أن يسألك هل رأيت ما أضفته للتو. إنه على شاشته."
  - heading: "39 لغة، ولكل شخص لغته"
    body: "استخدم Side Badger بـ 39 لغة، من بينها العربية والفارسية والأردية التي تُكتب من اليمين إلى اليسار. يختار كل شخص في المجموعة لغته، فتكون صفحة المجموعة نفسها بالعربية لشخص وبالإنجليزية للتالي. والشيء الوحيد الذي يجب أن تتفق عليه المجموعة هو الأرقام."
  - heading: "مصمَّم لأكثر من نوع من المستخدمين"
    body: "صُمّم Side Badger مع وضع مستخدمي لوحة المفاتيح وقارئات الشاشة في الاعتبار. وألوان الأعضاء تأتي مع أنماط، فلا تضطر إلى التمييز بين الأخضر والأحمر."
    items:
      - "روابط تخطٍّ، ليقفز مستخدمو لوحة المفاتيح مباشرة إلى المحتوى."
      - "النوافذ المنبثقة تدير تركيز لوحة المفاتيح."
      - "عناصر التحكم لها تسميات، لقارئات الشاشة."
      - "تنعكس التخطيطات في اللغات التي تُكتب من اليمين إلى اليسار."
limits:
  heading: "ما لا يفعله تطبيق الويب"
  items:
    - "لا استخدام دون اتصال. يحتاج Side Badger إلى اتصال، فلن يفتح مجموعتك في طائرة بلا واي فاي."
    - "لا يوجد تطبيق في متجر تطبيقات، ولا تطبيق أصلي لـ iPhone أو Android. Side Badger تطبيق ويب، وإضافته إلى شاشتك الرئيسية أو Dock هي طريقة الحصول على النسخة التي تشبه التطبيق."
    - "تعتمد إضافته إلى الشاشة الرئيسية أو Dock على متصفحك. تختلف أسماء القوائم بين المتصفحات والإصدارات، وبعض المتصفحات لا توفره."
    - "الإشعارات الفورية اختيارية لكل جهاز، وتحتاج إلى متصفح يدعمها وإلى إذنك. وعلى iPhone أو iPad لا تعمل إلا من التطبيق المضاف إلى الشاشة الرئيسية. ووصولها غير مضمون."
    - "لا توجد تنبيهات بالبريد الإلكتروني أو بالرسائل النصية ولا تذكيرات بالدفع. يظهر النشاط الجديد في التطبيق، وفي صورة إشعارات فورية إن فعّلتها. ومطالبة الناس بالدفع تبقى عليك."
    - "يُحفظ النشاط 90 يوماً."
    - "تسجّل الدخول بعنوان بريد إلكتروني وكلمة مرور. لا يوجد تسجيل دخول عبر Google أو Apple، ويجب أن يكون عمرك 18 عاماً أو أكثر."
    - "لا ندّعي أن Side Badger سهل الوصول بالكامل، ولا أنه يستوفي معياراً رسمياً لإمكانية الوصول. وإن اعترض شيء طريقك فأخبرنا من داخل التطبيق وسترى ردّنا هناك."
useCasesHeading: "حيث يفيد ألا تحتاج إلى تطبيق"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يوجد تطبيق Side Badger في متجر تطبيقات؟"
      a: "لا. Side Badger تطبيق ويب. تفتحه في متصفحك، ويمكنك إضافته إلى شاشتك الرئيسية أو Dock ليُفتح كتطبيق. ولا شيء لتنزّله من متجر تطبيقات."
    - q: "هل أستطيع تقسيم الفواتير دون تنزيل تطبيق؟"
      a: "نعم. افتح Side Badger في متصفح على هاتفك أو كمبيوترك، وسجّل الدخول، وابدأ مجموعة. وإضافته إلى شاشتك الرئيسية أو Dock اختيارية."
    - q: "هل يعمل دون اتصال؟"
      a: "لا. يحتاج Side Badger إلى اتصال، حتى لو أضفته إلى شاشتك الرئيسية أو Dock."
    - q: "لماذا لا تصلني إشعارات على iPhone؟"
      a: "على iPhone أو iPad لا تعمل الإشعارات إلا من التطبيق المضاف إلى الشاشة الرئيسية، لا من علامة تبويب في المتصفح. أضفه، وافتحه من أيقونة الشاشة الرئيسية، ثم فعّل الإشعارات في **الإعدادات**. ووصولها غير مضمون، فإن ضاع إشعار فسجل نشاط المجموعة ما زال يُظهر ما أُضيف."
    - q: "هل يجب أن أفعّل الإشعارات؟"
      a: "لا. هي معطّلة إلى أن تفعّلها، جهازاً جهازاً. وبدونها يظل النشاط الجديد يظهر في التطبيق، ويرى الجميع أي تغيير على الفور حين يكون التطبيق مفتوحاً لديهم."
    - q: "هل يحتاج كل من في المجموعة إلى حساب؟"
      a: "نعم. كل ما تحتاجه عنوان بريد إلكتروني وكلمة مرور، وتتحقق من البريد قبل أن تتمكن من إضافة أي شيء. وكل من ينضم إلى مجموعة يفعل الشيء نفسه، على أي هاتف أو كمبيوتر يشاء."
