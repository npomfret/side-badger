    - feature: Unapoitumia
      other: Programu za iPhone na Android, na wavuti.
      sideBadger: Kwenye kivinjari chako. Ingia, kisha iweke kwenye skrini ya kwanza na inafunguka kama programu. Haipo kwenye maduka ya programu.
      source: home
    - feature: Njia za kugawanya
      other: Kwa usawa, kwa kiasi kamili, kwa asilimia, kwa sehemu, kwa marekebisho au kwa kipengee.
      sideBadger: Kwa usawa, kwa kiasi kamili au kwa asilimia, na mlipaji mmoja kwa kila gharama. Si kwa sehemu wala kwa kipengee.
