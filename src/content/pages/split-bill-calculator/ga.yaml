faq:
  heading: "Ceisteanna"
  items:
    - q: "An bhfuil an t-áireamhán saor in aisce?"
      a: "Tá. Saor in aisce. Gan fógraí. Gan teorainneacha laethúla. Níl cuntas de dhíth ort ach an oiread."
    - q: "An sábhálann sé an méid a chlóscríobhaim?"
      a: "Ní shábhálann. Ní shábháiltear ná ní sheoltar aon rud áit ar bith. Chun do chuid figiúirí a choinneáil, úsáid Cóipeáil an nasc agus sábháil an nasc áit éigin."
    - q: "Cé atá in ann an nasc a chóipeálaim a fheiceáil?"
      a: "Duine ar bith a bhfuil sé aige. Tá na figiúirí sa nasc féin, i ndiaidh an #, mar sin ná roinn é ach leis na daoine ar chóir dóibh iad a fheiceáil."
    - q: "An mbogann sé airgead?"
      a: "Ní bhogann. Oibríonn sé amach cé ba chóir a íoc le cé, agus íocann sibh a chéile ar an gcaoi is fearr libh. Ní théann Side Badger i dteagmháil le d'airgead choíche ach an oiread. Féach [socraigh suas](page:feature/settle-up)."
    - q: "An féidir liom turas a íocadh i dhá airgeadra a roinnt?"
      a: "Ní féidir anseo, mar tá airgeadra amháin i ríomh. I ngrúpa, coinníonn gach airgeadra a iarmhéid féin. Féach [ilairgeadraí](page:feature/multiple-currencies)."
    - q: "Cad a tharlaíonn mura n-aontaíonn na méideanna leis an iomlán?"
      a: "Deir an t-áireamhán sin faoin gcostas agus ní thaispeánann sé aon toradh go dtí go n-aontaíonn siad. Caithfidh na suimeanna cruinne an t-iomlán a bhaint amach, agus caithfidh na céatadáin 100 a bhaint amach le chéile."
