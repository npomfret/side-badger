faq:
  heading: "Spurningar"
  items:
    - q: "Hvað ef einhver er með stærra herbergi en minni birtu?"
      a: "Gólfflötur er aðeins upphafspunktur, svo hópurinn getur komið sér saman um að hnika til. Taktu eitt eða tvö prósentustig af dimma herberginu, gefðu hinum þau og athugaðu að prósenturnar nái enn samtals 100. Side Badger geymir það sem þið komist að samkomulagi um og dæmir það ekki."
    - q: "Á að skipta reikningum eftir stærð herbergja líka?"
      a: "Yfirleitt ekki. Allir nota rafmagn og internet, svo jöfn skipting er einfaldari, eins og í dæminu hér að ofan. Ef einn meðleigjandi er heima allan daginn getur hópurinn komið sér saman um eitthvað annað, eins og nákvæmar upphæðir. [Skipting útgjalda](page:feature/split-expenses) fjallar um valkostina."
    - q: "Getum við breytt skiptingunni síðar?"
      a: "Já, fyrir ný útgjöld. Breyttu prósentunum þegar þú afritar leiguna og fyrri mánuðir haldast eins og þeir voru. Til að leiðrétta útgjald sem er þegar inni skaltu breyta því ef heimildir hópsins leyfa, og láta heimilið vita fyrst, því staðan breytist. Fyrri útgáfan er geymd."
