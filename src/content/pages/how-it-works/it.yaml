sections:
  - heading: 39 lingue, e pensato per più persone
    body: Usa Side Badger in 39 lingue, tra cui l'arabo, il persiano e l'urdu con scrittura da destra a sinistra. Ognuno nel gruppo può scegliere la propria, quindi la pagina del gruppo può essere in arabo per una persona e in inglese per la successiva. È pensato anche per chi usa la tastiera e gli screen reader, e i colori dei membri hanno anche dei motivi, così non devi distinguere il verde dal rosso.
faq:
  heading: Domande
  items:
    - q: Serve un account a tutti?
      a: Sì, uno gratuito. Ogni persona verifica la propria email prima di aggiungere qualsiasi cosa.
    - q: Esiste un'app?
      a: Funziona nel browser, e puoi aggiungerla alla schermata Home o al dock così si apre come un'app. Non c'è una versione negli store e non c'è la modalità offline.
    - q: Side Badger sposta denaro?
      a: No. Tiene il conto e suggerisce i pagamenti, e voi vi pagate come vi fa più comodo. Poi registrate il pagamento. Vedi [saldare i conti](page:feature/settle-up).
    - q: Qualcuno può andarsene con dei debiti?
      a: No. Nessuno può lasciare un gruppo finché deve o deve ricevere denaro, quindi prima salda.
    - q: Quante persone possono unirsi a un gruppo?
      a: Fino a 50 persone in un gruppo. Invitale con un link o un codice QR e attiva l'approvazione se vuoi che un admin faccia entrare ogni persona.
    - q: E i viaggi con più di una valuta?
      a: I saldi sono tenuti separati per ogni valuta. Vedi [più valute](page:feature/multiple-currencies).
