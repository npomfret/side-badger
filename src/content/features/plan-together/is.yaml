meta:
  title: "Sameiginlegir listar, kannanir og athugasemdir | Side Badger"
  description: "Skrifaðu athugasemdir við útgjöld, dragðu það skrýtna í efa, haltu innkaupalista og kjóstu um orlofshúsið. Skipuleggðu, skiptu svo. Ókeypis, án auglýsinga."
h1: "Skipuleggðu saman, skiptu á eftir"
navLabel: "Skipuleggja saman"
lead: "Innkaupalistinn og innkaupareikningurinn eru loksins farnir að talast við. Side Badger gefur hópnum stað til að ræða peningana bæði áður en þeim er eytt og eftir það, með athugasemdum við hvert útgjald, leið til að draga þau sem virðast röng í efa, sameiginlegum listum og könnunum fyrir stóru ákvarðanirnar. Svo [skiptirðu útgjöldum](page:feature/split-expenses) eins og venjulega."
cta:
  heading: "Skipuleggðu fyrst, skiptu svo"
  body: "Stofnaðu ókeypis aðgang, byrjaðu hóp og settu fyrsta listann, könnunina eða spurninguna við hlið peninganna. Ekki viss hvað gerist næst? Sjáðu [hvernig þetta virkar](page:how-it-works)."
problem:
  heading: "Spjallið er hér, reikningurinn þar"
  body: "Hópútgjöld lifa venjulega á tveimur stöðum. Tölurnar eru á einum og rifrildið um tölurnar í spjalli sem flettist upp og burt á þriðjudag. Innkaupalistinn er mynd af ísskáp. Orlofshúsið var valið með þumli upp frá flestum, líklega. Side Badger geymir skipulagið í hópnum, við hlið útgjaldanna sem það snýst um, svo það er athugasemd þar sem kostnaðurinn er, listi þar sem búðarferðin er, könnun fyrir stóru ákvörðunina og leið til að segja „bíddu, er þetta rétt?“ án þess að skrifa heila málsgrein. Allt snýst þetta um peninga hópsins, sem er einmitt tilgangur hópsins."
workflow:
  heading: "Frá orlofshúsakosningu að innkaupareikningi"
  steps:
    - title: "Berðu stóru ákvörðunina undir atkvæði"
      body: "Bættu við könnun fyrir ákvörðunina sem ræður reikningnum, eins og hvaða orlofshús verður fyrir valinu. Veldu tvo til tíu valkosti, segðu hve mörg atkvæði hver og einn fær og lokaðu henni þegar allir hafa kosið, þá er sigurvegarinn merktur."
      shot: S17
      shotAlt: "Lokuð könnun með sigurvalkostinn merktan og fjölda atkvæða við hvern valkost"
    - title: "Skrifaðu innkaupalistann saman"
      body: "Byrjaðu sameiginlegan lista, bættu við hlutum og hakaðu við þá þegar þeir komast í körfuna. Búðarferðin fer svo inn á eftir sem útgjald."
      shot: S16
      shotAlt: "Sameiginlegur innkaupalisti þar sem búið er að haka við suma hluti, með framvindutölu"
    - title: "Ræddu kostnaðinn þar sem hann býr"
      body: "Skrifaðu athugasemd við útgjaldið sjálft, hengdu kvittunina við og bregstu við með emoji. Samtalið helst við hlið tölunnar sem það snýst um."
      shot: S08
      shotAlt: "Útgjald með upplýsingum sínum, smámynd af kvittun, athugasemdaþræði og emoji-viðbrögðum"
    - title: "Dragðu það sem lítur undarlega út í efa"
      body: "Ef hópurinn hefur kveikt á spurningum um útgjöld getur hver sem tekur þátt í útgjaldi valið **Ég er með spurningu**. Útgjaldið helst utan stöðunnar þar til úr spurningunni er leyst."
      shot: S18
      shotAlt: "Útgjaldalisti með merkinu Dregið í efa og síunni Aðeins dregið í efa"
    - title: "Sjáðu hvað breyttist og hver breytti því"
      body: "Virkni hópsins og tilkynningabjallan sýna hvað er nýtt í öllum hópunum þínum. Ýtitilkynningar eru í boði ef þú vilt þær."
      shot: S19
      shotAlt: "Tilkynningavalmynd með lista yfir nýlega virkni"
