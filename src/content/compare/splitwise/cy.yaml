faq:
  heading: "Cwestiynau"
  items:
    - q: "Ydy Side Badger yn ddewis arall am ddim yn lle Splitwise?"
      a: "Ar gyfer rhannu biliau mewn grŵp, ydy. Mae sganio derbynebau, trosi arian cyfred a dim hysbysebion am ddim, heb gyfyngiadau dyddiol. Os oes angen ap brodorol, defnydd all-lein, treuliau cylchol neu daliadau y tu mewn i'r ap arnoch, mae Splitwise yn gwneud y rheini ac nid yw Side Badger yn eu gwneud."
    - q: "O ble mae manylion Splitwise yn dod?"
      a: "O dudalennau Splitwise ei hun: ei hafan, ei dudalen Pro a'i ganolfan gymorth. Mae pob rhes o'r tabl yn cysylltu â'r dudalen y daeth ohoni, ac mae'r dyddiad uwchben y tabl yn dweud pryd y gwnaethon ni eu darllen. Rydyn ni'n eu gwirio bob chwarter."
    - q: "Fydd Side Badger yn aros am ddim?"
      a: "Mae popeth yn Side Badger am ddim heddiw, a does dim haen daledig. Os bydd hynny'n newid, byddwn yn rhoi rhybudd i chi ymlaen llaw. Mae'r [dudalen brisiau](page:pricing) yn rhoi'r manylion."
    - q: "Oes rhaid i bawb yn fy ngrŵp newid?"
      a: "Oes. Mae angen cyfrif Side Badger am ddim ar bawb mewn grŵp, a gallan nhw ymuno gyda dolen neu god QR."
    - q: "Oes gan Side Badger ap symudol?"
      a: "Nid mewn siop apiau. Mae'n rhedeg yn eich porwr: mewngofnodwch ar eich ffôn, yna ychwanegwch ef at eich sgrin gartref fel ei fod yn agor fel ap. Mae [sut mae'n gweithio](page:how-it-works) yn dangos sut."
