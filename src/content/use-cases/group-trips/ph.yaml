faq:
  heading: Mga tanong
  items:
    - q: Puwede bang hindi isama ang mga nilaktawan ang hapunan?
      a: Oo. Piliin kung sino ang kasali sa bawat gastos at sila lang ang sisingilin dito.
    - q: Gumagana ba ito kapag walang signal?
      a: Hindi. Kailangan ng Side Badger ng koneksyon, kaya idagdag ang mga gastos pagbalik ninyo sa wifi.
    - q: Kailangan bang mag-install ng kahit ano ang lahat?
      a: Hindi. Gumagana ito sa browser. Ipadala ang invite link at sasali ang mga tao mula sa telepono nila.
    - q: Anong exchange rate ang ginagamit nito?
      a: Kasalukuyang exchange rate kapag inilagay mo ang gastos, o sarili mong rate kung iba ang nakuha mo. Nakapirmi ang rate kapag na-save ang gastos, kaya hindi kailanman muling binabalyuhan ang mga lumang gastos.
    - q: Puwede ba naming i-freeze ang grupo pagkatapos ng biyahe?
      a: Oo. Maaaring i-lock ng admin ang grupo para manatili ang mga numero.
    - q: May limitasyon ba sa halaga?
      a: Mayroon. 999,999.99 bawat gastos, sa sarili nitong pera.
