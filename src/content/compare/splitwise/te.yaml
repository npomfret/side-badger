sections:
  - heading: డబ్బు కబుర్లు, డబ్బు పక్కనే
    body: షేర్ చేసిన డబ్బుతో కబుర్లు, సందేహాలు, ప్లాన్లు వస్తాయి. Side Badger ఈ మూడింటినీ లెక్కల పక్కనే ఉంచుతుంది, కాబట్టి ఎవరూ చాట్‌లో వెనక్కి స్క్రోల్ చేయనక్కర్లేదు.
    items:
      - "**వ్యాఖ్యలు ఉండాల్సిన చోటే.** గ్రూప్ మీద, లేదా ఏ ఖర్చు, జాబితా, పోల్ మీదైనా వ్యాఖ్యానించండి; సంభాషణ దాని విషయం పక్కనే ఉంటుంది."
      - "**రసీదులు, ఫొటోలు.** ప్రతి ఖర్చుపై మూడు రసీదుల వరకు ఉంచండి, గ్రూప్, జాబితా లేదా పోల్‌పై ఉన్న వ్యాఖ్యలకు ఫొటోలు లేదా PDFలు జోడించండి."
      - "**ప్రశ్నలు, గొడవలు కాదు.** నిర్వాహకుడు ప్రశ్నలను ఆన్ చేయవచ్చు, ఆ తర్వాత ఖర్చులో ఉన్న ఎవరైనా దాని గురించి అడగవచ్చు. తేలే వరకు అది బ్యాలెన్స్‌లకు దూరంగా ఉంటుంది."
      - "**జాబితాలు, పోల్స్.** షాపింగ్ బిల్లుల పక్కనే ఉమ్మడి షాపింగ్ జాబితా ఉంచండి, విల్లా షార్ట్‌లిస్ట్‌ను ఓటుకు పెట్టండి, కావాలంటే అనామకంగా."
      - "**కాస్త చప్పట్లు.** ఖర్చులకు, పేమెంట్లకు, వ్యాఖ్యలకు స్పందించండి, పేమెంట్ వచ్చినప్పుడు సంబరం చేసుకోండి."
  - heading: మీ గ్రూప్, మీ నియమాలు
    body: Splitwise సహాయ కేంద్రం గ్రూప్ నిర్వాహకులకు, ప్రత్యేక అనుమతులకు మద్దతు లేదని చెబుతోంది. Side Badgerలో పాత్రలు, అనుమతులు ఉన్నాయి, లెక్కలను చక్కగా ఉంచడానికి ఎవరైనా కావాల్సిన గ్రూప్‌ల కోసం.
    items:
      - "**నిర్వాహకులు, సభ్యులు, వీక్షకులు.** ఒకరిని వీక్షకుడిగా చేయండి: వారు అన్నీ చూస్తారు, ఏదీ మార్చరు."
      - "**రెండు ప్రీసెట్లు, లేదా మీ సొంతం.** ఓపెన్ లేదా నిర్వహించబడేదితో మొదలుపెట్టండి, లేదా ప్రతి అనుమతినీ మీరే సెట్ చేయండి: ఖర్చులను ఎవరు సవరిస్తారు, తొలగిస్తారు, జాబితాలను ఎవరు సవరిస్తారు, ఎవరిని ఆహ్వానిస్తారు, కొత్తవారిని ఎవరు లోపలికి రానిస్తారు."
      - "**చేరడానికి ఆమోదం.** ఆమోదాన్ని ఆన్ చేస్తే ప్రతి ఒక్కరినీ నిర్వాహకుడు లోపలికి రానిస్తాడు."
      - "**గ్రూప్ సొంత సెట్టింగ్‌లు.** మీరు నిజంగా వాడే కరెన్సీలకే పరిమితం చేయండి, దాని డిఫాల్ట్ కరెన్సీని ఎంచుకోండి, పైన ఉండే చిత్రం పెట్టండి."
      - "**అయిపోయాక లాక్ చేయండి.** నిర్వాహకుడు అన్‌లాక్ చేసే వరకు లెక్కలు అలాగే ఉంటాయి."
  - heading: ఇక్కడ ఉచితం, అక్కడ చెల్లింపు
    body: Splitwise Pro అనేది Splitwise చెల్లింపు ప్లాన్, దాని సొంత Pro పేజీ Side Badgerలో ఏమీ ఖర్చు కాని మూడు విషయాలను అమ్ముతుంది.
    items:
      - "**రసీదు స్కానింగ్.** Splitwise Pro రసీదు ఫొటోను స్కాన్ చేస్తుంది. Side Badger దాన్ని ఉచితంగా చేస్తుంది, స్కాన్ క్రెడిట్లు లేకుండా: మీరు సరిచూసుకోవడానికి మొత్తం, తేదీ, చోటు నింపుతుంది."
      - "**కరెన్సీ మార్పిడి.** మీరు Convert నొక్కినప్పుడు Splitwise Pro గ్రూప్ ఖర్చులను మీ డిఫాల్ట్ కరెన్సీలోకి మారుస్తుంది. Side Badger ప్రతి ఖర్చును మీరు నమోదు చేసేటప్పుడే మారుస్తుంది, ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో లేదా మీకు నిజంగా వచ్చిన రేటుతో, అసలు మొత్తం ఖర్చుపై ఉంటుంది."
      - "**రోజువారీ పరిమితులు లేవు.** Splitwise Pro అపరిమిత ఖర్చులను అమ్ముతుంది, ఉచిత వాడకందారులు రోజుకు 4 ఖర్చుల వరకు జోడించవచ్చని దాని సహాయ కేంద్రం చెబుతుంది. Side Badgerలో రోజువారీ పరిమితులు లేవు."
  - heading: మీ బ్యాంక్ దీనికి దూరం
    body: Side Badger మీ బ్యాంక్‌కు కనెక్ట్ కాదు, మీ బ్యాంక్ వివరాలను అడగదు. ఎవరు ఎవరికి ఎంత ఇవ్వాలో రికార్డ్ ఉంచుతుంది; మీకు నచ్చిన పద్ధతిలో ఒకరికొకరు చెల్లించుకుని, ఆ తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి. అప్పగించాల్సిన బ్యాంక్ లాగిన్ లేదు, కాబట్టి భద్రంగా ఉంచాల్సిన విషయం ఒకటి తక్కువ.
  - heading: ఒకే యాప్, బ్రౌజర్‌లో, ఫోన్‌లో
    body: Side Badger మీ బ్రౌజర్‌లో నడుస్తుంది. సైన్ ఇన్ చేసి, హోమ్ స్క్రీన్‌కు జోడించండి, అది యాప్‌లా తెరుచుకుంటుంది. రెండు చోట్లా ఒకే యాప్, కాబట్టి కొత్త ఫీచర్ మీరు తర్వాత యాప్ తెరిచినప్పుడే మీ ఫోన్‌లో ఉంటుంది, యాప్ స్టోర్ అప్‌డేట్ కోసం ఎదురుచూడక్కర్లేదు.
  - heading: ఇంకొన్ని సరదా ట్రిక్కులు
    items:
      - "**మీ అసిస్టెంట్‌ను అడగండి.** Side Badger ChatGPT, Claudeతో పని చేస్తుంది: ఖర్చు జోడించమని, రసీదు స్కాన్ చేయమని, పేమెంట్ రికార్డ్ చేయమని మీ అసిస్టెంట్‌ను అడగండి."
      - "**ఎవరికి వారి భాషలో.** Side Badger 39 భాషలు మాట్లాడుతుంది, ప్రతి ఒక్కరూ తమ భాషను ఎంచుకుంటారు. Splitwise హోమ్ పేజీ 7+ అని చెబుతోంది. ఇది 133 కరెన్సీలనూ చూసుకుంటుంది, అన్ని చోట్లా తిరిగే ట్రిప్ కోసం."
      - "**యాప్ వదలకుండానే సహాయం.** ఇరుక్కున్నారా, లేదా బగ్ కనిపించిందా? యాప్ నుండే మాకు చెప్పండి, మా జవాబును అక్కడే చదవండి."
  - heading: Splitwise ఇంకా ముందున్న విషయాలు
    body: తర్వాత తెలుసుకునే కన్నా సరైన యాప్‌ను ఎంచుకోవడమే మాకు ఇష్టం. మీ గ్రూప్‌కు వీటిలో ఏదైనా కావాలంటే, Splitwiseలో ఉంది, Side Badgerలో లేదు.
    items:
      - "**యాప్ స్టోర్ యాప్‌లు.** Side Badger మీ బ్రౌజర్‌లో, హోమ్ స్క్రీన్‌లో ఉంటుంది, యాప్ స్టోర్‌లలో కాదు."
      - "**ఆఫ్‌లైన్ మోడ్.** Side Badgerకు కనెక్షన్ కావాలి."
      - "**యాప్‌లోనే పేమెంట్లు.** కొన్ని దేశాల్లో Splitwise డబ్బును కూడా తరలించగలదు. Side Badger రికార్డ్ మాత్రమే ఉంచుతుంది."
      - "**షేర్లు లేదా ఐటెమ్‌ల వారీగా పంచడం.** Side Badgerలో ఒక ఖర్చుకు ఒక చెల్లింపుదారు, దాన్ని సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచుతారు. దాని రసీదు స్కానింగ్ ఐటెమ్‌లను వ్యక్తులకు కేటాయించదు."
      - "**చార్ట్‌లు, డిఫాల్ట్ పంపకాలు.** Splitwise Proలో రెండూ ఉన్నాయి. Side Badger ఎవరు ఎవరికి ఎంత ఇవ్వాలో లెక్క ఉంచుతుంది, ట్రిక్ మొత్తం అదే."
  - heading: మీ గ్రూప్‌ను మార్చుకోవడం
    body: ఇంపోర్ట్ టూల్ లేదు, కాబట్టి మారడం అంటే కొత్తగా మొదలుపెట్టడం. ముందు Splitwiseలో లెక్క తేల్చుకోండి, తర్వాత Side Badgerలో గ్రూప్ చేసి, అందరినీ లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి. గ్రూప్‌లో ప్రతి ఒక్కరికీ ఉచిత ఖాతా కావాలి, సైన్ అప్ చేయడానికి ఇమెయిల్ చిరునామా ఉంటే చాలు.
table:
  heading: పక్కపక్కనే
  caption: "{date} నాటికి Splitwise వివరాలు, Splitwise సొంత పేజీల నుండి."
  sourceLabel: మూలం
  columns:
    feature: ఏది
    other: Splitwise, దాని సొంత పేజీల ప్రకారం
    sideBadger: Side Badger
  rows:
    - feature: ధర
      other: Splitwise Pro నెలవారీ లేదా వార్షిక సబ్‌స్క్రిప్షన్. వార్షిక ప్లాన్లలో Trip Pass ఉంటుంది, అది ట్రిప్ గ్రూప్‌కు 30 రోజులు Pro ఫీచర్లను ఇస్తుంది.
      sideBadger: ఉచితం.
      source: pro-help
    - feature: రోజుకు ఖర్చులు
      other: ఉచిత వాడకందారులు రోజుకు 4 ఖర్చుల వరకు జోడించవచ్చని దాని సహాయ కేంద్రం చెబుతుంది. Proకు రోజువారీ పరిమితి లేదు.
      sideBadger: రోజువారీ పరిమితులు లేవు.
      source: pro-help
    - feature: గ్రూప్ పాత్రలు, అనుమతులు
      other: దాని సహాయ కేంద్రం గ్రూప్ నిర్వాహకులకు, ప్రత్యేక అనుమతులకు మద్దతు లేదని చెబుతోంది.
      sideBadger: నిర్వాహకులు, సభ్యులు, వీక్షకులు. రెండు ప్రీసెట్లు లేదా మీ సొంత అనుమతులు, చేరడానికి ఆమోదం, అయిపోయాక లాక్.
      source: permissions-help
    - feature: రసీదు స్కానింగ్
      other: Pro ఫీచర్. రసీదు ఫొటోను స్కాన్ చేస్తుంది, Pro ఐటెమ్‌ల వారీ విభజన ఐటెమ్‌లను వ్యక్తులకు కేటాయించనిస్తుంది.
      sideBadger: ఉచితం, స్కాన్ క్రెడిట్లు లేకుండా. మీరు సరిచూసుకోవడానికి మొత్తం, తేదీ, చోటు నింపుతుంది, ఐటెమ్‌లను వ్యక్తులకు కేటాయించదు.
      source: pro
    - feature: కరెన్సీ మార్పిడి
      other: Pro ఫీచర్. Convert నొక్కితే Splitwise గ్రూప్ ఖర్చులను ఆ క్షణపు ఎక్స్ఛేంజ్ రేటుతో మీ డిఫాల్ట్ కరెన్సీలోకి మారుస్తుంది.
      sideBadger: ఉచితం. ప్రతి ఖర్చును నమోదు చేసేటప్పుడే మార్చండి, ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో లేదా మీకు నిజంగా వచ్చిన రేటుతో. అసలు మొత్తం ఖర్చుపై ఉంటుంది.
      source: currencies-help
    - feature: కరెన్సీలు, భాషలు
      other: 100+ కరెన్సీలు, 7+ భాషలు, దాని హోమ్ పేజీ చెప్పినట్టు.
      sideBadger: 133 కరెన్సీలు, 39 భాషలు. గ్రూప్‌లో ప్రతి ఒక్కరూ తమ భాషను ఎంచుకోవచ్చు.
      source: home
    - feature: ఎక్కడ వాడాలి
      other: iPhone, Android యాప్‌లు, వెబ్.
      sideBadger: మీ బ్రౌజర్‌లో. సైన్ ఇన్ చేసి, హోమ్ స్క్రీన్‌కు జోడించండి, అది యాప్‌లా తెరుచుకుంటుంది. యాప్ స్టోర్‌లలో లేదు.
      source: home
    - feature: పంచే మార్గాలు
      other: సమానంగా, కచ్చితమైన మొత్తాలతో, శాతంతో, షేర్లతో, సర్దుబాటుతో లేదా ఐటెమ్‌ల వారీగా.
      sideBadger: సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో, ఒక ఖర్చుకు ఒక చెల్లింపుదారుతో. షేర్లతో లేదా ఐటెమ్‌ల వారీగా కాదు.
      source: split-help
    - feature: ఆఫ్‌లైన్ వాడకం
      other: ఆఫ్‌లైన్ మోడ్‌ను తన ప్రధాన ఫీచర్లలో ఒకటిగా చెబుతుంది.
      sideBadger: లేదు. కనెక్షన్ కావాలి.
      source: home
    - feature: పేమెంట్లు, మీ బ్యాంక్
      other: "కొన్ని చోట్ల యాప్ లోపలి నుండే డబ్బు పంపగలదు: USలో Splitwise Pay, US డాలర్ బ్యాలెన్స్‌లకు Venmo, PayPal, ఎంపిక చేసిన యూరోపియన్ దేశాలలో Pay by Bank, ఇది వ్యక్తిగత కరెంట్ ఖాతాను కలుపుతుంది."
      sideBadger: మీ డబ్బును ఎప్పుడూ ముట్టదు, మీ బ్యాంక్ వివరాలను అడగదు. మీకు నచ్చిన పద్ధతిలో ఒకరికొకరు చెల్లించుకుని, ఆ తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి.
      source: payments-help
    - feature: చార్ట్‌లు, డిఫాల్ట్ పంపకాలు
      other: రెండూ Pro ఫీచర్లు.
      sideBadger: రెండూ లేవు.
      source: pro
faq:
  heading: ప్రశ్నలు
  items:
    - q: Side Badger Splitwiseకు ఉచిత ప్రత్యామ్నాయమా?
      a: "గ్రూప్‌లో బిల్లులు పంచుకోవడానికి అవును, లెక్కల కన్నా ఎక్కువే చేస్తుంది: వ్యాఖ్యలు, ప్రశ్నలు, జాబితాలు, పోల్స్, గ్రూప్ పాత్రలు, రసీదు స్కానింగ్, కరెన్సీ మార్పిడి ఉచితంగా. మీకు యాప్ స్టోర్ యాప్, ఆఫ్‌లైన్ వాడకం లేదా యాప్ లోపలే పేమెంట్లు కావాలంటే, అవి Splitwise చేస్తుంది, Side Badger చేయదు."
    - q: Splitwise వివరాలు ఎక్కడి నుండి వచ్చాయి?
      a: "Splitwise సొంత పేజీల నుండి: దాని హోమ్ పేజీ, Pro పేజీ, సహాయ కేంద్రం. పట్టికలోని ప్రతి వరుస అది వచ్చిన పేజీకి లింక్ చేస్తుంది, పట్టిక పైన ఉన్న తేదీ మేము వాటిని ఎప్పుడు చదివామో చెబుతుంది. ప్రతి త్రైమాసికం వాటిని మళ్లీ చూస్తాం."
    - q: Side Badger ఉచితంగానే ఉంటుందా?
      a: Side Badgerలో ప్రతిదీ ఈ రోజు ఉచితం. అది ఎప్పుడైనా మారితే, ముందు మీకు నోటీసు ఇస్తాం. వివరాలు [ధరల పేజీ](page:pricing)లో ఉన్నాయి.
    - q: నా గ్రూప్‌లో అందరూ మారాలా?
      a: అవును. గ్రూప్‌లో ప్రతి ఒక్కరికీ ఉచిత Side Badger ఖాతా కావాలి, వాళ్లు లింక్ లేదా QR కోడ్‌తో చేరవచ్చు.
    - q: Side Badgerకు మొబైల్ యాప్ ఉందా?
      a: "యాప్ స్టోర్‌లో లేదు. ఇది మీ బ్రౌజర్‌లో నడుస్తుంది: ఫోన్‌లో సైన్ ఇన్ చేసి, హోమ్ స్క్రీన్‌కు జోడించండి, అది యాప్‌లా తెరుచుకుంటుంది. [ఎలా పనిచేస్తుంది](page:how-it-works) చూపిస్తుంది."
