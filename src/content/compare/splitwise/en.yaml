meta:
  title: "Side Badger vs Splitwise: the free bits, compared | Side Badger"
  description: "A free Splitwise alternative, compared fairly. Receipt scanning, currency conversion and no ads cost nothing here, and we list what Splitwise does better."
h1: "Side Badger vs Splitwise: the free bits, compared"
navLabel: Side Badger vs Splitwise
lead: "Someone in your group has probably said \"just use Splitwise\". Fair enough. Side Badger is a free web app with receipt scanning, currency conversion and no ads, and no subscription to unlock them. Which one suits your group depends on what it needs, so here is the comparison, with Splitwise's side taken only from Splitwise's own pages."
cta:
  heading: Try it on your next shared bill
  body: "Create a free account, make a group and add one real expense. If it isn't for you, you've spent a few minutes, not a subscription."
asOf: 2026-10-21
asOfNote: "We read Splitwise's own pages on {date} so you don't have to, and everything here about Splitwise comes from them. Each row of the table links to its source. Plans change, so we check again every quarter, and if Splitwise's pages disagree with this one, believe them."
