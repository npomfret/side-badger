meta:
  title: "Side Badger vs Splitwise: o grupo todo, não só as contas | Side Badger"
  description: "Uma alternativa grátis ao Splitwise feita para o grupo todo: comentários, perguntas, listas, sondagens e funções a sério, com digitalização de recibos e conversão de moedas grátis."
h1: "Side Badger vs Splitwise: o grupo todo, não só as contas"
navLabel: Side Badger vs Splitwise
lead: "Provavelmente alguém no teu grupo já disse “usem o Splitwise”. Faz sentido: é bom a fazer contas. O Side Badger também faz contas, e depois dá ao grupo um sítio para falar delas: comentários, perguntas, listas, sondagens e funções de grupo a sério. A digitalização de recibos e a conversão de moedas vêm de borla."
cta:
  heading: Experimenta na tua próxima conta partilhada
  body: Cria uma conta grátis, faz um grupo e adiciona uma despesa a sério. Se não for para ti, gastaste uns minutos, não uma subscrição.
asOf: 2026-11-22
asOfNote: Lemos as páginas do próprio Splitwise em {date} para não teres de as ler, e tudo o que aqui se diz sobre o Splitwise vem delas. Cada linha da tabela liga à sua fonte. Os planos mudam, por isso voltamos a verificar todos os trimestres, e se as páginas do Splitwise discordarem desta, acredita nelas.
