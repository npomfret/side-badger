faq:
  heading: "أسئلة"
  items:
    - q: "ماذا لو كانت غرفة أحدهم أكبر لكن نورها أقل؟"
      a: "المساحة نقطة بداية فقط، فيمكن للمجموعة أن تتفق على تعديل. اخصموا نقطة أو نقطتين من الغرفة المعتمة، وامنحوها للآخرين، وتأكدوا أن مجموع النسب ما زال 100. يحفظ Side Badger ما تتفقون عليه ولا يحكم عليه."
    - q: "هل نقسّم الفواتير بحسب حجم الغرفة أيضاً؟"
      a: "غالباً لا. الطاقة والإنترنت يستخدمهما الجميع، فالتقسيم بالتساوي أبسط، كما في المثال أعلاه. وإذا كان أحد زملاء السكن في البيت طوال اليوم، يمكن للمجموعة أن تتفق على شيء آخر، مثل مبالغ دقيقة. يشرح [تقسيم المصروفات](page:feature/split-expenses) الخيارات."
    - q: "هل نستطيع تغيير التقسيم لاحقاً؟"
      a: "نعم، للمصروفات الجديدة. غيّروا النسب حين تنسخون الإيجار وتبقى الشهور السابقة كما كانت. ولتصحيح مصروف سابق، عدّلوه إذا كانت أذونات المجموعة تسمح بذلك، وأخبروا أهل البيت أولاً، لأن الأرصدة ستتغير. وتُحفظ النسخة السابقة."
