faq:
  heading: "Питања"
  items:
    - q: "Да користимо бруто или нето плату?"
      a: "Одлучује група. Нето је уобичајена јер је то новац који заиста можете да потрошите. Бруто плата занемарује да порез, пензијски доприноси и отплате кредита различитим платама одузимају различите износе. Шта год изаберете, користите исту меру за обоје."
    - q: "Да ли Side Badger види наше приходе?"
      a: "Не. Уносиш само проценте, никад плате. Проценте виде чланови групе, а за пар то сте вас двоје."
    - q: "Можемо ли једном поставити 62/38 за све?"
      a: "Подела се поставља по трошку, а не по групи. Копирај трошак који већ има 62 и 38, па промени оно што се разликује. Остале могућности описује [подела трошкова](page:feature/split-expenses)."
