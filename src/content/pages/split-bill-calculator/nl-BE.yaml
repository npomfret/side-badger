faq:
  heading: "Vragen"
  items:
    - q: "Is de calculator gratis?"
      a: "Ja. Gratis. Geen advertenties. Geen dagelijkse limieten. Je hebt ook geen account nodig."
    - q: "Wordt wat ik intyp bewaard?"
      a: "Nee. Niets wordt ergens bewaard of naartoe gestuurd. Wil je je cijfers houden, gebruik dan Link kopiëren en bewaar de link ergens."
    - q: "Wie kan de link zien die ik kopieer?"
      a: "Iedereen die de link heeft. De cijfers zitten in de link zelf, achter het #, dus deel de link enkel met de mensen die ze mogen zien."
    - q: "Verplaatst de calculator geld?"
      a: "Nee. De calculator berekent wie wie moet betalen en jullie betalen elkaar zoals jullie willen. Ook Side Badger raakt je geld nooit aan. Zie [afrekenen](page:feature/settle-up)."
    - q: "Kan ik een reis verdelen die in twee valuta’s betaald is?"
      a: "Hier niet, want een berekening heeft één valuta. In een groep houdt elke valuta een eigen saldo bij. Zie [meerdere valuta’s](page:feature/multiple-currencies)."
    - q: "Wat als de bedragen niet optellen?"
      a: "De calculator meldt het onder de uitgave en toont geen resultaat tot het klopt. Exacte bedragen moeten optellen tot het totaal, en percentages moeten samen 100 zijn."
