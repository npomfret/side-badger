sections:
  - heading: "Καταγράψτε μια πληρωμή"
    body: "Όταν κάποιος πληρώνει, καταγράψτε το στο σωστό άτομο. Τα κουμπιά γρήγορης τακτοποίησης συμπληρώνουν το ποσό από τις προτεινόμενες πληρωμές σας και μπορείτε να προσθέσετε μια σημείωση όπως «τραπεζική μεταφορά» (έως 500 χαρακτήρες). Αν πληρώσετε μόνο μέρος αυτού που χρωστάτε, το υπόλοιπο μένει στο υπόλοιπο. Αν βάλετε πολύ λίγο ή πολύ, το Side Badger σας προειδοποιεί πριν αποθηκεύσετε. Η καταγραφή πληρωμής απαιτεί δικαίωμα επεξεργασίας εξόδων και η ημερομηνία δεν μπορεί να είναι στο μέλλον."
  - heading: "Πληρώσατε σε άλλο νόμισμα;"
    body: "Τα υπόλοιπα μένουν στο νόμισμα στο οποίο πληρώθηκαν, οπότε ένα χρέος σε ευρώ μένει χρέος σε ευρώ. Χρωστάτε ευρώ και πληρώνετε σε λίρες; Μετατρέψτε την πληρωμή καθώς την καταχωρίζετε, με μια τρέχουσα συναλλαγματική ισοτιμία ή με την ισοτιμία που ίσχυσε στην πραγματικότητα. Η ισοτιμία κλειδώνει όταν αποθηκευτεί η πληρωμή. Τα [πολλά νομίσματα](page:feature/multiple-currencies) εξηγούν πώς λειτουργεί η μετατροπή και τα [ομαδικά ταξίδια](page:use-case/group-trips) τη δείχνουν στην πράξη."
  - heading: "Ιστορικό που μπορείτε να ελέγξετε"
    body: "Κάθε καταγεγραμμένη πληρωμή μένει στο ιστορικό της ομάδας με την ημερομηνία, το ποσό και τη σημείωσή της. Μόνο το άτομο που κατέγραψε μια πληρωμή μπορεί να την επεξεργαστεί και αυτό ή ένας διαχειριστής της ομάδας μπορεί να τη διαγράψει. Μια πληρωμή που αφορά κάποιον που έφυγε από την ομάδα είναι κλειδωμένη. Για ένα ολοκληρωμένο σενάριο με συγκατοίκους, δείτε τους [συγκατοίκους](page:use-case/housemates)."
limits:
  heading: "Τι δεν κάνει το Side Badger"
  items:
    - "Το Side Badger δεν μετακινεί χρήματα, δεν στέλνει συνδέσμους πληρωμής ούτε αιτήματα πληρωμής. Μια πληρωμή στην εφαρμογή είναι η καταγραφή μιας πληρωμής που έγινε αλλού."
    - "Οι προτεινόμενες πληρωμές προκύπτουν από μια απλή μέθοδο αντιστοίχισης, που εφαρμόζεται ανά νόμισμα. Προτείνει πάντα λιγότερες πληρωμές από τα άτομα με υπόλοιπο σε αυτό το νόμισμα (για τέσσερα άτομα, το πολύ τρεις), αλλά δεν βρίσκει πάντα τον μικρότερο δυνατό αριθμό."
    - "Δεν μπορείτε να απενεργοποιήσετε τις προτάσεις. Η **Προβολή όλων** εμφανίζει κάθε προτεινόμενη πληρωμή στην ομάδα, όχι μόνο τις δικές σας."
    - "Τα νομίσματα δεν συμψηφίζονται ποτέ μεταξύ τους, εκτός αν τα έξοδα μετατράπηκαν όταν καταχωρίστηκαν."
    - "Δεν υπάρχουν υπενθυμίσεις, οπότε το κυνήγι μιας πληρωμής μένει σε εσάς."
useCasesHeading: "Πού μετράει η εκκαθάριση"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Στέλνει το Side Badger τα χρήματα;"
      a: "Όχι. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή στο Side Badger ώστε να ενημερωθεί το υπόλοιπο."
    - q: "Μπορώ να απενεργοποιήσω τις προτεινόμενες πληρωμές;"
      a: "Όχι. Η απλοποίηση μένει ενεργή και η **Προβολή όλων** εμφανίζει κάθε προτεινόμενη πληρωμή στην ομάδα, όχι μόνο όσες σας αφορούν."
    - q: "Γιατί τα ευρώ και οι λίρες τηρούνται ξεχωριστά;"
      a: "Τα υπόλοιπα μένουν στο νόμισμα που πληρώσατε εκτός αν μετατρέψετε όταν καταχωρίζετε ένα έξοδο ή μια πληρωμή. Τα χρέη σε διαφορετικά νομίσματα δεν συμψηφίζονται ποτέ μεταξύ τους."
    - q: "Τι γίνεται αν κάποιος πληρώσει μόνο μέρος αυτού που χρωστά;"
      a: "Καταγράψτε το μέρος που πλήρωσε. Το υπόλοιπο μένει στο υπόλοιπο μέχρι να πληρωθεί."
    - q: "Είναι πάντα ο μικρότερος δυνατός αριθμός πληρωμών;"
      a: "Δεν είναι εγγυημένο. Προτείνει πάντα λιγότερες πληρωμές από τα άτομα με υπόλοιπο σε αυτό το νόμισμα, οπότε για τέσσερα άτομα ποτέ περισσότερες από τρεις. Στο παράδειγμα με τους συγκατοίκους είναι δύο πληρωμές, εκεί που η απευθείας επιστροφή σε κάθε άτομο χρειαζόταν έξι."
