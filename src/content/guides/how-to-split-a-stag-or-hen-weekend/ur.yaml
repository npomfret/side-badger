faq:
  heading: "سوالات"
  items:
    - q: "کیا بیسٹ مین یا میڈ آف آنر کو زیادہ دینا چاہیے؟"
      a: "صرف اس صورت میں جب گروپ متفق ہو۔ ایپ حساب میں کسی کو کوئی خاص کردار نہیں دیتی۔ اگر کوئی زیادہ اٹھا رہا ہے تو **کیسے تقسیم کریں** کے تحت **عین رقمیں** یا **فیصد** چنیں اور طے شدہ حصے درج کریں۔"
    - q: "ان مشروبات کا کیا جو کچھ لوگوں نے نہیں پیے؟"
      a: "مشروبات کو الگ خرچے کے طور پر شامل کریں اور صرف ان پر ٹک لگائیں جنہوں نے پیے۔ اگر ہر ایک کی مقدار مختلف تھی تو **عین رقمیں** چنیں اور ہر شخص کا حصہ ٹائپ کریں۔ کوئی اس کا پیسہ نہیں دیتا جو اس نے لیا ہی نہیں۔"
    - q: "کیا مہمانِ خصوصی بعد میں گروپ دیکھ سکتی ہے؟"
      a: "جی ہاں، سرپرائز ختم ہونے کے بعد۔ اسے مدعو کریں، پھر ایڈمن گروپ کی ترتیبات میں **سیکیورٹی اور اجازتیں** کے تحت اسے **ناظر** بنا سکتا ہے۔ ناظر سب کچھ دیکھتا ہے اور کچھ نہیں بدلتا، اس لیے تب تک رکیں جب تک کچھ بھی راز نہ ہو۔ شامل ہونے کے لیے اسے مفت اکاؤنٹ چاہیے۔"
