faq:
  heading: "প্রশ্ন"
  items:
    - q: "পেমেন্ট রেকর্ড করবে কে, যে দিচ্ছে নাকি যে পাচ্ছে?"
      a: "পেমেন্ট রেকর্ড করতে খরচ সম্পাদনার অনুমতি লাগে, আর ফর্মে জিজ্ঞেস করা হয় **কে টাকা দিয়েছেন?** এবং **কে টাকা পেয়েছেন?** পরে সেটা সম্পাদনা করতে পারে শুধু যে রেকর্ড করেছে, তাই সাধারণত সবচেয়ে সহজ হলো যে দিচ্ছে সে-ই কুইক সেটেল বোতাম ব্যবহার করে রেকর্ড করুক।"
    - q: "ট্রিপ দুটি মুদ্রায় চললে কী হবে?"
      a: "ব্যালেন্স রাখা হয় মুদ্রা ধরে, তাই ইউরোর দেনা ইউরোর দেনাই থাকে আর প্রতিটি মুদ্রা তার নিজস্ব ছোট তালিকা পায়, যদি না খরচ লেখার সময় রূপান্তর করা হয়ে থাকে। [একাধিক মুদ্রার ট্রিপ](page:guide/how-to-split-a-trip-paid-in-several-currencies) দুটি পথই দেখায়।"
    - q: "হিসাব কি ট্রিপের মাঝে মেটানো ভালো, নাকি শেষে?"
      a: "দুটোই চলে। রেকর্ড করা প্রতিটি পেমেন্ট ব্যালেন্স বদলে দেয়, তাই ট্রিপের মাঝে করা পেমেন্টও শেষ তালিকায় ধরা হয়। শেষে করা সহজ, কারণ [পুরো ট্রিপ](page:use-case/group-trips) তখন এক জায়গায় থাকে।"
