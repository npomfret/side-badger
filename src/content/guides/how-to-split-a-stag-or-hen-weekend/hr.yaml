faq:
  heading: "Pitanja"
  items:
    - q: "Plaća li kum ili djeveruša više?"
      a: "Samo ako se grupa tako dogovori. Aplikacija nikome ne daje posebnu ulogu u računu. Ako netko pokriva više, pod **Kako podijeliti** odaberi **Točni iznosi** ili **Postotak** i upiši dogovorene udjele."
    - q: "Što s pićima koja neki nisu pili?"
      a: "Dodaj piće kao zaseban trošak i označi samo ljude koji su ga pili. Ako je svatko popio drukčiju količinu, odaberi **Točni iznosi** i upiši udio svake osobe. Nitko ne plaća ono što nije popio."
    - q: "Može li počasni gost kasnije vidjeti grupu?"
      a: "Da, kad iznenađenje prođe. Pozovi počasnog gosta, a zatim mu administrator može dodijeliti ulogu **Promatrač** pod **Sigurnost i dopuštenja** u postavkama grupe. Promatrač vidi sve i ništa ne mijenja, pa pričekaj dok više ništa nije tajna. Za pridruživanje treba besplatan korisnički račun."
