meta:
  title: Dela kostnaderna för gruppresan, i 140 valutor
  description: Håll koll på vem som betalat vad på en gruppresa, lägg in kostnader i lokal valuta, räkna om dem eller inte, och gör upp en gång i slutet. Gratis, i webbläsaren.
h1: Dela kostnaderna för gruppresan, i 140 valutor
navLabel: Gruppresor
lead: Håll koll på villan, taxiresorna och den där drinkrundan som ingen minns att de lovade att bjuda på. Side Badger håller den löpande räkningen medan ni är borta, [hanterar pund, euro och 138 andra valutor](page:feature/multiple-currencies) och ger er en [kort lista med betalningar](page:feature/settle-up) när ni kommer hem.
cta:
  heading: Semesterräkningen klar innan solbrännan bleknat
  body: Skapa en grupp, skicka inbjudningslänken till de som är med på resan och lägg till kostnader när de uppstår.
  button: Skapa ett gratiskonto
scenario:
  heading: Alla betalade för något, i någon valuta
  body: Någon bokade flygen, någon annan satte villan på sitt kort och en tredje la ut för middagen i kontanter. Redan dag tre vet ingen vem som ligger back. Frågan är enkel, även om svaret oftast bor i ett kalkylblad som ingen vill öppna. Vem betalade vad, i vilken valuta, och hur gör alla upp en gång i slutet?
sections:
  - heading: Innan ni åker
    body: Låt gruppen rösta om villorna på kortlistan, anonymt om du vill, så att beslutet tillhör gruppen och inte den som surar längst. Ha sedan den gemensamma inköpslistan bredvid inköpsnotorna, så att ingen köper tre tuber solkräm och inga adaptrar.
  - heading: Medan ni är borta
    body: Lägg till varje kostnad när den uppstår, i den valuta du betalade den i. Ta en bild på kvittot så fyller Side Badger i summa, datum och plats så att du kan kontrollera dem; kvittobilder läses av Googles AI-tjänst. Räkna om beloppet med en aktuell växelkurs, som du kan ändra till den kurs du faktiskt fick, så finns det ursprungliga beloppet kvar på utgiften. Eller låt euron vara euro och bestäm senare. En grupp kan också välja en valuta, och nya utgifter räknas då om till den automatiskt.
  - heading: Alla gjorde inte allt
    body: Några hoppade över middagen, några satt över båtturen. Lämna dem utanför de kostnader de inte var med på, och dela resten [lika, efter exakta belopp eller i procent](page:feature/split-expenses). Ingen betalar för den del av resan de sov igenom.
  - heading: Gör upp när ni är hemma
    body: Side Badger föreslår en kort lista med betalningar som gör upp för alla. Betala varandra hur ni vill och registrera det sedan. Med blandade valutor kan ni hålla var och en separat eller räkna om allt eftersom; Lissabon-exemplet nedan visar båda.
  - heading: Svensexor och möhippor
    body: En helg bort med en hedersgäst kräver lite mer administration. Gör den till en hanterad grupp, där administratörer godkänner nya medlemmar och bara skaparen och administratörer kan ändra utgifter. Använd exakta belopp för hedersgästens andel, begränsa gruppen till de valutor ni faktiskt använder och lås gruppen när det är över så att siffrorna ligger kvar.
