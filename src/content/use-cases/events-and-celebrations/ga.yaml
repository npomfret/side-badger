faq:
  heading: "Ceisteanna"
  items:
    - q: "An bhfeiceann aíonna an grúpa gan dul isteach?"
      a: "Ní fheiceann. Téann daoine isteach le nasc nó cód QR agus cuntas saor in aisce, mar sin feiceann siad an grúpa nuair a bhíonn siad istigh."
    - q: "An féidir le Side Badger an t-airgead a bhailiú?"
      a: "Ní féidir. Coinníonn Side Badger an cuntas agus ní bhogann sé airgead riamh. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht. Tá sé saor in aisce, gan fógraí agus gan teorainneacha laethúla; féach [praghsáil](page:pricing)."
    - q: "An féidir vótaí a bheith gan ainm?"
      a: "Is féidir. Nuair a chruthaíonn tú vóta is féidir leat a cheilt cé a vótáil ar cad. Ní féidir na socruithe a athrú ach roimh an gcéad vóta."
    - q: "An féidir le daoine méideanna éagsúla a chur isteach?"
      a: "Is féidir. Roinn costas de réir suimeanna cruinne, ionas gurb é sciar gach duine an figiúr a d'aontaigh sibh, nó fág amach na daoine nach raibh páirteach."
    - q: "An féidir le heagraí na leabhair a choinneáil?"
      a: "Is féidir. Úsáid an réamhshocrú grúpa bainistithe, ionas nach n-athraíonn costais ach cruthaitheoirí agus riarthóirí agus go gceadaíonn riarthóirí baill nua."
