meta:
  title: "گروپ اخراجات کے لیے مشترکہ فہرستیں، پول اور تبصرے | Side Badger"
  description: "اخراجات پر تبصرہ کریں، عجیب خرچے پر سوال اٹھائیں، مشترکہ خریداری کی فہرست رکھیں اور ولا پر ووٹ دیں۔ پہلے مل کر منصوبہ بنائیں، پھر تقسیم کریں۔ مفت، بغیر اشتہارات۔"
h1: "مل کر منصوبہ بنائیں، بعد میں تقسیم کریں"
navLabel: "مل کر منصوبہ بنائیں"
lead: "خریداری کی فہرست اور خریداری کا بل، آخرکار بول چال پر آ گئے۔ Side Badger آپ کے گروپ کو پیسوں پر بات کرنے کی جگہ دیتا ہے، خرچ سے پہلے بھی اور بعد میں بھی: ہر خرچے پر تبصرے، ٹھیک نہ لگنے والے اخراجات پر سوال اٹھانے کا طریقہ، مشترکہ فہرستیں اور بڑے فیصلوں کے لیے پول۔ پھر آپ معمول کے مطابق [اخراجات تقسیم کریں](page:feature/split-expenses)۔"
cta:
  heading: "منصوبہ بنائیں، پھر تقسیم کریں"
  body: "مفت اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلی فہرست، پول یا سوال پیسوں کے بالکل ساتھ رکھیں۔ یقین نہیں آگے کیا ہوتا ہے؟ [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں۔"
problem:
  heading: "چیٹ ادھر ہے، بل ادھر"
  body: "گروپ کا خرچہ عموماً دو جگہ رہتا ہے۔ اعداد ایک جگہ، اور ان اعداد پر بحث ایسی چیٹ میں جو منگل کو بہت پیچھے چلی گئی۔ خریداری کی فہرست فرج کی ایک تصویر ہے۔ ولا کا فیصلہ زیادہ تر لوگوں کے انگوٹھے اوپر کرنے سے ہوا، غالباً۔ Side Badger منصوبہ بندی گروپ ہی میں رکھتا ہے، ان اخراجات کے ساتھ جن کے بارے میں وہ ہے، اس لیے جہاں خرچہ ہے وہاں تبصرہ ہے، جہاں خریداری ہے وہاں فہرست ہے، بڑے فیصلے کے لیے پول ہے، اور «ذرا رکیں، کیا یہ ٹھیک ہے؟» کہنے کا ایسا طریقہ ہے جس کے لیے پورا پیراگراف نہیں لکھنا پڑتا۔ سب کچھ گروپ کے پیسوں کے بارے میں رہتا ہے، جس کے لیے گروپ ہے۔"
workflow:
  heading: "ولا کے ووٹ سے خریداری کے بل تک"
  steps:
    - title: "بڑا فیصلہ ووٹ پر رکھیں"
      body: "اس فیصلے کے لیے پول شامل کریں جو بل طے کرتا ہے، جیسے کون سا ولا۔ دو سے دس اختیارات رکھیں، بتائیں ہر شخص کو کتنے ووٹ ملیں گے، پھر سب کے ووٹ آنے پر پول بند کریں اور جیتنے والا نشان زد ہو جاتا ہے۔"
      shot: S17
      shotAlt: "بند پول جس میں جیتنے والا اختیار نشان زد ہے اور ہر اختیار کے ساتھ ووٹوں کی تعداد ہے"
    - title: "مل کر خریداری کی فہرست لکھیں"
      body: "مشترکہ فہرست شروع کریں، آئٹمز ڈالیں اور ٹرالی تک پہنچنے پر انہیں ٹک کریں۔ خریداری بعد میں خرچے کے طور پر شامل ہوتی ہے۔"
      shot: S16
      shotAlt: "مشترکہ خریداری کی فہرست جس میں کچھ آئٹمز ٹک ہیں اور پیش رفت کی گنتی ہے"
    - title: "خرچے پر بات وہیں کریں جہاں وہ ہے"
      body: "خرچے ہی پر تبصرہ کریں، رسید لگائیں اور ایموجی سے ردعمل دیں۔ بات چیت اسی عدد کے ساتھ رہتی ہے جس کے بارے میں ہے۔"
      shot: S08
      shotAlt: "تفصیلات، رسید کے تھمب نیل، تبصروں کے سلسلے اور ایموجی ردعمل کے ساتھ ایک خرچہ"
    - title: "جو خرچہ عجیب لگے اس پر سوال اٹھائیں"
      body: "اگر گروپ نے اخراجات پر سوالات آن کیے ہوں تو خرچے میں شامل کوئی بھی شخص **میرا ایک سوال ہے** چن سکتا ہے۔ سوال نمٹنے تک خرچہ بیلنسز سے باہر رہتا ہے۔"
      shot: S18
      shotAlt: "اخراجات کی فہرست جس میں «زیر سوال» بیج اور «صرف زیر سوال» فلٹر ہے"
    - title: "دیکھیں کیا بدلا، اور کس نے بدلا"
      body: "سرگرمی کی فیڈ اور اطلاعات کی گھنٹی دکھاتی ہیں کہ آپ کے گروپوں میں نیا کیا ہے۔ پش اطلاعات بھی ہیں اگر آپ چاہیں۔"
      shot: S19
      shotAlt: "حالیہ سرگرمی کی فہرست کے ساتھ اطلاعات کا ڈراپ ڈاؤن"
