sections:
  - heading: "Alleen de mensen die erbij waren"
    body: "Verdeel een kost over iedereen, of enkel over de mensen die ze deelden. Laat mensen weg uit de kosten waar ze geen deel van uitmaakten en de saldi houden daar rekening mee. De huisgenoot die de hele week weg was, is niets verschuldigd voor de afhaalmaaltijd, wat [huisgenoten](page:use-case/housemates) zullen herkennen als basisrechtvaardigheid."
  - heading: "De details die later ruzie besparen"
    items:
      - "Stel de **datum** en eventueel een tijdstip in. Snelkoppelingen zoals vandaag, gisteren, vanochtend en gisteravond besparen wat typwerk."
      - "Voeg tot drie **labels** toe om uitgaven te groeperen, zoals boodschappen of reizen."
      - "Voeg de **plaats** toe. Plak een kaartlink en de naam van de plaats vult zichzelf in."
      - "Voeg een **notitie** toe voor het verhaal achter het getal, met wat opmaak als het verhaal dat vraagt."
      - "Gebruik de **opmerkingen** om het gesprek naast de uitgave te houden waarover het gaat, in plaats van in een chatdraad waar niemand in terugscrolt."
  - heading: "Kopiëren, bewerken en zien wat er veranderde"
    body: "Kopieer de huur van vorige maand in plaats van ze opnieuw in te typen en wijzig wat anders is. Als een bedrag fout was, bewerk je de uitgave. De eerdere versie blijft bewaard en de wijziging verschijnt in de groepsactiviteit, dus niemand past stilletjes een bedrag aan. Wat iedereen mag bewerken, hangt af van de machtigingen van de groep."
  - heading: "Als er iets mis lijkt"
    body: "Een groep kan uitgavenvragen inschakelen. Iedereen die bij een uitgave betrokken is, kan een vraag stellen en zeggen waarom, en de uitgave blijft buiten de saldi tot de persoon die de vraag stelde, of een beheerder, ze sluit. Het staat standaard uit en een beheerder schakelt het in voor de groep. Het past bij [evenementen en feestjes](page:use-case/events-and-celebrations), waar de borg die niemand zich herinnert plots ieders zaak wordt."
limits:
  heading: "Beperkingen"
  items:
    - "Eén persoon betaalt per uitgave. Als twee mensen betaalden, registreer je twee uitgaven."
    - "Er is geen verdeling per item en geen verdeling per aandelen. Gelijk, exacte bedragen en percentages is wat er is."
    - "Percentages moeten samen 100 zijn."
    - "Een uitgave kan tot 999.999,99 bedragen in haar eigen valuta, met het gebruikelijke aantal decimalen van die valuta."
    - "Uitgaven kunnen zich niet vanzelf herhalen. Kopieer in plaats daarvan die van vorige maand."
    - "Datums kunnen niet in de toekomst liggen of meer dan 10 jaar geleden zijn."
    - "Een uitgave met iemand die de groep verlaten heeft, wordt alleen-lezen."
useCasesHeading: "Waar zo verdelen helpt"
faq:
  heading: "Vragen"
  items:
    - q: "Kunnen twee mensen één uitgave betalen?"
      a: "Niet in één uitgave. Registreer er twee, één per betaler, en de saldi komen op hetzelfde uit."
    - q: "Kan ik een bonnetje per item verdelen?"
      a: "Nee. Een verdeling is gelijk, op exacte bedragen of op percentage. Voor een rekening met verschillende items voer je in wat elke persoon schuldig is als exacte bedragen."
    - q: "Kan ik een standaardverdeling instellen?"
      a: "Nee. Kopieer een eerdere uitgave om haar verdeling te hergebruiken en wijzig wat anders is."
    - q: "Kunnen rekeningen elke maand terugkeren?"
      a: "Nee. Kopieer in plaats daarvan de uitgave van vorige maand, wat een paar seconden duurt."
    - q: "Wie kan een uitgave bewerken?"
      a: "Wie de machtigingen van de groep toelaten. Elke wijziging verschijnt in de groepsactiviteit, dus wijzigingen zijn nooit stil."
    - q: "Wat gebeurt er daarna met de saldi?"
      a: "Ze worden bijgewerkt naarmate er uitgaven bijkomen, en [afrekenen](page:feature/settle-up) maakt er een korte lijst betalingen van. Als een uitgave in een andere valuta is, zie [meerdere valuta’s](page:feature/multiple-currencies)."
