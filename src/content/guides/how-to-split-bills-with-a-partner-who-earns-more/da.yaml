faq:
  heading: Spørgsmål
  items:
    - q: Skal vi bruge brutto- eller nettoløn?
      a: Det bestemmer gruppen. Nettoløn er almindeligt, fordi det er de penge, du faktisk har at bruge. Bruttoløn ser bort fra, at skat, pensionsindbetalinger og afdrag på lån tager forskellige beløb ud af forskellige lønninger. Uanset hvad I vælger, så brug det samme mål for jer begge.
    - q: Kan Side Badger se vores indkomst?
      a: Nej. Du indtaster kun procenter, aldrig lønninger. Procenterne er synlige for gruppens medlemmer, og for et par er det jer to.
    - q: Kan vi sætte 62/38 én gang for alt?
      a: Delingen sættes pr. udgift, ikke pr. gruppe. Kopiér en udgift, der allerede har 62 og 38, og ret så det, der er anderledes. [Del udgifter](page:feature/split-expenses) gennemgår de andre muligheder.
