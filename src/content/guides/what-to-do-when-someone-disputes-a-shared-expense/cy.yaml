meta:
  title: "Beth i'w wneud os yw rhywun yn herio cost a rennir | Side Badger"
  description: "Hepgorwch y neges bigog. Codwch gwestiwn am y gost ac mae'n gadael balansau pawb tra byddwch yn siarad. Wedi'i gweithio drwodd gyda £45 o win parti."
h1: "Beth i'w wneud pan fydd rhywun yn herio cost a rennir"
navLabel: "Costau a heriwyd"
lead: "Codwch gwestiwn ar y gost yn lle anfon neges bigog. Tra bo'r cwestiwn ar agor, mae'r gost gyfan yn aros allan o falansau pawb. Trafodwch hi yn y sylwadau, golygwch y rhaniad os yw'r grŵp yn cytuno, a gadewch i'r person a ofynnodd, neu weinyddwr, gau'r cwestiwn."
cta:
  heading: "Gofynnwch y cwestiwn lletchwith yn gwrtais"
  body: "Creu cyfrif am ddim, cychwyn grŵp ar gyfer y fflat a gofyn i weinyddwr droi cwestiynau am gostau ymlaen, sydd i ffwrdd nes bydd rhywun yn gwneud hynny. Eisiau'r daith yn gyntaf? Gweler [sut mae'n gweithio](page:how-it-works) neu [beth mae am ddim yn ei gynnwys](page:pricing)."
sections:
  - heading: "Tri chyd-letywr a £45 o win"
    body: "Ar ôl y parti, mae Tom yn ychwanegu'r gwin at grŵp y fflat. Mae'n £45, a dalwyd gan Tom, wedi'i rannu'n gyfartal rhwng Tom, Priya ac Aisha, sef £15 yr un. Dyw Aisha ddim yn yfed. Prynodd Tom y gwin ar gyfer y parti, ac roedd y parti ar gyfer y [fflat](page:use-case/housemates), felly nid yw wedi gwneud dim o'i le. Dyw Aisha ddim yn anghywir i ofyn, chwaith. Does neb yn ddihiryn yma. Dim ond £15 o win sy'n destun anghydfod, a digon o ffyrdd i'w wneud yn lletchwith. Mae neges bigog i'r tŷ yn un. Mae cwestiwn ar y gost yn un addfwynach."
  - heading: "Beth mae cwestiwn yn ei wneud"
    body: "Mae Aisha yn agor y gost ac yn codi cwestiwn. Mae'r gost gyfan yn gadael balansau pawb, nid dim ond ei chyfran hi, a does dim byd arall yn cael ei effeithio. Mae'r siopa mawr (£84) a'r glanhawr (£60) yn dal i gyfrif, sef £28 + £20 = £48 yr un. Felly tra bo'r gwin wedi'i ddal yn ôl, mae ar Aisha £48, mae £36 yn ddyledus i Tom ac mae £12 yn ddyledus i Priya. Beth bynnag y mae'r fflat yn ei benderfynu am y gwin, nid yw balans neb yn ei gynnwys yn y cyfamser. Gall unrhyw un arall sydd yn y gost godi ei gwestiwn ei hun hefyd. Dim ond pan gaiff y cwestiwn agored olaf amdano ei gau y mae'r gwin yn mynd yn ôl i'r balansau, a chaiff cwestiwn ei gau gan y person a ofynnodd neu gan weinyddwr."
  - heading: "Trafod, yna cywiro"
    body: "Mae cwestiwn Aisha yn glanio yn sylwadau'r gost, felly mae'r atebion yn eistedd reit oddi tano. Mae [cynllunio gyda'ch gilydd](page:feature/plan-together) yn dweud mwy am sylwadau a chwestiynau. Mae Tom a Priya yn ei ddarllen ac mae'r fflat yn cael sgwrs. Maen nhw'n penderfynu mai gwin Tom a Priya oedd e, oherwydd mai nhw wnaeth ei yfed. Gallai fflat arall gadw'r rhaniad tair ffordd, neu gytuno ar rywbeth rhyngddynt, a byddai hynny'n iawn hefyd. Mae Side Badger yn cadw'r hyn rydych yn cytuno arno ac nid oes ganddo farn am win. Mae Tom yn golygu'r gost fel ei bod yn cael ei rhannu'n gyfartal rhyngddo ef a Priya, sef £22.50 yr un (£45 ÷ 2). Dyw Aisha ddim ynddi mwyach, felly mae ei chwestiwn yn mynd gyda'r hen fersiwn ac mae'r gwin yn ymuno â'r balansau eto. Cedwir y fersiwn gynharach."
  - heading: "Darllen y canlyniad"
    body: "Gyda'r gwin yn ôl i mewn, mae £58.50 yn ddyledus i Tom, mae ar Priya £10.50 ac mae ar Aisha £48. Mae Side Badger yn awgrymu dau daliad, y ddau i Tom. Mae £48 Aisha yr un fath ag yr oedd tra oedd y gwin wedi'i ddal yn ôl, am nad yw hi ynddo. Roedd £12 yn ddyledus i Priya cyn hyn, ond nawr mae arni £10.50, a'r gwahaniaeth yw ei hanner hi o'r gwin, £22.50. Pe bai'r rhaniad tair ffordd wedi sefyll, byddai ar Aisha £63 (£28 + £20 + £15). Gwerth £15 oedd yr holl anghytundeb. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch bob taliad o dan **Setlo**. Mae [setlo](page:feature/settle-up) yn trafod y gweddill."
  - heading: "Geirio fel bod pobl yn dal i siarad â chi"
    body: "Cwestiwn Aisha: “Ches i ddim o'r gwin. Allwn ni edrych ar y rhaniad?” Mae'n fyr, mae'n enwi'r gost ac mae'n gofyn yn hytrach na chyhuddo. Mae ambell arfer yn helpu."
    items:
      - "**Gofynnwch am y gost, nid am y person.** Mae “Allwn ni wirio'r rhaniad ar y gwin?” yn dechrau sgwrs. Mae “Pam mae fy nghyfran i yn cynnwys dy win di?” yn dechrau'r math arall."
      - "**Dywedwch beth hoffech ei weld yn digwydd.** Mae “Allwn ni ei rannu rhwng y rhai wnaeth ei yfed yn unig?” yn rhoi rhywbeth i'r grŵp gytuno ag ef neu ymateb iddo."
      - "**Rhowch reswm mewn brawddeg neu ddwy.** Enw'r maes yw **Eich cwestiwn** ac ni ellir ei adael yn wag."
      - "**Cadwch yr atebion mewn un lle.** Mae atebion yn mynd yn sylwadau'r gost, wrth ymyl y rhifau y maent yn sôn amdanynt."
  - heading: "Ei sefydlu yn Side Badger"
    items:
      - "**Trowch gwestiynau ymlaen.** Maen nhw i ffwrdd yn ddiofyn. Mae gweinyddwr yn agor **Gosodiadau** y grŵp, yn troi **Caniatáu cwestiynau am dreuliau** ymlaen o dan **Nodweddion** ar y tab **Cyffredinol** ac yn dewis **Cadw**. Mae ei droi i ffwrdd yn nes ymlaen yn clirio pob cwestiwn agored."
      - "**Codwch un.** Agorwch y gost ac, wrth ymyl eich enw eich hun yn y rhaniad, dewiswch **Mae gen i gwestiwn**. Ysgrifennwch eich rheswm yn **Eich cwestiwn** a dewiswch **Mae gen i gwestiwn** eto. Dim ond pobl yn y gost all wneud hyn. Mae'r gost nawr yn dangos bathodyn **Wedi'i gwestiynu**."
      - "**Dewch o hyd i'r hyn sydd wedi'i ddal yn ôl.** Yn rhestr y costau, mae **Wedi'i gwestiynu yn unig** yn dangos y costau sydd â chwestiwn agored."
      - "**Cywirwch hi, os yw'r grŵp yn cytuno.** Agorwch y gost, dewiswch **Golygu**, newidiwch **Rhannu rhwng** a dewiswch **Diweddaru Cost**. Mae pwy all olygu yn dibynnu ar ganiatâd y grŵp."
      - "**Caewch ef, os nad oes angen cywiro dim.** Gall y person a ofynnodd ddefnyddio'r botwm cau ar y bathodyn **Wedi'i gwestiynu**, sydd wedi'i labelu **Cau'r cwestiwn**, a gall gweinyddwr wneud hynny hefyd. Mae'r gost yn dychwelyd i'r balansau unwaith y caiff ei chwestiwn olaf ei gau."
  - heading: "Pan nad yw mor daclus â hynny"
    items:
      - "**Mae'r golygiad yn cadw'r sawl a ofynnodd yn y gost.** Os yw'r person a ofynnodd yn dal yn y gost, mae ei gwestiwn yn cario drosodd i'r fersiwn wedi'i golygu ac yn aros i'r person hwnnw, neu weinyddwr, ei gau. Nid yw cywiro'r swm yr un peth â chytuno ei fod wedi'i gywiro."
      - "**Doeddech chi ddim yn y gost.** Dim ond pobl sydd yn y gost all godi cwestiwn amdani. Os yw rhywbeth yn edrych yn od i chi, dywedwch hynny yn ei sylwadau neu gofynnwch i bwy bynnag a'i hychwanegodd."
      - "**Mae rhywun eisiau gadael y grŵp.** Mae cwestiwn agored yn atal y bobl yn y gost honno rhag gadael. Caewch y cwestiwn, neu olygwch y gost fel nad ydynt ynddi mwyach, a gallant fynd."
  - heading: "Beth nad yw Side Badger yn ei wneud yma"
    items:
      - "Dyw e ddim yn penderfynu pwy sy'n iawn. Mae'n dal y gost allan o'r balansau ac yn cadw'r hyn rydych yn cytuno arno."
      - "Dyw e ddim yn gofyn i neb gymeradwyo costau cyn iddynt gyfrif. Dim ond cost sydd wedi'i chwestiynu sy'n cael ei dal yn ôl."
      - "Ni all ddal rhan o gost yn ôl. Codwch gwestiwn amdani a bydd y cyfan ohoni'n gadael y balansau."
      - "Dyw e ddim yn symud arian. Rydych yn talu eich gilydd sut bynnag y dymunwch ac yn ei gofnodi."
