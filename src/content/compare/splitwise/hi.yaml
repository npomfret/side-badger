faq:
  heading: "सवाल"
  items:
    - q: "क्या Side Badger, Splitwise का मुफ्त विकल्प है?"
      a: "ग्रुप में बिल बांटने के लिए, हाँ। रसीद स्कैन, करेंसी कन्वर्ज़न और बिना विज्ञापन मुफ्त हैं, और रोज़ाना की कोई सीमा नहीं। अगर आपको नेटिव ऐप, ऑफलाइन इस्तेमाल, दोहराए जाने वाले खर्च या ऐप के अंदर पेमेंट चाहिए, तो Splitwise ये करता है और Side Badger नहीं।"
    - q: "Splitwise की जानकारी कहां से आती है?"
      a: "Splitwise के अपने पेजों से: उसका होम पेज, उसका Pro पेज और उसका हेल्प सेंटर। तालिका की हर पंक्ति उस पेज से जुड़ी है जहां से वह आई, और तालिका के ऊपर की तारीख बताती है कि हमने उन्हें कब पढ़ा। हम उन्हें हर तिमाही जांचते हैं।"
    - q: "क्या Side Badger मुफ्त रहेगा?"
      a: "Side Badger में आज सब कुछ मुफ्त है, और कोई पेड टियर नहीं है। अगर यह कभी बदला, तो हम पहले आपको सूचना देंगे। ब्योरा [कीमत का पेज](page:pricing) पर है।"
    - q: "क्या मेरे ग्रुप में सबको बदलना होगा?"
      a: "हाँ। ग्रुप में सबको एक मुफ्त Side Badger अकाउंट चाहिए, और वे लिंक या QR कोड से जुड़ सकते हैं।"
    - q: "क्या Side Badger का मोबाइल ऐप है?"
      a: "ऐप स्टोर में नहीं। यह आपके ब्राउज़र में चलता है: अपने फ़ोन पर साइन इन करें, फिर इसे अपनी होम स्क्रीन में जोड़ें ताकि यह ऐप की तरह खुले। कैसे, यह [यह कैसे काम करता है](page:how-it-works) में दिखाया गया है।"
