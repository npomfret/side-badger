meta:
  title: "Πώς λειτουργεί το Side Badger | Μοιράστε τα έξοδα της ομάδας σε πέντε βήματα"
  description: "Δημιουργήστε μια ομάδα, προσκαλέστε άτομα, προσθέστε έξοδα και τακτοποιηθείτε. Δείτε τι γίνεται ανάμεσα στο «κάποιος πλήρωσε» και το «είμαστε πάτσι», με ένα παράδειγμα."
h1: "Πώς λειτουργεί το Side Badger"
navLabel: "Πώς λειτουργεί"
lead: "Τι γίνεται ανάμεσα στο «κάποιος πλήρωσε» και το «είμαστε πάτσι»; Πέντε βήματα, κανένα φύλλο εργασίας και ένας ασβός που κυρίως στολίζει. Ορίστε όλη η διαδρομή, από την πρώτη ομάδα ως την τελευταία καταγεγραμμένη πληρωμή. Για λεπτομέρειες σε οποιοδήποτε βήμα, δείτε τον [διαχωρισμό εξόδων](page:feature/split-expenses) και την [εκκαθάριση](page:feature/settle-up)."
cta:
  heading: "Από το «θα πληρώσω εγώ» στο «είμαστε πάτσι»"
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το πρώτο έξοδο. Ο ασβός δεν θα κρίνει την απόδειξη."
  button: "Δημιουργία δωρεάν λογαριασμού"
steps:
  - title: "Δημιουργήστε μια ομάδα"
    body: "Φτιάξτε μία ομάδα για κάθε σπίτι, ταξίδι ή εκδήλωση, ώστε το ενοίκιο να μην καταλήξει ποτέ στην ίδια λίστα με το γαμήλιο δώρο. Δώστε της ένα όνομα, διαλέξτε το όνομα με το οποίο θα σας βλέπουν και, αν θέλετε, περιορίστε τα νομίσματα που δέχεται. Ο πίνακάς σας δείχνει έπειτα όλες τις ομάδες και πού βρίσκεστε σε καθεμία, σε μία οθόνη."
    shot: S02
    shotAlt: "Το παράθυρο δημιουργίας ομάδας με ανοιχτή την ενότητα περιορισμών νομισμάτων"
  - title: "Προσκαλέστε τους δικούς σας"
    body: "Μοιραστείτε έναν σύνδεσμο συμμετοχής ή δείξτε έναν κωδικό QR και ορίστε πόσο διαρκεί, από 15 λεπτά έως 5 ημέρες. Όποιος συμμετέχει χρειάζεται δωρεάν λογαριασμό και επαληθευμένο email, και μια ομάδα χωράει έως 50 άτομα. Αν θέλετε να ελέγχετε ποιος μπαίνει, ενεργοποιήστε την έγκριση και ένας διαχειριστής θα αφήνει μέσα κάθε άτομο."
    shot: S03
    shotAlt: "Το παράθυρο πρόσκλησης στην καρτέλα συνδέσμου, με κωδικό QR και επιλογές λήξης"
  - title: "Προσθέτετε έξοδα καθώς προκύπτουν"
    body: "Πείτε ποιος πλήρωσε, πόσο και για ποιους. Χωρίστε εξίσου, με ακριβή ποσά ή με ποσοστά και αφήστε έξω όποιον δεν συμμετείχε. Προσθέστε το έξοδο και όλοι το βλέπουν αμέσως, μαζί με το τι άλλαξε και ποιος το άλλαξε."
    shot: S05
    shotAlt: "Η φόρμα εξόδου με διαχωρισμό με ποσοστά, που μοιράζει το ενοίκιο ανάλογα με το μέγεθος του δωματίου"
  - title: "Παρακολουθήστε τα υπόλοιπα"
    body: "Το Side Badger κρατά ένα τρέχον υπόλοιπο για κάθε νόμισμα, ώστε να βλέπετε με μια ματιά ποιος χρωστά σε ποιον. Αντί να αφήνει όλους να ξεμπερδεύουν έναν ιστό μικροχρεών, προτείνει μια σύντομη λίστα πληρωμών που τακτοποιεί την ομάδα."
    shot: S10
    shotAlt: "Η οθόνη υπολοίπων με απλοποιημένα χρέη σε δύο νομίσματα και ενεργοποιημένη την Προβολή όλων"
  - title: "Τακτοποιηθείτε έξω από την εφαρμογή, καταγράψτε το μέσα"
    body: "Το Side Badger δεν μετακινεί ποτέ χρήματα. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή, ώστε τα υπόλοιπα να ενημερωθούν και η οθόνη του καθενός να ανανεωθεί χωρίς refresh. «Τακτοποιημένο» σημαίνει απλώς ότι τα υπόλοιπα είναι μηδέν. Κανείς δεν μπορεί να αφήσει μια ομάδα όσο χρωστά ή του χρωστούν χρήματα, οπότε όποιος πηγαίνει προς την έξοδο τακτοποιείται πρώτα."
    shot: S11
    shotAlt: "Η φόρμα πληρωμής με κουμπιά γρήγορης τακτοποίησης και ειδοποίηση για μερική πληρωμή"
requirements:
  heading: "Τι χρειάζεστε"
  items:
    - "Έναν δωρεάν λογαριασμό. Αρκεί μια διεύθυνση email και ένας κωδικός, και επαληθεύετε το email πριν μπορέσετε να προσθέσετε οτιδήποτε."
    - "Να είστε 18 ετών ή μεγαλύτεροι."
    - "Ένα σύγχρονο πρόγραμμα περιήγησης σε κινητό ή υπολογιστή και σύνδεση. Το Side Badger δεν είναι εφαρμογή καταστήματος και δεν λειτουργεί χωρίς σύνδεση."
    - "Προαιρετικά, μια θέση στην αρχική οθόνη. Δεν χρειάζεται κατάστημα εφαρμογών, γιατί μπορείτε να προσθέσετε το Side Badger στην αρχική οθόνη ή στο dock και ανοίγει σαν εφαρμογή."
example:
  heading: "Τρεις φίλοι μετά από μια βραδινή έξοδο"
  currency: GBP
  people:
    - id: ana
      name: Άνα
    - id: ben
      name: Μπεν
    - id: cara
