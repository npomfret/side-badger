  title: "Miongozo ya kugawanya gharama kwa haki | Side Badger"
  description: "Miongozo ya vitendo ya kugawanya kodi, majumba ya likizo na gharama za kikundi kwa haki, kila mmoja ukiwa na kikundi cha kubuni kinachoonekana halisi na hesabu zikionyeshwa."
h1: "Miongozo ya kugawanya gharama kwa haki"
navLabel: "Miongozo"
lead: "Maswali ambayo watu huuliza kabla tu ya kufungua lahajedwali, yakijibiwa kwa kikundi kinachoonekana halisi, hesabu na hatua za kufuata kwenye programu."
intro: "Kila mwongozo unafuata **kikundi kimoja cha kubuni** kuanzia gharama ya kwanza hadi malipo ya mwisho yaliyorekodiwa. Nambari zimekokotolewa kwa ajili yako, na hatua zinatumia skrini kwa majina ambayo programu inazitumia."
cta:
  heading: "Una kikundi kama hiki?"
  body: "Fungua akaunti, anzisha kikundi na ongeza gharama ya kwanza. Hesabu zinafanywa kwa ajili yako."
cardsHeading: "Chagua swali lako"
