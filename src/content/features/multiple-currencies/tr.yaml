sections:
  - heading: "Bütün grup için tek para birimi"
    body: "Grup bunu düşünmek istemiyorsa bir grup para birimi seçin; form her yeni harcamayı hâlâ görebildiğiniz ve değiştirebildiğiniz bir kurla ona çevirir. Bu yalnızca yeni ve kopyalanan harcamalar için geçerlidir. Düzenlemeler ve mevcut harcamalar olduğu gibi kalır; yani önceden kaydedilmiş hiçbir şey sizin altınızdan değişmez."
  - heading: "Euro borçlusunuz, sterlinle ödüyorsunuz"
    body: "Yenle ödendi, sterlinle mi ödeşiyorsunuz? Sorun değil. Bir ödemeyi kaydederken onu da çevirebilirsiniz; böylece euro borçlusu sterlinle ödeyebilir ve euro bakiyesi yine doğru çıkar. Birbirinize istediğiniz yolla ödeyin, sonra kaydedin."
  - heading: "Grup için kurallar"
    body: "Bir grubu gerçekten kullandığınız para birimleriyle sınırlayın ve formun doğru olanda açılması için bir varsayılan belirleyin. Portekiz tatilinin akşam yemeği faturasının yanında 139 başka seçeneğe ihtiyacı yoktur; [yurt dışında bir düğün](page:use-case/events-and-celebrations) ise muhtemelen ikisine ihtiyaç duyar."
limits:
  heading: "Sınırlar"
  items:
    - "Kur, harcama kaydedildiğinde sabitlenir. Eski harcamalar asla yeniden değerlenmez."
    - "Side Badger mümkün olan yerde güncel bir kur getirir. Her çift için garanti edilmez ve kuru her zaman kendiniz yazabilirsiniz."
    - "Grubun otomatik çevirmesi yalnızca yeni ve kopyalanan harcamalar için geçerlidir; düzenlemeler veya mevcut harcamalar için değil."
    - "Her harcama kendi para biriminde 999.999,99 ile sınırlıdır."
    - "140 para birimi var. Kripto paralar ve madenler bunların arasında değil."
    - "Side Badger ödemeleri kaydeder. Para taşımaz veya bozdurmaz."
useCasesHeading: "Bunun yardımcı olduğu yerler"
faq:
  heading: "Sorular"
  items:
    - q: "Hangi döviz kurunu kullanıyorsunuz?"
      a: "Harcamayı girerken, mevcut olduğunda getirilen güncel bir döviz kuru. Onu gerçekte uygulanan kura değiştirebilirsiniz ve çevrilen tutar güncellenir."
    - q: "Eski harcamalar yeniden değerlenir mi?"
      a: "Hayır. Kur, harcama kaydedildiğinde sabitlenir; yani piyasa oynadığı için bir bakiye kaymaz."
    - q: "Kriptoyu destekliyor musunuz?"
      a: "Hayır. 140 para birimi var ve kripto paralar bunların arasında değil."
    - q: "Neden 2.000.000 Endonezya rupisi giremiyorum?"
      a: "Her harcama kendi para biriminde 999.999,99 ile sınırlıdır. Başka bir para biriminde girip çevirin ya da iki harcamaya bölün."
    - q: "Çevirmenin bir maliyeti var mı?"
      a: "Hayır. Çevirmek, Side Badger'ın geri kalanı gibi ücretsizdir. [Fiyatlandırma](page:pricing) sayfasına bakın."
    - q: "Çevirmek zorunda mıyım?"
      a: "Hayır. Siz veya grubunuz çevirmeyi seçmedikçe para birimleri ayrı kalır ve her para biriminin kendi kısa ödeme listesi vardır."
