meta:
  title: "Oszd meg egy csoportos utazás költségeit, 140 pénznemben"
  description: "Kövesd, ki mit fizetett egy csoportos utazáson, add meg a költségeket helyi pénznemben, válts át, vagy ne, és számoljatok el egyszer a végén. Ingyenes, a böngészőben."
h1: "Oszd meg egy csoportos utazás költségeit, 140 pénznemben"
navLabel: "Csoportos utazások"
lead: "Kövesd a villát, a taxikat és azt az egy kör koktélt, amelynek kifizetésére senki nem emlékszik, hogy jelentkezett volna. A Side Badger vezeti a számolást, amíg távol vagy, [kezeli a fontot, az eurót és 138 másik pénznemet](page:feature/multiple-currencies), és hazaérkezéskor ad egy [rövid kifizetéslistát](page:feature/settle-up)."
cta:
  heading: "Nyaralási matek, mielőtt elhalványul a barnaság"
  body: "Hozz létre egy csoportot, küldd el a meghívó linket az utazás résztvevőinek, és add hozzá a költségeket, ahogy felmerülnek."
  button: "Ingyenes fiók létrehozása"
scenario:
  heading: "Mindenki fizetett valamit, valamilyen pénznemben"
  body: "Valaki lefoglalta a repjegyeket, valaki más kártyával fizette a villát, egy harmadik pedig készpénzzel állta a vacsorát. A harmadik napra senki nem tudja, ki áll nyerésre. A kérdés egyszerű, még ha a válasz általában egy olyan táblázatban él is, amelyet senki nem akar megnyitni. Ki mit fizetett, milyen pénznemben, és hogyan számolnak el végül egyszer?"
sections:
  - heading: "Indulás előtt"
    body: "Bocsásd szavazásra a villák szűkített listáját, ha szeretnéd, névtelenül, hogy a döntés a csoporté legyen, és ne azé, aki a legtovább duzzog. Aztán tartsd a közös bevásárlólistát a bevásárlási számlák mellett, hogy senki ne vegyen három tubus napkrémet, de egyetlen konnektoradaptert se."
  - heading: "Amíg távol vagy"
    body: "Add hozzá az egyes költségeket, ahogy felmerülnek, abban a pénznemben, amelyben fizették. Fotózd le a nyugtát, és a Side Badger kitölti az összeget, a dátumot és a helyet, hogy ellenőrizhesd; a nyugták képeit a Google AI-szolgáltatása olvassa. Váltsd át az összeget egy aktuális árfolyamon, amelyet átírhatsz arra, amelyet ténylegesen kaptál, és az eredeti összeg a költségnél marad. Vagy hagyd az eurót euróként, és döntsd el később. A csoport választhat egyetlen pénznemet is, és az új költségek automatikusan arra váltódnak."
  - heading: "Nem mindenki csinált mindent"
    body: "Néhányan kihagyták a vacsorát, mások nem mentek hajózni. Hagyd ki őket azokból a költségekből, amelyekben nem vettek részt, a többit pedig oszd fel [egyenlően, pontos összegek szerint vagy százalékosan](page:feature/split-expenses). Senki nem fizet az utazás azon részéért, amelyet átaludt."
  - heading: "Számoljatok el, amikor hazaértetek"
    body: "A Side Badger egy rövid kifizetéslistát javasol, amely mindenkit elszámoltat. Fizessetek egymásnak, ahogy akartok, aztán rögzítsétek. Vegyes pénznemeknél vezessétek mindegyiket külön, vagy váltsatok át menet közben; az alábbi lisszaboni példa mindkettőt megmutatja."
  - heading: "Legény- és leánybúcsúk"
    body: "Egy ünnepelttel töltött hétvége kicsit több adminisztrációt igényel. Csinálj belőle felügyelt csoportot, ahol az adminisztrátorok jóváhagyják az új tagokat, és a költségeket csak a létrehozók és az adminisztrátorok változtathatják. Az ünnepelt részéhez használj pontos összegeket, korlátozd a csoportot azokra a pénznemekre, amelyeket tényleg használtok, és zárold a csoportot, ha vége, hogy a számok a helyükön maradjanak."
exampleAfter: 4
