meta:
  title: "مشترکہ خرچے پر اختلاف ہو تو کیا کریں | Side Badger"
  description: "چبھتا ہوا پیغام رہنے دیں۔ خرچے پر سوال اٹھائیں تو بات چیت کے دوران وہ سب کے بیلنس سے باہر رہتا ہے۔ £45 کی پارٹی وائن کے ساتھ سمجھایا گیا۔"
h1: "مشترکہ خرچے پر اختلاف ہو تو کیا کریں"
navLabel: "متنازع اخراجات"
lead: "چبھتا ہوا پیغام بھیجنے کی بجائے خرچے پر سوال اٹھائیں۔ سوال کھلا رہنے تک پورا خرچہ سب کے بیلنس سے باہر رہتا ہے۔ تبصروں میں بات کر لیں، گروپ راضی ہو تو تقسیم میں ترمیم کریں، اور جس نے سوال پوچھا تھا وہ، یا کوئی ایڈمن، سوال بند کر دے۔"
cta:
  heading: "مشکل سوال شائستگی سے پوچھیں"
  body: "مفت اکاؤنٹ بنائیں، فلیٹ کے لیے گروپ شروع کریں اور کسی ایڈمن سے کہیں کہ اخراجات کے سوالات آن کر دے، جو اس وقت تک بند رہتے ہیں جب تک کوئی آن نہ کرے۔ پہلے سیر دیکھنی ہے؟ [یہ کیسے کام کرتا ہے](page:how-it-works) یا [مفت میں کیا کیا شامل ہے](page:pricing) دیکھیں۔"
sections:
  - heading: "تین ساتھی اور £45 کی وائن"
    body: "پارٹی کے بعد ٹام فلیٹ کے گروپ میں وائن شامل کرتا ہے۔ یہ £45 ہے، ٹام نے ادا کی، اور ٹام، پریا اور عائشہ میں برابر بٹی ہے، یعنی £15 فی کس۔ عائشہ پیتی نہیں۔ ٹام نے یہ پارٹی کے لیے خریدی تھی، اور پارٹی [فلیٹ](page:use-case/housemates) کے لیے تھی، اس لیے اس نے کچھ غلط نہیں کیا۔ عائشہ کا پوچھنا بھی غلط نہیں۔ یہاں کوئی ولن نہیں۔ بس £15 کی وائن پر اختلاف ہے اور اسے ناخوشگوار بنانے کے بہت سے طریقے ہیں۔ گھر کے سب لوگوں کو چبھتا ہوا پیغام بھیجنا ان میں سے ایک ہے۔ خرچے پر سوال اٹھانا نرم طریقہ ہے۔"
  - heading: "سوال کیا کرتا ہے"
    body: "عائشہ خرچہ کھولتی ہے اور سوال اٹھاتی ہے۔ پورا خرچہ سب کے بیلنس سے نکل جاتا ہے، صرف اس کا حصہ نہیں، اور باقی کسی چیز پر اثر نہیں پڑتا۔ بڑی خریداری (£84) اور صفائی والی (£60) پھر بھی شمار ہوتی ہیں، یعنی £28 + £20 = £48 فی کس۔ تو جب تک وائن رکی ہوئی ہے، عائشہ پر £48 واجب ہیں، ٹام کو £36 ملنے ہیں اور پریا کو £12۔ فلیٹ وائن کے بارے میں جو بھی فیصلہ کرے، اس دوران کسی کے بیلنس میں وہ شامل نہیں۔ خرچے میں شامل کوئی اور بھی اپنا سوال اٹھا سکتا ہے۔ وائن بیلنس میں صرف تب واپس آتی ہے جب اس پر کھلا ہوا آخری سوال بند ہو جائے، اور سوال کو وہی بند کرتا ہے جس نے پوچھا تھا یا کوئی ایڈمن۔"
  - heading: "بات کرنا، پھر ٹھیک کرنا"
    body: "عائشہ کا سوال خرچے کے تبصروں میں آتا ہے، اس لیے جواب عین اس کے نیچے رہتے ہیں۔ تبصروں اور سوالات کے بارے میں [مل کر منصوبہ بنائیں](page:feature/plan-together) میں مزید ہے۔ ٹام اور پریا اسے پڑھتے ہیں اور فلیٹ میں بات ہوتی ہے۔ وہ طے کرتے ہیں کہ وائن ٹام اور پریا کی تھی، کیونکہ انہوں نے پی۔ کوئی اور فلیٹ تین طرفہ تقسیم برقرار رکھ سکتا ہے، یا بیچ کا کوئی حل نکال سکتا ہے، اور وہ بھی ٹھیک ہوتا۔ Side Badger وہ محفوظ رکھتا ہے جس پر آپ متفق ہوں، اور وائن کے بارے میں اس کی کوئی رائے نہیں۔ ٹام خرچے میں ترمیم کرتا ہے تاکہ وہ اس کے اور پریا کے درمیان برابر بٹے، یعنی £22.50 فی کس (£45 ÷ 2)۔ عائشہ اب اس میں نہیں، اس لیے اس کا سوال پرانے ورژن کے ساتھ چلا جاتا ہے اور وائن بیلنس میں واپس آ جاتی ہے۔ پہلے والا ورژن محفوظ رہتا ہے۔"
  - heading: "نتیجہ پڑھنا"
    body: "وائن واپس آنے کے بعد ٹام کو £58.50 ملنے ہیں، پریا پر £10.50 واجب ہیں اور عائشہ پر £48۔ Side Badger دو ادائیگیاں تجویز کرتا ہے، دونوں ٹام کو۔ عائشہ کے £48 وہی رقم ہے جو وائن رکی ہونے پر اس کے ذمے تھی، کیونکہ وہ اس میں شامل نہیں۔ پریا جسے £12 ملنے تھے اب £10.50 دینے والی ہو گئی ہے، جو وائن کا اس کا £22.50 آدھا حصہ ہے۔ اگر تین طرفہ تقسیم برقرار رہتی تو عائشہ پر £63 واجب ہوتے (£28 + £20 + £15)۔ پورے اختلاف کی قیمت £15 تھی۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر ہر ادائیگی **تصفیہ کریں** کے نیچے ریکارڈ کریں۔ باقی [حساب برابر کرنے](page:feature/settle-up) میں ہے۔"
  - heading: "اسے ایسے الفاظ دیں کہ لوگ آپ سے بات کرتے رہیں"
    body: "عائشہ کا سوال: «میں نے وائن بالکل نہیں پی۔ کیا ہم تقسیم دیکھ سکتے ہیں؟» یہ مختصر ہے، خرچے کا نام لیتا ہے اور الزام لگانے کی بجائے پوچھتا ہے۔ کچھ عادتیں کام آتی ہیں۔"
    items:
      - >-
        **شخص کی نہیں، خرچے کی بات پوچھیں۔** «کیا ہم وائن کی تقسیم دیکھ لیں؟» بات چیت شروع کرتا ہے۔ «میرے نام تمہاری وائن کیوں لگی ہے؟» دوسری قسم کی شروع کرتا ہے۔
      - >-
        **بتائیں کہ آپ کیا چاہتے ہیں۔** «کیا یہ صرف انہی میں بٹ سکتی ہے جنہوں نے پی؟» گروپ کو کچھ دیتا ہے جس سے وہ اتفاق کرے یا جس کا جواب دے۔
      - >-
        **ایک دو جملوں میں وجہ دیں۔** خانے کا نام **آپ کا سوال** ہے اور اسے خالی نہیں چھوڑا جا سکتا۔
      - >-
        **جواب ایک ہی جگہ رکھیں۔** جواب خرچے کے تبصروں میں جاتے ہیں، انہی اعداد کے ساتھ جن کے بارے میں ہیں۔
  - heading: "Side Badger میں اسے ترتیب دیں"
    items:
      - >-
        **سوالات آن کریں۔** وہ ڈیفالٹ میں بند ہوتے ہیں۔ ایڈمن گروپ کی **ترتیبات** کھولتا ہے، **عمومی** ٹیب پر **خصوصیات** کے نیچے **اخراجات کے سوالات کی اجازت دیں** آن کرتا ہے اور **محفوظ کریں** چنتا ہے۔ بعد میں بند کرنے سے ہر کھلا سوال صاف ہو جاتا ہے۔
      - >-
        **ایک اٹھائیں۔** خرچہ کھولیں اور تقسیم میں اپنے نام کے ساتھ **میرا ایک سوال ہے** چنیں۔ **آپ کا سوال** میں اپنی وجہ لکھیں اور دوبارہ **میرا ایک سوال ہے** چنیں۔ یہ صرف خرچے میں شامل لوگ کر سکتے ہیں۔ اب خرچے پر **زیر سوال** کا بیج نظر آتا ہے۔
      - >-
        **دیکھیں کیا رکا ہوا ہے۔** اخراجات کی فہرست میں **صرف زیر سوال** وہ اخراجات دکھاتا ہے جن پر کوئی سوال کھلا ہے۔
      - >-
        **گروپ راضی ہو تو ٹھیک کریں۔** خرچہ کھولیں، **ترمیم کریں** چنیں، **کے درمیان تقسیم کریں** بدلیں اور **خرچہ اپ ڈیٹ کریں** چنیں۔ کون ترمیم کر سکتا ہے یہ گروپ کی اجازتوں پر منحصر ہے۔
      - >-
        **کچھ ٹھیک کرنے کو نہ ہو تو بند کر دیں۔** جس نے پوچھا تھا وہ اپنے **زیر سوال** بیج پر بند کرنے کا بٹن استعمال کر سکتا ہے، جس پر **سوال بند کریں** لکھا ہے، اور ایڈمن بھی کر سکتا ہے۔ آخری سوال بند ہوتے ہی خرچہ بیلنس میں واپس آ جاتا ہے۔
  - heading: "جب معاملہ اتنا سیدھا نہ ہو"
    items:
      - >-
        **ترمیم سوال پوچھنے والے کو شامل رکھتی ہے۔** اگر سوال پوچھنے والا ابھی بھی خرچے میں ہے تو اس کا سوال ترمیم شدہ ورژن پر بھی آ جاتا ہے اور اس کے، یا ایڈمن کے، بند کرنے کا انتظار کرتا ہے۔ رقم ٹھیک کر دینا اس بات سے اتفاق کرنا نہیں کہ مسئلہ ٹھیک ہو گیا۔
      - >-
        **آپ خرچے میں نہیں تھے۔** خرچے پر صرف اس میں شامل لوگ سوال اٹھا سکتے ہیں۔ اگر آپ کو کچھ ٹھیک نہیں لگتا تو اس کے تبصروں میں کہیں یا جس نے اسے شامل کیا اس سے پوچھیں۔
      - >-
        **کوئی گروپ چھوڑنا چاہتا ہے۔** کھلا سوال اس خرچے کے لوگوں کو گروپ چھوڑنے سے روکتا ہے۔ سوال بند کر دیں، یا خرچے میں ترمیم کریں کہ وہ اس میں نہ رہیں، اور وہ جا سکتے ہیں۔
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ فیصلہ نہیں کرتا کہ کون ٹھیک ہے۔ یہ خرچے کو بیلنس سے باہر رکھتا ہے اور وہ محفوظ رکھتا ہے جس پر آپ متفق ہوں۔"
      - "یہ کسی سے نہیں کہتا کہ اخراجات شمار ہونے سے پہلے منظور کرے۔ صرف زیر سوال خرچہ روکا جاتا ہے۔"
      - "یہ خرچے کا کچھ حصہ نہیں روک سکتا۔ سوال اٹھائیں تو پورا خرچہ بیلنس سے نکل جاتا ہے۔"
      - "یہ پیسے نہیں بھیجتا۔ آپ جیسے چاہیں ایک دوسرے کو ادا کرتے ہیں اور اسے ریکارڈ کرتے ہیں۔"
