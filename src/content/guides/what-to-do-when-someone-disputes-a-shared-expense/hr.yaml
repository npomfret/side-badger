faq:
  heading: "Pitanja"
  items:
    - q: "Mogu li dovesti u pitanje samo svoj dio?"
      a: "Ne. Pitanje zadržava cijeli trošak, za sve u njemu. Ako je pogrešna samo podjela, rješenje je uređivanje podjele."
    - q: "Tko može zatvoriti pitanje?"
      a: "Osoba koja ga je postavila ili administrator grupe. Ako onaj tko je dodao trošak nije administrator, ne može ga zatvoriti umjesto onoga tko je pitao."
    - q: "Briše li uređivanje troška original?"
      a: "Ne. Prethodna verzija ostaje sačuvana. Tko može uređivati, određuju dopuštenja grupe, pa vrijedi prvo reći kući, jer se stanja mijenjaju."
