meta:
  title: "كيف تقسّم الفواتير مع شريك يكسب أكثر | Side Badger"
  description: "تقسيم 50/50 يصبح محرجاً حين يكسب أحدكما أكثر بكثير. قسّم الفواتير المشتركة بحسب الدخل، مع الحسابات لشخصين وبلا جدول بيانات."
h1: "كيف تقسّم الفواتير مع شريك يكسب أكثر"
navLabel: "شريك يكسب أكثر"
lead: "اجمع صافي راتبيكما، واحسب حصة كل واحد من المجموع، وقرّب إلى نسب مئوية بأعداد صحيحة. صافي راتب مايا £2,800 وصافي راتب جون £1,700، فيقسّمان الفواتير المشتركة 62/38. أدخل هاتين النسبتين على مصروف مشترك في Side Badger، ثم انسخه كلما عادت الفاتورة نفسها."
cta:
  heading: "أجرِ الحساب مرة واحدة"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة لكما، وأدخل الإيجار بنسبكما. وإيجار الشهر القادم مجرد نسخة. تريد جولة أولاً؟ انظر [كيف يعمل](page:how-it-works) أو [ما الذي يشمله الاستخدام المجاني](page:pricing)."
sections:
  - heading: "راتبان، وشقة واحدة، وصمت مهذّب واحد"
    body: "تعيش مايا وجون معاً. يبلغ صافي راتب مايا £2,800 في الشهر، وصافي راتب جون £1,700. ولسنتين كانا يقسّمان كل شيء 50/50، لأن ذلك كان بسيطاً ولم يرد أي منهما أن يكون من يفتح الموضوع. ثم نظر جون إلى الإيجار وحده. نصف £1,400 هو £700، وهذا ربع صافي راتب مايا و41% من راتبه. لم يكن أحد غير منصف. ولم يُجرِ أحد الحساب. يصل كثير من [الأزواج](page:use-case/couples) إلى هنا في النهاية. وبينما يتناولان وجبة جاهزة اتفقا على أن تقتطع الفواتير المشتركة حصة متقاربة من كل راتب."
  - heading: "الطريقة، مع إظهار الحسابات"
    body: "أربع خطوات، وآلة حاسبة، ومحادثة كنتما ستجريانها على أي حال."
    items:
      - "**اتفقا على ما يُحسب دخلاً.** تستخدم مايا وجون صافي الراتب، أي المال الذي يصل إلى البنك كل شهر. مجموعهما £2,800 + £1,700 = £4,500."
      - "**احسبا حصة كل واحد.** حصة مايا 2,800 ÷ 4,500، أي 62.2%. وحصة جون 1,700 ÷ 4,500، أي 37.8%."
      - "**قرّبا إلى أعداد صحيحة.** تصبح 62.2% إلى 62 و37.8% إلى 38. ومع شخصين، قرّب رقماً واحداً واطرحه من 100 لتحصل على الآخر، فيكون المجموع 100 دائماً."
      - "**تحققا مما يعنيه ذلك.** على إيجار £1,400، تدفع مايا £868 (62%) ويدفع جون £532 (38%). وهذا نحو 31% من صافي راتب كل منهما. أما النصف لكل منهما فكان سيأخذ 25% من راتب مايا و41% من راتب جون."
  - heading: "قراءة الشهر"
    body: "دفعت مايا إيجار £1,400 ودفع جون المبلغ الباقي، £216. حصة مايا من الشهر £868.00 + £111.60 + £18.00 = £997.60، وقد دفعت £1,400، فمستحق لها £402.40. وحصة جون £532.00 + £68.40 + £18.00 = £618.40، وقد دفع £216، فيدين بمبلغ £402.40. يقترح Side Badger دفعة واحدة، من جون إلى مايا، بمبلغ £402.40، وتسجّلها عبر [تسوية الحسابات](page:feature/settle-up) بعد أن تتم. ولو قُسِّم الشهر نفسه 50/50 لدفع جون لمايا £592.00."
  - heading: "جهّزها في Side Badger"
    body: "عشر دقائق، معظمها يذهب في النسب."
    items:
      - "**أنشئ المجموعة.** من لوحة التحكم اختر **إنشاء مجموعة** وسمِّها باسم الشقة. اختر **دعوة الآخرين** وأرسل إلى جون الرابط أو رمز QR. يسجّل الدخول أو ينشئ حساباً مجانياً، ويختار الاسم الذي يريد أن يظهر به في هذه المجموعة. لا يرى المجموعة إلا أعضاؤها، فهذه المجموعة لكما وحدكما."
      - "**أضف الإيجار.** اختر **إضافة مصروف**. أدخل الوصف والمبلغ، وتحت **من دفع؟** اختر مايا. أبقِ الشخصين تحت **تقسيم بين**، ثم تحت **كيفية التقسيم** اختر **نسبة مئوية** واكتب 62 و38. ينبّهك النموذج إذا لم يكن مجموع النسب 100. اختر **حفظ المصروف**."
      - "**أضف الفواتير الأخرى.** تدخل الطاقة والإنترنت بالطريقة نفسها، مع جون دافعاً وبالنسبتين نفسيهما 62 و38. أما الوجبة الجاهزة فمصروف مستقل، مع ترك **كيفية التقسيم** على **بالتساوي**."
      - "**انسخه الشهر القادم.** افتح إيجار الشهر الماضي واختر **نسخ المصروف**. تحتفظ النسخة بالدافع والمبلغ والتقسيم، وتأخذ تاريخ اليوم. غيّر المبلغ إذا تغيّر الإيجار، ثم اختر **إنشاء نسخة**. وفاتورة الطاقة تعمل بالطريقة نفسها."
      - "**اعرف من يدين لمن.** يعرضه قسم **الأرصدة** ويقترح قائمة قصيرة من الدفعات. ادفعا لبعضكما بالطريقة التي تناسبكما، ثم سجّلا الدفعة تحت **تسوية**."
  - heading: "50/50، أو بحسب الدخل، أو فاتورة بفاتورة"
    body: "ليس هناك جواب صحيح، بل الجواب الذي يستطيع كلاكما التعايش معه. وهذه ثلاثة شائعة."
    items:
      - "**النصف لكل منكما في كل شيء.** الأسهل في المتابعة، ويناسب الأزواج الذين تتقارب رواتبهم."
      - "**بحسب الدخل لكل ما هو مشترك.** ما تفعله مايا وجون. محادثة واحدة، وزوج واحد من النسب."
      - "**فاتورة بفاتورة.** الإيجار والفواتير بحسب الدخل، والعطلات والمتع الصغيرة 50/50 أو بما تتفقان عليه، وتأخذ كل فاتورة القاعدة التي تناسبها."
  - heading: "اتفقا على ما يُعدّ مشتركاً"
    body: "تدور الخلافات عادةً حول القائمة لا حول النسب. الإيجار والطاقة والإنترنت والتسوق الأسبوعي والأريكة تُعدّ مشتركة في معظم البيوت. أما اشتراك مايا في النادي الرياضي واشتراك جون الخاص بكرة القدم فقد لا يكونان كذلك. اتفقا على القائمة مرة واحدة، واكتباها، وضعا في المجموعة التكاليف المشتركة فقط."
  - heading: "الوجبة الجاهزة تبقى 50/50، عن قصد"
    body: "المتع الصغيرة اختيارية، ولا ينبغي أن يحتاج أحد إلى آلة حاسبة ليطلب طبقاً من الدمبلنغ. في Side Badger الوجبة الجاهزة مصروف آخر. يدفع جون £36، ويبقى **كيفية التقسيم** على **بالتساوي**، وتبلغ حصة كل منهما £18."
  - heading: "حين يتغيّر راتب أحدكما"
    body: "علاوة أو وظيفة جديدة أو فترة انقطاع عن العمل تغيّر الحساب. احسبا النسب الجديدة بالطريقة نفسها واستخدماها من المصروف التالي. تبقى المصروفات السابقة كما كانت. انسخ إيجار الشهر الماضي، وغيّر النسب، ثم اختر **إنشاء نسخة**. ولتصحيح مصروف أُدخل بالفعل، عدّله إذا كانت أذونات المجموعة تسمح بذلك، وأخبر شريكك أولاً، لأن الأرصدة ستتغير. وتُحفظ النسخة السابقة. اتفقا على موعد إعادة الحساب، مثل مرة في السنة، وسوّيا الحساب قبل أن تنتقلا إلى النسب الجديدة حتى يُغلق التقسيم القديم بحساب نظيف."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا يسأل أبداً عن دخل أي أحد ولا يحسب النسب. تكتب الأرقام التي اتفقتما عليها."
      - "لا يستطيع تعيين تقسيم افتراضي للمجموعة كلها. النسب تُوضع على كل مصروف، فانسخ مصروفاً فيه النسب نفسها."
      - "ليس فيه فواتير متكررة، فتنسخ إيجار الشهر الماضي كل مرة."
      - "لا ينقل المال أبداً. تدفعان لبعضكما بالطريقة التي تناسبكما وتسجّلان ذلك."
