featuresHeading: Bidaia batek zertan egiten duen
faq:
  heading: Galderak
  items:
    - q: Afaria saltatu zuten pertsonak kanpoan utz daitezke?
      a: Bai. Aukeratu nor izan den gastu bakoitzaren parte, eta horiei bakarrik kobratzen zaie.
    - q: Seinalerik gabe funtzionatzen al du?
      a: Ez. Side Badger-ek konexioa behar du, beraz gehitu kostuak wifira itzultzen zarenean.
    - q: Denek zerbait instalatu behar al dute?
      a: Ez. Nabigatzailean funtzionatzen du. Bidali gonbidapen-esteka eta jendea telefonotik sartzen da.
    - q: Zer kanbio-tasa erabiltzen du?
      a: Egungo kanbio-tasa bat gastua sartzen duzunean, edo zurea beste bat lortu baduzu. Tasa gastua gordetzen denean finkatzen da, beraz gastu zaharrak ez dira inoiz berriro baloratzen.
    - q: Bidaiaren ondoren taldea izoztu al dezakegu?
      a: Bai. Administratzaile batek taldea blokea dezake zenbakiak lekuan geratzeko.
    - q: Zenbatekoen mugarik ba al dago?
      a: Bai. 999,999.99 gastu bakoitzeko, bere monetan.
