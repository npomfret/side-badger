faq:
  heading: "Ceisteanna"
  items:
    - q: "An íocann an fear is fearr nó an mhaighdean onóra níos mó?"
      a: "Ní íocann ach má aontaíonn an grúpa leis. Ní thugann an aip ról speisialta d'aon duine sna suimeanna. Má tá duine ag clúdach níos mó, roghnaigh **Méideanna cruinne** nó **Céatadán** faoi **Conas a roinntear** agus cuir isteach na sciar a d'aontaigh sibh."
    - q: "Cad faoi dheochanna nár ól roinnt daoine?"
      a: "Cuir na deochanna isteach mar chostas ar leith agus cuir tic ar na daoine a d'ól iad amháin. Má bhí méid difriúil ag gach duine, roghnaigh **Méideanna cruinne** agus clóscríobh sciar gach duine. Ní íocann aon duine as an rud nach raibh acu."
    - q: "An bhfeicfidh an t-aoi onóra an grúpa ar ball?"
      a: "Feicfidh, nuair a bhíonn an t-iontas thart. Tabhair cuireadh don aoi onóra, ansin is féidir le riarthóir an ról **Breathnóir** a thabhairt dóibh faoi **Slándáil & Ceadanna** i socruithe an ghrúpa. Feiceann breathnóir gach rud agus ní athraíonn sé aon rud, mar sin fan go dtí nach bhfuil aon rud ina rún. Teastaíonn cuntas saor in aisce uathu le dul isteach."
