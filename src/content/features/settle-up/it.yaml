meta:
  title: Salda i conti con meno pagamenti | Side Badger
  description: Scopri chi deve cosa a chi nel tuo gruppo, ottieni una breve lista di pagamenti che salda tutti e registra ogni pagamento man mano. Gratis.
h1: Salda i conti con meno pagamenti
navLabel: Saldare i conti
lead: Side Badger tiene un saldo aggiornato per tutti nel gruppo e suggerisce una breve lista di pagamenti che lo salda. Vi pagate come vi fa più comodo, poi registrate il pagamento. Se vuoi prima vedere come si dividono i numeri, parti da [dividere le spese](page:feature/split-expenses).
cta:
  heading: Pronto a sbrogliare chi deve cosa a chi?
  body: Crea un account, avvia un gruppo e aggiungi la prima spesa. Ai saldi pensiamo noi.
  button: Crea un account gratuito
problem:
  heading: Saldi che si aggiornano man mano
  body: Ogni spesa cambia chi deve cosa a chi, quindi Side Badger tiene i saldi aggiornati man mano che si aggiungono spese e pagamenti. Tutti nel gruppo vedono subito una modifica, e vedono cosa è cambiato e chi l'ha cambiato. I saldi sono tenuti per valuta, quindi euro e sterline restano nelle loro colonne, a meno che una spesa sia stata convertita quando è stata inserita. Di default vedi i debiti che ti riguardano; **Mostra tutto** elenca l'intero gruppo.
workflow:
  heading: Tre passaggi per essere pari
  steps:
    - title: Guarda chi deve cosa a chi
      body: Apri i saldi del gruppo per vedere cosa devi, cosa ti spetta e una breve lista di pagamenti che salda tutti, calcolata per ogni valuta. Le spese contestate restano fuori dai conti finché non sono risolte. Nell'esempio dei coinquilini qui sotto, sei pagamenti diventano due.
      shot: S10
      shotAlt: La schermata dei saldi con i debiti semplificati in due valute e l'opzione Mostra tutto attivata
    - title: Paga come preferisci, poi registralo
      body: Bonifico, contanti, un favore che ti devono dall'ultima vacanza. Side Badger non sposta il denaro. Quando i soldi sono passati di mano, registra il pagamento e il saldo si aggiorna per tutti.
      shot: S11
      shotAlt: Il modulo del pagamento con i pulsanti di saldo rapido e l'avviso mostrato per un pagamento parziale
    - title: Controlla che sia arrivato
      body: Il pagamento entra nello storico del gruppo, dove tutti nel gruppo possono vederlo e reagire con un'emoji. Festeggia un pagamento quando arriva.
      shot: S12
      shotAlt: Lo storico dei pagamenti con reazioni emoji su un pagamento
