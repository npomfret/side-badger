faq:
  heading: Preguntas
  items:
    - q: ¿Qué tipo de cambio usa Side Badger?
      a: Un tipo de cambio actual, obtenido al introducir el gasto cuando hay uno disponible. Puedes cambiarlo por el tipo que te aplicaron de verdad.
    - q: ¿Puede el grupo ceñirse a libras y yenes?
      a: Sí. En la **Configuración** del grupo, activa **Restringir monedas para este grupo** en **Configuración de moneda**, elige las **Monedas permitidas** y fija la **Moneda predeterminada para nuevos gastos**. Menos opciones en la lista, menos equivocaciones al pagar en caja.
    - q: ¿Tenemos que convertir?
      a: No. Las monedas se quedan por separado salvo que tú o tu grupo decidáis convertir, y cada moneda tiene su propia lista corta de pagos.
