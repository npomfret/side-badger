sections:
  - heading: "댓글과 반응, 숫자 바로 옆에서"
    body: "모든 지출에는 자기만의 댓글 스레드가 있고, 그룹과 각 목록과 각 투표도 마찬가지입니다. 택시비가 왜 그렇게 나왔는지는 아무도 다시 스크롤해 보지 않는 채팅방이 아니라 택시 지출 아래에서 물어보세요. 영수증 사진이나 예약 PDF를 첨부한 다음, 지출, 결제, 댓글에 엄지척, 하트, 웃음, 놀람, 슬픔, 축하 반응을 달 수 있어요. 결제가 도착하면 축하해 주세요. 사이드 배저가 보낼 수 있는, 박수에 가장 가까운 것입니다."
  - heading: "말다툼 없이 지출에 질문하기"
    body: "그룹에서 지출 질문을 켰다면, 지출에 포함된 사람은 누구나 **질문이 있습니다**를 고르고 이유를 말할 수 있습니다. 질문은 그 지출에 댓글로 게시되고, 지출에는 **질문됨** 배지가 붙고, 질문이 해결될 때까지 그 지출 전체가 모두의 잔액에서 빠집니다."
    items:
      - "**켜기.** 기본값은 꺼져 있습니다. 관리자가 그룹 설정의 **기능**에서 **지출 질문 허용**을 켭니다."
      - "**닫기.** 질문한 사람이나 관리자가 **질문 닫기**를 고릅니다. 여러 사람이 같은 지출에 질문했다면 마지막 질문이 닫힐 때 잔액으로 돌아갑니다."
      - "**편집하기.** 지출을 편집하면 열린 질문은 여전히 그 지출에 몫이 있는 모든 사람에게 새 버전으로 이어집니다. 편집으로 빠진 사람의 질문은 이전 버전과 함께 끝나므로, 그 사람이 닫을 것이 남지 않습니다."
      - "**찾기.** 지출 목록에는 **질문된 것만** 필터가 있습니다. 이것은 승인 단계가 아닙니다. 누군가 질문한 지출만 보류되고, 나머지는 추가되는 즉시 계산에 반영됩니다."
  - heading: "질문이 풀리는 과정"
    body: "Tom이 파티 와인 £45를 추가하고, 세 룸메이트가 나눕니다. Aisha는 술을 마시지 않았으므로 질문을 제기하고, 질문이 열려 있는 동안 그 와인은 누구의 계산에도 들어가지 않습니다. 집 식구들이 와인은 Tom과 Priya의 몫이라고 합의해서, Tom이 분할을 두 사람으로 편집합니다. Aisha는 더 이상 그 지출에 없으므로 Aisha의 질문은 이전 버전과 함께 끝나고(이전 버전은 남아 있습니다), 와인은 1인당 £15가 아니라 £22.50로 바로 잔액에 다시 들어갑니다. Aisha가 지출에 남아 있었다면 질문이 그대로 이어져 Aisha나 관리자가 닫을 때까지 기다렸을 거예요. 아래에서 Aisha의 £48는 장보기 £28와 청소 도우미 £20를 합친 금액이고, Priya의 £10.50는 Priya의 몫 £70.50(£28, £20, £22.50)에서 Priya가 낸 £60를 뺀 금액입니다. 아주 [룸메이트](page:use-case/housemates)다운 말다툼이죠. 질문을 어떻게 적으면 좋을지는 [공동 지출에 이의가 제기됐을 때 할 일](page:guide/what-to-do-when-someone-disputes-a-shared-expense)을 참고하세요."
  - heading: "공유 목록, 장보기를 위해"
    body: "그룹에서 목록을 시작하고, 장보기 목록 같은 이름을 붙이고, 항목을 추가하고, 체크하세요. 항목을 끌어서 더 나은 순서로 바꾸고, 진행 개수가 오르는 걸 지켜보고, 누가 귀리 우유를 잘못 사 왔을 때는 목록에 댓글을 다세요. 끝난 목록은 보관해서 치우고(**보관된 항목 표시**로 되살릴 수 있어요), 목록을 복사해 다시 쓸 수도 있습니다. 공유 장보기 목록을 장보기 비용 옆에 두면, 목록은 무엇을 살지를, 지출은 얼마였는지를 알려 줍니다. 누가 목록을 만들고 수정할 수 있는지는 그룹의 권한에 따라 달라지는데, [그룹과 권한](page:feature/groups-and-permissions)에서 설명합니다."
  - heading: "투표, 원한다면 익명으로"
    body: "빌라는 어디로 할지, 선물에 얼마를 쓸지, 보트 투어가 값어치가 있는지처럼 비용을 좌우하는 것을 그룹에 물어보세요. 투표에는 질문 하나와 두 개에서 열 개의 옵션이 있습니다. 한 사람이 가질 표 수는 하나(단일 선택)부터 열 개까지 정하고, 투표를 익명으로 할지도 정합니다. **익명 투표**는 누가 무엇에 투표했는지 숨기며, 첫 표가 들어온 뒤에는 바꿀 수 없어요. 사람들은 투표가 종료되기 전까지 자기 표를 바꾸거나 취소할 수 있고, 그룹이 마음을 바꾸면 투표를 다시 열 수 있습니다. 빌라 고르기야말로 [그룹 여행](page:use-case/group-trips)의 본질이고, 선물 예산 합의는 [행사와 기념 모임](page:use-case/events-and-celebrations)의 단골 메뉴입니다."
  - heading: "활동 피드, 조용히 바뀌는 일이 없도록"
    body: "모든 그룹에는 활동 내역이 있고, 알림 벨은 내 모든 그룹의 활동을 한곳에 모아 줍니다. 지출을 추가하면 모두에게 새로 고침 없이 바로 보이고, 피드에는 무엇이 바뀌었는지와 누가 바꿨는지가 나옵니다. 추가, 편집, 삭제된 지출, 제기되고 닫힌 질문, 댓글, 목록과 투표의 변경, 기록된 결제가 모두 해당됩니다."
  - heading: "푸시 알림, 원한다면"
    body: "푸시 알림은 선택 사항입니다. 계정 **설정**의 **알림**에서 켜면, 새 지출이나 댓글처럼 그룹에 새 활동이 있을 때 기기가 알려 줍니다. 기기마다 따로 켜야 하고, 브라우저가 먼저 허락을 묻습니다. iPhone이나 iPad에서는 홈 화면에 추가한 앱에서만 작동하는데, [웹 앱](page:feature/web-app) 페이지에서 설명합니다. 전달이 보장되지 않으니, 약속이 아니라 편의 기능으로 여기세요."
limits:
  heading: "한계"
  items:
    - "댓글, 목록, 투표는 그룹의 돈을 위한 것입니다. [서비스 약관](page:terms)은 게시하는 모든 것이 그룹 재정과 관련되어야 한다고 요구하므로, 이곳은 지출을 계획하는 곳이지 일반 채팅이나 할 일 앱이 아닙니다."
    - "댓글은 최대 500자이고, 이미지나 PDF 첨부를 최대 세 개까지, 각각 최대 5 MB로 붙일 수 있습니다. 댓글은 작성자만 삭제할 수 있습니다."
    - "지출 질문은 기본적으로 꺼져 있고, 관리자가 그룹마다 켭니다. 지출에 포함된 사람만 질문할 수 있고, 기능을 끄면 열린 질문이 모두 지워지며, 자신이 포함된 지출에 열린 질문이 있는 동안에는 아무도 그룹을 나갈 수 없습니다."
    - "그룹에는 목록을 최대 100개 둘 수 있고, 목록마다 항목 최대 200개, 항목마다 최대 500자까지 쓸 수 있습니다. 그룹 권한이 누가 목록을 만들고 편집하고 삭제할 수 있는지를 정하며, 잠긴 그룹에서는 어떤 변경도 할 수 없습니다."
    - "그룹에는 투표를 최대 50개 둘 수 있고, 투표마다 옵션 두 개에서 열 개, 한 사람당 최대 열 표입니다. 투표에는 마감일이 없고 저절로 종료되지 않습니다."
    - "활동 내역은 90일 동안 남습니다."
    - "푸시 알림은 계정마다, 기기마다 직접 켜야 합니다. 알림을 지원하는 브라우저와 내 허락이 필요하고, iPhone과 iPad에서는 홈 화면에 추가한 앱에서만 작동하며, 전달은 보장되지 않습니다. 활동에 대한 이메일이나 문자 알림은 없고 결제 독촉도 없으므로, 결제를 챙기는 일은 여전히 여러분 몫입니다."
useCasesHeading: "함께 계획하는 것이 도움이 되는 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "투표를 익명으로 할 수 있나요?"
      a: "네. 투표를 만들 때 **익명 투표**를 켜면 누가 무엇에 투표했는지 숨겨집니다. 나중에는 바꿀 수 없으니 첫 표가 들어오기 전에 정하세요."
    - q: "투표가 저절로 종료될 수 있나요?"
      a: "아니요. 투표에는 마감일이 없으므로, 그룹이 결정을 내리면 투표를 만든 사람이 **투표 종료**를 고릅니다. 그룹이 마음을 바꾸면 **투표 다시 열기**로 되살릴 수 있어요."
    - q: "목록에는 항목을 몇 개까지 넣을 수 있나요?"
      a: "목록마다 최대 200개, 그룹마다 목록 최대 100개입니다. 항목 하나에 최대 500자까지 쓸 수 있으니, 귀리 우유 얘기로는 차고 넘칩니다."
    - q: "누가 질문을 닫을 수 있고, 그동안 지출은 어떻게 되나요?"
      a: "질문한 사람이나 그룹 관리자가 닫을 수 있습니다. 질문이 열려 있는 동안 그 지출 전체가 모두의 잔액에서 빠집니다. 그 지출에 열린 마지막 질문이 닫히거나, 편집으로 질문한 사람이 그 지출에서 빠지면 다시 들어옵니다."
    - q: "목록과 댓글을 할 일 앱이나 그룹 채팅으로 써도 되나요?"
      a: "아니요. 댓글, 목록, 투표는 그룹의 돈을 위한 것이며, [서비스 약관](page:terms)도 그걸 요구합니다. 장보기 목록, 예산 투표, “이게 왜 £45지?” 같은 것을 생각하세요."
    - q: "사이드 배저가 활동에 대해 이메일을 보내나요?"
      a: "아니요. 활동에 대한 이메일이나 문자 알림은 없습니다. 기기마다 푸시 알림을 켤 수 있고, 앱의 알림 벨에서 새 소식을 볼 수 있어요."
