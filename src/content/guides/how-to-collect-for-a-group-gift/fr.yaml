faq:
  heading: Questions
  items:
    - q: "Et si nous collectons plus que le cadeau ne coûte ?"
      a: "Les montants exacts doivent faire le prix, donc rognez les parts jusqu'à ce que ce soit le cas. Ou mettez le surplus sur quelque chose de concret, comme des fleurs, et saisissez-le comme une seconde dépense, à l'image de la carte et du papier cadeau dans l'exemple."
    - q: "Quelqu'un peut-il participer sans rejoindre le groupe ?"
      a: "Pas si vous voulez qu'il entre dans le décompte. Toute personne dans le partage a besoin d'un compte gratuit et d'être dans le groupe. Pour quelqu'un qui n'a que des espèces, Priya pourrait les prendre et saisir le cadeau pour ce que le groupe doit encore. Par exemple, si Sam lui a donné 40 £ en espèces, elle saisirait 200 £ et les partagerait en 60, 60 et 80 entre elle, Omar et Lena."
    - q: "Le sondage peut-il décider combien chacun met ?"
      a: "Non. Un sondage fixe un chiffre pour tout le groupe, comme le budget. Quant à la part de chacun, c'est à vous d'en convenir entre vous, puis de la saisir dans la dépense en **Montants exacts**."
