sections:
  - heading: "Skráðu greiðslu"
    body: "Þegar einhver borgar skaltu skrá það á réttan aðila. Hnapparnir fyrir fljótlegt uppgjör fylla út upphæðina úr greiðslunum sem lagt er til og þú getur bætt við athugasemd eins og „millifærsla“ (allt að 500 stafir). Borgaðu aðeins hluta þess sem þú skuldar og afgangurinn helst á stöðunni. Ef þú slærð inn of lítið eða of mikið varar Side Badger þig við áður en þú vistar. Til að skrá greiðslu þarf heimild til að breyta útgjöldum og dagsetningin má ekki vera í framtíðinni."
  - heading: "Greitt í öðrum gjaldmiðli?"
    body: "Staðan helst í gjaldmiðlinum sem var greitt í, svo evruskuld helst evruskuld. Skuldar þú evrur en borgar í pundum? Umreiknaðu greiðsluna um leið og þú skráir hana, á núverandi gengi eða á genginu sem þú fékkst í raun. Gengið festist þegar greiðslan er vistuð. [Margir gjaldmiðlar](page:feature/multiple-currencies) útskýrir hvernig umreikningur virkar og [hópferðir](page:use-case/group-trips) sýna hann í notkun."
  - heading: "Saga sem þú getur skoðað"
    body: "Hver skráð greiðsla helst í sögu hópsins með dagsetningu, upphæð og athugasemd. Aðeins sá sem skráði greiðslu getur breytt henni, og hann eða stjórnandi hópsins getur eytt henni. Greiðsla sem tengist einhverjum sem hefur yfirgefið hópinn er læst. Sjá [meðleigjendur](page:use-case/housemates) fyrir útreiknað dæmi um meðleigjendur."
limits:
  heading: "Það sem Side Badger gerir ekki"
  items:
    - "Side Badger flytur ekki peninga, sendir ekki greiðslutengla og sendir ekki greiðslubeiðnir. Greiðsla í appinu er skráning á greiðslu sem var gerð annars staðar."
    - "Greiðslurnar sem lagðar eru til koma úr einfaldri pörunaraðferð sem er beitt fyrir hvern gjaldmiðil. Hún leggur alltaf til færri greiðslur en fjöldi þeirra sem eru með stöðu í þeim gjaldmiðli (fjórir menn, mest þrjár greiðslur), en hún finnur ekki alltaf minnsta mögulega fjölda."
    - "Þú getur ekki slökkt á tillögunum. **Sýna allt** birtir allar greiðslurnar sem lagðar eru til í hópnum, ekki aðeins þínar."
    - "Gjaldmiðlar eru aldrei jafnaðir hver á móti öðrum nema útgjöldin hafi verið umreiknuð þegar þau voru skráð."
    - "Það eru engar áminningar, svo að elta greiðslu er enn á þinni könnu."
useCasesHeading: "Hvar uppgjör skiptir máli"
faq:
  heading: "Spurningar"
  items:
    - q: "Sendir Side Badger peningana?"
      a: "Nei. Borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna í Side Badger svo staðan uppfærist."
    - q: "Get ég slökkt á greiðslunum sem lagðar eru til?"
      a: "Nei. Einföldunin helst kveikt og **Sýna allt** birtir allar greiðslurnar sem lagðar eru til í hópnum, ekki aðeins þær sem tengjast þér."
    - q: "Af hverju eru evrur og pund höfð í sundur?"
      a: "Staðan helst í gjaldmiðlinum sem þú greiddir í nema þú umreiknir þegar þú skráir útgjald eða greiðslu. Skuldir í mismunandi gjaldmiðlum eru aldrei jafnaðar hver á móti annarri."
    - q: "Hvað ef einhver borgar aðeins hluta þess sem hann skuldar?"
      a: "Skráðu þann hluta sem hann greiddi. Afgangurinn helst á stöðunni þar til hann er greiddur."
    - q: "Er þetta alltaf minnsti mögulegi fjöldi greiðslna?"
      a: "Ekki tryggt. Það leggur alltaf til færri greiðslur en fjöldi þeirra sem eru með stöðu í þeim gjaldmiðli, svo fyrir fjóra leggur það aldrei til fleiri en þrjár. Í dæminu um meðleigjendur eru það tvær greiðslur, þar sem að borga hverjum og einum beint til baka tók sex."
