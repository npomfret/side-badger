meta:
  title: "App de dividir contas sem nada para descarregar | Side Badger"
  description: "O teu telemóvel está cheio, nós percebemos. O Side Badger corre no navegador, sem loja nem descarregamentos. Adiciona-o ao ecrã principal e abre como uma app."
h1: "Sem loja de aplicações. Sem nada para descarregar. E parece uma app"
navLabel: "App web"
lead: "O Side Badger vive no teu navegador. Não há loja de aplicações onde procurar nem nada para descarregar primeiro. Inicia sessão num telemóvel ou num computador, divide despesas online com o teu grupo e adiciona-o ao ecrã principal ou ao dock quando o quiseres a um toque de distância."
cta:
  heading: "Abre. Inicia sessão. Começa um grupo."
  body: "Cria uma conta, começa um grupo e adiciona a primeira despesa, tudo no navegador que já tens aberto. Queres primeiro a visita guiada? Vê [como funciona](page:how-it-works) ou confirma [o que o grátis inclui](page:pricing)."
problem:
  heading: "O teu telemóvel está cheio. Nós percebemos."
  body: "Algures nele estão quatro mil fotografias do mesmo pôr do sol e um aviso de armazenamento que andas a dispensar desde a primavera. A última coisa de que ele precisa é de mais uma app, só para dividir um jantar. Por isso o Side Badger é uma app web. Corre num navegador moderno, num telemóvel ou num computador. No telemóvel usa esquemas pensados para o ecrã pequeno, com a página do grupo dividida em separadores e controlos fáceis de tocar. Alguns extras, como adicioná-lo ao ecrã principal, dependem do teu navegador, e dizemos onde."
workflow:
  heading: "Do separador do navegador ao ecrã principal em três passos"
  steps:
    - title: "Abre-o e inicia sessão"
      body: "Vai ao Side Badger no teu navegador e inicia sessão. Basta um endereço de e-mail e uma palavra-passe, e verificas o e-mail antes de poderes adicionar o que quer que seja. Todas as pessoas do grupo precisam de uma conta, por isso as que convidares farão o mesmo."
    - title: "Adiciona-o ao ecrã principal ou ao dock"
      body: "Depois de iniciares sessão, a app oferece-se para se instalar. Tens um botão **Instalar** onde o teu navegador o permite, e **Mostrar como** onde não permite. Perdeste a oferta, ou disseste que não? As **Definições** têm a mesma ajuda em **Adicionar ao ecrã principal ou ao Dock**. No iPhone ou iPad, as Definições mostram primeiro os passos do iPhone e arrumam os outros dispositivos em **Outros dispositivos**. Seja como for, a app passa a abrir numa janela própria."
      shot: S20
      shotAlt: "A secção Adicionar ao ecrã principal ou ao Dock das Definições, com os passos para adicionar a app a um dispositivo"
    - title: "Ativa as notificações, se quiseres"
      body: "As notificações vêm desligadas até as ativares, e cada dispositivo é ativado em separado. Usa o botão **Ativar** que o sino de notificações oferece, ou o interruptor **Notificações push** nas **Definições**. No iPhone ou iPad, abre primeiro a app a partir do ecrã principal. É o único sítio onde as notificações funcionam aí."
      shot: S19
      shotAlt: "O menu de notificações aberto, com a atividade recente do grupo"
options:
  heading: "Como adicioná-lo, dispositivo a dispositivo"
  items:
    - title: "iPhone e iPad"
      body: "Toca no botão Partilhar, um quadrado com uma seta a apontar para cima. Se não o vires, toca primeiro nos três pontos (•••) e depois em Partilhar. Desce e toca em **Adicionar ao ecrã principal**. Mantém **Abrir como app da web** ativado e toca em **Adicionar**. Se um link abriu dentro de outra app, abre primeiro a página no Safari, porque esse navegador integrado não a consegue adicionar."
    - title: "Android"
      body: "Abre o menu do navegador e escolhe **Adicionar ao ecrã principal** ou **Instalar app**."
    - title: "Chrome ou Edge num computador"
      body: "Abre o menu do navegador e escolhe a opção para instalar este site como app. Ele passa a ter a sua própria janela e o seu próprio ícone."
    - title: "Safari num Mac"
      body: "Escolhe **Ficheiro** e depois **Adicionar ao Dock**."
sections:
  - heading: "Notificações, só se as pedires"
    body: "As notificações push são opcionais. Ativa-as e recebes uma notificação quando houver nova atividade nos teus grupos, como alguém adicionar uma despesa, deixar um comentário ou registar um pagamento. São ativadas num dispositivo de cada vez, a partir do sino de notificações ou das **Definições**, e podes desativá-las aí outra vez. Precisam de um navegador que as suporte e da tua permissão. Se o teu navegador as bloqueou para o site, permite-as primeiro nas definições do navegador. No iPhone ou iPad só funcionam a partir da app adicionada ao ecrã principal, não a partir de um separador do navegador. A entrega não é garantida, por isso trata uma notificação como um empurrãozinho, não como uma promessa. Para saber o que aparece no histórico, vê [planear em conjunto](page:feature/plan-together)."
  - heading: "Atualizações em direto, sem botão de atualizar"
    body: "Adiciona uma despesa e todos a veem logo, juntamente com o que mudou e quem mudou. Cada grupo guarda um histórico de atividade, e o sino de notificações mostra a atividade de todos os teus grupos. Ninguém tem de perguntar se já viram o que acabaste de adicionar. Está no ecrã deles."
  - heading: "39 idiomas, cada pessoa com o seu"
    body: "Usa o Side Badger em 39 idiomas, incluindo árabe, persa e urdu, que se escrevem da direita para a esquerda. Cada pessoa do grupo escolhe o seu, por isso a mesma página de grupo pode estar em árabe para uma pessoa e em inglês para a seguinte. A única coisa em que o grupo tem de concordar são os números."
  - heading: "Pensado para mais do que um tipo de pessoa"
    body: "O Side Badger foi feito a pensar em quem usa teclado e leitor de ecrã. As cores dos membros vêm com padrões, para não teres de distinguir o verde do vermelho."
    items:
      - "Links de salto, para quem usa teclado poder ir direto ao conteúdo."
      - "Os diálogos gerem o foco do teclado."
      - "Os controlos têm etiquetas, para os leitores de ecrã."
      - "Os layouts invertem-se nos idiomas que se escrevem da direita para a esquerda."
limits:
  heading: "O que a app web não faz"
  items:
    - "Não há utilização offline. O Side Badger precisa de ligação, por isso não abre o teu grupo num avião sem wifi."
    - "Não há app numa loja de aplicações nem app nativa para iPhone ou Android. O Side Badger é uma app web, e adicioná-lo ao ecrã principal ou ao dock é a forma de obteres a versão com ar de app."
    - "Adicioná-lo ao ecrã principal ou ao dock depende do teu navegador. Os nomes dos menus variam entre navegadores e versões, e alguns navegadores não o oferecem."
    - "As notificações push são opcionais em cada dispositivo e precisam de um navegador que as suporte e da tua permissão. No iPhone ou iPad só funcionam a partir da app adicionada ao ecrã principal. A entrega não é garantida."
    - "Não há alertas por e-mail nem por SMS e não há lembretes de pagamento. A nova atividade aparece na app e, se as ativares, como notificações push. Andar atrás de um pagamento continua a ser contigo."
    - "A atividade é guardada durante 90 dias."
    - "Inicias sessão com um endereço de e-mail e uma palavra-passe. Não há início de sessão com Google ou Apple, e tens de ter 18 anos ou mais."
    - "Não afirmamos que o Side Badger seja totalmente acessível, nem que cumpra uma norma formal de acessibilidade. Se algo te atrapalhar, diz-nos de dentro da app e vais ver lá a nossa resposta."
useCasesHeading: "Onde não precisar de uma app ajuda"
faq:
  heading: "Perguntas"
  items:
    - q: "Existe uma app do Side Badger numa loja de aplicações?"
      a: "Não. O Side Badger é uma app web. Abres no navegador e podes adicioná-lo ao ecrã principal ou ao dock para abrir como uma app. Não há nada para descarregar de uma loja de aplicações."
    - q: "Posso dividir contas sem descarregar uma app?"
      a: "Sim. Abre o Side Badger num navegador, no telemóvel ou no computador, inicia sessão e começa um grupo. Adicioná-lo ao ecrã principal ou ao dock é opcional."
    - q: "Funciona offline?"
      a: "Não. O Side Badger precisa de ligação, mesmo quando está adicionado ao ecrã principal ou ao dock."
    - q: "Porque não recebo notificações no meu iPhone?"
      a: "No iPhone ou iPad, as notificações só funcionam a partir da app adicionada ao ecrã principal, não a partir de um separador do navegador. Adiciona-a, abre-a pelo ícone do ecrã principal e depois ativa as notificações nas **Definições**. A entrega não é garantida, por isso, se uma se perder, o histórico de atividade do grupo continua a mostrar o que foi adicionado."
    - q: "Tenho de ativar as notificações?"
      a: "Não. Estão desligadas até as ativares, um dispositivo de cada vez. Sem elas, a nova atividade continua a aparecer na app, e todos veem uma alteração logo, quando a têm aberta."
    - q: "Todas as pessoas do grupo precisam de uma conta?"
      a: "Sim. Basta um endereço de e-mail e uma palavra-passe, e verificas o e-mail antes de poderes adicionar o que quer que seja. Todas as pessoas que entram num grupo fazem o mesmo, no telemóvel ou computador que preferirem."
