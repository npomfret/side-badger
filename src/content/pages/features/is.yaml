meta:
  title: "Hvað Side Badger gerir og gerir ekki"
  description: "Skipting, uppgjör og margir gjaldmiðlar, auk hópa, lista og kannana. Allur pakkinn, og hreinskilinn listi yfir það sem Side Badger sleppir."
h1: "Hvað Side Badger gerir"
navLabel: "Eiginleikar"
lead: "Allt sem er í kassanum, og það sem er það ekki."
intro: "Hér er allur pakkinn. Við slepptum töflureikninum viljandi. Byrjaðu á þremur verkum sem Side Badger sinnir á hverjum degi, skoðaðu svo restina af listanum og stutta listann yfir það sem það gerir ekki."
cta:
  heading: "Gerir það það sem hópurinn þinn þarf?"
  body: "Stofnaðu ókeypis aðgang og prófaðu fyrst með litlum hópi."
  button: "Stofna ókeypis aðgang"
cardsHeading: "Verkin þrjú í smáatriðum"
sections:
  - heading: "Skönnun kvittana"
    body: "Taktu mynd af kvittuninni og Side Badger fyllir út heildarupphæð, dagsetningu og stað fyrir þig til að yfirfara. Myndir af kvittunum eru lesnar af gervigreindarþjónustu Google."
  - heading: "Hópar og heimildir"
    body: "Búðu til hóp fyrir hvert heimili, hverja ferð og hvern viðburð, með allt að 50 manns í hverjum. Bjóddu fólki með tengli eða QR-kóða. Í stærri hópi geturðu gert einhvern að áhorfanda, sem sér allt en breytir engu."
  - heading: "Listar og kannanir"
    body: "Hafðu sameiginlega innkaupalistann við hliðina á innkaupareikningunum. Berðu orlofshúsaúrvalið undir atkvæði, nafnlaust ef þú vilt."
  - heading: "Allt annað"
    items:
      - "**Uppfærslur í beinni:** bættu við útgjaldi og allir sjá það strax."
      - "**Tungumál:** notaðu Side Badger á 39 tungumálum. Hver og einn í hópnum getur valið sitt eigið."
      - "**Heimaskjár:** engin appverslun nauðsynleg. Skráðu þig inn og bættu svo Side Badger við heimaskjáinn og það opnast eins og app. Stillingar í appinu sýna þér hvernig."
      - "**Endurgjöf:** fannstu villu? Láttu okkur vita inni í appinu og sjáðu svarið okkar þar."
  - heading: "Það sem Side Badger gerir ekki"
    items:
      - "**Flytja peninga.** Side Badger snertir aldrei peningana þína. Borgið hvert öðru eins og ykkur hentar. Greiðslubeiðnir eru á döfinni."
      - "**Endurtaka reikninga.** Það eru engin endurtekin útgjöld. Afritaðu reikning síðasta mánaðar með tveimur snertingum."
      - "**Skipta eftir liðum.** Einn greiðandi á hvert útgjald. Skiptu jafnt, eftir nákvæmum upphæðum eða í prósentum."
      - "**Gefa út sérstakt app.** Það virkar í vafranum þínum. Skráðu þig inn og bættu því svo við heimaskjáinn."
      - "**Virka án nettengingar.** Það þarf nettengingu."
      - "**Senda tilkynningar í tölvupósti eða SMS.** Tilkynningar birtast í appinu. Ýtitilkynningar eru á döfinni."
      - "**Teikna línurit eða fjárhagsáætlanir.** Það heldur utan um hver skuldar hverjum, og það er allt galdraverkið."
      - "**Skrá inn með Google eða Apple.** Skráðu þig með netfangi. Innskráning með Google og Apple er á döfinni."
      - "**Hleypa fólki inn án aðgangs.** Allir í hópnum þurfa ókeypis aðgang."
faq:
  heading: "Spurningar"
  items:
    - q: "Get ég borgað í gegnum Side Badger?"
      a: "Nei. Side Badger heldur utan um stöðuna og snertir aldrei peningana þína. Borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna."
    - q: "Er til farsímaapp?"
      a: "Ekki í appverslun. Side Badger keyrir í vafranum þínum. Skráðu þig inn í símanum og bættu því svo við heimaskjáinn svo það opnist eins og app. Stillingar í appinu sýna þér hvernig."
    - q: "Get ég skipt eftir liðum?"
      a: "Nei. Hvert útgjald hefur einn greiðanda og þú skiptir því jafnt, eftir nákvæmum upphæðum eða í prósentum."
    - q: "Virkar það án nettengingar?"
      a: "Nei, það þarf nettengingu."
    - q: "Þurfa allir í hópnum aðgang?"
      a: "Já. Allir í hópnum þurfa ókeypis aðgang og allt sem þarf til að skrá sig er netfang."
