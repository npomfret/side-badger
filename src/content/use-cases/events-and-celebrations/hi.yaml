meta:
  title: "पार्टी, शादी और ग्रुप गिफ्ट का खर्च बांटें"
  description: "जब लोग अलग-अलग रकम देते हैं तब पार्टी, शादी या ग्रुप गिफ्ट का खर्च साझा करें। प्लान पर वोट कराएं, सटीक राशि से बांटें और देखें किसे किसका देना है।"
h1: "पार्टी, शादी और ग्रुप गिफ्ट का खर्च बांटें"
navLabel: "इवेंट और जश्न"
lead: "डिपॉज़िट, सजावट और इमरजेंसी छतरियों का खर्च बांटें। बैठने का इंतज़ाम किसी हिम्मती के हवाले छोड़ दें। Side Badger **किसने कितना दिया** एक जगह रखता है, ताकि आयोजक भी पार्टी का मज़ा ले सके।"
cta:
  heading: "अगले जश्न से शुरू करें"
  body: "अकाउंट बनाएं, इवेंट के लिए एक ग्रुप बनाएं और इनवाइट लिंक भेजें। Side Badger मुफ्त है, बिना विज्ञापन और रोज़ाना की किसी सीमा के।"
  button: "मुफ्त अकाउंट बनाएं"
scenario:
  heading: "सब पैसे देते हैं, पर हमेशा बराबर नहीं"
  body: "कोई वेन्यू का डिपॉज़िट देता है, कोई और केक खरीदता है, और तीसरा ग्रुप गिफ्ट अपने कार्ड पर ले लेता है। कुछ मेहमान हर चीज़ में आते हैं और कुछ सिर्फ डिनर में। चैट थ्रेड में इसका निष्पक्ष हिसाब रखना ऐसा काम है जिसके लिए किसी ने अर्ज़ी नहीं दी थी। Side Badger का ग्रुप सब कुछ संभालता है, रकम का मिश्रण जो भी हो, और हर व्यक्ति को दिखाता है कि उसे क्या देना है या क्या मिलना है। बुनियादी बातों के लिए [यह कैसे काम करता है](page:how-it-works) देखें, या किसी इवेंट के लिए आगे पढ़ें।"
sections:
  - heading: "मिलकर तय करें"
    body: "पैसे हिलने से पहले चुनाव को **पोल** पर रखें। 10 विकल्प तक जोड़ें, जैसे दो वेन्यू या तीन गिफ्ट आइडिया, और सबको वोट करने दें। आप छिपा सकते हैं कि किसने किसे वोट दिया, ताकि हर विकल्प की निष्पक्ष सुनवाई हो, और पोल बंद होने पर विजेता दिखता है। क्या तय हुआ यह जानने के लिए किसी को चालीस मैसेज पीछे स्क्रॉल नहीं करने पड़ते।"
  - heading: "कौन किसमें शामिल है"
    body: "सब बराबर नहीं देते, और सब हर खर्च का हिस्सा नहीं होते। खर्च को बराबर, प्रतिशत या **सटीक राशि** से बांटें, ताकि हर व्यक्ति का हिस्सा वही आंकड़ा हो जिस पर आपने सहमति बनाई थी। जो शामिल नहीं था उसे बाहर रखें, जैसे वे मेहमान जिन्होंने डिनर छोड़ा या वे दोस्त जो गिफ्ट में नहीं जुड़े। हर खर्च का एक ही पेमेंट करने वाला होता है, और बंटवारे में बाकी सब अपना हिस्सा उसी को देते हैं। विस्तार [खर्च बांटना](page:feature/split-expenses) पेज पर है।"
  - heading: "कागज़ात संभालकर रखें"
    body: "खर्च में नोट जोड़ें, जैसे उस रकम में क्या-क्या शामिल था। कमेंट उसी **खर्च के पास** रहते हैं जिसके बारे में वे हैं, इसलिए सवाल “केक £45 का था या £54 का?” और उसका जवाब एक ही जगह रहते हैं। कमेंट 500 अक्षर तक चलते हैं, जो डिपॉज़िट के सवाल के लिए काफी है।"
  - heading: "आयोजक के कंट्रोल"
    body: "खुला सहयोग किसी भी सदस्य को खर्च जोड़ने और बदलने देता है, जो छोटे गिफ्ट के लिए ठीक है। शादी या बड़ी पार्टी के लिए **मैनेज्ड ग्रुप** प्रीसेट चुनें। एडमिन हर नए सदस्य को मंज़ूरी देते हैं, और सिर्फ क्रिएटर और एडमिन खर्च बदल सकते हैं। लोगों को लिंक या QR कोड से बुलाएं; अप्रूवल चालू हो तो एडमिन हर व्यक्ति को अंदर आने देता है, ताकि मेहमानों की सूची मेहमानों की सूची ही रहे। इवेंट खत्म होने पर ग्रुप लॉक कर दें ताकि संख्याएं वहीं रहें।"
  - heading: "पार्टी के बाद हिसाब चुकता करें"
    body: "आखिरी बिल आ जाने पर बैलेंस दिखाते हैं **किसे किसका देना है**, और Side Badger पेमेंट की एक छोटी सूची सुझाता है जिससे सबका हिसाब निपट जाए। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर ग्रुप में पेमेंट रिकॉर्ड करें। Side Badger पैसे कभी नहीं भेजता, इसलिए ग्रुप हिसाब रखता है और ट्रांसफर आपके अपने बैंकिंग ऐप्स में होते हैं। [हिसाब चुकता करना](page:feature/settle-up) पेज दिखाता है कि उलझन कैसे एक छोटी सूची बन जाती है।"
