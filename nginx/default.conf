# Behind the Snowmonkey edge (snowmonkey-proxy-common), which terminates TLS,
# owns HSTS and overwrites X-Real-IP with the client it saw.

map $uri $side_badger_cache_control {
    # Astro content-hashes everything here: a changed file gets a new name
    ~^/_astro/  "public, max-age=31536000, immutable";
    # HTML and unhashed files revalidate, so a deploy is never masked by a
    # cached page that points at hashed assets the new image no longer has
    default     "no-cache";
}

# Launch counter (D28): lang is passed on only when it is a supported locale
map $arg_lang $side_badger_lang_query {
    default "";
    ~^(ar|bn|cs|cy|da|de|el|es|eu|fa|fi|fr|ga|hi|hr|hu|id|is|it|ja|ko|lv|nl-BE|no|pcm|ph|pl|pt|ro|sl|sr|sv|sw|te|tr|uk|ur|zh)$  ?lang=$arg_lang;
}

# Bot flag for the launch log. The user agent is read here and never logged.
map $http_user_agent $side_badger_is_bot {
    default 0;
    ~*(bot|crawl|spider|slurp|preview|facebookexternalhit|headless|curl|wget|python|httpclient)  1;
}

# One minimal JSON line per launch click: no address, user agent or referrer
log_format side_badger_launch escape=json
    '{"type":"launch","time":"$time_iso8601","target":"$uri","from":"$arg_from",'
    '"cta":"$arg_cta","lang":"$arg_lang","bot":$side_badger_is_bot}';

# Social cards are fetched by other sites' previewers, everything else is ours
map $uri $side_badger_corp {
    ~^/og/   cross-origin;
    default  same-origin;
}

# Regional alias redirects ($side_badger_locale_redirect). Kept outside
# conf.d/ on purpose: this file is a map, never a server block.
include /etc/nginx/side-badger/locale-redirects.conf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The client address the edge saw. Docker's whole range, not today's
    # network subnet, which changes if the network is ever recreated.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    # Location headers carry a path only. An absolute one would say http://,
    # the scheme this container sees, and bounce through the edge's redirect.
    absolute_redirect off;

    # A static site takes no request bodies
    client_max_body_size 16k;

    # No compression here: the edge compresses uncompressed text responses with
    # brotli or gzip, and would pass an already-encoded one through untouched

    # Every response header except HSTS, which the edge owns. Server level
    # only: a location with its own add_header would drop all of these.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy $side_badger_corp always;
    add_header Cache-Control $side_badger_cache_control always;

    error_page 404 /404.html;

    # Regional alias URLs: one permanent hop to the locale they copied
    if ($side_badger_locale_redirect) {
        return 301 $side_badger_locale_redirect$is_args$args;
    }

    # /x/index.html is a file name, not a page URL
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    location / {
        # Page URLs end in a slash. A directory asked for without one gets
        # nginx's own 301 to the slash form (query string kept). Unknown
        # paths are 404; there is no .html fallback.
        try_files $uri $uri/ =404;
    }

    # Hashed assets only: no directory answers
    location /_astro/ {
        try_files $uri =404;
    }
    location = /_astro/ {
        return 404;
    }

    # Launch counter (D28). Fixed targets, so no open redirect. Only a
    # validated lang is passed on. One minimal line per click, no address.
    # Declaring access_log here replaces the inherited combined log; an
    # "access_log off" beside it would silence this one too.
    location = /go/app/ {
        access_log /dev/stdout side_badger_launch;
        return 302 https://app.sidebadger.me/dashboard$side_badger_lang_query;
    }
    location = /go/register/ {
        access_log /dev/stdout side_badger_launch;
        return 302 https://app.sidebadger.me/register$side_badger_lang_query;
    }

    location = /health {
        access_log off;
        default_type text/plain;
    }
}
