faq:
  heading: "Galderak"
  items:
    - q: "Ezkontzako lekukoak gehiago ordaintzen al du?"
      a: "Taldeak hala adosten badu bakarrik. Aplikazioak ez dio inori rol berezirik ematen kontuetan. Norbaitek gehiago estaltzen badu, aukeratu **Zenbateko zehatzak** edo **Ehunekoa** **Nola banatu** atalean eta sartu adostu dituzuen zatiak."
    - q: "Zer gertatzen da batzuek hartu ez dituzten edariekin?"
      a: "Gehitu edariak gastu propio gisa eta markatu hartu zituzten pertsonak bakarrik. Denek kopuru desberdina hartu bazuten, aukeratu **Zenbateko zehatzak** eta idatzi pertsona bakoitzaren zatia. Inork ez du hartu ez zuenagatik ordaintzen."
    - q: "Ohorezko gonbidatuak taldea ikus dezake geroago?"
      a: "Bai, sorpresa amaitzen denean. Gonbidatu, eta gero administratzaile batek **Ikuslea** egin dezake taldearen ezarpenetako **Segurtasuna eta baimenak** atalean. Ikusleak dena ikusten du eta ezer ez du aldatzen, beraz itxaron ezer sekretua ez den arte. Doako kontu bat behar du sartzeko."
