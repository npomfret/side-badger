faq:
  heading: "सवाल"
  items:
    - q: "अगर हम गिफ्ट की कीमत से ज़्यादा इकट्ठा कर लें तो?"
      a: "सटीक राशियों का जोड़ कीमत के बराबर होना चाहिए, इसलिए हिस्से तब तक घटाएं जब तक जोड़ मिल न जाए। या बचे हुए पैसे किसी असली चीज़ पर लगा दें, जैसे फूल, और उसे दूसरे खर्च के रूप में डालें, जैसे उदाहरण में कार्ड और रैपिंग।"
    - q: "क्या कोई ग्रुप में शामिल हुए बिना पैसे डाल सकता है?"
      a: "अगर आप चाहते हैं कि वह गिनती में रहे, तो नहीं। बंटवारे में शामिल हर व्यक्ति का मुफ्त अकाउंट और ग्रुप में होना ज़रूरी है। जिसके पास सिर्फ कैश है, उसके लिए Priya वह कैश ले सकती है और गिफ्ट को उतनी रकम में डाल सकती है जितनी ग्रुप को अब भी देनी है। जैसे, अगर Sam ने उसे £40 कैश दिए, तो वह £200 डालेगी और उसे अपने, Omar और Lena के बीच 60, 60 और 80 में बांटेगी।"
    - q: "क्या पोल तय कर सकता है कि हर व्यक्ति कितना डाले?"
      a: "नहीं। पोल पूरे ग्रुप के लिए एक आंकड़ा तय करता है, जैसे बजट। हर व्यक्ति का हिस्सा आप आपस में तय करें, फिर उसे खर्च में **सटीक राशियाँ** के रूप में टाइप करें।"
