meta:
  title: "ग्रुप गिफ्ट के लिए पैसे कैसे इकट्ठा करें | Side Badger"
  description: "सब अलग-अलग रकम डालते हैं और झटका एक व्यक्ति के कार्ड को लगता है। बजट का पोल चलाएं, सटीक राशि डालें और हिसाब Side Badger पर छोड़ दें।"
h1: "ग्रुप गिफ्ट के लिए पैसे कैसे इकट्ठा करें"
navLabel: "ग्रुप गिफ्ट के लिए चंदा"
lead: "ग्रुप गिफ्ट के लिए पैसे इकट्ठा करने का मतलब है कि एक व्यक्ति पहले पैसे लगाता है और बाकी सबको उसे अपना-अपना चंदा देना होता है। पोल से बजट तय करें, खरीदने वाले को गिफ्ट अपने कार्ड से लेने दें, फिर उसे एक खर्च के रूप में [सटीक राशि](page:feature/split-expenses) के साथ डालें, यानी हर व्यक्ति के लिए एक आंकड़ा। Side Badger दिखाता है कि खरीदने वाले को किसे कितना देना है, और हर कोई अपना हिस्सा जैसे चाहे भेज देता है।"
cta:
  heading: "चंदा इकट्ठा करें, बिना चंदे के डिब्बे के"
  body: "ग्रुप बनाएं, जिसे गिफ्ट मिलना है उसे उसमें न रखें और गिफ्ट सटीक राशि के साथ डालें। Side Badger मुफ्त है, कोई विज्ञापन नहीं, रोज़ाना की कोई सीमा नहीं। पहले पूरा टूर देखना है? [यह कैसे काम करता है](page:how-it-works) या [मुफ्त में क्या-क्या मिलता है](page:pricing) देखें।"
sections:
  - heading: "चार दोस्त, एक रिकॉर्ड प्लेयर, चार अलग रकमें"
    body: "Bea 30 साल की हो रही है और उसे रिकॉर्ड प्लेयर चाहिए। Priya, Omar, Lena और Sam उसे यही देने वाले हैं। Priya को £240 का एक मिल जाता है और वह उसे अपने कार्ड से खरीदती है, क्योंकि किसी को तो पहले आगे आना ही होता है। चारों बराबर नहीं डालते। Priya और Omar दोनों £60 डालते हैं, Lena £80 और Sam £40। कोई अपनी रकम की सफाई नहीं देता और कोई पूछता नहीं। Omar एक कार्ड और रैपिंग पेपर भी £12 में खरीदता है। कार्ड पर चारों साइन करते हैं, इसलिए उसका खर्च बराबर बंटता है।"
  - heading: "बजट पहले तय करें, फिर खरीदें"
    body: "बजट का पोल £400 के टर्नटेबल पर होने वाली बहस बचा लेता है। ग्रुप में **पोल जोड़ें** चुनें और पूछें कि गिफ्ट की कीमत कितनी होनी चाहिए। विकल्पों में राशियां रखें, जैसे £150 तक, £200 तक और £250 तक। **गुमनाम मतदान** चालू करें, जो छिपाता है कि किसने किसे वोट दिया, ताकि किसी को छोटी रकम के पक्ष में सबके सामने सफाई न देनी पड़े। पहला वोट पड़ने के बाद पोल की सेटिंग्स बदली नहीं जा सकतीं, इसलिए पहले उन्हें जांच लें। पोल अपने आप बंद नहीं होता। सबके वोट देने के बाद **पोल बंद करें** चुनें और **विजेता** दिख जाता है। पोल कुल रकम तय करता है। वह किसी का हिस्सा तय नहीं करता।"
  - heading: "गिनती पढ़ना"
    body: "गिफ्ट £60, £60, £80 और £40 में बंटता है, जिनका जोड़ रसीद के £240 के बराबर है। कार्ड और रैपिंग चार हिस्सों में बंटते हैं, £3 प्रति व्यक्ति। Priya का बिल £60 + £3 यानी £63 है, और उसने £240 दिए, इसलिए उसे £177 मिलने हैं। Omar का बिल भी £63 है, पर उसने £12 दिए, इसलिए उसे £51 देने हैं। Lena को £80 + £3 यानी £83 देने हैं, और Sam को £40 + £3 यानी £43। ये तीनों मिलकर Priya के £177 के बराबर हैं। ऐसे ही छोड़ दें तो उधारियां ग्रुप के भीतर पांच तरफ घूमतीं। Side Badger इसके बजाय तीन पेमेंट सुझाता है, सब Priya को। [हिसाब चुकता करना](page:feature/settle-up) में ब्योरा है।"
  - heading: "Side Badger में डालें"
    body: "Priya की तरफ का काम करीब पांच मिनट का है।"
    items:
      - "**ग्रुप बनाएं।** डैशबोर्ड पर **समूह बनाएं** चुनें। **दूसरों को आमंत्रित करें** चुनें और लिंक या QR कोड सिर्फ उन्हें भेजें जो पैसे डाल रहे हैं, और किसी को नहीं।"
      - "**गिफ्ट जोड़ें।** **व्यय जोड़ें** चुनें, उसका विवरण लिखें, 240 डालें और **किसने भुगतान किया?** में Priya को चुनें। **विभाजित करें** में चारों को रखें, फिर **विभाजन कैसे करें** में **सटीक राशियाँ** चुनें और 60, 60, 80 और 40 टाइप करें। राशियों का जोड़ 240 होना चाहिए। चाहें तो ऑर्डर कन्फर्मेशन अटैच करें। **व्यय सहेजें** चुनें।"
      - "**कार्ड जोड़ें।** Omar £12 खुद जोड़ता है, **किसने भुगतान किया?** में खुद को चुनता है और **विभाजन कैसे करें** को **समान रूप से** पर रहने देता है, चारों लोगों पर टिक के साथ।"
      - "**गिनें, फिर पेमेंट करें।** सब **शेष** देखते हैं, जो दिखाता है कि किसे किसका देना है, और अपना हिस्सा Priya को जैसे चाहें भेज देते हैं। फिर **हिसाब बराबर करें** और **भुगतान रिकॉर्ड करें** से उसे रिकॉर्ड करें। त्वरित निपटान राशि अपने आप भर देता है।"
  - heading: "पहले खरीदें, या पहले इकट्ठा करें"
    body: "Side Badger चंदे की रकम खुद नहीं रखता, इसलिए “इकट्ठा करना” असल में गिनती करना है। दो क्रम चलते हैं।"
    items:
      - "**पहले खरीदें।** खरीदने वाला पेमेंट करता है, असली कीमत पर खर्च जोड़ता है और सबको अपना हिस्सा तुरंत दिख जाता है। यह ज़्यादा साफ-सुथरा है, पर लोगों के पैसे देने तक खर्च खरीदने वाले को उठाना पड़ता है, इसलिए ऐसा खरीदार चुनें जो उठा सके।"
      - "**पहले इकट्ठा करें।** लोग खरीदारी से पहले अपनी रकम खरीदने वाले को भेज देते हैं। कीमत पता चलते ही गिफ्ट का खर्च डालें, फिर हर पेमेंट उस तारीख के साथ रिकॉर्ड करें जिस दिन पैसा सच में हाथ बदला। गिफ्ट पहले जोड़ें, ताकि हर पेमेंट के सामने एक बैलेंस हो जिसमें वह लग सके।"
      - "**कीमत बदल जाए।** डिलीवरी, डिस्काउंट कोड, देर से हुई कीमत की बढ़ोतरी। गिफ्ट को एडिट करें और सटीक राशियां ऐसे बदलें कि जोड़ अब भी सही रहे। पहले वाला वर्शन रखा जाता है, पर ग्रुप को पहले बता दें, क्योंकि उनके बैलेंस बदलते हैं।"
  - heading: "Bea को इससे दूर रखें"
    body: "ग्रुप को सिर्फ उसके सदस्य देख सकते हैं, इसलिए Bea वह ग्रुप नहीं देख सकती जिसमें वह है ही नहीं। सिर्फ उन्हें बुलाएं जो पैसे डाल रहे हैं, और किसी को नहीं। लिंक अपनी समय-सीमा खत्म होने तक काम करता है, और आप 15 मिनट से 5 दिन तक कुछ भी चुन सकते हैं, इसलिए छोटी अवधि चुनें और उसे वहां भेजें जहां Bea न देखे। लिंक खोलने वाले को ग्रुप की झलक दिखती है, इसलिए ग्रुप का नाम कुछ फीका-सा रखें, जैसे शनिवार का चंदा, और खर्च के लेबल और पोल के विकल्पों में भी Bea का नाम न आने दें।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह पैसे न रखता है, न इकट्ठा करता है। चंदा खरीदने वाले को बैंक ट्रांसफर, कैश या जो भी आप इस्तेमाल करते हैं उससे जाता है, और फिर कोई उसे रिकॉर्ड करता है।"
      - "यह पेमेंट रिमाइंडर नहीं भेजता। जिसने नहीं दिया उसे याद दिलाना अब भी इंसान का काम है।"
      - "यह किसी का हिस्सा तय नहीं करता। पोल बजट तय करता है और “बचा हुआ बांट दो” जैसा कोई विकल्प नहीं है, इसलिए हर राशि आप खुद टाइप करते हैं।"
      - "हर खर्च का एक ही पेमेंट करने वाला होता है। अगर दो लोगों ने गिफ्ट के अलग-अलग हिस्से खरीदे, तो दो खर्च डालें।"
      - "बंटवारे में शामिल हर व्यक्ति का मुफ्त अकाउंट और ग्रुप में जगह होना ज़रूरी है।"
exampleAfter: 2
