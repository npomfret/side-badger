faq:
  heading: "Questions"
  items:
    - q: "Side Badger na free alternative to Splitwise?"
      a: "To split bills for group, yes, and e dey do pass di maths: comments, questions, lists, polls and group roles, with receipt scanning and currency conversion wey dey free. If you need app-store app, offline use or payments inside di app, na Splitwise get dose ones, Side Badger no get."
    - q: "Where di Splitwise details come from?"
      a: "Splitwise own pages: im home page, im Pro page and im help centre. Each row of di table link to di page wey e come from, and di date above di table talk when we read dem. We dey check dem every quarter."
    - q: "Side Badger go stay free?"
      a: "Everything for Side Badger dey free today. If dat one ever change, we go give you notice first. Di [pricing page](page:pricing) get di details."
    - q: "Everybody for my group must switch?"
      a: "Yes. Everybody for group need free Side Badger account, and dem fit join with link or QR code."
    - q: "Side Badger get mobile app?"
      a: "No for app store. E dey run for your browser: sign in for your phone, then add am to your home screen so e go open like app. [How e dey work](page:how-it-works) show how."
