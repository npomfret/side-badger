faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir liom mo sciar amháin a cheistiú?"
      a: "Ní féidir. Coinníonn ceist an costas ar fad as, do gach duine ann. Má tá an roinnt amháin mícheart, is é an réiteach an roinnt a chur in eagar."
    - q: "Cé a fhéadann ceist a dhúnadh?"
      a: "An duine a chuir an cheist, nó riarthóir grúpa. Mura riarthóir an duine a chuir an costas leis, ní féidir leis í a dhúnadh thar ceann an duine a chuir an cheist."
    - q: "An scriosann costas a chur in eagar an bunleagan?"
      a: "Ní scriosann. Coinnítear an leagan roimhe. Socraíonn ceadanna an ghrúpa cé a fhéadann é a chur in eagar, mar sin is fiú an teach a chur ar an eolas ar dtús, mar athraíonn na hiarmhéideanna."
