sections:
  - heading: "Τι κάνει καλά το Splitwise"
    body: "Αν η ομάδα σας χρειάζεται εγγενή εφαρμογή, χρήση χωρίς σύνδεση ή πληρωμές μέσα στην εφαρμογή, το Splitwise είναι η λογική επιλογή, και προτιμούμε να το διαλέξετε παρά να ανακαλύψετε το πρόβλημα αργότερα. Οι δικές του σελίδες αναφέρουν:"
    items:
      - "**Εφαρμογές και χρήση χωρίς σύνδεση.** Εφαρμογές για iPhone και Android εκτός από το web, και λειτουργία χωρίς σύνδεση."
      - "**Περισσότεροι τρόποι διαχωρισμού.** Μερίδια, προσαρμογές και διαχωρισμός ανά είδος, επιπλέον του εξίσου, των ακριβών ποσών και των ποσοστών."
      - "**Επαναλαμβανόμενα έξοδα.** Ορίστε το ενοίκιο να επαναλαμβάνεται και ξεχάστε το."
      - "**Πληρωμές στην εφαρμογή.** Σε ορισμένες χώρες μπορεί να μετακινήσει και τα χρήματα, μέσω Splitwise Pay, Venmo, PayPal ή Pay by Bank."
  - heading: "Δωρεάν εδώ, επί πληρωμή εκεί"
    body: "Το Splitwise Pro είναι το επί πληρωμή πλάνο του Splitwise και η δική του σελίδα Pro πουλά τέσσερα πράγματα που δεν κοστίζουν τίποτα στο Side Badger."
    items:
      - "**Σάρωση αποδείξεων.** Το Splitwise Pro σαρώνει μια φωτογραφία της απόδειξής σας. Το Side Badger το κάνει δωρεάν, χωρίς πιστώσεις σάρωσης: συμπληρώνει το σύνολο, την ημερομηνία και τον τόπο για να τα ελέγξετε. Οι εικόνες αποδείξεων διαβάζονται από την υπηρεσία AI της Google."
      - "**Μετατροπή νομισμάτων.** Το Splitwise Pro μετατρέπει τα έξοδα μιας ομάδας στο προεπιλεγμένο σας νόμισμα όταν πατήσετε «Convert». Το Side Badger μετατρέπει κάθε έξοδο καθώς το καταχωρίζετε, με μια τρέχουσα συναλλαγματική ισοτιμία ή με αυτήν που πήρατε πραγματικά, και το αρχικό ποσό μένει στο έξοδο."
      - "**Χωρίς διαφημίσεις.** Το Splitwise παραθέτει μια εντελώς χωρίς διαφημίσεις εμπειρία ως λειτουργία του Pro. Το Side Badger δεν έχει διαφημίσεις."
      - "**Χωρίς ημερήσια όρια.** Το Splitwise Pro πουλά απεριόριστα έξοδα και το κέντρο βοήθειάς του λέει ότι οι δωρεάν χρήστες μπορούν να προσθέτουν έως 4 έξοδα την ημέρα. Το Side Badger δεν έχει ημερήσια όρια."
  - heading: "Τι έχει το Splitwise και δεν έχει το Side Badger"
    body: "Αυτές δεν είναι όλες οι λειτουργίες του Splitwise, μόνο εκείνες που συνήθως κρίνουν την επιλογή. Οι δικές του σελίδες έχουν την πλήρη λίστα. Εδώ είναι τα σημεία όπου το Side Badger υστερεί."
    items:
      - "**Εγγενείς εφαρμογές.** Το Side Badger λειτουργεί στο πρόγραμμα περιήγησής σας. Συνδεθείτε και μετά προσθέστε το στην αρχική οθόνη και ανοίγει σαν εφαρμογή."
      - "**Λειτουργία χωρίς σύνδεση.** Το Side Badger χρειάζεται σύνδεση."
      - "**Πληρωμές στην εφαρμογή.** Το Side Badger δεν αγγίζει ποτέ τα χρήματά σας. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή."
      - "**Επαναλαμβανόμενα έξοδα.** Το Side Badger δεν έχει. Αντιγράψτε το ενοίκιο του προηγούμενου μήνα αντί να το πληκτρολογήσετε ξανά."
      - "**Διαχωρισμός με μερίδια ή ανά είδος.** Το Side Badger έχει έναν πληρωτή ανά έξοδο, που χωρίζεται εξίσου, με ακριβή ποσά ή με ποσοστά. Η σάρωση αποδείξεών του δεν αναθέτει είδη σε άτομα."
      - "**Γραφήματα και προεπιλεγμένοι διαχωρισμοί.** Το Splitwise Pro έχει και τα δύο. Το Side Badger κρατά τον λογαριασμό ποιος χρωστά σε ποιον, και αυτό είναι όλο το κόλπο."
  - heading: "Πώς μεταφέρετε την ομάδα σας"
    body: "Δεν υπάρχει εργαλείο εισαγωγής, οπότε η μετακίνηση σημαίνει νέα αρχή. Τακτοποιηθείτε πρώτα στο Splitwise, μετά δημιουργήστε μια ομάδα στο Side Badger και προσκαλέστε όλους με σύνδεσμο ή κωδικό QR. Ο καθένας στην ομάδα χρειάζεται δωρεάν λογαριασμό και για την εγγραφή αρκεί μια διεύθυνση email."
