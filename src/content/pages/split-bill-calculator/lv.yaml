faq:
  heading: "Jautājumi"
  items:
    - q: "Vai kalkulators ir bez maksas?"
      a: "Jā. Bez maksas. Bez reklāmām. Bez dienas ierobežojumiem. Arī konts nav vajadzīgs."
    - q: "Vai tas saglabā to, ko ierakstu?"
      a: "Nē. Nekas netiek saglabāts vai kaut kur sūtīts. Lai paturētu skaitļus, izmantojiet Kopēt saiti un saglabājiet saiti kaut kur."
    - q: "Kas var redzēt saiti, ko nokopēju?"
      a: "Ikviens, kam tā ir. Skaitļi ir pašā saitē, aiz #, tāpēc kopīgojiet to tikai ar tiem, kam šie skaitļi jāredz."
    - q: "Vai tas pārvieto naudu?"
      a: "Nē. Tas aprēķina, kam būtu jāmaksā kam, un jūs samaksājat viens otram, kā vēlaties. Arī Side Badger nekad neskar jūsu naudu. Skatiet [norēķināšanās](page:feature/settle-up)."
    - q: "Vai varu sadalīt ceļojumu, kas apmaksāts divās valūtās?"
      a: "Šeit nē, jo aprēķinam ir viena valūta. Grupā katrai valūtai ir savs atlikums. Skatiet [vairākas valūtas](page:feature/multiple-currencies)."
    - q: "Ko darīt, ja summas nesakrīt?"
      a: "Kalkulators to pasaka zem izdevuma un nerāda rezultātu, līdz summas sakrīt. Precīzām summām jāsakrīt ar kopsummu, bet procentiem jāsakrīt ar 100."
