featuresHeading: "Di features wey dis one dey use"
faq:
  heading: "Questions"
  items:
    - q: "Guests fit see di group without joining?"
      a: "No. People dey join with link or QR code and free account, so dem fit see di group once dem don enter."
    - q: "Side Badger fit collect di money?"
      a: "No. Side Badger dey keep di count and no dey ever move money. Pay each other anyhow you like, then record di payment. E free, with no ads and no daily limits; see [pricing](page:pricing)."
    - q: "Votes fit be anonymous?"
      a: "Yes. When you create poll you fit hide who vote for wetin. Di settings fit only change before di first vote."
    - q: "People fit put different amounts?"
      a: "Yes. Share expense by exact amounts, so each person share go be di figure wey una agree, or leave out di people wey no dey involved."
    - q: "Organiser fit keep di books?"
      a: "Yes. Use di managed group preset, so only creators and admins go change expenses and admins go approve new members."
