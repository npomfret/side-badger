sections:
  - heading: Soga za pesa, karibu na pesa
    body: Pesa za pamoja huja na soga, wasiwasi na mipango. Side Badger inaviweka vyote vitatu karibu na namba, ili mtu asilazimike kurudi nyuma kwenye gumzo kutafuta.
    items:
      - "**Maoni yaliyo mahali pake.** Toa maoni kwenye kikundi chenyewe, au kwenye gharama, orodha au kura yoyote, na uweke mazungumzo karibu na jambo lenyewe."
      - "**Risiti na picha.** Hifadhi hadi risiti tatu kwenye kila gharama, na uongeze picha au PDF kwenye maoni ya kikundi, orodha au kura."
      - "**Maswali, si ugomvi.** Msimamizi anaweza kuwasha maswali, kisha yeyote aliye kwenye gharama anaweza kuuliza kuihusu. Inabaki nje ya salio hadi itakapotatuliwa."
      - "**Orodha na kura.** Weka orodha ya pamoja ya ununuzi karibu na gharama za ununuzi, na piga kura kuhusu orodha fupi ya villa, bila kujulikana jina ukipenda."
      - "**Makofi kidogo.** Toa mwitikio kwa gharama, malipo na maoni, na sherehekea malipo yanapofika."
  - heading: Kikundi chako, sheria zako
    body: Kituo cha msaada cha Splitwise kinasema hakisaidii wasimamizi wa kikundi wala ruhusa maalum. Side Badger ina majukumu na ruhusa, kwa vikundi vinavyohitaji mtu wa kuweka namba sawa.
    items:
      - "**Wasimamizi, wanachama na watazamaji.** Mfanye mtu mtazamaji: anaona kila kitu na habadilishi chochote."
      - "**Chaguo-msingi mbili, au zako mwenyewe.** Anza na Wazi au Inayosimamiwa, au weka kila ruhusa mwenyewe: nani anahariri na kufuta gharama, anahariri orodha, anaalika na kuwaruhusu watu wapya kuingia."
      - "**Idhini ya kujiunga.** Washa idhini na msimamizi anamruhusu kila mtu kuingia."
      - "**Mipangilio ya kikundi chenyewe.** Kipunguze kwa sarafu mnazotumia kweli, chagua sarafu yake chaguo-msingi na kipe picha ya kichwa."
      - "**Kifunge ikiisha.** Namba zinabaki kama zilivyo hadi msimamizi afungue."
  - heading: Bure hapa, kulipia kule
    body: Splitwise Pro ni mpango wa kulipia wa Splitwise, na ukurasa wake wa Pro unauza vitu vitatu ambavyo havigharimu chochote kwenye Side Badger.
    items:
      - "**Kuchanganua risiti.** Splitwise Pro inachanganua picha ya risiti yako. Side Badger inafanya hivyo bure, bila kununua pointi za kuchanganua: inajaza jumla, tarehe na mahali ili uvihakiki."
      - "**Kubadilisha sarafu.** Splitwise Pro inabadilisha gharama za kikundi kuwa sarafu yako chaguo-msingi unapogusa Convert. Side Badger inabadilisha kila gharama unapoiingiza, kwa kiwango cha sasa cha ubadilishaji au kile ulichopata kweli, na kiasi cha awali kinabaki kwenye gharama."
      - "**Hakuna vikomo vya kila siku.** Splitwise Pro inauza gharama zisizo na kikomo, na kituo chake cha msaada kinasema watumiaji wa bure wanaweza kuongeza hadi gharama 4 kila siku. Side Badger haina vikomo vya kila siku."
  - heading: Benki yako haihusiki
    body: Side Badger haiunganishwi na benki yako na haiombi taarifa za benki yako. Inatunza rekodi ya nani anadaiwa na nani; mnalipana kwa njia mnayopenda, kisha mnarekodi malipo. Hakuna taarifa za kuingia benki za kukabidhi, kwa hivyo ni jambo moja chini la kulinda.
  - heading: Programu moja, kwenye kivinjari na kwenye simu
    body: Side Badger inafanya kazi kwenye kivinjari chako. Ingia, iweke kwenye skrini ya kwanza, na inafunguka kama programu. Ni programu ile ile kwa njia zote mbili, kwa hivyo kipengele kipya kiko kwenye simu yako mara ijayo utakapoifungua, bila kusubiri sasisho la duka la programu.
  - heading: Na ujanja mdogo mdogo
    items:
      - "**Muulize msaidizi wako.** Side Badger inafanya kazi na ChatGPT na Claude: muombe wako aongeze gharama, achanganue risiti au arekodi malipo."
      - "**Kila mtu kwa lugha yake.** Side Badger inazungumza lugha 39 na kila mtu anachagua yake. Ukurasa wa mwanzo wa Splitwise unasema 7+. Pia inashughulikia sarafu 133, kwa safari inayokwenda kila mahali."
      - "**Msaada bila kuondoka kwenye programu.** Umekwama au umepata hitilafu? Tuambie kutoka kwenye programu na usome jibu letu papo hapo."
  - heading: Mahali Splitwise bado inashinda
    body: Tungependa uchague programu inayofaa kuliko kugundua baadaye. Kikundi chenu kikihitaji mojawapo ya haya, Splitwise inayo na Side Badger haina.
    items:
      - "**Programu za duka la programu.** Side Badger inakaa kwenye kivinjari chako na kwenye skrini ya kwanza, si kwenye maduka ya programu."
      - "**Hali ya nje ya mtandao.** Side Badger inahitaji muunganisho."
      - "**Malipo ndani ya programu.** Kwenye baadhi ya nchi Splitwise inaweza kusogeza pesa pia. Side Badger inatunza rekodi tu."
      - "**Kugawanya kwa sehemu au kwa kipengee.** Side Badger ina mlipaji mmoja kwa kila gharama, na gharama hugawanywa kwa usawa, kwa kiasi kamili au kwa asilimia. Kuchanganua kwake risiti hakugawi vipengee kwa watu."
      - "**Chati na migawanyo chaguo-msingi.** Splitwise Pro ina vyote viwili. Side Badger inaweka hesabu ya nani anadaiwa na nani, na hiyo ndiyo ujanja wote."
  - heading: Kuhamisha kikundi chako
    body: Hakuna zana ya kuingiza data, kwa hivyo kuhama ni kuanza upya. Maliza hesabu kwenye Splitwise kwanza, kisha tengeneza kikundi kwenye Side Badger na umwalike kila mtu kwa kiungo au msimbo wa QR. Kila mtu kwenye kikundi anahitaji akaunti ya bure, na kujisajili kunahitaji anwani ya barua pepe tu.
