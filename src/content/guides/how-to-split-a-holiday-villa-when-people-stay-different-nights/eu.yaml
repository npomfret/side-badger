faq:
  heading: "Villari buruzko galderak"
  items:
    - q: "Zer gertatzen da norbaitek bertan behera uzten badu?"
      a: "Kendu haren gauak, egin kalkuluak berriro eta editatu villaren gastua, zenbateko zehatzek prezioa berriro batu dezaten. Aurreko bertsioa gorde egiten da eta aldaketa taldearen jardueran agertzen da, beraz inork ez du zenbaki bat isilean aldatzen. Nork edita dezakeen taldearen baimenen araberakoa da."
    - q: "Erreserba egin duenak gutxiago ordaindu behar al du?"
      a: "Taldeak erabaki behar du. Erreserbatzea lana da, eta taldeen artean aldatzen da horrek deskontua merezi duen ala ez. Adosten duzuena dena delakoa, jarri zenbateko zehatzetan eta idatzi gastuaren ohar batean, edo ondoko iruzkin batean, inork akordioa gogoratu behar izan ez dezan."
    - q: "Garbiketa-kuotak beste modu batera banatu al ditzakegu?"
      a: "Bai. Sartu kuota gastu bereizi gisa eta eman bere banaketa. Berdin banatzea egokia da etxe osoarentzako tarifa finko batean. Zenbateko zehatzak egokiak dira kuotak gauei ere jarraitzea nahi duen taldearentzat."
