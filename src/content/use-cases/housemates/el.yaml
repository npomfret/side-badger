featuresHeading: "Οι λειτουργίες που χρησιμοποιεί ένα σπίτι"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορεί το ενοίκιο να επαναλαμβάνεται αυτόματα;"
      a: "Όχι, δεν υπάρχουν επαναλαμβανόμενοι λογαριασμοί. Αντιγράψτε το ενοίκιο του προηγούμενου μήνα με μερικά αγγίγματα, αλλάξτε την ημερομηνία και τελειώσατε."
    - q: "Μπορούμε να χωρίσουμε ανάλογα με το δωμάτιο;"
      a: "Ναι, με ποσοστά. Δώστε σε κάθε συγκάτοικο ένα μερίδιο που αντικατοπτρίζει το δωμάτιό του, αρκεί τα μερίδια να κάνουν συνολικά 100. Για τους άλλους τρόπους διαχωρισμού δείτε τον [διαχωρισμό εξόδων](page:feature/split-expenses)."
    - q: "Τι γίνεται αν ένας συγκάτοικος μετακομίσει χρωστώντας χρήματα;"
      a: "Δεν μπορεί να αφήσει την ομάδα μέχρι να τακτοποιηθεί, γιατί κανείς δεν μπορεί να φύγει όσο χρωστά ή του χρωστούν χρήματα. Τα νούμερα μένουν τίμια μέχρι να γίνουν όλοι πάτσι."
    - q: "Πληρώνει το Side Badger τους λογαριασμούς;"
      a: "Όχι. Κρατά τον λογαριασμό και προτείνει μια σύντομη λίστα πληρωμών. Πληρώνετε ο ένας τον άλλον όπως θέλετε και μετά το καταγράφετε, όπως εξηγεί η [εκκαθάριση](page:feature/settle-up)."
    - q: "Μπορεί ένας συγκάτοικος να κρατά τα βιβλία;"
      a: "Ναι. Κάντε τον διαχειριστή και χρησιμοποιήστε μια διαχειριζόμενη ομάδα, όπου τα νέα μέλη χρειάζονται έγκριση και μόνο οι δημιουργοί και οι διαχειριστές αλλάζουν έξοδα."
