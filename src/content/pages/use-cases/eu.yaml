meta:
  title: "Side Badger etxekideentzat, bidaietarako eta festetarako"
  description: "Banatu kostuak etxekideekin, taldeko bidaietan eta festa, ezkontza eta talde-opariak antolatzeko. Ikusi Side Badger-ek zer egiten duen talde mota bakoitzerako."
h1: Side Badger zure talde motarentzat
navLabel: Erabilera-kasuak
lead: Etxekideak, opor-bidaiak, agur-festak. Aukeratu zure kaosa, eta ikusi zure antzeko talde batek nola eramaten duen kontua.
intro: Talde bakoitzak kostuak apur bat modu desberdinean banatzen ditu. Orri hauek **egoera errealista** bat jarraitzen dute lehen gastutik azken ordainketa erregistratuaraino, kalkuluak erakutsiz, zure taldeak zer lortuko lukeen ikus dezazun.
cta:
  heading: Aurkitu al duzu zure talde mota?
  body: Sortu kontu bat, hasi talde bat eta gehitu lehen gastua. Pare bat minutu behar dira.
  button: Sortu doako kontu bat
cardsHeading: Aukeratu zurearen antzekoena den egoera
sections:
  - heading: Taldeko bidaiak
    body: Hegaldiak libera esterlinatan, villa bat euroetan eta hiru lagunek bakarrik jan zuten afari bat. Ezarri taldea libera esterlinetara bihurtzeko, eta Lisboako lau lagunek hiru ordainketarekin amaitzen dute, monetak bereizita mantenduz gero sei izan beharrean. [Banatu taldeko bidaiaren kostuak](page:use-case/group-trips).
  - heading: Etxekideak
    body: Batek jabeari ordaintzen dio, besteak energia-faktura gogoratzen du, eta inork ez daki nork erosi zuen komuneko papera. Alokairua gelen tamainaren arabera eta gainerako fakturak berdin banatuta, lau etxekidek hilabetea hiru ordainketarekin amaitzen dute, denak alokairua ordaindu zuenarentzat. [Banatu etxeko fakturak etxekideekin](page:use-case/housemates).
  - heading: Festak, ezkontzak eta talde-opariak
    body: Seik oparia bozkatzen dute, batek erosten du, eta ez denek jartzen dute kopuru bera. £150 balio duen opari bat zenbateko zehatzen arabera banatuta, bost ordainketa geratzen dira, erosi zuenarentzat, £120 guztira. [Banatu ekitaldi baten kostuak](page:use-case/events-and-celebrations).
  - heading: Bikoteak
    body: Banatu kostu aspergarriak zita-gaua hiruhileko finantza-berrikuspen bihurtu gabe. Alokairua 60/40 banatuta eta erosketak berdin banatuta, zuen artean ordainketa bakar batera murrizten dira.
  - heading: Ikusi lehenengo nola funtzionatzen duen
    body: "Goiko adibide guztiek urrats berberak erabiltzen dituzte, talde bat sortzetik ordainketak erregistratzera arte. [Nola funtzionatzen duen](page:how-it-works) orrian azaltzen dira, eta [prezioak](page:pricing) orrian zenbat kostatzen den: ezer ez, iragarkirik gabe eta eguneko mugarik gabe."
faq:
  heading: Galderak
  items:
    - q: Taldeko guztiek behar dute kontu bat?
      a: Bai. Jendea esteka edo QR kode batekin eta doako kontu batekin sartzen da.
    - q: Side Badger-ek dirua bil dezake?
      a: Ez. Ordaindu nahi duzuen moduan, eta gero erregistratu ordainketa saldoak zuzen egon daitezen.
    - q: Talde mota bat aukeratu behar al dut?
      a: Ez. Erabilera-kasuak adibideak dira, ez ezarpenak. Talde guztiek ezaugarri berberak dituzte, beraz erabili zuri egokitzen zaizun konbinazioa.
