featuresHeading: Le funzionalità che usa
faq:
  heading: Domande
  items:
    - q: Gli invitati possono vedere il gruppo senza unirsi?
      a: No. Le persone si uniscono con un link o un codice QR e un account gratuito, quindi vedono il gruppo una volta entrate.
    - q: Side Badger può raccogliere i soldi?
      a: No. Side Badger tiene il conto e non sposta mai denaro. Pagatevi come vi fa più comodo, poi registrate il pagamento. È gratis, senza pubblicità e senza limiti giornalieri; vedi i [prezzi](page:pricing).
    - q: I voti possono essere anonimi?
      a: Sì. Quando crei un sondaggio puoi nascondere chi ha votato cosa. Le impostazioni si possono cambiare solo prima del primo voto.
    - q: Ognuno può contribuire con una cifra diversa?
      a: Sì. Dividi una spesa per importi esatti, così la quota di ciascuno è la cifra concordata, oppure escludi chi non era coinvolto.
    - q: Chi organizza può tenere i conti?
      a: Sì. Usa il preset del gruppo gestito, così solo i creatori e gli admin modificano le spese e gli admin approvano i nuovi membri.
