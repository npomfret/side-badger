meta:
  title: "ساتھ رہنے والوں کے ساتھ گھریلو بل تقسیم کریں"
  description: "کرایہ کمرے کے سائز کے حساب سے تقسیم کریں، بجلی گیس اور گروسری برابر بانٹیں، اور ہر مہینے دیکھیں کس کو کس کا دینا ہے۔ ساتھ رہنے والوں کے لیے حساب رکھنے کا مفت طریقہ۔"
h1: "ساتھ رہنے والوں کے ساتھ گھریلو بل تقسیم کریں"
navLabel: "ساتھ رہنے والے"
lead: "اس ساتھی کے لیے جو ٹوائلٹ رول خریدتا ہے، اور ان ساتھیوں کے لیے جنہیں کسی طرح یہ ہوتا دکھائی نہیں دیتا۔ Side Badger **ساتھ رہنے والوں اور روم میٹس** کے کرائے، بلوں اور خریداری کا ایک چلتا ہوا حساب رکھتا ہے، تاکہ کسی کو کسی کا پیچھا نہ کرنا پڑے اور فرج پھر سے صرف فرج بن سکے۔"
cta:
  heading: "اپنے ہی گھر سے شروع کریں"
  body: "اکاؤنٹ بنائیں، گھر کے لیے گروپ بنائیں اور سب کو دعوتی لنک بھیجیں۔ اس مہینے کے بل آج رات ہی شامل ہو سکتے ہیں۔"
  button: "مفت اکاؤنٹ بنائیں"
scenario:
  heading: "گھر ترتیب دیں"
  body: "گھر کے لیے گروپ بنائیں، وہ نام چنیں جو آپ چاہتے ہیں لوگ اس میں دیکھیں، اور سب کو لنک یا QR کوڈ سے مدعو کریں۔ گروپ کھلا ہو سکتا ہے، جہاں سب شامل اور ترمیم کرتے ہیں، یا منظم، جہاں نئے ارکان کو ایڈمن کی منظوری چاہیے اور صرف تخلیق کار اور ایڈمن اخراجات بدل سکتے ہیں، جو اس ساتھی کے لیے موزوں ہے جو کھاتے رکھتا ہے۔ جو صرف اعداد دیکھنا چاہے وہ ناظر بن سکتا ہے، جو سب کچھ دیکھتا ہے اور کچھ نہیں بدلتا۔ سب نیا خرچہ فوراً دیکھتے ہیں، اس لیے «میں بعد میں ڈال دوں گا» کے چھپنے کی جگہیں کم رہ جاتی ہیں۔"
sections:
  - heading: "کرایہ اور بل"
    body: "کرایہ شاذ ہی چار پر برابر بٹتا ہے، کیونکہ خواب گاہیں برابر نہیں ہوتیں۔ اسے فیصد کے مطابق تقسیم کریں، تاکہ بڑا کمرہ زیادہ دے اور کھڑکی والی الماری کم۔ فیصد کا مجموعہ 100 ہونا چاہیے۔ جو بل سب استعمال کرتے ہیں انہیں برابر تقسیم ملتی ہے، اور جس ساتھی کا کسی خرچے میں حصہ نہیں تھا اسے اس سے نکالا جا سکتا ہے۔ جب برابر تقسیم میں ایک اضافی پیسہ بچے تو وہ بے ترتیبی سے کسی ایک شخص کو جاتا ہے۔ بار بار آنے والے بل نہیں ہیں، اس لیے ہر مہینے آپ پچھلے مہینے کا کرایہ کاپی کرتے ہیں، تاریخ بدلتے ہیں اور آگے بڑھتے ہیں۔"
  - heading: "مشترکہ خریداری"
    body: "مشترکہ خریداری کی فہرست کو خریداری کے بلوں والے گروپ ہی میں رکھیں، اور آئٹمز کو ٹرالی تک پہنچنے پر ٹک کریں۔ جو خریداری کرے وہ رسید کا کل خرچے کے طور پر شامل کرتا ہے اور اسے برابر تقسیم کرتا ہے، یا صرف ان لوگوں میں جو وہ چیز کھائیں گے۔ جو شخص مسلسل جئی کا دودھ خریدتا ہے جو کوئی اور نہیں پیتا وہ گھر کا معاملہ ہی رہتا ہے، لیکن کم از کم اخراجات کی فہرست درست ہوگی۔ گروپ کی اجازتیں طے کرتی ہیں کہ فہرستیں کون بنا اور بدل سکتا ہے۔ کرایہ، بل اور خریداری ملا دیں تو آپ کو ایسا مہینہ ملتا ہے جیسا نیچے ہے، چار افراد کے گھر میں: جوزی £2,000 کرایہ دیتی ہے، کمرے کے سائز کے مطابق 30%، 25%، 25% اور 20% میں بانٹا گیا، پھر کوامے توانائی کے لیے £120، لینا انٹرنیٹ کے لیے £40 اور میٹ گروسری کے لیے £80 دیتے ہیں، ہر ایک برابر تقسیم۔ جوزی کو £1,340 ملنے ہیں، اور Side Badger تین ادائیگیاں تجویز کرتا ہے، سب جوزی کو۔"
  - heading: "گھریلو اخراجات تقسیم کرنے کے منصفانہ طریقے"
    items:
      - "**برابر** ان چیزوں کے لیے موزوں ہے جو سب تقریباً ایک جیسی استعمال کرتے ہیں، جیسے انٹرنیٹ، صفائی کا سامان اور مشترکہ خریداری۔ یہ تیز ہے اور کسی کو حساب پر بحث نہیں کرنی پڑتی۔"
      - "**کمرے کے سائز کے مطابق** کرائے کے لیے موزوں ہے، کیونکہ کمرے مختلف ہوتے ہیں اور ان کے لیے لوگوں کی ادائیگی کی رضامندی بھی۔ فیصد ایک بار طے کریں، جب کوئی منتقل ہو، اور ہر مہینے دوبارہ استعمال کریں۔"
      - "**استعمال کے مطابق** ان بلوں کے لیے موزوں ہے جہاں ایک شخص واضح طور پر زیادہ استعمال کرتا ہے، جیسے گھریلو دفتر کا ہیٹنگ بل یا اسٹریمنگ اکاؤنٹ جو صرف دو لوگ دیکھتے ہیں۔ جن کا اس میں حصہ نہیں تھا انہیں نکال دیں، یا ہر شخص کے لیے عین رقم درج کریں۔"
      - "جو بھی چنیں، پہلے بل سے پہلے اس پر اتفاق کریں نہ کہ پہلی بحث کے بعد، اور اصول کہیں ایسی جگہ لکھ دیں جہاں پورا گھر دیکھ سکے۔"
  - heading: "جب کوئی منتقل ہو جائے"
    body: "وہ پہلے حساب برابر کرتا ہے۔ جب تک کسی کو دینا یا لینا ہو وہ گروپ نہیں چھوڑ سکتا، اس لیے جانے والا ادا کرتا ہے یا وصول کرتا ہے، آپ اسے ریکارڈ کرتے ہیں، اور پھر وہ جاتا ہے۔ باقی ساتھیوں کے لیے گروپ جاری رکھیں اور نئے شخص کو لنک سے مدعو کریں۔ جب گھر کا معاملہ خود ختم ہو جائے تو ایڈمن گروپ کو مقفل کر سکتا ہے تاکہ اعداد اپنی جگہ رہیں، یا اسے ہمیشہ کے لیے بند کر سکتا ہے، جس سے یہ سب کے لیے ناقابل رسائی ہو جاتا ہے، اس لیے ایسا تبھی کریں جب کسی کو تاریخ کی ضرورت نہ ہو۔"
exampleAfter: 2
