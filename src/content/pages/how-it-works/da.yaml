sections:
  - heading: 39 sprog, og lavet til flere mennesker
    body: Brug Side Badger på 39 sprog, herunder arabisk, persisk og urdu, der skrives fra højre mod venstre. Alle i gruppen kan vælge deres eget, så gruppesiden kan være på arabisk for én og på engelsk for den næste. Den er også lavet med tanke på brugere af tastatur og skærmlæser, og medlemsfarver kommer med mønstre, så du ikke skal kunne kende forskel på grøn og rød.
faq:
  heading: Spørgsmål
  items:
    - q: Skal alle have en konto?
      a: Ja, en gratis en. Hver person bekræfter sin e-mail, før vedkommende kan tilføje noget.
    - q: Findes der en app?
      a: Den kører i browseren, og du kan føje den til din startskærm eller dock, så den åbner som en app. Der er ingen version i en app store og ingen offlinetilstand.
    - q: Flytter Side Badger penge?
      a: Nej. Den fører regnskabet og foreslår betalinger, og I betaler hinanden, som I vil. Derefter registrerer I betalingen. Se [gør op](page:feature/settle-up).
    - q: Kan nogen forlade gruppen, mens de skylder penge?
      a: Nej. Ingen kan forlade en gruppe, mens de stadig skylder eller er til gode, så de gør først op.
    - q: Hvor mange kan være med i en gruppe?
      a: Op til 50 personer i en gruppe. Inviter dem med et link eller en QR-kode, og slå godkendelse til, hvis du vil have en administrator til at lukke hver person ind.
    - q: Hvad med ture med mere end én valuta?
      a: Saldiene føres adskilt for hver valuta. Se [flere valutaer](page:feature/multiple-currencies).
