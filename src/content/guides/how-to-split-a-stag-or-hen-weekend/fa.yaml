faq:
  heading: "پرسش‌ها"
  items:
    - q: "ساقدوش داماد یا ساقدوش عروس بیشتر می‌دهد؟"
      a: "فقط اگر گروه توافق کند. برنامه به هیچ‌کس نقش ویژه‌ای در حساب نمی‌دهد. اگر کسی بیشتر را پوشش می‌دهد، زیر **نحوه تقسیم** گزینه **مبالغ دقیق** یا **درصد** را انتخاب کنید و سهم‌هایی را که توافق کرده‌اید وارد کنید."
    - q: "نوشیدنی‌هایی که بعضی‌ها نخوردند چه؟"
      a: "نوشیدنی‌ها را هزینه جدا اضافه کنید و فقط کسانی را که خوردند تیک بزنید. اگر مقدار هر کس فرق داشت، **مبالغ دقیق** را انتخاب کنید و سهم هر نفر را بنویسید. هیچ‌کس بابت چیزی که نداشته پول نمی‌دهد."
    - q: "مهمان افتخاری بعداً می‌تواند گروه را ببیند؟"
      a: "بله، بعد از اینکه سورپرایز تمام شد. او را دعوت کنید، بعد یک مدیر می‌تواند او را زیر **امنیت و دسترسی‌ها** در تنظیمات گروه **بیننده** کند. بیننده همه‌چیز را می‌بیند و چیزی را تغییر نمی‌دهد، پس صبر کنید تا دیگر چیزی راز نباشد. برای پیوستن به یک حساب رایگان نیاز دارد."
