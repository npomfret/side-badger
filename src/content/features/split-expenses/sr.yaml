meta:
  title: "Дели трошкове једнако, тачно или по процентима | Side Badger"
  description: "Подели заједнички трошак једнако, по тачним износима или по процентима и изостави свакога ко није био тамо. Бесплатно, без огласа и без дневних ограничења."
h1: "Дели трошкове једнако, тачно или по процентима"
navLabel: "Подела трошкова"
lead: "Није све 50/50. Side Badger се сналази. Реци ко је платио, изабери особе које деле трошак и подели га **једнако, по тачним износима или по процентима**. Замерке се продају посебно."
cta:
  heading: "Подели следећи како треба"
  body: "Направи бесплатан кориснички налог, оснуј групу и додај трошак који већ дуго намераваш да средиш. Не знаш шта следи? Погледај [како ради](page:how-it-works) или провери [шта покрива бесплатна верзија](page:pricing)."
  button: "Направи бесплатан налог"
problem:
  heading: "Није све 50/50"
  body: "Кирија зависи од величине собе. Поклон од тога ко је шта обећао. Вечера од тога ко је остао на десерт. Дељење рачуна напола функционише до првог рачуна који није такав, а тада неко отвори табелу. Side Badger бележи ко је платио, ко дели трошак и како се дели, па стања излазе тачна, а нико за столом не мора писмено да дели."
workflow:
  heading: "Додавање трошка од почетка до краја"
  steps:
    - title: "Реци ко је платио и за шта"
      body: "Унеси износ, кратак опис и особу која је платила. За сваки трошак плаћа једна особа, што рачуницу држи поштеном."
      shot: S05
      shotAlt: "Образац трошка са киријом за викендицу подељеном по процентима на троје људи"
    - title: "Изабери поделу"
      body: "Изабери једнако, тачне износе или проценте. Проценти морају заједно давати 100, а тачни износи морају заједно давати укупан износ."
      shot: S06
      shotAlt: "Образац трошка са тачним износима унетим за сваку особу за поклон"
    - title: "Додај причу"
      body: "Постави датум, додај ознаке, место и напомену. Сви у групи виде исте детаље и могу одмах тамо да коментаришу."
      shot: S08
      shotAlt: "Трошак са детаљима, нитом коментара и изворним износом у коме је унет"
    - title: "Постави питање ако нешто делује чудно"
      body: "Ако је група укључила питања о трошковима, свако ко је укључен у трошак може га довести у питање, а списак трошкова може приказивати само оне доведене у питање."
      shot: S18
      shotAlt: "Списак трошкова са ознаком Доведено у питање и филтером Само доведено у питање"
options:
  heading: "Три начина поделе"
  items:
    - title: "Једнако"
      body: "Подразумевано за вечере, таксије и све што су сви делили равномерно. Ако се укупан износ не дели без остатка, преостали цент иде једној особи насумично, не увек истој. У таксију испод то је Ана."
    - title: "По тачним износима"
      body: "Упиши колико ко дугује. Добро за поклон где је свако изабрао другу цену или куповину у којој је нечија корпа садржала више од заједничких намирница. Износи морају заједно давати укупан износ."
    - title: "По процентима"
      body: "Дај сваком удео у укупном износу. Кирија према величини собе је класик: највећа соба плаћа највећи удео и нико се не претвара другачије."
