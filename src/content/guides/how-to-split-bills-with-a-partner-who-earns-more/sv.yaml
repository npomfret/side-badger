faq:
  heading: Frågor
  items:
    - q: Ska vi använda lön före eller efter skatt?
      a: Det avgör gruppen. Lön efter skatt är vanligt, eftersom det är pengarna man faktiskt har att spendera. Lön före skatt bortser från att skatt, pensionsavgifter och lånebetalningar tar olika mycket ur olika löner. Vilket ni än väljer, använd samma mått för er båda.
    - q: Ser Side Badger våra inkomster?
      a: Nej. Du skriver bara in procent, aldrig löner. Procenten syns för gruppens medlemmar, och för ett par är det ni två.
    - q: Kan vi ange 62/38 en gång för allt?
      a: Delningen anges per utgift, inte per grupp. Kopiera en utgift som redan har 62 och 38 och ändra det som skiljer sig. [Dela utgifter](page:feature/split-expenses) tar upp de andra alternativen.
