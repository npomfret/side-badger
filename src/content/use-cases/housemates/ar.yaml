faq:
  heading: "أسئلة"
  items:
    - q: "هل يمكن أن يتكرر الإيجار تلقائياً؟"
      a: "لا، لا توجد فواتير متكررة. انسخ إيجار الشهر الماضي بنقرتين، وغيّر التاريخ وانتهى الأمر."
    - q: "هل نستطيع التقسيم بحسب مساحة الغرفة؟"
      a: "نعم، بنسبة مئوية. أعطِ كل زميل سكن حصة تعكس غرفته، ما دام مجموع الحصص 100. ويشرح [تقسيم المصروفات](page:feature/split-expenses) الطرق الأخرى للتقسيم."
    - q: "ماذا لو انتقل زميل سكن وعليه دين؟"
      a: "لا يستطيع مغادرة المجموعة قبل أن يسوّي حسابه، لأن أحداً لا يستطيع المغادرة وعليه مبلغ أو له مبلغ. وتبقى الأرقام صادقة إلى أن يتعادل الجميع."
    - q: "هل يدفع Side Badger الفواتير؟"
      a: "لا. يحتفظ بالحساب ويقترح قائمة قصيرة من الدفعات. تدفعون لبعضكم بالطريقة التي تناسبكم، ثم تسجّلون ذلك، كما يشرح [تسوية الحسابات](page:feature/settle-up)."
    - q: "هل يستطيع زميل سكن واحد أن يمسك الدفاتر؟"
      a: "نعم. اجعله مشرفاً واستخدم مجموعة مُدارة، حيث يحتاج الأعضاء الجدد إلى موافقة ولا يغيّر المصروفات إلا المنشئون والمشرفون."
