h1: "Οδηγοί για δίκαιο μοίρασμα εξόδων"
navLabel: "Οδηγοί"
lead: "Οι ερωτήσεις που κάνει ο κόσμος λίγο πριν ανοίξει ένα υπολογιστικό φύλλο, με απαντήσεις μέσα από μια ρεαλιστική ομάδα, τις πράξεις και τα βήματα στην εφαρμογή."
intro: "Κάθε οδηγός ακολουθεί **μια φανταστική ομάδα** από το πρώτο έξοδο ως την τελευταία καταγεγραμμένη πληρωμή. Οι αριθμοί υπολογίζονται για εσάς και τα βήματα χρησιμοποιούν τις οθόνες με τα ονόματα που τους δίνει η εφαρμογή."
cta:
  heading: "Έχετε μια ομάδα σαν αυτήν;"
  body: "Δημιουργήστε λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το πρώτο έξοδο. Οι πράξεις γίνονται για εσάς."
cardsHeading: "Διαλέξτε την ερώτησή σας"
