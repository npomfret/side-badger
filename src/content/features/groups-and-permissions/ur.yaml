meta:
  title: "مشترکہ اخراجات کے لیے گروپ ایڈمن اور اجازتیں | Side Badger"
  description: "لنک یا QR کوڈ سے لوگوں کو مدعو کریں، منظور کریں کون شامل ہو، ناظر بنائیں، اجازتیں طے کریں اور کام ختم ہونے پر گروپ لاک کر دیں۔ آپ کا گروپ، آپ کے اصول، معقول حد تک۔"
h1: "گروپ ایڈمن اور اجازتیں: آپ کے اصول، معقول حد تک"
navLabel: "گروپ اور اجازتیں"
lead: "کچھ گروپوں کو خزانچی چاہیے ہوتا ہے۔ Side Badger میں اس کے لیے ترتیب موجود ہے۔ لنک یا QR کوڈ سے لوگوں کو مدعو کریں، طے کریں کون اندر آئے، اور چنیں کون اعداد بدل سکتا ہے۔ دوستوں کا چھوٹا گروپ یہ سب نظرانداز کر سکتا ہے، کیونکہ نئے گروپ پوری طرح کھلے شروع ہوتے ہیں۔"
cta:
  heading: "صاف ستھرا گروپ چلانے کو تیار ہیں؟"
  body: "اکاؤنٹ بنائیں، گروپ شروع کریں اور دعوتی لنک بھیجیں۔ اسے کھلا رہنے دیں، یا گروپ بڑا اور نخرے والا ہو جائے تو اصول سخت کر دیں۔"
problem:
  heading: کسی کو اعداد صاف رکھنے ہوتے ہیں
  body: "چار ساتھی بھروسے پر چل سکتے ہیں۔ شادی کے ویک اینڈ پر تیس مہمانوں کا شاید نہیں چل سکتا۔ ہر گھر، سفر یا تقریب کے لیے ایک گروپ بنائیں، جس میں 50 افراد تک ہو سکتے ہیں، اور ہر گروپ کے اپنے ارکان، اپنے کردار اور اپنے اصول ہوتے ہیں۔ آپ کا ڈیش بورڈ ان سب کو ایک اسکرین پر دکھاتا ہے، ساتھ یہ بھی کہ ہر ایک میں آپ کی کیا پوزیشن ہے۔ زیادہ تر گروپ ترتیبات کو ہاتھ بھی نہیں لگاتے۔ جو لگاتے ہیں ان میں عموماً کوئی اتنا منظم شخص ہوتا ہے جسے یہ چاہییں۔"
workflow:
  heading: "خالی گروپ سے لاک گروپ تک"
  steps:
    - title: "لنک یا QR کوڈ سے مدعو کریں"
      body: "**دوسروں کو مدعو کریں** کھولیں، چنیں کہ لنک کتنی دیر چلے (15 منٹ، 1 گھنٹہ، 1 دن یا 5 دن)، پھر لنک کاپی کریں یا QR کوڈ دکھائیں تاکہ لوگ اسکین کریں۔ آپ ایپ کے اندر سے ان لوگوں کو بھی مدعو کر سکتے ہیں جن کے ساتھ آپ کا کوئی اور گروپ پہلے سے ہے۔"
      shot: S03
      shotAlt: "دعوت کا ڈائیلاگ جس میں گروپ کا لنک، اس کا QR کوڈ اور لنک کی مدت چننے کا اختیار ہے"
    - title: "شامل ہونے سے پہلے دیکھ لینے دیں"
      body: "لنک والا ہر شخص سائن ان کرتا ہے یا اکاؤنٹ بناتا ہے، گروپ کا پیش نظارہ دیکھتا ہے اور وہ نام چنتا ہے جو وہ اس میں استعمال کرنا چاہے۔ پھر وہ **گروپ میں شامل ہوں** دباتا ہے۔"
      shot: S04
      shotAlt: "سائن ان شدہ شخص کو شامل ہونے سے پہلے دکھایا جانے والا گروپ کا پیش نظارہ"
    - title: "منظور کریں کون شامل ہو"
      body: "منظوری آن کریں تو لنک استعمال کرنے والے زیر التوا ارکان کے طور پر انتظار کرتے ہیں جب تک ایڈمن انہیں اندر نہ آنے دے۔ ایڈمن انہیں **سیکیورٹی اور اجازتیں** میں **زیر التوا اراکین** کے تحت دیکھتے ہیں، اور **منظور کریں** یا **مسترد کریں** چنتے ہیں۔ اس وقت تک زیر التوا شخص گروپ میں کچھ نہیں دیکھ سکتا۔"
      shot: S14
      shotAlt: "زیر التوا اراکین جو ایڈمن کی منظوری یا انکار کے منتظر ہیں"
    - title: "چنیں کون کیا بدل سکتا ہے"
      body: "**کھلا تعاون** یا **منظم گروپ** چنیں، یا اجازتیں ایک ایک کر کے طے کریں۔ پھر ہر شخص کو کردار دیں: ایڈمن، رکن یا ناظر۔ اجازتیں اور کردار صرف ایڈمن بدل سکتے ہیں۔"
      shot: S13
      shotAlt: "گروپ کی ترتیبات کا سیکیورٹی ٹیب جس میں دو پری سیٹ اور حسب ضرورت اجازتیں ہیں"
    - title: "کام ختم ہو تو لاک کر دیں"
      body: "جب سفر ختم ہو جائے اور اعداد بیٹھ جائیں تو ایڈمن **گروپ لاک کریں** آن کر سکتا ہے۔ کوئی خرچہ شامل یا تبدیل نہیں کر سکتا، ادائیگی ریکارڈ نہیں کر سکتا اور فہرستیں یا پول میں ترمیم نہیں کر سکتا، اور ایک بینر یہ بات بتاتا ہے۔ کوئی چپکے سے دیر سے آنے والی ٹیکسی نہیں ڈال سکتا۔ اگر واقعی کوئی نکل آئے تو ایڈمن گروپ کو ان لاک کر سکتا ہے۔"
      shot: S15
      shotAlt: "ایک گروپ جس میں وہ بینر ہے جو بتاتا ہے کہ وہ لاک ہے"
options:
  heading: "ایڈمن، رکن اور ناظر"
  items:
    - title: "ایڈمن"
      body: "گروپ چلاتا ہے۔ ایڈمن نئے ارکان کو منظور کرتے ہیں، کردار اور اجازتیں بدلتے ہیں، گروپ کو لاک اور ان لاک کرتے ہیں، اور اسے بند کرتے ہیں۔ گروپ بنانے والا ایڈمن کے طور پر شروع کرتا ہے، اور گروپ کبھی بغیر ایڈمن کے نہیں رہتا، کیونکہ آخری ایڈمن کا درجہ گھٹایا نہیں جا سکتا۔"
    - title: "رکن"
      body: "حصہ لیتا ہے۔ رکن کیا کر سکتا ہے، یہ گروپ کی اجازتوں پر منحصر ہے۔ کھلے تعاون والے گروپ میں تقریباً سب کچھ۔ منظم گروپ میں رکن صرف وہی اخراجات اور فہرستیں بدل سکتے ہیں جو انہوں نے خود بنائی ہوں۔"
    - title: "ناظر"
      body: "سب کچھ دیکھتا ہے اور کچھ نہیں بدلتا۔ ناظر اخراجات یا فہرستیں شامل یا ایڈٹ نہیں کر سکتا، لوگوں کو مدعو نہیں کر سکتا، ترتیبات نہیں بدل سکتا اور ہیڈر کی تصویر کو ہاتھ نہیں لگا سکتا۔ اس شخص کے لیے کام کا جو اعداد پر نظر رکھنا چاہتا ہے اور وعدہ کرتا ہے کہ چھیڑ چھاڑ نہیں کرے گا۔"
sections:
  - heading: "کھلا، منظم یا آپ کے اپنے اصول"
    body: "نئے گروپ **کھلے تعاون** پر شروع ہوتے ہیں، جہاں ہر کوئی لوگوں کو مدعو کر سکتا ہے، اخراجات بدل سکتا ہے اور فہرستیں ایڈٹ کر سکتا ہے، اور نئے ارکان خود بخود شامل ہو جاتے ہیں۔ **منظم گروپ** تب کے لیے ہے جب کسی کو سمجھ دار بننا پڑے۔ آپ سات اجازتیں ایک ایک کر کے بھی طے کر سکتے ہیں، اور کوئی ایک ہاتھ سے بدلنے پر گروپ حسب ضرورت پر چلا جاتا ہے۔ جو بھی چنیں، اجازتیں خود صرف ایڈمن بدل سکتے ہیں، اور ہر تبدیلی سرگرمی کی فیڈ میں نظر آتی ہے۔ [ساتھ رہنے والوں](page:use-case/housemates) کا فلیٹ سب کچھ کھلا چھوڑ سکتا ہے۔ ایک بڑی [تقریب یا جشن](page:use-case/events-and-celebrations) کو اکثر منظم چاہیے ہوتا ہے، تاکہ کوئی ذمہ دار ہو کہ کون شامل ہو۔ یہ سب نیا لگ رہا ہے؟ [یہ کیسے کام کرتا ہے](page:how-it-works) پہلے خرچے سے حساب برابر ہونے تک پورا سفر دکھاتا ہے۔"
    items:
      - "**اخراجات میں ترمیم کون کر سکتا ہے۔** کھلا تعاون: کوئی بھی رکن۔ منظم گروپ: تخلیق کار اور ایڈمن۔"
      - "**اخراجات کون حذف کر سکتا ہے۔** کھلا تعاون: کوئی بھی رکن۔ منظم گروپ: تخلیق کار اور ایڈمن۔"
      - "**فہرستوں میں ترمیم کون کر سکتا ہے۔** کھلا تعاون: کوئی بھی رکن۔ منظم گروپ: تخلیق کار اور ایڈمن۔"
      - "**ارکان کو مدعو کون کر سکتا ہے۔** کھلا تعاون: کوئی بھی رکن۔ منظم گروپ: صرف ایڈمن۔"
      - "**نئے رکن کی منظوری۔** کھلا تعاون: خودکار۔ منظم گروپ: ایڈمن کی منظوری ضروری۔"
      - "**ترتیبات کون بدل سکتا ہے۔** کھلا تعاون: کوئی بھی رکن۔ منظم گروپ: صرف ایڈمن۔"
      - "**ہیڈر کی تصویر کون بدل سکتا ہے۔** کھلا تعاون: کوئی بھی رکن۔ منظم گروپ: صرف ایڈمن۔"
  - heading: "آپ کا نام، آپ کی تصویر، آپ کی ہیڈر تصویر"
    body: "ہر گروپ کی اپنی کاسٹ لسٹ ہوتی ہے۔ ہر گروپ میں وہ نام چنیں جو لوگ دیکھیں (2 سے 50 حروف، اور گروپ کے اندر منفرد) اور اپنی پروفائل تصویروں میں سے وہاں کون سی پہنیں۔ گھر میں **سیم** رہیں اور سفر میں **سیم (گاڑی والا)**۔ ترتیبات بدلنے کی اجازت رکھنے والا کوئی بھی گروپ کا نام بدل سکتا ہے اور اس کی تفصیل ایڈٹ کر سکتا ہے۔ ہیڈر کی تصویر، یعنی JPEG، PNG، GIF یا WebP جو 10 MB تک ہو، کی اپنی الگ اجازت ہے۔"
  - heading: "آرکائیو، لاک یا بند"
    body: "گروپ کو الگ رکھنے کے تین طریقے، کم سے زیادہ سنجیدہ کی ترتیب سے۔"
    items:
      - "**آرکائیو** گروپ کو صرف آپ کے اپنے ڈیش بورڈ سے چھپاتا ہے، کسی اور کے نہیں۔ آپ اسے پھر بھی کھول کر پہلے کی طرح استعمال کر سکتے ہیں، اور **گروپ غیر محفوظ کریں** اسے واپس لے آتا ہے۔"
      - "**لاک** ایڈمن کے ان لاک کرنے تک تبدیلیاں روک دیتا ہے۔ ہر کوئی پھر بھی گروپ اور اس کی تاریخ پڑھ سکتا ہے۔"
      - "**بند** مستقل ہے، اور سب کے لیے۔ اسے صرف ایڈمن کر سکتا ہے، تصدیق کے لیے گروپ کا نام ٹائپ کر کے، اور اس کے بعد کوئی گروپ دوبارہ نہیں کھول سکتا۔"
  - heading: "گروپ چھوڑنا"
    body: "حساب برابر ہونے کے بعد کوئی بھی چھوڑ سکتا ہے۔ آپ گروپ نہیں چھوڑ سکتے جب تک کسی ایک کرنسی میں بھی آپ کو دینا یا لینا ہو، جب تک کسی خرچے کا کوئی کھلا سوال آپ سے متعلق ہو، یا اگر آپ آخری ایڈمن یا اکلوتے رکن ہوں۔ [ادائیگی ریکارڈ کریں](page:feature/settle-up)، [خرچے کا سوال](page:guide/what-to-do-when-someone-disputes-a-shared-expense) نمٹائیں، یا کسی اور کو ایڈمن بنا دیں، پھر چلے جائیں۔ واپس آنے کے لیے آپ کو نئی دعوت چاہیے ہوگی۔"
limits:
  heading: "معقول حد تک: باریک حروف"
  items:
    - "ایک گروپ میں 50 افراد تک ہو سکتے ہیں۔"
    - "اجازتیں اور کردار صرف ایڈمن بدل سکتے ہیں۔ آخری ایڈمن کا درجہ گھٹایا نہیں جا سکتا۔"
    - "اخراجات میں ترمیم کو **صرف ایڈمنز** پر رکھنے کا مطلب یہ بھی ہے کہ اخراجات صرف ایڈمن شامل کر سکتے ہیں۔"
    - "لاک اخراجات میں تبدیلی، نئی ادائیگیاں، فہرستیں اور پول روک دیتا ہے۔ ہر کوئی پھر بھی گروپ اور اس کی تاریخ پڑھ سکتا ہے، اور ادائیگیوں پر ردعمل دے سکتا ہے۔"
    - "بند کرنا مستقل ہے۔ ایپ میں بند گروپ دوبارہ کھولنے کا کوئی طریقہ نہیں۔"
    - "نیا دعوتی لنک بنانے سے پرانے لنک منسوخ نہیں ہوتے۔ ہر لنک اپنی میعاد ختم ہونے تک چلتا ہے، اس لیے جب آپ کو فکر ہو کہ وہ کہاں پہنچ سکتا ہے تو چھوٹی مدت چنیں۔"
    - "ایپ کے اندر دعوتوں میں آپ کے 10 حالیہ ترین فعال گروپوں کے لوگ دکھائے جاتے ہیں۔ باقی سب کو لنک چاہیے، اور مدعو کون کر سکتا ہے یہ گروپ کی اجازتوں پر منحصر ہے۔"
    - "شامل ہونے کے لیے اکاؤنٹ چاہیے، اور کچھ شامل کرنے سے پہلے لوگوں کو اپنی ای میل کی تصدیق کرنی ہوتی ہے۔"
useCasesHeading: "جہاں تھوڑی ترتیب کام آتی ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا ناظر اخراجات شامل کر سکتا ہے؟"
      a: "نہیں۔ ناظر سب کچھ دیکھتا ہے اور کچھ نہیں بدلتا۔ وہ اخراجات یا فہرستیں شامل یا ایڈٹ نہیں کر سکتا، لوگوں کو مدعو نہیں کر سکتا اور ترتیبات نہیں بدل سکتا۔"
    - q: "کیا کوئی قرض ہوتے ہوئے گروپ چھوڑ سکتا ہے؟"
      a: "نہیں۔ جب تک کسی ایک کرنسی میں بھی کسی کو دینا یا لینا ہو وہ گروپ نہیں چھوڑ سکتا۔ پہلے حساب برابر کریں، پھر جائیں۔"
    - q: "گروپ بند ہونے پر کیا ہوتا ہے؟"
      a: "اسے کوئی دوبارہ نہیں کھول سکتا۔ گروپ صرف ایڈمن بند کر سکتا ہے، تصدیق کے لیے اسے گروپ کا نام ٹائپ کرنا پڑتا ہے، اور گروپ سب کے لیے دستیاب نہیں رہتا۔ اگر آپ صرف تبدیلیاں روکنا چاہتے ہیں تو لاک کریں۔ اگر صرف اپنے ڈیش بورڈ سے ہٹانا چاہتے ہیں تو آرکائیو کریں۔"
    - q: "کیا میں لاک واپس کر سکتا ہوں؟"
      a: "جی ہاں۔ ایڈمن گروپ کو ان لاک کر سکتا ہے، اور تبدیلیاں پھر سے کام کرنے لگتی ہیں۔"
    - q: "کیا لوگوں کے شامل ہونے سے پہلے مجھے انہیں منظور کرنا ہوگا؟"
      a: "صرف اگر آپ چاہیں۔ نئے گروپ کھلے تعاون پر شروع ہوتے ہیں، جہاں لنک استعمال کرنے والے خود بخود شامل ہو جاتے ہیں۔ ایڈمن کی منظوری آن کریں، یا منظم گروپ چنیں، تو ہر شخص ایڈمن کے اندر آنے دینے تک انتظار کرتا ہے۔"
    - q: "ایک گروپ میں کتنے لوگ ہو سکتے ہیں؟"
      a: "50 تک۔"
