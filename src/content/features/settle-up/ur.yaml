sections:
  - heading: "ادائیگی ریکارڈ کریں"
    body: "جب کوئی ادا کرے تو اسے صحیح شخص کے مقابل ریکارڈ کریں۔ فوری تصفیہ کے بٹن آپ کی تجویز کردہ ادائیگیوں سے رقم بھر دیتے ہیں، اور آپ «بینک ٹرانسفر» جیسا نوٹ شامل کر سکتے ہیں (500 حروف تک)۔ اپنے ذمے رقم کا صرف حصہ ادا کریں تو باقی بیلنس پر رہتا ہے۔ اگر آپ کم یا زیادہ درج کریں تو Side Badger محفوظ کرنے سے پہلے خبردار کرتا ہے۔ ادائیگی ریکارڈ کرنے کے لیے اخراجات میں ترمیم کی اجازت چاہیے، اور تاریخ مستقبل کی نہیں ہو سکتی۔"
  - heading: "کسی اور کرنسی میں ادا کیا؟"
    body: "بیلنس اسی کرنسی میں رہتے ہیں جس میں ادا کیا گیا، اس لیے یورو کا قرض یورو کا قرض رہتا ہے۔ یورو دینے ہیں اور پاؤنڈ میں ادا کر رہے ہیں؟ ادائیگی درج کرتے وقت اسے تبدیل کریں، موجودہ ایکسچینج ریٹ پر یا اس ریٹ پر جو آپ کو واقعی ملا۔ ادائیگی محفوظ ہوتے ہی ریٹ طے ہو جاتا ہے۔ [متعدد کرنسیاں](page:feature/multiple-currencies) بتاتا ہے کہ تبدیلی کیسے کام کرتی ہے، اور [گروپ سفر](page:use-case/group-trips) اسے استعمال میں دکھاتا ہے۔"
  - heading: "تاریخ جسے آپ جانچ سکتے ہیں"
    body: "ہر ریکارڈ شدہ ادائیگی اپنی تاریخ، رقم اور نوٹ کے ساتھ گروپ کی تاریخ میں رہتی ہے۔ ادائیگی میں صرف وہی ترمیم کر سکتا ہے جس نے اسے ریکارڈ کیا، اور وہ یا گروپ کا ایڈمن اسے حذف کر سکتا ہے۔ جس ادائیگی میں ایسا شخص شامل ہو جو گروپ چھوڑ چکا ہو وہ مقفل ہو جاتی ہے۔ ساتھ رہنے والوں کے ایک مکمل منظرنامے کے لیے [ساتھ رہنے والے](page:use-case/housemates) دیکھیں۔"
limits:
  heading: "Side Badger کیا نہیں کرتا"
  items:
    - "Side Badger رقم نہیں منتقل کرتا، ادائیگی کے لنک نہیں بھیجتا اور ادائیگی کی درخواستیں نہیں بھیجتا۔ ایپ میں ادائیگی کہیں اور کی گئی ادائیگی کا ریکارڈ ہے۔"
    - "تجویز کردہ ادائیگیاں ایک سادہ میچنگ طریقے سے آتی ہیں جو ہر کرنسی پر الگ لگتا ہے۔ یہ ہمیشہ اس کرنسی میں بیلنس والے افراد کی تعداد سے کم ادائیگیاں تجویز کرتا ہے (چار افراد، زیادہ سے زیادہ تین ادائیگیاں)، لیکن ہمیشہ ممکنہ کم ترین تعداد نہیں ڈھونڈتا۔"
    - "آپ تجاویز بند نہیں کر سکتے۔ **سب دکھائیں** گروپ کی ہر تجویز کردہ ادائیگی کو فہرست کرتا ہے، صرف آپ کی نہیں۔"
    - "کرنسیاں آپس میں کبھی نیٹ نہیں کی جاتیں، جب تک اخراجات شامل کرتے وقت تبدیل نہ کیے گئے ہوں۔"
    - "کوئی یاد دہانی نہیں، اس لیے ادائیگی کا پیچھا کرنا اب بھی آپ پر ہے۔"
useCasesHeading: "جہاں حساب برابر کرنا اہم ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا Side Badger رقم بھیجتا ہے؟"
      a: "نہیں۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر Side Badger میں ادائیگی ریکارڈ کریں تاکہ بیلنس اپ ڈیٹ ہو جائے۔"
    - q: "کیا میں تجویز کردہ ادائیگیاں بند کر سکتا ہوں؟"
      a: "نہیں۔ آسان بنانا آن رہتا ہے، اور **سب دکھائیں** گروپ کی ہر تجویز کردہ ادائیگی کو فہرست کرتا ہے، صرف وہ نہیں جن کا آپ سے تعلق ہے۔"
    - q: "یورو اور پاؤنڈ الگ کیوں رکھے جاتے ہیں؟"
      a: "بیلنس اسی کرنسی میں رہتے ہیں جس میں آپ نے ادا کیا، جب تک آپ خرچہ یا ادائیگی درج کرتے وقت تبدیل نہ کریں۔ مختلف کرنسیوں کے قرض آپس میں کبھی نیٹ نہیں کیے جاتے۔"
    - q: "اگر کوئی اپنے ذمے رقم کا صرف حصہ ادا کرے تو؟"
      a: "جو حصہ ادا ہوا اسے ریکارڈ کریں۔ باقی بیلنس پر رہتا ہے جب تک ادا نہ ہو جائے۔"
    - q: "کیا یہ ہمیشہ ادائیگیوں کی ممکنہ کم ترین تعداد ہوتی ہے؟"
      a: "ضمانت نہیں۔ یہ ہمیشہ اس کرنسی میں بیلنس والے افراد کی تعداد سے کم ادائیگیاں تجویز کرتا ہے، اس لیے چار افراد کے لیے کبھی تین سے زیادہ نہیں۔ ساتھ رہنے والوں کی مثال میں یہ دو ادائیگیاں ہیں، جہاں ہر شخص کو براہ راست ادا کرنے میں چھ لگیں۔"
