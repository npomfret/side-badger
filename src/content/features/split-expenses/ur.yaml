sections:
  - heading: "صرف وہ لوگ جو وہاں تھے"
    body: "خرچہ سب میں بانٹیں، یا صرف ان میں جو اس میں شریک تھے۔ لوگوں کو ان اخراجات سے نکال دیں جن کا وہ حصہ نہیں تھے، اور بیلنس اسے ظاہر کرتے ہیں۔ جو ساتھی پورا ہفتہ غائب رہا وہ ٹیک اوے کا قرض دار نہیں، جسے [ساتھ رہنے والے](page:use-case/housemates) بنیادی انصاف سمجھیں گے۔"
  - heading: "وہ تفصیلات جو بعد کی بحث بچاتی ہیں"
    items:
      - "**تاریخ** اور اختیاری وقت طے کریں۔ آج، کل، آج صبح اور کل رات جیسے شارٹ کٹ کچھ ٹائپنگ بچاتے ہیں۔"
      - "اخراجات کو گروپ کرنے کے لیے تین تک **لیبل** شامل کریں، جیسے گروسری یا سفر۔"
      - "**جگہ** شامل کریں۔ میپ کا لنک پیسٹ کریں تو جگہ کا نام خود بھر جاتا ہے۔"
      - "نمبر کے پیچھے کی کہانی کے لیے **نوٹ** شامل کریں، اور اگر کہانی کو ضرورت ہو تو کچھ فارمیٹنگ بھی۔"
      - "گفتگو کو اس خرچے کے ساتھ رکھنے کے لیے **تبصرے** استعمال کریں جس کے بارے میں وہ ہے، نہ کہ چیٹ کے اس دھاگے میں جسے کوئی پیچھے جا کر نہیں دیکھتا۔"
  - heading: "کاپی کریں، ترمیم کریں، اور دیکھیں کیا بدلا"
    body: "پچھلے مہینے کا کرایہ دوبارہ ٹائپ کرنے کے بجائے کاپی کریں، پھر جو مختلف ہے اسے بدل دیں۔ اگر کوئی نمبر غلط تھا تو خرچے میں ترمیم کریں۔ پچھلا ورژن محفوظ رہتا ہے اور ترمیم گروپ کی سرگرمی میں نظر آتی ہے، اس لیے کوئی خاموشی سے نمبر نہیں بدلتا۔ کون کس چیز میں ترمیم کر سکتا ہے یہ گروپ کی اجازتوں پر منحصر ہے۔"
  - heading: "جب کچھ غلط لگے"
    body: "گروپ اخراجات پر سوالات آن کر سکتا ہے۔ خرچے میں شامل کوئی بھی شخص سوال اٹھا کر وجہ بتا سکتا ہے، اور خرچہ بیلنس سے باہر رہتا ہے جب تک سوال کرنے والا یا کوئی ایڈمن اسے بند نہ کر دے۔ یہ ڈیفالٹ میں بند ہے اور ایڈمن گروپ کے لیے اسے آن کرتا ہے۔ یہ [تقریبات اور جشن](page:use-case/events-and-celebrations) کے لیے موزوں ہے، جہاں وہ ڈپازٹ جو کسی کو یاد نہیں اچانک سب کا معاملہ بن جاتا ہے۔"
limits:
  heading: "حدیں"
  items:
    - "ہر خرچے کے لیے ایک شخص ادا کرتا ہے۔ اگر دو لوگوں نے ادا کیا تو دو اخراجات ریکارڈ کریں۔"
    - "آئٹم کے حساب سے یا حصص کے حساب سے تقسیم نہیں ہے۔ برابر، عین رقم اور فیصد ہی دستیاب ہیں۔"
    - "فیصد کا مجموعہ 100 ہونا چاہیے۔"
    - "ایک خرچہ اپنی کرنسی میں 999,999.99 تک ہو سکتا ہے، اس کرنسی کے معمول کے اعشاریہ مقامات کے ساتھ۔"
    - "اخراجات خود بخود نہیں دہرائے جا سکتے۔ اس کی جگہ پچھلے مہینے کا کاپی کریں۔"
    - "تاریخیں مستقبل میں یا 10 سال سے زیادہ پہلے کی نہیں ہو سکتیں۔"
    - "جس خرچے میں ایسا شخص شامل ہو جو گروپ چھوڑ چکا ہو وہ صرف پڑھنے کے لیے رہ جاتا ہے۔"
useCasesHeading: "اس طرح کی تقسیم کہاں مدد کرتی ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا دو لوگ ایک خرچہ ادا کر سکتے ہیں؟"
      a: "ایک خرچے میں نہیں۔ دو ریکارڈ کریں، ہر ادا کرنے والے کا ایک، اور بیلنس وہی نکلتے ہیں۔"
    - q: "کیا میں رسید کو آئٹم کے حساب سے تقسیم کر سکتا ہوں؟"
      a: "نہیں۔ تقسیم برابر، عین رقم یا فیصد کے مطابق ہوتی ہے۔ مختلف آئٹمز والے بل کے لیے ہر شخص کے ذمے رقم عین رقم کے طور پر درج کریں۔"
    - q: "کیا میں ڈیفالٹ تقسیم طے کر سکتا ہوں؟"
      a: "نہیں۔ کوئی پچھلا خرچہ کاپی کریں تاکہ اس کی تقسیم دوبارہ استعمال ہو، اور جو مختلف ہے اسے بدل دیں۔"
    - q: "کیا بل ہر مہینے دہرائے جا سکتے ہیں؟"
      a: "نہیں۔ اس کی جگہ پچھلے مہینے کا خرچہ کاپی کریں، جس میں چند سیکنڈ لگتے ہیں۔"
    - q: "خرچے میں ترمیم کون کر سکتا ہے؟"
      a: "جسے گروپ کی اجازتیں اجازت دیں۔ ہر ترمیم گروپ کی سرگرمی میں نظر آتی ہے، اس لیے تبدیلیاں کبھی خاموش نہیں ہوتیں۔"
    - q: "اس کے بعد بیلنس کا کیا ہوتا ہے؟"
      a: "اخراجات آنے کے ساتھ وہ اپ ڈیٹ ہوتے ہیں، اور [حساب برابر کرنا](page:feature/settle-up) انہیں ادائیگیوں کی مختصر فہرست میں بدل دیتا ہے۔ اگر خرچہ کسی اور کرنسی میں ہے تو [متعدد کرنسیاں](page:feature/multiple-currencies) دیکھیں۔"
