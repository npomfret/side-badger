meta:
  title: "Side Badger neler yapar, neler yapmaz"
  description: "Bölüşme, hesaplaşma ve birden fazla para birimi; ayrıca gruplar, listeler ve anketler. Bütün donanım ve Side Badger'ın dışarıda bıraktıklarının dürüst bir listesi."
h1: "Side Badger neler yapar"
navLabel: "Özellikler"
lead: "Kutudaki her şey ve kutuda olmayanlar."
intro: "İşte tüm donanım. Tabloyu bilerek dışarıda bıraktık. Side Badger'ın her gün yaptığı üç işle başlayın, sonra listenin kalanına ve yapmadığı şeylerin kısa listesine göz atın."
cta:
  heading: "Grubunuzun ihtiyacını karşılıyor mu?"
  body: "Ücretsiz bir hesap oluşturun ve önce küçük bir grupla deneyin."
cardsHeading: "Üç iş, ayrıntılı"
sections:
  - heading: "Makbuz tarama"
    body: "Makbuzun fotoğrafını çekin, Side Badger toplamı, tarihi ve yeri sizin kontrol etmeniz için doldursun. Makbuz görselleri Google'ın yapay zeka hizmeti tarafından okunur."
  - heading: "Gruplar ve izinler"
    body: "Her ev, gezi veya etkinlik için en fazla 50 kişilik bir grup kurun. İnsanları bağlantı veya QR koduyla davet edin. Daha büyük bir grupta birini her şeyi gören ama hiçbir şeyi değiştirmeyen izleyici yapabilirsiniz."
  - heading: "Listeler ve anketler"
    body: "Ortak alışveriş listesini alışveriş faturalarının yanında tutun. Villa kısa listesini oylamaya sunun, isterseniz anonim olarak."
  - heading: "Geri kalan her şey"
    items:
      - "**Canlı güncellemeler:** bir harcama ekleyin, herkes onu hemen görür."
      - "**Diller:** Side Badger'ı 39 dilde kullanın. Gruptaki herkes kendi dilini seçebilir."
      - "**Ana ekran:** uygulama mağazası gerekmez. Giriş yapın, ardından Side Badger'ı ana ekranınıza ekleyin; bir uygulama gibi açılır. Uygulamadaki Ayarlar nasıl yapılacağını gösterir."
      - "**Bildirimler:** Ayarlar'dan anlık bildirimleri açın; gruplarınızda yeni bir etkinlik olduğunda bildirim alırsınız. iPhone ve iPad'de önce Side Badger'ı ana ekranınıza ekleyin."
      - "**Geri bildirim:** bir hata mı buldunuz? Uygulamanın içinden bize söyleyin ve yanıtımızı orada görün."
  - heading: "Side Badger'ın yapmadıkları"
    items:
      - "**Para taşımaz.** Side Badger paranıza asla dokunmaz. Birbirinize istediğiniz yolla ödeyin. Ödeme istekleri planlanıyor."
      - "**Faturaları tekrarlamaz.** Yinelenen harcama yok. Geçen ayın faturasını iki dokunuşla kopyalayın."
      - "**Kaleme göre bölmez.** Harcama başına bir ödeyen var. Eşit, tam tutarlarla veya yüzdelerle bölüştürün."
      - "**Yerel uygulama sunmaz.** Tarayıcınızda çalışır. Giriş yapın, ardından ana ekranınıza ekleyin."
      - "**Çevrimdışı çalışmaz.** Bağlantı gerekir."
      - "**E-posta veya SMS uyarısı göndermez.** Yeni etkinlikler uygulamada görünür; anlık bildirimleri açarsanız bildirim olarak da gelir."
      - "**Grafik veya bütçe çizmez.** Kimin kime borçlu olduğunun hesabını tutar, bütün numara bu."
      - "**Google veya Apple ile giriş sunmaz.** E-postayla kaydolun. Google ve Apple ile giriş planlanıyor."
      - "**Hesapsız insanları içeri almaz.** Gruptaki herkesin ücretsiz bir hesabı olması gerekir."
faq:
  heading: "Sorular"
  items:
    - q: "Side Badger üzerinden ödeme yapabilir miyim?"
      a: "Hayır. Side Badger hesabı tutar ve paranıza asla dokunmaz. Birbirinize istediğiniz yolla ödeyin, sonra ödemeyi kaydedin."
    - q: "Mobil uygulama var mı?"
      a: "Uygulama mağazasında yok. Side Badger tarayıcınızda çalışır. Telefonunuzda giriş yapın, ardından ana ekranınıza ekleyerek bir uygulama gibi açılmasını sağlayın. Uygulamadaki Ayarlar nasıl yapılacağını gösterir."
    - q: "Kaleme göre bölebilir miyim?"
      a: "Hayır. Her harcamanın bir ödeyeni vardır ve onu eşit, tam tutarlarla veya yüzdelerle bölüştürürsünüz."
    - q: "Çevrimdışı çalışır mı?"
      a: "Hayır, bağlantı gerekir."
    - q: "Gruptaki herkesin hesabı olması gerekir mi?"
      a: "Evet. Gruptaki herkesin ücretsiz bir hesabı olmalı ve kaydolmak için bir e-posta adresi yeterli."
