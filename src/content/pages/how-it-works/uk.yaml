meta:
  title: "Як працює Side Badger | Розподіл витрат групи за п'ять кроків"
  description: "Створіть групу, запросіть людей, додавайте витрати й розрахуйтеся. Подивіться, що відбувається між «хтось заплатив» і «ми квити», на прикладі крок за кроком."
h1: "Як працює Side Badger"
navLabel: "Як це працює"
lead: "Що відбувається між «хтось заплатив» і «ми квити»? П'ять кроків, жодної таблиці й один борсук, який здебільшого для краси. Ось увесь шлях, від першої групи до останнього записаного платежу. Подробиці про будь-який крок шукайте в розділах [розподіл витрат](page:feature/split-expenses) і [розрахунок](page:feature/settle-up)."
cta:
  heading: "Від «я заплачу» до «ми квити»"
  body: "Створіть безкоштовний обліковий запис, заведіть групу й додайте першу витрату. Борсук не засуджуватиме чек."
steps:
  - title: "Створіть групу"
    body: "Заведіть окрему групу для кожного будинку, поїздки чи події, щоб оренда ніколи не потрапила до одного списку з подарунком на весілля. Дайте їй назву, виберіть ім'я, під яким вас бачитимуть люди, і, якщо хочете, обмежте валюти, які вона приймає. Ваша панель потім показує всі групи й ваше становище в кожній на одному екрані."
    shot: S02
    shotAlt: "Діалог створення групи з відкритим розділом обмежень валют"
  - title: "Запросіть своїх людей"
    body: "Поділіться посиланням для приєднання або покажіть QR-код і налаштуйте, як довго воно діє, від 15 хвилин до 5 днів. Кожному, хто приєднується, потрібен безкоштовний обліковий запис і підтверджена електронна адреса, а в групі може бути до 50 людей. Якщо хочете контролювати, хто заходить, увімкніть схвалення, і адміністратор пускатиме кожну людину."
    shot: S03
    shotAlt: "Діалог запрошення на вкладці з посиланням, з QR-кодом і варіантами терміну дії"
  - title: "Додавайте витрати в міру їх виникнення"
    body: "Скажіть, хто заплатив, скільки й за кого. Розділіть порівну, за точними сумами або у відсотках і пропустіть тих, хто не брав участі. Додайте витрату, і всі бачать її одразу разом із тим, що змінилося й хто це змінив."
    shot: S05
    shotAlt: "Форма витрати з відсотковим розподілом оренди за розміром кімнати"
  - title: "Стежте за балансами"
    body: "Side Badger веде поточний баланс для кожної валюти, тож з першого погляду видно, хто кому винен. Замість того щоб залишати всіх розплутувати клубок дрібних боргів, він підказує короткий список платежів, який розраховує групу."
    shot: S10
    shotAlt: "Екран балансів зі спрощеними боргами у двох валютах і ввімкненим пунктом Показати все"
  - title: "Розраховуйтеся поза застосунком, записуйте в ньому"
    body: "Side Badger ніколи не переказує гроші. Платіть одне одному як зручно, а потім запишіть платіж, щоб баланси оновилися, а екран кожного поновився без перезавантаження. «Розраховано» просто означає, що баланси дорівнюють нулю. Ніхто не може покинути групу, поки винен гроші або йому їх винні, тож той, хто прямує до виходу, спершу розраховується."
    shot: S11
    shotAlt: "Форма платежу з кнопками швидкого розрахунку та повідомленням про часткову оплату"
requirements:
  heading: "Що вам потрібно"
  items:
    - "Безкоштовний обліковий запис. Потрібна лише електронна адреса й пароль, а адресу ви підтверджуєте, перш ніж зможете щось додати."
    - "Мати щонайменше 18 років."
    - "Сучасний браузер на телефоні чи комп'ютері та з'єднання. Side Badger не є застосунком із магазину й не працює офлайн."
    - "За бажання місце на головному екрані. Магазин застосунків не потрібен: увійдіть, а потім додайте Side Badger на головний екран чи в док, і він відкриватиметься як застосунок. Налаштування в застосунку покажуть, як це зробити."
example:
  heading: "Троє друзів після вечора в місті"
  currency: GBP
  people:
    - id: ana
      name: Ана
    - id: ben
      name: Бен
    - id: cara
      name: Кара
  expenses:
    - label: "Вечеря"
      payer: ana
      amount: 90
      split:
        method: equal
    - label: "Таксі"
      payer: ben
      amount: 30
      split:
        method: equal
sections:
  - heading: "39 мов і створено для більшої кількості людей"
    body: "Користуйтеся Side Badger 39 мовами, зокрема арабською, перською та урду, які пишуться справа наліво. Кожен у групі може вибрати свою, тож сторінка групи може бути арабською для однієї людини й англійською для наступної. Його створено також із думкою про користувачів клавіатури та програм зчитування з екрана, а кольори учасників мають візерунки, тож розрізняти зелений і червоний не потрібно."
faq:
  heading: "Запитання"
  items:
    - q: "Чи потрібен обліковий запис кожному?"
      a: "Так, безкоштовний. Кожна людина підтверджує свою електронну адресу, перш ніж щось додати."
    - q: "Чи є застосунок?"
      a: "Він працює в браузері. Увійдіть, а потім додайте його на головний екран чи в док, щоб він відкривався як застосунок. Налаштування в застосунку покажуть, як це зробити. Версії з магазину застосунків і офлайн-режиму немає."
    - q: "Чи переказує Side Badger гроші?"
      a: "Ні. Він веде облік і підказує платежі, а ви платите одне одному як зручно. Потім записуєте платіж. Див. [розрахунок](page:feature/settle-up)."
    - q: "Чи може хтось піти, маючи борг?"
      a: "Ні. Ніхто не може покинути групу, поки винен гроші або йому їх винні, тож спершу розраховується."
    - q: "Скільки людей може приєднатися до групи?"
      a: "До 50 людей у групі. Запросіть їх за посиланням чи QR-кодом і ввімкніть схвалення, якщо хочете, щоб адміністратор пускав кожну людину."
    - q: "А поїздки з більш ніж однією валютою?"
      a: "Баланси ведуться окремо для кожної валюти. Див. [кілька валют](page:feature/multiple-currencies)."
