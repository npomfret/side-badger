sections:
  - heading: Lo que Splitwise hace bien
    body: "Si tu grupo necesita una app nativa, uso sin conexión o pagos dentro de la app, Splitwise es la elección sensata, y preferimos que la elijas a que lo descubras más tarde. Sus propias páginas enumeran:"
    items:
      - "**Apps y uso sin conexión.** Apps para iPhone y Android además de la web, y un modo sin conexión."
      - "**Más formas de dividir.** Por partes, por ajustes y por artículos, además de a partes iguales, por importes exactos y por porcentaje."
      - "**Gastos recurrentes.** Haz que el alquiler se repita y olvídate."
      - "**Pagos en la app.** En algunos países también puede mover el dinero, con Splitwise Pay, Venmo, PayPal o Pay by Bank."
  - heading: Gratis aquí, de pago allí
    body: "Splitwise Pro es el plan de pago de Splitwise, y su propia página de Pro vende cuatro cosas que no cuestan nada en Side Badger."
    items:
      - "**Escaneo de recibos.** Splitwise Pro escanea la foto de tu recibo. Side Badger lo hace gratis, sin créditos de escaneo: rellena el total, la fecha y el lugar para que lo revises. El servicio de IA de Google lee las imágenes de los recibos."
      - "**Conversión de monedas.** Splitwise Pro convierte los gastos de un grupo a tu moneda predeterminada cuando tocas Convertir. Side Badger convierte cada gasto al introducirlo, con un tipo de cambio actual o con el que te aplicaron de verdad, y el importe original se queda en el gasto."
      - "**Sin anuncios.** Splitwise presenta una experiencia totalmente libre de anuncios como función de Pro. Side Badger no tiene anuncios."
      - "**Sin límites diarios.** Splitwise Pro vende gastos ilimitados, y su centro de ayuda dice que quienes usan el plan gratuito pueden añadir hasta 4 gastos al día. Side Badger no tiene límites diarios."
  - heading: Lo que Splitwise tiene y Side Badger no
    body: "No son todas las funciones de Splitwise, solo las que suelen decidir. Las propias páginas de Splitwise tienen la lista completa. Aquí es donde Side Badger se queda corto."
    items:
      - "**Apps nativas.** Side Badger funciona en tu navegador. Inicia sesión y luego añádelo a tu pantalla de inicio y se abre como una app."
      - "**Modo sin conexión.** Side Badger necesita conexión."
      - "**Pagos en la app.** Side Badger nunca toca tu dinero. Pagaos como queráis y después registrad el pago."
      - "**Gastos recurrentes.** Side Badger no los tiene. Copia el alquiler del mes pasado en vez de volver a escribirlo."
      - "**Dividir por partes o por artículo.** Side Badger tiene un solo pagador por gasto, dividido a partes iguales, por importes exactos o por porcentaje. Su escaneo de recibos no asigna artículos a personas."
      - "**Gráficos y divisiones predeterminadas.** Splitwise Pro tiene ambos. Side Badger lleva la cuenta de quién debe a quién, y ese es todo el truco."
  - heading: Pasar tu grupo a Side Badger
    body: "No hay importador, así que mudarse significa empezar de cero. Salda cuentas primero en Splitwise, luego crea un grupo en Side Badger e invita a todo el mundo con un enlace o un código QR. Todo el mundo en el grupo necesita una cuenta gratis, y para registrarse solo hace falta una dirección de correo electrónico."
