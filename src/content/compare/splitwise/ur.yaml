meta:
  title: "Side Badger بمقابلہ Splitwise: پورا گروپ، صرف حساب نہیں | Side Badger"
  description: "پورے گروپ کے لیے Splitwise کا مفت متبادل: تبصرے، سوالات، فہرستیں، پول اور مناسب کردار، ساتھ میں رسید اسکین اور کرنسی تبدیلی مفت۔"
h1: "Side Badger بمقابلہ Splitwise: پورا گروپ، صرف حساب نہیں"
navLabel: "Side Badger بمقابلہ Splitwise"
lead: "آپ کے گروپ میں کسی نے شاید کہا ہو گا «بس Splitwise استعمال کر لو»۔ بجا بات ہے: حساب کتاب میں وہ اچھا ہے۔ Side Badger بھی حساب کرتا ہے، پھر گروپ کو وہ جگہ دیتا ہے جہاں سب مل کر بات کر سکیں: تبصرے، سوالات، فہرستیں، پول اور گروپ کے مناسب کردار۔ رسید اسکین اور کرنسی تبدیلی مفت ملتی ہیں۔"
cta:
  heading: "اپنے اگلے مشترکہ بل پر آزمائیں"
  body: "مفت اکاؤنٹ بنائیں، گروپ بنائیں اور ایک اصلی خرچہ شامل کریں۔ اگر یہ آپ کے لیے نہیں تو آپ نے چند منٹ لگائے ہیں، سبسکرپشن نہیں۔"
asOf: 2026-11-22
asOfNote: "ہم نے {date} کو Splitwise کے اپنے صفحات پڑھے تاکہ آپ کو نہ پڑھنے پڑیں، اور یہاں Splitwise کے بارے میں سب کچھ انہی سے آیا ہے۔ جدول کی ہر قطار اپنے ماخذ سے جڑی ہے۔ منصوبے بدلتے رہتے ہیں، اس لیے ہم ہر سہ ماہی دوبارہ دیکھتے ہیں، اور اگر Splitwise کے صفحات اس صفحے سے مختلف کہیں تو انہی پر یقین کریں۔"
