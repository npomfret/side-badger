faq:
  heading: "Mga tanong"
  items:
    - q: "Mas malaki ba ang bayad ng best man o maid of honor?"
      a: "Kapag nagkasundo lang ang grupo. Walang espesyal na papel ang sinuman sa kuwenta ng app. Kung may sumasagot ng mas malaki, piliin ang **Eksaktong halaga** o **Porsyento** sa ilalim ng **Paano hatiin** at ilagay ang mga bahaging napagkasunduan ninyo."
    - q: "Paano ang mga inuming hindi ininom ng iba?"
      a: "Idagdag ang mga inumin bilang sariling gastos at i-tick lang ang mga taong uminom. Kung magkakaiba ang dami ng bawat isa, piliin ang **Eksaktong halaga** at i-type ang bahagi ng bawat tao. Walang magbabayad para sa hindi niya ininom."
    - q: "Puwede bang makita ng bida ang grupo pagkatapos?"
      a: "Oo, kapag tapos na ang surprise. Imbitahan sila, saka puwede silang gawing **Viewer** ng isang admin sa ilalim ng **Seguridad at mga Pahintulot** sa settings ng grupo. Nakikita ng viewer ang lahat pero walang binabago, kaya hintayin munang wala nang sikreto. Kailangan nila ng libreng account para sumali."
