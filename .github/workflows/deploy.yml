name: Build and Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

# No token scope by default; each job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # CI always runs strict; English-first mode (D38) is for local work only.
      I18N_MODE: strict

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  # The Playwright suite (e2e/), split across shards. Each shard builds the preview site itself
  # (playwright.config.ts webServer). A deploy needs every shard to pass.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      I18N_MODE: strict
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/playwright
          retention-days: 7

  build-and-push:
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        domain: [sidebadger.me]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract domain suffix
        id: domain
        run: |
          SUFFIX=$(echo "${{ matrix.domain }}" | sed 's/sidebadger\.//')
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=-${{ steps.domain.outputs.suffix }}
            type=raw,value=latest-${{ steps.domain.outputs.suffix }}

      # Build into the local engine, smoke-test that image, then push it (plan 2.9). The smoke
      # test lives here rather than in verify so it runs only before a deploy.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_DOMAIN=${{ matrix.domain }}

      - name: Nginx smoke test
        run: scripts/check-nginx.sh --image "$IMAGE" --port 18200
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

      # Same inputs as the build above, so every layer comes from its cache
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_DOMAIN=${{ matrix.domain }}

  deploy:
    needs: [verify, e2e, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: sidebadger.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/side-badger-website/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: sidebadger.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/side-badger-website
            mv docker-compose.prod.yml docker-compose.yml
            docker pull ghcr.io/${{ github.repository }}:latest-me
            docker compose up -d --remove-orphans
