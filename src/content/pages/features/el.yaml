meta:
  title: "Τι κάνει και τι δεν κάνει το Side Badger"
  description: "Διαχωρισμός, εκκαθάριση και πολλά νομίσματα, συν ομάδες, λίστες και δημοσκοπήσεις. Ολόκληρο το σετ και μια ειλικρινής λίστα με όσα το Side Badger αφήνει έξω."
h1: "Τι κάνει το Side Badger"
navLabel: "Λειτουργίες"
lead: "Όλα όσα έχει το κουτί, και όσα δεν έχει."
intro: "Ορίστε ολόκληρο το σετ. Το φύλλο εργασίας το αφήσαμε έξω επίτηδες. Ξεκινήστε με τις τρεις δουλειές που κάνει καθημερινά το Side Badger και μετά δείτε την υπόλοιπη λίστα και τη σύντομη λίστα με όσα δεν κάνει."
cta:
  heading: "Κάνει ό,τι χρειάζεται η ομάδα σας;"
  body: "Δημιουργήστε δωρεάν λογαριασμό και δοκιμάστε το πρώτα με μια μικρή ομάδα."
  button: "Δημιουργία δωρεάν λογαριασμού"
cardsHeading: "Οι τρεις δουλειές, αναλυτικά"
sections:
  - heading: "Σάρωση αποδείξεων"
    body: "Φωτογραφίστε την απόδειξη και το Side Badger συμπληρώνει το σύνολο, την ημερομηνία και τον τόπο για να τα ελέγξετε. Οι εικόνες αποδείξεων διαβάζονται από την υπηρεσία AI της Google."
  - heading: "Ομάδες και δικαιώματα"
    body: "Φτιάξτε μια ομάδα για κάθε σπίτι, ταξίδι ή εκδήλωση, με έως 50 άτομα. Προσκαλέστε άτομα με σύνδεσμο ή κωδικό QR. Σε μια μεγαλύτερη ομάδα, κάντε κάποιον θεατή, που βλέπει τα πάντα και δεν αλλάζει τίποτα."
  - heading: "Λίστες και δημοσκοπήσεις"
    body: "Κρατήστε την κοινή λίστα ψωνιών δίπλα στους λογαριασμούς των ψωνιών. Βάλτε σε ψηφοφορία τη σύντομη λίστα βιλών, ανώνυμα αν θέλετε."
  - heading: "Όλα τα υπόλοιπα"
    items:
      - "**Ενημερώσεις σε πραγματικό χρόνο:** προσθέστε ένα έξοδο και όλοι το βλέπουν αμέσως."
      - "**Γλώσσες:** χρησιμοποιήστε το Side Badger σε 39 γλώσσες. Ο καθένας στην ομάδα μπορεί να διαλέξει τη δική του."
      - "**Αρχική οθόνη:** δεν χρειάζεται κατάστημα εφαρμογών. Συνδεθείτε και μετά προσθέστε το Side Badger στην αρχική οθόνη και ανοίγει σαν εφαρμογή. Οι Ρυθμίσεις στην εφαρμογή σάς δείχνουν πώς."
      - "**Σχόλια:** βρήκατε σφάλμα; Πείτε μας το μέσα από την εφαρμογή και δείτε εκεί την απάντησή μας."
  - heading: "Τι δεν κάνει το Side Badger"
    items:
      - "**Δεν μετακινεί χρήματα.** Το Side Badger δεν αγγίζει ποτέ τα χρήματά σας. Πληρώστε ο ένας τον άλλον όπως θέλετε. Τα αιτήματα πληρωμής είναι στα σχέδια."
      - "**Δεν επαναλαμβάνει λογαριασμούς.** Δεν υπάρχουν επαναλαμβανόμενα έξοδα. Αντιγράψτε τον λογαριασμό του προηγούμενου μήνα με δύο αγγίγματα."
      - "**Δεν χωρίζει ανά είδος.** Ένας πληρωτής ανά έξοδο. Χωρίστε εξίσου, ακριβώς ή με ποσοστά."
      - "**Δεν έχει εγγενή εφαρμογή.** Λειτουργεί στο πρόγραμμα περιήγησης. Συνδεθείτε και μετά προσθέστε το στην αρχική οθόνη."
      - "**Δεν λειτουργεί χωρίς σύνδεση.** Χρειάζεται σύνδεση."
      - "**Δεν στέλνει ειδοποιήσεις με email ή SMS.** Οι ειδοποιήσεις εμφανίζονται στην εφαρμογή. Οι ειδοποιήσεις push είναι στα σχέδια."
      - "**Δεν σχεδιάζει γραφήματα ή προϋπολογισμούς.** Κρατά τον λογαριασμό ποιος χρωστά σε ποιον, και αυτό είναι όλο το κόλπο."
      - "**Δεν κάνει σύνδεση με Google ή Apple.** Εγγραφείτε με email. Η σύνδεση με Google και Apple είναι στα σχέδια."
      - "**Δεν αφήνει άτομα χωρίς λογαριασμό.** Ο καθένας στην ομάδα χρειάζεται δωρεάν λογαριασμό."
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορώ να πληρώσω μέσω του Side Badger;"
      a: "Όχι. Το Side Badger κρατά τον λογαριασμό και δεν αγγίζει ποτέ τα χρήματά σας. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή."
    - q: "Υπάρχει εφαρμογή για κινητό;"
      a: "Όχι σε κατάστημα εφαρμογών. Το Side Badger τρέχει στο πρόγραμμα περιήγησης. Συνδεθείτε στο τηλέφωνό σας και μετά προσθέστε το στην αρχική οθόνη ώστε να ανοίγει σαν εφαρμογή. Οι Ρυθμίσεις στην εφαρμογή σάς δείχνουν πώς."
    - q: "Μπορώ να χωρίσω ανά είδος;"
      a: "Όχι. Κάθε έξοδο έχει έναν πληρωτή και το χωρίζετε εξίσου, ακριβώς ή με ποσοστά."
    - q: "Λειτουργεί χωρίς σύνδεση;"
      a: "Όχι, χρειάζεται σύνδεση."
    - q: "Χρειάζεται λογαριασμό ο καθένας στην ομάδα;"
      a: "Ναι. Ο καθένας στην ομάδα χρειάζεται δωρεάν λογαριασμό και για την εγγραφή αρκεί μια διεύθυνση email."
