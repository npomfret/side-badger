faq:
  heading: "Întrebări"
  items:
    - q: "Ce facem dacă strângem mai mult decât costă cadoul?"
      a: "Sumele exacte trebuie să dea împreună prețul, așa că tăiați din părți până se potrivesc. Sau puneți surplusul pe ceva real, de exemplu flori, și introduceți asta ca a doua cheltuială, ca felicitarea și hârtia de împachetat din exemplu."
    - q: "Poate cineva să contribuie fără să intre în grup?"
      a: "Nu, dacă vrei să intre în socoteală. Toți cei din împărțire au nevoie de un cont gratuit și de un loc în grup. Pentru cineva care are doar numerar, Priya l-ar putea lua și ar introduce cadoul doar pentru ce mai datorează grupul. De exemplu, dacă Sam i-ar da 40 £ în numerar, ea ar introduce 200 £ și i-ar împărți 60, 60 și 80 între ea, Omar și Lena."
    - q: "Poate sondajul să hotărască cât pune fiecare?"
      a: "Nu. Un sondaj stabilește o cifră pentru tot grupul, de exemplu bugetul. Partea fiecăruia o hotărâți între voi, apoi o scrieți în cheltuială la **Sume exacte**."
