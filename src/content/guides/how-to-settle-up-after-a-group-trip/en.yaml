faq:
  heading: Questions
  items:
    - q: Who should record a payment, the person paying or the person paid?
      a: Recording a payment needs permission to edit expenses, and the form asks **Who paid?** and **Who received the payment?** Only the person who recorded it can edit it later, so it is usually simplest if the payer does it, using the quick-settle button.
    - q: What if the trip ran in two currencies?
      a: Balances are kept per currency, so a euro debt stays a euro debt and each currency gets its own short list, unless expenses were converted when they were entered. [Several currencies](page:guide/how-to-split-a-trip-paid-in-several-currencies) shows both ways.
    - q: Should we settle during the trip or at the end?
      a: Either works. Every recorded payment changes the balances, so a payment made mid-trip counts towards the final list. At the end is simpler, because [the whole trip](page:use-case/group-trips) is in one place.
