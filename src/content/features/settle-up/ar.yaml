meta:
  title: "سوِّ الحسابات بعدد أقل من الدفعات | Side Badger"
  description: "اعرف من يدين لمن في مجموعتك، واحصل على قائمة قصيرة من الدفعات تسوّي حساب الجميع، وسجّل كل دفعة حين تتم. مجاني الاستخدام."
h1: "سوِّ الحسابات بعدد أقل من الدفعات"
navLabel: "تسوية الحسابات"
lead: "يحتفظ Side Badger برصيد جارٍ لكل فرد في المجموعة ويقترح قائمة قصيرة من الدفعات تسوّيه. تدفعون لبعضكم بالطريقة التي تناسبكم، ثم تسجّلون ذلك. وإن أردت أن ترى أولاً كيف تُقسَّم الأرقام، فابدأ بـ[تقسيم المصروفات](page:feature/split-expenses)."
cta:
  heading: "مستعد لفكّ تشابك من يدين لمن؟"
  body: "أنشئ حساباً، وابدأ مجموعة، وأضف أول مصروف. وستتولى الأرصدة الباقي."
  button: "أنشئ حساباً مجانياً"
problem:
  heading: "أرصدة تتحدّث أولاً بأول"
  body: "كل مصروف يغيّر من يدين لمن، لذا يُبقي Side Badger الأرصدة محدَّثة مع إضافة المصروفات والدفعات. يرى كل من في المجموعة أي تغيير على الفور، ويرى ما تغيّر ومن غيّره. وتُحفظ الأرصدة لكل عملة، فيبقى اليورو والجنيه الإسترليني في عمودين منفصلين ما لم يُحوَّل مصروف عند إدخاله. وافتراضياً ترى الديون التي تخصك؛ أما **إظهار الكل** فيعرض المجموعة كلها."
workflow:
  heading: "ثلاث خطوات إلى التعادل"
  steps:
    - title: "اعرف من يدين لمن"
      body: "افتح أرصدة المجموعة لترى ما عليك وما لك وقائمة قصيرة من الدفعات تسوّي حساب الجميع، محسوبة لكل عملة. وتبقى المصروفات المطروحة للسؤال خارج الحسابات إلى أن تُحسم. وفي مثال زملاء السكن أدناه تصبح ست دفعات اثنتين."
      shot: S10
      shotAlt: "شاشة الأرصدة تعرض ديوناً مبسّطة بعملتين، مع تفعيل «إظهار الكل»"
    - title: "ادفعوا كما تشاؤون، ثم سجّلوا"
      body: "تحويل مصرفي، أو نقداً، أو معروف مستحق من العطلة الماضية. لا ينقل Side Badger المال. وبعد أن يتغير حامله، سجّل الدفعة فيتحدّث الرصيد للجميع."
      shot: S11
      shotAlt: "نموذج الدفعة مع أزرار التسوية السريعة والإشعار الذي يظهر للدفعة الجزئية"
    - title: "تأكد من وصولها"
      body: "تدخل الدفعة في سجل المجموعة، حيث يراها كل من في المجموعة ويمكنه التفاعل معها برمز تعبيري. احتفل بالدفعة حين تصل."
      shot: S12
      shotAlt: "سجل الدفعات مع تفاعلات برموز تعبيرية على إحدى الدفعات"
