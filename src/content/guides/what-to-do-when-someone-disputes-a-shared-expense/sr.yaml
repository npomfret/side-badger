meta:
  title: "Шта радити кад неко оспори заједнички трошак | Side Badger"
  description: "Без јетких порука. Доведи трошак у питање и он напушта сва стања док разговарате. Израчунато на примеру вина за журку од 45 £."
h1: "Шта радити кад неко оспори заједнички трошак"
navLabel: "Оспорени трошкови"
lead: "Постави питање уз трошак уместо да шаљеш јетку поруку. Док је питање отворено, цео трошак остаје ван стања свих. Разговарајте у коментарима, измени поделу ако се група сложи, а питање затвара особа која га је поставила или администратор."
cta:
  heading: "Постави непријатно питање пристојно"
  body: "Направи бесплатан налог, оснуј групу за стан и замоли администратора да укључи питања о трошковима, која су искључена док их неко не укључи. Желиш прво кратак обилазак? Погледај [како функционише](page:how-it-works) или [шта покрива бесплатан налог](page:pricing)."
sections:
  - heading: "Троје цимера и вино од 45 £"
    body: "После журке, Том додаје вино у групу стана. Кошта 45 £, платио га је Том, подељено је једнако између Тома, Прије и Аише, што је 15 £ по особи. Аиша не пије. Том је вино купио за журку, а журка је била за [стан](page:use-case/housemates), па ништа није погрешио. Ни Аиша не греши што пита. Овде нико није зликовац. Постоји само 15 £ вина у спору и много начина да се то закомпликује. Јетка порука целој кући је један. Питање уз трошак је благи."
  - heading: "Шта питање ради"
    body: "Аиша отвара трошак и поставља питање. Цео трошак испада из стања свих, не само њен део, а ништа друго није погођено. Велика куповина (84 £) и чистачица (60 £) и даље се рачунају, а то је 28 £ + 20 £ = 48 £ по особи. Дакле, док је вино на чекању, Аиша дугује 48 £, Том потражује 36 £, а Прија потражује 12 £. Шта год стан одлучи о вину, ничије стање га у међувремену не садржи. Сваки други у трошку може такође да постави своје питање. Вино се враћа у стања тек кад се затвори последње отворено питање о њему, а питање затвара особа која га је поставила или администратор."
  - heading: "Разговор, па исправка"
    body: "Аишино питање стиже у коментаре трошка, па одговори стоје одмах испод њега. [Планирајте заједно](page:feature/plan-together) има више о коментарима и питањима. Том и Прија то читају и стан разговара. Одлучују да је вино било Томово и Пријино, јер су га они пили. Неки други стан би можда задржао поделу на троје или се договорио за нешто између, и то би такође било у реду. Side Badger чува оно око чега се договорите и нема мишљење о вину. Том мења трошак тако да се дели једнако између њега и Прије, што је 22,50 £ по особи (45 £ ÷ 2). Аиша више није у њему, па њено питање одлази са старом верзијом и вино се враћа у стања. Претходна верзија се чува."
  - heading: "Читање резултата"
    body: "Кад се вино врати, Том потражује 58,50 £, Прија дугује 10,50 £, а Аиша дугује 48 £. Side Badger предлаже две уплате, обе Тому. Аишиних 48 £ је износ који је имала док је вино било на чекању, јер није у њему. Прија је од тога да потражује 12 £ прешла на то да дугује 10,50 £, а то је њена половина вина од 22,50 £. Да је подела на троје остала, Аиша би дуговала 63 £ (28 £ + 20 £ + 15 £). Цела свађа вредела је 15 £. Платите једни другима како год желите, па забележите сваку уплату под **Поравнај**. [Поравнање](page:feature/settle-up) покрива остало."
  - heading: "Како то срочити да људи наставе да причају с тобом"
    body: "Аишино питање: „Нисам пила ништа од тог вина. Можемо ли да погледамо поделу?“ Кратко је, именује трошак и пита уместо да оптужује. Неколико навика помаже."
    items:
      - >-
        **Питај за трошак, не за особу.** „Можемо ли да проверимо поделу за вино?“ започиње разговор. „Зашто су ми наплатили твоје вино?“ започиње другу врсту.
      - >-
        **Реци шта би волео да се деси.** „Може ли само за оне који су га пили?“ даје групи нешто са чим може да се сложи или да одговори.
      - >-
        **Наведи разлог у реченици или две.** Поље је **Ваше питање** и не може да остане празно.
      - >-
        **Држи одговоре на једном месту.** Одговори иду у коментаре трошка, поред бројева на које се односе.
  - heading: "Подеси то у Side Badger"
    items:
      - >-
        **Укључи питања.** Подразумевано су искључена. Администратор отвара **Подешавања** групе, укључује **Дозволи питања о трошковима** под **Функције** на картици **Опште** и бира **Сачувај**. Искључивање касније брише свако отворено питање.
      - >-
        **Постави једно.** Отвори трошак и поред свог имена у подели изабери **Имам питање**. Упиши разлог у **Ваше питање** и поново изабери **Имам питање**. Ово могу само људи у трошку. Трошак сада приказује ознаку **Доведено у питање**.
      - >-
        **Нађи шта је на чекању.** На списку трошкова, **Само доведено у питање** приказује трошкове са отвореним питањем.
      - >-
        **Исправи, ако се група слаже.** Отвори трошак, изабери **Уреди**, промени **Подели између** и изабери **Ажурирај трошак**. Ко може да уређује зависи од дозвола групе.
      - >-
        **Затвори, ако нема шта да се исправља.** Особа која је питала може да користи дугме за затварање на својој ознаци **Доведено у питање**, названо **Затвори питање**, као и администратор. Трошак се враћа у стања кад се затвори његово последње питање.
  - heading: "Кад није тако уредно"
    items:
      - >-
        **Измена оставља питаоца у трошку.** Ако је особа која је питала још у трошку, њено питање прелази на измењену верзију и чека да га она, или администратор, затвори. Исправка износа није исто што и сагласност да је исправљено.
      - >-
        **Ниси био у трошку.** Само људи у трошку могу да га доведу у питање. Ако ти нешто делује чудно, напиши то у коментарима или питај ко га је додао.
      - >-
        **Неко жели да напусти групу.** Отворено питање спречава људе из тог трошка да оду. Затвори питање, или измени трошак тако да више нису у њему, и могу да оду.
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Не одлучује ко је у праву. Држи трошак ван стања и чува оно што се договорите."
      - "Не тражи од никога да одобри трошкове пре него што се рачунају. Само трошак доведен у питање је на чекању."
      - "Не може да задржи део трошка. Доведи га у питање и цео напушта стања."
      - "Не премешта новац. Платите једни другима како год желите и то забележите."
