sections:
  - heading: "Amiben a Splitwise jó"
    body: "Ha a csoportodnak natív alkalmazás, offline használat vagy alkalmazáson belüli fizetés kell, a Splitwise az észszerű választás, és inkább azt szeretnénk, ha azt választanád, mintsem hogy később jönnél rá. A saját oldalai ezeket sorolják fel:"
    items:
      - "**Alkalmazások és offline használat.** iPhone-os és Android-alkalmazások a web mellett, és egy offline mód."
      - "**Több felosztási mód.** Részek, kiigazítások és tételes felosztások, az egyenlő, a pontos és a százalékos mellett."
      - "**Ismétlődő költségek.** Állítsd be, hogy a lakbér ismétlődjön, és felejtsd el."
      - "**Fizetés az alkalmazásban.** Bizonyos országokban a pénzt is el tudja mozgatni, a Splitwise Pay, a Venmo, a PayPal vagy a Pay by Bank révén."
  - heading: "Itt ingyenes, ott fizetős"
    body: "A Splitwise Pro a Splitwise fizetős csomagja, és saját Pro-oldala négy olyan dolgot árul, amely a Side Badgerben nem kerül semmibe."
    items:
      - "**Nyugtaszkennelés.** A Splitwise Pro beolvassa a nyugtád fotóját. A Side Badger ingyen csinálja, szkennelési kreditek nélkül: kitölti az összeget, a dátumot és a helyet, hogy ellenőrizhesd. A nyugták képeit a Google AI-szolgáltatása olvassa."
      - "**Pénznemátváltás.** A Splitwise Pro a csoport költségeit az alapértelmezett pénznemedre váltja át, amikor a „Convert” gombra koppintasz. A Side Badger minden költséget bevitelkor vált át, egy aktuális árfolyamon vagy azon, amelyet ténylegesen kaptál, és az eredeti összeg a költségnél marad."
      - "**Hirdetések nélkül.** A Splitwise a teljesen hirdetésmentes élményt Pro-funkcióként sorolja fel. A Side Badgerben nincsenek hirdetések."
      - "**Napi korlátok nélkül.** A Splitwise Pro korlátlan számú költséget árul, súgóközpontja szerint pedig az ingyenes felhasználók naponta legfeljebb 4 költséget adhatnak hozzá. A Side Badgerben nincsenek napi korlátok."
  - heading: "Ami a Splitwise-nak megvan, a Side Badgernek nincs"
    body: "Ez nem a Splitwise minden funkciója, csak azok, amelyek általában döntenek. A teljes listát a Splitwise saját oldalain találod. Itt van, miben marad el a Side Badger."
    items:
      - "**Natív alkalmazások.** A Side Badger a böngésződben működik. Jelentkezz be, aztán add hozzá a kezdőképernyődhöz, és úgy nyílik meg, mint egy alkalmazás."
      - "**Offline mód.** A Side Badgernek kapcsolat kell."
      - "**Fizetés az alkalmazásban.** A Side Badger sosem nyúl a pénzedhez. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést."
      - "**Ismétlődő költségek.** A Side Badgerben nincsenek. A múlt havi lakbért másold le ahelyett, hogy újra begépelnéd."
      - "**Felosztás részek vagy tételek szerint.** A Side Badgerben költségenként egy fizető van, és egyenlően, pontos összegek szerint vagy százalékosan osztható fel. A nyugtaszkennelése nem rendel tételeket emberekhez."
      - "**Grafikonok és alapértelmezett felosztások.** A Splitwise Prónak mindkettő megvan. A Side Badger a számolást vezeti, hogy ki kinek tartozik, és ez az egész trükk."
  - heading: "A csoportod átköltöztetése"
    body: "Importáló nincs, így az átköltözés újrakezdést jelent. Előbb számoljatok el a Splitwise-ban, aztán hozzatok létre egy csoportot a Side Badgerben, és hívjatok meg mindenkit linkkel vagy QR-kóddal. A csoport minden tagjának kell egy ingyenes fiók, a regisztrációhoz pedig elég egy e-mail-cím."
