meta:
  title: "تقسیم ویلا وقتی شب‌های اقامت فرق دارد | Side Badger"
  description: "دِو فقط سه شب آمد، پس چرا شش شب بپردازد؟ ویلای تعطیلات را بر اساس شب‌هایی که هر کس واقعاً ماند تقسیم کنید، با حساب‌وکتابِ آماده."
h1: "تقسیم ویلای تعطیلات وقتی افراد شب‌های متفاوتی می‌مانند"
navLabel: "تقسیم ویلا بر اساس شب"
lead: "قیمت اقامت را برای هر نفر در هر شب حساب کنید، در تعداد شب‌های هر نفر ضرب کنید و ویلا را به‌صورت **یک هزینه با مبالغ دقیق** وارد کنید. Side Badger حساب را نگه می‌دارد و وقتی وقت تسویه است فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد."
cta:
  heading: "به ویلا یک هزینه مرتب بدهید"
  body: "یک گروه بسازید، همه را با لینک یا کد QR دعوت کنید و ویلا را با مبالغ دقیق وارد کنید. تا شما سرگرم تعطیلات هستید، Side Badger حساب جاری را نگه می‌دارد."
sections:
  - heading: "شش شب، چهار نفر، یک کارت اعتباری"
    body: "یک [سفر گروهی](page:use-case/group-trips) معمولاً با کارت یک نفر شروع می‌شود. این بار کارت آنا است. او برای شش شب یک ویلا رزرو می‌کند، €2,100، چون کسی باید اول برود. آنا، بن و کلویی هر شش شب می‌مانند. دِو فقط برای سه شب آخر می‌تواند بیاید و با قطار می‌آید. بن ماشین کرایه می‌کند که دِو هیچ‌وقت سوارش نمی‌شود. دِو خرید بزرگ خواربار را انجام می‌دهد. بدیهی‌ترین کار تقسیم ویلا بین چهار نفر است. اما این یعنی دِو پول سه شبی را بدهد که در خانه بوده، و این جور چیزها سر میز کریسمس دوباره سر بلند می‌کنند. تقسیم بر اساس شب جلوی دعوا را می‌گیرد و حسابش یک دقیقه طول می‌کشد."
  - heading: "قیمت یک نفر-شب را حساب کنید"
    body: "«نفر-شب» یعنی یک نفر که یک شب می‌ماند. ویلا هر چقدر قیمت دارد همان‌قدر است، پس قیمت را بین همه نفر-شب‌ها سرشکن کنید و بعد به هر کس همان‌هایی را بدهید که استفاده کرده."
    items:
      - "**نفر-شب‌ها را بشمارید.** آنا، بن و کلویی هرکدام شش شب می‌مانند و دِو سه شب: 6 + 6 + 6 + 3 = 21."
      - "**قیمت یکی را حساب کنید.** €2,100 ÷ 21 = €100 برای هر نفر-شب."
      - "**در شب‌های هر نفر ضرب کنید.** آنا، بن و کلویی هرکدام 6 × €100 = €600 می‌دهند. دِو 3 × €100 = €300 می‌دهد."
      - "**جمع را وارسی کنید.** €600 + €600 + €600 + €300 = €2,100. اگر جمع سهم‌ها با قیمت برابر نمی‌شود، یک شب جا افتاده یا دو بار شمرده شده است."
  - heading: "در Side Badger واردش کنید"
    body: "یک گروه بسازید، سه نفر دیگر را با لینک یا کد QR دعوت کنید و بعد هزینه‌ها را اضافه کنید. اول ویلا."
    items:
      - "**افزودن هزینه** را انتخاب کنید. توضیحش را بنویسید، 2,100 را وارد کنید و **چه کسی پرداخت کرد؟** را روی آنا بگذارید."
      - "زیر **تقسیم بین** مطمئن شوید هر چهار نفر هستند."
      - "زیر **نحوه تقسیم** گزینه **مبالغ دقیق** را انتخاب کنید. برای آنا، بن و کلویی 600 و برای دِو 300 بنویسید. مبالغ باید جمعشان برابر کل شود."
      - "**ذخیره هزینه** را انتخاب کنید."
      - "کرایه ماشین را همین‌طور اضافه کنید. بن پرداخته، تقسیم **به طور مساوی** است و دِو کنار گذاشته می‌شود، چون با قطار آمده. [تقسیم هزینه‌ها](page:feature/split-expenses) روش‌های دیگر تقسیم یک هزینه را توضیح می‌دهد."
      - "خواربار را اضافه کنید. دِو پرداخته، تقسیم **به طور مساوی** است و هر چهار نفر هستند."
  - heading: "نتیجه را بخوانید، بعد تسویه کنید"
    body: "صورت‌حساب هر نفر سهم او از ویلا است به‌علاوه سهمش از ماشین و خرید. آنا، بن و کلویی هرکدام €725 می‌شوند که €600 + €80 + €45 است. دِو €345 می‌شود که €300 + €45 است. آنچه هر نفر پرداخته را کم کنید تا مانده‌ها دربیایند. آنا €2,100 پرداخته، پس €1,375 طلبکار است. بن €240 پرداخته و €485 بدهکار است. دِو €180 پرداخته و €165 بدهکار است. کلویی چیزی نپرداخته و €725 بدهکار است. اگر به حال خودشان رها شوند، این بدهی‌ها به شش مسیر در گروه می‌چرخند. Side Badger به‌جایش سه پرداخت پیشنهاد می‌دهد، همه به آنا. هر طور دوست دارید به او پرداخت کنید، بعد **تسویه حساب** را انتخاب کنید و برای هر پرداخت از **ثبت تسویه حساب** استفاده کنید تا مانده‌ها به‌روز شوند. دکمه‌های تسویه سریع مبلغ را پر می‌کنند. درباره [تسویه حساب](page:feature/settle-up) بیشتر بخوانید."
  - heading: "وقتی ویلا یک قیمت مرتب نیست"
    items:
      - "**اتاق‌ها فرق دارند.** اگر سوئیت بیشتر از اتاق کوچک می‌ارزد، اول توافق کنید هر اتاق چقدر می‌ارزد، بعد حساب نفر-شب را اتاق‌به‌اتاق انجام دهید. ویلا را یا به‌صورت یک هزینه با جمع هر نفر وارد کنید یا به‌ازای هر اتاق یک هزینه. در هر صورت مبالغ دقیق یک هزینه باید جمعشان برابر کل آن باشد."
      - "**بیعانه‌ای که ماه‌ها پیش پرداخت شده.** هر کس آن را پرداخته یک هزینه جدا برای خودش دارد، با تاریخ روزی که پرداخت کرده. آن را بر اساس شب‌ها و با همان نسبت‌های مبلغ باقی‌مانده تقسیم کنید."
      - "**رزرو به ارز دیگری است.** ویلا را با ارزی که پرداخت کرده‌اید وارد کنید. اگر گروه هنگام ثبت تبدیل می‌کند، از یک نرخ تبدیل روز استفاده کنید، یا نرخی را که واقعاً گرفته‌اید بنویسید. مبلغ اصلی روی هزینه می‌ماند. جزئیات در [چند ارز](page:feature/multiple-currencies) است."
      - "**شب‌های ناقص.** یکی نیمه‌شب می‌رسد، یکی پیش از صبحانه می‌رود. روی یک قاعده برای شمردن شب‌ها توافق کنید و برای همه همان را به کار ببرید."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "شب‌ها را برای شما نمی‌شمارد. تقسیم بر اساس شب یا بر اساس سهم وجود ندارد، پس هر مبلغ را همان‌طور که بالا آمد حساب می‌کنید و **مبالغ دقیق** وارد می‌کنید."
      - "پول جابه‌جا نمی‌کند. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را ثبت کنید."
      - "برای هر هزینه یک پرداخت‌کننده می‌پذیرد. اگر دو نفر برای ویلا پرداخته‌اند، دو هزینه ثبت کنید."
      - "دسترسی مهمان ندارد. همه اعضای گروه، دِو هم، یک حساب رایگان لازم دارند."
