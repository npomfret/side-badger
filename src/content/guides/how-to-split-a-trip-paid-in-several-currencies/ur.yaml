faq:
  heading: "سوالات"
  items:
    - q: "Side Badger کون سا ایکسچینج ریٹ استعمال کرتا ہے؟"
      a: "موجودہ ایکسچینج ریٹ، جو خرچہ درج کرتے وقت لایا جاتا ہے جہاں دستیاب ہو۔ آپ اسے اس ریٹ پر بدل سکتے ہیں جو آپ کو واقعی ملا۔"
    - q: "کیا گروپ صرف پاؤنڈ اور ین پر قائم رہ سکتا ہے؟"
      a: "جی ہاں۔ گروپ کی **ترتیبات** میں **کرنسی کی ترتیبات** کے نیچے **اس گروپ کے لیے کرنسیاں محدود کریں** آن کریں، **مجاز کرنسیاں** چنیں اور **نئے اخراجات کے لیے پہلے سے طے شدہ کرنسی** مقرر کریں۔ فہرست میں اختیارات کم ہوں گے تو کاؤنٹر پر غلط انتخاب بھی کم ہوں گے۔"
    - q: "کیا تبدیل کرنا ضروری ہے؟"
      a: "نہیں۔ کرنسیاں الگ رہتی ہیں جب تک آپ یا آپ کا گروپ تبدیل کرنے کا فیصلہ نہ کرے، اور ہر کرنسی کو ادائیگیوں کی اپنی مختصر فہرست ملتی ہے۔"
