sections:
  - heading: "Zabilježi uplatu"
    body: "Kad netko plati, zabilježi to uz pravu osobu. Gumbi za brzo poravnanje ispunjavaju iznos iz tvojih predloženih uplata, a možeš dodati bilješku, primjerice „bankovni prijenos“ (do 500 znakova). Ako platiš samo dio onoga što duguješ, ostatak ostaje na stanju. Ako uneseš premalo ili previše, Side Badger te upozori prije spremanja. Bilježenje uplate zahtijeva dopuštenje za uređivanje troškova, a datum ne smije biti u budućnosti."
  - heading: "Plaćeno u drugoj valuti?"
    body: "Stanja ostaju u valuti u kojoj je plaćeno, pa dug u eurima ostaje dug u eurima. Duguješ eure, a plaćaš u funtama? Pretvori uplatu pri unosu, po aktualnom tečaju ili po tečaju koji je vrijedio pri zamjeni. Tečaj se utvrđuje kad se uplata spremi. [Više valuta](page:feature/multiple-currencies) objašnjava kako radi pretvorba, a [grupna putovanja](page:use-case/group-trips) pokazuju je u uporabi."
  - heading: "Povijest koju možeš provjeriti"
    body: "Svaka zabilježena uplata ostaje u povijesti grupe s datumom, iznosom i bilješkom. Uplatu može urediti samo osoba koja ju je zabilježila, a izbrisati je može ona ili administrator grupe. Uplata u kojoj sudjeluje netko tko je napustio grupu je zaključana. Za primjer s cimerima vidi [cimere](page:use-case/housemates)."
limits:
  heading: "Što Side Badger ne radi"
  items:
    - "Side Badger ne premješta novac, ne šalje poveznice za plaćanje ni zahtjeve za uplatu. Uplata u aplikaciji je zapis uplate izvršene negdje drugdje."
    - "Predložene uplate dolaze iz jednostavne metode uparivanja, primijenjene zasebno za svaku valutu. Uvijek predlaže manje uplata nego što ima osoba sa stanjem u toj valuti (za četiri osobe najviše tri), ali ne nalazi uvijek najmanji mogući broj."
    - "Prijedloge ne možeš isključiti. **Prikaži sve** ispisuje svaku predloženu uplatu u grupi, ne samo tvoje."
    - "Valute se nikad ne prebijaju jedna s drugom, osim ako su troškovi pretvoreni pri unosu."
    - "Nema podsjetnika, pa je potjerivanje uplate i dalje na tebi."
useCasesHeading: "Gdje je poravnanje važno"
faq:
  heading: "Pitanja"
  items:
    - q: "Šalje li Side Badger novac?"
      a: "Ne. Platite si kako god želite, a zatim zabilježi uplatu u Side Badgeru da se stanje ažurira."
    - q: "Mogu li isključiti predložene uplate?"
      a: "Ne. Pojednostavljenje ostaje uključeno, a **Prikaži sve** ispisuje svaku predloženu uplatu u grupi, ne samo one koje se tiču tebe."
    - q: "Zašto su eura i funte odvojeni?"
      a: "Stanja ostaju u valuti u kojoj si platio osim ako pretvoriš pri unosu troška ili uplate. Dugovi u različitim valutama nikad se ne prebijaju jedan s drugim."
    - q: "Što ako netko plati samo dio onoga što duguje?"
      a: "Zabilježi plaćeni dio. Ostatak ostaje na stanju dok se ne plati."
    - q: "Je li to uvijek najmanji mogući broj uplata?"
      a: "Nije zajamčeno. Uvijek predlaže manje uplata nego što ima osoba sa stanjem u toj valuti, pa za četiri osobe nikad više od tri. U primjeru s cimerima to su dvije uplate, gdje je izravno vraćanje svakoj osobi zahtijevalo šest."
