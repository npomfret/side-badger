faq:
  heading: "ভিলা নিয়ে প্রশ্ন"
  items:
    - q: "কেউ বাতিল করলে কী হবে?"
      a: "তার রাতগুলো বাদ দিন, অঙ্কগুলো আবার কষুন, আর ভিলার খরচ সম্পাদনা করুন যাতে সঠিক পরিমাণগুলোর যোগফল আবার দামের সমান হয়। আগের সংস্করণ রাখা থাকে আর সম্পাদনা গ্রুপের কার্যকলাপে দেখা যায়, তাই কেউ চুপিচুপি কোনো সংখ্যা বদলাতে পারে না। কে সম্পাদনা করতে পারবে তা গ্রুপের অনুমতির ওপর নির্ভর করে।"
    - q: "যে বুক করেছে তার কি কম দেওয়া উচিত?"
      a: "সেটা গ্রুপ ঠিক করবে। বুকিং করা একটা ঝামেলার কাজ, আর তাতে ছাড় পাওয়া উচিত কি না তা নিয়ে গ্রুপে গ্রুপে মত আলাদা। যা-ই ঠিক করুন, সেটা সঠিক পরিমাণগুলোর মধ্যে ধরুন আর খরচের একটি নোটে, বা তার পাশে একটি মন্তব্যে লিখে রাখুন, যাতে কাউকে চুক্তিটা মনে রাখতে না হয়।"
    - q: "পরিষ্কারের ফি কি আলাদাভাবে ভাগ করা যায়?"
      a: "হ্যাঁ। ফিটা আলাদা খরচ হিসেবে লিখুন আর তার নিজস্ব ভাগ দিন। পুরো বাড়ির জন্য ধরা-বাঁধা একটা চার্জ হলে সমান ভাগ মানায়। ফিটাও রাত অনুযায়ী ভাগ হোক, এটা চাইলে সঠিক পরিমাণ মানায়।"
