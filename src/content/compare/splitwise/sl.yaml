sections:
  - heading: "Kaj Splitwise dela dobro"
    body: "Če tvoja skupina potrebuje domačo aplikacijo, uporabo brez povezave ali plačila znotraj aplikacije, je Splitwise pametna izbira in raje vidimo, da ga izbereš, kot da to ugotoviš pozneje. Njegove lastne strani navajajo:"
    items:
      - "**Aplikacije in uporaba brez povezave.** Aplikaciji za iPhone in Android poleg spleta ter način brez povezave."
      - "**Več načinov delitve.** Deleži, prilagoditve in delitev po postavkah, poleg enako, točno in po odstotkih."
      - "**Ponavljajoči se stroški.** Nastavi, da se najemnina ponavlja, in pozabi nanjo."
      - "**Plačila v aplikaciji.** V nekaterih državah lahko premakne tudi denar, prek Splitwise Pay, Venmo, PayPal ali Pay by Bank."
  - heading: "Tu brezplačno, tam plačljivo"
    body: "Splitwise Pro je Splitwisov plačljiv paket, njegova lastna stran Pro pa prodaja štiri stvari, ki v Side Badgerju ne stanejo nič."
    items:
      - "**Skeniranje računov.** Splitwise Pro skenira fotografijo računa. Side Badger to dela brezplačno, brez kreditov za skeniranje: izpolni skupni znesek, datum in kraj, da jih preveriš. Slike računov bere Googlova storitev umetne inteligence."
      - "**Pretvorba valut.** Splitwise Pro pretvori stroške skupine v tvojo privzeto valuto, ko tapneš Convert. Side Badger pretvori vsak strošek, ko ga vneseš, po trenutnem menjalnem tečaju ali tistem, ki si ga res dobil, izvirni znesek pa ostane pri stroških."
      - "**Brez oglasov.** Splitwise navaja popolnoma brezoglasno izkušnjo kot funkcijo Pro. Side Badger nima oglasov."
      - "**Brez dnevnih omejitev.** Splitwise Pro prodaja neomejene stroške, njegov center za pomoč pa pravi, da lahko brezplačni uporabniki dodajo do 4 stroške na dan. Side Badger nima dnevnih omejitev."
  - heading: "Kaj ima Splitwise, Side Badger pa ne"
    body: "To niso vse Splitwisove funkcije, samo tiste, ki običajno odločijo. Splitwisove lastne strani imajo celoten seznam. Tu je, kje Side Badger zaostaja."
    items:
      - "**Domače aplikacije.** Side Badger deluje v brskalniku. Prijavi se, nato ga dodaj na domači zaslon in odpre se kot aplikacija."
      - "**Način brez povezave.** Side Badger potrebuje povezavo."
      - "**Plačila v aplikaciji.** Side Badger se tvojega denarja nikoli ne dotakne. Plačajte si, kakor želite, nato plačilo zabeležite."
      - "**Ponavljajoči se stroški.** Side Badger jih nima. Namesto ponovnega tipkanja kopiraj najemnino prejšnjega meseca."
      - "**Delitev po deležih ali postavkah.** Side Badger ima enega plačnika na strošek, razdeljenega enako, po točnih zneskih ali po odstotkih. Njegovo skeniranje računov ne dodeljuje postavk ljudem."
      - "**Grafikoni in privzete delitve.** Splitwise Pro ima oboje. Side Badger vodi štetje, kdo komu dolguje, in to je ves trik."
  - heading: "Selitev skupine"
    body: "Uvoznika ni, zato selitev pomeni nov začetek. Najprej se poravnajte v Splitwisu, nato ustvari skupino v Side Badgerju in povabi vse s povezavo ali kodo QR. Vsak v skupini potrebuje brezplačen uporabniški račun, za registracijo pa je dovolj e-poštni naslov."
