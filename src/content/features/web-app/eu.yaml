meta:
  title: "Fakturak banatzeko aplikazioa deskargarik gabe | Side Badger"
  description: "Zure telefonoa beteta dago, ulertzen dugu. Side Badger nabigatzailean dabil, deskargarik gabe. Gehitu hasierako pantailan eta aplikazio bat bezala irekitzen da."
h1: "Aplikazio-dendarik ez. Deskargarik ez. Hala ere, aplikazio baten antza"
navLabel: Web aplikazioa
lead: Side Badger zure nabigatzailean bizi da. Ez dago aplikazio-dendarik bilatzeko eta ez dago ezer aurrez deskargatzeko. Hasi saioa telefonoan edo ordenagailuan, banatu gastuak sarean zure taldearekin, eta gehitu hasierako pantailan edo Dock-ean ukitu batera nahi duzunean.
cta:
  heading: Ireki. Hasi saioa. Hasi talde bat.
  body: Sortu kontu bat, hasi talde bat eta gehitu lehen gastua, dagoeneko irekita daukazun nabigatzailetik. Lehenik ibilbide azkar bat nahi duzu? Ikusi [nola funtzionatzen duen](page:how-it-works), edo begiratu [doakoak zer hartzen duen](page:pricing).
problem:
  heading: Zure telefonoa beteta dago. Ulertzen dugu.
  body: Han nonbait, ilunabar berberaren lau mila argazki daude eta udaberritik baztertzen ari zaren biltegiratze-abisu bat. Behar duen azken gauza beste aplikazio bat da, afari bakar bat banatzeko. Beraz, Side Badger web aplikazio bat da. Nabigatzaile moderno batean dabil, telefonoan edo ordenagailuan. Telefonoan mugikorrerako diseinuak erabiltzen ditu, taldearen orria fitxetan banatuta eta ukimenerako aproposak diren kontrolekin. Gehigarri batzuk, hala nola hasierako pantailan gehitzea, zure nabigatzailearen araberakoak dira, eta non diren esaten dugu.
workflow:
  heading: Nabigatzaile-fitxatik hasierako pantailara hiru urratsetan
  steps:
    - title: Ireki eta hasi saioa
      body: Joan Side Badger-era zure nabigatzailean eta hasi saioa. Posta elektroniko bat eta pasahitz bat besterik ez dituzu behar, eta posta egiaztatu behar duzu ezer gehitu aurretik. Taldeko guztiek kontu bat behar dute, beraz gonbidatzen dituzun pertsonek berdin egingo dute.
    - title: Gehitu hasierako pantailan edo Dock-ean
      body: Saioa hasi ondoren, aplikazioak bere burua instalatzea eskaintzen du. **Instalatu** botoia ikusiko duzu zure nabigatzaileak onartzen duen tokian, eta **Erakutsi nola** onartzen ez duen tokian. Ez duzu ikusi, edo ezetz esan zenuen? **Ezarpenak** atalak laguntza bera dauka **Gehitu hasierako pantailan edo Dock-ean** azpian. iPhone edo iPad batean, **Ezarpenak** atalak iPhone-ko urratsak erakusten ditu lehenik eta beste gailuak **Beste gailu batzuk** azpian gordetzen ditu. Bi kasuetan, aplikazioa gero bere leiho propioan irekitzen da.
      shot: S20
      shotAlt: Ezarpenen Gehitu hasierako pantailan edo Dock-ean atala, aplikazioa gailu batean gehitzeko urratsekin
    - title: Aktibatu jakinarazpenak, nahi baduzu
      body: Jakinarazpenak desaktibatuta daude aktibatu arte, eta gailu bakoitza bereizita aktibatzen da. Erabili jakinarazpen-kanpaiak eskaintzen duen **Aktibatu** botoia, edo **Ezarpenak** ataleko **Push jakinarazpenak** etengailua. iPhone edo iPad batean, ireki aplikazioa hasierako pantailatik lehenik. Han bakarrik funtzionatzen dute jakinarazpenek.
      shot: S19
      shotAlt: Jakinarazpenen goitibeherakoa irekita, taldeko azken jarduera zerrendatuz
options:
  heading: Nola gehitu, gailuz gailu
  items:
    - title: iPhone eta iPad
      body: Sakatu Partekatu botoia, gezi bat gorantz duen karratua. Ikusten ez baduzu, sakatu lehenik hiru puntuak (•••), eta gero Partekatu. Egin behera eta sakatu **Gehitu hasierako pantailan**. Utzi aktibatuta **Ireki web aplikazio gisa**, eta sakatu **Gehitu**. Esteka bat beste aplikazio baten barruan ireki bada, ireki orria Safari-n lehenik, barneko nabigatzaile horrek ezin duelako gehitu.
    - title: Android
      body: Ireki nabigatzailearen menua eta aukeratu **Gehitu hasierako pantailan** edo **Instalatu aplikazioa**.
    - title: Chrome edo Edge ordenagailuan
      body: Ireki nabigatzailearen menua eta aukeratu webgune hau aplikazio gisa instalatzeko aukera. Orduan bere leihoa eta bere ikonoa lortzen ditu.
    - title: Safari Mac batean
      body: Aukeratu **Fitxategia**, eta gero **Gehitu Dock-era**.
sections:
  - heading: Jakinarazpenak, eskatzen badituzu bakarrik
    body: Push jakinarazpenak aukerakoak dira. Aktibatu itzazu eta jakinarazpen bat jasoko duzu zure taldeetan jarduera berria dagoenean, adibidez norbaitek gastu bat gehitzen duenean, iruzkin bat uzten duenean edo ordainketa bat erregistratzen duenean. Gailuz gailu aktibatzen dira, jakinarazpen-kanpaitik edo **Ezarpenak** atalatik, eta hortxe berean desaktiba ditzakezu. Haiek onartzen dituen nabigatzaile bat eta zure baimena behar dituzte. Zure nabigatzaileak gunerako blokeatu baditu, baimendu itzazu lehenik nabigatzailearen ezarpenetan. iPhone edo iPad batean hasierako pantailan gehitutako aplikaziotik bakarrik funtzionatzen dute, ez nabigatzaile-fitxa batetik. Bidalketa ez dago bermatuta, beraz hartu jakinarazpen bat bultzada gisa, ez promesa gisa. Jarduera-historian zer agertzen den jakiteko, ikusi [planifikatu elkarrekin](page:feature/plan-together).
  - heading: Berehalako eguneraketak, freskatzeko botoirik gabe
    body: Gehitu gastu bat eta denek berehala ikusten dute, zer aldatu den eta nork aldatu duen barne. Talde bakoitzak jarduera-historia gordetzen du, eta jakinarazpen-kanpaiak zure talde guztietako jarduera erakusten du. Inork ez du galdetu behar gehitu berri duzuna ikusi duzun. Haien pantailan dago.
  - heading: 39 hizkuntza, bakoitzak berea
    body: Erabili Side Badger 39 hizkuntzatan, eskuinetik ezkerrera idazten diren arabiera, persiera eta urdua barne. Taldeko bakoitzak berea aukeratzen du, beraz taldearen orri bera arabieraz egon daiteke batentzat eta ingelesez hurrengoarentzat. Taldeak adostu behar duen gauza bakarra zenbakiak dira.
  - heading: Erabiltzaile mota bat baino gehiagorentzat eraikia
    body: Side Badger teklatua eta pantaila-irakurgailua erabiltzen dutenak kontuan hartuta eraiki da. Kideen koloreek ereduak dituzte, beraz ez duzu berdea gorritik bereizi behar.
    items:
      - Salto-estekak, teklatu-erabiltzaileek zuzenean edukira joan daitezen.
      - Elkarrizketa-koadroek teklatuaren fokua kudeatzen dute.
      - Kontrolak etiketatuta daude, pantaila-irakurgailuentzat.
      - Diseinuak biratu egiten dira eskuinetik ezkerrera idazten diren hizkuntzetarako.
limits:
  heading: Web aplikazioak egiten ez duena
  items:
    - Ez dago konexiorik gabeko erabilerarik. Side Badger-ek konexioa behar du, beraz ez du zure taldea irekiko wifirik gabeko hegazkin batean.
    - Ez dago aplikazio-denda bateko aplikaziorik eta ez dago iPhone edo Android aplikazio natiborik. Side Badger web aplikazio bat da, eta hasierako pantailan edo Dock-ean gehitzea da aplikazio-itxurako bertsioa lortzeko modua.
    - Hasierako pantailan edo Dock-ean gehitzea zure nabigatzailearen araberakoa da. Menuen izenak nabigatzaile eta bertsioaren arabera aldatzen dira, eta nabigatzaile batzuek ez dute eskaintzen.
    - Push jakinarazpenak aukerakoak dira gailu bakoitzean, eta haiek onartzen dituen nabigatzaile bat eta zure baimena behar dituzte. iPhone edo iPad batean hasierako pantailan gehitutako aplikaziotik bakarrik funtzionatzen dute. Bidalketa ez dago bermatuta.
    - Ez dago posta elektronikoko edo SMS alertarik eta ez dago ordainketa-gogorarazpenik. Jarduera berria aplikazioan ageri da, eta push jakinarazpen gisa aktibatzen badituzu. Ordainketa bat jarraitzea zure esku geratzen da.
    - Jarduera 90 egunez gordetzen da.
    - Saioa posta elektroniko eta pasahitz batekin hasten da. Ez dago Google edo Apple bidezko saio-hasierarik, eta 18 urte edo gehiago izan behar dituzu.
    - Ez dugu esaten Side Badger guztiz irisgarria denik, ezta irisgarritasun-estandar formal bat betetzen duenik ere. Zerbaitek traba egiten badizu, esan iezaguzu aplikazioaren barnetik eta gure erantzuna han ikusiko duzu.
useCasesHeading: Aplikaziorik ez behar izateak non laguntzen duen
faq:
  heading: Galderak
  items:
    - q: Side Badger-en aplikaziorik al dago aplikazio-denda batean?
      a: Ez. Side Badger web aplikazio bat da. Zure nabigatzailean irekitzen duzu, eta hasierako pantailan edo Dock-ean gehi dezakezu aplikazio bat bezala ireki dadin. Ez dago ezer aplikazio-denda batetik deskargatzeko.
    - q: Fakturak banatu al ditzaket aplikaziorik deskargatu gabe?
      a: Bai. Ireki Side Badger nabigatzaile batean, telefonoan edo ordenagailuan, hasi saioa eta hasi talde bat. Hasierako pantailan edo Dock-ean gehitzea aukerakoa da.
    - q: Konexiorik gabe funtzionatzen al du?
      a: Ez. Side Badger-ek konexioa behar du, baita hasierako pantailan edo Dock-ean gehituta dagoenean ere.
    - q: Zergatik ez ditut jakinarazpenak jasotzen nire iPhone-an?
      a: iPhone edo iPad batean, jakinarazpenek hasierako pantailan gehitutako aplikaziotik bakarrik funtzionatzen dute, ez nabigatzaile-fitxa batetik. Gehitu, ireki hasierako pantailako ikonotik, eta gero aktibatu jakinarazpenak **Ezarpenak** atalean. Bidalketa ez dago bermatuta, beraz bat falta bada, taldearen jarduera-historiak gehitutakoa erakusten du oraindik.
    - q: Jakinarazpenak aktibatu behar ditut?
      a: Ez. Desaktibatuta daude aktibatu arte, gailuz gailu. Haiek gabe, jarduera berria aplikazioan ageri da oraindik, eta denek aldaketa berehala ikusten dute irekita dutenean.
    - q: Taldeko guztiek kontu bat behar dute?
      a: Bai. Posta elektroniko bat eta pasahitz bat besterik ez dituzu behar, eta posta egiaztatu behar duzu ezer gehitu aurretik. Talde batera sartzen den guztiak berdin egiten du, nahi duen telefono edo ordenagailuan.
