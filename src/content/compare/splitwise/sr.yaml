faq:
  heading: "Питања"
  items:
    - q: "Да ли је Side Badger бесплатна алтернатива Splitwise-у?"
      a: "За поделу рачуна у групи, да. Скенирање рачуна, претварање валута и живот без огласа су бесплатни, без дневних ограничења. Ако ти треба изворна апликација, рад ван мреже, понављајући трошкови или уплате унутар апликације, то ради Splitwise, а Side Badger не."
    - q: "Одакле потичу подаци о Splitwise-у?"
      a: "Са Splitwise-ових страница: његове почетне странице, његове Pro странице и његовог центра за помоћ. Сваки ред табеле води до странице из које потиче, а датум изнад табеле каже када смо их прочитали. Проверавамо их сваког квартала."
    - q: "Хоће ли Side Badger остати бесплатан?"
      a: "Све у Side Badger-у је данас бесплатно и нема плаћеног нивоа. Ако се то икада промени, прво ћемо те обавестити. [Ценовник](page:pricing) има појединости."
    - q: "Мора ли свако у мојој групи да пређе?"
      a: "Да. Свако у групи треба бесплатан Side Badger кориснички налог, а може се придружити везом или QR кодом."
    - q: "Има ли Side Badger мобилну апликацију?"
      a: "Не у продавници апликација. Ради у твом прегледачу: пријави се на телефону, па га додај на почетни екран да се отвара као апликација. [Како ради](page:how-it-works) показује како."
