featuresHeading: Funktionerna det här använder
faq:
  heading: Frågor
  items:
    - q: Kan gäster se gruppen utan att gå med?
      a: Nej. Folk går med via en länk eller QR-kod och ett gratiskonto, så de kan se gruppen när de är med.
    - q: Kan Side Badger samla in pengarna?
      a: Nej. Side Badger håller räkningen och flyttar aldrig pengar. Betala varandra hur ni vill och registrera sedan betalningen. Det är gratis, utan annonser och utan dagliga gränser; se [prissättning](page:pricing).
    - q: Kan röster vara anonyma?
      a: Ja. När du skapar en omröstning kan du dölja vem som röstat på vad. Inställningarna kan bara ändras före den första rösten.
    - q: Kan folk bidra med olika belopp?
      a: Ja. Dela en utgift efter exakta belopp, så att var och ens andel är den siffra ni kommit överens om, eller lämna utanför de som inte var inblandade.
    - q: Kan en arrangör sköta bokföringen?
      a: Ja. Använd förinställningen för hanterad grupp, så att bara skapare och administratörer ändrar utgifter och administratörer godkänner nya medlemmar.
