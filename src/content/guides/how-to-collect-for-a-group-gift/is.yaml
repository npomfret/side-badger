faq:
  heading: "Spurningar"
  items:
    - q: "Hvað ef við söfnum meiru en gjöfin kostar?"
      a: "Nákvæmu upphæðirnar verða að ná samtals verðinu, svo klipptu af hlutunum þar til þær gera það. Eða settu afganginn í eitthvað raunverulegt, eins og blóm, og skráðu það sem annað útgjald, eins og kortið og gjafapappírinn í dæminu."
    - q: "Getur einhver lagt til án þess að ganga í hópinn?"
      a: "Ekki ef þú vilt hafa hann með í talningunni. Allir í skiptingunni þurfa ókeypis aðgang og að vera í hópnum. Fyrir þann sem á bara reiðufé gæti Priya tekið við því og skráð gjöfina á það sem hópurinn skuldar enn. Ef Sam gæfi henni til dæmis 40 £ í reiðufé myndi hún skrá 200 £ og skipta þeim þannig að hún sjálf, Omar og Lena bæru 60, 60 og 80."
    - q: "Getur könnunin ákveðið hvað hver leggur til?"
      a: "Nei. Könnun ákveður tölu fyrir allan hópinn, eins og fjárhagsáætlunina. Hlutur hvers og eins er ykkar að koma ykkur saman um og slá svo inn í útgjaldið sem **Nákvæmar upphæðir**."
