meta:
  title: 用 140 种货币分摊费用，可换算也可分开记
  description: 每笔支出用你实际支付的货币来记，余额可以分开记，也可以按你能看到并能修改的汇率换算，然后用一份简短的付款清单结清。
h1: 用 140 种货币分摊费用
navLabel: 多种货币
lead: 欧元、日元，还有那趟用泰铢付的出租车。Side Badger 按你实际支付的货币记录每笔支出，把余额算清楚，并在群组想一次结清时进行换算。它支持 140 种货币，与[团体旅行](page:use-case/group-trips)天生一对。
cta:
  heading: 带上你的欧元，带上你的日元
  body: 创建账户，建一个群组，用手头恰好有的任何货币添加第一笔支出。
  button: 创建免费账户
problem:
  heading: 怎么付的就怎么录
  body: 旅行很少只用一种货币付款。酒店是在家用英镑订的，晚餐用日元付，机场的咖啡则用转机地的货币。连输入之前都得先手动全部换算，电子表格就是这样被弃用的。在 Side Badger 里，每笔支出都用收据上的货币录入，每个金额都遵循其货币的规则，所以日元没有小数位，第纳尔有三位。你最近用过的货币会排在列表最前面。
workflow:
  heading: 货币分开记，或边记边换算
  steps:
    - title: 用支出自己的货币来添加
      body: 选择货币，输入金额，说明谁付的钱、谁分担。不需要其他任何操作。这是默认方式，并会把原始金额原样保留。
      shot: S07
      shotAlt: 输入了日元金额的支出表单
    - title: 每种货币看一份余额
      body: 余额按货币分别记录，每一种都有自己的一份简短的建议付款清单。英镑用英镑结清，日元用日元结清。
      shot: S10
      shotAlt: 余额界面，显示两种货币的简化债务
    - title: 或者在群组想一次结清时换算
      body: 录入支出时选择另一种货币，Side Badger 可以按当前汇率换算，你也可以改成你实际换到的汇率。换算后的金额会计入该货币的余额。换算是群组做出的选择，绝不会在你背后悄悄发生。
options:
  heading: 看得见、改得了的汇率
  items:
    - title: 汇率一目了然
      body: 换算时，汇率和换算后的金额会显示在表单上，所以没人需要凭空相信一个数字。
    - title: 输入你自己的汇率
      body: 在兑换处换到了更好的汇率，或在机场吃了亏？把汇率改成你实际换到的，换算后的金额会随之更新。
    - title: 原始金额保留
      body: 原始金额会留在支出上，紧挨着换算后的金额，方便有人问起它用日元是多少。
    - title: 换算免费
      body: 换算不花钱。用另一种货币录入支出，没有任何费用。
