example:
  heading: "Вілла, авто й продукти"
  currency: EUR
  people:
    - id: ana
      name: Ана
    - id: ben
      name: Бен
    - id: chloe
      name: Хлоя
    - id: dev
      name: Дев
  expenses:
    - label: "шість ночей на віллі"
      payer: ana
      amount: 2100
      split:
        method: exact
        shares:
          ana: 600
          ben: 600
          chloe: 600
          dev: 300
    - label: "оренда авто"
      payer: ben
      amount: 240
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "продукти"
      payer: dev
      amount: 180
      split:
        method: equal
faq:
  heading: "Запитання про віллу"
  items:
    - q: "Що, якщо хтось скасовує поїздку?"
      a: "Приберіть його ночі, перерахуйте й відредагуйте витрату на віллу, щоб точні суми знову давали в сумі ціну. Попередня версія зберігається, а редагування видно в активності групи, тож ніхто не змінює цифру непомітно. Хто може редагувати, залежить від дозволів групи."
    - q: "Чи має той, хто бронював, платити менше?"
      a: "Це вирішує група. Бронювання — це клопіт, і групи по-різному дивляться, чи заслуговує він на знижку. Про що б ви не домовилися, відобразіть це в точних сумах і запишіть у примітці до витрати або в коментарі біля неї, щоб нікому не доводилося пам'ятати домовленість."
    - q: "Чи можна ділити плату за прибирання інакше?"
      a: "Так. Внесіть плату окремою витратою й дайте їй власний розподіл. **Порівну** пасує для фіксованої плати за весь будинок. Точні суми пасують групі, яка хоче, щоб плата теж залежала від ночей."
