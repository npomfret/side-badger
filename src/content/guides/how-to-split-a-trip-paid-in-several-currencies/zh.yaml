faq:
  heading: 常见问题
  items:
    - q: Side Badger 用哪个汇率？
      a: 当前汇率，在你录入支出时获取（有的话）。你可以改成你实际拿到的汇率。
    - q: 群组可以只用英镑和日元吗？
      a: 可以。在群组的**设置**里，打开**货币设置**下的**为此群组限制货币**，选好**允许的货币**，并设置**新费用的默认货币**。列表里的选项少了，在收银台选错的机会也少了。
    - q: 我们非得换算吗？
      a: 不用。除非你或你的群组选择换算，否则各货币保持分开，每种货币都有自己的简短付款清单。
