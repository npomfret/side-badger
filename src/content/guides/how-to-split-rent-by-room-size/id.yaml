faq:
  heading: "Pertanyaan"
  items:
    - q: "Bagaimana jika kamar seseorang lebih besar tetapi kurang cahaya?"
      a: "Luas lantai hanyalah titik awal, jadi grup boleh sepakat menyesuaikannya. Kurangi satu atau dua poin dari kamar yang gelap, berikan kepada yang lain, dan periksa bahwa total persentasenya tetap 100. Side Badger menyimpan apa pun yang Anda sepakati dan tidak menghakiminya."
    - q: "Apakah tagihan juga sebaiknya dibagi menurut ukuran kamar?"
      a: "Biasanya tidak. Energi dan internet dipakai semua orang, jadi pembagian rata lebih sederhana, seperti pada contoh di atas. Jika satu teman serumah di rumah sepanjang hari, grup bisa menyepakati cara lain, seperti jumlah pasti. [Bagi pengeluaran](page:feature/split-expenses) membahas pilihan-pilihannya."
    - q: "Bisakah kami mengubah pembagiannya nanti?"
      a: "Bisa, untuk pengeluaran baru. Ubah persentasenya saat menyalin sewa dan bulan-bulan sebelumnya tetap seperti semula. Untuk memperbaiki pengeluaran yang lalu, ubah pengeluarannya jika izin grup mengizinkan, dan beri tahu seisi apartemen lebih dulu, karena saldo berubah. Versi sebelumnya disimpan."
