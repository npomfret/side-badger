featuresHeading: 情侣用得上的功能
faq:
  heading: 常见问题
  items:
    - q: 能一次设好 60/40，适用于所有开销吗？
      a: 不能。分法属于每一笔支出。在第一笔上设好百分比，下次复制它，再改不同的地方。[分摊支出](page:feature/split-expenses)介绍了三种分法。
    - q: 它会连接我们的银行吗？
      a: 不会。Side Badger 从不碰你们的钱。你们想怎么互相付款都行，然后记录下来，[结算](page:feature/settle-up)里有说明。
    - q: 别人能看到我们的群组吗？
      a: 只有它的成员能看到，而情侣的群组有两位成员。任何拿到有效邀请链接的人都可以加入，所以只发给一个人，并设一个短的有效期。
    - q: 如果我们各付了同一张账单的一部分呢？
      a: 一笔支出只有一位付款人。记两笔支出，你们各一笔，余额的结果是一样的。
    - q: 它会提醒我的伴侣付款吗？
      a: 不会。没有提醒，所以催一催仍然是你的事。至少你们俩看到的是同一个数字。
    - q: 不再共担开销后怎么办？
      a: 结清余额并记录这笔付款，这样谁都不欠谁。然后管理员可以锁定群组，让数字保持原样，或者永久关闭，这样所有人都无法再访问。只有在你们俩都不再需要历史记录时才关闭。
