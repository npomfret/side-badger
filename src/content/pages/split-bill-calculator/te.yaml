meta:
  title: "బిల్లు పంపకం కాలిక్యులేటర్: ఎవరు ఎవరికి | Side Badger"
  description: "ఎవరు చెల్లించారు, ఎవరు ఎవరికి ఇవ్వాలి: సెకన్లలో తేలుతుంది. సమానంగా, కచ్చితంగా లేదా శాతంతో పంచండి. ఉచితం, బ్రౌజర్‌లోనే, ఏదీ సేవ్ కాదు, పంపబడదు."
h1: "బిల్లు పంపకం కాలిక్యులేటర్"
navLabel: "బిల్లు పంపకం కాలిక్యులేటర్"
lead: "ఎవరు దేనికి చెల్లించారో టైప్ చేయండి, ఎవరు ఎవరికి బాకీనో కాలిక్యులేటర్ చెబుతుంది, లెక్క తేల్చడానికి పేమెంట్ల చిన్న జాబితాతో. ఇది మీ బ్రౌజర్‌లోనే నడుస్తుంది, ఏదీ సేవ్ చేయదు, డబ్బును కదిలించదు. ట్యాబ్ మూసిన తర్వాత కూడా మీ గ్రూప్‌కు లెక్క కావాలంటే, Side Badgerలోని [ఖర్చుల పంపకం](page:feature/split-expenses), [లెక్క తేల్చడం](page:feature/settle-up) అవే లెక్కలు వేసి వాటిని భద్రపరుస్తాయి."
cta:
  heading: "లెక్కలు నచ్చాయా? వాటిని ఉంచుకోండి."
  body: "ట్యాబ్ మూసేస్తే ఈ కాలిక్యులేటర్ అంతా మర్చిపోతుంది, గత సారి కచ్చితంగా తానే చెల్లించానని చెప్పే మనిషిలాగే. Side Badger గ్రూప్ ఖర్చులను ఉంచుతుంది, అందరి బ్యాలెన్స్‌ను తాజాగా ఉంచుతుంది, పేమెంట్లను రికార్డ్ చేస్తుంది. ఇది ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
sections:
  - heading: "లెక్క ఎలా పనిచేస్తుంది"
    body: "ప్రతి ఖర్చుకు కాలిక్యులేటర్ ప్రతి ఒక్కరి వాటాను లెక్కిస్తుంది. మీరు ఎంచుకున్న వ్యక్తుల మధ్య దాన్ని సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచవచ్చు. ప్రతి ఒక్కరి బ్యాలెన్స్ అంటే వాళ్లు చెల్లించినది మైనస్ వాళ్లు ఇవ్వాల్సినది. ప్లస్ గుర్తు అంటే గ్రూప్ వాళ్లకు ఇవ్వాలి, మైనస్ గుర్తు అంటే వాళ్లు గ్రూప్‌కు ఇవ్వాలి. బ్యాలెన్స్‌ల మొత్తం ఎప్పుడూ సున్నా అవుతుంది, ఎందుకంటే ఒకరికి రావాల్సినది ఇతరులు ఇవ్వాల్సిందే."
  - heading: "పేమెంట్ల జాబితా ఎందుకు చిన్నది"
    body: "ప్రతి రసీదునూ విడివిడిగా తేల్చాల్సిన అవసరం ఎవరికీ లేదు. ప్రతి బ్యాలెన్స్ తెలిసిన తర్వాత, కాలిక్యులేటర్ ఎక్కువ ఇవ్వాల్సిన వ్యక్తిని ఎక్కువ రావాల్సిన వ్యక్తితో జత చేస్తుంది, ఒక పేమెంట్ తేల్చగలిగినంత తేలుస్తుంది, అందరూ సున్నాకు వచ్చే వరకు జాబితాలో ముందుకు సాగుతుంది. బ్యాలెన్స్ ఉన్నవారి సంఖ్య కంటే ఒకటి తక్కువ పేమెంట్లకు మించి దానికి ఎప్పుడూ అవసరం ఉండదు, బిల్లు వారీగా తేల్చడం కంటే తరచుగా తక్కువే సరిపోతుంది. ఇది పేమెంట్ల చిన్న జాబితాను ఇస్తుంది, సాధ్యమైనంత చిన్నదని హామీ ఇవ్వదు."
  - heading: "కాలిక్యులేటర్ చేయనివి"
    items:
      - "**ఒకటి కంటే ఎక్కువ కరెన్సీలను నిర్వహించడం.** ఒకదాన్ని ఎంచుకుని మొత్తం లెక్కకు అదే వాడండి. యాప్ ప్రతి కరెన్సీకి వేర్వేరు బ్యాలెన్స్ ఉంచుతుంది, ఒక ఖర్చును ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో మార్చగలదు, ఆ రేటును మీరు మార్చుకోవచ్చు."
      - "**ఏదైనా సేవ్ చేయడం.** ట్యాబ్ మూసేస్తే అంకెలు పోతాయి. వాటిని ఉంచుకోవాలంటే లింక్‌ను కాపీ చేయండి. అందులో మీ అంకెలు # తర్వాత ఉంటాయి, మీ బ్రౌజర్ వాటిని సర్వర్‌కు ఎప్పుడూ పంపదు, మీరు ఎవరికి పంపినా వాళ్లు వాటిని చదవగలరు."
      - "**డబ్బు కదిలించడం.** ఎవరు ఎవరికి చెల్లించాలో అది చెబుతుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, మీ గ్రూప్ లెక్కను యాప్‌లో ఉంచుకుంటే అక్కడ పేమెంట్‌ను రికార్డ్ చేయండి."
      - "**మిగిలిన పైసాను యాదృచ్ఛికంగా ఇవ్వడం.** బిల్లు సమానంగా విడిపోనప్పుడు, మిగిలిన పైసలు జాబితాలో మొదటి వ్యక్తులకు వెళ్తాయి, కాబట్టి మొత్తాలు ఇంకా సరిపోతాయి. యాప్‌లో మిగిలిన పైసా యాదృచ్ఛికంగా ఒకరికి వెళ్తుంది, కాబట్టి ఎప్పుడూ ఒకే వ్యక్తికి కాదు."
      - "**పరిమితులు దాటడం.** కాలిక్యులేటర్ 2 నుండి 20 మందిని తీసుకుంటుంది, ఒక ఖర్చు 999,999.99 వరకు ఉండవచ్చు, యాప్‌లో లాగే."
exampleAfter: 2
