meta:
  title: Ausgaben gleichmäßig, genau oder in Prozent teilen | Side Badger
  description: Teile gemeinsame Kosten gleichmäßig, nach genauen Beträgen oder in Prozent und lass alle weg, die nicht dabei waren. Kostenlos, ohne Werbung und ohne Tageslimits.
h1: Ausgaben gleichmäßig, genau oder in Prozent teilen
navLabel: Ausgaben teilen
lead: Nicht alles ist fifty-fifty. Side Badger kommt damit klar. Sag, wer bezahlt hat, wähle die Personen, die sich die Kosten teilen, und teile **gleichmäßig, nach genauen Beträgen oder in Prozent**. Groll gibt es separat.
cta:
  heading: Teile die nächste Ausgabe richtig
  body: Erstelle ein kostenloses Konto, starte eine Gruppe und füge die Ausgabe hinzu, die du schon lange klären wolltest. Unsicher, was dann passiert? Lies [so funktioniert es](page:how-it-works) oder sieh nach, [was kostenlos abgedeckt ist](page:pricing).
  button: Kostenloses Konto erstellen
problem:
  heading: Nicht alles ist fifty-fifty
  body: Die Miete richtet sich nach der Zimmergröße. Ein Geschenk richtet sich danach, wer was versprochen hat. Ein Abendessen richtet sich danach, wer zum Nachtisch geblieben ist. Eine Rechnung zu halbieren klappt bis zur ersten, bei der es nicht passt, und dann öffnet jemand eine Tabelle. Side Badger hält fest, wer bezahlt hat, wer sich die Kosten teilt und wie sie sich aufteilen, damit die Salden stimmen, ohne dass jemand am Tisch schriftlich dividiert.
workflow:
  heading: Eine Ausgabe hinzufügen, von Anfang bis Ende
  steps:
    - title: Sag, wer bezahlt hat und wofür
      body: Gib den Betrag, eine kurze Beschreibung und die zahlende Person an. Pro Ausgabe zahlt eine Person, das hält die Rechnung ehrlich.
      shot: S05
      shotAlt: Das Ausgabenformular mit einer Hüttenmiete, die in Prozent auf drei Personen verteilt ist
    - title: Wähle die Aufteilung
      body: Wähle gleichmäßig, genaue Beträge oder Prozentsätze. Prozentsätze müssen zusammen 100 ergeben, und genaue Beträge müssen die Gesamtsumme ergeben.
      shot: S06
      shotAlt: Das Ausgabenformular mit genauen Beträgen für jede Person bei einem Geschenk
    - title: Füge die Geschichte dazu
      body: Lege das Datum fest und füge Etiketten, einen Ort und eine Notiz hinzu. Alle in der Gruppe sehen dieselben Details und können direkt dort kommentieren.
      shot: S08
      shotAlt: Eine Ausgabe mit ihren Details, einem Kommentarverlauf und dem ursprünglich eingegebenen Betrag
    - title: Stell eine Frage, wenn etwas nicht stimmt
      body: Wenn die Gruppe Ausgabenfragen eingeschaltet hat, kann jede an einer Ausgabe beteiligte Person sie hinterfragen, und die Ausgabenliste kann nur die hinterfragten zeigen.
      shot: S18
      shotAlt: Die Ausgabenliste mit einem Abzeichen "Hinterfragt" und dem Filter "Nur hinterfragt"
options:
  heading: Drei Arten zu teilen
  items:
    - title: Gleichmäßig
      body: Die Voreinstellung für Abendessen, Taxis und alles, was alle zu gleichen Teilen genutzt haben. Wenn die Summe nicht glatt aufgeht, bekommt der übrige Cent eine Person zufällig, nicht immer dieselbe. Im Taxi unten ist es Ana.
    - title: Nach genauen Beträgen
      body: Gib ein, was jede Person schuldet. Gut für das Geschenk, bei dem alle einen anderen Preis gewählt haben, oder den Einkauf, bei dem ein Einkaufswagen mehr enthielt als die gemeinsamen Lebensmittel. Die Beträge müssen die Gesamtsumme ergeben.
    - title: In Prozent
      body: Gib jeder Person einen Anteil an der Gesamtsumme. Miete nach Zimmergröße ist der Klassiker, das größte Zimmer zahlt den größten Anteil, und niemand tut so, als wäre es anders.
