meta:
  title: "Laskujen jakolaskuri: kuka on velkaa kenelle | Side Badger"
  description: "Kuka maksoi, kuka on velkaa, kuka maksaa kenelle: selvä sekunneissa. Jaa tasan, tarkoilla summilla tai prosenteilla. Ilmainen, selaimessa, mitään ei tallenneta eikä lähetetä."
h1: Laskujen jakolaskuri
navLabel: Laskujen jakolaskuri
lead: "Kirjoita, kuka maksoi mistä, niin laskuri kertoo, kuka on velkaa kenelle, ja antaa lyhyen maksulistan tilien tasaamiseen. Se toimii selaimessasi, ei tallenna mitään eikä siirrä rahaa. Jos ryhmäsi haluaa laskelman säilyvän välilehden sulkemisen jälkeen, [kulujen jako](page:feature/split-expenses) ja [tilien tasaus](page:feature/settle-up) Side Badgerissa tekevät samat laskut ja säilyttävät ne."
cta:
  heading: Tykkäätkö laskuista? Säilytä ne.
  body: "Tämä laskuri unohtaa kaiken, kun suljet välilehden, aivan kuten se, joka ehdottomasti maksoi viimeksi. Side Badger -ryhmä säilyttää kulut, päivittää kaikkien saldot ja kirjaa maksut. Se on ilmainen, ilman mainoksia ja päivittäisiä rajoja."
sections:
  - heading: Näin laskenta toimii
    body: "Jokaisesta kulusta laskuri selvittää kunkin osuuden. Voit jakaa kulun tasan, tarkoilla summilla tai prosenteilla valitsemiesi ihmisten kesken. Jokaisen saldo on sitten se, mitä hän maksoi, miinus se, mitä hän on velkaa. Plusmerkki tarkoittaa, että ryhmä on hänelle velkaa, ja miinusmerkki tarkoittaa, että hän on velkaa ryhmälle. Saldojen summa on aina nolla, koska se, mitä yhdelle ollaan velkaa, on aina jonkun toisen velkaa."
  - heading: Miksi maksulista on lyhyt
    body: "Kenenkään ei tarvitse tasata jokaista kuittia erikseen. Kun jokaisen saldo tiedetään, laskuri yhdistää eniten velkaa olevan sen kanssa, jolle ollaan eniten velkaa, tasaa niin paljon kuin yksi maksu pystyy ja jatkaa listaa alaspäin, kunnes kaikki ovat nollassa. Maksuja tarvitaan korkeintaan yhtä monta kuin on ihmisiä, joilla on saldo, miinus yksi, ja usein vähemmän kuin jos laskut tasattaisiin yksi kerrallaan. Se antaa lyhyen maksulistan, mutta ei lupaa, että se olisi lyhin mahdollinen."
  - heading: Mitä laskuri ei tee
    items:
      - "**Käsitellä useaa valuuttaa.** Valitse yksi ja käytä sitä koko laskelmassa. Sovellus pitää jokaiselle valuutalle erillistä saldoa ja voi muuntaa kulun nykyisellä valuuttakurssilla, jota voit muuttaa."
      - "**Tallentaa mitään.** Sulje välilehti, ja luvut ovat poissa. Säilyttääksesi ne kopioi linkki. Se sisältää lukusi #-merkin jälkeen, jota selaimesi ei koskaan lähetä palvelimelle, ja jokainen, jolle linkin lähetät, voi lukea ne."
      - "**Siirtää rahaa.** Se kertoo, kuka kenelle pitäisi maksaa. Maksatte toisillenne miten haluatte ja kirjaatte maksun sitten sovellukseen, jos ryhmänne pitää kirjaa siellä."
      - "**Arpoa ylimääräistä penniä.** Kun lasku ei mene tasan, jäljelle jäävät pennit menevät listan ensimmäisille, jotta summat silti täsmäävät. Sovelluksessa ylimääräinen penni menee satunnaiselle henkilölle, joten se ei ole aina sama."
      - "**Ylittää rajoja.** Laskuri hyväksyy 2–20 ihmistä, ja yksi kulu voi olla enintään 999 999,99, kuten sovelluksessa."
