faq:
  heading: "Vprašanja"
  items:
    - q: "Naj uporabimo bruto ali neto plačo?"
      a: "Odloči skupina. Neto je pogosta, ker je to denar, ki ga res imaš na voljo. Bruto plača spregleda, da davek, pokojninski prispevki in odplačila posojil iz različnih plač vzamejo različne zneske. Kar koli izbereta, uporabita isto merilo za oba."
    - q: "Ali Side Badger vidi najine dohodke?"
      a: "Ne. Vnašaš samo odstotke, nikoli plač. Odstotke vidijo člani skupine, pri paru sta to onadva."
    - q: "Ali lahko 62/38 nastaviva enkrat za vse?"
      a: "Delitev je nastavljena pri vsakem strošku, ne za skupino. Kopiraj strošek, ki že ima 62 in 38, in spremeni, kar je drugače. Druge možnosti so opisane pri [delitvi stroškov](page:feature/split-expenses)."
