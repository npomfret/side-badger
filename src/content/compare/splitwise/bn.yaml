      other: Splitwise Pro একটি মাসিক বা বার্ষিক সাবস্ক্রিপশন। বার্ষিক প্ল্যানে একটি Trip Pass থাকে, যা একটি ট্রিপ গ্রুপকে 30 দিনের জন্য Pro ফিচার দেয়।
      sideBadger: বিনামূল্যে।
      source: pro-help
    - feature: দিনে কতগুলো খরচ
      other: এর সহায়তা কেন্দ্র বলে বিনামূল্যের ব্যবহারকারীরা প্রতিদিন 4টি পর্যন্ত খরচ যোগ করতে পারে। Pro-তে দৈনিক কোনো সীমা নেই।
      sideBadger: দৈনিক কোনো সীমা নেই।
      source: pro-help
    - feature: গ্রুপের রোল আর অনুমতি
      other: এর সহায়তা কেন্দ্র বলে এটি গ্রুপ অ্যাডমিন বা বিশেষ অনুমতি সমর্থন করে না।
      sideBadger: অ্যাডমিন, সদস্য আর দর্শক। দুটি প্রিসেট বা নিজের মতো অনুমতি, যোগ দিতে অনুমোদন, আর শেষ হলে লক।
      source: permissions-help
    - feature: রসিদ স্ক্যান
      other: একটি Pro ফিচার। রসিদের ছবি স্ক্যান করে, আর Pro-র আইটেম ধরে ভাগ করার সুবিধায় আইটেমগুলো মানুষের ভাগে ভাগ করে দেওয়া যায়।
      sideBadger: বিনামূল্যে, কোনো স্ক্যান ক্রেডিট ছাড়া। এটি মোট, তারিখ আর জায়গা ভরে দেয় আপনার দেখে নেওয়ার জন্য, আর আইটেমগুলো মানুষের ভাগে ভাগ করে দেয় না।
      source: pro
    - feature: মুদ্রা রূপান্তর
      other: একটি Pro ফিচার। “Convert” চাপলে Splitwise একটি গ্রুপের খরচগুলো সেই মুহূর্তের এক্সচেঞ্জ রেটে আপনার ডিফল্ট মুদ্রায় রূপান্তর করে।
      sideBadger: বিনামূল্যে। প্রতিটি খরচ লেখার সময়ই রূপান্তর করুন, বর্তমান এক্সচেঞ্জ রেটে বা আপনি আসলে যে রেট পেয়েছেন সেটায়। মূল পরিমাণ খরচের সঙ্গেই থাকে।
      source: currencies-help
    - feature: মুদ্রা আর ভাষা
      other: 100+ মুদ্রা আর 7+ ভাষা, এর হোম পেজ যেভাবে বলেছে।
      sideBadger: 133টি মুদ্রা আর 39টি ভাষা। গ্রুপের প্রত্যেকে নিজের ভাষা বেছে নিতে পারে।
      source: home
    - feature: কোথায় ব্যবহার করবেন
      other: iPhone ও Android-এর অ্যাপ, আর ওয়েব।
      sideBadger: আপনার ব্রাউজারে। সাইন ইন করুন, তারপর হোম স্ক্রিনে যোগ করুন, এটি অ্যাপের মতো খোলে। অ্যাপ স্টোরে নেই।
      source: home
    - feature: ভাগ করার উপায়
      other: সমান ভাগে, সঠিক পরিমাণে, শতাংশে, শেয়ার ধরে, অ্যাডজাস্টমেন্ট ধরে বা আইটেম ধরে।
      sideBadger: সমান ভাগে, সঠিক পরিমাণে বা শতাংশে, প্রতি খরচে একজন পেমেন্টকারীসহ। শেয়ার ধরে বা আইটেম ধরে নয়।
      source: split-help
    - feature: অফলাইনে ব্যবহার
      other: অফলাইন মোডকে নিজের মূল ফিচারগুলোর মধ্যে তালিকাভুক্ত করে।
      sideBadger: না। সংযোগ লাগে।
      source: home
    - feature: পেমেন্ট আর আপনার ব্যাংক
      other: "কিছু জায়গায় অ্যাপের ভেতর থেকেই টাকা পাঠানো যায়: যুক্তরাষ্ট্রে Splitwise Pay, মার্কিন ডলারের ব্যালেন্সের জন্য Venmo, PayPal, আর বেছে নেওয়া কয়েকটি ইউরোপীয় দেশে Pay by Bank, যা একটি ব্যক্তিগত চেকিং অ্যাকাউন্ট যুক্ত করে।"
      sideBadger: আপনার টাকা কখনও ছোঁয় না, আর আপনার ব্যাংকের তথ্যও চায় না। যেভাবে খুশি একে অপরকে টাকা মিটিয়ে দিন, তারপর পেমেন্টটা রেকর্ড করুন।
      source: payments-help
    - feature: চার্ট আর ডিফল্ট ভাগ
      other: দুটোই Pro ফিচার।
      sideBadger: কোনোটাই নেই।
      source: pro
faq:
  heading: প্রশ্ন
  items:
    - q: Side Badger কি Splitwise-এর বিনামূল্যের বিকল্প?
      a: "গ্রুপে বিল ভাগ করার জন্য, হ্যাঁ, আর এটি শুধু অঙ্কের চেয়ে বেশি করে: মন্তব্য, প্রশ্ন, তালিকা, পোল আর গ্রুপ রোল, সঙ্গে বিনামূল্যে রসিদ স্ক্যান আর মুদ্রা রূপান্তর। অ্যাপ স্টোরের অ্যাপ, অফলাইনে ব্যবহার বা অ্যাপের ভেতরে পেমেন্ট দরকার হলে সেগুলো Splitwise করে, Side Badger করে না।"
    - q: Splitwise-এর তথ্যগুলো কোথা থেকে নেওয়া?
      a: "Splitwise-এর নিজের পৃষ্ঠাগুলো থেকে: এর হোম পেজ, Pro পৃষ্ঠা আর সহায়তা কেন্দ্র। টেবিলের প্রতিটি সারি যে পৃষ্ঠা থেকে এসেছে তার সঙ্গে যুক্ত, আর টেবিলের ওপরের তারিখ বলে আমরা কখন সেগুলো পড়েছি। প্রতি তিন মাসে আমরা আবার দেখি।"
    - q: Side Badger কি বিনামূল্যে থাকবে?
      a: Side Badger-এর সবকিছু আজ বিনামূল্যে। এটা কখনও বদলালে আমরা আগে আপনাকে জানাব। বিস্তারিত আছে [দামের পৃষ্ঠায়](page:pricing)।
    - q: আমার গ্রুপের সবাইকে কি চলে আসতে হবে?
      a: হ্যাঁ। গ্রুপের প্রত্যেকের একটি বিনামূল্যের Side Badger অ্যাকাউন্ট লাগে, আর তারা লিঙ্ক বা QR কোড দিয়ে যোগ দিতে পারে।
    - q: Side Badger-এর কি মোবাইল অ্যাপ আছে?
      a: "অ্যাপ স্টোরে নেই। এটি আপনার ব্রাউজারে চলে: ফোনে সাইন ইন করুন, তারপর হোম স্ক্রিনে যোগ করুন যাতে এটি অ্যাপের মতো খোলে। কীভাবে, তা দেখিয়ে দেয় [কীভাবে কাজ করে](page:how-it-works)।"
