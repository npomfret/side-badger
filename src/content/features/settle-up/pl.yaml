sections:
  - heading: "Zarejestruj płatność"
    body: "Gdy ktoś płaci, zarejestruj to przy właściwej osobie. Przyciski szybkiego rozliczenia uzupełniają kwotę z podpowiedzianych płatności, a możesz dodać notatkę, na przykład „przelew bankowy” (do 500 znaków). Zapłać tylko część tego, co jesteś winien, a reszta zostaje na saldzie. Jeśli wpiszesz za mało albo za dużo, Side Badger ostrzeże cię przed zapisem. Rejestrowanie płatności wymaga uprawnienia do edycji wydatków, a data nie może być w przyszłości."
  - heading: "Zapłacone w innej walucie?"
    body: "Salda zostają w walucie, w której zapłacono, więc dług w euro pozostaje długiem w euro. Jesteś winien euro, a płacisz w funtach? Przelicz płatność przy wpisywaniu, po aktualnym kursie albo po kursie, który faktycznie obowiązywał. Kurs jest ustalany w chwili zapisu płatności. [Wiele walut](page:feature/multiple-currencies) opisuje, jak działa przeliczanie, a [wyjazdy grupowe](page:use-case/group-trips) pokazują je w użyciu."
  - heading: "Historia, którą możesz sprawdzić"
    body: "Każda zarejestrowana płatność zostaje w historii grupy z datą, kwotą i notatką. Tylko osoba, która zarejestrowała płatność, może ją edytować, a ona lub administrator grupy może ją usunąć. Płatność z udziałem osoby, która opuściła grupę, jest zablokowana. Przykładowy scenariusz ze współlokatorami znajdziesz u [współlokatorów](page:use-case/housemates)."
limits:
  heading: "Czego Side Badger nie robi"
  items:
    - "Side Badger nie przesyła pieniędzy, nie wysyła linków do płatności ani próśb o płatność. Płatność w aplikacji to zapis płatności dokonanej gdzie indziej."
    - "Podpowiadane płatności pochodzą z prostej metody dopasowywania, stosowanej osobno dla każdej waluty. Zawsze podpowiada mniej płatności, niż jest osób z saldem w tej walucie (przy czterech osobach najwyżej trzy), ale nie zawsze znajduje najmniejszą możliwą liczbę."
    - "Nie możesz wyłączyć podpowiedzi. **Pokaż wszystko** wyświetla każdą podpowiedzianą płatność w grupie, nie tylko twoje."
    - "Waluty nigdy nie są wzajemnie kompensowane, chyba że wydatki przeliczono przy wpisywaniu."
    - "Nie ma przypomnień, więc ponaglanie z płatnością nadal zależy od ciebie."
useCasesHeading: "Gdzie rozliczanie ma znaczenie"
faq:
  heading: "Pytania"
  items:
    - q: "Czy Side Badger wysyła pieniądze?"
      a: "Nie. Płaćcie sobie, jak chcecie, a potem zarejestruj płatność w Side Badger, żeby saldo się zaktualizowało."
    - q: "Czy mogę wyłączyć podpowiadane płatności?"
      a: "Nie. Uproszczenie zostaje włączone, a **Pokaż wszystko** wyświetla każdą podpowiedzianą płatność w grupie, nie tylko te, które cię dotyczą."
    - q: "Dlaczego euro i funty są osobno?"
      a: "Salda zostają w walucie, w której zapłacono, chyba że przeliczysz przy wpisywaniu wydatku albo płatności. Długi w różnych walutach nigdy nie są wzajemnie kompensowane."
    - q: "Co, jeśli ktoś płaci tylko część tego, co jest winien?"
      a: "Zarejestruj zapłaconą część. Reszta zostaje na saldzie, dopóki nie zostanie zapłacona."
    - q: "Czy to zawsze najmniejsza możliwa liczba płatności?"
      a: "Nie jest to gwarantowane. Zawsze podpowiada mniej płatności, niż jest osób z saldem w tej walucie, więc przy czterech osobach nigdy nie więcej niż trzy. W przykładzie ze współlokatorami to dwie płatności, tam gdzie oddawanie pieniędzy każdej osobie z osobna wymagało sześciu."
