meta:
  title: "Cara membagi sewa menurut ukuran kamar | Side Badger"
  description: "Kamar lebih besar, bagian lebih besar. Sisihkan ruang bersama, bagi sisanya menurut luas lantai, masukkan persentase sekali. Hitungan untuk tiga orang."
h1: "Cara membagi sewa menurut ukuran kamar"
navLabel: "Sewa menurut ukuran kamar"
lead: "Tentukan berapa bagian sewa yang membayar ruang bersama dan bagi bagian itu rata, lalu bagi sisanya menurut luas lantai tiap kamar tidur. Bulatkan ke persentase bulat, masukkan sekali pada sewa di Side Badger, dan salin pengeluarannya tiap bulan."
cta:
  heading: "Masukkan sewa sekali saja"
  body: "Buat akun gratis, mulai grup untuk apartemen, dan masukkan sewa dengan persentase yang sudah Anda sepakati. Bulan depan tinggal salinan. Ingin melihat gambaran dulu? Lihat [cara kerja](page:how-it-works) atau [apa saja yang gratis](page:pricing)."
sections:
  - heading: "Tiga orang, satu apartemen, satu perdebatan"
    body: "Priya, Tom, dan Aisha berbagi apartemen dengan sewa £1.950 sebulan. Selama setahun mereka membaginya tiga sama rata, karena itu mudah. Lalu Aisha mengukur kamarnya. Kamar Priya 16 m², kamar Tom 12 m², dan kamar Aisha 10 m², jadi Aisha membayar sama seperti Priya untuk kamar yang lebih dari sepertiga lebih kecil. Tak ada yang bersikap tidak masuk akal. Tak ada yang menghitung. Sambil menyantap makanan bungkus, mereka lebih dulu menyepakati satu aturan. Dari sewa, 40% membayar dapur, kamar mandi, dan ruang tamu, yang dipakai ketiganya."
  - heading: "Metodenya, lengkap dengan hitungannya"
    body: "Empat langkah, satu meteran, dan kalkulator ponsel."
    items:
      - "**Sisihkan bagian bersama.** Grup menyepakati porsi sewa untuk ruangan yang dipakai semua orang. Untuk apartemen ini 40%, yaitu 13,33% per orang di antara tiga orang."
      - "**Bagi sisanya menurut luas lantai.** Sisa 60% dibagi menurut ukuran kamar tidur. Luas kamar tidur totalnya 38 m² (16 + 12 + 10), jadi bagian Priya adalah 60% × 16/38, yaitu 25,26%."
      - "**Jumlahkan kedua bagian.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, ditambah 13,33% jadi 32,3%. Aisha: 60% × 10/38 = 15,79%, ditambah 13,33% jadi 29,1%."
      - "**Bulatkan dan periksa.** Persentase bulat lebih mudah diketik dan lebih mudah diperdebatkan, jadi 38,6% menjadi 39%, 32,3% menjadi 32%, dan 29,1% menjadi 29%. Periksa bahwa 39 + 32 + 29 sama dengan 100. Jika pembulatan Anda jatuh di 99 atau 101, grup menyepakati angka siapa yang bergeser satu poin."
  - heading: "Membaca satu bulan di apartemen"
    body: "Sewa dengan 39%, 32%, dan 29% menjadi £760,50, £624,00, dan £565,50. Priya membayar pemilik apartemen, jadi sepanjang bulan ini ia dihutangi £1.142,50, sedangkan Tom berutang £566,00 dan Aisha berutang £576,50. Side Badger menyarankan dua pembayaran, keduanya kepada Priya."
  - heading: "Siapkan di Side Badger"
    body: "Satu malam, sebagian besar habis untuk membahas angka 40%."
    items:
      - "**Buat grupnya.** Di dasbor pilih **Buat Grup** dan beri nama sesuai apartemennya. Pilih **Undang Orang Lain** dan kirim tautan atau kode QR. Semua orang masuk atau membuat akun gratis, lalu memilih nama yang ingin ditampilkan di grup ini."
      - "**Tambahkan sewa.** Pilih **Tambah Pengeluaran**. Isi deskripsi dan jumlahnya, lalu di bawah **Siapa yang membayar?** pilih orang yang membayar pemilik apartemen. Biarkan ketiga orang tetap di bawah **Dibagi antara**, lalu di bawah **Cara membagi** pilih **Persentase** dan ketik 39, 32, dan 29. Formulir memberi tanda jika total persentasenya bukan 100. Pilih **Simpan Pengeluaran**."
      - "**Tambahkan tagihan.** Tagihan energi dan internet adalah pengeluaran terpisah dengan pembayarnya masing-masing. Biarkan **Cara membagi** tetap di **Rata**."
      - "**Salin bulan depan.** Buka sewa bulan lalu dan pilih **Salin pengeluaran**. Salinannya mempertahankan pembayar, jumlah, dan pembagiannya, lalu memakai tanggal hari ini. Ubah jumlahnya jika sewa berubah, kemudian pilih **Buat Salinan**."
      - "**Periksa siapa berutang kepada siapa.** Bagian **Saldo** menunjukkannya. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya di bawah **Lunasi**."
  - heading: "Kamar dengan kamar mandi dalam, kamar sempit, dan penghuni yang pindah"
    items:
      - "**Kamar dengan kamar mandi dalam dan kamar sempit.** Luas lantai hanyalah titik awal. Kamar dengan kamar mandi sendiri lebih bernilai daripada kamar seluas itu tanpa kamar mandi, dan kamar sempit yang hanya muat satu kasur dan satu kursi penuh harapan nilainya lebih rendah. Sesuaikan persentasenya lewat kesepakatan, periksa bahwa totalnya tetap 100, dan tulis angka akhirnya di tempat yang bisa dilihat seisi apartemen."
      - "**Seseorang pindah di tengah bulan.** Hitung berapa yang harus dibayar tiap orang untuk bulan itu, lalu masukkan sewa bulan itu dengan **Jumlah pasti**, bukan **Persentase**. Jumlahnya harus sama dengan sewa. Lakukan sebelum mereka pergi. Tidak ada yang bisa keluar dari grup selagi berutang atau dihutangi, dan pengeluaran yang melibatkan orang yang sudah keluar menjadi hanya-baca."
      - "**Seseorang pindah masuk.** Ukur lagi, hitung ulang dengan ukuran kamar yang baru, dan pakai persentase baru mulai sewa berikutnya. Bulan-bulan sebelumnya tetap seperti semula."
  - heading: "Yang tidak dilakukan Side Badger di sini"
    items:
      - "Side Badger tidak mengukur kamar Anda atau memilih persentasenya. Luas lantai dan angka 40% adalah urusan yang disepakati grup."
      - "Tidak ada tagihan berulang, jadi Anda menyalin sewa bulan lalu setiap kali."
      - "Side Badger tidak pernah memindahkan uang dan tidak membayar pemilik apartemen. Anda saling membayar dengan cara apa pun yang disuka, lalu mencatatnya."
      - "Side Badger tidak tahu isi perjanjian sewa Anda. Ia hanya menjaga hitungan antara orang-orang di grup."
