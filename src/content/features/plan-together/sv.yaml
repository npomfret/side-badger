meta:
  title: Delade listor, omröstningar och kommentarer | Side Badger
  description: Kommentera utgifter, ifrågasätt den konstiga, för en gemensam inköpslista och rösta om villan. Planera utgifterna tillsammans och dela dem sedan. Gratis, utan annonser.
h1: Planera tillsammans, dela efteråt
navLabel: Planera tillsammans
lead: Inköpslistan och inköpsnotan, äntligen på talfot. Side Badger ger gruppen en plats att prata om pengarna både före och efter att de är spenderade, med kommentarer på varje utgift, ett sätt att ifrågasätta de som ser fel ut, delade listor och omröstningar för de stora besluten. Sedan [delar du utgifter](page:feature/split-expenses) som vanligt.
cta:
  heading: Planera först, dela sedan
  body: Skapa ett gratis konto, starta en grupp och lägg den första listan, omröstningen eller frågan precis bredvid pengarna. Osäker på vad som händer sen? Se [så fungerar det](page:how-it-works).
problem:
  heading: Chatten finns här, notan finns där
  body: Gruppens utgifter brukar bo på två ställen. Siffrorna finns på ett, och grälet om siffrorna i en chatt som rullade förbi i tisdags. Inköpslistan är ett foto av ett kylskåp. Villan avgjordes av en tummen upp från de flesta, förmodligen. Side Badger håller planeringen i gruppen, bredvid utgifterna den handlar om, så det finns en kommentar där kostnaden är, en lista där inköpet är, en omröstning för det stora beslutet och ett sätt att säga "vänta, stämmer det här?" utan att skriva ett stycke. Allt handlar om gruppens pengar, vilket är det gruppen finns till för.
workflow:
  heading: Från villaomröstning till inköpsnota
  steps:
    - title: Låt det stora beslutet gå till omröstning
      body: Lägg till en omröstning om beslutet som avgör notan, till exempel vilken villa. Välj två till tio alternativ, ange hur många röster var och en får och stäng den när alla har röstat, så markeras vinnaren.
      shot: S17
      shotAlt: En stängd omröstning där det vinnande alternativet är markerat och antalet röster står bredvid varje alternativ
    - title: Skriv inköpslistan tillsammans
      body: Starta en delad lista, lägg till varorna och bocka av dem när de hamnar i vagnen. Inköpet läggs sedan in som en utgift.
      shot: S16
      shotAlt: En delad inköpslista där några varor är avbockade, med en framstegsräknare
    - title: Prata om kostnaden där den finns
      body: Kommentera själva utgiften, bifoga kvittot och reagera med en emoji. Samtalet stannar bredvid siffran det handlar om.
      shot: S08
      shotAlt: En utgift med sina detaljer, ett miniatyrkvitto, en kommentarstråd och emojireaktioner
    - title: Ifrågasätt den som ser konstig ut
      body: Om gruppen har slagit på frågor om utgifter kan alla som ingår i en utgift välja **Jag har en fråga**. Utgiften hålls utanför saldona tills frågan är avklarad.
      shot: S18
      shotAlt: Utgiftslistan med ett märke för Ifrågasatt och filtret Endast ifrågasatt
    - title: Se vad som ändrats, och vem som ändrade
      body: Aktivitetsflödet och aviseringsklockan visar vad som är nytt i dina grupper. Pushaviseringar finns om du vill ha dem.
      shot: S19
      shotAlt: Aviseringsrutan med en lista över senaste aktivitet
