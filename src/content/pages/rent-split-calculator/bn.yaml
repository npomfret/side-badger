faq:
  heading: "প্রশ্ন"
  items:
    - q: "কোনটা বেশি ন্যায্য, ঘরের আকার না আয়?"
      a: "কোনোটাই সবসময় বেশি ন্যায্য নয়। যারা নিজেদের শোওয়ার জায়গার জন্য টাকা দেয়, সেই ফ্ল্যাটমেটদের জন্য ঘরের আকার মানানসই। দম্পতি আর খুব আলাদা বেতনের বন্ধুদের জন্য আয় মানানসই। প্রথম ভাড়ার দিনের আগে ঠিক করুন, পরে নয়।"
    - q: "বিলগুলোও কি একই ভাবে ভাগ করা উচিত?"
      a: "ফ্ল্যাটমেটদের ক্ষেত্রে সাধারণত না। বিদ্যুৎ আর ব্রডব্যান্ড সবাই ব্যবহার করে, তাই সমান ভাগই সহজ, যেমন উদাহরণে। আয় ধরে ভাগ করলে ক্যালকুলেটর বিলগুলোকে ভাড়ার একই ভাগে ভাগ করে।"
    - q: "আমি কি বর্গফুট ব্যবহার করতে পারি?"
      a: "হ্যাঁ। ft² বেছে নিয়ে আয়তনগুলো বর্গফুটে লিখুন। একক শুধু একটি লেবেল, আর সবাই একই একক ব্যবহার করলে ভাগগুলো একই আসে।"
    - q: "ক্যালকুলেটরটি কি বিনামূল্যে?"
      a: "হ্যাঁ। বিনামূল্যে। কোনো বিজ্ঞাপন নেই। দৈনিক কোনো সীমা নেই। অ্যাকাউন্টও লাগে না।"
