sections:
  - heading: "عملة واحدة للمجموعة كلها"
    body: "إذا كانت مجموعتك تفضّل ألّا تفكر في الأمر، فاختر عملة للمجموعة ويحوّل النموذج كل مصروف جديد إليها، بسعر ما زال بإمكانك رؤيته وتغييره. ينطبق هذا على المصروفات الجديدة والمنسوخة فقط. أما التعديلات والمصروفات الموجودة فتبقى كما هي، فلا يتغير تحت قدميك شيء سُجّل من قبل."
  - heading: "عليك يورو وتدفع بالجنيه"
    body: "دفعت بالين وتسوّي بالجنيه؟ لا بأس. حين تسجّل دفعة يمكنك تحويلها أيضاً، فيدفع من عليه يورو بالجنيه ويخرج رصيد اليورو صحيحاً. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا ذلك."
  - heading: "قواعد للمجموعة"
    body: "اقصر المجموعة على العملات التي تستخدمها فعلاً، وحدّد عملة افتراضية ليفتح النموذج على العملة الصحيحة. عطلة في البرتغال لا تحتاج إلى 139 خياراً آخر بجانب فاتورة العشاء، و[حفل زفاف في الخارج](page:use-case/events-and-celebrations) يحتاج على الأرجح إلى عملتين."
limits:
  heading: "الحدود"
  items:
    - "يُثبَّت السعر عند حفظ المصروف. ولا يُعاد تقييم المصروفات القديمة أبداً."
    - "يجلب Side Badger سعراً حالياً حيثما أمكن. وليس مضموناً وجود سعر لكل زوج من العملات، ويمكنك دائماً كتابة السعر بنفسك."
    - "التحويل التلقائي للمجموعة ينطبق على المصروفات الجديدة والمنسوخة فقط، لا على التعديلات ولا على المصروفات الموجودة."
    - "لكل مصروف سقف 999,999.99 بعملته الخاصة."
    - "هناك 140 عملة. والعملات المشفّرة والمعادن ليست بينها."
    - "يسجّل Side Badger الدفعات. ولا ينقل المال ولا يصرفه أبداً."
useCasesHeading: "حيث يفيد هذا"
faq:
  heading: "أسئلة"
  items:
    - q: "أي سعر صرف تستخدمون؟"
      a: "سعر صرف حالي، يُجلب عند إدخال المصروف حيثما توفّر. ويمكنك تغييره إلى السعر الذي حصلت عليه فعلاً، فيتحدّث المبلغ المحوَّل."
    - q: "هل يُعاد تقييم المصروفات القديمة؟"
      a: "لا. يُثبَّت السعر عند حفظ المصروف، فلا ينحرف الرصيد لمجرد أن السوق تحرّك."
    - q: "هل تدعمون العملات المشفّرة؟"
      a: "لا. هناك 140 عملة، والعملات المشفّرة ليست بينها."
    - q: "لماذا لا أستطيع إدخال 2,000,000 روبية إندونيسية؟"
      a: "لكل مصروف سقف 999,999.99 بعملته الخاصة. أدخله بعملة أخرى وحوّل، أو قسّمه إلى مصروفين."
    - q: "هل يكلّف التحويل شيئاً؟"
      a: "لا. التحويل مجاني، مثل بقية Side Badger. انظر [الأسعار](page:pricing)."
    - q: "هل عليّ أن أحوّل؟"
      a: "لا. تبقى العملات منفصلة ما لم تختر أنت أو مجموعتك التحويل، ولكل عملة قائمتها القصيرة من الدفعات."
