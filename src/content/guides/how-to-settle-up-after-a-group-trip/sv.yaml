faq:
  heading: Frågor
  items:
    - q: Vem ska registrera en betalning, den som betalar eller den som får betalt?
      a: Att registrera en betalning kräver behörighet att redigera utgifter, och formuläret frågar **Vem betalade?** och **Vem tog emot betalningen?** Bara den som registrerade den kan redigera den senare, så det är oftast enklast om betalaren gör det med snabbregleringsknappen.
    - q: Vad om resan gick i två valutor?
      a: Saldon förs per valuta, så en skuld i euro förblir en skuld i euro och varje valuta får sin egen korta lista, om inte utgifterna räknades om när de lades in. [Flera valutor](page:guide/how-to-split-a-trip-paid-in-several-currencies) visar båda sätten.
    - q: Ska vi göra upp under resan eller i slutet?
      a: Båda fungerar. Varje registrerad betalning ändrar saldona, så en betalning under resan räknas med i den slutliga listan. I slutet är enklare, eftersom [hela resan](page:use-case/group-trips) finns på ett ställe.
