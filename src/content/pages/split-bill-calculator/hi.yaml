meta:
  title: "बिल बांटने का कैलकुलेटर: किसे किसका देना है | Side Badger"
  description: "किसने दिया, किसे देना है, कौन किसे देगा: सेकंडों में तय। बराबर, सटीक राशि या प्रतिशत से बांटें। मुफ्त, आपके ब्राउज़र में, और कुछ सेव या भेजा नहीं जाता।"
h1: "बिल बांटने का कैलकुलेटर"
navLabel: "बिल बांटने का कैलकुलेटर"
lead: "बस डालें कि किसने किस चीज़ के लिए पेमेंट किया, और कैलकुलेटर बता देगा कि किसे किसका देना है, साथ में हिसाब निपटाने वाली पेमेंट की एक छोटी सूची। यह आपके ब्राउज़र में चलता है, कुछ सेव नहीं करता और पैसे नहीं भेजता। अगर आपके ग्रुप को चाहिए कि हिसाब टैब बंद होने के बाद भी बचा रहे, तो Side Badger में [खर्च बांटना](page:feature/split-expenses) और [हिसाब चुकता करना](page:feature/settle-up) वही जोड़-घटाव करते हैं और उन्हें सहेजकर रखते हैं।"
cta:
  heading: "जोड़-घटाव पसंद आया? इसे रख लें।"
  body: "टैब बंद करते ही यह कैलकुलेटर सब कुछ भूल जाता है, ठीक उस इंसान की तरह जिसने पिछली बार “पक्का” पेमेंट किया था। Side Badger का ग्रुप खर्च सहेजकर रखता है, सबका बैलेंस अपडेट करता है और पेमेंट रिकॉर्ड करता है। यह मुफ्त है, कोई विज्ञापन नहीं और रोज़ाना की कोई सीमा नहीं।"
sections:
  - heading: "हिसाब कैसे निकलता है"
    body: "हर खर्च के लिए कैलकुलेटर हर व्यक्ति का हिस्सा निकालता है। आप जिन लोगों को चुनें, उनके बीच उसे बराबर, सटीक राशि या प्रतिशत से बांट सकते हैं। फिर हर व्यक्ति का बैलेंस वही है जो उसने दिया, उसमें से वह घटाकर जो उसे देना है। प्लस का निशान बताता है कि ग्रुप को उसे देना है, और माइनस का निशान बताता है कि उसे ग्रुप को देना है। बैलेंस का जोड़ हमेशा शून्य रहता है, क्योंकि एक व्यक्ति को जो मिलना है, वह बाकी लोगों को देना है।"
  - heading: "पेमेंट की सूची छोटी क्यों होती है"
    body: "हर रसीद को अलग-अलग निपटाने की किसी को ज़रूरत नहीं। हर बैलेंस पता चलते ही कैलकुलेटर सबसे ज़्यादा देने वाले को सबसे ज़्यादा पाने वाले से मिलाता है, एक पेमेंट में जितना निपट सकता है उतना निपटाता है, और सूची में आगे बढ़ता जाता है जब तक सब शून्य पर न आ जाएं। इसमें ज़्यादा से ज़्यादा उतने पेमेंट लगते हैं जो बैलेंस वाले लोगों की गिनती से एक कम हों, और बिल-दर-बिल निपटाने के मुकाबले अक्सर उससे भी कम लगते हैं। यह पेमेंट की एक छोटी सूची देता है, पर यह वादा नहीं करता कि वह सबसे छोटी संभव सूची है।"
  - heading: "कैलकुलेटर क्या नहीं करता"
    items:
      - "**एक से ज़्यादा करेंसी संभालना।** एक करेंसी चुनें और पूरे हिसाब में वही इस्तेमाल करें। ऐप हर करेंसी का अलग बैलेंस रखता है, और किसी खर्च को मौजूदा एक्सचेंज रेट पर बदल सकता है, जिसे आप बदल सकते हैं।"
      - "**कुछ सेव करना।** टैब बंद करते ही आंकड़े चले जाते हैं। उन्हें रखने के लिए लिंक कॉपी करें। उसमें आपके आंकड़े # के बाद रहते हैं, जिसे आपका ब्राउज़र कभी सर्वर को नहीं भेजता, और आप जिसे भी वह लिंक भेजें वह उन्हें पढ़ सकता है।"
      - "**पैसे भेजना।** यह बताता है कि कौन किसे पेमेंट करे। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं, फिर अगर आपका ग्रुप हिसाब ऐप में रखता है तो वहां पेमेंट रिकॉर्ड करें।"
      - "**बचा हुआ पैसा रैंडम तरीके से किसी को देना।** जब बिल ठीक से नहीं बंटता, तो बचे हुए पैसे सूची के पहले लोगों को जाते हैं, ताकि कुल जोड़ सही रहे। ऐप में बचा हुआ पैसा किसी एक व्यक्ति को रैंडम तरीके से जाता है, इसलिए हर बार एक ही को नहीं।"
      - "**सीमाओं के पार जाना।** कैलकुलेटर में 2 से 20 लोग हो सकते हैं, और एक खर्च 999,999.99 तक का हो सकता है, जैसा ऐप में है।"
