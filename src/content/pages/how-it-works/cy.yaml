sections:
  - heading: "39 iaith, ac wedi'i adeiladu i fwy o bobl"
    body: "Defnyddiwch Side Badger mewn 39 iaith, gan gynnwys Arabeg, Perseg ac Wrdw, sy'n cael eu hysgrifennu o'r dde i'r chwith. Gall pawb yn y grŵp ddewis eu hiaith eu hunain, felly gall tudalen y grŵp fod yn Arabeg i un person ac yn Saesneg i'r nesaf. Mae hefyd wedi'i adeiladu gyda defnyddwyr bysellfwrdd a darllenwyr sgrin mewn golwg, ac mae lliwiau aelodau yn dod â phatrymau, fel nad oes rhaid i chi wahaniaethu gwyrdd oddi wrth goch."
faq:
  heading: "Cwestiynau"
  items:
    - q: "Oes angen cyfrif ar bawb?"
      a: "Oes, un am ddim. Mae pob person yn gwirio ei e-bost cyn ychwanegu unrhyw beth."
    - q: "Oes ap?"
      a: "Mae'n rhedeg yn y porwr. Mewngofnodwch, yna ychwanegwch ef at eich sgrin gartref neu ddoc fel ei fod yn agor fel ap. Mae Gosodiadau yn yr ap yn dangos i chi sut. Does dim fersiwn siop apiau a dim modd all-lein."
    - q: "Ydy Side Badger yn symud arian?"
      a: "Nac ydy. Mae'n cadw'r cyfrif ac yn awgrymu taliadau, ac rydych chi'n talu eich gilydd sut bynnag y dymunwch. Yna rydych yn cofnodi'r taliad. Gweler [setlo](page:feature/settle-up)."
    - q: "A all rhywun adael tra mae mewn dyled?"
      a: "Na. All neb adael grŵp tra byddan nhw mewn dyled neu fod arian yn ddyledus iddyn nhw, felly maen nhw'n setlo gyntaf."
    - q: "Faint o bobl all ymuno â grŵp?"
      a: "Hyd at 50 o bobl mewn grŵp. Gwahoddwch nhw gyda dolen neu god QR, a throwch gymeradwyaeth ymlaen os ydych am i weinyddwr adael pob person i mewn."
    - q: "Beth am deithiau gyda mwy nag un arian cyfred?"
      a: "Cedwir balansau ar wahân ar gyfer pob arian cyfred. Gweler [arian cyfred lluosog](page:feature/multiple-currencies)."
