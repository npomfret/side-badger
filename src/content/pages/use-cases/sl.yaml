meta:
  title: "Side Badger za sostanovalce, potovanja in zabave"
  description: "Deli stroške s sostanovalci, na skupinskih potovanjih in za zabave, poroke in skupna darila. Poglej, kaj Side Badger naredi za vsako vrsto skupine."
h1: "Side Badger za tvojo vrsto skupine"
navLabel: "Primeri uporabe"
lead: "Sostanovalci, počitnice, poslovilni večeri. Izberi svoj kaos, nato poglej, kako skupina, kot je tvoja, vodi štetje."
intro: "Vsaka skupina deli stroške nekoliko drugače. Te strani sledijo **realističnemu scenariju** od prvega stroška do zadnjega zabeleženega plačila, s prikazanimi izračuni, da vidiš, kaj bi na koncu dobila tvoja skupina."
cta:
  heading: "Ali prepoznaš svojo vrsto skupine?"
  body: "Ustvari uporabniški račun, ustanovi skupino in dodaj prvi strošek. Vzame nekaj minut."
cardsHeading: "Izberi situacijo, ki je najbližja tvoji"
sections:
  - heading: "Skupinska potovanja"
    body: "Leti v funtih, vila v evrih in večerja, ki so jo jedle samo tri osebe. Skupino nastavi na pretvorbo v funte in štirje prijatelji v Lizboni končajo s tremi plačili namesto šestimi, ko so valute ločene. [Deli stroške skupinskega potovanja](page:use-case/group-trips)."
  - heading: "Sostanovalci"
    body: "Ena oseba plača gospodarju, druga se spomni računa za energijo in nihče se ne strinja, kdo je kupil toaletni papir. Pri najemnini, razdeljeni po velikosti sobe, in drugih računih, razdeljenih enako, štirje sostanovalci mesec končajo s tremi plačili, vsemi tistemu, ki je plačal najemnino. [Deli gospodinjske račune s sostanovalci](page:use-case/housemates)."
  - heading: "Zabave, poroke in skupna darila"
    body: "Šest ljudi glasuje o darilu, eden ga kupi in vsi ne prispevajo enake vsote. Darilo za 150 £, razdeljeno po točnih zneskih, pusti pet plačil osebi, ki ga je kupila, skupaj 120 £. [Deli stroške dogodka](page:use-case/events-and-celebrations)."
  - heading: "Pari"
    body: "Deli dolgočasne stroške, ne da bi zmenek spremenil v četrtletni finančni pregled. Najemnina, razdeljena 60/40, in živila, razdeljena enako, se zvedejo na eno plačilo med vama. [Deli stroške kot par](page:use-case/couples)."
  - heading: "Najprej poglej, kako deluje"
    body: "Vsi zgornji primeri uporabljajo iste korake, od ustanovitve skupine do beleženja plačil. [Kako deluje](page:how-it-works) jih predstavi, [vodniki](page:guides) obdelajo po eno zapleteno situacijo, [cenik](page:pricing) pa pove, koliko stane, kar je nič, brez oglasov in brez dnevnih omejitev."
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali vsak v skupini potrebuje uporabniški račun?"
      a: "Da. Ljudje se pridružijo s povezavo ali kodo QR in brezplačnim uporabniškim računom."
    - q: "Ali lahko Side Badger zbira denar?"
      a: "Ne. Plačaš, kakor želiš, nato plačilo zabeležiš, da stanja ostanejo pravilna."
    - q: "Ali moram izbrati eno vrsto skupine?"
      a: "Ne. Primeri uporabe so primeri, ne nastavitve. Vsaka skupina ima enake funkcije, zato uporabi tisto kombinacijo, ki ti ustreza."
