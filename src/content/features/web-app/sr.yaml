meta:
  title: "Апликација за дељење рачуна без преузимања | Side Badger"
  description: "Телефон ти је пун, схватамо. Side Badger ради у прегледачу, без продавнице апликација и преузимања. Додај га на почетни екран и отвара се као апликација."
h1: "Без продавнице апликација. Без преузимања. Ипак као апликација"
navLabel: "Веб апликација"
lead: "Side Badger живи у твом прегледачу. Нема продавнице апликација коју треба претраживати и ничега што прво треба преузети. Пријави се на телефону или рачунару, дели трошкове онлајн са групом и додај га на почетни екран или у Dock кад га желиш на један додир."
cta:
  heading: "Отвори. Пријави се. Оснуј групу."
  body: "Направи налог, оснуј групу и додај први трошак, све из прегледача који већ имаш отворен. Желиш прво обилазак? Погледај [како функционише](page:how-it-works) или [шта покрива бесплатно](page:pricing)."
problem:
  heading: "Телефон ти је пун. Схватамо."
  body: "Негде на њему је четири хиљаде слика истог заласка сунца и упозорење о меморији које одгуруваш од пролећа. Последње што му треба је још једна апликација, само да се подели једна вечера. Зато је Side Badger веб апликација. Ради у савременом прегледачу на телефону или рачунару. На телефону користи мобилне распореде, са страницом групе подељеном на картице и контролама прилагођеним додиру. Неки додаци, као што је додавање на почетни екран, зависе од твог прегледача, и кажемо где."
workflow:
  heading: "Од картице прегледача до почетног екрана у три корака"
  steps:
    - title: "Отвори и пријави се"
      body: "Иди на Side Badger у свом прегледачу и пријави се. Све што ти треба је адреса е-поште и лозинка, а адресу потврђујеш пре него што можеш било шта да додаш. Свако у групи треба налог, па ће и људи које позовеш урадити исто."
    - title: "Додај га на почетни екран или у Dock"
      body: "Кад си пријављен, апликација нуди да се сама инсталира. Добијаш дугме **Инсталирај** где прегледач то дозвољава, а **Покажи како** где не дозвољава. Пропустио си или одбио? **Подешавања** имају исту помоћ под **Додај на почетни екран или у Dock**. На iPhone-у или iPad-у, подешавања прво показују кораке за iPhone, а остале уређаје склањају под **Други уређаји**. Тако или тако, апликација се затим отвара у сопственом прозору."
      shot: S20
      shotAlt: "Одељак Додај на почетни екран или у Dock у подешавањима, са корацима за додавање апликације на уређај"
    - title: "Укључи обавештења, ако желиш"
      body: "Обавештења су искључена док их не укључиш, а сваки уређај се укључује посебно. Користи дугме **Укључи** које нуди звонце обавештења, или прекидач **Push обавештења** у **Подешавањима**. На iPhone-у или iPad-у прво отвори апликацију са почетног екрана. То је једино место где тамо раде обавештења."
      shot: S19
      shotAlt: "Отворен падајући списак обавештења са недавним активностима у групи"
options:
  heading: "Како да је додаш, уређај по уређај"
  items:
    - title: "iPhone и iPad"
      body: "Додирни дугме за дељење, квадрат са стрелицом нагоре. Ако га не видиш, прво додирни три тачке (•••), па дељење. Помери надоле и додирни **Додај на почетни екран**. Остави укључено **Отвори као веб апликацију**, па додирни **Додај**. Ако се веза отворила унутар друге апликације, прво отвори страницу у Safari-ју, јер тај уграђени прегледач не може да је дода."
    - title: "Андроид"
      body: "Отвори мени прегледача и изабери **Додај на почетни екран** или **Инсталирај апликацију**."
    - title: "Chrome или Edge на рачунару"
      body: "Отвори мени прегледача и изабери опцију за инсталирање овог сајта као апликације. Тада добија сопствени прозор и сопствену иконицу."
    - title: "Safari на Mac-у"
      body: "Изабери **Датотека**, затим **Додај у Dock**."
sections:
  - heading: "Обавештења, само ако их затражиш"
    body: "Push обавештења су изборна. Укључи их и добијаш обавештење кад у твојим групама има нове активности, на пример кад неко дода трошак, остави коментар или забележи уплату. Укључују се један по један уређај, са звонцета обавештења или из **Подешавања**, и тамо их можеш поново искључити. Потребан је прегледач који их подржава и твоја дозвола. Ако их је твој прегледач блокирао за сајт, прво их дозволи у подешавањима прегледача. На iPhone-у или iPad-у раде само из апликације додате на почетни екран, а не из картице прегледача. Испорука није загарантована, зато обавештење сматрај подсетником, а не обећањем. О томе шта се појављује у дневнику, види [планирање заједно](page:feature/plan-together)."
  - heading: "Ажурирање уживо, без дугмета за освежавање"
    body: "Додај трошак и сви га виде одмах, заједно са тим шта се променило и ко је то променио. Свака група чува историју активности, а звонце обавештења показује активност из свих твојих група. Нико не мора да пита јеси ли видео оно што си управо додао. Већ је на њиховом екрану."
  - heading: "39 језика, сваки човек свој"
    body: "Користи Side Badger на 39 језика, укључујући арапски, персијски и урду који се пишу здесна налево. Свако у групи бира свој, па иста страница групе може бити на арапском за једну особу и на енглеском за следећу. Једино око чега група мора да се сложи су бројеви."
  - heading: "Направљено за више врста корисника"
    body: "Side Badger је прављен имајући на уму кориснике тастатуре и читача екрана. Боје чланова долазе са шарама, па не мораш да разликујеш зелену од црвене."
    items:
      - "Везе за прескакање, да корисници тастатуре скоче право на садржај."
      - "Дијалози управљају фокусом тастатуре."
      - "Контроле имају ознаке, за читаче екрана."
      - "Распореди се окрећу за језике који се пишу здесна налево."
limits:
  heading: "Шта веб апликација не ради"
  items:
    - "Нема коришћења ван мреже. Side Badger треба везу, па неће отворити твоју групу у авиону без wifi-ја."
    - "Нема апликације из продавнице нити изворне апликације за iPhone или Android. Side Badger је веб апликација, а додавање на почетни екран или у Dock је начин да добијеш верзију налик апликацији."
    - "Додавање на почетни екран или у Dock зависи од твог прегледача. Називи менија се разликују између прегледача и верзија, а неки прегледачи то не нуде."
    - "Push обавештења се бирају за сваки уређај и потребан је прегледач који их подржава и твоја дозвола. На iPhone-у или iPad-у раде само из апликације додате на почетни екран. Испорука није загарантована."
    - "Нема обавештења е-поштом или СМС-ом и нема подсетника за уплате. Нова активност се види у апликацији, а као push обавештење ако их укључиш. Јурење уплате је и даље на теби."
    - "Активност се чува 90 дана."
    - "Пријављујеш се адресом е-поште и лозинком. Нема Google или Apple пријаве, а потребно је да имаш 18 или више година."
    - "Не тврдимо да је Side Badger потпуно приступачан, нити да испуњава формални стандард приступачности. Ако ти нешто смета, јави нам из саме апликације и тамо ћеш видети наш одговор."
useCasesHeading: "Где помаже што ти не треба апликација"
faq:
  heading: "Питања"
  items:
    - q: "Постоји ли Side Badger апликација у продавници апликација?"
      a: "Не. Side Badger је веб апликација. Отвараш је у прегледачу и можеш да је додаш на почетни екран или у Dock да се отвара као апликација. Нема ничега за преузимање из продавнице апликација."
    - q: "Могу ли да делим рачуне без преузимања апликације?"
      a: "Да. Отвори Side Badger у прегледачу на телефону или рачунару, пријави се и оснуј групу. Додавање на почетни екран или у Dock није обавезно."
    - q: "Ради ли ван мреже?"
      a: "Не. Side Badger треба везу, чак и кад је додат на почетни екран или у Dock."
    - q: "Зашто не добијам обавештења на iPhone-у?"
      a: "На iPhone-у или iPad-у обавештења раде само из апликације додате на почетни екран, а не из картице прегледача. Додај је, отвори са иконице на почетном екрану, па укључи обавештења у **Подешавањима**. Испорука није загарантована, па ако неко нестане, историја активности групе и даље показује шта је додато."
    - q: "Морам ли да укључим обавештења?"
      a: "Не. Искључена су док их не укључиш, један по један уређај. Без њих се нова активност и даље види у апликацији, а свако види промену одмах ако има отворену апликацију."
    - q: "Треба ли свако у групи налог?"
      a: "Да. Све што треба је адреса е-поште и лозинка, а адресу потврђујеш пре него што можеш било шта да додаш. Свако ко се придружи групи ради исто, на ком год телефону или рачунару жели."
