sections:
  - heading: Diruaren inguruko solasa, diruaren ondoan
    body: Dirua partekatzeak solasa, zalantzak eta planak dakartza. Side Badger-ek hirurak zenbakien ondoan gordetzen ditu, inork talde-txatean atzera korritu behar ez izateko.
    items:
      - "**Iruzkinak dagozkien lekuan.** Iruzkindu taldea bera edo edozein gastu, zerrenda edo inkesta, eta utzi elkarrizketa dagokion gauzaren ondoan."
      - "**Ordainagiriak eta argazkiak.** Gorde hiru ordainagiri arte gastu bakoitzean, eta gehitu argazkiak edo PDF-ak taldearen, zerrenda baten edo inkesta baten iruzkinei."
      - "**Galderak, ez eztabaidak.** Administratzaile batek galderak aktiba ditzake, eta orduan gastu bateko edonork galdetu dezake horri buruz. Saldoetatik kanpo geratzen da argitu arte."
      - "**Zerrendak eta inkestak.** Eduki erosketa-zerrenda partekatua erosketen tiketen ondoan, eta jarri bozketara oporretako etxearen hautagaien zerrenda, anonimoki nahi baduzu."
      - "**Txalo pixka bat.** Erreakzionatu gastuei, ordainketei eta iruzkinei, eta ospatu ordainketa bat iristen denean."
  - heading: Zure taldea, zure arauak
    body: Splitwise-ren laguntza-zentroak dio ez dituela onartzen talde-administratzailerik, ezta baimen berezirik ere. Side Badger-ek rolak eta baimenak ditu, zenbakiak txukun mantentzeko norbait behar duten taldeentzat.
    items:
      - "**Administratzaileak, kideak eta ikusleak.** Egin norbait ikusle: dena ikusten du eta ezer ez du aldatzen."
      - "**Bi aurrezarpen, edo zureak.** Hasi Lankidetza irekia edo Kudeatutako taldea aukeratuz, edo ezarri zuk baimen bakoitza: nork editatzen eta ezabatzen dituen gastuak, nork editatzen dituen zerrendak, nork gonbidatzen duen eta nork uzten dituen jende berria sartzen."
      - "**Sartzeko onarpena.** Aktibatu onarpena eta administratzaile batek sartzen utziko du pertsona bakoitza."
      - "**Taldearen beraren ezarpenak.** Mugatu benetan erabiltzen dituzun monetetara, aukeratu bere moneta lehenetsia eta jarri goiko azaleko irudi bat."
      - "**Blokeatu amaitzen denean.** Zenbakiak geldi geratzen dira administratzaile batek desblokeatu arte."
  - heading: Hemen doakoa, hor ordainpekoa
    body: Splitwise Pro Splitwise-ren ordainpeko plana da, eta bere Pro orriak Side Badger-en ezer kostatzen ez duten hiru gauza saltzen ditu.
    items:
      - "**Ordainagirien eskaneatzea.** Splitwise Pro-k zure ordainagiriaren argazkia eskaneatzen du. Side Badger-ek doan egiten du, eskaneatze-kreditu gabe: guztizkoa, data eta lekua betetzen ditu zuk egiazta ditzazun."
      - "**Moneta-bihurketa.** Splitwise Pro-k taldeko gastuak zure lehenespeneko monetara bihurtzen ditu “Convert” sakatzen duzunean. Side Badger-ek gastu bakoitza sartzen duzunean bihurtzen du, egungo kanbio-tasa batekin edo benetan lortu zenuenarekin, eta jatorrizko zenbatekoa gastuan geratzen da."
      - "**Eguneko mugarik ez.** Splitwise Pro-k gastu mugagabeak saltzen ditu, eta bere laguntza-zentroak dio doako erabiltzaileek egunean gehienez 4 gastu gehi ditzaketela. Side Badger-ek ez du eguneko mugarik."
  - heading: Zure bankua kanpoan geratzen da
    body: Side Badger ez da zure bankura konektatzen eta ez dizu zure banku-daturik eskatzen. Nork nori zor dion erregistratzen du; nahi duzun moduan ordaintzen diezu besteei, eta gero ordainketa erregistratzen duzu. Bankuko sarbide-daturik entregatu behar ez duzunez, kezka bat gutxiago.
  - heading: Aplikazio bat, zure nabigatzailean eta telefonoan
    body: Side Badger zure nabigatzailean dabil. Hasi saioa, gehitu hasierako pantailara eta aplikazio bat bezala irekitzen da. Aplikazio bera da bietan, beraz ezaugarri berri bat telefonoan izango duzu hurrengoan irekitzen duzunean, aplikazio-denda bateko eguneraketaren zain egon gabe.
  - heading: Eta sorpresa txiki batzuk
    items:
      - "**Galdetu zure laguntzaileari.** Side Badger ChatGPT eta Claude-rekin funtzionatzen du: eskatu zureari gastu bat gehitzeko, ordainagiri bat eskaneatzeko edo ordainketa bat erregistratzeko."
      - "**Bakoitza bere hizkuntzan.** Side Badger-ek 39 hizkuntza hitz egiten ditu eta pertsona bakoitzak berea aukeratzen du. Splitwise-ren hasiera orriak 7+ dio. 133 moneta ere maneiatzen ditu, nonahi doan bidaiarentzat."
      - "**Laguntza aplikazioa utzi gabe.** Trabatuta zaude edo akats bat aurkitu duzu? Esaiguzu aplikaziotik eta irakurri gure erantzuna bertan bertan."
  - heading: Splitwise-k oraindik irabazten duen tokian
    body: Nahiago dugu aplikazio egokia aukeratzea geroago jakitea baino. Zure taldeak hauetako bat behar badu, Splitwise-k badu eta Side Badger-ek ez.
    items:
      - "**Aplikazio-dendetako aplikazioak.** Side Badger zure nabigatzailean eta hasierako pantailan bizi da, ez aplikazio-dendetan."
      - "**Konexiorik gabeko modua.** Side Badger-ek konexioa behar du."
      - "**Aplikazioaren barruko ordainketak.** Herrialde batzuetan Splitwise-k dirua mugitu ere egin dezake. Side Badger-ek erregistroa bakarrik gordetzen du."
      - "**Kuoten edo artikuluen arabera banatzea.** Side Badger-ek ordaintzaile bakarra du gastu bakoitzeko, berdin, zenbateko zehatzen arabera edo ehunekoen arabera banatua. Bere ordainagirien eskaneatzeak ez ditu artikuluak pertsonei esleitzen."
      - "**Grafikoak eta lehenetsitako banaketak.** Splitwise Pro-k bi gauzak ditu. Side Badger-ek nork nori zor dion kontatzen du, eta hori da sekretu osoa."
  - heading: Zure taldea aldatzea
    body: Ez dago inportatzailerik, beraz aldatzeak hasiera berria esan nahi du. Kitatu lehenik Splitwise-n, eta gero sortu talde bat Side Badger-en eta gonbidatu denak esteka edo QR kode batekin. Taldeko guztiek doako kontu bat behar dute, eta izena emateko posta elektroniko bat besterik ez da behar.
