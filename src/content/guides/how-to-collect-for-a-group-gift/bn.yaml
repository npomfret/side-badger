faq:
  heading: "প্রশ্ন"
  items:
    - q: "চাঁদা যদি উপহারের দামের চেয়ে বেশি উঠে যায়?"
      a: "সঠিক পরিমাণগুলোর যোগফল দামের সমান হতে হবে, তাই যতক্ষণ না মেলে ততক্ষণ ভাগগুলো কমান। অথবা বাড়তি টাকা কোনো আসল জিনিসে খরচ করুন, যেমন ফুলে, আর সেটা দ্বিতীয় খরচ হিসেবে লিখুন, উদাহরণের কার্ড আর মোড়কের মতো।"
    - q: "কেউ কি গ্রুপে না ঢুকেই চাঁদা দিতে পারে?"
      a: "গোনায় ধরতে চাইলে না। ভাগে থাকা প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট থাকতে হবে আর গ্রুপে থাকতে হবে। যার কাছে শুধু নগদ আছে, তার জন্য Priya সেটা নিয়ে নিতে পারে আর গ্রুপের যা এখনও দেওয়ার বাকি, সেই অঙ্কে উপহারটা লিখতে পারে। যেমন Sam যদি তাকে £40 নগদ দেয়, Priya £200 লিখবে আর নিজের, Omar আর Lena-র মধ্যে 60, 60 ও 80-তে ভাগ করবে।"
    - q: "পোল কি প্রত্যেকের চাঁদা ঠিক করে দিতে পারে?"
      a: "না। পোল পুরো গ্রুপের জন্য একটি অঙ্ক ঠিক করে, যেমন বাজেট। প্রত্যেকের ভাগ আপনারা নিজেরা ঠিক করবেন, তারপর খরচে **সঠিক পরিমাণ** হিসেবে লিখবেন।"
