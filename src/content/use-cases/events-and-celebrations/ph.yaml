faq:
  heading: Mga tanong
  items:
    - q: Makikita ba ng mga bisita ang grupo nang hindi sumasali?
      a: Hindi. Sumasali ang mga tao gamit ang link o QR code at isang libreng account, kaya makikita nila ang grupo kapag nasa loob na sila.
    - q: Puwede bang mangolekta ng pera ang Side Badger?
      a: Hindi. Nagbibilang lang ang Side Badger at hindi ito naglilipat ng pera. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad. Libre ito, walang ad at walang pang-araw-araw na limitasyon; tingnan ang [presyo](page:pricing).
    - q: Puwede bang anonymous ang mga boto?
      a: Oo. Kapag gumawa ka ng poll, puwede mong itago kung sino ang bumoto sa ano. Maaari lang baguhin ang mga setting bago ang unang boto.
    - q: Puwede bang magkakaiba ang ambag ng mga tao?
      a: Oo. Hatiin ang gastos ayon sa eksaktong halaga, para ang bahagi ng bawat tao ay ang halagang napagkasunduan, o huwag isama ang mga hindi kasali.
    - q: Puwede bang mag-asikaso ng pera ang isang organizer?
      a: Oo. Gamitin ang managed group preset, para tanging mga creator at admin lang ang magbabago ng mga gastos at aprubahan ng mga admin ang mga bagong miyembro.
