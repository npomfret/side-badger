faq:
  heading: "Spurningar"
  items:
    - q: "Hver ætti að skrá greiðslu, sá sem borgar eða sá sem fær greitt?"
      a: "Til að skrá greiðslu þarf heimild til að breyta útgjöldum og eyðublaðið spyr **Hver greiddi?** og **Hver fékk greitt?** Aðeins sá sem skráði hana getur breytt henni síðar, svo það er yfirleitt einfaldast að sá sem borgar geri það með flýtiuppgjörshnappnum."
    - q: "Hvað ef ferðin var í tveimur gjaldmiðlum?"
      a: "Staða er haldin fyrir hvern gjaldmiðil, svo evruskuld helst evruskuld og hver gjaldmiðill fær sinn eigin stutta lista, nema útgjöld hafi verið umreiknuð þegar þau voru skráð. [Margir gjaldmiðlar](page:guide/how-to-split-a-trip-paid-in-several-currencies) sýnir báðar leiðir."
    - q: "Ættum við að gera upp á meðan á ferðinni stendur eða í lokin?"
      a: "Hvort tveggja gengur. Hver skráð greiðsla breytir stöðunni, svo greiðsla sem er gerð um miðja ferð telst með í lokalistanum. Í lokin er einfaldara, því [öll ferðin](page:use-case/group-trips) er á einum stað."
