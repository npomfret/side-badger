meta:
  title: "قسّم فواتير المنزل مع زملاء السكن"
  description: "قسّم الإيجار بحسب مساحة الغرفة، وتقاسموا الطاقة والبقالة بالتساوي، واعرف من يدين لمن كل شهر. طريقة مجانية لزملاء السكن ليحتفظوا بالحساب."
h1: "قسّم فواتير المنزل مع زملاء السكن"
navLabel: "زملاء السكن"
lead: "لزميل السكن الذي يشتري ورق التواليت، ولزملاء السكن الذين لا يرون ذلك يحدث أبداً. يحتفظ Side Badger بحساب واحد جارٍ للإيجار والفواتير والتسوق **لزملاء السكن في المنزل الواحد**، فلا يضطر أحد إلى مطاردة أحد، وتعود الثلاجة مجرد ثلاجة."
cta:
  heading: "ابدأ بمنزلك أنت"
  body: "أنشئ حساباً، وأنشئ مجموعة للمنزل، وأرسل للجميع رابط الدعوة. يمكن إدخال فواتير هذا الشهر الليلة."
scenario:
  heading: "جهّز المنزل"
  body: "أنشئ مجموعة للمنزل، واختر الاسم الذي تريد أن يراه الناس فيها، وادعُ الجميع برابط أو برمز QR. يمكن أن تكون المجموعة مفتوحة، حيث يضيف الجميع ويعدّلون، أو مُدارة، حيث يحتاج الأعضاء الجدد إلى موافقة مشرف ولا يغيّر المصروفات إلا المنشئون والمشرفون، وهذا يناسب زميل السكن الذي يمسك الدفاتر. ومن أراد مراقبة الأرقام فقط فيمكن أن يكون مشاهداً، يرى كل شيء ولا يغيّر شيئاً. يرى الجميع المصروف الجديد على الفور، فتقلّ الأماكن التي يختبئ فيها «سأضيفه لاحقاً»."
sections:
  - heading: "الإيجار والفواتير"
    body: "نادراً ما ينقسم الإيجار على أربعة، لأن غرف النوم ليست متساوية. قسّمه بنسبة مئوية، فتدفع الغرفة الكبيرة أكثر وتدفع الخزانة ذات النافذة أقل. ويجب أن يكون مجموع النسب 100. والفواتير التي يستخدمها الجميع تُقسَّم بالتساوي، ويمكن استبعاد زميل السكن الذي لم يشارك في مصروف. وحين يترك التقسيم المتساوي فلساً زائداً، يذهب إلى شخص واحد عشوائياً. لا توجد فواتير متكررة، فتنسخ كل شهر إيجار الشهر الماضي وتغيّر التاريخ وتمضي."
  - heading: "التسوق المشترك"
    body: "أبقِ قائمة التسوق المشتركة في المجموعة نفسها مع فواتير التسوق، وضع علامة على البنود حين تصل إلى العربة. ومن يقوم بالتسوق يضيف إجمالي الإيصال مصروفاً ويقسّمه بالتساوي، أو بين من سيأكلون الشيء فقط. أما من يواصل شراء حليب الشوفان الذي لا يشربه غيره فيبقى شأناً يخص المنزل، لكن قائمة المصروفات ستكون دقيقة على الأقل. أذونات المجموعة تحدد من يستطيع إنشاء القوائم وتعديلها. اجمع الإيجار والفواتير والتسوق وستحصل على شهر كالذي أدناه، في منزل من أربعة: يدفع جو £2,000 إيجاراً، مقسّمة 30% و25% و25% و20% بحسب مساحة الغرف، ثم يدفع كوامي £120 للطاقة، ولينا £40 للإنترنت، ومات £80 للبقالة، وكل منها مقسّم بالتساوي. ينتهي جو بمبلغ مستحق له قدره £1,340، ويقترح Side Badger ثلاث دفعات، كلها لجو."
  - heading: "طرق عادلة لتقسيم تكاليف المنزل"
    items:
      - "**بالتساوي** يناسب ما يستخدمه الجميع بالقدر نفسه تقريباً، مثل الإنترنت ومواد التنظيف والتسوق المشترك. وهو سريع ولا يحتاج أحد إلى الجدال حول الحسابات."
      - "**بحسب مساحة الغرفة** يناسب الإيجار، لأن الغرف تختلف وكذلك ما يرضى الناس بدفعه فيها. اتفقوا على النسب مرة واحدة، حين ينتقل أحد إلى المنزل، وأعيدوا استخدامها كل شهر."
      - "**بحسب الاستخدام** يناسب الفواتير التي يستخدمها أحدهم أكثر بوضوح، مثل فاتورة تدفئة مكتب منزلي أو حساب بث لا يشاهده إلا اثنان. استبعد من لم يشارك فيه، أو أدخل مبالغ محددة لكل شخص."
      - "أياً كان اختيارك، اتفقوا عليه قبل أول فاتورة لا بعد أول خلاف، واكتبوا القاعدة في مكان يراه المنزل كله."
  - heading: "حين ينتقل أحدهم خارج المنزل"
    body: "يسوّي حسابه أولاً. لا يمكن لأحد مغادرة مجموعة ما دام عليه مبلغ أو له مبلغ، فيدفع المغادر أو يُدفع له، وتسجّلون ذلك، ثم يمضي. أبقوا المجموعة لزملاء السكن الباقين وادعوا الشخص الجديد برابط. وحين ينتهي أمر المنزل نفسه، يستطيع المشرف إقفال المجموعة ليبقى كل رقم في مكانه، أو إغلاقها نهائياً، فتصبح غير متاحة للجميع، فلا تفعل ذلك إلا حين لا يحتاج أحد إلى السجل."
