meta:
  title: "Roinn costais go cothrom, de réir suimeanna cruinne nó de réir céatadáin | Side Badger"
  description: "Roinn costas comhroinnte go cothrom, de réir suimeanna cruinne nó de réir céatadáin, agus fág amach duine ar bith nach raibh ann. Saor in aisce, gan fógraí agus gan teorainneacha laethúla."
h1: "Roinn costais go cothrom, de réir suimeanna cruinne nó de réir céatadáin"
navLabel: "Roinn costais"
lead: "Ní bhíonn gach rud 50/50. Tá Side Badger in ann déileáil leis sin. Abair cé a d'íoc, roghnaigh na daoine a roinn an costas, agus roinn é **go cothrom, de réir suimeanna cruinne nó de réir céatadáin**. Níl doicheall san áireamh."
cta:
  heading: "Roinn an chéad cheann eile i gceart"
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa agus cuir leis an gcostas a bhí tú ag iarraidh a réiteach. Nach bhfuil tú cinnte cad a tharlaíonn ina dhiaidh sin? Féach [conas a oibríonn sé](page:how-it-works), nó seiceáil [cad a chlúdaíonn saor in aisce](page:pricing)."
  button: "Cruthaigh cuntas saor in aisce"
problem:
  heading: "Ní bhíonn gach rud 50/50"
  body: "Leanann an cíos méid an tseomra. Leanann bronntanas cibé duine a gheall cad. Leanann dinnéar cibé duine a d'fhan don mhilseog. Oibríonn billí a roinnt ina leath go dtí an chéad bhille nach bhfuil mar sin, agus ansin osclaíonn duine éigin scarbhileog. Taifeadann Side Badger cé a d'íoc, cé a roinn an costas agus conas a roinntear é, ionas go dtagann na hiarmhéideanna amach i gceart gan aon duine ag déanamh roinnt fhada ag an mbord."
workflow:
  heading: "Costas a chur leis, ó thús deireadh"
  steps:
    - title: "Abair cé a d'íoc agus as cad"
      body: "Cuir isteach an tsuim, cur síos gearr agus an duine a d'íoc. Íocann duine amháin as gach costas, rud a choinníonn an uimhríocht macánta."
      shot: S05
      shotAlt: "An fhoirm costais le cíos teachín roinnte de réir céatadáin idir triúr"
    - title: "Roghnaigh an roinnt"
      body: "Roghnaigh go cothrom, suimeanna cruinne nó céatadáin. Caithfidh na céatadáin 100 a bhaint amach le chéile, agus caithfidh na suimeanna cruinne an t-iomlán a bhaint amach."
      shot: S06
      shotAlt: "An fhoirm costais le suimeanna cruinne curtha isteach do gach duine ar bhronntanas"
    - title: "Cuir an scéal leis"
      body: "Socraigh an dáta, cuir lipéid, áit agus nóta leis. Feiceann gach duine sa ghrúpa na sonraí céanna, agus is féidir leo trácht air ansin."
      shot: S08
      shotAlt: "Costas lena shonraí, snáithe tráchta agus an tsuim bhunaidh ar cuireadh isteach é"
    - title: "Cuir ceist má tá rud éigin as alt"
      body: "Má chuir an grúpa ceisteanna costais ar siúl, is féidir le duine ar bith atá san áireamh i gcostas ceist a chur air, agus is féidir leis an liosta costas gan ach na cinn a ceistíodh a thaispeáint."
      shot: S18
      shotAlt: "An liosta costas le suaitheantas Ceistithe agus an scagaire Ceistithe amháin"
options:
  heading: "Trí bhealach le roinnt"
  items:
    - title: "Go cothrom"
      body: "An réamhshocrú do dhinnéir, tacsaithe agus aon rud a roinn gach duine go cothrom. Mura roinneann an t-iomlán go glan, téann an phingin chorr chuig duine amháin go randamach, ní i gcónaí an duine céanna. Sa tacsaí thíos, is í Áine."
    - title: "De réir suimeanna cruinne"
      body: "Clóscríobh an méid atá dlite ag gach duine. Go maith don bhronntanas inar roghnaigh gach duine praghas difriúil, nó don siopa ina raibh níos mó i dtroilí duine amháin ná sna hearraí grósaera comhroinnte. Caithfidh na suimeanna an t-iomlán a bhaint amach."
    - title: "De réir céatadáin"
      body: "Tabhair sciar den iomlán do gach duine. Is é cíos de réir méid an tseomra an sampla clasaiceach, agus íocann an seomra is mó an sciar is mó gan aon duine ag ligean air a mhalairt."
