faq:
  heading: "Запитання"
  items:
    - q: "Чи можна поставити під питання лише мою частку?"
      a: "Ні. Запитання утримує всю витрату, для всіх, хто в ній. Якщо неправильний лише розподіл, виправлення — це редагування розподілу."
    - q: "Хто може закрити запитання?"
      a: "Той, хто його поставив, або адміністратор групи. Якщо той, хто додав витрату, не адміністратор, він не може закрити її замість запитувача."
    - q: "Чи редагування витрати стирає оригінал?"
      a: "Ні. Попередня версія зберігається. Хто може редагувати, визначають дозволи групи, тож варто спершу сказати домашнім, бо баланси зміняться."
