faq:
  heading: "자주 묻는 질문"
  items:
    - q: "사이드 배저는 Splitwise의 무료 대안인가요?"
      a: "그룹에서 비용을 나누는 용도라면 그렇습니다. 영수증 스캔, 통화 환산, 광고 없음이 무료이고 일일 한도도 없어요. 네이티브 앱, 오프라인 사용, 반복 지출, 앱 안에서의 결제가 필요하다면 Splitwise는 하고 사이드 배저는 하지 않습니다."
    - q: "Splitwise 내용은 어디서 가져왔나요?"
      a: "Splitwise 자체 페이지, 즉 홈페이지, Pro 페이지, 도움말 센터입니다. 표의 각 행은 출처 페이지로 연결되고, 표 위의 날짜는 우리가 읽은 시점을 알려 줍니다. 분기마다 다시 확인해요."
    - q: "사이드 배저는 계속 무료인가요?"
      a: "사이드 배저의 모든 기능은 오늘 기준으로 무료이고, 유료 등급은 없습니다. 이 점이 바뀌게 되면 먼저 알려 드리겠습니다. 자세한 내용은 [가격 페이지](page:pricing)에 있어요."
    - q: "그룹의 모든 사람이 옮겨야 하나요?"
      a: "네. 그룹의 모든 사람에게 무료 사이드 배저 계정이 필요하며, 링크나 QR 코드로 참여할 수 있어요."
    - q: "사이드 배저에는 모바일 앱이 있나요?"
      a: "앱 스토어에는 없어요. 브라우저에서 실행되니, 휴대폰에서 로그인한 다음 홈 화면에 추가하면 앱처럼 열립니다. 방법은 [사용 방법](page:how-it-works)에서 볼 수 있어요."
