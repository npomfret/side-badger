sections:
  - heading: "Ce que Splitwise fait bien"
    body: "Si votre groupe a besoin d'une appli native, d'un usage hors connexion ou de paiements dans l'appli, Splitwise est le choix raisonnable, et nous préférons que vous le preniez plutôt que de le découvrir plus tard. Ses propres pages énumèrent :"
    items:
      - "**Applis et usage hors connexion.** Des applis iPhone et Android en plus du web, et un mode hors connexion."
      - "**Plus de façons de partager.** Des parts, des ajustements et des partages par article, en plus des partages à parts égales, par montants exacts et par pourcentage."
      - "**Dépenses récurrentes.** Faites répéter le loyer et n'y pensez plus."
      - "**Paiements dans l'appli.** Dans certains pays, elle peut aussi faire circuler l'argent, via Splitwise Pay, Venmo, PayPal ou Pay by Bank."
  - heading: "Gratuit ici, payant là-bas"
    body: "Splitwise Pro est l'offre payante de Splitwise, et sa propre page Pro vend quatre choses qui ne coûtent rien dans Side Badger."
    items:
      - "**Scan de reçus.** Splitwise Pro scanne une photo de votre reçu. Side Badger le fait gratuitement, sans crédits de scan : il remplit le total, la date et le lieu pour que vous les vérifiiez. Les images de reçus sont lues par le service d'IA de Google."
      - "**Conversion de devises.** Splitwise Pro convertit les dépenses d'un groupe dans votre devise par défaut quand vous touchez Convertir. Side Badger convertit chaque dépense à la saisie, à un taux de change actuel ou à celui que vous avez réellement obtenu, et le montant d'origine reste sur la dépense."
      - "**Pas de publicité.** Splitwise présente une expérience totalement sans publicité comme une fonctionnalité Pro. Side Badger n'a pas de publicité."
      - "**Pas de limite quotidienne.** Splitwise Pro vend des dépenses illimitées, et son centre d'aide indique que les utilisateurs gratuits peuvent ajouter jusqu'à 4 dépenses par jour. Side Badger n'a pas de limite quotidienne."
  - heading: "Ce que Splitwise a et que Side Badger n'a pas"
    body: "Ce ne sont pas toutes les fonctionnalités de Splitwise, seulement celles qui ont tendance à faire pencher la balance. Les pages de Splitwise donnent la liste complète. Voici où Side Badger fait moins bien."
    items:
      - "**Des applis natives.** Side Badger fonctionne dans votre navigateur. Connectez-vous, puis ajoutez-le à votre écran d'accueil et il s'ouvre comme une appli."
      - "**Un mode hors connexion.** Side Badger a besoin d'une connexion."
      - "**Des paiements dans l'appli.** Side Badger ne touche jamais à votre argent. Remboursez-vous comme vous voulez, puis enregistrez le paiement."
      - "**Des dépenses récurrentes.** Side Badger n'en a pas. Copiez le loyer du mois dernier plutôt que de le retaper."
      - "**Le partage par parts ou par article.** Side Badger a un seul payeur par dépense, partagée à parts égales, par montants exacts ou par pourcentage. Son scan de reçus n'attribue pas les articles aux personnes."
      - "**Des graphiques et des partages par défaut.** Splitwise Pro a les deux. Side Badger tient le compte de qui doit quoi à qui, et c'est tout le tour de magie."
  - heading: "Déplacer votre groupe"
    body: "Il n'y a pas d'outil d'import, donc changer, c'est repartir de zéro. Réglez d'abord les comptes dans Splitwise, puis créez un groupe dans Side Badger et invitez tout le monde avec un lien ou un code QR. Chaque membre du groupe a besoin d'un compte gratuit, et il suffit d'une adresse e-mail pour s'inscrire."
