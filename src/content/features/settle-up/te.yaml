meta:
  title: "తక్కువ పేమెంట్లతో లెక్క తేల్చండి | Side Badger"
  description: "మీ గ్రూప్‌లో ఎవరు ఎవరికి బాకీనో చూడండి, అందరి లెక్క తేల్చే పేమెంట్ల చిన్న జాబితా పొందండి, ప్రతి పేమెంట్‌ను జరిగినప్పుడే రికార్డ్ చేయండి. వాడడం ఉచితం."
h1: "తక్కువ పేమెంట్లతో లెక్క తేల్చండి"
navLabel: "లెక్క తేల్చడం"
lead: "Side Badger గ్రూప్‌లో అందరికీ నడుస్తున్న బ్యాలెన్స్ ఉంచి, లెక్క తేల్చే పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది. మీరు మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుంటారు, తర్వాత దాన్ని రికార్డ్ చేస్తారు. అంకెలు ఎలా విడిపోతాయో ముందు చూడాలనుకుంటే, [ఖర్చుల పంపకం](page:feature/split-expenses)తో మొదలుపెట్టండి."
cta:
  heading: "ఎవరు ఎవరికి బాకీనో చిక్కు విప్పడానికి సిద్ధమా?"
  body: "ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి ఖర్చును జోడించండి. మిగతాది బ్యాలెన్స్‌లు చూసుకుంటాయి."
  button: "ఉచిత ఖాతా తెరవండి"
problem:
  heading: "ఎప్పటికప్పుడు అప్‌డేట్ అయ్యే బ్యాలెన్స్‌లు"
  body: "ప్రతి ఖర్చు ఎవరు ఎవరికి బాకీనో మారుస్తుంది, కాబట్టి ఖర్చులు, పేమెంట్లు జోడించినప్పుడల్లా Side Badger బ్యాలెన్స్‌లను తాజాగా ఉంచుతుంది. గ్రూప్‌లో అందరికీ మార్పు వెంటనే కనిపిస్తుంది, ఏం మారిందో, ఎవరు మార్చారో కూడా. బ్యాలెన్స్‌లు కరెన్సీ వారీగా ఉంచబడతాయి, కాబట్టి ఖర్చు నమోదు చేసినప్పుడు మార్చకపోతే యూరోలు, పౌండ్లు తమ తమ కాలమ్‌లలోనే ఉంటాయి. డిఫాల్ట్‌గా మీకు సంబంధించిన అప్పులు కనిపిస్తాయి; **అన్నీ చూపించు** మొత్తం గ్రూప్‌ది చూపుతుంది."
workflow:
  heading: "లెక్క సరిపోవడానికి మూడు దశలు"
  steps:
    - title: "ఎవరు ఎవరికి బాకీనో చూడండి"
      body: "గ్రూప్ బ్యాలెన్స్‌లు తెరిచి మీరు ఏం ఇవ్వాలో, మీకు ఏం రావాలో, అందరి లెక్క తేల్చే పేమెంట్ల చిన్న జాబితాను చూడండి, కరెన్సీ వారీగా లెక్కించినది. ప్రశ్న లేవనెత్తిన ఖర్చులు తేలే వరకు మొత్తాల నుండి బయటే ఉంటాయి. కింద ఉన్న రూమ్‌మేట్ల ఉదాహరణలో ఆరు పేమెంట్లు రెండు అవుతాయి."
      shot: S10
      shotAlt: "రెండు కరెన్సీలలో సరళీకృత అప్పులు చూపుతున్న బ్యాలెన్స్ స్క్రీన్, అన్నీ చూపించు ఆన్‌లో ఉంది"
    - title: "నచ్చిన విధంగా చెల్లించండి, తర్వాత రికార్డ్ చేయండి"
      body: "బ్యాంక్ ట్రాన్స్‌ఫర్, నగదు, గత సెలవుల నుండి ఉన్న ఒక ఉపకారం. Side Badger డబ్బును కదిలించదు. డబ్బు చేతులు మారాక, పేమెంట్‌ను రికార్డ్ చేయండి, బ్యాలెన్స్ అందరికీ అప్‌డేట్ అవుతుంది."
      shot: S11
      shotAlt: "త్వరిత సెటిల్మెంట్ బటన్లు, పాక్షిక పేమెంట్ నోటీసుతో పేమెంట్ ఫారం"
    - title: "అది చేరిందో చూడండి"
      body: "పేమెంట్ గ్రూప్ చరిత్రలోకి వెళ్తుంది, అక్కడ గ్రూప్‌లో అందరూ దాన్ని చూడవచ్చు, ఎమోజీతో రియాక్ట్ అవ్వవచ్చు. పేమెంట్ చేరినప్పుడు సంబరం చేసుకోండి."
      shot: S12
      shotAlt: "ఒక పేమెంట్‌పై ఎమోజీ రియాక్షన్లతో పేమెంట్ చరిత్ర"
