meta:
  title: "একাধিক মুদ্রায় দেওয়া ট্রিপের খরচ কীভাবে ভাগ করবেন | Side Badger"
  description: "হোটেলে পাউন্ড, রামেনে ইয়েন। প্রতিটি মুদ্রা আলাদাভাবে মেটান, অথবা চোখে দেখা যায় এমন রেটে রূপান্তর করুন। দুটি পথই অঙ্কসহ দেখানো।"
h1: "একাধিক মুদ্রায় দেওয়া ট্রিপের খরচ কীভাবে ভাগ করবেন"
navLabel: "একাধিক মুদ্রার ট্রিপ"
lead: "প্রতিটি খরচ যে মুদ্রায় দিয়েছেন সেই মুদ্রায় লিখুন, তারপর একটি পথ বেছে নিন। মুদ্রাগুলো আলাদা রাখুন আর প্রতিটির হিসাব তার নিজের মুদ্রায় মেটান, অথবা বর্তমান এক্সচেঞ্জ রেটে রূপান্তর করে একবারে মেটান। একই জাপান ট্রিপে প্রথম পথে চারটি পেমেন্ট লাগে, দ্বিতীয় পথে দুটি।"
cta:
  heading: "যে মুদ্রায় দিয়েছেন সেটাতেই লিখুন"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, ট্রিপের জন্য একটি গ্রুপ শুরু করুন আর প্রতিটি খরচ রসিদে যে মুদ্রা ছিল সেটাতেই যোগ করুন। আগে বিস্তারিত দেখতে চান? দেখুন [একাধিক মুদ্রা](page:feature/multiple-currencies) বা [বিনামূল্যে কী কী মেলে](page:pricing)।"
sections:
  - heading: "তিন বন্ধু, একটি হোটেল, অঢেল ইয়েন"
    body: "Zoe, Kenji আর Lucy এক সপ্তাহের জন্য জাপানে একটি [গ্রুপ ট্রিপে](page:use-case/group-trips) গেছে, আর প্রতিটি খরচ তিনজনে সমান ভাগ হয়। Zoe বাড়ি থেকে পাউন্ডে হোটেল বুক করেছিল, £600-এ। Lucy টোকিওতে রেল পাস কিনেছিল ¥90,000-এ। Kenji রামেন নাইটের টাকা দিয়েছিল, ¥9,000, আর তারপর থেকে রোজ সেটা মনে করিয়ে দেয়। স্টেশনের প্ল্যাটফর্মে দাঁড়িয়ে তিনটি রসিদ রূপান্তর করতে কেউ চায় না। এখানকার অঙ্কের জন্য ¥1 হলো £0.005, এই গাইডের জন্য বানানো একটি গোল রেট। অ্যাপে আপনি ব্যবহার করবেন একটি বর্তমান এক্সচেঞ্জ রেট, অথবা আসলে যে রেট পেয়েছেন সেটা লিখবেন।"
  - heading: "রসিদে যে মুদ্রা আছে সেটাতেই লিখুন"
    body: "যে পথই নিন, এই অংশটা একই। এখনও কিছু রূপান্তর করার দরকার নেই।"
    items:
      - "**গ্রুপ বানান।** ড্যাশবোর্ডে **গ্রুপ তৈরি করুন** বেছে নিন, গ্রুপের নাম ট্রিপের নামে রাখুন, তারপর **অন্যদের আমন্ত্রণ জানান** বেছে লিঙ্ক বা QR কোড পাঠান।"
      - "**হোটেল যোগ করুন।** **খরচ যোগ করুন** বেছে 600 লিখুন, পরিমাণের পাশে মুদ্রা হিসেবে পাউন্ড রেখে। **কে টাকা দিয়েছেন?** অংশে Zoe-কে বাছুন। **যাদের মধ্যে ভাগ হবে** অংশে তিনজনকেই রাখুন, **কীভাবে ভাগ হবে** অংশে **সমান** রেখে দিন আর **খরচ সংরক্ষণ করুন** বেছে নিন।"
      - "**ইয়েনের খরচ যোগ করুন।** রেল পাসের (Lucy দিয়েছে) আর রামেনের (Kenji দিয়েছে) জন্য একইভাবে করুন, মুদ্রা হিসেবে ইয়েন নিয়ে। ইয়েনে দশমিক নেই, তাই ফর্ম সেটা চায় না।"
  - heading: "প্রথম পথ: মুদ্রাগুলো আলাদা রাখুন"
    body: "Side Badger প্রতিটি মুদ্রার জন্য আলাদা ব্যালেন্স রাখে, এক মুদ্রার সঙ্গে আরেকটি কাটাকাটি করে না। পাউন্ডে হোটেলের খরচ জনপ্রতি £200, তাই Kenji আর Lucy প্রত্যেকে Zoe-র কাছে £200 ঋণী। ইয়েনে রেল পাস আর রামেন মিলিয়ে ¥99,000, অর্থাৎ জনপ্রতি ¥33,000। Lucy দিয়েছে ¥90,000, তাই তার পাওনা ¥57,000। Zoe কোনো ইয়েন দেয়নি, তাই তার দেওয়ার আছে ¥33,000। Kenji দিয়েছে ¥9,000, তাই তার দেওয়ার আছে ¥24,000।"
    items:
      - "**পাউন্ড।** Kenji Zoe-কে £200 দেয় আর Lucy Zoe-কে £200 দেয়।"
      - "**ইয়েন।** Zoe Lucy-কে ¥33,000 দেয় আর Kenji Lucy-কে ¥24,000 দেয়।"
      - "**মোট চারটি পেমেন্ট।** Zoe আর Lucy একে অপরের কাছে দুটি মুদ্রায় ঋণী, যা কাটাকাটি হয় না। এতে কোনো রেট জড়িত নয়, তাই তর্ক করার কিছু থাকে না।"
      - "**ইয়েনের দেনা, পেমেন্ট পাউন্ডে।** যার কাছে ইয়েন নেই সে-ও পাউন্ডে দিতে পারে। পেমেন্ট রেকর্ড করার সময় **ভিন্ন মুদ্রা?** খুলুন, **রূপান্তর করুন** ঘরে পাউন্ড বেছে নিন আর রেটটা দেখে নিন। এই গাইডের রেটে Zoe-র ¥33,000 হলো £165, আর ইয়েনের ব্যালেন্স তবুও ঠিক মেলে।"
      - "**প্রতিটি পেমেন্ট রেকর্ড করুন।** যেভাবে খুশি একে অপরকে দিন, তারপর **সব শোধ করুন** বেছে নিয়ে **সেটেলমেন্ট রেকর্ড করুন** ব্যবহার করুন। [হিসাব মেটানো](page:feature/settle-up) নিয়ে আরও বিস্তারিত আছে।"
  - heading: "দ্বিতীয় পথ: চলতে চলতে রূপান্তর করুন"
    body: "গ্রুপ যদি প্রত্যেকের জন্য একটিই সংখ্যা দেখতে চায়, তাহলে খরচ লেখার সময়ই রূপান্তর করুন।"
    items:
      - "**ফর্মেই রূপান্তর করুন।** **খরচ যোগ করুন** ফর্মে **রূপান্তর করুন** ঘরে পাউন্ড বেছে নিন। Side Badger রেট আর রূপান্তরিত পরিমাণ দেখায়, ≈ চিহ্নসহ। অন্য রেট পেয়ে থাকলে রেটটা বদলে নিন। মূল ইয়েনের পরিমাণ খরচেই থেকে যায়।"
      - "**পাউন্ডে পড়ুন।** ¥1 = £0.005 রেটে রেল পাস হয় £450 আর রামেন £45। £600-এর হোটেলসহ মোট £600 + £450 + £45 = £1,095, অর্থাৎ জনপ্রতি £365। Zoe দিয়েছে £600, তাই তার পাওনা £235। Lucy দিয়েছে £450, তাই তার পাওনা £85। Kenji দিয়েছে £45, তাই তার দেওয়ার আছে £320।"
      - "**দুটি পেমেন্ট।** দুটিই Kenji-র: Zoe-কে £235 আর Lucy-কে £85। Zoe ও Lucy-র একে অপরকে আর কিছুই দিতে হয় না।"
      - "**অথবা গ্রুপের মুদ্রা ঠিক করুন।** বাড়তি ধাপটা এড়াতে গ্রুপের **সেটিংস** খুলুন, **মুদ্রা সেটিংস** খুঁজে নিন আর **স্বয়ংক্রিয়ভাবে ব্যয় রূপান্তর করুন** ঘর থেকে একটি মুদ্রা বেছে নিন। তখন প্রতিটি নতুন খরচ সেই মুদ্রায় রূপান্তরিত হয়, তবুও এমন রেটে যা আপনি দেখতে ও বদলাতে পারেন।"
  - heading: "কোন পথ নেবেন?"
    items:
      - "**আলাদা রাখুন**, যখন লোকজনের ওয়ালেটে এখনও ইয়েন আছে, অথবা রেট নিয়ে তর্ক করতে না চাইলে। এর দাম: বেশি পেমেন্ট, একাধিক মুদ্রায়।"
      - "**রূপান্তর করুন**, যখন গ্রুপ একটি মুদ্রায় চলে আর প্রত্যেকে একটি সংখ্যা ও একটি ছোট তালিকা চায়, যেমন Kenji-র দুটি ট্রান্সফার। এর দাম: গ্রুপকে একটি রেটের ওপর ভরসা করতে হয়, আর খরচ সেভ করার সময় প্রতিটি খরচে রেট স্থির হয়ে যায়।"
      - "**আগেই ঠিক করুন।** গ্রুপের মুদ্রা শুধু নতুন আর কপি করা খরচ রূপান্তর করে। আগে যা লিখে ফেলেছেন সেগুলো ফিরে গিয়ে গুছিয়ে দেয় না।"
  - heading: "রেট, আর সীমা"
    items:
      - "**সেভ করার সময় রেট স্থির হয়ে যায়।** পুরনো খরচের মূল্য কখনও নতুন করে ধরা হয় না, তাই বাজার নড়েছে বলে ব্যালেন্স সরে যায় না। আলাদা আলাদা দিনে লেখা খরচে আলাদা রেট থাকতে পারে, তাই পুরো ট্রিপের জন্য একটি রেট চাইলে সবাই মিলে সেটা ঠিক করুন আর প্রতিবার লিখে দিন।"
      - "**রেট নেই? নিজে লিখুন।** Side Badger যেখানে পারে সেখানে বর্তমান এক্সচেঞ্জ রেট আনে, কিন্তু প্রতিটি জোড়ার জন্য রেটের নিশ্চয়তা নেই। না থাকলে, বা ক্যাশ ডেস্কে আরও ভালো দর পেলে, নিজের রেট লিখুন।"
      - "**প্রতিটি খরচে 999,999.99, তার নিজস্ব মুদ্রায়।** মুদ্রা যা-ই হোক, সীমা একটিই। ইয়েনে সেটা ¥1,000,000-এর সামান্য নিচে, এই গাইডের রেটে প্রায় £5,000। ইন্দোনেশীয় রুপিয়াহের মতো বড় সংখ্যার মুদ্রায় একটি বিলই আগে সীমায় পৌঁছে যেতে পারে। বিলটাকে দুটি খরচে ভাগ করুন, অথবা অন্য মুদ্রায় লিখে রূপান্তর করুন।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটি কখনও টাকা নাড়াচাড়া বা বিনিময় করে না। আপনারা যেভাবে খুশি একে অপরকে দেন, তারপর পেমেন্টটা রেকর্ড করেন।"
      - "এতে 140টি মুদ্রা আছে। ক্রিপ্টোকারেন্সি আর ধাতু তার মধ্যে নেই।"
exampleAfter: 2
