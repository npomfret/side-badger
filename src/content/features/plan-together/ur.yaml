sections:
  - heading: "تبصرے اور ردعمل، اعداد کے ساتھ"
    body: "ہر خرچے کا اپنا تبصروں کا سلسلہ ہوتا ہے، اور گروپ، ہر فہرست اور ہر پول کا بھی۔ پوچھیں کہ ٹیکسی اتنی مہنگی کیوں تھی، ٹیکسی ہی کے نیچے، نہ کہ ایسی چیٹ میں جسے کوئی پیچھے جا کر نہیں پڑھتا۔ رسید کی تصویر یا بکنگ کا PDF لگائیں، پھر اخراجات، ادائیگیوں اور تبصروں پر انگوٹھا اوپر، دل، ہنسی، حیرت، اداسی یا جشن سے ردعمل دیں۔ ادائیگی پہنچے تو جشن منائیں۔ Side Badger کی طرف سے تالیوں کی گونج کے قریب ترین چیز یہی ہے۔"
  - heading: "جھگڑا کیے بغیر خرچے پر سوال اٹھائیں"
    body: "جب گروپ نے اخراجات پر سوالات آن کیے ہوں تو خرچے میں شامل کوئی بھی شخص **میرا ایک سوال ہے** چن کر وجہ بتا سکتا ہے۔ سوال خرچے پر تبصرے کے طور پر پوسٹ ہوتا ہے، خرچے پر **زیر سوال** کا بیج لگ جاتا ہے، اور پورا خرچہ سوال نمٹنے تک سب کے بیلنسز سے باہر ہو جاتا ہے۔"
    items:
      - "**اسے آن کرنا۔** یہ بطور ڈیفالٹ آف ہے۔ ایڈمن گروپ کی ترتیبات میں **خصوصیات** کے تحت **اخراجات کے سوالات کی اجازت دیں** آن کرتا ہے۔"
      - "**اسے بند کرنا۔** سوال اٹھانے والا شخص، یا ایڈمن، **سوال بند کریں** چنتا ہے۔ اگر کئی لوگوں نے ایک ہی خرچے پر سوال اٹھایا ہو تو آخری سوال بند ہونے پر خرچہ واپس بیلنسز میں چلا جاتا ہے۔"
      - "**اس میں ترمیم کرنا۔** جب خرچے میں ترمیم ہو تو کھلا سوال ان سب کے لیے نئے ورژن میں منتقل ہو جاتا ہے جن کا اب بھی اس میں حصہ ہے۔ جسے ترمیم باہر کر دے اس کا سوال پرانے ورژن کے ساتھ ختم ہو جاتا ہے، اس لیے اس کے لیے بند کرنے کو کچھ نہیں رہتا۔"
      - "**انہیں ڈھونڈنا۔** اخراجات کی فہرست میں **صرف زیر سوال** فلٹر ہے۔ یہ منظوری کا مرحلہ نہیں: صرف وہی اخراجات روکے جاتے ہیں جن پر کوئی سوال اٹھائے، اور باقی سب شامل ہوتے ہی شمار ہو جاتے ہیں۔"
  - heading: "سوال کیسے چلتا ہے"
    body: "ٹام £45 کی پارٹی کی شراب ڈالتا ہے، تینوں ساتھیوں میں تقسیم۔ عائشہ نے پی نہیں، تو وہ سوال اٹھاتی ہے، اور جب تک وہ کھلا ہے شراب کسی کے حساب میں نہیں گنی جاتی۔ گھر متفق ہوتا ہے کہ شراب ٹام اور پریا کی ہے، اس لیے ٹام تقسیم بدل کر ان دونوں پر کر دیتا ہے۔ عائشہ اب خرچے میں نہیں، اس لیے اس کا سوال پرانے ورژن کے ساتھ ختم ہو جاتا ہے، جو محفوظ رہتا ہے، اور شراب فوراً بیلنسز میں لوٹ آتی ہے، £15 فی کس کی جگہ £22.50 فی کس۔ اگر عائشہ خرچے میں رہتی تو اس کا سوال منتقل ہو جاتا اور اس کے یا ایڈمن کے بند کرنے کا انتظار کرتا۔ نیچے، عائشہ کے £48 میں خریداری کے £28 اور صفائی والی کے £20 ہیں، اور پریا کے £10.50 اس کے £70.50 کے حصے (£28، £20 اور £22.50) میں سے ادا کیے ہوئے £60 نکال کر بنتے ہیں۔ بالکل [ساتھ رہنے والوں](page:use-case/housemates) جیسی بحث۔ سوال کے الفاظ کیسے رکھیں، اس کے لیے [جب کوئی مشترکہ خرچے پر اعتراض کرے تو کیا کریں](page:guide/what-to-do-when-someone-disputes-a-shared-expense) دیکھیں۔"
  - heading: "مشترکہ فہرستیں، خریداری کے لیے"
    body: "گروپ میں فہرست شروع کریں، اس کا نام «خریداری کی فہرست» جیسا کچھ رکھیں، آئٹمز ڈالیں اور انہیں ٹک کریں۔ آئٹمز کو بہتر ترتیب میں گھسیٹیں، پیش رفت کی گنتی چڑھتی دیکھیں اور جب کوئی غلط جئی کا دودھ لے آئے تو فہرست پر تبصرہ کریں۔ مکمل فہرست کو آرکائیو کر کے سمیٹ دیں (**محفوظ شدہ دکھائیں** اسے واپس لاتا ہے)، یا فہرست کو کاپی کر کے دوبارہ استعمال کریں۔ مشترکہ خریداری کی فہرست کو خریداری کے بلوں کے ساتھ رکھیں، تاکہ فہرست بتائے کیا خریدنا ہے اور خرچہ بتائے کتنا لگا۔ فہرستیں کون بنا اور بدل سکتا ہے، یہ گروپ کی اجازتوں پر منحصر ہے، جنہیں [گروپ اور اجازتیں](page:feature/groups-and-permissions) سمجھاتا ہے۔"
  - heading: "پول، چاہیں تو گمنام"
    body: "گروپ سے وہ چیز پوچھیں جو بل طے کرتی ہے، جیسے کون سا ولا، تحفے پر کتنا خرچ کرنا ہے یا کشتی کی سیر قابل ہے یا نہیں۔ پول میں ایک سوال اور دو سے دس اختیارات ہوتے ہیں۔ آپ چنتے ہیں کہ ہر شخص کو کتنے ووٹ ملیں، ایک سے دس تک، اور ووٹنگ گمنام ہو یا نہیں۔ **گمنام ووٹنگ** چھپاتی ہے کہ کس نے کسے ووٹ دیا، اور پہلا ووٹ پڑنے کے بعد اسے بدلا نہیں جا سکتا۔ لوگ پول بند ہونے تک اپنا ووٹ بدل یا ہٹا سکتے ہیں، اور اگر گروپ کا ارادہ بدل جائے تو آپ اسے دوبارہ کھول سکتے ہیں۔ ولا چننا بالکل وہی ہے جس سے [گروپ سفر](page:use-case/group-trips) بنتے ہیں، اور تحفے کا بجٹ طے کرنا [تقریبات اور جشن](page:use-case/events-and-celebrations) کا پرانا مسئلہ ہے۔"
  - heading: "سرگرمی کی فیڈ، تاکہ کچھ چپکے سے نہ بدلے"
    body: "ہر گروپ کی سرگرمی کی تاریخ ہوتی ہے، اور اطلاعات کی گھنٹی آپ کے تمام گروپوں کی سرگرمی ایک جگہ جمع کرتی ہے۔ خرچہ شامل کریں اور سب اسے فوراً دیکھتے ہیں، ریفریش کیے بغیر، اور فیڈ بتاتی ہے کہ کیا بدلا اور کس نے بدلا۔ اس میں اخراجات کا شامل، ایڈٹ یا حذف ہونا، سوال اٹھنا اور بند ہونا، تبصرے، فہرست اور پول کی تبدیلیاں، اور ریکارڈ شدہ ادائیگیاں سب آتی ہیں۔"
  - heading: "پش اطلاعات، اگر آپ چاہیں"
    body: "پش اطلاعات اختیاری ہیں۔ انہیں اپنے اکاؤنٹ کی **ترتیبات** میں **اطلاعات** کے تحت آن کریں، اور جب آپ کے گروپوں میں نئی سرگرمی ہو، جیسے نیا خرچہ یا تبصرہ، تو آپ کا آلہ آپ کو بتاتا ہے۔ ہر آلہ الگ آن ہوتا ہے، اور آپ کا براؤزر پہلے اجازت مانگتا ہے۔ iPhone یا iPad پر یہ صرف ہوم اسکرین میں شامل کی گئی ایپ میں کام کرتی ہیں، جسے [ویب ایپ](page:feature/web-app) کا صفحہ سمجھاتا ہے۔ انہیں سہولت سمجھیں، وعدہ نہیں، کیونکہ ترسیل کی ضمانت نہیں۔"
limits:
  heading: "حدود"
  items:
    - "تبصرے، فہرستیں اور پول گروپ کے پیسوں کے لیے ہیں۔ [شرائط](page:terms) کہتی ہیں کہ جو کچھ پوسٹ ہو وہ گروپ کے مالی معاملات سے متعلق ہو، اس لیے یہ خرچے کی منصوبہ بندی کی جگہ ہے، عام چیٹ یا ٹو ڈو ایپ نہیں۔"
    - "تبصرہ 500 حروف تک ہو سکتا ہے، اور تین تک اٹیچمنٹ جو تصاویر یا PDF ہوں اور ہر ایک 5 MB تک۔ تبصرہ صرف اس کا لکھنے والا حذف کر سکتا ہے۔"
    - "اخراجات کے سوالات بطور ڈیفالٹ آف ہیں، اور ایڈمن انہیں ہر گروپ کے لیے آن کرتا ہے۔ خرچے پر صرف اس میں شامل لوگ سوال اٹھا سکتے ہیں، اس خصوصیت کو آف کرنے سے ہر کھلا سوال صاف ہو جاتا ہے، اور جس خرچے میں کوئی شامل ہو اس پر کھلا سوال ہو تو وہ گروپ نہیں چھوڑ سکتا۔"
    - "ایک گروپ میں 100 فہرستیں ہو سکتی ہیں، ہر ایک میں 200 آئٹمز تک اور ہر آئٹم 500 حروف تک۔ گروپ کی اجازتیں طے کرتی ہیں کہ فہرستیں کون بنا، بدل اور حذف کر سکتا ہے، اور لاک گروپ میں کوئی تبدیلی نہیں ہوتی۔"
    - "ایک گروپ میں 50 پول ہو سکتے ہیں، ہر ایک میں دو سے دس اختیارات اور فی شخص دس ووٹ تک۔ پول کی کوئی آخری تاریخ نہیں اور وہ خود بند نہیں ہوتے۔"
    - "سرگرمی کی تاریخ 90 دن تک رکھی جاتی ہے۔"
    - "پش اطلاعات ہر اکاؤنٹ اور ہر آلے کے لیے اختیاری ہیں۔ انہیں ایسا براؤزر چاہیے جو انہیں سپورٹ کرے اور آپ کی اجازت، وہ iPhone اور iPad پر صرف ہوم اسکرین میں شامل کی گئی ایپ سے کام کرتی ہیں، اور ترسیل کی ضمانت نہیں۔ سرگرمی کے لیے کوئی ای میل یا ٹیکسٹ الرٹ اور ادائیگی کی کوئی یاد دہانی نہیں، اس لیے ادائیگی کا پیچھا کرنا اب بھی آپ پر ہے۔"
useCasesHeading: "جہاں مل کر منصوبہ بنانا کام آتا ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا ووٹ گمنام ہو سکتے ہیں؟"
      a: "جی ہاں۔ پول بناتے وقت **گمنام ووٹنگ** آن کریں اور یہ چھپا لیتی ہے کہ کس نے کسے ووٹ دیا۔ پہلے ووٹ سے پہلے فیصلہ کریں، کیونکہ بعد میں اسے بدلا نہیں جا سکتا۔"
    - q: "کیا پول خود بند ہو سکتا ہے؟"
      a: "نہیں۔ پول کی کوئی آخری تاریخ نہیں، اس لیے گروپ کے فیصلہ کرنے پر اسے بنانے والا **پول بند کریں** چنتا ہے۔ اگر گروپ کا ارادہ بدل جائے تو **پول دوبارہ کھولیں** اسے واپس لے آتا ہے۔"
    - q: "ایک فہرست میں کتنے آئٹمز آ سکتے ہیں؟"
      a: "ایک فہرست میں 200 آئٹمز تک اور ایک گروپ میں 100 فہرستیں تک۔ ہر آئٹم 500 حروف تک ہو سکتا ہے، جو جئی کے دودھ کے لیے بہت ہے۔"
    - q: "سوال کون بند کر سکتا ہے، اور اس دوران خرچے کا کیا ہوتا ہے؟"
      a: "سوال اٹھانے والا شخص، یا گروپ کا ایڈمن۔ جب تک سوال کھلا ہے پورا خرچہ سب کے بیلنسز سے باہر ہے۔ وہ تب واپس آتا ہے جب اس پر آخری کھلا سوال بند ہو جائے، یا جب کوئی ترمیم سوال اٹھانے والے کو خرچے سے باہر کر دے۔"
    - q: "کیا میں فہرستوں اور تبصروں کو ٹو ڈو ایپ یا گروپ چیٹ کے طور پر استعمال کر سکتا ہوں؟"
      a: "نہیں۔ تبصرے، فہرستیں اور پول گروپ کے پیسوں کے لیے ہیں، جو [شرائط](page:terms) کہتی ہیں۔ خریداری کی فہرستیں، بجٹ کے پول اور «یہ £45 کیوں ہے؟» سوچیں۔"
    - q: "کیا Side Badger سرگرمی کے بارے میں مجھے ای میل کرے گا؟"
      a: "نہیں۔ سرگرمی کے لیے کوئی ای میل یا ٹیکسٹ الرٹ نہیں۔ آپ ہر آلے پر پش اطلاعات آن کر سکتے ہیں، اور ایپ میں اطلاعات کی گھنٹی دکھاتی ہے کہ نیا کیا ہے۔"
