meta:
  title: "كيف تسوّي الحساب بعد رحلة جماعية | Side Badger"
  description: "سوِّ الحساب قبل أن يتفرق الجميع. عشرة ديون متشابكة تصبح أربع دفعات تُسجَّل حين تصل، والدفعة الجزئية مقبولة. الحسابات ظاهرة لخمسة أصدقاء."
h1: "كيف تسوّي الحساب بعد رحلة جماعية"
navLabel: "التسوية بعد الرحلة"
lead: "سوّوا الحساب قبل أن يتفرق الجميع. أضف آخر مصروف، وافتح أرصدة المجموعة، وادفع ما عليك من القائمة القصيرة بالطريقة التي تناسبك. ثم سجّل كل دفعة في Side Badger ليتصفّى الرصيد لدى المجموعة كلها. ولخمسة أصدقاء وخمسة مصروفات، تنخفض عشرة ديون متشابكة إلى أربع دفعات."
cta:
  heading: "أغلقوا الدفاتر قبل أن تصل الصور"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة للرحلة القادمة، وأضف كل تكلفة حين تحدث. وستكون القائمة القصيرة من الدفعات بانتظارك حين تصل إلى المطار. تريد أن ترى أولاً [كيف تعمل التسوية](page:feature/settle-up)؟"
sections:
  - heading: "خمسة أصدقاء، وخمسة مصروفات، وصالة مغادرة واحدة"
    body: "قضى مو وإينيس وراف وتيس وأوما أسبوعاً على الساحل. حجز مو الشقة واشترى البقالة، ودفعت إينيس ثمن الرحلة بالقارب، وتكفّل راف بالعشاء الكبير. وأخذت تيس سيارة الأجرة إلى المطار مع أوما ومو، لأن إينيس وراف سافرا بالقطار. وبقيت بطاقة أوما في البيت، فلم تدفع ثمن شيء. أي خمسة مصروفات ومجموعها €1,700، وفي صالة المغادرة لم يستطع أحد أن يقول من المتقدّم."
  - heading: "عشرة ديون، أربع دفعات"
    body: "تُقسَّم الشقة والقارب والعشاء والبقالة بالتساوي على الخمسة. أي €200 و€50 و€60 و€18 لكل واحد، فيدين إينيس وراف بمبلغ €328 لكل منهما. وتُقسَّم سيارة الأجرة على ثلاثة بواقع €20 لكل واحد، فيدين مو وتيس وأوما بمبلغ €348. دفع مو €1,090 وعليه €348، فيبقى له €742. ودفع كل شخص آخر أقل مما عليه. فعلى أوما €348، وعلى تيس €288، وعلى إينيس €78، وعلى راف €28، ومجموعها €742 وهو ما لمو. وإذا سوّيتم كل زوج من الأشخاص مباشرة فستحصلون على عشرة ديون منفصلة. أما Side Badger فيقترح أربع دفعات بدلاً من ذلك، كلها إلى مو."
  - heading: "سوّوا الحساب قبل أن يتفرق الجميع"
    body: "أفضل لحظة هي المساء الأخير أو الطريق إلى البيت، حين لا يزال الجميع في مكان واحد ويسهل ذكر دين قدره €28. أضيفوا كل المصروفات أولاً، بما فيها سيارة الأجرة. ولا يستطيع أحد مغادرة مجموعة ما دام عليه مبلغ أو له مبلغ، فلا بد أن يُقفل الحساب في وقت ما على أي حال."
    items:
      - "**راجع القائمة.** افتح المجموعة وانظر إلى **الأرصدة**. افتراضياً ترى الديون التي تخصك. اختر **إظهار الكل** لترى قائمة المجموعة كلها."
      - "**ادفع بالطريقة التي تناسبك.** تحويل مصرفي، أو نقداً، أو معروف مستحق من العطلة الماضية. لا ينقل Side Badger المال."
      - "**سجّلها.** اختر **تسوية**. تحت **تسوية سريعة** كل زر هو إحدى دفعاتك المقترحة، واختيار أحدها يملأ المبلغ. أضف **ملاحظة** مثل تحويل مصرفي، وتحقق من **التاريخ** (لا يمكن أن يكون في المستقبل) ثم اختر **تسجيل تسوية**."
      - "**شاهد الرصيد يتصفّى.** يتحدّث الرصيد عند الجميع. وحين تدخل آخر دفعة، تعرض **الأرصدة** عبارة **كل شيء مسدد!**"
  - heading: "دفع جزء الآن والباقي لاحقاً"
    body: "تستطيع أوما إرسال €200 الليلة والباقي في نهاية الشهر. فتسجّل €200، وينبّهها النموذج إلى أنها ستظل مدينة لمو بمبلغ €148 بعد ذلك، وهو €348 ناقص €200. احفظها فيبقى مبلغ €148 في رصيدها إلى أن تسجّل الباقي. والتنبيه يعمل في الاتجاه المعاكس أيضاً. فإذا حوّل صفر زائد €348 إلى €3,480، يقول النموذج إنها مدينة لمو بمبلغ €348 فقط وإن الحفظ سينشئ ديناً في الاتجاه المعاكس. صحّح الصفر قبل أن تحفظ."
  - heading: "تصحيح الأخطاء، والاحتفاء بالدفعات"
    items:
      - "**دفعة خاطئة.** لا يعدّل الدفعة إلا من سجّلها. ويستطيع هو أو مشرف المجموعة حذفها، ثم يمكن تسجيلها من جديد."
      - "**دفعة تستحق الالتفات.** تظهر كل دفعة مسجّلة تحت **التسويات** مع تاريخها وملاحظتها، حيث يراها كل من في المجموعة ويستطيع التفاعل معها. ويستطيع مو أن يختار **احتفال** حين تصل آخر €148 من أوما."
      - "**النهاية.** حين تصل كل الأرصدة إلى الصفر، يستطيع المشرف إقفال المجموعة لتبقى الأرقام في مكانها."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا ينقل المال أبداً. ليس فيه روابط دفع ولا طلبات دفع، فالدفعة في التطبيق هي تسجيل لدفعة تمت في مكان آخر."
      - "لا يرسل تذكيرات. ومطاردة الدفعة المتأخرة تبقى عليك."
      - "لا يحدد مواعيد نهائية. وموعد استحقاق ما تبقى من €148 على أوما تتفق عليه المجموعة."
      - "الدفعات المقترحة قائمة قصيرة، لا وعد بأقصر قائمة ممكنة. وهي تُحسب لكل عملة، فرحلة دُفعت باليورو والجنيه تحصل على قائمة لكل منهما."
