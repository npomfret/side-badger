meta:
  title: "Hatiin ang gastos sa bachelor o bachelorette weekend | Side Badger"
  description: "Walang binabayaran ang bida at nag-uusap pa rin ang lahat pagsapit ng Lunes. Paano hatiin ang bachelor o bachelorette weekend, kasama ang kuwenta."
h1: "Paano hatiin ang gastos sa bachelor o bachelorette weekend"
navLabel: "Bachelor o bachelorette weekend"
lead: "Walang binabayaran ang bida, kaya ang iba sa grupo ang naghahati sa bawat gastos [nang pantay](page:feature/split-expenses). Huwag isama ang mga tao sa gastos na nilaktawan nila, at huwag isama ang bida sa grupo para manatili ang surprise."
cta:
  heading: "Ingatan ang bilang, ingatan ang surprise"
  body: "Gumawa ng grupo, ipadala ang link sa lahat maliban sa bida, at idagdag ang bawat gastos habang nangyayari. Libre ang Side Badger, walang ad, at walang pang-araw-araw na limitasyon."
sections:
  - heading: "Apat na magkakaibigan at isang surprise"
    body: "Dadalhin nina Hannah, Isla, Jess, at Kat si Grace sa bachelorette weekend niya. Si Grace ang bida, kaya wala siyang babayaran. Wala rin siya sa grupo, kaya hindi niya makikita kung magkano ang ginagastos ng mga kaibigan niya para sa kanya. Si Hannah ang nag-book ng cottage, si Isla ang nagbayad sa spa day, si Jess ang sumagot sa hapunan, at si Kat ang sa taxi. Pagsapit ng Linggo, bawat isa ay may nabayaran na, at walang makapagsabi kung sino ang nauuna. Pareho ang kuwenta sa bachelor o bachelorette weekend, sinuman ang bida."
  - heading: "Hatiin sa mga nagbabayad, hindi sa mga naroon"
    body: "Hindi nawawala ang bahagi ng bida. Ibinabahagi ito sa iba. £720 ang cottage at apat na kaibigan ang magbabayad, kaya £180 bawat isa, at kasama na sa bilang na iyon ang puwesto ni Grace. £260 ang hapunan, kaya £65 bawat isa. £44 ang taxi, kaya £11 bawat isa. Ang anumang nilaktawan ng isang tao ay aalisin sa gastos na iyon lang. Nilaktawan ni Kat ang spa, kaya ang £360 nito, na sakop din ang puwesto ni Grace, ay paghahatian nina Hannah, Isla, at Jess nang £120 bawat isa. Isama lahat at £376 ang bahagi nina Hannah, Isla, at Jess sa weekend, at £256 ang kay Kat."
  - heading: "I-set up sa Side Badger"
    items:
      - "Gumawa ng grupo para sa weekend at bigyan ito ng nakakabagot na pangalan, gaya ng Cottage weekend. Hindi miyembro si Grace, at tanging mga miyembro ng grupo ang makakakita nito."
      - >-
        Piliin ang **Mag-imbita ng Iba** at ipadala ang link, o ipakita ang QR code, sa lugar lang na hindi makikita ni Grace. May preview ng grupo ang link bago sumali ang sinuman. Piliin kung gaano ito katagal, mula 15 minuto hanggang 5 araw. Gumagana pa rin ang lumang link hanggang mag-expire ito, kaya huwag itong patagalin nang higit sa kailangan.
      - >-
        Para sa bawat gastos, piliin ang **Magdagdag ng Gastusin**, ilagay ang halaga, at piliin ang nagbayad sa ilalim ng **Sino ang nagbayad?** Sa ilalim ng **Hatiin sa pagitan ng**, i-tick ang mga taong magbabayad at huwag isama ang sinumang lumaktaw dito, gaya ni Kat sa spa. Piliin ang **Pantay** sa ilalim ng **Paano hatiin**.
      - >-
        Pag-uwi ninyo, buksan ang **Mga Balanse** ng grupo. Ipinapakita ng Side Badger kung sino ang may utang kanino at nagmumungkahi ng maikling listahan ng mga bayad. Dito, tatlo ito: magbabayad si Kat kay Hannah ng £212, magbabayad si Jess kay Hannah ng £116, at magbabayad si Isla kay Hannah ng £16. Magbayaran kayo sa paraang gusto ninyo, saka gamitin ang **Magbayad** para itala ang bawat bayad.
  - heading: "Bago mag-book, budget at deposit"
    body: "Magkasundo sa budget bago mag-book ang sinuman. Piliin ang **Magdagdag ng poll**, itanong kung magkano ang gagastusin ng grupo sa cottage, at maglatag ng ilang halaga bilang opsyon. I-on ang **Anonimong pagboto** kapag ginawa ito, para itago kung sino ang bumoto sa ano, kaya walang kailangang ipagtanggol nang malakas ang mas maliit na budget. Isara ang poll kapag nakaboto na ang lahat at lalabas ang panalo. Susunod ang deposit. Ang nag-book ang magbabayad nito at idaragdag ito bilang gastos, hinati nang pantay, at idaragdag ang natitirang bayad bilang pangalawang gastos kapag due na ito. Puwedeng ipadala agad ng iba ang bahagi nila at itala ang bayad, o hintayin ang pinal na bilang. Pareho ang kalalabasan ng mga balanse sa alinman."
  - heading: "Kapag isang gabi lang sumali ang isa"
    body: "Hindi dapat magbayad para sa Biyernes ang kaibigang sa Sabado lang sumipot. Huwag siyang isama sa mga gastos na hindi siya kasali. Kung nakadepende ang gastos sa haba ng pananatili ng bawat tao, gaya ng kuwarto, piliin ang **Eksaktong halaga** sa ilalim ng **Paano hatiin** at i-type ang bahagi ng bawat tao, na dapat umabot sa kabuuan. Alamin muna ang presyo kada tao kada gabi, saka i-multiply sa dami ng gabing mananatili ang bawat isa. May higit pang paliwanag ang pahina ng [group trip](page:use-case/group-trips) tungkol sa mga gastos na hindi pare-pareho para sa lahat."
  - heading: "Ang hindi ginagawa ng Side Badger dito"
    items:
      - "Hindi ito naglilipat ng pera. Magbayaran kayo sa pamamagitan ng bank transfer, cash, o anumang akma sa inyo, saka itala ang bayad para mag-update ang mga balanse para sa lahat."
      - "Walang payment reminder na ipinapadala. Tao pa rin ang bahala sa magiliw na pagpapaalala sa group chat."
      - "Isang nagbabayad ang bawat gastos, at hindi kayang hatiin ng Side Badger ang resibo linya-linya. Kung dalawang card ang nagbayad sa cottage, ilagay ito bilang dalawang gastos. Kung may mga umorder ng extra sa hapunan, ilagay ang mga extra bilang sarili nilang gastos."
      - "Pera ang iniingatan nito, hindi ang itinerary. Nasa mga gastos lang ang mga poll at komento, kaya sa group chat ninyo mananatili ang mga plano para sa weekend."
