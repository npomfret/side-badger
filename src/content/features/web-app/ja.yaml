meta:
  title: ダウンロード不要の割り勘アプリ | Side Badger
  description: スマートフォンの容量がいっぱいなのは、わかっています。Side Badgerはブラウザで動き、アプリストアもダウンロードも不要。ホーム画面に追加すれば、アプリのように開きます。
h1: アプリストアなし。ダウンロードなし。それでもアプリの使い心地
navLabel: Webアプリ
lead: Side Badgerはブラウザの中にあります。探すアプリストアも、先にダウンロードするものもありません。スマートフォンでもパソコンでもログインして、グループでオンラインで割り勘し、ワンタップで開きたくなったらホーム画面やDockに追加できます。
cta:
  heading: 開いて、ログインして、グループを始めよう。
  body: アカウントの作成からグループの開始、最初の支出の追加まで、すべていま開いているブラウザからできます。まず案内がほしい方は[使い方](page:how-it-works)、無料の範囲は[料金](page:pricing)をご覧ください。
problem:
  heading: スマートフォンはいっぱい。わかっています。
  body: 中には、同じ夕焼けの写真が4,000枚と、春からスワイプして消し続けている容量不足の警告があるはずです。たった1回の夕食を割り勘するためだけに、これ以上アプリを増やしたくはないでしょう。だからSide Badgerは、Webアプリです。スマートフォンでもパソコンでも、最近のブラウザで動きます。スマートフォンでは、グループのページをタブに分けたモバイル向けのレイアウトと、タッチ操作しやすいコントロールになります。ホーム画面への追加など一部の追加機能はブラウザによって異なり、その点はそのつど説明しています。
workflow:
  heading: ブラウザのタブからホーム画面まで、3ステップ
  steps:
    - title: 開いて、ログインする
      body: ブラウザでSide Badgerを開いてログインします。必要なのはメールアドレスとパスワードだけで、何かを追加する前にメールアドレスの確認が必要です。グループの全員にアカウントが必要なので、招待した人も同じようにします。
    - title: ホーム画面またはDockに追加する
      body: "ログインすると、アプリがインストールを案内します。ブラウザが許可している場合は**インストール**ボタンが、許可していない場合は**手順を見る**が表示されます。見逃した、または断った場合は、**設定**の**ホーム画面またはDockに追加**で同じ案内を見られます。iPhoneとiPadでは、設定にiPhoneの手順が先に表示され、ほかのデバイスは**その他のデバイス**の下にまとめられます。どちらの方法でも、そのあとアプリは専用のウインドウで開きます。"
      shot: S20
      shotAlt: 設定の「ホーム画面またはDockに追加」セクション。アプリをデバイスに追加する手順が表示されている
    - title: 通知は、ほしければオンにする
      body: "通知は、オンにするまでオフで、デバイスごとに別々にオンにします。通知のベルに表示される**オンにする**ボタンか、**設定**の**プッシュ通知**スイッチを使います。iPhoneとiPadでは、先にホーム画面からアプリを開いてください。そこでしか、通知は動作しません。"
      shot: S19
      shotAlt: グループの最近のアクティビティが一覧表示された、開いた状態の通知ドロップダウン
options:
  heading: デバイス別の追加方法
  items:
    - title: iPhoneとiPad
      body: 上向きの矢印が付いた四角形の共有ボタンをタップします。表示されない場合は、先に3つの点（•••）をタップしてから共有をタップします。下にスクロールして**ホーム画面に追加**をタップします。**Webアプリとして開く**はオンのまま、**追加**をタップします。リンクが別のアプリの中で開いた場合は、その内蔵ブラウザでは追加できないので、先にこのページをSafariで開いてください。
    - title: Android
      body: ブラウザのメニューを開き、**ホーム画面に追加**または**アプリをインストール**を選びます。
    - title: パソコンのChromeまたはEdge
      body: ブラウザのメニューを開き、このサイトをアプリとしてインストールするオプションを選びます。そうすると、専用のウインドウと専用のアイコンが付きます。
    - title: MacのSafari
      body: "**ファイル**を選び、**Dockに追加**を選びます。"
sections:
  - heading: 通知は、頼んだ人だけに
    body: プッシュ通知は、自分でオンにする方式です。オンにすると、グループに新しいアクティビティ（誰かが支出を追加した、コメントを残した、支払いを記録したなど）があったときに通知が届きます。オンにするのはデバイスごとで、通知のベルか**設定**から行い、同じ場所でまたオフにできます。対応するブラウザとあなたの許可が必要です。ブラウザがこのサイトの通知をブロックしている場合は、先にブラウザの設定で許可してください。iPhoneとiPadでは、ブラウザのタブではなく、ホーム画面に追加したアプリからのみ動作します。配信は保証されないので、通知は約束ではなく、軽い合図と考えてください。フィードに表示される内容は、[一緒に計画](page:feature/plan-together)をご覧ください。
  - heading: 変更はすぐに表示、再読み込みは不要
    body: 支出を追加すると、何が変わったか、誰が変えたかとともに、全員にすぐ表示されます。各グループにはアクティビティ履歴があり、通知のベルにはすべてのグループのアクティビティが表示されます。いま追加したものを見たかどうかを、誰かに尋ねる必要はありません。もう相手の画面にあります。
  - heading: 39の言語、人それぞれ
    body: Side Badgerは39の言語で使え、右から左に書くアラビア語、ペルシア語、ウルドゥー語も含まれます。言語は一人ひとりが選べるので、同じグループのページが、ある人にはアラビア語、次の人には英語で表示されることもあります。グループで合意すべきなのは、数字だけです。
  - heading: いろいろな使い方の人のために
    body: Side Badgerは、キーボードやスクリーンリーダーを使う人を考えて作られています。メンバーの色にはパターンが付くので、緑と赤を見分ける必要はありません。
    items:
      - キーボード利用者がコンテンツに直接移動できる、スキップリンク。
      - ダイアログがキーボードフォーカスを管理します。
      - スクリーンリーダー向けに、コントロールにラベルが付いています。
      - 右から左に書く言語では、レイアウトが反転します。
limits:
  heading: Webアプリにできないこと
  items:
    - オフラインでは使えません。Side Badgerは接続が必要なので、Wi-Fiのない飛行機の中ではグループを開けません。
    - アプリストア版も、iPhoneやAndroidのネイティブアプリもありません。Side BadgerはWebアプリで、ホーム画面やDockに追加することが、アプリのように使う方法です。
    - ホーム画面やDockへの追加はブラウザによって異なります。メニュー名はブラウザやバージョンによって異なり、対応していないブラウザもあります。
    - プッシュ通知はデバイスごとに自分でオンにする方式で、対応するブラウザとあなたの許可が必要です。iPhoneとiPadでは、ホーム画面に追加したアプリからのみ動作します。配信は保証されません。
    - メールやテキストメッセージの通知も、支払いのリマインダーもありません。新しいアクティビティはアプリに表示され、オンにすればプッシュ通知でも届きます。支払いの催促は引き続きご自身で行ってください。
    - アクティビティは90日間保存されます。
    - ログインはメールアドレスとパスワードで行います。GoogleやAppleでのサインインはなく、18歳以上である必要があります。
    - Side Badgerが完全にアクセシブルである、または正式なアクセシビリティ基準を満たしている、と主張することはありません。使いにくいところがあれば、アプリの中からお知らせください。返信もそこで確認できます。
useCasesHeading: アプリがいらないと助かる場面
faq:
  heading: よくある質問
  items:
    - q: Side Badgerのアプリはアプリストアにありますか？
      a: いいえ。Side BadgerはWebアプリです。ブラウザで開き、ホーム画面やDockに追加すればアプリのように開きます。アプリストアからダウンロードするものはありません。
    - q: アプリをダウンロードせずに割り勘できますか？
      a: はい。スマートフォンやパソコンのブラウザでSide Badgerを開き、ログインして、グループを始めるだけです。ホーム画面やDockへの追加は任意です。
    - q: オフラインで使えますか？
      a: いいえ。ホーム画面やDockに追加していても、Side Badgerは接続が必要です。
    - q: iPhoneで通知が届かないのはなぜですか？
      a: iPhoneとiPadでは、通知はブラウザのタブではなく、ホーム画面に追加したアプリからのみ動作します。追加して、ホーム画面のアイコンから開き、**設定**で通知をオンにしてください。配信は保証されないので、通知が届かなかったときも、グループのアクティビティ履歴には追加された内容が残っています。
    - q: 通知をオンにする必要がありますか？
      a: いいえ。通知は、デバイスごとにオンにするまでオフです。通知がなくても、新しいアクティビティはアプリに表示され、アプリを開いている人には変更がすぐ表示されます。
    - q: グループの全員にアカウントが必要ですか？
      a: はい。必要なのはメールアドレスとパスワードだけで、何かを追加する前にメールアドレスの確認が必要です。グループに参加する人は全員同じようにし、好きなスマートフォンやパソコンから利用できます。
