meta:
  title: "Како поделити кирију према величини собе | Side Badger"
  description: "Већа соба, већи удео. Издвој заједничке просторије, остало подели према површини и унеси проценте једном. Рачун приказан за троје цимера."
h1: "Како поделити кирију према величини собе"
navLabel: "Кирија по величини собе"
lead: "Одреди колики део кирије иде на заједничке просторије и подели га једнако, а остатак подели према површини сваке спаваће собе. Заокружи на целе проценте, унеси их једном уз кирију у Side Badger-у и копирај трошак сваког месеца."
cta:
  heading: "Унеси кирију једном"
  body: "Направи бесплатан кориснички налог, оснуј групу за стан и унеси кирију са процентима око којих сте се договорили. Следећи месец је копија. Хоћеш прво обилазак? Погледај [како функционише](page:how-it-works) или [шта покрива бесплатан план](page:pricing)."
sections:
  - heading: "Троје људи, један стан, једна свађа"
    body: "Прија, Том и Аиша деле стан за 1.950 £ месечно. Годину дана су кирију делили на троје, јер је тако било лако. Онда је Аиша измерила своју собу. Пријина соба има 16 m², Томова 12 m², а Аишина 10 m², па је Аиша плаћала колико и Прија за собу која је мања за више од трећине. Нико није био неразуман. Нико није израчунао. Уз храну за понети договорили су се прво око једног правила. Од кирије, 40 % плаћа кухињу, купатило и дневну собу, које користе сви троје."
  - heading: "Метод, са приказаним рачуном"
    body: "Четири корака, један метар и калкулатор на телефону."
    items:
      - "**Издвој заједнички део.** Група се договори који део кирије иде на просторије које користе сви. За овај стан то је 40 %, што је 13,33 % по особи међу троје."
      - "**Остатак подели према површини.** Преосталих 60 % иде према величини спаваће собе. Спаваће собе заједно имају 38 m² (16 + 12 + 10), па је Пријин део 60 % × 16/38, то јест 25,26 %."
      - "**Сабери оба дела.** Прија: 25,26 % + 13,33 % = 38,6 %. Том: 60 % × 12/38 = 18,95 %, плус 13,33 % је 32,3 %. Аиша: 60 % × 10/38 = 15,79 %, плус 13,33 % је 29,1 %."
      - "**Заокружи и провери.** Целе проценте је лакше укуцати и око њих се препирати, па 38,6 % постаје 39 %, 32,3 % постаје 32 %, а 29,1 % постаје 29 %. Провери да ли 39 + 32 + 29 даје 100. Ако заокруживање падне на 99 или 101, група се договори чији се податак помера за један поен."
  - heading: "Како изгледа месец у стану"
    body: "Кирија по 39 %, 32 % и 29 % износи 760,50 £, 624,00 £ и 565,50 £. Прија је платила станодавцу, па јој на крају месеца припада 1.142,50 £, док Том дугује 566,00 £, а Аиша 576,50 £. Side Badger предлаже две уплате, обе Прији."
  - heading: "Подеси у Side Badger-у"
    body: "Једно вече, од чега већину одузме расправа о оних 40 %."
    items:
      - "**Направи групу.** На контролној табли изабери **Креирај групу** и назови је по стану. Изабери **Позови друге** и пошаљи везу или QR код. Свако се пријави или направи бесплатан кориснички налог и изабере име под којим жели да буде приказан у овој групи."
      - "**Додај кирију.** Изабери **Додај трошак**. Унеси опис и износ, а под **Ко је платио?** изабери ко је платио станодавцу. Остави сво троје под **Подели између**, затим под **Начин поделе** изабери **Проценат** и укуцај 39, 32 и 29. Образац упозорава ако проценти не дају 100. Изабери **Сачувај трошак**."
      - "**Додај рачуне.** Струја и интернет су одвојени трошкови са својим платиоцима. Остави **Начин поделе** на **Једнако**."
      - "**Копирај следећег месеца.** Отвори прошломесечну кирију и изабери **Копирај трошак**. Копија задржава платиоца, износ и поделу, а добија данашњи датум. Промени износ ако се кирија променила, па изабери **Креирај копију**."
      - "**Провери ко коме дугује.** Приказује га одељак **Стања**. Платите једни другима како год желите, а затим забележите уплату под **Поравнај**."
  - heading: "Собе са купатилом, мале собе и одласци"
    items:
      - "**Собе са купатилом и мале собе.** Површина је само полазна тачка. Соба са сопственим купатилом вреди више од исте површине без њега, а мала соба у коју стане кревет и једна оптимистична столица вреди мање. Прилагодите проценте договором, проверите да и даље дају 100 и запишите коначне бројеве тамо где их цео стан види."
      - "**Неко се исели усред месеца.** Израчунај колико та особа дугује за тај месец и унеси кирију за тај месец са **Тачни износи** уместо **Процента**. Износи морају давати укупну кирију. Уради то пре него што оде. Нико не може напустити групу док дугује или му се дугује новац, а трошак у ком учествује неко ко је отишао постаје само за читање."
      - "**Неко се усели.** Измерите поново, прерачунајте са новим величинама соба и нове проценте користите од следеће кирије. Ранији месеци остају какви су били."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Не мери ваше собе и не бира проценте. Површине и тих 40 % група мора да договори сама."
      - "Нема понављајућих рачуна, па сваки пут копираш прошломесечну кирију."
      - "Никад не премешта новац и не плаћа станодавца. Плаћате једни другима како год желите и то забележите."
      - "Не зна шта пише у вашем закупном уговору. Води рачуна само о стању међу људима у групи."
