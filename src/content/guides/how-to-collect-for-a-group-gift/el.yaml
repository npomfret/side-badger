      payer: omar
      amount: 12
      split:
        method: equal
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Τι γίνεται αν μαζέψουμε περισσότερα από όσα κοστίζει το δώρο;"
      a: "Τα ακριβή ποσά πρέπει να κάνουν συνολικά την τιμή, οπότε μειώστε τα μερίδια μέχρι να τη βγάζουν. Ή ξοδέψτε το περίσσευμα σε κάτι υπαρκτό, όπως λουλούδια, και καταχωρίστε το ως δεύτερο έξοδο, όπως την κάρτα και το περιτύλιγμα στο παράδειγμα."
    - q: "Μπορεί κάποιος να συνεισφέρει χωρίς να μπει στην ομάδα;"
      a: "Όχι, αν θέλετε να μπει στον υπολογισμό. Όλοι στον διαχωρισμό χρειάζονται δωρεάν λογαριασμό και θέση στην ομάδα. Για κάποιον που έχει μόνο μετρητά, η Πρίγια θα μπορούσε να τα πάρει και να καταχωρίσει το δώρο με όσα χρωστά ακόμα η ομάδα. Για παράδειγμα, αν ο Σαμ της έδινε 40 £ σε μετρητά, εκείνη θα καταχωρούσε 200 £ και θα τις χώριζε 60, 60 και 80 ανάμεσα στην ίδια, τον Ομάρ και τη Λένα."
    - q: "Μπορεί η δημοσκόπηση να αποφασίσει πόσα βάζει ο καθένας;"
      a: "Όχι. Μια δημοσκόπηση συμφωνεί ένα ποσό για ολόκληρη την ομάδα, όπως ο προϋπολογισμός. Το μερίδιο του καθενός το συμφωνείτε μεταξύ σας και μετά το πληκτρολογείτε στο έξοδο ως **Ακριβή ποσά**."
