meta:
  title: "Dziel wydatki po równo, dokładnie lub procentowo | Side Badger"
  description: "Podziel wspólny koszt po równo, według dokładnych kwot albo procentowo i pomiń każdego, kogo nie było. Za darmo, bez reklam i bez dziennych limitów."
h1: "Dziel wydatki po równo, dokładnie lub procentowo"
navLabel: "Dzielenie wydatków"
lead: "Nie wszystko dzieli się 50/50. Side Badger sobie radzi. Powiedz, kto zapłacił, wybierz osoby, które dzielą koszt, i podziel go **po równo, według dokładnych kwot albo procentowo**. Urazy sprzedawane osobno."
cta:
  heading: "Podziel następny porządnie"
  body: "Załóż darmowe konto, utwórz grupę i dodaj wydatek, który od dawna chcesz uporządkować. Nie wiesz, co dalej? Zobacz [jak to działa](page:how-it-works) albo sprawdź, [co obejmuje darmowy plan](page:pricing)."
problem:
  heading: "Nie wszystko dzieli się 50/50"
  body: "Czynsz zależy od wielkości pokoju. Prezent od tego, kto co obiecał. Kolacja od tego, kto został na deser. Dzielenie rachunku na pół działa do pierwszego rachunku, który tak się nie dzieli, a wtedy ktoś otwiera arkusz. Side Badger zapisuje, kto zapłacił, kto dzieli koszt i jak się on dzieli, więc salda wychodzą dobrze i nikt nie musi dzielić pisemnie przy stole."
workflow:
  heading: "Dodawanie wydatku od początku do końca"
  steps:
    - title: "Powiedz, kto zapłacił i za co"
      body: "Wpisz kwotę, krótki opis i osobę, która zapłaciła. Za każdy wydatek płaci jedna osoba, dzięki czemu rachunek jest uczciwy."
      shot: S05
      shotAlt: "Formularz wydatku z czynszem za domek podzielonym procentowo między trzy osoby"
    - title: "Wybierz podział"
      body: "Wybierz po równo, dokładne kwoty albo procenty. Procenty muszą dawać w sumie 100, a dokładne kwoty muszą dawać w sumie całość."
      shot: S06
      shotAlt: "Formularz wydatku z dokładnymi kwotami wpisanymi dla każdej osoby przy prezencie"
    - title: "Dodaj historię"
      body: "Ustaw datę, dodaj etykiety, miejsce i notatkę. Wszyscy w grupie widzą te same szczegóły i mogą tam od razu komentować."
      shot: S08
      shotAlt: "Wydatek ze szczegółami, wątkiem komentarzy i oryginalną kwotą, w jakiej go wpisano"
    - title: "Zgłoś pytanie, jeśli coś wygląda dziwnie"
      body: "Jeśli grupa włączyła pytania do wydatków, każdy uwzględniony w wydatku może go zakwestionować, a lista wydatków może pokazywać tylko te zakwestionowane."
      shot: S18
      shotAlt: "Lista wydatków z plakietką Zakwestionowano i filtrem Tylko zakwestionowane"
options:
  heading: "Trzy sposoby podziału"
  items:
    - title: "Po równo"
      body: "Domyślnie przy kolacjach, taksówkach i wszystkim, co wszyscy dzielili po równo. Jeśli suma nie dzieli się równo, ostatni grosz trafia do jednej losowej osoby, a nie zawsze do tej samej. W taksówce poniżej jest to Ana."
    - title: "Według dokładnych kwot"
      body: "Wpisz, ile każdy jest winien. Dobre do prezentu, w którym każdy wybrał inną cenę, albo sklepu, w którym czyjś wózek zawierał więcej niż wspólne zakupy. Kwoty muszą dawać w sumie całość."
    - title: "Procentowo"
      body: "Daj każdemu udział w sumie. Klasykiem jest czynsz według wielkości pokoju: największy pokój płaci największą część i nikt nie udaje, że jest inaczej."
