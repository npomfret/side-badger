faq:
  heading: Questions
  items:
    - q: "Qu'est-ce qui est plus équitable, la taille de la chambre ou le revenu ?"
      a: "Aucun des deux n'est toujours plus équitable. La taille de la chambre convient à des colocataires qui paient l'espace où ils dorment. Le revenu convient aux couples et aux amis dont les salaires sont très différents. Mettez-vous d'accord avant le premier jour de loyer, pas après."
    - q: "Faut-il partager les factures de la même façon ?"
      a: "Entre colocataires, en général non. Tout le monde utilise l'énergie et la box, donc à parts égales, c'est plus simple, comme dans l'exemple. Selon le revenu, le calculateur donne aux factures les mêmes parts qu'au loyer."
    - q: "Puis-je utiliser les pieds carrés ?"
      a: "Oui. Choisissez ft² et saisissez vos surfaces en pieds carrés. L'unité n'est qu'une étiquette, et les parts sont les mêmes tant que tout le monde en utilise une seule."
    - q: "Le calculateur est-il gratuit ?"
      a: "Oui. Gratuit. Sans publicité. Sans limite quotidienne. Il ne faut pas de compte non plus."
