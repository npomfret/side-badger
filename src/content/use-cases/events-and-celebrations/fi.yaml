featuresHeading: Ominaisuudet, joita tämä käyttää
faq:
  heading: Kysymyksiä
  items:
    - q: Näkevätkö vieraat ryhmän liittymättä?
      a: Ei. Ihmiset liittyvät linkillä tai QR-koodilla ja ilmaisella tilillä, joten he näkevät ryhmän vasta sisällä.
    - q: Voiko Side Badger kerätä rahat?
      a: Ei. Side Badger pitää kirjaa eikä koskaan siirrä rahaa. Maksakaa toisillenne miten haluatte ja kirjatkaa maksu. Se on ilmainen, ilman mainoksia ja päivittäisiä rajoja; katso [hinnoittelu](page:pricing).
    - q: Voivatko äänet olla nimettömiä?
      a: Kyllä. Kyselyä luodessasi voit piilottaa, kuka äänesti mitä. Asetuksia voi muuttaa vain ennen ensimmäistä ääntä.
    - q: Voivatko ihmiset osallistua eri summilla?
      a: Kyllä. Jaa kulu tarkoilla summilla, jolloin kunkin osuus on sovittu luku, tai jätä pois ne, jotka eivät olleet mukana.
    - q: Voiko järjestäjä pitää kirjaa?
      a: Kyllä. Käytä hallitun ryhmän esiasetusta, jolloin vain luojat ja ylläpitäjät muuttavat kuluja ja ylläpitäjät hyväksyvät uudet jäsenet.
