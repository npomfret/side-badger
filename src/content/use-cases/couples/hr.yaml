featuresHeading: "Značajke koje par koristi"
faq:
  heading: "Pitanja"
  items:
    - q: "Možemo li jednom postaviti 60/40 za sve?"
      a: "Ne. Podjela pripada svakom trošku. Postavi postotke na prvom, a sljedeći put ga kopiraj i promijeni ono što je drukčije. [Podjela troškova](page:feature/split-expenses) pokriva sva tri načina podjele."
    - q: "Povezuje li se s našom bankom?"
      a: "Ne. Side Badger nikad ne dira vaš novac. Platite si kako god želite, a zatim zabilježite, kako objašnjava [poravnanje](page:feature/settle-up)."
    - q: "Može li itko drugi vidjeti našu grupu?"
      a: "Samo njezini članovi, a grupa para ima dva. Svatko tko koristi važeću poveznicu za poziv može se pridružiti, pa je podijeli s jednom osobom i postavi joj kratak rok isteka."
    - q: "Što ako je svatko od nas platio dio istog računa?"
      a: "Trošak ima jednog platitelja. Zabilježite dva troška, po jedan za svakoga od vas, i stanje je isto."
    - q: "Hoće li podsjetiti partnera da plati?"
      a: "Ne. Nema podsjetnika, pa je podsjećanje i dalje na tebi. Barem ćete oboje gledati isti broj."
    - q: "Što kad prestanemo dijeliti troškove?"
      a: "Poravnajte stanje i zabilježite uplatu, da nitko ne duguje ništa. Zatim administrator može zaključati grupu, što čuva brojeve kakvi jesu, ili je zauvijek zatvoriti, čime postaje nedostupna svima. Zatvorite je tek kad nikome od vas ne treba povijest."
