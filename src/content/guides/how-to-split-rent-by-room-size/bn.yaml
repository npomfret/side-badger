meta:
  title: "ঘরের আকার ধরে ভাড়া কীভাবে ভাগ করবেন | Side Badger"
  description: "বড় ঘর, বড় ভাগ। যৌথ ঘরগুলোর অংশ আলাদা রাখুন, বাকিটা মেঝের মাপ ধরে ভাগ করুন, আর শতাংশ একবারই লিখুন। তিন রুমমেটের অঙ্কসহ।"
h1: "ঘরের আকার ধরে ভাড়া কীভাবে ভাগ করবেন"
navLabel: "ঘরের আকার ধরে ভাড়া"
lead: "ভাড়ার কতটা অংশ যৌথ ঘরগুলোর জন্য, তা ঠিক করে সেই অংশ সমান ভাগে ভাগ করুন, তারপর বাকিটা প্রতিটি শোওয়ার ঘরের মেঝের মাপ ধরে ভাগ করুন। শতাংশগুলো পূর্ণ সংখ্যায় গোল করুন, Side Badger-এ ভাড়ার খরচে একবার সেগুলো লিখুন, আর প্রতি মাসে খরচটা কপি করুন।"
cta:
  heading: "ভাড়াটা একবারই লিখে ফেলুন"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, ফ্ল্যাটের জন্য একটি গ্রুপ শুরু করুন আর যে শতাংশে একমত হয়েছেন সেগুলোসহ ভাড়াটা লিখুন। পরের মাসে সেটা শুধু একটা কপি। আগে একটু ঘুরে দেখতে চান? দেখুন [কীভাবে কাজ করে](page:how-it-works) অথবা [বিনামূল্যে কী কী মেলে](page:pricing)।"
sections:
  - heading: "তিনজন, একটা ফ্ল্যাট, একটাই তর্ক"
    body: "Priya, Tom আর Aisha মাসে £1,950 ভাড়ায় একটা ফ্ল্যাট ভাগ করে থাকে। এক বছর ধরে তারা ভাড়া তিন সমান ভাগে ভাগ করেছে, কারণ সেটাই সহজ ছিল। তারপর Aisha তার শোওয়ার ঘরটা মাপল। Priya-র ঘর 16 m², Tom-এর 12 m² আর Aisha-র 10 m², অর্থাৎ Priya যা দিত, Aisha তা-ই দিচ্ছিল এমন একটা ঘরের জন্য যেটা এক-তৃতীয়াংশেরও বেশি ছোট। কেউ অযৌক্তিক কিছু করেনি। শুধু কেউ অঙ্কটা কষেনি। টেকঅ্যাওয়ে খেতে খেতে তারা প্রথমে একটা নিয়মে একমত হলো। ভাড়ার 40% যায় রান্নাঘর, বাথরুম আর বসার ঘরের জন্য, যেগুলো তিনজনই ব্যবহার করে।"
  - heading: "পদ্ধতিটা, অঙ্কসহ"
    body: "চারটি ধাপ, একটা মাপার ফিতে আর ফোনের ক্যালকুলেটর।"
    items:
      - "**যৌথ অংশ আলাদা রাখুন।** সবাই যে ঘরগুলো ব্যবহার করে তার জন্য ভাড়ার কত অংশ হবে, তা গ্রুপ ঠিক করে নেয়। এই ফ্ল্যাটে সেটা 40%, মানে তিনজনের মধ্যে জনপ্রতি 13.33%।"
      - "**বাকিটা মেঝের মাপ ধরে ভাগ করুন।** অন্য 60% যায় শোওয়ার ঘরের আকার অনুযায়ী। শোওয়ার ঘরগুলো মিলিয়ে 38 m² (16 + 12 + 10), তাই Priya-র অংশ 60% × 16/38, মানে 25.26%।"
      - "**দুই অংশ যোগ করুন।** Priya: 25.26% + 13.33% = 38.6%। Tom: 60% × 12/38 = 18.95%, তার সঙ্গে 13.33% যোগ করলে 32.3%। Aisha: 60% × 10/38 = 15.79%, তার সঙ্গে 13.33% যোগ করলে 29.1%।"
      - "**গোল করে মিলিয়ে নিন।** পূর্ণ শতাংশ টাইপ করা আর সেটা নিয়ে তর্ক করা দুটোই সহজ, তাই 38.6% হয় 39%, 32.3% হয় 32% আর 29.1% হয় 29%। 39 + 32 + 29 যে 100 হয় তা মিলিয়ে দেখুন। গোল করে 99 বা 101 এলে কার অংশ এক পয়েন্ট সরবে তা গ্রুপ ঠিক করে নেয়।"
  - heading: "ফ্ল্যাটের মাসটা পড়ে নেওয়া"
    body: "ভাড়া 39%, 32% আর 29% ভাগে ভাগ হলে দাঁড়ায় £760.50, £624.00 আর £565.50। Priya বাড়িওয়ালাকে টাকা দিয়েছে, তাই পুরো মাসে তার পাওনা £1,142.50, আর Tom-এর দেওয়ার আছে £566.00 এবং Aisha-র দেওয়ার আছে £576.50। Side Badger দুটি পেমেন্ট সাজেস্ট করে, দুটিই Priya-কে।"
  - heading: "Side Badger-এ সাজিয়ে নিন"
    body: "এক সন্ধ্যার কাজ, যার বেশিরভাগটা যায় ওই 40% নিয়ে আলোচনায়।"
    items:
      - "**গ্রুপ বানান।** ড্যাশবোর্ডে **গ্রুপ তৈরি করুন** বেছে ফ্ল্যাটের নামে গ্রুপের নাম দিন। **অন্যদের আমন্ত্রণ জানান** বেছে লিঙ্ক বা QR কোড পাঠান। সবাই সাইন ইন করে বা বিনামূল্যে অ্যাকাউন্ট খুলে, আর এই গ্রুপে যে নামে দেখা যেতে চায় সেটা বেছে নেয়।"
      - "**ভাড়া যোগ করুন।** **খরচ যোগ করুন** বেছে নিন। বিবরণ আর পরিমাণ লিখুন, আর **কে টাকা দিয়েছেন?** অংশে বাড়িওয়ালাকে যে দিয়েছে তাকে বেছে নিন। **যাদের মধ্যে ভাগ হবে** অংশে তিনজনকেই রাখুন, তারপর **কীভাবে ভাগ হবে** অংশে **শতাংশ** বেছে 39, 32 আর 29 লিখুন। শতাংশের যোগফল 100 না হলে ফর্ম সেটা জানিয়ে দেয়। **খরচ সংরক্ষণ করুন** বেছে নিন।"
      - "**বিলগুলো যোগ করুন।** বিদ্যুৎ আর ব্রডব্যান্ড আলাদা আলাদা খরচ, আর প্রতিটিতে টাকা দেওয়া মানুষ আলাদা হতে পারে। **কীভাবে ভাগ হবে** অংশে **সমান** যেমন আছে তেমনই থাকুক।"
      - "**আগামী মাসে কপি করুন।** গত মাসের ভাড়াটা খুলে **খরচ কপি করুন** বেছে নিন। কপিতে দাতা, পরিমাণ আর ভাগ একই থাকে, আর তারিখ হয় আজকের। ভাড়া বদলে থাকলে পরিমাণটা বদলান, তারপর **কপি তৈরি করুন** বেছে নিন।"
      - "**কে কার কাছে ঋণী দেখুন।** **ব্যালেন্স** অংশে সেটা দেখা যায়। যেভাবে খুশি একে অপরকে দিন, তারপর **সব শোধ করুন** থেকে পেমেন্টটা রেকর্ড করুন।"
  - heading: "অ্যাটাচড বাথরুম, ছোট্ট ঘর আর কারও চলে যাওয়া"
    items:
      - "**অ্যাটাচড বাথরুম আর ছোট্ট ঘর।** মেঝের মাপ শুধু শুরুর বিন্দু। নিজস্ব বাথরুমওয়ালা ঘর একই মাপের বাথরুমহীন ঘরের চেয়ে বেশি দামি, আর যে ছোট্ট ঘরে একটা বিছানা আর আশাবাদী একটা চেয়ার ঢোকে, সেটার দাম কম। সবার সম্মতিতে শতাংশ সামঞ্জস্য করুন, যোগফল তবুও 100 কি না দেখুন, আর চূড়ান্ত অঙ্কগুলো এমন জায়গায় লিখে রাখুন যেখানে পুরো ফ্ল্যাট দেখতে পায়।"
      - "**মাসের মাঝামাঝি কেউ চলে গেলে।** সেই মাসে প্রত্যেককে কত দিতে হবে তা হিসাব করুন, তারপর সেই মাসের ভাড়াটা **শতাংশ** দিয়ে নয়, **সঠিক পরিমাণ** দিয়ে লিখুন। পরিমাণগুলোর যোগফল ভাড়ার সমান হতে হবে। সে যাওয়ার আগেই এটা করুন। যতক্ষণ কারও দেওয়ার বা পাওনা বাকি থাকে, ততক্ষণ সে গ্রুপ ছাড়তে পারে না, আর গ্রুপ ছেড়ে যাওয়া কেউ জড়িত থাকলে সেই খরচ শুধু পড়ার জন্য হয়ে যায়।"
      - "**কেউ নতুন এলে।** আবার মাপুন, নতুন ঘরের মাপ নিয়ে অঙ্কগুলো আবার কষুন, আর পরের ভাড়া থেকে নতুন শতাংশ ব্যবহার করুন। আগের মাসগুলো যেমন ছিল তেমনই থাকে।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটা আপনার ঘর মাপে না, শতাংশও ঠিক করে দেয় না। মেঝের মাপ আর ওই 40% গ্রুপ নিজে ঠিক করবে।"
      - "এতে পুনরাবৃত্ত বিল নেই, তাই প্রতিবার গত মাসের ভাড়া কপি করতে হয়।"
      - "এটা কখনও টাকা নাড়াচাড়া করে না, বাড়িওয়ালাকেও দেয় না। আপনারা যেভাবে খুশি একে অপরকে দেন আর সেটা রেকর্ড করেন।"
      - "আপনার ভাড়াচুক্তিতে কী লেখা আছে তা এটা জানে না। এটা শুধু গ্রুপের মানুষদের মধ্যকার হিসাব রাখে।"
