meta:
  title: "Дели трошкове журки, свадби и заједничких поклона"
  description: "Дели трошкове журке, свадбе или заједничког поклона кад људи доприносе различите износе. Гласајте о плану, дели по тачним износима и види ко коме дугује."
h1: "Дели трошкове журки, свадби и заједничких поклона"
navLabel: "Догађаји и прославе"
lead: "Подели депозите, украсе и резервне кишобране. Распоред седења препусти неком храбријем. Side Badger на једном месту држи **ко је колико допринео**, па се и организатор може забавити."
cta:
  heading: "Почни са следећом прославом"
  body: "Направи кориснички налог, оснуј групу за догађај и пошаљи везу за позивницу. Side Badger је бесплатан, без огласа и без дневних ограничења."
  button: "Направи бесплатан налог"
scenario:
  heading: "Свако доприноси, не увек исто"
  body: "Неко плаћа депозит за простор, неко други купује торту, а трећа особа заједнички поклон плаћа сопственом картицом. Неки гости долазе на све, а неки само на вечеру. Водити поштену евиденцију о томе у низу порука посао је за који се нико није пријавио. Група у Side Badger-у држи све, каква год била мешавина износа, и свакоме показује шта дугује или шта му се дугује. Основе потражи у [како ради](page:how-it-works) или читај даље о догађају."
sections:
  - heading: "Одлучите заједно"
    body: "Пре него што се новац покрене, стави избор на **анкету**. Додај до 10 опција, на пример два простора или три идеје за поклон, и нека сви гласају. Можеш сакрити ко је за шта гласао, да свака опција добије поштено саслушање, а победник се прикаже кад се анкета затвори. Нико не мора листати четрдесет порука да сазна шта је одлучено."
  - heading: "Ко је у чему"
    body: "Не плаћају сви исто и не учествују сви у сваком трошку. Подели трошак једнако, по процентима или по **тачним износима**, па је удео сваке особе износ о коме сте се договорили. Изостави свакога ко није учествовао, на пример госте који су прескочили вечеру или пријатеље који се нису придружили поклону. Сваки трошак има једног платиоца, а сви остали у подели дугују му свој удео. Детаље потражи на страници [подела трошкова](page:feature/split-expenses)."
  - heading: "Сачувај папирологију"
    body: "Додај напомене трошковима, на пример шта је трошак покривао. Коментари остају **уз трошак** на који се односе, па питање „да ли је торта била £45 или £54?“ и одговор на њега живе на истом месту. Коментари могу имати до 500 знакова, што је више него довољно за питање о депозиту."
  - heading: "Контроле за организатора"
    body: "Отворена сарадња дозвољава сваком члану да додаје и мења трошкове, што је у реду за мали поклон. За свадбу или већу журку изабери шаблон **Управљана група**. Администратори одобравају сваког новог члана, а трошкове могу мењати само оснивачи и администратори. Позови људе везом или QR кодом; уз укључено одобравање администратор пушта сваку особу унутра, па списак гостију остаје списак гостију. Кад је догађај готов, закључај групу да бројеви остану."
  - heading: "Поравнајте се после журке"
    body: "Кад стигне последњи рачун, стања показују **ко коме дугује**, а Side Badger предлаже кратак списак уплата који поравнава све. Платите једни другима како год желите, а затим забележите уплату у групи. Side Badger никад не премешта новац, па група води евиденцију док се трансфери одвијају у вашим банкарским апликацијама. Страница [поравнање](page:feature/settle-up) показује како се клупко претвара у кратак списак."
exampleAfter: 5
