meta:
  title: "Side Badger proti Splitwisu: cela skupina, ne le računi | Side Badger"
  description: "Brezplačna alternativa Splitwisu za celo skupino: komentarji, vprašanja, seznami, ankete in prave vloge, poleg tega brezplačno skeniranje računov in pretvorba valut."
h1: "Side Badger proti Splitwisu: cela skupina, ne le računi"
navLabel: Side Badger proti Splitwisu
lead: "Nekdo v tvoji skupini je verjetno rekel „kar uporabi Splitwise“. Razumljivo: pri računanju je dober. Side Badger računa tudi, nato pa skupini da prostor, kjer se lahko vse pogovori: komentarji, vprašanja, seznami, ankete in prave vloge v skupini. Skeniranje računov in pretvorba valut sta zastonj."
cta:
  heading: Preizkusi ga pri naslednjem skupnem računu
  body: Ustvari brezplačen uporabniški račun, ustvari skupino in dodaj en pravi strošek. Če ni zate, te bo stalo nekaj minut, ne naročnine.
asOf: 2026-11-22
asOfNote: Splitwisove lastne strani smo prebrali {date}, da ti ni treba, in vse tukaj o Splitwisu izhaja iz njih. Vsaka vrstica tabele vodi do svojega vira. Paketi se spreminjajo, zato preverimo vsako četrtletje, če pa se Splitwisove strani ne ujemajo s to, verjemi njim.
