sections:
  - heading: "सिर्फ वही लोग जो वहां थे"
    body: "किसी लागत को सबके बीच बांटें, या सिर्फ उन लोगों के बीच जिन्होंने उसे बांटा। जो लोग किसी खर्च का हिस्सा नहीं थे उन्हें उससे बाहर रखें, और बैलेंस वही दिखाएंगे। जो रूममेट पूरे हफ्ते बाहर था वह टेकअवे का पैसा नहीं देता, जिसे [रूममेट्स](page:use-case/housemates) बुनियादी इंसाफ मानेंगे।"
  - heading: "वे बारीकियां जो बाद की बहस बचाती हैं"
    items:
      - "**तारीख** और चाहें तो समय डालें। आज, कल, आज सुबह और बीती रात जैसे शॉर्टकट थोड़ी टाइपिंग बचाते हैं।"
      - "खर्चों को समूह में रखने के लिए तीन तक **लेबल** जोड़ें, जैसे किराना या यात्रा।"
      - "**जगह** जोड़ें। मैप का लिंक पेस्ट करें और जगह का नाम अपने आप भर जाता है।"
      - "संख्या के पीछे की कहानी के लिए **नोट** जोड़ें, और कहानी को ज़रूरत हो तो थोड़ी फॉर्मेटिंग के साथ।"
      - "बातचीत को उस खर्च के पास रखने के लिए **कमेंट** इस्तेमाल करें जिसके बारे में वह है, किसी ऐसे चैट थ्रेड में नहीं जिसे कोई वापस स्क्रॉल नहीं करता।"
  - heading: "कॉपी करें, बदलें, और देखें क्या बदला"
    body: "पिछले महीने का किराया दोबारा टाइप करने की जगह कॉपी करें, फिर जो अलग है उसे बदलें। अगर कोई संख्या गलत थी, तो खर्च एडिट करें। पुराना वर्शन रखा जाता है और एडिट ग्रुप की गतिविधि में दिखता है, इसलिए कोई चुपचाप संख्या नहीं बदलता। कौन क्या एडिट कर सकता है यह ग्रुप की अनुमतियों पर निर्भर करता है।"
  - heading: "जब कुछ गलत लगे"
    body: "ग्रुप खर्च पर सवाल उठाना चालू कर सकता है। खर्च में शामिल कोई भी व्यक्ति सवाल उठाकर वजह बता सकता है, और खर्च तब तक बैलेंस से बाहर रहता है जब तक सवाल उठाने वाला या कोई एडमिन उसे बंद न कर दे। यह डिफ़ॉल्ट रूप से बंद है और एडमिन इसे ग्रुप के लिए चालू करता है। यह [इवेंट और जश्न](page:use-case/events-and-celebrations) के लिए ठीक बैठता है, जहां वह डिपॉज़िट जो किसी को याद नहीं अचानक सबका मामला बन जाता है।"
limits:
  heading: "सीमाएं"
  items:
    - "हर खर्च का एक ही पेमेंट करने वाला होता है। अगर दो लोगों ने पेमेंट किया, तो दो खर्च दर्ज करें।"
    - "आइटम के हिसाब से या शेयर के हिसाब से बंटवारा नहीं है। बराबर, सटीक राशि और प्रतिशत ही हैं।"
    - "प्रतिशत का जोड़ 100 होना चाहिए।"
    - "एक खर्च अपनी करेंसी में 999,999.99 तक हो सकता है, उस करेंसी के सामान्य दशमलव स्थानों के साथ।"
    - "खर्च अपने आप दोहराए नहीं जा सकते। इसकी जगह पिछले महीने का कॉपी करें।"
    - "तारीख भविष्य की या 10 साल से ज़्यादा पुरानी नहीं हो सकती।"
    - "जो खर्च ग्रुप छोड़ चुके किसी व्यक्ति से जुड़ा है वह सिर्फ पढ़ने के लिए हो जाता है।"
useCasesHeading: "इस तरह बांटना कहां काम आता है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या दो लोग एक ही खर्च का पेमेंट कर सकते हैं?"
      a: "एक खर्च में नहीं। दो दर्ज करें, हर पेमेंट करने वाले के लिए एक, और बैलेंस वही निकलते हैं।"
    - q: "क्या मैं रसीद को आइटम के हिसाब से बांट सकता हूँ?"
      a: "नहीं। बंटवारा बराबर, सटीक राशि या प्रतिशत से होता है। अलग-अलग आइटम वाले बिल के लिए हर व्यक्ति का बनता हुआ पैसा सटीक राशि के रूप में भरें।"
    - q: "क्या मैं डिफ़ॉल्ट बंटवारा तय कर सकता हूँ?"
      a: "नहीं। किसी पुराने खर्च को कॉपी करके उसका बंटवारा दोबारा इस्तेमाल करें, और जो अलग है उसे बदलें।"
    - q: "क्या बिल हर महीने दोहराए जा सकते हैं?"
      a: "नहीं। इसकी जगह पिछले महीने का खर्च कॉपी करें, जिसमें कुछ सेकंड लगते हैं।"
    - q: "खर्च कौन एडिट कर सकता है?"
      a: "जिसे ग्रुप की अनुमतियां इजाज़त दें। हर एडिट ग्रुप की गतिविधि में दिखता है, इसलिए बदलाव कभी चुपचाप नहीं होते।"
    - q: "इसके बाद बैलेंस का क्या होता है?"
      a: "खर्च आते ही वे अपडेट होते हैं, और [हिसाब चुकता करना](page:feature/settle-up) उन्हें पेमेंट की एक छोटी सूची में बदल देता है। अगर कोई खर्च दूसरी करेंसी में है, तो [कई करेंसी](page:feature/multiple-currencies) देखें।"
