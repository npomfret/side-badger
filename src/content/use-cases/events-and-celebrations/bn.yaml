meta:
  title: "পার্টি, বিয়ে ও গ্রুপ উপহারের খরচ ভাগ করুন"
  description: "মানুষ আলাদা আলাদা পরিমাণ দিলে পার্টি, বিয়ে বা গ্রুপ উপহারের খরচ ভাগ করুন। পরিকল্পনায় ভোট দিন, নির্দিষ্ট পরিমাণে ভাগ করুন আর দেখুন কে কার কাছে ঋণী।"
h1: "পার্টি, বিয়ে ও গ্রুপ উপহারের খরচ ভাগ করুন"
navLabel: "অনুষ্ঠান ও উদযাপন"
lead: "ডিপোজিট, সাজসজ্জা আর জরুরি ছাতার খরচ ভাগ করুন। বসার ব্যবস্থাটা কোনো সাহসী মানুষের হাতে ছেড়ে দিন। Side Badger **কে কত দিয়েছে** এক জায়গায় রাখে, যাতে আয়োজকও পার্টিটা উপভোগ করতে পারে।"
cta:
  heading: "পরের উদযাপন দিয়ে শুরু করুন"
  body: "অ্যাকাউন্ট খুলুন, অনুষ্ঠানের জন্য একটি গ্রুপ বানান আর আমন্ত্রণ লিঙ্ক পাঠান। Side Badger বিনামূল্যে, কোনো বিজ্ঞাপন ছাড়া আর দৈনিক কোনো সীমা ছাড়া।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
scenario:
  heading: "সবাই দেয়, সবসময় সমান নয়"
  body: "কেউ ভেন্যুর ডিপোজিট দেয়, আরেকজন কেক কেনে, আর তৃতীয়জন গ্রুপ উপহারটা নিজের কার্ডে নেয়। কিছু অতিথি সবকিছুতে আসে আর কিছু শুধু ডিনারে। চ্যাটের সুতোয় এর ন্যায্য হিসাব রাখা এমন কাজ যার জন্য কেউ আবেদন করেনি। একটি Side Badger গ্রুপ সবটা ধরে রাখে, পরিমাণের মিশ্রণ যা-ই হোক, আর প্রত্যেককে দেখায় সে কী দেবে বা কী পাবে। মূল বিষয়গুলোর জন্য দেখুন [কীভাবে কাজ করে](page:how-it-works), অথবা একটি অনুষ্ঠানের জন্য পড়তে থাকুন।"
sections:
  - heading: "একসঙ্গে ঠিক করুন"
    body: "টাকা নড়ার আগে বাছাইটা একটি **পোলে** দিন। 10টি পর্যন্ত বিকল্প যোগ করুন, যেমন দুটি ভেন্যু বা তিনটি উপহারের আইডিয়া, আর সবাইকে ভোট দিতে দিন। কে কাকে ভোট দিয়েছে তা লুকিয়ে রাখতে পারেন, যাতে প্রতিটি বিকল্প ন্যায্য শুনানি পায়, আর পোল বন্ধ হলে বিজয়ী দেখা যায়। কী ঠিক হলো জানতে কাউকে চল্লিশটা বার্তা পেছনে স্ক্রল করতে হয় না।"
  - heading: "কে কীসে আছে"
    body: "সবাই সমান দেয় না, আর সবাই প্রতিটি খরচের অংশ নয়। খরচ সমান ভাগে, শতাংশে বা **নির্দিষ্ট পরিমাণে** ভাগ করুন, যাতে প্রত্যেকের ভাগ হয় সেই অঙ্ক যাতে আপনারা রাজি হয়েছিলেন। যারা জড়িত ছিল না তাদের বাদ দিন, যেমন যে অতিথিরা ডিনার বাদ দিয়েছে বা যে বন্ধুরা উপহারে যোগ দেয়নি। প্রতিটি খরচে একজনই দেয়, আর ভাগে থাকা বাকি সবাই নিজের অংশ তাকে দেয়। বিস্তারিত আছে [খরচ ভাগ করা](page:feature/split-expenses) পৃষ্ঠায়।"
  - heading: "কাগজপত্র রেখে দিন"
    body: "খরচে নোট যোগ করুন, যেমন খরচটা কী কী ধরেছিল। মন্তব্য থাকে যে **খরচ** নিয়ে সেটার পাশেই, তাই “কেক কি £45 ছিল না £54?” প্রশ্নটা আর তার উত্তর একই জায়গায় থাকে। মন্তব্য 500 অক্ষর পর্যন্ত চলে, যা ডিপোজিট নিয়ে প্রশ্নের জন্য যথেষ্ট।"
  - heading: "আয়োজকের নিয়ন্ত্রণ"
    body: "খোলা সহযোগিতায় যেকোনো সদস্য খরচ যোগ ও সম্পাদনা করতে পারে, যা ছোট উপহারের জন্য ঠিক আছে। বিয়ে বা বড় পার্টির জন্য **ম্যানেজড গ্রুপ** প্রিসেট বেছে নিন। অ্যাডমিনরা প্রতিটি নতুন সদস্যকে অনুমোদন দেন, আর শুধু নির্মাতা ও অ্যাডমিনরা খরচ বদলাতে পারেন। মানুষজনকে লিঙ্ক বা QR কোড দিয়ে ডাকুন; অনুমোদন চালু থাকলে অ্যাডমিন প্রত্যেককে ঢুকতে দেন, তাই অতিথি তালিকা অতিথি তালিকাই থাকে। অনুষ্ঠান শেষ হলে গ্রুপ লক করুন যাতে সংখ্যাগুলো যেখানে আছে সেখানেই থাকে।"
  - heading: "পার্টির পরে হিসাব মেটান"
    body: "শেষ চালানটা এলে ব্যালেন্সগুলো দেখায় **কে কার কাছে ঋণী**, আর Side Badger পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে যাতে সবার হিসাব মেটে। যেভাবে খুশি একে অপরকে দিন, তারপর গ্রুপে পেমেন্টটা রেকর্ড করুন। Side Badger কখনও টাকা নাড়াচাড়া করে না, তাই গ্রুপ হিসাব রাখে আর ট্রান্সফারগুলো হয় আপনাদের নিজেদের ব্যাংকিং অ্যাপে। [হিসাব মেটানো](page:feature/settle-up) পৃষ্ঠা দেখায় জট কীভাবে একটি ছোট তালিকা হয়ে যায়।"
