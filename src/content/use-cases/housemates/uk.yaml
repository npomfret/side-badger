meta:
  title: "Діліть побутові рахунки із сусідами"
  description: "Діліть оренду за розміром кімнати, енергію та продукти порівну й щомісяця бачте, хто кому винен. Безкоштовний спосіб для сусідів вести облік."
h1: "Діліть побутові рахунки із сусідами"
navLabel: "Сусіди"
lead: "Для сусіда, який купує туалетний папір, і сусідів, які ніколи не бачать, як це відбувається. Side Badger веде один поточний облік оренди, рахунків і покупок для **сусідів по квартирі**, тож нікого не треба наздоганяти, а холодильник знову може бути просто холодильником."
cta:
  heading: "Почніть зі свого будинку"
  body: "Створіть обліковий запис, заведіть групу для будинку й надішліть усім посилання із запрошенням. Рахунки цього місяця можна внести вже сьогодні ввечері."
  button: "Створити безкоштовний обліковий запис"
scenario:
  heading: "Влаштуйте будинок"
  body: "Заведіть групу для будинку, оберіть ім'я, під яким хочете бути видимі в ній, і запросіть усіх за посиланням чи QR-кодом. Група може бути відкритою, де кожен додає й редагує, або керованою, де нових учасників схвалює адміністратор, а витрати можуть змінювати лише творці й адміністратори, що пасує сусідові, який веде облік. Хто хоче лише стежити за цифрами, може бути глядачем, який бачить усе й нічого не змінює. Усі бачать нову витрату одразу, тож у «додам потім» менше схованок."
sections:
  - heading: "Оренда та рахунки"
    body: "Оренда рідко ділиться на чотири, бо спальні не однакові. Розділіть її у відсотках, щоб велика кімната платила більше, а комірка з вікном — менше. Відсотки мають у сумі давати 100. Рахунки, якими користуються всі, отримують рівний розподіл, а сусіда, який не брав участі у витраті, можна з неї виключити. Коли рівний розподіл лишає зайву копійку, вона дістається одній людині навмання. Регулярних рахунків немає, тож щомісяця ви копіюєте оренду минулого місяця, змінюєте дату й рухаєтеся далі."
  - heading: "Спільні покупки"
    body: "Тримайте спільний список покупок в одній групі з чеками за покупки й відзначайте пункти, коли вони потрапляють до візка. Хто робить покупки, додає суму з чека як витрату й ділить її порівну або лише між людьми, які це з'їдять. Хто постійно купує вівсяне молоко, якого ніхто інший не п'є, лишається справою будинку, але список витрат принаймні буде точним. Дозволи групи визначають, хто може створювати й редагувати списки. Складіть оренду, рахунки й покупки разом, і вийде місяць, як нижче, у будинку з чотирьох: Джо платить 2 000 £ оренди, розділеної 30 %, 25 %, 25 % і 20 % за розміром кімнати, потім Кваме платить 120 £ за енергію, Лена 40 £ за інтернет, а Мет 80 £ за продукти, кожне розділене порівну. Джо в підсумку має отримати 1 340 £, і Side Badger підказує три платежі, усі Джо."
  - heading: "Чесні способи ділити побутові витрати"
    items:
      - "**Порівну** пасує до того, чим усі користуються приблизно однаково, як-от інтернет, засоби для прибирання та спільні покупки. Це швидко, і нікому не треба сперечатися про математику."
      - "**За розміром кімнати** пасує до оренди, бо кімнати різні, як і те, скільки люди готові за них платити. Домовтеся про відсотки раз, коли хтось заселяється, і користуйтеся ними щомісяця."
      - "**За використанням** пасує до рахунків, де одна людина явно використовує більше, як-от рахунок за опалення домашнього офісу чи стрімінговий акаунт, який дивляться двоє. Пропустіть тих, хто не брав участі, або введіть точні суми для кожного."
      - "Що б ви не обрали, домовтеся до першого рахунку, а не після першої сварки, і запишіть правило там, де його бачить увесь будинок."
  - heading: "Коли хтось виїжджає"
    body: "Спершу розраховуються. Ніхто не може покинути групу, поки винен гроші або йому їх винні, тож той, хто виїжджає, платить чи отримує, ви це записуєте, і лише тоді він іде. Продовжуйте групу для сусідів, що залишилися, і запросіть нову людину за посиланням. Коли будинок завершено, адміністратор може заблокувати групу, щоб цифри лишилися на місці, або закрити її назавжди, що робить її недоступною для всіх, тож робіть це лише тоді, коли нікому не потрібна історія."
