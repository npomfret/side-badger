featuresHeading: "Di features wey couple dey use"
faq:
  heading: "Question dem"
  items:
    - q: "We fit set 60/40 once for everything?"
      a: "No. Di split belong to each expense. Set di percentages for di first one, then copy am next time and change wetin different. [Share expenses](page:feature/split-expenses) cover all three ways to share."
    - q: "E dey link to our bank?"
      a: "No. Side Badger no dey ever touch your money. Una go pay each other anyhow una like, then record am, as [settle up](page:feature/settle-up) explain."
    - q: "Anybody else fit see our group?"
      a: "Only im members, and couple group get two. Anybody wey use live invite link fit join, so share am with one person and give am short expiry."
    - q: "Wetin if each of us pay part of di same bill?"
      a: "Expense get one payer. Record two expenses, one for each of una, and di balance go come out di same."
    - q: "E go remind my partner to pay?"
      a: "No. No reminders dey, so di nudge still be your own. At least una go both dey look di same number."
    - q: "Wetin go happen when we stop to share costs?"
      a: "Settle di balance and record di payment, so nobody go owe anything. Then admin fit lock di group, wey go keep di numbers as dem be, or close am for good, wey go make am inaccessible to everybody. Close am only when neither of una need di history."
