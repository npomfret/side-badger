meta:
  title: "Αριθμομηχανή διαχωρισμού: ποιος χρωστά σε ποιον | Side Badger"
  description: "Ποιος πλήρωσε, ποιος χρωστά, ποιος πληρώνει ποιον: λυμένο σε δευτερόλεπτα. Εξίσου, με ακριβή ποσά ή ποσοστά. Δωρεάν, στο πρόγραμμα περιήγησής σας, χωρίς αποθήκευση ή αποστολή."
h1: "Αριθμομηχανή διαχωρισμού λογαριασμού"
navLabel: "Αριθμομηχανή διαχωρισμού"
lead: "Πληκτρολογήστε ποιος πλήρωσε τι και η αριθμομηχανή λέει ποιος χρωστά σε ποιον, με μια σύντομη λίστα πληρωμών που τα τακτοποιεί. Τρέχει στο πρόγραμμα περιήγησής σας, δεν αποθηκεύει τίποτα και δεν μετακινεί χρήματα. Αν η ομάδα σας θέλει να μένει ο λογαριασμός και μετά το κλείσιμο της καρτέλας, ο [διαχωρισμός εξόδων](page:feature/split-expenses) και η [εκκαθάριση](page:feature/settle-up) στο Side Badger κάνουν τις ίδιες πράξεις και τις κρατούν."
cta:
  heading: "Σας αρέσουν οι πράξεις; Κρατήστε τις."
  body: "Αυτή η αριθμομηχανή τα ξεχνά όλα μόλις κλείσετε την καρτέλα, ακριβώς όπως όποιος πλήρωσε σίγουρα την προηγούμενη φορά. Μια ομάδα στο Side Badger κρατά τα έξοδα, ενημερώνει το υπόλοιπο του καθενός και καταγράφει τις πληρωμές. Είναι δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
sections:
  - heading: "Πώς γίνεται ο υπολογισμός"
    body: "Για κάθε έξοδο, η αριθμομηχανή βρίσκει το μερίδιο του καθενός. Μπορείτε να το χωρίσετε εξίσου, με ακριβή ποσά ή με ποσοστά, ανάμεσα στα άτομα που θα διαλέξετε. Το υπόλοιπο κάθε ατόμου είναι τότε όσα πλήρωσε μείον όσα χρωστά. Το σύμβολο συν σημαίνει ότι η ομάδα χρωστά στο άτομο και το σύμβολο πλην ότι το άτομο χρωστά στην ομάδα. Τα υπόλοιπα αθροίζονται πάντα σε μηδέν, επειδή όσα οφείλονται σε ένα άτομο, τα χρωστούν τα υπόλοιπα."
  - heading: "Γιατί η λίστα πληρωμών είναι σύντομη"
    body: "Κανείς δεν χρειάζεται να τακτοποιήσει κάθε απόδειξη χωριστά. Μόλις γίνουν γνωστά όλα τα υπόλοιπα, η αριθμομηχανή ταιριάζει το άτομο που χρωστά τα περισσότερα με το άτομο στο οποίο οφείλονται τα περισσότερα, τακτοποιεί με μία πληρωμή όσο γίνεται περισσότερο και συνεχίζει στη λίστα μέχρι να φτάσουν όλοι στο μηδέν. Ποτέ δεν χρειάζονται περισσότερες πληρωμές από τον αριθμό των ατόμων με υπόλοιπο, μείον μία, και συχνά χρειάζονται λιγότερες από ό,τι αν τακτοποιούσατε έξοδο προς έξοδο. Δίνει μια σύντομη λίστα πληρωμών και δεν υπόσχεται ότι είναι η συντομότερη δυνατή."
  - heading: "Τι δεν κάνει η αριθμομηχανή"
    items:
      - "**Δεν δουλεύει με πάνω από ένα νόμισμα.** Διαλέξτε ένα και χρησιμοποιήστε το σε όλον τον υπολογισμό. Η εφαρμογή κρατά ξεχωριστό υπόλοιπο για κάθε νόμισμα και μπορεί να μετατρέψει ένα έξοδο με μια τρέχουσα συναλλαγματική ισοτιμία, την οποία μπορείτε να αλλάξετε."
      - "**Δεν αποθηκεύει τίποτα.** Κλείστε την καρτέλα και τα ποσά χάνονται. Για να τα κρατήσετε, αντιγράψτε τον σύνδεσμο. Κρατά τα ποσά σας μετά το #, που το πρόγραμμα περιήγησής σας δεν στέλνει ποτέ σε διακομιστή, και όποιος τον λάβει από εσάς μπορεί να τα διαβάσει."
      - "**Δεν μετακινεί χρήματα.** Σας λέει ποιος πρέπει να πληρώσει ποιον. Πληρώνετε ο ένας τον άλλον όπως θέλετε και μετά καταγράφετε την πληρωμή στην εφαρμογή, αν η ομάδα σας κρατά εκεί τον λογαριασμό."
      - "**Δεν επιλέγει τυχαία το περιττό λεπτό.** Όταν ένας λογαριασμός δεν διαιρείται ακριβώς, τα λεπτά που περισσεύουν πάνε στα πρώτα άτομα της λίστας, ώστε τα σύνολα να βγαίνουν σωστά. Στην εφαρμογή, το περιττό λεπτό πηγαίνει σε ένα άτομο τυχαία, οπότε δεν είναι πάντα το ίδιο."
      - "**Δεν ξεπερνά τα όρια.** Η αριθμομηχανή δέχεται από 2 έως 20 άτομα και ένα έξοδο μπορεί να φτάσει έως 999.999,99, όπως στην εφαρμογή."
exampleAfter: 2
