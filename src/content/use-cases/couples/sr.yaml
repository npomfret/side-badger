featuresHeading: "Функције које пар користи"
faq:
  heading: "Питања"
  items:
    - q: "Можемо ли једном да поставимо 60/40 за све?"
      a: "Не. Подела припада сваком трошку. Постави проценте на првом, па га следећи пут копирај и промени оно што је другачије. [Подела трошкова](page:feature/split-expenses) покрива сва три начина дељења."
    - q: "Повезује ли се са нашом банком?"
      a: "Не. Side Badger никад не дира ваш новац. Плаћате једно другом како хоћете, па то забележите, како објашњава [поравнање](page:feature/settle-up)."
    - q: "Може ли још неко да види нашу групу?"
      a: "Само њени чланови, а група пара има двоје. Свако ко користи важећу везу за позивницу може да се придружи, зато је подели с једном особом и дај јој кратак рок истека."
    - q: "Шта ако смо сваки платили део истог рачуна?"
      a: "Трошак има једног платиоца. Забележи два трошка, по један за свакога од вас, и стање испада исто."
    - q: "Хоће ли подсетити мог партнера да плати?"
      a: "Не. Нема подсетника, па је подсећање и даље на теби. Бар ћете обоје гледати исти број."
    - q: "Шта се дешава кад престанемо да делимо трошкове?"
      a: "Поравнајте стање и забележите уплату, да нико ништа не дугује. Затим администратор може да закључа групу, што чува бројеве какви јесу, или да је затвори заувек, чиме постаје недоступна свима. Затвори је тек кад никоме од вас не треба историја."
