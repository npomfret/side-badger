faq:
  heading: "Perguntas"
  items:
    - q: "A madrinha ou o padrinho paga mais?"
      a: "Só se o grupo combinar. A app não dá nenhum papel especial a ninguém nas contas. Se alguém assumir mais, escolhe **Valores exatos** ou **Percentagem** em **Como dividir** e introduz as partes que combinaram."
    - q: "E as bebidas que algumas pessoas não tomaram?"
      a: "Adiciona as bebidas como despesa própria e assinala só as pessoas que as tomaram. Se cada pessoa tomou uma quantidade diferente, escolhe **Valores exatos** e escreve a parte de cada uma. Ninguém paga o que não consumiu."
    - q: "A pessoa homenageada pode ver o grupo mais tarde?"
      a: "Sim, depois de a surpresa acabar. Convida-a e depois um administrador pode torná-la **Visualizador** em **Segurança**, nas definições do grupo. Um visualizador vê tudo e não altera nada, por isso espera até já nada ser segredo. Precisa de uma conta grátis para entrar."
