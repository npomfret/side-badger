meta:
  title: Utgiftsdelning utan nedladdning | Side Badger
  description: Telefonen är full, vi fattar. Side Badger körs i webbläsaren, utan appbutik och utan nedladdning. Lägg till den på hemskärmen så öppnas den som en app.
h1: Ingen appbutik. Ingen nedladdning. Känns ändå som en app
navLabel: Webbapp
lead: Side Badger bor i din webbläsare. Det finns ingen appbutik att söka i och inget att ladda ner först. Logga in på en telefon eller en dator, dela utgifter online med gruppen och lägg till den på hemskärmen eller i Dock när du vill ha den ett tryck bort.
cta:
  heading: Öppna den. Logga in. Starta en grupp.
  body: Skapa ett konto, starta en grupp och lägg till den första utgiften, allt från webbläsaren du redan har öppen. Vill du ha rundturen först? Se [så fungerar det](page:how-it-works), eller kolla [vad gratis omfattar](page:pricing).
problem:
  heading: Telefonen är full. Vi fattar.
  body: Någonstans på den finns fyra tusen foton av samma solnedgång och en lagringsvarning du har svept bort sedan i våras. Det sista den behöver är ännu en app, bara för att dela en middag. Så Side Badger är en webbapp. Den körs i en modern webbläsare på en telefon eller en dator. På en telefon används mobillayouter, med gruppsidan uppdelad i flikar och kontroller som är lätta att trycka på. Vissa extrafunktioner, som att lägga till den på hemskärmen, beror på din webbläsare, och vi säger var.
workflow:
  heading: Från webbläsarflik till hemskärm i tre steg
  steps:
    - title: Öppna den och logga in
      body: Gå till Side Badger i din webbläsare och logga in. Allt du behöver är en e-postadress och ett lösenord, och du verifierar e-postadressen innan du kan lägga till något. Alla i gruppen behöver ett konto, så de du bjuder in gör detsamma.
    - title: Lägg till den på hemskärmen eller i Dock
      body: När du är inloggad erbjuder appen att installera sig själv. Du får en knapp **Installera** där din webbläsare tillåter det, och **Visa hur** där den inte gör det. Missade du det, eller sa nej? **Inställningar** har samma hjälp under **Lägg till på hemskärmen eller i Dock**. På en iPhone eller iPad visar Inställningar iPhone-stegen först och gömmer de andra enheterna under **Andra enheter**. Hur som helst öppnas appen sedan i ett eget fönster.
      shot: S20
      shotAlt: Avsnittet Lägg till på hemskärmen eller i Dock i Inställningar, med stegen för att lägga till appen på en enhet
    - title: Slå på aviseringar, om du vill
      body: Aviseringar är avstängda tills du slår på dem, och varje enhet slås på för sig. Använd knappen **Slå på** som aviseringsklockan erbjuder, eller reglaget **Pushaviseringar** i **Inställningar**. På en iPhone eller iPad, öppna appen från hemskärmen först. Det är det enda stället där aviseringar fungerar där.
      shot: S19
      shotAlt: Aviseringsrutan öppen, med en lista över senaste aktivitet i gruppen
options:
  heading: Så lägger du till den, enhet för enhet
  items:
    - title: iPhone och iPad
      body: Tryck på knappen Dela, en fyrkant med en pil som pekar uppåt. Om du inte ser den trycker du först på de tre prickarna (•••) och sedan på Dela. Bläddra nedåt och tryck på **Lägg till på hemskärmen**. Låt **Öppna som webbapp** vara på och tryck sedan på **Lägg till**. Om en länk öppnades i en annan app, öppna sidan i Safari först, eftersom den inbyggda webbläsaren inte kan lägga till den.
    - title: Android
      body: Öppna webbläsarens meny och välj **Lägg till på startskärmen** eller **Installera app**.
    - title: Chrome eller Edge på en dator
      body: Öppna webbläsarens meny och välj alternativet för att installera webbplatsen som en app. Då får den ett eget fönster och en egen ikon.
    - title: Safari på en Mac
      body: Välj **Arkiv** och sedan **Lägg till i Dock**.
sections:
  - heading: Aviseringar, bara om du ber om dem
    body: Pushaviseringar är valfria. Slå på dem så får du en avisering när det finns ny aktivitet i dina grupper, till exempel att någon lägger till en utgift, skriver en kommentar eller registrerar en betalning. De slås på en enhet i taget, från aviseringsklockan eller från **Inställningar**, och du kan stänga av dem där igen. De kräver en webbläsare som stöder dem och ditt tillstånd. Om din webbläsare har blockerat dem för webbplatsen, tillåt dem först i webbläsarens inställningar. På en iPhone eller iPad fungerar de bara från appen som lagts till på hemskärmen, inte från en webbläsarflik. Leverans garanteras inte, så se en avisering som en knuff, inte ett löfte. För vad som dyker upp i flödet, se [planera tillsammans](page:feature/plan-together).
  - heading: Liveuppdateringar, ingen uppdateringsknapp
    body: Lägg till en utgift så ser alla den direkt, tillsammans med vad som ändrades och vem som ändrade. Varje grupp har en aktivitetshistorik, och aviseringsklockan visar aktivitet i alla dina grupper. Ingen behöver fråga om du har sett det du just lade till. Det är redan på deras skärm.
  - heading: 39 språk, och alla väljer sitt eget
    body: Använd Side Badger på 39 språk, inklusive arabiska, persiska och urdu, som skrivs från höger till vänster. Alla i gruppen väljer sitt eget, så samma gruppsida kan vara på arabiska för en person och på engelska för nästa. Det enda gruppen måste vara överens om är siffrorna.
  - heading: Byggd för mer än en sorts användare
    body: Side Badger är byggd med tanke på tangentbords- och skärmläsaranvändare. Medlemsfärgerna kommer med mönster, så du behöver inte skilja grönt från rött.
    items:
      - Hoppa-över-länkar, så att tangentbordsanvändare kan hoppa rakt till innehållet.
      - Dialogrutor hanterar tangentbordsfokus.
      - Kontroller har etiketter, för skärmläsare.
      - Layouter vänds för språk som skrivs från höger till vänster.
limits:
  heading: Vad webbappen inte gör
  items:
    - Det finns ingen offlineanvändning. Side Badger behöver uppkoppling, så den öppnar inte din grupp på ett flyg utan wifi.
    - Det finns ingen app i någon appbutik och ingen inbyggd iPhone- eller Android-app. Side Badger är en webbapp, och att lägga till den på hemskärmen eller i Dock är hur du får den appliknande versionen.
    - Att lägga till den på en hemskärm eller i Dock beror på din webbläsare. Menynamnen varierar mellan webbläsare och versioner, och vissa webbläsare erbjuder det inte.
    - Pushaviseringar är valfria per enhet och kräver en webbläsare som stöder dem och ditt tillstånd. På en iPhone eller iPad fungerar de bara från appen som lagts till på hemskärmen. Leverans garanteras inte.
    - Det finns inga e-post- eller sms-aviseringar och inga betalningspåminnelser. Ny aktivitet syns i appen, och som pushaviseringar om du slår på dem. Att jaga en betalning är fortfarande ditt jobb.
    - Aktivitet sparas i 90 dagar.
    - Du loggar in med en e-postadress och ett lösenord. Det finns ingen inloggning med Google eller Apple, och du måste vara 18 år eller äldre.
    - Vi påstår inte att Side Badger är fullt tillgänglig, eller att den uppfyller en formell tillgänglighetsstandard. Om något står i vägen, berätta för oss inifrån appen så ser du vårt svar där.
useCasesHeading: Där det hjälper att slippa en app
faq:
  heading: Frågor
  items:
    - q: Finns det en Side Badger-app i en appbutik?
      a: Nej. Side Badger är en webbapp. Du öppnar den i webbläsaren och kan lägga till den på hemskärmen eller i Dock så att den öppnas som en app. Det finns inget att ladda ner från en appbutik.
    - q: Kan jag dela utgifter utan att ladda ner en app?
      a: Ja. Öppna Side Badger i en webbläsare på telefonen eller datorn, logga in och starta en grupp. Att lägga till den på hemskärmen eller i Dock är valfritt.
    - q: Fungerar den offline?
      a: Nej. Side Badger behöver uppkoppling, även när den är tillagd på hemskärmen eller i Dock.
    - q: Varför får jag inga aviseringar på min iPhone?
      a: På en iPhone eller iPad fungerar aviseringar bara från appen som lagts till på hemskärmen, inte från en webbläsarflik. Lägg till den, öppna den från ikonen på hemskärmen och slå sedan på aviseringar i **Inställningar**. Leverans garanteras inte, så om en försvinner visar gruppens aktivitetshistorik ändå vad som lades till.
    - q: Måste jag slå på aviseringar?
      a: Nej. De är avstängda tills du slår på dem, en enhet i taget. Utan dem syns ny aktivitet ändå i appen, och alla ser en ändring direkt när de har den öppen.
    - q: Behöver alla i gruppen ett konto?
      a: Ja. Allt du behöver är en e-postadress och ett lösenord, och du verifierar e-postadressen innan du kan lägga till något. Alla som går med i en grupp gör detsamma, på vilken telefon eller dator de vill.
