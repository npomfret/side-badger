faq:
  heading: Frågor
  items:
    - q: Är kalkylatorn gratis?
      a: Ja. Gratis. Utan annonser. Utan dagliga gränser. Du behöver inget konto heller.
    - q: Sparar den det jag skriver?
      a: Nej. Ingenting sparas eller skickas någonstans. Vill du behålla dina siffror, använd Kopiera länk och spara länken någonstans.
    - q: Vem kan se länken jag kopierar?
      a: "Alla som har den. Siffrorna ligger i själva länken, efter #, så dela den bara med dem som ska se dem."
    - q: Flyttar den pengar?
      a: Nej. Den räknar ut vem som ska betala vem, och ni betalar varandra hur ni vill. Inte heller Side Badger rör dina pengar. Se [göra upp](page:feature/settle-up).
    - q: Kan jag dela en resa som betalats i två valutor?
      a: Inte här, eftersom en uträkning har en valuta. I en grupp har varje valuta sitt eget saldo. Se [flera valutor](page:feature/multiple-currencies).
    - q: Vad händer om beloppen inte stämmer?
      a: Kalkylatorn säger det under utgiften och visar inget resultat förrän de stämmer. Exakta belopp måste bli lika med totalsumman, och procenten måste bli 100.
