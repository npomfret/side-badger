meta:
  title: 均等・金額指定・割合指定で割り勘 | Side Badger
  description: 共有の費用を均等、金額指定、割合指定で分け、いなかった人は外せます。無料で、広告も1日の制限もありません。
h1: 均等・金額指定・割合指定で割り勘
navLabel: 割り勘の仕方
lead: 何でも半分ずつとは限りません。Side Badgerなら大丈夫。誰が支払ったかを入力し、費用を分け合った人を選んで、**均等、金額指定、割合指定**で分割します。恨みの精算は別売りです。
cta:
  heading: 次の割り勘は、きちんと
  body: 無料アカウントを作成し、グループを始めて、ずっと片付けたかった支出を追加しましょう。次に何が起きるか気になる方は[使い方](page:how-it-works)、無料の範囲は[料金](page:pricing)をご覧ください。
  button: 無料アカウントを作成
problem:
  heading: 何でも半分ずつとは限らない
  body: 家賃は部屋の広さに応じて決まります。贈り物は、誰が何を約束したかで決まります。夕食は、デザートまで残った人で決まります。請求書を半分に分ける方法は、半分にならない最初の請求書が来るまでは通用し、その後は誰かが表計算シートを開くことになります。Side Badgerは、誰が支払い、誰が費用を分け合い、どう分けるかを記録するので、食卓で誰も筆算をしなくても、残高は正しく計算されます。
workflow:
  heading: 支出の追加を、最初から最後まで
  steps:
    - title: 誰が何のために支払ったかを入力
      body: 金額、短い内容、支払った人を入力します。1つの支出につき支払う人は1人で、計算が正確に保たれます。
      shot: S05
      shotAlt: 山荘の家賃を3人で割合指定で分割している支出フォーム
    - title: 分け方を選ぶ
      body: 均等、金額指定、割合指定から選びます。割合は合計が100になる必要があり、金額指定は合計が総額と一致する必要があります。
      shot: S06
      shotAlt: 贈り物の支出で、一人ひとりに金額を入力した支出フォーム
    - title: 経緯を添える
      body: 日付を設定し、ラベル、場所、メモを追加します。グループの全員が同じ詳細を見られ、その場でコメントもできます。
      shot: S08
      shotAlt: 詳細、コメントのやり取り、入力時の元の金額が表示された支出
    - title: おかしいと思ったら質問する
      body: グループで支出への質問をオンにしている場合、支出に含まれる人なら誰でもその支出に質問でき、支出リストでは質問中のものだけを表示できます。
      shot: S18
      shotAlt: 「質問あり」バッジと「質問ありのみ」フィルターが表示された支出リスト
options:
  heading: 3つの分け方
  items:
    - title: 均等
      body: 夕食やタクシーなど、みんなで同じように分けたものの標準設定です。合計が割り切れない場合、端数の1ペニーはランダムに1人へ回り、いつも同じ人にはなりません。下のタクシーでは、Anaになりました。
    - title: 金額指定
      body: 各自の負担額を入力します。全員が違う金額を選んだ贈り物や、誰かのカゴに共有の食料品以外が入っていた買い物に向いています。金額は合計が総額と一致する必要があります。
    - title: 割合指定
      body: 各自に総額の割合を割り当てます。部屋の広さで分ける家賃が定番で、広い部屋ほど多く負担し、誰もそれを否定しません。
example:
  heading: 山荘での週末、4つの支出、3つの分け方
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: 山荘（部屋の広さで分割）
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: 夕食
      payer: ben
      amount: 84
      split:
        method: equal
    - label: 食料品
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: 帰りのタクシー
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: その場にいた人だけで
    body: 費用は全員で分けても、分け合った人だけで分けても構いません。参加していない費用から人を外せば、残高にもそれが反映されます。1週間ずっと留守にしていたルームメイトはテイクアウト代を負担しなくて済みます。[ルームメイト](page:use-case/housemates)なら、ごく当たり前の公平さだとわかるはずです。
  - heading: あとの口論を減らす詳細
    items:
      - "**日付**と、任意で時刻を設定します。今日、昨日、今朝、昨夜などのショートカットで入力の手間を省けます。"
      - 支出をまとめる**ラベル**を最大3つまで付けられます。食料品や旅行などです。
      - "**場所**を追加します。地図のリンクを貼ると、場所の名前が自動で入力されます。"
      - 数字の裏にある経緯を**メモ**に書き残せます。必要なら書式も使えます。
      - "**レシート**を写真またはPDFで最大3つまで添付でき、証拠が支出と一緒に残ります。"
      - "**コメント**を使えば、会話を誰もさかのぼらないチャットではなく、その支出のすぐそばに残せます。"
  - heading: コピー、編集、変更点の確認
    body: 先月の家賃は、入力し直さずにコピーして、違う部分だけ変更します。数字が間違っていたら、支出を編集します。以前のバージョンは保存され、編集内容はグループのアクティビティに表示されるので、誰かがこっそり数字を変えることはありません。誰が何を編集できるかは、グループの権限によります。
  - heading: おかしいと感じたとき
    body: グループは支出への質問をオンにできます。支出に含まれる人なら誰でも理由を添えて質問でき、質問した人か管理者が終了するまで、その支出は残高から除外されます。初期設定ではオフで、グループの管理者がオンにします。誰も覚えていない手付金が突然みんなの関心事になる、[イベントやお祝い](page:use-case/events-and-celebrations)に向いています。
limits:
  heading: 制限
  items:
    - 1つの支出につき支払う人は1人です。2人が支払った場合は、2つの支出を記録してください。
    - 品目ごとの分割や、持ち分（シェア）による分割はありません。均等、金額指定、割合指定がすべてです。
    - 割合は合計が100になる必要があります。
    - 1件の支出は、その通貨で999,999.99まで、その通貨の通常の小数桁数で入力できます。
    - 支出を自動で繰り返すことはできません。代わりに先月の支出をコピーしてください。
    - 日付は未来や10年より前にはできません。
    - グループを退出した人が関わる支出は、読み取り専用になります。
useCasesHeading: こんな割り勘が役立つ場面
faq:
  heading: よくある質問
  items:
    - q: 1つの支出を2人で支払えますか？
      a: 1つの支出ではできません。支払った人ごとに2つ記録すれば、残高は同じになります。
    - q: レシートを品目ごとに分けられますか？
      a: いいえ。分け方は均等、金額指定、割合指定のいずれかです。品目が異なる請求書は、各自の負担額を金額指定で入力してください。
    - q: 標準の分け方を設定できますか？
      a: いいえ。以前の支出をコピーして同じ分け方を再利用し、違う部分だけ変更してください。
    - q: 請求を毎月繰り返せますか？
      a: いいえ。代わりに先月の支出をコピーしてください。数秒で済みます。
    - q: 支出は誰が編集できますか？
      a: グループの権限で許可された人です。編集はすべてグループのアクティビティに表示されるので、変更が黙って行われることはありません。
    - q: そのあと残高はどうなりますか？
      a: 支出が追加されるたびに更新され、[精算](page:feature/settle-up)で短い支払いリストになります。支出が別の通貨の場合は、[複数の通貨](page:feature/multiple-currencies)をご覧ください。
