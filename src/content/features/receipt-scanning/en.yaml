meta:
  title: Scan a receipt to add an expense | Side Badger
  description: Let the badger read the receipt. It fills in the total, date and place for you to check, with no scan credits. Google's AI service reads the image.
h1: Scan a receipt, check the details, split it
navLabel: Receipt scanning
lead: Let the badger read the receipt, and check its homework. Add a photo to a new expense and Side Badger fills in the total, date and place for you to check. Then you [split it](page:feature/split-expenses) like any other expense. Scanning is free, with no scan credits. It fills in one expense and does not divide the bill by item. Receipt images are read by Google's AI service.
cta:
  heading: Snap it. Check it. Split it.
  body: Create a free account, start a group and add an expense with a receipt photo. See what it fills in, change whatever is off, and save when you're happy.
problem:
  heading: Nobody wants to type a receipt in a taxi queue
  body: Trips and big nights out come with paper. Dinner, the taxi, the round that turned into six. Typing each one into a phone with cold thumbs and a queue behind you is how expenses get forgotten. So Side Badger will read the receipt for you. It does the first draft and you do the checking. It suits [group trips](page:use-case/group-trips) and [events and celebrations](page:use-case/events-and-celebrations), where the receipts pile up faster than anyone wants to deal with them.
workflow:
  heading: From photo to expense in three steps
  steps:
    - title: Add a receipt to a new expense
      body: Start a new expense and tap **Scan receipt**, or use the **Scan receipt** quick action on your dashboard. Take a photo or choose one you already have. **Add receipt or attachment** on the form works too.
    - title: Let it read the receipt
      body: The form says **Analysing receipt...** while Side Badger's AI reads the image. Then it fills in what it found, such as the description, the total, the currency, the date, the time and the place. Anything you had already typed is left alone.
      shot: S09
      shotAlt: The new expense form showing Analysing receipt..., then the same form with the details filled in
    - title: Check it, then split it
      body: Compare the form with the paper. Fix anything that is off, say who paid and who shared the cost, choose how to split it and save. The expense does not exist until you do. [Split expenses](page:feature/split-expenses) covers the splitting.
options:
  heading: Options
  items: []
sections:
  - heading: What it fills in
    body: Add a receipt image to a new expense and these fields can fill in. Who paid, who shared the cost and how to split it are still down to you.
    items:
      - A **description** for the expense.
      - The **total**.
      - The **currency**, if your group allows it.
      - The **date** and the **time**.
      - The **place**.
      - A text copy of the receipt in the **notes**, for when the paper one fades or goes through the wash.
  - heading: What you still check
    body: All of it. Treat what it fills in as a draft. Check the total against the paper, then the currency, date and place. Blurry photos and crumpled paper can fool any reader, and we don't promise it gets every receipt right, so please look before you save. If something is off, type over it. If the receipt is in yen and the group settles in pounds, [multiple currencies](page:feature/multiple-currencies) covers what happens next.
  - heading: Keep the receipt with the expense
    body: Scanned or not, a receipt can stay with the expense. Attach photos or PDFs, up to three per expense and up to 10 MB each. Group members see them on the expense. Images show as thumbnails that open in a viewer, and PDFs open as links. The photo you scan is attached too, unless you remove it before you save. When someone asks what that dinner really cost, the proof is right there.
  - heading: Where your receipt goes
    body: Receipt images are read by Google's AI service. To fill in the form, the image is read by Google Vertex AI (Gemini) in Google's US multi-region. Add an image to a new expense and it gets read. A PDF, or a photo added to an expense that already exists, is stored without being read. Attached receipts are visible to the members of the group, so if a receipt shows something you would rather not share, skip the photo and type that expense in.
limits:
  heading: Limits
  items:
    - Images only. JPEG, PNG and WebP, and HEIC once converted. PDFs can be attached to an expense but are not read.
    - Scanning is for new expenses only. On an existing expense you can attach receipts, but nothing gets read.
    - It fills only the fields you haven't touched, and the currency only if your group allows it.
    - It does not split by item or assign line items to people. It fills in one expense and you split that as usual.
    - There is no promise that what it fills in is right, or that scanning will work every time. Check before you save, and add the expense by hand if scanning fails or isn't available.
    - An expense holds up to three attachments, each up to 10 MB, as JPEG, PNG, WebP, HEIC or PDF.
    - Receipt images are read by Google Vertex AI (Gemini) in Google's US multi-region, and attached receipts are visible to the members of the group.
useCasesHeading: Where the receipts pile up
faq:
  heading: Questions
  items:
    - q: Can it split a receipt by item?
      a: No. It fills in the expense, including the total, and you split that equally, by exact amounts or by percentage. For a bill where everyone ordered differently, enter what each person owes as exact amounts. [Split expenses](page:feature/split-expenses) has the details.
    - q: Can it read a PDF?
      a: No. You can attach a PDF to an expense so it travels with the numbers, but only images are read.
    - q: Is there a limit on scans?
      a: There are no scan credits to run out of, and scanning is free. Files do have limits, which are up to three attachments per expense and 10 MB each. [What free covers](page:pricing) has the rest.
    - q: Who can see my receipt?
      a: Members of the group can see the receipts attached to an expense. Receipt images are also read by Google's AI service, which is how the form gets filled in.
    - q: Can I scan a receipt for an expense I have already added?
      a: No, scanning is for new expenses. You can still attach a receipt to an existing expense, and it is stored without being read.
    - q: What if it fills in something wrong?
      a: Type over it. Every field stays editable until you save, and you should check them all anyway. If scanning fails or isn't available, add the expense by hand as normal.
