sections:
  - heading: "V čem je Splitwise dobrý"
    body: "Pokud vaše skupina potřebuje nativní aplikaci, použití offline nebo platby přímo v aplikaci, je Splitwise rozumná volba a raději bychom, abyste si ho vybrali, než abyste to zjistili později. Jeho vlastní stránky uvádějí:"
    items:
      - "**Aplikace a použití offline.** Aplikace pro iPhone a Android i web a režim offline."
      - "**Víc způsobů dělení.** Podíly, úpravy a dělení po položkách, navíc k rovnoměrnému, přesnému a procentuálnímu."
      - "**Opakované výdaje.** Nastavte, aby se nájem opakoval, a zapomeňte na něj."
      - "**Platby v aplikaci.** V některých zemích umí peníze i přesunout, přes Splitwise Pay, Venmo, PayPal nebo Pay by Bank."
  - heading: "Tady zdarma, tam za peníze"
    body: "Splitwise Pro je placený tarif Splitwise a jeho vlastní stránka Pro prodává čtyři věci, které v Side Badger nestojí nic."
    items:
      - "**Skenování účtenek.** Splitwise Pro naskenuje fotografii účtenky. Side Badger to dělá zdarma a bez kreditů na skeny: doplní celkovou částku, datum a místo ke kontrole. Obrázky účtenek čte AI služba společnosti Google."
      - "**Převod měn.** Splitwise Pro převede výdaje skupiny do vaší výchozí měny, když klepnete na „Convert“. Side Badger převádí každý výdaj při zadání, podle aktuálního směnného kurzu nebo toho, který jste skutečně dostali, a původní částka na výdaji zůstane."
      - "**Žádné reklamy.** Splitwise uvádí zcela bezreklamní prostředí jako funkci Pro. Side Badger reklamy nemá."
      - "**Žádné denní limity.** Splitwise Pro prodává neomezený počet výdajů a jeho centrum nápovědy uvádí, že bezplatní uživatelé mohou přidat až 4 výdaje každý den. Side Badger denní limity nemá."
  - heading: "Co má Splitwise a Side Badger ne"
    body: "Nejsou to všechny funkce Splitwise, jen ty, které bývají rozhodující. Úplný seznam mají vlastní stránky Splitwise. Tady Side Badger zaostává."
    items:
      - "**Nativní aplikace.** Side Badger funguje v prohlížeči. Přihlaste se, pak ho přidejte na domovskou obrazovku a otevře se jako aplikace."
      - "**Režim offline.** Side Badger potřebuje připojení."
      - "**Platby v aplikaci.** Side Badger se vašich peněz nikdy nedotkne. Platíte si, jak chcete, a pak platbu zaznamenáte."
      - "**Opakované výdaje.** Side Badger je nemá. Místo opětovného zadávání zkopírujte nájem z minulého měsíce."
      - "**Dělení podle podílů nebo položek.** Side Badger má jednoho plátce na výdaj, který se dělí rovnoměrně, podle přesných částek nebo procentuálně. Jeho skenování účtenek nepřiřazuje položky lidem."
      - "**Grafy a výchozí rozdělení.** Splitwise Pro má obojí. Side Badger vede přehled, kdo komu dluží, a to je celý trik."
  - heading: "Přechod vaší skupiny"
    body: "Import neexistuje, takže přechod znamená začít načisto. Nejdřív se vyrovnejte ve Splitwise, pak vytvořte skupinu v Side Badger a pozvěte všechny odkazem nebo QR kódem. Každý ve skupině potřebuje bezplatný účet a k registraci stačí e-mailová adresa."
