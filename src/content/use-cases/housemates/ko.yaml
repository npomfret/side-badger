      split:
        method: equal
    - label: "인터넷"
      payer: lena
      amount: 40
      split:
        method: equal
    - label: "장보기"
      payer: matt
      amount: 80
      split:
        method: equal
featuresHeading: "집에서 쓰는 기능"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "월세가 자동으로 반복될 수 있나요?"
      a: "아니요, 반복 청구서는 없습니다. 몇 번 탭해서 지난달 월세를 복사하고, 날짜를 바꾸면 끝입니다."
    - q: "방 크기별로 나눌 수 있나요?"
      a: "네, 비율로 나눕니다. 합이 100이 되는 한 룸메이트마다 방에 맞는 몫을 정하세요. 다른 분할 방식은 [지출 나누기](page:feature/split-expenses)에서 확인하세요."
    - q: "룸메이트가 빚을 지고 이사 나가면요?"
      a: "정산하기 전에는 그룹을 나갈 수 없습니다. 줄 돈이나 받을 돈이 있으면 아무도 나갈 수 없기 때문이에요. 모두가 깔끔하게 정산될 때까지 숫자는 정직하게 유지됩니다."
    - q: "사이드 배저가 공과금을 내 주나요?"
      a: "아니요. 계산을 기록하고 짧은 결제 목록을 제안합니다. 원하는 방법으로 서로 지불한 다음 기록하세요. [정산하기](page:feature/settle-up)에서 설명합니다."
    - q: "한 룸메이트가 장부를 맡을 수 있나요?"
      a: "네. 그 사람을 관리자로 지정하고 관리 그룹을 사용하세요. 새 멤버는 승인이 필요하고 만든 사람과 관리자만 지출을 바꿀 수 있습니다."
