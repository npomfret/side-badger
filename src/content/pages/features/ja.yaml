meta:
  title: Side Badgerにできること、できないこと
  description: 割り勘、精算、複数の通貨に加え、グループ、リスト、投票。全機能と、Side Badgerが対応していないことの正直なリストです。
h1: Side Badgerにできること
navLabel: 機能
lead: 箱の中身すべてと、入っていないもの。
intro: これが全機能です。表計算シートは、あえて入れませんでした。まずSide Badgerが毎日こなす3つの仕事から始め、残りのリストと、対応していないことの短いリストを確認してください。
cta:
  heading: あなたのグループに必要なことはできますか？
  body: 無料アカウントを作成して、まずは少人数のグループで試してみましょう。
  button: 無料アカウントを作成
cardsHeading: 3つの仕事を詳しく
sections:
  - heading: レシートスキャン
    body: レシートを撮ると、Side Badgerが合計・日付・場所を入力するので、確認してください。レシート画像はGoogleのAIサービスが読み取ります。
  - heading: グループと権限
    body: 家、旅行、イベントごとに最大50人のグループを作れます。リンクまたはQRコードで招待します。大きなグループでは、すべてを見られるけれど何も変更できない「閲覧者」を設定できます。
  - heading: リストと投票
    body: 共有の買い物リストを、買い物の請求書のそばに置けます。ヴィラの候補を、希望すれば匿名で投票にかけられます。
  - heading: そのほか
    items:
      - "**ライブ更新：**支出を追加すると、全員にすぐ表示されます。"
      - "**言語：**Side Badgerは39の言語で使えます。グループの全員が自分の言語を選べます。"
      - "**ホーム画面：**アプリストアは不要です。ログインしてから、Side Badgerをホーム画面に追加すれば、アプリのように開きます。追加方法はアプリ内の設定で確認できます。"
      - "**フィードバック：**不具合を見つけたら、アプリ内から教えてください。返信もそこで確認できます。"
  - heading: Side Badgerにできないこと
    items:
      - "**お金を動かす。**Side Badgerがあなたのお金に触れることはありません。支払いは好きな方法で行ってください。支払いリクエストは計画中です。"
      - "**請求の繰り返し。**定期的な支出はありません。先月の請求は、2タップでコピーできます。"
      - "**品目ごとの分割。**1つの支出につき支払う人は1人です。均等、金額指定、割合指定で分割します。"
      - "**ネイティブアプリの提供。**ブラウザで動作します。ログインしてから、ホーム画面に追加してください。"
      - "**オフラインでの動作。**接続が必要です。"
      - "**メールやテキストでの通知。**通知はアプリ内に表示されます。プッシュ通知は計画中です。"
      - "**グラフや予算の作成。**誰が誰に借りているかを記録するのがすべてです。"
      - "**GoogleやAppleでのサインイン。**メールで登録してください。GoogleとAppleでのサインインは計画中です。"
      - "**アカウントなしでの参加。**グループの全員に無料アカウントが必要です。"
faq:
  heading: よくある質問
  items:
    - q: Side Badgerで支払いできますか？
      a: いいえ。Side Badgerは残高を記録するだけで、あなたのお金に触れることはありません。支払いは好きな方法で行い、そのあと支払いを記録してください。
    - q: モバイルアプリはありますか？
      a: アプリストアにはありません。Side Badgerはブラウザで動作します。スマートフォンでログインしてから、ホーム画面に追加すればアプリのように開きます。追加方法はアプリ内の設定で確認できます。
    - q: 品目ごとに分割できますか？
      a: いいえ。各支出の支払う人は1人で、均等、金額指定、割合指定で分割します。
    - q: オフラインで使えますか？
      a: いいえ、接続が必要です。
    - q: グループの全員にアカウントが必要ですか？
      a: はい。グループの全員に無料アカウントが必要で、登録に必要なのはメールアドレスだけです。
