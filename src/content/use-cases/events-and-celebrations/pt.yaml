featuresHeading: "As funcionalidades que isto usa"
faq:
  heading: "Perguntas"
  items:
    - q: "Os convidados podem ver o grupo sem entrar?"
      a: "Não. As pessoas entram com um link ou código QR e uma conta grátis, por isso só veem o grupo depois de entrarem."
    - q: "O Side Badger pode cobrar o dinheiro?"
      a: "Não. O Side Badger mantém a conta e nunca movimenta dinheiro. Paguem-se como preferirem e depois registem o pagamento. É grátis, sem anúncios e sem limites diários; vê os [preços](page:pricing)."
    - q: "Os votos podem ser anónimos?"
      a: "Sim. Ao criares uma sondagem, podes esconder quem votou em quê. As definições só podem mudar antes do primeiro voto."
    - q: "As pessoas podem contribuir com valores diferentes?"
      a: "Sim. Divide uma despesa por valores exatos, para a parte de cada pessoa ser o valor que combinaram, ou deixa de fora quem não esteve envolvido."
    - q: "Quem organiza pode tratar das contas?"
      a: "Sim. Usa a predefinição de grupo gerido, para só os criadores e administradores alterarem despesas e os administradores aprovarem novos membros."
