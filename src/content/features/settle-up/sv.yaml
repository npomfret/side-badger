meta:
  title: Gör upp med färre betalningar | Side Badger
  description: Se vem som är skyldig vem i din grupp, få en kort lista med betalningar som gör upp för alla och registrera varje betalning när den sker. Gratis att använda.
h1: Gör upp med färre betalningar
navLabel: Göra upp
lead: Side Badger håller ett löpande saldo för alla i gruppen och föreslår en kort lista med betalningar som gör upp det. Ni betalar varandra hur ni vill och registrerar det sedan. Vill du först se hur siffrorna delas, börja med [dela utgifter](page:feature/split-expenses).
cta:
  heading: Redo att reda ut vem som är skyldig vem?
  body: Skapa ett konto, starta en grupp och lägg till den första utgiften. Saldona sköter resten.
  button: Skapa ett gratiskonto
problem:
  heading: Saldon som uppdateras allt eftersom
  body: Varje utgift ändrar vem som är skyldig vem, så Side Badger håller saldona aktuella när utgifter och betalningar läggs till. Alla i gruppen ser en ändring direkt, och ser vad som ändrades och vem som ändrade. Saldona hålls per valuta, så euro och pund stannar i sina egna kolumner om inte en utgift räknades om när den lades in. Som standard ser du de skulder som rör dig; **Visa alla** listar hela gruppen.
workflow:
  heading: Tre steg till kvitt
  steps:
    - title: Se vem som är skyldig vem
      body: Öppna gruppens saldon för att se vad du är skyldig, vad du har att få och en kort lista med betalningar som gör upp för alla, uträknad per valuta. Ifrågasatta utgifter hålls utanför summorna tills de är utredda. I exemplet med rumskamrater nedan blir sex betalningar två.
      shot: S10
      shotAlt: Saldoskärmen med förenklade skulder i två valutor och Visa alla påslaget
    - title: Betala hur du vill, registrera sedan
      body: Banköverföring, kontanter, en tjänst man är skyldig sedan förra semestern. Side Badger flyttar inte pengarna. När pengarna har bytt ägare registrerar du betalningen, och saldot uppdateras för alla.
      shot: S11
      shotAlt: Betalningsformuläret med snabbavräkningsknappar och meddelandet som visas vid en delbetalning
    - title: Kolla att den kom fram
      body: Betalningen hamnar i gruppens historik, där alla i gruppen kan se den och reagera med en emoji. Fira en betalning när den har kommit fram.
      shot: S12
      shotAlt: Betalningshistoriken med emoji-reaktioner på en betalning
