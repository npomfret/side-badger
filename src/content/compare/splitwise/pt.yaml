    feature: O quê
    other: Splitwise, segundo as suas páginas
    sideBadger: Side Badger
  rows:
    - feature: Quanto custa
      other: O Splitwise Pro é uma subscrição mensal ou anual. Os planos anuais incluem um Trip Pass, que dá a um grupo de viagem as funcionalidades Pro durante 30 dias.
      sideBadger: Grátis.
      source: pro-help
    - feature: Despesas por dia
      other: O centro de ajuda diz que os utilizadores gratuitos podem adicionar até 4 despesas por dia. O Pro não tem limite diário.
      sideBadger: Sem limites diários.
      source: pro-help
    - feature: Funções e permissões do grupo
      other: O centro de ajuda diz que não suporta administradores de grupo nem permissões especiais.
      sideBadger: Administradores, membros e visualizadores. Duas predefinições ou as tuas permissões, aprovação para entrar e um bloqueio para quando acabar.
      source: permissions-help
    - feature: Digitalização de recibos
      other: Funcionalidade Pro. Digitaliza uma foto de um recibo, e a divisão por item do Pro permite atribuir os itens a pessoas.
      sideBadger: Grátis, sem créditos de digitalização. Preenche o total, a data e o local para tu confirmares, e não atribui itens a pessoas.
      source: pro
    - feature: Conversão de moedas
      other: Funcionalidade Pro. Toca em Converter e o Splitwise converte as despesas de um grupo para a tua moeda por defeito à taxa de câmbio desse momento.
      sideBadger: Grátis. Converte cada despesa à medida que a introduzes, a uma taxa de câmbio atual ou à que realmente tiveste. O valor original fica na despesa.
      source: currencies-help
    - feature: Moedas e idiomas
      other: 100+ moedas e 7+ idiomas, como diz a sua página inicial.
      sideBadger: 133 moedas e 39 idiomas. Cada pessoa do grupo pode escolher o seu idioma.
      source: home
    - feature: Onde se usa
      other: Apps para iPhone e Android, e a web.
      sideBadger: No navegador. Inicia sessão e depois adiciona-o ao ecrã principal e ele abre como uma app. Não está nas lojas de aplicações.
      source: home
    - feature: Formas de dividir
      other: Em partes iguais, por valores exatos, por percentagem, por partes, por ajuste ou por item.
      sideBadger: Em partes iguais, por valores exatos ou por percentagem, com um pagador por despesa. Não por partes nem por item.
      source: split-help
    - feature: Uso offline
      other: Indica um modo offline entre as suas funcionalidades principais.
      sideBadger: Não. Precisa de ligação.
      source: home
    - feature: Pagamentos e o teu banco
      other: "Nalguns países pode enviar dinheiro de dentro da app: Splitwise Pay nos EUA, Venmo para saldos em dólares americanos, PayPal e Pay by Bank em países europeus selecionados, que liga uma conta à ordem pessoal."
      sideBadger: Nunca toca no teu dinheiro e não pede os dados do teu banco. Paga como preferires e depois regista o pagamento.
      source: payments-help
    - feature: Gráficos e divisões por defeito
      other: Ambos são funcionalidades Pro.
      sideBadger: Nenhum.
      source: pro
faq:
  heading: Perguntas
  items:
    - q: O Side Badger é uma alternativa grátis ao Splitwise?
      a: "Para dividir contas num grupo, sim, e faz mais do que as contas: comentários, perguntas, listas, sondagens e funções de grupo, com digitalização de recibos e conversão de moedas grátis. Se precisas de uma app de loja, uso offline ou pagamentos dentro da app, o Splitwise faz isso e o Side Badger não."
    - q: De onde vêm os detalhes do Splitwise?
      a: "Das páginas do próprio Splitwise: a página inicial, a página Pro e o centro de ajuda. Cada linha da tabela liga à página de onde veio, e a data acima da tabela diz quando as lemos. Verificamo-las todos os trimestres."
    - q: O Side Badger vai continuar grátis?
      a: Tudo no Side Badger é grátis hoje. Se isso mudar, avisamos-te primeiro. A [página de preços](page:pricing) tem os detalhes.
    - q: Toda a gente do meu grupo tem de mudar?
      a: Sim. Todas as pessoas de um grupo precisam de uma conta grátis no Side Badger, e podem entrar com um link ou um código QR.
    - q: O Side Badger tem app para telemóvel?
      a: "Não numa loja de aplicações. Funciona no navegador: inicia sessão no telemóvel e depois adiciona-o ao ecrã principal para abrir como uma app. [Como funciona](page:how-it-works) mostra como."
