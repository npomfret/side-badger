sections:
  - heading: "पैसों की बात, पैसों के बगल में"
    body: "साझा पैसों के साथ गपशप, शक-शुबहा और प्लान भी आते हैं। Side Badger तीनों को आंकड़ों के बगल में रखता है, ताकि किसी को चैट में पीछे स्क्रॉल न करना पड़े।"
    items:
      - "**टिप्पणियाँ सही जगह पर।** ग्रुप पर, या किसी भी खर्च, सूची या पोल पर टिप्पणी करें, और बातचीत को उसी चीज़ के पास रखें जिसके बारे में वह है।"
      - "**रसीदें और फ़ोटो।** हर खर्च पर तीन रसीदें तक रखें, और ग्रुप, सूची या पोल की टिप्पणियों में फ़ोटो या PDF जोड़ें।"
      - "**बहस नहीं, प्रश्न।** एडमिन प्रश्न चालू कर सकता है, फिर खर्च में शामिल कोई भी उसके बारे में पूछ सकता है। मामला सुलझने तक वह बैलेंस से बाहर रहता है।"
      - "**सूचियाँ और पोल।** साझा खरीदारी की सूची को खरीदारी के बिलों के पास रखें, और विला की शॉर्टलिस्ट पर वोट करवाएं, चाहें तो गुमनाम।"
      - "**थोड़ी तालियां।** खर्चों, पेमेंट और टिप्पणियों पर रिएक्ट करें, और पेमेंट आने पर जश्न मनाएं।"
  - heading: "आपका ग्रुप, आपके नियम"
    body: "Splitwise का हेल्प सेंटर कहता है कि वह ग्रुप एडमिन या खास अनुमतियों को सपोर्ट नहीं करता। Side Badger में भूमिकाएं और अनुमतियां हैं, उन ग्रुप के लिए जिन्हें हिसाब सुथरा रखने वाला कोई चाहिए।"
    items:
      - "**एडमिन, सदस्य और दर्शक।** किसी को दर्शक बना दें: वे सब कुछ देख सकते हैं और कुछ नहीं बदल सकते।"
      - "**दो प्रीसेट, या अपना।** खुला सहयोग या प्रबंधित समूह से शुरू करें, या हर अनुमति खुद तय करें: खर्च कौन बदले और हटाए, सूचियां कौन बदले, कौन बुलाए और नए लोगों को अंदर कौन आने दे।"
      - "**जुड़ने के लिए मंज़ूरी।** मंज़ूरी चालू करें और एडमिन हर व्यक्ति को अंदर आने देता है।"
      - "**ग्रुप की अपनी सेटिंग।** इसे सिर्फ़ उन करेंसी तक सीमित करें जो आप सच में इस्तेमाल करते हैं, इसकी डिफ़ॉल्ट करेंसी चुनें और इसे हेडर छवि दें।"
      - "**खत्म होने पर ताला लगा दें।** एडमिन के खोलने तक आंकड़े जस के तस रहते हैं।"
  - heading: "यहां मुफ्त, वहां पैसे देकर"
    body: "Splitwise Pro, Splitwise का पेड प्लान है, और उसका अपना Pro पेज तीन ऐसी चीज़ें बेचता है जिनकी Side Badger में कोई कीमत नहीं।"
    items:
      - "**रसीद स्कैन।** Splitwise Pro आपकी रसीद की फोटो स्कैन करता है। Side Badger यह मुफ्त करता है, बिना स्कैन क्रेडिट के: वह कुल राशि, तारीख और जगह भर देता है, जिसे आप जांच सकें।"
      - "**करेंसी कन्वर्ज़न।** Splitwise Pro, Convert दबाने पर ग्रुप के खर्चों को आपकी डिफ़ॉल्ट करेंसी में बदल देता है। Side Badger हर खर्च को दर्ज करते समय बदलता है, मौजूदा एक्सचेंज रेट पर या उस रेट पर जो आपको असल में मिला, और खर्च पर मूल राशि बनी रहती है।"
      - "**रोज़ाना की कोई सीमा नहीं।** Splitwise Pro असीमित खर्च बेचता है, और उसका हेल्प सेंटर कहता है कि मुफ्त यूज़र हर दिन 4 खर्च तक जोड़ सकते हैं। Side Badger में रोज़ाना की कोई सीमा नहीं है।"
  - heading: "आपका बैंक इससे दूर रहता है"
    body: "Side Badger न आपके बैंक से जुड़ता है, न आपसे बैंक की जानकारी मांगता है। वह बस यह रिकॉर्ड रखता है कि किसे किसका देना है; आप एक-दूसरे को जैसे चाहें पेमेंट करें, फिर पेमेंट रिकॉर्ड करें। बैंक लॉगिन सौंपना नहीं पड़ता, तो संभालने को एक चीज़ कम।"
  - heading: "एक ऐप, आपके ब्राउज़र में और आपके फ़ोन पर"
    body: "Side Badger आपके ब्राउज़र में चलता है। साइन इन करें, इसे होम स्क्रीन में जोड़ें, और यह ऐप की तरह खुलता है। दोनों जगह यह एक ही ऐप है, इसलिए नया फीचर आपके अगली बार ऐप खोलते ही फ़ोन पर मिल जाता है, ऐप-स्टोर के अपडेट का इंतज़ार किए बिना।"
  - heading: "और कुछ मज़ेदार करतब"
    items:
      - "**अपने असिस्टेंट से कहें।** Side Badger ChatGPT और Claude के साथ काम करता है: अपने असिस्टेंट से कहें कि खर्च जोड़े, रसीद स्कैन करे या पेमेंट रिकॉर्ड करे।"
      - "**सब अपनी-अपनी भाषा में।** Side Badger 39 भाषाएं बोलता है और हर व्यक्ति अपनी भाषा चुनता है। Splitwise का होम पेज 7+ बताता है। यह 133 करेंसी भी संभालता है, उस ट्रिप के लिए जो हर जगह जाती है।"
      - "**ऐप छोड़े बिना मदद।** कहीं अटक गए, या कोई बग मिला? ऐप से हमें बताएं और हमारा जवाब वहीं पढ़ें।"
  - heading: "Splitwise अब भी कहां जीतता है"
    body: "हम चाहेंगे कि आप सही ऐप चुनें, बजाय इसके कि बाद में पता चले। अगर आपके ग्रुप को इनमें से कुछ चाहिए, तो वह Splitwise में है और Side Badger में नहीं।"
    items:
      - "**ऐप-स्टोर वाले ऐप।** Side Badger आपके ब्राउज़र और होम स्क्रीन पर रहता है, ऐप स्टोर में नहीं।"
      - "**ऑफलाइन मोड।** Side Badger को कनेक्शन चाहिए।"
      - "**ऐप के अंदर पेमेंट।** कुछ देशों में Splitwise पैसे भी भेज सकता है। Side Badger सिर्फ़ रिकॉर्ड रखता है।"
      - "**शेयर या आइटम के हिसाब से बांटना।** Side Badger में हर खर्च का एक ही पेमेंट करने वाला होता है, खर्च को बराबर, सटीक राशि या प्रतिशत से बांटा जाता है। इसका रसीद स्कैन आइटम को लोगों में नहीं बांटता।"
      - "**चार्ट और डिफ़ॉल्ट बंटवारे।** Splitwise Pro में दोनों हैं। Side Badger बस यह हिसाब रखता है कि किसे किसका देना है, और पूरी तरकीब यही है।"
  - heading: "अपना ग्रुप यहां लाना"
    body: "कोई इम्पोर्टर नहीं है, इसलिए बदलने का मतलब नई शुरुआत है। पहले Splitwise में हिसाब चुकता करें, फिर Side Badger में ग्रुप बनाएं और सबको लिंक या QR कोड से बुलाएं। ग्रुप में सबको एक मुफ्त अकाउंट चाहिए, और साइन अप के लिए बस एक ईमेल पता काफी है।"
