meta:
  title: "డౌన్‌లోడ్ లేని బిల్లు పంపకం యాప్ | Side Badger"
  description: "మీ ఫోన్ నిండిపోయింది, తెలుసు. Side Badger బ్రౌజర్‌లో నడుస్తుంది, యాప్ స్టోర్ లేదు, డౌన్‌లోడ్ లేదు. హోమ్ స్క్రీన్‌కు జోడిస్తే యాప్‌లా తెరుచుకుంటుంది."
h1: "యాప్ స్టోర్ లేదు. డౌన్‌లోడ్ లేదు. అయినా యాప్‌లాగే"
navLabel: "వెబ్ యాప్"
lead: "Side Badger మీ బ్రౌజర్‌లో ఉంటుంది. వెతకడానికి యాప్ స్టోర్ లేదు, ముందుగా డౌన్‌లోడ్ చేయాల్సింది ఏదీ లేదు. ఫోన్‌లో లేదా కంప్యూటర్‌లో సైన్ ఇన్ అవ్వండి, గ్రూప్‌తో ఆన్‌లైన్‌లో ఖర్చులు పంచండి, ఒక్క ట్యాప్ దూరంలో కావాలనుకున్నప్పుడు హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించండి."
cta:
  heading: "తెరవండి. సైన్ ఇన్ అవ్వండి. గ్రూప్ మొదలుపెట్టండి."
  body: "ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి ఖర్చు జోడించండి, అంతా మీరు ఇప్పటికే తెరిచి ఉంచిన బ్రౌజర్ నుండే. ముందు పరిచయం కావాలా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) చూడండి, లేదా [ఉచితంలో ఏముంది](page:pricing) తెలుసుకోండి."
problem:
  heading: "మీ ఫోన్ నిండిపోయింది. తెలుసు."
  body: "అందులో ఎక్కడో ఒకే సూర్యాస్తమయం నాలుగు వేల ఫోటోలు, వసంతం నుండి మీరు పక్కకు జరుపుతున్న స్టోరేజ్ హెచ్చరిక ఉన్నాయి. ఒక డిన్నర్ పంచడానికి ఇంకో యాప్ దానికి చివరగా కావాల్సిన విషయం. అందుకే Side Badger ఒక వెబ్ యాప్. ఫోన్‌లో లేదా కంప్యూటర్‌లో ఆధునిక బ్రౌజర్‌లో నడుస్తుంది. ఫోన్‌లో గ్రూప్ పేజీ ట్యాబ్‌లుగా విడిపోయి, టచ్‌కు అనువైన కంట్రోల్స్‌తో మొబైల్ లేఅవుట్‌లను వాడుతుంది. హోమ్ స్క్రీన్‌కు జోడించడం లాంటి కొన్ని అదనపు సౌకర్యాలు మీ బ్రౌజర్‌పై ఆధారపడి ఉంటాయి, ఎక్కడో మేము చెబుతాము."
workflow:
  heading: "బ్రౌజర్ ట్యాబ్ నుండి హోమ్ స్క్రీన్ వరకు మూడు దశలు"
  steps:
    - title: "తెరిచి సైన్ ఇన్ అవ్వండి"
      body: "మీ బ్రౌజర్‌లో Side Badgerకు వెళ్లి సైన్ ఇన్ అవ్వండి. కావాల్సింది ఇమెయిల్ చిరునామా, పాస్‌వర్డ్ మాత్రమే, ఏదైనా జోడించే ముందు ఇమెయిల్‌ను ధ్రువీకరించాలి. గ్రూప్‌లో అందరికీ ఖాతా కావాలి, కాబట్టి మీరు ఆహ్వానించిన వాళ్లు కూడా అదే చేస్తారు."
    - title: "హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించండి"
      body: "సైన్ ఇన్ అయ్యాక, యాప్ తనను తాను ఇన్‌స్టాల్ చేసుకుంటానని అడుగుతుంది. మీ బ్రౌజర్ అనుమతించే చోట **ఇన్‌స్టాల్ చేయండి** బటన్ వస్తుంది, అనుమతించని చోట **ఎలాగో చూపించండి**. మిస్ అయ్యారా, లేదా వద్దన్నారా? **సెట్టింగ్‌లు**లో **హోమ్ స్క్రీన్ లేదా Dock కు జోడించండి** కింద అదే సహాయం ఉంది. iPhone లేదా iPadలో, సెట్టింగ్‌లు ముందు iPhone దశలను చూపి, మిగతా పరికరాలను **ఇతర పరికరాలు** కింద ఉంచుతుంది. ఎలాగైనా, తర్వాత యాప్ దాని సొంత విండోలో తెరుచుకుంటుంది."
      shot: S20
      shotAlt: "పరికరానికి యాప్‌ను జోడించే దశలతో సెట్టింగ్‌లలోని హోమ్ స్క్రీన్ లేదా Dock కు జోడించండి విభాగం"
    - title: "కావాలంటే నోటిఫికేషన్లు ఆన్ చేయండి"
      body: "మీరు ఆన్ చేసే వరకు నోటిఫికేషన్లు ఆఫ్‌లో ఉంటాయి, ప్రతి పరికరాన్ని విడిగా ఆన్ చేయాలి. నోటిఫికేషన్ల బెల్ ఇచ్చే **ఆన్ చేయండి** బటన్‌ను, లేదా **సెట్టింగ్‌లు**లోని **పుష్ నోటిఫికేషన్లు** స్విచ్‌ను వాడండి. iPhone లేదా iPadలో, ముందు హోమ్ స్క్రీన్ నుండి యాప్‌ను తెరవండి. నోటిఫికేషన్లు అక్కడ పనిచేసేది అదొక్క చోటే."
      shot: S19
      shotAlt: "గ్రూప్‌లోని ఇటీవలి కార్యకలాపాలను చూపుతూ తెరిచిన నోటిఫికేషన్ల డ్రాప్‌డౌన్"
options:
  heading: "పరికరం వారీగా ఎలా జోడించాలి"
  items:
    - title: "iPhone, iPad"
      body: "షేర్ బటన్ నొక్కండి, పైకి చూపే బాణం ఉన్న చతురస్రం. అది కనిపించకపోతే, ముందుగా మూడు చుక్కలు (•••) నొక్కి, ఆపై షేర్ నొక్కండి. కిందికి స్క్రోల్ చేసి **హోమ్ స్క్రీన్‌కు జోడించు** నొక్కండి. **వెబ్ యాప్‌గా తెరువు**ను ఆన్‌లో ఉంచి, **జోడించు** నొక్కండి. లింక్ మరో యాప్ లోపల తెరిస్తే, ముందు పేజీని Safariలో తెరవండి, ఎందుకంటే ఆ అంతర్నిర్మిత బ్రౌజర్ దాన్ని జోడించలేదు."
    - title: "Android"
      body: "బ్రౌజర్ మెనూ తెరిచి **హోమ్ స్క్రీన్‌కు జోడించు** లేదా **యాప్‌ను ఇన్‌స్టాల్ చేయండి** ఎంచుకోండి."
    - title: "కంప్యూటర్‌లో Chrome లేదా Edge"
      body: "బ్రౌజర్ మెనూ తెరిచి ఈ సైట్‌ను యాప్‌గా ఇన్‌స్టాల్ చేసే ఎంపికను ఎంచుకోండి. అప్పుడు దానికి సొంత విండో, సొంత ఐకాన్ వస్తాయి."
    - title: "Macలో Safari"
      body: "**ఫైల్** ఎంచుకుని, ఆపై **Dock కు జోడించు** ఎంచుకోండి."
sections:
  - heading: "నోటిఫికేషన్లు, మీరు అడిగితేనే"
    body: "పుష్ నోటిఫికేషన్లు ఐచ్ఛికం. వాటిని ఆన్ చేస్తే, ఎవరైనా ఖర్చు జోడించడం, కామెంట్ చేయడం లేదా పేమెంట్ రికార్డ్ చేయడం లాంటి కొత్త కార్యకలాపం మీ గ్రూప్‌లలో ఉన్నప్పుడు మీకు నోటిఫికేషన్ వస్తుంది. వాటిని ఒక్కో పరికరంలో, నోటిఫికేషన్ల బెల్ నుండి లేదా **సెట్టింగ్‌లు** నుండి ఆన్ చేస్తారు, అక్కడే మళ్లీ ఆఫ్ చేయవచ్చు. వాటికి వాటిని సపోర్ట్ చేసే బ్రౌజర్, మీ అనుమతి కావాలి. మీ బ్రౌజర్ ఈ సైట్‌కు వాటిని బ్లాక్ చేసి ఉంటే, ముందు బ్రౌజర్ సెట్టింగ్‌లలో అనుమతించండి. iPhone లేదా iPadలో అవి హోమ్ స్క్రీన్‌కు జోడించిన యాప్ నుండి మాత్రమే పనిచేస్తాయి, బ్రౌజర్ ట్యాబ్ నుండి కాదు. చేరడానికి హామీ లేదు, కాబట్టి నోటిఫికేషన్‌ను వాగ్దానంగా కాదు, ఒక చిన్న గుర్తుగా చూడండి. ఫీడ్‌లో ఏం కనిపిస్తుందో [కలిసి ప్లాన్ చేయండి](page:feature/plan-together) చూడండి."
  - heading: "లైవ్ అప్‌డేట్లు, రిఫ్రెష్ బటన్ లేదు"
    body: "ఖర్చు జోడించండి, ఏం మారిందో, ఎవరు మార్చారో సహా అందరికీ వెంటనే కనిపిస్తుంది. ప్రతి గ్రూప్ యాక్టివిటీ చరిత్రను ఉంచుతుంది, నోటిఫికేషన్ల బెల్ మీ అన్ని గ్రూప్‌ల కార్యకలాపాలను చూపుతుంది. మీరు ఇప్పుడే జోడించింది చూశారా అని ఎవరూ అడగాల్సిన పని లేదు. అది వాళ్ల స్క్రీన్‌పైనే ఉంది."
  - heading: "39 భాషలు, ఎవరి భాష వాళ్లది"
    body: "Side Badgerను 39 భాషల్లో వాడండి, కుడి నుండి ఎడమకు రాసే అరబిక్, పర్షియన్, ఉర్దూ సహా. గ్రూప్‌లో ప్రతి ఒక్కరూ తమ సొంతదాన్ని ఎంచుకుంటారు, కాబట్టి ఒకే గ్రూప్ పేజీ ఒకరికి అరబిక్‌లో, మరొకరికి ఇంగ్లీష్‌లో ఉండవచ్చు. గ్రూప్ ఒప్పుకోవాల్సింది అంకెలపై మాత్రమే."
  - heading: "ఒక రకం వినియోగదారుల కోసమే కాదు"
    body: "Side Badgerను కీబోర్డ్, స్క్రీన్-రీడర్ వినియోగదారులను దృష్టిలో ఉంచుకుని నిర్మించారు. సభ్యుల రంగులు నమూనాలతో వస్తాయి, కాబట్టి ఆకుపచ్చ, ఎరుపు తేడా మీరు చెప్పాల్సిన అవసరం లేదు."
    items:
      - "స్కిప్ లింక్‌లు, కీబోర్డ్ వాడేవాళ్లు నేరుగా కంటెంట్‌కు వెళ్లడానికి."
      - "డైలాగ్‌లు కీబోర్డ్ ఫోకస్‌ను నిర్వహిస్తాయి."
      - "కంట్రోల్స్‌కు స్క్రీన్ రీడర్ల కోసం లేబుల్స్ ఉన్నాయి."
      - "కుడి నుండి ఎడమకు రాసే భాషల కోసం లేఅవుట్‌లు తిరుగుతాయి."
limits:
  heading: "వెబ్ యాప్ చేయనివి"
  items:
    - "ఆఫ్‌లైన్ వాడకం లేదు. Side Badgerకు కనెక్షన్ కావాలి, కాబట్టి వైఫై లేని విమానంలో మీ గ్రూప్‌ను తెరవదు."
    - "యాప్-స్టోర్ యాప్ లేదు, నేటివ్ iPhone లేదా Android యాప్ లేదు. Side Badger ఒక వెబ్ యాప్, హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించడమే యాప్ లాంటి వెర్షన్ పొందే మార్గం."
    - "హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించడం మీ బ్రౌజర్‌పై ఆధారపడి ఉంటుంది. మెనూ పేర్లు బ్రౌజర్‌లను, వెర్షన్‌లను బట్టి మారతాయి, కొన్ని బ్రౌజర్‌లు దీన్ని ఇవ్వవు."
    - "పుష్ నోటిఫికేషన్లు ప్రతి పరికరానికి ఎంచుకుంటేనే, వాటికి వాటిని సపోర్ట్ చేసే బ్రౌజర్, మీ అనుమతి కావాలి. iPhone లేదా iPadలో అవి హోమ్ స్క్రీన్‌కు జోడించిన యాప్ నుండి మాత్రమే పనిచేస్తాయి. చేరడానికి హామీ లేదు."
    - "ఇమెయిల్ లేదా టెక్స్ట్ అలర్ట్‌లు లేవు, పేమెంట్ రిమైండర్‌లు లేవు. కొత్త కార్యకలాపం యాప్‌లో కనిపిస్తుంది, మీరు ఆన్ చేస్తే పుష్ నోటిఫికేషన్లుగా కూడా. పేమెంట్ కోసం వెంటపడడం ఇంకా మీ పనే."
    - "కార్యకలాపం 90 రోజులు ఉంచబడుతుంది."
    - "మీరు ఇమెయిల్ చిరునామా, పాస్‌వర్డ్‌తో సైన్ ఇన్ అవుతారు. Google లేదా Apple సైన్-ఇన్ లేదు, మీకు 18 లేదా అంతకంటే ఎక్కువ వయసు ఉండాలి."
    - "Side Badger పూర్తిగా అందుబాటులో ఉంటుందని, లేదా అధికారిక యాక్సెసిబిలిటీ ప్రమాణానికి సరిపోతుందని మేము చెప్పము. ఏదైనా అడ్డుపడితే, యాప్ లోపల నుండే మాకు చెప్పండి, మా జవాబు అక్కడే కనిపిస్తుంది."
useCasesHeading: "యాప్ అవసరం లేకపోవడం ఎక్కడ ఉపయోగపడుతుంది"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "యాప్ స్టోర్‌లో Side Badger యాప్ ఉందా?"
      a: "లేదు. Side Badger ఒక వెబ్ యాప్. మీరు దాన్ని బ్రౌజర్‌లో తెరుస్తారు, యాప్‌లా తెరుచుకునేలా హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించవచ్చు. యాప్ స్టోర్ నుండి డౌన్‌లోడ్ చేయడానికి ఏమీ లేదు."
    - q: "యాప్ డౌన్‌లోడ్ చేయకుండా బిల్లులు పంచవచ్చా?"
      a: "అవును. ఫోన్‌లో లేదా కంప్యూటర్‌లో బ్రౌజర్‌లో Side Badger తెరిచి, సైన్ ఇన్ అయి, గ్రూప్ మొదలుపెట్టండి. హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించడం ఐచ్ఛికం."
    - q: "ఆఫ్‌లైన్‌లో పనిచేస్తుందా?"
      a: "లేదు. హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించినా కూడా Side Badgerకు కనెక్షన్ కావాలి."
    - q: "నా iPhoneలో నాకు నోటిఫికేషన్లు ఎందుకు రావడం లేదు?"
      a: "iPhone లేదా iPadలో, నోటిఫికేషన్లు హోమ్ స్క్రీన్‌కు జోడించిన యాప్ నుండి మాత్రమే పనిచేస్తాయి, బ్రౌజర్ ట్యాబ్ నుండి కాదు. దాన్ని జోడించి, హోమ్ స్క్రీన్ ఐకాన్ నుండి తెరిచి, తర్వాత **సెట్టింగ్‌లు**లో నోటిఫికేషన్లను ఆన్ చేయండి. చేరడానికి హామీ లేదు, కాబట్టి ఒకటి తప్పిపోతే, ఏం జోడించారో గ్రూప్ యాక్టివిటీ చరిత్ర ఇంకా చూపుతుంది."
    - q: "నోటిఫికేషన్లను ఆన్ చేయాలా?"
      a: "లేదు. మీరు ఆన్ చేసే వరకు అవి ఆఫ్‌లో ఉంటాయి, ఒక్కో పరికరంలో. అవి లేకపోయినా, కొత్త కార్యకలాపం యాప్‌లో కనిపిస్తుంది, యాప్ తెరిచి ఉన్నవాళ్లకు మార్పు వెంటనే కనిపిస్తుంది."
    - q: "గ్రూప్‌లో అందరికీ ఖాతా కావాలా?"
      a: "అవును. కావాల్సింది ఇమెయిల్ చిరునామా, పాస్‌వర్డ్ మాత్రమే, ఏదైనా జోడించే ముందు ఇమెయిల్‌ను ధ్రువీకరించాలి. గ్రూప్‌లో చేరే ప్రతి ఒక్కరూ తమకు నచ్చిన ఫోన్‌లో లేదా కంప్యూటర్‌లో అదే చేస్తారు."
