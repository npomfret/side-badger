faq:
  heading: Mga tanong
  items:
    - q: Libre ba ang calculator?
      a: Oo. Libre. Walang ad. Walang pang-araw-araw na limitasyon. Hindi mo rin kailangan ng account.
    - q: Sine-save ba nito ang tina-type ko?
      a: Hindi. Walang sine-save o ipinapadala saanman. Para itago ang mga numero mo, gamitin ang Kopyahin ang link at i-save ang link kung saan mo gusto.
    - q: Sino ang makakakita sa link na kinopya ko?
      a: "Sinumang may hawak nito. Nasa mismong link ang mga numero, pagkatapos ng #, kaya ibahagi lang ito sa mga taong dapat makakita."
    - q: Naglilipat ba ito ng pera?
      a: Hindi. Kinukuwenta nito kung sino ang dapat magbayad kanino, at magbayaran kayo sa paraang gusto ninyo. Hindi rin kailanman ginagalaw ng Side Badger ang pera mo. Tingnan ang [settle up](page:feature/settle-up).
    - q: Puwede bang hatiin ang biyaheng binayaran sa dalawang pera?
      a: Hindi dito, dahil iisang pera ang isang kalkulasyon. Sa grupo, may sariling balanse ang bawat pera. Tingnan ang [maraming pera](page:feature/multiple-currencies).
    - q: Paano kung hindi tumugma ang mga halaga?
      a: Sasabihin ito ng calculator sa ilalim ng gastos at hindi ito magpapakita ng resulta hangga't hindi tumutugma ang mga halaga. Dapat umabot sa kabuuan ang mga eksaktong halaga, at dapat umabot sa 100 ang mga porsyento.
