meta:
  title: "Leigureiknivél: eftir stærð herbergja eða tekjum | Side Badger"
  description: "Stærra herbergi, stærri hlutur? Reiknaðu hvað hver meðleigjandi borgar, eftir stærð herbergja eða tekjum. Keyrir í vafranum: ekkert er vistað eða sent."
h1: "Reiknivél til að skipta leigu"
navLabel: "Reiknivél: skipta leigu"
lead: "Stærra svefnherbergi, stærri hlutur? Sláðu inn leiguna og sjáðu hvað hver borgar, eftir stærð herbergja eða tekjum, upp á eyri. Hún keyrir í vafranum þínum, vistar ekkert og flytur enga peninga. Þegar heimilið vill halda utan um bókhaldið geturðu [skipt útgjöldum](page:feature/split-expenses) í Side Badger og afritað leiguna í hverjum mánuði."
cta:
  heading: "Ákveddu prósenturnar einu sinni. Afritaðu þær endalaust."
  body: "Þessi reiknivél gleymir öllu þegar þú lokar flipanum, rétt eins og meðleigjandinn sem borgaði örugglega internetið. Hópur í Side Badger geymir leiguna, reikningana og hver hefur borgað hvað. Það er ókeypis, án auglýsinga og án daglegra takmarka."
sections:
  - heading: "Tvær leiðir til að skipta leigunni"
    items:
      - "**Eftir stærð herbergja.** Hluti leigunnar fer í eldhúsið, baðherbergið og stofuna, sem allir nota. Þú velur þennan hluta (40% til að byrja með) og honum er skipt jafnt. Afganginum er skipt eftir flatarmáli svefnherbergja, svo stóra herbergið borgar meira og kompan fær afsláttinn sem hún á skilið."
      - "**Eftir tekjum.** Hver og einn borgar sama hlutfall af leigunni og hlutfall hans er af heildartekjunum. Bættu við sameiginlegum reikningum og þeir skiptast í sömu hlutföllum."
  - heading: "Hvernig reikningurinn gengur upp"
    body: "Hver og einn fær nákvæman hlut og síðan heila prósentu, því heilar tölur er auðveldara að slá inn og þrasa um. Námundunin notar aðferð stærsta afgangs: allir halda heilu tölunni fyrir neðan hlut sinn og prósentustigin sem eftir eru fara til þess sem missti mest. Prósenturnar leggjast alltaf saman í 100. Í íbúðinni hér að neðan eru sameiginlegu 40% 13,33% á mann. Herbergið sem Priya býr í er 16 af 38 m² íbúðarinnar, svo 60% × 16/38 er 25,26%, og með 13,33% bætt við verður það 38,6%, sem námundast í 39%. Tom og Aisha enda á 32% og 29%, og 39 + 32 + 29 er 100. Hver upphæð er þessi prósenta af leigunni: 39% af 1.950 £ er 760,50 £."
  - heading: "Sláðu það svo inn í Side Badger"
    body: "Alla söguna, málbandið meðtalið, má lesa í leiðarvísinum [Hvernig á að skipta leigu eftir stærð herbergja](page:guide/how-to-split-rent-by-room-size) eða, fyrir pör, í leiðarvísinum [Hvernig á að skipta reikningum með maka sem þénar meira](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
    items:
      - "**Bættu leigunni við.** Í hópnum þínum skaltu velja **Skrá útgjöld**, velja þann sem borgaði leigusalanum undir **Hver greiddi?** og hafa alla áfram undir **Skipta á milli**."
      - "**Veldu prósentuskiptingu.** Undir **Hvernig á að skipta** skaltu velja **Prósenta** og slá inn heilu prósenturnar. Eyðublaðið lætur vita ef þær ná ekki samtals 100."
      - "**Afritaðu hana næsta mánuð.** Opnaðu leigu síðasta mánaðar og veldu **Afrita útgjöld**. Skiptingin fylgir með."
  - heading: "Það sem reiknivélin gerir ekki"
    items:
      - "**Mæla herbergin þín.** Gólfflötur er upphafspunktur. Herbergi með eigin baðherbergi er meira virði en jafn stórt herbergi án þess, og kompa sem rúmar rúm og bjartsýnan stól er minna virði."
      - "**Ákveða hvað telst til tekna.** Útborguð laun eða heildarlaun, föst laun eða aukavinna: hópurinn ákveður. Notaðu sama tímabil fyrir alla."
      - "**Vista neitt.** Lokaðu flipanum og tölurnar eru horfnar. Til að halda þeim skaltu afrita tengilinn. Hann geymir tölurnar þínar fyrir aftan #, sem vafrar senda aldrei á netþjón, og allir sem hafa hann geta lesið þær."
      - "**Flytja peninga.** Þú borgar leigusalanum eins og þér hentar."
      - "**Blanda gjaldmiðlum eða fara yfir mörkin.** Veldu einn gjaldmiðil. Hún tekur 2 til 10 manns og leigu allt að 999.999,99, eins og í appinu."
