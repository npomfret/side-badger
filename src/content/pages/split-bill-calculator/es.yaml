meta:
  title: "Calculadora para dividir gastos: quién paga a quién | Side Badger"
  description: "Quién pagó, quién debe y quién paga a quién, en segundos. A partes iguales, exacto o por porcentaje. Gratis, en tu navegador, sin guardar ni enviar nada."
h1: Calculadora para dividir gastos
navLabel: Calculadora para dividir gastos
lead: Escribe quién pagó qué y la calculadora te dice quién debe a quién, con una lista corta de pagos para saldarlo. Funciona en tu navegador, no guarda nada y no mueve dinero. Si tu grupo necesita que la cuenta sobreviva a la pestaña, Side Badger hace las mismas cuentas y las guarda, como explican [dividir gastos](page:feature/split-expenses) y [saldar cuentas](page:feature/settle-up).
cta:
  heading: ¿Te gustan las cuentas? Guárdalas.
  body: Esta calculadora lo olvida todo al cerrar la pestaña, igual que quien jura que pagó la última vez. Un grupo de Side Badger guarda los gastos, actualiza el saldo de cada uno y registra los pagos. Es gratis, sin anuncios y sin límites diarios.
sections:
  - heading: Cómo funciona el cálculo
    body: Para cada gasto, la calculadora saca la parte de cada persona. Puedes dividirlo a partes iguales, por importes exactos o por porcentaje, entre las personas que elijas. El saldo de cada persona es entonces lo que pagó menos lo que debe. Un signo más significa que el grupo le debe dinero, y un signo menos significa que esa persona debe dinero al grupo. Los saldos siempre suman cero, porque todo lo que le deben a una persona lo deben otras.
  - heading: Por qué la lista de pagos es corta
    body: Nadie necesita saldar cada recibo por separado. Cuando se conocen todos los saldos, la calculadora empareja a la persona que más debe con la que más tiene a favor, salda todo lo que cabe en un pago y sigue bajando por la lista hasta que todos quedan a cero. Nunca necesita más pagos que el número de personas con saldo menos uno, y a menudo necesita menos que saldar factura por factura. Da una lista corta de pagos, y no promete que sea la más corta posible.
  - heading: Lo que la calculadora no hace
    items:
      - "**Manejar más de una moneda.** Elige una y úsala en todo el cálculo. La app lleva un saldo aparte para cada moneda y puede convertir un gasto con un tipo de cambio actual, que puedes cambiar."
      - "**Guardar tus cifras.** Cierra la pestaña y las cifras desaparecen. Para conservarlas, copia el enlace. Lleva tus cifras después del #, que tu navegador nunca envía a un servidor, y cualquiera a quien se lo mandes puede leerlas."
      - "**Mover dinero.** Te dice quién debería pagar a quién. Pagaos como queráis y después registrad el pago en la app si vuestro grupo lleva allí la cuenta."
      - "**Elegir al azar el céntimo sobrante.** Cuando una cuenta no se divide exactamente, los céntimos sobrantes van a las primeras personas de la lista, así que los totales siguen cuadrando. En la app, el céntimo sobrante va a una persona al azar, así que no siempre es la misma."
      - "**Pasarse de los límites.** La calculadora admite de 2 a 20 personas, y un gasto puede ser de hasta 999.999,99, como en la app."
