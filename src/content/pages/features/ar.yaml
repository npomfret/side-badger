meta:
  title: "ما يفعله Side Badger وما لا يفعله"
  description: "التقسيم وتسوية الحسابات والعملات المتعددة، إضافة إلى المجموعات والقوائم والاستطلاعات. العدّة الكاملة، وقائمة صريحة بما يتركه Side Badger."
h1: "ما يفعله Side Badger"
navLabel: "الميزات"
lead: "كل ما في الصندوق، وما ليس فيه."
intro: "هذه هي العدّة الكاملة. تركنا جدول البيانات خارجها عن قصد. اختر ميزة أدناه لتقرأ النسخة الطويلة، أو تصفّح بقية القائمة والقائمة القصيرة بما لا يفعله Side Badger."
cta:
  heading: "هل يفعل ما تحتاجه مجموعتك؟"
  body: "أنشئ حساباً مجانياً وجرّبه أولاً مع مجموعة صغيرة."
cardsHeading: "كل ميزة بالتفصيل"
sections:
  - heading: "مسح الإيصالات"
    body: "صوّر الإيصال ويملأ Side Badger الإجمالي والتاريخ والمكان لتراجعها. تُقرأ صور الإيصالات بواسطة خدمة الذكاء الاصطناعي من Google. [كيف يعمل مسح الإيصالات](page:feature/receipt-scanning)."
  - heading: "المجموعات والأذونات"
    body: "أنشئ مجموعة لكل منزل أو رحلة أو مناسبة، تضم حتى 50 شخصاً. ادعُ الناس برابط أو برمز QR. وفي المجموعة الأكبر، اجعل أحدهم مشاهداً، يرى كل شيء ولا يغيّر شيئاً. تجد التفاصيل الدقيقة في [المجموعات والأذونات](page:feature/groups-and-permissions)."
  - heading: "القوائم والاستطلاعات"
    body: "أبقِ قائمة التسوق المشتركة بجانب فواتير التسوق. واعرض قائمة الفيلات المختصرة على التصويت، بسرّية إن شئت. ويتناول [التخطيط معاً](page:feature/plan-together) التعليقات والأسئلة والقوائم والاستطلاعات."
  - heading: "وغير ذلك"
    items:
      - "**التحديثات الفورية:** أضف مصروفاً ويراه الجميع على الفور."
      - "**اللغات:** استخدم Side Badger بـ 39 لغة. ويمكن لكل فرد في المجموعة اختيار لغته."
      - "**الشاشة الرئيسية:** لا حاجة إلى متجر تطبيقات. سجّل الدخول ثم أضف Side Badger إلى شاشتك الرئيسية ليفتح كأنه تطبيق. توضّح لك الإعدادات في التطبيق كيفية ذلك. [المزيد عن تطبيق الويب](page:feature/web-app)."
      - "**الإشعارات:** فعّل الإشعارات الفورية من الإعدادات لتصلك إشعارات عند وجود نشاط جديد في مجموعاتك. على iPhone وiPad، أضف Side Badger إلى شاشتك الرئيسية أولًا."
      - "**الملاحظات:** وجدت خللاً؟ أخبرنا من داخل التطبيق واطّلع على ردّنا هناك."
  - heading: "ما لا يفعله Side Badger"
    items:
      - "**نقل الأموال.** لا يلمس Side Badger أموالك أبداً. ادفعوا لبعضكم بالطريقة التي تناسبكم. وطلبات الدفع مخطَّط لها."
      - "**تكرار الفواتير.** لا توجد مصروفات متكررة. انسخ فاتورة الشهر الماضي بنقرتين."
      - "**التقسيم بحسب البند.** دافع واحد لكل مصروف. قسّم بالتساوي أو بمبالغ محددة أو بنسبة مئوية."
      - "**تقديم تطبيق أصلي.** يعمل في متصفحك. سجّل الدخول ثم أضفه إلى شاشتك الرئيسية."
      - "**العمل دون اتصال.** يحتاج إلى اتصال بالإنترنت."
      - "**إرسال تنبيهات بالبريد الإلكتروني أو الرسائل النصية.** يظهر النشاط الجديد داخل التطبيق، وكإشعارات فورية إذا فعّلتها."
      - "**رسم المخططات أو الميزانيات.** يحتفظ بحساب من يدين لمن، وهذه هي الحيلة كلها."
      - "**تسجيل الدخول بـ Google أو Apple.** سجّل بالبريد الإلكتروني. وتسجيل الدخول بـ Google وApple مخطَّط له."
      - "**إدخال أحد دون حساب.** يحتاج كل فرد في المجموعة إلى حساب مجاني."
faq:
  heading: "أسئلة"
  items:
    - q: "هل أستطيع الدفع عبر Side Badger؟"
      a: "لا. يحتفظ Side Badger بالحساب ولا يلمس أموالك أبداً. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة."
    - q: "هل هناك تطبيق للجوال؟"
      a: "ليس في متجر التطبيقات. يعمل Side Badger في متصفحك. سجّل الدخول على هاتفك ثم أضفه إلى شاشتك الرئيسية ليفتح كأنه تطبيق. توضّح لك الإعدادات في التطبيق كيفية ذلك."
    - q: "هل أستطيع التقسيم بحسب البند؟"
      a: "لا. لكل مصروف دافع واحد، وتقسّمه بالتساوي أو بمبالغ محددة أو بنسبة مئوية."
    - q: "هل يعمل دون اتصال؟"
      a: "لا، فهو يحتاج إلى اتصال بالإنترنت."
    - q: "هل يحتاج كل فرد في المجموعة إلى حساب؟"
      a: "نعم. يحتاج كل فرد في المجموعة إلى حساب مجاني، وكل ما يلزم للتسجيل هو عنوان بريد إلكتروني."
