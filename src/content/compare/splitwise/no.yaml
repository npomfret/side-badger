faq:
  heading: Spørsmål
  items:
    - q: Er Side Badger et gratis alternativ til Splitwise?
      a: "For å dele regninger i en gruppe, ja. Kvitteringsskanning, valutakonvertering og ingen annonser er gratis, uten daglige grenser. Trenger du en egen app, bruk uten nett, gjentakende utgifter eller betalinger inne i appen, gjør Splitwise det, og Side Badger gjør det ikke."
    - q: Hvor kommer Splitwise-detaljene fra?
      a: "Splitwises egne sider: hjemmesiden, Pro-siden og hjelpesenteret. Hver rad i tabellen lenker til siden den kom fra, og datoen over tabellen sier når vi leste dem. Vi sjekker dem hvert kvartal."
    - q: Forblir Side Badger gratis?
      a: "Alt i Side Badger er gratis i dag, og det finnes ikke noe betalt nivå. Hvis det noen gang endres, gir vi deg beskjed først. [Prissiden](page:pricing) har detaljene."
    - q: Må alle i gruppen min bytte?
      a: "Ja. Alle i en gruppe trenger en gratis Side Badger-konto, og de kan bli med via en lenke eller en QR-kode."
    - q: Har Side Badger en mobilapp?
      a: "Ikke i en appbutikk. Den kjører i nettleseren din: logg inn på telefonen, og legg den til på startskjermen så åpnes den som en app. [Slik fungerer det](page:how-it-works) viser hvordan."
