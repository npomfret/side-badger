faq:
  heading: "پرسش‌ها"
  items:
    - q: "حقوق ناخالص را حساب کنیم یا خالص؟"
      a: "گروه تصمیم می‌گیرد. حقوق خالص رایج است، چون پولی است که واقعاً برای خرج کردن دارید. حقوق ناخالص این واقعیت را نادیده می‌گیرد که مالیات، حق بازنشستگی و اقساط وام از حقوق‌های مختلف مقدارهای متفاوتی کم می‌کنند. هر کدام را انتخاب کنید، برای هر دوی شما همان معیار را به کار ببرید."
    - q: "آیا Side Badger درآمد ما را می‌بیند؟"
      a: "نه. فقط درصدها را وارد می‌کنید، هرگز حقوق را. درصدها برای اعضای گروه دیده می‌شوند، و برای یک زوج یعنی همان دو نفر شما."
    - q: "می‌توانیم 62/38 را یک بار برای همه‌چیز تعیین کنیم؟"
      a: "تقسیم برای هر هزینه تعیین می‌شود، نه برای هر گروه. هزینه‌ای را که از قبل 62 و 38 دارد کپی کنید، بعد آنچه فرق دارد عوض کنید. [تقسیم هزینه‌ها](page:feature/split-expenses) گزینه‌های دیگر را توضیح می‌دهد."
