    - feature: Pemindaian struk
      other: Fitur Pro. Memindai foto struk, dan fitur itemisasi Pro memungkinkan Anda menetapkan item ke orang tertentu.
      sideBadger: Gratis, tanpa kredit pindai. Mengisi total, tanggal, dan tempat untuk Anda periksa, dan tidak menetapkan item ke orang tertentu.
