meta:
  title: "Спільні списки, опитування й коментарі до витрат | Side Badger"
  description: "Коментуйте витрати, ставте під сумнів дивні, ведіть спільний список покупок і голосуйте за віллу. Плануйте витрати разом, а потім діліть. Безкоштовно, без реклами."
h1: "Плануйте разом, діліть потім"
navLabel: "Плануйте разом"
lead: "Список покупок і чек за покупки нарешті розмовляють одне з одним. Side Badger дає вашій групі місце, де можна говорити про гроші до і після витрат: коментарі до кожної витрати, спосіб поставити під сумнів ті, що виглядають хибно, спільні списки й опитування для великих рішень. А потім ви [ділите витрати](page:feature/split-expenses) як звичайно."
cta:
  heading: "Сплануйте, а потім поділіть"
  body: "Створіть безкоштовний обліковий запис, заведіть групу й покладіть перший список, опитування чи запитання просто біля грошей. Не певні, що далі? Дивіться [як це працює](page:how-it-works)."
problem:
  heading: "Чат тут, а рахунок там"
  body: "Групові витрати зазвичай живуть у двох місцях. Цифри в одному, а суперечка про цифри в чаті, який у вівторок промотався кудись угору. Список покупок — це фото холодильника. Віллу вибрали, мабуть, великим пальцем угору від більшості. Side Badger тримає планування в групі, поруч із витратами, яких воно стосується: коментар там, де вартість, список там, де закупи, опитування для великого рішення і спосіб сказати «стривайте, це правильно?» без цілого абзацу. Усе це лишається про гроші групи, заради чого група й існує."
workflow:
  heading: "Від голосування за віллу до чека за покупки"
  steps:
    - title: "Винесіть велике рішення на голосування"
      body: "Додайте опитування для рішення, від якого залежить рахунок, наприклад яку віллу обрати. Виберіть від двох до десяти варіантів, вкажіть, скільки голосів має кожен, а потім закрийте опитування, коли всі проголосували, і переможця буде позначено."
      shot: S17
      shotAlt: "Закрите опитування з позначеним переможним варіантом і кількістю голосів біля кожного варіанту"
    - title: "Складіть список покупок разом"
      body: "Заведіть спільний список, додайте позиції й відзначайте їх, коли вони потрапляють до візка. Покупки потім вносяться як витрата."
      shot: S16
      shotAlt: "Спільний список покупок із кількома відзначеними позиціями та лічильником прогресу"
    - title: "Говоріть про вартість там, де вона живе"
      body: "Коментуйте саму витрату, додайте чек і реагуйте емодзі. Розмова лишається поруч із цифрою, про яку йдеться."
      shot: S08
      shotAlt: "Витрата з подробицями, мініатюрою чека, гілкою коментарів і реакціями емодзі"
    - title: "Поставте під сумнів ту, що здається дивною"
      body: "Якщо група ввімкнула запитання щодо витрат, кожен, кого включено у витрату, може обрати **Маю запитання**. Витрата лишається поза балансами, доки запитання не розглянуть."
      shot: S18
      shotAlt: "Список витрат зі значком «Поставлено під сумнів» і фільтром «Тільки поставлено під сумнів»"
    - title: "Дивіться, що змінилося і хто це змінив"
      body: "Стрічка активності й дзвіночок сповіщень показують, що нового в усіх ваших групах. Push-сповіщення теж є, якщо хочете."
      shot: S19
      shotAlt: "Випадний список сповіщень із переліком останньої активності"
