meta:
  title: "Skiptu heimilisreikningum með meðleigjendum"
  description: "Skiptu leigunni eftir stærð herbergja, deildu rafmagni og matvörum jafnt og sjáðu hver skuldar hverjum í hverjum mánuði. Ókeypis leið fyrir meðleigjendur til að halda utan um kostnaðinn."
h1: "Skiptu heimilisreikningum með meðleigjendum"
navLabel: "Meðleigjendur"
lead: "Fyrir meðleigjandann sem kaupir klósettpappírinn og meðleigjendurna sem sjá það aldrei gerast. Side Badger heldur utan um leiguna, reikningana og innkaupin á einum stað fyrir **meðleigjendur og sambýlinga**, svo enginn þarf að eltast við neinn og ísskápurinn geti aftur orðið bara ísskápur."
cta:
  heading: "Byrjaðu á þínu eigin heimili"
  body: "Stofnaðu aðgang, búðu til hóp fyrir heimilið og sendu öllum boðstengilinn. Reikningar þessa mánaðar komast inn í kvöld."
  button: "Stofna ókeypis aðgang"
scenario:
  heading: "Komdu heimilinu í gang"
  body: "Búðu til hóp fyrir heimilið, veldu nafnið sem þú vilt að fólk sjái þig undir og bjóddu öllum með tengli eða QR-kóða. Hópurinn getur verið opinn, þar sem allir bæta við og breyta, eða stýrður, þar sem nýir meðlimir þurfa samþykki stjórnanda og aðeins höfundar og stjórnendur geta breytt útgjöldum, sem hentar þeim meðleigjanda sem heldur bókhaldið. Hver sá sem vill bara fylgjast með tölunum getur verið áhorfandi, sem sér allt en breytir engu. Allir sjá nýtt útgjald strax, svo „ég bæti því við seinna“ á færri felustaði."
sections:
  - heading: "Leiga og reikningar"
    body: "Leigan skiptist sjaldan jafnt í fjóra, því svefnherbergi eru ekki jafn stór. Skiptu henni í prósentum, svo stóra herbergið borgi meira og kompan með glugganum borgi minna. Prósentur verða að ná samtals 100. Reikningar sem allir nota fá jafna skiptingu, og meðleigjandi sem átti engan þátt í útgjaldi má sleppa úr því. Þegar jöfn skipting skilur eftir afgangseyri fer hann til eins af handahófi. Það eru engir endurteknir reikningar, svo í hverjum mánuði afritarðu leigu síðasta mánaðar, breytir dagsetningunni og heldur áfram."
  - heading: "Sameiginlegu innkaupin"
    body: "Hafðu sameiginlega innkaupalistann í sama hópi og innkaupareikningana og hakaðu við hluti þegar þeir komast í körfuna. Sá sem sér um innkaupin bætir heildarupphæð kvittunarinnar við sem útgjaldi og skiptir því jafnt, eða aðeins milli þeirra sem munu borða það. Hver heldur áfram að kaupa haframjólkina sem enginn annar drekkur er áfram mál heimilisins, en að minnsta kosti verður útgjaldalistinn nákvæmur. Heimildir hópsins ákveða hver getur búið til og breytt listum. Settu leiguna, reikningana og innkaupin saman og þú færð mánuð eins og þann hér að neðan, á heimili fjögurra: Jo borgar 2.000 £ í leigu, skipt 30%, 25%, 25% og 20% eftir stærð herbergja, síðan borgar Kwame 120 £ fyrir rafmagn, Lena 40 £ fyrir internet og Matt 80 £ fyrir matvörur, hvert skipt jafnt. Jo á þá inni 1.340 £ og Side Badger leggur til þrjár greiðslur, allar til Jo."
  - heading: "Sanngjarnar leiðir til að skipta heimiliskostnaði"
    items:
      - "**Jafnt** hentar því sem allir nota álíka mikið, eins og internet, hreingerningavörum og sameiginlegum innkaupum. Það er fljótlegt og enginn þarf að rífast um reikningsdæmið."
      - "**Eftir stærð herbergja** hentar leigu, því herbergi eru ólík og það er líka það sem fólk er tilbúið að borga fyrir þau. Komið ykkur saman um prósenturnar einu sinni, þegar einhver flytur inn, og notið þær aftur í hverjum mánuði."
      - "**Eftir notkun** hentar reikningum þar sem einn notar greinilega meira, eins og upphitun á heimaskrifstofu eða streymisáskrift sem aðeins tveir horfa á. Slepptu þeim sem áttu engan þátt í því, eða skráðu nákvæmar upphæðir fyrir hvern og einn."
      - "Hvað sem þú velur skaltu semja um það fyrir fyrsta reikninginn frekar en eftir fyrsta rifrildið, og skrifa regluna niður þar sem allt heimilið sér hana."
  - heading: "Þegar einhver flytur út"
    body: "Þá er gert upp fyrst. Enginn getur yfirgefið hóp á meðan hann skuldar eða á inni pening, svo sá sem fer borgar eða fær borgað, þið skráið það og svo fer hann. Haldið hópnum gangandi fyrir meðleigjendurna sem verða eftir og bjóðið nýju manneskjunni með tengli. Þegar heimilið sjálft er búið getur stjórnandi læst hópnum svo tölurnar haldist á sínum stað, eða lokað honum fyrir fullt og allt, sem gerir hann óaðgengilegan öllum, svo gerðu það aðeins þegar enginn þarf lengur á sögunni að halda."
