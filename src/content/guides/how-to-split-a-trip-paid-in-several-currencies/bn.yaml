faq:
  heading: "প্রশ্ন"
  items:
    - q: "Side Badger কোন এক্সচেঞ্জ রেট ব্যবহার করে?"
      a: "একটি বর্তমান এক্সচেঞ্জ রেট, যেখানে পাওয়া যায় সেখানে খরচ লেখার সময় আনা হয়। আসলে যে রেট পেয়েছেন, সেটা বসিয়ে আপনি তা বদলে নিতে পারেন।"
    - q: "গ্রুপ কি শুধু পাউন্ড আর ইয়েনেই সীমিত থাকতে পারে?"
      a: "হ্যাঁ। গ্রুপের **সেটিংস** খুলে **মুদ্রা সেটিংস**-এর নিচে **এই গ্রুপের জন্য মুদ্রা সীমাবদ্ধ করুন** চালু করুন, **অনুমোদিত মুদ্রাসমূহ** বেছে নিন আর **নতুন খরচের জন্য ডিফল্ট মুদ্রা** ঠিক করুন। তালিকায় বিকল্প যত কম, কাউন্টারে ভুল আন্দাজও তত কম।"
    - q: "আমাদের কি রূপান্তর করতেই হবে?"
      a: "না। আপনি বা আপনার গ্রুপ রূপান্তর বেছে না নিলে মুদ্রাগুলো আলাদা থাকে, আর প্রতিটি মুদ্রা পেমেন্টের নিজস্ব ছোট তালিকা পায়।"
