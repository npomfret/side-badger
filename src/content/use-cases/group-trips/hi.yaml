meta:
  title: "ग्रुप ट्रिप का खर्च बांटें, 140 करेंसी में"
  description: "ग्रुप ट्रिप पर देखें किसने क्या दिया, खर्च स्थानीय करेंसी में डालें, चाहें तो बदलें, और आखिर में एक बार हिसाब चुकता करें। मुफ्त, आपके ब्राउज़र में।"
h1: "ग्रुप ट्रिप का खर्च बांटें, 140 करेंसी में"
navLabel: "ग्रुप ट्रिप"
lead: "विला, टैक्सियों और कॉकटेल के उस राउंड का हिसाब रखें जिसे खरीदने का वादा किसी को याद नहीं। आप बाहर होते हैं तब Side Badger चलता हुआ हिसाब रखता है, [पाउंड, यूरो और 138 और करेंसी संभालता है](page:feature/multiple-currencies), और घर लौटने पर आपको [पेमेंट की एक छोटी सूची](page:feature/settle-up) देता है।"
cta:
  heading: "छुट्टी का हिसाब, टैन उतरने से पहले निपटा"
  body: "ग्रुप बनाएं, ट्रिप पर जाने वालों को इनवाइट लिंक भेजें, और खर्च होते ही जोड़ते जाएं।"
scenario:
  heading: "सबने कुछ न कुछ दिया, किसी न किसी करेंसी में"
  body: "किसी ने फ्लाइट बुक कीं, किसी और ने विला कार्ड से लिया, और तीसरे ने डिनर कैश में चुकाया। तीसरे दिन तक किसी को पता नहीं कि कौन आगे है। सवाल सीधा है, भले जवाब आमतौर पर किसी ऐसी स्प्रेडशीट में रहता हो जिसे कोई खोलना नहीं चाहता। किसने क्या दिया, किस करेंसी में, और आखिर में सब एक बार में हिसाब कैसे चुकता करें?"
sections:
  - heading: "जाने से पहले"
    body: "विला की शॉर्टलिस्ट पर वोट कराएं, चाहें तो गुमनाम रूप से, ताकि फैसला ग्रुप का हो और उसका नहीं जो सबसे देर तक मुंह फुलाए रखे। फिर साझा खरीदारी की सूची को खरीदारी के बिलों के पास रखें, ताकि कोई सनस्क्रीन की तीन ट्यूब न खरीदे और प्लग अडैप्टर एक भी नहीं।"
  - heading: "जब आप बाहर हों"
    body: "हर खर्च होते ही जोड़ें, उसी करेंसी में जिसमें दिया। रसीद की फोटो लें और Side Badger कुल राशि, तारीख और जगह भर देगा, जिसे आप जांच सकें; रसीद की इमेज Google की AI सेवा पढ़ती है। राशि को मौजूदा एक्सचेंज रेट पर बदलें, जिसे आप उस रेट में बदल सकते हैं जो आपको असल में मिला, और मूल राशि खर्च पर बनी रहती है। या यूरो को यूरो ही रहने दें और बाद में तय करें। ग्रुप एक करेंसी भी चुन सकता है, और नए खर्च अपने आप उसमें बदल जाते हैं।"
  - heading: "सबने सब कुछ नहीं किया"
    body: "कुछ लोगों ने डिनर छोड़ दिया, कुछ नाव की सैर से बाहर रहे। उन्हें उन खर्चों से बाहर रखें जिनका वे हिस्सा नहीं थे, और बाकी को [बराबर, सटीक राशि या प्रतिशत से](page:feature/split-expenses) बांटें। ट्रिप का जो हिस्सा किसी ने सोकर बिताया उसका पैसा कोई नहीं देता।"
  - heading: "घर पहुंचकर हिसाब चुकता करें"
    body: "Side Badger पेमेंट की एक छोटी सूची सुझाता है जिससे सबका हिसाब निपट जाए। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर उसे रिकॉर्ड करें। मिली-जुली करेंसी हों तो हर एक को अलग रखें या साथ-साथ बदलते चलें; नीचे का लिस्बन उदाहरण दोनों दिखाता है।"
  - heading: "स्टैग और हेन वीकेंड"
    body: "मेहमान-ए-खास वाले वीकेंड के लिए थोड़ा और इंतज़ाम चाहिए। उसे मैनेज्ड ग्रुप बनाएं, जहां एडमिन नए सदस्यों को मंज़ूरी देते हैं और सिर्फ क्रिएटर और एडमिन खर्च बदल सकते हैं। मेहमान-ए-खास के हिस्से के लिए सटीक राशि इस्तेमाल करें, ग्रुप को उन्हीं करेंसी तक सीमित करें जो आप सच में इस्तेमाल कर रहे हैं, और खत्म होने पर ग्रुप लॉक कर दें ताकि संख्याएं वहीं रहें।"
