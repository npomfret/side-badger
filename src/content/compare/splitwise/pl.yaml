faq:
  heading: "Pytania"
  items:
    - q: "Czy Side Badger to darmowa alternatywa dla Splitwise?"
      a: "Do dzielenia rachunków w grupie tak. Skanowanie paragonów, przeliczanie walut i brak reklam są za darmo, bez dziennych limitów. Jeśli potrzebujesz natywnej aplikacji, pracy offline, wydatków cyklicznych albo płatności w aplikacji, robi to Splitwise, a Side Badger nie."
    - q: "Skąd pochodzą dane o Splitwise?"
      a: "Ze stron samego Splitwise: jego strony głównej, strony Pro i centrum pomocy. Każdy wiersz tabeli odsyła do strony, z której pochodzi, a data nad tabelą mówi, kiedy je czytaliśmy. Sprawdzamy je co kwartał."
    - q: "Czy Side Badger pozostanie darmowy?"
      a: "Wszystko w Side Badger jest dziś darmowe i nie ma płatnego poziomu. Jeśli to się kiedyś zmieni, najpierw damy ci znać. Szczegóły ma [strona z cennikiem](page:pricing)."
    - q: "Czy wszyscy w mojej grupie muszą się przesiąść?"
      a: "Tak. Każdy w grupie potrzebuje darmowego konta w Side Badger i może dołączyć linkiem lub kodem QR."
    - q: "Czy Side Badger ma aplikację mobilną?"
      a: "Nie w sklepie z aplikacjami. Działa w przeglądarce: zaloguj się na telefonie, a potem dodaj go do ekranu głównego, żeby otwierał się jak aplikacja. [Jak to działa](page:how-it-works) pokazuje jak."
