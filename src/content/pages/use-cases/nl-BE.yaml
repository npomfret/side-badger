meta:
  title: "Side Badger voor huisgenoten, reizen en feestjes"
  description: "Verdeel kosten met huisgenoten, op groepsreizen en voor feestjes, bruiloften en groepscadeaus. Zie wat Side Badger doet voor elk soort groep."
h1: "Side Badger voor jouw soort groep"
navLabel: "Toepassingen"
lead: "Huisgenoten, vakanties, vrijgezellenfeesten. Kies je chaos en zie hoe een groep zoals de jouwe de rekening bijhoudt."
intro: "Elke groep verdeelt kosten een beetje anders. Deze pagina’s volgen een **realistisch scenario** van de eerste uitgave tot de laatst geregistreerde betaling, met de sommen erbij, zodat je ziet waar je eigen groep zou uitkomen."
cta:
  heading: "Je soort groep gevonden?"
  body: "Maak een account aan, start een groep en voeg de eerste uitgave toe. Het duurt een paar minuten."
  button: "Maak een gratis account"
cardsHeading: "Kies de situatie die het dichtst bij de jouwe ligt"
sections:
  - heading: "Groepsreizen"
    body: "Vluchten in pond, een villa in euro en een diner waar maar drie mensen van aten. Stel de groep in om naar pond om te rekenen en vier vrienden in Lissabon eindigen met drie betalingen, in plaats van zes wanneer de valuta’s apart blijven. [Verdeel de kosten van een groepsreis](page:use-case/group-trips)."
  - heading: "Huisgenoten"
    body: "De ene betaalt de huisbaas, de andere denkt aan de energierekening en niemand weet wie het toiletpapier kocht. Met de huur verdeeld naar kamergrootte en de andere rekeningen gelijk verdeeld sluiten vier huisgenoten de maand af met drie betalingen, allemaal aan degene die de huur betaalde. [Verdeel huishoudelijke kosten met huisgenoten](page:use-case/housemates)."
  - heading: "Feestjes, bruiloften en groepscadeaus"
    body: "Zes mensen stemmen over het cadeau, één koopt het en niet iedereen legt evenveel bij. Een cadeau van £150, verdeeld op exacte bedragen, levert vijf betalingen aan de koper op, samen £120. [Verdeel de kosten van een evenement](page:use-case/events-and-celebrations)."
  - heading: "Koppels"
    body: "Deel de saaie kosten zonder van een avondje uit een driemaandelijkse financiële evaluatie te maken. Huur verdeeld 60/40 en boodschappen gelijk verdeeld komen samen neer op één betaling tussen jullie twee."
  - heading: "Bekijk eerst hoe het werkt"
    body: "Elk voorbeeld hierboven gebruikt dezelfde stappen, van een groep maken tot de betalingen registreren. [Zo werkt het](page:how-it-works) leidt je erdoor, en [prijzen](page:pricing) zegt wat het kost, namelijk niets, zonder advertenties en zonder dagelijkse limieten."
faq:
  heading: "Vragen"
  items:
    - q: "Heeft iedereen in de groep een account nodig?"
      a: "Ja. Mensen doen mee met een link of QR-code en een gratis account."
    - q: "Kan Side Badger het geld innen?"
      a: "Nee. Je betaalt zoals je wilt en registreert dan de betaling, zodat de saldi kloppen."
    - q: "Moet ik één soort groep kiezen?"
      a: "Nee. De toepassingen zijn voorbeelden, geen instellingen. Elke groep heeft dezelfde functies, dus gebruik de combinatie die past."
