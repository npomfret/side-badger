meta:
  title: "گروپ تحفے کے لیے رقم کیسے جمع کریں | Side Badger"
  description: "ہر کوئی الگ رقم ڈالتا ہے اور ایک کا کارڈ بوجھ اٹھاتا ہے۔ بجٹ کا پول چلائیں، عین رقمیں درج کریں اور حساب Side Badger پر چھوڑ دیں۔"
h1: "گروپ تحفے کے لیے رقم کیسے جمع کریں"
navLabel: "گروپ تحفے کی رقم"
lead: "گروپ تحفے کی رقم جمع کرنے کا مطلب ہے کہ ایک شخص پیسے پہلے لگاتا ہے اور باقی سب پر اس کا اپنا اپنا حصہ واجب ہوتا ہے۔ پول سے بجٹ طے کریں، خریدنے والے کو تحفہ اپنے کارڈ پر لینے دیں، پھر اسے ایک خرچے کے طور پر [عین رقموں](page:feature/split-expenses) کے ساتھ درج کریں، ہر شخص کے لیے ایک عدد۔ Side Badger دکھاتا ہے کہ خریدنے والے کو کس کا کتنا دینا ہے، اور ہر کوئی اپنا حصہ جیسے چاہے بھیج دیتا ہے۔"
cta:
  heading: "ٹوپی گھمائے بغیر چندہ"
  body: "گروپ بنائیں، جسے تحفہ مل رہا ہے اسے اس میں شامل نہ کریں اور تحفہ عین رقموں کے ساتھ درج کریں۔ Side Badger مفت ہے، نہ اشتہارات، نہ روزانہ کی حد۔ پہلے سیر دیکھنی ہے؟ [یہ کیسے کام کرتا ہے](page:how-it-works) یا [مفت میں کیا کیا شامل ہے](page:pricing) دیکھیں۔"
sections:
  - heading: "چار دوست، ایک ریکارڈ پلیئر، چار مختلف رقمیں"
    body: "بی کی عمر 30 سال ہو رہی ہے اور اسے ریکارڈ پلیئر چاہیے۔ پریا، عمر، لینا اور سیم اسے لے کر دے رہے ہیں۔ پریا کو £240 کا ایک مل جاتا ہے اور وہ اسے اپنے کارڈ پر خرید لیتی ہے، کیونکہ کسی کو تو پہلے جانا ہی ہوتا ہے۔ چاروں برابر نہیں ڈالتے۔ پریا اور عمر £60 فی کس ڈالتے ہیں، لینا £80 اور سیم £40۔ کوئی اپنی رقم کی وجہ نہیں بتاتا اور کوئی پوچھتا بھی نہیں۔ عمر £12 کا ایک کارڈ اور گفٹ ریپ بھی خریدتا ہے۔ کارڈ پر چاروں دستخط کرتے ہیں، اس لیے وہ برابر بٹتا ہے۔"
  - heading: "خریداری کا بٹن دبانے سے پہلے بجٹ طے کریں"
    body: "بجٹ کا پول £400 کے ٹرن ٹیبل پر جھگڑے سے بچا لیتا ہے۔ گروپ میں **پول شامل کریں** چنیں اور پوچھیں کہ تحفے کی قیمت کتنی ہونی چاہیے۔ اختیارات رقموں میں رکھیں، جیسے £150 تک، £200 تک اور £250 تک۔ **گمنام ووٹنگ** آن کریں، جو چھپا دیتی ہے کہ کس نے کیا ووٹ دیا، تاکہ کسی کو چھوٹی رقم کا دفاع سب کے سامنے نہ کرنا پڑے۔ پہلا ووٹ پڑنے کے بعد ترتیبات بدلی نہیں جا سکتیں، اس لیے پہلے انہیں جانچ لیں۔ پول خود بند نہیں ہوتا۔ جب سب ووٹ دے دیں تو **پول بند کریں** چنیں اور **فاتح** نظر آ جاتا ہے۔ پول کل رقم طے کرتا ہے۔ یہ کسی کا حصہ طے نہیں کرتا۔"
  - heading: "گنتی پڑھنا"
    body: "تحفہ £60، £60، £80 اور £40 میں بٹتا ہے، جن کا مجموعہ رسید کے £240 کے برابر ہے۔ کارڈ اور ریپ چار طرف بٹ کر £3 فی کس بنتے ہیں۔ پریا کا بل £60 + £3 یعنی £63 ہے، اور اس نے £240 دیے، اس لیے اسے £177 ملنے ہیں۔ عمر کا بل بھی £63 ہے، لیکن اس نے £12 دیے، اس لیے اس پر £51 واجب ہیں۔ لینا پر £80 + £3 یعنی £83 واجب ہیں، اور سیم پر £40 + £3 یعنی £43۔ یہ تینوں مل کر پریا کے £177 بنتے ہیں۔ اگر یونہی چھوڑ دیا جائے تو قرض گروپ میں پانچ طرف گھومتے۔ Side Badger اس کی جگہ تین ادائیگیاں تجویز کرتا ہے، سب پریا کو۔ [حساب برابر کرنے](page:feature/settle-up) میں مزید تفصیل ہے۔"
  - heading: "Side Badger میں درج کریں"
    body: "پریا کی طرف کا کام تقریباً پانچ منٹ لیتا ہے۔"
    items:
      - "**گروپ بنائیں۔** ڈیش بورڈ پر **گروپ بنائیں** چنیں۔ **دوسروں کو مدعو کریں** چنیں اور لنک یا QR کوڈ صرف ان لوگوں کو بھیجیں جو رقم ڈال رہے ہیں، کسی اور کو نہیں۔"
      - "**تحفہ شامل کریں۔** **خرچہ شامل کریں** چنیں، اس کی تفصیل لکھیں، 240 درج کریں اور **کس نے ادائیگی کی؟** میں پریا کو چنیں۔ **کے درمیان تقسیم کریں** میں چاروں کو رہنے دیں، پھر **کیسے تقسیم کریں** میں **عین رقمیں** چنیں اور 60، 60، 80 اور 40 لکھیں۔ رقموں کا مجموعہ 240 ہونا چاہیے۔ چاہیں تو آرڈر کی تصدیق منسلک کریں۔ **خرچہ محفوظ کریں** چنیں۔"
      - "**کارڈ شامل کریں۔** عمر £12 خود شامل کرتا ہے، **کس نے ادائیگی کی؟** میں خود کو چنتا ہے اور **کیسے تقسیم کریں** کو **برابر** پر رہنے دیتا ہے، چاروں کو ٹک کر کے۔"
      - "**گنیں، پھر ادا کریں۔** ہر کوئی **بیلنسز** دیکھتا ہے، جو دکھاتا ہے کہ کس کو کس کا دینا ہے، اور اپنا حصہ جیسے چاہے پریا کو بھیج دیتا ہے۔ پھر اسے **تصفیہ کریں** اور **تصفیہ ریکارڈ کریں** سے ریکارڈ کریں۔ فوری تصفیہ رقم خود بھر دیتا ہے۔"
  - heading: "پہلے خریدیں یا پہلے جمع کریں"
    body: "Side Badger چندے کی رقم اپنے پاس نہیں رکھتا، اس لیے «جمع کرنا» دراصل گننا ہے۔ دو ترتیبیں چلتی ہیں۔"
    items:
      - "**پہلے خریدیں۔** خریدنے والا ادا کرتا ہے، اصل قیمت پر خرچہ شامل کرتا ہے اور سب کو اپنا حصہ فوراً نظر آ جاتا ہے۔ یہ زیادہ صاف ستھرا ہے، لیکن جب تک لوگ ادا نہ کریں خریدنے والا بوجھ اٹھاتا ہے، اس لیے ایسا خریدار چنیں جو اٹھا سکے۔"
      - "**پہلے جمع کریں۔** لوگ خریداری سے پہلے اپنی رقم خریدنے والے کو بھیج دیتے ہیں۔ قیمت معلوم ہو جائے تو تحفہ درج کریں، پھر ہر ادائیگی اس تاریخ کے ساتھ ریکارڈ کریں جب رقم واقعی منتقل ہوئی۔ تحفہ پہلے شامل کریں، تاکہ ہر ادائیگی کے لیے کوئی بیلنس موجود ہو جس پر وہ لگے۔"
      - "**قیمت بدل جائے۔** ڈیلیوری، ڈسکاؤنٹ کوڈ، آخری وقت میں مہنگائی۔ تحفہ ایڈٹ کریں اور عین رقمیں ایسے بدلیں کہ مجموعہ پھر بھی پورا رہے۔ پرانا ورژن محفوظ رہتا ہے، لیکن پہلے گروپ کو بتا دیں، کیونکہ ان کے بیلنس بدل جاتے ہیں۔"
  - heading: "بی کو اس سے دور رکھیں"
    body: "گروپ صرف اس کے ارکان دیکھ سکتے ہیں، اس لیے بی وہ گروپ نہیں دیکھ سکتی جس میں وہ نہیں ہے۔ صرف انہی کو مدعو کریں جو رقم ڈال رہے ہیں، اور کسی کو نہیں۔ لنک اپنی میعاد ختم ہونے تک کام کرتا ہے اور آپ 15 منٹ سے 5 دن تک کچھ بھی چن سکتے ہیں، اس لیے مختصر میعاد چنیں اور اسے ایسی جگہ بھیجیں جہاں بی کی نظر نہ پڑے۔ لنک جو بھی کھولے اسے گروپ کا پیش منظر دکھاتا ہے، اس لیے گروپ کو کوئی پھیکا نام دیں، جیسے ہفتے کے دن کا چندہ، اور بی کا نام اخراجات کے لیبلوں اور پول کے اختیارات میں بھی نہ آنے دیں۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ رقم نہ رکھتا ہے نہ جمع کرتا ہے۔ چندہ بینک ٹرانسفر، نقد یا جو بھی آپ استعمال کرتے ہیں اس سے خریدنے والے کو جاتا ہے، پھر کوئی اسے ریکارڈ کرتا ہے۔"
      - "یہ ادائیگی کی کوئی یاد دہانی نہیں بھیجتا۔ جس نے ادا نہیں کیا اسے ٹہوکا دینا اب بھی انسان کا کام ہے۔"
      - "یہ کسی کا حصہ خود طے نہیں کرتا۔ پول بجٹ طے کرتا ہے اور «جو بچا وہ بانٹ دو» کا کوئی اختیار نہیں، اس لیے ہر رقم آپ خود لکھتے ہیں۔"
      - "ہر خرچے کا ایک ہی ادا کرنے والا ہوتا ہے۔ اگر دو لوگوں نے تحفے کے الگ الگ حصے خریدے تو دو اخراجات درج کریں۔"
      - "تقسیم میں شامل ہر شخص کو مفت اکاؤنٹ اور گروپ میں جگہ چاہیے۔"
exampleAfter: 2
