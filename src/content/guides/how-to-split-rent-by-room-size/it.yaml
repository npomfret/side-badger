meta:
  title: "Come dividere l'affitto in base alle stanze | Side Badger"
  description: "Stanza più grande, quota più grande. Metti da parte le zone comuni, dividi il resto per superficie e digita le percentuali una volta. Calcoli per tre coinquilini."
h1: "Come dividere l'affitto in base alla dimensione delle stanze"
navLabel: "Affitto in base alle stanze"
lead: "Decidi quanta parte dell'affitto copre le stanze in comune e dividila in parti uguali, poi dividi il resto in base alla superficie di ogni camera. Arrotonda a percentuali intere, inseriscile una volta sull'affitto in Side Badger e copia la spesa ogni mese."
cta:
  heading: "Inserisci l'affitto una volta sola"
  body: "Crea un account gratuito, avvia un gruppo per la casa e inserisci l'affitto con le percentuali che avete concordato. Il mese prossimo è una copia. Vuoi prima fare un giro? Vedi [come funziona](page:how-it-works), oppure [cosa include il gratuito](page:pricing)."
sections:
  - heading: "Tre persone, una casa, una discussione"
    body: "Priya, Tom e Aisha dividono una casa che costa 1.950 £ al mese. Per un anno hanno diviso l'affitto in tre, perché era facile. Poi Aisha ha misurato la sua camera. Quella di Priya misura 16 m², quella di Tom 12 m² e quella di Aisha 10 m², quindi Aisha pagava quanto Priya per una camera più piccola di oltre un terzo. Nessuno era stato irragionevole. Nessuno aveva fatto il conto. Davanti a una cena d'asporto hanno prima concordato una regola. Dell'affitto, il 40% paga la cucina, il bagno e il salotto, che usano tutti e tre."
  - heading: "Il metodo, con i calcoli in vista"
    body: "Quattro passaggi, un metro a nastro e la calcolatrice del telefono."
    items:
      - "**Metti da parte la quota comune.** Il gruppo concorda quanta parte dell'affitto copre le stanze che usano tutti. Per questa casa è il 40%, cioè il 13,33% a testa tra tre persone."
      - "**Dividi il resto in base alla superficie.** L'altro 60% va in base alla dimensione delle camere. Le camere sommano 38 m² (16 + 12 + 10), quindi la quota di Priya è 60% × 16/38, cioè 25,26%."
      - "**Somma le due parti.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, più 13,33% fa 32,3%. Aisha: 60% × 10/38 = 15,79%, più 13,33% fa 29,1%."
      - "**Arrotonda e controlla.** Le percentuali intere sono più facili da digitare e da discutere, quindi 38,6% diventa 39%, 32,3% diventa 32% e 29,1% diventa 29%. Controlla che 39 + 32 + 29 faccia 100. Se l'arrotondamento arriva a 99 o a 101, il gruppo decide quale cifra si sposta di un punto."
  - heading: "Leggere il mese della casa"
    body: "Con l'affitto al 39%, 32% e 29% si arriva a 760,50 £, 624,00 £ e 565,50 £. Priya ha pagato il proprietario, quindi nel corso del mese deve ricevere 1.142,50 £, mentre Tom deve 566,00 £ e Aisha deve 576,50 £. Side Badger suggerisce due pagamenti, entrambi a Priya."
  - heading: "Impostalo in Side Badger"
    body: "Una serata, per lo più passata a discutere del 40%."
    items:
      - "**Crea il gruppo.** Nella dashboard scegli **Crea gruppo** e dagli il nome della casa. Scegli **Invita altri** e manda il link o il codice QR. Ognuno accede o crea un account gratuito e sceglie il nome con cui vuole essere visto in questo gruppo."
      - "**Aggiungi l'affitto.** Scegli **Aggiungi spesa**. Inserisci la descrizione e l'importo, e sotto **Chi ha pagato?** scegli chi ha pagato il proprietario. Lascia tutte e tre le persone sotto **Dividi tra**, poi sotto **Come dividere** scegli **Percentuale** e digita 39, 32 e 29. Il modulo ti avvisa se le percentuali non sommano a 100. Scegli **Salva spesa**."
      - "**Aggiungi le bollette.** Energia e internet sono spese separate, ognuna con la persona che l'ha pagata. Lascia **Come dividere** su **Uguale**."
      - "**Copiala il mese prossimo.** Apri l'affitto del mese scorso e scegli **Copia spesa**. La copia mantiene chi ha pagato, l'importo e la divisione, e prende la data di oggi. Cambia l'importo se l'affitto è cambiato, poi scegli **Crea copia**."
      - "**Controlla chi deve cosa a chi.** La sezione **Saldi** lo mostra. Pagatevi come vi fa più comodo, poi registrate il pagamento con **Salda**."
  - heading: "Camere con bagno, sgabuzzini e chi se ne va"
    items:
      - "**Camere con bagno privato e sgabuzzini.** La superficie è solo un punto di partenza. Una camera con il suo bagno vale più della stessa superficie senza, e uno sgabuzzino dove entrano un letto e una sedia ottimista vale meno. Aggiusta le percentuali di comune accordo, controlla che sommino ancora a 100 e scrivi le cifre definitive dove tutta la casa possa vederle."
      - "**Qualcuno se ne va a metà mese.** Calcola quanto deve ciascuno per quel mese e inserisci l'affitto di quel mese con **Importi esatti** invece di **Percentuale**. Gli importi devono sommare all'affitto. Fallo prima che se ne vada. Nessuno può lasciare un gruppo finché deve o deve ricevere denaro, e una spesa che coinvolge chi se n'è andato diventa di sola lettura."
      - "**Arriva qualcuno.** Misura di nuovo, rifai i conti con le nuove dimensioni delle camere e usa le nuove percentuali dal prossimo affitto. I mesi passati restano com'erano."
  - heading: "Cosa Side Badger non fa qui"
    items:
      - "Non misura le tue camere e non sceglie le percentuali. Spetta al gruppo concordare le superfici e il 40%."
      - "Non ha conti ricorrenti, quindi ogni volta copi l'affitto del mese scorso."
      - "Non sposta mai denaro e non paga il proprietario. Vi pagate come vi fa più comodo e lo registrate."
      - "Non sa cosa dice il tuo contratto d'affitto. Tiene il conto tra le persone del gruppo."
