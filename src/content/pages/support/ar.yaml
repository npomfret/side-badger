meta:
  title: "المساعدة والدعم | Side Badger"
  description: "نسيت كلمة المرور، أو رابط لا يعمل، أو دفعة سُجّلت خطأً؟ إجابات قصيرة عما يعلق فيه الناس في Side Badger، وكيف تصل إلينا."
h1: "المساعدة والدعم، بلا موسيقى الانتظار"
navLabel: "المساعدة والدعم"
lead: "إجابات قصيرة عما يعلق فيه الناس، من كلمة مرور منسية إلى إغلاق مجموعة نهائياً. وتصلك كل إجابة بالصفحة التي تشرح أكثر. لم تجد سؤالك؟ أخبرنا من داخل التطبيق، أو راسلنا بسطرين."
cta:
  heading: "جئت للمساعدة وبقيت من أجل التقسيم؟"
  body: "لا حساب لديك بعد؟ ابدأ مجموعة، وشارك الرابط، وأضف أول مصروف. مجاني، بلا إعلانات وبلا حدود يومية."
groups:
  - heading: "تسجيل الدخول"
    items:
      - q: "نسيت كلمة المرور؟"
        a: "يحدث هذا حتى لأذكى غرير. اختر **هل نسيت كلمة المرور؟** في شاشة **تسجيل الدخول**، وأدخل البريد الإلكتروني لحسابك، ثم اتبع الرابط في الرسالة التي نرسلها لتختار كلمة مرور جديدة. ويشرح [كيف يعمل](page:how-it-works) ما يحتاجه الحساب أيضاً."
      - q: "سجّلت، لكن لا أستطيع إضافة أي شيء. لماذا؟"
        a: "في الأغلب لم يُوثَّق بريدك الإلكتروني بعد، فافتح الرابط في رسالة التحقق، أو اختر **إعادة إرسال رسالة التحقق** في شريط التذكير للحصول على رسالة جديدة. وإذا كان بريدك موثَّقاً، فقد تكون المجموعة مقفلة أو قد لا تسمح لك أذوناتها بذلك، فالمشاهد يرى كل شيء ولا يغيّر شيئاً، كما يشرح [المجموعات والأذونات](page:feature/groups-and-permissions)."
      - q: "كيف أغيّر بريدي الإلكتروني أو كلمة مروري؟"
        a: "في **الإعدادات** اختر **تغيير البريد الإلكتروني** أو **تغيير كلمة المرور**. كلاهما يطلب كلمة مرورك الحالية أولاً، ويحتاج عنوان البريد الجديد إلى توثيق عبر الرابط الذي نرسله إليه. ويتناول [كيف يعمل](page:how-it-works) الحسابات."
      - q: "هل أستطيع تسجيل الدخول بحساب Google أو Apple؟"
        a: "لا. كل ما تحتاجه عنوان بريد إلكتروني وكلمة مرور من 12 حرفاً على الأقل، ويمكنك تحديد **تذكرني** على هاتفك أو حاسوبك الخاص. وتتناول صفحة [تطبيق الويب](page:feature/web-app) بقية خطوات البدء."
  - heading: "الانضمام إلى مجموعة"
    items:
      - q: "أرسل لي أحدهم رابط دعوة. كيف أنضم؟"
        a: "افتحه، ثم سجّل الدخول أو أنشئ حساباً مجانياً. سترى معاينة للمجموعة، فاختر الاسم الذي سيراك الناس به هناك، واضغط **الانضمام إلى المجموعة**. ويستعرض [المجموعات والأذونات](page:feature/groups-and-permissions) الخطوات كلها حتى الدخول."
      - q: "تظهر لي عبارة «في انتظار الموافقة». هل أخطأت في شيء؟"
        a: "أبداً. في هذه المجموعة يسمح مشرف لكل شخص بالدخول، لذلك ذهب طلبك إلى مشرفيها، ولا يمكنك رؤية ما بداخلها إلى أن يوافق أحدهم. ولا مانع من تذكير ودّي وجهاً لوجه، ويشرح [المجموعات والأذونات](page:feature/groups-and-permissions) الموافقة."
      - q: "يقول الرابط إنه غير صالح أو انتهت صلاحيته."
        a: "تبقى روابط الدعوة صالحة المدة التي اختارها من أنشأها، من 15 دقيقة حتى 5 أيام. اطلب من أحد أعضاء المجموعة رابطاً جديداً، أو رمز QR إن كنتما في الغرفة نفسها. ويتناول [كيف يعمل](page:how-it-works) الدعوات."
  - heading: "المصروفات"
    items:
      - q: "كيف أضيف مصروفاً؟"
        a: "افتح المجموعة واختر **إضافة مصروف**. اذكر ما كان، وكم كلّف، ومن دفع، ومن شارك فيه، ثم قسّمه بالتساوي أو بمبالغ محددة أو بنسبة مئوية. ويستعرض [تقسيم المصروفات](page:feature/split-expenses) كل خيار."
      - q: "هل يمكن أن يتكرر الإيجار كل شهر؟"
        a: "ليس من تلقاء نفسه، لأنه لا توجد مصروفات متكررة. افتح مصروف الشهر الماضي واختر **نسخ المصروف**، فيصلك النموذج معبّأً، جاهزاً لتاريخ جديد ولأي شيء تغيّر. ويتوسع [تقسيم المصروفات](page:feature/split-expenses) في شرح النسخ."
      - q: "كتبت مبلغاً خاطئاً. هل أستطيع تصحيحه؟"
        a: "نعم. عدّل المصروف، ما دامت أذونات المجموعة تسمح لك وما دامت المجموعة غير مقفلة. وتُحفظ النسخة السابقة، فلا يضطر أحد إلى تصديق كلامك في ما تغيّر، كما يشرح [تقسيم المصروفات](page:feature/split-expenses)."
      - q: "مصروف يبدو خاطئاً وليس مصروفي. ماذا أفعل؟"
        a: "اختر **لدي سؤال** على المصروف واذكر السبب، فيبقى المصروف كله خارج أرصدة الجميع إلى أن يغلق السؤال من طرحه أو أحد المشرفين. لا ترى هذا الزر؟ فقط من يشملهم المصروف يستطيعون السؤال، ويجب أن يفعّل المشرف **السماح بأسئلة المصاريف** في إعدادات المجموعة أولاً، وفي [دليل المصروف المتنازع عليه](page:guide/what-to-do-when-someone-disputes-a-shared-expense) ما يلزم من دبلوماسية."
  - heading: "الدفعات"
    items:
      - q: "هل يرسل Side Badger المال؟"
        a: "لا، Side Badger لا ينقل المال أبداً. ادفعوا لبعضكم بالطريقة التي تناسبكم، بتحويل مصرفي أو نقداً أو أي وسيلة تنفع، ثم سجّلوا الدفعة لتلحق بها الأرصدة. ويشرح [كيف تسوّي الحسابات بعد رحلة جماعية](page:guide/how-to-settle-up-after-a-group-trip) ذلك من البداية إلى النهاية."
      - q: "كيف أسجّل دفعة؟"
        a: "اختر **تسوية** في المجموعة، وحدّد من دفع ومن استلم، وأدخل المبلغ أو دع زر **تسوية سريعة** يملأه، ثم اختر **تسجيل تسوية**. دفعت جزءاً فقط؟ سجّل ما دُفع ويبقى الباقي في الرصيد، كما يشرح [تسوية الحسابات](page:feature/settle-up)."
      - q: "سجّلت دفعة بشكل خاطئ. هل أستطيع تصحيحها؟"
        a: "من سجّلها يستطيع تعديلها من سجل **التسويات** في المجموعة، وهو أو أحد المشرفين يستطيع حذفها، فتخرج من الأرصدة. ولا يمكن تعديل دفعة تشمل شخصاً غادر المجموعة منذ ذلك الحين. ويتناول [تسوية الحسابات](page:feature/settle-up) السجل."
  - heading: "الإشعارات والشاشة الرئيسية"
    items:
      - q: "كيف أفعّل الإشعارات؟"
        a: "شغّل **الإشعارات الفورية** في **الإعدادات** واسمح بها حين يسألك المتصفح. وإذا كان المتصفح قد حظرها فعلاً، فاسمح بها أولاً في إعداداته هو. ويُفعَّل كل جهاز على حدة، والتسليم غير مضمون، فتعامل مع الإشعار على أنه تنبيه لا وعد، كما توضح صفحة [تطبيق الويب](page:feature/web-app)."
      - q: "لماذا لا تعمل الإشعارات على iPhone الخاص بي؟"
        a: "على iPhone أو iPad لا تعمل إلا في التطبيق المضاف إلى شاشتك الرئيسية، ولا تعمل أبداً في تبويب المتصفح. أضفه، وافتحه من أيقونة الشاشة الرئيسية، ثم شغّلها في **الإعدادات**. ويوضح [التخطيط معاً](page:feature/plan-together) ما الذي تخبرك به."
      - q: "هل هناك تطبيق للتنزيل؟"
        a: "ليس من متجر تطبيقات، لأن Side Badger يعمل في متصفحك. سجّل الدخول، ثم اتبع **إضافة إلى الشاشة الرئيسية أو Dock** في **الإعدادات**، فيفتح كأنه تطبيق، في نافذة خاصة به. وتعرض صفحة [تطبيق الويب](page:feature/web-app) الخطوات لكل جهاز."
  - heading: "المغادرة والأرشفة والقفل والإغلاق"
    items:
      - q: "كيف أغادر مجموعة؟"
        a: "سوِّ حسابك أولاً، ثم اختر **مغادرة المجموعة**. لا يمكنك المغادرة ما دام عليك مبلغ أو لك مبلغ ولو بعملة واحدة، أو ما دام في مصروف تشارك فيه سؤال مفتوح، أو إذا كنت آخر مشرف أو العضو الوحيد، والعودة تحتاج إلى دعوة جديدة. وتجد التفاصيل في [المجموعات والأذونات](page:feature/groups-and-permissions)."
      - q: "كيف أُزيل مجموعة قديمة من لوحة التحكم؟"
        a: "اختر **أرشفة المجموعة**. تختفي من لوحتك أنت لا من لوحة غيرك، ويظل بإمكانك فتحها واستخدامها، ويعيدها **إلغاء أرشفة المجموعة**. ويقارن [المجموعات والأذونات](page:feature/groups-and-permissions) بين الأرشفة والقفل والإغلاق."
      - q: "انتهت الرحلة. هل نستطيع منع تغيّر الأرقام؟"
        a: "نعم. يستطيع المشرف تشغيل **قفل المجموعة** في إعدادات المجموعة، فلا يستطيع أحد إضافة المصروفات أو تعديلها أو تسجيل دفعات جديدة أو تغيير القوائم والاستطلاعات إلى أن يرفع أحد المشرفين القفل. ويظل بإمكان الجميع قراءة المجموعة وسجلها، ولا يتسلل تاكسي متأخر، كما يشرح [المجموعات والأذونات](page:feature/groups-and-permissions)."
      - q: "هل أستطيع حذف مجموعة؟"
        a: "يستطيع المشرف إغلاقها بـ **إغلاق المجموعة**، بعد كتابة اسم المجموعة للتأكيد. والإغلاق نهائي ويجعل المجموعة غير متاحة للجميع، فإن أردت إخفاءها عن نظرك فقط فأرشفها بدلاً من ذلك. وتجد التفاصيل الدقيقة في [المجموعات والأذونات](page:feature/groups-and-permissions)."
contact:
  heading: "ما زلت عالقاً؟"
  items:
    - q: "وجدت خللاً، أو تريد تغيير شيء؟"
      a: "أخبرنا من داخل التطبيق. اختر **ملاحظات** في قائمة حسابك، ثم **إرسال ملاحظات**، واختر **الإبلاغ عن مشكلة** أو **طلب مساعدة** أو **طلب ميزة**. أرفق لقطة شاشة إن كانت تفيد، وحين نرد ستجد الرد في المحادثة نفسها."
    - q: "تفضّل البريد الإلكتروني؟"
      a: "اكتب إلى العنوان أدناه. اذكر أي مجموعة تخصها المسألة، وماذا فعلت، وماذا توقعت أن يحدث. الفضفضة مقبولة؛ أما كلمات المرور فلا، فلا ترسل كلمة مرورك أبداً."
  emailLabel: "راسلنا على"
  email: support@sidebadger.me
