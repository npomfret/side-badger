meta:
  title: Dividi le spese di feste, matrimoni e regali collettivi
  description: Condividi le spese di una festa, un matrimonio o un regalo collettivo quando ognuno contribuisce con una cifra diversa. Vota il programma, dividi per importi esatti e guarda chi deve cosa a chi.
h1: Dividi le spese di feste, matrimoni e regali collettivi
navLabel: Eventi e feste
lead: Dividi caparre, decorazioni e ombrelli d'emergenza. Il piano dei tavoli lascialo a qualcuno più coraggioso. Side Badger tiene **chi ha messo quanto** in un unico posto, così anche chi organizza può godersi la festa.
cta:
  heading: Parti dalla prossima festa
  body: Crea un account, crea un gruppo per l'evento e manda il link di invito. Side Badger è gratis, senza pubblicità e senza limiti giornalieri.
  button: Crea un account gratuito
scenario:
  heading: Tutti contribuiscono, non sempre con la stessa cifra
  body: Qualcuno paga la caparra del locale, qualcun altro compra la torta e una terza persona mette il regalo collettivo sulla propria carta. Alcuni invitati vengono a tutto e altri solo alla cena. Tenere un conto giusto in una chat è un lavoro per cui nessuno si è candidato. Un gruppo Side Badger tiene tutto, qualunque sia il mix di importi, e mostra a ciascuno cosa deve o cosa gli spetta. Vedi [come funziona](page:how-it-works) per le basi, oppure continua a leggere per un evento.
sections:
  - heading: Decidere insieme
    body: Prima che si muova qualsiasi soldo, metti la scelta a un **sondaggio**. Aggiungi fino a 10 opzioni, come due locali o tre idee regalo, e lascia votare tutti. Puoi nascondere chi ha votato cosa, così ogni opzione ha un ascolto equo, e il vincitore compare quando il sondaggio è chiuso. Nessuno deve scorrere quaranta messaggi per scoprire cosa è stato deciso.
  - heading: Chi c'è per cosa
    body: Non tutti pagano lo stesso, e non tutti fanno parte di ogni costo. Dividi una spesa in parti uguali, per percentuale o per **importi esatti**, così la quota di ciascuno è la cifra concordata. Escludi chi non era coinvolto, come gli invitati che hanno saltato la cena o gli amici che non si sono uniti al regalo. Ogni spesa ha un solo pagatore, e tutti gli altri nella divisione devono a lui la propria quota. I dettagli sono nella pagina [dividere le spese](page:feature/split-expenses).
  - heading: Conserva le carte
    body: Aggiungi note a una spesa, per esempio cosa copriva il costo. I commenti restano **accanto alla spesa** di cui parlano, quindi la domanda "la torta costava 45 £ o 54 £?" e la sua risposta stanno nello stesso posto. I commenti arrivano a 500 caratteri, più che sufficienti per una domanda su una caparra.
  - heading: Controlli per chi organizza
    body: La collaborazione aperta permette a qualsiasi membro di aggiungere e modificare spese, il che va bene per un piccolo regalo. Per un matrimonio o una festa più grande, scegli il preset **Gruppo gestito**. Gli admin approvano ogni nuovo membro e solo i creatori e gli admin possono modificare le spese. Invita le persone con un link o un codice QR; con l'approvazione attiva, un admin fa entrare ogni persona, così la lista degli invitati resta la lista degli invitati. Quando l'evento è finito, blocca il gruppo così i numeri restano fermi.
  - heading: Salda dopo la festa
    body: Quando è arrivata l'ultima fattura, i saldi mostrano **chi deve cosa a chi**, e Side Badger suggerisce una breve lista di pagamenti che salda tutti. Pagatevi come vi fa più comodo, poi registrate il pagamento nel gruppo. Side Badger non sposta mai denaro, quindi il gruppo tiene il conto mentre i trasferimenti avvengono nelle vostre app bancarie. La pagina [saldare i conti](page:feature/settle-up) mostra come un groviglio diventa una breve lista.
