meta:
  title: "Treoracha chun costais a roinnt go cothrom | Side Badger"
  description: "Treoracha praiticiúla chun cíos, tithe saoire agus costais ghrúpa a roinnt go cothrom, gach ceann oibrithe amach le grúpa réadúil agus na suimeanna léirithe."
h1: "Treoracha chun costais a roinnt go cothrom"
navLabel: "Treoracha"
lead: "Na ceisteanna a chuireann daoine díreach sula n-osclaíonn siad scarbhileog, freagartha le grúpa réadúil, na suimeanna agus na céimeanna san aip."
intro: "Leanann gach treoir **grúpa ficseanúil amháin** ón gcéad chostas go dtí an íocaíocht dheireanach a taifeadadh. Tá na huimhreacha oibrithe amach duit, agus úsáideann na céimeanna na scáileáin faoi na hainmneacha atá orthu san aip."
cta:
  heading: "An bhfuil grúpa mar seo agat?"
  body: "Cruthaigh cuntas, tosaigh grúpa agus cuir an chéad chostas leis. Tá na suimeanna déanta duit."
cardsHeading: "Roghnaigh do cheist"
