faq:
  heading: 常见问题
  items:
    - q: Side Badger 是 Splitwise 的免费替代品吗？
      a: "在群组分账这件事上，是的。收据扫描、货币换算和无广告都免费，也没有每日限制。如果你需要原生应用、离线使用、定期支出或应用内付款，这些 Splitwise 有而 Side Badger 没有。"
    - q: Splitwise 的详情从哪里来？
      a: "来自 Splitwise 自己的页面：它的首页、Pro 页面和帮助中心。表格的每一行都链接到它的出处，表格上方的日期说明我们是什么时候读的。我们每季度复查一次。"
    - q: Side Badger 会一直免费吗？
      a: "Side Badger 的一切目前都是免费的，也没有付费档。如果这将来有变化，我们会先通知你。详情见[定价页面](page:pricing)。"
    - q: 我的群组里每个人都得换过来吗？
      a: "是的。群组里每个人都需要一个免费的 Side Badger 账户，可以通过链接或二维码加入。"
    - q: Side Badger 有手机应用吗？
      a: "应用商店里没有。它在你的浏览器里运行：在手机上登录，再把它添加到主屏幕，它就会像应用一样打开。方法见[使用方式](page:how-it-works)。"
