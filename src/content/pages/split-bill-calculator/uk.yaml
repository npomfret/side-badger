meta:
  title: "Калькулятор рахунків: хто кому винен | Side Badger"
  description: "Хто платив, хто винен, хто кому платить: з'ясовано за секунди. Порівну, за точними сумами чи відсотками. Безкоштовно, у браузері, нічого не зберігається й не надсилається."
h1: "Калькулятор розподілу рахунків"
navLabel: "Калькулятор рахунків"
lead: "Внесіть, хто за що платив, і калькулятор скаже, хто кому винен, та покаже короткий список платежів для розрахунку. Він працює у вашому браузері, нічого не зберігає й не переказує гроші. Якщо групі потрібно, щоб облік пережив вкладку, [розподіл витрат](page:feature/split-expenses) і [розрахунок](page:feature/settle-up) у Side Badger роблять ті самі обчислення й зберігають їх."
cta:
  heading: "Сподобалися обчислення? Збережіть їх."
  body: "Цей калькулятор забуває все, щойно ви закриєте вкладку, достоту як той, хто «точно платив минулого разу». Група в Side Badger зберігає витрати, оновлює баланс кожного й записує платежі. Це безкоштовно, без реклами й без денних обмежень."
sections:
  - heading: "Як працює розрахунок"
    body: "Для кожної витрати калькулятор визначає частку кожної людини. Розділити можна порівну, за точними сумами або у відсотках між тими, кого ви оберете. Баланс кожного — це те, що він заплатив, мінус те, що він винен. Плюс означає, що група винна йому, а мінус — що він винен групі. Баланси завжди в сумі дають нуль, бо скільки б комусь не були винні, стільки й винні інші."
  - heading: "Чому список платежів короткий"
    body: "Нікому не потрібно розраховуватися за кожен чек окремо. Коли баланси відомі, калькулятор зіставляє того, хто винен найбільше, з тим, кому винні найбільше, закриває стільки, скільки може один платіж, і йде далі списком, доки всі не опиняться на нулі. Йому ніколи не потрібно більше платежів, ніж на один менше за кількість людей із балансом, а часто вистачає й менше, ніж при розрахунку рахунок за рахунком. Він дає короткий список платежів і не обіцяє, що це найкоротший з можливих."
  - heading: "Чого калькулятор не робить"
    items:
      - "**Не працює з кількома валютами.** Оберіть одну й користуйтеся нею для всього розрахунку. Застосунок веде окремий баланс для кожної валюти й може конвертувати витрату за актуальним курсом обміну, який можна змінити."
      - "**Нічого не зберігає.** Закрийте вкладку, і цифри зникнуть. Щоб їх зберегти, скопіюйте посилання. Воно містить ваші цифри після #, а браузер ніколи не надсилає цю частину на сервер, і всі, кому ви його надішлете, зможуть їх прочитати."
      - "**Не переказує гроші.** Він лише каже, хто кому має заплатити. Ви платите одне одному як зручно, а потім записуєте платіж у застосунку, якщо ваша група веде облік там."
      - "**Не вибирає зайву копійку навмання.** Коли рахунок не ділиться націло, зайві копійки дістаються перших людей у списку, щоб підсумки сходилися. У застосунку зайва копійка дістається одній людині навмання, тож це не завжди та сама людина."
      - "**Не виходить за межі.** Калькулятор приймає від 2 до 20 людей, а одна витрата може сягати 999 999,99, як і в застосунку."
exampleAfter: 2
