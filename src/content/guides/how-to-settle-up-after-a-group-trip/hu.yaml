faq:
  heading: "Kérdések"
  items:
    - q: "Ki rögzítse a kifizetést, aki fizet, vagy aki kapja?"
      a: "A kifizetés rögzítéséhez jogosultság kell a költségek szerkesztésére, az űrlap pedig ezt kérdezi: **Ki fizetett?** és **Ki kapta a kifizetést?** Később csak az szerkesztheti, aki rögzítette, ezért általában az a legegyszerűbb, ha a fizető teszi meg a gyors rendezés gombbal."
    - q: "Mi van, ha az utazás két pénznemben zajlott?"
      a: "Az egyenlegek pénznemenként vannak vezetve, így az eurós tartozás eurós tartozás marad, és minden pénznem saját rövid listát kap, hacsak a költségeket nem váltották át bevitelkor. A [több pénznemben fizetett utazásról szóló útmutató](page:guide/how-to-split-a-trip-paid-in-several-currencies) mindkét módot megmutatja."
    - q: "Az utazás alatt számoljunk el, vagy a végén?"
      a: "Mindkettő jó. Minden rögzített kifizetés változtat az egyenlegeken, így egy utazás közbeni kifizetés beleszámít a végső listába. A végén egyszerűbb, mert [az egész utazás](page:use-case/group-trips) egy helyen van."
