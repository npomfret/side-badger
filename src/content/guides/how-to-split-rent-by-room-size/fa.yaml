meta:
  title: "تقسیم اجاره بر اساس اندازه اتاق | Side Badger"
  description: "اتاق بزرگ‌تر، سهم بزرگ‌تر. فضاهای مشترک را کنار بگذارید، بقیه را بر اساس متراژ تقسیم کنید و درصدها را یک بار وارد کنید. حساب‌وکتاب سه هم‌خانه."
h1: "تقسیم اجاره بر اساس اندازه اتاق"
navLabel: "اجاره بر اساس اندازه اتاق"
lead: "مشخص کنید چه مقدار از اجاره بابت فضاهای مشترک است و همان بخش را مساوی تقسیم کنید، بعد بقیه را بر اساس متراژ اتاق خواب هر نفر سرشکن کنید. درصدها را گرد کنید تا عدد صحیح شوند، یک بار روی اجاره در Side Badger وارد کنید و هر ماه هزینه را کپی کنید."
cta:
  heading: "اجاره را یک بار وارد کنید"
  body: "یک حساب رایگان بسازید، برای آپارتمان یک گروه شروع کنید و اجاره را با درصدهایی که توافق کرده‌اید وارد کنید. ماه بعد فقط یک کپی است. اول تور می‌خواهید؟ ببینید [چطور کار می‌کند](page:how-it-works) یا [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing)."
sections:
  - heading: "سه نفر، یک آپارتمان، یک بحث"
    body: "پریا، تام و عایشه در آپارتمانی شریک‌اند که ماهی £1,950 اجاره دارد. یک سال تمام اجاره را بین سه نفر مساوی تقسیم کردند، چون ساده بود. بعد عایشه اتاقش را متر کرد. اتاق پریا 16 متر مربع است، اتاق تام 12 متر مربع و اتاق عایشه 10 متر مربع، یعنی عایشه همان‌قدر می‌داد که پریا می‌داد، برای اتاقی که بیش از یک‌سوم کوچک‌تر است. هیچ‌کس غیرمنطقی رفتار نکرده بود. هیچ‌کس حساب نکرده بود. سر یک غذای بیرون‌بر اول روی یک قاعده توافق کردند. 40% اجاره بابت آشپزخانه، حمام و نشیمن است که هر سه نفر از آن‌ها استفاده می‌کنند."
  - heading: "روش، با حساب‌وکتابش"
    body: "چهار قدم، یک متر نواری و ماشین‌حساب گوشی."
    items:
      - "**بخش مشترک را کنار بگذارید.** گروه روی سهمی از اجاره برای اتاق‌هایی که همه استفاده می‌کنند توافق می‌کند. برای این آپارتمان 40% است، یعنی بین سه نفر هر نفر 13.33%."
      - "**بقیه را بر اساس متراژ تقسیم کنید.** 60% دیگر بر اساس اندازه اتاق خواب‌ها می‌رود. اتاق خواب‌ها روی هم 38 متر مربع می‌شوند (16 + 12 + 10)، پس سهم پریا از آن 60% × 16/38 است، یعنی 25.26%."
      - "**دو بخش را جمع بزنید.** پریا: 25.26% + 13.33% = 38.6%. تام: 60% × 12/38 = 18.95%، به‌علاوه 13.33% می‌شود 32.3%. عایشه: 60% × 10/38 = 15.79%، به‌علاوه 13.33% می‌شود 29.1%."
      - "**گرد کنید و وارسی کنید.** درصدهای صحیح هم راحت‌تر تایپ می‌شوند هم راحت‌تر می‌شود سرشان بحث کرد، پس 38.6% می‌شود 39%، 32.3% می‌شود 32% و 29.1% می‌شود 29%. بررسی کنید که 39 + 32 + 29 برابر 100 باشد. اگر گرد کردنتان به 99 یا 101 رسید، گروه توافق می‌کند عدد چه کسی یک درصد جابه‌جا شود."
  - heading: "خواندن ماه آپارتمان"
    body: "اجاره با 39%، 32% و 29% می‌شود £760.50، £624.00 و £565.50. پریا به صاحب‌خانه پرداخته، پس در طول ماه £1,142.50 طلبکار است، در حالی که تام £566.00 بدهکار است و عایشه £576.50. Side Badger دو پرداخت پیشنهاد می‌دهد، هر دو به پریا."
  - heading: "در Side Badger راه بیندازیدش"
    body: "یک شب کار، که بیشترش صرف بحث درباره آن 40% می‌شود."
    items:
      - "**گروه را بسازید.** در داشبورد **ایجاد گروه** را انتخاب کنید و گروه را به نام آپارتمان بگذارید. **دعوت دیگران** را انتخاب کنید و لینک یا کد QR را بفرستید. هر کس وارد می‌شود یا یک حساب رایگان می‌سازد و نامی را که می‌خواهد در این گروه دیده شود انتخاب می‌کند."
      - "**اجاره را اضافه کنید.** **افزودن هزینه** را انتخاب کنید. توضیح و مبلغ را وارد کنید و زیر **چه کسی پرداخت کرد؟** کسی را که به صاحب‌خانه پرداخته انتخاب کنید. هر سه نفر را زیر **تقسیم بین** نگه دارید، بعد زیر **نحوه تقسیم** گزینه **درصد** را انتخاب کنید و 39، 32 و 29 را بنویسید. اگر درصدها جمعشان 100 نشود، فرم هشدار می‌دهد. **ذخیره هزینه** را انتخاب کنید."
      - "**قبض‌ها را اضافه کنید.** انرژی و اینترنت هزینه‌های جدا هستند و پرداخت‌کننده‌های خودشان را دارند. **نحوه تقسیم** را روی **به طور مساوی** بگذارید."
      - "**ماه بعد کپی کنید.** اجاره ماه قبل را باز کنید و **کپی هزینه** را انتخاب کنید. کپی پرداخت‌کننده، مبلغ و تقسیم را نگه می‌دارد و تاریخ امروز را می‌گیرد. اگر اجاره عوض شده مبلغ را عوض کنید، بعد **ایجاد کپی** را انتخاب کنید."
      - "**ببینید چه کسی به چه کسی بدهکار است.** بخش **موجودی‌ها** نشانش می‌دهد. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را زیر **تسویه حساب** ثبت کنید."
  - heading: "اتاق با حمام اختصاصی، اتاقک و کسانی که می‌روند"
    items:
      - "**اتاق با حمام اختصاصی و اتاقک.** متراژ فقط نقطه شروع است. اتاقی که حمام خودش را دارد از همان متراژ بدون حمام ارزش بیشتری دارد و اتاقکی که یک تخت و یک صندلیِ امیدوار در آن جا می‌شود ارزش کمتری دارد. درصدها را با توافق تنظیم کنید، بررسی کنید که هنوز جمعشان 100 است و عددهای نهایی را جایی بنویسید که کل آپارتمان ببیند."
      - "**کسی وسط ماه از خانه می‌رود.** حساب کنید هر نفر برای آن ماه چقدر بدهکار است و اجاره آن ماه را به‌جای **درصد** با **مبالغ دقیق** وارد کنید. مبلغ‌ها باید جمعشان برابر اجاره شود. این کار را پیش از رفتنش بکنید. تا وقتی کسی بدهکار یا طلبکار است نمی‌تواند از گروه خارج شود و هزینه‌ای که شامل کسی باشد که رفته است فقط‌خواندنی می‌شود."
      - "**کسی به خانه اضافه می‌شود.** دوباره متر کنید، حساب را با اندازه اتاق‌های جدید دوباره بکنید و از اجاره بعدی درصدهای جدید را به کار ببرید. ماه‌های قبل همان‌طور که بودند می‌مانند."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "اتاق‌های شما را متر نمی‌کند و درصدها را انتخاب نمی‌کند. متراژها و آن 40% را گروه باید توافق کند."
      - "قبض تکراری ندارد، پس هر بار اجاره ماه قبل را کپی می‌کنید."
      - "هرگز پول جابه‌جا نمی‌کند و به صاحب‌خانه پرداخت نمی‌کند. هر طور دوست دارید به هم پرداخت می‌کنید و ثبتش می‌کنید."
      - "نمی‌داند قرارداد اجاره شما چه می‌گوید. حساب را بین افراد گروه نگه می‌دارد."
