  title: Mga gabay sa patas na paghahati ng gastos | Side Badger
  description: Mga praktikal na gabay sa patas na paghahati ng upa, villa sa bakasyon, at gastos ng grupo, bawat isa'y dinadaanan gamit ang makatotohanang grupo at ipinapakitang kuwenta.
h1: Mga gabay sa patas na paghahati ng gastos
navLabel: Mga gabay
lead: Ang mga tanong na itinatanong ng mga tao bago magbukas ng spreadsheet, sinasagot gamit ang makatotohanang grupo, ang mga kuwenta, at ang mga hakbang sa app.
intro: Sinusundan ng bawat gabay ang **isang kathang-isip na grupo** mula sa unang gastos hanggang sa huling naitalang bayad. Kinuwenta na para sa iyo ang mga numero, at ginagamit ng mga hakbang ang mga screen ayon sa tawag dito ng app.
cta:
  heading: May grupo ka bang tulad nito?
  body: Gumawa ng account, magsimula ng grupo, at idagdag ang unang gastos. Tapos na ang kuwenta para sa iyo.
cardsHeading: Piliin ang tanong mo
