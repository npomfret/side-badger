        method: equal
featuresHeading: "Можливості, які використовує будинок"
faq:
  heading: "Запитання"
  items:
    - q: "Чи може оренда повторюватися автоматично?"
      a: "Ні, регулярних рахунків немає. Скопіюйте оренду минулого місяця кількома дотиками, змініть дату, і готово."
    - q: "Чи можемо ми ділити за розміром кімнати?"
      a: "Так, у відсотках. Дайте кожному сусідові частку, що відповідає його кімнаті, аби частки в сумі давали 100. Про інші способи розподілу читайте в [розподілі витрат](page:feature/split-expenses)."
    - q: "Що, якщо сусід виїжджає, маючи борг?"
      a: "Він не може покинути групу, доки не розрахується, бо ніхто не може піти, поки винен гроші або йому їх винні. Цифри лишаються чесними, доки всі не квити."
    - q: "Чи платить Side Badger за рахунки?"
      a: "Ні. Він веде облік і підказує короткий список платежів. Ви платите одне одному як зручно, а потім записуєте, як пояснює [розрахунок](page:feature/settle-up)."
    - q: "Чи може один сусід вести облік?"
      a: "Так. Зробіть його адміністратором і використовуйте керовану групу, де нових учасників схвалюють, а витрати можуть змінювати лише творці й адміністратори."
