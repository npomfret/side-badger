faq:
  heading: "Ceisteanna"
  items:
    - q: "An rogha saor in aisce seachas Splitwise é Side Badger?"
      a: "Chun billí a roinnt i ngrúpa, is ea. Tá scanadh admhálacha agus tiontú airgeadra saor in aisce, gan fógraí agus gan teorainneacha laethúla. Más gá duit aip dhúchasach, úsáid as líne, costais athfhillteacha nó íocaíochtaí laistigh den aip, déanann Splitwise iad sin agus ní dhéanann Side Badger."
    - q: "Cá as a dtagann na sonraí faoi Splitwise?"
      a: "Ó leathanaigh Splitwise féin: a leathanach baile, a leathanach Pro agus a lárionad cabhrach. Nascann gach sraith den tábla leis an leathanach as ar tháinig sí, agus insíonn an dáta os cionn an tábla cathain a léamar iad. Seiceálaimid iad gach ráithe."
    - q: "An bhfanfaidh Side Badger saor in aisce?"
      a: "Tá gach rud i Side Badger saor in aisce inniu, agus níl aon leibhéal íoctha ann. Má athraíonn sin riamh, tabharfaimid fógra duit ar dtús. Tá na sonraí ar an [leathanach praghsála](page:pricing)."
    - q: "An gcaithfidh gach duine i mo ghrúpa aistriú?"
      a: "Caithfidh. Teastaíonn cuntas saor in aisce Side Badger ó gach duine i ngrúpa, agus is féidir leo dul isteach le nasc nó le cód QR."
    - q: "An bhfuil aip mhóibíleach ag Side Badger?"
      a: "Ní i siopa aipeanna. Ritheann sé i do bhrabhsálaí: sínigh isteach ar do ghuthán, ansin cuir le do scáileán baile é ionas go n-osclaíonn sé cosúil le haip. Léiríonn [conas a oibríonn sé](page:how-it-works) conas."
