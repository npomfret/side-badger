meta:
  title: "تقسیم قبض‌ها با شریک زندگی که درآمدش بیشتر است | Side Badger"
  description: "50/50 وقتی یکی از شما خیلی بیشتر درمی‌آورد ناجور می‌شود. قبض‌های مشترک را بر اساس درآمد تقسیم کنید، با حساب‌وکتاب کامل برای دو نفر و بدون صفحه‌گسترده."
h1: "تقسیم قبض‌ها با شریک زندگی که درآمدش بیشتر است"
navLabel: "شریک با درآمد بیشتر"
lead: "حقوق خالص هر دو را جمع بزنید، سهم هر نفر از کل را حساب کنید و درصدها را به عدد صحیح گرد کنید. حقوق خالص مایا ماهی £2,800 است و جان £1,700، پس قبض‌های مشترک را 62/38 تقسیم می‌کنند. همان درصدها را روی یک هزینه مشترک در Side Badger وارد کنید، بعد هر بار که همان قبض می‌رسد آن را کپی کنید."
cta:
  heading: "حساب را یک بار بکنید"
  body: "یک حساب رایگان بسازید، برای خودتان دو نفر یک گروه درست کنید و اجاره را با درصدهایتان وارد کنید. اجاره ماه بعد یک کپی است. اول تور می‌خواهید؟ ببینید [چطور کار می‌کند](page:how-it-works) یا [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing)."
sections:
  - heading: "دو حقوق، یک آپارتمان، یک سکوت مؤدبانه"
    body: "مایا و جان با هم زندگی می‌کنند. حقوق خالص مایا ماهی £2,800 است و حقوق خالص جان ماهی £1,700. دو سال همه‌چیز را 50/50 تقسیم کردند، چون ساده بود و هیچ‌کدام نمی‌خواست اولین کسی باشد که موضوع را پیش می‌کشد. بعد جان اجاره را تنهایی نگاه کرد. نصف £1,400 می‌شود £700، که یک‌چهارم حقوق خالص مایا است و 41% حقوق جان. هیچ‌کس ناعادلانه رفتار نکرده بود. هیچ‌کس حساب نکرده بود. خیلی از [زوج‌ها](page:use-case/couples) دیر یا زود به اینجا می‌رسند. سر یک غذای بیرون‌بر توافق کردند که قبض‌های مشترک باید سهم تقریباً یکسانی از هر حقوق بردارند."
  - heading: "روش، با حساب‌وکتابش"
    body: "چهار قدم، یک ماشین‌حساب و گفتگویی که به هر حال باید می‌کردید."
    items:
      - "**روی اینکه چه چیزی حقوق حساب می‌شود توافق کنید.** مایا و جان از حقوق خالص استفاده می‌کنند، یعنی پولی که هر ماه به بانک می‌نشیند. روی هم £2,800 + £1,700 = £4,500 می‌شود."
      - "**سهم هر نفر را حساب کنید.** سهم مایا 2,800 ÷ 4,500 است، یعنی 62.2%. سهم جان 1,700 ÷ 4,500 است، یعنی 37.8%."
      - "**به درصد صحیح گرد کنید.** 62.2% می‌شود 62 و 37.8% می‌شود 38. با دو نفر، یک عدد را گرد کنید و از 100 کم کنید تا دیگری به دست بیاید، و همیشه جمعشان 100 می‌شود."
      - "**ببینید معنایش چیست.** روی اجاره £1,400، مایا £868 (62%) می‌دهد و جان £532 (38%). این حدود 31% از حقوق خالص هر نفر است. نصف‌نصف 25% از حقوق مایا را می‌گرفت و 41% از حقوق جان را."
  - heading: "خواندن ماه"
    body: "مایا اجاره £1,400 را پرداخت و جان بقیه را، یعنی £216. سهم مایا از ماه £868.00 + £111.60 + £18.00 = £997.60 است و چون £1,400 پرداخته، £402.40 طلبکار است. سهم جان £532.00 + £68.40 + £18.00 = £618.40 است و چون £216 پرداخته، £402.40 بدهکار است. Side Badger یک پرداخت پیشنهاد می‌دهد، جان به مایا، به مبلغ £402.40، و [تسویه حساب](page:feature/settle-up) آن را بعد از انجام شدن ثبت می‌کند. اگر 50/50 تقسیم می‌شد، همین ماه جان باید £592.00 به مایا می‌پرداخت."
  - heading: "در Side Badger راه بیندازیدش"
    body: "ده دقیقه، که بیشترش صرف درصدها می‌شود."
    items:
      - "**گروه را بسازید.** در داشبورد **ایجاد گروه** را انتخاب کنید و گروه را به نام آپارتمان بگذارید. **دعوت دیگران** را انتخاب کنید و لینک یا کد QR را برای جان بفرستید. او وارد می‌شود یا یک حساب رایگان می‌سازد و نامی را که می‌خواهد در این گروه دیده شود انتخاب می‌کند. فقط اعضا می‌توانند گروه را ببینند، پس این گروه فقط مال شما دو نفر است."
      - "**اجاره را اضافه کنید.** **افزودن هزینه** را انتخاب کنید. توضیح و مبلغ را وارد کنید و زیر **چه کسی پرداخت کرد؟** مایا را انتخاب کنید. هر دو نفر را زیر **تقسیم بین** نگه دارید، بعد زیر **نحوه تقسیم** گزینه **درصد** را انتخاب کنید و 62 و 38 را بنویسید. اگر درصدها جمعشان 100 نشود، فرم هشدار می‌دهد. **ذخیره هزینه** را انتخاب کنید."
      - "**قبض‌های دیگر را اضافه کنید.** انرژی و اینترنت به همان روش وارد می‌شوند، با جان به‌عنوان پرداخت‌کننده و همان 62 و 38. غذای بیرون‌بر هزینه جدا است و **نحوه تقسیم** روی **به طور مساوی** می‌ماند."
      - "**ماه بعد کپی کنید.** اجاره ماه قبل را باز کنید و **کپی هزینه** را انتخاب کنید. کپی پرداخت‌کننده، مبلغ و تقسیم را نگه می‌دارد و تاریخ امروز را می‌گیرد. اگر اجاره عوض شده مبلغ را عوض کنید، بعد **ایجاد کپی** را انتخاب کنید. قبض انرژی هم همین‌طور کار می‌کند."
      - "**ببینید چه کسی به چه کسی بدهکار است.** بخش **موجودی‌ها** نشانش می‌دهد و فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را زیر **تسویه حساب** ثبت کنید."
  - heading: "50/50، بر اساس درآمد، یا قبض‌به‌قبض"
    body: "جواب درستی وجود ندارد، فقط جوابی هست که هر دو بتوانید با آن زندگی کنید. سه جواب رایج."
    items:
      - "**برای همه‌چیز نصف‌نصف.** نگه داشتنش از همه ساده‌تر است و برای زوج‌هایی مناسب است که حقوقشان نزدیک به هم است."
      - "**برای هر چه مشترک است بر اساس درآمد.** کاری که مایا و جان می‌کنند. یک گفتگو، یک جفت درصد."
      - "**قبض‌به‌قبض.** اجاره و قبض‌ها بر اساس درآمد، تعطیلات و لذت‌های کوچک 50/50 یا هر چیز دیگری که توافق کنید، و هر قبض قاعده‌ای را می‌گیرد که به آن می‌خورد."
  - heading: "توافق کنید چه چیزی مشترک حساب می‌شود"
    body: "دعواها معمولاً سر فهرست است، نه سر درصدها. اجاره، انرژی، اینترنت، خرید هفتگی و مبل در بیشتر خانه‌ها مشترک حساب می‌شوند. اشتراک باشگاه مایا و اشتراک پخش فوتبال جان شاید نه. فهرست را یک بار توافق کنید، بنویسیدش و فقط هزینه‌های مشترک را در گروه بگذارید."
  - heading: "غذای بیرون‌بر عمداً 50/50 می‌ماند"
    body: "لذت‌های کوچک کم‌خرج و اختیاری‌اند و کسی نباید برای سفارش دامپلینگ ماشین‌حساب لازم داشته باشد. در Side Badger غذای بیرون‌بر فقط یک هزینه دیگر است. جان £36 می‌پردازد، **نحوه تقسیم** روی **به طور مساوی** می‌ماند و هر کدام £18 بدهکار می‌شوند."
  - heading: "وقتی حقوق یک نفر عوض می‌شود"
    body: "افزایش حقوق، شغل جدید یا مرخصی حساب را عوض می‌کند. درصدهای جدید را به همان روش حساب کنید و از هزینه بعدی به کار ببرید. هزینه‌های قبلی همان‌طور که بودند می‌مانند. اجاره ماه قبل را کپی کنید، درصدها را عوض کنید، بعد **ایجاد کپی** را انتخاب کنید. برای اصلاح هزینه‌ای که قبلاً ثبت شده، اگر مجوزهای گروه اجازه بدهد آن را ویرایش کنید و اول به شریک زندگی‌تان خبر بدهید، چون مانده‌ها تغییر می‌کنند. نسخه قبلی نگه داشته می‌شود. توافق کنید کی دوباره حساب می‌کنید، مثلاً سالی یک بار، و پیش از عوض کردن تسویه کنید تا تقسیم قدیمی با یک شمارش تمیز بسته شود."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "هرگز نمی‌پرسد کسی چقدر درمی‌آورد و درصدها را حساب نمی‌کند. شما عددهایی را که توافق کرده‌اید تایپ می‌کنید."
      - "نمی‌تواند یک تقسیم پیش‌فرض برای کل گروه تعیین کند. درصدها روی هر هزینه می‌روند، پس هزینه‌ای را که از قبل درصدها را دارد کپی کنید."
      - "قبض تکراری ندارد، پس هر بار اجاره ماه قبل را کپی می‌کنید."
      - "هرگز پول جابه‌جا نمی‌کند. هر طور دوست دارید به هم پرداخت می‌کنید و ثبتش می‌کنید."
