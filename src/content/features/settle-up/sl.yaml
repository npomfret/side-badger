sections:
  - heading: "Zabeleži plačilo"
    body: "Ko nekdo plača, to zabeleži pri pravi osebi. Gumbi za hitro poravnavo izpolnijo znesek iz tvojih predlaganih plačil, dodaš pa lahko opombo, na primer „bančno nakazilo“ (do 500 znakov). Če plačaš samo del tega, kar dolguješ, preostanek ostane na stanju. Če vneseš premalo ali preveč, te Side Badger opozori, preden shraniš. Beleženje plačila zahteva dovoljenje za urejanje stroškov, datum pa ne sme biti v prihodnosti."
  - heading: "Plačano v drugi valuti?"
    body: "Stanja ostanejo v valuti, v kateri so bila plačana, zato evrski dolg ostane evrski dolg. Dolguješ evre, plačaš pa v funtih? V redu. Plačilo ob vnosu pretvori po trenutnem menjalnem tečaju ali po tečaju, ki je veljal ob menjavi. Tečaj se določi ob shranitvi plačila. [Več valut](page:feature/multiple-currencies) pojasni, kako deluje pretvorba, [skupinska potovanja](page:use-case/group-trips) pa jo kažejo v uporabi."
  - heading: "Zgodovina, ki jo lahko preveriš"
    body: "Vsako zabeleženo plačilo ostane v zgodovini skupine z datumom, zneskom in opombo. Plačilo lahko ureja samo oseba, ki ga je zabeležila, izbriše pa ga lahko ona ali skrbnik skupine. Plačilo, v katerem je oseba, ki je zapustila skupino, je zaklenjeno. Za primer s sostanovalci glej [sostanovalce](page:use-case/housemates)."
limits:
  heading: "Česa Side Badger ne počne"
  items:
    - "Side Badger ne premika denarja, ne pošilja povezav za plačilo in ne pošilja zahtevkov za plačilo. Plačilo v aplikaciji je zapis plačila, opravljenega drugje."
    - "Predlagana plačila izhajajo iz preproste metode ujemanja, uporabljene za vsako valuto posebej. Vedno predlaga manj plačil, kot je oseb s stanjem v tej valuti (pri štirih osebah največ tri), vendar ne najde vedno najmanjšega možnega števila."
    - "Predlogov ne moreš izklopiti. **Prikaži vse** našteje vsako predlagano plačilo v skupini, ne samo tvojih."
    - "Valute se nikoli ne pobotajo med seboj, razen če so bili stroški ob vnosu pretvorjeni."
    - "Opomnikov ni, zato je terjanje plačila še vedno tvoja stvar."
useCasesHeading: "Kje je poravnava pomembna"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali Side Badger pošlje denar?"
      a: "Ne. Plačajte si, kakor želite, nato plačilo zabeleži v Side Badger, da se stanje posodobi."
    - q: "Ali lahko izklopim predlagana plačila?"
      a: "Ne. Poenostavitev ostane vklopljena, **Prikaži vse** pa našteje vsako predlagano plačilo v skupini, ne samo tistih, ki te zadevajo."
    - q: "Zakaj so evri in funti ločeni?"
      a: "Stanja ostanejo v valuti, v kateri si plačal, razen če pretvoriš ob vnosu stroška ali plačila. Dolgovi v različnih valutah se nikoli ne pobotajo med seboj."
    - q: "Kaj, če nekdo plača samo del tega, kar dolguje?"
      a: "Zabeleži plačani del. Preostanek ostane na stanju, dokler ni plačan."
    - q: "Ali je to vedno najmanjše možno število plačil?"
      a: "Ni zagotovljeno. Vedno predlaga manj plačil, kot je oseb s stanjem v tej valuti, zato pri štirih osebah nikoli več kot tri. V primeru s sostanovalci sta to dve plačili, kjer je neposredno vračilo vsaki osebi zahtevalo šest."
