meta:
  title: "Side Badger ఏం చేస్తుంది, ఏం చేయదు"
  description: "ఖర్చుల పంపకం, లెక్క తేల్చడం, అనేక కరెన్సీలు, వాటితో పాటు గ్రూపులు, జాబితాలు, పోల్స్. పూర్తి సామగ్రి, Side Badger వదిలేసిన వాటి నిజాయితీ జాబితా."
h1: "Side Badger ఏం చేస్తుంది"
navLabel: "ఫీచర్లు"
lead: "పెట్టెలో ఉన్నదంతా, లేనివి కూడా."
intro: "ఇదిగో పూర్తి సామగ్రి. స్ప్రెడ్‌షీట్‌ను కావాలనే వదిలేశాం. Side Badger రోజూ చేసే మూడు పనులతో మొదలుపెట్టండి, తర్వాత మిగిలిన జాబితాను, అది చేయని వాటి చిన్న జాబితాను చూడండి."
cta:
  heading: "మీ గ్రూప్‌కు కావలసింది ఇది చేస్తుందా?"
  body: "ఉచిత ఖాతా తెరిచి, ముందు ఒక చిన్న గ్రూప్‌తో ప్రయత్నించండి."
  button: "ఉచిత ఖాతా తెరవండి"
cardsHeading: "మూడు పనులు, వివరంగా"
sections:
  - heading: "రసీదు స్కానింగ్"
    body: "రసీదు ఫొటో తీయండి, Side Badger మొత్తం, తేదీ, చోటు నింపుతుంది, మీరు సరిచూసుకోండి. రసీదు చిత్రాలను Google AI సేవ చదువుతుంది."
  - heading: "గ్రూపులు, అనుమతులు"
    body: "ప్రతి ఇంటికి, ట్రిప్‌కు లేదా ఈవెంట్‌కు ఒక గ్రూప్ చేయండి, అందులో 50 మంది వరకు ఉండవచ్చు. లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి. పెద్ద గ్రూప్‌లో ఒకరిని వ్యూయర్‌ను చేయండి, వాళ్లు అన్నీ చూస్తారు, ఏదీ మార్చరు."
  - heading: "జాబితాలు, పోల్స్"
    body: "షాపింగ్ బిల్లుల పక్కనే ఉమ్మడి షాపింగ్ జాబితాను ఉంచండి. విల్లా షార్ట్‌లిస్ట్‌ను ఓటింగ్‌కు పెట్టండి, కావాలంటే పేర్లు చెప్పకుండా."
  - heading: "మిగిలినవన్నీ"
    items:
      - "**లైవ్ అప్‌డేట్‌లు:** ఖర్చు జోడించగానే అందరికీ వెంటనే కనిపిస్తుంది."
      - "**భాషలు:** Side Badgerను 39 భాషలలో వాడండి. గ్రూప్‌లో ప్రతి ఒక్కరూ తమ భాషను ఎంచుకోవచ్చు."
      - "**హోమ్ స్క్రీన్:** యాప్ స్టోర్ అవసరం లేదు. సైన్ ఇన్ చేసి, ఆపై Side Badgerను హోమ్ స్క్రీన్‌కు జోడించండి, అది యాప్‌లా తెరుచుకుంటుంది. యాప్‌లోని సెట్టింగ్‌లు ఎలాగో చూపిస్తాయి."
      - "**ఫీడ్‌బ్యాక్:** బగ్ కనిపించిందా? యాప్ లోపలి నుండే మాకు చెప్పండి, మా సమాధానాన్ని అక్కడే చూడండి."
  - heading: "Side Badger చేయనివి"
    items:
      - "**డబ్బు కదిలించడం.** Side Badger మీ డబ్బును ఎప్పుడూ తాకదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి. పేమెంట్ అభ్యర్థనలు ప్రణాళికలో ఉన్నాయి."
      - "**బిల్లులను పునరావృతం చేయడం.** పునరావృత ఖర్చులు లేవు. గత నెల బిల్లును రెండు ట్యాప్‌లలో కాపీ చేయండి."
      - "**అంశాల వారీగా పంచడం.** ఒక ఖర్చుకు ఒక చెల్లింపుదారు. సమానంగా, ఖచ్చితంగా లేదా శాతంతో పంచండి."
      - "**నేటివ్ యాప్ ఇవ్వడం.** ఇది మీ బ్రౌజర్‌లో పనిచేస్తుంది. సైన్ ఇన్ చేసి, ఆపై హోమ్ స్క్రీన్‌కు జోడించండి."
      - "**ఆఫ్‌లైన్‌లో పనిచేయడం.** దీనికి కనెక్షన్ కావాలి."
      - "**ఇమెయిల్ లేదా టెక్స్ట్‌తో అలర్ట్‌లు పంపడం.** నోటిఫికేషన్‌లు యాప్‌లో కనిపిస్తాయి. పుష్ నోటిఫికేషన్‌లు ప్రణాళికలో ఉన్నాయి."
      - "**చార్ట్‌లు లేదా బడ్జెట్‌లు గీయడం.** ఎవరు ఎవరికి బాకీనో లెక్క ఉంచుతుంది, ట్రిక్ మొత్తం అదే."
      - "**Google లేదా Appleతో సైన్ ఇన్.** ఇమెయిల్‌తో సైన్ అప్ చేయండి. Google, Apple సైన్-ఇన్ ప్రణాళికలో ఉన్నాయి."
      - "**ఖాతా లేకుండా లోపలికి రానివ్వడం.** గ్రూప్‌లో ప్రతి ఒక్కరికీ ఉచిత ఖాతా కావాలి."
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "Side Badger ద్వారా నేను చెల్లించవచ్చా?"
      a: "లేదు. Side Badger లెక్క ఉంచుతుంది, మీ డబ్బును ఎప్పుడూ తాకదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి."
    - q: "మొబైల్ యాప్ ఉందా?"
      a: "యాప్ స్టోర్‌లో లేదు. Side Badger మీ బ్రౌజర్‌లో నడుస్తుంది. మీ ఫోన్‌లో సైన్ ఇన్ చేసి, ఆపై హోమ్ స్క్రీన్‌కు జోడిస్తే యాప్‌లా తెరుచుకుంటుంది. యాప్‌లోని సెట్టింగ్‌లు ఎలాగో చూపిస్తాయి."
    - q: "అంశాల వారీగా పంచవచ్చా?"
      a: "లేదు. ప్రతి ఖర్చుకు ఒక చెల్లింపుదారు ఉంటారు, దాన్ని సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచుతారు."
    - q: "ఆఫ్‌లైన్‌లో పనిచేస్తుందా?"
      a: "లేదు, కనెక్షన్ కావాలి."
    - q: "గ్రూప్‌లో అందరికీ ఖాతా కావాలా?"
      a: "అవును. గ్రూప్‌లో ప్రతి ఒక్కరికీ ఉచిత ఖాతా కావాలి, సైన్ అప్ చేయడానికి ఇమెయిల్ చిరునామా ఉంటే చాలు."
