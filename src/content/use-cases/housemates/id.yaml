faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah sewa berulang otomatis?"
      a: "Tidak, tidak ada tagihan berulang. Salin sewa bulan lalu dalam beberapa ketukan, ganti tanggalnya, dan selesai."
    - q: "Bisakah kami membagi menurut ukuran kamar?"
      a: "Ya, berdasarkan persentase. Beri tiap teman serumah bagian yang mencerminkan kamarnya, asalkan bagiannya berjumlah 100. [Bagi pengeluaran](page:feature/split-expenses) membahas cara membagi lainnya."
    - q: "Bagaimana jika teman serumah pindah dengan masih berutang?"
      a: "Mereka tidak bisa keluar dari grup sampai melunasi, karena tidak ada yang bisa keluar selagi berutang atau dihutangi. Angkanya tetap jujur sampai semua orang impas."
    - q: "Apakah Side Badger membayar tagihan?"
      a: "Tidak. Side Badger menyimpan hitungan dan menyarankan daftar pembayaran singkat. Anda membayar satu sama lain dengan cara apa pun yang disuka, lalu mencatatnya, seperti dijelaskan [pelunasan](page:feature/settle-up)."
    - q: "Bisakah satu teman serumah memegang pembukuan?"
      a: "Ya. Jadikan mereka admin dan pakai grup terkelola, tempat anggota baru perlu persetujuan dan hanya pembuat serta admin yang bisa mengubah pengeluaran."
