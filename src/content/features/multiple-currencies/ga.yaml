sections:
  - heading: "Airgeadra amháin don ghrúpa ar fad"
    body: "Más fearr le do ghrúpa gan smaoineamh air, roghnaigh airgeadra grúpa agus tiontaíonn an fhoirm gach costas nua isteach ann, ar ráta is féidir leat a fheiceáil agus a athrú fós. Ní bhaineann sé seo ach le costais nua agus cóipeáilte. Fágtar eagarthóireachtaí agus costais atá ann cheana mar atá siad, mar sin ní athraíonn aon rud atá taifeadta cheana."
  - heading: "Euro dlite agat, ag íoc i bpunt"
    body: "Íoctha i yen, ag socrú i bpunt? Ceart go leor. Nuair a thaifeadann tú íocaíocht is féidir leat í a thiontú freisin, ionas gur féidir leis an té atá i bhfiacha in euro íoc i bpunt agus go dtagann an t-iarmhéid euro amach i gceart fós. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead é."
  - heading: "Rialacha don ghrúpa"
    body: "Cuir teorainn le grúpa leis na hairgeadraí atá á n-úsáid agat i ndáiríre, agus socraigh réamhshocrú ionas go n-osclaíonn an fhoirm ar an gceann ceart. Ní theastaíonn 139 rogha eile in aice leis an mbille dinnéir ó shaoire sa Phortaingéil, agus is dócha go dteastaíonn dhá cheann ó [bhainis thar lear](page:use-case/events-and-celebrations)."
limits:
  heading: "Teorainneacha"
  items:
    - "Socraítear an ráta nuair a shábhálaítear an costas. Ní athluacháiltear seanchostais choíche."
    - "Faigheann Side Badger ráta reatha nuair is féidir leis. Ní chinntítear ceann do gach péire, agus is féidir leat an ráta a chlóscríobh tú féin i gcónaí."
    - "Ní bhaineann tiontú uathoibríoch an ghrúpa ach le costais nua agus cóipeáilte, ní le heagarthóireachtaí ná le costais atá ann cheana."
    - "Tá uasteorainn 999,999.99 ar gach costas ina airgeadra féin."
    - "Tá 140 airgeadra ann. Níl airgeadraí cripte ná miotail ina measc."
    - "Taifeadann Side Badger íocaíochtaí. Ní bhogann sé airgead ná ní mhalartaíonn sé é."
useCasesHeading: "Cá gcabhraíonn sé seo"
faq:
  heading: "Ceisteanna"
  items:
    - q: "Cén ráta malairte a úsáideann sibh?"
      a: "Ráta malairte reatha, a fhaightear nuair a chuireann tú an costas isteach nuair atá ceann ar fáil. Is féidir leat é a athrú go dtí an ráta a fuair tú i ndáiríre, agus nuashonraítear an tsuim thiontaithe."
    - q: "An n-athluacháiltear seanchostais?"
      a: "Ní athluacháiltear. Socraítear an ráta nuair a shábhálaítear an costas, mar sin ní imíonn iarmhéid ar strae toisc gur athraigh an margadh."
    - q: "An dtacaíonn sibh le crypto?"
      a: "Ní thacaímid. Tá 140 airgeadra ann, agus níl airgeadraí cripte ina measc."
    - q: "Cén fáth nach féidir liom 2,000,000 rupiah a chur isteach?"
      a: "Tá uasteorainn 999,999.99 ar gach costas ina airgeadra féin. Cuir isteach in airgeadra eile é agus tiontaigh, nó roinn ina dhá chostas é."
    - q: "An gcosnaíonn tiontú rud ar bith?"
      a: "Ní chosnaíonn. Tá tiontú saor in aisce, cosúil le gach rud eile i Side Badger. Féach [praghsáil](page:pricing)."
    - q: "An gcaithfidh mé tiontú?"
      a: "Ní chaithfidh. Fanann airgeadraí ar leith mura roghnaíonn tusa nó do ghrúpa tiontú, agus faigheann gach airgeadra a liosta gearr féin d'íocaíochtaí."
