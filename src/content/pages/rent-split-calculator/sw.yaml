faq:
  heading: "Maswali"
  items:
    - q: "Ipi ina haki zaidi, ukubwa wa chumba au kipato?"
      a: "Hakuna, kila mara. Ukubwa wa chumba unafaa wapangaji wenza wanaolipia nafasi wanayolalia. Kipato kinafaa wapenzi na marafiki wenye mishahara tofauti sana. Kubalianeni kabla ya siku ya kwanza ya kodi, si baada yake."
    - q: "Je, bili zigawanywe kwa njia ileile?"
      a: "Kwa wapangaji wenza, kwa kawaida hapana. Kila mtu anatumia umeme na intaneti, kwa hivyo usawa ni rahisi zaidi, kama kwenye mfano. Kwa kipato, kikokotoo kinatoa bili sehemu zilezile za kodi."
    - q: "Je, naweza kutumia futi za mraba?"
      a: "Ndiyo. Chagua ft² na uandike maeneo kwa futi za mraba. Kipimo ni lebo tu, na sehemu zinatoka zilezile mradi kila mtu atumie kipimo kimoja."
    - q: "Je, kikokotoo ni bure?"
      a: "Ndiyo. Bure. Hakuna matangazo. Hakuna vikomo vya kila siku. Huhitaji akaunti pia."
