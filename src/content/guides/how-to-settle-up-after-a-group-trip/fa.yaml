meta:
  title: "چطور بعد از یک سفر گروهی تسویه حساب کنیم | Side Badger"
  description: "پیش از پراکنده شدن همه تسویه کنید. ده بدهی درهم به چهار پرداخت می‌رسد، همان لحظه ثبت می‌شود و پرداخت بخشی هم اشکال ندارد. حساب‌وکتاب پنج دوست."
h1: "چطور بعد از یک سفر گروهی تسویه حساب کنیم"
navLabel: "تسویه بعد از سفر"
lead: "پیش از آنکه همه پراکنده شوند تسویه کنید. آخرین هزینه را اضافه کنید، مانده‌های گروه را باز کنید و آنچه را بدهکارید از فهرست کوتاه، هر طور دوست دارید، بپردازید. بعد هر پرداخت را در Side Badger ثبت کنید تا مانده برای کل گروه صاف شود. برای پنج دوست و پنج هزینه، ده بدهی درهم به چهار پرداخت می‌رسد."
cta:
  heading: "حساب‌ها را ببندید، پیش از آنکه عکس‌ها برسند"
  body: "یک حساب رایگان بسازید، برای سفر بعدی یک گروه شروع کنید و هر هزینه را همان لحظه که اتفاق می‌افتد اضافه کنید. تا به فرودگاه برسید فهرست کوتاه پرداخت‌ها منتظر شماست. می‌خواهید اول ببینید [تسویه حساب چطور کار می‌کند](page:feature/settle-up)؟"
sections:
  - heading: "پنج دوست، پنج هزینه، یک سالن انتظار پرواز"
    body: "مو، اینس، راف، تس و اوما یک هفته را کنار ساحل گذراندند. مو آپارتمان را رزرو کرد و خواربار را خرید، اینس پول قایق‌سواری را داد و راف شام بزرگ را حساب کرد. تس با اوما و مو تاکسی فرودگاه را گرفت، چون اینس و راف با قطار می‌رفتند. کارت اوما در خانه مانده بود، پس او برای هیچ‌چیز پول نداد. این پنج هزینه است و روی هم €1,700، و در سالن انتظار پرواز هیچ‌کس نمی‌توانست بگوید چه کسی جلوتر است."
  - heading: "ده بدهی، چهار پرداخت"
    body: "آپارتمان، قایق، شام و خواربار مساوی بین پنج نفر تقسیم می‌شود. یعنی هرکدام €200، €50، €60 و €18، پس اینس و راف هرکدام €328 بدهکارند. تاکسی بین سه نفر و هرکدام €20 تقسیم می‌شود، پس مو، تس و اوما €348 بدهکارند. مو €1,090 پرداخت کرده و €348 بدهکار است، که او را €742 طلبکار می‌کند. بقیه کمتر از آنچه بدهکارند پرداخته‌اند. اوما €348 کم دارد، تس €288، اینس €78 و راف €28، و این‌ها روی هم همان €742 مو می‌شود. اگر هر جفت آدم را مستقیم تسویه کنید، ده بدهی جدا به دست می‌آید. Side Badger به‌جایش چهار پرداخت پیشنهاد می‌دهد، همه به مو."
  - heading: "پیش از پراکنده شدن همه تسویه کنید"
    body: "بهترین لحظه آخرین شب یا مسیر برگشت است، وقتی هنوز همه یک‌جا هستند و حرف زدن از یک بدهی €28 آسان است. اول همه هزینه‌ها را اضافه کنید، با تاکسی. تا وقتی کسی بدهکار یا طلبکار است نمی‌تواند از گروه خارج شود، پس شمارش به هر حال باید یک جایی بسته شود."
    items:
      - "**فهرست را بررسی کنید.** گروه را باز کنید و به **موجودی‌ها** نگاه کنید. به‌طور پیش‌فرض بدهی‌هایی را می‌بینید که به شما مربوط است. **نمایش همه** را انتخاب کنید تا فهرست کل گروه را ببینید."
      - "**هر طور دوست دارید بپردازید.** انتقال بانکی، پول نقد، یا لطفی که از تعطیلات قبل مانده. Side Badger پول را جابه‌جا نمی‌کند."
      - "**ثبتش کنید.** **تسویه حساب** را انتخاب کنید. زیر **تسویه سریع** هر دکمه یکی از پرداخت‌های پیشنهادی شماست و با انتخاب یکی، مبلغ پر می‌شود. یک **یادداشت** مثل انتقال بانکی اضافه کنید، **تاریخ** را بررسی کنید (نمی‌تواند در آینده باشد) و **ثبت تسویه حساب** را انتخاب کنید."
      - "**ببینید صاف می‌شود.** مانده برای همه به‌روز می‌شود. وقتی آخرین پرداخت ثبت شد، **موجودی‌ها** می‌گوید **همه حساب‌ها تسویه شد!**"
  - heading: "الان بخشی، بقیه بعداً"
    body: "اوما می‌تواند امشب €200 بفرستد و بقیه را آخر ماه. او €200 را ثبت می‌کند و فرم هشدار می‌دهد که بعد از آن هنوز €148 به مو بدهکار خواهد بود، یعنی €348 منهای €200. ذخیره‌اش کنید و €148 روی مانده او می‌ماند تا بقیه را ثبت کند. هشدار در جهت دیگر هم کار می‌کند. اگر یک صفر اضافه €348 را €3,480 کند، فرم می‌گوید او فقط €348 به مو بدهکار است و ذخیره کردن بدهی‌ای در جهت مخالف می‌سازد. پیش از ذخیره صفر را درست کنید."
  - heading: "درست کردن اشتباه‌ها و جشن گرفتن پرداخت‌ها"
    items:
      - "**یک پرداخت اشتباه.** فقط کسی که پرداخت را ثبت کرده می‌تواند آن را ویرایش کند. او یا یک مدیر گروه می‌تواند حذفش کند و بعد می‌شود دوباره ثبتش کرد."
      - "**پرداختی که ارزش دیدن دارد.** هر پرداخت ثبت‌شده با تاریخ و یادداشتش زیر **تسویه‌ها** قرار می‌گیرد، جایی که همه اعضای گروه می‌توانند ببینند و واکنش نشان دهند. وقتی آخرین €148 اوما رسید، مو می‌تواند **جشن** را انتخاب کند."
      - "**پایان.** وقتی همه مانده‌ها صفر شد، یک مدیر می‌تواند گروه را قفل کند تا عددها سر جایشان بمانند."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "هرگز پول جابه‌جا نمی‌کند. لینک پرداخت یا درخواست پرداخت ندارد، پس پرداخت در برنامه ثبتِ پرداختی است که جای دیگری انجام شده."
      - "یادآوری نمی‌فرستد. پیگیری یک پرداخت دیرکرده هنوز با خود شماست."
      - "مهلت تعیین نمی‌کند. اینکه بقیه €148 اوما کی باید برسد را گروه توافق می‌کند."
      - "پرداخت‌های پیشنهادی یک فهرست کوتاه‌اند، نه تضمینی برای کوتاه‌ترین فهرست ممکن. برای هر ارز جداگانه محاسبه می‌شوند، پس سفری که با یورو و پوند پرداخت شده برای هرکدام یک فهرست می‌گیرد."
