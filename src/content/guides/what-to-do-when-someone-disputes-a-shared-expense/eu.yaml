faq:
  heading: "Galderak"
  items:
    - q: "Nire zatia bakarrik jar dezaket zalantzan?"
      a: "Ez. Galdera batek gastu osoa uzten du kanpoan, bertan dagoen guztiarentzat. Banaketa bakarrik badago gaizki, konponbidea banaketa editatzea da."
    - q: "Nork itxi dezake galdera bat?"
      a: "Galdera egin duenak, edo taldeko administratzaile batek. Gastua gehitu zuena administratzailea ez bada, ezin du galdera egin duenaren izenean itxi."
    - q: "Gastu bat editatzeak jatorrizkoa ezabatzen al du?"
      a: "Ez. Aurreko bertsioa gordetzen da. Nork edita dezakeen taldearen baimenek erabakitzen dute, beraz merezi du etxeari lehenik esatea, saldoak aldatzen direlako."
