featuresHeading: "Na gnéithe a úsáideann lánúin"
faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir linn 60/40 a shocrú uair amháin do gach rud?"
      a: "Ní féidir. Baineann an roinnt le gach costas. Socraigh na céatadáin ar an gcéad cheann, ansin cóipeáil é an chéad uair eile agus athraigh cad atá difriúil. Clúdaíonn [roinn costais](page:feature/split-expenses) na trí bhealach le roinnt."
    - q: "An nascann sé lenár mbanc?"
      a: "Ní nascann. Ní bhaineann Side Badger le d'airgead riamh. Íocann sibh a chéile mar is mian libh, ansin taifeadann sibh é, mar a mhíníonn [socraigh suas](page:feature/settle-up)."
    - q: "An bhfeiceann aon duine eile ár ngrúpa?"
      a: "Ní fheiceann ach a bhaill, agus tá beirt i ngrúpa lánúine. Is féidir le duine ar bith a úsáideann nasc cuiridh beo dul isteach, mar sin roinn é le duine amháin agus tabhair dáta éaga gearr dó."
    - q: "Cad má d'íoc gach duine againn cuid den bhille céanna?"
      a: "Tá íocóir amháin ag costas. Taifead dhá chostas, ceann do gach duine agaibh, agus tagann an t-iarmhéid amach mar an gcéanna."
    - q: "An meabhróidh sé do mo pháirtí íoc?"
      a: "Ní mheabhróidh. Níl aon mheabhrúcháin ann, mar sin is leatsa an priocadh fós. Ar a laghad beidh an bheirt agaibh ag féachaint ar an uimhir chéanna."
    - q: "Cad a tharlaíonn nuair a stopaimid ag roinnt costas?"
      a: "Socraigh an t-iarmhéid agus taifead an íocaíocht, ionas nach bhfuil aon rud dlite ag aon duine. Ansin is féidir le riarthóir an grúpa a ghlasáil, rud a choinníonn na huimhreacha mar atá, nó é a dhúnadh go buan, rud a fhágann nach féidir le haon duine é a rochtain. Ná dún é ach nuair nach bhfuil an stair de dhíth ar aon duine agaibh."
