meta:
  title: "Zer egiten duen eta zer ez duen egiten Side Badger-ek"
  description: "Banatzea, kitatzea eta moneta anitz, eta baita taldeak, zerrendak eta inkestak. Kit osoa, eta Side Badger-ek kanpoan uzten duenaren zerrenda zintzoa."
h1: Zer egiten duen Side Badger-ek
navLabel: Ezaugarriak
lead: Kutxan dagoen guztia, eta ez dagoena.
intro: Hona kit osoa. Kalkulu-orria nahita utzi dugu kanpoan. Aukeratu beheko ezaugarri bat bertsio luzerako, edo begiratu gainerako zerrenda eta Side Badger-ek egiten ez dituen gauzen zerrenda laburra.
cta:
  heading: Zure taldeak behar duena egiten al du?
  body: Sortu doako kontu bat eta probatu lehenengo talde txiki batekin.
cardsHeading: Ezaugarri guztiak, xehetasunetan
sections:
  - heading: Tiketen eskaneatzea
    body: Atera argazki bat tiketari eta Side Badger-ek guztizkoa, data eta lekua beteko ditu, zuk egiazta ditzazun. Tiketen irudiak Googleren adimen artifizialeko zerbitzuak irakurtzen ditu. [Tiketen eskaneatzeak nola funtzionatzen duen](page:feature/receipt-scanning).
  - heading: Taldeak eta baimenak
    body: Egin talde bat etxe, bidaia edo ekitaldi bakoitzerako, gehienez 50 pertsonarekin. Gonbidatu jendea esteka batekin edo QR kode batekin. Talde handiago batean, egin norbait ikusle, dena ikusten duena eta ezer aldatzen ez duena. Letra txikia [Taldeak eta baimenak](page:feature/groups-and-permissions) orrian dago.
  - heading: Zerrendak eta inkestak
    body: Eduki erosketa-zerrenda partekatua erosketa-fakturen ondoan. Jarri villaren aukera-zerrenda bozketara, anonimoki nahi baduzu. [Antolatu elkarrekin](page:feature/plan-together) orrian iruzkinak, galderak, zerrendak eta inkestak azaltzen dira.
  - heading: Gainerako guztia
    items:
      - "**Eguneraketak berehala:** gehitu gastu bat eta denek berehala ikusten dute."
      - "**Hizkuntzak:** erabili Side Badger 39 hizkuntzatan. Taldeko bakoitzak berea aukera dezake."
      - "**Hasierako pantaila:** ez da aplikazio-dendarik behar. Hasi saioa eta gero gehitu Side Badger zure hasierako pantailara, eta aplikazio bat bezala irekitzen da. Aplikazioko Ezarpenek erakusten dizute nola. [Web aplikazioari buruz gehiago](page:feature/web-app)."
      - "**Jakinarazpenak:** aktibatu push jakinarazpenak Ezarpenetan, eta jakinarazpen bat jasoko duzu zure taldeetan jarduera berria dagoenean. iPhone eta iPad gailuetan, gehitu lehenik Side Badger zure hasierako pantailara."
      - "**Iritzia:** akats bat aurkitu duzu? Esaiguzu aplikazioaren barrutik eta ikusi gure erantzuna hantxe."
  - heading: Side Badger-ek egiten ez duena
    items:
      - "**Dirua mugitu.** Side Badger-ek ez du inoiz zure dirua ukitzen. Ordaindu elkarri nahi duzuen moduan. Ordainketa-eskaerak planeatuta daude."
      - "**Faktura errepikariak.** Ez dago gastu errepikaririk. Kopiatu joan den hilabeteko faktura bi ukitutan."
      - "**Elementuka banatu.** Gastu bakoitzak ordaintzaile bakarra du. Banatu berdin, zenbateko zehatzen arabera edo ehunekoen arabera."
      - "**Aplikazio natiborik eman.** Zure nabigatzailean funtzionatzen du. Hasi saioa eta gero gehitu hasierako pantailara."
      - "**Konexiorik gabe funtzionatu.** Konexioa behar du."
      - "**Posta elektronikoz edo SMS bidez alertak bidali.** Jarduera berria aplikazioan agertzen da, baita push jakinarazpen gisa ere, aktibatzen badituzu."
      - "**Grafikoak edo aurrekontuak marraztu.** Nork nori zor dion kontatzen du, eta hori da trikimailu osoa."
      - "**Google edo Apple bidez saioa hasi.** Eman izena posta elektronikoarekin. Google eta Apple bidezko saio-hasiera planeatuta daude."
      - "**Kontu gabeko jendea sartzen utzi.** Taldeko guztiek doako kontu bat behar dute."
faq:
  heading: Galderak
  items:
    - q: Side Badger bidez ordain dezaket?
      a: Ez. Side Badger-ek kontua eramaten du eta ez du inoiz zure dirua ukitzen. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa.
    - q: Mugikorrerako aplikaziorik ba al dago?
      a: Aplikazio-denda batean ez. Side Badger zure nabigatzailean funtzionatzen du. Hasi saioa telefonoan eta gero gehitu hasierako pantailara aplikazio bat bezala ireki dadin. Aplikazioko Ezarpenek erakusten dizute nola.
    - q: Elementuka banatu dezaket?
      a: Ez. Gastu bakoitzak ordaintzaile bakarra du, eta berdin, zenbateko zehatzen arabera edo ehunekoen arabera banatzen duzu.
    - q: Konexiorik gabe funtzionatzen al du?
      a: Ez, konexioa behar du.
    - q: Taldeko guztiek behar dute kontu bat?
      a: Bai. Taldeko guztiek doako kontu bat behar dute, eta izena emateko posta elektroniko bat besterik ez duzu behar.
