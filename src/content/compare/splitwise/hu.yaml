sections:
  - heading: "Pénzbeszéd, a pénz mellett"
    body: "A közös pénzzel jár a csevegés, a kétely és a tervezgetés. A Side Badger mindhármat a számok mellett tartja, hogy senkinek ne kelljen visszagörgetnie a csoportchatben."
    items:
      - "**Hozzászólás ott, ahová való.** Szólj hozzá magához a csoporthoz, vagy bármelyik költséghez, listához vagy szavazáshoz, és a beszélgetés ott marad, ahol a téma."
      - "**Nyugták és fotók.** Tarts meg akár három nyugtát költségenként, a csoporthoz, listához vagy szavazáshoz írt hozzászólásokhoz pedig fotókat és PDF-eket is csatolhatsz."
      - "**Kérdések, nem veszekedések.** Egy admin bekapcsolhatja a kérdéseket, és utána bárki rákérdezhet egy költségre („Van egy kérdésem”). Amíg nincs tisztázva, kimarad az egyenlegekből."
      - "**Listák és szavazások.** A közös bevásárlólista a bevásárlásos számlák mellett lakik, a villa szűkített listájáról pedig szavazást tarthattok, akár névtelenül is."
      - "**Egy kis taps.** Reagálj költségekre, kifizetésekre és hozzászólásokra, és ünnepeld meg, ha megérkezik egy kifizetés."
  - heading: A csoportod, a te szabályaid
    body: "A Splitwise súgóközpontja szerint nem támogatja a csoportadminokat és a speciális jogosultságokat. A Side Badgerben vannak szerepek és jogosultságok, azoknak a csoportoknak, amelyeknek kell valaki, aki rendben tartja a számokat."
    items:
      - "**Adminisztrátorok, tagok és megfigyelők.** Tegyél valakit megfigyelővé: mindent lát, és semmit sem változtat."
      - "**Két sablon, vagy a saját jogosultságaid.** Indulj a Nyílt együttműködéssel vagy a Felügyelt csoporttal, vagy állítsd be magad az egyes jogosultságokat: ki szerkeszti és törli a költségeket, ki szerkeszti a listákat, ki hívhat meg, és ki engedhet be új embereket."
      - "**Jóváhagyás a csatlakozáshoz.** Kapcsold be a jóváhagyást, és egy adminisztrátor engedi be az embereket egyenként."
      - "**A csoport saját beállításai.** Korlátozd azokra a pénznemekre, amelyeket tényleg használtok, válaszd ki az alapértelmezett pénznemét, és adj neki fejlécképet."
      - "**Zárd le, ha vége.** A számok addig maradnak, ahogy vannak, amíg egy adminisztrátor fel nem oldja a lezárást."
  - heading: Itt ingyenes, ott fizetős
    body: A Splitwise Pro a Splitwise fizetős csomagja, és saját Pro-oldala három olyan dolgot árul, amely a Side Badgerben nem kerül semmibe.
    items:
      - "**Nyugtaszkennelés.** A Splitwise Pro beolvassa a nyugtád fotóját. A Side Badger ingyen csinálja, szkennelési kreditek nélkül: kitölti az összeget, a dátumot és a helyet, hogy ellenőrizhesd."
      - "**Pénznem-átszámítás.** A Splitwise Pro a csoport költségeit az alapértelmezett pénznemedre számítja át, amikor a „Convert” gombra koppintasz. A Side Badger minden költséget bevitelkor számít át, egy aktuális árfolyamon vagy azon, amelyet ténylegesen kaptál, és az eredeti összeg a költségnél marad."
      - "**Napi korlátok nélkül.** A Splitwise Pro korlátlan számú költséget árul, súgóközpontja szerint pedig az ingyenes felhasználók naponta legfeljebb 4 költséget adhatnak hozzá. A Side Badgerben nincsenek napi korlátok."
  - heading: A bankod kimarad belőle
    body: "A Side Badger nem kapcsolódik a bankodhoz, és nem kéri a bankos adataidat. Nyilvántartja, ki kinek tartozik; ti úgy fizettek egymásnak, ahogy akartok, aztán rögzítitek a kifizetést. Nincs bankos belépés, amit át kellene adni, így eggyel kevesebb dologra kell vigyázni."
  - heading: Egy alkalmazás, a böngésződben és a telefonodon
    body: "A Side Badger a böngésződben fut. Jelentkezz be, add hozzá a kezdőképernyődhöz, és úgy nyílik meg, mint egy alkalmazás. Mindkét helyen ugyanaz az alkalmazás, ezért egy új funkció a következő megnyitáskor már ott van a telefonodon, alkalmazásbolti frissítésre várás nélkül."
  - heading: "És pár partitrükk"
    items:
      - "**Kérdezd az asszisztensed.** A Side Badger működik a ChatGPT-vel és a Claude-dal: kérd meg a tiédet, hogy adjon hozzá egy költséget, olvasson be egy nyugtát vagy rögzítsen egy kifizetést."
      - "**Mindenki a saját nyelvén.** A Side Badger 39 nyelven beszél, és mindenki a sajátját választja. A Splitwise kezdőlapja 7+ nyelvet említ. 133 pénznemet is kezel, az olyan utazáshoz, ami mindenhová elvisz."
      - "**Segítség az alkalmazás elhagyása nélkül.** Elakadtál, vagy hibát találtál? Szólj az alkalmazásból, és a választ is rögtön ott olvasod."
  - heading: Ahol a Splitwise még mindig nyer
    body: Inkább azt szeretnénk, ha a megfelelő alkalmazást választanád, mint hogy később jönnél rá. Ha a csoportodnak ezek egyike kell, a Splitwise tudja, a Side Badger nem.
    items:
      - "**Alkalmazásboltos alkalmazások.** A Side Badger a böngésződben és a kezdőképernyődön él, nem az alkalmazásboltokban."
      - "**Offline mód.** A Side Badgernek kapcsolat kell."
      - "**Fizetés az alkalmazásban.** Egyes országokban a Splitwise a pénzt is el tudja mozgatni. A Side Badger csak a nyilvántartást vezeti."
      - "**Felosztás részek vagy tételek szerint.** A Side Badgerben költségenként egy fizető van, és egyenlően, pontos összegek szerint vagy százalékosan osztható fel. A nyugtaszkennelése nem rendel tételeket emberekhez."
      - "**Grafikonok és alapértelmezett felosztások.** A Splitwise Prónak mindkettő megvan. A Side Badger számon tartja, ki kinek tartozik, és ez az egész trükk."
  - heading: A csoportod átköltöztetése
    body: Nincs importáló eszköz, így az átköltözés újrakezdést jelent. Előbb számoljatok el a Splitwise-ban, aztán hozzatok létre egy csoportot a Side Badgerben, és hívjatok meg mindenkit linkkel vagy QR-kóddal. A csoport minden tagjának kell egy ingyenes fiók, a regisztrációhoz pedig elég egy e-mail-cím.
