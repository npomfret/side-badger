sections:
  - heading: Una sola valuta per tutto il gruppo
    body: Se il gruppo preferisce non pensarci, scegli una valuta del gruppo e il modulo converte ogni nuova spesa in quella, a un tasso che puoi comunque vedere e modificare. Vale solo per le spese nuove e copiate. Le modifiche e le spese esistenti restano come sono, così nulla di già registrato cambia sotto i tuoi occhi.
  - heading: Devi euro, paghi in sterline
    body: Hai pagato in yen e saldi in sterline? Va bene. Quando registri un pagamento puoi convertire anche quello, così chi deve euro può pagare in sterline e il saldo in euro torna comunque giusto. Pagatevi come vi fa più comodo, poi registratelo.
  - heading: Regole per il gruppo
    body: Limita un gruppo alle valute che usi davvero e imposta un valore predefinito perché il modulo si apra su quella giusta. Una vacanza in Portogallo non ha bisogno di altre 139 opzioni accanto al conto della cena, e un [matrimonio all'estero](page:use-case/events-and-celebrations) probabilmente ne richiede due.
limits:
  heading: Limiti
  items:
    - Il tasso viene fissato quando la spesa è salvata. Le vecchie spese non vengono mai rivalutate.
    - Side Badger recupera un tasso attuale dove può. Non è garantito per ogni coppia di valute, e puoi sempre scrivere tu il tasso.
    - La conversione automatica del gruppo vale solo per le spese nuove e copiate, non per le modifiche né per le spese esistenti.
    - Ogni spesa è limitata a 999.999,99 nella sua valuta.
    - Le valute sono 140. Criptovalute e metalli non ne fanno parte.
    - Side Badger registra i pagamenti. Non sposta né cambia mai denaro.
useCasesHeading: Dove aiuta
faq:
  heading: Domande
  items:
    - q: Quale tasso di cambio usate?
      a: Un tasso di cambio attuale, recuperato quando inserisci la spesa dove ce n'è uno disponibile. Puoi cambiarlo con quello che hai davvero ottenuto, e l'importo convertito si aggiorna.
    - q: Le vecchie spese vengono rivalutate?
      a: No. Il tasso viene fissato quando la spesa è salvata, quindi un saldo non va alla deriva perché è cambiato il mercato.
    - q: Supportate le criptovalute?
      a: No. Le valute sono 140 e le criptovalute non ne fanno parte.
    - q: Perché non posso inserire 2.000.000 di rupie indonesiane?
      a: Ogni spesa è limitata a 999.999,99 nella sua valuta. Inseriscila in un'altra valuta e converti, oppure dividila in due spese.
    - q: La conversione costa qualcosa?
      a: No. Convertire è gratuito, come il resto di Side Badger. Vedi i [prezzi](page:pricing).
    - q: Devo convertire?
      a: No. Le valute restano separate a meno che tu o il tuo gruppo scegliate di convertire, e ogni valuta ha la sua breve lista di pagamenti.
