meta:
  title: "Адміністрування групи та дозволи для спільних витрат | Side Badger"
  description: "Запрошуйте за посиланням чи QR-кодом, схвалюйте нових учасників, призначайте глядачів, задавайте дозволи й блокуйте групу, коли все закінчено. Ваша група, ваші правила."
h1: "Адміністрування групи та дозволи: ваші правила, але в розумних межах"
navLabel: "Групи та дозволи"
lead: "Деяким групам потрібен скарбник. У Side Badger для цього є налаштування. Запрошуйте людей за посиланням чи QR-кодом, вирішуйте, кого пускати, і обирайте, хто може змінювати цифри. Невелика компанія друзів може все це ігнорувати, бо нові групи починаються повністю відкритими."
cta:
  heading: Готові вести групу охайно?
  body: "Створіть обліковий запис, заведіть групу й надішліть посилання із запрошенням. Залиште все відкритим або посильте правила, коли група розрослася чи стала прискіпливішою."
problem:
  heading: Комусь треба тримати цифри в порядку
  body: "Четверо сусідів можуть триматися на довірі. Тридцять гостей на весільних вихідних, імовірно, ні. Заведіть групу для кожного будинку, подорожі чи події, до 50 людей у кожній, і в кожної групи будуть свої учасники, свої ролі та свої правила. Ваша панель показує всі групи разом із тим, як ви стоїте в кожній, на одному екрані. Більшість груп ніколи не торкається налаштувань. Ті, що торкаються, зазвичай мають когось достатньо організованого, щоб цього хотіти."
workflow:
  heading: Від порожньої групи до заблокованої
  steps:
    - title: Запрошуйте за посиланням чи QR-кодом
      body: "Відкрийте **Запросити інших**, оберіть, скільки діятиме посилання (15 хвилин, 1 годину, 1 день або 5 днів), потім скопіюйте посилання або покажіть QR-код, щоб люди його відсканували. Ви також можете запрошувати людей, з якими вже маєте іншу спільну групу, просто з застосунку."
      shot: S03
      shotAlt: "Діалог запрошення з посиланням на групу, його QR-кодом і вибором, скільки діятиме посилання"
    - title: Дайте їм глянути, перш ніж приєднатися
      body: "Кожен, хто має посилання, входить або створює обліковий запис, бачить попередній перегляд групи та обирає ім'я, під яким хоче в ній бути. Потім натискає **Приєднатися до групи**."
      shot: S04
      shotAlt: "Попередній перегляд групи, який бачить людина, що увійшла в обліковий запис, перш ніж приєднатися"
    - title: Схвалюйте, хто приєднується
      body: "Увімкніть схвалення, і люди, які скористалися посиланням, чекатимуть як очікувані учасники, доки адміністратор їх не впустить. Адміністратори знаходять їх у розділі **Очікуючі учасники** в **Безпека та дозволи** й обирають **Схвалити** або **Відхилити**. До того очікувана людина не бачить у групі нічого."
      shot: S14
      shotAlt: "Очікувані учасники, яких адміністратор має схвалити або відхилити"
    - title: Оберіть, хто що може змінювати
      body: "Виберіть **Відкрита співпраця** або **Керована група**, або задайте дозволи по одному. Потім надайте кожному роль: адміністратор, учасник або глядач. Лише адміністратори можуть змінювати дозволи та ролі."
      shot: S13
      shotAlt: "Вкладка безпеки в налаштуваннях групи з двома пресетами та власними дозволами"
    - title: Заблокуйте, коли все закінчено
      body: "Коли подорож скінчилася, а цифри зійшлися, адміністратор може ввімкнути **Заблокувати групу**. Ніхто не зможе додавати чи змінювати витрати, записувати платежі або редагувати списки й опитування, а банер про це скаже. Тихцем додати запізнілого таксі ніхто не зможе. Якщо воно таки з'явиться, адміністратор може розблокувати групу."
      shot: S15
      shotAlt: "Група з банером, що вона заблокована"
options:
  heading: Адміністратори, учасники та глядачі
  items:
    - title: Адміністратор
      body: "Керує групою. Адміністратори схвалюють нових учасників, змінюють ролі та дозволи, блокують і розблоковують групу та закривають її. Хто створює групу, починає як її адміністратор, і група ніколи не лишається без нього, бо останнього адміністратора не можна понизити."
    - title: Учасник
      body: "Бере участь. Що може учасник, залежить від дозволів групи. У групі з відкритою співпрацею це майже все. У керованій групі учасники можуть змінювати лише ті витрати й списки, які створили самі."
    - title: Глядач
      body: "Бачить усе й нічого не змінює. Глядач не може додавати чи редагувати витрати та списки, запрошувати людей, змінювати налаштування чи чіпати зображення заголовка. Зручно для того, хто хоче стежити за цифрами й обіцяє їх не чіпати."
sections:
  - heading: Відкрита, керована чи за вашими правилами
    body: "Нові групи починаються з **Відкрита співпраця**, де кожен може запрошувати людей, змінювати витрати й редагувати списки, а нові учасники приєднуються автоматично. **Керована група** потрібна, коли хтось має бути дорослим у кімнаті. Сім дозволів можна також задавати по одному, а коли змінюєте один вручну, група переходить на власні налаштування. Що б ви не обрали, лише адміністратори можуть змінювати самі дозволи, і кожна зміна з'являється в стрічці активності. Квартира [сусідів](page:use-case/housemates) може лишити все відкритим. Велика [подія чи свято](page:use-case/events-and-celebrations) часто потребує керованої групи, щоб хтось відповідав за те, хто приєднується. Усе це для вас нове? [Як це працює](page:how-it-works) проводить крізь увесь шлях від першої витрати до розрахунку."
    items:
      - "**Хто може редагувати витрати.** Відкрита співпраця: будь-який учасник. Керована група: творці й адміністратори."
      - "**Хто може видаляти витрати.** Відкрита співпраця: будь-який учасник. Керована група: творці й адміністратори."
      - "**Хто може редагувати списки.** Відкрита співпраця: будь-який учасник. Керована група: творці й адміністратори."
      - "**Хто може запрошувати учасників.** Відкрита співпраця: будь-який учасник. Керована група: лише адміністратори."
      - "**Схвалення нових учасників.** Відкрита співпраця: автоматично. Керована група: потрібне схвалення адміністратора."
      - "**Хто може змінювати налаштування.** Відкрита співпраця: будь-який учасник. Керована група: лише адміністратори."
      - "**Хто може змінювати зображення заголовка.** Відкрита співпраця: будь-який учасник. Керована група: лише адміністратори."
  - heading: Ваше ім'я, ваше фото, ваше зображення заголовка
    body: "У кожної групи свій список дійових осіб. Оберіть ім'я, яке бачать люди в кожній групі (від 2 до 50 символів, унікальне в межах групи), і яке з ваших фото профілю там носити. Будьте **Сем** у будинку й **Сем (має авто)** у подорожі. Той, кому дозволено змінювати налаштування, може перейменувати групу й відредагувати її опис. Зображення заголовка, JPEG, PNG, GIF або WebP до 10 МБ, має окремий дозвіл."
  - heading: Архівувати, заблокувати чи закрити
    body: "Три способи прибрати групу, від найлегшого до найсерйознішого."
    items:
      - "**Архівувати** ховає групу з вашої власної панелі, а не з чужих. Ви й далі можете її відкрити й користуватися як раніше, а **Розархівувати групу** повертає її."
      - "**Заблокувати** заморожує зміни, доки адміністратор не розблокує. Усі й далі можуть читати групу та її історію."
      - "**Закрити** є незворотним і для всіх. Це може зробити лише адміністратор, ввівши назву групи для підтвердження, і ніхто більше не зможе відкрити групу."
  - heading: Вихід із групи
    body: "Кожен може вийти, щойно розрахувався. Вийти не можна, поки ви винні чи вам винні гроші хоча б в одній валюті, поки з вами пов'язане відкрите запитання щодо витрати або якщо ви останній адміністратор чи єдиний учасник. [Запишіть платіж](page:feature/settle-up), розберіться із [запитанням щодо витрати](page:guide/what-to-do-when-someone-disputes-a-shared-expense) або зробіть адміністратором когось іншого, і йдіть. Щоб повернутися, знадобиться нове запрошення."
limits:
  heading: "У розумних межах: дрібний шрифт"
  items:
    - "У групі може бути до 50 людей."
    - "Лише адміністратори можуть змінювати дозволи та ролі. Останнього адміністратора не можна понизити."
    - "Якщо редагування витрат встановити як **Лише адміністратори**, то й додавати витрати зможуть тільки адміністратори."
    - "Блокування зупиняє зміни витрат, нові платежі, списки й опитування. Усі й далі можуть читати групу та її історію й реагувати на платежі."
    - "Закриття незворотне. У застосунку немає способу відкрити закриту групу знову."
    - "Створення нового посилання із запрошенням не скасовує старі. Кожне посилання діє до власного завершення, тож обирайте коротке, коли непокоїтеся, куди воно може потрапити."
    - "Запрошення в застосунку показують людей із ваших 10 останніх активних груп. Усім іншим потрібне посилання, а хто може запрошувати, залежить від дозволів групи."
    - "Для приєднання потрібен обліковий запис, а перш ніж щось додавати, люди мають підтвердити електронну пошту."
useCasesHeading: "Де трохи порядку не завадить"
faq:
  heading: Запитання
  items:
    - q: "Чи може глядач додавати витрати?"
      a: "Ні. Глядач бачить усе й нічого не змінює. Він не може додавати чи редагувати витрати та списки, запрошувати людей або змінювати налаштування."
    - q: "Чи може хтось вийти, поки винен гроші?"
      a: "Ні. Ніхто не може покинути групу, поки винен або йому винні гроші хоча б в одній валюті. Спершу розрахуйтеся, а тоді йдіть."
    - q: "Що буде, коли групу закрито?"
      a: "Ніхто не зможе відкрити її знову. Закрити групу може лише адміністратор, ввівши для підтвердження назву групи, і вона стає недоступною для всіх. Якщо потрібно лише зупинити зміни, заблокуйте її. Якщо просто прибрати зі своєї панелі, заархівуйте."
    - q: "Чи можна скасувати блокування?"
      a: "Так. Адміністратор може розблокувати групу, і зміни знову працюватимуть."
    - q: "Чи треба схвалювати людей, перш ніж вони приєднаються?"
      a: "Лише якщо хочете. Нові групи починаються з відкритої співпраці, де люди, які скористалися посиланням, приєднуються автоматично. Увімкніть схвалення адміністратором або оберіть керовану групу, і кожен чекатиме, доки адміністратор його впустить."
    - q: "Скільки людей може бути в групі?"
      a: "До 50."
