meta:
  title: "Допомога та підтримка | Side Badger"
  description: "Забули пароль, посилання не працює, платіж записано хибно? Короткі відповіді на те, де люди застрягають у Side Badger, і як із нами зв'язатися."
h1: "Допомога й підтримка, без музики в слухавці"
navLabel: "Допомога та підтримка"
lead: "Короткі відповіді на те, де люди застрягають, від забутого пароля до остаточного закриття групи. Кожна веде на сторінку, що пояснює більше. Не знайшли своєї? Напишіть нам із застосунку або надішліть листа."
cta:
  heading: "Прийшли по допомогу, залишаєтеся ділити?"
  body: "Ще немає облікового запису? Заведіть групу, поділіться посиланням і додайте першу витрату. Безкоштовно, без реклами й без денних обмежень."
groups:
  - heading: "Вхід"
    items:
      - q: "Забули пароль?"
        a: "Це трапляється навіть найкращим борсукам. Оберіть **Забули пароль?** на екрані **Увійти**, введіть електронну пошту облікового запису, а тоді перейдіть за посиланням у листі, який ми надішлемо, щоб обрати новий. Про те, що ще потрібно для облікового запису, читайте в [як це працює](page:how-it-works)."
      - q: "Я зареєструвався(лась), але не можу нічого додати. Чому?"
        a: "Найчастіше електронну пошту ще не підтверджено, тож відкрийте посилання з листа підтвердження або оберіть **Повторно надіслати лист підтвердження** на банері-нагадуванні, щоб отримати свіжий. Якщо пошту підтверджено, група може бути заблокована або її дозволи не дають вам цього робити, а глядач бачить усе й нічого не змінює, як пояснюють [групи та дозволи](page:feature/groups-and-permissions)."
      - q: "Як змінити електронну пошту чи пароль?"
        a: "У **Налаштуваннях** оберіть **Змінити електронну пошту** або **Змінити пароль**. В обох випадках спершу потрібен поточний пароль, а нову адресу електронної пошти треба підтвердити за посиланням, яке ми на неї надішлемо. Про облікові записи читайте в [як це працює](page:how-it-works)."
      - q: "Чи можна увійти через Google або Apple?"
        a: "Ні. Потрібні лише адреса електронної пошти й пароль щонайменше з 12 символів, а на власному телефоні чи комп'ютері можна поставити позначку **Запам'ятати мене**. Решту про початок роботи розповідає сторінка про [вебзастосунок](page:feature/web-app)."
  - heading: "Приєднання до групи"
    items:
      - q: "Мені надіслали посилання із запрошенням. Як приєднатися?"
        a: "Відкрийте його, а тоді увійдіть або створіть безкоштовний обліковий запис. Ви побачите попередній перегляд групи, оберете ім'я, під яким вас там бачитимуть, і натиснете **Приєднатися до групи**. Весь шлях показують [групи та дозволи](page:feature/groups-and-permissions)."
      - q: "Пише «Очікує на схвалення». Я щось зробив(ла) не так?"
        a: "Зовсім ні. У цій групі кожного впускає адміністратор, тож ваш запит надіслано її адміністраторам, і ви не бачите нічого всередині, доки один із них його не схвалить. Дружнє нагадування особисто дозволене, а схвалення пояснюють [групи та дозволи](page:feature/groups-and-permissions)."
      - q: "Пише, що посилання недійсне або термін його дії минув."
        a: "Посилання із запрошенням діють стільки, скільки обрав той, хто їх створив, від 15 хвилин до 5 днів. Попросіть когось із групи надіслати нове посилання або QR-код, якщо ви в одній кімнаті. Про запрошення читайте в [як це працює](page:how-it-works)."
  - heading: "Витрати"
    items:
      - q: "Як додати витрату?"
        a: "Відкрийте групу й оберіть **Додати витрату**. Вкажіть, що це було, скільки, хто заплатив і хто поділив, а тоді розділіть порівну, за точними сумами або у відсотках. Усі варіанти розбирає [розподіл витрат](page:feature/split-expenses)."
      - q: "Чи може оренда повторюватися щомісяця?"
        a: "Сама собою ні, бо регулярних витрат немає. Відкрийте минуломісячну й оберіть **Копіювати витрату**, і форма з'явиться заповненою, готовою до нової дати та всього, що змінилося. Більше про копіювання в [розподілі витрат](page:feature/split-expenses)."
      - q: "Я ввів(ла) неправильну суму. Чи можна виправити?"
        a: "Так. Відредагуйте витрату, якщо дозволи групи вам це дають і група не заблокована. Попередню версію зберігають, тож нікому не доводиться вірити вам на слово, що змінилося, як пояснює [розподіл витрат](page:feature/split-expenses)."
      - q: "Витрата виглядає неправильно, і вона не моя. Що робити?"
        a: "Оберіть на ній **Маю запитання** і поясніть чому, і вся витрата лишатиметься поза балансами всіх, доки той, хто запитав, або адміністратор не закриє запитання. Немає такої кнопки? Запитати можуть лише люди, включені до витрати, адміністратор має спершу ввімкнути **Дозволити запитання щодо витрат** у налаштуваннях групи, а дипломатії навчає [посібник про спірну витрату](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Платежі"
    items:
      - q: "Чи надсилає Side Badger гроші?"
        a: "Ні, Side Badger ніколи не переказує гроші. Платіть одне одному як зручно, банківським переказом, готівкою чи будь-як, а тоді запишіть платіж, щоб баланси наздогнали. [Як розрахуватися після групової поїздки](page:guide/how-to-settle-up-after-a-group-trip) проводить крізь це від початку до кінця."
      - q: "Як записати платіж?"
        a: "Оберіть **Розрахуватися** в групі, вкажіть, хто заплатив і хто отримав, введіть суму або дайте кнопці **Швидкий розрахунок** підставити її, і оберіть **Записати розрахунок**. Заплатили лише частину? Запишіть, що заплачено, і решта лишиться на балансі, як пояснює [розрахунок](page:feature/settle-up)."
      - q: "Я неправильно записав(ла) платіж. Чи можна виправити?"
        a: "Той, хто його записав, може відредагувати його в **Історії платежів** групи, а він або адміністратор може його видалити, що прибирає платіж із балансів. Платіж, у якому бере участь той, хто вже покинув групу, редагувати не можна. Історію охоплює [розрахунок](page:feature/settle-up)."
  - heading: "Сповіщення та головний екран"
    items:
      - q: "Як увімкнути сповіщення?"
        a: "Увімкніть **Push-сповіщення** в **Налаштуваннях** і дозвольте їх, коли браузер запитає. Якщо браузер їх уже заблокував, спершу дозвольте їх у його власних налаштуваннях. Кожен пристрій вмикається окремо, а доставка не гарантована, тож сприймайте сповіщення як штурханець, а не як обіцянку, як пояснює сторінка про [вебзастосунок](page:feature/web-app)."
      - q: "Чому сповіщення не працюють на моєму iPhone?"
        a: "На iPhone чи iPad вони працюють лише в застосунку, доданому на головний екран, і ніколи у вкладці браузера. Додайте його, відкрийте з іконки на головному екрані, а тоді увімкніть їх у **Налаштуваннях**. Про що вони повідомляють, показує [плануйте разом](page:feature/plan-together)."
      - q: "Чи є застосунок для завантаження?"
        a: "Не з магазину застосунків, бо Side Badger працює у вашому браузері. Увійдіть, а потім скористайтеся пунктом **Додати на головний екран або в Dock** у **Налаштуваннях**, і він відкриватиметься як застосунок, у власному вікні. Кроки для кожного пристрою є на сторінці про [вебзастосунок](page:feature/web-app)."
  - heading: "Вихід, архівування, блокування й закриття"
    items:
      - q: "Як покинути групу?"
        a: "Розрахуйтеся, а тоді оберіть **Покинути групу**. Не вийде, поки ви винні або вам винні гроші бодай в одній валюті, поки в витраті, до якої ви залучені, є відкрите запитання, або якщо ви останній адміністратор чи єдиний учасник, а щоб повернутися, потрібне нове запрошення. Подробиці в [групах та дозволах](page:feature/groups-and-permissions)."
      - q: "Як прибрати стару групу з панелі?"
        a: "Оберіть **Архівувати групу**. Вона зникне з вашої панелі й не зникне ні в кого іншого, ви й надалі можете її відкривати й користуватися нею, а **Розархівувати групу** її повертає. Архівування, блокування й закриття порівнюють [групи та дозволи](page:feature/groups-and-permissions)."
      - q: "Поїздка скінчилася. Чи можна зупинити зміну цифр?"
        a: "Так. Адміністратор може ввімкнути **Заблокувати групу** в налаштуваннях групи, і ніхто не зможе додавати чи редагувати витрати, записувати нові платежі або змінювати списки й опитування, доки адміністратор не розблокує. Усі й надалі можуть читати групу та її історію, і жодне запізнене таксі не прослизне, як пояснюють [групи та дозволи](page:feature/groups-and-permissions)."
      - q: "Чи можна видалити групу?"
        a: "Адміністратор може закрити її через **Закрити групу**, ввівши назву групи для підтвердження. Закриття остаточне й робить групу недоступною для всіх, тож якщо ви просто хочете прибрати її з очей, краще заархівуйте. Дрібний шрифт у [групах та дозволах](page:feature/groups-and-permissions)."
contact:
  heading: "Все ще застрягли?"
  items:
    - q: "Знайшли помилку чи хочете щось змінити?"
      a: "Напишіть нам із застосунку. Оберіть **Відгук** у меню облікового запису, потім **Надіслати відгук** і виберіть **Повідомити про проблему**, **Запит допомоги** або **Запит на функцію**. Додайте знімок екрана, якщо він допоможе, а коли ми відповімо, ви знайдете відповідь у тій самій розмові."
    - q: "Вам краще написати листом?"
      a: "Пишіть на адресу нижче. Вкажіть, про яку групу йдеться, що ви зробили і чого очікували. Випустити пару не гріх; паролі не годяться, тож свого ніколи не надсилайте."
  emailLabel: "Напишіть нам на"
  email: support@sidebadger.me
