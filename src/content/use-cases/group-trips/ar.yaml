featuresHeading: "ما تعتمد عليه الرحلة"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يمكن استبعاد من تخطّى العشاء؟"
      a: "نعم. اختر من شارك في كل مصروف، ولا يُحاسَب عليه إلا هم."
    - q: "هل يعمل دون إشارة؟"
      a: "لا. يحتاج Side Badger إلى اتصال، فأضف التكاليف حين تعود إلى شبكة واي فاي."
    - q: "هل يحتاج الجميع إلى تثبيت شيء؟"
      a: "لا. يعمل في المتصفح. أرسل رابط الدعوة وينضم الناس من هواتفهم."
    - q: "أي سعر صرف يستخدم؟"
      a: "سعر صرف حالي عند إدخال المصروف، أو سعرك أنت إن حصلت على سعر مختلف. ويُثبَّت السعر عند حفظ المصروف، فلا يُعاد تقييم المصروفات القديمة أبداً."
    - q: "هل نستطيع تجميد المجموعة بعد الرحلة؟"
      a: "نعم. يستطيع المشرف إقفال المجموعة ليبقى كل رقم في مكانه."
    - q: "هل هناك حد للمبالغ؟"
      a: "نعم. 999,999.99 لكل مصروف، بعملته الخاصة."
