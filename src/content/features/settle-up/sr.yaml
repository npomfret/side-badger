sections:
  - heading: "Забележи уплату"
    body: "Кад неко плати, забележи то уз праву особу. Дугмад за брзо поравнање попуњавају износ из твојих предложених уплата, а можеш додати напомену, на пример „банковни трансфер“ (до 500 знакова). Ако платиш само део онога што дугујеш, остатак остаје на стању. Ако унесеш премало или превише, Side Badger те упозори пре чувања. Бележење уплате захтева дозволу за измену трошкова, а датум не сме бити у будућности."
  - heading: "Плаћено у другој валути?"
    body: "Стања остају у валути у којој је плаћено, па дуг у еврима остаје дуг у еврима. Дугујеш евре, а плаћаш у фунтама? Претвори уплату при уносу, по актуелном курсу или по курсу који је важио при размени. Курс се утврђује кад се уплата сачува. [Више валута](page:feature/multiple-currencies) објашњава како ради претварање, а [групна путовања](page:use-case/group-trips) показују га у употреби."
  - heading: "Историја коју можеш проверити"
    body: "Свака забележена уплата остаје у историји групе са датумом, износом и напоменом. Уплату може изменити само особа која ју је забележила, а обрисати је може она или администратор групе. Уплата у којој учествује неко ко је напустио групу је закључана. За пример са цимерима погледај [цимере](page:use-case/housemates)."
limits:
  heading: "Шта Side Badger не ради"
  items:
    - "Side Badger не премешта новац, не шаље везе за плаћање ни захтеве за уплату. Уплата у апликацији је запис уплате извршене негде другде."
    - "Предложене уплате долазе из једноставне методе упаривања, примењене посебно за сваку валуту. Увек предлаже мање уплата него што има особа са стањем у тој валути (за четири особе највише три), али не налази увек најмањи могући број."
    - "Предлоге не можеш искључити. **Прикажи све** исписује сваку предложену уплату у групи, не само твоје."
    - "Валуте се никад не пребијају једна са другом, осим ако су трошкови претворени при уносу."
    - "Нема подсетника, па је потерање уплате и даље на теби."
useCasesHeading: "Где је поравнање важно"
faq:
  heading: "Питања"
  items:
    - q: "Да ли Side Badger шаље новац?"
      a: "Не. Платите једни другима како год желите, а затим забележи уплату у Side Badger-у да се стање ажурира."
    - q: "Могу ли да искључим предложене уплате?"
      a: "Не. Поједностављење остаје укључено, а **Прикажи све** исписује сваку предложену уплату у групи, не само оне које се тичу тебе."
    - q: "Зашто су евра и фунте одвојени?"
      a: "Стања остају у валути у којој си платио осим ако претвориш при уносу трошка или уплате. Дугови у различитим валутама никад се не пребијају један са другим."
    - q: "Шта ако неко плати само део онога што дугује?"
      a: "Забележи плаћени део. Остатак остаје на стању док се не плати."
    - q: "Да ли је то увек најмањи могући број уплата?"
      a: "Није загарантовано. Увек предлаже мање уплата него што има особа са стањем у тој валути, па за четири особе никад више од три. У примеру са цимерима то су две уплате, где је директно враћање свакој особи захтевало шест."
