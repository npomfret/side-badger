meta:
  title: "कई करेंसी में चुकाई गई ट्रिप का खर्च कैसे बांटें | Side Badger"
  description: "होटल के पाउंड, रेमन के येन। हर करेंसी का हिसाब अलग चुकाएं या ऐसे रेट पर बदलें जिसे आप देख सकें। दोनों तरीके हल करके, पूरी गिनती के साथ।"
h1: "कई करेंसी में चुकाई गई ट्रिप का खर्च कैसे बांटें"
navLabel: "कई करेंसी वाली ट्रिप"
lead: "हर खर्च उसी करेंसी में डालें जिसमें आपने पेमेंट किया, फिर एक रास्ता चुनें। करेंसी अलग रखें और हर एक का हिसाब उसी के पैसे में चुकाएं, या मौजूदा एक्सचेंज रेट पर बदलें और एक ही बार में हिसाब चुकता करें। जापान की वही ट्रिप पहले तरीके से चार पेमेंट में निपटती है और दूसरे से दो में।"
cta:
  heading: "जिस पैसे में दिया, उसी में डालें"
  body: "मुफ्त अकाउंट बनाएं, ट्रिप के लिए ग्रुप शुरू करें और हर खर्च उस करेंसी में जोड़ें जो रसीद पर थी। पहले ब्योरा देखना है? [कई करेंसी](page:feature/multiple-currencies) या [मुफ्त में क्या-क्या मिलता है](page:pricing) देखें।"
sections:
  - heading: "तीन दोस्त, एक होटल, ढेर सारे येन"
    body: "Zoe, Kenji और Lucy [ग्रुप ट्रिप](page:use-case/group-trips) पर जापान में एक हफ्ता बिताते हैं, और हर खर्च तीनों में बराबर बंटता है। Zoe ने होटल घर से, पाउंड में, £600 का बुक किया। Lucy ने टोक्यो में रेल पास ¥90,000 के खरीदे। Kenji ने रेमन नाइट के ¥9,000 चुकाए, और तब से रोज़ उसका ज़िक्र करता रहा है। स्टेशन के प्लेटफॉर्म पर खड़े होकर तीन रसीदें बदलना कोई नहीं चाहता। इस गाइड के हिसाब में ¥1 बराबर £0.005 है, एक गोल रेट जो सिर्फ इसी गाइड के लिए गढ़ा गया है। ऐप में आप मौजूदा एक्सचेंज रेट इस्तेमाल करेंगे, या वह रेट डालेंगे जो आपको सच में मिला।"
  - heading: "हर खर्च उसी पैसे में डालें जो रसीद पर है"
    body: "यह हिस्सा आप जो भी तरीका चुनें, एक-सा है। अभी कुछ बदलने की ज़रूरत नहीं।"
    items:
      - "**ग्रुप बनाएं।** डैशबोर्ड पर **समूह बनाएं** चुनें, उसे ट्रिप का नाम दें, फिर **दूसरों को आमंत्रित करें** चुनें और लिंक या QR कोड भेज दें।"
      - "**होटल जोड़ें।** **व्यय जोड़ें** चुनें और 600 डालें, राशि के पास करेंसी के तौर पर पाउंड रखें। **किसने भुगतान किया?** में Zoe को चुनें। **विभाजित करें** में तीनों को रहने दें, **विभाजन कैसे करें** को **समान रूप से** पर छोड़ दें और **व्यय सहेजें** चुनें।"
      - "**येन जोड़ें।** रेल पास (Lucy ने दिए) और रेमन (Kenji ने दिए) के लिए भी यही करें, करेंसी येन रखकर। येन में दशमलव नहीं होते, इसलिए फॉर्म उन्हें पूछता ही नहीं।"
  - heading: "पहला तरीका: करेंसी अलग रखें"
    body: "Side Badger हर करेंसी का अपना बैलेंस रखता है और एक को दूसरे से नहीं काटता। पाउंड में होटल £200 प्रति व्यक्ति है, इसलिए Kenji और Lucy, दोनों को Zoe को £200 देने हैं। येन में रेल पास और रेमन मिलाकर ¥99,000 बनते हैं, यानी ¥33,000 प्रति व्यक्ति। Lucy ने ¥90,000 दिए और उसे ¥57,000 मिलने हैं। Zoe ने कोई येन नहीं दिया और उसे ¥33,000 देने हैं। Kenji ने ¥9,000 दिए, इसलिए उसे ¥24,000 देने हैं।"
    items:
      - "**पाउंड।** Kenji, Zoe को £200 देता है और Lucy, Zoe को £200 देती है।"
      - "**येन।** Zoe, Lucy को ¥33,000 देती है और Kenji, Lucy को ¥24,000 देता है।"
      - "**कुल चार पेमेंट।** Zoe और Lucy दो करेंसी में एक-दूसरे के देनदार हैं, और ये आपस में कटती नहीं। इसमें कोई रेट आता ही नहीं, इसलिए बहस की कोई गुंजाइश नहीं।"
      - "**येन देने हैं, पेमेंट पाउंड में।** जिसके पास येन नहीं हैं, वह फिर भी पाउंड में पेमेंट कर सकता है। पेमेंट रिकॉर्ड करते समय **अलग मुद्रा?** खोलें, **में परिवर्तित करें** में पाउंड चुनें और रेट जांच लें। इस गाइड के रेट पर Zoe के ¥33,000 £165 होते हैं, और येन का बैलेंस फिर भी सही निकलता है।"
      - "**हर पेमेंट रिकॉर्ड करें।** एक-दूसरे को जैसे चाहें पेमेंट करें, फिर **हिसाब बराबर करें** चुनें और **भुगतान रिकॉर्ड करें** इस्तेमाल करें। [हिसाब चुकता करना](page:feature/settle-up) में इस पर और जानकारी है।"
  - heading: "दूसरा तरीका: साथ-साथ बदलते चलें"
    body: "अगर ग्रुप हर किसी के लिए एक ही संख्या देखना चाहे, तो खर्च डालते समय ही बदल दें।"
    items:
      - "**फॉर्म पर बदलें।** **व्यय जोड़ें** पर **में परिवर्तित करें** चुनें और पाउंड रखें। Side Badger रेट और बदली हुई राशि दिखाता है, जिस पर ≈ का निशान होता है। अगर आपको कोई और रेट मिला हो तो रेट बदल दें। येन की मूल राशि खर्च पर बनी रहती है।"
      - "**पाउंड में पढ़ें।** ¥1 = £0.005 पर रेल पास £450 और रेमन £45 बनते हैं। £600 के होटल के साथ यह £600 + £450 + £45 = £1,095 हुआ, यानी £365 प्रति व्यक्ति। Zoe ने £600 दिए, इसलिए उसे £235 मिलने हैं। Lucy ने £450 दिए और उसे £85 मिलने हैं। Kenji ने £45 दिए और उसे £320 देने हैं।"
      - "**दो पेमेंट।** दोनों Kenji की तरफ से: Zoe को £235 और Lucy को £85। Zoe और Lucy अब एक-दूसरे को कुछ नहीं देतीं।"
      - "**या ग्रुप की करेंसी तय करें।** यह अतिरिक्त कदम छोड़ना हो तो ग्रुप की **सेटिंग्स** खोलें, **मुद्रा सेटिंग्स** में जाएं और **खर्चों को स्वचालित रूप से परिवर्तित करें** चुनें। फिर हर नया खर्च उसी करेंसी में बदल जाता है, और रेट तब भी ऐसा रहता है जिसे आप देख और बदल सकते हैं।"
  - heading: "कौन-सा तरीका चुनें?"
    items:
      - "**अलग रखें** जब लोगों के पास अब भी येन बचे हों, या जब आप रेट पर बहस नहीं करना चाहते। कीमत यह है कि पेमेंट ज़्यादा होंगे, और एक से ज़्यादा करेंसी में।"
      - "**बदलें** जब ग्रुप एक ही करेंसी में रहता हो और हर किसी के लिए एक संख्या और छोटी सूची चाहता हो, जैसे Kenji के दो ट्रांसफर। कीमत यह है कि ग्रुप को एक रेट पर भरोसा करना पड़ता है, और रेट हर खर्च पर तभी तय हो जाता है जब वह सेव होता है।"
      - "**जल्दी तय करें।** ग्रुप की करेंसी सिर्फ नए और कॉपी किए गए खर्चों को बदलती है। जो आप पहले डाल चुके हैं, उसे वह लौटकर ठीक नहीं करेगी।"
  - heading: "रेट, और सीमा"
    items:
      - "**रेट सेव होते ही तय हो जाता है।** पुराने खर्चों का मूल्य कभी दोबारा नहीं आंका जाता, इसलिए बाज़ार हिला तो बैलेंस नहीं खिसकता। अलग-अलग दिन डाले गए खर्चों पर अलग रेट हो सकते हैं, इसलिए अगर ग्रुप पूरी ट्रिप के लिए एक रेट चाहता है, तो उसे तय करें और हर बार वही डालें।"
      - "**रेट नहीं मिला? खुद डालें।** Side Badger जहां हो सके वहां मौजूदा एक्सचेंज रेट लाता है, पर हर जोड़ी के लिए रेट की गारंटी नहीं है। अगर कोई रेट नहीं मिला, या कैश डेस्क ने बेहतर भाव दिया, तो अपना रेट डालें।"
      - "**हर खर्च पर 999,999.99, उसकी अपनी करेंसी में।** करेंसी कोई भी हो, सीमा एक ही है। येन में यह ¥1,000,000 से ज़रा कम है, यानी इस गाइड के रेट पर करीब £5,000। इंडोनेशियाई रुपिया जैसी बड़ी संख्याओं वाली करेंसी में एक बिल जल्दी इस तक पहुंच सकता है। बिल को दो खर्चों में बांट दें, या उसे किसी दूसरी करेंसी में डालकर बदल दें।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह पैसे कभी नहीं भेजता और न बदलता है। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं, फिर उसे रिकॉर्ड करते हैं।"
      - "इसमें 140 करेंसी हैं। क्रिप्टोकरेंसी और धातुएं उनमें नहीं हैं।"
