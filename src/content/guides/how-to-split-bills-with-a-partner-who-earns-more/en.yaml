          jon: 38
    - label: the takeaway
      payer: jon
      amount: 36
      split:
        method: equal
faq:
  heading: Questions
  items:
    - q: Should we use gross or take-home pay?
      a: The group decides. Take-home is common, because it is the money you actually have to spend. Gross pay ignores the fact that tax, pension contributions and loan repayments take different amounts out of different wages. Whichever you pick, use the same measure for both of you.
    - q: Does Side Badger see our incomes?
      a: No. You enter percentages only, never wages. The percentages are visible to the members of the group, and for a couple that is the two of you.
    - q: Can we set 62/38 once for everything?
      a: The split is set per expense, not per group. Copy an expense that already has 62 and 38, then change what differs. [Split expenses](page:feature/split-expenses) covers the other options.
