sections:
  - heading: Para muhabbeti, paranın yanında
    body: Ortak paranın yanında sohbet, kuşku ve planlar da gelir. Side Badger üçünü de rakamların yanında tutar, kimsenin sohbette geriye kaydırmasına gerek kalmaz.
    items:
      - "**Yorumlar olmaları gereken yerde.** Grubun kendisine ya da herhangi bir harcamaya, listeye veya ankete yorum yapın; sohbet konuşulan şeyin yanında kalsın."
      - "**Makbuzlar ve fotoğraflar.** Her harcamada üç makbuza kadar saklayın, grubun, bir listenin ya da bir anketin yorumlarına fotoğraf veya PDF ekleyin."
      - "**Kavga değil, soru.** Bir yönetici soruları açabilir, sonra bir harcamadaki herkes onu sorabilir. Çözülene kadar bakiyelerin dışında kalır."
      - "**Listeler ve anketler.** Ortak alışveriş listesini alışveriş harcamalarının yanında tutun, villa kısa listesini oylayın, isterseniz anonim."
      - "**Biraz alkış.** Harcamalara, ödemelere ve yorumlara tepki verin, bir ödeme gelince kutlayın."
  - heading: Grubunuz, kurallarınız
    body: Splitwise'ın yardım merkezi grup yöneticilerini ya da özel izinleri desteklemediğini söylüyor. Side Badger'da roller ve izinler var; rakamları derli toplu tutacak birine ihtiyacı olan gruplar için.
    items:
      - "**Yöneticiler, üyeler ve izleyiciler.** Birini izleyici yapın: her şeyi görür, hiçbir şeyi değiştirmez."
      - "**İki şablon ya da kendi ayarlarınız.** Açık ya da Yönetilen ile başlayın, ya da her izni kendiniz ayarlayın: harcamaları kimin düzenleyip sileceği, listeleri kimin düzenleyeceği, kimin davet edeceği ve yeni kişileri kimin içeri alacağı."
      - "**Katılmak için onay.** Onayı açın, her kişiyi bir yönetici içeri alsın."
      - "**Grubun kendi ayarları.** Gerçekten kullandığınız para birimleriyle sınırlayın, varsayılan para birimini seçin ve bir kapak görseli verin."
      - "**Bitince kilitleyin.** Bir yönetici kilidini açana kadar rakamlar yerinde durur."
  - heading: Burada ücretsiz, orada ücretli
    body: Splitwise Pro, Splitwise'ın ücretli planıdır ve kendi Pro sayfası, Side Badger'da hiçbir şeye mal olmayan üç şeyi satar.
    items:
      - "**Makbuz tarama.** Splitwise Pro makbuzunuzun fotoğrafını tarar. Side Badger bunu ücretsiz yapar, tarama kredisi olmadan: toplamı, tarihi ve yeri sizin kontrol etmeniz için doldurur."
      - "**Para birimi çevirme.** Splitwise Pro, Convert'e dokunduğunuzda bir grubun harcamalarını varsayılan para biriminize çevirir. Side Badger her harcamayı girerken, güncel bir döviz kuruyla ya da gerçekten aldığınız kurla çevirir ve özgün tutar harcamada kalır."
      - "**Günlük sınır yok.** Splitwise Pro sınırsız harcama satar ve yardım merkezi, ücretsiz kullanıcıların günde en çok 4 harcama ekleyebileceğini söyler. Side Badger'ın günlük sınırı yok."
  - heading: Bankanız işin dışında
    body: Side Badger bankanıza bağlanmaz ve sizden banka bilgisi istemez. Kimin kime borçlu olduğunun kaydını tutar; birbirinize istediğiniz yolla ödersiniz, sonra ödemeyi kaydedersiniz. Teslim edeceğiniz bir banka girişi bilgisi yok, yani korunacak bir şey eksik.
  - heading: Tek uygulama, tarayıcıda ve telefonda
    body: Side Badger tarayıcınızda çalışır. Giriş yapın, ana ekrana ekleyin, uygulama gibi açılır. İki yerde de aynı uygulama, yani yeni bir özellik uygulamayı bir sonraki açışınızda telefonunuzda olur; uygulama mağazası güncellemesini beklemenize gerek yok.
  - heading: Bir de birkaç numara
    items:
      - "**Asistanınıza sorun.** Side Badger ChatGPT ve Claude ile çalışır: asistanınızdan harcama eklemesini, makbuz taramasını ya da ödeme kaydetmesini isteyin."
      - "**Herkes kendi dilinde.** Side Badger 39 dil konuşur ve herkes kendi dilini seçer. Splitwise'ın ana sayfası 7+ diyor. 133 para birimini de destekler, her yere uzanan geziler için."
      - "**Uygulamadan çıkmadan yardım.** Takıldınız mı, ya da bir hata mı buldunuz? Uygulamadan bize yazın, yanıtımızı da hemen orada okuyun."
  - heading: Splitwise'ın hâlâ önde olduğu yerler
    body: Doğru uygulamayı seçmenizi, sonradan öğrenmenize tercih ederiz. Grubunuzun bunlardan birine ihtiyacı varsa, Splitwise'da var, Side Badger'da yok.
    items:
      - "**Uygulama mağazası uygulamaları.** Side Badger tarayıcınızda ve ana ekranınızda yaşar, uygulama mağazalarında değil."
      - "**Çevrimdışı mod.** Side Badger bağlantı gerektirir."
      - "**Uygulamada ödemeler.** Bazı ülkelerde Splitwise parayı da gönderebilir. Side Badger yalnızca kaydı tutar."
      - "**Paylara ya da kaleme göre bölüşme.** Side Badger'da harcama başına bir ödeyen var; eşit, tam tutarlarla ya da yüzdeyle bölünür. Makbuz taraması kalemleri kişilere atamaz."
      - "**Grafikler ve varsayılan bölüşümler.** Splitwise Pro'da ikisi de var. Side Badger kimin kime borçlu olduğunun hesabını tutar, bütün numara bu."
  - heading: Grubunuzu taşımak
    body: İçe aktarma özelliği yok, yani taşınmak yeni bir başlangıç demek. Önce Splitwise'ta ödeşin, sonra Side Badger'da bir grup kurun ve herkesi bir bağlantı ya da QR koduyla davet edin. Gruptaki herkesin ücretsiz bir hesaba ihtiyacı var ve kaydolmak için gereken tek şey bir e-posta adresi.
