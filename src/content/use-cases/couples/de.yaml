meta:
  title: Kosten als Paar teilen, 50/50 oder nach Einkommen | Side Badger
  description: Teilt die langweiligen Kosten, ohne aus dem Date-Abend ein Quartals-Finanzmeeting zu machen. 50/50, nach Einkommen oder Rechnung für Rechnung. Kostenlos.
h1: Kosten als Paar fair teilen
navLabel: Paare
lead: Teilt die langweiligen Kosten, ohne aus dem Date-Abend ein Quartals-Finanzmeeting zu machen. Side Badger führt eine laufende Rechnung für Miete, Rechnungen und Einkauf von **Paaren**, die sich ein Zuhause, ein Sofa und eine vage Erinnerung daran teilen, wer den Internetanschluss bezahlt hat. Teilt 50/50, nach Einkommen oder Rechnung für Rechnung, und seht, wer wem was schuldet.
cta:
  heading: Starte eine Gruppe für zwei
  body: Erstelle ein Konto, mach eine Gruppe und schick der anderen Person den Einladungslink. Das Takeaway von heute Abend kann die erste Ausgabe sein.
scenario:
  heading: Fair muss nicht 50/50 heißen
  body: Sam und Alex teilen sich ein Zuhause. Sam verdient mehr, deshalb haben die beiden vereinbart, dass Sam 60 % der Miete übernimmt und Alex 40 %. Sam zahlt den Vermieter, Alex macht den Einkauf, und beide sind ziemlich sicher, dass sich am Ende alles ausgleicht. „Ziemlich sicher“ ist der Weg, auf dem aus einer Notiz auf irgendjemandes Handy ein Dauerstreit wird. Mach also eine Gruppe für euch zwei, wähle den Namen, den dein Partner oder deine Partnerin sehen soll, und schick den Einladungslink oder QR-Code. Füge jede Ausgabe hinzu, wenn sie anfällt, sag, wer bezahlt hat und wie sie sich aufteilt, und lass die Gruppe mitzählen. Mach für jeden Urlaub eine eigene Gruppe (siehe [Gruppenreisen](page:use-case/group-trips)), damit die Flüge nicht bei den Lebensmitteln landen.
sections:
  - heading: 50/50, nach Einkommen oder Rechnung für Rechnung
    body: Es gibt keine allgemein faire Aufteilung, nur die, der ihr beide zustimmt, am besten vor der ersten Rechnung statt nach dem ersten Seufzer. Das sind die üblichen drei.
    items:
      - "**50/50.** Wähle **Gleichmäßig**, und jede Person schuldet die Hälfte. Das passt zu gemeinsamen Kosten, wenn eure Einkommen nah beieinander liegen, und braucht überhaupt keine Rechnerei."
      - "**Nach Einkommen.** Verdient eine Person mehr, teilt nach dem Anteil, den jede am Einkommen hat. Einigt euch zuerst, was zählt (üblich ist das Nettogehalt), addiert beide Beträge und teilt jeweils den eigenen durch die Summe. Bringt eine Person drei Teile nach Hause und die andere zwei, ist das 3 ÷ (3 + 2) = 60 %, also trägt eine Person 60 % und die andere 40 %. Rundet auf ganze Prozentzahlen und tragt sie unter **Prozentsatz** ein, wo sie zusammen 100 ergeben müssen. Euer Gehalt lässt sich nirgends eintragen, ihr tippt also immer nur die Prozentsätze."
      - "**Rechnung für Rechnung.** Jede Ausgabe hat ihre eigene Aufteilung, ihr könnt also mischen: Miete nach Einkommen, Lebensmittel 50/50 und ein gemeinsames Geschenk mit **Genaue Beträge**, wenn jede Person selbst gewählt hat, was sie dazugibt."
      - "**Wenn sich das Gehalt ändert,** nutzt ab der nächsten Ausgabe die neuen Prozentsätze. Frühere Ausgaben behalten die Aufteilung, mit der sie eingegeben wurden. Wie die Rechnung mit echten Gehaltsabrechnungen aussieht, steht in [So teilt ihr Rechnungen, wenn einer von euch mehr verdient](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: Der monatliche Kassensturz
    body: Einmal im Monat oder immer dann, wenn es bei den Zahlen zu jucken anfängt, öffne die Gruppe und sieh unter **Salden** nach. Zu zweit gibt es pro Währung immer nur eine Zahlung, von der Person, die schuldet, an die, die etwas bekommt. Nehmen wir den Monat von Sam und Alex. Sam hat die Miete von 1.500 £ bezahlt, und Alex' 40 % davon sind 600 £. Alex hat 90 £ für Lebensmittel gezahlt, gleichmäßig geteilt, also macht Sams Hälfte 45 £ aus. Side Badger rechnet das eine gegen das andere auf, 600 £ abzüglich 45 £, und Alex zahlt Sam 555 £. Zahlt es, wie ihr wollt, per Banküberweisung, bar oder mit einem ausstehenden Gefallen, und erfasst es dann unter **Abrechnen**, damit der Saldo wieder auf null geht. Es gibt keine wiederkehrenden Rechnungen, also kopiere die Miete vom letzten Monat, ändere das Datum und mach weiter. Side Badger bewegt das Geld nicht und sendet keine Erinnerungen, das Anstupsen bleibt also euch überlassen.
  - heading: Nur ihr zwei
    body: Eine Gruppe aus zwei Personen hat zwei Mitglieder, und nur Mitglieder einer Gruppe können sie sehen. Die andere Person tritt mit dem Einladungslink oder QR-Code bei. Ein Link kann zwischen 15 Minuten und 5 Tagen gelten, wähle also den kürzesten, der ihr Zeit gibt, ihn zu nutzen. Ein neuer Link macht die alten nicht ungültig, lass sie also nicht in einem Chat liegen, in dem auch andere Leute sind. Wer einen gültigen Link nutzt, kann beitreten. Wenn du ganz sicher sein willst, schalte die Freigabe ein, dann lässt ein Admin jede Person herein. Die andere Person braucht ein eigenes Konto, das kostenlos ist.
exampleAfter: 2
