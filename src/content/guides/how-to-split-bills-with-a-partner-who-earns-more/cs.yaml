meta:
  title: "Jak dělit účty, když jeden z partnerů vydělává víc | Side Badger"
  description: "Půl na půl je trapné, když jeden z vás vydělává mnohem víc. Rozdělte společné účty podle příjmu, s vypsanými výpočty pro dva lidi a bez tabulky."
h1: "Jak dělit účty, když jeden z partnerů vydělává víc"
navLabel: "Partner s vyšším příjmem"
lead: "Sečtěte čisté mzdy, spočítejte podíl každého z celku a zaokrouhlete na celá procenta. Maya má čistého 2 800 £ a Jon 1 700 £, takže společné účty dělí 62/38. Tato procenta zadejte u společného výdaje v Side Badger a pak ho kopírujte, kdykoli se stejný účet vrátí."
cta:
  heading: "Spočítejte to jednou"
  body: "Vytvořte si bezplatný účet, založte skupinu pro vás dva a zadejte nájem s vašimi procenty. Nájem příštího měsíce je kopie. Chcete nejdřív prohlídku? Podívejte se, [jak to funguje](page:how-it-works), nebo [co pokrývá verze zdarma](page:pricing)."
sections:
  - heading: "Dva platy, jeden byt, jedno zdvořilé ticho"
    body: "Maya a Jon bydlí spolu. Maya má čistého 2 800 £ měsíčně a Jon 1 700 £. Dva roky dělili všechno půl na půl, protože to bylo jednoduché a ani jeden nechtěl být tím, kdo to nadnese. Pak se Jon podíval na samotný nájem. Polovina z 1 400 £ je 700 £, což je čtvrtina Mayiny čisté mzdy a 41 % té jeho. Nikdo nebyl nespravedlivý. Nikdo to jen nespočítal. K tomuhle se dřív nebo později dostane spousta [párů](page:use-case/couples). Nad jídlem z rozvozu se shodli, že společné účty mají ukousnout z obou výplat podobný díl."
  - heading: "Postup s vypsanými výpočty"
    body: "Čtyři kroky, jedna kalkulačka a rozhovor, který vás stejně čekal."
    items:
      - "**Dohodněte, co se počítá jako příjem.** Maya a Jon používají čistou mzdu, tedy peníze, které každý měsíc dorazí na účet. Dohromady je to 2 800 £ + 1 700 £ = 4 500 £."
      - "**Spočítejte podíl každého.** Mayin je 2 800 ÷ 4 500, tedy 62,2 %. Jonův je 1 700 ÷ 4 500, tedy 37,8 %."
      - "**Zaokrouhlete na celá procenta.** 62,2 % se změní na 62 a 37,8 % na 38. U dvou lidí zaokrouhlete jedno číslo a odečtěte ho od 100, abyste dostali druhé, a vždy dají dohromady 100."
      - "**Ověřte, co to znamená.** Z nájmu 1 400 £ platí Maya 868 £ (62 %) a Jon 532 £ (38 %). To je u obou asi 31 % čisté mzdy. Půl na půl by zabralo 25 % Mayiny a 41 % Jonovy."
  - heading: "Jak vypadal měsíc"
    body: "Maya zaplatila nájem 1 400 £ a Jon zbylých 216 £. Mayin podíl na měsíci je 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £ a ona zaplatila 1 400 £, takže se jí dluží 402,40 £. Jonův podíl je 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £ a on zaplatil 216 £, takže dluží 402,40 £. Side Badger navrhne jednu platbu, Jon Maye, 402,40 £, a [vyrovnání](page:feature/settle-up) ji zaznamená, jakmile proběhne. Při dělení půl na půl by za stejný měsíc Jon platil Maye 592,00 £."
  - heading: "Nastavení v Side Badger"
    body: "Deset minut, většinou strávených nad procenty."
    items:
      - "**Založte skupinu.** Na nástěnce zvolte **Vytvořit skupinu** a pojmenujte ji podle bytu. Zvolte **Pozvat ostatní** a pošlete Jonovi odkaz nebo QR kód. Přihlásí se nebo si vytvoří bezplatný účet a vybere si jméno, pod kterým se má v této skupině zobrazovat. Skupinu vidí jen členové, takže tahle bude jen pro vás dva."
      - "**Přidejte nájem.** Zvolte **Přidat výdaj**. Zadejte popis a částku a pod **Kdo platil?** vyberte Mayu. Oba nechte pod **Rozdělit mezi**, pak pod **Jak rozdělit** zvolte **Procenta** a zadejte 62 a 38. Formulář upozorní, pokud procenta nedávají dohromady 100. Zvolte **Uložit výdaj**."
      - "**Přidejte ostatní účty.** Energie a internet se zadají stejně, s Jonem jako plátcem a stejnými 62 a 38. Jídlo z rozvozu je samostatný výdaj a **Jak rozdělit** zůstane na **Rovnoměrně**."
      - "**Příští měsíc ho zkopírujte.** Otevřete nájem z minulého měsíce a zvolte **Kopírovat výdaj**. Kopie si ponechá plátce, částku i rozdělení a převezme dnešní datum. Pokud se nájem změnil, upravte částku a zvolte **Vytvořit kopii**. Účet za energie funguje stejně."
      - "**Zkontrolujte, kdo komu dluží.** Ukáže to sekce **Zůstatky** a navrhne krátký seznam plateb. Zaplaťte si, jak chcete, a platbu pak zaznamenejte pod **Vyrovnat dluhy**."
  - heading: "Půl na půl, podle příjmu, nebo účet po účtu"
    body: "Správná odpověď neexistuje, jen ta, se kterou můžete žít oba. Tři běžné."
    items:
      - "**Půl na půl za všechno.** Nejsnáze se vede a hodí se pro páry s podobnými příjmy."
      - "**Podle příjmu za všechno společné.** To dělají Maya a Jon. Jeden rozhovor, jedna dvojice procent."
      - "**Účet po účtu.** Nájem a účty podle příjmu, dovolené a malé radosti půl na půl nebo jak se dohodnete, a každý účet dostane pravidlo, které mu sedí."
  - heading: "Dohodněte, co je společné"
    body: "Hádky bývají o seznamu, ne o procentech. Nájem, energie, internet, týdenní nákup a pohovka se ve většině domácností počítají jako společné. Mayino členství v posilovně a Jonovo předplatné na fotbal možná ne. Seznam dohodněte jednou, zapište ho a do skupiny dávejte jen společné náklady."
  - heading: "Jídlo z rozvozu zůstává půl na půl, schválně"
    body: "Takové radosti jsou drobné a nepovinné a nikdo by neměl potřebovat kalkulačku, aby si objednal taštičky. V Side Badger je jídlo z rozvozu jen další výdaj. Jon zaplatí 36 £, **Jak rozdělit** zůstane na **Rovnoměrně** a každý z nich dluží 18 £."
  - heading: "Když se někomu změní příjem"
    body: "Zvýšení platu, nová práce nebo pauza v zaměstnání mění výpočet. Spočítejte nová procenta stejným způsobem a používejte je od dalšího výdaje. Dřívější výdaje zůstanou, jaké byly. Zkopírujte nájem z minulého měsíce, změňte procenta a zvolte **Vytvořit kopii**. Chcete-li opravit výdaj, který už je zadaný, upravte ho, pokud to oprávnění skupiny dovolují, a nejdřív to řekněte druhému z vás, protože se změní zůstatky. Předchozí verze se uchovává. Domluvte se, kdy budete přepočítávat, například jednou ročně, a před přechodem se vyrovnejte, aby se staré rozdělení uzavřelo s čistým účtem."
  - heading: "Co Side Badger tady nedělá"
    items:
      - "Nikdy se neptá, kolik kdo vydělává, a procenta nepočítá. Zadáváte čísla, na kterých jste se dohodli."
      - "Neumí nastavit výchozí rozdělení pro celou skupinu. Procenta se zadávají u každého výdaje, takže kopírujte výdaj, který je už má."
      - "Nemá opakované účty, takže nájem z minulého měsíce kopírujete pokaždé znovu."
      - "Nikdy nepřesouvá peníze. Platíte si, jak chcete, a platbu zaznamenáte."
