meta:
  title: "Side Badger za cimere, putovanja i zabave"
  description: "Dijeli troškove s cimerima, na grupnim putovanjima te za zabave, vjenčanja i zajedničke darove. Pogledaj što Side Badger radi za svaku vrstu grupe."
h1: "Side Badger za tvoju vrstu grupe"
navLabel: "Primjeri korištenja"
lead: "Cimeri, odmori, djevojačke i momačke večeri. Odaberi svoj kaos, a zatim pogledaj kako grupa poput tvoje vodi evidenciju."
intro: "Svaka grupa dijeli troškove malo drugačije. Ove stranice prate **realističan scenarij** od prvog troška do posljednje zabilježene uplate, uz prikazane izračune, pa možeš vidjeti do čega bi došla tvoja grupa."
cta:
  heading: "Prepoznaješ li svoju vrstu grupe?"
  body: "Napravi korisnički račun, osnuj grupu i dodaj prvi trošak. Treba nekoliko minuta."
cardsHeading: "Odaberi situaciju koja je najbliža tvojoj"
sections:
  - heading: "Grupna putovanja"
    body: "Letovi u funtama, vila u eurima i večera koju su jele samo tri osobe. Postavi grupu da pretvara u funte i četiri prijatelja u Lisabonu završe s tri uplate umjesto šest, koliko ih je kad se valute vode zasebno. [Dijeli troškove grupnog putovanja](page:use-case/group-trips)."
  - heading: "Cimeri"
    body: "Jedna osoba plaća stanodavcu, druga se sjeti računa za energiju i nitko se ne slaže tko je kupio toaletni papir. Uz najamninu podijeljenu po veličini sobe i ostale račune podijeljene jednako, četvero cimera mjesec završi s tri uplate, sve onome tko je platio najamninu. [Dijeli kućanske račune s cimerima](page:use-case/housemates)."
  - heading: "Zabave, vjenčanja i zajednički darovi"
    body: "Šest ljudi glasa za dar, jedan ga kupi, a ne doprinosi svatko isti iznos. Dar od 150 £ podijeljen po točnim iznosima ostavlja pet uplata osobi koja ga je kupila, ukupno 120 £. [Dijeli troškove događaja](page:use-case/events-and-celebrations)."
  - heading: "Parovi"
    body: "Dijeli dosadne troškove, a da spoj ne pretvoriš u tromjesečni financijski pregled. Najamnina podijeljena 60/40 i namirnice podijeljene jednako svode se na jednu uplatu između vas dvoje."
  - heading: "Prvo pogledaj kako radi"
    body: "Svaki od gornjih primjera koristi iste korake, od stvaranja grupe do bilježenja uplata. [Kako radi](page:how-it-works) ih prolazi, a [cjenik](page:pricing) kaže koliko košta, a to je ništa, bez oglasa i bez dnevnih ograničenja."
faq:
  heading: "Pitanja"
  items:
    - q: "Treba li svatko u grupi korisnički račun?"
      a: "Da. Ljudi se pridružuju poveznicom ili QR kodom i besplatnim korisničkim računom."
    - q: "Može li Side Badger prikupljati novac?"
      a: "Ne. Plaćaš kako god želiš, a zatim zabilježiš uplatu da stanja ostanu točna."
    - q: "Moram li odabrati jednu vrstu grupe?"
      a: "Ne. Primjeri korištenja su primjeri, a ne postavke. Svaka grupa ima iste značajke, pa koristi ono što ti odgovara."
