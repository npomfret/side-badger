faq:
  heading: "Vprašanja"
  items:
    - q: "Kaj je pravičnejše, velikost sobe ali dohodek?"
      a: "Nobeno ni vedno pravičnejše. Velikost sobe ustreza sostanovalcem, ki plačujejo prostor, v katerem spijo. Dohodek ustreza parom in prijateljem z zelo različnimi plačami. Dogovorite se pred prvim dnevom plačila najemnine, ne po njem."
    - q: "Ali naj se računi delijo na enak način?"
      a: "Pri sostanovalcih običajno ne. Energijo in internet uporabljajo vsi, zato je enako preprostejše, kot v primeru. Pri dohodku kalkulator računom da enake deleže kot najemnini."
    - q: "Ali lahko uporabim kvadratne čevlje?"
      a: "Da. Izberi ft² in vpiši površine v kvadratnih čevljih. Enota je le oznaka, deleži pa so enaki, če vsi uporabljajo isto."
    - q: "Ali je kalkulator brezplačen?"
      a: "Da. Brezplačno. Brez oglasov. Brez dnevnih omejitev. Tudi uporabniški račun ni potreben."
