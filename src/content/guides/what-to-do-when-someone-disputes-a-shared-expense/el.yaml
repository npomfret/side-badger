faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορώ να αμφισβητήσω μόνο το μερίδιό μου;"
      a: "Όχι. Μια ερώτηση κρατά εκτός ολόκληρο το έξοδο, για όλους όσοι συμμετέχουν σε αυτό. Αν είναι λάθος μόνο ο διαχωρισμός, η λύση είναι μια επεξεργασία του διαχωρισμού."
    - q: "Ποιος μπορεί να κλείσει μια ερώτηση;"
      a: "Το άτομο που ρώτησε ή ένας διαχειριστής της ομάδας. Αν το άτομο που πρόσθεσε το έξοδο δεν είναι διαχειριστής, δεν μπορεί να την κλείσει εκ μέρους αυτού που ρώτησε."
    - q: "Σβήνει η επεξεργασία ενός εξόδου το πρωτότυπο;"
      a: "Όχι. Η προηγούμενη έκδοση διατηρείται. Το ποιος μπορεί να επεξεργάζεται το ορίζουν τα δικαιώματα της ομάδας, οπότε αξίζει να ενημερώσετε πρώτα το σπίτι, επειδή αλλάζουν τα υπόλοιπα."
