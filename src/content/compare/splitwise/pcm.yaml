sections:
  - heading: "Wetin Splitwise dey do well"
    body: "If your group need native app, offline use or payments inside di app, Splitwise na di sensible choice, and we prefer say you pick am than to find out later. Im own pages list:"
    items:
      - "**Apps and offline use.** iPhone and Android apps as well as di web, and offline mode."
      - "**More ways to share.** Split by shares, by adjustment and per item, plus equal, exact and pasentej."
      - "**Recurring expenses.** Set di rent to repeat and forget about am."
      - "**Payments inside di app.** For some countries e fit move di money too, through Splitwise Pay, Venmo, PayPal or Pay by Bank."
  - heading: "Free here, pay there"
    body: "Splitwise Pro na Splitwise paid plan, and im own Pro page dey sell four things wey cost nothing for Side Badger."
    items:
      - "**Receipt scanning.** Splitwise Pro dey scan photo of your receipt. Side Badger dey do am for free, with no scan credits: e dey fill di total, date and place make you check am. Google AI service dey read receipt images."
      - "**Currency conversion.** Splitwise Pro dey convert group expenses to your default currency when you tap Convert. Side Badger dey convert each expense as you enter am, at current exchange rate or di one wey you really get, and di original amount go stay on di expense."
      - "**No ads.** Splitwise list totally ad-free experience as Pro feature. Side Badger no get ads."
      - "**No daily limits.** Splitwise Pro dey sell unlimited expenses, and im help centre talk say free users fit add up to 4 expenses each day. Side Badger no get daily limits."
  - heading: "Wetin Splitwise get wey Side Badger no get"
    body: "Dis no be every Splitwise feature, only di ones wey dey usually decide am. Splitwise own pages get di full list. Here na where Side Badger fall short."
    items:
      - "**Native apps.** Side Badger dey work for your browser. Sign in, then add am to your home screen and e go open like an app."
      - "**Offline mode.** Side Badger need connection."
      - "**Payments inside di app.** Side Badger no dey ever touch your money. Pay each other anyhow you like, then record di payment."
      - "**Recurring expenses.** Side Badger no get any. Copy last month rent instead of to type am again."
      - "**Sharing by shares or by item.** Side Badger get one payer for each expense, wey you go share equal-equal, by exact amounts or by percentage. Im receipt scanning no dey assign items to people."
      - "**Charts and di split wey dey set already.** Splitwise Pro get both. Side Badger dey keep count of who owe who, and na dat be di whole trick."
  - heading: "How to move your group come"
    body: "No importer dey, so to move mean fresh start. Settle up for Splitwise first, then create group for Side Badger and invite everybody with link or QR code. Everybody for di group need free account, and email address na all e take to sign up."
