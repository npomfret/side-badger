meta:
  title: "Side Badger कैसे काम करता है | पांच कदम में ग्रुप के खर्च बांटें"
  description: "ग्रुप बनाएं, लोगों को बुलाएं, खर्च जोड़ें और हिसाब चुकता करें। देखें कि “किसी ने पेमेंट किया” से “हिसाब बराबर” तक क्या होता है, एक पूरे उदाहरण के साथ।"
h1: "Side Badger कैसे काम करता है"
navLabel: "यह कैसे काम करता है"
lead: "“किसी ने पेमेंट किया” और “हिसाब बराबर” के बीच क्या होता है? पांच कदम, कोई स्प्रेडशीट नहीं, और एक बिज्जू जो ज़्यादातर सजावट के लिए है। यह रहा पूरा सफर, पहले ग्रुप से आखिरी रिकॉर्ड किए गए पेमेंट तक। किसी भी कदम की बारीकी के लिए [खर्च बांटना](page:feature/split-expenses) और [हिसाब चुकता करना](page:feature/settle-up) देखें।"
cta:
  heading: "“इस बार मैं दे देता हूँ” से “हिसाब बराबर” तक"
  body: "मुफ्त अकाउंट बनाएं, ग्रुप शुरू करें और पहला खर्च जोड़ें। बिज्जू आपकी रसीद पर कोई राय नहीं देगा।"
  button: "मुफ्त अकाउंट बनाएं"
steps:
  - title: "ग्रुप बनाएं"
    body: "हर घर, ट्रिप या इवेंट के लिए एक ग्रुप बनाएं, ताकि किराया कभी शादी के तोहफे वाली सूची में न मिल जाए। उसे एक नाम दें, वह नाम चुनें जिससे लोग आपको देखेंगे और चाहें तो तय करें कि वह कौन-सी करेंसी लेगा। फिर आपके डैशबोर्ड पर हर ग्रुप दिखता है, और हर ग्रुप में आपकी स्थिति भी, एक ही स्क्रीन पर।"
    shot: S02
    shotAlt: "ग्रुप बनाने का डायलॉग, जिसमें करेंसी की पाबंदियों वाला हिस्सा खुला है"
  - title: "अपने लोगों को बुलाएं"
    body: "जॉइन लिंक शेयर करें या QR कोड दिखाएं, और तय करें कि वह कितनी देर चलेगा, 15 मिनट से लेकर 5 दिन तक। जुड़ने वाले हर व्यक्ति को एक मुफ्त अकाउंट और वेरिफाई किया हुआ ईमेल चाहिए, और एक ग्रुप में 50 लोग तक हो सकते हैं। अगर आप खुद तय करना चाहते हैं कि कौन अंदर आए, तो अप्रूवल चालू करें और एडमिन हर व्यक्ति को अंदर आने दे।"
    shot: S03
    shotAlt: "इनवाइट डायलॉग का लिंक टैब, जिसमें QR कोड और एक्सपायरी के विकल्प दिख रहे हैं"
  - title: "खर्च होते ही जोड़ें"
    body: "बताएं कि किसने पेमेंट किया, कितना किया, और किसके लिए किया। उसे बराबर, सटीक राशि या प्रतिशत से बांटें, और जो उसमें शामिल नहीं था उसे बाहर रखें। खर्च जोड़ते ही सबको वह तुरंत दिख जाता है, साथ में यह भी कि क्या बदला और किसने बदला।"
    shot: S05
    shotAlt: "खर्च का फॉर्म, जिसमें किराया कमरे के आकार के हिसाब से प्रतिशत में बांटा गया है"
  - title: "बैलेंस पर नज़र रखें"
    body: "Side Badger हर करेंसी का चलता हुआ बैलेंस रखता है, ताकि आप एक नज़र में देख सकें कि किसे किसका देना है। छोटी-छोटी उधारियों का जाल सबको खुद सुलझाने के लिए छोड़ने की जगह, यह पेमेंट की एक छोटी सूची सुझाता है जिससे ग्रुप का हिसाब चुकता हो जाए।"
    shot: S10
    shotAlt: "बैलेंस की स्क्रीन, जिसमें दो करेंसी में सरल की गई उधारियां दिख रही हैं और सभी दिखाएं चालू है"
  - title: "हिसाब ऐप के बाहर चुकाएं, रिकॉर्ड अंदर करें"
    body: "Side Badger कभी पैसे नहीं भेजता। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर पेमेंट रिकॉर्ड करें ताकि बैलेंस अपडेट हो जाएं, और सबकी स्क्रीन बिना रिफ्रेश किए बदल जाती है। “सेटल” का मतलब बस इतना है कि बैलेंस शून्य दिखें। जब तक किसी का कुछ देना या पाना बाकी है, वह ग्रुप छोड़ नहीं सकता, इसलिए बाहर जाने वाला पहले हिसाब चुकता करता है।"
    shot: S11
    shotAlt: "पेमेंट का फॉर्म, जिसमें त्वरित निपटान बटन और आंशिक पेमेंट की सूचना दिख रही है"
requirements:
  heading: "आपको क्या चाहिए"
  items:
    - "एक मुफ्त अकाउंट। बस एक ईमेल पता और पासवर्ड चाहिए, और कुछ भी जोड़ने से पहले आप ईमेल वेरिफाई करते हैं।"
    - "18 साल या उससे ज़्यादा उम्र।"
    - "फोन या कंप्यूटर पर एक आधुनिक ब्राउज़र, और इंटरनेट कनेक्शन। Side Badger ऐप-स्टोर वाला ऐप नहीं है और ऑफलाइन काम नहीं करता।"
    - "चाहें तो होम स्क्रीन पर एक जगह। ऐप स्टोर की ज़रूरत नहीं, क्योंकि आप Side Badger को अपनी होम स्क्रीन या डॉक में जोड़ सकते हैं और वह ऐप की तरह खुलता है।"
