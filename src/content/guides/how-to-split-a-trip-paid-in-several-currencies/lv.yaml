faq:
  heading: "Jautājumi"
  items:
    - q: "Kādu valūtas kursu Side Badger izmanto?"
      a: "Pašreizējo valūtas kursu, kas tiek iegūts, ievadot izdevumu, ja tāds ir pieejams. Varat to nomainīt uz kursu, ko patiešām saņēmāt."
    - q: "Vai grupa var palikt pie mārciņām un jenām?"
      a: "Jā. Grupas **Iestatījumi** sadaļā **Valūtas iestatījumi** ieslēdziet **Ierobežot valūtas šai grupai**, izvēlieties **Atļautās valūtas** un iestatiet **Noklusējuma valūta jauniem izdevumiem**. Mazāk iespēju sarakstā, mazāk nepareizu minējumu pie kases."
    - q: "Vai mums vispār jākonvertē?"
      a: "Nē. Valūtas paliek atsevišķas, ja vien jūs vai jūsu grupa nevēlas konvertēt, un katrai valūtai ir savs īss maksājumu saraksts."
