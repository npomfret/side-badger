faq:
  heading: "Jautājumi"
  items:
    - q: "Vai izmantot bruto vai neto algu?"
      a: "Lemj grupa. Neto alga ir bieža izvēle, jo tā ir nauda, ko patiešām varat tērēt. Bruto alga neņem vērā, ka nodokļi, pensijas iemaksas un aizdevumu atmaksa no dažādām algām atņem dažādas summas. Ko arī izvēlētos, abiem izmantojiet vienu un to pašu mēru."
    - q: "Vai Side Badger redz mūsu ienākumus?"
      a: "Nē. Jūs ievadāt tikai procentus, nekad algas. Procenti ir redzami grupas dalībniekiem, un pārim tie esat jūs abi."
    - q: "Vai 62/38 var iestatīt vienreiz visam?"
      a: "Sadale tiek iestatīta katram izdevumam, nevis grupai. Nokopējiet izdevumu, kuram jau ir 62 un 38, un nomainiet to, kas atšķiras. [Izdevumu sadale](page:feature/split-expenses) apraksta citas iespējas."
