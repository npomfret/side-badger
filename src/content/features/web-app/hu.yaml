meta:
  title: "Költségmegosztó alkalmazás letöltés nélkül | Side Badger"
  description: "Tele a telefonod, értjük. A Side Badger a böngésződben fut, letöltés és alkalmazásbolt nélkül. Add a főképernyőhöz, és úgy nyílik, mint egy alkalmazás."
h1: "Nincs alkalmazásbolt. Nincs letöltés. Mégis alkalmazásnak érződik"
navLabel: "Webalkalmazás"
lead: "A Side Badger a böngésződben él. Nem kell alkalmazásboltot keresgélned, és semmit nem kell előbb letöltened. Jelentkezz be telefonon vagy számítógépen, oszd fel online a költségeket a csoportoddal, és add hozzá a főképernyőhöz vagy a Dockhoz, ha egy koppintásnyira akarod."
cta:
  heading: "Nyisd meg. Jelentkezz be. Indíts csoportot."
  body: "Hozz létre fiókot, indíts csoportot, és add hozzá az első költséget, mindezt a böngészőből, amely már nyitva van. Szeretnéd előbb a bemutatót? Nézd meg, [hogyan működik](page:how-it-works), vagy [mit fed le az ingyenes csomag](page:pricing)."
problem:
  heading: "Tele a telefonod. Értjük."
  body: "Valahol rajta van négyezer fotó ugyanarról a naplementéről, és egy tárhelyfigyelmeztetés, amit tavasz óta elhessegetsz. A legutolsó, amire szüksége van, még egy alkalmazás, csak azért, hogy felosszatok egy vacsorát. Ezért a Side Badger webalkalmazás. Egy modern böngészőben fut, telefonon vagy számítógépen. Telefonon mobilnézeteket használ, a csoportoldal füleken, érintésbarát vezérlőkkel. Néhány extra, például a főképernyőhöz adás, a böngésződtől függ, és megmondjuk, hol."
workflow:
  heading: "A böngészőfültől a főképernyőig három lépésben"
  steps:
    - title: "Nyisd meg, és jelentkezz be"
      body: "Menj a böngésződben a Side Badgerre, és jelentkezz be. Csak egy e-mail-cím és egy jelszó kell hozzá, és az e-mailt meg kell erősítened, mielőtt bármit hozzáadhatnál. A csoport minden tagjának fiók kell, ezért a meghívott emberek is ugyanezt teszik."
    - title: "Add hozzá a főképernyőhöz vagy a Dockhoz"
      body: "Bejelentkezés után az alkalmazás felajánlja, hogy telepíti magát. Ahol a böngésződ engedi, egy **Telepítés** gombot kapsz, ahol nem, ott **Mutasd, hogyan** látható. Lemaradtál róla, vagy nemet mondtál? A **Beállítások** között ugyanez a segítség ott van a **Hozzáadás a főképernyőhöz vagy a Dockhoz** alatt. iPhone-on és iPaden a Beállítások az iPhone-lépéseket mutatják elöl, a többi eszközt pedig a **Más eszközök** alá teszik. Akárhogy, az alkalmazás utána saját ablakban nyílik meg."
      shot: S20
      shotAlt: "A Beállítások Hozzáadás a főképernyőhöz vagy a Dockhoz szakasza az alkalmazás eszközhöz adásának lépéseivel"
    - title: "Kapcsold be az értesítéseket, ha szeretnéd"
      body: "Az értesítések addig ki vannak kapcsolva, amíg be nem kapcsolod őket, és minden eszközt külön kell bekapcsolni. Használd az értesítések csengője által kínált **Bekapcsolás** gombot, vagy a **Push-értesítések** kapcsolót a **Beállítások** között. iPhone-on és iPaden először nyisd meg az alkalmazást a főképernyőről. Az értesítések ott csak így működnek."
      shot: S19
      shotAlt: "A megnyitott értesítések legördülő lista a csoport legutóbbi tevékenységeivel"
options:
  heading: "Hogyan add hozzá, eszközönként"
  items:
    - title: "iPhone és iPad"
      body: "Koppints a Megosztás gombra, amely egy felfelé mutató nyilat tartalmazó négyzet. Ha nem látod, koppints előbb a három pontra (•••), aztán a Megosztásra. Görgess lefelé, és koppints a **Főképernyőhöz adás** elemre. Hagyd bekapcsolva a **Megnyitás webappként** beállítást, aztán koppints a **Hozzáadás** gombra. Ha egy link egy másik alkalmazáson belül nyílt meg, nyisd meg az oldalt először Safariban, mert az a beépített böngésző nem tudja hozzáadni."
    - title: "Android"
      body: "Nyisd meg a böngésző menüjét, és válaszd a **Hozzáadás a kezdőképernyőhöz** vagy az **Alkalmazás telepítése** lehetőséget."
    - title: "Chrome vagy Edge számítógépen"
      body: "Nyisd meg a böngésző menüjét, és válaszd az oldal alkalmazásként való telepítésének lehetőségét. Utána saját ablakot és saját ikont kap."
    - title: "Safari Macen"
      body: "Válaszd a **Fájl** menüt, majd a **Hozzáadás a Dockhoz** lehetőséget."
sections:
  - heading: "Értesítések, csak ha kéred"
    body: "A push-értesítések opcionálisak. Kapcsold be őket, és értesítést kapsz, ha új tevékenység van a csoportjaidban, például valaki hozzáad egy költséget, kommentet ír vagy kifizetést rögzít. Egyszerre egy eszközön kapcsolhatók be, az értesítések csengőjéről vagy a **Beállítások** közül, és ott ki is kapcsolhatod őket. Olyan böngésző kell hozzájuk, amely támogatja őket, és a te engedélyed. Ha a böngésződ letiltotta őket az oldalnak, előbb a böngésző beállításaiban engedélyezd. iPhone-on és iPaden csak a főképernyőhöz adott alkalmazásból működnek, böngészőfülről nem. A kézbesítés nem garantált, ezért az értesítést tekintsd noszogatásnak, nem ígéretnek. Hogy mi jelenik meg a hírfolyamban, azt lásd a [közös tervezés](page:feature/plan-together) oldalon."
  - heading: "Élő frissítések, frissítés gomb nélkül"
    body: "Adj hozzá egy költséget, és mindenki rögtön látja, azzal együtt, hogy mi változott, és ki változtatta. Minden csoport tevékenységi előzményeket vezet, az értesítések csengője pedig az összes csoportod tevékenységét mutatja. Senkinek nem kell megkérdeznie, látta-e, amit az előbb hozzáadtál. Ott van a képernyőjén."
  - heading: "39 nyelv, mindenki a sajátját használja"
    body: "Használd a Side Badgert 39 nyelven, köztük a jobbról balra író arabon, perzsán és urdun. A csoport minden tagja a saját nyelvét választja, így ugyanaz a csoportoldal lehet az egyik embernek arab, a következőnek angol. Az egyetlen, amiben a csoportnak meg kell egyeznie, a számok."
  - heading: "Nem csak egyfajta felhasználónak építve"
    body: "A Side Badgert billentyűzetet és képernyőolvasót használó emberekre is gondolva építettük. A tagszínek mintákkal párosulnak, így nem kell megkülönböztetned a zöldet a pirostól."
    items:
      - "Ugrólinkek, hogy a billentyűzetet használók egyenesen a tartalomhoz ugorhassanak."
      - "A párbeszédablakok kezelik a billentyűzetfókuszt."
      - "A vezérlők fel vannak címkézve, a képernyőolvasók számára."
      - "Az elrendezések megfordulnak a jobbról balra író nyelveknél."
limits:
  heading: "Amit a webalkalmazás nem tud"
  items:
    - "Nincs offline használat. A Side Badgernek kapcsolat kell, ezért nem nyitja meg a csoportodat egy repülőn, wifi nélkül."
    - "Nincs alkalmazásboltos alkalmazás, és nincs natív iPhone- vagy Android-alkalmazás. A Side Badger webalkalmazás, és a főképernyőhöz vagy a Dockhoz adással kapod meg az alkalmazásszerű változatot."
    - "A főképernyőhöz vagy a Dockhoz adás a böngésződtől függ. A menünevek böngészőnként és verziónként eltérnek, és néhány böngésző nem kínálja."
    - "A push-értesítések eszközönként bekapcsolhatók, olyan böngésző kell hozzájuk, amely támogatja őket, és a te engedélyed. iPhone-on és iPaden csak a főképernyőhöz adott alkalmazásból működnek. A kézbesítés nem garantált."
    - "Nincsenek e-mail- vagy SMS-értesítések, és nincsenek kifizetési emlékeztetők. Az új tevékenység az alkalmazásban jelenik meg, és push-értesítésként, ha bekapcsolod őket. A kifizetés követelése továbbra is rád marad."
    - "A tevékenység 90 napig marad meg."
    - "E-mail-címmel és jelszóval jelentkezel be. Nincs Google- vagy Apple-bejelentkezés, és 18 évesnek vagy annál idősebbnek kell lenned."
    - "Nem állítjuk, hogy a Side Badger teljesen akadálymentes, vagy hogy megfelel egy hivatalos akadálymentességi szabványnak. Ha valami az utadban áll, szólj az alkalmazásból, és ott látni fogod a válaszunkat."
useCasesHeading: "Ahol jól jön, hogy nem kell alkalmazás"
faq:
  heading: "Kérdések"
  items:
    - q: "Van Side Badger alkalmazás valamelyik alkalmazásboltban?"
      a: "Nem. A Side Badger webalkalmazás. A böngésződben nyitod meg, és hozzáadhatod a főképernyődhöz vagy a Dockhoz, hogy úgy nyíljon meg, mint egy alkalmazás. Alkalmazásboltból nincs mit letölteni."
    - q: "Oszthatok költséget alkalmazás letöltése nélkül?"
      a: "Igen. Nyisd meg a Side Badgert egy böngészőben a telefonodon vagy a számítógépeden, jelentkezz be, és indíts egy csoportot. A főképernyőhöz vagy a Dockhoz adás nem kötelező."
    - q: "Működik offline?"
      a: "Nem. A Side Badgernek kapcsolat kell, még akkor is, ha hozzá van adva a főképernyőhöz vagy a Dockhoz."
    - q: "Miért nem kapok értesítéseket az iPhone-omon?"
      a: "iPhone-on és iPaden az értesítések csak a főképernyőhöz adott alkalmazásból működnek, böngészőfülről nem. Add hozzá, nyisd meg a főképernyő ikonjáról, aztán kapcsold be az értesítéseket a **Beállítások** között. A kézbesítés nem garantált, ezért ha egy elveszik, a csoport tevékenységi előzményei akkor is megmutatják, mi került hozzá."
    - q: "Muszáj bekapcsolnom az értesítéseket?"
      a: "Nem. Addig ki vannak kapcsolva, amíg be nem kapcsolod őket, eszközönként egyenként. Nélkülük az új tevékenység továbbra is megjelenik az alkalmazásban, és mindenki rögtön látja a változást, ha nyitva van."
    - q: "Mindenkinek kell fiók a csoportban?"
      a: "Igen. Csak egy e-mail-cím és egy jelszó kell hozzá, és az e-mailt meg kell erősíteni, mielőtt bármit hozzáadnál. Mindenki, aki csatlakozik egy csoporthoz, ugyanezt teszi, akármelyik telefonon vagy számítógépen."
