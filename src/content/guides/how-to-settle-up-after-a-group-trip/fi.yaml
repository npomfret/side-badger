faq:
  heading: Kysymyksiä
  items:
    - q: Kenen pitäisi kirjata maksu, maksajan vai maksun saajan?
      a: Maksun kirjaaminen vaatii oikeuden muokata kuluja, ja lomake kysyy **Kuka maksoi?** ja **Kuka vastaanotti maksun?** Vain sen kirjannut voi muokata sitä myöhemmin, joten yleensä on yksinkertaisinta, että maksaja tekee sen pikaselvityspainikkeella.
    - q: Entä jos matka oli kahdessa valuutassa?
      a: Saldot pidetään valuutoittain, joten euroina oleva velka pysyy euroina ja jokaisella valuutalla on oma lyhyt listansa, ellei kuluja muunnettu niitä syötettäessä. [Matkat useassa valuutassa](page:guide/how-to-split-a-trip-paid-in-several-currencies) näyttää molemmat tavat.
    - q: Pitäisikö tilit tasata matkan aikana vai lopussa?
      a: Kumpikin käy. Jokainen kirjattu maksu muuttaa saldoja, joten kesken matkaa tehty maksu lasketaan mukaan lopulliseen listaan. Lopussa on yksinkertaisempaa, koska [koko matka](page:use-case/group-trips) on yhdessä paikassa.
