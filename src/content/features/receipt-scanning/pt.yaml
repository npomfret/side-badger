meta:
  title: "Digitaliza um recibo para adicionar uma despesa | Side Badger"
  description: "Deixa o texugo ler o recibo. Preenche o total, a data e o local para tu confirmares, sem créditos de digitalização. O serviço de IA da Google lê a imagem."
h1: "Digitaliza um recibo, confirma os detalhes, divide"
navLabel: "Leitura de recibos"
lead: "Deixa o texugo ler o recibo e corrige-lhe os trabalhos de casa. Adiciona uma fotografia a uma nova despesa e o Side Badger preenche o total, a data e o local para tu confirmares. Depois [divides](page:feature/split-expenses) como qualquer outra despesa. Digitalizar é grátis, sem créditos de digitalização. Preenche uma despesa e não divide a conta por item. As imagens dos recibos são lidas pelo serviço de IA da Google."
cta:
  heading: "Fotografa. Confirma. Divide."
  body: "Cria uma conta grátis, começa um grupo e adiciona uma despesa com a fotografia de um recibo. Vê o que ele preenche, corrige o que estiver errado e guarda quando ficar como queres."
problem:
  heading: "Ninguém quer escrever um recibo na fila dos táxis"
  body: "As viagens e as grandes noites fora trazem papel. O jantar, o táxi, a ronda que acabou em seis. Escrever cada um no telemóvel, com os polegares gelados e uma fila atrás de ti, é assim que as despesas se esquecem. Por isso o Side Badger lê o recibo por ti. Faz o primeiro rascunho e tu fazes a verificação. Dá jeito nas [viagens em grupo](page:use-case/group-trips) e nos [eventos e celebrações](page:use-case/events-and-celebrations), onde os recibos se acumulam mais depressa do que alguém quer tratar deles."
workflow:
  heading: "Da fotografia à despesa em três passos"
  steps:
    - title: "Adiciona um recibo a uma nova despesa"
      body: "Começa uma nova despesa e toca em **Digitalizar recibo**, ou usa a ação rápida **Digitalizar recibo** no teu painel. Tira uma fotografia ou escolhe uma que já tenhas. **Adicionar recibo ou anexo** no formulário também serve."
    - title: "Deixa-o ler o recibo"
      body: "O formulário diz **A analisar recibo...** enquanto a IA do Side Badger lê a imagem. Depois preenche o que encontrou, como a descrição, o total, a moeda, a data, a hora e o local. O que já tinhas escrito fica como está."
      shot: S09
      shotAlt: "O formulário de nova despesa a mostrar A analisar recibo... e depois o mesmo formulário com os detalhes preenchidos"
    - title: "Confirma e depois divide"
      body: "Compara o formulário com o papel. Corrige o que estiver errado, diz quem pagou e quem partilhou o custo, escolhe como dividir e guarda. A despesa não existe até o fazeres. [Dividir despesas](page:feature/split-expenses) explica a divisão."
options:
  heading: "Opções"
  items: []
sections:
  - heading: "O que ele preenche"
    body: "Adiciona a imagem de um recibo a uma nova despesa e estes campos podem ficar preenchidos. Quem pagou, quem partilhou o custo e como dividir continuam a ser contigo."
    items:
      - "Uma **descrição** da despesa."
      - "O **total**."
      - "A **moeda**, se o teu grupo o permitir."
      - "A **data** e a **hora**."
      - "O **local**."
      - "Uma cópia em texto do recibo nas **notas**, para quando o de papel desbotar ou for à máquina de lavar."
  - heading: "O que continuas a verificar"
    body: "Tudo. Trata o que ele preenche como um rascunho. Confirma o total com o papel, depois a moeda, a data e o local. Fotografias desfocadas e papel amarrotado podem enganar qualquer leitor, e não prometemos que acerta em todos os recibos, por isso olha antes de guardar. Se algo estiver errado, escreve por cima. Se o recibo estiver em ienes e o grupo acertar as contas em libras, [várias moedas](page:feature/multiple-currencies) explica o que acontece a seguir."
  - heading: "Guarda o recibo com a despesa"
    body: "Lido ou não, um recibo pode ficar com a despesa. Anexa fotografias ou PDF, até três por despesa e até 10 MB cada. Os membros do grupo veem-nos na despesa. As imagens aparecem como miniaturas que abrem num visualizador, e os PDF abrem como links. A fotografia que digitalizas também fica anexada, a menos que a removas antes de guardar. Quando alguém perguntar quanto custou mesmo aquele jantar, a prova está logo ali."
  - heading: "Para onde vai o teu recibo"
    body: "As imagens dos recibos são lidas pelo serviço de IA da Google. Para preencher o formulário, a imagem é lida pelo Google Vertex AI (Gemini) na multirregião dos EUA da Google. Adiciona uma imagem a uma nova despesa e ela é lida. Um PDF, ou uma fotografia adicionada a uma despesa que já existe, é guardado sem ser lido. Os recibos anexados são visíveis para os membros do grupo, por isso, se um recibo mostrar algo que preferes não partilhar, salta a fotografia e escreve essa despesa à mão."
limits:
  heading: "Limites"
  items:
    - "Só imagens. JPEG, PNG e WebP, e HEIC depois de convertido. Os PDF podem ser anexados a uma despesa, mas não são lidos."
    - "A digitalização é só para despesas novas. Numa despesa existente podes anexar recibos, mas nada é lido."
    - "Só preenche os campos em que ainda não mexeste, e a moeda apenas se o teu grupo o permitir."
    - "Não divide por item nem atribui itens a pessoas. Preenche uma despesa e tu divides-a como de costume."
    - "Não há promessa de que o que preenche esteja certo, nem de que a digitalização funcione sempre. Confirma antes de guardar e adiciona a despesa à mão se a digitalização falhar ou não estiver disponível."
    - "Uma despesa comporta até três anexos, cada um até 10 MB, em JPEG, PNG, WebP, HEIC ou PDF."
    - "As imagens dos recibos são lidas pelo Google Vertex AI (Gemini) na multirregião dos EUA da Google, e os recibos anexados são visíveis para os membros do grupo."
useCasesHeading: "Onde os recibos se acumulam"
faq:
  heading: "Perguntas"
  items:
    - q: "Consegue dividir um recibo por item?"
      a: "Não. Preenche a despesa, incluindo o total, e tu divides-a em partes iguais, por valores exatos ou por percentagem. Para uma conta em que cada pessoa pediu coisas diferentes, introduz o que cada uma deve como valores exatos. [Dividir despesas](page:feature/split-expenses) tem os detalhes."
    - q: "Consegue ler um PDF?"
      a: "Não. Podes anexar um PDF a uma despesa para ele viajar com os números, mas só as imagens são lidas."
    - q: "Há limite de digitalizações?"
      a: "Não há créditos de digitalização que se esgotem, e a digitalização é grátis. Os ficheiros têm limites, que são até três anexos por despesa e 10 MB cada. [O que o grátis inclui](page:pricing) tem o resto."
    - q: "Quem pode ver o meu recibo?"
      a: "Os membros do grupo podem ver os recibos anexados a uma despesa. As imagens dos recibos também são lidas pelo serviço de IA da Google, que é como o formulário fica preenchido."
    - q: "Posso digitalizar um recibo de uma despesa que já adicionei?"
      a: "Não, a digitalização é para despesas novas. Podes na mesma anexar um recibo a uma despesa existente, e ele é guardado sem ser lido."
    - q: "E se preencher algo errado?"
      a: "Escreve por cima. Todos os campos continuam editáveis até guardares, e deves verificá-los todos de qualquer maneira. Se a digitalização falhar ou não estiver disponível, adiciona a despesa à mão como de costume."
