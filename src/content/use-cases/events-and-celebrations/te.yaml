meta:
  title: "పార్టీలు, పెళ్లిళ్లు, గ్రూప్ బహుమతుల ఖర్చులను పంచండి"
  description: "అందరూ వేర్వేరు మొత్తాలు ఇచ్చినప్పుడు పార్టీ, పెళ్లి లేదా గ్రూప్ బహుమతి ఖర్చులను పంచుకోండి. ప్లాన్‌పై ఓటు వేయండి, ఖచ్చితమైన మొత్తాలతో పంచండి, ఎవరు ఎవరికి బాకీనో చూడండి."
h1: "పార్టీలు, పెళ్లిళ్లు, గ్రూప్ బహుమతుల ఖర్చులను పంచండి"
navLabel: "ఈవెంట్లు, వేడుకలు"
lead: "డిపాజిట్లు, అలంకరణలు, అత్యవసర గొడుగుల ఖర్చు పంచండి. కూర్చునే ఏర్పాటు మాత్రం ధైర్యం ఉన్నవాళ్లకు వదిలేయండి. Side Badger **ఎవరు ఎంత ఇచ్చారో** ఒకే చోట ఉంచుతుంది, దాంతో నిర్వాహకులు కూడా పార్టీని ఆస్వాదించవచ్చు."
cta:
  heading: "తర్వాతి వేడుకతో మొదలుపెట్టండి"
  body: "ఖాతా తెరవండి, ఈవెంట్ కోసం గ్రూప్ చేయండి, ఆహ్వాన లింక్ పంపండి. Side Badger ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
  button: "ఉచిత ఖాతా తెరవండి"
scenario:
  heading: "అందరూ ఇస్తారు, ఎప్పుడూ ఒకే మొత్తం కాదు"
  body: "ఒకరు వేదిక డిపాజిట్ చెల్లిస్తారు, మరొకరు కేక్ కొంటారు, మూడో వ్యక్తి గ్రూప్ బహుమతిని తన కార్డుపై పెడతారు. కొందరు అతిథులు అన్నింటికీ వస్తారు, కొందరు డిన్నర్‌కు మాత్రమే. దీని న్యాయమైన లెక్కను చాట్ థ్రెడ్‌లో ఉంచడం ఎవరూ దరఖాస్తు చేయని పని. Side Badger గ్రూప్ మొత్తాల కలయిక ఏదైనా అన్నింటినీ పట్టుకుంటుంది, ప్రతి వ్యక్తికి వాళ్లు ఏం ఇవ్వాలో లేదా ఏం రావాలో చూపుతుంది. ప్రాథమిక అంశాల కోసం [ఎలా పనిచేస్తుంది](page:how-it-works) చూడండి, లేదా ఈవెంట్ కోసం చదువుతూ ఉండండి."
sections:
  - heading: "కలిసి నిర్ణయించండి"
    body: "డబ్బు కదిలే ముందు ఎంపికను **పోల్‌**కు పెట్టండి. రెండు వేదికలు లేదా మూడు బహుమతి ఆలోచనల లాంటి 10 ఎంపికల వరకు జోడించి, అందరినీ ఓటు వేయనివ్వండి. ఎవరు ఎవరికి ఓటు వేశారో దాచవచ్చు, దాంతో ప్రతి ఎంపికకూ న్యాయమైన పరిశీలన దొరుకుతుంది, పోల్ మూసివేశాక విజేత కనిపిస్తుంది. ఏం నిర్ణయించారో తెలుసుకోవడానికి ఎవరూ నలభై సందేశాలు వెనక్కి స్క్రోల్ చేయాల్సిన పని లేదు."
  - heading: "ఎవరు దేనిలో ఉన్నారు"
    body: "అందరూ సమానంగా చెల్లించరు, అందరూ ప్రతి ఖర్చులో భాగం కాదు. ఖర్చును సమానంగా, శాతంతో లేదా **ఖచ్చితమైన మొత్తాలతో** పంచండి, అప్పుడు ప్రతి వ్యక్తి వాటా మీరు అంగీకరించిన అంకెనే అవుతుంది. డిన్నర్ మానేసిన అతిథులు లేదా బహుమతిలో చేరని స్నేహితుల లాంటి, భాగం కాని వాళ్లను వదిలేయండి. ప్రతి ఖర్చును ఒక్కరే చెల్లిస్తారు, పంపకంలో ఉన్న మిగతా అందరూ తమ వాటాను వారికే బాకీ. వివరాలు [ఖర్చుల పంపకం](page:feature/split-expenses) పేజీలో ఉన్నాయి."
  - heading: "కాగితాలు భద్రపరచండి"
    body: "ఖర్చుకు నోట్‌లు జోడించండి, ఆ ఖర్చు దేన్ని కవర్ చేసిందో లాంటివి. కామెంట్‌లు అవి దేని గురించో ఆ **ఖర్చు పక్కనే** ఉంటాయి, కాబట్టి “కేక్ £45 ఆ లేక £54 ఆ?” అనే ప్రశ్న, దాని సమాధానం ఒకే చోట ఉంటాయి. కామెంట్‌లు 500 అక్షరాల వరకు ఉండవచ్చు, డిపాజిట్ గురించి అడగడానికి ఇది సరిపోతుంది."
  - heading: "నిర్వాహకుల నియంత్రణలు"
    body: "ఓపెన్ సహకారం ఏ సభ్యుడైనా ఖర్చులను జోడించడానికి, సవరించడానికి అనుమతిస్తుంది, చిన్న బహుమతికి ఇది సరిపోతుంది. పెళ్లి లేదా పెద్ద పార్టీకి **మేనేజ్డ్ గ్రూప్** ప్రీసెట్ ఎంచుకోండి. అడ్మిన్లు ప్రతి కొత్త సభ్యుడిని ఆమోదిస్తారు, సృష్టికర్తలు, అడ్మిన్లు మాత్రమే ఖర్చులను మార్చగలరు. లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి; ఆమోదం ఆన్‌లో ఉంటే అడ్మిన్ ప్రతి ఒక్కరినీ లోపలికి రానిస్తారు, కాబట్టి అతిథి జాబితా అతిథి జాబితాగానే ఉంటుంది. ఈవెంట్ ముగిశాక, అంకెలు ఉన్నచోటే ఉండేలా గ్రూప్‌ను లాక్ చేయండి."
  - heading: "పార్టీ తర్వాత లెక్క తేల్చండి"
    body: "చివరి ఇన్వాయిస్ వచ్చాక, బ్యాలెన్స్‌లు **ఎవరు ఎవరికి బాకీనో** చూపుతాయి, Side Badger అందరి లెక్క తేల్చే పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత గ్రూప్‌లో పేమెంట్‌ను రికార్డ్ చేయండి. Side Badger డబ్బును ఎప్పుడూ కదిలించదు, కాబట్టి లెక్కను గ్రూప్ ఉంచుతుంది, బదిలీలు మీ సొంత బ్యాంకింగ్ యాప్‌లలో జరుగుతాయి. చిక్కు చిన్న జాబితాగా ఎలా మారుతుందో [లెక్క తేల్చడం](page:feature/settle-up) పేజీ చూపుతుంది."
exampleAfter: 5
