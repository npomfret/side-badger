meta:
  title: "그룹 관리와 공동 지출 권한 설정 | 사이드 배저"
  description: "링크나 QR 코드로 초대하고, 가입을 승인하고, 뷰어를 두고, 권한을 정하고, 끝나면 그룹을 잠그세요. 우리 그룹의 규칙은 우리가, 상식선에서."
h1: "그룹 관리와 권한: 규칙은 여러분이 정하되, 상식선에서"
navLabel: "그룹과 권한"
lead: "어떤 그룹에는 총무가 필요합니다. 사이드 배저에는 그걸 위한 설정이 있어요. 링크나 QR 코드로 사람들을 초대하고, 누가 들어올지 정하고, 누가 숫자를 바꿀 수 있는지 고르세요. 친구 몇 명의 작은 그룹은 이 모든 걸 무시해도 됩니다. 새 그룹은 활짝 열린 채로 시작하니까요."
cta:
  heading: "깔끔한 그룹을 운영할 준비가 되셨나요?"
  body: "계정을 만들고, 그룹을 시작하고, 초대 링크를 보내세요. 열어 둬도 되고, 그룹이 커지거나 까다로워지면 규칙을 조이면 됩니다."
problem:
  heading: "누군가는 숫자를 깔끔하게 관리해야 합니다"
  body: "룸메이트 네 명은 믿음만으로 굴러갈 수 있습니다. 결혼식 주말의 손님 서른 명은 아마 어렵겠죠. 집, 여행, 행사마다 최대 50명까지 그룹을 만드세요. 그룹마다 자기만의 멤버, 역할, 규칙이 있습니다. 대시보드 한 화면에 모든 그룹이, 각 그룹에서 내 상황과 함께 나열됩니다. 대부분의 그룹은 설정을 건드리지 않아요. 건드리는 그룹에는 대개 그걸 원할 만큼 체계적인 사람이 있습니다."
workflow:
  heading: "빈 그룹에서 잠긴 그룹까지"
  steps:
    - title: "링크나 QR 코드로 초대하기"
      body: "**다른 사람 초대**를 열고, 링크가 유지될 시간(15분, 1시간, 1일 또는 5일)을 고른 다음, 링크를 복사하거나 QR 코드를 보여 주어 스캔하게 하세요. 이미 다른 그룹을 함께하고 있는 사람은 앱 안에서 바로 초대할 수도 있습니다."
      shot: S03
      shotAlt: "그룹 링크, QR 코드, 링크 유지 시간 선택이 보이는 초대 창"
    - title: "가입 전에 먼저 둘러보게 하기"
      body: "링크를 받은 사람은 로그인하거나 계정을 만든 다음, 그룹 미리 보기를 보고 그 그룹에서 쓸 이름을 고릅니다. 그런 다음 **그룹 가입**을 누릅니다."
      shot: S04
      shotAlt: "로그인한 사람이 가입하기 전에 보는 그룹 가입 미리 보기"
    - title: "가입을 승인하기"
      body: "승인을 켜면 링크로 들어온 사람은 관리자가 들여보낼 때까지 대기 중인 멤버로 기다립니다. 관리자는 **보안 및 권한**의 **대기 중인 멤버**에서 이들을 찾아 **승인** 또는 **거절**을 선택합니다. 그때까지 대기 중인 사람은 그룹 안의 아무것도 볼 수 없습니다."
      shot: S14
      shotAlt: "관리자의 승인 또는 거절을 기다리는 대기 중인 멤버"
    - title: "누가 무엇을 바꿀 수 있는지 고르기"
      body: "**공개 협업**이나 **관리 그룹**을 고르거나, 권한을 하나씩 직접 설정하세요. 그런 다음 사람마다 관리자, 멤버, 뷰어 중 역할을 주세요. 권한과 역할은 관리자만 바꿀 수 있습니다."
      shot: S13
      shotAlt: "두 가지 사전 설정과 사용자 지정 권한이 있는 그룹 설정의 보안 탭"
    - title: "끝나면 잠그기"
      body: "여행이 끝나고 숫자가 정리되면 관리자가 **그룹 잠금**을 켤 수 있습니다. 그러면 아무도 지출을 추가하거나 바꿀 수 없고, 결제를 기록하거나 목록과 투표를 수정할 수도 없으며, 배너가 그 사실을 알려 줍니다. 이제 아무도 슬쩍 늦은 택시비를 끼워 넣을 수 없어요. 정말로 하나 나타나면 관리자가 그룹 잠금을 해제할 수 있습니다."
      shot: S15
      shotAlt: "그룹이 잠겨 있다고 알리는 배너가 보이는 그룹"
options:
  heading: "관리자, 멤버, 뷰어"
  items:
    - title: "관리자"
      body: "그룹을 운영합니다. 관리자는 새 멤버를 승인하고, 역할과 권한을 바꾸고, 그룹을 잠그고 잠금 해제하고, 닫을 수 있어요. 그룹을 만든 사람이 처음에는 관리자이고, 그룹에 관리자가 없는 상태는 생기지 않습니다. 마지막 관리자는 강등할 수 없기 때문이에요."
    - title: "멤버"
      body: "참여합니다. 멤버가 할 수 있는 일은 그룹의 권한에 따라 달라요. 공개 협업 그룹에서는 거의 모든 일을 할 수 있습니다. 관리 그룹에서는 멤버가 자신이 만든 지출과 목록만 바꿀 수 있습니다."
    - title: "뷰어"
      body: "모든 것을 보고 아무것도 바꾸지 않습니다. 뷰어는 지출이나 목록을 추가하거나 수정할 수 없고, 사람을 초대하거나 설정을 바꾸거나 헤더 이미지를 건드릴 수도 없습니다. 숫자는 지켜보고 싶지만 만지작거리지는 않겠다고 약속하는 사람에게 딱 좋아요."
sections:
  - heading: "공개, 관리, 또는 직접 정한 규칙"
    body: "새 그룹은 **공개 협업**으로 시작합니다. 모두가 사람을 초대하고, 지출을 바꾸고, 목록을 수정할 수 있고, 새 멤버는 자동으로 가입해요. **관리 그룹**은 누군가 어른 역할을 해야 할 때 쓰세요. 일곱 가지 권한을 하나씩 따로 설정할 수도 있고, 하나를 직접 바꾸면 그룹이 사용자 지정으로 전환됩니다. 무엇을 고르든 권한 자체를 바꿀 수 있는 건 관리자뿐이고, 모든 변경은 활동 피드에 나타납니다. [룸메이트](page:use-case/housemates) 집은 전부 열어 둬도 됩니다. 규모가 큰 [행사나 기념 모임](page:use-case/events-and-celebrations)은 누가 들어오는지 책임지는 사람이 있도록 관리 그룹이 필요한 경우가 많아요. 이 모든 게 처음이라면 [사용 방법](page:how-it-works)에서 첫 지출부터 정산 완료까지 전체 여정을 따라가 보세요."
    items:
      - "**비용을 편집할 수 있는 사람.** 공개 협업: 모든 멤버. 관리 그룹: 생성자 및 관리자."
      - "**비용을 삭제할 수 있는 사람.** 공개 협업: 모든 멤버. 관리 그룹: 생성자 및 관리자."
      - "**목록을 편집할 수 있는 사용자.** 공개 협업: 모든 멤버. 관리 그룹: 생성자 및 관리자."
      - "**멤버를 초대할 수 있는 사람.** 공개 협업: 모든 멤버. 관리 그룹: 관리자만."
      - "**새 멤버 승인.** 공개 협업: 자동. 관리 그룹: 관리자 승인 필요."
      - "**설정을 변경할 수 있는 사람.** 공개 협업: 모든 멤버. 관리 그룹: 관리자만."
      - "**헤더 이미지를 변경할 수 있는 사용자.** 공개 협업: 모든 멤버. 관리 그룹: 관리자만."
  - heading: "내 이름, 내 사진, 헤더 이미지"
    body: "그룹마다 자기만의 출연진 명단이 있어요. 각 그룹에서 사람들에게 보일 이름(2자에서 50자까지, 그룹 안에서 중복 불가)과 내 프로필 사진 중 어떤 것을 쓸지 고르세요. 집에서는 **Sam**, 여행에서는 **Sam (차 있음)**이 될 수 있습니다. 설정을 바꿀 수 있는 사람은 누구나 그룹 이름을 바꾸고 설명을 편집할 수 있어요. 헤더 이미지(JPEG, PNG, GIF 또는 WebP, 최대 10 MB)에는 별도의 권한이 있습니다."
  - heading: "보관, 잠금, 닫기"
    body: "그룹을 치워 두는 세 가지 방법을 덜 심각한 것부터 심각한 것 순으로 소개합니다."
    items:
      - "**보관**은 그룹을 내 대시보드에서만 숨기고 다른 사람의 대시보드는 그대로입니다. 여전히 열어서 전처럼 쓸 수 있고, **그룹 보관 취소**로 되돌릴 수 있어요."
      - "**잠금**은 관리자가 해제할 때까지 변경을 막습니다. 모두가 여전히 그룹과 그 내역을 읽을 수 있어요."
      - "**닫기**는 영구적이고 모두에게 적용됩니다. 관리자만 할 수 있고, 확인을 위해 그룹 이름을 입력해야 하며, 이후에는 아무도 그룹을 다시 열 수 없습니다."
  - heading: "그룹 나가기"
    body: "정산을 마치면 누구든 나갈 수 있습니다. 한 통화로라도 줄 돈이나 받을 돈이 있거나, 지출에 대한 열린 질문에 내가 관련되어 있거나, 내가 마지막 관리자이거나 유일한 멤버라면 나갈 수 없어요. [결제를 기록](page:feature/settle-up)하거나, [지출 질문](page:guide/what-to-do-when-someone-disputes-a-shared-expense)을 정리하거나, 다른 사람을 관리자로 만든 다음 나가세요. 다시 돌아오려면 새 초대가 필요합니다."
limits:
  heading: "상식선에서: 작은 글씨"
  items:
    - "그룹에는 최대 50명이 들어갈 수 있습니다."
    - "권한과 역할은 관리자만 바꿀 수 있습니다. 마지막 관리자는 강등할 수 없습니다."
    - "지출 편집을 **관리자만**으로 설정하면 관리자만 지출을 추가할 수 있다는 뜻이기도 합니다."
    - "잠금은 지출 변경, 새 결제, 목록, 투표를 막습니다. 모두가 여전히 그룹과 그 내역을 읽고 결제에 반응할 수 있어요."
    - "닫기는 영구적입니다. 앱에는 닫힌 그룹을 다시 여는 방법이 없습니다."
    - "새 초대 링크를 만들어도 기존 링크는 취소되지 않습니다. 각 링크는 자기 만료 시점까지 유효하므로, 링크가 어디로 흘러갈지 불안하다면 짧은 것을 고르세요."
    - "앱 내 초대는 내가 가장 최근에 활동한 그룹 10개에서 사람들을 보여 줍니다. 그 밖의 사람에게는 링크가 필요하고, 누가 초대할 수 있는지는 그룹의 권한에 따라 달라집니다."
    - "가입하려면 계정이 필요하고, 무언가를 추가하려면 먼저 이메일을 인증해야 합니다."
useCasesHeading: "약간의 질서가 도움이 되는 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "뷰어가 지출을 추가할 수 있나요?"
      a: "아니요. 뷰어는 모든 것을 보지만 아무것도 바꾸지 못합니다. 지출이나 목록을 추가하거나 수정할 수 없고, 사람을 초대하거나 설정을 바꿀 수도 없어요."
    - q: "돈을 빚진 채로 나갈 수 있나요?"
      a: "아니요. 한 통화로라도 줄 돈이나 받을 돈이 있으면 그룹을 나갈 수 없습니다. 먼저 정산하고 나가세요."
    - q: "그룹을 닫으면 어떻게 되나요?"
      a: "아무도 다시 열 수 없습니다. 관리자만 그룹을 닫을 수 있고, 확인을 위해 그룹 이름을 입력해야 하며, 그룹은 모두에게 이용할 수 없게 됩니다. 변경만 막고 싶다면 잠그세요. 내 대시보드에서만 치우고 싶다면 보관하세요."
    - q: "잠금을 되돌릴 수 있나요?"
      a: "네. 관리자가 그룹 잠금을 해제하면 다시 변경할 수 있어요."
    - q: "사람들이 가입하기 전에 꼭 승인해야 하나요?"
      a: "원할 때만요. 새 그룹은 공개 협업으로 시작하고, 링크를 쓰는 사람은 자동으로 가입합니다. 관리자 승인을 켜거나 관리 그룹을 고르면 각 사람이 관리자가 들여보낼 때까지 기다립니다."
    - q: "그룹에 몇 명까지 들어갈 수 있나요?"
      a: "최대 50명입니다."
