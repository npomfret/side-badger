meta:
  title: "قوائم واستطلاعات وتعليقات مشتركة لمصروفات المجموعة | Side Badger"
  description: "علّق على المصروفات، واستفسر عن المصروف الغريب، وأبقِ قائمة تسوق مشتركة، وصوّت على الفيلا. خططوا للإنفاق معاً ثم قسّموه. مجاني وبلا إعلانات."
h1: "خططوا معاً، وقسّموا بعد ذلك"
navLabel: "التخطيط معاً"
lead: "قائمة التسوق وفاتورة التسوق، وقد عادتا أخيراً إلى الحديث معاً. يمنح Side Badger مجموعتك مكاناً للكلام عن المال قبل إنفاقه وبعده، مع تعليقات على كل مصروف، وطريقة للاستفسار عن المصروفات التي تبدو خاطئة، وقوائم مشتركة واستطلاعات للقرارات الكبيرة. ثم [تقسّمون المصروفات](page:feature/split-expenses) كالمعتاد."
cta:
  heading: "خططوا، ثم قسّموا"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة، وضع أول قائمة أو استطلاع أو استفسار بجانب المال مباشرة. لست متأكداً مما سيحدث بعد ذلك؟ انظر [كيف يعمل](page:how-it-works)."
problem:
  heading: "الدردشة هنا، والفاتورة هناك"
  body: "عادةً ما يعيش إنفاق المجموعة في مكانين. الأرقام في أحدهما، والجدال حول الأرقام في دردشة اختفت بالتمرير يوم الثلاثاء. وقائمة التسوق صورة لثلاجة. والفيلا حُسمت بإبهام مرفوع من معظم الناس، على الأرجح. يُبقي Side Badger التخطيط داخل المجموعة، بجانب المصروفات التي يخصها، فيكون هناك تعليق حيث التكلفة، وقائمة حيث المتجر، واستطلاع للقرار الكبير، وطريقة لقول «لحظة، هل هذا صحيح؟» دون كتابة فقرة كاملة. وكل ذلك يبقى متعلقاً بمال المجموعة، وهذا هو سبب وجود المجموعة."
workflow:
  heading: "من التصويت على الفيلا إلى فاتورة التسوق"
  steps:
    - title: "اطرح القرار الكبير للتصويت"
      body: "أضف استطلاعاً للقرار الذي يحدد الفاتورة، مثل أي فيلا. اختر من خيارين إلى عشرة خيارات، وحدّد عدد الأصوات لكل شخص، ثم أغلقه حين يدلي الجميع بأصواتهم، فيُعلَّم الفائز."
      shot: S17
      shotAlt: "استطلاع مغلق مع تعليم الخيار الفائز وعدد الأصوات بجانب كل خيار"
    - title: "اكتبوا قائمة التسوق معاً"
      body: "ابدأ قائمة مشتركة، وأضف العناصر، وضع علامة عليها حين تصل إلى العربة. وبعد التسوق تضيف الفاتورة مصروفاً."
      shot: S16
      shotAlt: "قائمة تسوق مشتركة عليها علامات على بعض العناصر وعدّاد للتقدم"
    - title: "تحدثوا عن التكلفة حيث تعيش"
      body: "علّق على المصروف نفسه، وأرفق الإيصال، وتفاعل برمز تعبيري. يبقى الحديث بجانب الرقم الذي يخصه."
      shot: S08
      shotAlt: "مصروف بتفاصيله، وصورة مصغّرة للإيصال، وسلسلة تعليقات، وتفاعلات برموز تعبيرية"
    - title: "استفسر عن المصروف الذي يبدو غريباً"
      body: "إذا فعّلت المجموعة أسئلة المصروفات، يستطيع كل من يشمله المصروف اختيار **لدي سؤال**. ويبقى المصروف خارج الأرصدة إلى أن يُحسم السؤال."
      shot: S18
      shotAlt: "قائمة المصروفات مع شارة «مستفسر عنه» ومرشّح «المستفسر عنها فقط»"
    - title: "اعرف ما تغيّر ومن غيّره"
      body: "يعرض سجل النشاط وجرس الإشعارات ما الجديد في مجموعاتك. والإشعارات الفورية متاحة إن أردتها."
      shot: S19
      shotAlt: "القائمة المنسدلة للإشعارات مع قائمة بالنشاط الأخير"
