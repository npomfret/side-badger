meta:
  title: "Τακτοποιηθείτε με λιγότερες πληρωμές | Side Badger"
  description: "Δείτε ποιος χρωστά σε ποιον στην ομάδα σας, πάρτε μια σύντομη λίστα πληρωμών που τακτοποιεί όλους και καταγράψτε κάθε πληρωμή όταν γίνεται. Δωρεάν."
h1: "Τακτοποιηθείτε με λιγότερες πληρωμές"
navLabel: "Εκκαθάριση"
lead: "Το Side Badger κρατά ένα τρέχον υπόλοιπο για όλους στην ομάδα και προτείνει μια σύντομη λίστα πληρωμών που το τακτοποιεί. Πληρώνετε ο ένας τον άλλον όπως θέλετε και μετά το καταγράφετε. Αν θέλετε να δείτε πρώτα πώς μοιράζονται τα ποσά, ξεκινήστε από τον [διαχωρισμό εξόδων](page:feature/split-expenses)."
cta:
  heading: "Έτοιμοι να ξεμπερδέψετε ποιος χρωστά σε ποιον;"
  body: "Δημιουργήστε λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το πρώτο έξοδο. Τα υπόλοιπα θα αναλάβουν τα υπόλοιπα."
  button: "Δημιουργία δωρεάν λογαριασμού"
problem:
  heading: "Υπόλοιπα που ενημερώνονται καθώς προχωράτε"
  body: "Κάθε έξοδο αλλάζει το ποιος χρωστά σε ποιον, οπότε το Side Badger διατηρεί τα υπόλοιπα ενημερωμένα καθώς προστίθενται έξοδα και πληρωμές. Όλοι στην ομάδα βλέπουν μια αλλαγή αμέσως, καθώς και τι άλλαξε και ποιος την έκανε. Τα υπόλοιπα τηρούνται ανά νόμισμα, οπότε τα ευρώ και οι λίρες μένουν στις δικές τους στήλες, εκτός αν ένα έξοδο μετατράπηκε όταν καταχωρίστηκε. Από προεπιλογή βλέπετε τα χρέη που σας αφορούν· η **Προβολή όλων** εμφανίζει ολόκληρη την ομάδα."
workflow:
  heading: "Τρία βήματα ως το πάτσι"
  steps:
    - title: "Δείτε ποιος χρωστά σε ποιον"
      body: "Ανοίξτε τα υπόλοιπα της ομάδας για να δείτε τι χρωστάτε, τι σας οφείλουν και μια σύντομη λίστα πληρωμών που τακτοποιεί όλους, υπολογισμένη ανά νόμισμα. Τα αμφισβητημένα έξοδα μένουν εκτός αθροισμάτων μέχρι να ξεκαθαρίσουν. Στο παράδειγμα με τους συγκατοίκους παρακάτω, έξι πληρωμές γίνονται δύο."
      shot: S10
      shotAlt: "Η οθόνη υπολοίπων με απλοποιημένα χρέη σε δύο νομίσματα και ενεργοποιημένη την Προβολή όλων"
    - title: "Πληρώστε όπως θέλετε και μετά καταγράψτε το"
      body: "Τραπεζική μεταφορά, μετρητά, μια χάρη από τις περσινές διακοπές. Το Side Badger δεν μετακινεί τα χρήματα. Μόλις αλλάξουν χέρια, καταγράψτε την πληρωμή και το υπόλοιπο ενημερώνεται για όλους."
      shot: S11
      shotAlt: "Η φόρμα πληρωμής με κουμπιά γρήγορης τακτοποίησης και την ειδοποίηση που εμφανίζεται σε μερική πληρωμή"
    - title: "Ελέγξτε ότι έφτασε"
      body: "Η πληρωμή μπαίνει στο ιστορικό της ομάδας, όπου μπορεί να τη δει ο καθένας στην ομάδα και να αντιδράσει με ένα emoji. Γιορτάστε μια πληρωμή όταν φτάσει."
      shot: S12
      shotAlt: "Το ιστορικό πληρωμών με αντιδράσεις emoji σε μια πληρωμή"
