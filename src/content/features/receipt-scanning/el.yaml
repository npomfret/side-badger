meta:
  title: "Σαρώστε μια απόδειξη για να προσθέσετε έξοδο | Side Badger"
  description: "Ο ασβός διαβάζει την απόδειξη. Συμπληρώνει σύνολο, ημερομηνία και τόπο για να τα ελέγξετε, χωρίς πιστώσεις σάρωσης. Την εικόνα διαβάζει η υπηρεσία AI της Google."
h1: "Σαρώστε την απόδειξη, ελέγξτε τα στοιχεία, χωρίστε την"
navLabel: "Σάρωση αποδείξεων"
lead: "Αφήστε τον ασβό να διαβάσει την απόδειξη και ελέγξτε την εργασία του. Προσθέστε μια φωτογραφία σε ένα νέο έξοδο και το Side Badger συμπληρώνει το σύνολο, την ημερομηνία και τον τόπο για να τα ελέγξετε. Μετά το [χωρίζετε](page:feature/split-expenses) όπως κάθε άλλο έξοδο. Η σάρωση είναι δωρεάν, χωρίς πιστώσεις σάρωσης. Συμπληρώνει ένα έξοδο και δεν χωρίζει τον λογαριασμό ανά είδος. Οι εικόνες αποδείξεων διαβάζονται από την υπηρεσία AI της Google."
cta:
  heading: "Φωτογραφίστε. Ελέγξτε. Χωρίστε."
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε ένα έξοδο με φωτογραφία απόδειξης. Δείτε τι συμπληρώνει, αλλάξτε ό,τι δεν είναι σωστό και αποθηκεύστε όταν μείνετε ευχαριστημένοι."
problem:
  heading: "Κανείς δεν θέλει να πληκτρολογεί μια απόδειξη στην ουρά για ταξί"
  body: "Τα ταξίδια και οι μεγάλες βραδιές έξω έρχονται με χαρτιά. Το δείπνο, το ταξί, ο γύρος που έγινε έξι. Το να πληκτρολογείτε το καθένα σε ένα κινητό με παγωμένους αντίχειρες και ουρά πίσω σας είναι ο τρόπος που ξεχνιούνται τα έξοδα. Γι' αυτό το Side Badger διαβάζει την απόδειξη για εσάς. Κάνει το πρώτο προσχέδιο και εσείς τον έλεγχο. Ταιριάζει στα [ομαδικά ταξίδια](page:use-case/group-trips) και στις [εκδηλώσεις και γιορτές](page:use-case/events-and-celebrations), όπου οι αποδείξεις στοιβάζονται πιο γρήγορα απ' όσο θέλει κανείς να τις χειριστεί."
workflow:
  heading: "Από τη φωτογραφία στο έξοδο σε τρία βήματα"
  steps:
    - title: "Προσθέστε μια απόδειξη σε ένα νέο έξοδο"
      body: "Ξεκινήστε ένα νέο έξοδο και πατήστε **Σάρωση απόδειξης** ή χρησιμοποιήστε τη γρήγορη ενέργεια **Σάρωση απόδειξης** στον πίνακα ελέγχου σας. Βγάλτε μια φωτογραφία ή διαλέξτε μία που έχετε ήδη. Δουλεύει και η επιλογή **Προσθήκη απόδειξης ή συνημμένου** στη φόρμα."
    - title: "Αφήστε το να διαβάσει την απόδειξη"
      body: "Η φόρμα γράφει **Ανάλυση απόδειξης...** όσο το AI του Side Badger διαβάζει την εικόνα. Μετά συμπληρώνει ό,τι βρήκε, όπως την περιγραφή, το σύνολο, το νόμισμα, την ημερομηνία, την ώρα και τον τόπο. Ό,τι είχατε ήδη πληκτρολογήσει μένει ως έχει."
      shot: S09
      shotAlt: "Η φόρμα νέου εξόδου που δείχνει Ανάλυση απόδειξης... και μετά η ίδια φόρμα με συμπληρωμένα τα στοιχεία"
    - title: "Ελέγξτε το, μετά χωρίστε το"
      body: "Συγκρίνετε τη φόρμα με το χαρτί. Διορθώστε ό,τι δεν είναι σωστό, πείτε ποιος πλήρωσε και ποιοι μοιράστηκαν το κόστος, διαλέξτε πώς θα χωριστεί και αποθηκεύστε. Το έξοδο δεν υπάρχει μέχρι να αποθηκεύσετε. Το πώς χωρίζεται καλύπτεται στον [διαχωρισμό εξόδων](page:feature/split-expenses)."
options:
  heading: "Επιλογές"
  items: []
sections:
  - heading: "Τι συμπληρώνει"
    body: "Προσθέστε μια εικόνα απόδειξης σε ένα νέο έξοδο και αυτά τα πεδία μπορούν να συμπληρωθούν. Το ποιος πλήρωσε, ποιοι μοιράστηκαν το κόστος και πώς θα χωριστεί παραμένει δική σας δουλειά."
    items:
      - "Μια **περιγραφή** για το έξοδο."
      - "Το **σύνολο**."
      - "Το **νόμισμα**, αν το επιτρέπει η ομάδα σας."
      - "Η **ημερομηνία** και η **ώρα**."
      - "Ο **τόπος**."
      - "Ένα αντίγραφο κειμένου της απόδειξης στις **σημειώσεις**, για όταν το χάρτινο ξεθωριάσει ή περάσει από πλύση."
  - heading: "Τι εξακολουθείτε να ελέγχετε"
    body: "Τα πάντα. Αντιμετωπίστε ό,τι συμπληρώνει ως προσχέδιο. Ελέγξτε το σύνολο με το χαρτί και μετά το νόμισμα, την ημερομηνία και τον τόπο. Θολές φωτογραφίες και τσαλακωμένο χαρτί μπορούν να ξεγελάσουν κάθε αναγνώστη και δεν υποσχόμαστε ότι διαβάζει σωστά κάθε απόδειξη, οπότε κοιτάξτε πριν αποθηκεύσετε. Αν κάτι δεν είναι σωστό, πληκτρολογήστε από πάνω. Αν η απόδειξη είναι σε γεν και η ομάδα τακτοποιείται σε λίρες, τα [πολλά νομίσματα](page:feature/multiple-currencies) εξηγούν τι γίνεται μετά."
  - heading: "Κρατήστε την απόδειξη μαζί με το έξοδο"
    body: "Σαρωμένη ή όχι, μια απόδειξη μπορεί να μείνει μαζί με το έξοδο. Επισυνάψτε φωτογραφίες ή PDF, έως τρία ανά έξοδο και έως 10 MB το καθένα. Τα μέλη της ομάδας τα βλέπουν στο έξοδο. Οι εικόνες εμφανίζονται ως μικρογραφίες που ανοίγουν σε πρόγραμμα προβολής και τα PDF ανοίγουν ως σύνδεσμοι. Επισυνάπτεται και η φωτογραφία που σαρώνετε, εκτός αν την αφαιρέσετε πριν αποθηκεύσετε. Όταν κάποιος ρωτήσει πόσο κόστισε πραγματικά εκείνο το δείπνο, η απόδειξη είναι εκεί."
  - heading: "Πού πηγαίνει η απόδειξή σας"
    body: "Οι εικόνες αποδείξεων διαβάζονται από την υπηρεσία AI της Google. Για να συμπληρωθεί η φόρμα, η εικόνα διαβάζεται από το Google Vertex AI (Gemini) στο US multi-region της Google. Προσθέστε μια εικόνα σε ένα νέο έξοδο και διαβάζεται. Ένα PDF ή μια φωτογραφία που προστίθεται σε ένα έξοδο που υπάρχει ήδη αποθηκεύεται χωρίς να διαβαστεί. Οι αποδείξεις που επισυνάπτετε είναι ορατές στα μέλη της ομάδας, οπότε αν μια απόδειξη δείχνει κάτι που προτιμάτε να μη μοιραστείτε, παραλείψτε τη φωτογραφία και πληκτρολογήστε εκείνο το έξοδο."
limits:
  heading: "Όρια"
  items:
    - "Μόνο εικόνες. JPEG, PNG και WebP, και HEIC αφού μετατραπεί. Τα PDF μπορούν να επισυναφθούν σε ένα έξοδο αλλά δεν διαβάζονται."
    - "Η σάρωση είναι μόνο για νέα έξοδα. Σε ένα υπάρχον έξοδο μπορείτε να επισυνάψετε αποδείξεις, αλλά τίποτα δεν διαβάζεται."
    - "Συμπληρώνει μόνο τα πεδία που δεν έχετε αγγίξει και το νόμισμα μόνο αν το επιτρέπει η ομάδα σας."
    - "Δεν χωρίζει ανά είδος ούτε αντιστοιχίζει γραμμές της απόδειξης σε άτομα. Συμπληρώνει ένα έξοδο και εσείς το χωρίζετε όπως συνήθως."
    - "Δεν υπάρχει υπόσχεση ότι όσα συμπληρώνει είναι σωστά ή ότι η σάρωση θα δουλεύει κάθε φορά. Ελέγξτε πριν αποθηκεύσετε και προσθέστε το έξοδο με το χέρι αν η σάρωση αποτύχει ή δεν είναι διαθέσιμη."
    - "Ένα έξοδο έχει έως τρία συνημμένα, καθένα έως 10 MB, ως JPEG, PNG, WebP, HEIC ή PDF."
    - "Οι εικόνες αποδείξεων διαβάζονται από το Google Vertex AI (Gemini) στο US multi-region της Google και οι αποδείξεις που επισυνάπτετε είναι ορατές στα μέλη της ομάδας."
useCasesHeading: "Εκεί που στοιβάζονται οι αποδείξεις"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορεί να χωρίσει μια απόδειξη ανά είδος;"
      a: "Όχι. Συμπληρώνει το έξοδο, μαζί με το σύνολο, και εσείς το χωρίζετε εξίσου, με ακριβή ποσά ή με ποσοστά. Για έναν λογαριασμό όπου ο καθένας παρήγγειλε διαφορετικά, βάλτε ό,τι χρωστά κάθε άτομο ως ακριβή ποσά. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) έχει τις λεπτομέρειες."
    - q: "Μπορεί να διαβάσει ένα PDF;"
      a: "Όχι. Μπορείτε να επισυνάψετε ένα PDF σε ένα έξοδο ώστε να ταξιδεύει μαζί με τους αριθμούς, αλλά διαβάζονται μόνο εικόνες."
    - q: "Υπάρχει όριο στις σαρώσεις;"
      a: "Δεν υπάρχουν πιστώσεις σάρωσης που να τελειώνουν και η σάρωση είναι δωρεάν. Τα αρχεία έχουν όρια: έως τρία συνημμένα ανά έξοδο και 10 MB το καθένα. Τα υπόλοιπα όρια θα τα βρείτε στο [τι καλύπτει το δωρεάν πακέτο](page:pricing)."
    - q: "Ποιος μπορεί να δει την απόδειξή μου;"
      a: "Τα μέλη της ομάδας βλέπουν τις αποδείξεις που έχουν επισυναφθεί σε ένα έξοδο. Οι εικόνες αποδείξεων διαβάζονται επίσης από την υπηρεσία AI της Google, και έτσι συμπληρώνεται η φόρμα."
    - q: "Μπορώ να σαρώσω μια απόδειξη για ένα έξοδο που έχω ήδη προσθέσει;"
      a: "Όχι, η σάρωση είναι για νέα έξοδα. Μπορείτε ακόμη να επισυνάψετε μια απόδειξη σε ένα υπάρχον έξοδο και αποθηκεύεται χωρίς να διαβαστεί."
    - q: "Τι γίνεται αν συμπληρώσει κάτι λάθος;"
      a: "Πληκτρολογήστε από πάνω. Κάθε πεδίο μένει επεξεργάσιμο μέχρι να αποθηκεύσετε και πρέπει να τα ελέγχετε όλα ούτως ή άλλως. Αν η σάρωση αποτύχει ή δεν είναι διαθέσιμη, προσθέστε το έξοδο με το χέρι όπως συνήθως."
