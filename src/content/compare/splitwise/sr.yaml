meta:
  title: "Side Badger или Splitwise: бесплатне ствари, упоређене | Side Badger"
  description: "Бесплатна алтернатива Splitwise-у, поштено упоређена. Скенирање рачуна, претварање валута и живот без огласа овде ништа не коштају, а наводимо у чему је Splitwise бољи."
h1: "Side Badger или Splitwise: бесплатне ствари, упоређене"
navLabel: "Side Badger или Splitwise"
lead: "Неко у твојој групи је вероватно рекао „користи Splitwise“. У реду. Side Badger је бесплатна веб апликација са скенирањем рачуна, претварањем валута и без огласа, и без претплате да се то откључа. Која одговара твојој групи зависи од тога шта јој треба, па ево поређења, са Splitwise-овом страном преузетом само са Splitwise-ових страница."
cta:
  heading: "Испробај на следећем заједничком рачуну"
  body: "Направи бесплатан кориснички налог, оснуј групу и додај један прави трошак. Ако није за тебе, потрошено је пар минута, а не претплата."
asOf: 2026-10-21
asOfNote: "Прочитали смо Splitwise-ове странице {date} да ти не мораш, и све овде о Splitwise-у потиче са њих. Сваки ред табеле води до свог извора. Планови се мењају, па проверавамо поново сваког квартала, а ако се Splitwise-ове странице не слажу са овом, веруј њима."
