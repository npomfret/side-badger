meta:
  title: "رسید اسکین کر کے خرچہ شامل کریں | Side Badger"
  description: "رسید بیجر کو پڑھنے دیں۔ وہ کل رقم، تاریخ اور جگہ آپ کے جانچنے کے لیے بھر دیتا ہے، بغیر اسکین کریڈٹس کے۔ تصویر کو گوگل کی AI سروس پڑھتی ہے۔"
h1: "رسید اسکین کریں، تفصیل جانچیں، تقسیم کریں"
navLabel: "رسید اسکین"
lead: "رسید بیجر کو پڑھنے دیں، اور اس کا ہوم ورک جانچیں۔ نئے خرچے میں تصویر شامل کریں اور Side Badger کل رقم، تاریخ اور جگہ آپ کے جانچنے کے لیے بھر دیتا ہے۔ پھر آپ اسے کسی بھی دوسرے خرچے کی طرح [تقسیم کرتے ہیں](page:feature/split-expenses)۔ اسکین مفت ہے، اسکین کریڈٹس کے بغیر۔ یہ ایک خرچہ بھرتا ہے اور بل کو آئٹم کے حساب سے تقسیم نہیں کرتا۔ رسید کی تصویر گوگل کی AI سروس پڑھتی ہے۔"
cta:
  heading: "کھینچیں۔ جانچیں۔ تقسیم کریں۔"
  body: "مفت اکاؤنٹ بنائیں، گروپ شروع کریں اور رسید کی تصویر کے ساتھ خرچہ شامل کریں۔ دیکھیں وہ کیا بھرتا ہے، جو غلط ہو اسے بدلیں، اور مطمئن ہوں تو محفوظ کریں۔"
problem:
  heading: "ٹیکسی کی قطار میں رسید ٹائپ کرنا کوئی نہیں چاہتا"
  body: "سفر اور بڑی راتوں کے ساتھ کاغذ آتا ہے۔ ڈنر، ٹیکسی، وہ دور جو چھ بن گیا۔ ٹھنڈے انگوٹھوں سے اور پیچھے قطار لگی ہو تو ہر ایک کو فون میں ٹائپ کرنا ہی وہ طریقہ ہے جس سے اخراجات بھول جاتے ہیں۔ اس لیے Side Badger رسید آپ کے لیے پڑھ لیتا ہے۔ پہلا مسودہ وہ بناتا ہے اور جانچ آپ کرتے ہیں۔ یہ [گروپ سفر](page:use-case/group-trips) اور [تقریبات اور جشن](page:use-case/events-and-celebrations) کے لیے موزوں ہے، جہاں رسیدیں اس رفتار سے جمع ہوتی ہیں جس سے نمٹنا کوئی نہیں چاہتا۔"
workflow:
  heading: "تصویر سے خرچے تک تین مراحل میں"
  steps:
    - title: "نئے خرچے میں رسید شامل کریں"
      body: "نیا خرچہ شروع کریں اور **رسید اسکین کریں** پر ٹیپ کریں، یا اپنے ڈیش بورڈ پر **رسید اسکین کریں** کا فوری عمل استعمال کریں۔ تصویر کھینچیں یا پہلے سے موجود چن لیں۔ فارم پر **رسید یا اٹیچمنٹ شامل کریں** بھی کام کرتا ہے۔"
    - title: "اسے رسید پڑھنے دیں"
      body: "جب تک Side Badger کی AI تصویر پڑھتی ہے فارم **رسید کا تجزیہ ہو رہا ہے...** دکھاتا ہے۔ پھر جو ملا وہ بھر دیتا ہے، جیسے تفصیل، کل رقم، کرنسی، تاریخ، وقت اور جگہ۔ جو آپ پہلے سے ٹائپ کر چکے ہوں اسے چھوا نہیں جاتا۔"
      shot: S09
      shotAlt: "نئے خرچے کا فارم جو رسید کا تجزیہ ہو رہا ہے... دکھا رہا ہے، پھر وہی فارم تفصیلات بھری ہوئی"
    - title: "جانچیں، پھر تقسیم کریں"
      body: "فارم کا کاغذ سے موازنہ کریں۔ جو غلط ہو ٹھیک کریں، بتائیں کس نے ادا کیا اور کس نے خرچے میں حصہ لیا، تقسیم کا طریقہ چنیں اور محفوظ کریں۔ جب تک آپ ایسا نہ کریں خرچہ وجود میں نہیں آتا۔ تقسیم کی تفصیل [اخراجات کی تقسیم](page:feature/split-expenses) میں ہے۔"
options:
  heading: "اختیارات"
  items: []
sections:
  - heading: "یہ کیا بھرتا ہے"
    body: "نئے خرچے میں رسید کی تصویر شامل کریں اور یہ خانے بھر سکتے ہیں۔ کس نے ادا کیا، کس نے حصہ لیا اور کیسے تقسیم ہو، یہ اب بھی آپ پر ہے۔"
    items:
      - "خرچے کی **تفصیل**۔"
      - "**کل رقم**۔"
      - "**کرنسی**، اگر آپ کا گروپ اجازت دے۔"
      - "**تاریخ** اور **وقت**۔"
      - "**جگہ**۔"
      - "**نوٹس** میں رسید کی متنی نقل، تب کے لیے جب کاغذی رسید مدھم ہو جائے یا دھلائی میں چلی جائے۔"
  - heading: "آپ کو پھر بھی کیا جانچنا ہے"
    body: "سب کچھ۔ جو یہ بھرتا ہے اسے مسودہ سمجھیں۔ کل رقم کاغذ سے ملائیں، پھر کرنسی، تاریخ اور جگہ۔ دھندلی تصویریں اور مڑا ہوا کاغذ کسی بھی پڑھنے والے کو چکرا سکتے ہیں، اور ہم یہ وعدہ نہیں کرتے کہ یہ ہر رسید ٹھیک پڑھتا ہے، اس لیے محفوظ کرنے سے پہلے دیکھ لیں۔ کچھ غلط ہو تو اس کے اوپر ٹائپ کر دیں۔ اگر رسید ین میں ہو اور گروپ پاؤنڈ میں حساب برابر کرتا ہو تو آگے کیا ہوتا ہے، یہ [متعدد کرنسیاں](page:feature/multiple-currencies) بتاتا ہے۔"
  - heading: "رسید کو خرچے کے ساتھ رکھیں"
    body: "اسکین ہو یا نہ ہو، رسید خرچے کے ساتھ رہ سکتی ہے۔ تصاویر یا PDF لگائیں، ایک خرچے پر تین تک اور ہر ایک 10 MB تک۔ گروپ کے ارکان انہیں خرچے پر دیکھتے ہیں۔ تصاویر تھمب نیل کے طور پر دکھتی ہیں جو ویور میں کھلتے ہیں، اور PDF لنک کے طور پر کھلتے ہیں۔ آپ جو تصویر اسکین کرتے ہیں وہ بھی لگ جاتی ہے، جب تک آپ محفوظ کرنے سے پہلے اسے ہٹا نہ دیں۔ جب کوئی پوچھے کہ اس ڈنر کا اصل خرچہ کیا تھا تو ثبوت وہیں موجود ہے۔"
  - heading: "آپ کی رسید کہاں جاتی ہے"
    body: "رسید کی تصویر گوگل کی AI سروس پڑھتی ہے۔ فارم بھرنے کے لیے تصویر کو گوگل کے US ملٹی ریجن میں Google Vertex AI (Gemini) پڑھتا ہے۔ نئے خرچے میں تصویر شامل کریں تو وہ پڑھی جاتی ہے۔ PDF، یا پہلے سے موجود خرچے میں شامل کی گئی تصویر، بغیر پڑھے محفوظ ہو جاتی ہے۔ لگائی گئی رسیدیں گروپ کے ارکان کو نظر آتی ہیں، اس لیے اگر رسید میں کچھ ایسا ہو جو آپ شیئر نہیں کرنا چاہتے تو تصویر چھوڑ دیں اور وہ خرچہ خود ٹائپ کریں۔"
limits:
  heading: "حدود"
  items:
    - "صرف تصاویر۔ JPEG، PNG اور WebP، اور HEIC تبدیل ہونے کے بعد۔ PDF خرچے کے ساتھ لگ سکتے ہیں لیکن پڑھے نہیں جاتے۔"
    - "اسکین صرف نئے اخراجات کے لیے ہے۔ موجودہ خرچے پر آپ رسیدیں لگا سکتے ہیں، لیکن کچھ پڑھا نہیں جاتا۔"
    - "یہ صرف وہ خانے بھرتا ہے جنہیں آپ نے چھوا نہیں، اور کرنسی صرف تب جب آپ کا گروپ اجازت دے۔"
    - "یہ آئٹم کے حساب سے تقسیم نہیں کرتا اور نہ لوگوں کو لائن آئٹمز دیتا ہے۔ یہ ایک خرچہ بھرتا ہے اور آپ اسے معمول کے مطابق تقسیم کرتے ہیں۔"
    - "اس کا کوئی وعدہ نہیں کہ جو یہ بھرتا ہے وہ درست ہے، یا یہ ہر بار کام کرے گا۔ محفوظ کرنے سے پہلے جانچیں، اور اگر اسکین ناکام ہو یا دستیاب نہ ہو تو خرچہ ہاتھ سے شامل کریں۔"
    - "ایک خرچے میں تین اٹیچمنٹ تک ہو سکتے ہیں، ہر ایک 10 MB تک، بطور JPEG، PNG، WebP، HEIC یا PDF۔"
    - "رسید کی تصویر گوگل کے US ملٹی ریجن میں Google Vertex AI (Gemini) پڑھتا ہے، اور لگائی گئی رسیدیں گروپ کے ارکان کو نظر آتی ہیں۔"
useCasesHeading: "جہاں رسیدیں جمع ہوتی ہیں"
faq:
  heading: "سوالات"
  items:
    - q: "کیا یہ رسید کو آئٹم کے حساب سے تقسیم کر سکتا ہے؟"
      a: "نہیں۔ یہ کل رقم سمیت خرچہ بھرتا ہے، اور آپ اسے برابر، عین رقم یا فیصد کے مطابق تقسیم کرتے ہیں۔ جس بل میں ہر ایک نے مختلف آرڈر کیا ہو اس کے لیے ہر شخص کے ذمے رقم عین رقم کے طور پر درج کریں۔ [اخراجات کی تقسیم](page:feature/split-expenses) میں تفصیل ہے۔"
    - q: "کیا یہ PDF پڑھ سکتا ہے؟"
      a: "نہیں۔ آپ خرچے کے ساتھ PDF لگا سکتے ہیں تاکہ وہ اعداد کے ساتھ رہے، لیکن صرف تصاویر پڑھی جاتی ہیں۔"
    - q: "کیا اسکین کی کوئی حد ہے؟"
      a: "اسکین کریڈٹس ختم ہونے کا کوئی خطرہ نہیں، اور اسکین مفت ہے۔ فائلوں کی حدیں ہیں، یعنی ایک خرچے پر تین اٹیچمنٹ تک اور ہر ایک 10 MB تک۔ باقی [مفت میں کیا شامل ہے](page:pricing) میں ہے۔"
    - q: "میری رسید کون دیکھ سکتا ہے؟"
      a: "گروپ کے ارکان خرچے پر لگی رسیدیں دیکھ سکتے ہیں۔ رسید کی تصویر گوگل کی AI سروس بھی پڑھتی ہے، جس سے فارم بھرتا ہے۔"
    - q: "کیا میں پہلے سے شامل کیے گئے خرچے کی رسید اسکین کر سکتا ہوں؟"
      a: "نہیں، اسکین نئے اخراجات کے لیے ہے۔ آپ موجودہ خرچے پر رسید پھر بھی لگا سکتے ہیں، اور وہ بغیر پڑھے محفوظ ہو جاتی ہے۔"
    - q: "اگر یہ کچھ غلط بھر دے تو؟"
      a: "اس کے اوپر ٹائپ کریں۔ محفوظ کرنے تک ہر خانہ قابل ترمیم رہتا ہے، اور آپ کو ویسے بھی سب جانچنے چاہییں۔ اگر اسکین ناکام ہو یا دستیاب نہ ہو تو خرچہ معمول کے مطابق ہاتھ سے شامل کریں۔"
