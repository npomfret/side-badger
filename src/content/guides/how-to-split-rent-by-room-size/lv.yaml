meta:
  title: "Kā sadalīt īri pēc istabu lieluma | Side Badger"
  description: "Lielāka istaba, lielāka daļa. Nodaliet kopīgās telpas, pārējo sadaliet pēc platības un procentus ievadiet vienreiz. Aprēķini trim mājokļa biedriem."
h1: "Kā sadalīt īri pēc istabu lieluma"
navLabel: "Īre pēc istabas lieluma"
lead: "Izlemiet, cik liela īres daļa sedz kopīgās telpas, un šo daļu sadaliet vienādi, bet pārējo sadaliet pēc katras guļamistabas platības. Noapaļojiet līdz veseliem procentiem, vienreiz ievadiet tos īres izdevumam Side Badger un katru mēnesi nokopējiet to."
cta:
  heading: "Ievadiet īri vienreiz"
  body: "Izveidojiet bezmaksas kontu, sāciet grupu dzīvoklim un ievadiet īri ar saskaņotajiem procentiem. Nākamais mēnesis ir tikai kopija. Gribat vispirms apskatīties? Skatiet, [kā tas darbojas](page:how-it-works) vai [ko sedz bezmaksas lietošana](page:pricing)."
sections:
  - heading: "Trīs cilvēki, viens dzīvoklis, viens strīds"
    body: "Priya, Tom un Aisha kopā īrē dzīvokli par 1 950 £ mēnesī. Gadu viņi īri dalīja trīs vienādās daļās, jo tā bija vienkārši. Tad Aisha nomērīja savu guļamistabu. Guļamistabu platības ir šādas: Priya 16 m², Tom 12 m², Aisha 10 m², tāpēc Aisha maksāja tikpat, cik Priya, par istabu, kas ir par vairāk nekā trešdaļu mazāka. Neviens nebija izturējies nesaprātīgi. Neviens vienkārši nebija izdarījis aprēķinu. Pie līdzņemtām vakariņām viņi vispirms vienojās par vienu noteikumu. No īres 40% sedz virtuvi, vannasistabu un viesistabu, ko lieto visi trīs."
  - heading: "Metode, parādot aprēķinus"
    body: "Četri soļi, viena mērlente un tālruņa kalkulators."
    items:
      - "**Nodaliet kopīgo daļu.** Grupa vienojas, kāda īres daļa attiecas uz telpām, ko lieto visi. Šim dzīvoklim tie ir 40%, kas starp trim cilvēkiem ir 13,33% katram."
      - "**Pārējo sadaliet pēc platības.** Atlikušie 60% tiek dalīti pēc guļamistabu lieluma. Guļamistabu kopplatība ir 38 m² (16 + 12 + 10), tāpēc personai Priya tā ir 60% × 16/38, tas ir 25,26%."
      - "**Saskaitiet abas daļas.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, pieskaitot 13,33%, sanāk 32,3%. Aisha: 60% × 10/38 = 15,79%, pieskaitot 13,33%, sanāk 29,1%."
      - "**Noapaļojiet un pārbaudiet.** Veselus procentus ir vieglāk ievadīt un par tiem ir vieglāk strīdēties, tāpēc 38,6% kļūst par 39%, 32,3% par 32% un 29,1% par 29%. Pārbaudiet, vai 39 + 32 + 29 ir 100. Ja noapaļošana dod 99 vai 101, grupa vienojas, kura cilvēka skaitlis mainās par vienu procentpunktu."
  - heading: "Kā lasīt dzīvokļa mēnesi"
    body: "Sadalot īri 39%, 32% un 29%, daļas ir 760,50 £, 624,00 £ un 565,50 £. Priya samaksāja izīrētājam, tāpēc mēneša griezumā personai Priya pienākas 1 142,50 £, bet Tom ir parādā 566,00 £ un Aisha ir parādā 576,50 £. Side Badger iesaka divus maksājumus, abus personai Priya."
  - heading: "Iestatiet to Side Badger"
    body: "Viens vakars, no kura lielāko daļu aizņem 40% apspriešana."
    items:
      - "**Izveidojiet grupu.** Informācijas panelī izvēlieties **Izveidot grupu** un nosauciet to pēc dzīvokļa. Izvēlieties **Uzaicināt citus** un nosūtiet saiti vai QR kodu. Katrs pierakstās vai izveido bezmaksas kontu un izvēlas vārdu, ar kādu vēlas būt redzams šajā grupā."
      - "**Pievienojiet īri.** Izvēlieties **Pievienot izdevumus**. Ievadiet aprakstu un summu, bet laukā **Kas samaksāja?** izvēlieties to, kurš samaksāja izīrētājam. Laukā **Sadalīt starp** atstājiet visus trīs cilvēkus, tad laukā **Kā sadalīt** izvēlieties **Procenti** un ievadiet 39, 32 un 29. Veidlapa norāda, ja procenti kopā nav 100. Izvēlieties **Saglabāt izdevumus**."
      - "**Pievienojiet rēķinus.** Enerģija un internets ir atsevišķi izdevumi ar saviem maksātājiem. Laukā **Kā sadalīt** atstājiet **Vienādi**."
      - "**Nokopējiet to nākamajā mēnesī.** Atveriet pagājušā mēneša īri un izvēlieties **Kopēt izdevumus**. Kopija saglabā maksātāju, summu un sadali, un tai tiek piešķirts šodienas datums. Ja īre mainījusies, nomainiet summu, tad izvēlieties **Izveidot kopiju**."
      - "**Pārbaudiet, kurš kam ir parādā.** To rāda sadaļa **Bilances**. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu sadaļā **Norēķināties**."
  - heading: "Istabas ar savu vannasistabu, mazās istabiņas un aizejošie"
    items:
      - "**Istabas ar savu vannasistabu un mazās istabiņas.** Platība ir tikai sākumpunkts. Istaba ar savu vannasistabu ir vērtīgāka nekā tikpat liela istaba bez tās, bet istabiņa, kurā ietilpst gulta un viens optimistisks krēsls, ir mazāk vērta. Pielāgojiet procentus pēc vienošanās, pārbaudiet, vai tie joprojām kopā dod 100, un galīgos skaitļus pierakstiet kaut kur, kur tos redz viss dzīvoklis."
      - "**Kāds izvācas mēneša vidū.** Aprēķiniet, cik katrs ir parādā par šo mēnesi, un ievadiet šī mēneša īri ar **Precīzas summas**, nevis **Procenti**. Summām kopā jāsakrīt ar īres summu. Izdariet to, pirms cilvēks aiziet. Neviens nevar pamest grupu, kamēr viņam kāds ir parādā vai viņš ir parādā, un izdevums, kurā piedalās grupu pametis cilvēks, kļūst tikai lasāms."
      - "**Kāds ievācas.** Nomēriet vēlreiz, pārrēķiniet ar jaunajiem istabu izmēriem un jaunos procentus izmantojiet no nākamās īres. Iepriekšējie mēneši paliek tādi, kādi bija."
  - heading: "Ko Side Badger šeit nedara"
    items:
      - "Tas nemēra jūsu istabas un neizvēlas procentus. Par platībām un 40% jāvienojas grupai."
      - "Atkārtotu rēķinu nav, tāpēc katru reizi nokopējiet pagājušā mēneša īri."
      - "Tas nekad nepārvieto naudu un nemaksā izīrētājam. Jūs samaksājat viens otram, kā vēlaties, un to reģistrējat."
      - "Tas nezina, ko saka jūsu īres līgums. Tas uztur uzskaiti starp grupas cilvēkiem."
