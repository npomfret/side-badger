meta:
  title: "Deli gospodinjske račune s sostanovalci"
  description: "Najemnino deli po velikosti sobe, energijo in živila enako ter vsak mesec poglej, kdo komu dolguje. Brezplačen način, da sostanovalci vodijo štetje."
h1: "Deli gospodinjske račune s sostanovalci"
navLabel: "Sostanovalci"
lead: "Za sostanovalca, ki kupuje toaletni papir, in sostanovalce, ki nikoli ne opazijo, da se to zgodi. Side Badger vodi eno tekoče štetje najemnine, računov in nakupov za **sostanovalce**, zato ni treba nikogar loviti in lahko hladilnik spet postane le hladilnik."
cta:
  heading: "Začni pri svoji hiši"
  body: "Ustvari uporabniški račun, ustanovi skupino za hišo in vsem pošlji povezavo za povabilo. Računi tega meseca lahko gredo noter že nocoj."
scenario:
  heading: "Uredi hišo"
  body: "Ustanovi skupino za hišo, izberi ime, pod katerim želiš biti viden v njej, in vse povabi s povezavo ali kodo QR. Skupina je lahko odprta, kjer vsak dodaja in ureja, ali upravljana, kjer nove člane potrdi skrbnik, stroške pa lahko spreminjajo samo ustanovitelji in skrbniki, kar ustreza sostanovalcu, ki vodi knjige. Kdor želi samo spremljati številke, je lahko gledalec, ki vidi vse in ničesar ne spreminja. Vsak nov strošek vidijo takoj, zato ima „dodal bom pozneje“ manj skrivališč."
sections:
  - heading: "Najemnina in računi"
    body: "Najemnina se redko deli s štirimi, ker spalnice niso enake. Razdeli jo po odstotkih, da velika soba plača več in omara z oknom manj. Odstotki morajo skupaj dati 100. Računi, ki jih uporabljajo vsi, dobijo enako delitev, sostanovalec, ki pri strošku ni sodeloval, pa je lahko iz njega izpuščen. Ko enaka delitev pusti preostali cent, ta naključno pripade eni osebi. Ponavljajočih se računov ni, zato vsak mesec kopiraš najemnino prejšnjega meseca, spremeniš datum in nadaljuješ."
  - heading: "Skupni nakup"
    body: "Skupni nakupovalni seznam imej v isti skupini kot račune za nakupe in odkljukaj postavke, ko pristanejo v košarici. Kdor opravi nakup, doda znesek z računa kot strošek in ga razdeli enako ali samo med osebe, ki bodo stvar pojedle. Kdo vedno kupuje ovseno mleko, ki ga nihče drug ne pije, ostaja stvar hiše, a vsaj seznam stroškov bo točen. Dovoljenja skupine določajo, kdo lahko ustvarja in ureja sezname. Daj najemnino, račune in nakup skupaj in dobiš mesec, kot je spodnji, v hiši štirih: Jo plača 2.000 £ najemnine, razdeljene 30 %, 25 %, 25 % in 20 % po velikosti sobe, nato Kwame plača 120 £ za energijo, Lena 40 £ za internet in Matt 80 £ za živila, vse razdeljeno enako. Jo na koncu dobi 1.340 £, Side Badger pa predlaga tri plačila, vsa Jo."
  - heading: "Pošteni načini delitve gospodinjskih stroškov"
    items:
      - "**Enako** ustreza temu, kar vsi uporabljajo približno enako, kot so internet, čistila in skupni nakup. Je hitro in nihče se ne prepira o matematiki."
      - "**Po velikosti sobe** ustreza najemnini, ker se sobe razlikujejo in tudi to, koliko so ljudje zanje pripravljeni plačati. Odstotke se dogovorite enkrat, ko se kdo vseli, in jih uporabljajte vsak mesec."
      - "**Po uporabi** ustreza računom, kjer ena oseba očitno porabi več, na primer račun za ogrevanje domače pisarne ali račun za pretočno storitev, ki ga gledata dva. Izpusti ljudi, ki pri tem niso sodelovali, ali vnesi točne zneske za vsakega."
      - "Karkoli izbereš, se dogovorite pred prvim računom, ne po prvem prepiru, in pravilo zapišite nekam, kjer ga vidi vsa hiša."
  - heading: "Ko se kdo izseli"
    body: "Najprej se poravna. Nihče ne more zapustiti skupine, dokler komu dolguje ali mu je kdo dolžan denar, zato izseljenec plača ali prejme, ti to zabeležiš in šele nato odide. Skupino vodi naprej za preostale sostanovalce in novo osebo povabi s povezavo. Ko je hiše konec, lahko skrbnik skupino zaklene, da številke ostanejo, ali jo zapre za vedno, zaradi česar postane nedostopna vsem, zato to stori šele, ko nihče več ne potrebuje zgodovine."
