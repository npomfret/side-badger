faq:
  heading: "Pitanja"
  items:
    - q: "Je li kalkulator besplatan?"
      a: "Da. Besplatan je. Bez oglasa. Bez dnevnih ograničenja. Ni korisnički račun ti ne treba."
    - q: "Sprema li ono što upišem?"
      a: "Ne. Ništa se nigdje ne sprema niti šalje. Da zadržiš brojke, koristi Kopiraj poveznicu i spremi poveznicu negdje."
    - q: "Tko može vidjeti poveznicu koju kopiram?"
      a: "Svatko tko je ima. Brojke su u samoj poveznici, iza znaka #, pa je podijeli samo s osobama koje bi ih trebale vidjeti."
    - q: "Premješta li novac?"
      a: "Ne. Izračuna tko bi kome trebao platiti, a vi si plaćate kako god želite. Ni Side Badger nikad ne dira tvoj novac. Vidi [poravnanje](page:feature/settle-up)."
    - q: "Mogu li podijeliti putovanje plaćeno u dvije valute?"
      a: "Ne ovdje, jer izračun ima jednu valutu. U grupi svaka valuta ima svoje stanje. Vidi [više valuta](page:feature/multiple-currencies)."
    - q: "Što ako se iznosi ne zbrajaju?"
      a: "Kalkulator to kaže ispod troška i ne prikazuje rezultat dok se ne zbroje. Točni iznosi moraju zajedno davati ukupni iznos, a postoci moraju davati 100."
