meta:
  title: "Side Badger vs Splitwise: lo gratis, comparado | Side Badger"
  description: "Alternativa gratis a Splitwise, comparada con justicia. Escanear recibos, convertir monedas y cero anuncios son gratis aquí, y decimos qué hace mejor Splitwise."
h1: "Side Badger vs Splitwise: lo gratis, comparado"
navLabel: Side Badger vs Splitwise
lead: "Es probable que alguien de tu grupo haya dicho alguna vez «usad Splitwise y ya». Es razonable. Side Badger es una app web gratuita con escaneo de recibos, conversión de monedas y sin anuncios, y sin suscripción para desbloquearlos. Cuál le va mejor a tu grupo depende de lo que necesite, así que aquí tienes la comparación, con el lado de Splitwise tomado solo de las propias páginas de Splitwise."
cta:
  heading: Pruébalo en tu próximo gasto compartido
  body: "Crea una cuenta gratis, haz un grupo y añade un gasto de verdad. Si no es para ti, habrás gastado unos minutos, no una suscripción."
asOf: 2026-10-21
asOfNote: "Leímos las páginas de Splitwise el {date} para que no tengas que hacerlo tú, y todo lo que aquí se dice de Splitwise sale de ellas. Cada fila de la tabla enlaza con su fuente. Los planes cambian, así que volvemos a comprobarlo cada trimestre, y si las páginas de Splitwise no coinciden con esta, hazles caso a ellas."
