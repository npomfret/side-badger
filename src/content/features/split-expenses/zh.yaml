meta:
  title: 平均、按确切金额或按比例分摊支出 | Side Badger
  description: 平均、按确切金额或按比例分摊共同开销，没到场的人可以排除在外。免费，无广告，无每日限制。
h1: 平均、按确切金额或按比例分摊支出
navLabel: 分摊支出
lead: 并不是所有事都能五五开。Side Badger 应付得来。写明谁付的钱，选出分担这笔费用的人，然后**平均、按确切金额或按比例**分摊。恩怨另外计价。
cta:
  heading: 把下一笔好好分一分
  body: 创建免费账户，建一个群组，把你一直想理清的那笔支出加进去。不确定接下来会怎样？看看[使用方式](page:how-it-works)，或者看看[免费包含什么](page:pricing)。
  button: 创建免费账户
problem:
  heading: 并不是所有事都能五五开
  body: 房租要看房间大小。礼物要看谁答应了什么。晚餐要看谁留到了甜点。把账单对半分，直到遇上第一笔不能对半分的账单，然后就有人打开了电子表格。Side Badger 会记录谁付了钱、谁分担了费用、怎么分，这样余额自然准确，没人需要在饭桌上做长除法。
workflow:
  heading: 添加一笔支出，从头到尾
  steps:
    - title: 写明谁付的钱、付给了什么
      body: 输入金额、简短说明和付款的人。每笔支出只有一位付款人，这能让算术保持诚实。
      shot: S05
      shotAlt: 三人按比例分摊乡间小屋房租的支出表单
    - title: 选择分摊方式
      body: 选平均、确切金额或比例。比例加起来必须是 100，确切金额加起来必须等于总额。
      shot: S06
      shotAlt: 为一份礼物给每个人输入确切金额的支出表单
    - title: 补上来龙去脉
      body: 设置日期，添加标签、地点和备注。群组里每个人看到的细节都一样，还可以就地评论。
      shot: S08
      shotAlt: 一笔支出的详情、评论串，以及它最初输入的金额
    - title: 觉得不对劲就提出疑问
      body: 如果群组开启了支出疑问，参与某笔支出的任何人都可以对它提出疑问，支出列表也可以只显示被质疑的支出。
      shot: S18
      shotAlt: 支出列表，带有“已提问”标记和“仅已提问”筛选
options:
  heading: 三种分摊方式
  items:
    - title: 平均
      body: 晚餐、出租车以及所有人均摊的开销，默认就用它。如果总额除不尽，多出来的零头会随机落在某一个人头上，而不是总是同一个人。下面这趟出租车，零头就落在 Ana 头上。
    - title: 按确切金额
      body: 输入每个人各自该付的钱。适合每个人选的价格都不一样的礼物，或者某个人的购物车里装的东西比共同杂货还多的那次采购。金额加起来必须等于总额。
    - title: 按比例
      body: 给每个人分配总额的一个份额。按房间大小分房租是经典做法，最大的房间出最大的份额，谁也别假装没看见。
example:
  heading: 乡间小屋的周末，四笔支出，三种分法
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: 小屋，按房间大小分
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: 晚餐
      payer: ben
      amount: 84
      split:
        method: equal
    - label: 杂货
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: 回程的出租车
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: 只算在场的人
    body: 可以在所有人之间分摊，也可以只在分担这笔费用的人之间分摊。没参与的费用就把人排除掉，余额会如实反映。整周不在的室友不用为外卖买单，[室友们](page:use-case/housemates)会认为这是最基本的公道。
  - heading: 能省下日后争吵的细节
    items:
      - 设置**日期**和可选的时间。“今天”“昨天”“今早”“昨晚”之类的快捷方式能省点打字。
      - 最多添加三个**标签**来给支出分组，比如杂货或旅行。
      - 添加**地点**。粘贴地图链接，地点名称会自动填好。
      - 添加**备注**，写下数字背后的故事，需要的话还能加点格式。
      - 用**评论**把对话留在对应的支出旁边，而不是淹没在没人会往回翻的聊天记录里。
  - heading: 复制、编辑，并看到改了什么
    body: 不用重新输入，直接复制上个月的房租，再改动不同的地方。如果数字错了，就编辑这笔支出。旧版本会被保留，编辑记录会出现在群组动态中，所以没人能悄悄改数字。谁可以编辑什么，取决于群组的权限设置。
  - heading: 觉得哪里不对时
    body: 群组可以开启支出疑问。参与某笔支出的任何人都可以提出疑问并说明原因，在提问的人或管理员关闭疑问之前，这笔支出不会计入余额。默认是关闭的，由管理员为群组开启。它很适合[活动与庆祝](page:use-case/events-and-celebrations)，因为没人记得的那笔订金，转眼就成了大家都关心的事。
limits:
  heading: 限制
  items:
    - 每笔支出只有一位付款人。如果两个人都付了钱，就记两笔支出。
    - 不支持按物品分摊，也不支持按份数分摊。现有的就是平均、确切金额和比例。
    - 比例加起来必须是 100。
    - 一笔支出以其自身货币计，最高 999,999.99，小数位数按该货币的惯例。
    - 支出不能自动重复。请复制上个月的那笔。
    - 日期不能在未来，也不能早于 10 年前。
    - 涉及已退出群组之人的支出会变成只读。
useCasesHeading: 这样分摊在哪些场合有用
faq:
  heading: 常见问题
  items:
    - q: 两个人可以为同一笔支出付款吗？
      a: 一笔支出里不行。记两笔，每位付款人各一笔，余额结果是一样的。
    - q: 能按物品分摊收据吗？
      a: 不能。分摊方式是平均、按确切金额或按比例。如果账单上有不同的物品，就把每个人该付的钱按确切金额输入。
    - q: 能设置默认分摊方式吗？
      a: 不能。复制之前的一笔支出，就能沿用它的分摊方式，再改动不同的地方。
    - q: 账单可以每月自动重复吗？
      a: 不能。请复制上个月的支出，只需几秒钟。
    - q: 谁可以编辑支出？
      a: 群组权限允许的人。每次编辑都会出现在群组动态中，所以改动从来不是悄悄进行的。
    - q: 之后余额会怎样？
      a: 余额会随支出到来而更新，[结算](page:feature/settle-up)会把它们变成一份简短的付款清单。如果某笔支出使用了另一种货币，请参见[多种货币](page:feature/multiple-currencies)。
