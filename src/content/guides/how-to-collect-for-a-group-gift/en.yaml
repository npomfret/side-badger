example:
  heading: Bea's record player, and the card
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: omar
      name: Omar
    - id: lena
      name: Lena
    - id: sam
      name: Sam
  expenses:
    - label: the gift
      payer: priya
      amount: 240
      split:
        method: exact
        shares:
          priya: 60
          omar: 60
          lena: 80
          sam: 40
    - label: card and wrapping
      payer: omar
      amount: 12
      split:
        method: equal
faq:
  heading: Questions
  items:
    - q: What if we collect more than the gift costs?
      a: The exact amounts have to add up to the price, so trim the shares until they do. Or put the extra on something real, such as flowers, and enter that as a second expense, like the card and wrapping in the example.
    - q: Can someone chip in without joining the group?
      a: Not if you want them in the count. Everyone in the split needs a free account and to be in the group. For someone who only has cash, Priya could take it and enter the gift for what the group still owes. For example, if Sam gave her £40 in cash, she would enter £200 and split it 60, 60 and 80 between herself, Omar and Lena.
    - q: Can the poll decide how much each person puts in?
      a: No. A poll agrees a figure for the whole group, such as the budget. Each person's share is yours to agree between you, then type it into the expense as **Exact amounts**.
