featuresHeading: "ఒక ట్రిప్ ఆధారపడేవి"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "డిన్నర్ మానేసిన వాళ్లను వదిలేయవచ్చా?"
      a: "అవును. ప్రతి ఖర్చులో ఎవరు భాగమో ఎంచుకోండి, వాళ్లకు మాత్రమే అది వసూలు అవుతుంది."
    - q: "సిగ్నల్ లేకుండా పనిచేస్తుందా?"
      a: "లేదు. Side Badgerకు కనెక్షన్ కావాలి, కాబట్టి వైఫై దొరికాక ఖర్చులు జోడించండి."
    - q: "అందరూ ఏదైనా ఇన్‌స్టాల్ చేయాలా?"
      a: "లేదు. ఇది బ్రౌజర్‌లో నడుస్తుంది. ఆహ్వాన లింక్ పంపండి, వాళ్లు తమ ఫోన్ల నుండి చేరతారు."
    - q: "ఇది ఏ ఎక్స్ఛేంజ్ రేటును వాడుతుంది?"
      a: "ఖర్చు నమోదు చేసేటప్పుడు ప్రస్తుత ఎక్స్ఛేంజ్ రేటు, లేదా మీకు వేరేది వస్తే మీ సొంతది. ఖర్చు సేవ్ అయినప్పుడు రేటు స్థిరపడుతుంది, కాబట్టి పాత ఖర్చుల విలువ ఎప్పుడూ తిరిగి లెక్కించబడదు."
    - q: "ట్రిప్ తర్వాత గ్రూప్‌ను ఫ్రీజ్ చేయవచ్చా?"
      a: "అవును. అంకెలు ఉన్నచోటే ఉండేలా అడ్మిన్ గ్రూప్‌ను లాక్ చేయవచ్చు."
    - q: "మొత్తాలకు పరిమితి ఉందా?"
      a: "అవును. ప్రతి ఖర్చుకు 999,999.99, దాని సొంత కరెన్సీలో."
