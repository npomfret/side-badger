meta:
  title: "كيف تجمع المال لهدية جماعية | Side Badger"
  description: "كل واحد يساهم بمبلغ مختلف، وبطاقة شخص واحد تتحمّل الضربة. أجروا استطلاعاً للميزانية، وأدخلوا مبالغ دقيقة، ودعوا Side Badger يتولى الحسابات."
h1: "كيف تجمع المال لهدية جماعية"
navLabel: "جمع المال لهدية جماعية"
lead: "جمع المال لهدية جماعية يعني أن شخصاً واحداً يدفع الثمن أولاً، ويدين له الآخرون جميعاً بمساهماتهم. اتفقوا على ميزانية باستطلاع، واتركوا المشتري يدفع ثمن الهدية ببطاقته، ثم أدخلوها مصروفاً واحداً بـ[مبالغ دقيقة](page:feature/split-expenses)، أي رقماً لكل شخص. يعرض Side Badger من يدين للمشتري بكم، ويرسل كل واحد حصته بالطريقة التي تناسبه."
cta:
  heading: "اجمعوا المساهمات بلا قبعة"
  body: "أنشئ مجموعة، واترك من ستُهدى إليه الهدية خارجها، وأدخل الهدية بمبالغ دقيقة. Side Badger مجاني، بلا إعلانات وبلا حدود يومية. تريد الجولة أولاً؟ انظر [كيف يعمل](page:how-it-works) أو [ما الذي يشمله الاستخدام المجاني](page:pricing)."
sections:
  - heading: "أربعة أصدقاء، ومشغّل أسطوانات واحد، وأربعة مبالغ مختلفة"
    body: "تبلغ بيا 30 عاماً وتريد مشغّل أسطوانات. وتشتريه لها بريا وعمر ولينا وسام. تجد بريا مشغّلاً بسعر £240 وتشتريه ببطاقتها، لأن على أحدهم أن يبدأ. ولا يساهم الأربعة بالتساوي. تضع بريا وعمر £60 لكل منهما، ولينا £80، وسام £40. لا أحد يشرح رقمه ولا أحد يسأل. ويشتري عمر أيضاً بطاقة تهنئة وورق تغليف بمبلغ £12. ويوقّع الأربعة على البطاقة، فتُقسَّم هذه بالتساوي."
  - heading: "اتفقوا على الميزانية قبل أن ينقر أحد على «اشترِ»"
    body: "استطلاع الميزانية يوفّر عليكم الجدال حول مشغّل أسطوانات بسعر £400. في المجموعة اختر **إضافة استطلاع** واسأل كم ينبغي أن تكلّف الهدية. اجعل الخيارات مبالغ، مثل حتى £150 وحتى £200 وحتى £250. فعّل **التصويت المجهول**، الذي يُخفي من صوّت لأي خيار، فلا يضطر أحد إلى الدفاع عن رقم أصغر بصوت عالٍ. لا يمكن تغيير الإعدادات بعد أن يُدلى بأول صوت، فراجعها أولاً. والاستطلاع لا يُغلق من تلقاء نفسه. حين يصوّت الجميع، اختر **إغلاق الاستطلاع** فيظهر **الفائز**. الاستطلاع يتفق على الإجمالي، ولا يحدد حصة أحد."
  - heading: "قراءة الأرقام"
    body: "تُقسَّم الهدية £60 و£60 و£80 و£40، ومجموعها £240 كما في الإيصال. أما البطاقة وورق التغليف فيُقسَّمان على أربعة بواقع £3 لكل واحد. فاتورة بريا £60 + £3، أي £63، وقد دفعت £240، فيبقى لها £177. وفاتورة عمر £63 أيضاً، لكنه دفع £12، فعليه £51. وتدين لينا بمبلغ £80 + £3، أي £83، ويدين سام بمبلغ £40 + £3، أي £43. وهذه الثلاثة مجتمعة تساوي £177، وهو ما تستحقه بريا. ولو تُرك الأمر كما هو لدارت الديون على المجموعة في خمسة اتجاهات. يقترح Side Badger بدلاً من ذلك ثلاث دفعات، كلها إلى بريا. وفي [تسوية الحسابات](page:feature/settle-up) المزيد من التفاصيل."
  - heading: "أدخلها في Side Badger"
    body: "يستغرق نصيب بريا من العمل نحو خمس دقائق."
    items:
      - "**أنشئ المجموعة.** من لوحة التحكم اختر **إنشاء مجموعة**. ثم اختر **دعوة الآخرين** وأرسل الرابط أو رمز QR إلى من سيساهمون، ولا أحد غيرهم."
      - "**أضف الهدية.** اختر **إضافة مصروف**، واكتب وصفاً، وأدخل 240، وتحت **من دفع؟** اختر بريا. أبقِ الأربعة جميعاً تحت **تقسيم بين**، ثم تحت **كيفية التقسيم** اختر **مبالغ دقيقة** واكتب 60 و60 و80 و40. يجب أن يكون مجموع المبالغ 240. أرفق تأكيد الطلب إن شئت. ثم اختر **حفظ المصروف**."
      - "**أضف البطاقة.** يضيف عمر مبلغ £12 بنفسه، ويختار نفسه تحت **من دفع؟**، ويترك **كيفية التقسيم** على **بالتساوي**، مع تحديد الأشخاص الأربعة جميعاً."
      - "**احسبوا ثم ادفعوا.** يراجع الجميع **الأرصدة**، التي تعرض من يدين لمن، ويرسلون إلى بريا حصصهم بالطريقة التي تناسبهم. ثم تسجّلون ذلك عبر **تسوية** و**تسجيل تسوية**. وتملأ **تسوية سريعة** المبلغ تلقائياً."
  - heading: "اشتروا أولاً، أم اجمعوا أولاً"
    body: "لا يحتفظ Side Badger بصندوق المساهمات، لذا فإن «الجمع» يعني في الحقيقة العدّ. وتنفع طريقتان."
    items:
      - "**اشتروا أولاً.** يدفع المشتري، ويضيف المصروف بالسعر الفعلي، فيرى الجميع حصصهم فوراً. هذا أكثر ترتيباً، لكن المشتري يتحمّل التكلفة إلى أن يدفع الناس، فاختاروا مشترياً يستطيع ذلك."
      - "**اجمعوا أولاً.** يرسل الناس مبالغهم إلى المشتري قبل الشراء. وحين يصبح السعر معروفاً، أدخلوا الهدية، ثم سجّلوا كل دفعة بتاريخ تحرّك المال فعلاً. أضيفوا الهدية أولاً، ليكون لكل دفعة رصيد تُسجَّل مقابله."
      - "**السعر يتحرك.** رسوم توصيل، أو رمز خصم، أو ارتفاع متأخر في السعر. عدّلوا الهدية وغيّروا المبالغ الدقيقة بحيث يبقى مجموعها صحيحاً. تُحفظ النسخة السابقة، لكن أخبروا المجموعة أولاً، لأن أرصدتهم ستتغير."
  - heading: "أبقوا بيا خارج الأمر"
    body: "لا يرى المجموعةَ إلا أعضاؤها، فلا تستطيع بيا رؤية مجموعة ليست فيها. ادعُ من سيساهمون ولا أحد غيرهم. ويعمل الرابط إلى أن تنتهي صلاحيته، ويمكنك اختيار أي مدة من 15 دقيقة إلى 5 أيام، فاختر مدة قصيرة وأرسله حيث لن تراه بيا. ويعرض الرابط معاينة للمجموعة لمن يفتحه، فسمِّ المجموعة اسماً مملاً، مثل «صندوق السبت»، وأبقِ اسم بيا خارج أسماء المصروفات وخيارات الاستطلاع أيضاً."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا يحتفظ بالمال ولا يجمعه. تصل المساهمات إلى المشتري بتحويل مصرفي أو نقداً أو بأي وسيلة تستخدمونها، ثم يسجّلها أحدهم."
      - "لا يرسل تذكيرات بالدفع. وتذكير من لم يدفع يبقى مهمة بشرية."
      - "لا يحسب حصة أحد. فالاستطلاع يتفق على الميزانية ولا يوجد خيار «قسّم الباقي»، لذا تكتبون كل مبلغ بأنفسكم."
      - "لكل مصروف دافع واحد. فإذا اشترى شخصان أجزاء مختلفة من الهدية، فأدخلوا مصروفين."
      - "كل من يشارك في التقسيم يحتاج إلى حساب مجاني ومكان في المجموعة."
