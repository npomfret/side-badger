featuresHeading: "Funkcije, ki jih hiša uporablja"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali se lahko najemnina ponavlja samodejno?"
      a: "Ne, ponavljajočih se računov ni. Najemnino prejšnjega meseca kopiraj z nekaj dotiki, spremeni datum in končano je."
    - q: "Ali lahko delimo po velikosti sobe?"
      a: "Da, po odstotkih. Vsakemu sostanovalcu daj delež, ki ustreza njegovi sobi, če le deleži skupaj dajo 100. O drugih načinih delitve pišemo pri [delitvi stroškov](page:feature/split-expenses)."
    - q: "Kaj, če se sostanovalec izseli in dolguje denar?"
      a: "Skupine ne more zapustiti, dokler se ne poravna, ker je nihče ne more zapustiti, dokler komu dolguje ali mu je kdo dolžan denar. Številke ostanejo poštene, dokler niso vsi kvit."
    - q: "Ali Side Badger plačuje račune?"
      a: "Ne. Vodi štetje in predlaga kratek seznam plačil. Plačajte si, kakor želite, nato zabeležite, kot pojasnjuje [poravnava](page:feature/settle-up)."
    - q: "Ali lahko en sostanovalec vodi knjige?"
      a: "Da. Naredi ga za skrbnika in uporabi upravljano skupino, kjer nove člane potrdi skrbnik, stroške pa lahko spreminjajo samo ustanovitelji in skrbniki."
