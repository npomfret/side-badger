meta:
  title: "Cara membagi biaya akhir pekan pesta lajang | Side Badger"
  description: "Tamu kehormatan tidak membayar apa pun dan hari Senin semua orang masih saling bicara. Cara membagi biaya akhir pekan pesta lajang, lengkap dengan hitungan."
h1: "Cara membagi biaya akhir pekan pesta lajang"
navLabel: "Akhir pekan pesta lajang"
lead: "Tamu kehormatan tidak membayar apa pun, jadi sisa grup [membagi rata](page:feature/split-expenses) setiap biaya di antara mereka. Keluarkan orang dari biaya yang mereka lewatkan, dan jangan masukkan tamu kehormatan ke grup agar kejutannya tetap terjaga."
cta:
  heading: "Jaga hitungan, jaga kejutan"
  body: "Buat grup, kirim tautannya ke semua orang kecuali tamu kehormatan, dan catat tiap biaya saat terjadi. Side Badger gratis, tanpa iklan dan tanpa batas harian."
sections:
  - heading: "Empat teman dan satu kejutan"
    body: "Hannah, Isla, Jess, dan Kat membawa Grace pergi untuk akhir pekan pesta lajangnya. Grace adalah tamu kehormatan, jadi ia tidak membayar apa pun. Ia juga tidak ada di grup, sehingga tidak bisa melihat apa yang dihabiskan teman-temannya untuknya. Hannah memesan pondok, Isla membayar hari spa, Jess menanggung makan malam, dan Kat membayar taksi. Menjelang Minggu semua orang sudah membayar sesuatu, dan tak ada yang tahu siapa yang paling banyak menalangi. Hitungannya sama untuk akhir pekan pesta lajang mana pun, siapa pun tamu kehormatannya."
  - heading: "Bagi menurut orang yang membayar, bukan orang yang hadir"
    body: "Bagian tamu kehormatan tidak lenyap. Bagian itu dibagikan. Pondok berharga £720 dan dibayar oleh empat teman, jadi £180 per orang, dan tempat Grace sudah termasuk dalam angka itu. Makan malam £260, jadi £65 per orang. Taksi £44, jadi £11 per orang. Apa pun yang dilewatkan seseorang dikeluarkan dari pengeluaran itu saja. Kat melewatkan spa, jadi £360-nya, yang juga mencakup tempat Grace, dibagi antara Hannah, Isla, dan Jess sebesar £120 per orang. Jumlahkan semuanya dan Hannah, Isla, dan Jess masing-masing berutang £376 untuk akhir pekan itu, dan Kat berutang £256."
  - heading: "Siapkan di Side Badger"
    items:
      - "Buat grup untuk akhir pekan itu dan beri nama yang membosankan, seperti Akhir pekan di pondok. Grace bukan anggota, dan hanya anggota grup yang bisa melihatnya."
      - "Pilih **Undang Orang Lain** dan kirim tautannya, atau tunjukkan kode QR, hanya di tempat yang tidak akan dilihat Grace. Tautan menampilkan pratinjau grup sebelum ada yang bergabung. Pilih berapa lama tautan berlaku, dari 15 menit sampai 5 hari. Tautan lama tetap berfungsi sampai kedaluwarsa, jadi jangan biarkan lebih lama dari yang Anda perlukan."
      - "Untuk tiap biaya, pilih **Tambah Pengeluaran**, masukkan jumlahnya, dan pilih pembayarnya di bawah **Siapa yang membayar?** Di bawah **Dibagi antara**, centang orang yang membayar, dan keluarkan siapa pun yang melewatkannya, seperti Kat untuk spa. Pilih **Rata** di bawah **Cara membagi**."
      - "Setelah pulang, buka **Saldo** grup. Side Badger menunjukkan siapa berutang kepada siapa dan menyarankan daftar pembayaran singkat. Di sini ada tiga: Kat membayar Hannah £212, Jess membayar Hannah £116, dan Isla membayar Hannah £16. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu gunakan **Lunasi** untuk mencatat tiap pembayaran."
  - heading: "Sebelum memesan, anggaran dan deposit"
    body: "Sepakati anggaran sebelum ada yang memesan. Pilih **Tambah Jajak Pendapat**, tanyakan berapa yang akan dikeluarkan grup untuk pondok, dan tawarkan beberapa angka sebagai pilihan. Aktifkan **Pemungutan suara anonim** saat membuatnya, untuk menyembunyikan siapa memilih apa, supaya tak ada yang harus membela anggaran yang lebih kecil di depan umum. Tutup jajak pendapat setelah semua orang memilih dan pemenangnya muncul. Lalu tiba soal deposit. Siapa pun yang memesan membayarnya dan menambahkannya sebagai pengeluaran, dibagi rata, dan sisanya dimasukkan sebagai pengeluaran kedua saat jatuh tempo. Yang lain bisa langsung mengirim bagiannya dan mencatat pembayarannya, atau menunggu hitungan akhir. Saldonya tetap sama dengan kedua cara itu."
  - heading: "Saat seseorang ikut hanya satu malam"
    body: "Teman yang baru muncul untuk hari Sabtu saja tidak seharusnya membayar hari Jumat. Keluarkan dia dari biaya yang bukan bagiannya. Jika biayanya bergantung pada lama menginap tiap orang, seperti kamar, pilih **Jumlah pasti** di bawah **Cara membagi** dan ketik bagian tiap orang, yang harus berjumlah sama dengan totalnya. Hitung dulu harga per orang per malam, lalu kalikan dengan jumlah malam tiap orang menginap. Halaman [perjalanan grup](page:use-case/group-trips) membahas lebih lanjut biaya yang tidak sama untuk semua orang."
  - heading: "Yang tidak dilakukan Side Badger di sini"
    items:
      - "Side Badger tidak pernah memindahkan uang. Anda saling membayar lewat transfer bank, tunai, atau apa pun yang cocok, lalu mencatat pembayarannya agar saldo diperbarui untuk semua orang."
      - "Side Badger tidak mengirim pengingat pembayaran. Colekan ramah di obrolan grup tetap tugas manusia."
      - "Setiap pengeluaran punya satu pembayar, dan Side Badger tidak bisa membagi struk per baris. Jika dua kartu membayar pondok, masukkan sebagai dua pengeluaran. Jika sebagian orang memesan tambahan saat makan malam, masukkan tambahannya sebagai pengeluaran tersendiri."
      - "Side Badger menyimpan uangnya, bukan jadwal perjalanannya. Jajak pendapat dan komentar tetap soal biaya, jadi rencana akhir pekan tetap di obrolan grup Anda."
