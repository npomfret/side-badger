meta:
  title: "ভাড়া ভাগের ক্যালকুলেটর: ঘরের আকার বা আয় ধরে | Side Badger"
  description: "বড় ঘর, বড় ভাগ? ঘরের আকার বা আয় ধরে প্রত্যেক রুমমেট কত দেবে তা বের করুন। ব্রাউজারেই চলে: কিছু সেভ বা পাঠানো হয় না।"
h1: "ভাড়া ভাগের ক্যালকুলেটর"
navLabel: "ভাড়া ভাগের ক্যালকুলেটর"
lead: "শোওয়ার ঘর বড় হলে ভাগও বড়? ভাড়াটা লিখুন আর ঘরের আকার বা আয় ধরে দেখুন প্রত্যেকে কত দেবে, এক পয়সা পর্যন্ত। এটি আপনার ব্রাউজারেই চলে, কিছু সেভ করে না আর টাকাও নাড়াচাড়া করে না। বাড়ি যখন হিসাবটা রেখে দিতে চায়, তখন Side Badger-এ [খরচ ভাগ করুন](page:feature/split-expenses) আর প্রতি মাসে ভাড়াটা কপি করুন।"
cta:
  heading: "শতাংশগুলো একবার ঠিক করুন। চিরকাল কপি করুন।"
  body: "ট্যাব বন্ধ করলেই এই ক্যালকুলেটর সব ভুলে যায়, ঠিক সেই রুমমেটের মতো, যে হলফ করে বলে ব্রডব্যান্ডের বিলটা সে-ই দিয়েছে। Side Badger-এর একটি গ্রুপ ভাড়া, বিল আর কে কত দিয়েছে তা রেখে দেয়। এটি বিনামূল্যে, কোনো বিজ্ঞাপন নেই, দৈনিক কোনো সীমা নেই।"
sections:
  - heading: "ভাড়া ভাগের দুটি উপায়"
    items:
      - "**ঘরের আকার ধরে।** ভাড়ার একটি অংশ যায় রান্নাঘর, বাথরুম আর বসার ঘরের জন্য, যেগুলো সবাই ব্যবহার করে। সেই অংশটা আপনি বেছে নেন (শুরুতে 40%), আর তা সমান ভাগে ভাগ হয়। বাকিটা যায় শোওয়ার ঘরের আয়তন ধরে, তাই বড় ঘর বেশি দেয় আর বক্স রুম পায় তার প্রাপ্য ছাড়।"
      - "**আয় ধরে।** মোট আয়ের যত অংশ একজন রোজগার করে, ভাড়ার ঠিক তত অংশই সে দেয়। যৌথ বিল যোগ করলে সেগুলোও একই ভাগে ভাগ হয়।"
  - heading: "অঙ্কগুলো কীভাবে কাজ করে"
    body: "প্রত্যেকে প্রথমে একটি সঠিক ভাগ পায়, তারপর একটি পূর্ণ শতাংশ, কারণ পূর্ণ সংখ্যা টাইপ করা আর তা নিয়ে তর্ক করা দুটোই সহজ। গোল করার পদ্ধতিটি হলো সবচেয়ে বড় অবশেষের পদ্ধতি: প্রত্যেকে নিজের ভাগের নিচের পূর্ণ সংখ্যাটা রাখে, আর বাড়তি পয়েন্টগুলো যায় তার কাছে, নিচে নামাতে গিয়ে যে সবচেয়ে বেশি হারিয়েছে। শতাংশগুলোর যোগফল সবসময় 100। নিচের ফ্ল্যাটে যৌথ 40% জনপ্রতি 13.33%। Priya-র ঘর ফ্ল্যাটের 38 m²-এর মধ্যে 16, তাই 60% × 16/38 হয় 25.26%, তার সঙ্গে 13.33% যোগ করলে 38.6%, যা গোল করলে 39%। Tom আর Aisha-র ভাগ দাঁড়ায় 32% আর 29%, এবং 39 + 32 + 29 হলো 100। প্রতিটি পরিমাণ ভাড়ার সেই শতাংশ: £1,950-এর 39% হলো £760.50।"
  - heading: "তারপর Side Badger-এ লিখে ফেলুন"
    body: "পুরো গল্পের জন্য, মাপার ফিতেসহ, দেখুন [ঘরের আকার ধরে ভাড়া কীভাবে ভাগ করবেন](page:guide/how-to-split-rent-by-room-size), আর দম্পতিদের জন্য দেখুন [বেশি রোজগার করে এমন সঙ্গী](page:guide/how-to-split-bills-with-a-partner-who-earns-more)।"
    items:
      - "**ভাড়া যোগ করুন।** আপনার গ্রুপে **খরচ যোগ করুন** বেছে নিন, **কে টাকা দিয়েছেন?** অংশে বাড়িওয়ালাকে যে দিয়েছে তাকে বেছে নিন, আর **যাদের মধ্যে ভাগ হবে** অংশে সবাইকে রাখুন।"
      - "**শতাংশ বেছে নিন।** **কীভাবে ভাগ হবে** অংশে **শতাংশ** বেছে নিয়ে পূর্ণ শতাংশগুলো লিখুন। যোগফল 100 না হলে ফর্ম সেটা জানিয়ে দেয়।"
      - "**পরের মাসে কপি করুন।** গত মাসের ভাড়াটা খুলে **খরচ কপি করুন** বেছে নিন। ভাগটা সঙ্গেই আসে।"
  - heading: "ক্যালকুলেটর যা করে না"
    items:
      - "**আপনার ঘর মাপে না।** মেঝের মাপ শুধু শুরুর বিন্দু। নিজস্ব বাথরুমওয়ালা ঘর একই মাপের বাথরুমহীন ঘরের চেয়ে বেশি দামি, আর যে বক্স রুমে একটা বিছানা আর আশাবাদী একটা চেয়ার ধরে, সেটার দাম কম।"
      - "**আয় বলতে কী ধরা হবে তা ঠিক করে না।** হাতে পাওয়া না মোট, বেতন না বাড়তি রোজগার: গ্রুপ ঠিক করে নেয়। সবার জন্য একই সময়কাল ধরুন।"
      - "**কিছু সেভ করে না।** ট্যাব বন্ধ করলে সংখ্যাগুলো চলে যায়। রেখে দিতে চাইলে লিঙ্ক কপি করুন। সেটি আপনার সংখ্যাগুলো # চিহ্নের পরে ধরে রাখে, যা ব্রাউজার কখনও সার্ভারে পাঠায় না, আর লিঙ্কটা যার কাছে থাকবে সে-ই সেগুলো পড়তে পারবে।"
      - "**টাকা নাড়াচাড়া করে না।** বাড়িওয়ালাকে আপনি যেভাবে খুশি দিন।"
      - "**মুদ্রা মেশায় না, সীমাও ছাড়ায় না।** একটি মুদ্রা বেছে নিন। এতে 2 থেকে 10 জন আর 999,999.99 পর্যন্ত ভাড়া লেখা যায়, অ্যাপের মতোই।"
