featuresHeading: Funksjonene et par bruker
faq:
  heading: Spørsmål
  items:
    - q: Kan vi sette 60/40 én gang for alt?
      a: Nei. Delingen hører til hver utgift. Sett prosentene på den første, så kopierer du den neste gang og endrer det som er annerledes. [Dele utgifter](page:feature/split-expenses) tar for seg alle de tre måtene å dele på.
    - q: Kobles den til banken vår?
      a: Nei. Side Badger rører aldri pengene dine. Dere betaler hverandre slik dere vil, og registrerer det, slik [gjøre opp](page:feature/settle-up) forklarer.
    - q: Kan andre se gruppen vår?
      a: Bare medlemmene, og et pars gruppe har to. Alle som bruker en gyldig invitasjonslenke, kan bli med, så del den med én person og gi den kort utløpstid.
    - q: Hva hvis vi betalte hver vår del av den samme regningen?
      a: En utgift har én betaler. Registrer to utgifter, én for hver av dere, så blir saldoen den samme.
    - q: Minner den partneren min på å betale?
      a: Nei. Det finnes ingen påminnelser, så det er fortsatt du som må purre. Dere ser i det minste på det samme tallet.
    - q: Hva skjer når vi slutter å dele kostnader?
      a: Gjør opp saldoen og registrer betalingen, så ingen skylder noe. Så kan en administrator låse gruppen, som lar tallene stå som de er, eller lukke den for godt, som gjør den utilgjengelig for alle. Lukk den først når ingen av dere trenger historikken.
