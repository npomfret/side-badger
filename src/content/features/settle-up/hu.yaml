sections:
  - heading: "Rögzíts egy kifizetést"
    body: "Amikor valaki fizet, rögzítsd a megfelelő embernél. A gyors rendezés gombok kitöltik az összeget a javasolt kifizetéseidből, és hozzáadhatsz egy megjegyzést, például „banki átutalás” (legfeljebb 500 karakter). Ha csak a tartozásod egy részét fizeted ki, a többi az egyenlegen marad. Ha túl keveset vagy túl sokat írsz be, a Side Badger figyelmeztet, mielőtt mentenél. A kifizetés rögzítéséhez jogosultság kell a költségek szerkesztésére, a dátum pedig nem lehet a jövőben."
  - heading: "Más pénznemben fizettél?"
    body: "Az egyenlegek abban a pénznemben maradnak, amelyben fizettek, így az eurós tartozás eurós tartozás marad. Eurót tartozol, de fonttal fizetsz? Váltsd át a kifizetést bevitelkor, egy aktuális árfolyamon vagy azon, amelyet ténylegesen kaptál. Az árfolyam a kifizetés mentésekor rögzül. A [több pénznem](page:feature/multiple-currencies) elmagyarázza, hogyan működik az átváltás, a [csoportos utazások](page:use-case/group-trips) pedig működés közben mutatják."
  - heading: "Előzmények, amelyeket ellenőrizhetsz"
    body: "Minden rögzített kifizetés a csoport előzményeiben marad a dátumával, összegével és megjegyzésével. Egy kifizetést csak az szerkeszthet, aki rögzítette, törölni pedig ő vagy a csoport adminisztrátora tudja. Az a kifizetés, amelyben olyasvalaki érintett, aki elhagyta a csoportot, zárolt. Egy lakótársas forgatókönyvért lásd a [lakótársakat](page:use-case/housemates)."
limits:
  heading: "Amit a Side Badger nem csinál"
  items:
    - "A Side Badger nem mozgat pénzt, nem küld fizetési linkeket és nem küld fizetési kéréseket. Az alkalmazásbeli kifizetés egy máshol megtörtént kifizetés feljegyzése."
    - "A javasolt kifizetések egy egyszerű párosítási módszerből származnak, pénznemenként alkalmazva. Mindig kevesebb kifizetést javasol, mint ahány embernek van egyenlege az adott pénznemben (négy embernél legfeljebb hármat), de nem mindig találja meg a lehető legkisebb számot."
    - "A javaslatokat nem kapcsolhatod ki. Az **Összes megjelenítése** a csoport minden javasolt kifizetését kilistázza, nem csak a tieidet."
    - "A pénznemeket sosem számoljuk egymással szembe, hacsak a költségeket nem váltották át bevitelkor."
    - "Emlékeztetők nincsenek, így a kifizetés követelése továbbra is rád marad."
useCasesHeading: "Hol számít az elszámolás"
faq:
  heading: "Kérdések"
  items:
    - q: "Elküldi a pénzt a Side Badger?"
      a: "Nem. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést a Side Badgerben, hogy az egyenleg frissüljön."
    - q: "Kikapcsolhatom a javasolt kifizetéseket?"
      a: "Nem. Az egyszerűsítés bekapcsolva marad, az **Összes megjelenítése** pedig a csoport minden javasolt kifizetését kilistázza, nem csak azokat, amelyek téged érintenek."
    - q: "Miért vannak külön az euró és a font?"
      a: "Az egyenlegek abban a pénznemben maradnak, amelyben fizettél, hacsak nem váltasz át egy költség vagy kifizetés bevitelekor. A különböző pénznemű tartozásokat sosem számoljuk egymással szembe."
    - q: "Mi van, ha valaki csak a tartozása egy részét fizeti?"
      a: "Rögzítsd a kifizetett részt. A többi az egyenlegen marad, amíg ki nem fizetik."
    - q: "Ez mindig a lehető legkevesebb kifizetés?"
      a: "Nem garantált. Mindig kevesebb kifizetést javasol, mint ahány embernek van egyenlege az adott pénznemben, így négy embernél sosem többet háromnál. A lakótársas példában ez két kifizetés, ahol az egyenkénti visszaadás hatot igényelt."
