meta:
  title: "Що робити, коли хтось оспорює спільну витрату | Side Badger"
  description: "Не пишіть колюче повідомлення. Поставте витрату під питання, і вона зникне з балансів, поки ви говорите. На прикладі вина за 45 £."
h1: "Що робити, коли хтось оспорює спільну витрату"
navLabel: "Оспорені витрати"
lead: "Піднесіть запитання до витрати замість колючого повідомлення. Поки запитання відкрите, вся витрата лишається поза балансами всіх. Обговоріть її в коментарях, відредагуйте розподіл, якщо група погодиться, а тоді нехай запитання закриє той, хто його поставив, або адміністратор."
cta:
  heading: "Поставте незручне запитання ввічливо"
  body: "Створіть безкоштовний обліковий запис, заведіть групу для квартири й попросіть адміністратора ввімкнути запитання щодо витрат, які вимкнені, доки хтось цього не зробить. Хочете спершу екскурсію? Дивіться [як це працює](page:how-it-works) або [що входить у безкоштовне](page:pricing)."
sections:
  - heading: "Троє сусідів і вино за 45 £"
    body: "Після вечірки Том додає вино до групи квартири. Це 45 £, заплатив Том, розділено порівну між Томом, Прією та Аїшею, тобто по 15 £. Аїша не п'є. Том купив вино для вечірки, а вечірка була для [квартири](page:use-case/housemates), тож він нічого поганого не зробив. Аїша теж не помиляється, коли питає. Лиходіїв тут немає. Є лише 15 £ вина, про які суперечка, і безліч способів зробити її незручною. Колюче повідомлення на весь дім — один із них. Запитання до витрати — м'якший."
  - heading: "Що робить запитання"
    body: "Аїша відкриває витрату й ставить запитання. Уся витрата випадає з балансів усіх, а не лише її частка, і більше нічого не змінюється. Великі покупки (84 £) і прибиральниця (60 £) усе ще враховуються, тобто 28 £ + 20 £ = 48 £ на людину. Тож поки вино на паузі, Аїша винна 48 £, Тому винні 36 £, а Прії винні 12 £. Що б квартира не вирішила щодо вина, до цього часу ні в чийому балансі його немає. Будь-хто інший у витраті теж може поставити власне запитання. Вино повертається в баланси лише тоді, коли закрито останнє відкрите запитання до нього, а запитання закриває той, хто його поставив, або адміністратор."
  - heading: "Обговорити, а потім виправити"
    body: "Запитання Аїші потрапляє в коментарі до витрати, тож відповіді стоять просто під ним. Більше про коментарі й запитання в розділі [плануйте разом](page:feature/plan-together). Том і Прія читають його, і квартира веде розмову. Вони вирішують, що вино мають оплатити Том і Прія, бо його пили саме вони. Інша квартира могла б залишити розподіл на трьох або домовитися про щось посередині, і це теж було б нормально. Side Badger зберігає те, про що ви домовилися, і не має думки щодо вина. Том редагує витрату так, щоб вона ділилася порівну між ним і Прією, тобто по 22,50 £ (45 £ ÷ 2). Аїші в ній більше немає, тож її запитання йде зі старою версією, і вино повертається в баланси. Попередня версія зберігається."
  - heading: "Читаємо результат"
    body: "Із поверненим вином Тому винні 58,50 £, Прія винна 10,50 £, а Аїша винна 48 £. Side Badger пропонує два платежі, обидва Тому. 48 £ Аїші — це та сама цифра, що була, поки вино стояло на паузі, бо її в ньому немає. Прія з «їй винні 12 £» перейшла до «винна 10,50 £», а це її половина вина, 22,50 £. Якби розподіл на трьох лишився, Аїша була б винна 63 £ (28 £ + 20 £ + 15 £). Уся суперечка коштувала 15 £. Платіть одне одному як зручно, а потім записуйте кожен платіж через **Розрахуватися**. Решту розповідає розділ про [розрахунок](page:feature/settle-up)."
  - heading: "Як сформулювати, щоб із вами й далі розмовляли"
    body: "Запитання Аїші: «Я не пила вина. Чи можемо ми переглянути розподіл?» Воно коротке, називає витрату й питає, а не звинувачує. Допоможуть кілька звичок."
    items:
      - "**Питайте про витрату, а не про людину.** «Чи можемо ми перевірити розподіл на вино?» починає розмову. «Чому з мене взяли за твоє вино?» починає розмову іншого роду."
      - "**Скажіть, що вам хотілося б.** «Може, лише тим, хто його пив?» дає групі те, з чим погодитися чи на що відповісти."
      - "**Дайте причину в реченні чи двох.** Поле називається **Ваше запитання**, і його не можна лишити порожнім."
      - "**Тримайте відповіді в одному місці.** Відповіді йдуть у коментарі до витрати, поруч із цифрами, про які мова."
  - heading: "Налаштуйте це в Side Badger"
    items:
      - "**Увімкніть запитання.** За замовчуванням вони вимкнені. Адміністратор відкриває **Налаштування** групи, вмикає **Дозволити запитання щодо витрат** у розділі **Функції** на вкладці **Загальні** й обирає **Зберегти**. Якщо пізніше вимкнути, усі відкриті запитання буде очищено."
      - "**Поставте запитання.** Відкрийте витрату й біля власного імені в розподілі оберіть **Маю запитання**. Напишіть причину в **Ваше запитання** й знову оберіть **Маю запитання**. Це можуть зробити лише люди, що входять у витрату. На витраті з'явиться позначка **Поставлено під сумнів**."
      - "**Знайдіть те, що на паузі.** У списку витрат **Тільки поставлено під сумнів** показує витрати з відкритим запитанням."
      - "**Виправте, якщо група згодна.** Відкрийте витрату, оберіть **Редагувати**, змініть **Розділити між** і оберіть **Оновити витрату**. Хто може редагувати, залежить від дозволів групи."
      - "**Закрийте, якщо виправляти нічого.** Той, хто поставив запитання, може скористатися кнопкою закриття на своїй позначці **Поставлено під сумнів**, підписаною **Закрити запитання**, і адміністратор теж. Витрата повертається в баланси, коли закрито її останнє запитання."
  - heading: "Коли все не так охайно"
    items:
      - "**Після редагування запитувач лишається.** Якщо той, хто поставив запитання, досі входить у витрату, його запитання переходить до відредагованої версії й чекає, поки він або адміністратор його закриє. Виправлена сума ще не означає згоди, що все виправлено."
      - "**Вас не було у витраті.** Ставити запитання можуть лише ті, хто входить у витрату. Якщо вам щось здається дивним, скажіть про це в коментарях до неї або спитайте того, хто її додав."
      - "**Хтось хоче залишити групу.** Відкрите запитання не дає піти людям із цієї витрати. Закрийте запитання або відредагуйте витрату так, щоб їх у ній більше не було, і вони можуть іти."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він не вирішує, хто правий. Він тримає витрату поза балансами й зберігає те, про що ви домовилися."
      - "Він не просить нікого схвалювати витрати, перш ніж вони враховуються. Утримується лише витрата, поставлена під сумнів."
      - "Він не може утримати частину витрати. Поставте її під сумнів, і вона вся залишає баланси."
      - "Він не переказує гроші. Ви платите одне одному як зручно й записуєте це."
