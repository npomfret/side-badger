faq:
  heading: "Питања о вили"
  items:
    - q: "Шта ако неко откаже?"
      a: "Скини његове ноћи, поново израчунај и измени трошак виле да тачни износи опет дају цену. Претходна верзија се чува, а измена се види у активностима групе, па нико не мења број потихо. Ко сме да мења зависи од дозвола групе."
    - q: "Да ли онај ко је резервисао треба да плати мање?"
      a: "То одлучује група. Резервација је обавеза, а групе се разликују по томе да ли за њу следи попуст. Шта год договорите, унесите то у тачне износе и запишите у белешку уз трошак или у коментар поред њега, да нико не мора да памти договор."
    - q: "Можемо ли накнаде за чишћење делити другачије?"
      a: "Да. Унеси накнаду као посебан трошак и дај јој своју поделу. Једнако одговара паушалној накнади за целу кућу. Тачни износи одговарају групи која жели да и накнада прати ноћи."
