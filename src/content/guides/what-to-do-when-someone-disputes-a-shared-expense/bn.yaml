  items:
    - q: "আমি কি শুধু আমার ভাগ নিয়ে প্রশ্ন তুলতে পারি?"
      a: "না। একটি প্রশ্ন পুরো খরচটাকে আটকে রাখে, তাতে থাকা সবার জন্য। শুধু ভাগটা ভুল হলে সমাধান হলো ভাগ সম্পাদনা করা।"
    - q: "প্রশ্ন কে বন্ধ করতে পারে?"
      a: "যে প্রশ্ন তুলেছে, বা গ্রুপের একজন অ্যাডমিন। যে খরচটা যোগ করেছে সে অ্যাডমিন না হলে প্রশ্নকারীর হয়ে সেটা বন্ধ করতে পারে না।"
    - q: "খরচ সম্পাদনা করলে কি আসলটা মুছে যায়?"
      a: "না। আগের সংস্করণটা রাখা থাকে। কে সম্পাদনা করতে পারবে তা গ্রুপের অনুমতি ঠিক করে, তাই বাড়ির সবাইকে আগে জানিয়ে রাখা ভালো, কারণ ব্যালেন্স বদলে যায়।"
