faq:
  heading: "Vragen over de villa"
  items:
    - q: "Wat als iemand annuleert?"
      a: "Haal hun nachten eruit, maak de sommen opnieuw en bewerk de villa-uitgave zodat de exacte bedragen weer samen de prijs zijn. De eerdere versie blijft bewaard en de wijziging verschijnt in de groepsactiviteit, dus niemand past stilletjes een bedrag aan. Wie mag bewerken, hangt af van de machtigingen van de groep."
    - q: "Moet de persoon die geboekt heeft minder betalen?"
      a: "Dat beslist de groep. Boeken is een karwei en groepen verschillen van mening over of dat een korting verdient. Wat jullie ook afspreken, verwerk het in de exacte bedragen en schrijf het in een notitie bij de uitgave, of in een opmerking ernaast, zodat niemand de afspraak hoeft te onthouden."
    - q: "Kunnen we de schoonmaakkosten anders verdelen?"
      a: "Ja. Voer de kost in als aparte uitgave en geef ze een eigen verdeling. Gelijk verdelen past bij een vast bedrag voor het hele huis. Exacte bedragen passen bij een groep die wil dat de kost ook de nachten volgt."
