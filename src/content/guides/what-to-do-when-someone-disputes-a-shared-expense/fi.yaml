faq:
  heading: Kysymyksiä
  items:
    - q: Voinko kyseenalaistaa vain oman osuuteni?
      a: Et. Kysymys pitää koko kulun poissa saldoista kaikilta siinä mukana olevilta. Jos vain jako on väärä, korjaus on jaon muokkaaminen.
    - q: Kuka voi sulkea kysymyksen?
      a: Kysymyksen esittänyt henkilö tai ryhmän ylläpitäjä. Jos kulun lisännyt ei ole ylläpitäjä, hän ei voi sulkea kysymystä kysyjän puolesta.
    - q: Pyyhkiikö kulun muokkaaminen alkuperäisen pois?
      a: Ei. Aiempi versio säilyy. Se, kuka voi muokata, määräytyy ryhmän oikeuksien mukaan, joten asiasta kannattaa kertoa talolle ensin, koska saldot muuttuvat.
