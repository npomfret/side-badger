meta:
  title: "کرایہ تقسیم کیلکولیٹر: کمرے کے سائز یا آمدنی سے | Side Badger"
  description: "بڑا کمرہ، بڑا حصہ؟ کمرے کے سائز یا آمدنی کے مطابق معلوم کریں ہر ساتھی کتنا دے۔ آپ کے براؤزر میں چلتا ہے: کچھ محفوظ نہیں ہوتا نہ بھیجا جاتا ہے۔"
h1: "کرایہ تقسیم کیلکولیٹر"
navLabel: "کرایہ تقسیم کیلکولیٹر"
lead: "بڑی خواب گاہ، بڑا حصہ؟ کرایہ لکھیں اور دیکھیں ہر شخص کتنا دیتا ہے، کمرے کے سائز یا آمدنی کے مطابق، پائی پائی کے حساب سے۔ یہ آپ کے براؤزر میں چلتا ہے، کچھ محفوظ نہیں کرتا اور رقم منتقل نہیں کرتا۔ جب گھر چاہے کہ حساب رکھا جائے تو Side Badger میں [اخراجات کی تقسیم](page:feature/split-expenses) استعمال کریں اور ہر مہینے کرایہ کاپی کریں۔"
cta:
  heading: "فیصد ایک بار طے کریں۔ ہمیشہ کاپی کریں۔"
  body: "ٹیب بند کرتے ہی یہ کیلکولیٹر سب بھول جاتا ہے، بالکل اس ساتھی کی طرح جس نے براڈبینڈ کے پیسے یقیناً دیے تھے۔ Side Badger کا گروپ کرایہ، بل اور یہ حساب رکھتا ہے کہ کس نے کیا دیا۔ یہ مفت ہے، بغیر اشتہارات اور بغیر یومیہ حد کے۔"
sections:
  - heading: "کرایہ بانٹنے کے دو طریقے"
    items:
      - "**کمرے کے سائز کے مطابق۔** کرائے کا ایک حصہ باورچی خانے، غسل خانے اور لاؤنج کے لیے ہوتا ہے، جو سب استعمال کرتے ہیں۔ یہ حصہ آپ چنتے ہیں (شروع میں 40%) اور یہ برابر بٹتا ہے۔ باقی خواب گاہ کے رقبے کے مطابق جاتا ہے، تاکہ بڑا کمرہ زیادہ دے اور سٹور جیسا کمرہ وہ رعایت پائے جس کا وہ حق دار ہے۔"
      - "**آمدنی کے مطابق۔** ہر شخص کرائے کا اتنا ہی حصہ دیتا ہے جتنا وہ کل آمدنی میں کماتا ہے۔ مشترکہ بل شامل کریں تو وہ بھی انہی حصوں کے مطابق بٹتے ہیں۔"
  - heading: "حساب کیسے ہوتا ہے"
    body: "ہر شخص کو پہلے عین حصہ ملتا ہے، پھر پورا فیصد، کیونکہ پورے اعداد لکھنے اور ان پر بحث کرنے میں آسان ہیں۔ گول کرنے کا طریقہ سب سے بڑے بقیہ کا طریقہ ہے: ہر کوئی اپنے حصے سے نیچے کا پورا عدد رکھتا ہے، اور بچے ہوئے پوائنٹ اسے ملتے ہیں جس کا سب سے زیادہ کٹا ہو۔ فیصد کا مجموعہ ہمیشہ 100 ہوتا ہے۔ نیچے والے فلیٹ میں مشترکہ 40% ہر ایک کے لیے 13.33% ہے۔ پریا کا کمرہ فلیٹ کے 38 مربع میٹر میں سے 16 ہے، اس لیے 60% × 16/38 برابر 25.26%، اور 13.33% ملا کر 38.6% بنتا ہے، جو گول ہو کر 39% ہو جاتا ہے۔ ٹام اور عائشہ کے 32% اور 29% آتے ہیں، اور 39 + 32 + 29 برابر 100۔ ہر رقم کرائے کا وہی فیصد ہے: £1,950 کا 39% برابر £760.50۔"
  - heading: "پھر اسے Side Badger میں لکھیں"
    body: "پوری کہانی کے لیے، فیتے سمیت، دیکھیں [کمرے کے سائز کے مطابق کرایہ کیسے تقسیم کریں](page:guide/how-to-split-rent-by-room-size)، یا جوڑوں کے لیے [زیادہ کمانے والا ساتھی](page:guide/how-to-split-bills-with-a-partner-who-earns-more)۔"
    items:
      - "**کرایہ شامل کریں۔** اپنے گروپ میں **خرچہ شامل کریں** چنیں، **کس نے ادائیگی کی؟** کے تحت وہ چنیں جس نے مالک مکان کو دیا، اور **کے درمیان تقسیم کریں** کے تحت سب کو رہنے دیں۔"
      - "**فیصد چنیں۔** **کیسے تقسیم کریں** کے تحت **فیصد** چنیں اور پورے فیصد لکھیں۔ اگر ان کا مجموعہ 100 نہ ہو تو فارم نشاندہی کر دیتا ہے۔"
      - "**اگلے مہینے کاپی کریں۔** پچھلے مہینے کا کرایہ کھولیں اور **خرچہ کاپی کریں** چنیں۔ تقسیم ساتھ آ جاتی ہے۔"
  - heading: "کیلکولیٹر کیا نہیں کرتا"
    items:
      - "**آپ کے کمرے ناپنا۔** رقبہ ایک نقطۂ آغاز ہے۔ اٹیچ باتھ والا کمرہ اتنے ہی رقبے کے بغیر اٹیچ باتھ والے کمرے سے زیادہ قیمتی ہے، اور سٹور جیسا کمرہ جس میں بستر اور ایک امیدوں بھری کرسی سما جائے کم قیمتی ہے۔"
      - "**یہ طے کرنا کہ آمدنی کیا ہے۔** ہاتھ میں آنے والی یا کل، تنخواہ یا ساتھ کی کمائی: گروپ طے کرتا ہے۔ سب کے لیے ایک ہی مدت لیں۔"
      - "**کچھ بھی محفوظ کرنا۔** ٹیب بند کریں تو اعداد ختم۔ انہیں رکھنے کے لیے لنک کاپی کریں۔ اس میں آپ کے اعداد # کے بعد ہوتے ہیں، جو براؤزر کبھی سرور کو نہیں بھیجتے، اور جس کے پاس بھی لنک ہو وہ انہیں پڑھ سکتا ہے۔"
      - "**رقم منتقل کرنا۔** مالک مکان کو آپ جیسے چاہیں ادا کریں۔"
      - "**کرنسیاں ملانا، یا حدود سے آگے جانا۔** ایک کرنسی چنیں۔ یہ 2 سے 10 لوگ اور 999,999.99 تک کا کرایہ لیتا ہے، جیسا ایپ میں ہے۔"
