meta:
  title: "Poravnaj se z manj plačili | Side Badger"
  description: "Poglej, kdo v tvoji skupini komu dolguje, dobi kratek seznam plačil, ki poravna vse, in beleži vsako plačilo sproti. Brezplačno."
h1: "Poravnaj se z manj plačili"
navLabel: "Poravnava"
lead: "Side Badger vodi tekoče stanje za vsakogar v skupini in predlaga kratek seznam plačil, ki ga poravna. Plačajte si, kakor želite, nato plačilo zabeležite. Če najprej želiš videti, kako se zneski delijo, začni z [delitvijo stroškov](page:feature/split-expenses)."
cta:
  heading: "Pripravljen razvozlati, kdo komu dolguje?"
  body: "Ustvari uporabniški račun, ustanovi skupino in dodaj prvi strošek. Stanja bodo naredila ostalo."
  button: "Ustvari brezplačen račun"
problem:
  heading: "Stanja, ki se posodabljajo sproti"
  body: "Vsak strošek spremeni, kdo komu dolguje, zato Side Badger ohranja stanja posodobljena, ko se dodajajo stroški in plačila. Vsak v skupini spremembo vidi takoj, skupaj s tem, kaj se je spremenilo in kdo jo je naredil. Stanja se vodijo po valutah, zato evri in funti ostanejo v svojih stolpcih, razen če je bil strošek ob vnosu pretvorjen. Privzeto vidiš dolgove, ki te zadevajo; **Prikaži vse** našteje vso skupino."
workflow:
  heading: "Trije koraki do kvita"
  steps:
    - title: "Poglej, kdo komu dolguje"
      body: "Odpri stanja skupine, da vidiš, koliko dolguješ, koliko ti dolgujejo in kratek seznam plačil, ki poravna vse, izračunan za vsako valuto posebej. Stroški, ki so pod vprašajem, ostanejo zunaj vsot, dokler se ne razrešijo. V spodnjem primeru s sostanovalci se šest plačil spremeni v dve."
      shot: S10
      shotAlt: "Zaslon stanj s poenostavljenimi dolgovi v dveh valutah in vklopljeno možnostjo Prikaži vse"
    - title: "Plačaj, kakor želiš, nato zabeleži"
      body: "Bančno nakazilo, gotovina, usluga iz zadnjih počitnic. Side Badger denarja ne premika. Ko je denar zamenjal lastnika, plačilo zabeleži in stanje se posodobi za vse."
      shot: S11
      shotAlt: "Obrazec za plačilo z gumbi za hitro poravnavo in obvestilom, prikazanim pri delnem plačilu"
    - title: "Preveri, ali je prispelo"
      body: "Plačilo gre v zgodovino skupine, kjer ga lahko vidi vsak v skupini in se nanj odzove z emojijem. Plačilo proslavi, ko prispe."
      shot: S12
      shotAlt: "Zgodovina plačil z reakcijami z emojiji pri plačilu"
