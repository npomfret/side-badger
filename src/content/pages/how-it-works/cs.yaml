sections:
  - heading: "39 jazyků a postaveno pro víc lidí"
    body: "Používejte Side Badger ve 39 jazycích, včetně arabštiny, perštiny a urdštiny psaných zprava doleva. Každý ve skupině si může vybrat vlastní, takže stránka skupiny může být pro jednoho člověka v arabštině a pro dalšího v angličtině. Je také vytvořen s ohledem na uživatele klávesnice a čtečky obrazovky a barvy členů mají vzory, takže nemusíte rozeznávat zelenou od červené."
faq:
  heading: "Otázky"
  items:
    - q: "Potřebuje účet každý?"
      a: "Ano, bezplatný. Každý ověří svůj e-mail, než cokoli přidá."
    - q: "Existuje aplikace?"
      a: "Běží v prohlížeči a můžete ji přidat na domovskou obrazovku nebo do docku, aby se otevírala jako aplikace. Neexistuje verze z obchodu s aplikacemi ani režim offline."
    - q: "Přesouvá Side Badger peníze?"
      a: "Ne. Vede přehled a navrhuje platby a vy si platíte, jak chcete. Pak platbu zaznamenáte. Viz [vyrovnání](page:feature/settle-up)."
    - q: "Může někdo odejít, když dluží peníze?"
      a: "Ne. Nikdo nemůže skupinu opustit, dokud dluží nebo se mu dluží peníze, takže se nejdřív vyrovná."
    - q: "Kolik lidí se může připojit ke skupině?"
      a: "Až 50 lidí ve skupině. Pozvěte je odkazem nebo QR kódem a zapněte schvalování, pokud chcete, aby správce každou osobu pustil dovnitř."
    - q: "A co výlety s více než jednou měnou?"
      a: "Zůstatky se vedou zvlášť pro každou měnu. Viz [více měn](page:feature/multiple-currencies)."
