sections:
  - heading: "Reģistrējiet maksājumu"
    body: "Kad kāds maksā, reģistrējiet to pie pareizā cilvēka. Ātrā norēķina pogas aizpilda summu no jūsu ieteiktajiem maksājumiem, un varat pievienot piezīmi, piemēram, „bankas pārskaitījums” (līdz 500 rakstzīmēm). Samaksājiet tikai daļu no parāda, un pārējais paliek atlikumā. Ja ievadāt pārāk maz vai pārāk daudz, Side Badger brīdina pirms saglabāšanas. Maksājuma reģistrēšanai vajadzīga atļauja labot izdevumus, un datums nevar būt nākotnē."
  - heading: "Samaksāts citā valūtā?"
    body: "Atlikumi paliek valūtā, kurā tika samaksāts, tāpēc parāds eiro paliek parāds eiro. Esat parādā eiro, bet maksājat mārciņās? Konvertējiet maksājumu, kad to ievadāt, pēc pašreizējā valūtas kursa vai pēc kursa, ko patiešām saņēmāt. Kurss tiek fiksēts, kad maksājums tiek saglabāts. [Vairākas valūtas](page:feature/multiple-currencies) izskaidro, kā darbojas konvertēšana, un [grupas ceļojumi](page:use-case/group-trips) parāda to darbībā."
  - heading: "Vēsture, ko varat pārbaudīt"
    body: "Katrs reģistrētais maksājums paliek grupas vēsturē ar savu datumu, summu un piezīmi. Maksājumu var labot tikai tas, kas to reģistrēja, un dzēst var viņš vai grupas administrators. Maksājums, kurā iesaistīts cilvēks, kas pametis grupu, ir bloķēts. Izstrādātu mājokļa biedru scenāriju skatiet sadaļā [mājokļa biedri](page:use-case/housemates)."
limits:
  heading: "Ko Side Badger nedara"
  items:
    - "Side Badger nepārvieto naudu, nesūta maksājumu saites un nesūta maksājumu pieprasījumus. Maksājums lietotnē ir ieraksts par maksājumu, kas veikts citur."
    - "Ieteiktie maksājumi nāk no vienkāršas saskaņošanas metodes, ko piemēro katrā valūtā. Tā vienmēr iesaka mazāk maksājumu, nekā ir cilvēku ar atlikumu šajā valūtā (četri cilvēki, ne vairāk kā trīs maksājumi), bet ne vienmēr atrod mazāko iespējamo skaitu."
    - "Ieteikumus nevar izslēgt. **Rādīt visu** parāda katru grupas ieteikto maksājumu, ne tikai jūsējos."
    - "Valūtas nekad netiek savstarpēji ieskaitītas, ja vien izdevumi netika konvertēti, kad tie tika ievadīti."
    - "Atgādinājumu nav, tāpēc maksājuma pakaļdzīšanās joprojām ir jūsu ziņā."
useCasesHeading: "Kur norēķināšanās ir svarīga"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai Side Badger sūta naudu?"
      a: "Nē. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu Side Badger, lai atlikums atjaunotos."
    - q: "Vai varu izslēgt ieteiktos maksājumus?"
      a: "Nē. Vienkāršošana paliek ieslēgta, un **Rādīt visu** parāda katru grupas ieteikto maksājumu, ne tikai tos, kas skar jūs."
    - q: "Kāpēc eiro un mārciņas tiek turētas atsevišķi?"
      a: "Atlikumi paliek valūtā, kurā maksājāt, ja vien nekonvertējat, ievadot izdevumu vai maksājumu. Parādi dažādās valūtās nekad netiek savstarpēji ieskaitīti."
    - q: "Ko darīt, ja kāds samaksā tikai daļu no parāda?"
      a: "Reģistrējiet daļu, ko viņš samaksāja. Pārējais paliek atlikumā, kamēr tas nav samaksāts."
    - q: "Vai tas vienmēr ir mazākais iespējamais maksājumu skaits?"
      a: "Nav garantēts. Tas vienmēr iesaka mazāk maksājumu, nekā ir cilvēku ar atlikumu šajā valūtā, tāpēc četriem cilvēkiem nekad vairāk par trim. Mājokļa biedru piemērā tie ir divi maksājumi, kur katra cilvēka atmaksāšana tieši prasīja sešus."
