faq:
  heading: "Kérdések"
  items:
    - q: "Mi van, ha valakinek nagyobb a szobája, de kevesebb benne a fény?"
      a: "Az alapterület csak a kiindulópont, így a csoport megegyezhet a módosításban. Vegyél le egy-két pontot a sötét szobáról, add át őket a többieknek, és ellenőrizd, hogy a százalékok összege még mindig 100. A Side Badger azt tárolja, amiben megegyeztetek, és nem ítélkezik felette."
    - q: "A számlákat is szobaméret szerint kell osztani?"
      a: "Általában nem. Az energiát és az internetet mindenki használja, ezért az egyenlő felosztás egyszerűbb, ahogy a fenti példában is. Ha egy lakótárs egész nap otthon van, a csoport megegyezhet másban, például pontos összegekben. A lehetőségekről a [költségek felosztása](page:feature/split-expenses) oldalon olvashatsz."
    - q: "Megváltoztathatjuk később a felosztást?"
      a: "Igen, az új költségeknél. Írd át a százalékokat, amikor lemásolod a lakbért, és a korábbi hónapok úgy maradnak, ahogy voltak. Egy múltbeli költség javításához szerkeszd, ha a csoport jogosultságai megengedik, és előbb szólj mindenkinek a lakásban, mert az egyenlegek változnak. A korábbi változat megmarad."
