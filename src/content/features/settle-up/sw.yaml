meta:
  title: "Maliza hesabu kwa malipo machache | Side Badger"
  description: "Tazama nani anadaiwa na nani kwenye kikundi chako, pata orodha fupi ya malipo inayomaliza hesabu za kila mtu, na rekodi kila malipo yanapotokea. Matumizi ni bure."
h1: "Maliza hesabu kwa malipo machache"
navLabel: "Kumaliza hesabu"
lead: "Side Badger huweka salio linaloendelea kwa kila mtu kwenye kikundi na kupendekeza orodha fupi ya malipo inayolimaliza. Mnalipana mtakavyo, kisha mnarekodi. Ukitaka kuona kwanza jinsi nambari zinavyogawanywa, anza na [kugawanya gharama](page:feature/split-expenses)."
cta:
  heading: "Uko tayari kutatua nani anadaiwa na nani?"
  body: "Fungua akaunti, anzisha kikundi na ongeza gharama ya kwanza. Salio litashughulikia yaliyobaki."
  button: "Fungua akaunti ya bure"
problem:
  heading: "Salio linalosasishwa unavyoendelea"
  body: "Kila gharama hubadilisha nani anadaiwa na nani, kwa hivyo Side Badger huweka salio kuwa la sasa gharama na malipo yanapoongezwa. Kila mtu kwenye kikundi anaona mabadiliko mara moja, na anaona kilichobadilika na nani alibadilisha. Salio huwekwa kwa kila sarafu, kwa hivyo euro na pauni hukaa kwenye safu zake isipokuwa gharama ilibadilishwa ilipowekwa. Kwa chaguo-msingi unaona madeni yanayokuhusu; **Onyesha yote** inaorodhesha kikundi kizima."
workflow:
  heading: "Hatua tatu hadi hesabu ziwe sawa"
  steps:
    - title: "Tazama nani anadaiwa na nani"
      body: "Fungua salio la kikundi uone unachodaiwa, unachodai, na orodha fupi ya malipo inayomaliza hesabu za kila mtu, iliyokokotolewa kwa kila sarafu. Gharama zilizoulizwa hubaki nje ya jumla hadi zitatuliwe. Katika mfano wa wapangaji wenza hapa chini, malipo sita yanakuwa mawili."
      shot: S10
      shotAlt: "Skrini ya salio ikionyesha madeni yaliyorahisishwa kwa sarafu mbili, na Onyesha yote imewashwa"
    - title: "Lipa mtakavyo, kisha rekodi"
      body: "Uhamisho wa benki, pesa taslimu, fadhila ya likizo iliyopita. Side Badger haisogezi pesa. Pesa zikishabadilisha mikono, rekodi malipo na salio linasasishwa kwa kila mtu."
      shot: S11
      shotAlt: "Fomu ya malipo yenye vitufe vya Lipa haraka na arifa inayoonyeshwa kwa malipo ya sehemu"
    - title: "Hakikisha yamefika"
      body: "Malipo huingia kwenye historia ya kikundi, ambapo kila mtu kwenye kikundi anaweza kuyaona na kuitikia kwa emoji. Sherehekea malipo yanapofika."
      shot: S12
      shotAlt: "Historia ya malipo yenye miitikio ya emoji kwenye malipo"
