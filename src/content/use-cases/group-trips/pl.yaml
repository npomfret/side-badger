meta:
  title: "Dziel koszty wyjazdu grupowego, w 140 walutach"
  description: "Śledź, kto za co zapłacił na wyjeździe grupowym, wpisuj koszty w lokalnej walucie, przeliczaj je albo nie i rozlicz się raz na końcu. Za darmo, w przeglądarce."
h1: "Dziel koszty wyjazdu grupowego, w 140 walutach"
navLabel: "Wyjazdy grupowe"
lead: "Śledź willę, taksówki i tę jedną kolejkę koktajli, którą nikt nie pamięta, żeby się wyrywał stawiać. Side Badger prowadzi bieżący rachunek w czasie wyjazdu, [obsługuje funty, euro i 138 innych walut](page:feature/multiple-currencies) i po powrocie daje [krótką listę płatności](page:feature/settle-up)."
cta:
  heading: "Wakacyjna matematyka, zanim zblednie opalenizna"
  body: "Utwórz grupę, wyślij link z zaproszeniem osobom z wyjazdu i dodawaj koszty na bieżąco."
  button: "Załóż darmowe konto"
scenario:
  heading: "Każdy za coś zapłacił, w jakiejś walucie"
  body: "Ktoś zarezerwował loty, ktoś inny wziął willę na kartę, a trzecia osoba pokryła kolację gotówką. Do trzeciego dnia nikt nie wie, kto jest na plusie. Pytanie jest proste, nawet jeśli odpowiedź zwykle mieszka w arkuszu, którego nikt nie chce otwierać. Kto za co zapłacił, w jakiej walucie i jak wszyscy rozliczą się raz na końcu?"
sections:
  - heading: "Zanim wyjedziecie"
    body: "Poddajcie pod głosowanie krótką listę willi, jeśli chcecie, anonimowo, żeby decyzja należała do grupy, a nie do tego, kto dłużej się boczy. Potem trzymajcie wspólną listę zakupów obok rachunków za zakupy, żeby nikt nie kupił trzech tubek kremu z filtrem i żadnego adaptera do gniazdka."
  - heading: "Podczas wyjazdu"
    body: "Dodawaj każdy koszt na bieżąco, w walucie, w której zapłacono. Zrób zdjęcie paragonu, a Side Badger uzupełni sumę, datę i miejsce do sprawdzenia; obrazy paragonów są odczytywane przez usługę AI Google. Przelicz kwotę po aktualnym kursie, który możesz zmienić na ten, który faktycznie obowiązywał, a oryginalna kwota zostaje przy wydatku. Albo zostaw euro jako euro i zdecyduj później. Grupa może też wybrać jedną walutę, a nowe wydatki przeliczą się na nią automatycznie."
  - heading: "Nie każdy robił wszystko"
    body: "Niektórzy opuścili kolację, inni nie płynęli łodzią. Pomiń ich w kosztach, w których nie uczestniczyli, a resztę podziel [po równo, według dokładnych kwot albo procentowo](page:feature/split-expenses). Nikt nie płaci za tę część wyjazdu, którą przespał."
  - heading: "Rozlicz się po powrocie do domu"
    body: "Side Badger podpowiada krótką listę płatności, która rozlicza wszystkich. Płaćcie sobie, jak chcecie, a potem zarejestrujcie to. Przy mieszanych walutach trzymajcie każdą osobno albo przeliczajcie na bieżąco; przykład z Lizbony poniżej pokazuje oba warianty."
  - heading: "Wieczory kawalerskie i panieńskie"
    body: "Weekend z gościem honorowym wymaga trochę więcej papierkowej roboty. Zrób grupę zarządzaną, w której administratorzy zatwierdzają nowych członków, a wydatki mogą zmieniać tylko twórcy i administratorzy. Użyj dokładnych kwot dla udziału gościa honorowego, ogranicz grupę do walut, których naprawdę używacie, i zablokuj grupę, gdy będzie po wszystkim, żeby liczby zostały na miejscu."
exampleAfter: 4
