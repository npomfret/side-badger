featuresHeading: Funktionerna ett par använder
faq:
  heading: Frågor
  items:
    - q: Kan vi ställa in 60/40 en gång för allt?
      a: Nej. Delningen hör till varje utgift. Ställ in procenten på den första, kopiera den sedan nästa gång och ändra det som skiljer sig. [Dela utgifter](page:feature/split-expenses) tar upp alla tre sätten att dela.
    - q: Kopplas den till vår bank?
      a: Nej. Side Badger rör aldrig dina pengar. Ni betalar varandra hur ni vill och registrerar det sedan, som [göra upp](page:feature/settle-up) förklarar.
    - q: Kan någon annan se vår grupp?
      a: Bara dess medlemmar, och ett pars grupp har två. Alla som använder en giltig inbjudningslänk kan gå med, så dela den med en person och ge den ett kort utgångsdatum.
    - q: Tänk om vi betalade var sin del av samma räkning?
      a: En utgift har en betalare. Lägg in två utgifter, en för vardera av er, så blir saldot detsamma.
    - q: Påminner den min partner om att betala?
      a: Nej. Det finns inga påminnelser, så knuffen är fortfarande din. Åtminstone tittar ni båda på samma siffra.
    - q: Vad händer när vi slutar dela kostnader?
      a: Gör upp saldot och registrera betalningen, så att ingen är skyldig något. Sedan kan en administratör låsa gruppen, vilket behåller siffrorna som de är, eller stänga den för gott, vilket gör den oåtkomlig för alla. Stäng den först när ingen av er behöver historiken.
