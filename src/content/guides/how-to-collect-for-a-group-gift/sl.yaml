faq:
  heading: "Vprašanja"
  items:
    - q: "Kaj, če zberemo več, kot stane darilo?"
      a: "Točni zneski morajo skupaj dati ceno, zato krajšajte deleže, dokler ne dajo. Ali pa presežek porabite za nekaj resničnega, na primer rože, in to vnesite kot drugi strošek, kot voščilnico in papir v primeru."
    - q: "Ali lahko nekdo prispeva, ne da bi se pridružil skupini?"
      a: "Ne, če ga želite imeti v seštevku. Vsak v razdelitvi potrebuje brezplačen uporabniški račun in mesto v skupini. Za nekoga, ki ima samo gotovino, jo lahko Priya vzame in vnese darilo za znesek, ki ga skupina še dolguje. Na primer, če bi ji Sam dal 40 £ v gotovini, bi vnesla 200 £ in jih razdelila 60, 60 in 80 med sebe, Omarja in Leno."
    - q: "Ali lahko anketa odloči, koliko prispeva vsak?"
      a: "Ne. Anketa uskladi številko za celotno skupino, na primer proračun. Delež vsakogar se dogovorite med seboj, nato ga vpišite v strošek kot **Točni zneski**."
