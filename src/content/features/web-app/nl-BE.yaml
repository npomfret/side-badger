meta:
  title: "Een app om kosten te verdelen, zonder download | Side Badger"
  description: "Je telefoon zit vol, we snappen het. Side Badger draait in je browser, zonder appstore of download. Zet het op je beginscherm en het opent als een app."
h1: "Geen appstore. Geen download. Voelt toch als een app"
navLabel: "Webapp"
lead: "Side Badger leeft in je browser. Er is geen appstore om in te zoeken en niets om eerst te downloaden. Log in op een telefoon of een computer, verdeel online uitgaven met je groep en zet het op je beginscherm of in je Dock wanneer je het één tik verder wilt hebben."
cta:
  heading: "Open het. Log in. Start een groep."
  body: "Maak een account aan, start een groep en voeg de eerste uitgave toe, allemaal vanuit de browser die je al open hebt staan. Wil je eerst de rondleiding? Zie [zo werkt het](page:how-it-works), of bekijk [wat gratis dekt](page:pricing)."
problem:
  heading: "Je telefoon zit vol. We snappen het."
  body: "Ergens daarop staan vierduizend foto’s van dezelfde zonsondergang en een opslagwaarschuwing die je sinds de lente wegveegt. Het laatste wat hij nodig heeft is nog een app, om één diner te verdelen. Side Badger is dus een webapp. Het draait in een moderne browser op een telefoon of een computer. Op een telefoon gebruikt het mobiele indelingen, met de groepspagina opgesplitst in tabbladen en bedieningselementen voor aanraking. Sommige extra’s, zoals het toevoegen aan je beginscherm, hangen af van je browser, en we zeggen waar."
workflow:
  heading: "Van browsertabblad tot beginscherm in drie stappen"
  steps:
    - title: "Open het en log in"
      body: "Ga in je browser naar Side Badger en log in. Alles wat je nodig hebt is een e-mailadres en een wachtwoord, en je verifieert het e-mailadres voor je iets kunt toevoegen. Iedereen in de groep heeft een account nodig, dus de mensen die je uitnodigt doen hetzelfde."
    - title: "Zet het op je beginscherm of in je Dock"
      body: "Zodra je ingelogd bent, biedt de app aan om zichzelf te installeren. Je krijgt een knop **Installeer** waar je browser het toelaat, en **Toon me hoe** waar dat niet kan. Gemist, of nee gezegd? **Instellingen** heeft dezelfde hulp onder **Toevoegen aan beginscherm of Dock**. Op een iPhone of iPad toont Instellingen eerst de stappen voor iPhone en verstopt de andere toestellen onder **Andere apparaten**. Hoe dan ook opent de app daarna in een eigen venster."
      shot: S20
      shotAlt: "Het onderdeel Toevoegen aan beginscherm of Dock van Instellingen, met de stappen om de app aan een toestel toe te voegen"
    - title: "Zet meldingen aan, als je wilt"
      body: "Meldingen staan uit tot je ze aanzet, en elk toestel wordt apart ingeschakeld. Gebruik de knop **Inschakelen** die het belletje met meldingen aanbiedt, of de schakelaar **Pushmeldingen** in **Instellingen**. Open de app op een iPhone of iPad eerst vanaf het beginscherm. Dat is de enige plek waar meldingen daar werken."
      shot: S19
      shotAlt: "Het uitklapmenu met meldingen, met recente activiteit in de groep"
options:
  heading: "Hoe je het toevoegt, toestel per toestel"
  items:
    - title: "iPhone en iPad"
      body: "Tik op de knop Deel, een vierkant met een pijl die omhoog wijst. Zie je die niet, tik dan eerst op de drie puntjes (•••) en daarna op Deel. Scrol naar beneden en tik op **Zet op beginscherm**. Laat **Open als web-app** ingeschakeld en tik dan op **Voeg toe**. Is een link binnen een andere app geopend, open de pagina dan eerst in Safari, want die ingebouwde browser kan ze niet toevoegen."
    - title: "Android"
      body: "Open het browsermenu en kies **Toevoegen aan startscherm** of **App installeren**."
    - title: "Chrome of Edge op een computer"
      body: "Open het browsermenu en kies de optie om deze site als app te installeren. De site krijgt dan een eigen venster en een eigen pictogram."
    - title: "Safari op een Mac"
      body: "Kies **Archief** en daarna **Voeg toe aan Dock**."
sections:
  - heading: "Meldingen, enkel als je erom vraagt"
    body: "Pushmeldingen zet je zelf aan. Schakel ze in en je krijgt een melding wanneer er nieuwe activiteit is in je groepen, zoals iemand die een uitgave toevoegt, een opmerking plaatst of een betaling registreert. Ze worden toestel per toestel ingeschakeld, vanuit het belletje met meldingen of vanuit **Instellingen**, en je kunt ze daar ook weer uitschakelen. Ze hebben een browser nodig die ze ondersteunt en jouw toestemming. Heeft je browser ze voor de site geblokkeerd, sta ze dan eerst toe in de instellingen van de browser. Op een iPhone of iPad werken ze enkel vanuit de app die aan het beginscherm is toegevoegd, niet vanuit een browsertabblad. Aflevering is niet gegarandeerd, dus beschouw een melding als een duwtje, niet als een belofte. Voor wat er in de feed verschijnt, zie [samen plannen](page:feature/plan-together)."
  - heading: "Live updates, zonder verversknop"
    body: "Voeg een uitgave toe en iedereen ziet ze meteen, samen met wat er veranderd is en wie dat deed. Elke groep houdt een activiteitengeschiedenis bij, en het belletje met meldingen toont de activiteit van al je groepen. Niemand hoeft te vragen of je het ding dat je net toevoegde al gezien hebt. Het staat op hun scherm."
  - heading: "39 talen, ieder de zijne"
    body: "Gebruik Side Badger in 39 talen, waaronder het van rechts naar links geschreven Arabisch, Perzisch en Urdu. Iedereen in de groep kiest zijn eigen taal, dus dezelfde groepspagina kan voor de ene persoon in het Arabisch zijn en voor de volgende in het Engels. Het enige waarover de groep het eens moet zijn, zijn de cijfers."
  - heading: "Gebouwd voor meer dan één soort gebruiker"
    body: "Side Badger is gebouwd met toetsenbord- en schermlezergebruikers in gedachten. Ledenkleuren komen met patronen, zodat je groen en rood niet uit elkaar hoeft te houden."
    items:
      - "Skiplinks, zodat toetsenbordgebruikers meteen naar de inhoud kunnen springen."
      - "Dialoogvensters beheren de toetsenbordfocus."
      - "Bedieningselementen hebben labels, voor schermlezers."
      - "Indelingen spiegelen voor talen die van rechts naar links gelezen worden."
limits:
  heading: "Wat de webapp niet doet"
  items:
    - "Offline gebruik bestaat niet. Side Badger heeft een verbinding nodig, dus het opent je groep niet in een vliegtuig zonder wifi."
    - "Er is geen app in een appstore en geen native iPhone- of Android-app. Side Badger is een webapp, en het toevoegen aan je beginscherm of Dock is hoe je de app-achtige versie krijgt."
    - "Toevoegen aan een beginscherm of Dock hangt af van je browser. Menunamen verschillen per browser en versie, en sommige browsers bieden het niet aan."
    - "Pushmeldingen zet je per toestel zelf aan, en ze hebben een browser nodig die ze ondersteunt en jouw toestemming. Op een iPhone of iPad werken ze enkel vanuit de app die aan het beginscherm is toegevoegd. Aflevering is niet gegarandeerd."
    - "Er zijn geen e-mail- of sms-meldingen en geen betalingsherinneringen. Nieuwe activiteit verschijnt in de app, en als pushmelding als je die inschakelt. Een betaling opvolgen blijft aan jou."
    - "Activiteit wordt 90 dagen bewaard."
    - "Je logt in met een e-mailadres en een wachtwoord. Er is geen aanmelding met Google of Apple, en je moet 18 jaar of ouder zijn."
    - "We beweren niet dat Side Badger volledig toegankelijk is, of dat het aan een formele toegankelijkheidsnorm voldoet. Hindert iets je, meld het ons dan vanuit de app en je ziet ons antwoord daar."
useCasesHeading: "Waar het helpt dat je geen app nodig hebt"
faq:
  heading: "Vragen"
  items:
    - q: "Is er een Side Badger-app in een appstore?"
      a: "Nee. Side Badger is een webapp. Je opent het in je browser, en je kunt het aan je beginscherm of Dock toevoegen zodat het opent als een app. Er is niets te downloaden uit een appstore."
    - q: "Kan ik rekeningen verdelen zonder een app te downloaden?"
      a: "Ja. Open Side Badger in een browser op je telefoon of computer, log in en start een groep. Het toevoegen aan je beginscherm of Dock is optioneel."
    - q: "Werkt het offline?"
      a: "Nee. Side Badger heeft een verbinding nodig, ook als het aan je beginscherm of Dock is toegevoegd."
    - q: "Waarom krijg ik geen meldingen op mijn iPhone?"
      a: "Op een iPhone of iPad werken meldingen enkel vanuit de app die aan het beginscherm is toegevoegd, niet vanuit een browsertabblad. Voeg de app toe, open ze via het pictogram op het beginscherm en zet dan meldingen aan in **Instellingen**. Aflevering is niet gegarandeerd, dus als er eentje zoekraakt, toont de activiteitsgeschiedenis van de groep nog altijd wat er toegevoegd werd."
    - q: "Moet ik meldingen aanzetten?"
      a: "Nee. Ze staan uit tot je ze aanzet, toestel per toestel. Zonder meldingen verschijnt nieuwe activiteit nog altijd in de app, en iedereen ziet een wijziging meteen als de app openstaat."
    - q: "Heeft iedereen in de groep een account nodig?"
      a: "Ja. Alles wat je nodig hebt is een e-mailadres en een wachtwoord, en je verifieert het e-mailadres voor je iets kunt toevoegen. Iedereen die lid wordt van een groep doet hetzelfde, op welke telefoon of computer ze maar willen."
