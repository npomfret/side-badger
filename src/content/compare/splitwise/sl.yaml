faq:
  heading: "Vprašanja"
  items:
    - q: "Ali je Side Badger brezplačna alternativa Splitwisu?"
      a: "Za delitev računov v skupini, da. Skeniranje računov, pretvorba valut in brez oglasov so brezplačni, brez dnevnih omejitev. Če potrebuješ domačo aplikacijo, uporabo brez povezave, ponavljajoče se stroške ali plačila znotraj aplikacije, to dela Splitwise, Side Badger pa ne."
    - q: "Od kod izvirajo podrobnosti o Splitwisu?"
      a: "S Splitwisovih lastnih strani: njegove domače strani, strani Pro in centra za pomoč. Vsaka vrstica tabele vodi do strani, od koder izvira, datum nad tabelo pa pove, kdaj smo jih prebrali. Preverimo jih vsako četrtletje."
    - q: "Ali bo Side Badger ostal brezplačen?"
      a: "Vse v Side Badgerju je danes brezplačno in plačljivega paketa ni. Če se to kdaj spremeni, te bomo prej obvestili. Podrobnosti ima [stran s cenikom](page:pricing)."
    - q: "Ali mora preiti vsak v moji skupini?"
      a: "Da. Vsak v skupini potrebuje brezplačen uporabniški račun Side Badger in se lahko pridruži s povezavo ali kodo QR."
    - q: "Ali ima Side Badger mobilno aplikacijo?"
      a: "Ne v trgovini z aplikacijami. Deluje v brskalniku: prijavi se na telefonu, nato ga dodaj na domači zaslon, da se odpre kot aplikacija. [Kako deluje](page:how-it-works) pokaže, kako."
