faq:
  heading: "Spurningar"
  items:
    - q: "Borga svaramaður eða aðalbrúðarmær meira?"
      a: "Aðeins ef hópurinn er sammála um það. Appið gefur engum sérstakt hlutverk í útreikningunum. Ef einhver tekur á sig meira skaltu velja **Nákvæmar upphæðir** eða **Prósenta** undir **Hvernig á að skipta** og slá inn hlutina sem þið sömduð um."
    - q: "Hvað með drykki sem sumir fengu sér ekki?"
      a: "Bættu drykkjunum við sem sérstöku útgjaldi og hakaðu aðeins við fólkið sem fékk sér þá. Ef allir fengu sér mismikið skaltu velja **Nákvæmar upphæðir** og slá inn hlut hvers og eins. Enginn borgar fyrir það sem hann fékk sér ekki."
    - q: "Getur heiðursgesturinn séð hópinn seinna?"
      a: "Já, þegar óvænta uppákoman er afstaðin. Bjóddu viðkomandi, svo getur stjórnandi sett viðkomandi í hlutverkið **Áhorfandi** undir **Öryggi og leyfi** í stillingum hópsins. Áhorfandi sér allt en breytir engu, svo bíddu þar til ekkert er leyndarmál. Viðkomandi þarf ókeypis aðgang til að ganga í hópinn."
