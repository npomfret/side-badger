sections:
  - heading: "Коментари и реакције, уз бројеве"
    body: "Сваки трошак има своју нит коментара, као и група, сваки списак и свака анкета. Питај зашто је такси толико коштао испод таксија, а не у ћаскању кроз које нико не листа уназад. Додај слику рачуна или PDF резервације, а затим реагуј палцем горе, срцем, смехом, изненађењем, тугом или слављем на трошкове, уплате и коментаре. Прослави уплату кад стигне. То је најближе аплаузу што Side Badger може да понуди."
  - heading: "Доведи трошак у питање без свађе"
    body: "Кад група има укључена питања о трошковима, свако ко је укључен у трошак може да изабере **Имам питање** и каже зашто. Питање се објављује као коментар на трошку, трошак добија ознаку **Доведено у питање**, а цео трошак испада из свачијих стања док се питање не реши."
    items:
      - "**Укључивање.** Подразумевано је искључено. Администратор укључује **Дозволи питања о трошковима** у подешавањима групе, под **Функције**."
      - "**Затварање.** Особа која је питала, или администратор, бира **Затвори питање**. Ако је више људи довело у питање исти трошак, он се враћа у стања кад се затвори последње питање."
      - "**Уређивање.** Кад се трошак уреди, отворено питање прелази на нову верзију за све који у њему и даље имају удео. Коме измена одузме удео, његово питање се завршава са старом верзијом, па му више нема шта да затвара."
      - "**Проналажење.** Списак трошкова има филтер **Само доведено у питање**. Ово није корак одобравања: задржавају се само трошкови које неко доведе у питање, а све остало се рачуна чим се дода."
  - heading: "Како се питање одиграва"
    body: "Том додаје вино за журку од 45 £, подељено на сво троје цимера. Аиша није пила, па поставља питање, и док је отворено, вино се никоме не рачуна. Кућа се слаже да је вино Томово и Пријино, па Том измени поделу на њих двоје. Аиша више није у трошку, па њено питање се завршава са ранијом верзијом, која се чува, а вино се одмах враћа у стања, по 22,50 £ уместо по 15 £. Да је Аиша остала у трошку, њено питање би прешло даље и чекало да га она или администратор затвори. Испод, Аишиних 48 £ је 28 £ од куповине и 20 £ од чистачице, а Пријиних 10,50 £ је њен део од 70,50 £ (28 £, 20 £ и 22,50 £) умањен за 60 £ које је платила. Права свађа међу [цимерима](page:use-case/housemates). О томе како да срочиш питање, види [шта радити кад неко оспори заједнички трошак](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Заједнички спискови, за куповину"
    body: "Започни списак у групи, назови га нешто попут Списак за куповину, додај ставке и означавај их. Превуци ставке у бољи редослед, гледај како бројач напретка расте и коментиши списак кад неко купи погрешно овсено млеко. Архивирај готов списак да га склониш (**Прикажи архивирано** га враћа) или копирај списак да га поново користиш. Држи заједнички списак за куповину уз рачуне за куповину, па списак каже шта да се купи, а трошак колико је коштало. Ко може да прави и уређује спискове зависи од дозвола групе, што објашњавају [групе и дозволе](page:feature/groups-and-permissions)."
  - heading: "Анкете, анонимне ако желиш"
    body: "Питај групу нешто што одлучује о рачуну, на пример коју вилу, колико потрошити на поклон или да ли се вози бродом исплати. Анкета има питање и од две до десет опција. Бираш колико гласова добија свака особа, од једног избора до десет, и да ли је гласање анонимно. **Анонимно гласање** крије ко је за шта гласао, и не може да се промени кад стигне први глас. Људи могу да промене или уклоне свој глас док се анкета не затвори, а ти је можеш поново отворити ако се група предомисли. Избор виле је управо оно од чега су направљена [групна путовања](page:use-case/group-trips), а договор о буџету за поклон је класика за [догађаје и прославе](page:use-case/events-and-celebrations)."
  - heading: "Дневник активности, да се ништа не мења у тишини"
    body: "Свака група има историју активности, а звонце обавештења скупља активност из свих твојих група на једном месту. Додај трошак и сви га виде одмах, без освежавања, а дневник показује шта се променило и ко је то променио. То обухвата додате, измењене или обрисане трошкове, постављена и затворена питања, коментаре, промене спискова и анкета и забележене уплате."
  - heading: "Push обавештења, ако их желиш"
    body: "Push обавештења су изборна. Укључи их у подешавањима налога, у **Подешавањима**, под **Обавештења**, и твој уређај ће те обавестити кад у твојим групама има нове активности, као што је нови трошак или коментар. Сваки уређај се укључује посебно, а прегледач прво тражи дозволу. На iPhone-у или iPad-у раде само у апликацији додатој на почетни екран, што објашњава страница о [веб апликацији](page:feature/web-app). Сматрај их олакшицом, а не обећањем, јер испорука није загарантована."
limits:
  heading: "Ограничења"
  items:
    - "Коментари, спискови и анкете су за новац групе. [Услови](page:terms) траже да све што се објављује буде у вези са финансијама групе, па је ово место за планирање потрошње, а не опште ћаскање нити апликација за обавезе."
    - "Коментар може имати до 500 знакова, са до три прилога који су слике или PDF-ови од највише 5 MB сваки. Коментар може да обрише само његов аутор."
    - "Питања о трошковима су подразумевано искључена, а администратор их укључује за сваку групу. Трошак могу да доведу у питање само људи укључени у њега, искључивање функције брише свако отворено питање, и нико не може да напусти групу док трошак у ком учествује има отворено питање."
    - "Група може да има до 100 спискова, сваки са до 200 ставки од највише 500 знакова. Дозволе групе одређују ко може да прави, уређује и брише спискове, а закључана група не дозвољава никакве промене."
    - "Група може да има до 50 анкета, свака са две до десет опција и до десет гласова по особи. Анкете немају рок и не затварају се саме."
    - "Историја активности се чува 90 дана."
    - "Push обавештења се бирају за сваки налог и сваки уређај. Потребан је прегледач који их подржава и твоја дозвола, на iPhone-у и iPad-у раде само из апликације додате на почетни екран, а испорука није загарантована. Нема обавештења е-поштом или СМС-ом за активност нити подсетника за уплате, па је јурење уплате и даље на теби."
useCasesHeading: "Где заједничко планирање помаже"
faq:
  heading: "Питања"
  items:
    - q: "Могу ли гласови да буду анонимни?"
      a: "Да. Укључи **Анонимно гласање** кад правиш анкету и она крије ко је за шта гласао. Одлучи пре првог гласа, јер се касније не може променити."
    - q: "Може ли се анкета сама затворити?"
      a: "Не. Анкета нема рок, па особа која ју је направила бира **Затвори анкету** кад група одлучи. Ако се група предомисли, **Поново отвори анкету** је враћа."
    - q: "Колико ставки може да стане на списак?"
      a: "До 200 ставки по списку и до 100 спискова по групи. Свака ставка може имати до 500 знакова, што је доста овсеног млека."
    - q: "Ко може да затвори питање и шта је у међувремену са трошком?"
      a: "Особа која је питала, или администратор групе. Док је питање отворено, цео трошак је ван свачијих стања. Враћа се кад се затвори последње отворено питање о њему, или кад измена избаци из трошка особу која је питала."
    - q: "Могу ли да користим спискове и коментаре као апликацију за обавезе или групно ћаскање?"
      a: "Не. Коментари, спискови и анкете су за новац групе, што траже и [услови](page:terms). Мисли на спискове за куповину, анкете о буџету и „зашто је ово 45 £?“."
    - q: "Хоће ли ми Side Badger слати е-пошту о активности?"
      a: "Не. Нема обавештења е-поштом или СМС-ом за активност. Push обавештења можеш да укључиш на сваком уређају, а звонце обавештења у апликацији показује шта је ново."
