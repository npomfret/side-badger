faq:
  heading: "Питања"
  items:
    - q: "Ко треба да забележи уплату, онај ко плаћа или онај ко прима?"
      a: "Бележење уплате захтева дозволу за уређивање трошкова, а образац пита **Ко је платио?** и **Ко је примио уплату?** Само особа која ју је забележила може касније да је уређује, па је обично најједноставније да то уради платилац, помоћу дугмета за брзо поравнање."
    - q: "Шта ако је путовање текло у две валуте?"
      a: "Стања се воде по валути, па евро дуг остаје евро дуг и свака валута добија свој кратак списак, осим ако су трошкови претворени при уносу. [Више валута](page:guide/how-to-split-a-trip-paid-in-several-currencies) показује оба начина."
    - q: "Да ли да се поравнамо током путовања или на крају?"
      a: "И једно и друго ради. Свака забележена уплата мења стања, па уплата обављена усред путовања улази у коначни списак. На крају је једноставније, јер је [цело путовање](page:use-case/group-trips) на једном месту."
