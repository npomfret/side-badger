faq:
  heading: "Fragen"
  items:
    - q: "Was, wenn jemand das größere Zimmer hat, aber weniger Licht?"
      a: "Die Fläche ist nur der Ausgangspunkt, die Gruppe kann sich also auf eine Anpassung einigen. Nehmt dem dunklen Zimmer ein oder zwei Punkte ab, gebt sie den anderen und prüft, dass die Prozentsätze weiter 100 ergeben. Side Badger speichert, was ihr vereinbart, und urteilt nicht darüber."
    - q: "Sollen die Rechnungen auch nach Zimmergröße geteilt werden?"
      a: "Meistens nicht. Energie und Internet nutzen alle, ein gleichmäßiger Anteil ist also einfacher, wie im Beispiel oben. Ist jemand den ganzen Tag zu Hause, kann die Gruppe etwas anderes vereinbaren, etwa genaue Beträge. [Ausgaben teilen](page:feature/split-expenses) zeigt die Möglichkeiten."
    - q: "Können wir die Aufteilung später ändern?"
      a: "Ja, für neue Ausgaben. Ändert die Prozentsätze, wenn ihr die Miete kopiert, und frühere Monate bleiben, wie sie waren. Um eine vergangene Ausgabe zu korrigieren, bearbeite sie, wenn die Berechtigungen der Gruppe es zulassen, und sag vorher allen in der Wohnung Bescheid, denn die Salden ändern sich. Die frühere Version bleibt erhalten."
