featuresHeading: Ominaisuudet, joita pariskunta käyttää
faq:
  heading: Kysymyksiä
  items:
    - q: Voimmeko asettaa 60/40 kerran kaikkeen?
      a: Ei. Jako kuuluu kullekin kululle. Aseta prosentit ensimmäiseen, kopioi se seuraavalla kerralla ja muuta se, mikä on erilaista. [Kulujen jako](page:feature/split-expenses) kertoo kaikki kolme tapaa jakaa.
    - q: Liittyykö se pankkiimme?
      a: Ei. Side Badger ei koske rahoihisi koskaan. Maksatte toisillenne miten haluatte ja kirjaatte sen sitten, kuten [tilien tasaus](page:feature/settle-up) selittää.
    - q: Näkeekö kukaan muu ryhmämme?
      a: Vain sen jäsenet, ja pariskunnan ryhmässä heitä on kaksi. Kuka tahansa, joka käyttää voimassa olevaa kutsulinkkiä, voi liittyä, joten jaa se yhdelle ihmiselle ja anna sille lyhyt voimassaoloaika.
    - q: Entä jos maksoimme kumpikin osan samasta laskusta?
      a: Kululla on yksi maksaja. Kirjaa kaksi kulua, yksi kummallekin, niin saldo tulee samaksi.
    - q: Muistuttaako se kumppaniani maksamaan?
      a: Ei. Muistutuksia ei ole, joten muistuttaminen jää sinulle. Ainakin katsotte molemmat samaa lukua.
    - q: Mitä tapahtuu, kun lopetamme kulujen jakamisen?
      a: Tasaa saldo ja kirjaa maksu, jotta kukaan ei ole velkaa mitään. Sitten ylläpitäjä voi lukita ryhmän, jolloin luvut pysyvät ennallaan, tai sulkea sen lopullisesti, jolloin se on kaikille käyttökelvoton. Sulje se vasta, kun kumpikaan ei tarvitse historiaa.
