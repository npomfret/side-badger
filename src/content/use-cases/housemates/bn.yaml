meta:
  title: "রুমমেটদের সঙ্গে বাড়ির বিল ভাগ করুন"
  description: "ঘরের আকার অনুযায়ী ভাড়া ভাগ করুন, বিদ্যুৎ আর বাজার সমান ভাগে করুন, আর প্রতি মাসে দেখুন কে কার কাছে ঋণী। রুমমেটদের হিসাব রাখার একটি বিনামূল্যের উপায়।"
h1: "রুমমেটদের সঙ্গে বাড়ির বিল ভাগ করুন"
navLabel: "রুমমেট"
lead: "যে রুমমেট টয়লেট রোল কেনে, আর যে রুমমেটরা কখনও সেটা কিনতেই দেখে না, তাদের জন্য। Side Badger **রুমমেট আর ফ্ল্যাটমেটদের** ভাড়া, বিল আর বাজারের একটি চলমান হিসাব রাখে, যাতে কাউকে কারও পেছনে ছুটতে না হয় আর ফ্রিজ আবার শুধু একটা ফ্রিজ হয়ে থাকতে পারে।"
cta:
  heading: "নিজের বাড়ি দিয়ে শুরু করুন"
  body: "অ্যাকাউন্ট খুলুন, বাড়ির জন্য একটি গ্রুপ বানান আর সবাইকে আমন্ত্রণ লিঙ্ক পাঠান। এই মাসের বিল আজ রাতেই যোগ করা যায়।"
scenario:
  heading: "বাড়িটা সাজিয়ে নিন"
  body: "বাড়ির জন্য একটি গ্রুপ বানান, সেখানে মানুষজন আপনাকে যে নামে দেখবে সেটা বেছে নিন, আর সবাইকে লিঙ্ক বা QR কোড দিয়ে ডাকুন। গ্রুপ খোলা হতে পারে, যেখানে সবাই যোগ আর সম্পাদনা করে, অথবা ম্যানেজড, যেখানে নতুন সদস্যদের অ্যাডমিনের অনুমোদন লাগে আর শুধু নির্মাতা ও অ্যাডমিনরা খরচ বদলাতে পারেন, যা সেই রুমমেটের জন্য মানানসই যে হিসাব রাখে। যে শুধু সংখ্যাগুলো দেখতে চায় সে ভিউয়ার হতে পারে, যে সব দেখে কিন্তু কিছু বদলায় না। নতুন খরচ সবাই সঙ্গে সঙ্গে দেখে, তাই “পরে যোগ করব”-এর লুকানোর জায়গা কমে যায়।"
sections:
  - heading: "ভাড়া আর বিল"
    body: "ভাড়া খুব কমই চারে সমান ভাগ হয়, কারণ শোওয়ার ঘরগুলো সমান নয়। শতাংশে ভাগ করুন, যাতে বড় ঘর বেশি দেয় আর জানালাওয়ালা আলমারি কম। শতাংশের যোগফল 100 হতে হবে। সবাই যা ব্যবহার করে সেসব বিল সমান ভাগে হোক, আর যে রুমমেট কোনো খরচে ছিল না তাকে সেটা থেকে বাদ দেওয়া যায়। সমান ভাগে বাড়তি পয়সা থেকে গেলে সেটা এলোমেলোভাবে একজনের কাছে যায়। পুনরাবৃত্ত বিল নেই, তাই প্রতি মাসে গত মাসের ভাড়া কপি করুন, তারিখ বদলান আর এগিয়ে যান।"
  - heading: "যৌথ বাজার"
    body: "যৌথ বাজারের তালিকা বাজারের বিলের একই গ্রুপে রাখুন, আর জিনিস ট্রলিতে উঠলে টিক দিন। যে বাজার করে সে রসিদের মোটটা একটি খরচ হিসেবে যোগ করে এবং সমান ভাগে ভাগ করে, অথবা শুধু যারা জিনিসটা খাবে তাদের মধ্যে। যে ওট মিল্ক আর কেউ খায় না সেটা কে কিনতে থাকে, তা বাড়ির নিজস্ব ব্যাপারই থাকবে, কিন্তু অন্তত খরচের তালিকা নির্ভুল হবে। তালিকা কে বানাতে ও সম্পাদনা করতে পারবে তা গ্রুপের অনুমতি ঠিক করে। ভাড়া, বিল আর বাজার একসঙ্গে ধরলে চারজনের বাড়িতে একটা মাস দাঁড়ায় এমন: Jo £2,000 ভাড়া দেয়, যা ঘরের আকার অনুযায়ী 30%, 25%, 25% আর 20% ভাগে ভাগ হয়, তারপর Kwame বিদ্যুতের £120 দেয়, Lena ইন্টারনেটের £40 আর Matt বাজারের £80, প্রতিটি সমান ভাগে। Jo-র £1,340 পাওনা থাকে, আর Side Badger তিনটি পেমেন্ট সাজেস্ট করে, সবই Jo-কে।"
  - heading: "বাড়ির খরচ ভাগের ন্যায্য উপায়"
    items:
      - "**সমান ভাগে** সেসবের জন্য মানানসই যা সবাই প্রায় সমান ব্যবহার করে, যেমন ইন্টারনেট, পরিষ্কারের জিনিস আর যৌথ বাজার। এটি দ্রুত, আর অঙ্ক নিয়ে কাউকে তর্ক করতে হয় না।"
      - "**ঘরের আকার ধরে** ভাড়ার জন্য মানানসই, কারণ ঘর আলাদা আর সেগুলোর জন্য মানুষ কতটা দিতে রাজি তাও আলাদা। শতাংশ একবার ঠিক করুন, কেউ এসে থাকতে শুরু করলে, আর প্রতি মাসে সেগুলো আবার ব্যবহার করুন।"
      - "**ব্যবহার ধরে** সেসব বিলের জন্য মানানসই যেখানে একজন স্পষ্টতই বেশি ব্যবহার করে, যেমন হোম-অফিসের হিটিং বিল বা শুধু দুজনের দেখা স্ট্রিমিং অ্যাকাউন্ট। যাদের কোনো ভূমিকা ছিল না তাদের বাদ দিন, অথবা প্রত্যেকের জন্য নির্দিষ্ট পরিমাণ লিখুন।"
      - "যেটাই বেছে নিন, প্রথম তর্কের পরে নয়, প্রথম বিলের আগেই সেটা ঠিক করুন, আর নিয়মটা এমন কোথাও লিখে রাখুন যেখানে পুরো বাড়ি দেখতে পায়।"
  - heading: "কেউ চলে গেলে"
    body: "সে আগে হিসাব মেটায়। যতক্ষণ কারও দেওয়ার বা পাওয়ার বাকি আছে, সে গ্রুপ ছাড়তে পারে না, তাই যে যাচ্ছে সে দেয় বা পায়, আপনি সেটা রেকর্ড করেন, আর তারপর সে যায়। বাকি রুমমেটদের জন্য গ্রুপ চালিয়ে যান আর নতুন মানুষকে লিঙ্ক দিয়ে ডাকুন। বাড়িটাই শেষ হয়ে গেলে অ্যাডমিন গ্রুপ লক করতে পারেন যাতে সংখ্যাগুলো যেখানে আছে সেখানেই থাকে, অথবা চিরতরে বন্ধ করতে পারেন, যাতে সেটা সবার জন্য অগম্য হয়ে যায়, তাই সেটা তখনই করুন যখন ইতিহাস আর কারও লাগবে না।"
exampleAfter: 2
