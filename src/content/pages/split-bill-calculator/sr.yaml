faq:
  heading: "Питања"
  items:
    - q: "Да ли је калкулатор бесплатан?"
      a: "Да. Бесплатан. Без огласа. Без дневних ограничења. Не треба ти ни кориснички налог."
    - q: "Да ли чува оно што укуцам?"
      a: "Не. Ништа се не чува нити шаље било где. Да сачуваш своје бројеве, користи Копирај везу и сачувај везу негде."
    - q: "Ко може видети везу коју копирам?"
      a: "Свако ко је има. Бројеви су у самој вези, иза знака #, па је дели само са људима који треба да их виде."
    - q: "Да ли премешта новац?"
      a: "Не. Израчуна ко коме треба да плати, а ви плаћате једни другима како год желите. Ни Side Badger никад не дира твој новац. Погледај [поравнање](page:feature/settle-up)."
    - q: "Могу ли да поделим путовање плаћено у две валуте?"
      a: "Не овде, јер обрачун има једну валуту. У групи свака валута води своје стање. Погледај [више валута](page:feature/multiple-currencies)."
    - q: "Шта ако се износи не слажу?"
      a: "Калкулатор то каже испод трошка и не показује резултат док се не сложе. Тачни износи морају давати укупан износ, а проценти морају давати 100."
