meta:
  title: "Wat Side Badger wel en niet doet"
  description: "Uitgaven verdelen, afrekenen en meerdere valuta’s, plus groepen, lijsten en peilingen. Het hele pakket, en een eerlijke lijst van wat Side Badger weglaat."
h1: "Wat Side Badger doet"
navLabel: "Functies"
lead: "Alles wat erin zit, en wat er niet in zit."
intro: "Hier is het hele pakket. De spreadsheet hebben we met opzet weggelaten. Kies hieronder een functie voor de lange versie, of loop de rest van de lijst door en het korte lijstje van wat Side Badger niet doet."
cta:
  heading: "Doet het wat jouw groep nodig heeft?"
  body: "Maak een gratis account aan en probeer het eerst met een kleine groep."
cardsHeading: "Elke functie, in detail"
sections:
  - heading: "Bonnetjes scannen"
    body: "Maak een foto van het bonnetje en Side Badger vult het totaal, de datum en de plaats in, zodat jij ze kunt nakijken. Bonnetjes worden gelezen door de AI-dienst van Google. [Zo werkt het scannen van bonnetjes](page:feature/receipt-scanning)."
  - heading: "Groepen en machtigingen"
    body: "Maak een groep voor elk huis, elke reis of elk evenement, met tot 50 personen erin. Nodig mensen uit met een link of een QR-code. Maak in een grotere groep iemand kijker, die alles ziet en niets verandert. [Groepen en machtigingen](page:feature/groups-and-permissions) heeft de kleine lettertjes."
  - heading: "Lijsten en peilingen"
    body: "Hou de gedeelde boodschappenlijst naast de boodschappenrekeningen. Leg de shortlist van villa’s ter stemming voor, desgewenst anoniem. [Samen plannen](page:feature/plan-together) behandelt opmerkingen, vragen, lijsten en peilingen."
  - heading: "Al de rest"
    items:
      - "**Live updates:** voeg een uitgave toe en iedereen ziet ze meteen."
      - "**Talen:** gebruik Side Badger in 39 talen. Iedereen in de groep kan zijn eigen taal kiezen."
      - "**Startscherm:** geen appstore nodig. Log in en voeg Side Badger daarna toe aan je startscherm, dan opent het als een app. In de instellingen van de app zie je hoe. [Meer over de webapp](page:feature/web-app)."
      - "**Meldingen:** schakel pushmeldingen in bij Instellingen en je krijgt een melding wanneer er nieuwe activiteit is in je groepen. Voeg Side Badger op iPhone en iPad eerst toe aan je startscherm."
      - "**Feedback:** een bug gevonden? Meld het ons vanuit de app en lees ons antwoord daar."
  - heading: "Wat Side Badger niet doet"
    items:
      - "**Geld verplaatsen.** Side Badger raakt je geld nooit aan. Betaal elkaar zoals je wilt. Betalingsverzoeken staan gepland."
      - "**Terugkerende rekeningen.** Er zijn geen terugkerende uitgaven. Kopieer de rekening van vorige maand in twee tikken."
      - "**Verdelen per item.** Eén betaler per uitgave. Verdeel gelijk, op exacte bedragen of op percentage."
      - "**Een native app aanbieden.** Het werkt in je browser. Log in en voeg het daarna toe aan je startscherm."
      - "**Offline werken.** Er is een verbinding nodig."
      - "**Meldingen per e-mail of sms sturen.** Nieuwe activiteit verschijnt in de app, en als pushmelding als je die inschakelt."
      - "**Grafieken of budgetten tekenen.** Het houdt bij wie wie iets schuldig is, en dat is de hele truc."
      - "**Inloggen met Google of Apple.** Registreer je met e-mail. Inloggen met Google en Apple staat gepland."
      - "**Mensen toelaten zonder account.** Iedereen in de groep heeft een gratis account nodig."
faq:
  heading: "Vragen"
  items:
    - q: "Kan ik betalen via Side Badger?"
      a: "Nee. Side Badger houdt de rekening bij en raakt je geld nooit aan. Betaal elkaar zoals je wilt en registreer dan de betaling."
    - q: "Is er een mobiele app?"
      a: "Niet in een appstore. Side Badger draait in je browser. Log in op je telefoon en voeg het daarna toe aan je startscherm zodat het opent als een app. In de instellingen van de app zie je hoe."
    - q: "Kan ik per item verdelen?"
      a: "Nee. Elke uitgave heeft één betaler en je verdeelt ze gelijk, op exacte bedragen of op percentage."
    - q: "Werkt het offline?"
      a: "Nee, er is een verbinding nodig."
    - q: "Heeft iedereen in de groep een account nodig?"
      a: "Ja. Iedereen in de groep heeft een gratis account nodig, en een e-mailadres is alles wat je nodig hebt om je te registreren."
