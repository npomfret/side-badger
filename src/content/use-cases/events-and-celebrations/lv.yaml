featuresHeading: "Funkcijas, ko tas izmanto"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai viesi var redzēt grupu, nepievienojoties?"
      a: "Nē. Cilvēki pievienojas ar saiti vai QR kodu un bezmaksas kontu, tāpēc grupu viņi var redzēt, kad ir iekšā."
    - q: "Vai Side Badger var savākt naudu?"
      a: "Nē. Side Badger uztur uzskaiti un nekad nepārvieto naudu. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu. Tas ir bez maksas, bez reklāmām un bez dienas ierobežojumiem; skatiet [cenas](page:pricing)."
    - q: "Vai balsojumi var būt anonīmi?"
      a: "Jā. Veidojot aptauju, varat paslēpt, kurš par ko balsoja. Iestatījumus var mainīt tikai pirms pirmā balsojuma."
    - q: "Vai cilvēki var iemaksāt dažādas summas?"
      a: "Jā. Sadaliet izdevumu pēc precīzām summām, lai katra daļa ir skaitlis, par ko vienojāties, vai izlaidiet tos, kas nebija iesaistīti."
    - q: "Vai organizators var turēt grāmatvedību?"
      a: "Jā. Izmantojiet pārvaldītas grupas sagatavi, lai izdevumus maina tikai veidotāji un administratori un administratori apstiprina jaunus dalībniekus."
