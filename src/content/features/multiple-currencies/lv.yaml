sections:
  - heading: "Viena valūta visai grupai"
    body: "Ja jūsu grupa labāk par to nedomātu, izvēlieties grupas valūtu, un veidlapa konvertē katru jaunu izdevumu tajā, pēc kursa, ko joprojām redzat un varat mainīt. Tas attiecas tikai uz jauniem un nokopētiem izdevumiem. Labojumi un esošie izdevumi paliek, kā bijuši, tāpēc nekas jau reģistrētais nemainās zem jums."
  - heading: "Esat parādā eiro, maksājat mārciņās"
    body: "Samaksāts jenās, bet norēķināties mārciņās? Labi. Kad reģistrējat maksājumu, varat to konvertēt arī, tāpēc tas, kurš ir parādā eiro, var maksāt mārciņās, un eiro atlikums tāpat sanāk pareizs. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet to."
  - heading: "Noteikumi grupai"
    body: "Ierobežojiet grupu ar valūtām, ko patiešām izmantojat, un iestatiet noklusējumu, lai veidlapa atveras pareizajā. Atvaļinājumam Portugālē blakus vakariņu rēķinam nevajag 139 citas iespējas, un [kāzām ārzemēs](page:use-case/events-and-celebrations) droši vien vajag divas."
limits:
  heading: "Ierobežojumi"
  items:
    - "Kurss tiek fiksēts, kad izdevums tiek saglabāts. Vecie izdevumi nekad netiek pārvērtēti."
    - "Side Badger iegūst pašreizējo kursu, kur vien var. Ne katram pārim kurss ir garantēts, un kursu vienmēr varat ierakstīt pats."
    - "Grupas automātiskā konvertēšana attiecas tikai uz jauniem un nokopētiem izdevumiem, ne uz labojumiem vai esošiem izdevumiem."
    - "Katram izdevumam ir ierobežojums 999 999,99 savā valūtā."
    - "Ir 140 valūtas. Kriptovalūtas un metāli to vidū nav."
    - "Side Badger reģistrē maksājumus. Tas nekad nepārvieto naudu un to neapmaina."
useCasesHeading: "Kur tas palīdz"
faq:
  heading: "Jautājumi"
  items:
    - q: "Kādu valūtas kursu jūs izmantojat?"
      a: "Pašreizējo valūtas kursu, kas tiek iegūts, ievadot izdevumu, ja tāds ir pieejams. Varat to nomainīt uz kursu, ko patiešām saņēmāt, un konvertētā summa atjaunojas."
    - q: "Vai vecie izdevumi tiek pārvērtēti?"
      a: "Nē. Kurss tiek fiksēts, kad izdevums tiek saglabāts, tāpēc atlikums nenovirzās tāpēc, ka mainījies tirgus."
    - q: "Vai atbalstāt kripto?"
      a: "Nē. Ir 140 valūtas, un kriptovalūtas to vidū nav."
    - q: "Kāpēc nevaru ievadīt 2 000 000 rūpiju?"
      a: "Katram izdevumam ir ierobežojums 999 999,99 savā valūtā. Ievadiet to citā valūtā un konvertējiet vai sadaliet divos izdevumos."
    - q: "Vai konvertēšana kaut ko maksā?"
      a: "Nē. Konvertēšana ir bez maksas, tāpat kā pārējais Side Badger. Skatiet [cenas](page:pricing)."
    - q: "Vai man jākonvertē?"
      a: "Nē. Valūtas paliek atsevišķas, ja vien jūs vai jūsu grupa nevēlas konvertēt, un katrai valūtai ir savs īss maksājumu saraksts."
