meta:
  title: Listas, encuestas y comentarios en gastos de grupo | Side Badger
  description: Comenta los gastos, pregunta por el que chirría, comparte la lista de la compra y vota la villa. Planea el gasto en grupo y luego divídelo. Gratis, sin anuncios.
h1: Planéalo juntos, divídelo después
navLabel: Planear juntos
lead: Por fin, la lista de la compra y el ticket de la compra se dirigen la palabra. Side Badger da a tu grupo un sitio donde hablar del dinero antes y después de gastarlo, con comentarios en cada gasto, una forma de cuestionar los que parecen raros, listas compartidas y encuestas para las grandes decisiones. Luego [divides los gastos](page:feature/split-expenses) como siempre.
cta:
  heading: Planéalo y luego divídelo
  body: Crea una cuenta gratis, empieza un grupo y pon la primera lista, encuesta o pregunta justo al lado del dinero. ¿No sabes qué viene después? Mira [cómo funciona](page:how-it-works).
problem:
  heading: El chat está aquí y la cuenta está allá
  body: Los gastos del grupo suelen vivir en dos sitios. Los números están en uno, y la discusión sobre los números, en un chat que se perdió de vista el martes. La lista de la compra es la foto de una nevera. La villa se decidió con un pulgar arriba de casi todo el mundo, probablemente. Side Badger deja la planificación en el grupo, junto a los gastos de los que trata. Hay un comentario donde está el coste, una lista donde está la compra, una encuesta para la gran decisión y una forma de decir «un momento, ¿esto está bien?» sin escribir un párrafo. Todo gira en torno al dinero del grupo, que es para lo que está el grupo.
workflow:
  heading: De la votación de la villa a la cuenta de la compra
  steps:
    - title: Somete la gran decisión a votación
      body: Añade una encuesta para la decisión que fija la cuenta, como qué villa. Elige entre dos y diez opciones, di cuántos votos tiene cada persona y ciérrala cuando todos hayan votado, y la ganadora queda marcada.
      shot: S17
      shotAlt: Una encuesta cerrada con la opción ganadora marcada y el número de votos junto a cada opción
    - title: Escribe la lista de la compra en grupo
      body: Empieza una lista compartida, añade los artículos y ve tachándolos según llegan al carrito. La compra entra después como un gasto.
      shot: S16
      shotAlt: Una lista de la compra compartida con algunos artículos tachados y un contador de progreso
    - title: Habla del coste donde vive
      body: Comenta el propio gasto, adjunta el recibo y reacciona con un emoji. La conversación se queda junto al número del que habla.
      shot: S08
      shotAlt: Un gasto con sus detalles, la miniatura de un recibo, un hilo de comentarios y reacciones con emojis
    - title: Pregunta por el que chirría
      body: Si el grupo ha activado las preguntas sobre gastos, cualquier persona incluida en un gasto puede elegir **Tengo una pregunta**. El gasto queda fuera de los saldos hasta que se resuelva la pregunta.
      shot: S18
      shotAlt: La lista de gastos con una etiqueta de Cuestionado y el filtro Solo cuestionado
    - title: Mira qué cambió y quién lo cambió
      body: El historial de actividad y la campana de notificaciones muestran lo nuevo en todos tus grupos. Las notificaciones push están ahí si las quieres.
      shot: S19
      shotAlt: El menú desplegable de notificaciones con una lista de actividad reciente
