meta:
  title: "Conas cíos a roinnt de réir méid an tseomra | Side Badger"
  description: "Seomra níos mó, sciar níos mó. Cuir na seomraí comhroinnte i leataobh, roinn an chuid eile de réir achair urláir. Suimeanna léirithe do thriúr."
h1: "Conas cíos a roinnt de réir méid an tseomra"
navLabel: "Cíos de réir méid an tseomra"
lead: "Socraigh cé mhéad den chíos a íocann as na seomraí comhroinnte agus roinn an chuid sin go cothrom, ansin roinn an chuid eile de réir achair urláir gach seomra leapa. Cruinnigh go céatadáin iomlána, cuir isteach iad ar an gcíos i Side Badger uair amháin, agus cóipeáil an costas gach mí."
cta:
  heading: "Cuir an cíos isteach uair amháin"
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa don árasán agus cuir an cíos isteach leis na céatadáin a d'aontaigh sibh. Is cóip í an mhí seo chugainn. Ar mhaith leat léargas a fháil ar dtús? Féach [conas a oibríonn sé](page:how-it-works) nó [cad a chlúdaíonn saor in aisce](page:pricing)."
sections:
  - heading: "Triúr, árasán amháin, argóint amháin"
    body: "Roinneann Priya, Tom agus Aisha árasán ar £1,950 in aghaidh na míosa. Ar feadh bliana roinn siad go cothrom idir triúr é, mar bhí sé éasca. Ansin thomhais Aisha a seomra leapa. Is 16 m² é seomra Priya, is 12 m² é seomra Tom agus is 10 m² é seomra Aisha, mar sin bhí Aisha ag íoc an méid céanna a bhí Priya ag íoc, as seomra a bhí níos mó ná an tríú cuid níos lú. Ní raibh aon duine míréasúnta. Ní dhearna aon duine an ríomh. Agus bia le tabhairt leat á ithe acu, d'aontaigh siad riail amháin ar dtús: íocann 40% den chíos as an gcistin, an seomra folctha agus an seomra suí, a úsáideann an triúr acu."
  - heading: "An modh, agus na suimeanna léirithe"
    body: "Ceithre chéim, téip thomhais amháin agus áireamhán fóin."
    items:
      - "**Cuir an chuid chomhroinnte i leataobh.** Aontaíonn an grúpa sciar den chíos do na seomraí a úsáideann gach duine. Don árasán is 40% é, is é sin 13.33% an duine idir triúr."
      - "**Roinn an chuid eile de réir achair urláir.** Téann an 60% eile de réir méid an tseomra leapa. Is é 38 m² (16 + 12 + 10) iomlán na seomraí leapa, mar sin is é 60% × 16/38 cuid Priya, is é sin 25.26%."
      - "**Cuir an dá chuid le chéile.** Priya: 25.26% + 13.33% = 38.6%. Tom: 60% × 12/38 = 18.95%, móide 13.33% = 32.3%. Aisha: 60% × 10/38 = 15.79%, móide 13.33% = 29.1%."
      - "**Cruinnigh agus seiceáil.** Is fusa céatadáin iomlána a chlóscríobh agus argóint a dhéanamh fúthu, mar sin cruinníonn 38.6% go 39%, cruinníonn 32.3% go 32% agus cruinníonn 29.1% go 29%. Seiceáil go ndéanann 39 + 32 + 29 100 le chéile. Má thagann 99 nó 101 as an gcruinniú, aontaíonn an grúpa cé a bhfuil a fhigiúr le bogadh pointe amháin."
  - heading: "Mí an árasáin a léamh"
    body: "Tagann an cíos ag 39%, 32% agus 29% amach ag £760.50, £624.00 agus £565.50. D'íoc Priya leis an tiarna talún, mar sin tá £1,142.50 dlite di thar an mí, agus tá £566.00 dlite ag Tom agus £576.50 ag Aisha. Molann Side Badger dhá íocaíocht, an dá cheann chuig Priya."
  - heading: "Cuir ar bun i Side Badger é"
    body: "Tráthnóna amháin, a chaitear den chuid is mó ag plé an 40%."
    items:
      - "**Déan an grúpa.** Ar an bpainéal, roghnaigh **Cruthaigh Grúpa** agus ainmnigh é i ndiaidh an árasáin. Roghnaigh **Tabhair Cuireadh do Dhaoine Eile** agus seol an nasc nó an cód QR. Síníonn gach duine isteach nó cruthaíonn cuntas saor in aisce, agus roghnaíonn an t-ainm is mian leo a thaispeáint sa ghrúpa seo."
      - "**Cuir an cíos leis.** Roghnaigh **Cuir Costas Leis**. Cuir isteach an cur síos agus an méid, agus faoi **Cé a d'íoc?** roghnaigh cibé duine a d'íoc leis an tiarna talún. Fág an triúr acu faoi **Roinn idir**, ansin faoi **Conas a roinntear** roghnaigh **Céatadán** agus clóscríobh 39, 32 agus 29. Tugann an fhoirm rabhadh mura ndéanann na céatadáin 100 le chéile. Roghnaigh **Sábháil an Costas**."
      - "**Cuir na billí leis.** Is costais ar leith iad fuinneamh agus idirlíon, agus a n-íocóir féin ag gach ceann acu. Fág **Conas a roinntear** ar **Cothrom**."
      - "**Cóipeáil é an mhí seo chugainn.** Oscail cíos na míosa seo caite agus roghnaigh **Cóipeáil an costas**. Coinníonn an chóip an t-íocóir, an méid agus an roinnt, agus glacann sí dáta an lae inniu. Athraigh an méid má d'athraigh an cíos, ansin roghnaigh **Cruthaigh Cóip**."
      - "**Seiceáil cé atá i bhfiacha le cé.** Taispeánann an chuid **Iarmhéideanna** é. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht faoi **Socraigh**."
  - heading: "Seomraí en-suite, seomraí beaga agus daoine ag imeacht"
    items:
      - "**Seomraí en-suite agus seomraí beaga.** Is pointe tosaigh é an t-achar urláir. Tá níos mó luach i seomra a bhfuil seomra folctha dá chuid féin aige ná i seomra den achar céanna gan ceann, agus tá níos lú luach i seomra beag ina bhfuil spás do leaba agus do chathaoir dóchasach. Athraigh na céatadáin trí chomhaontú, seiceáil go ndéanann siad 100 fós agus scríobh na figiúirí deiridh síos in áit ina bhfeiceann an t-árasán ar fad iad."
      - "**Duine ag bogadh amach i lár na míosa.** Oibrigh amach sciar gach duine den chíos don mhí sin agus cuir isteach cíos na míosa sin le **Méideanna cruinne** in ionad **Céatadán**. Caithfidh na méideanna an cíos a bhaint amach le chéile. Déan é sula n-imíonn siad. Ní féidir le haon duine grúpa a fhágáil fad is atá airgead dlite acu nó dlite dóibh, agus ní féidir costas a bhaineann le duine a d'fhág a athrú a thuilleadh; bíonn sé inléite amháin."
      - "**Duine ag bogadh isteach.** Tomhais arís, déan na suimeanna as an nua le méideanna nua na seomraí agus úsáid na céatadáin nua ón gcéad chíos eile. Fanann míonna níos luaithe mar a bhí siad."
  - heading: "Cad nach ndéanann Side Badger anseo"
    items:
      - "Ní thomhaiseann sé do sheomraí agus ní roghnaíonn sé na céatadáin. Is faoin ngrúpa na hachair urláir agus an 40% a aontú."
      - "Ní féidir billí a athrá go huathoibríoch, mar sin cóipeálann tú cíos na míosa seo caite gach uair."
      - "Ní bhogann sé airgead riamh agus ní íocann sé an tiarna talún. Íocann sibh a chéile ar an gcaoi is fearr libh agus taifeadann sibh é."
      - "Níl a fhios aige cad a deir do chomhaontú tionóntachta. Coinníonn sé an cuntas idir na daoine sa ghrúpa."
