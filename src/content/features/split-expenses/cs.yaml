meta:
  title: "Dělte výdaje rovnoměrně, přesně nebo procentuálně | Side Badger"
  description: "Rozdělte společný náklad rovnoměrně, podle přesných částek nebo procentuálně a vynechte každého, kdo u toho nebyl. Zdarma, bez reklam a bez denních limitů."
h1: "Dělte výdaje rovnoměrně, přesně nebo procentuálně"
navLabel: "Dělení výdajů"
lead: "Ne všechno se dělí 50/50. Side Badger to zvládne. Řekněte, kdo platil, vyberte lidi, kteří se na nákladu podíleli, a rozdělte ho **rovnoměrně, podle přesných částek nebo procentuálně**. Zášť se prodává zvlášť."
cta:
  heading: "Rozdělte ten další pořádně"
  body: "Vytvořte si účet zdarma, založte skupinu a přidejte výdaj, který už dlouho chcete vyřešit. Nevíte, co bude dál? Podívejte se, [jak to funguje](page:how-it-works), nebo zjistěte, [co zahrnuje bezplatná verze](page:pricing)."
  button: "Vytvořit účet zdarma"
problem:
  heading: "Ne všechno se dělí 50/50"
  body: "Nájem se řídí velikostí pokoje. Dárek tím, kdo co slíbil. Večeře tím, kdo zůstal na dezert. Rozdělení účtu napůl funguje do prvního účtu, který takový není, a pak někdo otevře tabulku. Side Badger zaznamenává, kdo platil, kdo se na nákladu podílel a jak se dělí, takže zůstatky vycházejí správně a nikdo u stolu nemusí dělit písemně."
workflow:
  heading: "Přidání výdaje od začátku do konce"
  steps:
    - title: "Řekněte, kdo platil a za co"
      body: "Zadejte částku, krátký popis a osobu, která platila. Za každý výdaj platí jedna osoba, což drží počty poctivé."
      shot: S05
      shotAlt: "Formulář výdaje s nájmem chaty rozděleným procentuálně mezi tři lidi"
    - title: "Vyberte rozdělení"
      body: "Zvolte rovnoměrně, přesné částky nebo procenta. Procenta musí dávat dohromady 100 a přesné částky musí dávat dohromady celek."
      shot: S06
      shotAlt: "Formulář výdaje s přesnými částkami zadanými pro každou osobu u dárku"
    - title: "Přidejte příběh"
      body: "Nastavte datum, přidejte štítky, místo a poznámku. Všichni ve skupině vidí stejné podrobnosti a mohou rovnou komentovat."
      shot: S08
      shotAlt: "Výdaj s podrobnostmi, vláknem komentářů a původní částkou, v jaké byl zadán"
    - title: "Vzneste otázku, když něco nesedí"
      body: "Pokud skupina zapnula otázky k výdajům, může výdaj zpochybnit kdokoli, koho se týká, a seznam výdajů může ukazovat jen ty zpochybněné."
      shot: S18
      shotAlt: "Seznam výdajů se štítkem Zpochybněno a filtrem Pouze zpochybněno"
options:
  heading: "Tři způsoby rozdělení"
  items:
    - title: "Rovnoměrně"
      body: "Výchozí volba pro večeře, taxíky a všechno, co všichni sdíleli stejným dílem. Pokud se částka nedělí beze zbytku, zbylý halíř připadne jedné osobě náhodně, ne vždy té samé. V taxíku níže je to Ana."
    - title: "Podle přesných částek"
      body: "Napište, kolik kdo dluží. Hodí se pro dárek, kde si každý vybral jinou cenu, nebo obchod, kde měl jeden člověk v košíku víc než společné nákupy. Částky musí dávat dohromady celek."
    - title: "Procentuálně"
      body: "Dejte každému podíl z celku. Nájem podle velikosti pokoje je klasika: největší pokoj platí největší podíl a nikdo nic nepředstírá."
example:
  heading: "Víkend na chatě, čtyři výdaje, tři rozdělení"
  currency: GBP
  people:
