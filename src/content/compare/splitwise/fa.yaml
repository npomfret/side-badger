faq:
  heading: "پرسش‌ها"
  items:
    - q: "آیا Side Badger جایگزین رایگانی برای Splitwise است؟"
      a: "برای تقسیم صورت‌حساب در یک گروه، بله. اسکن رسید، تبدیل ارز و نبود تبلیغات رایگان است، بدون محدودیت روزانه. اگر برنامه بومی، کار آفلاین، هزینه‌های تکراری یا پرداخت داخل برنامه لازم دارید، Splitwise این‌ها را انجام می‌دهد و Side Badger نه."
    - q: "جزئیات Splitwise از کجا می‌آید؟"
      a: "از صفحه‌های خود Splitwise: صفحه اصلی، صفحه Pro و مرکز راهنمایش. هر ردیف جدول به صفحه‌ای که از آن آمده لینک دارد و تاریخ بالای جدول می‌گوید چه زمانی آن‌ها را خوانده‌ایم. هر سه ماه یک بار بررسی‌شان می‌کنیم."
    - q: "آیا Side Badger رایگان می‌ماند؟"
      a: "همه‌چیز در Side Badger امروز رایگان است و طرح پولی وجود ندارد. اگر روزی این تغییر کند، قبلاً به شما اطلاع می‌دهیم. [صفحه قیمت‌ها](page:pricing) جزئیات را دارد."
    - q: "آیا همه اعضای گروه من باید عوض کنند؟"
      a: "بله. هر عضو یک گروه به یک حساب رایگان Side Badger نیاز دارد و با لینک یا کد QR می‌تواند بپیوندد."
    - q: "آیا Side Badger برنامه موبایل دارد؟"
      a: "در فروشگاه برنامه نه. در مرورگر شما اجرا می‌شود: روی گوشی وارد شوید و بعد آن را به صفحه اصلی اضافه کنید تا مثل یک برنامه باز شود. [نحوه کار](page:how-it-works) نشان می‌دهد چطور."
