meta:
  title: "Acerta as contas com menos pagamentos | Side Badger"
  description: "Vê quem deve a quem no teu grupo, recebe uma lista curta de pagamentos que acerta as contas de todos e regista cada pagamento à medida que acontece. Grátis."
h1: "Acerta as contas com menos pagamentos"
navLabel: "Acertar contas"
lead: "O Side Badger mantém um saldo corrente para cada pessoa do grupo e sugere uma lista curta de pagamentos que o acerta. Paguem-se como preferirem e depois registem. Se quiseres ver primeiro como os números são divididos, começa por [dividir despesas](page:feature/split-expenses)."
cta:
  heading: "Pronto para desembaraçar quem deve a quem?"
  body: "Cria uma conta, começa um grupo e adiciona a primeira despesa. Os saldos tratam do resto."
  button: "Criar uma conta grátis"
problem:
  heading: "Saldos que se atualizam à medida que avanças"
  body: "Cada despesa muda quem deve a quem, por isso o Side Badger mantém os saldos atuais à medida que se adicionam despesas e pagamentos. Todas as pessoas do grupo veem uma alteração logo, e veem o que mudou e quem mudou. Os saldos são mantidos por moeda, por isso euros e libras ficam nas suas próprias colunas, a menos que uma despesa tenha sido convertida quando foi introduzida. Por defeito vês as dívidas que te envolvem; **Mostrar tudo** lista o grupo inteiro."
workflow:
  heading: "Três passos até ficarem quites"
  steps:
    - title: "Vê quem deve a quem"
      body: "Abre os saldos do grupo para veres o que deves, o que tens a receber e uma lista curta de pagamentos que acerta as contas de todos, calculada por moeda. As despesas questionadas ficam fora das contas até serem resolvidas. No exemplo dos colegas de casa abaixo, seis pagamentos passam a dois."
      shot: S10
      shotAlt: "O ecrã de saldos com dívidas simplificadas em duas moedas, com Mostrar tudo ativado"
    - title: "Paga como quiseres e depois regista"
      body: "Transferência bancária, dinheiro, um favor que se deve desde as últimas férias. O Side Badger não movimenta o dinheiro. Depois de ele mudar de mãos, regista o pagamento e o saldo atualiza-se para todos."
      shot: S11
      shotAlt: "O formulário de pagamento com botões de acerto rápido e o aviso mostrado para um pagamento parcial"
    - title: "Confirma que chegou"
      body: "O pagamento entra no histórico do grupo, onde todas as pessoas do grupo o podem ver e reagir com um emoji. Celebra um pagamento quando ele chega."
      shot: S12
      shotAlt: "O histórico de pagamentos com reações de emoji num pagamento"
