meta:
  title: "Sut i rannu cost penwythnos stag neu blu | Side Badger"
  description: "Mae'r gwestai anrhydedd yn talu dim ac mae pawb yn dal i siarad â'i gilydd erbyn dydd Llun. Sut i rannu penwythnos stag neu blu, gyda'r symiau."
h1: "Sut i rannu cost penwythnos stag neu blu"
navLabel: "Penwythnos stag neu blu"
lead: "Mae'r gwestai anrhydedd yn talu dim, felly mae gweddill y grŵp yn rhannu pob cost [yn gyfartal](page:feature/split-expenses) rhyngddynt. Gadewch bobl allan o'r costau y maent yn eu hepgor, a chadwch y gwestai anrhydedd allan o'r grŵp fel bod y syrpréis yn dal i fod yn syrpréis."
cta:
  heading: "Cadw'r cyfrif, cadw'r syrpréis"
  body: "Gwnewch grŵp, anfonwch y ddolen at bawb ac eithrio'r gwestai anrhydedd ac ychwanegwch bob cost wrth iddi ddigwydd. Mae Side Badger am ddim, heb hysbysebion a heb gyfyngiadau dyddiol."
sections:
  - heading: "Pedwar ffrind ac un syrpréis"
    body: "Mae Hannah, Isla, Jess a Kat yn mynd â Grace i ffwrdd ar gyfer ei phenwythnos plu. Grace yw'r gwestai anrhydedd, felly dyw hi'n talu am ddim. Dyw hi ddim yn y grŵp chwaith, felly all hi ddim gweld beth mae ei ffrindiau'n ei wario arni. Mae Hannah yn archebu'r bwthyn, mae Isla yn talu am y diwrnod sba, mae Jess yn talu am swper ac mae Kat yn gofalu am y tacsi. Erbyn dydd Sul mae pawb wedi talu am rywbeth, ac ni all neb ddweud pwy sydd ar y blaen. Mae'r symiau yr un fath ar gyfer penwythnos stag neu blu, pwy bynnag yw'r gwestai anrhydedd."
  - heading: "Rhannwch yn ôl y bobl sy'n talu, nid y bobl sydd yno"
    body: "Dyw cyfran y gwestai anrhydedd ddim yn diflannu. Mae'n cael ei rhannu rhwng pawb arall. Mae'r bwthyn yn costio £720 a phedwar ffrind sy'n talu amdano, felly mae'n £180 yr un, ac mae lle Grace eisoes yn y ffigur hwnnw. Mae swper yn £260, felly £65 yr un. Mae'r tacsi yn £44, felly £11 yr un. Mae unrhyw beth y mae rhywun yn ei hepgor yn cael ei dynnu o'r gost honno yn unig. Mae Kat yn hepgor y sba, felly mae ei £360, sy'n cynnwys lle Grace hefyd, yn cael ei rannu rhwng Hannah, Isla a Jess am £120 yr un. Adiwch y cyfan ac mae £376 yr un yn ddyledus gan Hannah, Isla a Jess am y penwythnos, a £256 gan Kat."
  - heading: "Ei sefydlu yn Side Badger"
    items:
      - "Gwnewch grŵp ar gyfer y penwythnos a rhowch enw diflas iddo, fel Penwythnos bwthyn. Nid yw Grace yn aelod, a dim ond aelodau grŵp all ei weld."
      - "Dewiswch **Gwahodd Eraill** ac anfonwch y ddolen, neu dangoswch y cod QR, dim ond lle na fydd Grace yn ei weld. Mae'r ddolen yn dangos rhagolwg o'r grŵp cyn i unrhyw un ymuno. Dewiswch am ba hyd y bydd yn para, o 15 munud i 5 diwrnod. Mae hen ddolen yn dal i weithio nes iddi ddod i ben, felly peidiwch â'i gadael yn hirach nag sydd ei angen."
      - "Ar gyfer pob cost, dewiswch **Ychwanegu Cost**, rhowch y swm a dewiswch y talwr o dan **Pwy dalodd?** O dan **Rhannu rhwng**, ticiwch y bobl sy'n talu, gan adael allan unrhyw un a'i hepgorodd, fel Kat ar gyfer y sba. Dewiswch **Cyfartal** o dan **Sut i rannu**."
      - "Pan fyddwch adref, agorwch **Balansau** y grŵp. Mae Side Badger yn dangos pwy sy'n ddyledus i bwy ac yn awgrymu rhestr fer o daliadau. Yma mae tri: Kat yn talu £212 i Hannah, Jess yn talu £116 i Hannah ac Isla yn talu £16 i Hannah. Talwch eich gilydd sut bynnag y dymunwch, yna defnyddiwch **Setlo** i gofnodi pob taliad."
  - heading: "Cyn i chi archebu, cyllideb a blaendal"
    body: "Cytunwch ar y gyllideb cyn i neb archebu. Dewiswch **Ychwanegu Pleidlais**, gofynnwch faint fydd y grŵp yn ei wario ar y bwthyn a chynigiwch rai ffigurau fel opsiynau. Trowch **Pleidleisio anhysbys** ymlaen pan fyddwch yn ei chreu, i guddio pwy bleidleisiodd dros beth, fel nad oes rhaid i neb amddiffyn cyllideb lai yn uchel. Caewch y bleidlais unwaith y bydd pawb wedi pleidleisio ac mae'r enillydd yn ymddangos. Yna daw'r blaendal. Mae pwy bynnag sy'n archebu yn ei dalu ac yn ei ychwanegu fel cost, wedi'i rhannu'n gyfartal, ac mae'r balans yn mynd i mewn fel ail gost pan fydd yn ddyledus. Gall y lleill anfon eu cyfran ar unwaith a chofnodi'r taliad, neu aros am y cyfrif terfynol. Mae'r balansau'n dod allan yr un fath y naill ffordd neu'r llall."
  - heading: "Pan fydd rhywun yn ymuno am un noson"
    body: "Ni ddylai ffrind sy'n cyrraedd ar gyfer dydd Sadwrn yn unig dalu am ddydd Gwener. Gadewch nhw allan o'r costau nad oeddent yn rhan ohonynt. Lle mae'r gost yn dibynnu ar ba mor hir mae pob person yn aros, fel ystafell, dewiswch **Union symiau** o dan **Sut i rannu** a theipiwch gyfran pob person, sy'n gorfod adio i'r cyfanswm. Gweithiwch allan pris fesul person fesul noson yn gyntaf, yna lluoswch â'r nosweithiau y mae pob person yn aros. Mae gan y dudalen [teithiau grŵp](page:use-case/group-trips) fwy am gostau nad ydynt yr un fath i bawb."
  - heading: "Beth nad yw Side Badger yn ei wneud yma"
    items:
      - "Dyw Side Badger byth yn symud arian. Rydych yn talu eich gilydd trwy drosglwyddiad banc, arian parod neu beth bynnag sy'n gyfleus, yna'n cofnodi'r taliad fel bod y balansau'n diweddaru i bawb."
      - "Dyw Side Badger ddim yn anfon nodiadau atgoffa talu. Mae pwniad bach cyfeillgar yn y sgwrs grŵp yn dal i fod yn waith i berson."
      - "Mae gan bob cost un talwr, ac ni all Side Badger rannu derbynneb fesul llinell. Os talodd dau gerdyn am y bwthyn, rhowch ef i mewn fel dwy gost. Os archebodd rhai pobl ychwanegiadau adeg swper, rhowch yr ychwanegiadau i mewn fel cost ar wahân."
      - "Mae'n cadw cyfrif o'r arian, nid yr amserlen. Mae pleidleisiau a sylwadau'n aros ar y costau, felly mae'r cynlluniau ar gyfer y penwythnos yn aros yn eich sgwrs grŵp."
