meta:
  title: "Μοιραστείτε έξοδα σε 140 νομίσματα, μετατρεμμένα ή ξεχωριστά"
  description: "Καταχωρίστε κάθε έξοδο στο νόμισμα που πληρώσατε, κρατήστε τα υπόλοιπα ξεχωριστά ή μετατρέψτε με μια ισοτιμία που βλέπετε και αλλάζετε, και μετά τακτοποιηθείτε με μια σύντομη λίστα πληρωμών."
h1: "Μοιραστείτε έξοδα σε 140 νομίσματα"
navLabel: "Πολλά νομίσματα"
lead: "Ευρώ, γεν και εκείνο το ταξί σε μπαχτ. Το Side Badger δέχεται κάθε έξοδο στο νόμισμα που πληρώσατε, κρατά τα υπόλοιπα σε τάξη και μπορεί να μετατρέπει όταν η ομάδα προτιμά να τακτοποιηθεί μία φορά. Λειτουργεί σε 140 νομίσματα και ταιριάζει φυσικά στα [ομαδικά ταξίδια](page:use-case/group-trips)."
cta:
  heading: "Φέρτε τα ευρώ σας, φέρτε τα γεν σας"
  body: "Δημιουργήστε λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το πρώτο έξοδο στο όποιο νόμισμα τύχαινε να έχετε."
  button: "Δημιουργία δωρεάν λογαριασμού"
problem:
  heading: "Καταχωρίστε το όπως πληρώθηκε"
  body: "Ένα ταξίδι σπάνια πληρώνεται σε ένα νόμισμα. Το ξενοδοχείο κλείστηκε στο σπίτι σε λίρες, το δείπνο πληρώθηκε σε γεν και ο καφές στο αεροδρόμιο σε ό,τι χρησιμοποιούσε η ενδιάμεση στάση. Το να μετατρέπετε τα πάντα με το χέρι πριν καν τα πληκτρολογήσετε είναι ο τρόπος με τον οποίο εγκαταλείπονται τα φύλλα εργασίας. Στο Side Badger καταχωρίζετε κάθε έξοδο στο νόμισμα της απόδειξης και κάθε ποσό ακολουθεί τους κανόνες του νομίσματός του, οπότε τα γεν δεν έχουν δεκαδικά και τα δηνάρια έχουν τρία. Τα νομίσματα που χρησιμοποιήσατε πρόσφατα εμφανίζονται πρώτα στη λίστα."
workflow:
  heading: "Κρατήστε τα νομίσματα ξεχωριστά ή μετατρέψτε στην πορεία"
  steps:
    - title: "Προσθέστε το έξοδο στο δικό του νόμισμα"
      body: "Διαλέξτε το νόμισμα, πληκτρολογήστε το ποσό, πείτε ποιος πλήρωσε και ποιοι το μοιράστηκαν. Τίποτε άλλο δεν χρειάζεται. Αυτή είναι η προεπιλογή και κρατά το αρχικό ποσό ακριβώς όπως το καταχωρίσατε."
      shot: S07
      shotAlt: "Η φόρμα εξόδου με καταχωρισμένο ποσό σε γεν"
    - title: "Παρακολουθήστε ένα υπόλοιπο για κάθε νόμισμα"
      body: "Τα υπόλοιπα τηρούνται ξεχωριστά ανά νόμισμα και καθένα έχει τη δική του σύντομη λίστα προτεινόμενων πληρωμών. Οι λίρες τακτοποιούνται σε λίρες και τα γεν σε γεν."
      shot: S10
      shotAlt: "Η οθόνη υπολοίπων με απλοποιημένα χρέη σε δύο νομίσματα"
    - title: "Ή μετατρέψτε, όταν η ομάδα προτιμά να τακτοποιηθεί μία φορά"
      body: "Διαλέξτε άλλο νόμισμα καθώς καταχωρίζετε το έξοδο και το Side Badger μπορεί να το μετατρέψει με μια τρέχουσα συναλλαγματική ισοτιμία, την οποία μπορείτε να αλλάξετε σε αυτήν που ίσχυσε στην πραγματικότητα. Το μετατρεμμένο ποσό προστίθεται στο υπόλοιπο σε εκείνο το νόμισμα. Η μετατροπή είναι επιλογή της ομάδας, ποτέ κάτι που γίνεται πίσω από την πλάτη σας."
options:
  heading: "Μια ισοτιμία που βλέπετε και αλλάζετε"
  items:
    - title: "Η ισοτιμία εμφανίζεται"
      body: "Όταν μετατρέπετε, η ισοτιμία και το μετατρεμμένο ποσό εμφανίζονται στη φόρμα, ώστε κανείς να μην χρειάζεται να πιστέψει έναν αριθμό στα τυφλά."
    - title: "Πληκτρολογήστε τη δική σας"
      body: "Πήρατε καλύτερη ισοτιμία από ένα γραφείο συναλλάγματος ή χειρότερη από το αεροδρόμιο; Αλλάξτε την ισοτιμία σε αυτήν που ίσχυσε και το μετατρεμμένο ποσό ενημερώνεται."
    - title: "Το πρωτότυπο μένει"
      body: "Το αρχικό ποσό μένει στο έξοδο, δίπλα στο μετατρεμμένο, για όποιον ρωτήσει πόσο ήταν σε γεν."
    - title: "Η μετατροπή είναι δωρεάν"
      body: "Η μετατροπή δεν κοστίζει τίποτα. Δεν υπάρχει χρέωση για την καταχώριση ενός εξόδου σε άλλο νόμισμα."
