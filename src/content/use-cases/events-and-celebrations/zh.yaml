faq:
  heading: 常见问题
  items:
    - q: 宾客不加入群组也能看到吗？
      a: 不能。大家通过链接或二维码并使用免费账户加入，进入之后才能看到群组。
    - q: Side Badger 能代收款项吗？
      a: 不能。Side Badger 只负责记账，从不转移资金。你们想怎么付就怎么付，然后记录这笔付款。它免费，无广告，无每日限制；参见[定价](page:pricing)。
    - q: 投票可以匿名吗？
      a: 可以。创建投票时你可以隐藏谁投了什么。这些设置只能在第一票之前更改。
    - q: 大家可以出不一样的金额吗？
      a: 可以。按确切金额分摊支出，这样每个人的份额就是你们商定的数字，或者把没参与的人排除在外。
    - q: 可以让组织者来管账吗？
      a: 可以。使用受管群组预设，只有创建者和管理员可以更改支出，由管理员批准新成员。
