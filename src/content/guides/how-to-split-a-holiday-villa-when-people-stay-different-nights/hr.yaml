faq:
  heading: "Pitanja o vili"
  items:
    - q: "Što ako netko otkaže?"
      a: "Oduzmi njegove noći, ponovi račun i uredi trošak za vilu tako da se točni iznosi opet zbrajaju u cijenu. Prethodna verzija ostaje sačuvana, a izmjena se vidi u aktivnostima grupe, pa nitko ne mijenja broj kriomice. Tko smije uređivati, ovisi o dopuštenjima grupe."
    - q: "Treba li onaj tko je rezervirao platiti manje?"
      a: "To odlučuje grupa. Rezerviranje je obveza, a grupe se razlikuju oko toga zaslužuje li popust. Što god dogovorite, ugradite u točne iznose i zapišite u bilješku uz trošak ili u komentar pokraj njega, da se nitko ne mora sjećati dogovora."
    - q: "Možemo li naknadu za čišćenje podijeliti drukčije?"
      a: "Da. Unesi naknadu kao zaseban trošak i daj joj vlastitu podjelu. Jednako odgovara paušalnoj naknadi za cijelu kuću. Točni iznosi odgovaraju grupi koja želi da i naknada prati noći."
