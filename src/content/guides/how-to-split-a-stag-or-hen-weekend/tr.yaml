meta:
  title: "Bekarlığa veda hafta sonunun masrafı nasıl bölüşülür | Side Badger"
  description: "Günün kahramanı hiçbir şey ödemez ve pazartesiye herkes hâlâ birbiriyle konuşuyordur. Bekarlığa veda hafta sonu nasıl bölüşülür, hesaplarla."
h1: "Bekarlığa veda hafta sonunun masrafı nasıl bölüşülür"
navLabel: "Bekarlığa veda hafta sonu"
lead: "Günün kahramanı hiçbir şey ödemez; bu yüzden grubun geri kalanı her masrafı kendi aralarında [eşit](page:feature/split-expenses) bölüşür. İnsanları atladıkları masraflardan çıkarın ve sürpriz bozulmasın diye günün kahramanını grubun dışında tutun."
cta:
  heading: "Hesabı tutun, sürprizi koruyun"
  body: "Bir grup kurun, bağlantıyı günün kahramanı dışında herkese gönderin ve her masrafı olduğu anda ekleyin. Side Badger ücretsizdir; reklam ve günlük sınır yok."
sections:
  - heading: "Dört arkadaş ve bir sürpriz"
    body: "Hannah, Isla, Jess ve Kat, Grace'i bekarlığa veda hafta sonu için götürüyor. Grace günün kahramanı, yani hiçbir şey ödemiyor. Ayrıca grupta da değil; bu yüzden arkadaşlarının onun için ne harcadığını göremiyor. Hannah kulübeyi tutuyor, Isla spa gününü ödüyor, Jess akşam yemeğini üstleniyor ve Kat taksiyi alıyor. Pazara gelindiğinde herkes bir şey ödemiş oluyor ve kimin önde olduğunu kimse söyleyemiyor. Günün kahramanı kim olursa olsun, erkeklerin ya da kadınların bekarlığa veda hafta sonunda hesap aynıdır."
  - heading: "Orada olanlara değil, ödeyenlere bölün"
    body: "Günün kahramanının payı yok olmaz. Paylaştırılır. Kulübe 720 £ tutuyor ve dört arkadaş ödüyor; yani kişi başı 180 £ ve Grace'in yeri zaten bu rakamın içinde. Akşam yemeği 260 £, yani kişi başı 65 £. Taksi 44 £, yani kişi başı 11 £. Birinin atladığı her şey yalnızca o harcamadan çıkar. Kat spaya gitmiyor; bu yüzden Grace'in yerini de kapsayan 360 £'luk spa, Hannah, Isla ve Jess arasında kişi başı 120 £ olarak paylaşılır. Hepsini toplayın; Hannah, Isla ve Jess hafta sonundan 376 £'ar, Kat 256 £ borçlu."
  - heading: "Side Badger'da kurulumu"
    items:
      - "Hafta sonu için bir grup kurun ve ona sıkıcı bir ad verin, örneğin Kulübe hafta sonu. Grace üye değil ve bir grubu yalnızca üyeleri görebilir."
      - "**Başkalarını davet et**'i seçin ve bağlantıyı gönderin ya da QR kodunu, yalnızca Grace'in görmeyeceği bir yerde gösterin. Bağlantı, kimse katılmadan önce grubun bir önizlemesini gösterir. Ne kadar süreceğini 15 dakikadan 5 güne kadar seçin. Eski bir bağlantı süresi dolana kadar çalışmaya devam eder; bu yüzden gerekenden uzun bırakmayın."
      - "Her masraf için **Harcama Ekle**'yi seçin, tutarı girin ve ödeyeni **Kim ödedi?** altından seçin. **Şunlar arasında bölüştür** altında ödeyenleri işaretleyin, onu atlayanları dışarıda bırakın; örneğin spa için Kat. **Nasıl bölüştürülsün** altında **Eşit**'i seçin."
      - "Eve döndüğünüzde grubun **Bakiyeler** bölümünü açın. Side Badger kimin kime borçlu olduğunu gösterir ve kısa bir ödeme listesi önerir. Burada üç ödeme: Kat, Hannah'ya 212 £ öder, Jess, Hannah'ya 116 £ öder ve Isla, Hannah'ya 16 £ öder. Birbirinize istediğiniz yolla ödeyin, sonra her ödemeyi kaydetmek için **Ödeş**'i kullanın."
  - heading: "Rezervasyondan önce bir bütçe ve bir depozito"
    body: "Kimse rezervasyon yapmadan önce bütçede anlaşın. **Anket Ekle**'yi seçin, grubun kulübeye ne harcayacağını sorun ve seçenek olarak birkaç rakam sunun. Kimin neye oy verdiğini gizlemek için oluştururken **Anonim oylama**'yı açın; böylece kimse daha küçük bir bütçeyi yüksek sesle savunmak zorunda kalmaz. Herkes oy verip kazanan göründüğünde anketi kapatın. Sonra depozito gelir. Rezervasyonu yapan öder ve bunu eşit bölüşülen bir harcama olarak ekler; bakiye de vadesi geldiğinde ikinci bir harcama olarak girer. Diğerleri paylarını hemen gönderip ödemeyi kaydedebilir ya da son hesabı bekleyebilir. Bakiyeler her iki durumda da aynı çıkar."
  - heading: "Biri bir geceliğine katıldığında"
    body: "Yalnızca cumartesiye gelen bir arkadaş cuma için ödememeli. Onu katılmadığı masraflardan çıkarın. Masrafın her kişinin ne kadar kaldığına bağlı olduğu durumlarda, örneğin bir oda, **Nasıl bölüştürülsün** altında **Tam tutarlar**'ı seçin ve her kişinin payını yazın; paylar toplamda genel toplamı vermelidir. Önce kişi başı gece fiyatını hesaplayın, sonra her kişinin kaldığı gece sayısıyla çarpın. Herkes için aynı olmayan masraflar hakkında daha fazlası [grup gezileri](page:use-case/group-trips) sayfasında."
  - heading: "Side Badger burada neyi yapmaz"
    items:
      - "Parayı hiç taşımaz. Birbirinize banka havalesi, nakit ya da size uyan yolla ödersiniz, sonra bakiyeler herkes için güncellensin diye ödemeyi kaydedersiniz."
      - "Ödeme hatırlatıcısı göndermez. Grup sohbetine nazik bir dürtme yazmak hâlâ bir insana kalıyor."
      - "Her harcamanın tek bir ödeyeni vardır ve Side Badger bir fişi satır satır bölemez. Kulübeyi iki kart ödediyse iki harcama olarak girin. Bazıları akşam yemeğinde fazladan bir şey sipariş ettiyse fazlalıkları kendi harcamaları olarak girin."
      - "Parayı tutar, gezi programını tutmaz. Anketler ve yorumlar masraflarda kalır; hafta sonunun planları grup sohbetinizde kalır."
