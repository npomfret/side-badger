faq:
  heading: "প্রশ্ন"
  items:
    - q: "কারও ঘর বড়, কিন্তু আলো কম হলে?"
      a: "মেঝের মাপ শুধু শুরুর বিন্দু, তাই গ্রুপ চাইলে সামঞ্জস্য করে নিতে পারে। অন্ধকার ঘর থেকে এক-দুই পয়েন্ট কমিয়ে বাকিদের দিন, আর শতাংশের যোগফল এখনও 100 কি না দেখে নিন। আপনারা যা ঠিক করেন Side Badger সেটাই রাখে, বিচার করে না।"
    - q: "বিলও কি ঘরের আকার ধরে ভাগ করা উচিত?"
      a: "সাধারণত না। বিদ্যুৎ আর ব্রডব্যান্ড সবাই ব্যবহার করে, তাই সমান ভাগই সহজ, যেমন ওপরের উদাহরণে। কোনো রুমমেট সারাদিন বাড়িতে থাকলে গ্রুপ অন্য কিছুতে একমত হতে পারে, যেমন সঠিক পরিমাণ। অন্য বিকল্পগুলোর জন্য দেখুন [খরচ ভাগ করা](page:feature/split-expenses)।"
    - q: "আমরা কি পরে ভাগটা বদলাতে পারি?"
      a: "নতুন খরচের জন্য হ্যাঁ। ভাড়া কপি করার সময় শতাংশ বদলান, আর আগের মাসগুলো যেমন ছিল তেমনই থাকে। আগের কোনো খরচ শুধরাতে চাইলে, গ্রুপের অনুমতি দিলে সেটা সম্পাদনা করুন, আর আগে বাড়ির সবাইকে জানিয়ে দিন, কারণ ব্যালেন্স বদলে যায়। আগের সংস্করণ রাখা থাকে।"
