faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah kalkulatornya gratis?"
      a: "Ya. Gratis. Tanpa iklan. Tanpa batas harian. Anda juga tidak perlu akun."
    - q: "Apakah kalkulatornya menyimpan yang saya ketik?"
      a: "Tidak. Tidak ada yang disimpan atau dikirim ke mana pun. Untuk menyimpan angka Anda, pakai Salin tautan dan simpan tautannya di suatu tempat."
    - q: "Siapa yang bisa melihat tautan yang saya salin?"
      a: "Siapa pun yang memilikinya. Angkanya ada di dalam tautan itu sendiri, setelah tanda #, jadi bagikan hanya kepada orang yang memang boleh melihatnya."
    - q: "Apakah kalkulatornya memindahkan uang?"
      a: "Tidak. Kalkulator hanya menghitung siapa yang sebaiknya membayar siapa, dan Anda membayar satu sama lain dengan cara apa pun yang disuka. Side Badger juga tidak pernah menyentuh uang Anda. Lihat [pelunasan](page:feature/settle-up)."
    - q: "Bisakah saya membagi perjalanan yang dibayar dalam dua mata uang?"
      a: "Tidak di sini, karena satu perhitungan hanya punya satu mata uang. Dalam grup, tiap mata uang punya saldonya sendiri. Lihat [beberapa mata uang](page:feature/multiple-currencies)."
    - q: "Bagaimana jika jumlahnya tidak cocok?"
      a: "Kalkulator memberi tahu di bawah pengeluaran itu dan tidak menampilkan hasil sampai cocok. Jumlah pasti harus berjumlah sama dengan totalnya, dan persentase harus berjumlah 100."
