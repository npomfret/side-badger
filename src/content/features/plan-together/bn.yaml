meta:
  title: "গ্রুপের খরচের জন্য যৌথ তালিকা, পোল আর মন্তব্য | Side Badger"
  description: "খরচে মন্তব্য করুন, গোলমেলে খরচে প্রশ্ন তুলুন, যৌথ বাজারের তালিকা রাখুন, ভিলা নিয়ে ভোট দিন। একসঙ্গে পরিকল্পনা করে তারপর ভাগ করুন। বিনামূল্যে, বিজ্ঞাপন ছাড়া।"
h1: "একসঙ্গে পরিকল্পনা, তারপর ভাগ"
navLabel: "একসঙ্গে পরিকল্পনা"
lead: "বাজারের তালিকা আর বাজারের বিল, অবশেষে কথা বলছে একে অপরের সঙ্গে। টাকা খরচের আগে ও পরে তা নিয়ে কথা বলার একটা জায়গা Side Badger আপনার গ্রুপকে দেয়: প্রতিটি খরচে মন্তব্য, গোলমেলে মনে হওয়া খরচ নিয়ে প্রশ্ন তোলার উপায়, আর বড় সিদ্ধান্তের জন্য যৌথ তালিকা ও পোল। তারপর যথারীতি [খরচ ভাগ করুন](page:feature/split-expenses)।"
cta:
  heading: "আগে পরিকল্পনা, তারপর ভাগ"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম তালিকা, পোল বা প্রশ্নটা টাকার ঠিক পাশেই রাখুন। এরপর কী হয় নিশ্চিত নন? দেখুন [কীভাবে কাজ করে](page:how-it-works)।"
problem:
  heading: "চ্যাট এখানে, বিল ওখানে"
  body: "গ্রুপের খরচ সাধারণত দুই জায়গায় থাকে। সংখ্যাগুলো এক জায়গায়, আর সংখ্যা নিয়ে তর্ক থাকে এমন একটা চ্যাটে যা মঙ্গলবারেই স্ক্রল করে হারিয়ে গেছে। বাজারের তালিকা একটা ফ্রিজের ছবি। ভিলা ঠিক হয়েছে বেশিরভাগ মানুষের একটা থাম্বস-আপে, সম্ভবত। Side Badger পরিকল্পনাটা গ্রুপের ভেতরেই রাখে, যে খরচের কথা হচ্ছে তার পাশে, তাই খরচের জায়গায় একটা মন্তব্য থাকে, বাজারের জায়গায় একটা তালিকা, বড় সিদ্ধান্তের জন্য একটা পোল, আর এক অনুচ্ছেদ না লিখে “দাঁড়াও, এটা কি ঠিক?” বলার একটা উপায়। সবকিছুই থাকে গ্রুপের টাকা নিয়ে, গ্রুপটা যার জন্য।"
workflow:
  heading: "ভিলার ভোট থেকে বাজারের বিল"
  steps:
    - title: "বড় সিদ্ধান্তটা ভোটে দিন"
      body: "বিলের অঙ্ক ঠিক করে দেয় এমন সিদ্ধান্তের জন্য একটি পোল যোগ করুন, যেমন কোন ভিলা। দুই থেকে দশটি বিকল্প বেছে নিন, প্রত্যেকের কতটি ভোট থাকবে তা বলে দিন, তারপর সবাই ভোট দিলে পোলটি বন্ধ করুন, আর বিজয়ী চিহ্নিত হয়ে যায়।"
      shot: S17
      shotAlt: "একটি বন্ধ পোল, বিজয়ী বিকল্প চিহ্নিত আর প্রতিটি বিকল্পের পাশে ভোটের সংখ্যা"
    - title: "বাজারের তালিকা একসঙ্গে লিখুন"
      body: "একটি যৌথ তালিকা শুরু করুন, জিনিসগুলো যোগ করুন, আর ট্রলিতে উঠলে টিক দিন। বাজারটা পরে খরচ হিসেবে ঢোকে।"
      shot: S16
      shotAlt: "একটি যৌথ বাজারের তালিকা, কিছু জিনিসে টিক দেওয়া আর এগিয়ে যাওয়ার সংখ্যাসহ"
    - title: "খরচের কথা বলুন সেখানেই, যেখানে সে থাকে"
      body: "খরচটার ওপরেই মন্তব্য করুন, রসিদ জুড়ে দিন আর ইমোজি দিয়ে রিঅ্যাক্ট করুন। কথাবার্তা থাকে সেই সংখ্যাটার পাশেই যা নিয়ে কথা।"
      shot: S08
      shotAlt: "একটি খরচ তার বিবরণ, রসিদের থাম্বনেইল, মন্তব্যের সুতো আর ইমোজি রিঅ্যাকশনসহ"
    - title: "যেটা গোলমেলে লাগে সেটা নিয়ে প্রশ্ন তুলুন"
      body: "গ্রুপ খরচ নিয়ে প্রশ্ন তোলা চালু করে থাকলে, খরচে অন্তর্ভুক্ত যে কেউ **আমার একটি প্রশ্ন আছে** বেছে নিতে পারে। প্রশ্নটার সুরাহা না হওয়া পর্যন্ত খরচটা ব্যালেন্সের বাইরে থাকে।"
      shot: S18
      shotAlt: "খরচের তালিকা, প্রশ্নবিদ্ধ ব্যাজ আর শুধুমাত্র প্রশ্নবিদ্ধ ফিল্টারসহ"
    - title: "দেখুন কী বদলেছে, আর কে বদলেছে"
      body: "কার্যকলাপের ফিড আর বিজ্ঞপ্তির ঘণ্টা দেখায় আপনার গ্রুপগুলোতে নতুন কী হয়েছে। চাইলে পুশ বিজ্ঞপ্তিও আছে।"
      shot: S19
      shotAlt: "বিজ্ঞপ্তির ড্রপডাউন, সাম্প্রতিক কার্যকলাপের তালিকাসহ"
