faq:
  heading: "Pytania"
  items:
    - q: "Kto powinien zarejestrować płatność, płacący czy odbierający?"
      a: "Rejestrowanie płatności wymaga uprawnienia do edycji wydatków, a formularz pyta **Kto zapłacił?** i **Kto otrzymał płatność?** Później może ją edytować tylko osoba, która ją zarejestrowała, więc zwykle najprościej, gdy robi to płacący, przyciskiem szybkiego rozliczenia."
    - q: "Co, jeśli wyjazd odbywał się w dwóch walutach?"
      a: "Salda są prowadzone osobno dla każdej waluty, więc dług w euro zostaje długiem w euro, a każda waluta dostaje własną krótką listę, chyba że wydatki przeliczono przy wpisywaniu. [Kilka walut](page:guide/how-to-split-a-trip-paid-in-several-currencies) pokazuje oba sposoby."
    - q: "Rozliczać się w trakcie wyjazdu czy na końcu?"
      a: "Jedno i drugie działa. Każda zarejestrowana płatność zmienia salda, więc płatność z połowy wyjazdu liczy się do końcowej listy. Na końcu jest prościej, bo [cały wyjazd](page:use-case/group-trips) jest w jednym miejscu."
