featuresHeading: "Pe ce se sprijină o excursie"
faq:
  heading: "Întrebări"
  items:
    - q: "Pot fi excluși cei care au sărit peste cină?"
      a: "Da. Alege cine a participat la fiecare cheltuială și doar ei sunt taxați pentru ea."
    - q: "Funcționează fără semnal?"
      a: "Nu. Side Badger are nevoie de o conexiune, așa că adaugă costurile când ai din nou wifi."
    - q: "Trebuie să instaleze toți ceva?"
      a: "Nu. Rulează în browser. Trimite linkul de invitație și oamenii se alătură de pe telefon."
    - q: "Ce curs de schimb folosește?"
      a: "Un curs de schimb actual când introduci cheltuiala, sau al tău, dacă ai primit altul. Cursul se fixează la salvarea cheltuielii, deci cheltuielile vechi nu sunt niciodată reevaluate."
    - q: "Putem îngheța grupul după excursie?"
      a: "Da. Un administrator poate bloca grupul, ca cifrele să rămână pe loc."
    - q: "Există o limită pentru sume?"
      a: "Da. 999.999,99 pe cheltuială, în propria valută."
