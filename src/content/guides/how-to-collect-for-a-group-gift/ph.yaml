faq:
  heading: Mga tanong
  items:
    - q: Paano kung mas malaki ang nakolekta kaysa sa presyo ng regalo?
      a: Dapat umabot sa presyo ang eksaktong halaga, kaya bawasan ang mga bahagi hanggang umabot. O gamitin ang sobra sa isang bagay na totoo, gaya ng bulaklak, at ilagay iyon bilang pangalawang gastos, gaya ng card at pambalot sa halimbawa.
    - q: Puwede bang mag-ambag ang isang tao nang hindi sumasali sa grupo?
      a: Hindi, kung gusto mo siyang isama sa bilang. Kailangan ng libreng account ang bawat kasali sa hati at dapat nasa grupo siya. Para sa taong cash lang ang hawak, puwede itong tanggapin ni Priya at ilagay ang regalo sa halagang utang pa ng grupo. Halimbawa, kung nagbigay si Sam kay Priya ng £40 na cash, maglalagay si Priya ng £200 at hahatiin ito sa 60, 60, at 80 sa pagitan niya, ni Omar, at ni Lena.
    - q: Puwede bang magpasya ang poll kung magkano ang ambag ng bawat isa?
      a: Hindi. Ang poll ay nagpapasya ng numero para sa buong grupo, gaya ng budget. Kayo ang magkakasundo sa bahagi ng bawat tao, saka i-type ito sa gastos bilang **Eksaktong halaga**.
