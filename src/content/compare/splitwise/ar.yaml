faq:
  heading: "أسئلة"
  items:
    - q: "هل Side Badger بديل مجاني لـ Splitwise؟"
      a: "لتقسيم الفواتير في مجموعة، نعم. مسح الإيصالات وتحويل العملات مجانيان، ولا إعلانات، وبلا حدود يومية. وإذا كنت تحتاج إلى تطبيق أصلي أو عمل دون اتصال أو مصروفات متكررة أو دفعات داخل التطبيق، فهذه يفعلها Splitwise ولا يفعلها Side Badger."
    - q: "من أين تأتي تفاصيل Splitwise؟"
      a: "من صفحات Splitwise نفسها: صفحته الرئيسية وصفحة Pro ومركز المساعدة. ويرتبط كل صف في الجدول بالصفحة التي أُخذ منها، ويبيّن التاريخ فوق الجدول متى قرأناها. ونراجعها كل ربع سنة."
    - q: "هل سيبقى Side Badger مجانياً؟"
      a: "كل ما في Side Badger مجاني اليوم، ولا توجد باقة مدفوعة. وإذا تغيّر ذلك يوماً فسنخبرك مسبقاً. وتجد التفاصيل في [صفحة الأسعار](page:pricing)."
    - q: "هل على كل من في مجموعتي أن ينتقل؟"
      a: "نعم. يحتاج كل فرد في المجموعة إلى حساب مجاني في Side Badger، ويمكنه الانضمام برابط أو برمز QR."
    - q: "هل لدى Side Badger تطبيق للجوال؟"
      a: "ليس في متجر تطبيقات. يعمل في متصفحك: سجّل الدخول على هاتفك ثم أضفه إلى شاشتك الرئيسية ليفتح كأنه تطبيق. ويوضح [كيف يعمل](page:how-it-works) الطريقة."
