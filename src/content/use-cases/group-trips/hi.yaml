featuresHeading: "ट्रिप किन चीज़ों पर टिकी होती है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या डिनर छोड़ने वालों को बाहर रखा जा सकता है?"
      a: "हाँ। चुनें कि हर खर्च में कौन शामिल था, और उसका पैसा सिर्फ उन्हीं से लिया जाता है।"
    - q: "क्या यह बिना सिग्नल के चलता है?"
      a: "नहीं। Side Badger को कनेक्शन चाहिए, इसलिए वाई-फाई मिलने पर खर्च जोड़ें।"
    - q: "क्या सबको कुछ इंस्टॉल करना होगा?"
      a: "नहीं। यह ब्राउज़र में चलता है। इनवाइट लिंक भेजें और लोग अपने फोन से जुड़ जाते हैं।"
    - q: "यह कौन-सा एक्सचेंज रेट इस्तेमाल करता है?"
      a: "खर्च डालते समय का मौजूदा एक्सचेंज रेट, या आपका अपना अगर आपको कोई और मिला। रेट खर्च सेव होते ही तय हो जाता है, इसलिए पुराने खर्चों का मूल्य कभी दोबारा नहीं आंका जाता।"
    - q: "क्या ट्रिप के बाद हम ग्रुप फ्रीज़ कर सकते हैं?"
      a: "हाँ। एडमिन ग्रुप को लॉक कर सकता है ताकि संख्याएं वहीं रहें।"
    - q: "क्या राशि की कोई सीमा है?"
      a: "हाँ। हर खर्च पर 999,999.99, उसकी अपनी करेंसी में।"
