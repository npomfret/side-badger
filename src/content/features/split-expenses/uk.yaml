meta:
  title: "Розподіляйте витрати порівну, точно чи у відсотках | Side Badger"
  description: "Розділіть спільну витрату порівну, за точними сумами або у відсотках і пропустіть тих, кого там не було. Безкоштовно, без реклами та без денних обмежень."
h1: "Розподіляйте витрати порівну, точно чи у відсотках"
navLabel: "Розподіл витрат"
lead: "Не все ділиться 50/50. Side Badger дає раду. Скажіть, хто заплатив, оберіть людей, які ділять витрату, і розділіть її **порівну, за точними сумами або у відсотках**. Образи продаються окремо."
cta:
  heading: "Розділіть наступну як слід"
  body: "Створіть безкоштовний обліковий запис, заведіть групу й додайте витрату, яку давно збиралися впорядкувати. Не знаєте, що далі? Подивіться, [як це працює](page:how-it-works), або перевірте, [що охоплює безкоштовний план](page:pricing)."
  button: "Створити безкоштовний обліковий запис"
problem:
  heading: "Не все ділиться 50/50"
  body: "Оренда залежить від розміру кімнати. Подарунок — від того, хто що пообіцяв. Вечеря — від того, хто залишився на десерт. Поділ рахунку навпіл працює до першого рахунку, що не такий, і тоді хтось відкриває таблицю. Side Badger записує, хто заплатив, хто ділить витрату й як вона ділиться, тож баланси виходять правильні й ніхто за столом не ділить у стовпчик."
workflow:
  heading: "Додавання витрати від початку до кінця"
  steps:
    - title: "Скажіть, хто заплатив і за що"
      body: "Введіть суму, короткий опис і людину, яка заплатила. За кожну витрату платить одна людина, що тримає підрахунки чесними."
      shot: S05
      shotAlt: "Форма витрати з орендою котеджу, розділеною у відсотках між трьома людьми"
    - title: "Оберіть розподіл"
      body: "Оберіть порівну, точні суми або відсотки. Відсотки мають у сумі давати 100, а точні суми — у сумі давати загальну."
      shot: S06
      shotAlt: "Форма витрати з точними сумами, введеними для кожної людини за подарунок"
    - title: "Додайте історію"
      body: "Вкажіть дату, додайте мітки, місце та примітку. Усі в групі бачать ті самі подробиці й можуть одразу там коментувати."
      shot: S08
      shotAlt: "Витрата з подробицями, гілкою коментарів і початковою сумою, у якій її введено"
    - title: "Поставте запитання, якщо щось виглядає дивно"
      body: "Якщо група ввімкнула запитання до витрат, кожен, кого включено у витрату, може поставити її під сумнів, а список витрат може показувати лише ті, що під сумнівом."
      shot: S18
      shotAlt: "Список витрат із позначкою Поставлено під сумнів і фільтром Тільки поставлено під сумнів"
options:
  heading: "Три способи розподілу"
  items:
    - title: "Порівну"
      body: "Типово для вечерь, таксі й усього, що всі ділили рівномірно. Якщо сума не ділиться націло, зайва копійка дістається одній людині навмання, не завжди тій самій. У таксі нижче це Ана."
    - title: "За точними сумами"
      body: "Впишіть, скільки хто винен. Добре для подарунка, де кожен обрав іншу ціну, або покупки, де в чийомусь кошику було більше, ніж спільних продуктів. Суми мають у сумі давати загальну."
    - title: "У відсотках"
      body: "Дайте кожному частку загальної суми. Оренда за розміром кімнати — класика: найбільша кімната платить найбільшу частку, і ніхто не вдає, що інакше."
example:
  heading: "Вікенд у котеджі, чотири витрати, три розподіли"
  currency: GBP
  people:
    - id: ana
      name: Ана
    - id: ben
      name: Бен
    - id: cara
      name: Кара
  expenses:
    - label: "котедж, за розміром кімнати"
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: "вечеря"
      payer: ben
      amount: 84
      split:
        method: equal
    - label: "продукти"
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: "таксі додому"
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: "Лише люди, які були там"
    body: "Розділіть витрату між усіма або лише між людьми, які її ділили. Пропускайте людей у витратах, до яких вони не причетні, і баланси це врахують. Сусід, якого цілий тиждень не було, не винен за їжу на виніс, що [сусіди](page:use-case/housemates) визнають базовою справедливістю."
  - heading: "Подробиці, що потім рятують від сварок"
    items:
      - "Вкажіть **дату** й за потреби час. Скорочення на кшталт сьогодні, вчора, сьогодні вранці й учора ввечері заощаджують трохи друку."
      - "Додайте до трьох **міток** для групування витрат, як-от продукти чи подорожі."
      - "Додайте **місце**. Вставте посилання на карту, і назва місця заповниться сама."
      - "Додайте **примітку** з історією за цифрою, з трохи форматування, якщо історія цього потребує."
      - "Додайте до трьох **чеків** як фото чи PDF, щоб доказ залишався при витраті."
      - "Користуйтеся **коментарями**, щоб розмова була поруч із витратою, про яку йдеться, а не в чаті, до якого ніхто не повертається."
  - heading: "Копіюйте, редагуйте й дивіться, що змінилося"
    body: "Скопіюйте оренду минулого місяця замість того, щоб вводити її заново, а потім змініть те, що інакше. Якщо цифра була хибна, відредагуйте витрату. Попередня версія зберігається, а редагування видно в активності групи, тож ніхто не змінює цифру потихеньку. Що кому дозволено редагувати, залежить від дозволів групи."
  - heading: "Коли щось виглядає неправильно"
    body: "Група може ввімкнути запитання до витрат. Кожен, кого включено у витрату, може поставити запитання й сказати чому, а витрата лишається поза балансами, доки людина, яка запитала, або адміністратор його не закриє. Типово вимкнено, а адміністратор вмикає це для групи. Підходить для [подій і свят](page:use-case/events-and-celebrations), де завдаток, якого ніхто не пам'ятає, раптом стає справою всіх."
limits:
  heading: "Обмеження"
  items:
    - "За кожну витрату платить одна людина. Якщо платили двоє, запишіть дві витрати."
    - "Немає розподілу за позиціями чи за частками. Є порівну, точні суми та відсотки."
    - "Відсотки мають у сумі давати 100."
    - "Витрата може становити до 999 999,99 у власній валюті зі звичною для цієї валюти кількістю десяткових знаків."
    - "Витрати не повторюються самі. Натомість скопіюйте витрату минулого місяця."
    - "Дати не можуть бути в майбутньому чи старшими за 10 років."
    - "Витрата, у якій бере участь той, хто залишив групу, стає лише для читання."
useCasesHeading: "Де такий розподіл допомагає"
faq:
  heading: "Запитання"
  items:
    - q: "Чи можуть двоє людей заплатити за одну витрату?"
      a: "Не в одній витраті. Запишіть дві, по одній для кожного платника, і баланси вийдуть однакові."
    - q: "Чи можна розділити чек за позиціями?"
      a: "Ні. Розподіл — порівну, за точними сумами або у відсотках. Для чека з різними позиціями впишіть, скільки винна кожна людина, як точні суми."
    - q: "Чи можна задати типовий розподіл?"
      a: "Ні. Скопіюйте попередню витрату, щоб повторно використати її розподіл, і змініть те, що інакше."
    - q: "Чи можуть рахунки повторюватися щомісяця?"
      a: "Ні. Натомість скопіюйте витрату минулого місяця, це займає кілька секунд."
    - q: "Хто може редагувати витрату?"
      a: "Той, кому це дозволяють дозволи групи. Кожне редагування видно в активності групи, тож зміни ніколи не бувають непомітними."
    - q: "Що далі відбувається з балансами?"
      a: "Вони оновлюються в міру надходження витрат, а [розрахунок](page:feature/settle-up) перетворює їх на короткий список платежів. Якщо витрата в іншій валюті, див. [кілька валют](page:feature/multiple-currencies)."
