services:
  # The service name is this container's alias on snowmonkey-proxy-network,
  # which the edge proxies to, so it must not collide with another project's
  side-badger:
    image: ghcr.io/npomfret/side-badger:latest-me
    container_name: side-badger-website-me
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - snowmonkey-proxy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  snowmonkey-proxy-network:
    external: true
