meta:
  title: "Aplicație de împărțit facturi fără descărcare | Side Badger"
  description: "Telefonul ți-e plin, înțelegem. Side Badger rulează în browser, fără magazin de aplicații și fără descărcare. Pe ecranul principal se deschide ca o aplicație."
h1: "Fără magazin de aplicații. Fără descărcare. Dar se simte ca o aplicație"
navLabel: "Aplicație web"
lead: "Side Badger trăiește în browserul tău. Nu ai de căutat prin niciun magazin de aplicații și nu ai nimic de descărcat mai întâi. Autentifică-te de pe telefon sau de pe computer, împarte cheltuielile online cu grupul și adaugă-o pe ecranul principal sau în Dock când o vrei la o singură atingere distanță."
cta:
  heading: "Deschide-o. Autentifică-te. Începe un grup."
  body: "Creează un cont, începe un grup și adaugă prima cheltuială, totul din browserul pe care îl ai deja deschis. Vrei mai întâi turul? Vezi [cum funcționează](page:how-it-works) sau uită-te la [ce acoperă gratuitul](page:pricing)."
problem:
  heading: "Telefonul tău e plin. Înțelegem."
  body: "Undeva pe el sunt patru mii de poze cu același apus și un avertisment de memorie pe care îl tot dai la o parte din primăvară. Ultimul lucru de care are nevoie e încă o aplicație, doar ca să împarți o cină. Așa că Side Badger este o aplicație web. Rulează într-un browser modern, pe telefon sau pe computer. Pe telefon folosește un aspect pentru mobil, cu pagina grupului împărțită în file și controale ușor de atins. Unele funcții în plus, cum ar fi adăugarea pe ecranul principal, depind de browser, și spunem unde."
workflow:
  heading: "De la fila de browser la ecranul principal în trei pași"
  steps:
    - title: "Deschide-o și autentifică-te"
      body: "Deschide Side Badger în browser și autentifică-te. Ai nevoie doar de o adresă de e-mail și o parolă, iar e-mailul îl verifici înainte de a putea adăuga ceva. Toți din grup au nevoie de un cont, așa că oamenii pe care îi inviți vor face la fel."
    - title: "Adaugă-o pe ecranul principal sau în Dock"
      body: "După ce te autentifici, aplicația se oferă să se instaleze singură. Primești un buton **Instalează** acolo unde browserul o permite și **Arată-mi cum** acolo unde nu. Ai ratat-o sau ai refuzat? **Setări** are același ajutor la **Adaugă pe ecranul principal sau în Dock**. Pe iPhone sau iPad, Setările arată mai întâi pașii pentru iPhone și pun celelalte dispozitive sub **Alte dispozitive**. Oricum ai face, aplicația se deschide apoi într-o fereastră proprie."
      shot: S20
      shotAlt: "Secțiunea Adaugă pe ecranul principal sau în Dock din Setări, cu pașii pentru adăugarea aplicației pe un dispozitiv"
    - title: "Activează notificările, dacă le vrei"
      body: "Notificările sunt oprite până le pornești, iar fiecare dispozitiv se pornește separat. Folosește butonul **Activează** pe care îl oferă clopoțelul de notificări sau comutatorul **Notificări push** din **Setări**. Pe iPhone sau iPad, deschide mai întâi aplicația de pe ecranul principal. Doar de acolo funcționează notificările."
      shot: S19
      shotAlt: "Meniul de notificări deschis, cu activitatea recentă din grup"
options:
  heading: "Cum o adaugi, dispozitiv cu dispozitiv"
  items:
    - title: "iPhone și iPad"
      body: "Atinge butonul Partajează, un pătrat cu o săgeată îndreptată în sus. Dacă nu îl vezi, atinge mai întâi cele trei puncte (•••), apoi Partajează. Derulează în jos și atinge **Adaugă pe ecranul principal**. Lasă activată opțiunea **Deschide ca aplicație web**, apoi atinge **Adaugă**. Dacă un link s-a deschis în interiorul altei aplicații, deschide mai întâi pagina în Safari, pentru că acel browser încorporat nu o poate adăuga."
    - title: "Android"
      body: "Deschide meniul browserului și alege **Adăugați la ecranul de pornire** sau **Instalează aplicația**."
    - title: "Chrome sau Edge pe computer"
      body: "Deschide meniul browserului și alege opțiunea de a instala acest site ca aplicație. Primește apoi propria fereastră și propria pictogramă."
    - title: "Safari pe Mac"
      body: "Alege **Fișier**, apoi **Adaugă în Dock**."
sections:
  - heading: "Notificări, doar dacă le ceri"
    body: "Notificările push sunt opționale. Pornește-le și primești o notificare când apare activitate nouă în grupurile tale, cum ar fi cineva care adaugă o cheltuială, lasă un comentariu sau înregistrează o plată. Se pornesc câte un dispozitiv pe rând, din clopoțelul de notificări sau din **Setări**, și tot de acolo le poți opri din nou. Au nevoie de un browser care le acceptă și de permisiunea ta. Dacă browserul le-a blocat pentru site, permite-le mai întâi din setările browserului. Pe iPhone sau iPad funcționează doar din aplicația adăugată pe ecranul principal, nu dintr-o filă de browser. Livrarea nu este garantată, așa că tratează o notificare ca pe un îndemn, nu ca pe o promisiune. Ce apare în flux găsești la [planifică împreună](page:feature/plan-together)."
  - heading: "Actualizări în direct, fără buton de reîmprospătare"
    body: "Adaugi o cheltuială și toți o văd imediat, împreună cu ce s-a schimbat și cine a schimbat. Fiecare grup păstrează un istoric de activitate, iar clopoțelul de notificări arată activitatea din toate grupurile tale. Nimeni nu trebuie să întrebe dacă ai văzut ce tocmai ai adăugat. E pe ecranul lor."
  - heading: "39 de limbi, fiecare persoană pe a ei"
    body: "Folosește Side Badger în 39 de limbi, inclusiv araba, persana și urdu, care se scriu de la dreapta la stânga. Fiecare persoană din grup își alege limba, așa că aceeași pagină de grup poate fi în arabă pentru o persoană și în engleză pentru următoarea. Singurele lucruri la care grupul trebuie să se pună de acord sunt cifrele."
  - heading: "Făcută pentru mai mult de un fel de utilizator"
    body: "Side Badger este construit cu utilizatorii de tastatură și de cititoare de ecran în minte. Culorile membrilor vin cu modele, ca să nu fie nevoie să deosebești verdele de roșu."
    items:
      - "Linkuri de salt, ca utilizatorii de tastatură să sară direct la conținut."
      - "Dialogurile gestionează focalizarea tastaturii."
      - "Controalele sunt etichetate, pentru cititoarele de ecran."
      - "Aspectul se oglindește pentru limbile care se scriu de la dreapta la stânga."
limits:
  heading: "Ce nu face aplicația web"
  items:
    - "Nu există utilizare offline. Side Badger are nevoie de o conexiune, așa că nu îți va deschide grupul într-un avion fără wifi."
    - "Nu există o aplicație în magazinul de aplicații și nici o aplicație nativă pentru iPhone sau Android. Side Badger este o aplicație web, iar adăugarea ei pe ecranul principal sau în Dock este felul în care obții varianta asemănătoare unei aplicații."
    - "Adăugarea pe ecranul principal sau în Dock depinde de browser. Denumirile din meniuri diferă între browsere și versiuni, iar unele browsere nu o oferă."
    - "Notificările push sunt opționale pentru fiecare dispozitiv și au nevoie de un browser care le acceptă și de permisiunea ta. Pe iPhone sau iPad funcționează doar din aplicația adăugată pe ecranul principal. Livrarea nu este garantată."
    - "Nu există alerte prin e-mail sau SMS și nici mementouri de plată. Activitatea nouă apare în aplicație și ca notificări push, dacă le activezi. Urmărirea unei plăți rămâne treaba ta."
    - "Activitatea se păstrează 90 de zile."
    - "Te autentifici cu o adresă de e-mail și o parolă. Nu există autentificare cu Google sau Apple și trebuie să ai 18 ani sau mai mult."
    - "Nu pretindem că Side Badger este complet accesibil sau că respectă un standard formal de accesibilitate. Dacă ceva îți stă în cale, spune-ne din aplicație și vei vedea acolo răspunsul nostru."
useCasesHeading: "Unde ajută să nu ai nevoie de o aplicație"
faq:
  heading: "Întrebări"
  items:
    - q: "Există o aplicație Side Badger într-un magazin de aplicații?"
      a: "Nu. Side Badger este o aplicație web. O deschizi în browser și o poți adăuga pe ecranul principal sau în Dock, ca să se deschidă ca o aplicație. Nu ai nimic de descărcat dintr-un magazin de aplicații."
    - q: "Pot împărți facturi fără să descarc o aplicație?"
      a: "Da. Deschide Side Badger într-un browser pe telefon sau pe computer, autentifică-te și începe un grup. Adăugarea pe ecranul principal sau în Dock este opțională."
    - q: "Funcționează offline?"
      a: "Nu. Side Badger are nevoie de o conexiune, chiar și atunci când e adăugat pe ecranul principal sau în Dock."
    - q: "De ce nu primesc notificări pe iPhone?"
      a: "Pe iPhone sau iPad, notificările funcționează doar din aplicația adăugată pe ecranul principal, nu dintr-o filă de browser. Adaugă-o, deschide-o din pictograma de pe ecranul principal, apoi activează notificările în **Setări**. Livrarea nu este garantată, așa că, dacă una lipsește, istoricul de activitate al grupului arată în continuare ce s-a adăugat."
    - q: "Trebuie să activez notificările?"
      a: "Nu. Sunt oprite până le pornești, câte un dispozitiv pe rând. Fără ele, activitatea nouă apare tot în aplicație, iar toți văd imediat o schimbare când o au deschisă."
    - q: "Are nevoie toată lumea din grup de un cont?"
      a: "Da. Ai nevoie doar de o adresă de e-mail și o parolă, iar e-mailul îl verifici înainte de a putea adăuga ceva. Toți cei care se alătură unui grup fac la fel, de pe orice telefon sau computer preferă."
