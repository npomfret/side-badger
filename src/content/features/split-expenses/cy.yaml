meta:
  title: "Rhannu treuliau yn gyfartal, yn union neu yn ôl canran | Side Badger"
  description: "Rhannwch gost a rennir yn gyfartal, yn ôl symiau union neu yn ôl canran, a gadewch allan unrhyw un nad oedd yno. Am ddim, heb hysbysebion a heb gyfyngiadau dyddiol."
h1: "Rhannu treuliau yn gyfartal, yn union neu yn ôl canran"
navLabel: "Rhannu treuliau"
lead: "Dyw popeth ddim yn 50/50. Mae Side Badger yn ymdopi. Dywedwch pwy dalodd, dewiswch y bobl a rannodd y gost, a rhannwch hi **yn gyfartal, yn ôl symiau union neu yn ôl canran**. Gwerthir dig ar wahân."
cta:
  heading: "Rhannwch yr un nesaf yn iawn"
  body: "Creu cyfrif am ddim, cychwyn grŵp ac ychwanegu'r gost rydych chi wedi bod yn bwriadu ei threfnu. Ddim yn siŵr beth sy'n dod nesaf? Gweler [sut mae'n gweithio](page:how-it-works), neu edrychwch [beth mae am ddim yn ei gynnwys](page:pricing)."
  button: "Creu cyfrif am ddim"
problem:
  heading: "Dyw popeth ddim yn 50/50"
  body: "Mae rhent yn dilyn maint yr ystafell. Mae anrheg yn dilyn pwy addawodd beth. Mae swper yn dilyn pwy arhosodd am bwdin. Mae rhannu bil yn ei hanner yn gweithio nes y bil cyntaf nad yw'n hanner, ac yna mae rhywun yn agor taenlen. Mae Side Badger yn cofnodi pwy dalodd, pwy rannodd y gost a sut mae'n rhannu, fel bod y balansau'n dod allan yn iawn heb i neb wneud rhannu hir wrth y bwrdd."
workflow:
  heading: "Ychwanegu cost, o'r dechrau i'r diwedd"
  steps:
    - title: "Dweud pwy dalodd a pham"
      body: "Rhowch y swm, disgrifiad byr a'r person a dalodd. Mae un person yn talu am bob cost, sy'n cadw'r rhifyddeg yn onest."
      shot: S05
      shotAlt: "Y ffurflen gost gyda rhent bwthyn wedi'i rannu yn ôl canran rhwng tri pherson"
    - title: "Dewis y rhaniad"
      body: "Dewiswch yn gyfartal, symiau union neu ganrannau. Rhaid i ganrannau adio i 100, a rhaid i symiau union adio i'r cyfanswm."
      shot: S06
      shotAlt: "Y ffurflen gost gyda symiau union wedi'u rhoi ar gyfer pob person ar anrheg"
    - title: "Ychwanegu'r stori"
      body: "Gosodwch y dyddiad, ychwanegwch labeli, lle a nodyn. Mae pawb yn y grŵp yn gweld yr un manylion, a gallant roi sylw yn y fan a'r lle."
      shot: S08
      shotAlt: "Cost gyda'i manylion, sgwrs sylwadau a'r swm gwreiddiol y'i rhoddwyd ynddo"
    - title: "Codi cwestiwn os yw rhywbeth yn edrych yn od"
      body: "Os yw'r grŵp wedi troi cwestiynau cost ymlaen, gall unrhyw un sy'n rhan o gost ei holi, a gall rhestr y costau ddangos dim ond y rhai a holwyd."
      shot: S18
      shotAlt: "Rhestr y costau gyda bathodyn Wedi'i gwestiynu a'r hidlydd Wedi'i gwestiynu yn unig"
options:
  heading: "Tair ffordd o rannu"
  items:
    - title: "Yn gyfartal"
      body: "Y rhagosodiad ar gyfer ciniawau, tacsis ac unrhyw beth a rannodd pawb yn gyfartal. Os nad yw'r cyfanswm yn rhannu'n daclus, mae'r geiniog weddilliol yn mynd i un person ar hap, nid yr un person bob tro. Yn y tacsi isod, Ana yw hi."
    - title: "Yn ôl symiau union"
      body: "Teipiwch beth sy'n ddyledus gan bob person. Da ar gyfer yr anrheg lle dewisodd pawb bris gwahanol, neu'r siop lle roedd troli un person yn dal mwy na'r nwyddau a rennir. Rhaid i'r symiau adio i'r cyfanswm."
    - title: "Yn ôl canran"
      body: "Rhowch gyfran o'r cyfanswm i bob person. Rhent yn ôl maint ystafell yw'r clasur, gyda'r ystafell fwyaf yn talu'r gyfran fwyaf a neb yn esgus fel arall."
