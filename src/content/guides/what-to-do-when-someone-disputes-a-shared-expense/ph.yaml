faq:
  heading: Mga tanong
  items:
    - q: Puwede bang kuwestyunin ko lang ang bahagi ko?
      a: Hindi. Ang buong gastos ang hini-hold ng tanong, para sa lahat ng kasali. Kung ang hati lang ang mali, ang solusyon ay i-edit ang hati.
    - q: Sino ang puwedeng magsara ng tanong?
      a: Ang nagtanong, o admin ng grupo. Kung hindi admin ang nagdagdag ng gastos, hindi niya ito maisasara para sa nagtanong.
    - q: Binubura ba ng pag-edit ng gastos ang orihinal?
      a: Hindi. Nananatili ang naunang bersyon. Ang mga pahintulot ng grupo ang nagpapasya kung sino ang puwedeng mag-edit, kaya mabuting sabihan muna ang bahay, dahil magbabago ang mga balanse.
