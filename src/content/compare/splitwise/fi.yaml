sections:
  - heading: "Rahapuhe rahojen vieressä"
    body: "Yhteisiin rahoihin kuuluu rupattelua, epäilyksiä ja suunnitelmia. Side Badger pitää kaikki kolme lukujen vieressä, joten kenenkään ei tarvitse selata ryhmächattia taaksepäin."
    items:
      - "**Kommentit siellä, minne ne kuuluvat.** Kommentoi itse ryhmää tai mitä tahansa kulua, listaa tai äänestystä, ja pidä keskustelu sen asian vieressä, josta puhutaan."
      - "**Kuitit ja kuvat.** Säilytä jopa kolme kuittia jokaisessa kulussa ja lisää kuvia tai PDF-tiedostoja ryhmän, listan tai äänestyksen kommentteihin."
      - "**Kysymyksiä, ei riitoja.** Ylläpitäjä voi ottaa kysymykset käyttöön, ja sitten kuka tahansa kulussa mukana oleva voi kysyä siitä. Kulu pysyy poissa saldoista, kunnes asia on selvä."
      - "**Listat ja äänestykset.** Pidä yhteinen ostoslista ruokalaskujen vieressä ja äänestä huvilan lyhytlistasta, halutessasi nimettömästi."
      - "**Pienet aplodit.** Reagoi kuluihin, maksuihin ja kommentteihin ja juhli maksua, kun se kolahtaa perille."
  - heading: Sinun ryhmäsi, sinun sääntösi
    body: "Splitwisen ohjekeskuksen mukaan se ei tue ryhmän ylläpitäjiä eikä erityisoikeuksia. Side Badgerissa on roolit ja oikeudet, niille ryhmille, jotka tarvitsevat jonkun pitämään luvut siisteinä."
    items:
      - "**Ylläpitäjät, jäsenet ja katselijat.** Tee jostakusta katselija: hän näkee kaiken eikä muuta mitään."
      - "**Kaksi esiasetusta tai omat.** Aloita Avoimella yhteistyöllä tai Hallitulla ryhmällä tai aseta jokainen oikeus itse: kuka muokkaa ja poistaa kuluja, muokkaa listoja, kutsuu ja päästää uusia ihmisiä sisään."
      - "**Hyväksyntä liittymiseen.** Ota hyväksyntä käyttöön, niin ylläpitäjä päästää jokaisen sisään erikseen."
      - "**Ryhmän omat asetukset.** Rajaa ryhmä valuuttoihin, joita oikeasti käytät, valitse sen oletusvaluutta ja anna sille otsikkokuva."
      - "**Lukitse, kun kaikki on ohi.** Luvut pysyvät paikallaan, kunnes ylläpitäjä avaa lukituksen."
  - heading: Täällä ilmaista, siellä maksullista
    body: "Splitwise Pro on Splitwisen maksullinen tilaus, ja sen oma Pro-sivu myy kolmea asiaa, jotka eivät maksa Side Badgerissa mitään."
    items:
      - "**Kuittien skannaus.** Splitwise Pro skannaa kuvan kuitistasi. Side Badger tekee sen ilmaiseksi ilman skannauskrediittejä: se täyttää summan, päivämäärän ja paikan tarkistettavaksesi."
      - "**Valuuttojen muunnos.** Splitwise Pro muuntaa ryhmän kulut oletusvaluuttaasi, kun napautat Convert-painiketta. Side Badger muuntaa jokaisen kulun sitä syöttäessäsi nykyisellä valuuttakurssilla tai kurssilla, jonka todella sait, ja alkuperäinen summa säilyy kulussa."
      - "**Ei päivittäisiä rajoja.** Splitwise Pro myy rajattomia kuluja, ja sen ohjekeskuksen mukaan ilmaiskäyttäjät voivat lisätä enintään 4 kulua päivässä. Side Badgerissa ei ole päivittäisiä rajoja."
  - heading: Pankkisi pysyy poissa kuvioista
    body: "Side Badger ei yhdistä pankkiisi eikä pyydä pankkitietojasi. Se pitää kirjaa siitä, kuka on velkaa kenelle; te maksatte toisillenne miten haluatte ja kirjaatte maksun sitten. Ei pankkitunnuksia luovutettavaksi, joten yksi asia vähemmän suojattavana."
  - heading: Yksi sovellus selaimessa ja puhelimessa
    body: "Side Badger toimii selaimessa. Kirjaudu sisään, lisää se aloitusnäytölle, niin se avautuu kuin sovellus. Se on sama sovellus kummassakin, joten uusi ominaisuus on puhelimessasi, kun seuraavan kerran avaat sen, eikä sovelluskaupan päivitystä tarvitse odottaa."
  - heading: "Ja muutama kikka"
    items:
      - "**Kysy avustajaltasi.** Side Badger toimii ChatGPT:n ja Clauden kanssa: pyydä avustajaasi lisäämään kulu, skannaamaan kuitti tai kirjaamaan maksu."
      - "**Jokainen omalla kielellään.** Side Badger puhuu 39 kieltä ja jokainen valitsee omansa. Splitwisen etusivulla lukee 7+. Valuuttojakin se hallitsee 133, matkaa varten, joka vie vaikka minne."
      - "**Apua poistumatta sovelluksesta.** Jäitkö jumiin tai löysitkö virheen? Kerro meille sovelluksesta ja lue vastauksemme saman tien siellä."
  - heading: Missä Splitwise yhä voittaa
    body: "Haluamme mieluummin, että valitset oikean sovelluksen, kuin että saat sen selville myöhemmin. Jos ryhmäsi tarvitsee jotakin näistä, Splitwisessa se on ja Side Badgerissa ei."
    items:
      - "**Sovelluskauppojen sovellukset.** Side Badger asuu selaimessasi ja aloitusnäytölläsi, ei sovelluskaupoissa."
      - "**Offline-tila.** Side Badger tarvitsee yhteyden."
      - "**Maksut sovelluksessa.** Joissakin maissa Splitwise voi siirtää rahatkin. Side Badger pitää vain kirjaa."
      - "**Jako osuuksina tai tuotteittain.** Side Badgerissa on yksi maksaja kulua kohden, ja kulu jaetaan tasan, tarkoilla summilla tai prosenteilla. Sen kuittien skannaus ei kohdista tuotteita ihmisille."
      - "**Kaaviot ja oletusjaot.** Splitwise Prossa on molemmat. Side Badger pitää kirjaa siitä, kuka on velkaa kenelle, ja siinä koko temppu."
  - heading: Ryhmän siirtäminen
    body: "Tuontityökalua ei ole, joten siirtyminen tarkoittaa uutta alkua. Tasaa tilit ensin Splitwisessa, perusta sitten ryhmä Side Badgerissa ja kutsu kaikki linkillä tai QR-koodilla. Jokainen ryhmässä tarvitsee ilmaisen tilin, ja rekisteröitymiseen riittää sähköpostiosoite."
