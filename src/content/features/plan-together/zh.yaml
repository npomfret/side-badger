meta:
  title: 群组支出的共享清单、投票和评论 | Side Badger
  description: 评论支出，质疑可疑的一笔，维护共享购物清单，为度假屋投票。先一起规划开销，再分摊。免费，无广告。
h1: 一起规划，事后再分
navLabel: 一起规划
lead: 购物清单和购物账单，终于能好好说话了。Side Badger 给你的群组一个谈钱的地方，花之前和花之后都可以：每笔支出都能评论，看着不对的可以提出疑问，大事则有共享清单和投票。然后照常[分摊支出](page:feature/split-expenses)。
cta:
  heading: 先规划，再分摊
  body: 创建免费账户，建一个群组，把第一份清单、投票或疑问直接放在钱旁边。不确定接下来会怎样？看看[使用方式](page:how-it-works)。
problem:
  heading: 聊天在这边，账单在那边
  body: 群组的开销通常分散在两个地方。数字在一处，而关于数字的争论在一个周二就刷过去的聊天里。购物清单是一张冰箱的照片。度假屋是靠大多数人点了个赞定下来的，大概吧。Side Badger 把规划留在群组里，紧挨着相关的支出：费用旁边有评论，采购旁边有清单，大事有投票，还有一句不必写成一大段的“等一下，这个对吗？”。这一切都围绕群组的钱展开，这也正是群组存在的目的。
workflow:
  heading: 从度假屋投票到购物账单
  steps:
    - title: 把大事交给投票
      body: 为决定账单大小的事添加一个投票，比如选哪间度假屋。设置两到十个选项，规定每人有几票，等大家都投完就关闭投票，获胜项会被标出。
      shot: S17
      shotAlt: 一个已关闭的投票，获胜选项已标出，每个选项旁边显示票数
    - title: 一起写购物清单
      body: 开一份共享清单，添加物品，放进购物车就勾掉。购物的花费事后再作为一笔支出录入。
      shot: S16
      shotAlt: 一份共享购物清单，部分物品已勾掉，并显示进度计数
    - title: 在费用所在的地方聊费用
      body: 直接评论这笔支出，附上收据，再用表情回应。对话就留在它所说的数字旁边。
      shot: S08
      shotAlt: 一笔支出的详情，带有收据缩略图、评论串和表情回应
    - title: 质疑看着不对的那一笔
      body: 如果群组开启了支出疑问，任何参与某笔支出的人都可以选择**我有一个问题**。在问题处理完之前，这笔支出不计入余额。
      shot: S18
      shotAlt: 支出列表，显示“已提问”标记和“仅已提问”筛选
    - title: 看看改了什么、是谁改的
      body: 动态和通知铃铛会显示你所有群组里的新动向。想要的话，还可以开启推送通知。
      shot: S19
      shotAlt: 通知下拉菜单，列出最近的动态
options:
