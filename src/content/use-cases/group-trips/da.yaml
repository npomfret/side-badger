featuresHeading: Hvad en tur læner sig op ad
faq:
  heading: Spørgsmål
  items:
    - q: Kan folk, der sprang middagen over, udelades?
      a: Ja. Vælg, hvem der var med i hver udgift, så er det kun dem, der bliver opkrævet for den.
    - q: Virker det uden signal?
      a: Nej. Side Badger kræver en forbindelse, så tilføj udgifterne, når I er på wifi igen.
    - q: Skal alle installere noget?
      a: Nej. Den kører i browseren. Send invitationslinket, så tilmelder folk sig fra deres telefoner.
    - q: Hvilken valutakurs bruger den?
      a: En aktuel valutakurs, når du indtaster udgiften, eller din egen, hvis du fik en anden. Kursen fastlåses, når udgiften gemmes, så gamle udgifter omvurderes aldrig.
    - q: Kan vi fryse gruppen efter turen?
      a: Ja. En administrator kan låse gruppen, så tallene bliver stående.
    - q: Er der en grænse for beløb?
      a: Ja. 999.999,99 pr. udgift i dens egen valuta.
