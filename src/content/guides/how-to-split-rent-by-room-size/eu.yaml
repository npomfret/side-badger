meta:
  title: "Nola banatu alokairua gelen tamainaren arabera | Side Badger"
  description: "Gela handiagoa, zati handiagoa. Kendu partekatutako gelak, banatu gainerakoa azaleraren arabera eta sartu ehunekoak behin. Hiru etxekideren kalkuluekin."
h1: "Nola banatu alokairua gelen tamainaren arabera"
navLabel: "Alokairua gelen arabera"
lead: "Erabaki alokairuaren zer zati dagokion partekatutako gelei eta banatu zati hori berdin. Gero banatu gainerakoa logela bakoitzaren azaleraren arabera. Biribildu ehuneko osoetara, sartu Side Badger-en alokairuaren gastuan behin, eta kopiatu gastua hilero."
cta:
  heading: "Sartu alokairua behin"
  body: "Sortu doako kontu bat, hasi talde bat pisurako eta sartu alokairua adostutako ehunekoekin. Hurrengo hilabetea kopia bat da. Lehenik nolakoa den ikusi nahi duzu? Ikusi [nola funtzionatzen duen](page:how-it-works) edo begiratu [doakoak zer hartzen duen](page:pricing)."
sections:
  - heading: "Hiru pertsona, pisu bat, eztabaida bat"
    body: "Priya, Tom eta Aisha pisu bat partekatzen dute, eta alokairua hilean 1.950 £ da. Urtebetez hiruren artean banatu zuten, erraza zelako. Gero Aishak bere logela neurtu zuen. Priyaren gelak 16 m² ditu, Tomenak 12 m² eta Aisharenak 10 m², beraz Aishak Priyak adina ordaintzen zuen herena baino gehiago txikiagoa zen gela batengatik. Inor ez zen zentzugabe izan. Inork ez zuen kalkulurik egin. Eramateko janari bat jaten zuten bitartean, lehenengo arau bat adostu zuten: alokairuaren %40 sukaldea, bainugela eta egongela ordaintzeko da, hirurek erabiltzen dituzten gelak."
  - heading: "Metodoa, kontuak erakutsita"
    body: "Lau urrats, metro-zinta bat eta telefonoko kalkulagailua."
    items:
      - "**Utzi alde batera partekatutako zatia.** Taldeak adosten du alokairuaren zer zati dagokion denek erabiltzen dituzten gelei. Pisu honetan %40 da, hau da, %13,33 bakoitzak hiru pertsonaren artean."
      - "**Banatu gainerakoa azaleraren arabera.** Beste %60 logelen tamainaren arabera doa. Logelek 38 m² batzen dituzte (16 + 12 + 10), beraz Priyaren zatia %60 × 16/38 da, hau da, %25,26."
      - "**Gehitu bi zatiak.** Priya: %25,26 + %13,33 = %38,6. Tom: %60 × 12/38 = %18,95, gehi %13,33, %32,3 da. Aisha: %60 × 10/38 = %15,79, gehi %13,33, %29,1 da."
      - "**Biribildu eta egiaztatu.** Ehuneko osoak errazagoak dira idazteko eta haiei buruz eztabaidatzeko, beraz %38,6 %39 bihurtzen da, %32,3 %32 eta %29,1 %29. Egiaztatu 39 + 32 + 29 = 100 dela. Biribiltzeak 99 edo 101 ematen badu, taldeak adosten du noren zifra mugituko den puntu bat."
  - heading: "Pisuko hilabetea irakurtzen"
    body: "Alokairua %39, %32 eta %29 bezala banatuta, 760,50 £, 624,00 £ eta 565,50 £ ateratzen dira. Priyak etxejabeari ordaindu zion, beraz hilabete osoan 1.142,50 £ zor zaizkio, eta Tomek 566,00 £ zor ditu eta Aishak 576,50 £. Side Badger-ek bi ordainketa proposatzen ditu, biak Priyarentzat."
  - heading: "Prestatu Side Badger-en"
    body: "Arratsalde bat, eta gehiena %40 horri buruz eztabaidatzen igaroko da."
    items:
      - "**Sortu taldea.** Aginte-panelean aukeratu **Sortu taldea** eta jarri pisuaren izena. Aukeratu **Gonbidatu beste batzuk** eta bidali esteka edo QR kodea. Denek saioa hasten dute edo doako kontu bat sortzen dute, eta talde honetan erakutsiko zaien izena aukeratzen dute."
      - "**Gehitu alokairua.** Aukeratu **Gehitu gastua**. Sartu deskribapena eta zenbatekoa, eta **Nork ordaindu du?** atalean aukeratu etxejabeari ordaindu ziona. Utzi hiru pertsonak **Banatu honen artean** atalean, eta gero **Nola banatu** atalean aukeratu **Ehunekoa** eta idatzi 39, 32 eta 29. Ehunekoek 100 batzen ez badute, formularioak abisatzen du. Aukeratu **Gorde gastua**."
      - "**Gehitu fakturak.** Energia eta Interneteko konexioa gastu bereiziak dira, bakoitzak bere ordaintzailearekin. Utzi **Nola banatu** **Berdin-berdin** aukeran."
      - "**Kopiatu hurrengo hilabetean.** Ireki joan den hilabeteko alokairua eta aukeratu **Kopiatu gastua**. Kopiak ordaintzailea, zenbatekoa eta banaketa mantentzen ditu, eta gaurko data hartzen du. Alokairua aldatu bada, aldatu zenbatekoa, eta gero aukeratu **Sortu kopia**."
      - "**Egiaztatu nork nori zor dion.** **Balantzeak** atalak erakusten du. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa **Kitatu** atalean."
  - heading: "Bainugela propioa duten gelak, gela txikiak eta alde egiten duenak"
    items:
      - "**Bainugela propioa duten gelak eta gela txikiak.** Azalera abiapuntu bat da. Bainugela propioa duen gelak, bainugelarik gabeko azalera bereko gelak baino gehiago balio du, eta ohe bat eta aulki esperantzatsu bat sartzen diren gela txiki batek gutxiago. Doitu ehunekoak adostasunez, egiaztatu oraindik 100 batzen dutela eta idatzi azken zifrak pisu osoak ikus dezakeen toki batean."
      - "**Norbait hilabetearen erdian joaten da.** Kalkulatu hilabete horretan bakoitzak zenbat zor duen eta sartu hilabete horretako alokairua **Zenbateko zehatzak** aukerarekin, **Ehunekoa** aukeraren ordez. Zenbatekoek alokairua batu behar dute. Egin joan baino lehen. Inork ezin du taldea utzi dirua zor duen edo zor zaion bitartean, eta taldea utzi duen norbait tartean duen gastua irakurtzeko soilik geratzen da."
      - "**Norbait bizitzera etortzen da.** Neurtu berriro, egin kalkuluak berriro gelen tamaina berriekin eta erabili ehuneko berriak hurrengo alokairutik aurrera. Aurreko hilabeteak lehen bezala geratzen dira."
  - heading: "Side Badger-ek hemen egiten ez duena"
    items:
      - "Ez ditu zure gelak neurtzen eta ez ditu ehunekoak aukeratzen. Azalerak eta %40 hori taldeak adosteko dira."
      - "Ez dauka faktura errepikaririk, beraz aldi bakoitzean joan den hilabeteko alokairua kopiatzen duzu."
      - "Ez du inoiz dirurik mugitzen eta ez dio etxejabeari ordaintzen. Zuek elkarri ordaintzen diozue nahi duzuen moduan eta erregistratzen duzue."
      - "Ez daki zer dioen zuen alokairu-kontratuak. Taldeko pertsonen arteko kontua eramaten du."
