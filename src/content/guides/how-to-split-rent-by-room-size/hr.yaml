faq:
  heading: "Pitanja"
  items:
    - q: "Što ako netko ima veću sobu, ali manje svjetla?"
      a: "Površina je samo polazište, pa se grupa može dogovoriti o prilagodbi. Oduzmi tamnoj sobi jedan ili dva postotna boda, dodaj ih ostalima i provjeri da postoci i dalje zajedno daju 100. Side Badger sprema što god dogovorite i ne presuđuje."
    - q: "Treba li i račune dijeliti prema veličini sobe?"
      a: "Obično ne. Energiju i internet koriste svi, pa je jednaka podjela jednostavnija, kao u gornjem primjeru. Ako je jedan cimer cijeli dan kod kuće, grupa se može dogovoriti drukčije, primjerice točnim iznosima. [Podjela troškova](page:feature/split-expenses) opisuje sve opcije."
    - q: "Možemo li poslije promijeniti podjelu?"
      a: "Da, za nove troškove. Promijeni postotke kad kopiraš najamninu i raniji mjeseci ostaju kakvi su bili. Da ispraviš prošli trošak, uredi ga ako to dopuštaju dopuštenja grupe i prvo obavijesti ostale u stanu, jer se stanja mijenjaju. Prethodna verzija ostaje sačuvana."
