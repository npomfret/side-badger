sections:
  - heading: Ang mahusay sa Splitwise
    body: "Kung kailangan ng grupo mo ng native app, offline na paggamit, o mga bayad sa loob ng app, Splitwise ang makatwirang pagpipilian, at mas gusto naming iyon ang piliin mo kaysa malaman mo na lang sa huli. Inililista ng sarili nitong mga pahina ang:"
    items:
      - "**Mga app at offline na paggamit.** Mga app para sa iPhone at Android bukod sa web, at may offline mode."
      - "**Mas maraming paraan ng paghahati.** Shares, adjustments, at itemised na paghahati, bukod sa pantay, eksakto, at porsyento."
      - "**Mga umuulit na gastos.** Itakdang umulit ang upa at kalimutan na ito."
      - "**Mga bayad sa loob ng app.** Sa ilang bansa, kaya rin nitong ilipat ang pera, sa pamamagitan ng Splitwise Pay, Venmo, PayPal, o Pay by Bank."
  - heading: Libre rito, may bayad doon
    body: "Ang Splitwise Pro ang bayad na plano ng Splitwise, at apat na bagay ang ibinebenta ng sarili nitong Pro page na walang bayad sa Side Badger."
    items:
      - "**Pag-scan ng resibo.** Sina-scan ng Splitwise Pro ang larawan ng resibo mo. Libre itong ginagawa ng Side Badger, walang scan credits: pinupunan nito ang kabuuan, petsa, at lugar para suriin mo. Binabasa ng AI service ng Google ang mga larawan ng resibo."
      - "**Pag-convert ng pera.** Kino-convert ng Splitwise Pro ang mga gastos ng grupo sa default currency mo kapag pinindot mo ang Convert. Kino-convert ng Side Badger ang bawat gastos habang inilalagay mo ito, sa kasalukuyang exchange rate o sa aktuwal mong nakuha, at nananatili sa gastos ang orihinal na halaga."
      - "**Walang ad.** Inililista ng Splitwise ang ganap na walang ad na karanasan bilang Pro feature. Walang ad ang Side Badger."
      - "**Walang pang-araw-araw na limitasyon.** Ibinebenta ng Splitwise Pro ang walang limitasyong gastos, at sinasabi ng help center nito na hanggang 4 na gastos kada araw ang maidaragdag ng mga libreng user. Walang pang-araw-araw na limitasyon ang Side Badger."
  - heading: Ang mayroon ang Splitwise na wala sa Side Badger
    body: "Hindi ito lahat ng feature ng Splitwise, kundi ang mga madalas magpasya. Nasa sariling mga pahina ng Splitwise ang buong listahan. Narito kung saan kapos ang Side Badger."
    items:
      - "**Mga native app.** Gumagana ang Side Badger sa browser mo. Mag-sign in, saka idagdag ito sa home screen at bubukas ito na parang app."
      - "**Offline mode.** Kailangan ng Side Badger ng koneksyon."
      - "**Mga bayad sa loob ng app.** Hindi kailanman ginagalaw ng Side Badger ang pera mo. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad."
      - "**Mga umuulit na gastos.** Wala nito ang Side Badger. Kopyahin na lang ang upa noong nakaraang buwan sa halip na i-type muli."
      - "**Paghahati ayon sa shares o ayon sa item.** Isa ang nagbabayad sa bawat gastos sa Side Badger, na hinahati nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento. Hindi nag-a-assign ng mga item sa tao ang pag-scan nito ng resibo."
      - "**Mga tsart at default na paghahati.** May dalawa nito ang Splitwise Pro. Binibilang lang ng Side Badger kung sino ang may utang kanino, at iyon na ang buong gimik."
  - heading: Paglipat ng grupo mo
    body: "Walang importer, kaya ang paglipat ay panibagong simula. Mag-settle up muna sa Splitwise, saka gumawa ng grupo sa Side Badger at imbitahan ang lahat gamit ang link o QR code. Kailangan ng libreng account ng lahat sa grupo, at email address lang ang kailangan para mag-sign up."
