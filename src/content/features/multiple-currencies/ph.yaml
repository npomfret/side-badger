sections:
  - heading: Isang pera para sa buong grupo
    body: Kung ayaw ng grupo mong mag-isip pa rito, pumili ng pera ng grupo at kusang iko-convert ng form ang bawat bagong gastos dito, sa rate na nakikita at mababago mo pa rin. Para lang ito sa mga bago at kinopyang gastos. Hindi ginagalaw ang mga edit at kasalukuyang gastos, kaya walang nagbabago sa mga naitala na.
  - heading: May utang na euro, magbabayad sa pounds
    body: Yen ang bayad, pounds ang settle? Walang problema. Kapag nagtatala ka ng bayad, puwede mo rin itong i-convert, kaya ang may utang na euro ay makakabayad sa pounds at tama pa rin ang balanse sa euro. Magbayaran kayo sa paraang gusto ninyo, saka itala.
  - heading: Mga patakaran para sa grupo
    body: Limitahan ang grupo sa mga perang talagang ginagamit ninyo, at magtakda ng default para bumukas ang form sa tamang pera. Hindi kailangan ng bakasyon sa Portugal ang 139 pang opsyon sa tabi ng bayarin sa hapunan, at malamang dalawa lang ang kailangan ng [kasal sa ibang bansa](page:use-case/events-and-celebrations).
limits:
  heading: Mga limitasyon
  items:
    - Nakapirmi ang rate kapag na-save ang gastos. Hindi kailanman muling binabalyuhan ang mga lumang gastos.
    - Kumukuha ang Side Badger ng kasalukuyang rate kung kaya. Hindi garantisado ang bawat pares, at puwede mong i-type palagi ang rate.
    - Para lang ang group auto-convert sa mga bago at kinopyang gastos, hindi sa mga edit o kasalukuyang gastos.
    - May hangganang 999,999.99 ang bawat gastos sa sarili nitong pera.
    - May 140 pera. Hindi kasama ang mga cryptocurrency at metal.
    - Nagtatala ng bayad ang Side Badger. Hindi ito naglilipat o nagpapalit ng pera.
useCasesHeading: Saan ito nakakatulong
faq:
  heading: Mga tanong
  items:
    - q: Anong exchange rate ang ginagamit ninyo?
      a: Kasalukuyang exchange rate, na kinukuha kapag inilagay mo ang gastos kung may available. Mababago mo ito sa rate na aktuwal mong nakuha, at mag-a-update ang na-convert na halaga.
    - q: Muli bang binabalyuhan ang mga lumang gastos?
      a: Hindi. Nakapirmi ang rate kapag na-save ang gastos, kaya hindi nag-iiba ang balanse dahil gumalaw ang merkado.
    - q: Sinusuportahan ba ninyo ang crypto?
      a: Hindi. May 140 pera, at hindi kasama ang mga cryptocurrency.
    - q: Bakit hindi ako makapaglagay ng 2,000,000 rupiah?
      a: May hangganang 999,999.99 ang bawat gastos sa sarili nitong pera. Ilagay ito sa ibang pera at i-convert, o hatiin sa dalawang gastos.
    - q: May bayad ba ang conversion?
      a: Wala. Libre ang pag-convert, tulad ng iba pa sa Side Badger. Tingnan ang [presyo](page:pricing).
    - q: Kailangan ko bang mag-convert?
      a: Hindi. Nananatiling magkahiwalay ang mga pera maliban kung pinili mo o ng grupo mong mag-convert, at may sariling maikling listahan ng mga bayad ang bawat pera.
