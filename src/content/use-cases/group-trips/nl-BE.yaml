featuresHeading: "Waar een reis op leunt"
faq:
  heading: "Vragen"
  items:
    - q: "Kunnen mensen die het diner oversloegen worden weggelaten?"
      a: "Ja. Kies wie deel uitmaakte van elke uitgave en alleen zij worden ervoor aangerekend."
    - q: "Werkt het zonder bereik?"
      a: "Nee. Side Badger heeft een verbinding nodig, dus voeg de kosten toe zodra je weer op wifi zit."
    - q: "Moet iedereen iets installeren?"
      a: "Nee. Het draait in de browser. Stuur de uitnodigingslink en mensen doen mee vanaf hun telefoon."
    - q: "Welke wisselkoers gebruikt het?"
      a: "Een actuele wisselkoers wanneer je de uitgave invoert, of je eigen koers als je een andere kreeg. De koers ligt vast wanneer de uitgave wordt opgeslagen, dus oude uitgaven worden nooit herwaardeerd."
    - q: "Kunnen we de groep na de reis bevriezen?"
      a: "Ja. Een beheerder kan de groep vergrendelen zodat de cijfers blijven staan."
    - q: "Is er een limiet op bedragen?"
      a: "Ja. 999.999,99 per uitgave, in haar eigen valuta."
