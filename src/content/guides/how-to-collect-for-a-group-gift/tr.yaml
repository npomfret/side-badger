faq:
  heading: "Sorular"
  items:
    - q: "Hediyenin fiyatından fazla toplarsak ne olur?"
      a: "Tam tutarların toplamı fiyata eşit olmalı, bu yüzden toplam tutana kadar payları kırpın. Ya da fazlasını çiçek gibi gerçek bir şeye ayırın ve örnekteki kart ve ambalaj gibi bunu ikinci bir harcama olarak girin."
    - q: "Biri gruba katılmadan para verebilir mi?"
      a: "Sayıma dahil olmasını istiyorsanız hayır. Bölüşümdeki herkesin ücretsiz bir hesabı olmalı ve grupta olmalı. Yalnızca nakdi olan biri için Priya parayı alıp hediyeyi grubun hâlâ borçlu olduğu tutarla girebilir. Örneğin Sam ona 40 £ nakit verdiyse, Priya 200 £ girer ve kendisi, Omar ve Lena arasında 60, 60 ve 80 olarak böler."
    - q: "Anket kişi başı tutarı belirleyebilir mi?"
      a: "Hayır. Anket, bütçe gibi tüm grup için bir rakam belirler. Her kişinin payını kendi aranızda kararlaştırır, sonra harcamaya **Tam tutarlar** olarak yazarsınız."
