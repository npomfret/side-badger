    - feature: أين تستخدمه
      other: تطبيقات لـ iPhone وAndroid، والويب.
      sideBadger: في متصفحك. سجّل الدخول ثم أضفه إلى شاشتك الرئيسية ليفتح كأنه تطبيق. ليس في متاجر التطبيقات.
      source: home
    - feature: طرق التقسيم
      other: بالتساوي، أو بمبالغ محددة، أو بنسبة مئوية، أو بالحصص، أو بالتعديل، أو بحسب البنود.
