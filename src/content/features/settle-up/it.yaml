sections:
  - heading: Registrare un pagamento
    body: Quando qualcuno paga, registralo alla persona giusta. I pulsanti di saldo rapido compilano l'importo dai pagamenti suggeriti, e puoi aggiungere una nota come "bonifico bancario" (fino a 500 caratteri). Se paghi solo una parte di ciò che devi, il resto resta nel saldo. Se inserisci troppo poco o troppo, Side Badger ti avvisa prima di salvare. Registrare un pagamento richiede il permesso di modificare le spese, e la data non può essere nel futuro.
  - heading: Pagato in un'altra valuta?
    body: I saldi restano nella valuta in cui sono stati pagati, quindi un debito in euro resta un debito in euro. Devi euro e paghi in sterline? Converti il pagamento mentre lo inserisci, a un tasso di cambio attuale o al tasso che hai davvero ottenuto. Il tasso viene fissato quando il pagamento è salvato. [Più valute](page:feature/multiple-currencies) spiega come funziona la conversione, e i [viaggi di gruppo](page:use-case/group-trips) la mostrano in uso.
  - heading: Uno storico che puoi controllare
    body: Ogni pagamento registrato resta nello storico del gruppo con data, importo e nota. Solo la persona che ha registrato un pagamento può modificarlo, e lei o un admin del gruppo possono eliminarlo. Un pagamento che coinvolge qualcuno che ha lasciato il gruppo è bloccato. Per uno scenario di coinquilini svolto, vedi [coinquilini](page:use-case/housemates).
limits:
  heading: Cosa Side Badger non fa
  items:
    - Side Badger non sposta denaro, non invia link di pagamento né richieste di pagamento. Un pagamento nell'app è la registrazione di un pagamento fatto altrove.
    - I pagamenti suggeriti derivano da un semplice metodo di abbinamento, applicato per valuta. Suggerisce sempre meno pagamenti delle persone che hanno un saldo in quella valuta (quattro persone, al massimo tre pagamenti), ma non trova sempre il numero più piccolo possibile.
    - Non puoi disattivare i suggerimenti. **Mostra tutto** elenca ogni pagamento suggerito nel gruppo, non solo i tuoi.
    - Le valute non vengono mai compensate tra loro, a meno che le spese siano state convertite quando sono state inserite.
    - Non ci sono promemoria, quindi sollecitare un pagamento resta compito tuo.
useCasesHeading: Dove conta saldare i conti
faq:
  heading: Domande
  items:
    - q: Side Badger invia il denaro?
      a: No. Pagatevi come vi fa più comodo, poi registrate il pagamento in Side Badger perché il saldo si aggiorni.
    - q: Posso disattivare i pagamenti suggeriti?
      a: No. La semplificazione resta attiva, e **Mostra tutto** elenca ogni pagamento suggerito nel gruppo, non solo quelli che ti riguardano.
    - q: Perché euro e sterline sono tenuti separati?
      a: I saldi restano nella valuta in cui hai pagato, a meno che tu converta quando inserisci una spesa o un pagamento. I debiti in valute diverse non vengono mai compensati tra loro.
    - q: E se qualcuno paga solo una parte di ciò che deve?
      a: Registra la parte che ha pagato. Il resto resta nel saldo finché non viene pagato.
    - q: È sempre il numero minimo possibile di pagamenti?
      a: Non è garantito. Suggerisce sempre meno pagamenti delle persone che hanno un saldo in quella valuta, quindi per quattro persone non ne suggerisce mai più di tre. Nell'esempio dei coinquilini sono due pagamenti, dove rimborsare direttamente ogni persona ne richiedeva sei.
