meta:
  title: "Side Badger کیسے کام کرتا ہے | گروپ کے اخراجات پانچ مراحل میں تقسیم کریں"
  description: "گروپ بنائیں، لوگوں کو مدعو کریں، اخراجات شامل کریں اور حساب برابر کریں۔ دیکھیں «کسی نے ادا کیا» اور «حساب برابر ہو گیا» کے درمیان کیا ہوتا ہے، ایک مکمل مثال کے ساتھ۔"
h1: "Side Badger کیسے کام کرتا ہے"
navLabel: "یہ کیسے کام کرتا ہے"
lead: "«کسی نے ادا کیا» اور «حساب برابر ہو گیا» کے درمیان کیا ہوتا ہے؟ پانچ مراحل، کوئی اسپریڈشیٹ نہیں، اور ایک بیجر جو زیادہ تر سجاوٹ کے لیے ہے۔ یہ پہلے گروپ سے آخری ریکارڈ شدہ ادائیگی تک پورا سفر ہے۔ کسی بھی مرحلے کی تفصیل کے لیے [اخراجات کی تقسیم](page:feature/split-expenses) اور [حساب برابر کرنا](page:feature/settle-up) دیکھیں۔"
cta:
  heading: "«یہ میں دے دیتا ہوں» سے «حساب برابر» تک"
  body: "مفت اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلا خرچہ شامل کریں۔ بیجر رسید پر رائے نہیں دے گا۔"
  button: "مفت اکاؤنٹ بنائیں"
steps:
  - title: "گروپ بنائیں"
    body: "ہر گھر، سفر یا تقریب کے لیے ایک الگ گروپ بنائیں تاکہ کرایہ شادی کے تحفے کی فہرست میں نہ جا پہنچے۔ اسے نام دیں، وہ نام چنیں جس سے لوگ آپ کو دیکھیں گے اور اگر چاہیں تو وہ کرنسیاں محدود کر دیں جو یہ قبول کرتا ہے۔ پھر آپ کا ڈیش بورڈ تمام گروپس اور ہر ایک میں آپ کی پوزیشن ایک اسکرین پر دکھاتا ہے۔"
    shot: S02
    shotAlt: "گروپ بنانے کا ڈائیلاگ، کرنسی کی پابندیوں کا حصہ کھلا ہوا"
  - title: "اپنے لوگوں کو مدعو کریں"
    body: "شمولیت کا لنک شیئر کریں یا QR کوڈ دکھائیں، اور طے کریں کہ یہ کتنی دیر چلے گا، 15 منٹ سے 5 دن تک۔ شامل ہونے والے ہر شخص کو مفت اکاؤنٹ اور تصدیق شدہ ای میل چاہیے، اور ایک گروپ میں 50 افراد تک ہو سکتے ہیں۔ اگر آپ چاہتے ہیں کہ کون آئے اس کی جانچ ہو تو منظوری آن کریں اور ایڈمن ہر شخص کو اندر آنے دے گا۔"
    shot: S03
    shotAlt: "لنک ٹیب پر دعوت کا ڈائیلاگ، QR کوڈ اور میعاد کے اختیارات کے ساتھ"
  - title: "اخراجات جیسے ہوں ویسے شامل کریں"
    body: "بتائیں کس نے ادا کیا، کتنا، اور کس کے لیے تھا۔ برابر، عین رقم یا فیصد کے مطابق تقسیم کریں، اور جو اس کا حصہ نہیں تھا اسے نکال دیں۔ خرچہ شامل کریں تو سب اسے فوراً دیکھ لیتے ہیں، ساتھ یہ بھی کہ کیا بدلا اور کس نے بدلا۔"
    shot: S05
    shotAlt: "فیصد کی تقسیم والا خرچے کا فارم، کمرے کے سائز کے مطابق کرایہ بانٹتا ہوا"
  - title: "بیلنس پر نظر رکھیں"
    body: "Side Badger ہر کرنسی کا چلتا ہوا بیلنس رکھتا ہے، تاکہ آپ ایک نظر میں دیکھ سکیں کہ کس کو کس کا دینا ہے۔ سب کو چھوٹے قرضوں کا جال سلجھانے پر چھوڑنے کے بجائے، یہ ادائیگیوں کی ایک مختصر فہرست تجویز کرتا ہے جو گروپ کا حساب برابر کر دیتی ہے۔"
    shot: S10
    shotAlt: "بیلنس اسکرین جو دو کرنسیوں میں آسان کیے گئے قرض دکھا رہی ہے، «سب دکھائیں» آن ہے"
  - title: "ایپ سے باہر حساب برابر کریں، ایپ کے اندر ریکارڈ کریں"
    body: "Side Badger کبھی رقم نہیں منتقل کرتا۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر ادائیگی ریکارڈ کریں تاکہ بیلنس پکڑ لیں، اور سب کی اسکرین بغیر ریفریش کے اپ ڈیٹ ہو جائے۔ «تصفیہ» کا مطلب بس یہ ہے کہ بیلنس صفر ہیں۔ جب تک کسی کو دینا یا لینا ہو وہ گروپ نہیں چھوڑ سکتا، اس لیے جو جانے والا ہو وہ پہلے حساب برابر کرتا ہے۔"
    shot: S11
    shotAlt: "فوری تصفیہ کے بٹنوں اور جزوی ادائیگی کے نوٹس کے ساتھ ادائیگی کا فارم"
requirements:
  heading: "آپ کو کیا چاہیے"
  items:
    - "ایک مفت اکاؤنٹ۔ بس ایک ای میل ایڈریس اور پاس ورڈ چاہیے، اور کچھ بھی شامل کرنے سے پہلے آپ ای میل کی تصدیق کرتے ہیں۔"
    - "عمر 18 سال یا اس سے زیادہ ہو۔"
    - "فون یا کمپیوٹر پر ایک جدید براؤزر، اور انٹرنیٹ کنکشن۔ Side Badger ایپ اسٹور کی ایپ نہیں ہے اور آف لائن کام نہیں کرتا۔"
    - "اختیاری طور پر، آپ کی ہوم اسکرین پر ایک جگہ۔ ایپ اسٹور کی ضرورت نہیں: سائن ان کریں، پھر Side Badger کو ہوم اسکرین یا ڈاک میں شامل کریں اور یہ ایپ کی طرح کھلتا ہے۔ ایپ میں سیٹنگز آپ کو طریقہ دکھاتی ہیں۔"
