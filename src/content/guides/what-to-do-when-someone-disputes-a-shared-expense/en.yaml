  people:
    - id: tom
      name: Tom
    - id: priya
      name: Priya
    - id: aisha
      name: Aisha
  expenses:
    - label: the big shop
      payer: tom
      amount: 84
      split:
        method: equal
    - label: the cleaner
      payer: priya
      amount: 60
      split:
        method: equal
    - label: the party wine
      payer: tom
      amount: 45
      split:
        method: equal
        shares:
          tom: 1
          priya: 1
faq:
  heading: Questions
  items:
    - q: Can I question just my share?
      a: No. A question holds out the whole expense, for everyone in it. If only the split is wrong, the fix is an edit to the split.
    - q: Who can close a question?
      a: The person who asked, or a group admin. If the person who added the expense isn't an admin, they can't close it on the questioner's behalf.
    - q: Does editing an expense wipe out the original?
      a: No. The earlier version is kept. Who can edit is decided by the group's permissions, so it is worth telling the house first, because the balances change.
