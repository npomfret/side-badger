meta:
  title: "Cara melunasi setelah perjalanan grup | Side Badger"
  description: "Lunasi sebelum semua orang berpencar. Sepuluh utang kusut jadi empat pembayaran, dicatat saat masuk, dan bayar sebagian pun boleh. Hitungan untuk lima teman."
h1: "Cara melunasi setelah perjalanan grup"
navLabel: "Lunasi setelah perjalanan"
lead: "Lunasi sebelum semua orang berpencar. Tambahkan pengeluaran terakhir, buka saldo grup, dan bayar apa yang Anda utang dari daftar singkat, dengan cara apa pun yang disuka. Lalu catat tiap pembayaran di Side Badger agar saldo lunas untuk seluruh grup. Untuk lima teman dan lima pengeluaran, sepuluh utang kusut menjadi empat pembayaran."
cta:
  heading: "Tutup pembukuan sebelum foto-foto berdatangan"
  body: "Buat akun gratis, mulai grup untuk perjalanan berikutnya, dan tambahkan tiap biaya saat terjadi. Daftar pembayaran singkat sudah menunggu saat Anda tiba di bandara. Ingin melihat dulu [cara kerja pelunasan](page:feature/settle-up)?"
sections:
  - heading: "Lima teman, lima pengeluaran, satu ruang tunggu keberangkatan"
    body: "Mo, Ines, Raf, Tess, dan Uma menghabiskan seminggu di pesisir. Mo memesan apartemen dan membeli belanjaan, Ines membayar wisata perahu, dan Raf menanggung makan malam besar. Tess naik taksi bandara bersama Uma dan Mo, karena Ines dan Raf naik kereta. Kartu Uma tertinggal di rumah, jadi ia tidak membayar apa-apa. Itu lima pengeluaran dengan total €1.700, dan di ruang tunggu keberangkatan tak ada yang bisa bilang siapa yang unggul."
  - heading: "Sepuluh utang, empat pembayaran"
    body: "Apartemen, perahu, makan malam, dan belanjaan dibagi rata untuk lima orang. Itu €200, €50, €60, dan €18 per orang, jadi Ines dan Raf masing-masing berutang €328. Taksi dibagi tiga orang, €20 per orang, sehingga Mo, Tess, dan Uma berutang €348. Mo membayar €1.090 dan berutang €348, sehingga ia dihutangi €742. Semua orang lain membayar lebih sedikit daripada yang mereka utang. Uma kurang €348, Tess €288, Ines €78, dan Raf €28, dan jumlahnya sama dengan €742 milik Mo. Lunasi setiap pasangan orang secara langsung dan Anda mendapat sepuluh utang terpisah. Side Badger menyarankan empat pembayaran sebagai gantinya, semuanya kepada Mo."
  - heading: "Lunasi sebelum semua orang berpencar"
    body: "Saat terbaik adalah malam terakhir atau perjalanan pulang, selagi semua orang masih di satu tempat dan utang €28 mudah disinggung. Tambahkan semua pengeluaran lebih dulu, termasuk taksi. Tak ada yang bisa keluar dari grup selagi berutang atau dihutangi, jadi hitungannya toh harus ditutup suatu saat."
    items:
      - "**Periksa daftarnya.** Buka grup dan lihat **Saldo**. Secara bawaan Anda melihat utang yang melibatkan Anda. Pilih **Tampilkan semua** untuk melihat daftar seluruh grup."
      - "**Bayar sesuka Anda.** Transfer bank, tunai, utang budi dari liburan lalu. Side Badger tidak memindahkan uangnya."
      - "**Catat.** Pilih **Lunasi**. Di bawah **Penyelesaian cepat** setiap tombol adalah salah satu pembayaran yang disarankan untuk Anda, dan memilihnya mengisi jumlahnya. Tambahkan **Catatan** seperti transfer bank, periksa **Tanggal** (tidak boleh di masa depan), lalu pilih **Catat Penyelesaian**."
      - "**Lihat saldonya lunas.** Saldo diperbarui untuk semua orang. Saat pembayaran terakhir masuk, **Saldo** menampilkan **Semua sudah lunas!**"
  - heading: "Bayar sebagian sekarang, sisanya nanti"
    body: "Uma bisa mengirim €200 malam ini dan sisanya di akhir bulan. Ia mencatat €200, dan formulir memperingatkannya bahwa ia masih berutang €148 kepada Mo setelahnya, yaitu €348 dikurangi €200. Simpan, dan €148 itu tetap di saldonya sampai ia mencatat sisanya. Peringatan ini juga berlaku sebaliknya. Jika nol nyasar mengubah €348 menjadi €3.480, formulir menyatakan ia hanya berutang €348 kepada Mo dan bahwa menyimpan akan menciptakan utang ke arah sebaliknya. Perbaiki nolnya sebelum menyimpan."
  - heading: "Memperbaiki kesalahan, dan merayakan pembayaran"
    items:
      - "**Pembayaran yang salah.** Hanya orang yang mencatat pembayaran yang bisa mengubahnya. Mereka atau admin grup bisa menghapusnya, dan setelah itu pembayarannya bisa dicatat ulang."
      - "**Pembayaran yang layak disorot.** Setiap pembayaran yang dicatat ada di bawah **Penyelesaian** dengan tanggal dan catatannya, tempat semua orang di grup bisa melihat dan memberi reaksi. Mo bisa memilih **Rayakan** saat €148 terakhir Uma masuk."
      - "**Akhirnya.** Dengan semua saldo nol, admin bisa mengunci grup agar angkanya tetap."
  - heading: "Yang tidak dilakukan Side Badger di sini"
    items:
      - "Side Badger tidak pernah memindahkan uang. Ia tidak punya tautan pembayaran atau permintaan pembayaran, jadi pembayaran di aplikasi adalah catatan pembayaran yang dilakukan di tempat lain."
      - "Side Badger tidak mengirim pengingat. Menagih pembayaran yang terlambat tetap urusan Anda."
      - "Side Badger tidak menetapkan tenggat. Kapan sisa €148 milik Uma jatuh tempo, grup yang menyepakatinya."
      - "Pembayaran yang disarankan adalah daftar singkat, bukan janji akan daftar terpendek yang mungkin. Daftar itu dihitung per mata uang, jadi perjalanan yang dibayar dalam euro dan pound mendapat satu daftar untuk masing-masing."
