meta:
  title: "Jinsi ya kugawanya gharama za wikendi ya kuaga ukapera | Side Badger"
  description: "Mgeni rasmi halipi chochote na kila mtu bado anaongea Jumatatu. Jinsi ya kugawanya gharama za wikendi ya kuaga ukapera, hesabu zikiwemo."
h1: "Jinsi ya kugawanya gharama za wikendi ya kuaga ukapera"
navLabel: "Wikendi ya kuaga ukapera"
lead: "Mgeni rasmi halipi chochote, kwa hivyo kundi lingine linagawanya kila gharama [kwa usawa](page:feature/split-expenses) kati yao. Waache nje watu kwenye gharama wanazokosa, na mwache mgeni rasmi nje ya kikundi ili siri ibaki."
cta:
  heading: "Weka hesabu, ibaki siri"
  body: "Tengeneza kikundi, tuma kiungo kwa kila mtu isipokuwa mgeni rasmi na uongeze kila gharama inapotokea. Side Badger ni bure, bila matangazo na bila mipaka ya kila siku."
sections:
  - heading: "Marafiki wanne na siri moja"
    body: "Hannah, Isla, Jess na Kat wanampeleka Grace kwenye wikendi yake ya kuaga ukapera. Grace ni mgeni rasmi, kwa hivyo halipi chochote. Pia hayuko kwenye kikundi, kwa hivyo hawezi kuona marafiki zake wanatumia kiasi gani kwa ajili yake. Hannah anaweka nafasi ya nyumba ndogo, Isla analipia siku ya spa, Jess analipia chakula cha jioni na Kat analipia teksi. Kufikia Jumapili kila mtu amelipia kitu fulani, na hakuna anayeweza kusema nani yuko mbele. Hesabu ni zilezile kwa wikendi ya kuaga ukapera ya mwanamume au mwanamke, bila kujali mgeni rasmi ni nani."
  - heading: "Gawanya kwa wanaolipa, si kwa waliopo"
    body: "Sehemu ya mgeni rasmi haipotei. Inagawanywa. Nyumba ndogo inagharimu £720 na marafiki wanne wanailipia, kwa hivyo ni £180 kila mmoja, na nafasi ya Grace tayari imo kwenye kiasi hicho. Chakula cha jioni ni £260, kwa hivyo £65 kila mmoja. Teksi ni £44, kwa hivyo £11 kila mmoja. Chochote ambacho mtu anakikosa kinatolewa kwenye gharama hiyo tu. Kat anakosa spa, kwa hivyo £360 zake, zinazojumuisha nafasi ya Grace pia, zinagawanywa kati ya Hannah, Isla na Jess kwa £120 kila mmoja. Jumlisha na Hannah, Isla na Jess kila mmoja anadaiwa £376 za wikendi, na Kat anadaiwa £256."
  - heading: "Isanidi kwenye Side Badger"
    items:
      - "Tengeneza kikundi cha wikendi na ukipe jina la kuchosha, kama Wikendi ya nyumba ndogo. Grace si mwanachama, na ni wanachama wa kikundi tu wanaoweza kukiona."
      - >-
        Chagua **Alika wengine** na utume kiungo, au onyesha msimbo wa QR, mahali tu ambapo Grace hataona. Kiungo kinaonyesha hakikisho la kikundi kabla mtu yeyote hajajiunga. Chagua kitadumu kwa muda gani, kutoka dakika 15 hadi siku 5. Kiungo cha zamani kinaendelea kufanya kazi hadi kiishe, kwa hivyo usikiache zaidi ya unavyohitaji.
      - >-
        Kwa kila gharama, chagua **Ongeza Gharama**, weka kiasi na uchague mlipaji chini ya **Nani alilipa?** Chini ya **Gawanya kati ya**, weka tiki kwa watu wanaolipa, ukiwaacha nje yeyote aliyeikosa, kama Kat kwa spa. Chagua **Sawa** chini ya **Jinsi ya kugawanya**.
      - >-
        Mkiwa nyumbani, fungua **Salio** la kikundi. Side Badger inaonyesha nani anadaiwa na nani na kupendekeza orodha fupi ya malipo. Hapa ni matatu: Kat anamlipa Hannah £212, Jess anamlipa Hannah £116 na Isla anamlipa Hannah £16. Lipaneni mtakavyo, kisha tumia **Lipa deni** kurekodi kila malipo.
  - heading: "Kabla hujaweka nafasi, bajeti na amana"
    body: "Kubalianeni bajeti kabla mtu yeyote hajaweka nafasi. Chagua **Ongeza Kura**, uliza kikundi kitatumia kiasi gani kwa nyumba ndogo na utoe takwimu chache kama chaguo. Washa **Kupiga kura bila jina** unapoiunda, ili kuficha nani alimpigia nani kura, ili hakuna anayehitaji kutetea bajeti ndogo hadharani. Funga kura kila mtu akishapiga na mshindi akionekana. Kisha inakuja amana. Anayeweka nafasi analipa na kuiongeza kama gharama, iliyogawanywa kwa usawa, na malipo yaliyobaki yanaingia kama gharama ya pili yanapohitajika. Wengine wanaweza kutuma sehemu yao mara moja na kurekodi malipo, au kusubiri hesabu ya mwisho. Salio hutoka vilevile kwa njia yoyote."
  - heading: "Mtu anapojiunga kwa usiku mmoja"
    body: "Rafiki anayefika Jumamosi tu hapaswi kulipia Ijumaa. Mwache nje ya gharama ambazo hakuhusika nazo. Pale gharama inapotegemea kila mtu anakaa muda gani, kama chumba, chagua **Kiasi halisi** chini ya **Jinsi ya kugawanya** na uandike sehemu ya kila mtu, ambayo lazima ijumlishe jumla. Kokotoa kwanza bei ya mtu mmoja kwa usiku mmoja, kisha zidisha kwa usiku anaokaa kila mtu. Ukurasa wa [safari za vikundi](page:use-case/group-trips) una maelezo zaidi kuhusu gharama ambazo si sawa kwa kila mtu."
  - heading: "Kile ambacho Side Badger haifanyi hapa"
    items:
      - "Haihamishi pesa kamwe. Mnalipana kwa uhamisho wa benki, pesa taslimu au chochote kinachofaa, kisha mnarekodi malipo ili salio lisasishwe kwa kila mtu."
      - "Haitumi vikumbusho vya malipo. Kumkumbusha rafiki kwa upole kwenye gumzo la kikundi bado ni kazi ya binadamu."
      - "Kila gharama ina mlipaji mmoja, na Side Badger haiwezi kugawanya mstari wa risiti mstari kwa mstari. Kama kadi mbili zililipia nyumba ndogo, iweke kama gharama mbili. Kama baadhi ya watu waliagiza vitu vya ziada wakati wa chakula cha jioni, weka vitu hivyo vya ziada kama gharama yake yenyewe."
      - "Inaweka pesa, si ratiba ya safari. Kura na maoni hubaki kwenye gharama, kwa hivyo mipango ya wikendi inabaki kwenye gumzo la kikundi chenu."
