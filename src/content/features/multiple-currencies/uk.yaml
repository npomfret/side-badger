meta:
  title: "Діліть витрати у 140 валютах, конвертованих чи окремо"
  description: "Вводьте кожну витрату у валюті, якою платили, ведіть баланси окремо або конвертуйте за курсом, який видно й можна змінити, а потім розрахуйтеся коротким списком платежів."
h1: "Діліть витрати у 140 валютах"
navLabel: "Кілька валют"
lead: "Євро, єни та те одне таксі в батах. Side Badger приймає кожну витрату у валюті, якою ви платили, тримає баланси в порядку й може конвертувати, коли група воліє розрахуватися раз. Працює у 140 валютах і природно пасує до [групових поїздок](page:use-case/group-trips)."
cta:
  heading: "Несіть свої євро, несіть свої єни"
  body: "Створіть обліковий запис, заведіть групу й додайте першу витрату в будь-якій валюті, яка опинилася під рукою."
  button: "Створити безкоштовний обліковий запис"
problem:
  heading: "Вводьте так, як платили"
  body: "Поїздку рідко оплачують в одній валюті. Готель забронювали вдома у фунтах, вечерю оплатили в єнах, а каву в аеропорту — в тому, що було на пересадці. Конвертувати все вручну, ще не ввівши, — так таблиці й покидають. У Side Badger ви вводите кожну витрату у валюті з чека, а кожна сума дотримується правил своєї валюти, тож в єн немає десяткових знаків, а в динарів їх три. Нещодавно використані валюти йдуть першими в списку."
workflow:
  heading: "Тримайте валюти окремо або конвертуйте на ходу"
  steps:
    - title: "Додайте витрату у її власній валюті"
      body: "Оберіть валюту, введіть суму, скажіть, хто заплатив і хто ділив. Більше нічого не потрібно. Це типова поведінка, і вона зберігає початкову суму точно такою, як ви її ввели."
      shot: S07
      shotAlt: "Форма витрати з введеною сумою в єнах"
    - title: "Стежте за балансом для кожної валюти"
      body: "Баланси ведуться окремо для кожної валюти, і кожна має свій короткий список підказаних платежів. Фунти розраховуються у фунтах, єни — в єнах."
      shot: S10
      shotAlt: "Екран балансів зі спрощеними боргами у двох валютах"
    - title: "Або конвертуйте, коли група воліє розрахуватися раз"
      body: "Оберіть іншу валюту під час введення витрати, і Side Badger може конвертувати її за актуальним курсом обміну, який можна змінити на той, що діяв під час обміну. Конвертована сума долучається до балансу в цій валюті. Конвертація — це вибір групи, ніколи не те, що відбувається за вашою спиною."
options:
  heading: "Курс, який видно й можна змінити"
  items:
    - title: "Курс показано"
      body: "Коли ви конвертуєте, курс і конвертована сума з'являються у формі, тож нікому не треба вірити цифрі на слово."
    - title: "Введіть власний"
      body: "Отримали кращий курс у касі чи гірший в аеропорту? Змініть курс на той, що діяв, і конвертована сума оновиться."
    - title: "Оригінал лишається"
      body: "Початкова сума лишається біля витрати, поряд із конвертованою, для всіх, хто запитає, скільки це було в єнах."
    - title: "Конвертація безкоштовна"
      body: "Конвертація нічого не коштує. За введення витрати в іншій валюті комісії немає."
