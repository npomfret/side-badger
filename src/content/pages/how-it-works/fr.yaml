meta:
  title: "Comment fonctionne Side Badger | Partager les dépenses d'un groupe en cinq étapes"
  description: "Créez un groupe, invitez des personnes, ajoutez des dépenses et réglez vos comptes. Découvrez ce qui se passe entre « quelqu'un a payé » et « on est quittes », avec un exemple détaillé."
h1: "Comment fonctionne Side Badger"
navLabel: "Comment ça marche"
lead: "Que se passe-t-il entre « quelqu'un a payé » et « on est quittes » ? Cinq étapes, aucun tableur, et un blaireau surtout décoratif. Voici tout le trajet, du premier groupe au dernier paiement enregistré. Pour le détail de chaque étape, voyez [partager les dépenses](page:feature/split-expenses) et [régler les comptes](page:feature/settle-up)."
cta:
  heading: "De « je prends celle-ci » à « on est quittes »"
  body: "Créez un compte gratuit, lancez un groupe et ajoutez la première dépense. Le blaireau ne jugera pas le reçu."
steps:
  - title: "Créez un groupe"
    body: "Faites un groupe par maison, voyage ou événement, pour que le loyer ne se retrouve jamais dans la même liste que le cadeau de mariage. Donnez-lui un nom, choisissez le nom sous lequel les autres vous verront et, si vous le souhaitez, limitez les devises acceptées. Votre tableau de bord affiche ensuite tous vos groupes, et votre situation dans chacun, sur un seul écran."
    shot: S02
    shotAlt: "La boîte de dialogue de création de groupe avec la section des restrictions de devises ouverte"
  - title: "Invitez vos proches"
    body: "Partagez un lien d'invitation ou montrez un code QR, et choisissez sa durée de validité, de 15 minutes à 5 jours. Chaque personne qui rejoint a besoin d'un compte gratuit et d'un e-mail vérifié, et un groupe compte jusqu'à 50 personnes. Si vous voulez contrôler qui entre, activez l'approbation et un admin laisse entrer chaque personne."
    shot: S03
    shotAlt: "La boîte de dialogue d'invitation sur l'onglet du lien, avec un code QR et les choix de durée de validité"
  - title: "Ajoutez les dépenses au fil de l'eau"
    body: "Dites qui a payé, combien, et pour qui. Partagez à parts égales, par montants exacts ou par pourcentage, et laissez de côté les personnes qui n'étaient pas concernées. Ajoutez la dépense et tout le monde la voit tout de suite, avec ce qui a changé et qui l'a modifié."
    shot: S05
    shotAlt: "Le formulaire de dépense avec un partage par pourcentage, qui répartit le loyer selon la taille des chambres"
  - title: "Surveillez les soldes"
    body: "Side Badger tient un solde à jour pour chaque devise, pour voir d'un coup d'œil qui doit quoi à qui. Plutôt que de laisser chacun démêler un écheveau de petites dettes, il suggère une courte liste de paiements qui règle les comptes du groupe."
    shot: S10
    shotAlt: "L'écran des soldes affichant des dettes simplifiées dans deux devises, avec « Tout afficher » activé"
  - title: "Réglez en dehors de l'appli, enregistrez dedans"
    body: "Side Badger ne fait jamais circuler d'argent. Remboursez-vous comme vous voulez, puis enregistrez le paiement pour que les soldes se mettent à jour, et l'écran de chacun s'actualise sans rechargement. « Réglé » veut simplement dire que les soldes sont à zéro. Personne ne peut quitter un groupe tant qu'il doit de l'argent ou qu'on lui en doit, donc celui qui s'apprête à partir règle d'abord."
    shot: S11
    shotAlt: "Le formulaire de paiement avec les boutons de règlement rapide et l'avis de paiement partiel"
requirements:
  heading: "Ce qu'il vous faut"
  items:
    - "Un compte gratuit. Il suffit d'une adresse e-mail et d'un mot de passe, et vous vérifiez l'e-mail avant de pouvoir ajouter quoi que ce soit."
    - "Avoir 18 ans ou plus."
    - "Un navigateur récent sur un téléphone ou un ordinateur, et une connexion. Side Badger n'est pas une appli des boutiques d'applications et ne fonctionne pas hors connexion."
    - "En option, une place sur votre écran d'accueil. Pas besoin de boutique d'applications : connectez-vous, puis ajoutez Side Badger à votre écran d'accueil ou à votre dock, et il s'ouvre comme une appli. Les Paramètres de l'appli vous montrent comment."
example:
