sections:
  - heading: 39 hizkuntza, eta jende gehiagorentzat egina
    body: Erabili Side Badger 39 hizkuntzatan, eskuinetik ezkerrera idazten diren arabiera, persiera eta urdua barne. Taldeko bakoitzak berea aukera dezake, beraz taldearen orria arabieraz egon daiteke batentzat eta ingelesez hurrengoarentzat. Teklatua eta pantaila-irakurgailua erabiltzen dituztenak ere kontuan hartuta eraiki da, eta kideen koloreek ereduak dituzte, berdea gorritik bereizi beharrik izan ez dezazun.
faq:
  heading: Galderak
  items:
    - q: Denek behar dute kontu bat?
      a: Bai, doako bat. Pertsona bakoitzak bere posta egiaztatzen du ezer gehitu aurretik.
    - q: Aplikaziorik ba al dago?
      a: Nabigatzailean funtzionatzen du. Hasi saioa eta gero gehitu hasierako pantailara edo mahaigainera aplikazio bat bezala ireki dadin. Aplikazioko Ezarpenek erakusten dizute nola. Ez dago aplikazio-dendako bertsiorik eta ez dago konexiorik gabeko modurik.
    - q: Side Badger-ek dirua mugitzen al du?
      a: Ez. Kontua eramaten du eta ordainketak proposatzen ditu, eta zuek ordaintzen duzue nahi duzuen moduan. Gero ordainketa erregistratzen duzue. Ikusi [kitatzea](page:feature/settle-up).
    - q: Norbaitek zorrarekin utzi dezake taldea?
      a: Ez. Inork ezin du taldea utzi zor duen edo zor zaion bitartean, beraz lehenago kitatzen du.
    - q: Zenbat lagun sar daitezke talde batean?
      a: Gehienez 50 lagun talde batean. Gonbidatu esteka edo QR kode batekin, eta aktibatu onarpena administratzaile batek bakoitza sartzen utz dezan nahi baduzu.
    - q: Eta moneta batean baino gehiagoko bidaiak?
      a: Saldoak moneta bakoitzeko bereizita gordetzen dira. Ikusi [moneta anitz](page:feature/multiple-currencies).
