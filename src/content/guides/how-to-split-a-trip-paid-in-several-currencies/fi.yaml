faq:
  heading: Kysymyksiä
  items:
    - q: Mitä valuuttakurssia Side Badger käyttää?
      a: Nykyistä valuuttakurssia, joka haetaan kulua syötettäessä, kun sellainen on saatavilla. Voit vaihtaa sen kurssiin, jonka todella sait.
    - q: Voiko ryhmä pitäytyä punnissa ja jeneissä?
      a: "Kyllä. Avaa ryhmän **Asetukset**, ota **Valuutta-asetukset**-osiossa käyttöön **Rajoita valuuttoja tässä ryhmässä**, valitse **Sallitut valuutat** ja aseta **Oletusvaluutta uusille kuluille**. Vähemmän vaihtoehtoja listassa tarkoittaa vähemmän väärää arvausta kassalla."
    - q: Onko meidän pakko muuntaa?
      a: Ei. Valuutat pysyvät erillään, ellet sinä tai ryhmäsi valitse muuntamista, ja jokaisella valuutalla on oma lyhyt maksulistansa.
