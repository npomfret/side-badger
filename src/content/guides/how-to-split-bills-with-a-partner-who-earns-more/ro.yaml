meta:
  title: "Împarte facturile când partenerul câștigă mai mult | Side Badger"
  description: "Împărțirea 50/50 devine incomodă când unul câștigă mult mai mult. Împarte facturile comune după venit, cu socotelile arătate pentru doi, fără foaie de calcul."
h1: "Cum împarți facturile cu un partener care câștigă mai mult"
navLabel: "Partener care câștigă mai mult"
lead: "Adună veniturile nete, calculează partea fiecăruia din total și rotunjește la procente întregi. Maya încasează net 2.800 £, iar Jon 1.700 £, așa că își împart facturile comune 62/38. Introdu procentele pe o cheltuială comună în Side Badger, apoi copiaz-o de fiecare dată când vine aceeași factură."
cta:
  heading: "Fă socoteala o singură dată"
  body: "Creează un cont gratuit, fă un grup pentru voi doi și introdu chiria cu procentele voastre. Chiria lunii viitoare e o copie. Vrei mai întâi turul? Vezi [cum funcționează](page:how-it-works) sau [ce acoperă gratuitul](page:pricing)."
sections:
  - heading: "Două salarii, un apartament, o tăcere politicoasă"
    body: "Maya și Jon locuiesc împreună. Maya încasează net 2.800 £ pe lună, iar Jon 1.700 £. Doi ani au împărțit totul 50/50, pentru că era simplu și niciunul nu voia să fie cel care aduce vorba. Apoi Jon s-a uitat la chirie separat. Jumătate din 1.400 £ înseamnă 700 £, adică un sfert din venitul net al lui Maya și 41% din al lui. Nimeni nu fusese nedrept. Nimeni nu făcuse socoteala. Multe [cupluri](page:use-case/couples) ajung aici până la urmă. La o mâncare comandată au convenit că facturile comune ar trebui să ia o felie asemănătoare din fiecare venit."
  - heading: "Metoda, cu socotelile arătate"
    body: "Patru pași, un calculator și o discuție pe care oricum urma s-o aveți."
    items:
      - "**Stabiliți ce se socotește venit.** Maya și Jon folosesc venitul net, banii care ajung în cont în fiecare lună. Împreună face 2.800 £ + 1.700 £ = 4.500 £."
      - "**Calculați partea fiecăruia.** A lui Maya este 2.800 ÷ 4.500, adică 62,2%. A lui Jon este 1.700 ÷ 4.500, adică 37,8%."
      - "**Rotunjiți la procente întregi.** 62,2% devine 62, iar 37,8% devine 38. Cu două persoane, rotunjești o cifră și o scazi din 100 ca s-o obții pe cealaltă, așa că împreună dau mereu 100."
      - "**Verificați ce înseamnă.** La chiria de 1.400 £, Maya plătește 868 £ (62%), iar Jon 532 £ (38%). Asta înseamnă cam 31% din venitul net al fiecăruia. Jumătate fiecare ar fi luat 25% din venitul lui Maya și 41% din al lui Jon."
  - heading: "Luna, citită"
    body: "Maya a plătit chiria de 1.400 £, iar Jon restul de 216 £. Partea lui Maya din lună este 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, iar ea a plătit 1.400 £, deci i se datorează 402,40 £. Partea lui Jon este 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, iar el a plătit 216 £, deci datorează 402,40 £. Side Badger sugerează o plată, de la Jon către Maya, de 402,40 £, iar [decontarea](page:feature/settle-up) o înregistrează după ce a fost făcută. Împărțită 50/50, aceeași lună l-ar fi pus pe Jon să-i plătească lui Maya 592,00 £."
  - heading: "Configurează în Side Badger"
    body: "Zece minute, din care cele mai multe se duc pe procente."
    items:
      - "**Fă grupul.** Pe panou alege **Creează Grup** și numește-l după apartament. Alege **Invită pe alții** și trimite-i lui Jon linkul sau codul QR. El se autentifică sau își creează un cont gratuit și alege numele sub care vrea să apară în acest grup. Un grup îl văd doar membrii lui, așa că acesta e doar al vostru, al celor doi."
      - "**Adaugă chiria.** Alege **Adaugă Cheltuială**. Introdu descrierea și suma, iar la **Cine a plătit?** alege-o pe Maya. Ține-i pe amândoi la **Împarte între**, apoi la **Cum se împarte** alege **Procentaj** și scrie 62 și 38. Formularul te avertizează dacă procentele nu dau împreună 100. Alege **Salvează Cheltuiala**."
      - "**Adaugă celelalte facturi.** Energia și internetul se introduc la fel, cu Jon ca plătitor și aceleași 62 și 38. Mâncarea comandată e o cheltuială separată, cu **Cum se împarte** lăsat pe **Egal**."
      - "**Copiază-o luna viitoare.** Deschide chiria lunii trecute și alege **Copiază cheltuiala**. Copia păstrează plătitorul, suma și împărțirea și ia data de azi. Schimbă suma dacă s-a schimbat chiria, apoi alege **Creează copie**. Factura la energie merge la fel."
      - "**Vezi cine cui datorează.** Secțiunea **Solduri** o arată și sugerează o listă scurtă de plăți. Plătiți-vă unul altuia cum preferați, apoi înregistrați plata la **Decontează**."
  - heading: "50/50, după venit sau factură cu factură"
    body: "Nu există un răspuns corect, doar cel cu care puteți trăi amândoi. Trei variante des întâlnite."
    items:
      - "**Jumătate fiecare la tot.** Cea mai ușor de ținut și se potrivește cuplurilor cu venituri apropiate."
      - "**După venit, la tot ce e comun.** Ce fac Maya și Jon. O singură discuție, o singură pereche de procente."
      - "**Factură cu factură.** Chiria și facturile după venit, vacanțele și răsfățurile 50/50 sau cum conveniți, iar fiecare factură primește regula care i se potrivește."
  - heading: "Stabiliți ce e comun"
    body: "Cearta e de obicei pe listă, nu pe procente. Chiria, energia, internetul, cumpărăturile săptămânale și canapeaua se socotesc comune în cele mai multe case. Abonamentul la sală al lui Maya și abonamentul la fotbal al lui Jon poate că nu. Stabiliți lista o singură dată, scrieți-o și puneți în grup doar costurile comune."
  - heading: "Mâncarea comandată rămâne 50/50, intenționat"
    body: "Răsfățurile sunt mici și opționale, iar nimeni nu ar trebui să aibă nevoie de calculator ca să comande colțunași. În Side Badger, mâncarea comandată e doar o altă cheltuială. Jon plătește 36 £, **Cum se împarte** rămâne pe **Egal**, iar fiecare datorează 18 £."
  - heading: "Când se schimbă venitul cuiva"
    body: "O mărire de salariu, un job nou sau o pauză de la muncă schimbă calculul. Calculează noile procente la fel și folosește-le de la următoarea cheltuială. Cheltuielile anterioare rămân cum erau. Copiază chiria lunii trecute, schimbă procentele, apoi alege **Creează copie**. Ca să corectezi una deja introdusă, editează-o dacă permisiunile grupului o permit și spune-i mai întâi celuilalt, pentru că soldurile se schimbă. Versiunea anterioară se păstrează. Stabiliți când recalculați, de exemplu o dată pe an, și achitați-vă înainte de schimbare, ca vechea împărțire să se închidă cu o socoteală curată."
  - heading: "Ce nu face Side Badger aici"
    items:
      - "Nu întreabă niciodată cât câștigă cineva și nu calculează procentele. Tu scrii cifrele la care ați ajuns."
      - "Nu poate seta o împărțire implicită pentru tot grupul. Procentele se pun pe fiecare cheltuială, așa că copiază una care le are deja."
      - "Nu are facturi recurente, așa că copiezi chiria lunii trecute de fiecare dată."
      - "Nu mută niciodată bani. Vă plătiți unul altuia cum preferați și înregistrați plata."
