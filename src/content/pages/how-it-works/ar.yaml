sections:
  - heading: "39 لغة، ومصمَّم لعدد أكبر من الناس"
    body: "استخدم Side Badger بـ 39 لغة، منها العربية والفارسية والأردية بكتابتها من اليمين إلى اليسار. يمكن لكل فرد في المجموعة اختيار لغته، فتظهر صفحة المجموعة بالعربية لشخص وبالإنجليزية لمن بعده. وهو مصمَّم أيضاً مع مراعاة مستخدمي لوحة المفاتيح وقارئات الشاشة، وألوان الأعضاء مصحوبة بأنماط، فلا تحتاج إلى التمييز بين الأخضر والأحمر."
faq:
  heading: "أسئلة"
  items:
    - q: "هل يحتاج الجميع إلى حساب؟"
      a: "نعم، حساب مجاني. يوثّق كل شخص بريده الإلكتروني قبل أن يضيف أي شيء."
    - q: "هل هناك تطبيق؟"
      a: "يعمل في المتصفح، ويمكنك إضافته إلى شاشتك الرئيسية أو شريط التطبيقات ليفتح كأنه تطبيق. لا توجد نسخة في متجر التطبيقات ولا وضع دون اتصال."
    - q: "هل ينقل Side Badger الأموال؟"
      a: "لا. يحتفظ بالحساب ويقترح الدفعات، وتدفعون لبعضكم بالطريقة التي تناسبكم. ثم تسجّلون الدفعة. انظر [تسوية الحسابات](page:feature/settle-up)."
    - q: "هل يمكن لأحد أن يغادر وعليه دين؟"
      a: "لا. لا يمكن لأحد مغادرة المجموعة ما دام عليه مبلغ أو له مبلغ، فيسوّي حسابه أولاً."
    - q: "كم شخصاً يمكنه الانضمام إلى مجموعة؟"
      a: "حتى 50 شخصاً في المجموعة. ادعُهم برابط أو رمز QR، وشغّل الموافقة إن أردت أن يسمح المشرف لكل شخص بالدخول."
    - q: "وماذا عن الرحلات التي فيها أكثر من عملة؟"
      a: "تُحفظ الأرصدة منفصلة لكل عملة. انظر [العملات المتعددة](page:feature/multiple-currencies)."
