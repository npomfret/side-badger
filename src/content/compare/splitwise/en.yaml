sections:
  - heading: What Splitwise does well
    body: "If your group needs a native app, offline use or payments inside the app, Splitwise is the sensible choice, and we would rather you picked it than found out later. Its own pages list:"
    items:
      - "**Apps and offline use.** iPhone and Android apps as well as the web, and an offline mode."
      - "**More ways to split.** Shares, adjustments and itemised splits, on top of equal, exact and percentage."
      - "**Recurring expenses.** Set the rent to repeat and forget about it."
      - "**Payments in the app.** In some countries it can move the money too, through Splitwise Pay, Venmo, PayPal or Pay by Bank."
  - heading: Free here, paid there
    body: "Splitwise Pro is Splitwise's paid plan, and its own Pro page sells four things that cost nothing in Side Badger."
    items:
      - "**Receipt scanning.** Splitwise Pro scans a photo of your receipt. Side Badger does it for free, with no scan credits: it fills in the total, date and place for you to check. Receipt images are read by Google's AI service."
      - "**Currency conversion.** Splitwise Pro converts a group's expenses to your default currency when you tap Convert. Side Badger converts each expense as you enter it, at a current exchange rate or the one you actually got, and the original amount stays on the expense."
      - "**No ads.** Splitwise lists a totally ad-free experience as a Pro feature. Side Badger has no ads."
      - "**No daily limits.** Splitwise Pro sells unlimited expenses, and its help centre says free users can add up to 4 expenses each day. Side Badger has no daily limits."
  - heading: What Splitwise has that Side Badger doesn't
    body: "This isn't every Splitwise feature, only the ones that tend to decide it. Splitwise's own pages have the full list. Here is where Side Badger comes up short."
    items:
      - "**Native apps.** Side Badger works in your browser. Sign in, then add it to your home screen and it opens like an app."
      - "**Offline mode.** Side Badger needs a connection."
      - "**Payments in the app.** Side Badger never touches your money. Pay each other however you like, then record the payment."
      - "**Recurring expenses.** Side Badger has none. Copy last month's rent instead of typing it again."
      - "**Splitting by shares or by item.** Side Badger has one payer per expense, split equally, by exact amounts or by percentage. Its receipt scanning doesn't assign items to people."
      - "**Charts and default splits.** Splitwise Pro has both. Side Badger keeps the count of who owes whom, and that's the whole trick."
  - heading: Moving your group over
    body: "There is no importer, so a move means a fresh start. Settle up in Splitwise first, then create a group in Side Badger and invite everyone with a link or a QR code. Everyone in the group needs a free account, and all it takes to sign up is an email address."
