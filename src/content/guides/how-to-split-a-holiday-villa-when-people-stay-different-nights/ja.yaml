meta:
  title: "泊数が違うメンバーでヴィラを割り勘 | Side Badger"
  description: "Devは3泊しか来ないのに、6泊分を払う理由はありません。ヴィラの料金を実際に泊まった夜数で分ける方法を、計算つきで解説します。"
h1: "泊数がバラバラのとき、ヴィラの費用を割り勘する方法"
navLabel: "ヴィラを泊数で分ける"
lead: "1人1泊あたりの料金を出し、各自の泊数を掛けて、ヴィラを**正確な金額を指定した1件の支出**として入力します。Side Badgerが貸し借りの集計を管理し、精算のときには短い支払いリストを提案します。"
cta:
  heading: "ヴィラは1件にすっきり入力"
  body: "グループを作り、リンクまたはQRコードで全員を招待して、ヴィラを正確な金額で入力しましょう。休暇を楽しんでいる間も、Side Badgerが貸し借りの集計を付け続けます。"
sections:
  - heading: "6泊、4人、クレジットカード1枚"
    body: "[グループ旅行](page:use-case/group-trips)は、たいてい誰か1人のカードから始まります。今回はAnaのカードです。誰かが最初に払わなければならないので、Anaが6泊のヴィラを€2,100で予約しました。Ana、Ben、Chloeは6泊とも滞在します。Devが参加できるのは最後の3泊だけで、電車で来ます。Benはレンタカーを借りますが、Devはその車に一度も乗りません。Devは食料品の大きな買い出しを担当します。ヴィラを4等分するのは、いちばん手っ取り早い方法です。でもそれでは、Devが自宅で過ごした3泊分まで払うことになり、こういう話はクリスマスに蒸し返されるものです。泊数で分ければ言い争いは避けられ、計算にかかるのは1分です。"
  - heading: "1人1泊あたりの料金を出す"
    body: "**人泊**とは、1人が1泊することです。ヴィラの料金は変わらないので、料金をすべての人泊で割り、そのうえで各自が使った分を割り当てます。"
    items:
      - "**人泊を数える。** Ana、Ben、Chloeはそれぞれ6泊、Devは3泊です。6 + 6 + 6 + 3 = 21人泊。"
      - "**1人泊あたりの料金を出す。** €2,100 ÷ 21 = 1人泊あたり€100。"
      - "**各自の泊数を掛ける。** Ana、Ben、Chloeは6 × €100 = €600ずつ。Devは3 × €100 = €300。"
      - "**合計を確認する。** €600 + €600 + €600 + €300 = €2,100。各自の分の合計が料金と合わない場合は、1泊が抜けているか、二重に数えています。"
  - heading: "Side Badgerに入力する"
    body: "グループを作り、ほかの3人をリンクまたはQRコードで招待してから、費用を追加します。まずはヴィラから。"
    items:
      - "**経費を追加**を選びます。説明を入れ、2,100と入力して、**誰が支払いましたか？**をAnaにします。"
      - "**割り勘相手**に、4人全員が入っていることを確認します。"
      - "**割り勘方法**で**正確な金額**を選びます。Ana、Ben、Chloeには600、Devには300と入力します。金額の合計は総額と一致する必要があります。"
      - "**経費を保存**を選びます。"
      - "レンタカーも同じように追加します。支払ったのはBen、分け方は**均等**で、Devは電車で来たので外します。ほかの分け方は[割り勘の仕方](page:feature/split-expenses)をご覧ください。"
      - "食料品を追加します。支払ったのはDev、分け方は**均等**で、4人全員を入れます。"
  - heading: "結果を読み、精算する"
    body: "各自の請求額は、ヴィラの分に、車と買い物の負担分を足したものです。Ana、Ben、Chloeはそれぞれ€725で、内訳は€600 + €80 + €45です。Devは€345で、内訳は€300 + €45です。そこから各自が支払った額を引くと、残高が出ます。Anaは€2,100を支払ったので、€1,375を受け取る側です。Benは€240を支払い、€485を支払う側です。Devは€180を支払い、€165を支払う側です。Chloeは何も支払っておらず、€725を支払う側です。このまま放っておくと、これらの債務はグループ内の6組の間を行き交うことになります。Side Badgerが代わりに提案するのは3回の支払いで、すべてAna宛てです。好きな方法でAnaに支払い、そのあと**精算する**を選んで、1回ごとに**精算を記録**を使い、残高に反映させます。クイック精算ボタンが金額を入力してくれます。詳しくは[精算](page:feature/settle-up)をご覧ください。"
  - heading: "ヴィラの料金がきれいな1つの価格ではないとき"
    items:
      - "**部屋ごとに違う。** スイートが小部屋より価値が高いなら、まず各部屋の料金を決めてから、部屋ごとに人泊の計算をします。ヴィラは、全員の合計額を入れた1件の支出にするか、部屋ごとに1件ずつにします。どちらの場合も、1件の支出の正確な金額は、その合計と一致する必要があります。"
      - "**何か月も前に払った手付金。** 手付金は、払った人を支払者として、払った日付の別の支出にします。残金と同じ割合で、泊数に応じて分けます。"
      - "**予約が別の通貨のとき。** ヴィラは支払った通貨で入力します。グループが入力時に換算する場合は、現在の為替レートを使うか、実際に適用されたレートを入力します。元の金額は支出に残ります。詳しくは[複数の通貨](page:feature/multiple-currencies)をご覧ください。"
      - "**中途半端な泊数。** 真夜中に着く人もいれば、朝食前に発つ人もいます。泊数の数え方のルールを1つ決めて、全員に同じルールを使いましょう。"
  - heading: "ここでSide Badgerにできないこと"
    items:
      - "泊数は数えてくれません。泊数や持ち分による分割はないので、上のように各自の金額を計算して、**正確な金額**で入力します。"
      - "お金を動かすことはありません。支払いは好きな方法で行い、そのあと記録します。"
      - "1件の支出につき、支払った人は1人です。2人でヴィラの代金を払った場合は、2件の支出として入力します。"
      - "ゲスト用のアクセスはありません。Devも含め、グループの全員に無料アカウントが必要です。"
exampleAfter: 2
example:
  heading: "ヴィラ、車、買い物"
  currency: EUR
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: chloe
      name: Chloe
    - id: dev
      name: Dev
  expenses:
    - label: "ヴィラ6泊"
      payer: ana
      amount: 2100
      split:
        method: exact
        shares:
          ana: 600
          ben: 600
          chloe: 600
          dev: 300
    - label: "レンタカー"
      payer: ben
      amount: 240
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "食料品"
      payer: dev
      amount: 180
      split:
        method: equal
faq:
  heading: "ヴィラに関するよくある質問"
  items:
    - q: "誰かがキャンセルしたら？"
      a: "その人の泊数を除いて計算し直し、正確な金額の合計が再び料金と一致するように、ヴィラの支出を編集します。以前のバージョンは保存され、編集はグループのアクティビティに表示されるので、数字がこっそり変わることはありません。誰が編集できるかは、グループの権限によって決まります。"
    - q: "予約した人は安くしてもいいですか？"
      a: "それはグループで決めることです。予約は面倒な仕事で、割引に値するかどうかはグループによって考えが違います。何に決めても、正確な金額に反映し、支出のメモか、そのすぐそばのコメントに書いておけば、約束を誰かが覚えておく必要はありません。"
    - q: "清掃料金は別の分け方にできますか？"
      a: "はい。料金を別の支出として入力し、それ専用の分け方を設定します。家全体にかかる定額なら、均等が合います。料金も泊数に応じて分けたいグループには、正確な金額が向いています。"
