meta:
  title: "Banatu gastuak berdin, zehatz edo ehunekoen arabera | Side Badger"
  description: "Banatu partekatutako kostu bat berdin, zenbateko zehatzen arabera edo ehunekoen arabera, eta utzi kanpoan ez zeudenak. Doakoa, iragarkirik gabe eta eguneko mugarik gabe."
h1: Banatu gastuak berdin, zenbateko zehatzen arabera edo ehunekoen arabera
navLabel: Banatu gastuak
lead: Ez da dena 50/50. Side Badger-ek moldatzen daki. Esan nork ordaindu duen, aukeratu kostua partekatu duten pertsonak, eta banatu **berdin, zenbateko zehatzen arabera edo ehunekoen arabera**. Aserreak bereiz saltzen dira.
cta:
  heading: Banatu hurrengoa behar bezala
  body: Sortu doako kontu bat, hasi talde bat eta gehitu aspaldi konpondu nahi zenuen gastua. Ez dakizu zer gertatzen den gero? Ikusi [nola funtzionatzen duen](page:how-it-works), edo begiratu [doakoak zer hartzen duen](page:pricing).
  button: Sortu doako kontu bat
problem:
  heading: Ez da dena 50/50
  body: Alokairua gelaren tamainaren arabera doa. Opari bat nork zer agindu duenaren arabera. Afari bat postrera arte nor geratu denaren arabera. Faktura bat erditik banatzea ondo dabil erditik ez doan lehen fakturara iritsi arte, eta orduan norbaitek kalkulu-orri bat irekitzen du. Side Badger-ek erregistratzen du nork ordaindu duen, nork partekatu duen kostua eta nola banatzen den, saldoak zuzen ateratzeko inork mahaian zatiketa luzerik egin gabe.
workflow:
  heading: Gastu bat gehitzea, hasieratik amaierara
  steps:
    - title: Esan nork ordaindu duen eta zertarako
      body: Sartu zenbatekoa, deskribapen labur bat eta ordaindu duen pertsona. Pertsona batek ordaintzen du gastu bakoitza, eta horrek aritmetika zintzo mantentzen du.
      shot: S05
      shotAlt: Landetxe baten alokairua hiru pertsonen artean ehunekoetan banatuta duen gastu-formularioa
    - title: Aukeratu banaketa
      body: Aukeratu berdina, zenbateko zehatzak edo ehunekoak. Ehunekoek 100 batu behar dute, eta zenbateko zehatzek guztizkoa.
      shot: S06
      shotAlt: Opari baten pertsona bakoitzaren zenbateko zehatzak sartuta dituen gastu-formularioa
    - title: Gehitu istorioa
      body: Ezarri data, gehitu etiketak, lekua eta ohar bat. Taldeko guztiek xehetasun berak ikusten dituzte, eta bertan bertan iruzkin dezakete.
      shot: S08
      shotAlt: Bere xehetasunekin, iruzkin-hari batekin eta sartu zen jatorrizko zenbatekoarekin dagoen gastu bat
    - title: Egin galdera zerbait arraroa badirudi
      body: Taldeak gastu-galderak aktibatuta baditu, gastu batean sartuta dagoen edonork gastua zalantzan jar dezake, eta gastu-zerrendak zalantzan jarritakoak bakarrik erakutsi ditzake.
      shot: S18
      shotAlt: “Zalantzan jarri da” bereizgarria eta “Zalantzan jarritakoak bakarrik” iragazkia dituen gastu-zerrenda
options:
  heading: Hiru banatzeko modu
  items:
    - title: Berdin
      body: Afarietarako, taxietarako eta denek berdin partekatutako edozertarako lehenetsia. Guztizkoa garbi zatitzen ez bada, hondar zentimoa pertsona bati ematen zaio zoriz, ez beti berari. Beheko taxian, Ana da.
    - title: Zenbateko zehatzen arabera
      body: Idatzi bakoitzak zenbat zor duen. Ona da bakoitzak prezio desberdina aukeratu zuen oparirako, edo norbaiten saskian partekatutako erosketak baino gehiago zegoen dendarako. Zenbatekoek guztizkoa batu behar dute.
    - title: Ehunekoen arabera
      body: Eman pertsona bakoitzari guztizkoaren zati bat. Alokairua gelaren tamainaren arabera da klasikoa, gelarik handienak zatirik handiena ordainduz eta inork bestelakorik itxuratu gabe.
