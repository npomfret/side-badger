sections:
  - heading: "పేమెంట్ రికార్డ్ చేయండి"
    body: "ఎవరైనా చెల్లించినప్పుడు, సరైన వ్యక్తి పేరు మీద దాన్ని రికార్డ్ చేయండి. త్వరిత సెటిల్మెంట్ బటన్లు మీకు సూచించిన పేమెంట్ల నుండి మొత్తాన్ని నింపుతాయి, మీరు “బ్యాంక్ ట్రాన్స్‌ఫర్” లాంటి నోట్ జోడించవచ్చు (500 అక్షరాల వరకు). మీరు ఇవ్వాల్సిన దానిలో కొంత భాగమే చెల్లిస్తే మిగిలింది బ్యాలెన్స్‌లో ఉంటుంది. మీరు మరీ తక్కువ లేదా ఎక్కువ నమోదు చేస్తే, సేవ్ చేయడానికి ముందు Side Badger హెచ్చరిస్తుంది. పేమెంట్ రికార్డ్ చేయడానికి ఖర్చులను సవరించే అనుమతి కావాలి, తేదీ భవిష్యత్తులో ఉండకూడదు."
  - heading: "వేరే కరెన్సీలో చెల్లించారా?"
    body: "బ్యాలెన్స్‌లు చెల్లించిన కరెన్సీలోనే ఉంటాయి, కాబట్టి యూరో అప్పు యూరో అప్పుగానే ఉంటుంది. యూరోలు ఇవ్వాలి, కానీ పౌండ్లలో చెల్లిస్తారా? పేమెంట్ నమోదు చేసేటప్పుడు దాన్ని మార్చండి, ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో లేదా మీకు నిజంగా వచ్చిన రేటుతో. పేమెంట్ సేవ్ అయ్యేటప్పుడు రేటు స్థిరపడుతుంది. మార్పిడి ఎలా పనిచేస్తుందో [అనేక కరెన్సీలు](page:feature/multiple-currencies) చెబుతుంది, దాని వాడకాన్ని [గ్రూప్ ట్రిప్‌లు](page:use-case/group-trips) చూపిస్తుంది."
  - heading: "మీరు సరిచూడగల చరిత్ర"
    body: "రికార్డ్ చేసిన ప్రతి పేమెంట్ దాని తేదీ, మొత్తం, నోట్‌తో గ్రూప్ చరిత్రలో ఉంటుంది. పేమెంట్‌ను రికార్డ్ చేసిన వ్యక్తి మాత్రమే సవరించగలరు, ఆ వ్యక్తి లేదా గ్రూప్ అడ్మిన్ తొలగించవచ్చు. గ్రూప్ వదిలి వెళ్లిన వ్యక్తి ఉన్న పేమెంట్ లాక్ అవుతుంది. రూమ్‌మేట్ల పూర్తి సన్నివేశం కోసం [రూమ్‌మేట్లు](page:use-case/housemates) చూడండి."
limits:
  heading: "Side Badger చేయనివి"
  items:
    - "Side Badger డబ్బును కదిలించదు, పేమెంట్ లింకులు లేదా పేమెంట్ అభ్యర్థనలు పంపదు. యాప్‌లో పేమెంట్ అంటే మరెక్కడో జరిగిన పేమెంట్ రికార్డ్ మాత్రమే."
    - "సూచించిన పేమెంట్లు ఒక సాధారణ సరిపోల్చే పద్ధతి నుండి వస్తాయి, ప్రతి కరెన్సీకి విడిగా వర్తిస్తుంది. అది ఆ కరెన్సీలో బ్యాలెన్స్ ఉన్న వ్యక్తుల సంఖ్య కంటే ఎప్పుడూ తక్కువ పేమెంట్లను సూచిస్తుంది (నలుగురికి గరిష్ఠంగా మూడు), కానీ ప్రతిసారీ సాధ్యమైనంత తక్కువ సంఖ్యను కనుగొనదు."
    - "మీరు సూచనలను ఆపలేరు. **అన్నీ చూపించు** మీవి మాత్రమే కాకుండా గ్రూప్‌లో సూచించిన ప్రతి పేమెంట్‌ను చూపుతుంది."
    - "ఖర్చులు నమోదు చేసినప్పుడు మార్చకపోతే కరెన్సీలు ఒకదానితో ఒకటి ఎప్పుడూ సరిచేయబడవు."
    - "రిమైండర్‌లు లేవు, కాబట్టి పేమెంట్ కోసం వెంటపడడం ఇంకా మీ పనే."
useCasesHeading: "లెక్క తేల్చడం ఎక్కడ ముఖ్యం"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "Side Badger డబ్బు పంపుతుందా?"
      a: "లేదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత బ్యాలెన్స్ అప్‌డేట్ అయ్యేలా Side Badgerలో పేమెంట్‌ను రికార్డ్ చేయండి."
    - q: "సూచించిన పేమెంట్లను ఆఫ్ చేయవచ్చా?"
      a: "లేదు. సరళీకరణ ఆన్‌లోనే ఉంటుంది, **అన్నీ చూపించు** మీకు సంబంధించినవే కాకుండా గ్రూప్‌లో సూచించిన ప్రతి పేమెంట్‌ను చూపుతుంది."
    - q: "యూరోలు, పౌండ్లు ఎందుకు విడిగా ఉంచుతారు?"
      a: "మీరు ఖర్చు లేదా పేమెంట్ నమోదు చేసేటప్పుడు మార్చకపోతే, బ్యాలెన్స్‌లు మీరు చెల్లించిన కరెన్సీలోనే ఉంటాయి. వేర్వేరు కరెన్సీలలోని అప్పులు ఒకదానితో ఒకటి ఎప్పుడూ సరిచేయబడవు."
    - q: "ఎవరైనా ఇవ్వాల్సిన దానిలో కొంత భాగమే చెల్లిస్తే?"
      a: "వాళ్లు చెల్లించిన భాగాన్ని రికార్డ్ చేయండి. మిగిలింది చెల్లించే వరకు బ్యాలెన్స్‌లోనే ఉంటుంది."
    - q: "ఇది ఎప్పుడూ సాధ్యమైనంత తక్కువ సంఖ్యలో పేమెంట్లేనా?"
      a: "హామీ లేదు. అది ఆ కరెన్సీలో బ్యాలెన్స్ ఉన్న వ్యక్తుల సంఖ్య కంటే ఎప్పుడూ తక్కువ పేమెంట్లను సూచిస్తుంది, కాబట్టి నలుగురికి అది మూడు కంటే ఎక్కువ సూచించదు. రూమ్‌మేట్ల ఉదాహరణలో అది రెండు పేమెంట్లు, ప్రతి ఒక్కరికీ నేరుగా తిరిగి ఇవ్వడానికి ఆరు పట్టింది."
