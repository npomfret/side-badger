meta:
  title: "Dividere un weekend di addio al celibato o nubilato | Side Badger"
  description: "L'ospite d'onore non paga niente e lunedì ci si parla ancora. Come dividere un weekend di addio al celibato o al nubilato, calcoli inclusi."
h1: "Come dividere le spese di un weekend di addio al celibato o al nubilato"
navLabel: "Addio al celibato o nubilato"
lead: "L'ospite d'onore non paga nulla, quindi il resto del gruppo divide ogni costo [in parti uguali](page:feature/split-expenses) tra di loro. Escludi le persone dai costi che saltano e tieni l'ospite d'onore fuori dal gruppo, così la sorpresa regge."
cta:
  heading: "Conti in ordine, sorpresa intatta"
  body: "Crea un gruppo, manda il link a tutti tranne l'ospite d'onore e aggiungi ogni costo man mano che capita. Side Badger è gratuito, senza pubblicità e senza limiti giornalieri."
sections:
  - heading: "Quattro amici e una sorpresa"
    body: "Hannah, Isla, Jess e Kat portano via Grace per il suo weekend di addio al nubilato. Grace è l'ospite d'onore, quindi non paga niente. Non è nemmeno nel gruppo, così non può vedere quanto stanno spendendo per lei. Hannah prenota il cottage, Isla paga la giornata alla spa, Jess copre la cena e Kat prende il taxi. Entro domenica ognuno ha pagato qualcosa e nessuno sa dire chi è in vantaggio. I conti sono gli stessi per un weekend di addio al celibato o al nubilato, chiunque sia l'ospite d'onore."
  - heading: "Dividi tra chi paga, non tra chi c'è"
    body: "La quota dell'ospite d'onore non sparisce. Viene ripartita. Il cottage costa 720 £ e lo pagano in quattro, quindi sono 180 £ a testa, e il posto di Grace è già compreso in quella cifra. La cena costa 260 £, quindi 65 £ a testa. Il taxi costa 44 £, quindi 11 £ a testa. Quello che qualcuno salta si toglie solo da quella spesa. Kat salta la spa, quindi i 360 £ della spa, che coprono anche il posto di Grace, sono divisi tra Hannah, Isla e Jess a 120 £ a testa. Somma tutto e Hannah, Isla e Jess devono 376 £ a testa per il weekend, mentre Kat deve 256 £."
  - heading: "Impostalo in Side Badger"
    items:
      - "Crea un gruppo per il weekend e dagli un nome noioso, come Weekend al cottage. Grace non è un membro, e solo i membri di un gruppo possono vederlo."
      - "Scegli **Invita altri** e manda il link, o mostra il codice QR, solo dove Grace non lo vedrà. Il link mostra un'anteprima del gruppo prima che qualcuno si unisca. Scegli quanto deve durare, da 15 minuti a 5 giorni. Un vecchio link continua a funzionare finché non scade, quindi non lasciarlo valido più del necessario."
      - "Per ogni costo, scegli **Aggiungi spesa**, inserisci l'importo e scegli chi ha pagato sotto **Chi ha pagato?** Sotto **Dividi tra**, spunta le persone che pagano, lasciando fuori chi l'ha saltato, come Kat per la spa. Scegli **Uguale** sotto **Come dividere**."
      - "Quando siete a casa, apri i **Saldi** del gruppo. Side Badger mostra chi deve cosa a chi e suggerisce una breve lista di pagamenti. Qui sono tre: Kat paga 212 £ a Hannah, Jess paga 116 £ a Hannah e Isla paga 16 £ a Hannah. Pagatevi come vi fa più comodo, poi usate **Salda** per registrare ogni pagamento."
  - heading: "Prima di prenotare, un budget e una caparra"
    body: "Concordate il budget prima che qualcuno prenoti. Scegli **Aggiungi sondaggio**, chiedi quanto spenderà il gruppo per il cottage e proponi qualche cifra come opzione. Attiva **Voto anonimo** quando lo crei, per nascondere chi ha votato cosa, così nessuno deve difendere a voce alta un budget più basso. Chiudi il sondaggio quando tutti hanno votato e compare l'opzione vincente. Poi arriva la caparra. Chi prenota la paga e la aggiunge come spesa, divisa in parti uguali, e il resto del prezzo va inserito come seconda spesa quando è dovuto. Gli altri possono mandare subito la loro parte e registrare il pagamento, oppure aspettare il conto finale. I saldi tornano uguali in entrambi i casi."
  - heading: "Quando qualcuno si unisce per una notte sola"
    body: "Chi si presenta solo per il sabato non dovrebbe pagare il venerdì. Escludi quella persona dai costi di cui non faceva parte. Dove il costo dipende da quanto resta ciascuno, come una camera, scegli **Importi esatti** sotto **Come dividere** e digita la quota di ciascuno, che deve sommare al totale. Calcola prima un prezzo per persona e per notte, poi moltiplicalo per le notti di ciascuno. La pagina sui [viaggi di gruppo](page:use-case/group-trips) spiega meglio i costi che non sono uguali per tutti."
  - heading: "Cosa Side Badger non fa qui"
    items:
      - "Non sposta mai denaro. Vi pagate con bonifico, contanti o come preferite, poi registrate il pagamento così i saldi si aggiornano per tutti."
      - "Non invia promemoria di pagamento. Un sollecito gentile nella chat del gruppo resta compito di un essere umano."
      - "Ogni spesa ha una sola persona che ha pagato, e Side Badger non sa dividere uno scontrino riga per riga. Se due carte hanno pagato il cottage, inseriscilo come due spese. Se qualcuno ha ordinato degli extra a cena, inserisci gli extra come spesa a parte."
      - "Tiene traccia dei soldi, non dell'itinerario. Sondaggi e commenti restano sui costi, quindi i programmi del weekend restano nella chat del gruppo."
