featuresHeading: "Funcțiile pe care le folosește o casă"
faq:
  heading: "Întrebări"
  items:
    - q: "Se poate repeta chiria automat?"
      a: "Nu, nu există facturi recurente. Copiază chiria lunii trecute în câteva atingeri, schimbă data și gata."
    - q: "Putem împărți după mărimea camerei?"
      a: "Da, procentual. Dă fiecărui coleg o parte care reflectă camera lui, atâta timp cât părțile dau împreună 100. [Împărțirea cheltuielilor](page:feature/split-expenses) explică celelalte moduri de a împărți."
    - q: "Ce se întâmplă dacă un coleg se mută datorând bani?"
      a: "Nu poate părăsi grupul până nu s-a achitat, pentru că nimeni nu poate pleca cât timp datorează sau i se datorează bani. Cifrele rămân corecte până când toți sunt chit."
    - q: "Plătește Side Badger facturile?"
      a: "Nu. Ține evidența și sugerează o listă scurtă de plăți. Vă plătiți unii altora cum preferați, apoi înregistrați, așa cum explică [decontarea](page:feature/settle-up)."
    - q: "Poate un coleg să țină contabilitatea?"
      a: "Da. Fă-l administrator și folosește un grup administrat, în care membrii noi au nevoie de aprobare și doar creatorii și administratorii pot schimba cheltuielile."
