meta:
  title: "Socraigh suas le níos lú íocaíochtaí | Side Badger"
  description: "Féach cé atá i bhfiacha le cé i do ghrúpa, faigh liosta gearr íocaíochtaí a shocraíonn gach duine, agus taifead gach íocaíocht de réir mar a tharlaíonn sí. Saor in aisce le húsáid."
h1: "Socraigh suas le níos lú íocaíochtaí"
navLabel: "Socraigh suas"
lead: "Coinníonn Side Badger iarmhéid reatha do gach duine sa ghrúpa agus molann sé liosta gearr íocaíochtaí a shocraíonn é. Íocann sibh a chéile ar an gcaoi is fearr libh, ansin taifeadann tú é. Más mian leat a fheiceáil conas a roinntear na huimhreacha ar dtús, tosaigh le [roinn costais](page:feature/split-expenses)."
cta:
  heading: "Réidh le scaoileadh cé atá i bhfiacha le cé?"
  body: "Cruthaigh cuntas, tosaigh grúpa agus cuir an chéad chostas leis. Tabharfaidh na hiarmhéideanna aire don chuid eile."
problem:
  heading: "Iarmhéideanna a nuashonraítear de réir a chéile"
  body: "Athraíonn gach costas cé atá i bhfiacha le cé, mar sin coinníonn Side Badger na hiarmhéideanna reatha de réir mar a chuirtear costais agus íocaíochtaí leis. Feiceann gach duine sa ghrúpa athrú gan mhoill, agus feiceann siad cad a athraigh agus cé a rinne an t-athrú. Coinnítear iarmhéideanna in aghaidh an airgeadra, mar sin fanann euro agus punt ina gcolúin féin mura ndearnadh costas a thiontú nuair a cuireadh isteach é. De réir réamhshocraithe feiceann tú na fiacha a bhaineann leatsa; taispeánann **Taispeáin iad go léir** an grúpa ar fad."
workflow:
  heading: "Trí chéim go cothrom"
  steps:
    - title: "Féach cé atá i bhfiacha le cé"
      body: "Oscail iarmhéideanna an ghrúpa chun a fheiceáil cad atá dlite agat, cad atá dlite duit, agus liosta gearr íocaíochtaí a shocraíonn gach duine, oibrithe amach in aghaidh an airgeadra. Fanann costais cheistithe as na suimeanna go dtí go socraítear iad. Sa sampla comhchónaitheoirí thíos, ní fhágtar ach dhá íocaíocht as sé cinn."
      shot: S10
      shotAlt: "An scáileán iarmhéideanna ag taispeáint fiacha simplithe i dhá airgeadra, agus “Taispeáin iad go léir” casta ar siúl"
    - title: "Íoc mar is mian leat, ansin taifead é"
      body: "Aistriú bainc, airgead tirim, fabhar atá dlite ón saoire dheireanach. Ní bhogann Side Badger an t-airgead. Nuair a athraíonn sé lámha, taifead an íocaíocht agus nuashonraítear an t-iarmhéid do gach duine."
      shot: S11
      shotAlt: "An fhoirm íocaíochta le cnaipí Socrú gasta agus an fógra a thaispeántar d'íocaíocht pháirteach"
    - title: "Seiceáil gur taifeadadh í"
      body: "Téann an íocaíocht isteach i stair an ghrúpa, áit a bhfeiceann gach duine sa ghrúpa í agus is féidir leo imoibriú le emoji. Ceiliúir íocaíocht nuair a thagann sí."
      shot: S12
      shotAlt: "Stair na n-íocaíochtaí le himoibrithe emoji ar íocaíocht"
