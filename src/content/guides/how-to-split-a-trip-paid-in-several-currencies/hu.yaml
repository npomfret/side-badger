faq:
  heading: "Kérdések"
  items:
    - q: "Melyik árfolyamot használja a Side Badger?"
      a: "Egy aktuális árfolyamot, amelyet a költség megadásakor kér le, ahol van ilyen. Átírhatod arra, amelyet ténylegesen kaptál."
    - q: "Maradhat a csoport a fontnál és a jennél?"
      a: "Igen. A csoport **Beállítások** részében a **Pénznem beállítások** alatt kapcsold be a **Pénznemek korlátozása a csoportban** lehetőséget, válaszd ki az **Engedélyezett pénznemeket**, és állítsd be az **Alapértelmezett pénznem új kiadásokhoz** értéket. Rövidebb a lista, kevesebb a tévedés a pénztárnál."
    - q: "Muszáj egyáltalán átváltani?"
      a: "Nem. A pénznemek külön maradnak, hacsak te vagy a csoportod nem dönt az átváltás mellett, és minden pénznem a saját rövid kifizetéslistáját kapja."
