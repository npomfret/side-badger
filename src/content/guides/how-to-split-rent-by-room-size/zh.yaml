faq:
  heading: 常见问题
  items:
    - q: 如果有人房间更大，但采光更差呢？
      a: 面积只是个起点，所以群组可以商量着调整。从采光差的房间扣掉一两个百分点，分给其他人，再核对百分比总数仍是 100。Side Badger 只会存下你们谈好的数字，不做评判。
    - q: 账单也要按房间大小分吗？
      a: 通常不用。能源费和网费人人都在用，所以平均分更省事，就像上面的例子。如果有位室友整天待在家里，群组可以另行商定，比如用确切金额。各种选项见[分摊支出](page:feature/split-expenses)。
    - q: 之后还能改分摊方式吗？
      a: 可以，对新的支出生效。复制房租时改一下百分比，之前的月份保持原样。要更正已录入的某笔支出，在群组权限允许的情况下可以编辑，并先告诉全家，因为余额会随之变化。之前的版本会保留。
