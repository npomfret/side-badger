faq:
  heading: Domande
  items:
    - q: Side Badger è un'alternativa gratuita a Splitwise?
      a: "Per dividere le spese in un gruppo, sì. Scansione degli scontrini, conversione delle valute e assenza di pubblicità sono gratuite, senza limiti giornalieri. Se ti servono un'app nativa, l'uso offline, le spese ricorrenti o i pagamenti dentro l'app, Splitwise li ha e Side Badger no."
    - q: Da dove vengono i dettagli su Splitwise?
      a: "Dalle pagine di Splitwise: la sua pagina iniziale, la pagina Pro e il centro assistenza. Ogni riga della tabella rimanda alla pagina da cui viene, e la data sopra la tabella dice quando le abbiamo lette. Le ricontrolliamo ogni trimestre."
    - q: Side Badger resterà gratuito?
      a: "Tutto in Side Badger è gratuito oggi e non esiste un piano a pagamento. Se la cosa dovesse cambiare, ti avviseremo prima. La [pagina dei prezzi](page:pricing) ha i dettagli."
    - q: Tutti nel mio gruppo devono passare a Side Badger?
      a: "Sì. Ognuno in un gruppo ha bisogno di un account Side Badger gratuito, e può unirsi con un link o un codice QR."
    - q: Side Badger ha un'app per il telefono?
      a: "Non in uno store. Funziona nel browser: accedi dal telefono, poi aggiungilo alla schermata Home così si apre come un'app. [Come funziona](page:how-it-works) mostra come."
