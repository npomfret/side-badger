  heading: "প্রশ্ন"
  items:
    - q: "আমরা কি কর কাটার আগের আয় ধরব, নাকি হাতে পাওয়া আয়?"
      a: "সেটা গ্রুপ ঠিক করবে। হাতে পাওয়া আয়ই বেশি চলে, কারণ ওই টাকাটাই আপনাদের আসলে খরচ করার থাকে। কর কাটার আগের আয় এই ব্যাপারটা ধরে না যে কর, পেনশনে জমা আর ঋণের কিস্তি আলাদা আলাদা বেতন থেকে আলাদা আলাদা পরিমাণ টাকা কেটে নেয়। যেটাই বেছে নিন, দুজনের জন্য একই মাপকাঠি ব্যবহার করুন।"
    - q: "Side Badger কি আমাদের আয় দেখতে পায়?"
      a: "না। আপনি শুধু শতাংশ লেখেন, বেতনের অঙ্ক কখনও নয়। শতাংশগুলো গ্রুপের সদস্যরা দেখতে পায়, আর দম্পতির ক্ষেত্রে সেটা আপনারা দুজন।"
    - q: "আমরা কি 62/38 একবার ঠিক করে সবকিছুর জন্য রাখতে পারি?"
      a: "ভাগ ঠিক হয় প্রতিটি খরচে, পুরো গ্রুপে নয়। যে খরচে আগে থেকেই 62 আর 38 আছে সেটা কপি করুন, তারপর যা আলাদা তা বদলান। অন্য বিকল্পগুলোর জন্য দেখুন [খরচ ভাগ করা](page:feature/split-expenses)।"
