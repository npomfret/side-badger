faq:
  heading: よくある質問
  items:
    - q: 自分の負担分だけに質問できますか？
      a: いいえ。質問は、その支出に含まれる全員について、支出を丸ごと保留にします。分け方だけが間違っているなら、分け方を編集して直します。
    - q: 質問を閉じられるのは誰ですか？
      a: 質問した本人か、グループの管理者です。支出を追加した人が管理者でなければ、質問者に代わって閉じることはできません。
    - q: 支出を編集すると、元のものは消えますか？
      a: いいえ。以前のバージョンは残ります。誰が編集できるかはグループの権限で決まります。残高が変わるので、先に家のみんなに伝えておくとよいでしょう。
