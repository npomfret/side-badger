faq:
  heading: "Întrebări"
  items:
    - q: "Pot pune în discuție doar partea mea?"
      a: "Nu. O întrebare scoate din solduri întreaga cheltuială, pentru toți cei din ea. Dacă doar împărțirea e greșită, remedierea este editarea împărțirii."
    - q: "Cine poate închide o întrebare?"
      a: "Cel care a întrebat sau un administrator al grupului. Dacă persoana care a adăugat cheltuiala nu e administrator, nu o poate închide în numele celui care a întrebat."
    - q: "Editarea unei cheltuieli șterge originalul?"
      a: "Nu. Versiunea anterioară se păstrează. Cine poate edita se decide prin permisiunile grupului, așa că merită să le spui mai întâi celor din casă, pentru că se schimbă soldurile."
