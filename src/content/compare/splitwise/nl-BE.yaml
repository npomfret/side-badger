sections:
  - heading: "Geldpraat, naast het geld"
    body: "Gedeeld geld brengt gebabbel, twijfels en plannen mee. Side Badger houdt alle drie naast de cijfers, zodat niemand door de groepschat moet scrollen."
    items:
      - "**Opmerkingen waar ze thuishoren.** Plaats een opmerking bij de groep zelf, of bij elke uitgave, lijst of peiling, en houd het gesprek bij datgene waarover het gaat."
      - "**Bonnetjes en foto’s.** Bewaar tot drie bonnetjes bij elke uitgave en voeg foto’s of pdf’s toe aan opmerkingen bij de groep, een lijst of een peiling."
      - "**Vragen, geen ruzies.** Een beheerder kan vragen inschakelen, en dan kan iedereen in een uitgave er een vraag over stellen. De uitgave blijft buiten de saldo’s tot het is uitgeklaard."
      - "**Lijsten en peilingen.** Houd de gedeelde boodschappenlijst naast de boodschappenrekeningen, en leg de shortlist voor de villa voor aan een stemming, anoniem als je wilt."
      - "**Een beetje applaus.** Reageer op uitgaven, betalingen en opmerkingen, en vier een betaling als ze binnenkomt."
  - heading: "Jouw groep, jouw regels"
    body: "Volgens het helpcentrum van Splitwise ondersteunt het geen groepsbeheerders of speciale rechten. Side Badger heeft rollen en rechten, voor groepen die iemand nodig hebben die de cijfers netjes houdt."
    items:
      - "**Beheerders, leden en kijkers.** Maak iemand kijker: die ziet alles en verandert niets."
      - "**Twee voorinstellingen, of je eigen.** Begin met Open samenwerking of Beheerde groep, of stel elk recht zelf in: wie uitgaven bewerkt en verwijdert, lijsten bewerkt, uitnodigt en nieuwe mensen binnenlaat."
      - "**Goedkeuring om lid te worden.** Schakel goedkeuring in en een beheerder laat elke persoon toe."
      - "**De eigen instellingen van de groep.** Beperk ze tot de valuta’s die je echt gebruikt, kies de standaardvaluta en geef de groep een headerafbeelding."
      - "**Vergrendel ze als het voorbij is.** De cijfers blijven staan tot een beheerder ze weer ontgrendelt."
  - heading: "Hier gratis, daar tegen betaling"
    body: "Splitwise Pro is het betaalde abonnement van Splitwise, en de eigen Pro-pagina biedt drie dingen aan die in Side Badger niets kosten."
    items:
      - "**Bonnetjes scannen.** Splitwise Pro scant een foto van je bonnetje. Side Badger doet het gratis, zonder scancredits: het vult het totaal, de datum en de plaats in zodat jij ze kunt nakijken."
      - "**Valuta’s omrekenen.** Splitwise Pro rekent de uitgaven van een groep om naar je standaardvaluta wanneer je op “Converteren” tikt. Side Badger rekent elke uitgave om terwijl je ze invoert, tegen een actuele wisselkoers of de koers die je echt kreeg, en het oorspronkelijke bedrag blijft bij de uitgave staan."
      - "**Geen dagelijkse limiet.** Splitwise Pro biedt onbeperkte uitgaven aan, en volgens het helpcentrum kunnen gratis gebruikers tot 4 uitgaven per dag toevoegen. Side Badger heeft geen dagelijkse limiet."
  - heading: "Je bank blijft erbuiten"
    body: "Side Badger koppelt niet aan je bank en vraagt niet naar je bankgegevens. Het houdt bij wie wie iets schuldig is; jullie betalen elkaar zoals je wilt en registreren daarna de betaling. Geen bankgegevens om af te geven, dus één zorg minder."
  - heading: "Eén app, in je browser en op je telefoon"
    body: "Side Badger draait in je browser. Log in, voeg het toe aan je startscherm en het opent als een app. Het is hoe dan ook dezelfde app, dus een nieuwe functie staat op je telefoon de volgende keer dat je de app opent, zonder dat je op een update uit een appstore moet wachten."
  - heading: "En nog wat trucjes voor het feestje"
    items:
      - "**Vraag het je assistent.** Side Badger werkt met ChatGPT en Claude: vraag de jouwe om een uitgave toe te voegen, een bonnetje te scannen of een betaling te registreren."
      - "**Iedereen in de eigen taal.** Side Badger spreekt 39 talen en iedereen kiest zelf. Op de startpagina van Splitwise staan er 7+. Het kent ook 133 valuta’s, voor de reis die overal naartoe gaat."
      - "**Hulp zonder de app te verlaten.** Vastgelopen of een bug gevonden? Zeg het ons vanuit de app en lees ons antwoord meteen daar."
  - heading: "Waar Splitwise nog wint"
    body: "We zien liever dat je de juiste app kiest dan dat je het later ontdekt. Heeft je groep een van deze dingen nodig, dan heeft Splitwise ze en Side Badger niet."
    items:
      - "**Apps uit de appstore.** Side Badger leeft in je browser en op je startscherm, niet in de appstores."
      - "**Offlinemodus.** Side Badger heeft een verbinding nodig."
      - "**Betalingen in de app.** In sommige landen kan Splitwise het geld ook verplaatsen. Side Badger houdt alleen de boekhouding bij."
      - "**Verdelen op aandelen of per item.** Side Badger heeft één betaler per uitgave, gelijk verdeeld, op exacte bedragen of op percentage. Het scannen van bonnetjes wijst geen items aan mensen toe."
      - "**Grafieken en standaardverdelingen.** Splitwise Pro heeft beide. Side Badger houdt bij wie wie iets schuldig is, en dat is de hele truc."
  - heading: "Je groep overbrengen"
    body: "Er is geen importfunctie, dus verhuizen betekent opnieuw beginnen. Reken eerst af in Splitwise, maak dan een groep aan in Side Badger en nodig iedereen uit met een link of een QR-code. Iedereen in de groep heeft een gratis account nodig, en een e-mailadres is alles wat je nodig hebt om je te registreren."
