faq:
  heading: Spørgsmål
  items:
    - q: Hvad hvis nogen har et større værelse, men mindre lys?
      a: Gulvareal er kun udgangspunktet, så gruppen kan aftale at justere. Træk et point eller to fra det mørke værelse, giv dem til de andre, og tjek, at procenterne stadig giver 100 i alt. Side Badger gemmer, hvad I aftaler, og dømmer ikke.
    - q: Skal regningerne også deles efter værelsesstørrelse?
      a: Som regel ikke. Energi og bredbånd bruges af alle, så en ligelig deling er enklere, som i eksemplet ovenfor. Er en bofælle hjemme hele dagen, kan gruppen aftale noget andet, for eksempel præcise beløb. [Del udgifter](page:feature/split-expenses) gennemgår mulighederne.
    - q: Kan vi ændre delingen senere?
      a: Ja, for nye udgifter. Ændr procenterne, når du kopierer huslejen, så forbliver tidligere måneder, som de var. For at rette en tidligere udgift skal du redigere den, hvis gruppens rettigheder tillader det, og give huset besked først, fordi saldiene ændres. Den tidligere version bliver gemt.
