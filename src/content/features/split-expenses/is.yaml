sections:
  - heading: "Aðeins þeir sem voru á staðnum"
    body: "Skiptu kostnaði milli allra, eða aðeins þeirra sem deildu honum. Slepptu fólki úr kostnaði sem það tók ekki þátt í og staðan endurspeglar það. Meðleigjandinn sem var í burtu alla vikuna skuldar ekki fyrir take-away-ið, sem [meðleigjendur](page:use-case/housemates) munu kannast við sem grundvallarréttlæti."
  - heading: "Smáatriðin sem spara deilur síðar"
    items:
      - "Settu **dagsetningu** og valfrjálsan tíma. Flýtileiðir eins og í dag, í gær, í morgun og í gærkvöldi spara slátt."
      - "Bættu við allt að þremur **merkjum** til að flokka útgjöld, eins og matvörur eða ferðalög."
      - "Bættu við **stað**. Límdu inn kortatengil og nafn staðarins fyllist sjálfkrafa út."
      - "Bættu við **athugasemd** um söguna á bak við töluna, með smá sniði ef sagan þarf á því að halda."
      - "Notaðu **athugasemdir** til að hafa samtalið við hlið útgjaldsins sem það snýst um, frekar en í spjallþræði sem enginn flettir aftur í."
  - heading: "Afrita, breyta og sjá hvað breyttist"
    body: "Afritaðu leigu síðasta mánaðar í stað þess að slá hana aftur inn og breyttu því sem er öðruvísi. Ef tala var röng skaltu breyta útgjaldinu. Fyrri útgáfan er geymd og breytingin birtist í virkni hópsins, svo enginn breytir tölu í kyrrþey. Hvað hver má breyta fer eftir heimildum hópsins."
  - heading: "Þegar eitthvað lítur skakkt út"
    body: "Hópur getur kveikt á spurningum um útgjöld. Hver sem tekur þátt í útgjaldi getur sett fram spurningu og sagt hvers vegna, og útgjaldið helst fyrir utan stöðuna þar til sá sem spurði, eða stjórnandi, lokar málinu. Þetta er slökkt sjálfgefið og stjórnandi kveikir á því fyrir hópinn. Það hentar vel fyrir [viðburði og veislur](page:use-case/events-and-celebrations), þar sem tryggingin sem enginn man eftir verður skyndilega allra mál."
limits:
  heading: "Takmörk"
  items:
    - "Einn greiðir fyrir hvert útgjald. Ef tveir greiddu skaltu skrá tvö útgjöld."
    - "Það er engin skipting eftir liðum og engin skipting eftir hlutum. Jafnt, nákvæmar upphæðir og prósentur er það sem í boði er."
    - "Prósentur verða að ná samtals 100."
    - "Útgjald getur verið allt að 999.999,99 í eigin gjaldmiðli, með venjulegum aukastöfum þess gjaldmiðils."
    - "Útgjöld geta ekki endurtekið sig sjálfkrafa. Afritaðu frekar útgjald síðasta mánaðar."
    - "Dagsetningar mega ekki vera í framtíðinni eða meira en 10 ár aftur í tímann."
    - "Útgjald sem tengist einhverjum sem hefur yfirgefið hópinn verður skrifvarið."
useCasesHeading: "Hvar svona skipting hjálpar"
faq:
  heading: "Spurningar"
  items:
    - q: "Geta tveir greitt fyrir eitt útgjald?"
      a: "Ekki í einu útgjaldi. Skráðu tvö, eitt fyrir hvorn greiðanda, og staðan verður sú sama."
    - q: "Get ég skipt kvittun eftir liðum?"
      a: "Nei. Skipting er jöfn, eftir nákvæmum upphæðum eða í prósentum. Fyrir reikning með mismunandi liðum skaltu slá inn hvað hver og einn skuldar sem nákvæmar upphæðir."
    - q: "Get ég stillt sjálfgefna skiptingu?"
      a: "Nei. Afritaðu fyrra útgjald til að nota skiptingu þess aftur og breyttu því sem er öðruvísi."
    - q: "Geta reikningar endurtekið sig í hverjum mánuði?"
      a: "Nei. Afritaðu frekar útgjald síðasta mánaðar, sem tekur nokkrar sekúndur."
    - q: "Hver getur breytt útgjaldi?"
      a: "Sá sem heimildir hópsins leyfa. Hver breyting birtist í virkni hópsins, svo breytingar eru aldrei gerðar í kyrrþey."
    - q: "Hvað gerist með stöðuna eftir á?"
      a: "Hún uppfærist eftir því sem útgjöld berast, og [uppgjör](page:feature/settle-up) breytir henni í stuttan lista yfir greiðslur. Ef útgjald er í öðrum gjaldmiðli, sjá [marga gjaldmiðla](page:feature/multiple-currencies)."
