meta:
  title: Så fungerar Side Badger | Dela gruppens utgifter i fem steg
  description: Skapa en grupp, bjud in folk, lägg till utgifter och gör upp. Se vad som händer mellan "någon betalade" och "vi är kvitt", med ett räkneexempel.
h1: Så fungerar Side Badger
navLabel: Så fungerar det
lead: Vad händer mellan "någon betalade" och "vi är kvitt"? Fem steg, inget kalkylblad och en grävling som mest är dekoration. Här är hela resan, från den första gruppen till den sista registrerade betalningen. För mer om varje steg, se [dela utgifter](page:feature/split-expenses) och [göra upp](page:feature/settle-up).
cta:
  heading: Från "jag tar den här" till "vi är kvitt"
  body: Skapa ett gratiskonto, starta en grupp och lägg till den första utgiften. Grävlingen dömer inte kvittot.
  button: Skapa ett gratiskonto
steps:
  - title: Skapa en grupp
    body: Gör en grupp för varje hushåll, resa eller event, så att hyran aldrig hamnar i samma lista som bröllopspresenten. Ge gruppen ett namn, välj det namn folk ska se dig under och begränsa, om du vill, vilka valutor den tar emot. Din översikt visar sedan varje grupp, och hur du ligger till i var och en, på en och samma skärm.
    shot: S02
    shotAlt: Dialogen för att skapa en grupp med avsnittet om valutabegränsningar öppet
  - title: Bjud in dina människor
    body: Dela en länk eller visa en QR-kod, och bestäm hur länge den gäller, från 15 minuter upp till 5 dagar. Alla som går med behöver ett gratiskonto och en verifierad e-postadress, och en grupp rymmer upp till 50 personer. Vill du granska vilka som kommer in slår du på godkännande, så släpper en administratör in varje person.
    shot: S03
    shotAlt: Inbjudningsdialogen på länkfliken, med en QR-kod och val för hur länge länken gäller
  - title: Lägg till utgifter när de sker
    body: Ange vem som betalade, hur mycket och vem det gällde. Dela lika, efter exakta belopp eller i procent, och lämna utanför den som inte var med. Lägg till utgiften så ser alla den direkt, tillsammans med vad som ändrats och vem som ändrade.
    shot: S05
    shotAlt: Utgiftsformuläret med en procentuell delning där hyran delas efter rummens storlek
  - title: Håll koll på saldona
    body: Side Badger håller ett löpande saldo för varje valuta, så att du med en blick ser vem som är skyldig vem. I stället för att låta alla reda ut ett nät av små skulder föreslår appen en kort lista med betalningar som gör upp för gruppen.
    shot: S10
    shotAlt: Saldoskärmen med förenklade skulder i två valutor och Visa alla påslaget
  - title: Gör upp utanför appen, registrera i den
    body: Side Badger flyttar aldrig pengar. Betala varandra hur ni vill och registrera sedan betalningen så att saldona hänger med, och allas skärm uppdateras utan att du laddar om. "Uppgjort" betyder helt enkelt att saldona visar noll. Ingen kan lämna en grupp så länge hen är skyldig eller har pengar att få, så den som är på väg ut gör upp först.
    shot: S11
    shotAlt: Betalningsformuläret med snabbavräkningsknappar och meddelandet om delbetalning
requirements:
  heading: Det här behöver du
  items:
    - Ett gratiskonto. Allt som behövs är en e-postadress och ett lösenord, och du verifierar e-postadressen innan du kan lägga till något.
    - Att vara 18 år eller äldre.
    - En modern webbläsare på en mobil eller en dator, och en uppkoppling. Side Badger är ingen app från en appbutik och fungerar inte offline.
    - Om du vill, en plats på hemskärmen. Ingen appbutik behövs. Logga in och lägg sedan till Side Badger på hemskärmen eller i dockan så öppnas det som en app. Inställningar i appen visar hur.
