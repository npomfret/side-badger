meta:
  title: "Közös listák, szavazások és kommentek | Side Badger"
  description: "Kommentelj a költségekhez, vonj kérdőre egy furcsát, vezess közös listát, szavazzatok a villáról. Tervezzétek meg, aztán osszátok fel. Ingyenes, hirdetés nélkül."
h1: "Tervezzétek meg együtt, osszátok fel utána"
navLabel: "Közös tervezés"
lead: "A bevásárlólista és a bevásárlási számla végre szóba áll egymással. A Side Badger helyet ad a csoportodnak, ahol beszélhettek a pénzről azelőtt és azután, hogy elköltöttétek: kommentekkel minden költségnél, egy móddal a gyanúsnak tűnők kérdőre vonására, közös listákkal és szavazásokkal a nagy döntésekhez. Aztán a szokásos módon [felosztjátok a költségeket](page:feature/split-expenses)."
cta:
  heading: "Tervezd meg, aztán oszd fel"
  body: "Hozz létre ingyenes fiókot, indíts csoportot, és tedd az első listát, szavazást vagy kérdést közvetlenül a pénz mellé. Nem tudod, mi jön ezután? Nézd meg, [hogyan működik](page:how-it-works)."
problem:
  heading: "A csevegés itt van, a számla ott"
  body: "A csoportos költekezés általában két helyen él. A számok az egyikben vannak, a számokról szóló vita pedig egy csevegésben, amely kedden már elgörgetett. A bevásárlólista egy fotó a hűtőről. A villáról a legtöbb ember felfelé mutató hüvelykujja döntött, valószínűleg. A Side Badger a tervezést a csoportban tartja, azoknak a költségeknek a mellett, amelyekről szól: ott van a komment, ahol a költség, a lista, ahol a bevásárlás, a szavazás a nagy döntéshez, és egy mód arra, hogy azt mondd: „állj, ez így jó?”, bekezdés írása nélkül. Mindez a csoport pénzéről szól, hiszen a csoport erre való."
workflow:
  heading: "A villaszavazástól a bevásárlási számláig"
  steps:
    - title: "Tedd szavazásra a nagy döntést"
      body: "Adj hozzá egy szavazást a számlát meghatározó döntéshez, például hogy melyik villa legyen. Válassz két–tíz lehetőséget, add meg, hány szavazata van mindenkinek, majd zárd le, ha mindenki szavazott, és a nyertes megjelölésre kerül."
      shot: S17
      shotAlt: "Egy lezárt szavazás a megjelölt nyertes lehetőséggel és a lehetőségek mellett a szavazatok számával"
    - title: "Írjátok együtt a bevásárlólistát"
      body: "Indíts közös listát, add hozzá a tételeket, és pipáld ki őket, ahogy a kosárba kerülnek. A bevásárlás utána költségként kerül be."
      shot: S16
      shotAlt: "Egy közös bevásárlólista néhány kipipált tétellel és haladásszámlálóval"
    - title: "Beszéljetek a költségről ott, ahol él"
      body: "Kommentelj magán a költségen, csatold a nyugtát, és reagálj egy emojival. A beszélgetés annak a számnak a mellett marad, amelyről szól."
      shot: S08
      shotAlt: "Egy költség a részleteivel, egy nyugta bélyegképével, egy kommentszállal és emoji reakciókkal"
    - title: "Vonj kérdőre, ami nem stimmel"
      body: "Ha a csoport bekapcsolta a költségkérdéseket, bárki, aki szerepel egy költségben, a **Van egy kérdésem** lehetőséget választhatja. A költség addig kimarad az egyenlegekből, amíg el nem intézik a kérdést."
      shot: S18
      shotAlt: "A költséglista egy Kérdőre vont jelvénnyel és a Csak kérdőre vont szűrővel"
    - title: "Nézd meg, mi változott, és ki változtatta"
      body: "A tevékenységi hírfolyam és az értesítések csengője megmutatja, mi új a csoportjaidban. A push-értesítések ott vannak, ha kéred őket."
      shot: S19
      shotAlt: "Az értesítések legördülő listája a legutóbbi tevékenységek felsorolásával"
