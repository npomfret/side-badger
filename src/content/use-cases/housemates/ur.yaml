featuresHeading: "وہ خصوصیات جو گھر استعمال کرتا ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا کرایہ خود بخود دہرایا جا سکتا ہے؟"
      a: "نہیں، بار بار آنے والے بل نہیں ہیں۔ پچھلے مہینے کا کرایہ چند ٹیپس میں کاپی کریں، تاریخ بدلیں اور بس۔"
    - q: "کیا ہم کمرے کے سائز کے مطابق تقسیم کر سکتے ہیں؟"
      a: "جی ہاں، فیصد کے ذریعے۔ ہر ساتھی کو ایسا حصہ دیں جو اس کے کمرے کو ظاہر کرے، بشرطیکہ حصوں کا مجموعہ 100 ہو۔ [اخراجات کی تقسیم](page:feature/split-expenses) تقسیم کے دوسرے طریقے بتاتا ہے۔"
    - q: "اگر کوئی ساتھی قرض کے ساتھ منتقل ہو جائے تو؟"
      a: "وہ حساب برابر کیے بغیر گروپ نہیں چھوڑ سکتا، کیونکہ جب تک کسی کو دینا یا لینا ہو کوئی نہیں جا سکتا۔ اعداد تب تک ایمان دار رہتے ہیں جب تک سب کا حساب برابر نہ ہو۔"
    - q: "کیا Side Badger بل ادا کرتا ہے؟"
      a: "نہیں۔ یہ حساب رکھتا ہے اور ادائیگیوں کی مختصر فہرست تجویز کرتا ہے۔ آپ جیسے چاہیں ایک دوسرے کو ادا کرتے ہیں، پھر اسے ریکارڈ کرتے ہیں، جیسا کہ [حساب برابر کرنا](page:feature/settle-up) بتاتا ہے۔"
    - q: "کیا ایک ساتھی کھاتے رکھ سکتا ہے؟"
      a: "جی ہاں۔ اسے ایڈمن بنائیں اور منظم گروپ استعمال کریں، جہاں نئے ارکان کو منظوری چاہیے اور صرف تخلیق کار اور ایڈمن اخراجات بدل سکتے ہیں۔"
