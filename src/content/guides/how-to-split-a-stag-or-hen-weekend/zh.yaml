faq:
  heading: 常见问题
  items:
    - q: 伴郎或伴娘要多付一些吗？
      a: 只有群组同意才这样。应用不会在算账时给任何人特殊角色。如果有人多承担了一些，就在**如何拆分**里选择**确切金额**或**百分比**，输入你们谈好的份额。
    - q: 有些人没喝的酒水怎么办？
      a: 把酒水作为单独一笔支出，只勾选喝了的人。如果每个人喝的量不同，就选择**确切金额**，输入每个人的份额。没享用的东西，没人需要为它付钱。
    - q: 主角之后能看到这个群组吗？
      a: 能，等惊喜揭晓之后。邀请对方加入，然后由管理员在群组设置的**安全**里把对方设为**观察者**。观察者能看到一切，但什么也改不了，所以要等到不再有任何秘密再这样做。对方需要一个免费账户才能加入。
