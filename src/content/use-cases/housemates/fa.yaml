meta:
  title: "تقسیم قبض‌های خانه با هم‌خانه‌ها"
  description: "اجاره را بر اساس اندازه اتاق تقسیم کنید، انرژی و خواربار را مساوی سهیم شوید و هر ماه ببینید چه کسی به چه کسی بدهکار است. راهی رایگان برای هم‌خانه‌ها تا حساب نگه دارند."
h1: "تقسیم قبض‌های خانه با هم‌خانه‌ها"
navLabel: "هم‌خانه‌ها"
lead: "برای هم‌خانه‌ای که دستمال‌توالت می‌خرد، و هم‌خانه‌هایی که انگار هیچ‌وقت نمی‌بینند کسی می‌خرد. Side Badger یک حساب جاری برای اجاره، قبض‌ها و خرید **هم‌خانه‌ها و هم‌اتاقی‌ها** نگه می‌دارد، پس کسی لازم نیست دنبال کسی بدود و یخچال می‌تواند دوباره فقط یک یخچال باشد."
cta:
  heading: "از خانه خودتان شروع کنید"
  body: "یک حساب بسازید، برای خانه یک گروه درست کنید و پیوند دعوت را برای همه بفرستید. قبض‌های این ماه می‌توانند امشب وارد شوند."
  button: "ساخت حساب رایگان"
scenario:
  heading: "خانه را راه بیندازید"
  body: "برای خانه یک گروه بسازید، نامی را که می‌خواهید دیگران در آن ببینند انتخاب کنید و همه را با پیوند یا کد QR دعوت کنید. گروه می‌تواند باز باشد، که همه اضافه و ویرایش می‌کنند، یا مدیریت‌شده، که اعضای جدید به تأیید مدیر نیاز دارند و فقط سازنده‌ها و مدیرها می‌توانند هزینه‌ها را تغییر دهند، که برای هم‌خانه‌ای که دفتر را نگه می‌دارد مناسب است. هر کسی که فقط می‌خواهد عددها را تماشا کند می‌تواند بیننده باشد، که همه‌چیز را می‌بیند و چیزی را تغییر نمی‌دهد. همه یک هزینه جدید را بلافاصله می‌بینند، پس «بعداً اضافه‌اش می‌کنم» جاهای کمتری برای پنهان شدن دارد."
sections:
  - heading: "اجاره و قبض‌ها"
    body: "اجاره به‌ندرت بر چهار تقسیم می‌شود، چون اتاق‌ها یکسان نیستند. آن را درصدی تقسیم کنید تا اتاق بزرگ بیشتر بدهد و کمد پنجره‌دار کمتر. درصدها باید جمعشان 100 شود. قبض‌هایی که همه استفاده می‌کنند تقسیم مساوی می‌گیرند و هم‌خانه‌ای که در هزینه‌ای سهمی نداشت می‌تواند کنار گذاشته شود. وقتی تقسیم مساوی پول خرد اضافه می‌آورد، به‌صورت تصادفی به یک نفر می‌رسد. قبض تکراری وجود ندارد، پس هر ماه اجاره ماه قبل را کپی می‌کنید، تاریخ را عوض می‌کنید و ادامه می‌دهید."
  - heading: "خرید مشترک"
    body: "فهرست خرید مشترک را در همان گروه صورت‌حساب‌های خرید نگه دارید و موردها را وقتی به سبد رسیدند تیک بزنید. هر کس خرید را انجام می‌دهد جمع رسید را به‌عنوان هزینه اضافه می‌کند و مساوی تقسیمش می‌کند، یا فقط بین کسانی که آن چیز را می‌خورند. اینکه چه کسی مدام شیر جو می‌خرد که هیچ‌کس دیگر نمی‌نوشد هنوز مسئله خانه است، اما دست‌کم فهرست هزینه‌ها دقیق خواهد بود. مجوزهای گروه تعیین می‌کنند چه کسی می‌تواند فهرست بسازد و ویرایش کند. اجاره، قبض‌ها و خرید را کنار هم بگذارید تا ماهی مثل ماه پایین بگیرید، در خانه‌ای چهارنفره: جو £2,000 اجاره می‌دهد که بر اساس اندازه اتاق 30%، 25%، 25% و 20% تقسیم شده، بعد کوامی £120 برای انرژی می‌دهد، لنا £40 برای اینترنت و مت £80 برای خواربار، هرکدام مساوی تقسیم شده. جو £1,340 طلبکار می‌شود و Side Badger سه پرداخت پیشنهاد می‌دهد، همه به جو."
  - heading: "روش‌های منصفانه برای تقسیم هزینه‌های خانه"
    items:
      - "**مساوی** برای چیزهایی مناسب است که همه تقریباً یکسان استفاده می‌کنند، مثل اینترنت، مواد شوینده و خرید مشترک. سریع است و کسی لازم نیست سر حساب بحث کند."
      - "**بر اساس اندازه اتاق** برای اجاره مناسب است، چون اتاق‌ها فرق دارند و چیزی که افراد حاضرند برایشان بدهند هم فرق دارد. درصدها را یک‌بار، وقتی کسی اسباب‌کشی می‌کند، توافق کنید و هر ماه دوباره استفاده کنید."
      - "**بر اساس استفاده** برای قبض‌هایی مناسب است که یک نفر آشکارا بیشتر استفاده می‌کند، مثل قبض گرمایش دفتر کار خانگی یا اکانت پخشی که فقط دو نفر تماشا می‌کنند. کسانی را که سهمی نداشتند کنار بگذارید یا برای هر نفر مبلغ دقیق وارد کنید."
      - "هر کدام را انتخاب کنید، پیش از اولین قبض توافقش کنید نه بعد از اولین دعوا، و قاعده را جایی بنویسید که کل خانه ببیند."
  - heading: "وقتی کسی اسباب‌کشی می‌کند"
    body: "اول تسویه می‌کند. تا وقتی کسی بدهکار یا طلبکار است نمی‌تواند از گروه خارج شود، پس رفتنی یا می‌پردازد یا دریافت می‌کند، شما ثبتش می‌کنید و بعد او می‌رود. گروه را برای هم‌خانه‌های باقی‌مانده ادامه دهید و فرد جدید را با پیوند دعوت کنید. وقتی کار خود خانه تمام شد، مدیر می‌تواند گروه را قفل کند تا اعداد سر جایشان بمانند، یا برای همیشه ببندد که آن را برای همه غیرقابل دسترس می‌کند، پس فقط وقتی این کار را بکنید که کسی دیگر به تاریخچه نیاز ندارد."
