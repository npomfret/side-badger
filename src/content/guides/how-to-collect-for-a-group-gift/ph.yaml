meta:
  title: Paano mangolekta ng ambag para sa regalo ng grupo | Side Badger
  description: Iba-iba ang ambag ng bawat isa at card ng isang tao ang sumasalo. Magpa-poll ng budget, maglagay ng eksaktong halaga, at hayaang magkuwenta ang Side Badger.
h1: Paano mangolekta ng ambag para sa regalo ng grupo
navLabel: Ambagan sa regalo ng grupo
lead: Ang pangongolekta para sa regalo ng grupo ay nangangahulugang isang tao ang naglalabas muna ng pera at may utang sa kanya ang lahat ng iba ng kani-kanilang ambag. Magkasundo sa budget gamit ang poll, hayaang ilagay ng bibili ang regalo sa card niya, saka ilagay ito bilang isang gastos na may [eksaktong halaga](page:feature/split-expenses), isang numero para sa bawat tao. Ipinapakita ng Side Badger kung magkano ang utang ng bawat isa sa bibili, at ipapadala ng bawat isa ang bahagi niya sa paraang gusto niya.
cta:
  heading: Ambagan nang walang pasa-pasang sumbrero
  body: Gumawa ng grupo, huwag isama ang taong reregaluhan, at ilagay ang regalo na may eksaktong halaga. Libre ang Side Badger, walang ad at walang pang-araw-araw na limitasyon. Gusto munang makita kung paano? Tingnan ang [paano ito gumagana](page:how-it-works) o ang [saklaw ng libre](page:pricing).
sections:
  - heading: Apat na magkakaibigan, isang record player, apat na magkakaibang halaga
    body: Magti-30 na si Bea at gusto niya ng record player. Sina Priya, Omar, Lena, at Sam ang magreregalo nito sa kanya. Nakahanap si Priya ng isa sa halagang £240 at binili niya ito gamit ang sarili niyang card, dahil may kailangang mauna. Hindi pantay ang ambag ng apat. Tig-£60 ang inambag nina Priya at Omar, £80 si Lena, at £40 si Sam. Walang nagpapaliwanag ng numero niya at walang nagtatanong. Bumili rin si Omar ng card at pambalot sa halagang £12. Pirma ng apat ang card, kaya pantay ang hati niyon.
  - heading: Magkasundo sa budget bago pindutin ng sinuman ang Bumili
    body: Iniiwasan ng budget poll ang pagtatalo tungkol sa £400 na turntable. Sa grupo, piliin ang **Magdagdag ng poll** at itanong kung magkano dapat ang regalo. Gawing halaga ang mga opsyon, gaya ng hanggang £150, hanggang £200, at hanggang £250. I-on ang **Anonimong pagboto**, na itinatago kung sino ang bumoto sa ano, para walang kailangang ipagtanggol nang malakas ang mas maliit na numero. Hindi na mababago ang mga setting kapag may unang boto na, kaya suriin muna ang mga ito. Hindi kusang nagsasara ang poll. Kapag nakaboto na ang lahat, piliin ang **Isara ang poll** at lalabas ang **Panalo**. Ang poll ang nagpapasya sa kabuuan. Hindi nito itinatakda ang bahagi ng sinuman.
  - heading: Pagbasa sa kuwenta
    body: Hinahati ang regalo sa £60, £60, £80, at £40, na umaabot sa £240 sa resibo. Hinahati sa apat ang card at pambalot sa tig-£3. Ang bahagi ni Priya ay £60 + £3, kaya £63, at nagbayad siya ng £240, kaya may makukuha siyang £177. £63 din ang bahagi ni Omar, pero nagbayad siya ng £12, kaya may utang siyang £51. May utang si Lena na £80 + £3, o £83, at may utang si Sam na £40 + £3, o £43. Ang tatlong iyon ay umaabot sa £177 ni Priya. Kapag pinabayaan, iikot sa limang direksyon sa loob ng grupo ang mga utang. Tatlong bayad ang iminumungkahi ng Side Badger, lahat kay Priya. Nasa [pag-settle up](page:feature/settle-up) ang mga detalye.
  - heading: Ilagay sa Side Badger
    body: Mga limang minuto ang gawain ni Priya.
    items:
      - "**Gawin ang grupo.** Sa dashboard, piliin ang **Gumawa ng Grupo**. Piliin ang **Mag-imbita ng Iba** at ipadala ang link o QR code sa mga mag-aambag, at sa wala nang iba."
      - "**Idagdag ang regalo.** Piliin ang **Magdagdag ng Gastusin**, ilarawan ito, ilagay ang 240, at sa **Sino ang nagbayad?** piliin si Priya. Panatilihing nakapili ang apat sa **Hatiin sa pagitan ng**, saka sa **Paano hatiin** piliin ang **Eksaktong halaga** at i-type ang 60, 60, 80, at 40. Dapat umabot sa 240 ang kabuuan ng mga halaga. I-attach ang order confirmation kung gusto mo. Piliin ang **I-save ang Gastusin**."
      - "**Idagdag ang card.** Si Omar mismo ang magdaragdag ng £12, pipiliin ang sarili niya sa **Sino ang nagbayad?**, at iiwanang **Pantay** ang **Paano hatiin**, na nakapili ang apat na tao."
      - "**Magbilang, saka magbayad.** Tinitingnan ng lahat ang **Mga Balanse**, na nagpapakita kung sino ang may utang kanino, at ipinapadala kay Priya ang bahagi nila sa paraang gusto nila. Saka itala ito gamit ang **Magbayad** at **Itala ang Kasunduan**. Pinupunan ng quick settle ang halaga."
  - heading: Bumili muna, o mangolekta muna
    body: Hindi hawak ng Side Badger ang pondo, kaya ang “pangongolekta” ay pagbibilang talaga. Dalawang pagkakasunod-sunod ang puwede.
    items:
      - "**Bumili muna.** Nagbabayad ang bibili, idinaragdag ang gastos sa totoong presyo, at agad na nakikita ng lahat ang bahagi nila. Mas maayos ito, pero dala ng bibili ang gastos hanggang makabayad ang mga tao, kaya pumili ng bibili na kaya iyon."
      - "**Mangolekta muna.** Ipinapadala ng mga tao ang numero nila sa bibili bago ang pagbili. Kapag alam na ang presyo, ilagay ang regalo, saka itala ang bawat bayad kasama ang petsang talagang gumalaw ang pera. Idagdag muna ang regalo, para may balanseng mapupuntahan ang bawat bayad."
      - "**Gumagalaw ang presyo.** Delivery, discount code, huling pagtaas ng presyo. I-edit ang regalo at baguhin ang eksaktong halaga para umabot pa rin sa kabuuan. Nananatili ang naunang bersyon, pero sabihan muna ang grupo, dahil magbabago ang mga balanse nila."
  - heading: Ilayo si Bea dito
    body: Mga miyembro lang ng grupo ang nakakakita nito, kaya hindi makikita ni Bea ang grupong hindi siya kasali. Imbitahan ang mga mag-aambag at wala nang iba. Gumagana ang link hanggang mag-expire ito, at puwede kang pumili mula 15 minuto hanggang 5 araw, kaya pumili ng maikli at ipadala ito kung saan hindi ito makikita ni Bea. Nagpapakita ng preview ng grupo ang link sa sinumang magbubukas nito, kaya pangalanan ang grupo ng nakakabagot, gaya ng Ambagan sa Sabado, at huwag ding ilagay ang pangalan ni Bea sa mga label ng gastos o opsyon ng poll.
  - heading: Ang hindi ginagawa ng Side Badger dito
    items:
      - Hindi nito hawak o kinokolekta ang pera. Papunta sa bibili ang mga ambag sa pamamagitan ng bank transfer, cash, o anumang gamit ninyo, at saka may magtatala ng mga ito.
      - Hindi ito nagpapadala ng paalala sa pagbabayad. Trabaho pa rin ng tao ang pagkalabit sa hindi pa nagbabayad.
      - Hindi nito kinukuwenta ang bahagi ng sinuman. Ang poll ang nagpapasya sa budget at walang opsyong “hatiin ang natira,” kaya ikaw ang magta-type ng bawat halaga.
      - Isa lang ang nagbabayad sa bawat gastos. Kung dalawang tao ang bumili ng magkaibang bahagi ng regalo, maglagay ng dalawang gastos.
      - Kailangan ng libreng account at puwesto sa grupo ng bawat kasali sa hati.
