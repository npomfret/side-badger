faq:
  heading: Frågor
  items:
    - q: Vilken växelkurs använder Side Badger?
      a: En aktuell växelkurs, som hämtas när du lägger in utgiften där en finns. Du kan ändra den till den kurs du faktiskt fick.
    - q: Kan gruppen hålla sig till pund och yen?
      a: Ja. Slå på **Begränsa valutor för den här gruppen** under **Valutainställningar** i gruppens **Inställningar**, välj de **Tillåtna valutorna** och ange **Standardvaluta för nya utgifter**. Färre alternativ i listan ger färre felgissningar i kassan.
    - q: Måste vi räkna om överhuvudtaget?
      a: Nej. Valutorna förblir åtskilda om inte du eller gruppen väljer att räkna om, och varje valuta får sin egen korta lista med betalningar.
