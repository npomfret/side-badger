sections:
  - heading: 评论和表情回应，就在数字旁边
    body: 每笔支出都有自己的评论串，群组、每份清单和每个投票也都有。想问出租车为什么这么贵，就在出租车那一笔下面问，而不是在没人会往回翻的聊天里。可以附上收据照片或订单 PDF，然后在支出、付款和评论上用点赞、爱心、大笑、惊讶、难过或庆祝来回应。付款到账时庆祝一下，这大概是 Side Badger 能给出的最接近掌声的东西。
  - heading: 质疑一笔支出，又不吵架
    body: 群组开启支出疑问后，任何参与某笔支出的人都可以选择**我有一个问题**并说明原因。问题会作为评论发在这笔支出上，支出会带上**已提问**标记，整笔支出在问题处理完之前不计入任何人的余额。
    items:
      - "**开启。** 默认关闭。管理员在群组设置的**功能**下开启**允许费用问题**。"
      - "**关闭问题。** 提问的人或管理员选择**关闭问题**。如果有几个人质疑了同一笔支出，等最后一个问题关闭时，它才会重新计入余额。"
      - "**编辑。** 支出被编辑时，未解决的问题会延续到新版本，对象是仍在其中有份额的每个人。被这次编辑排除在外的人，他们的问题随旧版本一起结束，所以没有什么需要他们去关闭了。"
      - "**查找。** 支出列表有**仅已提问**筛选。这不是审批环节：只有被人质疑的支出才会被搁置，其余的一添加就立即计入。"
  - heading: 一个疑问是怎么走完的
    body: Tom 添加了 £45 的派对葡萄酒，由三个室友平分。Aisha 没喝酒，于是提出疑问，问题未解决期间，这瓶酒不计入任何人。全家商定这瓶酒算 Tom 和 Priya 的，于是 Tom 把分摊改为两个人。Aisha 不再属于这笔支出，所以她的问题随更早的版本结束（该版本仍会保留），这瓶酒立刻重新计入余额，每人 £22.50，而不是每人 £15。要是 Aisha 留在这笔支出里，她的问题就会延续下去，等她或管理员来关闭。下面，Aisha 的 £48 是采购的 £28 加保洁的 £20，Priya 的 £10.50 是她 £70.50 的份额（£28、£20 和 £22.50）减去她付出的 £60。很有[室友](page:use-case/housemates)风格的一场争论。关于怎么措辞提问，请看[有人对共享支出提出异议时怎么办](page:guide/what-to-do-when-someone-disputes-a-shared-expense)。
  - heading: 共享清单，用来买东西
    body: 在群组里开一份清单，起个名字，比如“购物清单”，添加物品并勾掉。把物品拖到更合适的顺序，看着进度计数往上走，有人买错了燕麦奶时还可以在清单上评论。已完成的清单可以归档收起来（**显示已归档**可以找回），也可以复制一份重复使用。把共享购物清单和购物账单放在一起，清单说该买什么，支出说花了多少。谁能创建和编辑清单取决于群组的权限，[群组与权限](page:feature/groups-and-permissions)有详细说明。
  - heading: 投票，想匿名也行
    body: 向群组提出会决定账单的问题，比如选哪间度假屋、礼物花多少钱，或者乘船游值不值。一个投票有一个问题和两到十个选项。你可以选择每人有几票，从单选到最多十票，也可以选择是否匿名。**匿名投票**会隐藏谁投了什么，而且第一票投出后就不能更改。投票关闭之前，大家可以更改或撤回自己的票，如果群组改了主意，你还可以重新开启。选度假屋正是[团体旅行](page:use-case/group-trips)的日常，商量礼物预算则是[活动和庆祝](page:use-case/events-and-celebrations)的经典场景。
  - heading: 动态，让一切改动都不悄无声息
    body: 每个群组都有活动历史，通知铃铛则把你所有群组的动态汇总在一处。添加一笔支出，所有人立刻就能看到，不用刷新，动态里还会显示改了什么、是谁改的。这包括支出的添加、编辑或删除，疑问的提出和关闭，评论，清单和投票的变化，以及付款的记录。
  - heading: 推送通知，想要才有
    body: 推送通知是可选的。在账户的**设置**里的**通知**下开启，当你的群组有新动态时，比如新增一笔支出或一条评论，你的设备就会通知你。每台设备要分别开启，浏览器会先征求你的许可。在 iPhone 或 iPad 上，只有添加到主屏幕的应用才能使用，[网页应用](page:feature/web-app)页面有详细说明。请把它当作一种方便，而不是承诺，因为不保证一定送达。
limits:
  heading: 限制
  items:
    - 评论、清单和投票是为群组的钱服务的。[条款](page:terms)要求发布的一切内容都与群组财务有关，所以这里是规划开销的地方，不是一般的聊天，也不是待办事项应用。
    - 一条评论最多 500 个字符，最多附带三个附件，是图片或 PDF，每个最大 5 MB。只有作者可以删除自己的评论。
    - 支出疑问默认关闭，需要管理员为每个群组分别开启。只有参与某笔支出的人才能质疑它；关闭该功能会清除所有未解决的问题；只要自己参与的某笔支出还有未解决的问题，就不能退出群组。
    - 一个群组最多可以有 100 份清单，每份最多 200 个条目，每个条目最多 500 个字符。群组权限决定谁可以创建、编辑和删除清单，被锁定的群组不允许任何更改。
    - 一个群组最多可以有 50 个投票，每个投票有两到十个选项，每人最多十票。投票没有截止时间，也不会自动关闭。
    - 活动历史保留 90 天。
    - 推送通知对每个账户、每台设备都是自愿开启的。它需要支持推送的浏览器和你的许可，在 iPhone 和 iPad 上只能从添加到主屏幕的应用使用，也不保证一定送达。没有关于动态的电子邮件或短信提醒，也没有付款提醒，所以催款仍然得靠你自己。
useCasesHeading: 一起规划的用武之地
faq:
  heading: 常见问题
  items:
    - q: 投票可以匿名吗？
      a: 可以。创建投票时开启**匿名投票**，就会隐藏谁投了什么。请在第一票之前决定，因为之后无法更改。
    - q: 投票可以自动结束吗？
      a: 不可以。投票没有截止时间，所以等群组做出决定后，由创建者选择**关闭投票**。如果群组改了主意，**重新开启投票**可以把它找回来。
    - q: 一份清单可以放多少个条目？
      a: 每份清单最多 200 个条目，每个群组最多 100 份清单。每个条目最多 500 个字符，足够写下好多燕麦奶。
    - q: 谁可以关闭问题？在此期间这笔支出怎么处理？
      a: 提问的人，或者群组管理员。问题未解决期间，整笔支出不计入任何人的余额。等它上面最后一个未解决的问题关闭，或者一次编辑把提问的人从这笔支出中移出，它就会重新计入。
    - q: 可以把清单和评论当作待办事项应用或群聊吗？
      a: 不可以。评论、清单和投票是为群组的钱服务的，[条款](page:terms)也是这么要求的。想想购物清单、预算投票，和“这个为什么是 £45？”。
    - q: Side Badger 会通过邮件通知我动态吗？
      a: 不会。没有关于动态的电子邮件或短信提醒。你可以在每台设备上开启推送通知，应用里的通知铃铛会显示有什么新动向。
