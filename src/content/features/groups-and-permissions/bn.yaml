meta:
  title: "যৌথ খরচের জন্য গ্রুপ অ্যাডমিন ও অনুমতি | Side Badger"
  description: "লিঙ্ক বা QR কোডে ডাকুন, কে ঢুকবে অনুমোদন করুন, দর্শক বানান, অনুমতি ঠিক করুন, কাজ শেষে গ্রুপ লক করুন। আপনার গ্রুপ, আপনার নিয়ম, যুক্তির সীমার মধ্যে।"
h1: "গ্রুপ অ্যাডমিন ও অনুমতি: আপনার নিয়ম, যুক্তির সীমার মধ্যে"
navLabel: "গ্রুপ ও অনুমতি"
lead: "কিছু গ্রুপে একজন কোষাধ্যক্ষ লাগে। Side Badger-এ তার জন্য একটা সেটিং আছে। লিঙ্ক বা QR কোড দিয়ে মানুষজনকে ডাকুন, কে ঢুকবে তা ঠিক করুন, আর বেছে নিন কারা সংখ্যা বদলাতে পারবে। বন্ধুদের ছোট একটা গ্রুপ এসবের কিছুই না মানলেও চলে, কারণ নতুন গ্রুপ শুরু হয় পুরোপুরি খোলা অবস্থায়।"
cta:
  heading: "গোছানো একটা গ্রুপ চালাতে তৈরি?"
  body: "অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর আমন্ত্রণ লিঙ্ক পাঠান। খোলা রেখে দিন, অথবা গ্রুপ বড় বা খুঁতখুঁতে হয়ে উঠলে নিয়মগুলো কড়া করুন।"
problem:
  heading: "কাউকে না কাউকে সংখ্যাগুলো গুছিয়ে রাখতে হয়"
  body: "চারজন রুমমেট ভরসার ওপর চলতে পারে। বিয়ের সপ্তাহান্তে ত্রিশজন অতিথি সম্ভবত পারে না। প্রতিটি বাড়ি, ট্রিপ বা অনুষ্ঠানের জন্য আলাদা গ্রুপ বানান, যেখানে 50 জন পর্যন্ত থাকতে পারে, আর প্রতিটি গ্রুপের নিজস্ব সদস্য, নিজস্ব রোল আর নিজস্ব নিয়ম থাকে। আপনার ড্যাশবোর্ড সবগুলো এক স্ক্রিনে দেখায়, প্রতিটিতে আপনার অবস্থানসহ। বেশিরভাগ গ্রুপ সেটিংসে হাতই দেয় না। যারা দেয়, তাদের মধ্যে সাধারণত এমন কেউ থাকে যে এসব চাওয়ার মতো গোছানো।"
workflow:
  heading: "ফাঁকা গ্রুপ থেকে লক করা গ্রুপ"
  steps:
    - title: "লিঙ্ক বা QR কোড দিয়ে ডাকুন"
      body: "**অন্যদের আমন্ত্রণ জানান** খুলুন, লিঙ্কটি কতক্ষণ চলবে তা বেছে নিন (15 মিনিট, 1 ঘণ্টা, 1 দিন বা 5 দিন), তারপর লিঙ্কটি কপি করুন, অথবা মানুষজনের স্ক্যান করার জন্য QR কোড দেখান। যাদের সঙ্গে আপনার আগে থেকেই অন্য কোনো গ্রুপ আছে, তাদেরও অ্যাপের ভেতর থেকেই আমন্ত্রণ জানাতে পারেন।"
      shot: S03
      shotAlt: "আমন্ত্রণ ডায়ালগ, গ্রুপের লিঙ্ক, তার QR কোড আর লিঙ্ক কতক্ষণ চলবে তার বিকল্পসহ"
    - title: "যোগ দেওয়ার আগে দেখে নিতে দিন"
      body: "লিঙ্ক যার হাতে আছে সে সাইন ইন করে বা অ্যাকাউন্ট খোলে, গ্রুপের একটি প্রিভিউ দেখে এবং গ্রুপে যে নামে থাকতে চায় সেটা বেছে নেয়। তারপর **গ্রুপে যোগ দিন** চাপে।"
      shot: S04
      shotAlt: "সাইন ইন করা একজনকে যোগ দেওয়ার আগে দেখানো গ্রুপের যোগদানের প্রিভিউ"
    - title: "কে ঢুকবে তা অনুমোদন করুন"
      body: "অনুমোদন চালু করুন, তাহলে যারা লিঙ্ক ব্যবহার করে আসে তারা অপেক্ষমান সদস্য হিসেবে থাকে, যতক্ষণ না অ্যাডমিন তাদের ঢুকতে দেন। অ্যাডমিনরা তাদের পান **নিরাপত্তা ও পারমিশন**-এর **অপেক্ষমান সদস্য** অংশে, আর **অনুমোদন করুন** বা **প্রত্যাখ্যান করুন** বেছে নেন। তার আগে অপেক্ষমান কেউ গ্রুপের কিছুই দেখতে পায় না।"
      shot: S14
      shotAlt: "অপেক্ষমান সদস্যরা অ্যাডমিনের অনুমোদন বা প্রত্যাখ্যানের অপেক্ষায়"
    - title: "কে কী বদলাতে পারবে তা ঠিক করুন"
      body: "**ওপেন কোলাবরেশন** বা **ম্যানেজড গ্রুপ** বেছে নিন, অথবা অনুমতিগুলো একটা একটা করে ঠিক করুন। তারপর প্রত্যেককে একটি রোল দিন: অ্যাডমিন, সদস্য বা দর্শক। অনুমতি আর রোল বদলাতে পারেন শুধু অ্যাডমিনরা।"
      shot: S13
      shotAlt: "গ্রুপ সেটিংসের নিরাপত্তা ট্যাব, দুটি প্রিসেট আর কাস্টম অনুমতিসহ"
    - title: "শেষ হলে লক করে দিন"
      body: "ট্রিপ শেষ হলে আর সংখ্যাগুলো থিতু হলে একজন অ্যাডমিন **গ্রুপ লক করুন** চালু করতে পারেন। তখন কেউ খরচ যোগ বা বদলাতে, পেমেন্ট রেকর্ড করতে, তালিকা ও পোল সম্পাদনা করতে পারে না, আর একটি ব্যানার সেটা জানিয়ে দেয়। কেউ চুপচাপ দেরিতে পাওয়া একটা ট্যাক্সির ভাড়া ঢুকিয়ে দিতে পারবে না। সত্যিই একটা এসে পড়লে অ্যাডমিন গ্রুপ আনলক করতে পারেন।"
      shot: S15
      shotAlt: "একটি গ্রুপ, যেখানে ব্যানারে লেখা আছে সেটি লক করা"
options:
  heading: "অ্যাডমিন, সদস্য আর দর্শক"
  items:
    - title: "অ্যাডমিন"
      body: "গ্রুপ চালায়। অ্যাডমিনরা নতুন সদস্যদের অনুমোদন দেন, রোল আর অনুমতি বদলান, গ্রুপ লক ও আনলক করেন এবং বন্ধ করেন। যে গ্রুপ বানায় সে শুরুতে সেটির অ্যাডমিন হয়, আর গ্রুপ কখনও অ্যাডমিন ছাড়া থাকে না, কারণ শেষ অ্যাডমিনকে নামিয়ে দেওয়া যায় না।"
    - title: "সদস্য"
      body: "অংশ নেয়। সদস্য কী করতে পারে তা নির্ভর করে গ্রুপের অনুমতির ওপর। ওপেন কোলাবরেশন গ্রুপে সেটা প্রায় সবকিছু। ম্যানেজড গ্রুপে সদস্যরা শুধু নিজেদের বানানো খরচ আর তালিকা বদলাতে পারে।"
    - title: "দর্শক"
      body: "সবকিছু দেখে, কিছুই বদলায় না। দর্শক খরচ বা তালিকা যোগ বা সম্পাদনা করতে, মানুষজনকে আমন্ত্রণ জানাতে, সেটিংস বদলাতে বা হেডার ইমেজে হাত দিতে পারে না। যে সংখ্যাগুলোর ওপর নজর রাখতে চায় আর কথা দেয় যে নাড়াচাড়া করবে না, তার জন্য কাজের।"
sections:
  - heading: "ওপেন, ম্যানেজড, অথবা আপনার নিজের নিয়ম"
    body: "নতুন গ্রুপ শুরু হয় **ওপেন কোলাবরেশন** দিয়ে, যেখানে সবাই মানুষজনকে আমন্ত্রণ জানাতে, খরচ বদলাতে ও তালিকা সম্পাদনা করতে পারে, আর নতুন সদস্যরা নিজে থেকেই যোগ দেয়। কাউকে বড়োজনের ভূমিকা নিতে হলে আছে **ম্যানেজড গ্রুপ**। সাতটি অনুমতি একটা একটা করেও ঠিক করতে পারেন, আর হাতে একটা বদলালে গ্রুপ কাস্টমে চলে যায়। যা-ই বেছে নিন, অনুমতিগুলো নিজে বদলাতে পারেন শুধু অ্যাডমিনরা, আর প্রতিটি পরিবর্তন কার্যকলাপের ফিডে দেখা যায়। [রুমমেটদের](page:use-case/housemates) ফ্ল্যাট সবকিছু খোলা রাখতে পারে। একটা বড় [অনুষ্ঠান বা উদযাপনে](page:use-case/events-and-celebrations) প্রায়ই ম্যানেজড লাগে, যাতে কে ঢুকবে তার দায়িত্বে কেউ থাকে। এসবে নতুন? [কীভাবে কাজ করে](page:how-it-works) প্রথম খরচ থেকে হিসাব মেটানো পর্যন্ত পুরো যাত্রাটা দেখিয়ে দেয়।"
    items:
      - "**কারা খরচ সম্পাদনা করতে পারবে।** ওপেন কোলাবরেশন: যেকোনো সদস্য। ম্যানেজড গ্রুপ: নির্মাতা ও অ্যাডমিন।"
      - "**কারা খরচ মুছে ফেলতে পারবে।** ওপেন কোলাবরেশন: যেকোনো সদস্য। ম্যানেজড গ্রুপ: নির্মাতা ও অ্যাডমিন।"
      - "**কে তালিকা সম্পাদনা করতে পারে।** ওপেন কোলাবরেশন: যেকোনো সদস্য। ম্যানেজড গ্রুপ: নির্মাতা ও অ্যাডমিন।"
      - "**কারা সদস্য আমন্ত্রণ জানাতে পারবে।** ওপেন কোলাবরেশন: যেকোনো সদস্য। ম্যানেজড গ্রুপ: শুধু অ্যাডমিন।"
      - "**নতুন সদস্য অনুমোদন।** ওপেন কোলাবরেশন: স্বয়ংক্রিয়। ম্যানেজড গ্রুপ: অ্যাডমিনের অনুমোদন লাগে।"
      - "**কারা সেটিংস পরিবর্তন করতে পারবে।** ওপেন কোলাবরেশন: যেকোনো সদস্য। ম্যানেজড গ্রুপ: শুধু অ্যাডমিন।"
      - "**কে হেডার ইমেজ পরিবর্তন করতে পারে।** ওপেন কোলাবরেশন: যেকোনো সদস্য। ম্যানেজড গ্রুপ: শুধু অ্যাডমিন।"
  - heading: "আপনার নাম, আপনার ছবি, আপনার হেডার ইমেজ"
    body: "প্রতিটি গ্রুপের নিজস্ব কুশীলব-তালিকা আছে। প্রতিটি গ্রুপে মানুষজন আপনাকে যে নামে দেখবে (2 থেকে 50 অক্ষর, আর গ্রুপের ভেতরে অনন্য) এবং আপনার প্রোফাইল ছবিগুলোর কোনটা সেখানে পরবেন, তা বেছে নিন। বাড়িতে **Sam** হোন, আর ট্রিপে **Sam (গাড়ি আছে যার)**। সেটিংস বদলানোর অনুমতি যার আছে সে গ্রুপের নাম বদলাতে আর বিবরণ সম্পাদনা করতে পারে। হেডার ইমেজ, অর্থাৎ 10 MB পর্যন্ত একটি JPEG, PNG, GIF বা WebP, তার অনুমতি আলাদা।"
  - heading: "আর্কাইভ, লক বা বন্ধ"
    body: "গ্রুপ তুলে রাখার তিনটি উপায়, কম গুরুতর থেকে বেশি গুরুতর।"
    items:
      - "**আর্কাইভ** গ্রুপটিকে শুধু আপনার নিজের ড্যাশবোর্ড থেকে লুকিয়ে রাখে, আর কারও নয়। আপনি তবু সেটি আগের মতোই খুলে ব্যবহার করতে পারেন, আর **গ্রুপ আনআর্কাইভ করুন** সেটি ফিরিয়ে আনে।"
      - "**লক** একজন অ্যাডমিন আনলক না করা পর্যন্ত পরিবর্তন থামিয়ে দেয়। সবাই তবু গ্রুপ আর তার ইতিহাস পড়তে পারে।"
      - "**বন্ধ করা** স্থায়ী, আর সবার জন্য। এটি করতে পারেন শুধু অ্যাডমিন, নিশ্চিত করতে গ্রুপের নাম টাইপ করে, আর এরপর কেউ গ্রুপটি আর খুলতে পারে না।"
  - heading: "গ্রুপ ছেড়ে যাওয়া"
    body: "হিসাব মিটে গেলে যে কেউ গ্রুপ ছাড়তে পারে। একটি মুদ্রাতেও আপনার দেওয়ার বা পাওয়ার বাকি থাকলে, কোনো খরচ নিয়ে এমন একটি খোলা প্রশ্ন থাকলে যাতে আপনি জড়িত, অথবা আপনি শেষ অ্যাডমিন বা একমাত্র সদস্য হলে ছাড়তে পারবেন না। [পেমেন্ট রেকর্ড করুন](page:feature/settle-up), [খরচের প্রশ্নটা](page:guide/what-to-do-when-someone-disputes-a-shared-expense) মিটিয়ে নিন, বা অন্য কাউকে অ্যাডমিন বানান, তারপর যান। ফিরতে চাইলে নতুন আমন্ত্রণ লাগবে।"
limits:
  heading: "যুক্তির সীমার মধ্যে: ছোট হরফের কথা"
  items:
    - "একটি গ্রুপে 50 জন পর্যন্ত থাকতে পারে।"
    - "অনুমতি আর রোল বদলাতে পারেন শুধু অ্যাডমিনরা। শেষ অ্যাডমিনকে নামিয়ে দেওয়া যায় না।"
    - "খরচ সম্পাদনা **শুধুমাত্র অ্যাডমিন**-এর জন্য করলে তার মানে এটাও যে শুধু অ্যাডমিনরাই খরচ যোগ করতে পারবেন।"
    - "লক খরচ, নতুন পেমেন্ট, তালিকা আর পোলের পরিবর্তন থামিয়ে দেয়। সবাই তবু গ্রুপ আর তার ইতিহাস পড়তে এবং পেমেন্টে রিঅ্যাক্ট করতে পারে।"
    - "বন্ধ করা স্থায়ী। অ্যাপে বন্ধ করা গ্রুপ আবার খোলার কোনো উপায় নেই।"
    - "নতুন আমন্ত্রণ লিঙ্ক বানালে পুরনোগুলো বাতিল হয় না। প্রতিটি লিঙ্ক তার নিজের মেয়াদ পর্যন্ত চলে, তাই লিঙ্কটা কোথায় গিয়ে পড়তে পারে তা নিয়ে দুশ্চিন্তা থাকলে ছোট মেয়াদ বেছে নিন।"
    - "অ্যাপের ভেতরের আমন্ত্রণে আপনার সবচেয়ে সাম্প্রতিক 10টি সক্রিয় গ্রুপের মানুষজনকে দেখানো হয়। বাকি সবার লিঙ্ক লাগে, আর কারা আমন্ত্রণ জানাতে পারবে তা গ্রুপের অনুমতির ওপর নির্ভর করে।"
    - "যোগ দিতে অ্যাকাউন্ট লাগে, আর কিছু যোগ করার আগে মানুষজনকে ইমেইল যাচাই করতে হয়।"
useCasesHeading: "যেখানে একটু গোছগাছ কাজে লাগে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "দর্শক কি খরচ যোগ করতে পারে?"
      a: "না। দর্শক সবকিছু দেখে, কিছুই বদলায় না। সে খরচ বা তালিকা যোগ বা সম্পাদনা করতে, মানুষজনকে আমন্ত্রণ জানাতে বা সেটিংস বদলাতে পারে না।"
    - q: "দেনা থাকা অবস্থায় কেউ কি গ্রুপ ছাড়তে পারে?"
      a: "না। একটি মুদ্রাতেও যার দেওয়ার বা পাওয়ার বাকি আছে, সে গ্রুপ ছাড়তে পারে না। আগে হিসাব মেটান, তারপর যান।"
    - q: "গ্রুপ বন্ধ করলে কী হয়?"
      a: "কেউ আর সেটি খুলতে পারে না। গ্রুপ বন্ধ করতে পারেন শুধু অ্যাডমিন, নিশ্চিত করতে তাকে গ্রুপের নাম টাইপ করতে হয়, আর গ্রুপটি সবার জন্য অনুপলব্ধ হয়ে যায়। শুধু পরিবর্তন থামাতে চাইলে লক করুন। শুধু নিজের ড্যাশবোর্ড থেকে সরাতে চাইলে আর্কাইভ করুন।"
    - q: "লক কি ফিরিয়ে নেওয়া যায়?"
      a: "হ্যাঁ। একজন অ্যাডমিন গ্রুপ আনলক করতে পারেন, আর পরিবর্তন আবার কাজ করে।"
    - q: "যোগ দেওয়ার আগে কি মানুষজনকে অনুমোদন দিতে হবে?"
      a: "শুধু আপনি চাইলে। নতুন গ্রুপ শুরু হয় ওপেন কোলাবরেশন দিয়ে, যেখানে লিঙ্ক ব্যবহার করা মানুষজন নিজে থেকেই যোগ দেয়। অ্যাডমিন অনুমোদন চালু করুন, বা ম্যানেজড গ্রুপ বেছে নিন, তখন প্রত্যেককে অপেক্ষা করতে হয় যতক্ষণ না অ্যাডমিন তাকে ঢুকতে দেন।"
    - q: "একটি গ্রুপে কতজন থাকতে পারে?"
      a: "50 জন পর্যন্ত।"
