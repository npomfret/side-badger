meta:
  title: "تقسیم هزینه‌ها مساوی، با مبلغ دقیق یا با درصد | Side Badger"
  description: "یک هزینه مشترک را مساوی، با مبلغ دقیق یا با درصد تقسیم کنید و کسانی را که حضور نداشتند کنار بگذارید. رایگان، بدون تبلیغات و بدون محدودیت روزانه."
h1: "تقسیم هزینه‌ها مساوی، با مبلغ دقیق یا با درصد"
navLabel: "تقسیم هزینه‌ها"
lead: "همه‌چیز نصف‌نصف نیست. Side Badger از پسش برمی‌آید. بگویید چه کسی پرداخت کرد، کسانی را که در هزینه سهم داشتند انتخاب کنید و آن را **مساوی، با مبلغ دقیق یا با درصد** تقسیم کنید. کینه‌ها جداگانه فروخته می‌شوند."
cta:
  heading: "هزینه بعدی را درست تقسیم کنید"
  body: "یک حساب رایگان بسازید، گروه را شروع کنید و هزینه‌ای را که مدت‌هاست قصد داشتید ردیف کنید اضافه کنید. مطمئن نیستید بعدش چه می‌شود؟ [نحوه کار](page:how-it-works) را ببینید یا ببینید [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing)."
  button: "ساخت حساب رایگان"
problem:
  heading: "همه‌چیز نصف‌نصف نیست"
  body: "اجاره به اندازه اتاق بستگی دارد. کادو به این بستگی دارد که چه کسی چه قولی داده. شام به این بستگی دارد که چه کسی برای دسر ماند. نصف کردن صورت‌حساب کار می‌کند تا اولین صورت‌حسابی که نصف‌نصف نیست، و آن وقت یک نفر جدول اکسل باز می‌کند. Side Badger ثبت می‌کند چه کسی پرداخت کرده، چه کسانی در هزینه سهم دارند و چطور تقسیم می‌شود، تا مانده‌ها درست دربیایند و کسی سر میز مجبور به تقسیم طولانی نشود."
workflow:
  heading: "افزودن یک هزینه، از ابتدا تا انتها"
  steps:
    - title: "بگویید چه کسی برای چه پرداخت کرد"
      body: "مبلغ، یک توضیح کوتاه و نام پرداخت‌کننده را وارد کنید. برای هر هزینه یک نفر پرداخت می‌کند و همین حساب را صادق نگه می‌دارد."
      shot: S05
      shotAlt: "فرم هزینه با اجاره کلبه که به‌صورت درصدی بین سه نفر تقسیم شده است"
    - title: "روش تقسیم را انتخاب کنید"
      body: "مساوی، مبلغ دقیق یا درصد را انتخاب کنید. درصدها باید جمعشان 100 شود و مبلغ‌های دقیق باید جمعشان برابر کل باشد."
      shot: S06
      shotAlt: "فرم هزینه با مبلغ‌های دقیق وارد‌شده برای هر نفر روی یک کادو"
    - title: "داستانش را اضافه کنید"
      body: "تاریخ را تعیین کنید و برچسب، مکان و یادداشت اضافه کنید. همه اعضای گروه جزئیات یکسانی می‌بینند و می‌توانند همان‌جا نظر بدهند."
      shot: S08
      shotAlt: "یک هزینه با جزئیاتش، رشته نظرها و مبلغ اصلی که با آن وارد شده است"
    - title: "اگر چیزی عجیب به نظر رسید پرسش مطرح کنید"
      body: "اگر گروه پرسش درباره هزینه‌ها را روشن کرده باشد، هر کسی که در یک هزینه سهم دارد می‌تواند درباره‌اش پرسش مطرح کند و فهرست هزینه‌ها می‌تواند فقط هزینه‌های زیر پرسش را نشان دهد."
      shot: S18
      shotAlt: "فهرست هزینه‌ها با نشان «زیر سؤال» و فیلتر «فقط زیر سؤال»"
options:
  heading: "سه روش تقسیم"
  items:
    - title: "مساوی"
      body: "پیش‌فرض برای شام، تاکسی و هر چیزی که همه به یک اندازه در آن سهیم بودند. اگر کل دقیق تقسیم نشود، پول خرد اضافه به‌صورت تصادفی به یک نفر می‌رسد، نه همیشه همان یک نفر. در تاکسی پایین، آنا است."
    - title: "با مبلغ دقیق"
      body: "بنویسید هر نفر چقدر بدهکار است. برای کادویی که هر کس قیمت دیگری برایش انتخاب کرد یا خریدی که سبد یک نفر بیش از خواربار مشترک داشت مناسب است. مبلغ‌ها باید جمعشان برابر کل شود."
    - title: "با درصد"
      body: "به هر نفر سهمی از کل بدهید. اجاره بر اساس اندازه اتاق نمونه کلاسیک است: اتاق بزرگ‌تر سهم بزرگ‌تری می‌پردازد و کسی وانمود نمی‌کند که این‌طور نیست."
example:
