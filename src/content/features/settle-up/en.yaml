meta:
  title: Settle up with fewer payments | Side Badger
  description: See who owes whom in your group, get a short list of payments that settles everyone, and record each payment as it happens. Free to use.
h1: Settle up with fewer payments
navLabel: Settle up
lead: Side Badger keeps a running balance for everyone in the group and suggests a short list of payments that settles it. You pay each other however you like, then record it. If you want to see how the numbers get split first, start with [split expenses](page:feature/split-expenses).
cta:
  heading: Ready to untangle who owes whom?
  body: Create an account, start a group and add the first expense. The balances will take it from there.
  button: Create a free account
problem:
  heading: Balances that update as you go
  body: Every expense changes who owes whom, so Side Badger keeps the balances current as expenses and payments are added. Everyone in the group sees a change straight away, and sees what changed and who changed it. Balances are kept per currency, so euros and pounds stay in their own columns unless an expense was converted when it was entered. By default you see the debts that involve you; **Show all** lists the whole group.
workflow:
  heading: Three steps to square
  steps:
    - title: See who owes whom
      body: Open the group's balances to see what you owe, what you are owed, and a short list of payments that settles everyone, worked out per currency. Questioned expenses stay out of the sums until they are sorted. In the housemates example below, six payments become two.
      shot: S10
      shotAlt: The balances screen showing simplified debts in two currencies, with Show all switched on
    - title: Pay however you like, then record it
      body: Bank transfer, cash, a favour owed from the last holiday. Side Badger does not move the money. Once it has changed hands, record the payment and the balance updates for everyone.
      shot: S11
      shotAlt: The payment form with quick-settle buttons and the notice shown for a part payment
    - title: Check it landed
      body: The payment goes into the group history, where everyone in the group can see it and react with an emoji. Celebrate a payment when it lands.
      shot: S12
      shotAlt: The payment history with emoji reactions on a payment
