faq:
  heading: "Sorular"
  items:
    - q: "Side Badger, Splitwise'a ücretsiz bir alternatif mi?"
      a: "Bir grupta hesap bölüşmek için, evet. Makbuz tarama, para birimi çevirme ve reklamsızlık ücretsiz, günlük sınır da yok. Yerel bir uygulamaya, çevrimdışı kullanıma, yinelenen harcamalara ya da uygulamanın içinde ödemelere ihtiyacınız varsa bunları Splitwise yapar, Side Badger yapmaz."
    - q: "Splitwise ayrıntıları nereden geliyor?"
      a: "Splitwise'ın kendi sayfalarından: ana sayfası, Pro sayfası ve yardım merkezi. Tablonun her satırı geldiği sayfaya bağlanır ve tablonun üstündeki tarih onları ne zaman okuduğumuzu söyler. Her çeyrekte kontrol ederiz."
    - q: "Side Badger ücretsiz kalacak mı?"
      a: "Side Badger'daki her şey bugün ücretsiz ve ücretli bir katman yok. Bu bir gün değişirse önceden haber veririz. Ayrıntılar [fiyatlandırma sayfasında](page:pricing)."
    - q: "Grubumdaki herkes geçmek zorunda mı?"
      a: "Evet. Bir gruptaki herkesin ücretsiz bir Side Badger hesabı olması gerekir ve bir bağlantı ya da QR koduyla katılabilirler."
    - q: "Side Badger'ın mobil uygulaması var mı?"
      a: "Uygulama mağazasında yok. Tarayıcınızda çalışır: telefonunuzda giriş yapın, sonra bir uygulama gibi açılması için ana ekranınıza ekleyin. [Nasıl çalışır](page:how-it-works) nasıl yapılacağını gösterir."
