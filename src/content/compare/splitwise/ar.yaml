meta:
  title: "Side Badger مقابل Splitwise: الأجزاء المجانية، مقارنةً | Side Badger"
  description: "بديل مجاني لـ Splitwise، يُقارَن بإنصاف. مسح الإيصالات وتحويل العملات وبلا إعلانات، كلها بلا مقابل هنا، ونذكر ما يفعله Splitwise أفضل."
h1: "Side Badger مقابل Splitwise: الأجزاء المجانية، مقارنةً"
navLabel: "Side Badger مقابل Splitwise"
lead: "على الأرجح قال أحد في مجموعتك: «استخدموا Splitwise وحسب». كلام معقول. Side Badger تطبيق ويب مجاني فيه مسح للإيصالات وتحويل للعملات وبلا إعلانات، ولا يلزم اشتراك لفتحها. وأيهما يناسب مجموعتك يتوقف على ما تحتاجه، فإليك المقارنة، وما يخص Splitwise فيها مأخوذ من صفحات Splitwise نفسها فقط."
cta:
  heading: "جرّبه على فاتورتك المشتركة القادمة"
  body: "أنشئ حساباً مجانياً، وأنشئ مجموعة، وأضف مصروفاً واحداً حقيقياً. وإن لم يناسبك، فقد أنفقت بضع دقائق لا اشتراكاً."
asOf: 2026-10-21
asOfNote: "قرأنا صفحات Splitwise نفسها في {date} حتى لا تضطر إلى ذلك، وكل ما هنا عن Splitwise مأخوذ منها. ويرتبط كل صف في الجدول بمصدره. والخطط تتغير، لذا نراجع مرة كل ربع سنة، وإذا خالفت صفحات Splitwise هذه الصفحة فصدّقها هي."
