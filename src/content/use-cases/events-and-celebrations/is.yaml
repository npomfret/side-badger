featuresHeading: "Eiginleikarnir sem þetta notar"
faq:
  heading: "Spurningar"
  items:
    - q: "Geta gestir séð hópinn án þess að ganga í hann?"
      a: "Nei. Fólk gengur í hópinn með tengli eða QR-kóða og ókeypis aðgangi, svo það sér hópinn þegar það er komið inn."
    - q: "Getur Side Badger innheimt peningana?"
      a: "Nei. Side Badger heldur utan um stöðuna og flytur aldrei peninga. Borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna. Það er ókeypis, án auglýsinga og án daglegra takmarka; sjá [verðskrá](page:pricing)."
    - q: "Geta atkvæði verið nafnlaus?"
      a: "Já. Þegar þú býrð til könnun geturðu falið hver kaus hvað. Stillingunum er aðeins hægt að breyta fyrir fyrsta atkvæðið."
    - q: "Geta allir lagt til mismunandi upphæðir?"
      a: "Já. Skiptu útgjaldi eftir nákvæmum upphæðum, svo hlutur hvers og eins sé talan sem þið sömduð um, eða slepptu þeim sem komu ekki við sögu."
    - q: "Getur skipuleggjandi haldið bókhaldið?"
      a: "Já. Notaðu forstillinguna fyrir stýrðan hóp, svo aðeins höfundar og stjórnendur breyti útgjöldum og stjórnendur samþykki nýja meðlimi."
