meta:
  title: "Side Badger vs. Splitwise: Gratis-Teile im Vergleich | Side Badger"
  description: "Kostenlose Splitwise-Alternative, fair verglichen. Belegscan, Umrechnung und keine Werbung kosten hier nichts, und wir sagen, was Splitwise besser kann."
h1: "Side Badger vs. Splitwise: Gratis-Teile im Vergleich"
navLabel: Side Badger vs. Splitwise
lead: "Irgendwer in deiner Gruppe hat bestimmt schon gesagt: „Nimm doch einfach Splitwise.“ Fair genug. Side Badger ist eine kostenlose Web-App mit Belegscan, Währungsumrechnung und ohne Werbung, und ohne Abo, um sie freizuschalten. Welche zu deiner Gruppe passt, hängt davon ab, was sie braucht, also hier der Vergleich, bei dem die Angaben zu Splitwise nur aus Splitwises eigenen Seiten stammen."
cta:
  heading: Probier es bei deiner nächsten gemeinsamen Rechnung aus
  body: "Erstelle ein kostenloses Konto, lege eine Gruppe an und füge eine echte Ausgabe hinzu. Wenn es nichts für dich ist, hast du ein paar Minuten investiert, kein Abo."
asOf: 2026-10-21
asOfNote: "Wir haben Splitwises eigene Seiten am {date} gelesen, damit du es nicht musst, und alles hier über Splitwise stammt von dort. Jede Zeile der Tabelle verlinkt auf ihre Quelle. Tarife ändern sich, deshalb prüfen wir jedes Quartal neu, und wenn Splitwises Seiten dieser hier widersprechen, glaube ihnen."
