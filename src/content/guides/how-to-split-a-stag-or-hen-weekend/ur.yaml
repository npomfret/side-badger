meta:
  title: "سٹیگ یا ہین ویک اینڈ کا خرچ کیسے بانٹیں | Side Badger"
  description: "جس کے اعزاز میں پارٹی ہے وہ کچھ نہیں دیتا، اور پیر تک سب کی آپس میں بول چال برقرار رہتی ہے۔ سٹیگ یا ہین ویک اینڈ کا خرچ، حساب کے ساتھ۔"
h1: "سٹیگ یا ہین ویک اینڈ کا خرچ کیسے بانٹیں"
navLabel: "سٹیگ یا ہین ویک اینڈ"
lead: "جس کے اعزاز میں پارٹی ہے وہ کچھ نہیں دیتا، اس لیے باقی گروپ ہر خرچ آپس میں [برابر](page:feature/split-expenses) بانٹتا ہے۔ جو لوگ کسی خرچے میں شامل نہیں انہیں اس سے باہر رکھیں، اور جس کے اعزاز میں پارٹی ہے اسے گروپ سے باہر رکھیں تاکہ سرپرائز قائم رہے۔"
cta:
  heading: "حساب رکھیں، سرپرائز رکھیں"
  body: "گروپ بنائیں، جس کے اعزاز میں پارٹی ہے اس کے سوا سب کو لنک بھیجیں اور ہر خرچہ ہوتے ہی شامل کریں۔ Side Badger مفت ہے، اشتہارات کے بغیر اور روزانہ کی حد کے بغیر۔"
sections:
  - heading: "چار دوست اور ایک سرپرائز"
    body: "ہنا، اسلا، جیس اور کیٹ گریس کو اس کے ہین ویک اینڈ پر لے جا رہی ہیں۔ گریس مہمانِ خصوصی ہے، اس لیے وہ کسی چیز کا پیسہ نہیں دیتی۔ وہ گروپ میں بھی نہیں ہے، اس لیے دیکھ نہیں سکتی کہ اس کی سہیلیاں اس پر کتنا خرچ کر رہی ہیں۔ ہنا کاٹیج بُک کرتی ہے، اسلا سپا کا دن ادا کرتی ہے، جیس رات کا کھانا دیتی ہے اور کیٹ ٹیکسی۔ اتوار تک ہر ایک نے کچھ نہ کچھ دیا ہوتا ہے، اور کوئی نہیں بتا سکتا کہ کون آگے ہے۔ سٹیگ ہو یا ہین، حساب ایک ہی ہے، چاہے مہمانِ خصوصی کوئی بھی ہو۔"
  - heading: "ادا کرنے والوں کے حساب سے بانٹیں، وہاں موجود لوگوں کے نہیں"
    body: "مہمانِ خصوصی کا حصہ غائب نہیں ہوتا۔ وہ بانٹ دیا جاتا ہے۔ کاٹیج £720 کا ہے اور چار دوست اس کی ادائیگی کرتی ہیں، یعنی فی کس £180، اور گریس کی جگہ اسی عدد میں شامل ہے۔ رات کا کھانا £260 کا ہے، یعنی فی کس £65۔ ٹیکسی £44 کی ہے، یعنی فی کس £11۔ جو کوئی کسی خرچے سے رہ جائے وہ صرف اسی خرچے سے نکلتا ہے۔ کیٹ سپا میں نہیں گئی، اس لیے اس کے £360، جن میں گریس کی جگہ بھی شامل ہے، ہنا، اسلا اور جیس میں فی کس £120 کے حساب سے بٹتے ہیں۔ سب جمع کریں تو ہنا، اسلا اور جیس پر ویک اینڈ کے ہر ایک کے £376 بنتے ہیں، اور کیٹ پر £256۔"
  - heading: "Side Badger میں ترتیب دیں"
    items:
      - "ویک اینڈ کے لیے گروپ بنائیں اور اسے کوئی پھیکا سا نام دیں، جیسے کاٹیج ویک اینڈ۔ گریس رکن نہیں ہے، اور گروپ صرف اس کے ارکان دیکھ سکتے ہیں۔"
      - "**دوسروں کو مدعو کریں** چنیں اور لنک وہیں بھیجیں، یا QR کوڈ وہیں دکھائیں، جہاں گریس نہ دیکھ سکے۔ لنک شامل ہونے سے پہلے گروپ کا پیش منظر دکھاتا ہے۔ چنیں کہ وہ کتنی دیر چلے، 15 منٹ سے 5 دن تک۔ پرانا لنک ختم ہونے تک کام کرتا رہتا ہے، اس لیے ضرورت سے زیادہ دیر نہ رکھیں۔"
      - "ہر خرچے کے لیے **خرچہ شامل کریں** چنیں، رقم درج کریں اور **کس نے ادائیگی کی؟** کے تحت ادا کنندہ چنیں۔ **کے درمیان تقسیم کریں** کے تحت ادا کرنے والوں پر ٹک لگائیں، اور جو کوئی اس سے رہ گیا اسے چھوڑ دیں، جیسے سپا کے لیے کیٹ کو۔ **کیسے تقسیم کریں** کے تحت **برابر** چنیں۔"
      - "جب گھر پہنچ جائیں تو گروپ کے **بیلنسز** کھولیں۔ Side Badger دکھاتا ہے کہ کس کو کس کا دینا ہے اور ادائیگیوں کی مختصر فہرست تجویز کرتا ہے۔ یہاں تین ہیں: کیٹ ہنا کو £212 دیتی ہے، جیس ہنا کو £116 دیتی ہے اور اسلا ہنا کو £16 دیتی ہے۔ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ہر ادائیگی ریکارڈ کرنے کے لیے **تصفیہ کریں** استعمال کریں۔"
  - heading: "بکنگ سے پہلے، بجٹ اور ڈپازٹ"
    body: "کسی کے بُک کرنے سے پہلے بجٹ طے کریں۔ **پول شامل کریں** چنیں، پوچھیں کہ گروپ کاٹیج پر کتنا خرچ کرے گا اور چند رقمیں اختیارات کے طور پر دیں۔ پول بناتے وقت **گمنام ووٹنگ** آن کریں، تاکہ چھپا رہے کہ کس نے کس کو ووٹ دیا، اور کسی کو کم بجٹ کا دفاع سب کے سامنے نہ کرنا پڑے۔ جب سب ووٹ دے دیں تو پول بند کر دیں اور جیتنے والا دکھائی دے گا۔ پھر ڈپازٹ آتا ہے۔ جو بُک کرے وہ ادا کرتا ہے اور اسے خرچے کے طور پر شامل کرتا ہے، برابر تقسیم کے ساتھ، اور بقیہ رقم دوسرے خرچے کے طور پر تب درج ہوتی ہے جب واجب ہو۔ باقی لوگ اپنا حصہ فوراً بھیج کر ادائیگی ریکارڈ کر سکتے ہیں، یا آخری حساب کا انتظار کر سکتے ہیں۔ بیلنس دونوں صورتوں میں ایک ہی نکلتے ہیں۔"
  - heading: "جب کوئی صرف ایک رات کے لیے آئے"
    body: "جو دوست صرف ہفتے کے دن (سنیچر) آئے اسے جمعے کا خرچ نہیں دینا چاہیے۔ اسے ان اخراجات سے باہر رکھیں جن میں وہ شامل نہیں تھی۔ جہاں خرچ اس پر منحصر ہو کہ ہر شخص کتنی دیر رکتا ہے، جیسے کمرہ، وہاں **کیسے تقسیم کریں** کے تحت **عین رقمیں** چنیں اور ہر شخص کا حصہ ٹائپ کریں، جس کا مجموعہ کل کے برابر ہو۔ پہلے فی شخص فی رات قیمت نکالیں، پھر اسے ہر شخص کی راتوں سے ضرب دیں۔ [گروپ ٹرپس](page:use-case/group-trips) کے صفحے پر ان اخراجات کے بارے میں مزید ہے جو سب کے لیے ایک جیسے نہیں ہوتے۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ کبھی رقم نہیں منتقل کرتا۔ آپ بینک ٹرانسفر، نقد یا جو بھی مناسب ہو اس سے ایک دوسرے کو ادا کرتے ہیں، پھر ادائیگی ریکارڈ کرتے ہیں تاکہ بیلنس سب کے لیے اپ ڈیٹ ہو جائیں۔"
      - "یہ ادائیگی کی یاددہانیاں نہیں بھیجتا۔ گروپ چیٹ میں دوستانہ یاددہانی پھر بھی کسی انسان کو کرنی ہے۔"
      - "ہر خرچے کا ایک ہی ادا کنندہ ہوتا ہے، اور Side Badger رسید کو سطر بہ سطر نہیں بانٹ سکتا۔ اگر کاٹیج کے لیے دو کارڈوں سے ادائیگی ہوئی تو اسے دو اخراجات کے طور پر درج کریں۔ اگر کچھ لوگوں نے رات کے کھانے میں اضافی چیزیں منگوائیں تو اضافی چیزوں کو الگ خرچے کے طور پر درج کریں۔"
      - "یہ پیسے کا حساب رکھتا ہے، پروگرام کا نہیں۔ پول اور تبصرے اخراجات تک رہتے ہیں، اس لیے ویک اینڈ کے منصوبے آپ کی گروپ چیٹ میں رہتے ہیں۔"
exampleAfter: 2
