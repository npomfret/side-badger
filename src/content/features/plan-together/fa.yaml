sections:
  - heading: "نظرها و واکنش‌ها، کنار عددها"
    body: "هر هزینه رشته نظر خودش را دارد، و همین‌طور گروه، هر فهرست و هر نظرسنجی. بپرسید چرا تاکسی این‌قدر شد، زیر خود تاکسی، نه در گپی که کسی دیگر عقب نمی‌رود. عکس رسید یا PDF رزرو را پیوست کنید، بعد روی هزینه‌ها، پرداخت‌ها و نظرها با لایک، قلب، خنده، شگفتی، ناراحتی یا جشن واکنش نشان دهید. وقتی پرداختی رسید جشنش بگیرید. این نزدیک‌ترین چیز به یک دور تشویق در Side Badger است."
  - heading: "هزینه را بدون راه انداختن دعوا زیر سؤال ببرید"
    body: "وقتی گروه پرسش درباره هزینه‌ها را روشن کرده باشد، هر کسی که در یک هزینه سهم دارد می‌تواند **یک سؤال دارم** را انتخاب کند و دلیلش را بگوید. پرسش به‌صورت نظر روی هزینه ثبت می‌شود، هزینه نشان **زیر سؤال** می‌گیرد و کل هزینه تا رسیدگی به پرسش از مانده‌های همه بیرون می‌رود."
    items:
      - "**روشن کردن.** به‌طور پیش‌فرض خاموش است. مدیر **اجازه پرسش درباره هزینه‌ها** را در تنظیمات گروه، زیر **ویژگی‌ها**، روشن می‌کند."
      - "**بستن.** کسی که پرسیده، یا یک مدیر، **بستن سؤال** را انتخاب می‌کند. اگر چند نفر یک هزینه را زیر سؤال برده باشند، وقتی آخرین پرسش بسته شود هزینه به مانده‌ها برمی‌گردد."
      - "**ویرایش.** وقتی هزینه‌ای ویرایش می‌شود، پرسش باز برای هر کسی که هنوز در آن سهم دارد به نسخه جدید منتقل می‌شود. کسی که ویرایش او را بیرون بگذارد، پرسشش با نسخه قبلی تمام می‌شود، پس چیزی برای بستن نمی‌ماند."
      - "**پیدا کردنشان.** فهرست هزینه‌ها فیلتر **فقط زیر سؤال** را دارد. این مرحله تأیید نیست: فقط هزینه‌هایی نگه داشته می‌شوند که کسی زیر سؤالشان برده، و بقیه از لحظه اضافه شدن حساب می‌شوند."
  - heading: "یک پرسش چطور پیش می‌رود"
    body: "تام £45 شراب مهمانی اضافه می‌کند، که بین هر سه هم‌خانه تقسیم شده. عایشه نمی‌نوشید، پس پرسشی مطرح می‌کند و تا وقتی باز است شراب برای هیچ‌کس حساب نمی‌شود. خانه توافق می‌کند که شراب مال تام و پریاست، پس تام تقسیم را به آن دو نفر ویرایش می‌کند. عایشه دیگر در هزینه نیست، پس پرسشش با نسخه قبلی، که نگه داشته می‌شود، تمام می‌شود و شراب بلافاصله به مانده‌ها برمی‌گردد، با £22.50 برای هر نفر به‌جای £15 برای هر نفر. اگر عایشه در هزینه مانده بود، پرسشش منتقل می‌شد و منتظر می‌ماند تا خودش یا یک مدیر ببندد. پایین، £48 عایشه از £28 خرید و £20 نظافتچی تشکیل شده و £10.50 پریا سهم £70.50 او (£28، £20 و £22.50) منهای £60 است که پرداخته. بحثی کاملاً از نوع [هم‌خانه‌ها](page:use-case/housemates). برای اینکه پرسش را چطور بنویسید، [وقتی کسی هزینه مشترکی را زیر سؤال می‌برد چه کنیم](page:guide/what-to-do-when-someone-disputes-a-shared-expense) را ببینید."
  - heading: "فهرست‌های مشترک، برای خرید"
    body: "در گروه فهرستی شروع کنید، اسمش را مثلاً «فهرست خرید» بگذارید، موردها را اضافه کنید و تیک بزنید. موردها را بکشید تا ترتیب بهتری پیدا کنند، بالا رفتن شمارنده پیشرفت را تماشا کنید و وقتی کسی شیر جو دوسر اشتباهی خرید، زیر فهرست نظر بدهید. فهرست تمام‌شده را برای مرتب شدن آرشیو کنید (**نمایش آرشیو شده** برش می‌گرداند)، یا فهرستی را کپی کنید تا دوباره استفاده شود. فهرست خرید مشترک را کنار صورت‌حساب‌های خرید نگه دارید، تا فهرست بگوید چه بخرید و هزینه بگوید چقدر شد. اینکه چه کسی می‌تواند فهرست بسازد و ویرایش کند به مجوزهای گروه بستگی دارد، که [گروه‌ها و مجوزها](page:feature/groups-and-permissions) توضیح می‌دهد."
  - heading: "نظرسنجی‌ها، اگر خواستید ناشناس"
    body: "از گروه چیزی بپرسید که صورت‌حساب را تعیین می‌کند، مثلاً کدام ویلا، چقدر برای کادو خرج کنید یا اینکه قایق‌سواری می‌ارزد یا نه. نظرسنجی یک پرسش و دو تا ده گزینه دارد. شما انتخاب می‌کنید هر نفر چند رأی دارد، از انتخاب تکی تا ده رأی، و اینکه رأی‌گیری ناشناس باشد یا نه. **رأی‌گیری ناشناس** پنهان می‌کند چه کسی به چه چیزی رأی داده، و وقتی اولین رأی ثبت شد دیگر نمی‌شود تغییرش داد. افراد تا وقتی نظرسنجی بسته نشده می‌توانند رأی‌شان را تغییر دهند یا حذف کنند، و اگر گروه پشیمان شد می‌توانید دوباره بازش کنید. انتخاب ویلا دقیقاً همان چیزی است که [سفرهای گروهی](page:use-case/group-trips) از آن ساخته شده‌اند، و توافق بر سر بودجه کادو برای [مراسم و جشن‌ها](page:use-case/events-and-celebrations) یک کلاسیک است."
  - heading: "تاریخچه فعالیت، تا چیزی بی‌سروصدا عوض نشود"
    body: "هر گروه تاریخچه فعالیتی دارد و زنگ اعلان‌ها فعالیت همه گروه‌های شما را یک‌جا جمع می‌کند. یک هزینه اضافه کنید و همه بلافاصله می‌بینند، بی‌آنکه صفحه را تازه کنند، و تاریخچه نشان می‌دهد چه چیزی عوض شد و چه کسی عوضش کرد. این شامل هزینه‌های اضافه‌شده، ویرایش‌شده یا حذف‌شده، پرسش‌های مطرح‌شده و بسته‌شده، نظرها، تغییرهای فهرست و نظرسنجی، و پرداخت‌های ثبت‌شده است."
  - heading: "اعلان‌های فوری، اگر بخواهید"
    body: "اعلان‌های فوری اختیاری‌اند. آن‌ها را در **تنظیمات** حساب خود، زیر **اعلان‌ها**، روشن کنید تا وقتی در گروه‌هایتان فعالیت تازه‌ای هست، مثل یک هزینه یا نظر جدید، دستگاهتان خبرتان کند. هر دستگاه جداگانه روشن می‌شود و مرورگرتان اول اجازه می‌خواهد. در iPhone یا iPad فقط در برنامه‌ای کار می‌کنند که به صفحه اصلی اضافه شده، که صفحه [برنامه وب](page:feature/web-app) توضیح می‌دهد. آن‌ها را یک امکان رفاهی بدانید، نه یک قول، چون تحویل تضمین نمی‌شود."
limits:
  heading: "محدودیت‌ها"
  items:
    - "نظرها، فهرست‌ها و نظرسنجی‌ها برای پول گروه‌اند. طبق [شرایط خدمات](page:terms) هر چه ارسال می‌شود باید به امور مالی گروه مربوط باشد، پس اینجا جایی برای برنامه‌ریزی خرج است، نه گپ عمومی یا برنامه کارهای روزانه."
    - "یک نظر تا 500 نویسه می‌تواند باشد، با حداکثر سه پیوست که تصویر یا PDF تا 5 MB هرکدام‌اند. فقط نویسنده می‌تواند نظر را حذف کند."
    - "پرسش درباره هزینه‌ها به‌طور پیش‌فرض خاموش است و مدیر آن را برای هر گروه روشن می‌کند. فقط کسانی که در یک هزینه سهم دارند می‌توانند آن را زیر سؤال ببرند، خاموش کردن این امکان همه پرسش‌های باز را پاک می‌کند و تا وقتی هزینه‌ای که در آن سهم دارید پرسش باز دارد هیچ‌کس نمی‌تواند گروه را ترک کند."
    - "یک گروه می‌تواند تا 100 فهرست داشته باشد، هرکدام با حداکثر 200 مورد و هر مورد تا 500 نویسه. مجوزهای گروه تعیین می‌کنند چه کسی می‌تواند فهرست بسازد، ویرایش کند و حذف کند، و گروه قفل‌شده هیچ تغییری را نمی‌پذیرد."
    - "یک گروه می‌تواند تا 50 نظرسنجی داشته باشد، هرکدام با دو تا ده گزینه و حداکثر ده رأی برای هر نفر. نظرسنجی‌ها مهلت ندارند و خودشان بسته نمی‌شوند."
    - "تاریخچه فعالیت 90 روز نگه داشته می‌شود."
    - "اعلان‌های فوری برای هر حساب و هر دستگاه اختیاری‌اند. به مرورگری که از آن‌ها پشتیبانی کند و اجازه شما نیاز دارند، در iPhone و iPad فقط از برنامه‌ای که به صفحه اصلی اضافه شده کار می‌کنند و تحویل تضمین نمی‌شود. هشدار ایمیلی یا پیامکی برای فعالیت وجود ندارد و یادآوری پرداخت هم نیست، پس پیگیری یک پرداخت هنوز با خود شماست."
useCasesHeading: "جایی که برنامه‌ریزی با هم کمک می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "رأی‌ها می‌توانند ناشناس باشند؟"
      a: "بله. هنگام ساختن نظرسنجی **رأی‌گیری ناشناس** را روشن کنید تا پنهان شود چه کسی به چه چیزی رأی داده. پیش از اولین رأی تصمیم بگیرید، چون بعداً نمی‌شود تغییرش داد."
    - q: "نظرسنجی می‌تواند خودش بسته شود؟"
      a: "نه. نظرسنجی مهلت ندارد، پس کسی که ساخته وقتی گروه تصمیم گرفت **بستن نظرسنجی** را انتخاب می‌کند. اگر گروه پشیمان شد، **بازگشایی نظرسنجی** برش می‌گرداند."
    - q: "یک فهرست چند مورد می‌تواند داشته باشد؟"
      a: "تا 200 مورد در هر فهرست و تا 100 فهرست در هر گروه. هر مورد تا 500 نویسه می‌تواند باشد، که کلی شیر جو دوسر است."
    - q: "چه کسی می‌تواند پرسش را ببندد و در این فاصله هزینه چه می‌شود؟"
      a: "کسی که پرسیده، یا یک مدیر گروه. تا وقتی پرسشی باز است، کل هزینه از مانده‌های همه بیرون است. وقتی آخرین پرسش باز روی آن بسته شود، یا ویرایشی فردی را که پرسیده از هزینه بیرون ببرد، هزینه برمی‌گردد."
    - q: "می‌توانم از فهرست‌ها و نظرها به‌جای برنامه کارها یا گپ گروهی استفاده کنم؟"
      a: "نه. نظرها، فهرست‌ها و نظرسنجی‌ها برای پول گروه‌اند، طبق [شرایط خدمات](page:terms). به فهرست‌های خرید، نظرسنجی‌های بودجه و «چرا این £45 است؟» فکر کنید."
    - q: "Side Badger برای فعالیت به من ایمیل می‌زند؟"
      a: "نه. هشدار ایمیلی یا پیامکی برای فعالیت وجود ندارد. می‌توانید اعلان‌های فوری را روی هر دستگاه روشن کنید و زنگ اعلان‌ها در برنامه نشان می‌دهد چه چیزی تازه است."
