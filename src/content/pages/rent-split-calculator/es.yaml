faq:
  heading: Preguntas
  items:
    - q: ¿Qué es más justo, el tamaño de la habitación o los ingresos?
      a: Ninguno lo es siempre. El tamaño de la habitación va bien para compañeros de piso que pagan por el espacio en el que duermen. Los ingresos van bien para parejas y amigos con sueldos muy distintos. Acordadlo antes del primer día de pago del alquiler, no después.
    - q: ¿Hay que dividir las facturas de la misma manera?
      a: Entre compañeros de piso, normalmente no. Todos usan la luz y el internet, así que a partes iguales es más sencillo, como en el ejemplo. Por ingresos, la calculadora da a las facturas las mismas partes que al alquiler.
    - q: ¿Puedo usar pies cuadrados?
      a: Sí. Elige ft² y escribe tus superficies en pies cuadrados. La unidad es solo una etiqueta, y las partes salen igual mientras todos usen la misma.
    - q: ¿Es gratis la calculadora?
      a: Sí. Gratis. Sin anuncios. Sin límites diarios. Tampoco necesitas una cuenta.
