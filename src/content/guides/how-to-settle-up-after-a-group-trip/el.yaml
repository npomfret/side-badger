meta:
  title: "Πώς να τακτοποιηθείτε μετά από ένα ομαδικό ταξίδι | Side Badger"
  description: "Τακτοποιηθείτε πριν σκορπίσουν όλοι. Δέκα μπλεγμένα χρέη γίνονται τέσσερις πληρωμές και μια μερική πληρωμή επιτρέπεται. Με τις πράξεις για πέντε φίλους."
h1: "Πώς να τακτοποιηθείτε μετά από ένα ομαδικό ταξίδι"
navLabel: "Τακτοποίηση μετά το ταξίδι"
lead: "Τακτοποιηθείτε πριν σκορπίσουν όλοι. Προσθέστε το τελευταίο έξοδο, ανοίξτε τα υπόλοιπα της ομάδας και πληρώστε όσα χρωστάτε από τη σύντομη λίστα, όπως θέλετε. Μετά καταγράψτε κάθε πληρωμή στο Side Badger ώστε το υπόλοιπο να μηδενιστεί για ολόκληρη την ομάδα. Για πέντε φίλους και πέντε έξοδα, δέκα μπλεγμένα χρέη γίνονται τέσσερις πληρωμές."
cta:
  heading: "Κλείστε τους λογαριασμούς πριν ανέβουν οι φωτογραφίες"
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα για το επόμενο ταξίδι και προσθέστε κάθε κόστος όπως προκύπτει. Η σύντομη λίστα πληρωμών θα είναι έτοιμη μέχρι να φτάσετε στο αεροδρόμιο. Θέλετε να δείτε πρώτα [πώς λειτουργεί η εκκαθάριση](page:feature/settle-up);"
sections:
  - heading: "Πέντε φίλοι, πέντε έξοδα, μία αίθουσα αναχωρήσεων"
    body: "Ο Μο, η Ινές, ο Ραφ, η Τες και η Ούμα πέρασαν μια εβδομάδα στην ακτή. Ο Μο έκλεισε το διαμέρισμα και αγόρασε τα ψώνια, η Ινές πλήρωσε την εκδρομή με το σκάφος και ο Ραφ πλήρωσε το μεγάλο δείπνο. Η Τες πήρε το ταξί για το αεροδρόμιο μαζί με την Ούμα και τον Μο, επειδή η Ινές και ο Ραφ πήγαν με το τρένο. Η κάρτα της Ούμας έμεινε σπίτι, οπότε δεν πλήρωσε τίποτα. Αυτά είναι πέντε έξοδα και 1.700 € συνολικά και στην αίθουσα αναχωρήσεων κανείς δεν μπορούσε να πει ποιος προηγείται."
  - heading: "Δέκα χρέη, τέσσερις πληρωμές"
    body: "Το διαμέρισμα, το σκάφος, το δείπνο και τα ψώνια μοιράζονται εξίσου στα πέντε. Αυτό κάνει 200 €, 50 €, 60 € και 18 € το άτομο, οπότε η Ινές και ο Ραφ χρωστούν από 328 €. Το ταξί μοιράζεται σε τρεις με 20 € το άτομο, οπότε ο Μο, η Τες και η Ούμα χρωστούν 348 €. Ο Μο πλήρωσε 1.090 € και χρωστά 348 €, οπότε του οφείλονται 742 €. Όλοι οι υπόλοιποι πλήρωσαν λιγότερα από όσα χρωστούν. Η Ούμα υπολείπεται κατά 348 €, η Τες κατά 288 €, η Ινές κατά 78 € και ο Ραφ κατά 28 €, και αυτά κάνουν μαζί τα 742 € του Μο. Αν τακτοποιήσετε κάθε ζευγάρι ανθρώπων απευθείας, βγάζετε δέκα ξεχωριστά χρέη. Το Side Badger προτείνει αντί γι' αυτό τέσσερις πληρωμές, όλες προς τον Μο."
  - heading: "Τακτοποιηθείτε πριν σκορπίσουν όλοι"
    body: "Η καλύτερη στιγμή είναι το τελευταίο βράδυ ή η διαδρομή της επιστροφής, όσο όλοι είναι ακόμα στο ίδιο μέρος και ένα χρέος 28 € είναι εύκολο να το αναφέρει κανείς. Προσθέστε πρώτα κάθε έξοδο, και το ταξί. Κανείς δεν μπορεί να φύγει από μια ομάδα όσο χρωστά ή του οφείλονται χρήματα, οπότε ο λογαριασμός πρέπει κάποια στιγμή να κλείσει ούτως ή άλλως."
    items:
      - "**Ελέγξτε τη λίστα.** Ανοίξτε την ομάδα και δείτε τα **Υπόλοιπα**. Από προεπιλογή βλέπετε τα χρέη που σας αφορούν. Επιλέξτε **Προβολή όλων** για να δείτε τη λίστα ολόκληρης της ομάδας."
      - "**Πληρώστε όπως θέλετε.** Τραπεζική μεταφορά, μετρητά, μια χάρη που χρωστάτε από τις προηγούμενες διακοπές. Το Side Badger δεν μετακινεί τα χρήματα."
      - "**Καταγράψτε την πληρωμή.** Επιλέξτε **Τακτοποίηση**. Στη **Γρήγορη τακτοποίηση** κάθε κουμπί είναι μία από τις προτεινόμενες πληρωμές σας και, αν διαλέξετε ένα, συμπληρώνεται το ποσό. Προσθέστε μια **Σημείωση** όπως «τραπεζική μεταφορά», ελέγξτε την **Ημερομηνία** (δεν μπορεί να είναι στο μέλλον) και επιλέξτε **Καταγραφή Εκκαθάρισης**."
      - "**Δείτε το υπόλοιπο να μηδενίζεται.** Το υπόλοιπο ενημερώνεται για όλους. Όταν μπει η τελευταία πληρωμή, τα **Υπόλοιπα** γράφουν **Όλα τακτοποιημένα!**"
  - heading: "Ένα μέρος τώρα, το υπόλοιπο αργότερα"
    body: "Η Ούμα μπορεί να στείλει 200 € απόψε και τα υπόλοιπα στο τέλος του μήνα. Καταγράφει 200 € και η φόρμα την προειδοποιεί ότι θα χρωστά ακόμα στον Μο 148 € μετά, που είναι 348 € μείον 200 €. Αποθηκεύστε το και τα 148 € μένουν στο υπόλοιπό της μέχρι να καταγράψει τα υπόλοιπα. Η προειδοποίηση λειτουργεί και προς την άλλη κατεύθυνση. Αν ένα μηδενικό παραπάνω κάνει τα 348 € 3.480 €, η φόρμα λέει ότι χρωστά στον Μο μόνο 348 € και ότι η αποθήκευση θα δημιουργούσε χρέος προς την αντίθετη κατεύθυνση. Διορθώστε το μηδενικό πριν αποθηκεύσετε."
  - heading: "Διορθώνοντας λάθη και πανηγυρίζοντας πληρωμές"
    items:
      - "**Μια λάθος πληρωμή.** Μόνο το άτομο που κατέγραψε μια πληρωμή μπορεί να την επεξεργαστεί. Αυτό το άτομο ή ένας διαχειριστής της ομάδας μπορεί να τη διαγράψει και μετά μπορεί να καταγραφεί ξανά."
      - "**Μια πληρωμή που δεν περνά απαρατήρητη.** Κάθε καταγεγραμμένη πληρωμή μένει στις **Εκκαθαρίσεις** με την ημερομηνία και τη σημείωσή της, όπου μπορεί να τη δει και να αντιδράσει ο καθένας στην ομάδα. Ο Μο μπορεί να επιλέξει **Γιορτή** όταν φτάσουν τα τελευταία 148 € της Ούμας."
      - "**Το τέλος.** Όταν κάθε υπόλοιπο είναι μηδέν, ένας διαχειριστής μπορεί να κλειδώσει την ομάδα ώστε τα νούμερα να μείνουν στη θέση τους."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν μετακινεί ποτέ χρήματα. Δεν έχει συνδέσμους πληρωμής ούτε αιτήματα πληρωμής, οπότε μια πληρωμή στην εφαρμογή είναι η καταγραφή μιας πληρωμής που έγινε αλλού."
      - "Δεν στέλνει υπενθυμίσεις. Το κυνήγι μιας καθυστερημένης πληρωμής μένει σε εσάς."
      - "Δεν ορίζει προθεσμίες. Το πότε οφείλεται το υπόλοιπο των 148 € της Ούμας το συμφωνεί η ομάδα."
      - "Οι προτεινόμενες πληρωμές είναι μια σύντομη λίστα και όχι υπόσχεση για τη συντομότερη δυνατή. Υπολογίζονται ανά νόμισμα, οπότε ένα ταξίδι που πληρώθηκε σε ευρώ και λίρες παίρνει μία λίστα για το καθένα."
exampleAfter: 2
