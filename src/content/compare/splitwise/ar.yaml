    - feature: الدفعات ومصرفك
      other: "في بعض الأماكن يستطيع إرسال المال من داخل التطبيق: Splitwise Pay في الولايات المتحدة، وVenmo للأرصدة بالدولار الأمريكي، وPayPal، وPay by Bank في دول أوروبية مختارة، وهو يربط حساباً جارياً شخصياً."
      sideBadger: لا يلمس أموالك أبداً ولا يطلب بيانات مصرفك. الدفع بينكم بالطريقة التي تناسبكم، ثم تسجيل الدفعة.
      source: payments-help
    - feature: المخططات والتقسيمات الافتراضية
      other: كلاهما من ميزات Pro.
      sideBadger: لا شيء منهما.
      source: pro
faq:
  heading: أسئلة
  items:
    - q: هل Side Badger بديل مجاني لـ Splitwise؟
      a: "لتقسيم الفواتير في مجموعة، نعم، وهو يفعل أكثر من الحسابات: تعليقات وأسئلة وقوائم واستطلاعات وأدوار للمجموعة، مع مسح إيصالات وتحويل عملات مجانيين. وإذا كنت تحتاج إلى تطبيق من متجر التطبيقات أو عمل دون اتصال أو دفعات داخل التطبيق، فهذه يفعلها Splitwise ولا يفعلها Side Badger."
    - q: من أين تأتي تفاصيل Splitwise؟
      a: "من صفحات Splitwise نفسها: صفحته الرئيسية وصفحة Pro ومركز المساعدة. ويرتبط كل صف في الجدول بالصفحة التي أُخذ منها، ويبيّن التاريخ فوق الجدول متى قرأناها. ونراجعها كل ربع سنة."
    - q: هل سيبقى Side Badger مجانياً؟
      a: كل ما في Side Badger مجاني اليوم. وإذا تغيّر ذلك يوماً فسنخبرك مسبقاً. وتجد التفاصيل في [صفحة الأسعار](page:pricing).
    - q: هل على كل من في مجموعتي أن ينتقل؟
      a: نعم. يحتاج كل فرد في المجموعة إلى حساب مجاني في Side Badger، ويمكنه الانضمام برابط أو برمز QR.
    - q: هل لدى Side Badger تطبيق للجوال؟
      a: "ليس في متجر تطبيقات. يعمل في متصفحك: سجّل الدخول على هاتفك ثم أضفه إلى شاشتك الرئيسية ليفتح كأنه تطبيق. ويوضح [كيف يعمل](page:how-it-works) الطريقة."
