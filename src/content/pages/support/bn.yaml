meta:
  title: "সাহায্য ও সহায়তা | Side Badger"
  description: "পাসওয়ার্ড ভুলে গেছেন, লিঙ্ক কাজ করছে না, পেমেন্ট ভুল রেকর্ড হয়েছে? Side Badger-এ মানুষ যেখানে আটকে যায় তার ছোট ছোট উত্তর, আর আমাদের কাছে পৌঁছানোর উপায়।"
h1: "সাহায্য ও সহায়তা, হোল্ড মিউজিক ছাড়াই"
navLabel: "সাহায্য ও সহায়তা"
lead: "মানুষ যেসব জায়গায় আটকে যায় তার ছোট ছোট উত্তর, ভুলে যাওয়া পাসওয়ার্ড থেকে শুরু করে একটি গ্রুপ চিরতরে বন্ধ করা পর্যন্ত। প্রতিটি উত্তর থেকে সেই পৃষ্ঠায় যাওয়া যায় যেখানে আরও বিস্তারিত আছে। নিজের প্রশ্নটা খুঁজে পাচ্ছেন না? অ্যাপের ভেতর থেকে আমাদের জানান, অথবা দু-লাইন লিখে পাঠান।"
cta:
  heading: "সাহায্য চাইতে এসেছিলেন, ভাগ করতে থেকে যাবেন?"
  body: "এখনও অ্যাকাউন্ট নেই? গ্রুপ শুরু করুন, লিঙ্ক শেয়ার করুন আর প্রথম খরচটা যোগ করুন। বিনামূল্যে, কোনো বিজ্ঞাপন নেই, দৈনিক কোনো সীমা নেই।"
groups:
  - heading: "সাইন ইন"
    items:
      - q: "পাসওয়ার্ড ভুলে গেছেন?"
        a: "সেরা ব্যাজারদেরও এমন হয়। **সাইন ইন** স্ক্রিনে **পাসওয়ার্ড ভুলে গেছেন?** বেছে নিন, আপনার অ্যাকাউন্টের ইমেইল লিখুন, তারপর আমরা যে ইমেইল পাঠাই তার লিঙ্ক ধরে নতুন পাসওয়ার্ড বেছে নিন। অ্যাকাউন্টে আর কী কী লাগে তা [কীভাবে কাজ করে](page:how-it-works) বলে দেয়।"
      - q: "সাইন আপ করেছি, কিন্তু কিছু যোগ করতে পারছি না। কেন?"
        a: "বেশিরভাগ সময় আপনার ইমেইল এখনও যাচাই হয়নি, তাই যাচাইকরণ ইমেইলের লিঙ্কটি খুলুন, অথবা নতুন একটির জন্য রিমাইন্ডার ব্যানারে **যাচাইকরণ ইমেইল আবার পাঠান** বেছে নিন। যাচাই হয়ে থাকলে গ্রুপটি লক করা থাকতে পারে, অথবা গ্রুপের অনুমতি আপনাকে করতে দিচ্ছে না, আর ভিউয়ার সব দেখে কিন্তু কিছু বদলায় না, যেমন [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) ব্যাখ্যা করে।"
      - q: "আমার ইমেইল বা পাসওয়ার্ড কীভাবে বদলাব?"
        a: "**সেটিংস** খুলে **ইমেইল পরিবর্তন করুন** বা **পাসওয়ার্ড পরিবর্তন করুন** বেছে নিন। দুটোই আগে আপনার বর্তমান পাসওয়ার্ড চায়, আর নতুন ইমেইল ঠিকানা যাচাই করতে হয় সেখানে আমরা যে লিঙ্ক পাঠাই তা দিয়ে। অ্যাকাউন্ট নিয়ে আলোচনা আছে [কীভাবে কাজ করে](page:how-it-works) পৃষ্ঠায়।"
      - q: "Google বা Apple দিয়ে কি সাইন ইন করা যায়?"
        a: "না। লাগে শুধু একটি ইমেইল ঠিকানা আর কমপক্ষে 12 অক্ষরের একটি পাসওয়ার্ড, আর নিজের ফোন বা কম্পিউটারে **আমাকে মনে রাখুন** টিক দিতে পারেন। শুরু করার বাকি কথা [ওয়েব অ্যাপ](page:feature/web-app) পৃষ্ঠায় আছে।"
  - heading: "গ্রুপে যোগ দেওয়া"
    items:
      - q: "কেউ আমাকে আমন্ত্রণ লিঙ্ক পাঠিয়েছে। কীভাবে যোগ দেব?"
        a: "লিঙ্কটি খুলুন, তারপর সাইন ইন করুন বা একটি বিনামূল্যের অ্যাকাউন্ট খুলুন। গ্রুপের একটি প্রিভিউ দেখতে পাবেন, সেখানে মানুষজন আপনাকে যে নামে দেখবে তা বেছে নিন, আর **গ্রুপে যোগ দিন** চাপুন। ভেতরে ঢোকার পুরো পথটা [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) দেখিয়ে দেয়।"
      - q: "লেখা আছে “অনুমোদনের অপেক্ষায়”। আমি কি কিছু ভুল করেছি?"
        a: "মোটেই না। এই গ্রুপে প্রত্যেক নতুন সদস্যকে অ্যাডমিন ঢুকতে দেন, তাই আপনার অনুরোধ গ্রুপের অ্যাডমিনদের কাছে গেছে, আর তাদের কেউ অনুমোদন না দেওয়া পর্যন্ত ভেতরটা দেখতে পাবেন না। সামনাসামনি একটু মনে করিয়ে দেওয়া চলে, আর অনুমোদন কীভাবে কাজ করে তা [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) ব্যাখ্যা করে।"
      - q: "লিঙ্কে লেখা আছে এটি অবৈধ বা মেয়াদ শেষ।"
        a: "আমন্ত্রণ লিঙ্ক ততক্ষণই চলে যতক্ষণ যিনি বানিয়েছেন তিনি ঠিক করেছেন, 15 মিনিট থেকে 5 দিন পর্যন্ত। গ্রুপের কারও কাছে নতুন লিঙ্ক চেয়ে নিন, অথবা একই ঘরে থাকলে QR কোড। আমন্ত্রণ নিয়ে আলোচনা আছে [কীভাবে কাজ করে](page:how-it-works) পৃষ্ঠায়।"
  - heading: "খরচ"
    items:
      - q: "খরচ কীভাবে যোগ করব?"
        a: "গ্রুপটি খুলে **খরচ যোগ করুন** বেছে নিন। বলুন এটা কীসের জন্য ছিল, কত, কে দিয়েছে আর কারা ভাগ নিয়েছে, তারপর সমান ভাগে, সঠিক পরিমাণে বা শতাংশে ভাগ করুন। প্রতিটি বিকল্প ধাপে ধাপে দেখিয়ে দেয় [খরচ ভাগ করা](page:feature/split-expenses)।"
      - q: "ভাড়া কি প্রতি মাসে নিজে থেকে পুনরাবৃত্ত হতে পারে?"
        a: "নিজে থেকে নয়, কারণ পুনরাবৃত্ত খরচ নেই। গত মাসেরটা খুলে **খরচ কপি করুন** বেছে নিন, তাহলে ফর্মটা ভরা অবস্থায় আসে, নতুন তারিখ আর যা বদলেছে তার জন্য তৈরি। কপি করা নিয়ে আরও জানতে দেখুন [খরচ ভাগ করা](page:feature/split-expenses)।"
      - q: "ভুল পরিমাণ লিখে ফেলেছি। শুধরানো যায়?"
        a: "হ্যাঁ। খরচটা সম্পাদনা করুন, যতক্ষণ গ্রুপের অনুমতি আপনাকে করতে দেয় আর গ্রুপ লক করা নেই। আগের সংস্করণ রাখা থাকে, তাই কী বদলেছে সে বিষয়ে কাউকে আপনার কথার ওপর ভরসা করতে হয় না, যেমন [খরচ ভাগ করা](page:feature/split-expenses) ব্যাখ্যা করে।"
      - q: "একটি খরচ ভুল মনে হচ্ছে, আর সেটা আমার নয়। এখন কী করব?"
        a: "খরচটিতে **আমার একটি প্রশ্ন আছে** বেছে নিয়ে কারণ লিখুন, তাহলে যিনি প্রশ্ন করেছেন তিনি বা কোনো অ্যাডমিন প্রশ্নটি বন্ধ করা পর্যন্ত পুরো খরচটা সবার ব্যালেন্সের বাইরে থাকে। এমন বোতাম নেই? শুধু যারা খরচটিতে জড়িত তারাই প্রশ্ন করতে পারে, আগে কোনো অ্যাডমিনকে গ্রুপের সেটিংসে **খরচ সম্পর্কিত প্রশ্নের অনুমতি দিন** চালু করতে হয়, আর কূটনীতির কথাগুলো আছে [আপত্তি তোলা খরচের গাইডে](page:guide/what-to-do-when-someone-disputes-a-shared-expense)।"
  - heading: "পেমেন্ট"
    items:
      - q: "Side Badger কি টাকা পাঠায়?"
        a: "না, Side Badger কখনও টাকা নাড়াচাড়া করে না। ব্যাংক ট্রান্সফার, নগদ বা যা কাজ করে, যেভাবে খুশি একে অপরকে দিন, তারপর পেমেন্টটা রেকর্ড করুন যাতে ব্যালেন্স হালনাগাদ হয়। শুরু থেকে শেষ পর্যন্ত পুরোটা দেখুন [গ্রুপ ট্রিপের পরে কীভাবে হিসাব মেটাবেন](page:guide/how-to-settle-up-after-a-group-trip)।"
      - q: "পেমেন্ট কীভাবে রেকর্ড করব?"
        a: "গ্রুপে **সব শোধ করুন** বেছে নিন, বলুন কে দিয়েছে আর কে পেয়েছে, পরিমাণ লিখুন বা কোনো **কুইক সেটেল** বোতামকে ভরে দিতে দিন, তারপর **সেটেলমেন্ট রেকর্ড করুন** বেছে নিন। শুধু একটি অংশ দিয়েছেন? যা দিয়েছেন সেটাই রেকর্ড করুন, বাকিটা ব্যালেন্সে থাকে, যেমন [হিসাব মেটানো](page:feature/settle-up) ব্যাখ্যা করে।"
      - q: "পেমেন্ট ভুল রেকর্ড করেছি। শুধরানো যায়?"
        a: "যিনি রেকর্ড করেছেন তিনি গ্রুপের **সেটেলমেন্টসমূহ** ইতিহাস থেকে সেটা সম্পাদনা করতে পারেন, আর তিনি বা কোনো অ্যাডমিন সেটা মুছে ফেলতে পারেন, যাতে সেটা ব্যালেন্স থেকে সরে যায়। যে পেমেন্টে এমন কেউ জড়িত যে পরে গ্রুপ ছেড়ে গেছে, সেটা সম্পাদনা করা যায় না। ইতিহাসের কথা আছে [হিসাব মেটানো](page:feature/settle-up) পৃষ্ঠায়।"
  - heading: "বিজ্ঞপ্তি আর হোম স্ক্রিন"
    items:
      - q: "বিজ্ঞপ্তি কীভাবে চালু করব?"
        a: "**সেটিংস** খুলে **পুশ বিজ্ঞপ্তি** চালু করুন আর ব্রাউজার জিজ্ঞেস করলে অনুমতি দিন। ব্রাউজার আগেই আটকে দিয়ে থাকলে আগে তার নিজের সেটিংসে অনুমতি দিন। প্রতিটি ডিভাইস আলাদাভাবে চালু করতে হয় আর পৌঁছানোর নিশ্চয়তা নেই, তাই বিজ্ঞপ্তিকে ধরুন একটি খোঁচা হিসেবে, প্রতিশ্রুতি হিসেবে নয়, যেমন [ওয়েব অ্যাপ](page:feature/web-app) পৃষ্ঠা ব্যাখ্যা করে।"
      - q: "আমার iPhone-এ বিজ্ঞপ্তি কাজ করছে না কেন?"
        a: "iPhone বা iPad-এ এগুলো কাজ করে শুধু হোম স্ক্রিনে যোগ করা অ্যাপে, ব্রাউজার ট্যাবে কখনও নয়। অ্যাপটি যোগ করুন, হোম স্ক্রিনের আইকন থেকে খুলুন, তারপর **সেটিংস** খুলে সেগুলো চালু করুন। এগুলো আপনাকে কী কী জানায় তা দেখায় [একসঙ্গে পরিকল্পনা](page:feature/plan-together)।"
      - q: "ডাউনলোড করার মতো কোনো অ্যাপ আছে?"
        a: "অ্যাপ স্টোরে নেই, কারণ Side Badger আপনার ব্রাউজারে চলে। সাইন ইন করুন, তারপর **সেটিংস** খুলে **হোম স্ক্রিন বা Dock-এ যোগ করুন** অনুসরণ করুন, তাহলে এটি অ্যাপের মতো নিজস্ব একটি উইন্ডোতে খোলে। প্রতিটি ডিভাইসের ধাপ [ওয়েব অ্যাপ](page:feature/web-app) পৃষ্ঠায় আছে।"
  - heading: "ত্যাগ, আর্কাইভ, লক আর বন্ধ করা"
    items:
      - q: "গ্রুপ কীভাবে ছাড়ব?"
        a: "আগে হিসাব মিটিয়ে নিন, তারপর **গ্রুপ ত্যাগ করুন** বেছে নিন। একটিমাত্র মুদ্রাতেও আপনার দেওয়ার বা পাওনা থাকলে, আপনি জড়িত এমন কোনো খরচে প্রশ্ন খোলা থাকলে, অথবা আপনি শেষ অ্যাডমিন বা একমাত্র সদস্য হলে ছেড়ে যাওয়া যায় না, আর ফিরে আসতে নতুন আমন্ত্রণ লাগে। বিস্তারিত আছে [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) পৃষ্ঠায়।"
      - q: "পুরোনো গ্রুপ ড্যাশবোর্ড থেকে কীভাবে সরাব?"
        a: "**গ্রুপ আর্কাইভ করুন** বেছে নিন। এটি শুধু আপনার ড্যাশবোর্ড থেকে সরে যায়, অন্য কারও থেকে নয়, আপনি তবুও এটি খুলে ব্যবহার করতে পারেন, আর **গ্রুপ আনআর্কাইভ করুন** এটিকে ফিরিয়ে আনে। আর্কাইভ, লক আর বন্ধ করার তুলনা আছে [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) পৃষ্ঠায়।"
      - q: "ট্রিপ শেষ। সংখ্যাগুলো বদলানো কি আটকানো যায়?"
        a: "হ্যাঁ। অ্যাডমিন গ্রুপের সেটিংসে **গ্রুপ লক করুন** চালু করতে পারেন, তখন অ্যাডমিন আনলক না করা পর্যন্ত কেউ খরচ যোগ বা সম্পাদনা, নতুন পেমেন্ট রেকর্ড, বা তালিকা ও পোল বদলাতে পারে না। সবাই তবুও গ্রুপ আর তার ইতিহাস পড়তে পারে, আর দেরিতে আসা কোনো ট্যাক্সির ভাড়া চুপিচুপি ঢুকে পড়ে না, যেমন [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) ব্যাখ্যা করে।"
      - q: "গ্রুপ কি মুছে ফেলা যায়?"
        a: "অ্যাডমিন **গ্রুপ বন্ধ করুন** দিয়ে এটি বন্ধ করতে পারেন, নিশ্চিত করতে গ্রুপের নামটি টাইপ করার পর। বন্ধ করা স্থায়ী, আর তাতে গ্রুপটি সবার জন্য অগম্য হয়ে যায়, তাই শুধু চোখের আড়ালে রাখতে চাইলে বরং আর্কাইভ করুন। খুঁটিনাটি আছে [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) পৃষ্ঠায়।"
contact:
  heading: "তবুও আটকে আছেন?"
  items:
    - q: "বাগ পেয়েছেন, বা কিছু বদলাতে চান?"
      a: "অ্যাপের ভেতর থেকেই জানান। আপনার অ্যাকাউন্ট মেনুতে **ফিডব্যাক** বেছে নিন, তারপর **ফিডব্যাক পাঠান**, আর **সমস্যা রিপোর্ট করুন**, **সহায়তা অনুরোধ** বা **ফিচারের অনুরোধ** থেকে একটি বাছুন। কাজে লাগলে একটি স্ক্রিনশট জুড়ে দিন, আর আমরা উত্তর দিলে সেটা একই থ্রেডে পাবেন।"
    - q: "ইমেইল করতে চান?"
      a: "নিচের ঠিকানায় লিখুন। বলুন কোন গ্রুপ নিয়ে, আপনি কী করেছিলেন আর কী হবে বলে আশা করেছিলেন। মনের ঝাল ঝেড়ে নিলে ক্ষতি নেই; পাসওয়ার্ড কিন্তু নয়, তাই নিজেরটা কখনও পাঠাবেন না।"
  emailLabel: "আমাদের ইমেইল ঠিকানা:"
  email: support@sidebadger.me
