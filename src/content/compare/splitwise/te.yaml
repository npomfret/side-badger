sections:
  - heading: "Splitwise బాగా చేసేవి"
    body: "మీ గ్రూప్‌కు నేటివ్ యాప్, ఆఫ్‌లైన్ వాడకం లేదా యాప్ లోపలే పేమెంట్లు కావాలంటే, Splitwise సరైన ఎంపిక, తర్వాత తెలుసుకోవడం కంటే మీరు దాన్ని ఎంచుకోవడమే మాకు ఇష్టం. దాని సొంత పేజీలు ఇవి చెబుతాయి:"
    items:
      - "**యాప్‌లు, ఆఫ్‌లైన్ వాడకం.** వెబ్‌తో పాటు iPhone, Android యాప్‌లు, ఆఫ్‌లైన్ మోడ్."
      - "**పంచడానికి మరిన్ని మార్గాలు.** సమానంగా, కచ్చితంగా, శాతంతో పాటు షేర్లు, సర్దుబాట్లు, అంశాల వారీ పంపకాలు."
      - "**పునరావృత ఖర్చులు.** అద్దె రిపీట్ అయ్యేలా పెట్టి మర్చిపోండి."
      - "**యాప్‌లోనే పేమెంట్లు.** కొన్ని దేశాలలో Splitwise Pay, Venmo, PayPal లేదా Pay by Bank ద్వారా డబ్బును కూడా కదిలించగలదు."
  - heading: "ఇక్కడ ఉచితం, అక్కడ చెల్లింపు"
    body: "Splitwise Pro అనేది Splitwise చెల్లింపు ప్లాన్, దాని సొంత Pro పేజీ Side Badgerలో ఏమీ ఖర్చు కాని నాలుగు విషయాలను అమ్ముతుంది."
    items:
      - "**రసీదు స్కానింగ్.** Splitwise Pro రసీదు ఫొటోను స్కాన్ చేస్తుంది. Side Badger దాన్ని ఉచితంగా చేస్తుంది, స్కాన్ క్రెడిట్లు లేకుండా: మీరు సరిచూసుకోవడానికి మొత్తం, తేదీ, చోటు నింపుతుంది. రసీదు చిత్రాలను Google AI సేవ చదువుతుంది."
      - "**కరెన్సీ మార్పిడి.** మీరు Convert నొక్కినప్పుడు Splitwise Pro గ్రూప్ ఖర్చులను మీ డిఫాల్ట్ కరెన్సీలోకి మారుస్తుంది. Side Badger ప్రతి ఖర్చును మీరు నమోదు చేసేటప్పుడే మారుస్తుంది, ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో లేదా మీకు నిజంగా వచ్చిన రేటుతో, అసలు మొత్తం ఖర్చుపై ఉంటుంది."
      - "**ప్రకటనలు లేవు.** Splitwise పూర్తిగా ప్రకటనలు లేని అనుభవాన్ని Pro ఫీచర్‌గా చూపిస్తుంది. Side Badgerలో ప్రకటనలు లేవు."
      - "**రోజువారీ పరిమితులు లేవు.** Splitwise Pro అపరిమిత ఖర్చులను అమ్ముతుంది, ఉచిత వాడకందారులు రోజుకు 4 ఖర్చులు వరకు జోడించవచ్చని దాని సహాయ కేంద్రం చెబుతుంది. Side Badgerలో రోజువారీ పరిమితులు లేవు."
  - heading: "Side Badgerలో లేనివి, Splitwiseలో ఉన్నవి"
    body: "ఇవి Splitwise ఫీచర్లన్నీ కావు, నిర్ణయించే వాటిలో కొన్నే. పూర్తి జాబితా Splitwise సొంత పేజీలలో ఉంది. Side Badger ఎక్కడ తక్కువ పడుతుందో ఇక్కడ ఉంది."
    items:
      - "**నేటివ్ యాప్‌లు.** Side Badger మీ బ్రౌజర్‌లో పనిచేస్తుంది. సైన్ ఇన్ చేసి, ఆపై హోమ్ స్క్రీన్‌కు జోడించండి, అది యాప్‌లా తెరుచుకుంటుంది."
      - "**ఆఫ్‌లైన్ మోడ్.** Side Badgerకు కనెక్షన్ కావాలి."
      - "**యాప్‌లోనే పేమెంట్లు.** Side Badger మీ డబ్బును ఎప్పుడూ తాకదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి."
      - "**పునరావృత ఖర్చులు.** Side Badgerలో లేవు. బదులుగా గత నెల అద్దెను మళ్లీ టైప్ చేయకుండా కాపీ చేయండి."
      - "**షేర్లు లేదా అంశాల వారీగా పంచడం.** Side Badgerలో ఒక ఖర్చుకు ఒక చెల్లింపుదారు, దాన్ని సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచుతారు. దాని రసీదు స్కానింగ్ అంశాలను వ్యక్తులకు కేటాయించదు."
      - "**చార్ట్‌లు, డిఫాల్ట్ పంపకాలు.** Splitwise Proలో రెండూ ఉన్నాయి. Side Badger ఎవరు ఎవరికి బాకీనో లెక్క ఉంచుతుంది, ట్రిక్ మొత్తం అదే."
  - heading: "మీ గ్రూప్‌ను మార్చుకోవడం"
    body: "ఇంపోర్టర్ లేదు, కాబట్టి మారడం అంటే కొత్తగా మొదలుపెట్టడం. ముందు Splitwiseలో లెక్క తేల్చుకోండి, తర్వాత Side Badgerలో గ్రూప్ చేసి, అందరినీ లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి. గ్రూప్‌లో ప్రతి ఒక్కరికీ ఉచిత ఖాతా కావాలి, సైన్ అప్ చేయడానికి ఇమెయిల్ చిరునామా ఉంటే చాలు."
table:
  heading: "పక్కపక్కనే"
  caption: "{date} నాటికి Splitwise వివరాలు, Splitwise సొంత పేజీల నుండి."
  sourceLabel: "మూలం"
  columns:
    feature: "ఏది"
    other: "Splitwise, దాని సొంత పేజీల ప్రకారం"
    sideBadger: "Side Badger"
  rows:
    - feature: "ఖర్చు"
      other: "Splitwise Pro నెలవారీ లేదా వార్షిక సబ్‌స్క్రిప్షన్. వార్షిక ప్లాన్లలో Trip Pass ఉంటుంది, అది ట్రిప్ గ్రూప్‌కు 30 రోజులు Pro ఫీచర్లను ఇస్తుంది."
      sideBadger: "ఉచితం. ప్రకటనలు లేవు. రోజువారీ పరిమితులు లేవు."
      source: pro-help
    - feature: "రోజుకు ఖర్చులు"
      other: "ఉచిత వాడకందారులు రోజుకు 4 ఖర్చులు వరకు జోడించవచ్చని దాని సహాయ కేంద్రం చెబుతుంది. Proకు రోజువారీ పరిమితి లేదు."
      sideBadger: "రోజువారీ పరిమితులు లేవు."
      source: pro-help
    - feature: "ప్రకటనలు"
      other: "పూర్తిగా ప్రకటనలు లేని అనుభవాన్ని Pro ఫీచర్‌గా చూపిస్తుంది."
      sideBadger: "ప్రకటనలు లేవు."
      source: pro
    - feature: "రసీదు స్కానింగ్"
      other: "Pro ఫీచర్. రసీదు ఫొటోను స్కాన్ చేస్తుంది, Pro అంశాల వారీ విభజన అంశాలను వ్యక్తులకు కేటాయించనిస్తుంది."
      sideBadger: "ఉచితం, స్కాన్ క్రెడిట్లు లేకుండా. మీరు సరిచూసుకోవడానికి మొత్తం, తేదీ, చోటు నింపుతుంది, అంశాలను వ్యక్తులకు కేటాయించదు."
      source: pro
    - feature: "కరెన్సీ మార్పిడి"
      other: "Pro ఫీచర్. Convert నొక్కితే Splitwise గ్రూప్ ఖర్చులను ఆ క్షణపు ఎక్స్ఛేంజ్ రేటుతో మీ డిఫాల్ట్ కరెన్సీలోకి మారుస్తుంది."
      sideBadger: "ఉచితం. ప్రతి ఖర్చును నమోదు చేసేటప్పుడే మార్చండి, ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో లేదా మీకు నిజంగా వచ్చిన రేటుతో. అసలు మొత్తం ఖర్చుపై ఉంటుంది."
      source: currencies-help
    - feature: "ఎక్కడ వాడాలి"
      other: "iPhone, Android యాప్‌లు, వెబ్."
      sideBadger: "మీ బ్రౌజర్‌లో. సైన్ ఇన్ చేసి, ఆపై హోమ్ స్క్రీన్‌కు జోడిస్తే యాప్‌లా తెరుచుకుంటుంది. నేటివ్ యాప్ లేదు."
      source: home
    - feature: "కరెన్సీలు, భాషలు"
      other: "100+ కరెన్సీలు, 7+ భాషలు, దాని హోమ్ పేజీ చెప్పినట్టు."
      sideBadger: "140 కరెన్సీలు, 39 భాషలు. గ్రూప్‌లో ప్రతి ఒక్కరూ తమ భాషను ఎంచుకోవచ్చు."
      source: home
    - feature: "పంచే మార్గాలు"
      other: "సమానంగా, కచ్చితమైన మొత్తాలతో, శాతంతో, షేర్లతో, సర్దుబాటుతో లేదా అంశాల వారీగా."
      sideBadger: "సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో, ఒక ఖర్చుకు ఒక చెల్లింపుదారుతో. షేర్లతో లేదా అంశాల వారీగా కాదు."
      source: split-help
    - feature: "పునరావృత ఖర్చులు"
      other: "ఉన్నాయి: వారానికి, రెండు వారాలకు, నెలకు లేదా ఏడాదికి."
      sideBadger: "లేవు. గత నెల అద్దెను మళ్లీ టైప్ చేయకుండా కాపీ చేయండి."
      source: recurring-help
    - feature: "ఆఫ్‌లైన్ వాడకం"
      other: "ఆఫ్‌లైన్ మోడ్‌ను తన ప్రధాన ఫీచర్లలో ఒకటిగా చెబుతుంది."
      sideBadger: "లేదు. కనెక్షన్ కావాలి."
      source: home
    - feature: "పేమెంట్లు"
      other: "కొన్ని చోట్ల యాప్ లోపలి నుండే డబ్బు పంపగలదు: USలో Splitwise Pay, US డాలర్ బ్యాలెన్స్‌లకు Venmo, PayPal రెండూ, ఎంపిక చేసిన యూరోపియన్ దేశాలలో Pay by Bank. ఇతర చోట్ల బయట చేసిన పేమెంట్‌ను రికార్డ్ చేస్తారు."
      sideBadger: "మీ డబ్బును ఎప్పుడూ తాకదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి."
      source: payments-help
    - feature: "చార్ట్‌లు, డిఫాల్ట్ పంపకాలు"
      other: "రెండూ Pro ఫీచర్లు."
      sideBadger: "రెండూ లేవు."
      source: pro
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "Side Badger Splitwiseకు ఉచిత ప్రత్యామ్నాయమా?"
      a: "గ్రూప్‌లో బిల్లులు పంచడానికి, అవును. రసీదు స్కానింగ్, కరెన్సీ మార్పిడి, ప్రకటనలు లేకపోవడం ఉచితం, రోజువారీ పరిమితులు లేవు. మీకు నేటివ్ యాప్, ఆఫ్‌లైన్ వాడకం, పునరావృత ఖర్చులు లేదా యాప్ లోపలే పేమెంట్లు కావాలంటే, వాటిని Splitwise చేస్తుంది, Side Badger చేయదు."
    - q: "Splitwise వివరాలు ఎక్కడి నుండి వచ్చాయి?"
      a: "Splitwise సొంత పేజీల నుండి: దాని హోమ్ పేజీ, Pro పేజీ, సహాయ కేంద్రం. పట్టికలోని ప్రతి వరుస అది వచ్చిన పేజీకి లింక్ చేస్తుంది, పట్టిక పైన ఉన్న తేదీ మేము వాటిని ఎప్పుడు చదివామో చెబుతుంది. ప్రతి త్రైమాసికం వాటిని మళ్లీ చూస్తాం."
    - q: "Side Badger ఉచితంగానే ఉంటుందా?"
      a: "Side Badgerలో ప్రతిదీ ఈ రోజు ఉచితం, చెల్లింపు శ్రేణి లేదు. అది ఎప్పుడైనా మారితే, ముందు మీకు నోటీసు ఇస్తాం. వివరాలు [ధరల పేజీ](page:pricing)లో ఉన్నాయి."
    - q: "నా గ్రూప్‌లో అందరూ మారాలా?"
      a: "అవును. గ్రూప్‌లో ప్రతి ఒక్కరికీ ఉచిత Side Badger ఖాతా కావాలి, వాళ్లు లింక్ లేదా QR కోడ్‌తో చేరవచ్చు."
    - q: "Side Badgerకు మొబైల్ యాప్ ఉందా?"
      a: "యాప్ స్టోర్‌లో లేదు. ఇది మీ బ్రౌజర్‌లో నడుస్తుంది: మీ ఫోన్‌లో సైన్ ఇన్ చేసి, ఆపై హోమ్ స్క్రీన్‌కు జోడిస్తే యాప్‌లా తెరుచుకుంటుంది. ఎలాగో [ఎలా పనిచేస్తుంది](page:how-it-works) చూపిస్తుంది."
