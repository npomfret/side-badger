meta:
  title: Yhteiset listat, äänestykset ja kommentit kuluille | Side Badger
  description: Kommentoi kuluja, kyseenalaista outo kulu, pidä yhteistä ostoslistaa ja äänestä huvilasta. Suunnitelkaa menot yhdessä, jakakaa sitten. Ilmainen, ei mainoksia.
h1: Suunnitelkaa yhdessä, jakakaa jälkikäteen
navLabel: Suunnitelkaa yhdessä
lead: Ostoslista ja ostoslasku, vihdoin puheväleissä. Side Badger antaa ryhmällesi paikan puhua rahasta ennen menoja ja niiden jälkeen. Jokaisella kululla on kommentit, outoa kulua voi kyseenalaistaa, ja isoihin päätöksiin on yhteiset listat ja äänestykset. Sitten [jaatte kulut](page:feature/split-expenses) kuten ennenkin.
cta:
  heading: Suunnittele ensin, jaa sitten
  body: Luo ilmainen tili, perusta ryhmä ja laita ensimmäinen lista, äänestys tai kysymys heti rahan viereen. Etkö ole varma, mitä seuraavaksi tapahtuu? Katso [näin se toimii](page:how-it-works).
problem:
  heading: Keskustelu on täällä, lasku tuolla
  body: Ryhmän rahankäyttö asuu yleensä kahdessa paikassa. Luvut ovat yhdessä, ja kiista luvuista käydään chatissa, joka vieri pois tiistaina. Ostoslista on valokuva jääkaapista. Huvila päätettiin useimpien peukulla, luultavasti. Side Badger pitää suunnittelun ryhmässä, niiden kulujen vieressä, joita se koskee. Kommentti on siellä, missä kulu on, lista siellä, missä kauppa, äänestys isoa päätöstä varten ja tapa sanoa ”hetkinen, onko tämä oikein?” kirjoittamatta kokonaista kappaletta. Kaikki koskee ryhmän rahoja, ja sitä varten ryhmä on olemassa.
workflow:
  heading: Huvilaäänestyksestä ostoslaskuun
  steps:
    - title: Laita iso päätös äänestykseen
      body: Lisää äänestys päätökselle, joka määrää laskun, kuten mikä huvila. Valitse kahdesta kymmeneen vaihtoehtoa, kerro, montako ääntä kukin saa, ja sulje äänestys, kun kaikki ovat äänestäneet, jolloin voittaja merkitään.
      shot: S17
      shotAlt: Suljettu äänestys, jossa voittanut vaihtoehto on merkitty ja kunkin vaihtoehdon vieressä äänimäärä
    - title: Kirjoittakaa ostoslista yhdessä
      body: Aloita yhteinen lista, lisää tuotteet ja rastita ne, kun ne päätyvät kärryyn. Kauppareissu kirjataan perään kuluna.
      shot: S16
      shotAlt: Yhteinen ostoslista, jossa osa tuotteista on rastitettu, sekä edistymislaskuri
    - title: Puhukaa kustannuksesta siellä, missä se asuu
      body: Kommentoi itse kulua, liitä kuitti ja reagoi emojilla. Keskustelu pysyy sen luvun vieressä, jota se koskee.
      shot: S08
      shotAlt: Kulu tietoineen, kuitin pienoiskuva, kommenttiketju ja emoji-reaktioita
    - title: Kyseenalaista se, joka näyttää oudolta
      body: Jos ryhmä on ottanut kulukysymykset käyttöön, kuka tahansa kuluun kuuluva voi valita **Minulla on kysymys**. Kulu pysyy poissa saldoista, kunnes kysymys on selvitetty.
      shot: S18
      shotAlt: Kululista, jossa Kyseenalaistettu-merkki ja Vain kyseenalaistettu -suodatin
    - title: Katso, mikä muuttui ja kuka muutti
      body: Toimintasyöte ja ilmoituskello näyttävät, mitä uutta on kaikissa ryhmissäsi. Push-ilmoitukset ovat käytettävissä, jos haluat ne.
      shot: S19
      shotAlt: Ilmoitusvalikko, jossa lista viimeaikaisesta toiminnasta
