meta:
  title: Mag-settle up nang mas kaunting bayad | Side Badger
  description: Tingnan kung sino ang may utang kanino sa grupo mo, kumuha ng maikling listahan ng mga bayad na nagse-settle sa lahat, at itala ang bawat bayad habang nangyayari. Libreng gamitin.
h1: Mag-settle up nang mas kaunting bayad
navLabel: Mag-settle up
lead: Nagtatabi ang Side Badger ng tumatakbong balanse para sa bawat isa sa grupo at nagmumungkahi ng maikling listahan ng mga bayad na nagse-settle nito. Magbayaran kayo sa paraang gusto ninyo, saka itala. Kung gusto mo munang makita kung paano hinahati ang mga numero, magsimula sa [paghahati ng gastos](page:feature/split-expenses).
cta:
  heading: Handa nang ayusin kung sino ang may utang kanino?
  body: Gumawa ng account, magsimula ng grupo, at idagdag ang unang gastos. Ang mga balanse na ang bahala sa susunod.
problem:
  heading: Mga balanse na nag-a-update habang tumatakbo
  body: Binabago ng bawat gastos kung sino ang may utang kanino, kaya pinananatiling napapanahon ng Side Badger ang mga balanse habang nadadagdagan ang mga gastos at bayad. Agad na nakikita ng lahat sa grupo ang pagbabago, pati kung ano ang nagbago at kung sino ang nagbago. Magkakahiwalay ang mga balanse sa bawat pera, kaya nananatili sa sarili nilang hanay ang euro at pounds maliban kung na-convert ang gastos nang ilagay ito. Bilang default, nakikita mo ang mga utang na kinasasangkutan mo; inilista ng **Ipakita lahat** ang buong grupo.
workflow:
  heading: Tatlong hakbang hanggang quits
  steps:
    - title: Tingnan kung sino ang may utang kanino
      body: Buksan ang mga balanse ng grupo para makita ang utang mo, ang dapat mong makuha, at maikling listahan ng mga bayad na nagse-settle sa lahat, na kinukuwenta sa bawat pera. Nananatili sa labas ng mga kuwenta ang mga gastos na may tanong hanggang maayos ang mga ito. Sa halimbawa ng housemates sa ibaba, nagiging dalawa ang anim na bayad.
      shot: S10
      shotAlt: Ang screen ng mga balanse na nagpapakita ng pinasimpleng mga utang sa dalawang pera, nakabukas ang Ipakita lahat
    - title: Magbayad sa paraang gusto mo, saka itala
      body: Bank transfer, cash, o utang na loob mula sa nakaraang bakasyon. Hindi inililipat ng Side Badger ang pera. Kapag naipasa na ang pera, itala ang bayad at mag-a-update ang balanse para sa lahat.
      shot: S11
      shotAlt: Ang payment form na may mga quick-settle button at ang paunawang ipinapakita sa bahagyang bayad
    - title: Tiyaking dumating
      body: Napupunta ang bayad sa kasaysayan ng grupo, kung saan makikita ito ng lahat at puwedeng mag-react gamit ang emoji. Ipagdiwang ang bayad kapag dumating ito.
      shot: S12
      shotAlt: Ang kasaysayan ng bayad na may mga emoji reaction sa isang bayad
