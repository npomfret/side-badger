meta:
  title: "Як розділити віллу за різною кількістю ночей | Side Badger"
  description: "Дев приїхав лише на три ночі, то чому платити за шість? Поділіть віллу за ночами, які люди справді там провели, а розрахунки зробить застосунок."
h1: "Як розділити віллу на відпочинку, коли люди живуть різну кількість ночей"
navLabel: "Вілла за ночами"
lead: "Визначте ціну за людину за ніч, помножте на кількість ночей кожного й уведіть віллу як **одну витрату з точними сумами**. Side Badger веде облік і підказує короткий список платежів, коли настає час розрахуватися."
cta:
  heading: "Дайте віллі одну охайну витрату"
  body: "Заведіть групу, запросіть усіх за посиланням чи QR-кодом і внесіть віллу з точними сумами. Side Badger веде поточний облік, поки ви відпочиваєте."
sections:
  - heading: "Шість ночей, четверо людей, одна кредитна картка"
    body: "[Поїздка групою](page:use-case/group-trips) зазвичай починається з чиєїсь картки. Тут це картка Ани. Вона бронює віллу на шість ночей за 2 100 €, бо хтось має зробити перший крок. Ана, Бен і Хлоя живуть усі шість ночей. Дев може приєднатися лише на останні три й приїздить потягом. Бен орендує авто, в якому Дев жодного разу не сидить. Дев робить велику закупівлю продуктів. Розділити віллу на чотирьох — очевидний хід. Тоді Дев платить за три ночі, які провів удома, а такі речі спливають на Різдво. Розподіл за ночами уникає суперечки, а на арифметику йде хвилина."
  - heading: "Визначте ціну однієї людино-ночі"
    body: "Людино-ніч — це одна людина, яка провела одну ніч. Вілла коштує стільки, скільки коштує, тож розділіть ціну на всі людино-ночі, а потім віддайте кожному ті, якими він скористався."
    items:
      - "**Порахуйте людино-ночі.** Ана, Бен і Хлоя живуть по шість ночей, а Дев — три: 6 + 6 + 6 + 3 = 21."
      - "**Визначте ціну однієї.** 2 100 € ÷ 21 = 100 € за людино-ніч."
      - "**Помножте на ночі кожного.** Ана, Бен і Хлоя платять по 6 × 100 € = 600 €. Дев платить 3 × 100 € = 300 €."
      - "**Перевірте підсумок.** 600 € + 600 € + 600 € + 300 € = 2 100 €. Якщо ваші частки не дають у сумі ціни, якусь ніч пропущено або пораховано двічі."
  - heading: "Уведіть це в Side Badger"
    body: "Заведіть групу, запросіть решту трьох за посиланням чи QR-кодом, а потім додайте витрати. Спершу вілла."
    items:
      - "Оберіть **Додати витрату**. Опишіть її, уведіть 2 100 і в полі **Хто заплатив?** виберіть Ану."
      - "У полі **Розділити між** переконайтеся, що там усі четверо."
      - "У полі **Як розділити** оберіть **Точні суми**. Уведіть 600 для Ани, Бена й Хлої та 300 для Дева. Суми мають дорівнювати загальній."
      - "Оберіть **Зберегти витрату**."
      - "Додайте оренду авто так само. Заплатив Бен, розподіл **Порівну**, а Дева виключено, бо він приїхав потягом. Про інші способи ділити витрати читайте в [розподілі витрат](page:feature/split-expenses)."
      - "Додайте продукти. Заплатив Дев, розподіл **Порівну**, і всі четверо в ньому."
  - heading: "Прочитайте результат і розрахуйтеся"
    body: "Рахунок кожного — це його частка за віллу плюс частка авто й закупівлі. Ана, Бен і Хлоя мають по 725 €, тобто 600 € + 80 € + 45 €. Дев має 345 €, тобто 300 € + 45 €. Відніміть те, що кожен заплатив, і баланси виходять самі. Ана заплатила 2 100 €, тож їй винні 1 375 €. Бен заплатив 240 € і винен 485 €. Дев заплатив 180 € і винен 165 €. Хлоя не платила нічого й винна 725 €. Якщо їх не чіпати, ці борги розбіглися б по групі шістьма напрямками. Натомість Side Badger підказує три платежі, усі Ані. Заплатіть їй як зручно, потім оберіть **Розрахуватися** і для кожного платежу скористайтеся **Записати розрахунок**, щоб баланси наздогнали. Кнопки швидкого розрахунку підставляють суму. Більше про [розрахунок](page:feature/settle-up)."
  - heading: "Коли вілла має не одну охайну ціну"
    items:
      - "**Кімнати різні.** Якщо люкс вартує більше за комірку, спершу домовтеся, скільки коштує кожна кімната, а потім робіть розрахунок людино-ночей по одній кімнаті. Уведіть віллу однією витратою із загальною сумою кожного або по одній витраті на кімнату. Так чи так точні суми витрати мають дорівнювати її загальній сумі."
      - "**Завдаток, сплачений місяці тому.** Хто його заплатив, отримує окрему витрату з датою, коли заплатив. Поділіть її за ночами в тих самих пропорціях, що й решту."
      - "**Бронювання в іншій валюті.** Уведіть віллу у валюті, у якій платили. Якщо група конвертує по ходу, використайте актуальний курс обміну або введіть курс, який ви справді отримали. Початкова сума лишається біля витрати. Подробиці в розділі про [кілька валют](page:feature/multiple-currencies)."
      - "**Неповні ночі.** Хтось приїздить опівночі, хтось їде до сніданку. Домовтеся про одне правило підрахунку ночей і застосуйте його до всіх."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він не рахує ночі за вас. Розподілу за ночами чи за частками немає, тож кожну суму ви обчислюєте, як вище, і вводите **точні суми**."
      - "Він не переказує гроші. Платіть одне одному як зручно, а потім запишіть платіж."
      - "На одну витрату припадає один платник. Якщо за віллу заплатили двоє, внесіть дві витрати."
      - "У ньому немає гостьового доступу. Кожен у групі, зокрема Дев, потребує безкоштовного облікового запису."
