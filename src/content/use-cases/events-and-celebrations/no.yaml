featuresHeading: Funksjonene dette bruker
faq:
  heading: Spørsmål
  items:
    - q: Kan gjester se gruppen uten å bli med?
      a: Nei. Folk blir med via en lenke eller QR-kode og en gratis konto, så de kan se gruppen når de er inne.
    - q: Kan Side Badger kreve inn pengene?
      a: Nei. Side Badger fører regnskapet og flytter aldri penger. Betal hverandre slik dere vil, og registrer så betalingen. Det er gratis, uten annonser og uten daglige grenser; se [priser](page:pricing).
    - q: Kan stemmene være anonyme?
      a: Ja. Når du oppretter en avstemning, kan du skjule hvem som stemte på hva. Innstillingene kan bare endres før den første stemmen.
    - q: Kan folk bidra med ulike beløp?
      a: Ja. Del en utgift etter nøyaktige beløp, så hver persons andel er tallet dere ble enige om, eller la dem som ikke var involvert stå utenfor.
    - q: Kan en arrangør føre regnskapet?
      a: Ja. Bruk forhåndsinnstillingen for administrert gruppe, slik at bare opprettere og administratorer endrer utgifter og administratorer godkjenner nye medlemmer.
