sections:
  - heading: "Lugha 39, na imejengwa kwa watu zaidi"
    body: "Tumia Side Badger kwa lugha 39, zikiwemo Kiarabu, Kiajemi na Kiurdu zinazoandikwa kutoka kulia kwenda kushoto. Kila mtu kwenye kikundi anaweza kuchagua lugha yake, kwa hivyo ukurasa wa kikundi unaweza kuwa kwa Kiarabu kwa mtu mmoja na kwa Kiingereza kwa mwingine. Pia imejengwa ikiwafikiria watumiaji wa kibodi na visoma-skrini, na rangi za wanachama huja na michoro, ili usilazimike kutofautisha kijani na nyekundu."
faq:
  heading: "Maswali"
  items:
    - q: "Je, kila mtu anahitaji akaunti?"
      a: "Ndiyo, ya bure. Kila mtu anathibitisha barua pepe yake kabla ya kuongeza chochote."
    - q: "Je, kuna programu?"
      a: "Inafanya kazi kwenye kivinjari. Ingia, kisha iongeze kwenye skrini yako ya mwanzo au dock ili ifunguke kama programu. Mipangilio ndani ya programu inakuonyesha jinsi. Hakuna toleo la duka la programu wala hali ya nje ya mtandao."
    - q: "Je, Side Badger inasogeza pesa?"
      a: "Hapana. Inaweka hesabu na kupendekeza malipo, nanyi mnalipana mtakavyo. Kisha mnarekodi malipo. Tazama [kumaliza hesabu](page:feature/settle-up)."
    - q: "Je, mtu anaweza kuondoka akiwa na deni?"
      a: "Hapana. Hakuna anayeweza kuondoka kwenye kikundi akiwa bado anadaiwa au anadai pesa, kwa hivyo hukamilisha hesabu kwanza."
    - q: "Watu wangapi wanaweza kujiunga na kikundi?"
      a: "Hadi watu 50 kwenye kikundi. Waalike kwa kiungo au msimbo wa QR, na washa idhini ukitaka msimamizi amruhusu kila mtu aingie."
    - q: "Vipi kuhusu safari zenye sarafu zaidi ya moja?"
      a: "Salio huwekwa kando kwa kila sarafu. Tazama [sarafu nyingi](page:feature/multiple-currencies)."
