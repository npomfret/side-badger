faq:
  heading: "Ceisteanna"
  items:
    - q: "Cé ba cheart íocaíocht a thaifeadadh, an té a íocann nó an té a íoctar?"
      a: "Teastaíonn cead costais a chur in eagar chun íocaíocht a thaifeadadh, agus fiafraíonn an fhoirm **Cé a d'íoc?** agus **Cé a fuair an íocaíocht?** Ní féidir ach leis an duine a thaifead í a chur in eagar ina dhiaidh sin, mar sin is é is simplí de ghnáth go ndéanann an t-íocóir é, leis an gcnaipe **Socrú gasta**."
    - q: "Cad má bhí an turas ar siúl i dhá airgeadra?"
      a: "Coinnítear iarmhéideanna in aghaidh an airgeadra, mar sin fanann fiach in euro ina fhiach in euro agus faigheann gach airgeadra a liosta gearr féin, mura ndearnadh costais a thiontú nuair a cuireadh isteach iad. Taispeánann [turais i roinnt airgeadraí](page:guide/how-to-split-a-trip-paid-in-several-currencies) an dá bhealach."
    - q: "An ceart dúinn socrú le linn an turais nó ag an deireadh?"
      a: "Oibríonn ceachtar acu. Athraíonn gach íocaíocht a taifeadadh na hiarmhéideanna, mar sin áirítear íocaíocht a rinneadh i lár an turais sa liosta deiridh. Tá sé níos simplí ag an deireadh, mar tá [an turas ar fad](page:use-case/group-trips) in aon áit amháin."
