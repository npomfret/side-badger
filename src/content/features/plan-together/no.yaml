sections:
  - heading: Kommentarer og reaksjoner, ved siden av tallene
    body: Hver utgift har sin egen kommentartråd, og det har gruppen, hver liste og hver avstemning også. Spør hvorfor taxien kostet så mye under taxien, ikke i en chat ingen blar tilbake i. Legg ved et bilde av kvitteringen eller en PDF av bookingen, og reager med tommel opp, hjerte, latter, wow, trist eller feiring på utgifter, betalinger og kommentarer. Feir en betaling når den kommer frem. Det er det nærmeste Side Badger kommer en applausrunde.
  - heading: Still spørsmål ved en utgift uten å starte krangel
    body: Når gruppen har utgiftsspørsmål slått på, kan alle som er med i en utgift velge **Jeg har et spørsmål** og si hvorfor. Spørsmålet legges ut som en kommentar på utgiften, utgiften får merket **Stilt spørsmål ved**, og hele utgiften faller ut av alles saldoer til spørsmålet er avklart.
    items:
      - "**Slå det på.** Det er av som standard. En administrator slår på **Tillat spørsmål om utgifter** i gruppens innstillinger, under **Funksjoner**."
      - "**Lukke det.** Den som spurte, eller en administrator, velger **Lukk spørsmålet**. Hvis flere har stilt spørsmål ved den samme utgiften, går den tilbake i saldoene når det siste spørsmålet er lukket."
      - "**Redigere det.** Når en utgift redigeres, følger et åpent spørsmål med til den nye versjonen for alle som fortsatt har en andel i den. Den som redigeringen lar falle utenfor, får spørsmålet sitt avsluttet sammen med den gamle versjonen, så det er ingenting igjen for vedkommende å lukke."
      - "**Finne dem.** Utgiftslisten har filteret **Kun stilt spørsmål ved**. Dette er ikke et godkjenningstrinn: bare utgiftene noen stiller spørsmål ved, holdes tilbake, og alt annet teller med en gang det legges til."
  - heading: Slik forløper et spørsmål
    body: Tom legger inn 45 £ i festvin, delt mellom alle tre romkameratene. Aisha drakk ikke, så hun tar opp et spørsmål, og mens det er åpent, teller vinen for ingen. Huset blir enige om at vinen er Toms og Priyas, så Tom redigerer delingen til de to. Aisha er ikke lenger med i utgiften, så spørsmålet hennes avsluttes sammen med den tidligere versjonen, som blir bevart, og vinen er tilbake i saldoene med en gang, med 22,50 £ hver i stedet for 15 £ hver. Hadde Aisha blitt værende i utgiften, ville spørsmålet hennes ha fulgt med og ventet på at hun eller en administrator lukket det. Nedenfor består Aishas 48 £ av 28 £ fra handleturen og 20 £ fra vaskehjelpen, og Priyas 10,50 £ er hennes andel på 70,50 £ (28 £, 20 £ og 22,50 £) minus de 60 £ hun betalte. En krangel som er typisk for [romkamerater](page:use-case/housemates). For hvordan du formulerer et spørsmål, se [hva du gjør når noen bestrider en delt utgift](page:guide/what-to-do-when-someone-disputes-a-shared-expense).
  - heading: Delte lister, til handlingen
    body: Start en liste i gruppen, kall den noe som Handleliste, legg til varer og kryss dem av. Dra varer til en bedre rekkefølge, se fremdriftstelleren stige og kommenter listen når noen kjøper feil havremelk. Arkiver en ferdig liste for å rydde den bort (**Vis arkiverte** henter den tilbake), eller kopier en liste for å bruke den på nytt. Ha den felles handlelisten ved siden av handleregningene, så listen sier hva som skal kjøpes og utgiften sier hva det kostet. Hvem som kan opprette og redigere lister, avhenger av gruppens tillatelser, som [grupper og tillatelser](page:feature/groups-and-permissions) forklarer.
  - heading: Avstemninger, anonyme hvis du vil
    body: Spør gruppen om noe som avgjør regningen, for eksempel hvilken villa, hvor mye gaven skal koste eller om båtturen er verdt det. En avstemning har et spørsmål og to til ti alternativer. Du velger hvor mange stemmer hver person får, fra ett enkelt valg opp til ti, og om stemmegivingen er anonym. **Anonym avstemning** skjuler hvem som stemte på hva, og kan ikke endres etter at den første stemmen er inne. Folk kan endre eller fjerne stemmen sin til avstemningen lukkes, og du kan åpne den igjen hvis gruppen får betenkeligheter. Å velge villa er akkurat det [gruppereiser](page:use-case/group-trips) er laget av, og å bli enige om gavebudsjettet er en klassiker for [arrangementer og feiringer](page:use-case/events-and-celebrations).
  - heading: Aktivitetsloggen, så ingenting endres i det stille
    body: Hver gruppe har en aktivitetshistorikk, og varselklokken samler aktivitet fra alle gruppene dine på ett sted. Legg til en utgift, så ser alle den med en gang, uten å laste siden på nytt, og loggen viser hva som endret seg og hvem som endret det. Det gjelder utgifter som er lagt til, redigert eller slettet, spørsmål som er tatt opp og lukket, kommentarer, endringer i lister og avstemninger og registrerte betalinger.
  - heading: Pushvarsler, hvis du vil ha dem
    body: Pushvarsler er valgfrie. Slå dem på i kontoens **Innstillinger**, under **Varsler**, så gir enheten beskjed når det er ny aktivitet i gruppene dine, for eksempel en ny utgift eller en kommentar. Hver enhet slås på for seg, og nettleseren din ber om tillatelse først. På iPhone og iPad fungerer de bare i appen som er lagt til på Hjem-skjermen, som siden om [nettappen](page:feature/web-app) forklarer. Se på dem som en bekvemmelighet, ikke et løfte, for levering er ikke garantert.
limits:
  heading: Grenser
  items:
    - Kommentarer, lister og avstemninger er for gruppens penger. [Vilkårene](page:terms) ber om at alt som legges ut, handler om gruppens økonomi, så dette er et sted å planlegge utgiftene, ikke en generell chat eller en gjøremålsapp.
    - En kommentar kan være opptil 500 tegn, med opptil tre vedlegg som er bilder eller PDF-er på opptil 5 MB hver. Bare forfatteren kan slette en kommentar.
    - Utgiftsspørsmål er av som standard, og en administrator slår dem på for hver gruppe. Bare personer som er med i en utgift, kan stille spørsmål ved den, å slå funksjonen av fjerner alle åpne spørsmål, og ingen kan forlate gruppen mens en utgift de er med i, har et åpent spørsmål.
    - En gruppe kan ha opptil 100 lister, hver med opptil 200 elementer på opptil 500 tegn. Gruppens tillatelser avgjør hvem som kan opprette, redigere og slette lister, og en låst gruppe tillater ingen endringer.
    - En gruppe kan ha opptil 50 avstemninger, hver med to til ti alternativer og opptil ti stemmer per person. Avstemninger har ingen frist og lukkes ikke av seg selv.
    - Aktivitetshistorikken beholdes i 90 dager.
    - Pushvarsler må slås på for hver konto og hver enhet. De krever en nettleser som støtter dem og din tillatelse, de fungerer på iPhone og iPad bare fra appen som er lagt til på Hjem-skjermen, og levering er ikke garantert. Det finnes ingen e-post- eller SMS-varsler for aktivitet og ingen betalingspåminnelser, så det er fortsatt opp til deg å purre på en betaling.
useCasesHeading: Der det hjelper å planlegge sammen
faq:
  heading: Spørsmål
  items:
    - q: Kan stemmene være anonyme?
      a: Ja. Slå på **Anonym avstemning** når du oppretter avstemningen, så skjules det hvem som stemte på hva. Bestem deg før den første stemmen, for det kan ikke endres etterpå.
    - q: Kan en avstemning lukkes av seg selv?
      a: Nei. En avstemning har ingen frist, så den som opprettet den, velger **Lukk avstemning** når gruppen har bestemt seg. Hvis gruppen får betenkeligheter, henter **Gjenåpne avstemning** den tilbake.
    - q: Hvor mange elementer kan en liste ha?
      a: Opptil 200 elementer per liste og opptil 100 lister per gruppe. Hvert element kan være opptil 500 tegn, som er mye havremelk.
    - q: Hvem kan lukke et spørsmål, og hva skjer med utgiften i mellomtiden?
      a: Den som spurte, eller en gruppeadministrator. Mens et spørsmål er åpent, er hele utgiften utenfor alles saldoer. Den kommer tilbake når det siste åpne spørsmålet på den er lukket, eller når en redigering tar den som spurte, ut av utgiften.
    - q: Kan jeg bruke lister og kommentarer som en gjøremålsapp eller en gruppechat?
      a: Nei. Kommentarer, lister og avstemninger er for gruppens penger, som [vilkårene](page:terms) ber om. Tenk handlelister, budsjettavstemninger og «hvorfor er dette 45 £?».
    - q: Sender Side Badger meg e-post om aktivitet?
      a: Nei. Det finnes ingen e-post- eller SMS-varsler for aktivitet. Du kan slå på pushvarsler på hver enhet, og varselklokken i appen viser hva som er nytt.
