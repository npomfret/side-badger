faq:
  heading: "Mga tanong tungkol sa villa"
  items:
    - q: "Paano kung may magka-cancel?"
      a: "Alisin ang mga gabi nila, ulitin ang kuwenta, at i-edit ang gastos ng villa para umabot ulit sa presyo ang mga eksaktong halaga. Iniingatan ang naunang bersyon at makikita ang pag-edit sa aktibidad ng grupo, kaya walang tahimik na magbabago ng numero. Nakadepende sa mga pahintulot ng grupo kung sino ang puwedeng mag-edit."
    - q: "Dapat bang mas mababa ang bayad ng nag-book?"
      a: "Ang grupo ang magpapasya niyan. Abala ang pag-book, at magkakaiba ang mga grupo kung dapat ba itong may diskwento. Anuman ang pagkasunduan ninyo, ilagay ito sa mga eksaktong halaga at isulat sa tala ng gastos, o sa komento sa tabi nito, para walang kailangang tandaan ang kasunduan."
    - q: "Puwede bang iba ang hati ng cleaning fee?"
      a: "Oo. Ilagay ang bayad bilang hiwalay na gastos at bigyan ito ng sarili nitong hati. Bagay ang pantay na hati sa flat fee para sa buong bahay. Bagay ang eksaktong halaga sa grupong gustong sumunod din sa dami ng gabi ang bayad."
