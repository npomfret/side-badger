meta:
  title: "اخراجات برابر، عین رقم یا فیصد کے مطابق تقسیم کریں | Side Badger"
  description: "مشترکہ خرچہ برابر، عین رقم یا فیصد کے مطابق تقسیم کریں، اور جو موجود نہیں تھا اسے نکال دیں۔ مفت، بغیر اشتہارات اور بغیر یومیہ حد کے۔"
h1: "اخراجات برابر، عین رقم یا فیصد کے مطابق تقسیم کریں"
navLabel: "اخراجات کی تقسیم"
lead: "ہر چیز آدھی آدھی نہیں ہوتی۔ Side Badger سنبھال لیتا ہے۔ بتائیں کس نے ادا کیا، خرچے میں شریک لوگوں کو چنیں، اور اسے **برابر، عین رقم یا فیصد کے مطابق** تقسیم کریں۔ رنجشیں الگ سے بکتی ہیں۔"
cta:
  heading: "اگلا خرچہ ٹھیک سے تقسیم کریں"
  body: "مفت اکاؤنٹ بنائیں، گروپ شروع کریں اور وہ خرچہ شامل کریں جسے آپ نمٹانے کا سوچ رہے تھے۔ یقین نہیں آگے کیا ہوتا ہے؟ [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں، یا دیکھیں [مفت میں کیا شامل ہے](page:pricing)۔"
  button: "مفت اکاؤنٹ بنائیں"
problem:
  heading: "ہر چیز آدھی آدھی نہیں ہوتی"
  body: "کرایہ کمرے کے سائز کے حساب سے ہوتا ہے۔ تحفہ اس کے حساب سے جس نے جو وعدہ کیا۔ ڈنر اس کے حساب سے جو میٹھے تک رکا۔ بل آدھا آدھا کرنا اس وقت تک چلتا ہے جب تک پہلا ایسا بل نہ آ جائے جو آدھا نہیں، اور پھر کوئی اسپریڈشیٹ کھول لیتا ہے۔ Side Badger ریکارڈ کرتا ہے کہ کس نے ادا کیا، کس نے خرچے میں حصہ لیا اور یہ کیسے بٹتا ہے، تاکہ بیلنس ٹھیک نکلیں اور میز پر کسی کو لمبی تقسیم نہ کرنی پڑے۔"
workflow:
  heading: "خرچہ شامل کرنا، شروع سے آخر تک"
  steps:
    - title: "بتائیں کس نے کس لیے ادا کیا"
      body: "رقم، مختصر تفصیل اور ادا کرنے والے کا نام لکھیں۔ ہر خرچے کے لیے ایک شخص ادا کرتا ہے، جس سے حساب ایمان دار رہتا ہے۔"
      shot: S05
      shotAlt: "فیصد کے مطابق تین افراد میں تقسیم ہونے والے کاٹیج کے کرائے کا خرچے کا فارم"
    - title: "تقسیم چنیں"
      body: "برابر، عین رقم یا فیصد چنیں۔ فیصد کا مجموعہ 100 ہونا چاہیے، اور عین رقم کا مجموعہ کل کے برابر۔"
      shot: S06
      shotAlt: "تحفے پر ہر شخص کے لیے عین رقم درج کیا ہوا خرچے کا فارم"
    - title: "کہانی شامل کریں"
      body: "تاریخ طے کریں، لیبل، جگہ اور نوٹ شامل کریں۔ گروپ کے سب لوگ ایک جیسی تفصیلات دیکھتے ہیں، اور وہیں تبصرہ کر سکتے ہیں۔"
      shot: S08
      shotAlt: "اپنی تفصیلات، تبصروں کے سلسلے اور اس اصل رقم کے ساتھ ایک خرچہ جس سے درج ہوا تھا"
    - title: "کچھ غلط لگے تو سوال اٹھائیں"
      body: "اگر گروپ نے اخراجات پر سوالات آن کیے ہوں تو خرچے میں شامل کوئی بھی شخص اس پر سوال اٹھا سکتا ہے، اور اخراجات کی فہرست صرف سوال والے اخراجات دکھا سکتی ہے۔"
      shot: S18
      shotAlt: "«زیر سوال» بیج اور «صرف زیر سوال» فلٹر کے ساتھ اخراجات کی فہرست"
options:
  heading: "تقسیم کے تین طریقے"
  items:
    - title: "برابر"
      body: "ڈنر، ٹیکسیوں اور ہر اس چیز کے لیے ڈیفالٹ جو سب نے برابر بانٹی۔ اگر کل ٹھیک سے تقسیم نہ ہو تو بچا ہوا پیسہ بے ترتیبی سے ایک شخص کو جاتا ہے، ہمیشہ ایک ہی کو نہیں۔ نیچے ٹیکسی میں، یہ آنا ہے۔"
    - title: "عین رقم کے مطابق"
      body: "لکھیں کہ ہر شخص کے ذمے کتنا ہے۔ اس تحفے کے لیے اچھا جس میں ہر ایک نے مختلف قیمت چنی، یا اس خریداری کے لیے جہاں ایک شخص کی ٹرالی میں مشترکہ گروسری سے زیادہ تھا۔ رقوم کا مجموعہ کل کے برابر ہونا چاہیے۔"
    - title: "فیصد کے مطابق"
      body: "ہر شخص کو کل کا ایک حصہ دیں۔ کمرے کے سائز کے مطابق کرایہ اس کی کلاسک مثال ہے، سب سے بڑا کمرہ سب سے بڑا حصہ ادا کرتا ہے اور کوئی اس کا ڈھونگ نہیں کرتا کہ ایسا نہیں۔"
