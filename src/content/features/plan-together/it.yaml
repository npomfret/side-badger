meta:
  title: Liste, sondaggi e commenti per le spese di gruppo | Side Badger
  description: Commenta le spese, metti in discussione quella strana, tieni la lista della spesa e vota la villa. Pianifica insieme, poi dividi. Gratis, senza pubblicità.
h1: Pianificalo insieme, dividilo dopo
navLabel: Pianificare insieme
lead: La lista della spesa e lo scontrino della spesa, finalmente tornati a parlarsi. Side Badger dà al tuo gruppo un posto dove parlare dei soldi prima e dopo averli spesi, con commenti su ogni spesa, un modo per mettere in discussione quelle che sembrano sbagliate, liste condivise e sondaggi per le grandi decisioni. Poi [dividi le spese](page:feature/split-expenses) come al solito.
cta:
  heading: Pianifica, poi dividi
  body: Crea un account gratuito, avvia un gruppo e metti la prima lista, il primo sondaggio o la prima domanda proprio accanto ai soldi. Non sai cosa succede dopo? Vedi [come funziona](page:how-it-works).
problem:
  heading: La chat è di qua, il conto è di là
  body: Le spese di gruppo di solito vivono in due posti. I numeri stanno in uno, e la discussione sui numeri in una chat sepolta da altri messaggi martedì. La lista della spesa è la foto di un frigo. La villa l'hanno decisa i pollici alzati della maggior parte delle persone, probabilmente. Side Badger tiene la pianificazione nel gruppo, accanto alle spese di cui parla, così c'è un commento dove c'è il costo, una lista dove c'è la spesa, un sondaggio per la grande scelta e un modo per dire "aspetta, è giusto?" senza scrivere un paragrafo. Tutto resta sui soldi del gruppo, che è il motivo per cui il gruppo esiste.
workflow:
  heading: Dal voto sulla villa al conto della spesa
  steps:
    - title: Metti ai voti la scelta importante
      body: Aggiungi un sondaggio per la decisione che fissa il conto, come quale villa. Scegli da due a dieci opzioni, stabilisci quanti voti ha ogni persona, poi chiudilo quando hanno votato tutti e il vincitore viene segnato.
      shot: S17
      shotAlt: Un sondaggio chiuso con l'opzione vincente segnata e il numero di voti accanto a ogni opzione
    - title: Scrivete insieme la lista della spesa
      body: Avvia una lista condivisa, aggiungi gli articoli e spuntali man mano che finiscono nel carrello. Poi aggiungi il totale dello scontrino come spesa.
      shot: S16
      shotAlt: Una lista della spesa condivisa con alcuni articoli spuntati e il conteggio dei progressi
    - title: Parlane dove sta il costo
      body: Commenta la spesa stessa, allega lo scontrino e reagisci con un'emoji. La conversazione resta accanto al numero di cui parla.
      shot: S08
      shotAlt: Una spesa con i suoi dettagli, la miniatura di uno scontrino, una discussione di commenti e reazioni emoji
    - title: Metti in discussione quella che non torna
      body: Se il gruppo ha attivato le domande sulle spese, chiunque sia incluso in una spesa può scegliere **Ho una domanda**. La spesa resta fuori dai saldi finché la domanda non è risolta.
      shot: S18
      shotAlt: L'elenco delle spese con un badge In discussione e il filtro Solo in discussione
    - title: Guarda cosa è cambiato, e chi l'ha cambiato
      body: Lo storico delle attività e la campanella delle notifiche mostrano le novità in tutti i tuoi gruppi. Le notifiche push ci sono, se le vuoi.
      shot: S19
      shotAlt: Il menu a tendina delle notifiche con un elenco delle attività recenti
