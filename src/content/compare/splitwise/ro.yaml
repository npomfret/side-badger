faq:
  heading: "Întrebări"
  items:
    - q: "Este Side Badger o alternativă gratuită la Splitwise?"
      a: "Pentru împărțirea notelor într-un grup, da. Scanarea chitanțelor, conversia valutară și lipsa reclamelor sunt gratuite, fără limite zilnice. Dacă ai nevoie de o aplicație nativă, de utilizare offline, de cheltuieli recurente sau de plăți în aplicație, Splitwise le face, iar Side Badger nu."
    - q: "De unde vin detaliile despre Splitwise?"
      a: "Din paginile proprii ale Splitwise: pagina principală, pagina Pro și centrul de ajutor. Fiecare rând din tabel trimite la pagina din care vine, iar data de deasupra tabelului spune când le-am citit. Le verificăm în fiecare trimestru."
    - q: "Va rămâne Side Badger gratuit?"
      a: "Tot ce este în Side Badger e gratuit astăzi și nu există un nivel cu plată. Dacă asta se schimbă vreodată, te anunțăm înainte. [Pagina de prețuri](page:pricing) are detaliile."
    - q: "Trebuie să treacă toți din grupul meu la Side Badger?"
      a: "Da. Fiecare din grup are nevoie de un cont Side Badger gratuit și se poate alătura cu un link sau un cod QR."
    - q: "Are Side Badger o aplicație mobilă?"
      a: "Nu într-un magazin de aplicații. Rulează în browser: conectează-te de pe telefon, apoi adaugă-l pe ecranul de pornire ca să se deschidă ca o aplicație. [Cum funcționează](page:how-it-works) arată cum."
