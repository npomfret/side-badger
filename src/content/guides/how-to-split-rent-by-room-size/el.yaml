meta:
  title: "Πώς να μοιράσετε το ενοίκιο ανά μέγεθος δωματίου | Side Badger"
  description: "Μεγαλύτερο δωμάτιο, μεγαλύτερο μερίδιο. Ξεχωρίστε τα κοινά δωμάτια, μοιράστε το υπόλοιπο ανά εμβαδόν και βάλτε τα ποσοστά μία φορά. Πράξεις για τρεις συγκατοίκους."
h1: "Πώς να μοιράσετε το ενοίκιο ανάλογα με το μέγεθος του δωματίου"
navLabel: "Ενοίκιο ανά μέγεθος δωματίου"
lead: "Αποφασίστε πόσο από το ενοίκιο αντιστοιχεί στα κοινά δωμάτια και μοιράστε αυτό το κομμάτι εξίσου, και μετά μοιράστε το υπόλοιπο ανάλογα με το εμβαδόν του υπνοδωματίου του καθενός. Στρογγυλέψτε σε ακέραια ποσοστά, βάλτε τα στο ενοίκιο στο Side Badger μία φορά και αντιγράφετε το έξοδο κάθε μήνα."
cta:
  heading: "Βάλτε το ενοίκιο μία φορά"
  body: "Δημιουργήστε έναν δωρεάν λογαριασμό, ξεκινήστε μια ομάδα για το διαμέρισμα και καταχωρίστε το ενοίκιο με τα ποσοστά που συμφωνήσατε. Ο επόμενος μήνας είναι ένα αντίγραφο. Θέλετε πρώτα μια ξενάγηση; Δείτε [πώς λειτουργεί](page:how-it-works) ή [τι καλύπτει το δωρεάν](page:pricing)."
sections:
  - heading: "Τρία άτομα, ένα διαμέρισμα, ένας καβγάς"
    body: "Η Πρίγια, ο Τομ και η Αΐσα μοιράζονται ένα διαμέρισμα με 1.950 £ τον μήνα. Για έναν χρόνο το μοίραζαν στα τρία, επειδή ήταν εύκολο. Μετά η Αΐσα μέτρησε το υπνοδωμάτιό της. Το δωμάτιο της Πρίγιας είναι 16 τ.μ., του Τομ 12 τ.μ. και της Αΐσας 10 τ.μ., άρα η Αΐσα πλήρωνε όσο η Πρίγια για ένα δωμάτιο μικρότερο κατά πάνω από το ένα τρίτο. Κανείς δεν είχε φερθεί παράλογα. Κανείς δεν είχε κάνει την πράξη. Με ένα ντελίβερι στο τραπέζι συμφώνησαν πρώτα έναν κανόνα. Το 40% του ενοικίου αντιστοιχεί στην κουζίνα, το μπάνιο και το σαλόνι, που τα χρησιμοποιούν και οι τρεις."
  - heading: "Η μέθοδος, με τις πράξεις στο τραπέζι"
    body: "Τέσσερα βήματα, ένα μέτρο και η αριθμομηχανή του κινητού."
    items:
      - "**Ξεχωρίστε το κοινό μέρος.** Η ομάδα συμφωνεί ποιο μερίδιο του ενοικίου αντιστοιχεί στα δωμάτια που χρησιμοποιούν όλοι. Για το διαμέρισμα είναι 40%, δηλαδή 13,33% στον καθένα από τα τρία άτομα."
      - "**Μοιράστε το υπόλοιπο ανάλογα με το εμβαδόν.** Το άλλο 60% πηγαίνει ανάλογα με το μέγεθος των υπνοδωματίων. Τα υπνοδωμάτια κάνουν μαζί 38 τ.μ. (16 + 12 + 10), οπότε το μέρος της Πρίγιας είναι 60% × 16/38, δηλαδή 25,26%."
      - "**Προσθέστε τα δύο μέρη.** Πρίγια: 25,26% + 13,33% = 38,6%. Τομ: 60% × 12/38 = 18,95%, συν 13,33% κάνει 32,3%. Αΐσα: 60% × 10/38 = 15,79%, συν 13,33% κάνει 29,1%."
      - "**Στρογγυλέψτε και ελέγξτε.** Τα ακέραια ποσοστά είναι πιο εύκολο να τα πληκτρολογήσετε και να τσακωθείτε γι' αυτά, οπότε το 38,6% γίνεται 39%, το 32,3% γίνεται 32% και το 29,1% γίνεται 29%. Ελέγξτε ότι 39 + 32 + 29 κάνει 100. Αν η στρογγυλοποίηση καταλήξει σε 99 ή 101, η ομάδα συμφωνεί ποιου το νούμερο θα μετακινηθεί κατά μία μονάδα."
  - heading: "Ο μήνας του διαμερίσματος, διαβασμένος"
    body: "Το ενοίκιο με 39%, 32% και 29% βγάζει 760,50 £, 624,00 £ και 565,50 £. Η Πρίγια πλήρωσε τον ιδιοκτήτη, οπότε συνολικά τον μήνα της οφείλονται 1.142,50 £, ενώ ο Τομ χρωστά 566,00 £ και η Αΐσα χρωστά 576,50 £. Το Side Badger προτείνει δύο πληρωμές, και οι δύο προς την Πρίγια."
  - heading: "Στήστε το στο Side Badger"
    body: "Ένα βράδυ, που το περισσότερο θα φύγει στη συζήτηση για το 40%."
    items:
      - "**Φτιάξτε την ομάδα.** Στον πίνακα ελέγχου επιλέξτε **Δημιουργία Ομάδας** και δώστε της το όνομα του διαμερίσματος. Επιλέξτε **Πρόσκληση Άλλων** και στείλτε τον σύνδεσμο ή τον κωδικό QR. Ο καθένας συνδέεται ή δημιουργεί έναν δωρεάν λογαριασμό και διαλέγει το όνομα που θέλει να εμφανίζεται σε αυτή την ομάδα."
      - "**Προσθέστε το ενοίκιο.** Επιλέξτε **Προσθήκη Εξόδου**. Συμπληρώστε την περιγραφή και το ποσό και, στο **Ποιος πλήρωσε;**, διαλέξτε όποιον πλήρωσε τον ιδιοκτήτη. Κρατήστε και τα τρία άτομα στο **Μοιράζεται μεταξύ** και μετά, στο **Τρόπος διαχωρισμού**, επιλέξτε **Ποσοστό** και πληκτρολογήστε 39, 32 και 29. Η φόρμα το επισημαίνει αν τα ποσοστά δεν κάνουν συνολικά 100. Επιλέξτε **Αποθήκευση Εξόδου**."
      - "**Προσθέστε τους λογαριασμούς.** Το ρεύμα και το ίντερνετ είναι ξεχωριστά έξοδα με δικούς τους πληρωτές. Αφήστε την επιλογή **Τρόπος διαχωρισμού** στο **Εξίσου**."
      - "**Αντιγράψτε το τον επόμενο μήνα.** Ανοίξτε το ενοίκιο του προηγούμενου μήνα και επιλέξτε **Αντιγραφή εξόδου**. Το αντίγραφο κρατά τον πληρωτή, το ποσό και τον διαχωρισμό και παίρνει τη σημερινή ημερομηνία. Αλλάξτε το ποσό αν άλλαξε το ενοίκιο και μετά επιλέξτε **Δημιουργία Αντιγράφου**."
      - "**Δείτε ποιος χρωστά σε ποιον.** Το δείχνει η ενότητα **Υπόλοιπα**. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή στην **Τακτοποίηση**."
  - heading: "Δωμάτια με μπάνιο, δωματιάκια και άνθρωποι που φεύγουν"
    items:
      - "**Δωμάτια με δικό τους μπάνιο και δωματιάκια.** Το εμβαδόν είναι αφετηρία. Ένα δωμάτιο με δικό του μπάνιο αξίζει περισσότερο από ένα ίδιου εμβαδού χωρίς, και ένα δωματιάκι που χωράει ένα κρεβάτι και μια αισιόδοξη καρέκλα αξίζει λιγότερο. Προσαρμόστε τα ποσοστά με συμφωνία, ελέγξτε ότι εξακολουθούν να κάνουν συνολικά 100 και γράψτε τα τελικά νούμερα κάπου που τα βλέπει όλο το διαμέρισμα."
      - "**Κάποιος φεύγει στη μέση του μήνα.** Υπολογίστε τι χρωστά ο καθένας για εκείνον τον μήνα και καταχωρίστε το ενοίκιο του μήνα με **Ακριβή ποσά** αντί για **Ποσοστό**. Τα ποσά πρέπει να βγάζουν το ενοίκιο. Κάντε το πριν φύγει. Κανείς δεν μπορεί να αφήσει μια ομάδα όσο χρωστά ή του χρωστούν χρήματα και ένα έξοδο που αφορά κάποιον που έχει φύγει γίνεται μόνο για ανάγνωση."
      - "**Κάποιος μετακομίζει στο διαμέρισμα.** Μετρήστε ξανά, ξανακάντε τις πράξεις με τα νέα μεγέθη δωματίων και χρησιμοποιήστε τα νέα ποσοστά από το επόμενο ενοίκιο. Οι προηγούμενοι μήνες μένουν όπως ήταν."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν μετράει τα δωμάτιά σας και δεν διαλέγει τα ποσοστά. Τα εμβαδά και το 40% τα συμφωνεί η ομάδα."
      - "Δεν έχει επαναλαμβανόμενους λογαριασμούς, οπότε αντιγράφετε κάθε φορά το ενοίκιο του προηγούμενου μήνα."
      - "Δεν μετακινεί ποτέ χρήματα και δεν πληρώνει τον ιδιοκτήτη. Πληρώνετε ο ένας τον άλλον όπως θέλετε και το καταγράφετε."
      - "Δεν ξέρει τι λέει το συμβόλαιο μίσθωσής σας. Κρατά τον λογαριασμό ανάμεσα στα άτομα της ομάδας."
