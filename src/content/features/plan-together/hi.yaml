meta:
  title: "ग्रुप खर्च के लिए साझा सूचियां, पोल और कमेंट | Side Badger"
  description: "खर्चों पर कमेंट करें, गड़बड़ लगने वाले खर्च पर सवाल उठाएं, साझा खरीदारी सूची रखें और विला पर वोट करें। पहले मिलकर प्लान करें, फिर बांटें। मुफ्त, बिना विज्ञापन।"
h1: "मिलकर प्लान करें, बाद में बांटें"
navLabel: "मिलकर प्लान करें"
lead: "खरीदारी की सूची और खरीदारी का बिल, आखिरकार एक-दूसरे से बात करने लगे। Side Badger आपके ग्रुप को पैसे खर्च होने से पहले और बाद उनके बारे में बात करने की जगह देता है: हर खर्च पर कमेंट, गलत दिखने वाले खर्च पर सवाल उठाने का तरीका, साझा सूचियां और बड़े फैसलों के लिए पोल। फिर आप हमेशा की तरह [खर्च बांटते](page:feature/split-expenses) हैं।"
cta:
  heading: "पहले प्लान करें, फिर बांटें"
  body: "मुफ्त अकाउंट बनाएं, ग्रुप शुरू करें और पहली सूची, पोल या सवाल को पैसों के ठीक बगल में रखें। पक्का नहीं कि आगे क्या होता है? [यह कैसे काम करता है](page:how-it-works) देखें।"
problem:
  heading: "चैट यहां है, बिल वहां"
  body: "ग्रुप का खर्च आमतौर पर दो जगह रहता है। संख्याएं एक जगह होती हैं, और उन संख्याओं पर बहस उस चैट में जो मंगलवार को स्क्रॉल होकर ऊपर चली गई। खरीदारी की सूची फ्रिज की एक फोटो है। विला का फैसला ज़्यादातर लोगों के थम्स-अप से हुआ था, शायद। Side Badger प्लानिंग को ग्रुप के भीतर रखता है, उन खर्चों के बगल में जिनके बारे में वह है, इसलिए जहां खर्च है वहां कमेंट है, जहां खरीदारी है वहां सूची है, बड़े फैसले के लिए पोल है, और “रुको, यह सही है क्या?” कहने का तरीका है, पूरा पैराग्राफ लिखे बिना। सब कुछ ग्रुप के पैसों के बारे में ही रहता है, और ग्रुप इसी के लिए है।"
workflow:
  heading: "विला के वोट से खरीदारी के बिल तक"
  steps:
    - title: "बड़े फैसले पर वोट कराएं"
      body: "उस फैसले के लिए पोल जोड़ें जो बिल तय करता है, जैसे कौन-सा विला। दो से दस विकल्प चुनें, बताएं कि हर व्यक्ति के कितने वोट होंगे, और जब सब वोट दे दें तो उसे बंद करें, और विजेता पर निशान लग जाता है।"
      shot: S17
      shotAlt: "बंद किया गया पोल, जिसमें जीतने वाला विकल्प चिह्नित है और हर विकल्प के पास वोटों की संख्या है"
    - title: "खरीदारी की सूची साथ मिलकर लिखें"
      body: "एक साझा सूची शुरू करें, आइटम जोड़ें और ट्रॉली में आते ही उन्हें टिक करते जाएं। खरीदारी बाद में एक खर्च के रूप में जुड़ती है।"
      shot: S16
      shotAlt: "साझा खरीदारी की सूची, जिसमें कुछ आइटम टिक किए हुए हैं और प्रगति की गिनती है"
    - title: "खर्च के बारे में वहीं बात करें जहां वह रहता है"
      body: "खर्च पर ही कमेंट करें, रसीद लगाएं और इमोजी से रिएक्ट करें। बातचीत उसी संख्या के बगल में रहती है जिसके बारे में वह है।"
      shot: S08
      shotAlt: "एक खर्च अपने विवरण, रसीद के थंबनेल, कमेंट थ्रेड और इमोजी रिएक्शन के साथ"
    - title: "जो खर्च गड़बड़ लगे उस पर सवाल उठाएं"
      body: "अगर ग्रुप ने खर्च पर सवाल उठाना चालू किया है, तो खर्च में शामिल कोई भी व्यक्ति **मेरा एक प्रश्न है** चुन सकता है। सवाल सुलझने तक खर्च बैलेंस से बाहर रहता है।"
      shot: S18
      shotAlt: "खर्च की सूची, जिसमें प्रश्नित बैज और केवल प्रश्नित फिल्टर दिख रहा है"
    - title: "देखें क्या बदला, और किसने बदला"
      body: "गतिविधि फ़ीड और सूचनाओं की घंटी दिखाती है कि आपके सभी ग्रुप में नया क्या है। आप चाहें तो पुश सूचनाएं भी उपलब्ध हैं।"
      shot: S19
      shotAlt: "सूचनाओं का ड्रॉपडाउन, जिसमें हाल की गतिविधि की सूची है"
