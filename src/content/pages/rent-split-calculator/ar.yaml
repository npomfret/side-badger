faq:
  heading: "أسئلة"
  items:
    - q: "أيهما أعدل: مساحة الغرفة أم الدخل؟"
      a: "لا أحدهما أعدل دائماً. تناسب مساحة الغرفة زملاء السكن الذين يدفعون مقابل المساحة التي ينامون فيها. ويناسب الدخل الأزواج والأصدقاء الذين تتفاوت رواتبهم كثيراً. واتفقوا عليه قبل أول يوم إيجار، لا بعده."
    - q: "هل تُقسَّم الفواتير بالطريقة نفسها؟"
      a: "لزملاء السكن، لا في الغالب. فالجميع يستخدمون الطاقة والإنترنت، والتقسيم بالتساوي أبسط، كما في المثال. أما بحسب الدخل فتعطي الحاسبة الفواتير الحصص نفسها التي تعطيها للإيجار."
    - q: "هل أستطيع استخدام الأقدام المربعة؟"
      a: "نعم. اختر ft² واكتب مساحاتك بالأقدام المربعة. الوحدة مجرد تسمية، وتخرج الحصص نفسها ما دام الجميع يستخدمون وحدة واحدة."
    - q: "هل الحاسبة مجانية؟"
      a: "نعم. مجانية. بلا إعلانات. بلا حدود يومية. ولا تحتاج إلى حساب أيضاً."
