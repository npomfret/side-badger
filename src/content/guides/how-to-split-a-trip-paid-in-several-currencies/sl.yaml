faq:
  heading: "Vprašanja"
  items:
    - q: "Kateri menjalni tečaj uporablja Side Badger?"
      a: "Trenutni menjalni tečaj, ki se poišče ob vnosu stroška, kjer je na voljo. Spremeniš ga lahko v tečaj, ki si ga res dobil."
    - q: "Ali se lahko skupina drži funtov in jenov?"
      a: "Da. V **Nastavitvah** skupine pod **Nastavitve valut** vklopi **Omeji valute za to skupino**, izberi **Dovoljene valute** in nastavi **Privzeta valuta za nove stroške**. Manj možnosti na seznamu, manj napačnih ugibanj pri blagajni."
    - q: "Ali moramo sploh pretvarjati?"
      a: "Ne. Valute ostanejo ločene, razen če se ti ali skupina odločite za pretvorbo, vsaka valuta pa dobi svoj kratek seznam plačil."
