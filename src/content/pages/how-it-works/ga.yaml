meta:
  title: "Conas a oibríonn Side Badger | Roinn costais ghrúpa i gcúig chéim"
  description: "Cruthaigh grúpa, tabhair cuireadh do dhaoine, cuir costais leis agus socraigh suas. Féach cad a tharlaíonn idir “d'íoc duine éigin” agus “táimid cothrom”, le sampla oibrithe."
h1: "Conas a oibríonn Side Badger"
navLabel: "Conas a oibríonn sé"
lead: "Cad a tharlaíonn idir “d'íoc duine éigin” agus “táimid cothrom”? Cúig chéim, gan scarbhileog, agus broc amháin atá ornáideach den chuid is mó. Seo an turas iomlán, ón gcéad ghrúpa go dtí an íocaíocht dheireanach a taifeadadh. Chun tuilleadh sonraí a fháil ar aon chéim, féach [roinn costais](page:feature/split-expenses) agus [socraigh suas](page:feature/settle-up)."
cta:
  heading: "Ó “íocfaidh mise as an gceann seo” go “táimid cothrom”"
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa agus cuir an chéad chostas leis. Ní thabharfaidh an broc breith ar an admháil."
  button: "Cruthaigh cuntas saor in aisce"
steps:
  - title: "Cruthaigh grúpa"
    body: "Déan grúpa amháin do gach teach, turas nó imeacht, ionas nach dtiocfaidh an cíos chun bheith sa liosta céanna le bronntanas an phósta. Tabhair ainm dó, roghnaigh an t-ainm a fheicfidh daoine ort agus, más maith leat, cuir teorainn leis na hairgeadraí a nglacann sé leo. Ansin taispeánann do dheais gach grúpa, agus an áit a bhfuil tú i ngach ceann acu, ar aon scáileán amháin."
    shot: S02
    shotAlt: "An dialóg cruthaithe grúpa agus an rannóg srianta airgeadra oscailte"
  - title: "Tabhair cuireadh do do dhaoine"
    body: "Roinn nasc le dul isteach nó taispeáin cód QR, agus socraigh cé chomh fada a mhaireann sé, ó 15 nóiméad suas le 5 lá. Teastaíonn cuntas saor in aisce agus ríomhphost fíoraithe ó gach duine a théann isteach, agus is féidir suas le 50 duine a bheith i ngrúpa. Más maith leat grinnscrúdú a dhéanamh ar cé a thagann isteach, cuir ceadú ar siúl agus ligfidh riarthóir gach duine isteach."
    shot: S03
    shotAlt: "An dialóg chuiridh ar an táb nasc, ag taispeáint cód QR agus na roghanna fad ama"
  - title: "Cuir costais leis de réir mar a tharlaíonn siad"
    body: "Abair cé a d'íoc, cé mhéad, agus cé a bhí páirteach. Roinn go cothrom é, de réir suimeanna cruinne nó de réir céatadáin, agus fág amach duine ar bith nach raibh páirteach ann. Cuir an costas leis agus feiceann gach duine é gan mhoill, mar aon leis an méid a athraigh agus cé a rinne an t-athrú."
    shot: S05
    shotAlt: "An fhoirm costais le roinnt de réir céatadáin, ag roinnt an chíosa de réir méid an tseomra"
  - title: "Coinnigh súil ar na hiarmhéideanna"
    body: "Coinníonn Side Badger iarmhéid reatha do gach airgeadra, ionas gur féidir leat a fheiceáil cé atá i bhfiacha le cé ag aon amharc amháin. In ionad gach duine a fhágáil ag scaoileadh líon fiacha beaga, molann sé liosta gearr íocaíochtaí a shocraíonn an grúpa."
    shot: S10
    shotAlt: "An scáileán iarmhéideanna ag taispeáint fiacha simplithe i dhá airgeadra, agus “Taispeáin iad go léir” casta ar siúl"
  - title: "Socraigh suas lasmuigh den aip, taifead istigh é"
    body: "Ní bhogann Side Badger airgead riamh. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht ionas go mbeidh na hiarmhéideanna cothrom le dáta, agus nuashonraítear scáileán gach duine gan athnuachan. Ciallaíonn “socraithe” go simplí go bhfuil na hiarmhéideanna ar nialas. Ní féidir le haon duine grúpa a fhágáil fad is atá airgead dlite acu nó dlite dóibh, mar sin socraíonn duine ar bith atá ar a bhealach amach ar dtús."
    shot: S11
    shotAlt: "An fhoirm íocaíochta le cnaipí Socrú gasta agus an fógra faoi pháirt-íocaíocht"
requirements:
  heading: "Cad atá uait"
  items:
    - "Cuntas saor in aisce. Níl uait ach seoladh ríomhphoist agus pasfhocal, agus fíoraíonn tú an ríomhphost sula bhfuil tú in ann aon rud a chur leis."
    - "Bheith 18 mbliana d'aois nó os a chionn."
    - "Brabhsálaí nua-aimseartha ar fhón nó ar ríomhaire, agus nasc leis an idirlíon. Ní aip ó siopa aipeanna é Side Badger agus ní oibríonn sé as líne."
    - "Más mian leat, spota ar do scáileán baile. Níl siopa aipeanna de dhíth, mar is féidir Side Badger a chur le do scáileán baile nó do dhoc agus osclaíonn sé cosúil le haip."
