meta:
  title: "Розраховуйтеся меншою кількістю платежів | Side Badger"
  description: "Дізнайтеся, хто кому винен у вашій групі, отримайте короткий список платежів, який розраховує всіх, і записуйте кожен платіж, коли він відбувається. Безкоштовно."
h1: "Розраховуйтеся меншою кількістю платежів"
navLabel: "Розрахунок"
lead: "Side Badger веде поточний баланс кожного в групі й підказує короткий список платежів, який його закриває. Ви платите одне одному як зручно, а потім це записуєте. Якщо спершу хочете побачити, як ділять суми, почніть із [розподілу витрат](page:feature/split-expenses)."
cta:
  heading: "Готові розплутати, хто кому винен?"
  body: "Створіть обліковий запис, заведіть групу й додайте першу витрату. Баланси зроблять решту."
  button: "Створити безкоштовний обліковий запис"
problem:
  heading: "Баланси, що оновлюються на ходу"
  body: "Кожна витрата змінює, хто кому винен, тож Side Badger підтримує баланси актуальними в міру додавання витрат і платежів. Усі в групі бачать зміну одразу, а також що змінилося й хто це змінив. Баланси ведуться за валютами, тож євро та фунти лишаються у своїх стовпцях, якщо витрату не було конвертовано під час введення. Типово ви бачите борги, що стосуються вас; **Показати все** виводить усю групу."
workflow:
  heading: "Три кроки до «квити»"
  steps:
    - title: "Подивіться, хто кому винен"
      body: "Відкрийте баланси групи, щоб побачити, скільки ви винні, скільки вам винні, і короткий список платежів, який розраховує всіх, обчислений окремо для кожної валюти. Витрати під сумнівом лишаються поза сумами, доки їх не з'ясують. У прикладі із сусідами нижче шість платежів стають двома."
      shot: S10
      shotAlt: "Екран балансів зі спрощеними боргами у двох валютах і ввімкненим пунктом Показати все"
    - title: "Платіть як зручно, а потім запишіть"
      body: "Банківський переказ, готівка, послуга з минулої відпустки. Side Badger не переказує гроші. Коли гроші змінили власника, запишіть платіж, і баланс оновиться для всіх."
      shot: S11
      shotAlt: "Форма платежу з кнопками швидкого розрахунку та повідомленням, що показується при частковому платежі"
    - title: "Перевірте, чи дійшло"
      body: "Платіж потрапляє до історії групи, де його може побачити кожен у групі й відреагувати емодзі. Відсвяткуйте платіж, коли він дійде."
      shot: S12
      shotAlt: "Історія платежів з емодзі-реакціями на платіж"
