meta:
  title: "Side Badger mot Splitwise: de gratis delarna jämförda | Side Badger"
  description: "Ett gratis alternativ till Splitwise, jämfört rättvist. Kvittoskanning, valutaomräkning och inga annonser kostar ingenting här, och vi listar vad Splitwise gör bättre."
h1: "Side Badger mot Splitwise: de gratis delarna jämförda"
navLabel: Side Badger mot Splitwise
lead: "Någon i din grupp har troligen sagt \"använd bara Splitwise\". Rimligt nog. Side Badger är en gratis webbapp med kvittoskanning, valutaomräkning och inga annonser, och ingen prenumeration för att låsa upp dem. Vilken som passar din grupp beror på vad den behöver, så här är jämförelsen, med Splitwises sida hämtad bara från Splitwises egna sidor."
cta:
  heading: Prova på din nästa gemensamma räkning
  body: "Skapa ett gratiskonto, gör en grupp och lägg till en riktig utgift. Om det inte är något för dig har du lagt några minuter, inte en prenumeration."
asOf: 2026-10-21
asOfNote: "Vi läste Splitwises egna sidor den {date} så att du slipper, och allt här om Splitwise kommer från dem. Varje rad i tabellen länkar till sin källa. Planer ändras, så vi kontrollerar igen varje kvartal, och om Splitwises sidor säger något annat än den här, tro dem."
