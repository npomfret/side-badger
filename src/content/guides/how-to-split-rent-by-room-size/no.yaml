faq:
  heading: "Spørsmål"
  items:
    - q: "Hva om noen har et større rom, men mindre lys?"
      a: "Gulvareal er bare utgangspunktet, så gruppen kan bli enig om å justere. Ta et poeng eller to av det mørke rommet, gi dem til de andre og kontroller at prosentene fortsatt summerer seg til 100. Side Badger lagrer det dere blir enige om, og vurderer det ikke."
    - q: "Bør regningene deles etter romstørrelse også?"
      a: "Vanligvis ikke. Strøm og bredbånd brukes av alle, så en lik deling er enklere, som i eksempelet ovenfor. Hvis en romkamerat er hjemme hele dagen, kan gruppen bli enige om noe annet, for eksempel eksakte beløp. [Dele utgifter](page:feature/split-expenses) tar for seg valgene."
    - q: "Kan vi endre fordelingen senere?"
      a: "Ja, for nye utgifter. Endre prosentene når du kopierer husleien, så blir tidligere måneder stående som de var. For å rette en tidligere utgift redigerer du den hvis gruppens tillatelser tillater det, og sier fra til huset først, fordi saldoene endrer seg. Den tidligere versjonen blir bevart."
