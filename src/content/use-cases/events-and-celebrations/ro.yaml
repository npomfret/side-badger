meta:
  title: "Împarte costurile petrecerilor, nunților și cadourilor comune"
  description: "Împarte costurile unei petreceri, nunți sau cadou comun când oamenii contribuie cu sume diferite. Votați planul, împarte pe sume exacte și vezi cine cui datorează."
h1: "Împarte costurile petrecerilor, nunților și cadourilor comune"
navLabel: "Evenimente și sărbători"
lead: "Împarte avansurile, decorurile și umbrelele de urgență. Lasă planul de așezare pe seama cuiva mai curajos. Side Badger ține **cine a contribuit cu ce** într-un singur loc, ca organizatorul să se bucure și el de petrecere."
cta:
  heading: "Începe cu următoarea sărbătoare"
  body: "Creează un cont, fă un grup pentru eveniment și trimite linkul de invitație. Side Badger este gratuit, fără reclame și fără limite zilnice."
  button: "Creează un cont gratuit"
scenario:
  heading: "Toți contribuie, nu mereu cu aceeași sumă"
  body: "Cineva plătește avansul pentru locație, altcineva cumpără tortul, iar un al treilea pune cadoul comun pe cardul propriu. Unii invitați vin la tot, alții vin doar la cină. Să ții o evidență corectă a asta într-un fir de chat e o muncă pentru care nu s-a oferit nimeni. Un grup Side Badger le ține pe toate, oricare ar fi amestecul de sume, și arată fiecărei persoane ce datorează sau ce i se datorează. Vezi [cum funcționează](page:how-it-works) pentru noțiunile de bază sau citește mai departe pentru un eveniment."
sections:
  - heading: "Hotărâți împreună"
    body: "Înainte să se miște vreun ban, pune alegerea la un **sondaj**. Adaugă până la 10 opțiuni, de exemplu două locații sau trei idei de cadou, și lasă pe toți să voteze. Poți ascunde cine a votat ce, ca fiecare opțiune să primească o șansă corectă, iar câștigătoarea apare după închiderea sondajului. Nimeni nu trebuie să deruleze prin patruzeci de mesaje ca să afle ce s-a hotărât."
  - heading: "Cine intră cu ce"
    body: "Nu toți plătesc la fel și nu toți participă la fiecare cost. Împarte o cheltuială egal, procentual sau pe **sume exacte**, ca partea fiecăruia să fie cifra la care ați convenit. Exclude pe oricine nu a fost implicat, de exemplu invitații care au sărit peste cină sau prietenii care nu s-au alăturat cadoului. Fiecare cheltuială are un singur plătitor, iar toți ceilalți din împărțire îi datorează partea lor. Detaliile sunt pe pagina [împărțirea cheltuielilor](page:feature/split-expenses)."
  - heading: "Păstrează actele"
    body: "Adaugă note la o cheltuială, de exemplu ce a acoperit costul. Comentariile rămân **lângă cheltuiala** despre care e vorba, așa că întrebarea „tortul a fost £45 sau £54?” și răspunsul ei stau în același loc. Comentariile pot avea 500 de caractere, ceea ce e destul pentru o întrebare despre un avans."
  - heading: "Controalele organizatorului"
    body: "Colaborarea deschisă lasă orice membru să adauge și să editeze cheltuieli, ceea ce e în regulă pentru un cadou mic. Pentru o nuntă sau o petrecere mai mare, alege presetarea **Grup gestionat**. Administratorii aprobă fiecare membru nou, iar doar creatorii și administratorii pot schimba cheltuielile. Invită oamenii cu un link sau un cod QR; cu aprobarea activată, un administrator lasă fiecare persoană să intre, așa că lista de invitați rămâne lista de invitați. Când evenimentul s-a terminat, blochează grupul, ca cifrele să rămână pe loc."
  - heading: "Achită-te după petrecere"
    body: "După ce a sosit ultima factură, soldurile arată **cine cui datorează**, iar Side Badger sugerează o listă scurtă de plăți care îi achită pe toți. Plătiți-vă unii altora cum preferați, apoi înregistrați plata în grup. Side Badger nu mută niciodată bani, așa că grupul ține evidența, în timp ce transferurile se fac în aplicațiile voastre bancare. Pagina [decontarea](page:feature/settle-up) arată cum o încurcătură devine o listă scurtă."
