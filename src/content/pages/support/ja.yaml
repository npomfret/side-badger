meta:
  title: ヘルプとサポート | Side Badger
  description: パスワードを忘れた、リンクが使えない、支払いを間違えて記録した？Side Badgerでつまずきやすい点への短い答えと、連絡先をご案内します。
h1: ヘルプとサポート。保留音はありません
navLabel: ヘルプとサポート
lead: パスワードを忘れた場合から、グループを完全に閉じる方法まで、つまずきやすい点への短い答えです。それぞれ、詳しく説明しているページへのリンクつきです。見つからない場合は、アプリ内から教えてください。メールでも構いません。
cta:
  heading: ヘルプを見に来て、そのまま割り勘も？
  body: まだアカウントがありませんか？グループを始めてリンクを共有し、最初の支出を追加しましょう。無料で、広告も1日の制限もありません。
groups:
  - heading: サインイン
    items:
      - q: パスワードをお忘れですか？
        a: どんなに優秀なアナグマにもあることです。**サインイン**画面で「**パスワードをお忘れですか？**」を選び、アカウントのメールアドレスを入力して、届いたメールのリンクから新しいパスワードを設定してください。アカウントに必要なそのほかのことは、[使い方](page:how-it-works)で説明しています。
      - q: 登録したのに、何も追加できません。なぜですか？
        a: いちばん多いのは、メールアドレスがまだ確認されていない場合です。確認メールのリンクを開くか、リマインダーのバナーで**確認メールを再送信**を選んで新しいメールを受け取ってください。確認済みの場合は、グループがロックされているか、グループの権限で許可されていない可能性があります。閲覧者はすべてを見られますが、何も変更できません。詳しくは[グループと権限](page:feature/groups-and-permissions)をご覧ください。
      - q: メールアドレスやパスワードを変更するには？
        a: "**設定**で**メールアドレスを変更**または**パスワードを変更**を選びます。どちらも最初に現在のパスワードの入力が必要で、新しいメールアドレスは、そこに送るリンクから確認する必要があります。アカウントについては[使い方](page:how-it-works)をご覧ください。"
      - q: GoogleやAppleでサインインできますか？
        a: いいえ。必要なのはメールアドレスと12文字以上のパスワードだけで、自分のスマートフォンやパソコンなら**サインインしたままにする**にチェックを入れられます。始め方のそのほかについては、[ウェブアプリ](page:feature/web-app)のページをご覧ください。
  - heading: グループに参加する
    items:
      - q: 招待リンクが届きました。どうやって参加しますか？
        a: リンクを開き、ログインするか無料アカウントを作成します。グループのプレビューが表示されるので、そこでみんなに表示される自分の名前を選び、**グループに参加**を押してください。参加までの流れは、[グループと権限](page:feature/groups-and-permissions)で詳しく説明しています。
      - q: 「承認待ち」と表示されます。何か間違えましたか？
        a: いいえ、何も間違えていません。このグループは、管理者が一人ずつ参加を許可する設定になっているので、あなたのリクエストは管理者に届いていて、誰かが承認するまでグループの中は見られません。直接会って軽く声をかけるのは自由です。承認については[グループと権限](page:feature/groups-and-permissions)で説明しています。
      - q: リンクが無効、または期限切れと表示されます。
        a: 招待リンクの有効期間は、作った人が15分から最大5日の間で選んだ長さです。グループの誰かに新しいリンクをお願いするか、同じ部屋にいるならQRコードを見せてもらってください。招待については[使い方](page:how-it-works)をご覧ください。
  - heading: 支出
    items:
      - q: 支出はどうやって追加しますか？
        a: グループを開いて**経費を追加**を選びます。何の支出か、いくらか、誰が支払ったか、誰が分け合うかを入力し、均等、金額指定、割合指定のいずれかで分けます。すべての選択肢は[割り勘の仕方](page:feature/split-expenses)で順に説明しています。
      - q: 家賃を毎月自動で繰り返せますか？
        a: 自動ではできません。定期的な支出はないからです。先月の支出を開いて**経費をコピー**を選ぶと、入力済みのフォームが開くので、新しい日付と変わった部分だけ直せば完了です。コピーについては[割り勘の仕方](page:feature/split-expenses)にさらに詳しく書いています。
      - q: 金額を間違えて入力しました。直せますか？
        a: はい。グループの権限で許可されていて、グループがロックされていなければ、支出を編集できます。以前のバージョンは残るので、何が変わったかを誰かの言葉だけに頼る必要はありません。詳しくは[割り勘の仕方](page:feature/split-expenses)をご覧ください。
      - q: 支出がおかしく見えますが、自分のものではありません。どうすればいいですか？
        a: その支出で**質問があります**を選んで理由を添えると、質問した人か管理者が質問を終了するまで、その支出全体が全員の残高から除外されます。このボタンがない場合は、質問できるのは支出に含まれる人だけで、先に管理者がグループの設定で**費用への質問を許可する**をオンにする必要があります。角が立たない伝え方は[もめた支出のガイド](page:guide/what-to-do-when-someone-disputes-a-shared-expense)にあります。
  - heading: 支払い
    items:
      - q: Side Badgerがお金を送ってくれますか？
        a: いいえ、Side Badgerがお金を動かすことはありません。銀行振込でも現金でも、使いやすい方法で支払い、そのあと支払いを記録して残高に反映させます。最初から最後までの流れは、[グループ旅行のあとの精算の仕方](page:guide/how-to-settle-up-after-a-group-trip)で紹介しています。
      - q: 支払いはどう記録しますか？
        a: グループで**精算する**を選び、誰が支払い、誰が受け取ったかを入力します。金額は入力するか、**クイック精算**ボタンで自動入力させ、**精算を記録**を選びます。一部だけ支払った場合は、支払った分だけを記録すれば、残りは残高に残ります。詳しくは[精算](page:feature/settle-up)をご覧ください。
      - q: 支払いの記録を間違えました。直せますか？
        a: 記録した人は、グループの**精算**履歴から編集でき、その人か管理者が削除すると残高から取り除かれます。その後グループを退出した人が関わる支払いは、編集できません。履歴については[精算](page:feature/settle-up)をご覧ください。
  - heading: 通知とホーム画面
    items:
      - q: 通知はどうやってオンにしますか？
        a: "**設定**で**プッシュ通知**をオンにし、ブラウザに聞かれたら許可します。ブラウザがすでにブロックしている場合は、先にブラウザ自身の設定で許可してください。オンにするのは端末ごとで、届くことは保証されていないので、通知は約束ではなく、軽い合図だと考えてください。詳しくは[ウェブアプリ](page:feature/web-app)のページをご覧ください。"
      - q: iPhoneで通知が届かないのはなぜですか？
        a: iPhoneやiPadでは、ホーム画面に追加したアプリでしか通知は動かず、ブラウザのタブでは動きません。ホーム画面に追加し、ホーム画面のアイコンから開いて、**設定**でオンにしてください。通知で何がわかるかは、[一緒に計画する](page:feature/plan-together)をご覧ください。
      - q: ダウンロードできるアプリはありますか？
        a: アプリストアにはありません。Side Badgerはブラウザで動作するからです。ログインしてから、**設定**の**ホーム画面またはDockに追加**に従うと、アプリのように、独立したウィンドウで開きます。端末ごとの手順は[ウェブアプリ](page:feature/web-app)のページにあります。
  - heading: 退出、アーカイブ、ロック、閉鎖
    items:
      - q: グループを退出するには？
        a: 先に精算してから、**グループを脱退**を選びます。1つの通貨でも借りている、または貸している間、自分が含まれる支出に質問が残っている間、最後の管理者である場合、唯一のメンバーである場合は、退出できません。戻るには新しい招待が必要です。詳細は[グループと権限](page:feature/groups-and-permissions)をご覧ください。
      - q: 古いグループをダッシュボードから消すには？
        a: "**グループをアーカイブ**を選びます。自分のダッシュボードからだけ消え、ほかの人のダッシュボードには影響せず、開いて使うこともできます。**グループのアーカイブを解除**で元に戻せます。アーカイブ、ロック、閉鎖の違いは[グループと権限](page:feature/groups-and-permissions)で比べています。"
      - q: 旅行が終わりました。数字が変わらないようにできますか？
        a: はい。管理者がグループの設定で**グループをロック**をオンにすると、管理者が解除するまで、支出の追加や編集、新しい支払いの記録、リストや投票の変更は誰にもできなくなります。グループと履歴は全員が引き続き読めますし、あとから紛れ込むタクシー代もありません。詳しくは[グループと権限](page:feature/groups-and-permissions)をご覧ください。
      - q: グループを削除できますか？
        a: 管理者が、確認のためにグループ名を入力したうえで**グループを閉鎖**を選ぶと閉じられます。閉鎖は元に戻せず、グループは全員が使えなくなるので、見えなくしたいだけならアーカイブにしてください。細かい注意点は[グループと権限](page:feature/groups-and-permissions)にあります。
contact:
  heading: まだ解決しませんか？
  items:
    - q: 不具合を見つけた、または変更してほしいことがありますか？
      a: アプリ内から教えてください。アカウントメニューの**フィードバック**から**フィードバックを送信**を選び、**問題を報告**、**ヘルプを求める**、**機能リクエスト**のいずれかを選びます。役に立つならスクリーンショットも添付してください。返信は同じスレッドで確認できます。
    - q: メールのほうがいいですか？
      a: 下のアドレスにお送りください。どのグループの話か、何をしたか、どうなると思っていたかを書いてください。愚痴は構いません。パスワードはだめです。絶対に送らないでください。
  emailLabel: メールはこちらへ
  email: support@sidebadger.me
