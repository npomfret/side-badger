sections:
  - heading: "Keunggulan Splitwise"
    body: "Jika grup Anda memerlukan aplikasi native, penggunaan offline, atau pembayaran di dalam aplikasi, Splitwise adalah pilihan yang masuk akal, dan kami lebih suka Anda memilihnya daripada baru mengetahuinya belakangan. Halaman Splitwise sendiri mencantumkan:"
    items:
      - "**Aplikasi dan penggunaan offline.** Aplikasi iPhone dan Android selain web, dan mode offline."
      - "**Lebih banyak cara membagi.** Menurut bagian, penyesuaian, dan pembagian per item, selain rata, jumlah pasti, dan persentase."
      - "**Pengeluaran berulang.** Atur sewa agar berulang dan lupakan saja."
      - "**Pembayaran di dalam aplikasi.** Di beberapa negara, aplikasinya juga bisa memindahkan uangnya, lewat Splitwise Pay, Venmo, PayPal, atau Pay by Bank."
  - heading: "Gratis di sini, berbayar di sana"
    body: "Splitwise Pro adalah paket berbayar Splitwise, dan halaman Pro miliknya sendiri menjual empat hal yang tidak berbayar di Side Badger."
    items:
      - "**Pemindaian struk.** Splitwise Pro memindai foto struk Anda. Side Badger melakukannya gratis, tanpa kredit pindai: mengisi total, tanggal, dan tempat untuk Anda periksa. Gambar struk dibaca oleh layanan AI Google."
      - "**Konversi mata uang.** Splitwise Pro mengonversi pengeluaran grup ke mata uang bawaan Anda saat Anda mengetuk Convert. Side Badger mengonversi tiap pengeluaran saat Anda memasukkannya, dengan kurs terkini atau kurs yang benar-benar Anda dapatkan, dan jumlah aslinya tetap ada di pengeluaran itu."
      - "**Tanpa iklan.** Splitwise mencantumkan pengalaman yang sepenuhnya bebas iklan sebagai fitur Pro. Side Badger tidak punya iklan."
      - "**Tanpa batas harian.** Splitwise Pro menjual pengeluaran tanpa batas, dan pusat bantuannya menyebut pengguna gratis bisa menambahkan hingga 4 pengeluaran per hari. Side Badger tidak punya batas harian."
  - heading: "Yang dimiliki Splitwise tetapi tidak dimiliki Side Badger"
    body: "Ini bukan semua fitur Splitwise, hanya yang cenderung menentukan pilihan. Halaman Splitwise sendiri memuat daftar lengkapnya. Inilah bagian yang kurang di Side Badger."
    items:
      - "**Aplikasi native.** Side Badger berjalan di peramban Anda. Masuk, lalu tambahkan ke layar utama dan ia terbuka seperti aplikasi."
      - "**Mode offline.** Side Badger memerlukan koneksi."
      - "**Pembayaran di dalam aplikasi.** Side Badger tidak pernah menyentuh uang Anda. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya."
      - "**Pengeluaran berulang.** Side Badger tidak punya. Salin sewa bulan lalu, bukan mengetiknya lagi."
      - "**Membagi menurut bagian atau per item.** Side Badger punya satu pembayar per pengeluaran, dibagi rata, menurut jumlah pasti, atau persentase. Pemindaian struknya tidak menetapkan item ke orang tertentu."
      - "**Grafik dan pembagian bawaan.** Splitwise Pro punya keduanya. Side Badger menyimpan hitungan siapa berutang kepada siapa, dan hanya itu triknya."
  - heading: "Memindahkan grup Anda"
    body: "Tidak ada fitur impor, jadi pindah berarti memulai dari awal. Lunasi dulu di Splitwise, lalu buat grup di Side Badger dan undang semua orang dengan tautan atau kode QR. Setiap orang di grup perlu akun gratis, dan untuk mendaftar hanya perlu alamat email."
