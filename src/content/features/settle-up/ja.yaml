meta:
  title: 少ない支払い回数で精算 | Side Badger
  description: グループの誰が誰に借りているかを確認し、全員を精算できる短い支払いリストを受け取り、支払いはその都度記録できます。無料でご利用いただけます。
h1: 少ない支払い回数で精算
navLabel: 精算
lead: Side Badgerはグループ全員の現在の残高を記録し、それを精算できる短い支払いリストを提案します。支払いは好きな方法で行い、そのあと記録します。まず数字の分け方を知りたい場合は、[割り勘の仕方](page:feature/split-expenses)から始めてください。
cta:
  heading: 誰が誰に借りているか、すっきりさせませんか？
  body: アカウントを作成し、グループを始めて、最初の支出を追加しましょう。あとは残高が引き継ぎます。
  button: 無料アカウントを作成
problem:
  heading: 追加するたびに更新される残高
  body: 支出が増えるたびに誰が誰に借りているかが変わるので、Side Badgerは支出と支払いが追加されるたびに残高を最新に保ちます。グループの全員に変更がすぐ表示され、何が変わったか、誰が変えたかもわかります。残高は通貨ごとに管理され、入力時に換算した場合を除き、ユーロとポンドはそれぞれ別の列に表示されます。初期設定では自分に関係する債務が表示され、**すべて表示**を押すとグループ全体が一覧できます。
workflow:
  heading: 3ステップでおあいこ
  steps:
    - title: 誰が誰に借りているかを見る
      body: グループの残高を開くと、自分が支払う金額、受け取る金額、そして全員を精算できる短い支払いリストが通貨ごとに表示されます。質問中の支出は、解決するまで計算に含まれません。下のルームメイトの例では、6回の支払いが2回になります。
      shot: S10
      shotAlt: 2つの通貨で簡略化された債務を表示し、「すべて表示」をオンにした残高画面
    - title: 好きな方法で支払い、そのあと記録する
      body: 銀行振込、現金、前回の旅行で貸したままの恩返し。Side Badgerがお金を動かすことはありません。お金が渡ったら支払いを記録すると、全員の残高が更新されます。
      shot: S11
      shotAlt: クイック精算ボタンと、一部支払いの場合の通知が表示された支払いフォーム
    - title: 反映されたか確認する
      body: 支払いはグループの履歴に残り、グループの全員が見られて、絵文字でリアクションできます。支払いが届いたら、お祝いしましょう。
      shot: S12
      shotAlt: 支払いに絵文字リアクションが付いた支払い履歴
