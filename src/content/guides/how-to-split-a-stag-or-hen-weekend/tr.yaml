faq:
  heading: "Sorular"
  items:
    - q: "Sağdıç ya da nedime daha fazla öder mi?"
      a: "Yalnızca grup anlaşırsa. Uygulama hesaplarda kimseye özel bir rol vermez. Biri daha fazlasını üstleniyorsa **Nasıl bölüştürülsün** altında **Tam tutarlar** ya da **Yüzde**'yi seçin ve anlaştığınız payları girin."
    - q: "Bazılarının içmediği içecekler ne olacak?"
      a: "İçecekleri kendi harcamaları olarak ekleyin ve yalnızca onları içenleri işaretleyin. Herkes farklı bir miktar içtiyse **Tam tutarlar**'ı seçin ve her kişinin payını yazın. Kimse içmediği şeyin parasını ödemez."
    - q: "Günün kahramanı grubu sonradan görebilir mi?"
      a: "Evet, sürpriz bittikten sonra. Onu davet edin, sonra bir yönetici grubun ayarlarındaki **Güvenlik** altında onu **İzleyici** yapabilir. İzleyici her şeyi görür ve hiçbir şeyi değiştirmez; bu yüzden hiçbir şey sır olmayana kadar bekleyin. Katılmak için ücretsiz bir hesaba ihtiyacı var."
