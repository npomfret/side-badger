meta:
  title: "Kitatu ordainketa gutxiagorekin | Side Badger"
  description: "Ikusi zure taldean nork nori zor dion, lortu denak kitatzen dituen ordainketa-zerrenda labur bat eta erregistratu ordainketa bakoitza gertatu ahala. Erabiltzeko doakoa."
h1: Kitatu ordainketa gutxiagorekin
navLabel: Kitatu
lead: Side Badger-ek taldekide guztien saldo korrontea gordetzen du eta dena kitatzen duen ordainketa-zerrenda labur bat proposatzen du. Zuek ordaintzen duzue nahi duzuen moduan, eta gero erregistratzen duzue. Zenbakiak nola banatzen diren aurretik ikusi nahi baduzu, hasi [gastuak banatzearekin](page:feature/split-expenses).
cta:
  heading: Nork nori zor dion askatzeko prest?
  body: Sortu kontu bat, hasi talde bat eta gehitu lehen gastua. Saldoek hortik aurrera jarraituko dute.
  button: Sortu doako kontu bat
problem:
  heading: Joan ahala eguneratzen diren saldoak
  body: Gastu bakoitzak aldatzen du nork nori zor dion, beraz Side Badger-ek saldoak egunean mantentzen ditu gastuak eta ordainketak gehitu ahala. Taldeko guztiek aldaketa berehala ikusten dute, eta zer aldatu den eta nork aldatu duen ere bai. Saldoak moneta bakoitzeko gordetzen dira, beraz euroak eta libera esterlinak beren zutabeetan geratzen dira, gastu bat sartzean bihurtu ez bada. Lehenespenez zuri dagozkizun zorrak ikusten dituzu; **Erakutsi guztiak** aukerak talde osoa zerrendatzen du.
workflow:
  heading: Hiru urrats kitatzeko
  steps:
    - title: Ikusi nork nori zor dion
      body: Ireki taldearen saldoak zuk zenbat zor duzun, zenbat zor zaizun eta denak kitatzen dituen ordainketa-zerrenda labur bat ikusteko, moneta bakoitzeko kalkulatuta. Zalantzan jarritako gastuak kalkuluetatik kanpo geratzen dira konpondu arte. Beheko etxekideen adibidean, sei ordainketa bi bihurtzen dira.
      shot: S10
      shotAlt: Saldoen pantaila, bi monetatako zor sinplifikatuekin eta “Erakutsi guztiak” aktibatuta
    - title: Ordaindu nahi duzun moduan, gero erregistratu
      body: Banku-transferentzia, eskudirua, joan den oporraldiko zor bat. Side Badger-ek ez du dirua mugitzen. Dirua eskuz aldatu denean, erregistratu ordainketa eta saldoa denentzat eguneratzen da.
      shot: S11
      shotAlt: Ordainketa-formularioa, likidazio azkarreko botoiekin eta ordainketa partzial baterako erakusten den oharrarekin
    - title: Egiaztatu iritsi dela
      body: Ordainketa taldearen historian sartzen da, non taldeko guztiek ikus dezaketen eta emoji batekin erreakzionatu. Ospatu ordainketa bat iristen denean.
      shot: S12
      shotAlt: Ordainketen historia, ordainketa bati emoji erreakzioekin
