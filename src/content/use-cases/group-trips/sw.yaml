faq:
  heading: "Maswali"
  items:
    - q: "Je, watu walioruka chakula cha jioni wanaweza kuachwa nje?"
      a: "Ndiyo. Chagua nani alihusika katika kila gharama na ni wao tu wanaotozwa."
    - q: "Je, inafanya kazi bila mawimbi?"
      a: "Hapana. Side Badger inahitaji muunganisho, kwa hivyo ongeza gharama ukirudi kwenye wifi."
    - q: "Je, kila mtu anahitaji kusakinisha kitu?"
      a: "Hapana. Inafanya kazi kwenye kivinjari. Tuma kiungo cha mwaliko na watu wanajiunga kutoka kwenye simu zao."
    - q: "Inatumia kiwango gani cha kubadilisha fedha?"
      a: "Kiwango cha sasa cha kubadilisha fedha unapoweka gharama, au chako mwenyewe ukipata tofauti. Kiwango hufungwa gharama inapohifadhiwa, kwa hivyo gharama za zamani hazipimwi upya kamwe."
    - q: "Je, tunaweza kugandisha kikundi baada ya safari?"
      a: "Ndiyo. Msimamizi anaweza kufunga kikundi ili nambari zibaki palepale."
    - q: "Je, kuna kikomo cha kiasi?"
      a: "Ndiyo. 999,999.99 kwa kila gharama, katika sarafu yake yenyewe."
