h1: "Side Badger vs Splitwise: y grŵp cyfan, nid y symiau'n unig"
navLabel: Side Badger vs Splitwise
lead: "Mae'n debyg bod rhywun yn eich grŵp wedi dweud “defnyddiwch Splitwise”. Digon teg: mae'n dda am y mathemateg. Mae Side Badger yn gwneud y mathemateg hefyd, ac yna'n rhoi lle i'r grŵp siarad amdano: sylwadau, cwestiynau, rhestrau, pleidleisiau a rolau grŵp go iawn. Mae sganio derbynebau a throsi arian cyfred am ddim."
