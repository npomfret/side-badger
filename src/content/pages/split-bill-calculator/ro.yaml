meta:
  title: "Calculator de împărțire a notei: cine cui datorează | Side Badger"
  description: "Cine a plătit, cine datorează, cine plătește cui: rezolvat în secunde. Împarte egal, exact sau procentual. Gratuit, în browser, fără nimic salvat sau trimis."
h1: "Calculator de împărțire a notei"
navLabel: "Calculator de împărțire a notei"
lead: "Scrie cine a plătit pentru ce, iar calculatorul îți spune cine cui datorează, cu o listă scurtă de plăți ca să vă achitați. Rulează în browserul tău, nu salvează nimic și nu mută bani. Dacă grupul vostru vrea ca socoteala să supraviețuiască filei, [împărțirea cheltuielilor](page:feature/split-expenses) și [decontarea](page:feature/settle-up) din Side Badger fac aceleași calcule și le păstrează."
cta:
  heading: "Îți plac socotelile? Păstrează-le."
  body: "Acest calculator uită totul când închizi fila, cam ca cel care jură că a plătit data trecută. Un grup Side Badger păstrează cheltuielile, actualizează soldul fiecăruia și înregistrează plățile. E gratuit, fără reclame și fără limite zilnice."
sections:
  - heading: "Cum se face calculul"
    body: "Pentru fiecare cheltuială, calculatorul stabilește partea fiecărei persoane. O poți împărți egal, pe sume exacte sau procentual, între persoanele pe care le alegi. Soldul fiecărei persoane este apoi ce a plătit minus ce datorează. Un semn plus înseamnă că grupul îi datorează, iar un semn minus înseamnă că persoana datorează grupului. Soldurile dau întotdeauna zero împreună, pentru că tot ce i se datorează cuiva este datorat de altcineva."
  - heading: "De ce lista de plăți este scurtă"
    body: "Nimeni nu trebuie să achite fiecare chitanță separat. După ce se știe fiecare sold, calculatorul îl potrivește pe cel care datorează cel mai mult cu cel căruia i se datorează cel mai mult, achită cât se poate printr-o singură plată și merge mai departe pe listă până când toți ajung la zero. Nu are nevoie niciodată de mai multe plăți decât numărul persoanelor cu sold minus una, iar adesea are nevoie de mai puține decât dacă ați achita chitanță cu chitanță. Oferă o listă scurtă de plăți și nu promite că este cea mai scurtă cu putință."
  - heading: "Ce nu face calculatorul"
    items:
      - "**Nu lucrează cu mai multe valute.** Alege una și folosește-o pentru tot calculul. Aplicația ține un sold separat pentru fiecare valută și poate converti o cheltuială la un curs de schimb actual, pe care îl poți schimba."
      - "**Nu salvează nimic.** Închide fila și cifrele dispar. Ca să le păstrezi, copiază linkul. Acesta conține cifrele tale după #, partea pe care browserul tău nu o trimite niciodată unui server, iar oricine primește linkul le poate citi."
      - "**Nu mută bani.** Îți spune cine ar trebui să plătească cui. Vă plătiți unii altora cum preferați, apoi înregistrați plata în aplicație dacă grupul vostru ține evidența acolo."
      - "**Nu alege la întâmplare cine primește restul de un ban.** Când o notă nu se împarte exact, bănuții rămași ajung la primele persoane din listă, ca totalurile să iasă tot corect. În aplicație, restul de un ban ajunge la o persoană aleasă la întâmplare, deci nu este mereu aceeași."
      - "**Nu depășește limitele.** Calculatorul acceptă de la 2 până la 20 de persoane, iar o cheltuială poate fi de până la 999.999,99, ca în aplicație."
