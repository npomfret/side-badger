meta:
  title: "Rent split calculator: by room size or income | Side Badger"
  description: "Bigger room, bigger share? Work out what each housemate pays, by room size or by income. It runs in your browser: nothing is saved or sent."
h1: Rent split calculator
navLabel: Rent split calculator
lead: Bigger bedroom, bigger share? Type in the rent and see what each person pays, by room size or by income, to the penny. It runs in your browser, saves nothing and moves no money. When the house wants the count kept, [split expenses](page:feature/split-expenses) in Side Badger and copy the rent every month.
cta:
  heading: Settle the percentages once. Copy them forever.
  body: This calculator forgets everything when you close the tab, much like the housemate who definitely paid the broadband. A Side Badger group keeps the rent, the bills and who has paid what. It is free, with no ads and no daily limits.
sections:
  - heading: Two ways to share the rent
    items:
      - "**By room size.** Part of the rent pays for the kitchen, bathroom and lounge, which everyone uses. You choose that share (40% to start with) and it is split equally. The rest goes by bedroom area, so the big room pays more and the box room gets the discount it has earned."
      - "**By income.** Everyone pays the same slice of the rent as they earn of the total. Add shared bills and they follow the same shares."
  - heading: How the sums work
    body: "Each person gets an exact share, then a whole percentage, because whole numbers are easier to type and to argue about. The rounding is the largest remainder method: everyone keeps the whole number below their share, and the leftover points go to whoever lost the most. The percentages always total 100. In the flat below, the shared 40% is 13.33% each. Priya's room is 16 of the flat's 38 m², so 60% × 16/38 is 25.26%, plus 13.33% makes 38.6%, which rounds to 39%. Tom and Aisha come out at 32% and 29%, and 39 + 32 + 29 is 100. Each amount is that percentage of the rent: 39% of £1,950 is £760.50."
  - heading: Then type it into Side Badger
    body: "For the whole story, tape measure included, see [how to split rent by room size](page:guide/how-to-split-rent-by-room-size), or [a partner who earns more](page:guide/how-to-split-bills-with-a-partner-who-earns-more) for couples."
    items:
      - "**Add the rent.** In your group, choose **Add Expense**, pick who paid the landlord under **Who paid?** and keep everyone under **Split between**."
      - "**Choose Percentage.** Under **How to split**, choose **Percentage** and type the whole percentages. The form flags it if they don't total 100."
      - "**Copy it next month.** Open last month's rent and choose **Copy expense**. The split comes with it."
  - heading: What the calculator doesn't do
    items:
      - "**Measure your rooms.** Floor area is a starting point. An en-suite is worth more than the same area without one, and a box room that fits a bed and a hopeful chair is worth less."
      - "**Decide what counts as income.** Take-home or gross, salary or side hustle: the group decides. Use the same period for everyone."
      - "**Save anything.** Close the tab and the figures are gone. To keep them, copy the link. It holds your figures after the #, which browsers never send to a server, and anyone with it can read them."
      - "**Move money.** You pay the landlord however you like."
      - "**Mix currencies, or go past the limits.** Pick one currency. It takes 2 to 10 people and a rent up to 999,999.99, as in the app."
