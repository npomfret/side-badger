meta:
  title: "Slik deler dere regningene når den ene tjener mer | Side Badger"
  description: "50/50 blir kleint når den ene av dere tjener langt mer. Del de felles regningene etter inntekt i stedet, med regnestykket vist for to og uten regneark."
h1: "Slik deler du regningene med en partner som tjener mer"
navLabel: "Partner som tjener mer"
lead: "Legg sammen lønnen etter skatt, regn ut hver persons andel av summen og rund av til hele prosenter. Maya har 2 800 £ i lønn etter skatt og Jon 1 700 £, så de deler de felles regningene 62/38. Legg inn de prosentene på en felles utgift i Side Badger, og kopier den hver gang samme regning kommer."
cta:
  heading: "Gjør regnestykket én gang"
  body: "Opprett en gratis konto, lag en gruppe for dere to og legg inn husleien med prosentene deres. Neste måneds husleie er en kopi. Vil du ha omvisningen først? Se [hvordan det fungerer](page:how-it-works) eller [hva gratis dekker](page:pricing)."
sections:
  - heading: "To lønninger, én leilighet, én høflig stillhet"
    body: "Maya og Jon bor sammen. Maya har 2 800 £ i måneden etter skatt, og Jon har 1 700 £. I to år delte de alt 50/50, fordi det var enkelt og ingen av dem ville være den som tok det opp. Så tok Jon en titt på husleien alene. Halvparten av 1 400 £ er 700 £, som er en fjerdedel av Mayas lønn etter skatt og 41% av hans. Ingen hadde vært urettferdige. Ingen hadde gjort regnestykket. Mange [par](page:use-case/couples) havner her før eller siden. Over en takeaway ble de enige om at de felles regningene burde ta en lignende bit av hver lønn."
  - heading: "Metoden, med regnestykket vist"
    body: "Fire steg, én kalkulator og en samtale dere skulle ha tatt uansett."
    items:
      - "**Bli enige om hva som regnes som lønn.** Maya og Jon bruker lønn etter skatt, pengene som kommer inn på kontoen hver måned. Til sammen er det 2 800 £ + 1 700 £ = 4 500 £."
      - "**Regn ut hver andel.** Mayas er 2 800 ÷ 4 500, som er 62,2%. Jons er 1 700 ÷ 4 500, som er 37,8%."
      - "**Rund av til hele prosenter.** 62,2% blir 62 og 37,8% blir 38. Med to personer runder du av ett tall og trekker det fra 100 for å få det andre, så blir summen alltid 100."
      - "**Sjekk hva det betyr.** På husleien på 1 400 £ betaler Maya 868 £ (62%) og Jon 532 £ (38%). Det er omtrent 31% av hver persons lønn etter skatt. Halvparten hver ville tatt 25% av Mayas og 41% av Jons."
  - heading: "Slik ser måneden ut"
    body: "Maya betalte husleien på 1 400 £ og Jon betalte de øvrige 216 £. Mayas andel av måneden er 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, og hun betalte 1 400 £, så hun har 402,40 £ til gode. Jons andel er 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, og han betalte 216 £, så han skylder 402,40 £. Side Badger foreslår én betaling, Jon til Maya, på 402,40 £, og du registrerer den under [gjøre opp](page:feature/settle-up) når den er gjort. Delt 50/50 ville den samme måneden endt med at Jon betalte Maya 592,00 £."
  - heading: "Sett det opp i Side Badger"
    body: "Ti minutter, mesteparten brukt på prosentene."
    items:
      - "**Lag gruppen.** På oversikten velger du **Opprett gruppe** og gir den navn etter leiligheten. Velg **Inviter andre** og send Jon lenken eller QR-koden. Han logger inn eller oppretter en gratis konto, og velger navnet han vil vises med i denne gruppen. Bare medlemmer kan se en gruppe, så denne er bare dere to."
      - "**Legg til husleien.** Velg **Legg til utgift**. Skriv inn beskrivelse og beløp, og under **Hvem betalte?** velger du Maya. La begge stå under **Fordel mellom**, og velg så **Prosent** under **Hvordan fordele** og skriv 62 og 38. Skjemaet varsler hvis prosentene ikke summerer seg til 100. Velg **Lagre utgift**."
      - "**Legg til de andre regningene.** Strøm og bredbånd legges inn på samme måte, med Jon som betaler og de samme 62 og 38. Takeawayen er en egen utgift, med **Hvordan fordele** stående på **Likt**."
      - "**Kopier den neste måned.** Åpne forrige måneds husleie og velg **Kopier utgift**. Kopien beholder betaleren, beløpet og fordelingen, og får dagens dato. Endre beløpet hvis husleien har endret seg, og velg så **Opprett kopi**. Strømregningen fungerer på samme måte."
      - "**Sjekk hvem som skylder hvem.** Delen **Saldoer** viser det og foreslår en kort liste over betalinger. Betal hverandre slik dere vil, og registrer så betalingen under **Gjør opp**."
  - heading: "50/50, etter inntekt eller regning for regning"
    body: "Det finnes ikke noe riktig svar, bare det dere begge kan leve med. Tre vanlige."
    items:
      - "**Halvparten hver for alt.** Det enkleste å holde styr på, og det passer for par med lønn som ligger nær hverandre."
      - "**Etter inntekt for alt felles.** Det Maya og Jon gjør. Én samtale, ett par prosenter."
      - "**Regning for regning.** Husleie og regninger etter inntekt, ferier og godbiter 50/50 eller hva dere ellers blir enige om, og hver regning får regelen som passer den."
  - heading: "Bli enige om hva som er felles"
    body: "Krangelen handler som regel om listen, ikke prosentene. Husleie, strøm, bredbånd, ukehandelen og sofaen regnes som felles i de fleste hjem. Mayas treningsabonnement og Jons fotballabonnement gjør kanskje ikke det. Bli enige om listen én gang, skriv den ned og legg bare de felles kostnadene i gruppen."
  - heading: "Takeawayen forblir 50/50, med vilje"
    body: "Godbiter er små og frivillige, og ingen bør trenge en kalkulator for å bestille dumplings. I Side Badger er takeawayen bare en utgift til. Jon betaler 36 £, **Hvordan fordele** står på **Likt**, og hver av dem får en andel på 18 £."
  - heading: "Når noens lønn endrer seg"
    body: "En lønnsøkning, en ny jobb eller permisjon endrer regnestykket. Regn ut de nye prosentene på samme måte og bruk dem fra neste utgift. Tidligere utgifter blir stående som de var. Kopier forrige måneds husleie, endre prosentene og velg **Opprett kopi**. For å rette en som allerede er lagt inn, redigerer du den hvis gruppens tillatelser tillater det, og sier fra til partneren din først, fordi saldoene endrer seg. Den tidligere versjonen blir bevart. Bli enige om når dere skal regne om, for eksempel én gang i året, og gjør opp før dere bytter, så den gamle fordelingen avsluttes med et rent regnskap."
  - heading: "Hva Side Badger ikke gjør her"
    items:
      - "Den spør aldri hva noen tjener og regner ikke ut prosentene. Du skriver inn tallene dere ble enige om."
      - "Den kan ikke sette en standardfordeling for hele gruppen. Prosentene settes på hver utgift, så kopier en som allerede har dem."
      - "Den har ingen gjentakende regninger, så du kopierer forrige måneds husleie hver gang."
      - "Den flytter aldri penger. Dere betaler hverandre slik dere vil og registrerer det."
