featuresHeading: De funktioner, dette bruger
faq:
  heading: Spørgsmål
  items:
    - q: Kan gæster se gruppen uden at være med?
      a: Nej. Folk tilmelder sig med et link eller en QR-kode og en gratis konto, så de kan se gruppen, når de er kommet ind.
    - q: Kan Side Badger opkræve pengene?
      a: Nej. Side Badger fører regnskabet og flytter aldrig penge. Betal hinanden, som I vil, og registrer så betalingen. Den er gratis, uden reklamer og uden daglige grænser; se [priser](page:pricing).
    - q: Kan afstemninger være anonyme?
      a: Ja. Når du opretter en afstemning, kan du skjule, hvem der stemte på hvad. Indstillingerne kan kun ændres før den første stemme.
    - q: Kan folk bidrage med forskellige beløb?
      a: Ja. Del en udgift efter nøjagtige beløb, så hver persons andel er det tal, I aftalte, eller udelad dem, der ikke var med.
    - q: Kan en arrangør føre regnskabet?
      a: Ja. Brug forudindstillingen for administreret gruppe, så kun oprettere og administratorer ændrer udgifter, og administratorer godkender nye medlemmer.
