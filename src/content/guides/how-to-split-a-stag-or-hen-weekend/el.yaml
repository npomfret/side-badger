faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Πληρώνει περισσότερα ο κουμπάρος ή η κουμπάρα;"
      a: "Μόνο αν το συμφωνήσει η ομάδα. Η εφαρμογή δεν δίνει σε κανέναν ειδικό ρόλο στους υπολογισμούς. Αν κάποιος καλύπτει περισσότερα, επιλέξτε **Ακριβή ποσά** ή **Ποσοστό** στο **Τρόπος διαχωρισμού** και βάλτε τα μερίδια που συμφωνήσατε."
    - q: "Τι γίνεται με τα ποτά που δεν ήπιαν κάποιοι;"
      a: "Προσθέστε τα ποτά ως δικό τους έξοδο και τσεκάρετε μόνο όσους τα ήπιαν. Αν ο καθένας ήπιε διαφορετικά, επιλέξτε **Ακριβή ποσά** και πληκτρολογήστε το μερίδιο του καθενός. Κανείς δεν πληρώνει γι' αυτό που δεν ήπιε."
    - q: "Μπορεί το άτομο που γιορτάζει να δει την ομάδα αργότερα;"
      a: "Ναι, όταν τελειώσει η έκπληξη. Προσκαλέστε το άτομο και μετά ένας διαχειριστής μπορεί να του δώσει τον ρόλο **Θεατής** στην καρτέλα **Ασφάλεια & Δικαιώματα** των ρυθμίσεων της ομάδας. Ένας θεατής βλέπει τα πάντα και δεν αλλάζει τίποτα, οπότε περιμένετε μέχρι να μη μείνει τίποτα μυστικό. Για να μπει, χρειάζεται ένας δωρεάν λογαριασμός."
