meta:
  title: "Lijsten, peilingen en opmerkingen bij uitgaven | Side Badger"
  description: "Reageer op uitgaven, stel de rare in vraag, hou een boodschappenlijst bij en stem over de villa. Plan samen, verdeel daarna. Gratis, zonder advertenties."
h1: "Plan het samen, verdeel het achteraf"
navLabel: "Samen plannen"
lead: "De boodschappenlijst en de boodschappenrekening, eindelijk weer op goede voet. Side Badger geeft je groep een plek om over het geld te praten voor en nadat het is uitgegeven, met opmerkingen bij elke uitgave, een manier om de uitgaven die er raar uitzien in vraag te stellen, gedeelde lijsten en peilingen voor de grote keuzes. Daarna [verdeel je de uitgaven](page:feature/split-expenses) zoals gewoonlijk."
cta:
  heading: "Plan het, verdeel het dan"
  body: "Maak een gratis account aan, start een groep en zet de eerste lijst, peiling of vraag meteen naast het geld. Weet je niet wat er daarna gebeurt? Zie [zo werkt het](page:how-it-works)."
problem:
  heading: "De chat is hier, de rekening daar"
  body: "Groepsuitgaven leven meestal op twee plaatsen. De cijfers staan op de ene, en de discussie over die cijfers staat in een chat die dinsdag al weggescrold is. De boodschappenlijst is een foto van een koelkast. De villa werd beslist met een duim omhoog van de meeste mensen, waarschijnlijk. Side Badger houdt het plannen in de groep, naast de uitgaven waarover het gaat. Zo staat er een opmerking waar de kost staat, een lijst waar de boodschappen zijn, een peiling voor de grote keuze en een manier om “wacht even, klopt dit wel?” te zeggen zonder een alinea te schrijven. Het blijft allemaal over het geld van de groep, daar dient de groep voor."
workflow:
  heading: "Van de villastemming tot de boodschappenrekening"
  steps:
    - title: "Leg de grote keuze ter stemming voor"
      body: "Voeg een peiling toe voor de beslissing die de rekening bepaalt, zoals welke villa. Kies twee tot tien opties, bepaal hoeveel stemmen elke persoon krijgt en sluit de peiling zodra iedereen gestemd heeft. De winnaar wordt dan gemarkeerd."
      shot: S17
      shotAlt: "Een gesloten peiling met de winnende optie gemarkeerd en het aantal stemmen naast elke optie"
    - title: "Schrijf samen de boodschappenlijst"
      body: "Start een gedeelde lijst, voeg de items toe en vink ze af zodra ze in het karretje belanden. De boodschappen komen achteraf als uitgave."
      shot: S16
      shotAlt: "Een gedeelde boodschappenlijst met enkele items afgevinkt en een voortgangsteller"
    - title: "Praat over de kost waar die staat"
      body: "Plaats een opmerking bij de uitgave zelf, voeg het bonnetje toe en reageer met een emoji. Het gesprek blijft naast het getal waarover het gaat."
      shot: S08
      shotAlt: "Een uitgave met haar details, een miniatuur van het bonnetje, een opmerkingendraad en emoji-reacties"
    - title: "Stel de uitgave in vraag die er raar uitziet"
      body: "Als de groep uitgavenvragen heeft ingeschakeld, kan iedereen die bij een uitgave betrokken is **Ik heb een vraag** kiezen. De uitgave blijft buiten de saldi tot de vraag is afgehandeld."
      shot: S18
      shotAlt: "De uitgavenlijst met een badge In vraag gesteld en het filter Alleen in vraag gesteld"
    - title: "Zie wat er veranderd is, en wie het deed"
      body: "De activiteitenfeed en het belletje met meldingen tonen wat er nieuw is in al je groepen. Pushmeldingen zijn er als je ze wilt."
      shot: S19
      shotAlt: "Het uitklapmenu met meldingen en een lijst van recente activiteit"
