meta:
  title: "Dziel koszty w 140 walutach, przeliczone lub osobno"
  description: "Wpisuj każdy wydatek w walucie, w której zapłacono, trzymaj salda osobno albo przeliczaj po kursie, który widzisz i możesz zmienić, a potem rozlicz się krótką listą płatności."
h1: "Dziel koszty w 140 walutach"
navLabel: "Wiele walut"
lead: "Euro, jeny i ta jedna taksówka w bahtach. Side Badger przyjmuje każdy wydatek w walucie, w której zapłacono, pilnuje sald i może przeliczać, gdy grupa woli rozliczyć się raz. Działa w 140 walutach i świetnie pasuje do [wyjazdów grupowych](page:use-case/group-trips)."
cta:
  heading: "Przynieś swoje euro, przynieś swoje jeny"
  body: "Załóż konto, utwórz grupę i dodaj pierwszy wydatek w jakiejkolwiek walucie, która akurat była pod ręką."
  button: "Załóż darmowe konto"
problem:
  heading: "Wpisz tak, jak zapłacono"
  body: "Wyjazd rzadko jest opłacony w jednej walucie. Hotel zarezerwowano w domu w funtach, kolację zapłacono w jenach, a kawa na lotnisku była w tej walucie, w której akurat była przesiadka. Przeliczanie wszystkiego ręcznie, zanim w ogóle to wpiszesz, to sposób, w jaki porzuca się arkusze. W Side Badger wpisujesz każdy wydatek w walucie z paragonu, a każda kwota trzyma się zasad swojej waluty, więc jeny nie mają miejsc po przecinku, a dinary mają trzy. Ostatnio używane waluty są na początku listy."
workflow:
  heading: "Trzymaj waluty osobno albo przeliczaj na bieżąco"
  steps:
    - title: "Dodaj wydatek w jego własnej walucie"
      body: "Wybierz walutę, wpisz kwotę, powiedz, kto zapłacił i kto dzielił koszt. Nic więcej nie trzeba. To ustawienie domyślne i zachowuje oryginalną kwotę dokładnie tak, jak ją wpisano."
      shot: S07
      shotAlt: "Formularz wydatku z wpisaną kwotą w jenach"
    - title: "Patrz na saldo w każdej walucie"
      body: "Salda są prowadzone osobno dla każdej waluty, a każde ma własną krótką listę podpowiadanych płatności. Funty rozlicza się w funtach, a jeny w jenach."
      shot: S10
      shotAlt: "Ekran sald z uproszczonymi długami w dwóch walutach"
    - title: "Albo przelicz, gdy grupa woli rozliczyć się raz"
      body: "Wybierz inną walutę przy wpisywaniu wydatku, a Side Badger może przeliczyć go po aktualnym kursie, który możesz zmienić na ten, który faktycznie obowiązywał. Przeliczona kwota dołącza do salda w tej walucie. Przeliczanie to wybór grupy, nigdy coś, co dzieje się za twoimi plecami."
options:
  heading: "Kurs, który widzisz i możesz zmienić"
  items:
    - title: "Kurs jest widoczny"
      body: "Gdy przeliczasz, kurs i przeliczona kwota pojawiają się w formularzu, więc nikt nie musi wierzyć liczbie na słowo."
    - title: "Wpisz własny"
      body: "Trafił ci się lepszy kurs w kantorze albo gorszy na lotnisku? Zmień kurs na ten, który faktycznie obowiązywał, a przeliczona kwota się zaktualizuje."
    - title: "Oryginał zostaje"
      body: "Oryginalna kwota zostaje przy wydatku, obok przeliczonej, dla każdego, kto zapyta, ile to było w jenach."
    - title: "Przeliczanie za darmo"
      body: "Przeliczanie nic nie kosztuje. Nie ma opłaty za wpisanie wydatku w innej walucie."
