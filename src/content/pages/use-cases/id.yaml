meta:
  title: "Side Badger untuk teman serumah, perjalanan, dan pesta"
  description: "Bagi biaya dengan teman serumah, dalam perjalanan grup, dan untuk pesta, pernikahan, serta kado bersama. Lihat apa yang dilakukan Side Badger untuk tiap jenis grup."
h1: "Side Badger untuk jenis grup Anda"
navLabel: "Kasus penggunaan"
lead: "Teman serumah, liburan, pesta lajang. Pilih kekacauan Anda, lalu lihat bagaimana grup seperti Anda menjaga hitungan."
intro: "Setiap grup membagi biaya dengan cara yang sedikit berbeda. Halaman-halaman ini mengikuti **skenario realistis** dari pengeluaran pertama sampai pembayaran terakhir yang dicatat, lengkap dengan hitungannya, sehingga Anda bisa melihat hasil yang akan didapat grup Anda sendiri."
cta:
  heading: "Sudah menemukan jenis grup Anda?"
  body: "Buat akun, mulai grup, dan tambahkan pengeluaran pertama. Hanya butuh beberapa menit."
  button: "Buat akun gratis"
cardsHeading: "Pilih situasi yang paling mirip dengan Anda"
sections:
  - heading: "Perjalanan grup"
    body: "Tiket pesawat dalam pound, vila dalam euro, dan makan malam yang hanya dimakan tiga orang. Atur grup agar mengonversi ke pound dan empat teman di Lisbon selesai dengan tiga pembayaran, bukan enam seperti ketika mata uangnya dipisahkan. [Bagi biaya perjalanan grup](page:use-case/group-trips)."
  - heading: "Teman serumah"
    body: "Satu orang membayar pemilik rumah, yang lain ingat tagihan listrik, dan tak ada yang sepakat siapa yang membeli tisu toilet. Dengan sewa dibagi menurut ukuran kamar dan tagihan lain dibagi rata, empat teman serumah mengakhiri bulan dengan tiga pembayaran, semuanya kepada yang membayar sewa. [Bagi tagihan rumah tangga dengan teman serumah](page:use-case/housemates)."
  - heading: "Pesta, pernikahan, dan kado bersama"
    body: "Enam orang memilih kado, satu membelinya, dan tidak semua urunan dengan jumlah yang sama. Kado £150 yang dibagi berdasarkan jumlah pasti menyisakan lima pembayaran kepada orang yang membelinya, total £120. [Bagi biaya sebuah acara](page:use-case/events-and-celebrations)."
  - heading: "Pasangan"
    body: "Bagi biaya yang membosankan tanpa mengubah kencan malam menjadi rapat keuangan kuartalan. Sewa dibagi 60/40 dan belanjaan dibagi rata berujung pada satu pembayaran di antara Anda berdua."
  - heading: "Lihat dulu cara kerjanya"
    body: "Setiap contoh di atas memakai langkah yang sama, dari membuat grup sampai mencatat pembayaran. [Cara kerja](page:how-it-works) menjelaskannya, dan [harga](page:pricing) menyebutkan berapa biayanya, yaitu nol, tanpa iklan dan tanpa batas harian."
faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah semua orang dalam grup perlu akun?"
      a: "Ya. Orang bergabung dengan tautan atau kode QR dan akun gratis."
    - q: "Bisakah Side Badger menagih uangnya?"
      a: "Tidak. Anda membayar dengan cara apa pun yang Anda suka, lalu catat pembayarannya agar saldo tetap benar."
    - q: "Apakah saya harus memilih satu jenis grup?"
      a: "Tidak. Kasus penggunaan ini hanyalah contoh, bukan pengaturan. Setiap grup punya fitur yang sama, jadi pakai kombinasi mana pun yang cocok."
