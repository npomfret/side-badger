meta:
  title: "Áireamhán chun cíos a roinnt: seomra nó ioncam | Side Badger"
  description: "Seomra níos mó, sciar níos mó? Oibrigh amach cad a íocann gach comhchónaitheoir, de réir seomra nó ioncaim. Ritheann sé i do bhrabhsálaí: ní shábháiltear ná ní sheoltar aon rud."
h1: "Áireamhán chun cíos a roinnt"
navLabel: "Áireamhán chun cíos a roinnt"
lead: "Seomra leapa níos mó, sciar níos mó? Cuir isteach an cíos agus féach cad a íocann gach duine, de réir méid an tseomra nó de réir ioncaim, go dtí an phingin. Ritheann sé i do bhrabhsálaí, ní shábhálann sé tada agus ní bhogann sé aon airgead. Nuair a theastaíonn ón teach go gcoinneofaí an cuntas, [roinn costais](page:feature/split-expenses) i Side Badger agus cóipeáil an cíos gach mí."
cta:
  heading: "Socraigh na céatadáin uair amháin. Cóipeáil iad go brách."
  body: "Déanann an t-áireamhán seo dearmad ar gach rud nuair a dhúnann tú an cluaisín, díreach cosúil leis an gcomhchónaitheoir a bhfuil sé cinnte gur íoc sé an t-idirlíon. Coinníonn grúpa Side Badger an cíos, na billí agus cé a d'íoc cad. Tá sé saor in aisce, gan fógraí agus gan teorainneacha laethúla."
sections:
  - heading: "Dhá bhealach chun an cíos a roinnt"
    items:
      - "**De réir méid an tseomra.** Íocann cuid den chíos as an gcistin, an seomra folctha agus an seomra suí, a úsáideann gach duine. Roghnaíonn tú an sciar sin (40% chun tosú) agus roinntear go cothrom é. Téann an chuid eile de réir achar an tseomra leapa, mar sin íocann an seomra mór níos mó agus faigheann an cófra an lascaine atá tuillte aige."
      - "**De réir ioncaim.** Íocann gach duine sciar den chíos atá comhionann leis an sciar a thuilleann siad den iomlán. Cuir billí comhroinnte leis agus leanann siad na sciair chéanna."
  - heading: "Conas a oibríonn na suimeanna"
    body: "Faigheann gach duine sciar chruinn, ansin céatadán slán, mar is éasca uimhreacha slána a chlóscríobh agus argóint a dhéanamh fúthu. Cruinnítear de réir mhodh an fhuílligh is mó: coinníonn gach duine an tslánuimhir faoi bhun a sciar, agus téann na pointí céatadáin atá fágtha chuig an té a chaill an chuid is mó. Déanann na céatadáin 100 le chéile i gcónaí. San árasán thíos, is ionann an 40% comhroinnte agus 13.33% an duine. Tá 16 de 38 m² an árasáin i seomra Priya, mar sin is ionann 60% × 16/38 agus 25.26%, agus le 13.33% breise is é 38.6% an t-iomlán, a chruinnítear go 39%. Tagann Tom agus Aisha amach ag 32% agus 29%, agus is ionann 39 + 32 + 29 agus 100. Is é gach méid an céatadán sin den chíos: is ionann 39% de £1,950 agus £760.50."
  - heading: "Ansin clóscríobh isteach i Side Badger é"
    body: "Chun an scéal iomlán a fháil, téip tomhais san áireamh, féach [conas cíos a roinnt de réir méid an tseomra](page:guide/how-to-split-rent-by-room-size), nó [páirtí a thuilleann níos mó](page:guide/how-to-split-bills-with-a-partner-who-earns-more) do lánúineacha."
    items:
      - "**Cuir an cíos leis.** I do ghrúpa, roghnaigh **Cuir Costas Leis**, roghnaigh cé a d'íoc an tiarna talún faoi **Cé a d'íoc?** agus fág gach duine roghnaithe faoi **Roinn idir**."
      - "**Roghnaigh Céatadán.** Faoi **Conas a roinntear**, roghnaigh **Céatadán** agus clóscríobh na céatadáin shlána. Cuireann an fhoirm in iúl duit mura ndéanann siad 100 le chéile."
      - "**Cóipeáil é an mhí seo chugainn.** Oscail cíos na míosa seo caite agus roghnaigh **Cóipeáil an costas**. Tagann an roinnt leis."
  - heading: "Cad nach ndéanann an t-áireamhán"
    items:
      - "**Do sheomraí a thomhas.** Is pointe tosaigh é achar urláir. Is fiú níos mó seomra le seomra folctha príobháideach ná an t-achar céanna gan ceann, agus is fiú níos lú cófra a oireann do leaba agus do chathaoir dhóchasach."
      - "**Cinneadh cad a áirítear mar ioncam.** Pá glan nó pá comhlán, tuarastal nó obair bhreise: cinneann an grúpa. Úsáid an tréimhse chéanna do gach duine."
      - "**Aon rud a shábháil.** Dún an cluaisín agus tá na figiúirí imithe. Chun iad a choinneáil, cóipeáil an nasc. Coinníonn sé do chuid figiúirí i ndiaidh an #, rud nach seolann brabhsálaithe chuig freastalaí choíche, agus is féidir le haon duine a bhfuil sé aige iad a léamh."
      - "**Airgead a bhogadh.** Íocann tú an tiarna talún ar an gcaoi is fearr leat."
      - "**Airgeadraí a mheascadh, nó dul thar na teorainneacha.** Roghnaigh airgeadra amháin. Glacann sé le 2 go 10 duine agus le cíos suas le 999,999.99, mar atá san aip."
