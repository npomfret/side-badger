sections:
  - heading: Vad Splitwise gör bra
    body: "Om din grupp behöver en inbyggd app, offlineanvändning eller betalningar i appen är Splitwise det förnuftiga valet, och vi vill hellre att du väljer det än får veta senare. Dess egna sidor listar:"
    items:
      - "**Appar och offlineanvändning.** Appar för iPhone och Android utöver webben, och ett offlineläge."
      - "**Fler sätt att dela.** Andelar, justeringar och delning per artikel, utöver lika, exakt och i procent."
      - "**Återkommande utgifter.** Ställ in att hyran ska upprepas och glöm den."
      - "**Betalningar i appen.** I vissa länder kan den flytta pengarna också, via Splitwise Pay, Venmo, PayPal eller Pay by Bank."
  - heading: Gratis här, betalt där
    body: "Splitwise Pro är Splitwises betalplan, och dess egen Pro-sida säljer fyra saker som inte kostar något i Side Badger."
    items:
      - "**Kvittoskanning.** Splitwise Pro skannar en bild av ditt kvitto. Side Badger gör det gratis, utan skanningskrediter: den fyller i summa, datum och plats så att du kan kontrollera dem. Kvittobilder läses av Googles AI-tjänst."
      - "**Valutaomräkning.** Splitwise Pro räknar om en grupps utgifter till din standardvaluta när du trycker på Convert. Side Badger räknar om varje utgift när du lägger in den, med en aktuell växelkurs eller den du faktiskt fick, och det ursprungliga beloppet finns kvar på utgiften."
      - "**Inga annonser.** Splitwise listar en helt annonsfri upplevelse som en Pro-funktion. Side Badger har inga annonser."
      - "**Inga dagliga gränser.** Splitwise Pro säljer obegränsade utgifter, och dess hjälpcenter säger att gratisanvändare kan lägga till upp till 4 utgifter per dag. Side Badger har inga dagliga gränser."
  - heading: Vad Splitwise har som Side Badger inte har
    body: "Det här är inte alla Splitwises funktioner, bara de som brukar avgöra. Splitwises egna sidor har hela listan. Här är var Side Badger kommer till korta."
    items:
      - "**Inbyggda appar.** Side Badger fungerar i din webbläsare. Logga in och lägg sedan till det på hemskärmen så öppnas det som en app."
      - "**Offlineläge.** Side Badger behöver en uppkoppling."
      - "**Betalningar i appen.** Side Badger rör aldrig dina pengar. Betala varandra hur ni vill och registrera sedan betalningen."
      - "**Återkommande utgifter.** Side Badger har inga. Kopiera förra månadens hyra i stället för att skriva in den igen."
      - "**Delning per andel eller artikel.** Side Badger har en betalare per utgift, delad lika, efter exakta belopp eller i procent. Kvittoskanningen tilldelar inte artiklar till personer."
      - "**Diagram och standarddelningar.** Splitwise Pro har båda. Side Badger håller räkningen på vem som är skyldig vem, och det är hela tricket."
  - heading: Flytta över din grupp
    body: "Det finns ingen importfunktion, så en flytt innebär en ny start. Gör upp i Splitwise först, skapa sedan en grupp i Side Badger och bjud in alla med en länk eller en QR-kod. Alla i gruppen behöver ett gratiskonto, och allt som krävs för att registrera sig är en e-postadress."
