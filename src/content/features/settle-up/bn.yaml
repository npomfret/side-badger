sections:
  - heading: "পেমেন্ট রেকর্ড করুন"
    body: "কেউ পেমেন্ট করলে সেটা সঠিক ব্যক্তির নামে রেকর্ড করুন। দ্রুত-সেটল বোতামগুলো আপনার সাজেস্ট করা পেমেন্ট থেকে পরিমাণ ভরে দেয়, আর আপনি “ব্যাংক ট্রান্সফার”-এর মতো একটি নোট যোগ করতে পারেন (500 অক্ষর পর্যন্ত)। যা দেওয়ার আছে তার শুধু একটি অংশ দিলে বাকিটা ব্যালেন্সে থেকে যায়। বেশি বা কম লিখলে সেভ করার আগে Side Badger আপনাকে সতর্ক করে। পেমেন্ট রেকর্ড করতে খরচ সম্পাদনার অনুমতি লাগে, আর তারিখ ভবিষ্যতের হতে পারে না।"
  - heading: "অন্য মুদ্রায় দিয়েছেন?"
    body: "ব্যালেন্স সেই মুদ্রাতেই থাকে যাতে পেমেন্ট হয়েছে, তাই ইউরোর দেনা ইউরোর দেনাই থাকে। ইউরো দিতে হবে কিন্তু পাউন্ডে দেবেন? পেমেন্ট লেখার সময় রূপান্তর করুন, বর্তমান এক্সচেঞ্জ রেটে বা আসলে যে রেট পেয়েছেন সেটায়। পেমেন্ট সেভ হওয়ার সময় রেট স্থির হয়ে যায়। রূপান্তর কীভাবে কাজ করে তা [একাধিক মুদ্রা](page:feature/multiple-currencies) বলে, আর [গ্রুপ ট্রিপ](page:use-case/group-trips) সেটা ব্যবহারে দেখায়।"
  - heading: "যে ইতিহাস যাচাই করা যায়"
    body: "রেকর্ড করা প্রতিটি পেমেন্ট তারিখ, পরিমাণ আর নোটসহ গ্রুপের ইতিহাসে থাকে। পেমেন্ট সম্পাদনা করতে পারে শুধু যে সেটা রেকর্ড করেছে, আর সে বা গ্রুপের অ্যাডমিন সেটা মুছতে পারে। গ্রুপ ছেড়ে যাওয়া কেউ জড়িত থাকলে সেই পেমেন্ট তালাবদ্ধ হয়ে যায়। রুমমেটদের একটি পুরো পরিস্থিতির জন্য দেখুন [রুমমেট](page:use-case/housemates)।"
limits:
  heading: "Side Badger যা করে না"
  items:
    - "Side Badger টাকা নাড়াচাড়া করে না, পেমেন্ট লিঙ্ক বা পেমেন্টের অনুরোধ পাঠায় না। অ্যাপে একটি পেমেন্ট মানে অন্য কোথাও হওয়া পেমেন্টের রেকর্ড।"
    - "সাজেস্ট করা পেমেন্টগুলো একটি সহজ মেলানোর পদ্ধতি থেকে আসে, যা মুদ্রা ধরে আলাদাভাবে চলে। এটি সবসময় সেই মুদ্রায় ব্যালেন্স আছে এমন মানুষের সংখ্যার চেয়ে কম পেমেন্ট সাজেস্ট করে (চারজন হলে সর্বোচ্চ তিনটি), কিন্তু সবসময় সম্ভাব্য সবচেয়ে কম সংখ্যাটি খুঁজে পায় না।"
    - "আপনি সাজেশন বন্ধ করতে পারবেন না। **সবাইকে দেখান** গ্রুপের প্রতিটি সাজেস্ট করা পেমেন্ট দেখায়, শুধু আপনারগুলো নয়।"
    - "খরচ লেখার সময় রূপান্তর না করা হলে মুদ্রাগুলো কখনও একে অপরের সঙ্গে কাটাকাটি হয় না।"
    - "কোনো রিমাইন্ডার নেই, তাই পেমেন্টের তাগাদা দেওয়া এখনও আপনার ওপরই।"
useCasesHeading: "যেখানে হিসাব মেটানো গুরুত্বপূর্ণ"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "Side Badger কি টাকা পাঠায়?"
      a: "না। যেভাবে খুশি একে অপরকে দিন, তারপর Side Badger-এ পেমেন্টটা রেকর্ড করুন যাতে ব্যালেন্স হালনাগাদ হয়।"
    - q: "সাজেস্ট করা পেমেন্ট কি বন্ধ করা যায়?"
      a: "না। সরলীকরণ চালু থাকে, আর **সবাইকে দেখান** গ্রুপের প্রতিটি সাজেস্ট করা পেমেন্ট দেখায়, শুধু আপনি জড়িত যেগুলোতে সেগুলো নয়।"
    - q: "ইউরো আর পাউন্ড আলাদা রাখা হয় কেন?"
      a: "আপনি যে মুদ্রায় দিয়েছেন ব্যালেন্স সেই মুদ্রাতেই থাকে, যদি না খরচ বা পেমেন্ট লেখার সময় আপনি রূপান্তর করেন। আলাদা মুদ্রার দেনা কখনও একে অপরের সঙ্গে কাটাকাটি হয় না।"
    - q: "কেউ যা দেওয়ার আছে তার শুধু একটি অংশ দিলে?"
      a: "যে অংশটা দিয়েছে সেটা রেকর্ড করুন। বাকিটা শোধ না হওয়া পর্যন্ত ব্যালেন্সে থাকে।"
    - q: "এটি কি সবসময় সম্ভাব্য সবচেয়ে কম সংখ্যক পেমেন্ট?"
      a: "নিশ্চয়তা নেই। এটি সবসময় সেই মুদ্রায় ব্যালেন্স আছে এমন মানুষের সংখ্যার চেয়ে কম পেমেন্ট সাজেস্ট করে, তাই চারজনের জন্য তিনটির বেশি কখনও করে না। রুমমেটদের উদাহরণে সেটা দুটি পেমেন্ট, যেখানে প্রত্যেককে সরাসরি ফেরত দিতে ছয়টি লেগেছিল।"
