faq:
  heading: "Питања"
  items:
    - q: "Могу ли да доведем у питање само свој део?"
      a: "Не. Питање држи цео трошак ван стања, за све у њему. Ако је погрешна само подела, исправка је измена поделе."
    - q: "Ко може да затвори питање?"
      a: "Особа која га је поставила или администратор групе. Ако особа која је додала трошак није администратор, не може га затворити уместо питаоца."
    - q: "Да ли измена трошка брише оригинал?"
      a: "Не. Претходна верзија се чува. Ко може да уређује одређују дозволе групе, па вреди прво рећи кући, јер се стања мењају."
