featuresHeading: "একটি দম্পতি যে ফিচারগুলো ব্যবহার করে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "আমরা কি একবার 60/40 ঠিক করে সবকিছুর জন্য রাখতে পারি?"
      a: "না। ভাগ প্রতিটি খরচের নিজস্ব। প্রথমটিতে শতাংশ ঠিক করুন, তারপর পরেরবার সেটা কপি করে যা আলাদা তা বদলান। ভাগ করার তিনটি উপায়ই আছে [খরচ ভাগ করা](page:feature/split-expenses) পৃষ্ঠায়।"
    - q: "এটি কি আমাদের ব্যাংকের সঙ্গে যুক্ত হয়?"
      a: "না। Side Badger আপনার টাকা কখনও ছোঁয় না। যেভাবে খুশি একে অপরকে দিন, তারপর রেকর্ড করুন, যেমন [হিসাব মেটানো](page:feature/settle-up) ব্যাখ্যা করে।"
    - q: "আমাদের গ্রুপ কি আর কেউ দেখতে পায়?"
      a: "শুধু তার সদস্যরা, আর দম্পতির গ্রুপে সদস্য দুজন। চালু আমন্ত্রণ লিঙ্ক যে-ই ব্যবহার করে সে-ই যোগ দিতে পারে, তাই এটি একজনকেই দিন আর ছোট মেয়াদ দিন।"
    - q: "আমরা দুজনে যদি একই বিলের আলাদা আলাদা অংশ দিয়ে থাকি?"
      a: "একটি খরচে একজনই দেয়। দুটি খরচ লিখুন, আপনাদের প্রত্যেকের জন্য একটি করে, আর ব্যালেন্স একই আসবে।"
    - q: "এটি কি আমার সঙ্গীকে পেমেন্ট করতে মনে করিয়ে দেবে?"
      a: "না। কোনো রিমাইন্ডার নেই, তাই তাগাদাটা এখনও আপনার। অন্তত দুজনেই একই সংখ্যার দিকে তাকিয়ে থাকবেন।"
    - q: "আমরা যখন খরচ ভাগ করা বন্ধ করব তখন কী হবে?"
      a: "ব্যালেন্স মিটিয়ে নিন আর পেমেন্ট রেকর্ড করুন, যাতে কারও কিছু দেওয়ার না থাকে। তারপর একজন অ্যাডমিন গ্রুপ লক করতে পারেন, যা সংখ্যাগুলো যেখানে আছে সেখানেই রাখে, অথবা চিরতরে বন্ধ করতে পারেন, যাতে তা সবার জন্য অগম্য হয়ে যায়। বন্ধ করুন শুধু তখনই যখন আপনাদের কারও আর ইতিহাসটা লাগবে না।"
