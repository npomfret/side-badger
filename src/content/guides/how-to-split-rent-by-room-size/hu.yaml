meta:
  title: "Hogyan oszd fel a lakbért a szobák mérete szerint | Side Badger"
  description: "Nagyobb szoba, nagyobb rész. Különítsd el a közös helyiségeket, a többit oszd alapterület szerint, a százalékokat írd be egyszer. Számolás három lakótársra."
h1: "Hogyan oszd fel a lakbért a szobák mérete szerint"
navLabel: "Lakbér szobaméret szerint"
lead: "Döntsétek el, hogy a lakbér mekkora részét fizetitek a közös helyiségekért, és ezt a részt osszátok el egyenlően, a maradékot pedig az egyes hálószobák alapterülete szerint. Kerekítsetek egész százalékokra, írjátok be őket a lakbérhez a Side Badgerben egyetlenegyszer, és másoljátok le a költséget minden hónapban."
cta:
  heading: "Vidd be egyszer a lakbért"
  body: "Hozz létre ingyenes fiókot, indíts csoportot a lakásnak, és add meg a lakbért a megbeszélt százalékokkal. A következő hónap már csak másolás. Előbb körbenéznél? Nézd meg, [hogyan működik](page:how-it-works), vagy azt, [mit fed le az ingyenes használat](page:pricing)."
sections:
  - heading: "Három ember, egy lakás, egy vita"
    body: "Priya, Tom és Aisha közösen bérel egy lakást, a lakbér havi 1 950 £. Egy évig háromfelé osztották, mert így volt a legegyszerűbb. Aztán Aisha lemérte a szobáját. Priya szobája 16 m², Tomé 12 m², Aishaé 10 m², vagyis Aisha ugyanannyit fizetett, mint Priya, egy Priyáénál több mint egyharmaddal kisebb szobáért. Senki nem volt ésszerűtlen. Senki nem számolta ki. Egy elvitelre rendelt vacsora mellett először egyetlen szabályban egyeztek meg: a lakbér 40%-a a konyháért, a fürdőszobáért és a nappaliért jár, amelyeket mind a hárman használnak."
  - heading: "A módszer, a számításokkal együtt"
    body: "Négy lépés, egy mérőszalag és a telefon számológépe."
    items:
      - "**Különítsd el a közös részt.** A csoport megegyezik abban, hogy a lakbér mekkora része jár a mindenki által használt helyiségekre. A lakásnál ez 40%, vagyis három ember között fejenként 13,33%."
      - "**A maradékot oszd alapterület szerint.** A másik 60% a hálószobák mérete szerint megy. A hálószobák együtt 38 m² (16 + 12 + 10), így Priya része 60% × 16/38, vagyis 25,26%."
      - "**Add össze a két részt.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, plusz 13,33%, vagyis összesen 32,3%. Aisha: 60% × 10/38 = 15,79%, plusz 13,33%, vagyis összesen 29,1%."
      - "**Kerekíts és ellenőrizz.** Az egész százalékokat könnyebb beírni és könnyebb velük vitatkozni, ezért a 38,6% 39% lesz, a 32,3% 32%, a 29,1% pedig 29%. Ellenőrizd, hogy a 39 + 32 + 29 kiadja a 100-at. Ha a kerekítés 99-re vagy 101-re jön ki, a csoport megegyezik abban, kinek a száma tolódik el egy ponttal."
  - heading: "Így olvasd ki a lakás hónapját"
    body: "A 39%, 32% és 29% szerint felosztott lakbér 760,50 £, 624,00 £ és 565,50 £. Priya fizette a bérbeadónak, így a hónapban neki 1 142,50 £ jár, Tom tartozása 566,00 £, Aishaé pedig 576,50 £. A Side Badger két kifizetést javasol, mindkettő Priyának szól."
  - heading: "Állítsd be a Side Badgerben"
    body: "Egy este, amelynek nagy részét a 40% megvitatása viszi el."
    items:
      - "**Hozd létre a csoportot.** A vezérlőpulton válaszd az **Új csoport** lehetőséget, és nevezd el a lakásról. Válaszd a **Mások meghívása** lehetőséget, és küldd el a linket vagy a QR-kódot. Mindenki bejelentkezik vagy létrehoz egy ingyenes fiókot, és kiválasztja, milyen néven szeretne megjelenni ebben a csoportban."
      - "**Add hozzá a lakbért.** Válaszd a **Kiadás hozzáadása** lehetőséget. Írd be a leírást és az összeget, a **Ki fizetett?** alatt pedig válaszd ki azt, aki a bérbeadónak fizetett. A **Megosztás közöttük** alatt hagyd mindhárom embert, majd a **Felosztás módja** alatt válaszd a **Százalék** lehetőséget, és írd be: 39, 32 és 29. Az űrlap jelzi, ha a százalékok összege nem 100. Válaszd a **Kiadás mentése** lehetőséget."
      - "**Add hozzá a számlákat.** Az energia és az internet külön költség, saját fizetővel. Hagyd a **Felosztás módja** beállítást az **Egyenlően** értéken."
      - "**Másold le a következő hónapban.** Nyisd meg a múlt havi lakbért, és válaszd a **Kiadás másolása** lehetőséget. A másolat megtartja a fizetőt, az összeget és a felosztást, a dátuma pedig a mai nap lesz. Ha változott a lakbér, írd át az összeget, aztán válaszd a **Másolat készítése** lehetőséget."
      - "**Nézd meg, ki kinek tartozik.** Az **Egyenlegek** rész megmutatja. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést a **Tartozásrendezés** alatt."
  - heading: "Saját fürdős szobák, kamraszobák és a távozók"
    items:
      - "**Saját fürdős szobák és kamraszobák.** Az alapterület csak kiindulópont. Egy saját fürdőszobás szoba többet ér, mint ugyanakkora szoba fürdő nélkül, az a kamraszoba pedig, amelybe egy ágy és egy reménykedő szék fér be, kevesebbet. Közös megegyezéssel módosítsátok a százalékokat, ellenőrizzétek, hogy az összegük még mindig 100, és a végleges számokat írjátok le valahová, ahol az egész lakás látja."
      - "**Valaki hónap közben kiköltözik.** Számold ki, mennyi jut az egyes emberekre arra a hónapra, és az adott hónap lakbérét a **Százalék** helyett **Pontos összegek** szerint vidd be. Az összegeknek ki kell adniuk a lakbért. Csináld meg, mielőtt elmegy. Senki nem hagyhat el egy csoportot, amíg tartozik, vagy neki tartoznak, az a költség pedig, amelyben olyasvalaki érintett, aki elhagyta a csoportot, csak olvashatóvá válik."
      - "**Valaki beköltözik.** Mérjetek újra, számoljátok ki újra az új szobaméretekkel, és az új százalékokat a következő lakbértől használjátok. A korábbi hónapok úgy maradnak, ahogy voltak."
  - heading: "Amit a Side Badger itt nem csinál"
    items:
      - "Nem méri le a szobáitokat, és nem választ százalékokat. Az alapterületekről és a 40%-ról a csoportnak kell megegyeznie."
      - "Ismétlődő számlák nincsenek, ezért minden alkalommal a múlt havi lakbért másolod."
      - "Soha nem mozgat pénzt, és nem fizet a bérbeadónak. Fizettek egymásnak, ahogy akartok, és rögzítitek."
      - "Nem tudja, mit mond a bérleti szerződésetek. A csoport tagjai közötti számolást vezeti."
