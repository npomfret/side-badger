faq:
  heading: "सवाल"
  items:
    - q: "अगर किसी का कमरा बड़ा हो पर उसमें रोशनी कम आती हो तो?"
      a: "फ़्लोर एरिया बस शुरुआत है, इसलिए ग्रुप बदलाव पर सहमत हो सकता है। अंधेरे कमरे से एक-दो अंक घटाएं, बाकियों में बांट दें और जांचें कि प्रतिशत का जोड़ अब भी 100 है। जो आप तय करते हैं, Side Badger उसे सहेज लेता है और उस पर कोई फैसला नहीं देता।"
    - q: "क्या बिल भी कमरे के आकार से बांटने चाहिए?"
      a: "आमतौर पर नहीं। बिजली और ब्रॉडबैंड सब इस्तेमाल करते हैं, इसलिए ऊपर के उदाहरण की तरह बराबर बांटना आसान है। अगर कोई रूममेट दिन भर घर पर रहता है, तो ग्रुप कुछ और तय कर सकता है, जैसे सटीक राशि। सारे विकल्प [खर्च बांटना](page:feature/split-expenses) में हैं।"
    - q: "क्या हम बंटवारा बाद में बदल सकते हैं?"
      a: "हाँ, नए खर्चों के लिए। किराया कॉपी करते समय प्रतिशत बदलें और पुराने महीने जैसे थे वैसे रहते हैं। किसी पुराने खर्च को सुधारने के लिए, अगर ग्रुप की अनुमतियां इजाज़त दें तो उसे एडिट करें, और पहले घर वालों को बता दें, क्योंकि बैलेंस बदल जाते हैं। पहले वाला वर्शन सुरक्षित रहता है।"
