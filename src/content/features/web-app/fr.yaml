meta:
  title: "Appli de partage de dépenses sans téléchargement | Side Badger"
  description: "Téléphone plein ? On comprend. Side Badger tourne dans le navigateur : ni magasin d'applis ni téléchargement. Sur l'écran d'accueil, il s'ouvre comme une appli."
h1: "Pas de magasin d'applis. Pas de téléchargement. Et pourtant, l'effet d'une appli"
navLabel: "Appli web"
lead: "Side Badger vit dans votre navigateur. Pas de magasin d'applis à fouiller, rien à télécharger d'abord. Connectez-vous sur un téléphone ou un ordinateur, partagez les dépenses en ligne avec votre groupe, et ajoutez-le à votre écran d'accueil ou à votre Dock quand vous le voulez à un toucher de distance."
cta:
  heading: "Ouvrez. Connectez-vous. Lancez un groupe."
  body: "Créez un compte, lancez un groupe et ajoutez la première dépense, le tout depuis le navigateur que vous avez déjà ouvert. Envie de la visite d'abord ? Voyez [comment ça marche](page:how-it-works), ou regardez [ce que couvre la gratuité](page:pricing)."
problem:
  heading: "Votre téléphone est plein. On comprend."
  body: "Quelque part dedans, il y a quatre mille photos du même coucher de soleil et une alerte de stockage que vous écartez d'un doigt depuis le printemps. La dernière chose dont il a besoin, c'est d'une autre appli, juste pour partager un dîner. Alors Side Badger est une appli web. Elle tourne dans un navigateur moderne, sur un téléphone ou un ordinateur. Sur un téléphone, elle utilise des mises en page mobiles, avec la page du groupe répartie en onglets et des commandes tactiles. Certains extras, comme l'ajout à l'écran d'accueil, dépendent de votre navigateur, et nous le signalons."
workflow:
  heading: "De l'onglet du navigateur à l'écran d'accueil en trois étapes"
  steps:
    - title: "Ouvrez-le et connectez-vous"
      body: "Allez sur Side Badger dans votre navigateur et connectez-vous. Il suffit d'une adresse e-mail et d'un mot de passe, et vous vérifiez l'e-mail avant de pouvoir ajouter quoi que ce soit. Chaque personne du groupe a besoin d'un compte, donc les gens que vous invitez feront de même."
    - title: "Ajoutez-le à votre écran d'accueil ou à votre Dock"
      body: "Une fois la connexion faite, l'appli propose de s'installer elle-même. Vous avez un bouton **Installer** là où votre navigateur le permet, et **Montrez-moi comment** là où il ne le permet pas. Vous l'avez raté, ou vous avez dit non ? Les **Paramètres** offrent la même aide sous **Ajouter à l'écran d'accueil ou au Dock**. Sur un iPhone ou un iPad, les Paramètres montrent d'abord les étapes pour iPhone et rangent les autres appareils sous **Autres appareils**. Dans les deux cas, l'appli s'ouvre ensuite dans sa propre fenêtre."
      shot: S20
      shotAlt: "La section « Ajouter à l'écran d'accueil ou au Dock » des Paramètres, avec les étapes pour ajouter l'appli à un appareil"
    - title: "Activez les notifications, si vous les voulez"
      body: "Les notifications sont désactivées tant que vous ne les activez pas, et chaque appareil s'active séparément. Utilisez le bouton **Activer** que propose la cloche de notifications, ou l'interrupteur **Notifications push** dans les **Paramètres**. Sur un iPhone ou un iPad, ouvrez d'abord l'appli depuis l'écran d'accueil. C'est le seul endroit où les notifications y fonctionnent."
      shot: S19
      shotAlt: "Le menu déroulant des notifications ouvert, avec l'activité récente du groupe"
options:
  heading: "Comment l'ajouter, appareil par appareil"
  items:
    - title: "iPhone et iPad"
      body: "Touchez le bouton Partager, un carré avec une flèche pointant vers le haut. Si vous ne le voyez pas, touchez d'abord les trois points (•••), puis Partager. Faites défiler vers le bas et touchez **Sur l'écran d'accueil**. Laissez **Ouvrir comme app web** activé, puis touchez **Ajouter**. Si un lien s'est ouvert dans une autre appli, ouvrez d'abord la page dans Safari, car ce navigateur intégré ne peut pas l'ajouter."
    - title: Android
      body: "Ouvrez le menu du navigateur et choisissez **Ajouter à l'écran d'accueil** ou **Installer l'application**."
    - title: "Chrome ou Edge sur ordinateur"
      body: "Ouvrez le menu du navigateur et choisissez l'option pour installer ce site comme application. Il a alors sa propre fenêtre et sa propre icône."
    - title: "Safari sur Mac"
      body: "Choisissez **Fichier**, puis **Ajouter au Dock**."
sections:
  - heading: "Des notifications, seulement si vous en voulez"
    body: "Les notifications push se choisissent. Activez-les et vous recevez une notification quand il y a de la nouvelle activité dans vos groupes, comme quelqu'un qui ajoute une dépense, laisse un commentaire ou enregistre un paiement. Elles s'activent appareil par appareil, depuis la cloche de notifications ou depuis les **Paramètres**, et vous pouvez les désactiver au même endroit. Elles demandent un navigateur qui les gère et votre permission. Si votre navigateur les a bloquées pour le site, autorisez-les d'abord dans ses paramètres. Sur un iPhone ou un iPad, elles ne fonctionnent que depuis l'appli ajoutée à l'écran d'accueil, pas depuis un onglet du navigateur. La livraison n'est pas garantie, donc voyez une notification comme un coup de coude, pas une promesse. Pour ce qui apparaît dans le fil, voyez [planifier ensemble](page:feature/plan-together)."
  - heading: "Des mises à jour immédiates, sans bouton d'actualisation"
    body: "Ajoutez une dépense et tout le monde la voit tout de suite, avec ce qui a changé et qui l'a changé. Chaque groupe garde un historique d'activité, et la cloche de notifications montre l'activité de tous vos groupes. Personne n'a à demander si vous avez vu ce que vous venez d'ajouter. C'est déjà sur son écran."
  - heading: "39 langues, chacun la sienne"
    body: "Utilisez Side Badger dans 39 langues, dont l'arabe, le persan et l'ourdou, qui s'écrivent de droite à gauche. Chacun choisit la sienne dans le groupe, donc la même page de groupe peut être en arabe pour l'un et en anglais pour le suivant. La seule chose sur laquelle le groupe doit s'accorder, ce sont les chiffres."
  - heading: "Pensé pour plus d'un type d'utilisateur"
    body: "Side Badger est conçu en pensant aux personnes qui utilisent le clavier et un lecteur d'écran. Les couleurs des membres s'accompagnent de motifs, donc vous n'avez pas à distinguer le vert du rouge."
    items:
      - "Des liens d'évitement, pour que les personnes qui naviguent au clavier aillent droit au contenu."
      - "Les boîtes de dialogue gèrent le focus du clavier."
      - "Les commandes sont étiquetées, pour les lecteurs d'écran."
      - "Les mises en page s'inversent pour les langues qui s'écrivent de droite à gauche."
limits:
  heading: "Ce que l'appli web ne fait pas"
  items:
    - "Il n'y a pas d'usage hors ligne. Side Badger a besoin d'une connexion, donc il n'ouvrira pas votre groupe dans un avion sans wifi."
    - "Il n'y a pas d'appli dans un magasin d'applis, ni d'appli native pour iPhone ou Android. Side Badger est une appli web, et l'ajouter à votre écran d'accueil ou à votre Dock est la façon d'obtenir la version qui ressemble à une appli."
    - "L'ajout à un écran d'accueil ou à un Dock dépend de votre navigateur. Le nom des menus varie selon les navigateurs et leurs versions, et certains navigateurs ne le proposent pas."
    - "Les notifications push se choisissent appareil par appareil, et demandent un navigateur qui les gère et votre permission. Sur un iPhone ou un iPad, elles ne fonctionnent que depuis l'appli ajoutée à l'écran d'accueil. La livraison n'est pas garantie."
    - "Il n'y a ni alerte par e-mail ou SMS ni rappel de paiement. La nouvelle activité apparaît dans l'appli, et sous forme de notifications push si vous les activez. Relancer un paiement reste à votre charge."
    - "L'activité est conservée 90 jours."
    - "Vous vous connectez avec une adresse e-mail et un mot de passe. Il n'y a pas de connexion Google ou Apple, et il faut avoir 18 ans ou plus."
    - "Nous ne prétendons pas que Side Badger est entièrement accessible, ni qu'il respecte une norme d'accessibilité formelle. Si quelque chose vous gêne, dites-le-nous depuis l'appli et vous y verrez notre réponse."
useCasesHeading: "Là où se passer d'appli aide"
faq:
  heading: Questions
  items:
    - q: "Y a-t-il une appli Side Badger dans un magasin d'applis ?"
      a: "Non. Side Badger est une appli web. Vous l'ouvrez dans votre navigateur, et vous pouvez l'ajouter à votre écran d'accueil ou à votre Dock pour qu'elle s'ouvre comme une appli. Il n'y a rien à télécharger depuis un magasin d'applis."
    - q: "Puis-je partager des factures sans télécharger d'appli ?"
      a: "Oui. Ouvrez Side Badger dans un navigateur sur votre téléphone ou votre ordinateur, connectez-vous et lancez un groupe. L'ajouter à votre écran d'accueil ou à votre Dock est facultatif."
    - q: "Marche-t-il hors ligne ?"
      a: "Non. Side Badger a besoin d'une connexion, même ajouté à votre écran d'accueil ou à votre Dock."
    - q: "Pourquoi n'ai-je pas de notifications sur mon iPhone ?"
      a: "Sur un iPhone ou un iPad, les notifications ne fonctionnent que depuis l'appli ajoutée à l'écran d'accueil, pas depuis un onglet du navigateur. Ajoutez-la, ouvrez-la depuis l'icône de l'écran d'accueil, puis activez les notifications dans les **Paramètres**. La livraison n'est pas garantie, donc si l'une manque, l'historique d'activité du groupe montre quand même ce qui a été ajouté."
    - q: "Dois-je activer les notifications ?"
      a: "Non. Elles sont désactivées tant que vous ne les activez pas, un appareil à la fois. Sans elles, la nouvelle activité apparaît quand même dans l'appli, et chacun voit un changement tout de suite quand il l'a ouverte."
    - q: "Chaque personne du groupe a-t-elle besoin d'un compte ?"
      a: "Oui. Il suffit d'une adresse e-mail et d'un mot de passe, et vous vérifiez l'e-mail avant de pouvoir ajouter quoi que ce soit. Toute personne qui rejoint un groupe fait de même, sur le téléphone ou l'ordinateur de son choix."
