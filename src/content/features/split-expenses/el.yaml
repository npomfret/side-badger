meta:
  title: "Χωρίστε τα έξοδα εξίσου, ακριβώς ή με ποσοστά | Side Badger"
  description: "Χωρίστε ένα κοινό κόστος εξίσου, με ακριβή ποσά ή με ποσοστά και αφήστε έξω όποιον δεν ήταν εκεί. Δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
h1: "Χωρίστε τα έξοδα εξίσου, ακριβώς ή με ποσοστά"
navLabel: "Διαχωρισμός εξόδων"
lead: "Δεν χωρίζονται όλα 50/50. Το Side Badger τα καταφέρνει. Πείτε ποιος πλήρωσε, διαλέξτε τα άτομα που μοιράζονται το κόστος και χωρίστε το **εξίσου, με ακριβή ποσά ή με ποσοστά**. Τα παράπονα πωλούνται χωριστά."
cta:
  heading: "Χωρίστε το επόμενο όπως πρέπει"
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το έξοδο που θέλατε καιρό να τακτοποιήσετε. Δεν ξέρετε τι ακολουθεί; Δείτε [πώς λειτουργεί](page:how-it-works) ή τι [καλύπτει το δωρεάν πακέτο](page:pricing)."
problem:
  heading: "Δεν χωρίζονται όλα 50/50"
  body: "Το ενοίκιο ακολουθεί το μέγεθος του δωματίου. Ένα δώρο ακολουθεί όποιον υποσχέθηκε τι. Ένα δείπνο ακολουθεί όποιον έμεινε για επιδόρπιο. Το μοίρασμα ενός λογαριασμού στη μέση δουλεύει μέχρι τον πρώτο λογαριασμό που δεν είναι έτσι, και τότε κάποιος ανοίγει ένα φύλλο εργασίας. Το Side Badger καταγράφει ποιος πλήρωσε, ποιοι μοιράζονται το κόστος και πώς μοιράζεται, ώστε τα υπόλοιπα να βγαίνουν σωστά χωρίς να κάνει κανείς διαίρεση στο τραπέζι."
workflow:
  heading: "Προσθήκη εξόδου, από την αρχή ως το τέλος"
  steps:
    - title: "Πείτε ποιος πλήρωσε και για τι"
      body: "Βάλτε το ποσό, μια σύντομη περιγραφή και το άτομο που πλήρωσε. Για κάθε έξοδο πληρώνει ένα άτομο, κάτι που κρατά τους υπολογισμούς τίμιους."
      shot: S05
      shotAlt: "Η φόρμα εξόδου με το ενοίκιο ενός εξοχικού χωρισμένο με ποσοστά ανάμεσα σε τρία άτομα"
    - title: "Διαλέξτε τον διαχωρισμό"
      body: "Επιλέξτε εξίσου, ακριβή ποσά ή ποσοστά. Τα ποσοστά πρέπει να κάνουν συνολικά 100 και τα ακριβή ποσά πρέπει να κάνουν συνολικά το σύνολο."
      shot: S06
      shotAlt: "Η φόρμα εξόδου με ακριβή ποσά για κάθε άτομο σε ένα δώρο"
    - title: "Προσθέστε την ιστορία"
      body: "Ορίστε την ημερομηνία, προσθέστε ετικέτες, τόπο και σημείωση. Όλοι στην ομάδα βλέπουν τις ίδιες λεπτομέρειες και μπορούν να σχολιάσουν εκεί αμέσως."
      shot: S08
      shotAlt: "Ένα έξοδο με τις λεπτομέρειές του, ένα νήμα σχολίων και το αρχικό ποσό με το οποίο καταχωρίστηκε"
    - title: "Θέστε μια ερώτηση αν κάτι δεν φαίνεται σωστό"
      body: "Αν η ομάδα έχει ενεργοποιήσει τις ερωτήσεις εξόδων, όποιος περιλαμβάνεται σε ένα έξοδο μπορεί να το αμφισβητήσει και η λίστα εξόδων μπορεί να δείχνει μόνο τα αμφισβητημένα."
      shot: S18
      shotAlt: "Η λίστα εξόδων με ένδειξη Αμφισβητήθηκε και το φίλτρο Μόνο υπό αμφισβήτηση"
options:
  heading: "Τρεις τρόποι διαχωρισμού"
  items:
    - title: "Εξίσου"
      body: "Η προεπιλογή για δείπνα, ταξί και ό,τι μοιράστηκαν όλοι ισομερώς. Αν το σύνολο δεν διαιρείται ακριβώς, το περιττό λεπτό πηγαίνει σε ένα άτομο τυχαία, όχι πάντα στο ίδιο. Στο ταξί παρακάτω είναι η Άνα."
    - title: "Με ακριβή ποσά"
      body: "Πληκτρολογήστε πόσα χρωστά ο καθένας. Κατάλληλο για το δώρο όπου ο καθένας διάλεξε διαφορετική τιμή ή για τα ψώνια όπου το καλάθι κάποιου είχε περισσότερα από τα κοινά. Τα ποσά πρέπει να κάνουν συνολικά το σύνολο."
    - title: "Με ποσοστά"
      body: "Δώστε σε κάθε άτομο ένα μερίδιο του συνόλου. Το ενοίκιο ανάλογα με το δωμάτιο είναι το κλασικό: το μεγαλύτερο δωμάτιο πληρώνει το μεγαλύτερο μερίδιο και κανείς δεν προσποιείται το αντίθετο."
example:
  heading: "Ένα Σαββατοκύριακο σε εξοχικό, τέσσερα έξοδα, τρεις διαχωρισμοί"
  currency: GBP
  people:
    - id: ana
      name: Άνα
    - id: ben
      name: Μπεν
    - id: cara
      name: Κάρα
  expenses:
    - label: "το εξοχικό, ανάλογα με το δωμάτιο"
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: "δείπνο"
      payer: ben
      amount: 84
      split:
        method: equal
    - label: "ψώνια"
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: "το ταξί για το σπίτι"
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: "Μόνο όσοι ήταν εκεί"
    body: "Χωρίστε ένα κόστος σε όλους ή μόνο στα άτομα που το μοιράστηκαν. Αφήστε έξω άτομα από κόστη στα οποία δεν συμμετείχαν και τα υπόλοιπα το αντικατοπτρίζουν. Ο συγκάτοικος που έλειπε όλη την εβδομάδα δεν χρωστά για το φαγητό πακέτο, κάτι που οι [συγκάτοικοι](page:use-case/housemates) θα αναγνωρίσουν ως στοιχειώδη δικαιοσύνη."
  - heading: "Οι λεπτομέρειες που γλιτώνουν καβγάδες αργότερα"
    items:
      - "Ορίστε την **ημερομηνία** και προαιρετικά την ώρα. Συντομεύσεις όπως σήμερα, χθες, σήμερα το πρωί και χθες το βράδυ γλιτώνουν λίγη πληκτρολόγηση."
      - "Προσθέστε έως τρεις **ετικέτες** για ομαδοποίηση εξόδων, όπως ψώνια ή ταξίδια."
      - "Προσθέστε τον **τόπο**. Επικολλήστε έναν σύνδεσμο χάρτη και το όνομα του τόπου συμπληρώνεται μόνο του."
      - "Προσθέστε μια **σημείωση** για την ιστορία πίσω από τον αριθμό, με λίγη μορφοποίηση αν το χρειάζεται η ιστορία."
      - "Επισυνάψτε έως τρεις **αποδείξεις**, ως φωτογραφίες ή PDF, ώστε η απόδειξη να μένει μαζί με το έξοδο."
      - "Χρησιμοποιήστε τα **σχόλια** ώστε η κουβέντα να μένει δίπλα στο έξοδο στο οποίο αναφέρεται, και όχι σε ένα νήμα συνομιλίας στο οποίο δεν ξαναγυρίζει κανείς."
  - heading: "Αντιγράψτε, επεξεργαστείτε και δείτε τι άλλαξε"
    body: "Αντιγράψτε το ενοίκιο του προηγούμενου μήνα αντί να το πληκτρολογήσετε ξανά και αλλάξτε ό,τι διαφέρει. Αν ένας αριθμός ήταν λάθος, επεξεργαστείτε το έξοδο. Η προηγούμενη έκδοση διατηρείται και η επεξεργασία φαίνεται στη δραστηριότητα της ομάδας, ώστε κανείς να μην αλλάζει έναν αριθμό αθόρυβα. Τι μπορεί να επεξεργαστεί ο καθένας εξαρτάται από τα δικαιώματα της ομάδας."
  - heading: "Όταν κάτι φαίνεται λάθος"
    body: "Μια ομάδα μπορεί να ενεργοποιήσει τις ερωτήσεις εξόδων. Όποιος περιλαμβάνεται σε ένα έξοδο μπορεί να θέσει μια ερώτηση και να πει γιατί, και το έξοδο μένει εκτός υπολοίπων μέχρι να το κλείσει το άτομο που ρώτησε ή ένας διαχειριστής. Είναι απενεργοποιημένο από προεπιλογή και το ενεργοποιεί ένας διαχειριστής για την ομάδα. Ταιριάζει στις [εκδηλώσεις και γιορτές](page:use-case/events-and-celebrations), όπου η προκαταβολή που κανείς δεν θυμάται γίνεται ξαφνικά υπόθεση όλων."
limits:
  heading: "Όρια"
  items:
    - "Για κάθε έξοδο πληρώνει ένα άτομο. Αν πλήρωσαν δύο, καταγράψτε δύο έξοδα."
    - "Δεν υπάρχει διαχωρισμός ανά είδος ούτε ανά μερίδια. Υπάρχουν εξίσου, ακριβή ποσά και ποσοστά."
    - "Τα ποσοστά πρέπει να κάνουν συνολικά 100."
    - "Ένα έξοδο μπορεί να φτάσει έως 999.999,99 στο δικό του νόμισμα, με τα συνήθη δεκαδικά ψηφία του νομίσματος."
    - "Τα έξοδα δεν επαναλαμβάνονται μόνα τους. Αντιγράψτε αντί γι' αυτό το έξοδο του προηγούμενου μήνα."
    - "Οι ημερομηνίες δεν μπορούν να είναι στο μέλλον ούτε παλαιότερες από 10 χρόνια."
    - "Ένα έξοδο που αφορά κάποιον που έφυγε από την ομάδα γίνεται μόνο για ανάγνωση."
useCasesHeading: "Πού βοηθά ένας τέτοιος διαχωρισμός"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορούν δύο άτομα να πληρώσουν ένα έξοδο;"
      a: "Όχι σε ένα έξοδο. Καταγράψτε δύο, ένα για κάθε πληρωτή, και τα υπόλοιπα βγαίνουν τα ίδια."
    - q: "Μπορώ να χωρίσω μια απόδειξη ανά είδος;"
      a: "Όχι. Ο διαχωρισμός είναι εξίσου, με ακριβή ποσά ή με ποσοστά. Για έναν λογαριασμό με διαφορετικά είδη, βάλτε ό,τι χρωστά κάθε άτομο ως ακριβή ποσά."
    - q: "Μπορώ να ορίσω έναν προεπιλεγμένο διαχωρισμό;"
      a: "Όχι. Αντιγράψτε ένα προηγούμενο έξοδο για να ξαναχρησιμοποιήσετε τον διαχωρισμό του και αλλάξτε ό,τι διαφέρει."
    - q: "Μπορούν οι λογαριασμοί να επαναλαμβάνονται κάθε μήνα;"
      a: "Όχι. Αντιγράψτε αντί γι' αυτό το έξοδο του προηγούμενου μήνα, που παίρνει λίγα δευτερόλεπτα."
    - q: "Ποιος μπορεί να επεξεργαστεί ένα έξοδο;"
      a: "Όποιον επιτρέπουν τα δικαιώματα της ομάδας. Κάθε επεξεργασία φαίνεται στη δραστηριότητα της ομάδας, οπότε οι αλλαγές δεν γίνονται ποτέ αθόρυβα."
    - q: "Τι γίνεται με τα υπόλοιπα μετά;"
      a: "Ενημερώνονται καθώς καταφθάνουν τα έξοδα και η [εκκαθάριση](page:feature/settle-up) τα μετατρέπει σε μια σύντομη λίστα πληρωμών. Αν ένα έξοδο είναι σε άλλο νόμισμα, δείτε τα [πολλά νομίσματα](page:feature/multiple-currencies)."
