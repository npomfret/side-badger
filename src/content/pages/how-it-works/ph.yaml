meta:
  title: Paano gumagana ang Side Badger | Hatiin ang gastos ng grupo sa limang hakbang
  description: Gumawa ng grupo, mag-imbita ng mga tao, magdagdag ng mga gastos, at mag-settle up. Tingnan ang nangyayari sa pagitan ng “may nagbayad” at “quits na tayo,” kasama ang isang halimbawa.
h1: Paano gumagana ang Side Badger
navLabel: Paano ito gumagana
lead: Ano ang nangyayari sa pagitan ng “may nagbayad” at “quits na tayo”? Limang hakbang, walang spreadsheet, at isang badger na halos pang-dekorasyon lang. Narito ang buong biyahe, mula sa unang grupo hanggang sa huling naitalang bayad. Para sa detalye ng bawat hakbang, tingnan ang [paghahati ng gastos](page:feature/split-expenses) at [settle up](page:feature/settle-up).
cta:
  heading: Mula sa “ako na dito” hanggang sa “quits na tayo”
  body: Gumawa ng libreng account, magsimula ng grupo, at idagdag ang unang gastos. Hindi huhusgahan ng badger ang resibo.
  button: Gumawa ng libreng account
steps:
  - title: Gumawa ng grupo
    body: Gumawa ng isang grupo para sa bawat bahay, biyahe, o event, para hindi mapunta sa iisang listahan ang upa at ang regalo sa kasal. Bigyan ito ng pangalan, piliin ang pangalang makikita ng mga tao sa iyo, at kung gusto mo, limitahan ang mga pera na tinatanggap nito. Ipinapakita ng dashboard mo ang bawat grupo, at kung nasaan ka sa bawat isa, sa iisang screen.
    shot: S02
    shotAlt: Ang dialog sa paggawa ng grupo na bukas ang seksyon ng mga paghihigpit sa pera
  - title: Imbitahan ang mga kasama mo
    body: Magbahagi ng join link o magpakita ng QR code, at itakda kung gaano ito katagal tatagal, mula 15 minuto hanggang 5 araw. Kailangan ng libreng account at na-verify na email ng lahat ng sasali, at hanggang 50 tao ang kasya sa isang grupo. Kung gusto mong salain kung sino ang papasok, i-on ang approval at papapasukin ng isang admin ang bawat tao.
    shot: S03
    shotAlt: Ang invite dialog sa tab ng link, na may QR code at mga pagpipilian sa pag-expire
  - title: Idagdag ang mga gastos habang nangyayari
    body: Sabihin kung sino ang nagbayad, magkano, at para kanino. Hatiin nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento, at huwag isama ang sinumang hindi kasali. Idagdag ang gastos at makikita ito agad ng lahat, kasama kung ano ang nagbago at kung sino ang nagbago.
    shot: S05
    shotAlt: Ang expense form na may paghahati ayon sa porsyento, na hinahati ang upa ayon sa laki ng kuwarto
  - title: Bantayan ang mga balanse
    body: Nagtatabi ang Side Badger ng tumatakbong balanse para sa bawat pera, kaya makikita mo agad kung sino ang may utang kanino. Sa halip na pabayaan ang lahat na magkalas ng gusot ng maliliit na utang, nagmumungkahi ito ng maikling listahan ng mga bayad na nagse-settle sa grupo.
    shot: S10
    shotAlt: Ang screen ng mga balanse na nagpapakita ng pinasimpleng mga utang sa dalawang pera, nakabukas ang Ipakita lahat
  - title: Mag-settle sa labas ng app, itala sa loob
    body: Hindi kailanman naglilipat ng pera ang Side Badger. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad para humabol ang mga balanse, at mag-a-update ang screen ng lahat nang hindi nagre-refresh. Ang ibig sabihin lang ng “settle” ay zero na ang mga balanse. Walang makakaalis sa grupo habang may utang pa o may sisingilin pa, kaya ang papalabas ay magse-settle muna.
    shot: S11
    shotAlt: Ang payment form na may mga quick-settle button at ang paunawa sa bahagyang bayad
requirements:
  heading: Ano ang kailangan mo
  items:
    - Isang libreng account. Email address at password lang ang kailangan, at kailangan mong i-verify ang email bago ka makapagdagdag ng anuman.
    - Edad 18 pataas.
    - Makabagong browser sa telepono o computer, at koneksyon. Hindi app-store app ang Side Badger at hindi ito gumagana offline.
    - Opsyonal, isang puwesto sa home screen mo. Hindi kailangan ng app store, dahil maidaragdag mo ang Side Badger sa home screen o dock at bubukas ito na parang app.
