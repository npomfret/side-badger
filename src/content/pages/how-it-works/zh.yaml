      payer: ana
      amount: 90
      split:
        method: equal
    - label: 出租车
      payer: ben
      amount: 30
      split:
        method: equal
sections:
  - heading: 39 种语言，为更多人而建
    body: Side Badger 支持 39 种语言，包括从右到左书写的阿拉伯语、波斯语和乌尔都语。群组里每个人都可以选自己的语言，所以同一个群组页面，对一个人可以是阿拉伯语，对下一个人可以是英语。它也考虑了键盘和屏幕阅读器用户，成员颜色还配有图案，所以不必靠区分绿色和红色来辨认。
faq:
  heading: 常见问题
  items:
    - q: 每个人都需要账户吗？
      a: 是的，免费账户。每个人在添加任何内容之前都要验证邮箱。
    - q: 有应用吗？
      a: 它在浏览器中运行，你可以把它添加到主屏幕或程序坞，让它像应用一样打开。没有应用商店版本，也没有离线模式。
    - q: Side Badger 会转移资金吗？
      a: 不会。它负责记账并建议付款，你们想怎么付就怎么付，之后再记录这笔付款。参见[结算](page:feature/settle-up)。
    - q: 欠着钱的人能退出群组吗？
      a: 不能。只要还欠钱或还有钱没收回，谁都不能退出群组，所以要先结清。
    - q: 一个群组能加入多少人？
      a: 一个群组最多 50 人。可通过链接或二维码邀请，如果希望由管理员逐个放行，可以开启审批。
    - q: 涉及多种货币的旅行怎么办？
      a: 每种货币的余额分开记录。参见[多种货币](page:feature/multiple-currencies)。
