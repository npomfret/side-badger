sections:
  - heading: "Splitwise'ın iyi yaptıkları"
    body: "Grubunuz yerel bir uygulamaya, çevrimdışı kullanıma ya da uygulamanın içinde ödemelere ihtiyaç duyuyorsa Splitwise mantıklı seçimdir ve sonradan öğrenmenizdense onu seçmenizi tercih ederiz. Kendi sayfalarında şunlar yazıyor:"
    items:
      - "**Uygulamalar ve çevrimdışı kullanım.** Web'in yanı sıra iPhone ve Android uygulamaları ve bir çevrimdışı mod."
      - "**Daha çok bölüşme yolu.** Eşit, tam tutar ve yüzdenin yanı sıra paylar, düzeltmeler ve kalem kalem bölüşmeler."
      - "**Yinelenen harcamalar.** Kirayı tekrarlanacak şekilde ayarlayın ve unutun gitsin."
      - "**Uygulamada ödemeler.** Bazı ülkelerde parayı da taşıyabilir; Splitwise Pay, Venmo, PayPal ya da Pay by Bank ile."
  - heading: "Burada ücretsiz, orada ücretli"
    body: "Splitwise Pro, Splitwise'ın ücretli planıdır ve kendi Pro sayfası, Side Badger'da hiçbir şeye mal olmayan dört şeyi satar."
    items:
      - "**Makbuz tarama.** Splitwise Pro makbuzunuzun fotoğrafını tarar. Side Badger bunu ücretsiz yapar, tarama kredisi olmadan: toplamı, tarihi ve yeri sizin kontrol etmeniz için doldurur. Makbuz görselleri Google'ın yapay zeka hizmeti tarafından okunur."
      - "**Para birimi çevirme.** Splitwise Pro, Convert'e dokunduğunuzda bir grubun harcamalarını varsayılan para biriminize çevirir. Side Badger her harcamayı girerken, güncel bir döviz kuruyla ya da gerçekten aldığınız kurla çevirir ve özgün tutar harcamada kalır."
      - "**Reklam yok.** Splitwise, tamamen reklamsız deneyimi bir Pro özelliği olarak listeler. Side Badger'da reklam yok."
      - "**Günlük sınır yok.** Splitwise Pro sınırsız harcama satar ve yardım merkezi, ücretsiz kullanıcıların günde en çok 4 harcama ekleyebileceğini söyler. Side Badger'ın günlük sınırı yok."
  - heading: "Splitwise'ın olup Side Badger'ın olmayanlar"
    body: "Bu, Splitwise'ın her özelliği değil; yalnızca kararı çoğunlukla belirleyenler. Tam liste Splitwise'ın kendi sayfalarında. Side Badger'ın yetersiz kaldığı yerler şunlar."
    items:
      - "**Yerel uygulamalar.** Side Badger tarayıcınızda çalışır. Giriş yapın, sonra ana ekranınıza ekleyin; bir uygulama gibi açılır."
      - "**Çevrimdışı mod.** Side Badger bağlantı gerektirir."
      - "**Uygulamada ödemeler.** Side Badger paranıza asla dokunmaz. Birbirinize istediğiniz yolla ödeyin, sonra ödemeyi kaydedin."
      - "**Yinelenen harcamalar.** Side Badger'da yok. Yeniden yazmak yerine geçen ayın kirasını kopyalayın."
      - "**Paylara ya da kaleme göre bölüşme.** Side Badger'da harcama başına bir ödeyen var; eşit, tam tutarlarla ya da yüzdeyle bölünür. Makbuz taraması kalemleri kişilere atamaz."
      - "**Grafikler ve varsayılan bölüşümler.** Splitwise Pro'da ikisi de var. Side Badger kimin kime borçlu olduğunun hesabını tutar, bütün numara bu."
  - heading: "Grubunuzu taşımak"
    body: "İçe aktarıcı yok, yani taşınmak yeni bir başlangıç demek. Önce Splitwise'ta ödeşin, sonra Side Badger'da bir grup kurun ve herkesi bir bağlantı ya da QR koduyla davet edin. Gruptaki herkesin ücretsiz bir hesaba ihtiyacı var ve kaydolmak için gereken tek şey bir e-posta adresi."
