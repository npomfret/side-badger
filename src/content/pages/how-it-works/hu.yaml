sections:
  - heading: "39 nyelv, több embernek építve"
    body: "Használd a Side Badgert 39 nyelven, köztük jobbról balra írt arabul, perzsául és urduul. A csoport minden tagja kiválaszthatja a sajátját, így a csoport oldala az egyik embernek lehet arab, a másiknak angol. Billentyűzetet és képernyőolvasót használókra is gondolva készült, a tagok színei pedig mintázattal párosulnak, így nem kell megkülönböztetned a zöldet a pirostól."
faq:
  heading: "Kérdések"
  items:
    - q: "Mindenkinek kell fiók?"
      a: "Igen, ingyenes. Mindenki megerősíti az e-mail-címét, mielőtt bármit hozzáadna."
    - q: "Van alkalmazás?"
      a: "Böngészőben fut, és hozzáadhatod a kezdőképernyődhöz vagy a dokkodhoz, hogy úgy nyíljon meg, mint egy alkalmazás. Alkalmazásboltos verzió és offline mód nincs."
    - q: "Mozgat pénzt a Side Badger?"
      a: "Nem. Vezeti a számolást és kifizetéseket javasol, ti pedig fizettek egymásnak, ahogy akartok. Utána rögzíted a kifizetést. Lásd az [elszámolást](page:feature/settle-up)."
    - q: "Elmehet valaki úgy, hogy tartozik?"
      a: "Nem. Senki nem hagyhat el egy csoportot, amíg tartozik, vagy neki tartoznak, ezért előbb elszámol."
    - q: "Hány ember csatlakozhat egy csoporthoz?"
      a: "Legfeljebb 50 ember egy csoportban. Hívd meg őket linkkel vagy QR-kóddal, és kapcsold be a jóváhagyást, ha azt szeretnéd, hogy egy adminisztrátor beengedje az egyes embereket."
    - q: "Mi a helyzet az egynél több pénznemes utazásokkal?"
      a: "Az egyenlegeket pénznemenként külön vezetjük. Lásd a [több pénznemet](page:feature/multiple-currencies)."
