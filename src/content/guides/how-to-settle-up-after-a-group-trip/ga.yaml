meta:
  title: "Conas socrú suas a dhéanamh tar éis turais ghrúpa | Side Badger"
  description: "Socraigh sula scaipfidh an grúpa. Deich bhfiach i bpraiseach, ceithre íocaíocht, taifeadta de réir mar a thagann siad. Tá íocaíocht pháirteach ceart go leor."
h1: "Conas socrú suas a dhéanamh tar éis turais ghrúpa"
navLabel: "Socrú suas tar éis turais"
lead: "Socraigh sula scaipfidh gach duine. Cuir an costas deireanach leis, oscail iarmhéideanna an ghrúpa agus íoc an méid atá dlite agat ón liosta gearr, ar an gcaoi is fearr leat. Ansin taifead gach íocaíocht i Side Badger ionas go nglantar an t-iarmhéid don ghrúpa ar fad. I gcás cúigear cairde agus cúig chostas, laghdaítear deich bhfiach i bpraiseach go ceithre íocaíocht."
cta:
  heading: "Dún na leabhair sula dtiocfaidh na grianghraif isteach"
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa don chéad turas eile agus cuir gach costas leis de réir mar a tharlaíonn sé. Beidh an liosta gearr íocaíochtaí ag fanacht nuair a shroicheann tú an t-aerfort. An bhfuil fonn ort a fheiceáil [conas a oibríonn socrú suas](page:feature/settle-up) ar dtús?"
sections:
  - heading: "Cúigear cairde, cúig chostas, seomra imeachta amháin"
    body: "Chaith Mo, Ines, Raf, Tess agus Uma seachtain ar an gcósta. Chuir Mo an t-árasán in áirithe agus cheannaigh sé na hearraí grósaera, d'íoc Ines as an turas báid agus d'íoc Raf as an dinnéar mór. Thóg Tess an tacsaí aerfoirt le Uma agus le Mo, mar thóg Ines agus Raf an traein. D'fhan cárta Uma sa bhaile, mar sin níor íoc sí as aon rud. Sin cúig chostas agus €1,700 ar fad, agus sa seomra imeachta ní raibh aon duine in ann a rá cé a bhí chun cinn."
  - heading: "Deich bhfiach, ceithre íocaíocht"
    body: "Roinntear an t-árasán, an bád, an dinnéar agus na hearraí grósaera go cothrom cúig bhealach. Sin €200, €50, €60 agus €18 an duine, mar sin tá €328 dlite ag Ines agus ag Raf an duine. Roinntear an tacsaí ag triúr ar €20 an duine, mar sin tá €348 dlite ag Mo, ag Tess agus ag Uma. D'íoc Mo €1,090 agus tá €348 dlite aige, rud a fhágann €742 dlite dó. D'íoc gach duine eile níos lú ná an méid atá dlite acu. Tá €348 ar iarraidh ar Uma, €288 ar Tess, €78 ar Ines agus €28 ar Raf, agus is ionann iad sin le chéile agus €742 Mo. Má shocraíonn tú gach péire daoine go díreach faigheann tú deich bhfiach ar leith. Molann Side Badger ceithre íocaíocht ina áit, gach ceann acu chuig Mo."
  - heading: "Socraigh sula scaipfidh gach duine"
    body: "Is é an t-am is fearr an tráthnóna deireanach nó an turas abhaile, fad is atá gach duine fós in aon áit amháin agus fiach €28 éasca a lua. Cuir gach costas leis ar dtús, an tacsaí san áireamh. Ní féidir le haon duine grúpa a fhágáil fad is atá airgead dlite acu nó dlite dóibh, mar sin caithfear an comhaireamh a dhúnadh uair éigin ar aon nós."
    items:
      - "**Seiceáil an liosta.** Oscail an grúpa agus féach ar **Iarmhéideanna**. De réir réamhshocraithe feiceann tú na fiacha a bhaineann leat. Roghnaigh **Taispeáin iad go léir** chun liosta an ghrúpa ar fad a fheiceáil."
      - "**Íoc mar is mian leat.** Aistriú bainc, airgead tirim, fabhar atá dlite ón saoire dheireanach. Ní bhogann Side Badger an t-airgead."
      - "**Taifead é.** Roghnaigh **Socraigh**. Faoi **Socrú gasta** is ceann de do chuid íocaíochtaí molta gach cnaipe, agus líonann ceann a roghnú an méid isteach. Cuir **Nóta** leis mar “aistriú bainc”, seiceáil an **Dáta** (ní féidir leis a bheith sa todhchaí) agus roghnaigh **Taifead Socrú**."
      - "**Féach air ag glanadh.** Nuashonraítear an t-iarmhéid do gach duine. Nuair a bhíonn an íocaíocht dheireanach taifeadta, taispeánann **Iarmhéideanna** **Gach rud socraithe!**"
  - heading: "Cuid anois, an chuid eile níos déanaí"
    body: "Is féidir le Uma €200 a sheoladh anocht agus an chuid eile ag deireadh na míosa. Taifeadann sí €200, agus tugann an fhoirm rabhadh di go mbeidh €148 fós dlite aici do Mo ina dhiaidh sin, is é sin €348 lúide €200. Sábháil é agus fanann €148 ar a hiarmhéid go dtaifeadann sí an chuid eile. Oibríonn an rabhadh an bealach eile freisin. Má iompaíonn nialas fánach €348 ina €3,480, deir an fhoirm nach bhfuil dlite aici do Mo ach €348 agus go gcruthódh sé fiach sa treo eile dá sábhálfaí é. Ceartaigh an nialas sula sábhálann tú."
  - heading: "Botúin a cheartú, agus íocaíochtaí a cheiliúradh"
    items:
      - "**Íocaíocht mhícheart.** Ní féidir ach leis an duine a thaifead íocaíocht í a chur in eagar. Is féidir leis an duine sin nó le riarthóir grúpa í a scriosadh, agus ansin is féidir í a thaifeadadh arís."
      - "**Íocaíocht is fiú a thabhairt faoi deara.** Suíonn gach íocaíocht a taifeadadh faoi **Socruithe** lena dáta agus a nóta, áit a bhfeiceann gach duine sa ghrúpa í agus is féidir leo imoibriú. Is féidir le Mo **Déan ceiliúradh** a roghnú nuair a shroicheann €148 deireanach Uma."
      - "**An deireadh.** Agus gach iarmhéid ag nialas, is féidir le riarthóir an grúpa a ghlasáil ionas go bhfanann na huimhreacha mar atá."
  - heading: "Cad nach ndéanann Side Badger anseo"
    items:
      - "Ní bhogann sé airgead choíche. Níl aon naisc íocaíochta ná iarratais ar íocaíocht aige, mar sin is taifead d'íocaíocht a rinneadh in áit eile é íocaíocht san aip."
      - "Ní sheolann sé aon mheabhrúcháin. Is ortsa atá sé fós tóir a chur ar íocaíocht dhéanach."
      - "Ní shocraíonn sé spriocdhátaí. Is faoin ngrúpa atá sé aontú cathain a bhíonn an chuid eile de €148 Uma dlite."
      - "Is liosta gearr iad na híocaíochtaí molta, ní gealltanas gurb é an ceann is giorra is féidir é. Oibrítear amach iad in aghaidh an airgeadra, mar sin faigheann turas a híocadh in euro agus i bpunt liosta do gach ceann."
