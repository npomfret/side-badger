meta:
  title: "Co Side Badger robi, a czego nie robi"
  description: "Dzielenie, rozliczanie i wiele walut, a do tego grupy, listy i ankiety. Cały zestaw i szczera lista tego, czego Side Badger nie ma."
h1: "Co robi Side Badger"
navLabel: "Funkcje"
lead: "Wszystko, co jest w pudełku, i to, czego w nim nie ma."
intro: "Oto cały zestaw. Arkusz kalkulacyjny zostawiliśmy celowo. Zacznij od trzech zadań, które Side Badger wykonuje codziennie, a potem sprawdź resztę listy i krótką listę rzeczy, których nie robi."
cta:
  heading: "Czy robi to, czego potrzebuje twoja grupa?"
  body: "Załóż darmowe konto i najpierw wypróbuj je w małej grupie."
  button: "Załóż darmowe konto"
cardsHeading: "Trzy zadania w szczegółach"
sections:
  - heading: "Skanowanie paragonów"
    body: "Zrób zdjęcie paragonu, a Side Badger uzupełni sumę, datę i miejsce do sprawdzenia. Obrazy paragonów są odczytywane przez usługę AI Google."
  - heading: "Grupy i uprawnienia"
    body: "Utwórz grupę dla każdego domu, wyjazdu i wydarzenia, z maksymalnie 50 osobami. Zapraszaj ludzi linkiem lub kodem QR. W większej grupie możesz kogoś ustawić jako widza, który widzi wszystko i niczego nie zmienia."
  - heading: "Listy i ankiety"
    body: "Trzymaj wspólną listę zakupów obok rachunków za zakupy. Poddaj pod głosowanie krótką listę willi, jeśli chcesz, anonimowo."
  - heading: "Cała reszta"
    items:
      - "**Aktualizacje na żywo:** dodaj wydatek, a wszyscy zobaczą go od razu."
      - "**Języki:** korzystaj z Side Badger w 39 językach. Każdy w grupie może wybrać własny."
      - "**Ekran główny:** sklep z aplikacjami nie jest potrzebny. Dodaj Side Badger do ekranu głównego, a otworzy się jak aplikacja."
      - "**Opinie:** trafił się błąd? Napisz do nas z poziomu aplikacji i tam przeczytaj naszą odpowiedź."
  - heading: "Czego Side Badger nie robi"
    items:
      - "**Nie przesyła pieniędzy.** Side Badger nigdy nie dotyka twoich pieniędzy. Płaćcie sobie, jak chcecie. Prośby o płatność są w planach."
      - "**Nie powtarza rachunków.** Nie ma wydatków cyklicznych. Skopiuj zeszłomiesięczny rachunek w dwa dotknięcia."
      - "**Nie dzieli według pozycji.** Jedna osoba płaci za wydatek. Dziel po równo, dokładnie albo procentowo."
      - "**Nie ma natywnej aplikacji.** Działa w przeglądarce. Dodaj go do ekranu głównego."
      - "**Nie działa offline.** Potrzebuje połączenia."
      - "**Nie wysyła alertów e-mailem ani SMS-em.** Powiadomienia pojawiają się w aplikacji. Powiadomienia push są w planach."
      - "**Nie rysuje wykresów ani budżetów.** Prowadzi rachunek, kto komu jest winien, i na tym cała sztuczka polega."
      - "**Nie loguje przez Google ani Apple.** Zarejestruj się e-mailem. Logowanie przez Google i Apple jest w planach."
      - "**Nie wpuszcza ludzi bez konta.** Każdy w grupie potrzebuje darmowego konta."
faq:
  heading: "Pytania"
  items:
    - q: "Czy mogę płacić przez Side Badger?"
      a: "Nie. Side Badger prowadzi rachunek i nigdy nie dotyka twoich pieniędzy. Płaćcie sobie, jak chcecie, a potem zarejestruj płatność."
    - q: "Czy jest aplikacja mobilna?"
      a: "Nie w sklepie z aplikacjami. Side Badger działa w przeglądarce i możesz dodać go do ekranu głównego, żeby otwierał się jak aplikacja."
    - q: "Czy mogę dzielić według pozycji?"
      a: "Nie. Każdy wydatek ma jednego płatnika i dzielisz go po równo, dokładnie albo procentowo."
    - q: "Czy działa offline?"
      a: "Nie, potrzebuje połączenia."
    - q: "Czy każdy w grupie potrzebuje konta?"
      a: "Tak. Każdy w grupie potrzebuje darmowego konta, a do rejestracji wystarczy adres e-mail."
