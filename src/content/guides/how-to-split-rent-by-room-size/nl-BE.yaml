meta:
  title: "Hoe verdeel je de huur naar kamergrootte | Side Badger"
  description: "Grotere kamer, groter deel. Zet de gedeelde ruimtes opzij, verdeel de rest naar oppervlakte en voer de percentages één keer in. Sommen voor drie huisgenoten."
h1: "Hoe verdeel je de huur naar kamergrootte"
navLabel: "Huur naar kamergrootte"
lead: "Bepaal welk deel van de huur naar de gedeelde ruimtes gaat en verdeel dat deel gelijk. Verdeel de rest daarna naar de vloeroppervlakte van elke slaapkamer. Rond af op hele percentages, voer ze één keer in bij de huur in Side Badger en kopieer de uitgave elke maand."
cta:
  heading: "Zet de huur er één keer in"
  body: "Maak een gratis account aan, start een groep voor het appartement en voer de huur in met de percentages die jullie afspraken. Volgende maand is een kopie. Eerst de rondleiding? Zie [zo werkt het](page:how-it-works) of [wat gratis dekt](page:pricing)."
sections:
  - heading: "Drie mensen, één appartement, één discussie"
    body: "Priya, Tom en Aisha delen een appartement voor £ 1.950 per maand. Een jaar lang verdeelden ze dat in drie, want dat was makkelijk. Toen mat Aisha haar slaapkamer op. De kamer van Priya is 16 m², die van Tom 12 m² en die van Aisha 10 m², dus Aisha betaalde evenveel als Priya voor een kamer die meer dan een derde kleiner was. Niemand had zich onredelijk gedragen. Niemand had de som gemaakt. Bij een afhaalmaaltijd spraken ze eerst één regel af. Van de huur dekt 40% de keuken, de badkamer en de living, die alle drie gebruiken."
  - heading: "De methode, met de sommen erbij"
    body: "Vier stappen, één rolmeter en de rekenmachine van je telefoon."
    items:
      - "**Zet het gedeelde deel opzij.** De groep spreekt af welk deel van de huur naar de ruimtes gaat die iedereen gebruikt. Voor het appartement is dat 40%, wat bij drie mensen 13,33% per persoon is."
      - "**Verdeel de rest naar vloeroppervlakte.** De andere 60% gaat naar slaapkamergrootte. De slaapkamers samen zijn 38 m² (16 + 12 + 10), dus het deel van Priya is 60% × 16/38, ofwel 25,26%."
      - "**Tel de twee delen op.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, plus 13,33% is 32,3%. Aisha: 60% × 10/38 = 15,79%, plus 13,33% is 29,1%."
      - "**Rond af en controleer.** Hele percentages zijn makkelijker te typen en om over te discussiëren, dus 38,6% wordt 39%, 32,3% wordt 32% en 29,1% wordt 29%. Controleer of 39 + 32 + 29 samen 100 is. Komt je afronding op 99 of 101 uit, dan spreekt de groep af wiens percentage een punt opschuift."
  - heading: "De maand in het appartement lezen"
    body: "De huur aan 39%, 32% en 29% komt neer op £ 760,50, £ 624,00 en £ 565,50. Priya betaalde de huisbaas, dus over de maand heeft zij £ 1.142,50 tegoed, terwijl Tom £ 566,00 schuldig is en Aisha £ 576,50. Side Badger stelt twee betalingen voor, allebei aan Priya."
  - heading: "Zet het op in Side Badger"
    body: "Eén avond, waarvan het grootste deel opgaat aan het bespreken van die 40%."
    items:
      - "**Maak de groep.** Kies op het dashboard **Groep aanmaken** en geef de groep de naam van het appartement. Kies **Anderen uitnodigen** en stuur de link of QR-code. Iedereen meldt zich aan of maakt een gratis account aan en kiest de naam waaronder hij of zij in deze groep getoond wil worden."
      - "**Voeg de huur toe.** Kies **Uitgave toevoegen**. Vul de beschrijving en het bedrag in en kies bij **Wie heeft betaald?** wie de huisbaas betaalde. Laat alle drie de personen staan bij **Verdelen tussen**, kies dan bij **Hoe te verdelen** voor **Percentage** en typ 39, 32 en 29. Het formulier waarschuwt als de percentages samen geen 100 zijn. Kies **Uitgave opslaan**."
      - "**Voeg de rekeningen toe.** Energie en internet zijn aparte uitgaven met elk hun eigen betaler. Laat **Hoe te verdelen** op **Gelijk** staan."
      - "**Kopieer ze volgende maand.** Open de huur van vorige maand en kies **Uitgave kopiëren**. De kopie behoudt de betaler, het bedrag en de verdeling en krijgt de datum van vandaag. Pas het bedrag aan als de huur veranderd is en kies dan **Kopie aanmaken**."
      - "**Controleer wie wie iets schuldig is.** Het onderdeel **Saldi** toont het. Betaal elkaar zoals je wilt en registreer de betaling dan onder **Vereffenen**."
  - heading: "Eigen badkamers, minikamertjes en mensen die vertrekken"
    items:
      - "**Kamers met eigen badkamer en minikamertjes.** Vloeroppervlakte is een beginpunt. Een kamer met eigen badkamer is meer waard dan dezelfde oppervlakte zonder, en een minikamertje waar een bed en een hoopvolle stoel in passen is minder waard. Pas de percentages in onderling overleg aan, controleer of ze nog steeds samen 100 zijn en schrijf de eindcijfers ergens op waar het hele appartement ze kan zien."
      - "**Iemand verhuist halverwege de maand.** Reken uit wat iedereen voor die maand schuldig is en voer de huur van die maand in met **Exacte bedragen** in plaats van **Percentage**. De bedragen moeten samen de huur zijn. Doe het voor die persoon vertrekt. Niemand kan een groep verlaten zolang die geld schuldig is of tegoed heeft, en een uitgave waarbij iemand betrokken is die vertrokken is, wordt alleen-lezen."
      - "**Iemand trekt in.** Meet opnieuw, maak de sommen opnieuw met de nieuwe kamergroottes en gebruik de nieuwe percentages vanaf de volgende huur. Eerdere maanden blijven zoals ze waren."
  - heading: "Wat Side Badger hier niet doet"
    items:
      - "Het meet je kamers niet op en kiest de percentages niet. De vloeroppervlakten en die 40% spreekt de groep zelf af."
      - "Er zijn geen terugkerende rekeningen, dus kopieer je elke keer de huur van vorige maand."
      - "Het verplaatst nooit geld en betaalt de huisbaas niet. Jullie betalen elkaar zoals jullie willen en registreren het dan."
      - "Het weet niet wat er in jullie huurcontract staat. Het houdt de rekening bij tussen de mensen in de groep."
