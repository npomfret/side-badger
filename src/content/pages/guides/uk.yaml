  description: "Практичні посібники з чесного розподілу оренди, відпускних вілл і групових витрат: кожен розібрано на реалістичній групі з показаними обчисленнями."
h1: "Посібники з чесного розподілу витрат"
navLabel: "Посібники"
lead: "Запитання, які люди ставлять перед тим, як відкрити таблицю, з відповідями на прикладі правдоподібної групи, з обчисленнями й кроками в застосунку."
intro: "Кожен посібник супроводжує **одну вигадану групу** від першої витрати до останнього записаного платежу. Цифри пораховано за вас, а кроки відповідають екранам, як їх називає застосунок."
cta:
  heading: "Маєте таку саму групу?"
  body: "Створіть обліковий запис, заведіть групу й додайте першу витрату. Обчислення зроблено за вас."
cardsHeading: "Оберіть своє запитання"
