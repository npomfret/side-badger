meta:
  title: "Jika seseorang mempersoalkan pengeluaran bersama | Side Badger"
  description: "Lewati pesan menyindir. Pertanyakan pengeluarannya, dan ia keluar dari saldo semua orang selagi Anda berbincang. Dihitung dengan wine pesta £45."
h1: "Apa yang harus dilakukan saat seseorang mempersoalkan pengeluaran bersama"
navLabel: "Pengeluaran yang dipersoalkan"
lead: "Ajukan pertanyaan pada pengeluarannya, bukan mengirim pesan yang menyindir. Selama pertanyaan masih terbuka, seluruh pengeluaran itu tidak masuk ke saldo siapa pun. Bicarakan di komentar, ubah pembagiannya jika grup setuju, dan biarkan orang yang bertanya, atau seorang admin, menutup pertanyaannya."
cta:
  heading: "Ajukan pertanyaan canggung dengan sopan"
  body: "Buat akun gratis, mulai grup untuk rumah, dan minta admin mengaktifkan pertanyaan pengeluaran, yang nonaktif sampai ada yang mengaktifkannya. Ingin melihat-lihat dulu? Lihat [cara kerjanya](page:how-it-works) atau [apa saja yang gratis](page:pricing)."
sections:
  - heading: "Tiga teman serumah dan wine £45"
    body: "Setelah pesta, Tom menambahkan wine itu ke grup rumah. Harganya £45, dibayar Tom, dibagi rata antara Tom, Priya, dan Aisha, yaitu £15 per orang. Aisha tidak minum. Tom membelinya untuk pesta, dan pesta itu untuk [seisi rumah](page:use-case/housemates), jadi ia tidak salah apa-apa. Aisha pun tidak salah bertanya. Tak ada penjahat di sini. Yang ada hanya wine senilai £15 yang dipersoalkan dan banyak cara untuk membuatnya canggung. Pesan menyindir ke seisi rumah adalah salah satunya. Pertanyaan pada pengeluaran adalah cara yang lebih lembut."
  - heading: "Apa yang dilakukan sebuah pertanyaan"
    body: "Aisha membuka pengeluaran itu dan mengajukan pertanyaan. Seluruh pengeluaran keluar dari saldo semua orang, bukan hanya bagiannya, dan tak ada hal lain yang terpengaruh. Belanja besar (£84) dan petugas kebersihan (£60) tetap dihitung, yaitu £28 + £20 = £48 per orang. Jadi selama wine ditahan, Aisha berutang £48, Tom dihutangi £36, dan Priya dihutangi £12. Apa pun yang diputuskan seisi rumah soal wine, saldo siapa pun tidak memuatnya untuk sementara. Orang lain dalam pengeluaran itu juga bisa mengajukan pertanyaannya sendiri. Wine kembali ke saldo hanya saat pertanyaan terbuka terakhir di dalamnya ditutup, dan pertanyaan ditutup oleh orang yang bertanya atau oleh admin."
  - heading: "Dibicarakan dulu, lalu dibereskan"
    body: "Pertanyaan Aisha masuk ke komentar pengeluaran itu, jadi balasannya berada tepat di bawahnya. [Rencanakan bersama](page:feature/plan-together) membahas komentar dan pertanyaan lebih lanjut. Tom dan Priya membacanya dan seisi rumah mengobrol. Mereka memutuskan wine itu milik Tom dan Priya, karena merekalah yang meminumnya. Rumah lain mungkin mempertahankan pembagian tiga orang, atau menyepakati sesuatu di antaranya, dan itu juga tak masalah. Side Badger menyimpan apa yang Anda sepakati dan tidak punya pendapat soal wine. Tom mengubah pengeluaran itu agar dibagi rata antara dirinya dan Priya, yaitu £22,50 per orang (£45 ÷ 2). Aisha tidak lagi ada di dalamnya, jadi pertanyaannya ikut versi lama dan wine kembali masuk ke saldo. Versi sebelumnya tetap tersimpan."
  - heading: "Membaca hasilnya"
    body: "Dengan wine kembali masuk, Tom dihutangi £58,50, Priya berutang £10,50, dan Aisha berutang £48. Side Badger menyarankan dua pembayaran, keduanya kepada Tom. £48 milik Aisha adalah angka yang ia miliki saat wine ditahan, karena ia tidak ikut di dalamnya. Priya berubah dari dihutangi £12 menjadi berutang £10,50, yaitu £22,50 untuk separuh bagiannya dari wine. Seandainya pembagian tiga orang bertahan, Aisha akan berutang £63 (£28 + £20 + £15). Seluruh perselisihan ini bernilai £15. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat tiap pembayaran di bawah **Lunasi**. [Pelunasan](page:feature/settle-up) menjelaskan sisanya."
  - heading: "Merangkai kata agar orang tetap mau bicara dengan Anda"
    body: "Pertanyaan Aisha: \"Aku tidak minum wine sama sekali. Bisa kita lihat lagi pembagiannya?\" Singkat, menyebut pengeluarannya, dan bertanya alih-alih menuduh. Beberapa kebiasaan membantu."
    items:
      - "**Tanyakan soal pengeluarannya, bukan orangnya.** \"Bisa kita cek pembagian wine-nya?\" memulai percakapan. \"Kenapa aku ditagih untuk wine-mu?\" memulai jenis yang lain."
      - "**Sebutkan apa yang Anda inginkan.** \"Bisakah hanya untuk orang yang meminumnya?\" memberi grup sesuatu untuk disetujui atau dijawab."
      - "**Beri alasan dalam satu-dua kalimat.** Kolomnya bernama **Pertanyaan Anda** dan tidak boleh dikosongkan."
      - "**Simpan balasan di satu tempat.** Jawaban masuk ke komentar pengeluaran, di samping angka yang dibicarakan."
  - heading: "Siapkan di Side Badger"
    items:
      - "**Aktifkan pertanyaan.** Fitur ini nonaktif secara bawaan. Admin membuka **Pengaturan** grup, mengaktifkan **Izinkan pertanyaan pengeluaran** di bawah **Fitur** pada tab **Umum**, lalu memilih **Simpan**. Mematikannya kemudian akan menghapus setiap pertanyaan yang terbuka."
      - "**Ajukan satu.** Buka pengeluarannya dan, di samping nama Anda sendiri dalam pembagian, pilih **Saya punya pertanyaan**. Tulis alasan Anda di **Pertanyaan Anda** dan pilih **Saya punya pertanyaan** lagi. Hanya orang yang ada dalam pengeluaran itu yang bisa melakukannya. Pengeluaran kini menampilkan lencana **Dipertanyakan**."
      - "**Temukan yang ditahan.** Di daftar pengeluaran, **Hanya dipertanyakan** menampilkan pengeluaran yang punya pertanyaan terbuka."
      - "**Perbaiki, jika grup setuju.** Buka pengeluarannya, pilih **Ubah**, ubah **Dibagi antara**, lalu pilih **Perbarui Pengeluaran**. Siapa yang bisa mengubah bergantung pada izin grup."
      - "**Tutup, jika tak ada yang perlu diperbaiki.** Orang yang bertanya bisa memakai tombol tutup pada lencana **Dipertanyakan** miliknya, berlabel **Tutup pertanyaan**, begitu pula admin. Pengeluaran kembali ke saldo setelah pertanyaan terakhirnya ditutup."
  - heading: "Saat tak serapi itu"
    items:
      - "**Perubahan tetap menyertakan penanya.** Jika orang yang bertanya masih ada dalam pengeluaran, pertanyaannya terbawa ke versi yang diubah dan menunggu mereka, atau admin, menutupnya. Memperbaiki jumlahnya tidak sama dengan menyetujui bahwa semuanya sudah beres."
      - "**Anda tidak ada dalam pengeluaran itu.** Hanya orang dalam sebuah pengeluaran yang bisa mempertanyakannya. Jika ada yang terlihat janggal bagi Anda, sampaikan di komentarnya atau tanyakan kepada yang menambahkannya."
      - "**Seseorang ingin keluar dari grup.** Pertanyaan yang terbuka menahan orang-orang dalam pengeluaran itu untuk keluar. Tutup pertanyaannya, atau ubah pengeluaran agar mereka tak lagi ada di dalamnya, dan mereka bisa pergi."
  - heading: "Yang tidak dilakukan Side Badger di sini"
    items:
      - "Side Badger tidak memutuskan siapa yang benar. Ia menahan pengeluaran dari saldo dan menyimpan apa yang Anda sepakati."
      - "Side Badger tidak meminta siapa pun menyetujui pengeluaran sebelum dihitung. Hanya pengeluaran yang dipertanyakan yang ditahan."
      - "Side Badger tidak bisa menahan sebagian pengeluaran. Pertanyakan, dan seluruhnya keluar dari saldo."
      - "Side Badger tidak memindahkan uang. Anda membayar satu sama lain dengan cara apa pun yang disuka dan mencatatnya."
