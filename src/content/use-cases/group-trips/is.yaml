featuresHeading: "Það sem ferðalag reiðir sig á"
faq:
  heading: "Spurningar"
  items:
    - q: "Má sleppa þeim sem slepptu kvöldverðinum?"
      a: "Já. Veldu hverjir voru með í hverju útgjaldi og aðeins þeir eru rukkaðir fyrir það."
    - q: "Virkar þetta án netsambands?"
      a: "Nei. Side Badger þarf nettengingu, svo bættu við kostnaðinum þegar þú ert aftur komin(n) á wifi."
    - q: "Þurfa allir að setja upp eitthvað?"
      a: "Nei. Það keyrir í vafranum. Sendu boðstengilinn og fólk kemur inn úr símanum sínum."
    - q: "Hvaða gengi notar það?"
      a: "Núverandi gengi þegar þú skráir útgjaldið, eða þitt eigið ef þú fékkst annað. Gengið festist þegar útgjaldið er vistað, svo gömul útgjöld eru aldrei endurmetin."
    - q: "Getum við fryst hópinn eftir ferðina?"
      a: "Já. Stjórnandi getur læst hópnum svo tölurnar haldist á sínum stað."
    - q: "Eru takmörk á upphæðum?"
      a: "Já. 999.999,99 á hvert útgjald, í eigin gjaldmiðli."
