faq:
  heading: "سوالات"
  items:
    - q: "کیا کیلکولیٹر مفت ہے؟"
      a: "جی ہاں۔ مفت۔ کوئی اشتہار نہیں۔ کوئی یومیہ حد نہیں۔ اکاؤنٹ کی بھی ضرورت نہیں۔"
    - q: "کیا یہ میرا لکھا ہوا محفوظ کرتا ہے؟"
      a: "نہیں۔ کچھ بھی محفوظ نہیں ہوتا اور نہ کہیں بھیجا جاتا ہے۔ اپنے اعداد رکھنے کے لیے لنک کاپی کریں اور اسے کہیں محفوظ کر لیں۔"
    - q: "میں جو لنک کاپی کرتا ہوں اسے کون دیکھ سکتا ہے؟"
      a: "جس کے پاس بھی وہ ہو۔ اعداد خود لنک میں، # کے بعد ہوتے ہیں، اس لیے اسے صرف ان لوگوں کو بھیجیں جنہیں انہیں دیکھنا چاہیے۔"
    - q: "کیا یہ رقم منتقل کرتا ہے؟"
      a: "نہیں۔ یہ بتاتا ہے کہ کس کو کس کو ادا کرنا چاہیے، اور آپ ایک دوسرے کو جیسے چاہیں ادا کرتے ہیں۔ Side Badger بھی آپ کی رقم کو کبھی ہاتھ نہیں لگاتا۔ دیکھیں [حساب برابر کرنا](page:feature/settle-up)۔"
    - q: "کیا میں دو کرنسیوں میں ادا کیے گئے سفر کو تقسیم کر سکتا ہوں؟"
      a: "یہاں نہیں، کیونکہ ایک حساب میں ایک ہی کرنسی ہوتی ہے۔ گروپ میں ہر کرنسی کا اپنا بیلنس رہتا ہے۔ دیکھیں [متعدد کرنسیاں](page:feature/multiple-currencies)۔"
    - q: "اگر رقمیں جمع نہ ہوں تو؟"
      a: "کیلکولیٹر خرچے کے نیچے یہ بتا دیتا ہے اور جب تک وہ جمع نہ ہوں کوئی نتیجہ نہیں دکھاتا۔ عین رقمیں کل کے برابر ہونی چاہئیں، اور فیصد کا مجموعہ 100 بننا چاہیے۔"
