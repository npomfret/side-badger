meta:
  title: "Side Badger 与 Splitwise：面向整个群组，不只是算账 | Side Badger"
  description: "面向整个群组的免费 Splitwise 替代品：评论、提问、清单、投票和完善的角色，还有免费的收据扫描和货币换算。"
h1: "Side Badger 与 Splitwise：面向整个群组，不只是算账"
navLabel: Side Badger 与 Splitwise
lead: "你们群组里多半有人说过“直接用 Splitwise 吧”。有道理：算账它很在行。Side Badger 也算账，然后再给群组一个把账聊清楚的地方：评论、提问、清单、投票和完善的群组角色。收据扫描和货币换算全部免费。"
cta:
  heading: 在你们下一笔共同账单上试试
  body: "创建免费账户，建一个群组，添加一笔真实的支出。如果不适合你，你也只花了几分钟，而不是一份订阅。"
asOf: 2026-11-22
asOfNote: "我们在 {date} 读过 Splitwise 自己的页面，免得你再去读，这里关于 Splitwise 的一切都来自这些页面。表格的每一行都链接到它的来源。方案会变，所以我们每季度复查一次，如果 Splitwise 的页面与本页不一致，请以它们为准。"
