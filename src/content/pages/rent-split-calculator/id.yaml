faq:
  heading: "Pertanyaan"
  items:
    - q: "Mana yang lebih adil, ukuran kamar atau penghasilan?"
      a: "Tak ada yang selalu lebih adil. Ukuran kamar cocok untuk teman serumah yang membayar ruang tempat mereka tidur. Penghasilan cocok untuk pasangan dan teman dengan gaji yang sangat berbeda. Sepakati sebelum hari bayar sewa pertama, bukan sesudahnya."
    - q: "Apakah tagihannya dibagi dengan cara yang sama?"
      a: "Untuk teman serumah, biasanya tidak. Semua orang memakai listrik dan internet, jadi bagi rata lebih sederhana, seperti pada contoh. Menurut penghasilan, kalkulator memberi tagihan bagian yang sama dengan sewanya."
    - q: "Bisakah saya memakai kaki persegi?"
      a: "Bisa. Pilih ft² dan ketik luasnya dalam kaki persegi. Satuan ini hanya label, dan hasil bagiannya sama selama semua orang memakai satuan yang sama."
    - q: "Apakah kalkulatornya gratis?"
      a: "Ya. Gratis. Tanpa iklan. Tanpa batas harian. Anda juga tidak perlu akun."
