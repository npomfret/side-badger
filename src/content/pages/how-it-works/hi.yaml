sections:
  - heading: "39 भाषाएं, और ज़्यादा लोगों के लिए बना"
    body: "Side Badger को 39 भाषाओं में इस्तेमाल करें, जिनमें दाएं से बाएं लिखी जाने वाली अरबी, फ़ारसी और उर्दू भी हैं। ग्रुप का हर सदस्य अपनी भाषा चुन सकता है, इसलिए ग्रुप का पेज एक व्यक्ति के लिए अरबी में और अगले के लिए अंग्रेज़ी में हो सकता है। इसे कीबोर्ड और स्क्रीन-रीडर इस्तेमाल करने वालों को ध्यान में रखकर भी बनाया गया है, और सदस्यों के रंगों के साथ पैटर्न भी आते हैं, ताकि आपको हरे और लाल में फर्क न करना पड़े।"
faq:
  heading: "सवाल"
  items:
    - q: "क्या सबको अकाउंट चाहिए?"
      a: "हाँ, एक मुफ्त अकाउंट। हर व्यक्ति कुछ भी जोड़ने से पहले अपना ईमेल वेरिफाई करता है।"
    - q: "क्या इसका कोई ऐप है?"
      a: "यह ब्राउज़र में चलता है, और आप इसे अपनी होम स्क्रीन या डॉक में जोड़ सकते हैं ताकि यह ऐप की तरह खुले। ऐप-स्टोर वाला वर्शन नहीं है और ऑफलाइन मोड भी नहीं है।"
    - q: "क्या Side Badger पैसे भेजता है?"
      a: "नहीं। यह हिसाब रखता है और पेमेंट सुझाता है, और आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं। फिर आप पेमेंट रिकॉर्ड करते हैं। [हिसाब चुकता करना](page:feature/settle-up) देखें।"
    - q: "क्या कोई पैसे बाकी रहते हुए ग्रुप छोड़ सकता है?"
      a: "नहीं। जब तक किसी का कुछ देना या पाना बाकी है, वह ग्रुप नहीं छोड़ सकता, इसलिए वह पहले हिसाब चुकता करता है।"
    - q: "एक ग्रुप में कितने लोग जुड़ सकते हैं?"
      a: "एक ग्रुप में 50 लोगों तक। उन्हें लिंक या QR कोड से बुलाएं, और अगर चाहते हैं कि एडमिन हर व्यक्ति को अंदर आने दे तो अप्रूवल चालू करें।"
    - q: "एक से ज़्यादा करेंसी वाली ट्रिप का क्या?"
      a: "बैलेंस हर करेंसी के लिए अलग रखे जाते हैं। [कई करेंसी](page:feature/multiple-currencies) देखें।"
