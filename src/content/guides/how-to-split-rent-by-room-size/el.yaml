faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Τι γίνεται αν κάποιος έχει μεγαλύτερο δωμάτιο αλλά λιγότερο φως;"
      a: "Το εμβαδόν είναι μόνο η αφετηρία, οπότε η ομάδα μπορεί να συμφωνήσει κάποια προσαρμογή. Αφαιρέστε μία ή δύο μονάδες από το σκοτεινό δωμάτιο, δώστε τες στα υπόλοιπα και ελέγξτε ότι τα ποσοστά εξακολουθούν να κάνουν συνολικά 100. Το Side Badger αποθηκεύει ό,τι συμφωνήσετε και δεν το κρίνει."
    - q: "Να μοιράζονται και οι λογαριασμοί ανάλογα με το μέγεθος του δωματίου;"
      a: "Συνήθως όχι. Το ρεύμα και το ίντερνετ τα χρησιμοποιούν όλοι, οπότε ο εξίσου διαχωρισμός είναι απλούστερος, όπως στο παράδειγμα παραπάνω. Αν κάποιος συγκάτοικος είναι στο σπίτι όλη μέρα, η ομάδα μπορεί να συμφωνήσει κάτι άλλο, όπως ακριβή ποσά. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) καλύπτει τις επιλογές."
    - q: "Μπορούμε να αλλάξουμε τον διαχωρισμό αργότερα;"
      a: "Ναι, για τα νέα έξοδα. Αλλάξτε τα ποσοστά όταν αντιγράφετε το ενοίκιο και οι προηγούμενοι μήνες μένουν όπως ήταν. Για να διορθώσετε ένα παλιό έξοδο, επεξεργαστείτε το αν το επιτρέπουν τα δικαιώματα της ομάδας και πείτε πρώτα στο σπίτι, επειδή αλλάζουν τα υπόλοιπα. Η προηγούμενη έκδοση διατηρείται."
