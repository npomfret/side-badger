meta:
  title: "Cad a dhéanann agus nach ndéanann Side Badger"
  description: "Roinnt, socrú suas agus ilairgeadraí, móide grúpaí, liostaí agus vótaí. An trealamh iomlán, agus liosta macánta de na rudaí a fhágann Side Badger ar lár."
h1: "Cad a dhéanann Side Badger"
navLabel: "Gnéithe"
lead: "Gach rud sa bhosca, agus an méid nach bhfuil ann."
intro: "Seo an trealamh iomlán. D'fhágamar an scarbhileog ar lár d'aon ghnó. Tosaigh leis na trí jab a dhéanann Side Badger gach lá, ansin seiceáil an chuid eile den liosta agus an liosta gearr de na rudaí nach ndéanann sé."
cta:
  heading: "An ndéanann sé an rud a theastaíonn ó do ghrúpa?"
  body: "Cruthaigh cuntas saor in aisce agus bain triail as le grúpa beag ar dtús."
  button: "Cruthaigh cuntas saor in aisce"
cardsHeading: "Na trí jab, go mion"
sections:
  - heading: "Scanadh admhálacha"
    body: "Tóg grianghraf den admháil agus líonann Side Badger isteach an t-iomlán, an dáta agus an áit duit le seiceáil. Léann seirbhís AI Google íomhánna admhálacha."
  - heading: "Grúpaí agus ceadanna"
    body: "Déan grúpa do gach teach, turas nó imeacht, le suas le 50 duine ann. Tabhair cuireadh do dhaoine le nasc nó le cód QR. I ngrúpa níos mó, déan breathnóir de dhuine éigin, a fheiceann gach rud agus nach n-athraíonn aon rud."
  - heading: "Liostaí agus vótaí"
    body: "Coinnigh an liosta siopadóireachta comhroinnte in aice leis na billí siopadóireachta. Cuir liosta gearr na dtithe saoire chun vótála, gan ainm más maith leat."
  - heading: "Gach rud eile"
    items:
      - "**Nuashonruithe:** cuir costas leis agus feiceann gach duine é gan mhoill."
      - "**Teangacha:** úsáid Side Badger i 39 teanga. Is féidir le gach duine sa ghrúpa a dteanga féin a roghnú."
      - "**Scáileán baile:** níl siopa aipeanna de dhíth. Cuir Side Badger le do scáileán baile agus osclaíonn sé cosúil le haip."
      - "**Aiseolas:** fuair tú fabht? Inis dúinn ón aip féin agus féach ár bhfreagra ansin."
  - heading: "Cad nach ndéanann Side Badger"
    items:
      - "**Airgead a bhogadh.** Ní théann Side Badger i dteagmháil le d'airgead choíche. Íocaigí a chéile ar an gcaoi is fearr libh. Tá iarratais ar íocaíocht beartaithe."
      - "**Billí a athrá.** Níl aon chostais athfhillteacha ann. Cóipeáil bille na míosa seo caite go tapa."
      - "**Roinnt de réir míre.** Íocann duine amháin as gach costas. Roinn go cothrom, go cruinn nó de réir céatadáin."
      - "**Aip dhúchasach a sheoladh.** Oibríonn sé i do bhrabhsálaí. Cuir le do scáileán baile é."
      - "**Oibriú as líne.** Teastaíonn nasc uaidh."
      - "**Foláirimh a sheoladh trí ríomhphost nó téacs.** Taispeántar fógraí san aip. Tá fógraí brú beartaithe."
      - "**Cairteacha nó buiséid a tharraingt.** Coinníonn sé cuntas ar cé atá i bhfiacha le cé, agus sin an cleas ar fad."
      - "**Síniú isteach le Google nó Apple.** Cláraigh le ríomhphost. Tá síniú isteach le Google agus Apple beartaithe."
      - "**Daoine a ligean isteach gan chuntas.** Teastaíonn cuntas saor in aisce ó gach duine sa ghrúpa."
faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir liom íoc trí Side Badger?"
      a: "Ní féidir. Coinníonn Side Badger an cuntas agus ní théann sé i dteagmháil le d'airgead choíche. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht."
    - q: "An bhfuil aip mhóibíleach ann?"
      a: "Ní i siopa aipeanna. Ritheann Side Badger i do bhrabhsálaí, agus is féidir leat é a chur le do scáileán baile ionas go n-osclaíonn sé cosúil le haip."
    - q: "An féidir liom roinnt de réir míre?"
      a: "Ní féidir. Tá duine amháin ag íoc as gach costas, agus roinneann tú go cothrom é, de réir suimeanna cruinne nó de réir céatadáin."
    - q: "An n-oibríonn sé as líne?"
      a: "Ní oibríonn, teastaíonn nasc uaidh."
    - q: "An gcaithfidh cuntas a bheith ag gach duine sa ghrúpa?"
      a: "Caithfidh. Teastaíonn cuntas saor in aisce ó gach duine sa ghrúpa, agus níl uait chun clárú ach seoladh ríomhphoist."
