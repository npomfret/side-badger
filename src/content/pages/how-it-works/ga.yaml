sections:
  - heading: "39 teanga, agus déanta do níos mó daoine"
    body: "Úsáid Side Badger i 39 teanga, lena n-áirítear Araibis, Peirsis agus Urdais, a scríobhtar ón taobh dheas go dtí an taobh clé. Is féidir le gach duine sa ghrúpa a dteanga féin a roghnú, mar sin is féidir leathanach an ghrúpa a bheith in Araibis do dhuine amháin agus i mBéarla don duine eile. Tá sé tógtha freisin le húsáideoirí méarchláir agus léitheoirí scáileáin i gcuimhne, agus tagann patrúin le dathanna baill, ionas nach gcaithfidh tú glas a idirdhealú ó dhearg."
faq:
  heading: "Ceisteanna"
  items:
    - q: "An bhfuil cuntas ag teastáil ó gach duine?"
      a: "Tá, cuntas saor in aisce. Fíoraíonn gach duine a ríomhphost sula gcuireann sé nó sí aon rud leis."
    - q: "An bhfuil aip ann?"
      a: "Ritheann sé sa bhrabhsálaí, agus is féidir leat é a chur le do scáileán baile nó do dhoc ionas go n-osclaíonn sé cosúil le haip. Níl leagan siopa aipeanna ann agus níl mód as líne ann."
    - q: "An mbogann Side Badger airgead?"
      a: "Ní bhogann. Coinníonn sé an chuntas agus molann sé íocaíochtaí, agus íocann sibh a chéile ar an gcaoi is fearr libh. Ansin taifeadann tú an íocaíocht. Féach [socraigh suas](page:feature/settle-up)."
    - q: "An féidir le duine grúpa a fhágáil agus airgead dlite aige?"
      a: "Ní féidir. Ní féidir le haon duine grúpa a fhágáil fad is atá airgead dlite acu nó dlite dóibh, mar sin socraíonn siad ar dtús."
    - q: "Cé mhéad duine a fhéadfaidh dul isteach i ngrúpa?"
      a: "Suas le 50 duine i ngrúpa. Tabhair cuireadh dóibh le nasc nó le cód QR, agus cuir ceadú ar siúl más mian leat go ligfidh riarthóir gach duine isteach."
    - q: "Cad faoi thurais le níos mó ná airgeadra amháin?"
      a: "Coinnítear iarmhéideanna ar leith do gach airgeadra. Féach [ilairgeadraí](page:feature/multiple-currencies)."
