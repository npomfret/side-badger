faq:
  heading: "Domande"
  items:
    - q: "Chi dovrebbe registrare un pagamento, chi paga o chi riceve?"
      a: "Registrare un pagamento richiede il permesso di modificare le spese, e il modulo chiede **Chi ha pagato?** e **Chi ha ricevuto il pagamento?** Solo la persona che l'ha registrato può modificarlo in seguito, quindi di solito è più semplice che lo faccia chi paga, con il pulsante del saldo rapido."
    - q: "E se il viaggio si è svolto in due valute?"
      a: "I saldi sono tenuti per valuta, quindi un debito in euro resta un debito in euro e ogni valuta ha la sua breve lista di pagamenti, a meno che le spese siano state convertite quando sono state inserite. [Un viaggio in più valute](page:guide/how-to-split-a-trip-paid-in-several-currencies) mostra entrambi i modi."
    - q: "Conviene saldare durante il viaggio o alla fine?"
      a: "Vanno bene entrambi. Ogni pagamento registrato cambia i saldi, quindi un pagamento fatto a metà viaggio conta per la lista finale. Alla fine è più semplice, perché [tutto il viaggio](page:use-case/group-trips) è in un posto solo."
