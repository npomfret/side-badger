meta:
  title: "Rechnung teilen: wer wem was schuldet, geklärt | Side Badger"
  description: "Wer hat gezahlt, wer schuldet, wer zahlt wem: in Sekunden geklärt. Gleichmäßig, genau oder in Prozent. Kostenlos, im Browser, ohne Speichern oder Senden."
h1: Rechner zum Teilen von Rechnungen
navLabel: "Rechner: Rechnung teilen"
lead: Trag ein, wer was bezahlt hat, und der Rechner sagt dir, wer wem was schuldet, samt einer kurzen Liste von Zahlungen, die alles ausgleicht. Er läuft in deinem Browser, speichert nichts und bewegt kein Geld. Soll die Rechnung deiner Gruppe den Tab überleben, rechnen [Ausgaben teilen](page:feature/split-expenses) und [Abrechnen](page:feature/settle-up) in Side Badger dieselben Summen und behalten sie.
cta:
  heading: Gefällt dir die Rechnerei? Behalte sie.
  body: Dieser Rechner vergisst alles, sobald du den Tab schließt, ganz wie die Person, die beim letzten Mal ganz sicher gezahlt hat. Eine Gruppe in Side Badger behält die Ausgaben, aktualisiert den Saldo von allen und erfasst die Zahlungen. Es ist kostenlos, ohne Werbung und ohne Tageslimits.
sections:
  - heading: So rechnet der Rechner
    body: Für jede Ausgabe berechnet der Rechner den Anteil jeder Person. Du kannst sie gleichmäßig, nach genauen Beträgen oder in Prozent auf die Personen aufteilen, die du auswählst. Der Saldo jeder Person ist dann das, was sie bezahlt hat, minus dem, was sie schuldet. Ein Plus heißt, die Gruppe schuldet ihr Geld, ein Minus heißt, sie schuldet der Gruppe Geld. Die Salden ergeben zusammen immer null, denn was einer Person zusteht, schulden andere.
  - heading: Warum die Liste der Zahlungen kurz ist
    body: Niemand muss jeden Beleg einzeln ausgleichen. Sobald alle Salden feststehen, ordnet der Rechner der Person, die am meisten schuldet, die Person zu, die am meisten bekommt, gleicht so viel aus, wie eine Zahlung schafft, und arbeitet sich die Liste hinunter, bis alle bei null sind. Er braucht höchstens eine Zahlung weniger, als es Personen mit einem Saldo gibt, und oft sogar weniger als beim Ausgleichen Rechnung für Rechnung. Das ergibt eine kurze Liste von Zahlungen, verspricht aber nicht, die kürzestmögliche zu sein.
  - heading: Was der Rechner nicht kann
    items:
      - "**Mehrere Währungen verarbeiten.** Wähle eine und nutze sie für die ganze Berechnung. Die App führt für jede Währung einen eigenen Saldo und kann eine Ausgabe zu einem aktuellen Wechselkurs umrechnen, den du ändern kannst."
      - "**Etwas speichern.** Schließt du den Tab, sind die Zahlen weg. Willst du sie behalten, kopiere den Link. Er enthält deine Zahlen hinter dem #, das dein Browser nie an einen Server schickt, und alle, denen du ihn schickst, können sie lesen."
      - "**Geld bewegen.** Er sagt dir, wer wem zahlen sollte. Ihr zahlt einander, wie ihr wollt, und erfasst die Zahlung dann in der App, falls eure Gruppe dort ihre Rechnung führt."
      - "**Den übrigen Cent zufällig vergeben.** Lässt sich eine Rechnung nicht glatt teilen, gehen die übrigen Cent an die ersten Personen in der Liste, damit die Summen trotzdem stimmen. In der App bekommt eine Person den übrigen Cent zufällig, es ist also nicht immer dieselbe."
      - "**Über die Grenzen hinausgehen.** Der Rechner nimmt 2 bis 20 Personen, und eine Ausgabe kann bis zu 999.999,99 betragen, wie in der App."
