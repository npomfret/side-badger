    - feature: Para birimi çevirme
      other: Bir Pro özelliği. Convert'e dokunun; Splitwise bir grubun harcamalarını o andaki döviz kuruyla varsayılan para biriminize çevirir.
      sideBadger: Ücretsiz. Her harcamayı girerken, güncel bir döviz kuruyla ya da gerçekten aldığınız kurla çevirin. Özgün tutar harcamada kalır.
      source: currencies-help
    - feature: Para birimleri ve diller
      other: Ana sayfasının ifadesiyle 100'den fazla para birimi ve 7'den fazla dil.
      sideBadger: 133 para birimi ve 39 dil. Gruptaki herkes kendi dilini seçebilir.
      source: home
    - feature: Nerede kullanılır
      other: iPhone ve Android uygulamaları ve web.
      sideBadger: Tarayıcınızda. Giriş yapın, sonra ana ekrana ekleyin, uygulama gibi açılır. Uygulama mağazalarında yok.
      source: home
    - feature: Bölüşme yolları
      other: Eşit, tam tutarlarla, yüzdeyle, paylarla, düzeltmeyle ya da kalem kalem.
      sideBadger: Eşit, tam tutarlarla ya da yüzdeyle, harcama başına bir ödeyenle. Paylarla ya da kaleme göre değil.
      source: split-help
    - feature: Çevrimdışı kullanım
      other: Çekirdek özellikleri arasında bir çevrimdışı modu sayar.
      sideBadger: Hayır. Bağlantı gerektirir.
      source: home
    - feature: Ödemeler ve bankanız
      other: "Bazı yerlerde uygulamanın içinden para gönderebilir: ABD'de Splitwise Pay, ABD doları bakiyeleri için Venmo, PayPal ve seçili Avrupa ülkelerinde Pay by Bank; bu, kişisel bir vadesiz hesabı bağlar."
      sideBadger: Paranıza asla dokunmaz ve banka bilginizi istemez. Birbirinize istediğiniz yolla ödeyin, sonra ödemeyi kaydedin.
      source: payments-help
    - feature: Grafikler ve varsayılan bölüşümler
      other: İkisi de Pro özelliği.
      sideBadger: İkisi de yok.
      source: pro
faq:
  heading: Sorular
  items:
    - q: Side Badger, Splitwise'a ücretsiz bir alternatif mi?
      a: "Bir gruptaki harcamaları bölüşmek için evet, üstelik hesaplamadan fazlasını yapar: yorumlar, sorular, listeler, anketler ve grup rolleri; makbuz tarama ve para birimi çevirme ücretsiz. Uygulama mağazası uygulaması, çevrimdışı kullanım ya da uygulama içi ödeme gerekiyorsa bunları Splitwise yapar, Side Badger yapmaz."
    - q: Splitwise ayrıntıları nereden geliyor?
      a: "Splitwise'ın kendi sayfalarından: ana sayfası, Pro sayfası ve yardım merkezi. Tablonun her satırı geldiği sayfaya bağlanır ve tablonun üstündeki tarih onları ne zaman okuduğumuzu söyler. Her çeyrekte kontrol ederiz."
    - q: Side Badger ücretsiz kalacak mı?
      a: Side Badger'daki her şey bugün ücretsiz. Bu bir gün değişirse önceden haber veririz. Ayrıntılar için [fiyatlandırma sayfasına](page:pricing) bakın.
    - q: Grubumdaki herkes geçiş yapmak zorunda mı?
      a: Evet. Bir gruptaki herkesin ücretsiz bir Side Badger hesabı olması gerekir ve bir bağlantı ya da QR koduyla katılabilirler.
    - q: Side Badger'ın mobil uygulaması var mı?
      a: "Uygulama mağazasında yok. Tarayıcınızda çalışır: telefonunuzda giriş yapın, ana ekrana ekleyin, uygulama gibi açılsın. [Nasıl çalışır](page:how-it-works) nasıl yapılacağını gösterir."
