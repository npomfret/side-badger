meta:
  title: "Aip chun billí a roinnt gan íoslódáil | Side Badger"
  description: "Tá do fhón lán, tuigimid. Oibríonn Side Badger i do bhrabhsálaí, gan siopa aipeanna ná íoslódáil. Cuir le do scáileán baile é agus osclaíonn sé mar aip."
h1: "Gan siopa aipeanna. Gan íoslódáil. Mothaíonn sé mar aip fós"
navLabel: "Aip ghréasáin"
lead: "Maireann Side Badger i do bhrabhsálaí. Níl aon siopa aipeanna le cuardach agus níl aon rud le híoslódáil ar dtús. Logáil isteach ar fhón nó ar ríomhaire, roinn costais ar líne le do ghrúpa, agus cuir le do scáileán baile nó le do dock é nuair is mian leat é a bheith tapáil amháin uait."
cta:
  heading: "Oscail é. Logáil isteach. Tosaigh grúpa."
  body: "Cruthaigh cuntas, tosaigh grúpa agus cuir an chéad chostas leis, gach rud ón mbrabhsálaí atá oscailte agat cheana. Ar mhaith leat an turas a fháil ar dtús? Féach [conas a oibríonn sé](page:how-it-works), nó seiceáil [cad a chlúdaíonn saor in aisce](page:pricing)."
problem:
  heading: "Tá do fhón lán. Tuigimid."
  body: "Áit éigin air tá ceithre mhíle grianghraf den luí gréine céanna agus rabhadh stórála atá á scuabadh i leataobh agat ón earrach. Is é an rud deireanach atá de dhíth air ná aip eile, díreach chun dinnéar amháin a roinnt. Mar sin is aip ghréasáin é Side Badger. Ritheann sé i mbrabhsálaí nua-aimseartha ar fhón nó ar ríomhaire. Ar fhón úsáideann sé leaganacha amach soghluaiste, agus leathanach an ghrúpa roinnte ina chluaisíní, mar aon le rialuithe atá oiriúnach do thadhall. Braitheann roinnt breiseanna, mar é a chur le do scáileán baile, ar do bhrabhsálaí, agus deirimid cá háit."
workflow:
  heading: "Ó chluaisín brabhsálaí go scáileán baile i dtrí chéim"
  steps:
    - title: "Oscail é agus logáil isteach"
      body: "Téigh go Side Badger i do bhrabhsálaí agus logáil isteach. Níl uait ach seoladh ríomhphoist agus focal faire, agus fíoraíonn tú an ríomhphost sula bhféadfaidh tú aon rud a chur leis. Teastaíonn cuntas ó gach duine sa ghrúpa, mar sin déanfaidh na daoine a dtugann tú cuireadh dóibh an rud céanna."
    - title: "Cuir le do scáileán baile nó le do dock é"
      body: "Nuair atá tú logáilte isteach, tairgeann an aip í féin a shuiteáil. Faigheann tú cnaipe **Suiteáil** nuair a cheadaíonn do bhrabhsálaí é, agus **Taispeáin dom conas** nuair nach gceadaíonn. Ar chaill tú é, nó ar dhiúltaigh tú dó? Tá an chabhair chéanna i **Socruithe** faoi **Cuir leis an Scáileán Baile nó leis an Dock**. Ar iPhone nó iPad, taispeánann **Socruithe** céimeanna an iPhone ar dtús agus cuireann sé na gléasanna eile faoi **Feistí eile**. I ngach cás, osclaíonn an aip i bhfuinneog dá cuid féin ansin."
      shot: S20
      shotAlt: "An chuid Cuir leis an Scáileán Baile nó leis an Dock de Shocruithe, agus na céimeanna chun an aip a chur le gléas"
    - title: "Cas ar fhógraí, más mian leat iad"
      body: "Tá fógraí múchta go dtí go gcasann tú air iad, agus casann tú air gach gléas ar leith. Úsáid an cnaipe **Cas air** a thairgeann cloigín na bhfógraí, nó an lasc **Fógraí brú** i **Socruithe**. Ar iPhone nó iPad, oscail an aip ón Scáileán Baile ar dtús. Is é sin an t-aon áit a n-oibríonn fógraí ansin."
      shot: S19
      shotAlt: "An roghchlár anuas fógraí oscailte, ag liostú gníomhaíochta le déanaí sa ghrúpa"
options:
  heading: "Conas é a chur leis, gléas ar ghléas"
  items:
    - title: "iPhone agus iPad"
      body: "Tapáil an cnaipe Comhroinn, cearnóg le saighead ag díriú suas. Mura bhfeiceann tú é, tapáil na trí phonc (•••) ar dtús, ansin Comhroinn. Scrollaigh síos agus tapáil **Cuir leis an Scáileán Baile**. Fág **Oscail mar Aip Ghréasáin** casta air, ansin tapáil **Cuir leis**. Má d'oscail nasc taobh istigh d'aip eile, oscail an leathanach i Safari ar dtús, mar ní féidir leis an mbrabhsálaí ionsuite sin é a chur leis."
    - title: "Android"
      body: "Oscail roghchlár an bhrabhsálaí agus roghnaigh **Cuir leis an scáileán baile** nó **Suiteáil an aip**."
    - title: "Chrome nó Edge ar ríomhaire"
      body: "Oscail roghchlár an bhrabhsálaí agus roghnaigh an rogha chun an suíomh seo a shuiteáil mar aip. Faigheann sé fuinneog dá chuid féin agus deilbhín dá chuid féin ansin."
    - title: "Safari ar Mac"
      body: "Roghnaigh **Comhad**, agus ansin **Cuir leis an Dock**."
sections:
  - heading: "Fógraí, ach amháin má iarrann tú iad"
    body: "Is roghnach iad fógraí brú. Cas orthu agus gheobhaidh tú fógra nuair a bhíonn gníomhaíocht nua i do ghrúpaí, mar dhuine ag cur costais leis, ag fágáil tráchta nó ag taifeadadh íocaíochta. Casann tú orthu gléas amháin ag an am, ó chloigín na bhfógraí nó ó **Socruithe**, agus is féidir leat iad a chasadh as arís ansin. Teastaíonn brabhsálaí a thacaíonn leo agus do chead. Má bhlocáil do bhrabhsálaí iad don suíomh, ceadaigh iad i socruithe an bhrabhsálaí ar dtús. Ar iPhone nó iPad, ní oibríonn siad ach ón aip a cuireadh leis an Scáileán Baile, ní ó chluaisín brabhsálaí. Níl seachadadh cinnte, mar sin caith le fógra mar phriocadh, ní mar gheall. Chun a fheiceáil cad a thagann aníos sa sruth, féach [pleanáil le chéile](page:feature/plan-together)."
  - heading: "Nuashonruithe beo, gan cnaipe athnuachana"
    body: "Cuir costas leis agus feiceann gach duine é gan mhoill, mar aon le cad a athraigh agus cé a d'athraigh é. Coinníonn gach grúpa stair ghníomhaíochta, agus taispeánann cloigín na bhfógraí gníomhaíocht ar fud do ghrúpaí go léir. Ní gá d'aon duine fiafraí an bhfaca tú an rud a chuir tú leis díreach anois. Tá sé ar a scáileán."
  - heading: "39 teanga, ceann do gach duine"
    body: "Úsáid Side Badger in 39 teanga, lena n-áirítear Araibis, Peirsis agus Urdais, a scríobhtar ón deis go clé. Roghnaíonn gach duine sa ghrúpa a theanga féin, mar sin is féidir leis an leathanach grúpa céanna a bheith in Araibis do dhuine amháin agus i mBéarla don chéad duine eile. Is é an t-aon rud a chaithfidh an grúpa a aontú ná na huimhreacha."
  - heading: "Dearadh do níos mó ná cineál amháin úsáideora"
    body: "Tógadh Side Badger agus úsáideoirí méarchláir agus léitheoirí scáileáin i gcuimhne. Tagann patrúin le dathanna baill, mar sin ní gá duit glas a idirdhealú ó dhearg."
    items:
      - "Naisc scipe, ionas gur féidir le húsáideoirí méarchláir léim díreach chuig an ábhar."
      - "Bainistíonn dialóga fócas an mhéarchláir."
      - "Tá rialuithe lipéadaithe, do léitheoirí scáileáin."
      - "Iompaíonn leaganacha amach thart do theangacha ón deis go clé."
limits:
  heading: "Cad nach ndéanann an aip ghréasáin"
  items:
    - "Níl aon úsáid as líne ann. Teastaíonn nasc ó Side Badger, mar sin ní osclóidh sé do ghrúpa ar eitleán gan wifi."
    - "Níl aon aip siopa aipeanna ná aip dhúchasach iPhone nó Android ann. Is aip ghréasáin é Side Badger, agus is é é a chur le do scáileán baile nó le do dock an bealach chun an leagan atá cosúil le haip a fháil."
    - "Braitheann a chur le scáileán baile nó le dock ar do bhrabhsálaí. Athraíonn ainmneacha roghchláir idir brabhsálaithe agus leaganacha, agus ní thairgeann roinnt brabhsálaithe é."
    - "Is roghnach iad fógraí brú do gach gléas, agus teastaíonn brabhsálaí a thacaíonn leo agus do chead. Ar iPhone nó iPad, ní oibríonn siad ach ón aip a cuireadh leis an Scáileán Baile. Níl seachadadh cinnte."
    - "Níl aon rabhaidh ríomhphoist ná téacs ann agus níl aon mheabhrúcháin íocaíochta ann. Taispeántar gníomhaíocht nua san aip, agus mar fhógraí brú má chasann tú air iad. Is ortsa atá sé fós duine a spreagadh chun íoc."
    - "Coinnítear gníomhaíocht ar feadh 90 lá."
    - "Logálann tú isteach le seoladh ríomhphoist agus focal faire. Níl logáil isteach le Google ná le Apple ann, agus caithfidh tú a bheith 18 mbliana d'aois nó os a chionn."
    - "Ní mhaímid go bhfuil Side Badger go hiomlán inrochtana, ná go gcomhlíonann sé caighdeán foirmiúil inrochtaineachta. Má chuireann rud éigin bac ort, inis dúinn ón taobh istigh den aip agus feicfidh tú ár bhfreagra ansin."
useCasesHeading: "Cá gcuidíonn sé gan aip a bheith de dhíth"
faq:
  heading: "Ceisteanna"
  items:
    - q: "An bhfuil aip Side Badger i siopa aipeanna?"
      a: "Níl. Is aip ghréasáin é Side Badger. Osclaíonn tú i do bhrabhsálaí é, agus is féidir leat é a chur le do scáileán baile nó le do dock ionas go n-osclaíonn sé mar aip. Níl aon rud le híoslódáil ó shiopa aipeanna."
    - q: "An féidir liom billí a roinnt gan aip a íoslódáil?"
      a: "Is féidir. Oscail Side Badger i mbrabhsálaí ar d'fhón nó ar do ríomhaire, logáil isteach, agus tosaigh grúpa. Is roghnach é a chur le do scáileán baile nó le do dock."
    - q: "An n-oibríonn sé as líne?"
      a: "Ní oibríonn. Teastaíonn nasc ó Side Badger, fiú nuair a chuirtear le do scáileán baile nó le do dock é."
    - q: "Cén fáth nach bhfaighim fógraí ar m'iPhone?"
      a: "Ar iPhone nó iPad, ní oibríonn fógraí ach ón aip a cuireadh leis an Scáileán Baile, ní ó chluaisín brabhsálaí. Cuir leis í, oscail í ó dheilbhín an Scáileáin Baile, ansin cas fógraí air i **Socruithe**. Níl seachadadh cinnte, mar sin má théann ceann amú, taispeánann stair ghníomhaíochta an ghrúpa fós cad a cuireadh leis."
    - q: "An gcaithfidh mé fógraí a chasadh air?"
      a: "Ní gá. Tá siad múchta go dtí go gcasann tú air iad, gléas amháin ag an am. Gan iad, taispeánann gníomhaíocht nua san aip fós, agus feiceann gach duine athrú gan mhoill nuair a bhíonn an aip oscailte acu."
    - q: "An gcaithfidh cuntas a bheith ag gach duine sa ghrúpa?"
      a: "Caithfidh. Níl uait ach seoladh ríomhphoist agus focal faire, agus fíoraíonn tú an ríomhphost sula bhféadfaidh tú aon rud a chur leis. Déanann gach duine a théann isteach i ngrúpa an rud céanna, ar cibé fón nó ríomhaire is maith leo."
