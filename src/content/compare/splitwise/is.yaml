sections:
  - heading: "Peningaspjall, við hliðina á peningunum"
    body: "Sameiginlegir peningar fylgja spjall, efasemdir og áætlanir. Side Badger geymir allt þrennt við hliðina á tölunum svo enginn þurfi að fletta aftur í hópspjallinu."
    items:
      - "**Athugasemdir þar sem þær eiga heima.** Skrifaðu athugasemd við hópinn sjálfan eða hvaða útgjald, lista eða könnun sem er og hafðu samtalið við hliðina á því sem það snýst um."
      - "**Kvittanir og myndir.** Geymdu allt að þrjár kvittanir við hvert útgjald og bættu myndum eða PDF-skjölum við athugasemdir við hópinn, lista eða könnun."
      - "**Spurningar, ekki rifrildi.** Stjórnandi getur kveikt á spurningum og þá getur hver sem er í útgjaldi spurt út í það („Ég er með spurningu“). Það helst utan við stöðuna þar til málið er leyst."
      - "**Listar og kannanir.** Hafðu sameiginlega innkaupalistann við hliðina á innkaupareikningunum og láttu hópinn kjósa um stuttlistann yfir orlofshúsin, nafnlaust ef þú vilt."
      - "**Smá lófatak.** Bregstu við útgjöldum, greiðslum og athugasemdum og fagnaðu greiðslu þegar hún berst."
  - heading: Hópurinn þinn, þínar reglur
    body: "Hjálparmiðstöð Splitwise segir að það styðji ekki stjórnendur hópa eða sérstakar heimildir. Side Badger er með hlutverk og heimildir, fyrir hópa sem þurfa einhvern til að halda tölunum í lagi."
    items:
      - "**Stjórnendur, meðlimir og áhorfendur.** Gerðu einhvern að áhorfanda: viðkomandi sér allt og breytir engu."
      - "**Tvö snið, eða þín eigin.** Byrjaðu á Opinni samvinnu eða Stýrðum hópi, eða stilltu hverja heimild eftir þínu höfði: hver breytir og eyðir útgjöldum, breytir listum, býður og hleypir nýju fólki inn."
      - "**Samþykki til að ganga í hópinn.** Kveiktu á samþykki og stjórnandi hleypir hverjum og einum inn."
      - "**Stillingar hópsins sjálfs.** Takmarkaðu hann við gjaldmiðlana sem þið notið í raun, veldu sjálfgefinn gjaldmiðil hans og gefðu honum hausmynd."
      - "**Læstu honum þegar öllu er lokið.** Tölurnar haldast óbreyttar þar til stjórnandi opnar hann aftur."
  - heading: Ókeypis hér, greitt þar
    body: Splitwise Pro er greidd áskrift Splitwise og Pro-síða þess sjálfs selur þrjú atriði sem kosta ekkert í Side Badger.
    items:
      - "**Kvittanaskönnun.** Splitwise Pro skannar mynd af kvittuninni þinni. Side Badger gerir það ókeypis, án skönnunarinneigna: það fyllir út heildarupphæð, dagsetningu og stað fyrir þig til að yfirfara."
      - "**Gjaldmiðlaumreikningur.** Splitwise Pro umreiknar útgjöld hóps í sjálfgefinn gjaldmiðil þinn þegar þú ýtir á „Convert“. Side Badger umreiknar hvert útgjald um leið og þú skráir það, á núverandi gengi eða því sem þú fékkst í raun, og upphaflega upphæðin helst á útgjaldinu."
      - "**Engin dagleg takmörk.** Splitwise Pro selur ótakmörkuð útgjöld og hjálparmiðstöð þess segir að ókeypis notendur geti bætt við allt að 4 útgjöldum á dag. Side Badger hefur engin dagleg takmörk."
  - heading: Bankinn þinn kemur ekki nálægt
    body: "Side Badger tengist ekki bankanum þínum og biður ekki um bankaupplýsingar. Það heldur utan um hver skuldar hverjum; þið borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna. Engin bankainnskráning til að afhenda, svo einu færra til að passa upp á."
  - heading: Eitt app, í vafranum og í símanum
    body: "Side Badger keyrir í vafranum þínum. Skráðu þig inn, bættu því við heimaskjáinn og það opnast eins og app. Þetta er sama appið á báðum stöðum, svo nýr eiginleiki er kominn í símann næst þegar þú opnar það, án þess að bíða eftir uppfærslu í appverslun."
  - heading: "Og nokkur partíbrögð"
    items:
      - "**Spurðu aðstoðarmanninn þinn.** Side Badger virkar með ChatGPT og Claude: biddu þinn um að bæta við útgjaldi, skanna kvittun eða skrá greiðslu."
      - "**Allir á sínu tungumáli.** Side Badger talar 39 tungumál og hver og einn velur sitt eigið. Heimasíða Splitwise segir 7+. Það ræður líka við 133 gjaldmiðla, fyrir ferðina sem fer út um allt."
      - "**Hjálp án þess að fara úr appinu.** Í vandræðum, eða fannstu villu? Segðu okkur frá úr appinu og lestu svarið okkar strax þar."
  - heading: Þar sem Splitwise vinnur enn
    body: Við viljum frekar að þú veljir rétta appið en að þú komist að því seinna. Ef hópurinn þinn þarf eitthvað af þessu hefur Splitwise það en Side Badger ekki.
    items:
      - "**Öpp úr appverslunum.** Side Badger býr í vafranum þínum og á heimaskjánum, ekki í appverslunum."
      - "**Notkun án nettengingar.** Side Badger þarf nettengingu."
      - "**Greiðslur í appinu.** Í sumum löndum getur Splitwise líka flutt peningana. Side Badger heldur bara utan um skráninguna."
      - "**Skipting eftir hlutföllum eða liðum.** Side Badger hefur einn greiðanda fyrir hvert útgjald, skipt jafnt, eftir nákvæmum upphæðum eða í prósentum. Kvittanaskönnunin úthlutar ekki liðum á fólk."
      - "**Myndrit og sjálfgefin skipting.** Splitwise Pro hefur hvort tveggja. Side Badger heldur utan um hver skuldar hverjum og það er allt galdraverkið."
  - heading: Að flytja hópinn yfir
    body: Það er ekkert innflutningsverkfæri, svo flutningur þýðir nýtt upphaf. Gerðu fyrst upp í Splitwise, búðu svo til hóp í Side Badger og bjóddu öllum með tengli eða QR-kóða. Allir í hópnum þurfa ókeypis aðgang og allt sem þarf til að skrá sig er netfang.
