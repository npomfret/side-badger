faq:
  heading: よくある質問
  items:
    - q: Side BadgerはSplitwiseの無料の代替サービスですか？
      a: "グループで費用を割り勘する用途なら、そうです。レシートスキャン、通貨の換算、広告なしは無料で、1日の制限もありません。ネイティブアプリ、オフライン利用、定期的な支出、アプリ内での支払いが必要なら、それらはSplitwiseにあり、Side Badgerにはありません。"
    - q: Splitwiseの情報はどこから来ていますか？
      a: "Splitwise自身のページです。ホームページ、Proのページ、ヘルプセンターです。表の各行に元のページへのリンクがあり、表の上の日付が、それを読んだ日です。3か月ごとに確認しています。"
    - q: Side Badgerはずっと無料ですか？
      a: "Side Badgerのすべてが現在無料で、有料プランはありません。もしこれが変わる場合は、事前にお知らせします。詳しくは[料金のページ](page:pricing)をご覧ください。"
    - q: グループの全員が乗り換える必要がありますか？
      a: "はい。グループの全員に無料のSide Badgerアカウントが必要で、リンクまたはQRコードで参加できます。"
    - q: Side Badgerにモバイルアプリはありますか？
      a: "アプリストアにはありません。ブラウザで動作します。スマートフォンでログインしてから、ホーム画面に追加すれば、アプリのように開きます。方法は[使い方](page:how-it-works)で紹介しています。"
