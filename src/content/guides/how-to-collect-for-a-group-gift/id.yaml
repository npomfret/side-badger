meta:
  title: "Cara mengumpulkan uang untuk hadiah bersama | Side Badger"
  description: "Tiap orang urunan berbeda dan kartu satu orang menanggung dulu. Adakan jajak pendapat anggaran, masukkan jumlah pasti, dan biarkan Side Badger berhitung."
h1: "Cara mengumpulkan uang untuk hadiah bersama"
navLabel: "Urunan hadiah bersama"
lead: "Mengumpulkan uang untuk hadiah bersama berarti satu orang menalangi dulu dan semua yang lain berutang urunan mereka kepadanya. Sepakati anggaran lewat jajak pendapat, biarkan pembeli membayar hadiahnya dengan kartunya, lalu masukkan sebagai satu pengeluaran dengan [jumlah pasti](page:feature/split-expenses), satu angka untuk tiap orang. Side Badger menampilkan siapa berutang berapa kepada pembeli, dan semua orang mengirim bagiannya dengan cara apa pun yang disuka."
cta:
  heading: "Edarkan kotak urunan tanpa kotaknya"
  body: "Buat grup, jangan masukkan orang yang akan menerima hadiah, dan masukkan hadiahnya dengan jumlah pasti. Side Badger gratis, tanpa iklan, dan tanpa batas harian. Ingin melihat-lihat dulu? Lihat [cara kerjanya](page:how-it-works) atau [apa saja yang gratis](page:pricing)."
sections:
  - heading: "Empat teman, satu pemutar piringan hitam, empat jumlah berbeda"
    body: "Bea akan berulang tahun ke-30 dan menginginkan pemutar piringan hitam. Priya, Omar, Lena, dan Sam yang membelikannya. Priya menemukan satu seharga £240 dan membelinya dengan kartunya sendiri, karena harus ada yang maju lebih dulu. Keempatnya tidak urunan sama besar. Priya dan Omar masing-masing menyumbang £60, Lena £80, dan Sam £40. Tak ada yang menjelaskan angkanya dan tak ada yang bertanya. Omar juga membeli kartu ucapan dan kertas kado seharga £12. Keempatnya menandatangani kartu itu, jadi yang itu dibagi rata."
  - heading: "Sepakati anggaran sebelum ada yang mengeklik Beli"
    body: "Jajak pendapat anggaran mencegah pertengkaran soal pemutar piringan hitam £400. Di grup, pilih **Tambah Jajak Pendapat** dan tanyakan berapa harga hadiahnya. Jadikan pilihannya berupa jumlah, seperti maksimal £150, maksimal £200, dan maksimal £250. Aktifkan **Pemungutan suara anonim**, yang menyembunyikan siapa memilih apa, supaya tak ada yang harus membela angka yang lebih kecil di depan umum. Pengaturan tidak bisa diubah setelah suara pertama masuk, jadi periksa dulu. Jajak pendapat tidak menutup sendiri. Setelah semua orang memberikan suara, pilih **Tutup jajak pendapat** dan **Pemenang** akan tampil. Jajak pendapat menyepakati totalnya. Ia tidak menentukan bagian siapa pun."
  - heading: "Membaca hitungannya"
    body: "Hadiahnya dibagi £60, £60, £80, dan £40, yang berjumlah £240 sesuai struk. Kartu dan kertas kado dibagi empat, masing-masing £3. Bagian Priya adalah £60 + £3, jadi £63, dan ia membayar £240, sehingga ia dihutangi £177. Bagian Omar juga £63, tetapi ia membayar £12, jadi ia berutang £51. Lena berutang £80 + £3, yaitu £83, dan Sam berutang £40 + £3, yaitu £43. Ketiganya berjumlah £177 milik Priya. Jika dibiarkan, utang akan berputar ke lima arah di dalam grup. Side Badger menyarankan tiga pembayaran sebagai gantinya, semuanya kepada Priya. [Pelunasan](page:feature/settle-up) punya rinciannya."
  - heading: "Masukkan ke Side Badger"
    body: "Bagian Priya memakan waktu sekitar lima menit."
    items:
      - "**Buat grupnya.** Di dasbor pilih **Buat Grup**. Pilih **Undang Orang Lain** dan kirim tautan atau kode QR-nya kepada orang-orang yang urunan, dan tak seorang pun selain mereka."
      - "**Tambahkan hadiahnya.** Pilih **Tambah Pengeluaran**, beri deskripsi, masukkan 240, dan di bawah **Siapa yang membayar?** pilih Priya. Biarkan keempatnya tetap terpilih di **Dibagi antara**, lalu di bawah **Cara membagi** pilih **Jumlah pasti** dan ketik 60, 60, 80, dan 40. Totalnya harus 240. Lampirkan konfirmasi pesanan jika mau. Pilih **Simpan Pengeluaran**."
      - "**Tambahkan kartunya.** Omar sendiri menambahkan £12 itu, memilih dirinya di bawah **Siapa yang membayar?**, dan membiarkan **Cara membagi** pada **Rata**, dengan keempat orang dicentang."
      - "**Hitung, lalu bayar.** Semua orang memeriksa **Saldo**, yang menunjukkan siapa berutang kepada siapa, dan mengirim bagiannya kepada Priya dengan cara apa pun yang disuka. Lalu catat lewat **Lunasi** dan **Catat Penyelesaian**. Penyelesaian cepat mengisi jumlahnya."
  - heading: "Beli dulu, atau kumpulkan dulu"
    body: "Side Badger tidak memegang uang kasnya, jadi \"mengumpulkan\" sebenarnya berarti menghitung. Dua urutan bisa dipakai."
    items:
      - "**Beli dulu.** Pembeli membayar, menambahkan pengeluaran dengan harga sebenarnya, dan semua orang langsung melihat bagiannya. Lebih rapi, tetapi pembeli menanggung biayanya sampai orang-orang membayar, jadi pilih pembeli yang sanggup."
      - "**Kumpulkan dulu.** Orang-orang mengirim jumlah mereka kepada pembeli sebelum pembelian. Setelah harganya diketahui, masukkan hadiahnya, lalu catat tiap pembayaran dengan tanggal uang itu benar-benar berpindah. Tambahkan hadiahnya lebih dulu, supaya setiap pembayaran punya saldo untuk dituju."
      - "**Harganya bergeser.** Ongkos kirim, kode diskon, kenaikan harga di menit terakhir. Ubah hadiahnya dan sesuaikan jumlah pasti agar totalnya tetap cocok. Versi sebelumnya tetap tersimpan, tetapi beri tahu grup lebih dulu, karena saldo mereka berubah."
  - heading: "Jauhkan Bea dari urusan ini"
    body: "Hanya anggota grup yang bisa melihatnya, jadi Bea tidak bisa melihat grup yang tidak ia ikuti. Undang orang-orang yang urunan dan tak seorang pun selain mereka. Tautan berlaku sampai kedaluwarsa, dan Anda bisa memilih mulai dari 15 menit sampai 5 hari, jadi pilih yang singkat dan kirim di tempat yang tak dilihat Bea. Tautan menampilkan pratinjau grup kepada siapa pun yang membukanya, jadi beri grup nama yang membosankan, seperti Kas hari Sabtu, dan jauhkan juga nama Bea dari label pengeluaran dan pilihan jajak pendapat."
  - heading: "Yang tidak dilakukan Side Badger di sini"
    items:
      - "Side Badger tidak memegang atau mengumpulkan uangnya. Urunan sampai ke pembeli lewat transfer bank, tunai, atau apa pun yang Anda pakai, lalu seseorang mencatatnya."
      - "Side Badger tidak mengirim pengingat pembayaran. Menyenggol siapa yang belum membayar tetap pekerjaan manusia."
      - "Side Badger tidak menghitung bagian siapa pun. Jajak pendapat menyepakati anggaran dan tidak ada opsi \"bagi sisanya\", jadi Anda mengetik tiap jumlah sendiri."
      - "Setiap pengeluaran punya satu pembayar. Jika dua orang membeli bagian hadiah yang berbeda, masukkan dua pengeluaran."
      - "Semua orang dalam pembagian memerlukan akun gratis dan tempat di grup."
