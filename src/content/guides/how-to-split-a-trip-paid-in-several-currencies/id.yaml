faq:
  heading: "Pertanyaan"
  items:
    - q: "Kurs apa yang dipakai Side Badger?"
      a: "Kurs terkini, diambil saat Anda memasukkan pengeluaran jika tersedia. Anda bisa mengubahnya ke kurs yang benar-benar Anda dapatkan."
    - q: "Bisakah grup membatasi diri pada pound dan yen?"
      a: "Bisa. Di **Pengaturan** grup, aktifkan **Batasi mata uang untuk grup ini** di bawah **Pengaturan Mata Uang**, pilih **Mata uang yang diizinkan**, dan atur **Mata uang default untuk pengeluaran baru**. Pilihan di daftar lebih sedikit, salah tebak di kasir pun lebih sedikit."
    - q: "Apakah kami harus mengonversi?"
      a: "Tidak. Mata uang tetap terpisah kecuali Anda atau grup memilih untuk mengonversi, dan setiap mata uang mendapat daftar pembayaran singkatnya sendiri."
