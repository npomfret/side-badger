faq:
  heading: Mga tanong
  items:
    - q: Anong exchange rate ang ginagamit ng Side Badger?
      a: Kasalukuyang exchange rate, na kinukuha kapag inilagay mo ang gastos kung may available. Mababago mo ito sa rate na aktuwal mong nakuha.
    - q: Puwede bang pounds at yen lang ang gamitin ng grupo?
      a: Oo. Sa **Mga Setting** ng grupo, i-on ang **Limitahan ang mga currency para sa grupong ito** sa ilalim ng **Mga Setting ng Currency**, piliin ang **Mga pinahihintulutang currency**, at itakda ang **Default na currency para sa mga bagong gastusin**. Mas kaunting opsyon sa listahan, mas kaunting maling hula sa kahera.
    - q: Kailangan ba talagang mag-convert?
      a: Hindi. Nananatiling magkahiwalay ang mga pera maliban kung ikaw o ang grupo ninyo ang pumiling mag-convert, at may sariling maikling listahan ng mga bayad ang bawat pera.
