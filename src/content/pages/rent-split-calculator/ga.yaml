faq:
  heading: "Ceisteanna"
  items:
    - q: "Cé acu is cothroime, méid an tseomra nó ioncam?"
      a: "Níl ceachtar acu cothrom i gcónaí. Oireann méid an tseomra do chomhchónaitheoirí a íocann as an spás ina gcodlaíonn siad. Oireann ioncam do lánúineacha agus do chairde ar phá an-difriúil. Aontaigh é roimh an gcéad lá cíosa, ní ina dhiaidh."
    - q: "Ar cheart na billí a roinnt ar an mbealach céanna?"
      a: "I gcás comhchónaitheoirí, de ghnáth níor cheart. Úsáideann gach duine an fuinneamh agus an t-idirlíon, mar sin is simplí go cothrom, mar atá sa sampla. De réir ioncaim, tugann an t-áireamhán na sciair chéanna do na billí agus a thugann sé don chíos."
    - q: "An féidir liom troithe cearnacha a úsáid?"
      a: "Is féidir. Roghnaigh ft² agus clóscríobh d'achair i dtroithe cearnacha. Níl san aonad ach lipéad, agus tagann na sciair amach mar an gcéanna ar choinníoll go n-úsáideann gach duine an t-aonad céanna."
    - q: "An bhfuil an t-áireamhán saor in aisce?"
      a: "Tá. Saor in aisce. Gan fógraí. Gan teorainneacha laethúla. Níl cuntas de dhíth ort ach an oiread."
