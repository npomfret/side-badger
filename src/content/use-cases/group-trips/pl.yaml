featuresHeading: "Na czym opiera się wyjazd"
faq:
  heading: "Pytania"
  items:
    - q: "Czy można pominąć osoby, które opuściły kolację?"
      a: "Tak. Wybierz, kto uczestniczył w każdym wydatku, a tylko te osoby zostaną nim obciążone."
    - q: "Czy działa bez zasięgu?"
      a: "Nie. Side Badger potrzebuje połączenia, więc dodaj koszty, gdy wrócisz do wifi."
    - q: "Czy każdy musi coś instalować?"
      a: "Nie. Działa w przeglądarce. Wyślij link z zaproszeniem, a ludzie dołączą z telefonów."
    - q: "Jakiego kursu wymiany używa?"
      a: "Aktualnego kursu wymiany przy wpisywaniu wydatku albo własnego, jeśli obowiązywał inny. Kurs jest ustalany w chwili zapisu wydatku, więc stare wydatki nigdy nie są przeszacowywane."
    - q: "Czy możemy zamrozić grupę po wyjeździe?"
      a: "Tak. Administrator może zablokować grupę, żeby liczby zostały na miejscu."
    - q: "Czy jest limit kwot?"
      a: "Tak. 999 999,99 na wydatek, w jego własnej walucie."
