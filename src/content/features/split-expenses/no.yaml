sections:
  - heading: Bare de som var der
    body: Del en kostnad mellom alle, eller bare mellom dem som delte den. La folk stå utenfor kostnader de ikke var med på, så gjenspeiler saldoene det. Romkameraten som var borte hele uken, skylder ikke for takeawayen, noe [romkamerater](page:use-case/housemates) vil kjenne igjen som grunnleggende rettferdighet.
  - heading: Detaljene som sparer deg for krangler senere
    items:
      - Sett **dato** og eventuelt et klokkeslett. Snarveier som i dag, i går, i morges og i går kveld sparer deg for litt tasting.
      - Legg til opptil tre **etiketter** for å gruppere utgifter, som dagligvarer eller reise.
      - Legg til **stedet**. Lim inn en kartlenke, så fyller stedsnavnet seg selv ut.
      - Legg til et **notat** for historien bak tallet, med litt formatering hvis historien trenger det.
      - Bruk **kommentarene** til å ha samtalen ved siden av utgiften den handler om, i stedet for i en chattråd ingen blar tilbake i.
  - heading: Kopier, rediger og se hva som endret seg
    body: Kopier forrige måneds husleie i stedet for å skrive den inn på nytt, og endre det som er annerledes. Hvis et tall var feil, redigerer du utgiften. Den tidligere versjonen blir bevart og redigeringen vises i gruppens aktivitet, så ingen endrer et tall i det stille. Hva hver enkelt får lov til å redigere, avhenger av gruppens tillatelser.
  - heading: Når noe ser feil ut
    body: En gruppe kan slå på utgiftsspørsmål. Alle som er med i en utgift kan stille et spørsmål og si hvorfor, og utgiften holdes utenfor saldoene til den som spurte, eller en administrator, lukker det. Det er av som standard, og en administrator slår det på for gruppen. Det passer for [arrangementer og feiringer](page:use-case/events-and-celebrations), der depositumet ingen husker plutselig angår alle.
limits:
  heading: Grenser
  items:
    - Én person betaler for hver utgift. Hvis to personer betalte, registrerer du to utgifter.
    - Det finnes ingen deling per vare og ingen deling etter andeler. Likt, nøyaktige beløp og prosent er det som finnes.
    - Prosentene må summere seg til 100.
    - En utgift kan være opptil 999,999.99 i sin egen valuta, med den valutaens vanlige antall desimaler.
    - Utgifter kan ikke gjentas av seg selv. Kopier forrige måneds i stedet.
    - Datoer kan ikke ligge i fremtiden eller mer enn 10 år tilbake.
    - En utgift som involverer noen som har forlatt gruppen, blir skrivebeskyttet.
useCasesHeading: Hvor denne typen deling hjelper
faq:
  heading: Spørsmål
  items:
    - q: Kan to personer betale for én utgift?
      a: Ikke i én utgift. Registrer to, én for hver betaler, så blir saldoene de samme.
    - q: Kan jeg dele en kvittering per vare?
      a: Nei. En deling er lik, etter nøyaktige beløp eller etter prosent. For en regning med ulike varer legger du inn hva hver person skylder som nøyaktige beløp.
    - q: Kan jeg sette en standarddeling?
      a: Nei. Kopier en tidligere utgift for å bruke delingen på nytt, og endre det som er annerledes.
    - q: Kan regninger gjentas hver måned?
      a: Nei. Kopier forrige måneds utgift i stedet, det tar noen sekunder.
    - q: Hvem kan redigere en utgift?
      a: De gruppens tillatelser gir lov. Hver redigering vises i gruppens aktivitet, så endringer skjer aldri i det stille.
    - q: Hva skjer med saldoene etterpå?
      a: De oppdateres etter hvert som utgifter kommer inn, og [gjøre opp](page:feature/settle-up) gjør dem om til en kort liste over betalinger. Hvis en utgift er i en annen valuta, se [flere valutaer](page:feature/multiple-currencies).
