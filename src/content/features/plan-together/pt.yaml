meta:
  title: "Listas, sondagens e comentários para o grupo | Side Badger"
  description: "Comenta despesas, questiona a esquisita, partilha a lista de compras e vota na villa. Planeia os gastos em conjunto e depois divide. Grátis, sem anúncios."
h1: "Planeia em conjunto, divide depois"
navLabel: "Planear em conjunto"
lead: "A lista de compras e a conta das compras, finalmente a falarem-se. O Side Badger dá ao teu grupo um sítio para falar do dinheiro antes e depois de ele ser gasto, com comentários em cada despesa, uma forma de questionar as que parecem erradas e listas e sondagens partilhadas para as grandes decisões. Depois [divides as despesas](page:feature/split-expenses) como de costume."
cta:
  heading: "Planeia e depois divide"
  body: "Cria uma conta grátis, começa um grupo e põe a primeira lista, sondagem ou pergunta mesmo ao lado do dinheiro. Não sabes o que acontece a seguir? Vê [como funciona](page:how-it-works)."
problem:
  heading: "A conversa está para aqui, a conta está para ali"
  body: "As despesas de grupo costumam viver em dois sítios. Os números estão num, e a discussão sobre os números está numa conversa que desapareceu na terça-feira. A lista de compras é a fotografia de um frigorífico. A villa foi decidida com o polegar para cima da maioria, provavelmente. O Side Badger mantém o planeamento no grupo, ao lado das despesas de que fala, por isso há um comentário onde está o custo, uma lista onde está a compra, uma sondagem para a grande decisão e uma forma de dizer “espera, isto está certo?” sem escrever um parágrafo. Tudo gira à volta do dinheiro do grupo, que é para isso que o grupo serve."
workflow:
  heading: "Da votação da villa à conta das compras"
  steps:
    - title: "Põe a grande decisão a votos"
      body: "Adiciona uma sondagem para a decisão que define a conta, como a escolha da villa. Escolhe de duas a dez opções, diz quantos votos cada pessoa tem e depois fecha-a quando todos tiverem votado, e o vencedor fica marcado."
      shot: S17
      shotAlt: "Uma sondagem fechada com a opção vencedora marcada e o número de votos ao lado de cada opção"
    - title: "Escreve a lista de compras em grupo"
      body: "Começa uma lista partilhada, adiciona os itens e vai riscando-os à medida que chegam ao carrinho. A compra entra depois como despesa."
      shot: S16
      shotAlt: "Uma lista de compras partilhada com alguns itens riscados e uma contagem do progresso"
    - title: "Fala do custo onde ele vive"
      body: "Comenta a própria despesa, anexa o recibo e reage com um emoji. A conversa fica ao lado do número de que fala."
      shot: S08
      shotAlt: "Uma despesa com os seus detalhes, a miniatura de um recibo, uma conversa de comentários e reações com emojis"
    - title: "Questiona a que parece estranha"
      body: "Se o grupo tiver ativado as perguntas sobre despesas, qualquer pessoa incluída numa despesa pode escolher **Tenho uma pergunta**. A despesa fica de fora dos saldos até a pergunta ser resolvida."
      shot: S18
      shotAlt: "A lista de despesas com um selo de Questionado e o filtro Apenas questionado"
    - title: "Vê o que mudou e quem mudou"
      body: "O histórico de atividade e o sino de notificações mostram o que há de novo nos teus grupos. As notificações push estão lá, se as quiseres."
      shot: S19
      shotAlt: "O menu de notificações com uma lista de atividade recente"
