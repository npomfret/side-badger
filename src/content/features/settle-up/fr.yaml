meta:
  title: "Réglez vos comptes en moins de paiements | Side Badger"
  description: "Voyez qui doit quoi à qui dans votre groupe, obtenez une courte liste de paiements qui règle les comptes de tout le monde, et enregistrez chaque paiement au fur et à mesure. Gratuit."
h1: "Réglez vos comptes en moins de paiements"
navLabel: "Régler les comptes"
lead: "Side Badger tient un solde à jour pour chaque membre du groupe et suggère une courte liste de paiements qui le règle. Vous vous remboursez comme vous voulez, puis vous l'enregistrez. Si vous voulez d'abord voir comment les montants se partagent, commencez par [partager les dépenses](page:feature/split-expenses)."
cta:
  heading: "Prêt à démêler qui doit quoi à qui ?"
  body: "Créez un compte, lancez un groupe et ajoutez la première dépense. Les soldes feront le reste."
  button: "Créer un compte gratuit"
problem:
  heading: "Des soldes qui se mettent à jour au fil de l'eau"
  body: "Chaque dépense change qui doit quoi à qui, donc Side Badger garde les soldes à jour à mesure que dépenses et paiements s'ajoutent. Tout le groupe voit un changement tout de suite, avec ce qui a changé et qui l'a modifié. Les soldes sont tenus par devise, donc euros et livres restent dans leurs propres colonnes, sauf si une dépense a été convertie à la saisie. Par défaut, vous voyez les dettes qui vous concernent ; **Tout afficher** liste tout le groupe."
workflow:
  heading: "Trois étapes pour être quittes"
  steps:
    - title: "Voyez qui doit quoi à qui"
      body: "Ouvrez les soldes du groupe pour voir ce que vous devez, ce qu'on vous doit, et une courte liste de paiements qui règle les comptes de tout le monde, calculée par devise. Les dépenses contestées restent hors des calculs tant qu'elles ne sont pas réglées. Dans l'exemple des colocataires ci-dessous, six paiements deviennent deux."
      shot: S10
      shotAlt: "L'écran des soldes affichant des dettes simplifiées dans deux devises, avec « Tout afficher » activé"
    - title: "Payez comme vous voulez, puis enregistrez"
      body: "Virement bancaire, espèces, un service rendu depuis les dernières vacances. Side Badger ne fait pas circuler l'argent. Une fois qu'il a changé de mains, enregistrez le paiement et le solde se met à jour pour tout le monde."
      shot: S11
      shotAlt: "Le formulaire de paiement avec les boutons de règlement rapide et l'avis affiché pour un paiement partiel"
    - title: "Vérifiez que c'est bien passé"
      body: "Le paiement entre dans l'historique du groupe, où tous les membres peuvent le voir et réagir avec un emoji. Célébrez un paiement quand il arrive."
      shot: S12
      shotAlt: "L'historique des paiements avec des réactions emoji sur un paiement"
