meta:
  title: "여러 통화로 낸 여행 비용을 나누는 방법 | 사이드 배저"
  description: "호텔은 파운드, 라멘은 엔. 통화마다 따로 정산하거나, 눈에 보이는 환율로 환산해 보세요. 두 방법 모두 계산 과정과 함께 풀어 봤어요."
h1: "여러 통화로 낸 여행 비용을 나누는 방법"
navLabel: "여러 통화로 간 여행"
lead: "지출은 결제한 통화 그대로 입력한 다음, 방법을 고르세요. 통화를 따로 두고 통화마다 그 통화로 정산하거나, 현재 환율로 환산해서 한 번에 정산할 수 있습니다. 같은 일본 여행이 첫 번째 방법에서는 결제 4건, 두 번째 방법에서는 결제 2건이 됩니다."
cta:
  heading: "결제한 돈 그대로 입력하세요"
  body: "무료 계정을 만들고, 여행 그룹을 시작하고, 영수증에 적힌 통화로 지출을 하나씩 추가하세요. 자세한 내용부터 보고 싶다면 [여러 통화](page:feature/multiple-currencies) 또는 [무료로 쓸 수 있는 범위](page:pricing)를 확인하세요."
sections:
  - heading: "친구 셋, 호텔 하나, 엄청난 양의 엔"
    body: "Zoe, Kenji, Lucy는 [그룹 여행](page:use-case/group-trips)으로 일본에서 일주일을 보내고, 모든 비용을 세 명이 똑같이 나눕니다. Zoe는 집에서 파운드로 호텔을 £600에 예약했습니다. Lucy는 도쿄에서 철도 패스를 ¥90,000에 샀고요. Kenji는 라멘의 밤 ¥9,000을 냈고, 그 뒤로 매일 그 얘기를 합니다. 역 승강장에서 영수증 세 장을 환산하고 싶은 사람은 없습니다. 여기서 계산할 때는 ¥1을 £0.005로 보는데, 이 가이드를 위해 지어낸 딱 떨어지는 환율이에요. 앱에서는 현재 환율을 쓰거나, 실제로 적용받은 환율을 직접 입력하면 됩니다."
  - heading: "영수증에 적힌 돈으로 하나씩 입력하세요"
    body: "어느 방법을 고르든 이 부분은 똑같아요. 아직 환산할 것은 없습니다."
    items:
      - "**그룹 만들기.** 대시보드에서 **그룹 만들기**를 선택하고 여행 이름을 붙인 다음, **다른 사람 초대**를 선택해 링크나 QR 코드를 보내세요."
      - "**호텔 추가하기.** **비용 추가**를 선택하고 600을 입력하되, 금액 옆의 통화는 파운드로 두세요. **누가 지불했나요?**에서 Zoe를 고르세요. **분할 대상**에는 세 사람 모두를 두고, **분할 방법**은 **균등**으로 둔 채 **비용 저장**을 선택합니다."
      - "**엔 추가하기.** 철도 패스(Lucy가 결제)와 라멘(Kenji가 결제)도 똑같이 하되, 통화는 엔으로 하세요. 엔에는 소수 단위가 없어서 양식도 소수점을 묻지 않습니다."
  - heading: "방법 1: 통화를 따로 두기"
    body: "사이드 배저는 통화마다 잔액을 따로 관리하며, 한 통화를 다른 통화와 상쇄하지 않습니다. 파운드로는 호텔이 1인당 £200이므로 Kenji와 Lucy가 각각 Zoe에게 £200를 빚집니다. 엔으로는 철도 패스와 라멘이 합해서 ¥99,000이고, 1인당 ¥33,000입니다. Lucy는 ¥90,000을 결제했으니 ¥57,000을 받을 돈이 있습니다. Zoe는 엔을 결제하지 않았으므로 ¥33,000을 줘야 합니다. Kenji는 ¥9,000을 결제했으니 ¥24,000을 줘야 합니다."
    items:
      - "**파운드.** Kenji가 Zoe에게 £200를, Lucy가 Zoe에게 £200를 보냅니다."
      - "**엔.** Zoe가 Lucy에게 ¥33,000을, Kenji가 Lucy에게 ¥24,000을 보냅니다."
      - "**모두 결제 4건.** Zoe와 Lucy는 서로 두 가지 통화로 빚을 지고 있어서 상쇄되지 않습니다. 환율이 끼어들지 않으니 다툴 일도 없어요."
      - "**엔을 줘야 하는데 파운드로 지불하기.** 엔이 없는 사람도 파운드로 지불할 수 있습니다. 결제를 기록할 때 **다른 통화인가요?**를 열고, **변환**에서 파운드를 고른 다음 환율을 확인하세요. 이 가이드의 환율로 Zoe의 ¥33,000은 £165이며, 엔 잔액은 그대로 맞게 정리됩니다."
      - "**결제마다 기록하기.** 원하는 방법으로 서로 지불한 다음 **정산하기**를 선택하고 **정산 기록**을 사용하세요. [정산하기](page:feature/settle-up)에 더 자세한 설명이 있어요."
  - heading: "방법 2: 입력하면서 환산하기"
    body: "그룹이 사람마다 숫자 하나로 보고 싶다면, 지출을 입력할 때 환산하세요."
    items:
      - "**양식에서 환산하기.** **비용 추가**에서 **변환**을 선택하고 파운드를 고르세요. 사이드 배저가 환율과 환산된 금액을 ≈ 표시와 함께 보여 줍니다. 다른 환율을 적용받았다면 환율을 수정하세요. 원래 엔 금액은 지출에 그대로 남습니다."
      - "**파운드로 읽기.** ¥1 = £0.005이면 철도 패스는 £450, 라멘은 £45가 됩니다. £600 호텔까지 합하면 £600 + £450 + £45 = £1,095이고, 1인당 £365입니다. Zoe는 £600를 결제했으니 £235를 받을 돈이 있습니다. Lucy는 £450를 결제해서 £85를 받을 돈이 있고요. Kenji는 £45를 결제했으므로 £320를 줘야 합니다."
      - "**결제 2건.** 둘 다 Kenji가 보냅니다. Zoe에게 £235, Lucy에게 £85입니다. Zoe와 Lucy는 이제 서로에게 아예 지불하지 않아요."
      - "**아니면 그룹 통화 정하기.** 이 단계를 건너뛰려면 그룹의 **설정**을 열고 **통화 설정**에서 **자동으로 지출 변환**을 선택하세요. 그러면 새 지출은 모두 그 통화로 환산되고, 환율은 여전히 눈에 보이고 바꿀 수 있습니다."
  - heading: "어느 방법이 좋을까요?"
    items:
      - "**따로 두기**는 사람들 지갑에 아직 엔이 남아 있을 때, 또는 환율 문제로 다투고 싶지 않을 때 알맞습니다. 대신 결제가 늘고, 두 가지 이상의 통화로 지불해야 해요."
      - "**환산하기**는 그룹이 한 가지 통화로 생활하고 있어서 사람마다 숫자 하나와 더 짧은 목록을 원할 때 알맞습니다. Kenji의 이체 2건처럼요. 대신 그룹이 환율을 믿어야 하고, 환율은 지출을 저장할 때 지출마다 고정됩니다."
      - "**일찍 정하세요.** 그룹 통화는 새 지출과 복사한 지출만 환산합니다. 이미 입력한 지출을 되돌아가 정리해 주지는 않아요."
  - heading: "환율과 한도"
    items:
      - "**환율은 저장할 때 고정됩니다.** 이전 지출은 절대 재평가되지 않으므로, 시장이 움직였다고 잔액이 흔들리지 않습니다. 다른 날 입력한 지출은 서로 다른 환율을 가질 수 있어서, 그룹이 여행 전체에 환율 하나를 쓰고 싶다면 환율을 정해 두고 지출마다 직접 입력하세요."
      - "**환율이 없나요? 직접 입력하세요.** 사이드 배저는 가능한 경우 현재 환율을 가져오지만, 모든 통화 쌍에 환율이 있다고 보장하지는 않습니다. 환율이 없거나 환전소에서 더 좋은 환율을 받았다면 직접 입력하세요."
      - "**지출 한 건당 해당 통화로 999,999.99.** 어떤 통화든 한도는 하나입니다. 엔으로는 ¥1,000,000 바로 아래이고, 이 가이드의 환율로 약 £5,000입니다. 인도네시아 루피아처럼 숫자가 큰 통화에서는 청구서 한 장이 더 빨리 한도에 닿을 수 있어요. 청구서를 지출 두 건으로 나누거나, 다른 통화로 입력해서 환산하세요."
  - heading: "사이드 배저가 하지 않는 일"
    items:
      - "돈을 옮기거나 환전하지 않습니다. 원하는 방법으로 서로 지불한 다음 결제를 기록하세요."
      - "통화는 140개입니다. 암호화폐와 금속은 포함되지 않습니다."
exampleAfter: 2
example:
  heading: "일본 여행, 두 가지 방식으로 정산"
  currency: GBP
  people:
