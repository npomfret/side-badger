featuresHeading: "Bir gezinin dayandığı şeyler"
faq:
  heading: "Sorular"
  items:
    - q: "Akşam yemeğini kaçıranlar dışarıda bırakılabilir mi?"
      a: "Evet. Her harcamaya kimin katıldığını seçin, yalnızca onlardan ücret alınır."
    - q: "Sinyal olmadan çalışır mı?"
      a: "Hayır. Side Badger bağlantı gerektirir, bu yüzden masrafları wifi'ye döndüğünüzde ekleyin."
    - q: "Herkesin bir şey yüklemesi gerekir mi?"
      a: "Hayır. Tarayıcıda çalışır. Davet bağlantısını gönderin, insanlar telefonlarından katılır."
    - q: "Hangi döviz kurunu kullanır?"
      a: "Harcamayı girerken güncel bir döviz kuru ya da farklı bir kur aldıysanız sizin kurunuz. Kur, harcama kaydedildiğinde sabitlenir; yani eski harcamalar asla yeniden değerlenmez."
    - q: "Gezi sonrasında grubu dondurabilir miyiz?"
      a: "Evet. Bir yönetici rakamlar yerinde kalsın diye grubu kilitleyebilir."
    - q: "Tutarlarda bir sınır var mı?"
      a: "Evet. Harcama başına, kendi para biriminde 999.999,99."
