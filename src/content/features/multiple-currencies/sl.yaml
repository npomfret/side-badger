meta:
  title: "Deli stroške v 140 valutah, pretvorjene ali ločeno"
  description: "Vsak strošek vnesi v valuti, v kateri si plačal, stanja vodi ločeno ali pretvarjaj po tečaju, ki ga vidiš in lahko spremeniš, nato se poravnaj s kratkim seznamom plačil."
h1: "Deli stroške v 140 valutah"
navLabel: "Več valut"
lead: "Evri, jeni in tisti en taksi v bahtih. Side Badger sprejme vsak strošek v valuti, v kateri je bil plačan, ohranja stanja urejena in lahko pretvarja, ko se skupina raje poravna enkrat. Deluje v 140 valutah in se naravno prilega [skupinskim potovanjem](page:use-case/group-trips)."
cta:
  heading: "Prinesi svoje evre, prinesi svoje jene"
  body: "Ustvari uporabniški račun, ustanovi skupino in dodaj prvi strošek v kateri koli valuti, ki jo imaš pri roki."
  button: "Ustvari brezplačen račun"
problem:
  heading: "Vnesi, kot je bilo plačano"
  body: "Potovanje redko plačaš v eni valuti. Hotel je bil rezerviran doma v funtih, večerja plačana v jenih, kava na letališču pa v kakršni koli valuti, ki jo je uporabljal vmesni pristanek. Vse ročno pretvarjati, preden sploh vneseš, je način, kako se preglednice opustijo. V Side Badger vsak strošek vneseš v valuti z računa in vsak znesek sledi pravilom svoje valute, zato jeni nimajo decimalk, dinarji pa imajo tri. Nedavno uporabljene valute so na seznamu prve."
workflow:
  heading: "Valute vodi ločeno ali pretvarjaj sproti"
  steps:
    - title: "Dodaj strošek v njegovi valuti"
      body: "Izberi valuto, vpiši znesek, povej, kdo je plačal in kdo je strošek delil. Nič drugega ni potrebno. To je privzeto in ohrani izvirni znesek natanko tako, kot si ga vnesel."
      shot: S07
      shotAlt: "Obrazec za strošek z vnesenim zneskom v jenih"
    - title: "Spremljaj stanje za vsako valuto"
      body: "Stanja se vodijo ločeno za vsako valuto, vsako pa ima svoj kratek seznam predlaganih plačil. Funti se poravnajo v funtih, jeni v jenih."
      shot: S10
      shotAlt: "Zaslon stanj s poenostavljenimi dolgovi v dveh valutah"
    - title: "Ali pretvori, ko se skupina raje poravna enkrat"
      body: "Ob vnosu stroška izberi drugo valuto in Side Badger ga lahko pretvori po trenutnem menjalnem tečaju, ki ga lahko spremeniš v tistega, ki je veljal ob menjavi. Pretvorjeni znesek se pridruži stanju v tej valuti. Pretvorba je izbira skupine, nikoli nekaj, kar se zgodi za tvojim hrbtom."
options:
  heading: "Tečaj, ki ga vidiš in lahko spremeniš"
  items:
    - title: "Tečaj je viden"
      body: "Ko pretvarjaš, se tečaj in pretvorjeni znesek pokažeta v obrazcu, zato nihče ne rabi številki verjeti na besedo."
    - title: "Vnesi svojega"
      body: "Si dobil boljši tečaj v menjalnici ali slabšega na letališču? Uredi tečaj v tistega, ki je veljal, in pretvorjeni znesek se posodobi."
    - title: "Izvirnik ostane"
      body: "Izvirni znesek ostane pri strošku, ob pretvorjenem, za vsakogar, ki vpraša, koliko je bilo v jenih."
    - title: "Pretvorba je brezplačna"
      body: "Pretvorba ne stane nič. Za vnos stroška v drugi valuti ni pristojbine."
