sections:
  - heading: "Splitwise क्या अच्छा करता है"
    body: "अगर आपके ग्रुप को नेटिव ऐप, ऑफलाइन इस्तेमाल या ऐप के अंदर पेमेंट चाहिए, तो Splitwise समझदारी भरा चुनाव है, और हम चाहेंगे कि आप उसे चुनें, बजाय इसके कि बाद में पता चले। उसके अपने पेज यह बताते हैं:"
    items:
      - "**ऐप और ऑफलाइन इस्तेमाल।** वेब के साथ iPhone और Android ऐप, और एक ऑफलाइन मोड।"
      - "**बांटने के और तरीके।** बराबर, सटीक राशि और प्रतिशत के ऊपर शेयर, एडजस्टमेंट और आइटम-वार बंटवारा।"
      - "**दोहराए जाने वाले खर्च।** किराए को दोहराने के लिए सेट करें और उसे भूल जाएं।"
      - "**ऐप के अंदर पेमेंट।** कुछ देशों में यह Splitwise Pay, Venmo, PayPal या Pay by Bank के ज़रिए पैसे भी भेज सकता है।"
  - heading: "यहां मुफ्त, वहां पैसे देकर"
    body: "Splitwise Pro, Splitwise का पेड प्लान है, और उसका अपना Pro पेज चार ऐसी चीज़ें बेचता है जिनकी Side Badger में कोई कीमत नहीं।"
    items:
      - "**रसीद स्कैन।** Splitwise Pro आपकी रसीद की फोटो स्कैन करता है। Side Badger यह मुफ्त करता है, बिना स्कैन क्रेडिट के: वह कुल राशि, तारीख और जगह भर देता है, जिसे आप जांच सकें। रसीद की इमेज Google की AI सेवा पढ़ती है।"
      - "**करेंसी कन्वर्ज़न।** Splitwise Pro, Convert दबाने पर ग्रुप के खर्चों को आपकी डिफ़ॉल्ट करेंसी में बदल देता है। Side Badger हर खर्च को दर्ज करते समय बदलता है, मौजूदा एक्सचेंज रेट पर या उस रेट पर जो आपको असल में मिला, और खर्च पर मूल राशि बनी रहती है।"
      - "**कोई विज्ञापन नहीं।** Splitwise पूरी तरह विज्ञापन-मुक्त अनुभव को Pro फीचर के रूप में गिनाता है। Side Badger में कोई विज्ञापन नहीं हैं।"
      - "**रोज़ाना की कोई सीमा नहीं।** Splitwise Pro असीमित खर्च बेचता है, और उसका हेल्प सेंटर कहता है कि मुफ्त यूज़र हर दिन 4 खर्च तक जोड़ सकते हैं। Side Badger में रोज़ाना की कोई सीमा नहीं है।"
  - heading: "Splitwise में क्या है जो Side Badger में नहीं"
    body: "यह Splitwise का हर फीचर नहीं है, सिर्फ वे जो आमतौर पर फैसला तय करते हैं। पूरी सूची Splitwise के अपने पेजों पर है। यहां वह जगह है जहां Side Badger कम पड़ता है।"
    items:
      - "**नेटिव ऐप।** Side Badger आपके ब्राउज़र में चलता है। साइन इन करें, फिर इसे अपनी होम स्क्रीन में जोड़ें और यह ऐप की तरह खुलता है।"
      - "**ऑफलाइन मोड।** Side Badger को कनेक्शन चाहिए।"
      - "**ऐप के अंदर पेमेंट।** Side Badger आपके पैसों को कभी हाथ नहीं लगाता। एक-दूसरे को जैसे चाहें पेमेंट करें, फिर पेमेंट रिकॉर्ड करें।"
      - "**दोहराए जाने वाले खर्च।** Side Badger में ये नहीं हैं। किराया दोबारा टाइप करने के बजाय पिछले महीने का कॉपी करें।"
      - "**शेयर या आइटम के हिसाब से बांटना।** Side Badger में हर खर्च का एक ही पेमेंट करने वाला होता है, जिसे बराबर, सटीक राशि या प्रतिशत से बांटा जाता है। इसका रसीद स्कैन आइटम को लोगों में नहीं बांटता।"
      - "**चार्ट और डिफ़ॉल्ट बंटवारे।** Splitwise Pro में दोनों हैं। Side Badger बस यह हिसाब रखता है कि किसे किसका देना है, और पूरी तरकीब यही है।"
  - heading: "अपना ग्रुप यहां लाना"
    body: "कोई इम्पोर्टर नहीं है, इसलिए बदलने का मतलब नई शुरुआत है। पहले Splitwise में हिसाब चुकता करें, फिर Side Badger में ग्रुप बनाएं और सबको लिंक या QR कोड से बुलाएं। ग्रुप में सबको एक मुफ्त अकाउंट चाहिए, और साइन अप के लिए बस एक ईमेल पता काफी है।"
