h1: Så delar ni hyran efter rummens storlek
navLabel: Hyra efter rumsstorlek
lead: Bestäm hur stor del av hyran som går till de gemensamma rummen och dela den delen lika, dela sedan resten efter varje sovrums golvyta. Avrunda till hela procent, skriv in dem på hyran i Side Badger en gång och kopiera utgiften varje månad.
cta:
  heading: Få in hyran en gång för alla
  body: Skapa ett gratis konto, gör en grupp för lägenheten och lägg in hyran med de procent ni kommit överens om. Nästa månad är en kopia. Vill du ha rundturen först? Se [hur det fungerar](page:how-it-works) eller [vad gratis omfattar](page:pricing).
sections:
  - heading: Tre personer, en lägenhet, ett gräl
    body: Priya, Tom och Aisha delar en lägenhet för 1 950 £ i månaden. I ett år delade de på tre, för det var enkelt. Sedan mätte Aisha sitt sovrum. Priyas rum är 16 m², Toms är 12 m² och Aishas är 10 m², så Aisha betalade lika mycket som Priya för ett rum som var mer än en tredjedel mindre. Ingen hade varit orimlig. Ingen hade gjort uträkningen. Över en hämtmatslåda kom de överens om en regel först. Av hyran betalar 40 % för köket, badrummet och vardagsrummet, som alla tre använder.
  - heading: Metoden, med uträkningarna framför dig
    body: Fyra steg, ett måttband och en mobilkalkylator.
    items:
      - "**Lägg undan den gemensamma delen.** Gruppen bestämmer en andel av hyran för de rum som alla använder. För lägenheten är det 40 %, vilket är 13,33 % var på tre personer."
      - "**Dela resten efter golvyta.** De andra 60 % fördelas efter sovrummens storlek. Sovrummen blir 38 m² tillsammans (16 + 12 + 10), så Priyas del är 60 % × 16/38, vilket är 25,26 %."
      - "**Lägg ihop de två delarna.** Priya: 25,26 % + 13,33 % = 38,6 %. Tom: 60 % × 12/38 = 18,95 %, plus 13,33 % blir 32,3 %. Aisha: 60 % × 10/38 = 15,79 %, plus 13,33 % blir 29,1 %."
      - "**Avrunda och kontrollera.** Hela procent är enklare att skriva in och att käbbla om, så 38,6 % blir 39 %, 32,3 % blir 32 % och 29,1 % blir 29 %. Kontrollera att 39 + 32 + 29 blir 100. Om avrundningen hamnar på 99 eller 101 kommer gruppen överens om vems siffra som flyttas en procentenhet."
  - heading: Så ser månaden ut i lägenheten
    body: Hyran med 39 %, 32 % och 29 % blir 760,50 £, 624,00 £ och 565,50 £. Priya betalade hyresvärden, så över månaden har hon 1 142,50 £ att få, medan Tom är skyldig 566,00 £ och Aisha är skyldig 576,50 £. Side Badger föreslår två betalningar, båda till Priya.
  - heading: Ställ in det i Side Badger
    body: En kväll, varav det mesta går åt till att diskutera de 40 procenten.
    items:
      - "**Gör gruppen.** Välj **Skapa grupp** på instrumentpanelen och döp den efter lägenheten. Välj **Bjud in andra** och skicka länken eller QR-koden. Alla loggar in eller skapar ett gratis konto och väljer det namn de vill visas under i den här gruppen."
      - "**Lägg in hyran.** Välj **Lägg till utgift**. Skriv beskrivning och belopp, och under **Vem betalade?** väljer du den som betalade hyresvärden. Behåll alla tre under **Dela mellan**, välj sedan **Procentandel** under **Hur ska det delas?** och skriv 39, 32 och 29. Formuläret varnar om procenten inte blir 100 tillsammans. Välj **Spara utgift**."
      - "**Lägg in räkningarna.** El och bredband är separata utgifter med egna betalare. Låt **Hur ska det delas?** stå kvar på **Lika**."
      - "**Kopiera den nästa månad.** Öppna förra månadens hyra och välj **Kopiera utgift**. Kopian behåller betalaren, beloppet och delningen och får dagens datum. Ändra beloppet om hyran ändrats och välj sedan **Skapa kopia**."
      - "**Se vem som är skyldig vem.** Avsnittet **Saldon** visar det. Betala varandra hur ni vill och registrera sedan betalningen under **Reglera**."
  - heading: Rum med eget badrum, kyffen och folk som flyttar
    items:
      - "**Rum med eget badrum och kyffen.** Golvytan är en startpunkt. Ett rum med eget badrum är värt mer än samma yta utan, och ett kyffe där en säng och en hoppfull stol får plats är värt mindre. Justera procenten i samförstånd, kontrollera att de fortfarande blir 100 tillsammans och skriv ner de slutliga siffrorna där hela lägenheten ser dem."
      - "**Någon flyttar ut mitt i månaden.** Räkna ut vad var och en är skyldig för den månaden och lägg in månadens hyra med **Exakta belopp** i stället för **Procentandel**. Beloppen måste summera till hyran. Gör det innan hen går. Ingen kan lämna en grupp så länge hen är skyldig eller har pengar att få, och en utgift som rör någon som har lämnat blir skrivskyddad."
      - "**Någon flyttar in.** Mät igen, räkna om med de nya rumsstorlekarna och använd de nya procenten från nästa hyra. Tidigare månader förblir som de var."
  - heading: Det här gör inte Side Badger
    items:
      - Det mäter inte era rum och väljer inte procenten. Golvytorna och de 40 procenten är något gruppen kommer överens om.
      - Det har inga återkommande räkningar, så du kopierar förra månadens hyra varje gång.
      - Det flyttar aldrig pengar och betalar inte hyresvärden. Ni betalar varandra hur ni vill och registrerar det.
      - Det vet inte vad ert hyresavtal säger. Det håller räkningen mellan personerna i gruppen.
