faq:
  heading: "Kérdések"
  items:
    - q: "Láthatják a vendégek a csoportot csatlakozás nélkül?"
      a: "Nem. Az emberek linkkel vagy QR-kóddal és ingyenes fiókkal csatlakoznak, így a csoportot akkor látják, ha már bent vannak."
    - q: "Beszedheti a Side Badger a pénzt?"
      a: "Nem. A Side Badger vezeti a számolást, és sosem mozgat pénzt. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést. Ingyenes, hirdetések és napi korlátok nélkül; lásd az [árakat](page:pricing)."
    - q: "Lehetnek névtelenek a szavazatok?"
      a: "Igen. Szavazás létrehozásakor elrejtheted, ki mire szavazott. A beállítások csak az első szavazat előtt módosíthatók."
    - q: "Járulhatnak hozzá az emberek különböző összegekkel?"
      a: "Igen. Oszd fel a költséget pontos összegek szerint, hogy mindenki része az az összeg legyen, amiben megegyeztetek, vagy hagyd ki azokat, akik nem vettek részt."
    - q: "Vezetheti a szervező a könyvelést?"
      a: "Igen. Használd a felügyelt csoport előbeállítást, hogy a költségeket csak a létrehozók és az adminisztrátorok változtassák, az adminisztrátorok pedig jóváhagyják az új tagokat."
