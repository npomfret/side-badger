faq:
  heading: "Întrebări"
  items:
    - q: "Putem seta 60/40 o dată pentru tot?"
      a: "Nu. Împărțirea ține de fiecare cheltuială. Setează procentele la prima, apoi copiază-o data viitoare și schimbă ce e diferit. [Împărțirea cheltuielilor](page:feature/split-expenses) acoperă toate cele trei moduri de a împărți."
    - q: "Se leagă de banca noastră?"
      a: "Nu. Side Badger nu se atinge niciodată de banii voștri. Vă plătiți unii altora cum preferați, apoi înregistrați, așa cum explică [decontarea](page:feature/settle-up)."
    - q: "Poate altcineva să ne vadă grupul?"
      a: "Doar membrii lui, iar grupul unui cuplu are doi. Oricine folosește un link de invitație valabil se poate alătura, așa că trimite-l unei singure persoane și dă-i o expirare scurtă."
    - q: "Ce facem dacă fiecare a plătit o parte din aceeași factură?"
      a: "O cheltuială are un singur plătitor. Înregistrați două cheltuieli, câte una pentru fiecare, iar soldul iese la fel."
    - q: "Îi amintește partenerului meu să plătească?"
      a: "Nu. Nu există mementouri, așa că îmboldirea rămâne a ta. Măcar vă veți uita amândoi la aceeași cifră."
    - q: "Ce se întâmplă când nu mai împărțim costuri?"
      a: "Achitați soldul și înregistrați plata, ca nimeni să nu mai datoreze nimic. Apoi un administrator poate bloca grupul, ceea ce păstrează cifrele așa cum sunt, sau îl poate închide definitiv, ceea ce îl face inaccesibil pentru toți. Închide-l doar când niciunul dintre voi nu mai are nevoie de istoric."
