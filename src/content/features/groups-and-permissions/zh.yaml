meta:
  title: 群组管理与权限，共享支出的规矩 | Side Badger
  description: 用链接或二维码邀请成员，批准谁能加入，设置查看者和权限，账算完就锁定群组。你的群组你做主，当然有分寸。
h1: 群组管理与权限：你定规矩，但有分寸
navLabel: 群组与权限
lead: 有些群组需要一位管钱的人，Side Badger 为此准备了设置。用链接或二维码邀请成员，决定谁能进来，再决定谁能改数字。几个朋友的小群完全可以无视这一切，因为新群组默认是完全开放的。
cta:
  heading: 准备好管一个井井有条的群组了吗？
  body: 创建账户，建一个群组，发出邀请链接。可以一直保持开放，等群组变大或变挑剔了再收紧规则。
problem:
  heading: 总得有人把数字理清楚
  body: 四个室友靠信任就能运转，婚礼周末的三十位宾客恐怕不行。为每个家、每趟旅行、每场活动各建一个群组，每组最多 50 人，各自有自己的成员、角色和规则。你的仪表板会在一个屏幕上列出所有群组，以及你在每个群组里的情况。大多数群组从不碰这些设置，碰的那些，通常有个足够有条理、乐意用上它们的人。
workflow:
  heading: 从空群组到锁定群组
  steps:
    - title: 用链接或二维码邀请
      body: 打开**邀请他人**，选择链接的有效时长（15 分钟、1 小时、1 天或 5 天），然后复制链接，或展示二维码让大家扫码。你也可以在应用内邀请已经和你同在另一个群组的人。
      shot: S03
      shotAlt: 邀请对话框，显示群组链接、二维码，以及链接有效时长的选项
    - title: 先看看，再加入
      body: 拿到链接的人登录或创建账户，查看群组预览，并选择自己想在群组里使用的名字。然后点击**加入群组**。
      shot: S04
      shotAlt: 已登录的用户在加入前看到的群组预览
    - title: 批准谁能加入
      body: 开启审批后，通过链接来的人会作为待处理成员等候，直到管理员放行。管理员可以在**安全**的**待处理成员**下找到他们，并选择**批准**或**拒绝**。在此之前，待处理的人在群组里什么也看不到。
      shot: S14
      shotAlt: 等待管理员批准或拒绝的待处理成员
    - title: 决定谁能改什么
      body: 选择**开放**或**受管**配置，或者逐项设置权限。然后给每个人分配角色：管理员、成员或观察者。只有管理员能更改权限和角色。
      shot: S13
      shotAlt: 群组设置的安全选项卡，显示两种预设配置和自定义权限
    - title: 账算完就锁定
      body: 旅行结束、数字也尘埃落定后，管理员可以开启**锁定群组**。没人能再添加或修改支出、记录付款，或编辑清单和投票，页面上还会有横幅说明。再也没人能悄悄补一笔迟到的打车费了。如果真有一笔冒出来，管理员可以解锁群组。
      shot: S15
      shotAlt: 一个群组，显示说明它已被锁定的横幅
options:
  heading: 管理员、成员和观察者
  items:
    - title: 管理员
      body: 负责管理群组。管理员批准新成员，更改角色和权限，锁定和解锁群组，也可以关闭群组。创建群组的人一开始就是管理员，而群组永远不会没有管理员，因为最后一位管理员无法被降级。
    - title: 成员
      body: 参与其中。成员能做什么取决于群组的权限。在“开放”配置的群组里，几乎什么都能做；在“受管”配置的群组里，成员只能修改自己创建的支出和清单。
    - title: 观察者
      body: 什么都能看，什么都不能改。观察者不能添加或编辑支出和清单，不能邀请他人，不能更改设置，也不能动头部图片。适合那种想盯着数字看、又保证不乱动的人。
sections:
  - heading: 开放、受管，或者你自己定规矩
    body: 新群组默认使用**开放**配置，每个人都能邀请他人、修改支出、编辑清单，新成员自动加入。**受管**配置适合需要有人当大人的时候。你也可以逐项设置七项权限，手动改动任何一项，群组就会切换为自定义。无论怎么选，只有管理员能更改权限本身，每次更改都会出现在动态里。一套[室友](page:use-case/housemates)合租的房子可以全部开放。一场大型的[活动或庆祝](page:use-case/events-and-celebrations)往往更适合受管，这样有人负责把关谁能加入。刚接触这些？[使用方式](page:how-it-works)带你走完整个流程，从第一笔支出到结清。
    items:
      - "**谁可以编辑支出。** 开放：任何成员。受管：创建者和管理员。"
      - "**谁可以删除支出。** 开放：任何成员。受管：创建者和管理员。"
      - "**谁可以编辑列表。** 开放：任何成员。受管：创建者和管理员。"
      - "**谁可以邀请成员。** 开放：任何成员。受管：仅限管理员。"
      - "**新成员审批。** 开放：自动。受管：需要管理员批准。"
      - "**谁可以管理设置。** 开放：任何成员。受管：仅限管理员。"
      - "**谁可以更改头部图片。** 开放：任何成员。受管：仅限管理员。"
  - heading: 你的名字，你的照片，你的头部图片
    body: 每个群组都有自己的演员表。选择别人在每个群组里看到的名字（2 到 50 个字符，且在群组内唯一），以及在那里使用你的哪张头像。在家里叫 **Sam**，在旅行群里叫 **Sam（有车）**。任何有权更改设置的人都可以重命名群组、编辑群组描述。头部图片可以是最大 10 MB 的 JPEG、PNG、GIF 或 WebP，它有自己单独的权限。
  - heading: 归档、锁定或关闭
    body: 收起一个群组有三种方式，从轻到重。
    items:
      - "**归档**只会把群组从你自己的仪表板上隐藏，不影响别人。你仍然可以打开它，像以前一样使用，**取消归档群组**可以把它找回来。"
      - "**锁定**会冻结更改，直到管理员解锁。所有人仍可查看群组及其历史记录。"
      - "**关闭**是永久的，对所有人生效。只有管理员能做，需要输入群组名称来确认，之后谁也无法再打开这个群组。"
  - heading: 退出群组
    body: 结清之后，任何人都可以退出。只要你在任何一种货币里还欠钱或还有钱没收回，只要有关于某笔支出的未解决问题涉及你，或者你是最后一位管理员或唯一的成员，就不能退出。去[记录这笔付款](page:feature/settle-up)，处理好那个[支出疑问](page:guide/what-to-do-when-someone-disputes-a-shared-expense)，或者让别人当管理员，然后再走。想回来的话，需要一份新的邀请。
limits:
  heading: 有分寸：小字部分
  items:
    - 一个群组最多容纳 50 人。
    - 只有管理员能更改权限和角色。最后一位管理员无法被降级。
    - 把编辑支出设为**仅限管理员**，也意味着只有管理员能添加支出。
    - 锁定会阻止对支出、新付款、清单和投票的更改。所有人仍可查看群组及其历史记录，也可以对付款做出表情回应。
    - 关闭是永久的。应用没有办法重新打开已关闭的群组。
    - 生成新的邀请链接不会让旧链接失效。每个链接都会持续到自己的到期时间，所以担心它流到什么地方时，请选一个短的有效期。
    - 应用内邀请列出的是你最近 10 个活跃群组里的人。其他人需要拿到链接，而谁能邀请取决于群组的权限。
    - 加入需要账户，而且人们必须先验证邮箱才能添加任何内容。
useCasesHeading: 有点秩序的好处
faq:
  heading: 常见问题
  items:
    - q: 观察者可以添加支出吗？
      a: 不可以。观察者什么都能看，什么都不能改。他们不能添加或编辑支出和清单，不能邀请他人，也不能更改设置。
    - q: 欠着钱的人可以退出吗？
      a: 不可以。只要在任何一种货币里还欠钱或还有钱没收回，就不能退出群组。先结清，再走。
    - q: 群组被关闭后会怎样？
      a: 谁也无法再打开它。只有管理员能关闭群组，需要输入群组名称来确认，之后这个群组对所有人都不可用。如果只是想停止更改，就锁定它；如果只是想让它离开你自己的仪表板，就归档它。
    - q: 锁定可以撤销吗？
      a: 可以。管理员可以解锁群组，更改随即恢复可用。
    - q: 人们加入之前，我必须批准吗？
      a: 只有你想批准的时候才需要。新群组默认使用开放配置，通过链接来的人会自动加入。开启管理员审批，或者选择受管配置，每个人就要等管理员放行。
    - q: 一个群组最多可以有多少人？
      a: 最多 50 人。
