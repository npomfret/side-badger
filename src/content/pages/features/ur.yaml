meta:
  title: "Side Badger کیا کرتا ہے اور کیا نہیں"
  description: "تقسیم، حساب برابر کرنا اور متعدد کرنسیاں، ساتھ گروپس، فہرستیں اور پولز۔ پورا سامان، اور اس کی ایمان دار فہرست جو Side Badger نے چھوڑ دیا۔"
h1: "Side Badger کیا کرتا ہے"
navLabel: "خصوصیات"
lead: "ڈبے میں جو کچھ ہے، اور جو نہیں ہے۔"
intro: "یہ رہا پورا سامان۔ ہم نے اسپریڈشیٹ کو جان بوجھ کر چھوڑ دیا۔ تفصیل کے لیے نیچے کوئی خصوصیت چنیں، یا باقی فہرست اور ان چیزوں کی مختصر فہرست دیکھ لیں جو Side Badger نہیں کرتا۔"
cta:
  heading: "کیا یہ وہ کرتا ہے جو آپ کے گروپ کو چاہیے؟"
  body: "مفت اکاؤنٹ بنائیں اور پہلے کسی چھوٹے گروپ کے ساتھ آزمائیں۔"
cardsHeading: "ہر خصوصیت، تفصیل کے ساتھ"
sections:
  - heading: "رسید اسکین کرنا"
    body: "رسید کی تصویر لیں اور Side Badger کل رقم، تاریخ اور جگہ آپ کے جانچنے کے لیے بھر دیتا ہے۔ رسید کی تصاویر Google کی AI سروس پڑھتی ہے۔ [رسید اسکین کیسے کام کرتا ہے](page:feature/receipt-scanning)۔"
  - heading: "گروپس اور اجازتیں"
    body: "ہر گھر، سفر یا تقریب کے لیے ایک گروپ بنائیں، جس میں 50 افراد تک ہوں۔ لوگوں کو لنک یا QR کوڈ سے مدعو کریں۔ بڑے گروپ میں کسی کو ناظر بنائیں، جو سب کچھ دیکھتا ہے اور کچھ نہیں بدلتا۔ [گروپس اور اجازتیں](page:feature/groups-and-permissions) میں باریک تفصیل ہے۔"
  - heading: "فہرستیں اور پولز"
    body: "مشترکہ خریداری کی فہرست کو خریداری کے بلوں کے ساتھ رکھیں۔ ولا کی مختصر فہرست ووٹ کے لیے رکھیں، چاہیں تو گمنام طور پر۔ [مل کر منصوبہ بنائیں](page:feature/plan-together) تبصرے، سوالات، فہرستیں اور پولز بتاتا ہے۔"
  - heading: "باقی سب کچھ"
    items:
      - "**لائیو اپ ڈیٹس:** خرچہ شامل کریں اور سب اسے فوراً دیکھ لیتے ہیں۔"
      - "**زبانیں:** Side Badger کو 39 زبانوں میں استعمال کریں۔ گروپ کا ہر فرد اپنی زبان چن سکتا ہے۔"
      - "**ہوم اسکرین:** ایپ اسٹور کی ضرورت نہیں۔ سائن ان کریں، پھر Side Badger کو اپنی ہوم اسکرین میں شامل کریں اور یہ ایپ کی طرح کھلتا ہے۔ ایپ میں سیٹنگز آپ کو طریقہ دکھاتی ہیں۔ [ویب ایپ کے بارے میں مزید](page:feature/web-app)۔"
      - "**اطلاعات:** سیٹنگز میں پش اطلاعات آن کریں تاکہ آپ کے گروپس میں نئی سرگرمی ہونے پر آپ کو اطلاع ملے۔ iPhone اور iPad پر پہلے Side Badger کو اپنی ہوم اسکرین میں شامل کریں۔"
      - "**فیڈبیک:** کوئی خرابی ملی؟ ایپ کے اندر سے ہمیں بتائیں اور ہمارا جواب وہیں دیکھیں۔"
  - heading: "Side Badger کیا نہیں کرتا"
    items:
      - "**رقم منتقل کرنا۔** Side Badger آپ کی رقم کو کبھی ہاتھ نہیں لگاتا۔ جیسے چاہیں ایک دوسرے کو ادا کریں۔ ادائیگی کی درخواستیں منصوبے میں ہیں۔"
      - "**بل دہرانا۔** بار بار آنے والے اخراجات نہیں ہیں۔ پچھلے مہینے کا بل دو ٹیپس میں کاپی کریں۔"
      - "**آئٹم کے حساب سے تقسیم۔** ہر خرچے کا ایک ادا کرنے والا۔ برابر، عین رقم یا فیصد کے مطابق تقسیم کریں۔"
      - "**نیٹو ایپ دینا۔** یہ آپ کے براؤزر میں کام کرتا ہے۔ سائن ان کریں، پھر اسے اپنی ہوم اسکرین میں شامل کریں۔"
      - "**آف لائن کام کرنا۔** اسے کنکشن چاہیے۔"
      - "**ای میل یا ٹیکسٹ کے الرٹ بھیجنا۔** نئی سرگرمی ایپ میں نظر آتی ہے، اور پش اطلاعات آن کرنے پر اطلاع کے طور پر بھی۔"
      - "**چارٹ یا بجٹ بنانا۔** یہ کس کو کس کا دینا ہے اس کا حساب رکھتا ہے، اور بس یہی پوری ترکیب ہے۔"
      - "**Google یا Apple سے سائن ان۔** ای میل سے سائن اپ کریں۔ Google اور Apple سے سائن ان منصوبے میں ہیں۔"
      - "**بغیر اکاؤنٹ کے لوگوں کو اندر آنے دینا۔** گروپ کے ہر فرد کو مفت اکاؤنٹ چاہیے۔"
faq:
  heading: "سوالات"
  items:
    - q: "کیا میں Side Badger کے ذریعے ادائیگی کر سکتا ہوں؟"
      a: "نہیں۔ Side Badger حساب رکھتا ہے اور آپ کی رقم کو کبھی ہاتھ نہیں لگاتا۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر ادائیگی ریکارڈ کریں۔"
    - q: "کیا موبائل ایپ ہے؟"
      a: "ایپ اسٹور میں نہیں۔ Side Badger آپ کے براؤزر میں چلتا ہے۔ اپنے فون پر سائن ان کریں، پھر اسے ہوم اسکرین میں شامل کریں تاکہ یہ ایپ کی طرح کھلے۔ ایپ میں سیٹنگز آپ کو طریقہ دکھاتی ہیں۔"
    - q: "کیا میں آئٹم کے حساب سے تقسیم کر سکتا ہوں؟"
      a: "نہیں۔ ہر خرچے کا ایک ادا کرنے والا ہوتا ہے، اور آپ اسے برابر، عین رقم یا فیصد کے مطابق تقسیم کرتے ہیں۔"
    - q: "کیا یہ آف لائن کام کرتا ہے؟"
      a: "نہیں، اسے کنکشن چاہیے۔"
    - q: "کیا گروپ کے ہر فرد کو اکاؤنٹ چاہیے؟"
      a: "جی ہاں۔ گروپ کے ہر فرد کو مفت اکاؤنٹ چاہیے، اور سائن اپ کے لیے بس ایک ای میل ایڈریس درکار ہے۔"
