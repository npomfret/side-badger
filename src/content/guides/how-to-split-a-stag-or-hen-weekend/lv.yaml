faq:
  heading: "Jautājumi"
  items:
    - q: "Vai līgavaiņa vai līgavas liecinieks maksā vairāk?"
      a: "Tikai tad, ja grupa tā vienojas. Lietotne nevienam nepiešķir īpašu lomu aprēķinos. Ja kāds sedz vairāk, laukā **Kā sadalīt** izvēlieties **Precīzas summas** vai **Procenti** un ievadiet daļas, par kurām vienojāties."
    - q: "Ko darīt ar dzērieniem, ko daži nedzēra?"
      a: "Pievienojiet dzērienus kā atsevišķu izdevumu un atķeksējiet tikai tos, kas tos dzēra. Ja katrs dzēra citu daudzumu, izvēlieties **Precīzas summas** un ievadiet katra daļu. Neviens nemaksā par to, ko nedzēra."
    - q: "Vai goda viesis grupu vēlāk var redzēt?"
      a: "Jā, kad pārsteigums ir beidzies. Uzaiciniet viņu, tad administrators grupas iestatījumu sadaļā **Drošība un atļaujas** var piešķirt lomu **Skatītājs**. Skatītājs redz visu un neko nemaina, tāpēc pagaidiet, līdz vairs nekas nav noslēpums. Pievienošanai vajadzīgs bezmaksas konts."
