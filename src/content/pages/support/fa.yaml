meta:
  title: "کمک و پشتیبانی | Side Badger"
  description: "رمز عبور را فراموش کرده‌اید، لینکی کار نمی‌کند، پرداختی اشتباه ثبت شده؟ پاسخ کوتاه به چیزهایی که آدم‌ها در Side Badger در آن‌ها گیر می‌کنند، و راه تماس با ما."
h1: "کمک و پشتیبانی، بدون موسیقی انتظار"
navLabel: "کمک و پشتیبانی"
lead: "پاسخ کوتاه به چیزهایی که آدم‌ها در آن‌ها گیر می‌کنند، از رمز عبور فراموش‌شده تا بستن همیشگی یک گروه. هر کدام به صفحه‌ای لینک می‌دهد که بیشتر توضیح می‌دهد. پرسش‌تان را پیدا نکردید؟ از داخل برنامه به ما بگویید، یا چند خطی برایمان بنویسید."
cta:
  heading: "برای کمک آمدید، برای تقسیم می‌مانید؟"
  body: "هنوز حساب ندارید؟ گروه را شروع کنید، لینک را بفرستید و اولین هزینه را اضافه کنید. رایگان، بدون تبلیغات و بدون محدودیت روزانه."
groups:
  - heading: "ورود به حساب"
    items:
      - q: "رمز عبور را فراموش کردید؟"
        a: "برای بهترین گورکن‌ها هم پیش می‌آید. در صفحه **ورود**، **رمز عبور را فراموش کردید؟** را انتخاب کنید، ایمیل حسابتان را وارد کنید و بعد لینک ایمیلی را که برایتان می‌فرستیم دنبال کنید تا رمز جدیدی انتخاب کنید. [نحوه کار](page:how-it-works) توضیح می‌دهد یک حساب چه چیز دیگری لازم دارد."
      - q: "ثبت‌نام کرده‌ام اما نمی‌توانم چیزی اضافه کنم. چرا؟"
        a: "بیشتر وقت‌ها ایمیل‌تان هنوز تأیید نشده است، پس لینک ایمیل تأیید را باز کنید، یا در بنر یادآوری **ارسال مجدد ایمیل تایید** را انتخاب کنید تا یک ایمیل تازه بیاید. اگر تأیید شده‌اید، ممکن است گروه قفل باشد یا مجوزهایش اجازه ندهد، و بیننده همه‌چیز را می‌بیند و چیزی را تغییر نمی‌دهد، همان‌طور که [گروه‌ها و مجوزها](page:feature/groups-and-permissions) توضیح می‌دهد."
      - q: "چطور ایمیل یا رمز عبورم را عوض کنم؟"
        a: "در **تنظیمات**، **تغییر ایمیل** یا **تغییر رمز عبور** را انتخاب کنید. هر دو اول رمز عبور فعلی‌تان را می‌خواهند و نشانی ایمیل جدید باید با لینکی که برایش می‌فرستیم تأیید شود. [نحوه کار](page:how-it-works) درباره حساب‌ها توضیح می‌دهد."
      - q: "می‌توانم با Google یا Apple وارد شوم؟"
        a: "نه. فقط یک نشانی ایمیل و رمز عبوری با حداقل 12 نویسه لازم است و روی گوشی یا رایانه خودتان می‌توانید **مرا به خاطر بسپار** را تیک بزنید. صفحه [برنامه وب](page:feature/web-app) بقیه شروع کار را توضیح می‌دهد."
  - heading: "پیوستن به یک گروه"
    items:
      - q: "کسی لینک دعوت برایم فرستاده. چطور بپیوندم؟"
        a: "آن را باز کنید، بعد وارد شوید یا یک حساب رایگان بسازید. پیش‌نمایشی از گروه را می‌بینید، نامی را که دیگران آنجا برای شما می‌بینند انتخاب می‌کنید و **عضویت در گروه** را می‌زنید. [گروه‌ها و مجوزها](page:feature/groups-and-permissions) کل مسیر ورود را نشان می‌دهد."
      - q: "نوشته «در انتظار تایید». کار اشتباهی کرده‌ام؟"
        a: "اصلاً. در این گروه مدیر هر نفر را خودش راه می‌دهد، پس درخواست شما برای مدیرهایش رفته است و تا وقتی یکی‌شان تأیید نکند نمی‌توانید داخل را ببینید. یک یادآوری دوستانه حضوری مجاز است، و [گروه‌ها و مجوزها](page:feature/groups-and-permissions) تأیید را توضیح می‌دهد."
      - q: "لینک می‌گوید نامعتبر است یا منقضی شده."
        a: "لینک‌های دعوت به اندازه‌ای اعتبار دارند که سازنده‌شان تعیین کرده، از 15 دقیقه تا 5 روز. از یکی از اعضای گروه یک لینک تازه بخواهید، یا اگر در یک اتاق هستید کد QR را. [نحوه کار](page:how-it-works) درباره دعوت‌ها توضیح می‌دهد."
  - heading: "هزینه‌ها"
    items:
      - q: "چطور هزینه اضافه کنم؟"
        a: "گروه را باز کنید و **افزودن هزینه** را انتخاب کنید. بگویید برای چه بود، چقدر، چه کسی پرداخت کرد و چه کسانی سهیم بودند، بعد مساوی، با مبلغ دقیق یا با درصد تقسیمش کنید. [تقسیم هزینه‌ها](page:feature/split-expenses) همه گزینه‌ها را مرور می‌کند."
      - q: "اجاره می‌تواند هر ماه خودش تکرار شود؟"
        a: "خودکار نه، چون هزینه تکراری وجود ندارد. هزینه ماه قبل را باز کنید و **کپی هزینه** را انتخاب کنید؛ فرم پر شده می‌آید، آماده برای تاریخ جدید و هر چیزی که عوض شده. [تقسیم هزینه‌ها](page:feature/split-expenses) درباره کپی کردن بیشتر توضیح می‌دهد."
      - q: "مبلغ را اشتباه وارد کردم. می‌توانم درستش کنم؟"
        a: "بله. هزینه را ویرایش کنید، به شرطی که مجوزهای گروه اجازه بدهند و گروه قفل نباشد. نسخه قبلی نگه داشته می‌شود، پس کسی مجبور نیست درباره آنچه تغییر کرده حرف شما را باور کند، همان‌طور که [تقسیم هزینه‌ها](page:feature/split-expenses) توضیح می‌دهد."
      - q: "یک هزینه اشتباه به نظر می‌رسد و مال من نیست. حالا چه؟"
        a: "روی آن **یک سؤال دارم** را انتخاب کنید و دلیلش را بگویید؛ کل هزینه از مانده‌های همه بیرون می‌ماند تا وقتی که پرسنده یا یک مدیر پرسش را ببندد. چنین دکمه‌ای نیست؟ فقط کسانی که در هزینه سهم دارند می‌توانند بپرسند، مدیر باید اول **اجازه پرسش درباره هزینه‌ها** را در تنظیمات گروه روشن کرده باشد، و [راهنمای هزینه مورد اختلاف](page:guide/what-to-do-when-someone-disputes-a-shared-expense) دیپلماسی لازم را دارد."
  - heading: "پرداخت‌ها"
    items:
      - q: "آیا Side Badger پول را می‌فرستد؟"
        a: "نه، Side Badger هرگز پول جابه‌جا نمی‌کند. هر طور دوست دارید به هم پرداخت کنید، با انتقال بانکی، پول نقد یا هر چیزی که جواب می‌دهد، بعد پرداخت را ثبت کنید تا مانده‌ها به‌روز شوند. [تسویه حساب بعد از یک سفر گروهی](page:guide/how-to-settle-up-after-a-group-trip) آن را از اول تا آخر مرور می‌کند."
      - q: "چطور یک پرداخت را ثبت کنم؟"
        a: "در گروه **تسویه حساب** را انتخاب کنید، بگویید چه کسی پرداخت کرده و چه کسی گرفته، مبلغ را وارد کنید یا بگذارید یکی از دکمه‌های **تسویه سریع** آن را پر کند، و **ثبت تسویه حساب** را انتخاب کنید. فقط بخشی را پرداخته‌اید؟ همان را ثبت کنید و بقیه روی مانده می‌ماند، همان‌طور که [تسویه حساب](page:feature/settle-up) توضیح می‌دهد."
      - q: "پرداختی را اشتباه ثبت کردم. می‌توانم درستش کنم؟"
        a: "هر کس ثبتش کرده می‌تواند آن را از تاریخچه **تسویه‌ها** در گروه ویرایش کند، و خودش یا یک مدیر می‌تواند حذفش کند، که آن را از مانده‌ها برمی‌دارد. پرداختی که شامل کسی باشد که از آن زمان از گروه رفته قابل ویرایش نیست. [تسویه حساب](page:feature/settle-up) تاریخچه را توضیح می‌دهد."
  - heading: "اعلان‌ها و صفحه اصلی"
    items:
      - q: "چطور اعلان‌ها را روشن کنم؟"
        a: "در **تنظیمات**، **اعلان‌های فوری** را روشن کنید و وقتی مرورگر پرسید اجازه بدهید. اگر مرورگر قبلاً آن‌ها را مسدود کرده، اول در تنظیمات خود مرورگر اجازه بدهید. هر دستگاه جداگانه روشن می‌شود و رسیدن اعلان تضمین‌شده نیست، پس اعلان را یک یادآوری بدانید، نه یک قول، همان‌طور که صفحه [برنامه وب](page:feature/web-app) توضیح می‌دهد."
      - q: "چرا اعلان‌ها روی iPhone من کار نمی‌کنند؟"
        a: "روی iPhone یا iPad فقط در برنامه‌ای کار می‌کنند که به صفحه اصلی اضافه شده، هرگز در یک زبانه مرورگر. آن را اضافه کنید، از آیکون صفحه اصلی بازش کنید، بعد در **تنظیمات** روشنشان کنید. [برنامه‌ریزی با هم](page:feature/plan-together) نشان می‌دهد درباره چه چیزهایی به شما خبر می‌دهند."
      - q: "برنامه‌ای برای دانلود هست؟"
        a: "از فروشگاه برنامه نه، چون Side Badger در مرورگر شما اجرا می‌شود. وارد شوید، بعد در **تنظیمات** **افزودن به صفحه اصلی یا Dock** را دنبال کنید تا مثل یک برنامه، در پنجره‌ای جداگانه باز شود. صفحه [برنامه وب](page:feature/web-app) مرحله‌های هر دستگاه را دارد."
  - heading: "ترک، آرشیو، قفل و بستن"
    items:
      - q: "چطور از یک گروه خارج شوم؟"
        a: "تسویه کنید، بعد **ترک گروه** را انتخاب کنید. تا وقتی حتی در یک ارز بدهکار یا طلبکار باشید، تا وقتی هزینه‌ای که در آن هستید پرسش بازی دارد، یا اگر آخرین مدیر یا تنها عضو هستید نمی‌توانید بروید، و برگشتن یک دعوت تازه می‌خواهد. [گروه‌ها و مجوزها](page:feature/groups-and-permissions) جزئیات را دارد."
      - q: "چطور یک گروه قدیمی را از داشبوردم بردارم؟"
        a: "**آرشیو گروه** را انتخاب کنید. از داشبورد شما ناپدید می‌شود و از داشبورد هیچ‌کس دیگر نه، همچنان می‌توانید بازش کنید و از آن استفاده کنید، و **خروج گروه از آرشیو** برش می‌گرداند. [گروه‌ها و مجوزها](page:feature/groups-and-permissions) آرشیو، قفل و بستن را مقایسه می‌کند."
      - q: "سفر تمام شد. می‌شود جلوی تغییر عددها را گرفت؟"
        a: "بله. مدیر می‌تواند در تنظیمات گروه **قفل کردن گروه** را روشن کند و تا وقتی مدیر قفل را باز نکند هیچ‌کس نمی‌تواند هزینه اضافه یا ویرایش کند، پرداخت جدید ثبت کند یا فهرست‌ها و نظرسنجی‌ها را تغییر دهد. همه همچنان می‌توانند گروه و تاریخچه‌اش را بخوانند و هیچ تاکسی دیرهنگامی هم قاطی نمی‌شود، همان‌طور که [گروه‌ها و مجوزها](page:feature/groups-and-permissions) توضیح می‌دهد."
      - q: "می‌توانم یک گروه را حذف کنم؟"
        a: "مدیر می‌تواند با **بستن گروه** آن را ببندد، بعد از اینکه برای تأیید نام گروه را تایپ کرد. بستن دائمی است و گروه را برای همه غیرقابل دسترس می‌کند، پس اگر فقط می‌خواهید از جلوی چشم برود، به‌جایش آرشیوش کنید. [گروه‌ها و مجوزها](page:feature/groups-and-permissions) ریزه‌کاری‌ها را دارد."
contact:
  heading: "هنوز گیر کرده‌اید؟"
  items:
    - q: "اشکالی پیدا کردید یا چیزی را می‌خواهید عوض شود؟"
      a: "از داخل برنامه به ما بگویید. در منوی حسابتان **بازخورد** و بعد **ارسال بازخورد** را انتخاب کنید و **گزارش مشکل**، **درخواست کمک** یا **درخواست ویژگی** را برگزینید. اگر کمک می‌کند تصویری از صفحه پیوست کنید، و وقتی جواب بدهیم آن را در همان گفتگو می‌بینید."
    - q: "ترجیح می‌دهید ایمیل بزنید؟"
      a: "به نشانی زیر بنویسید. بگویید درباره کدام گروه است، چه کردید و انتظار داشتید چه اتفاقی بیفتد. غر زدن اشکالی ندارد؛ رمز عبور نه، پس هرگز رمز خودتان را نفرستید."
  emailLabel: "به این نشانی ایمیل بزنید:"
  email: support@sidebadger.me
