meta:
  title: "Side Badger kwa wapangaji wenza, safari na sherehe"
  description: "Gawanya gharama na wapangaji wenza, kwenye safari za kikundi, na kwa sherehe, harusi na zawadi za kikundi. Tazama Side Badger inavyofaa kila aina ya kikundi."
h1: "Side Badger kwa aina yako ya kikundi"
navLabel: "Matumizi"
lead: "Wapangaji wenza, likizo, kuaga ukapera. Chagua vurugu zako, kisha uone jinsi kikundi kama chako kinavyoweka hesabu."
intro: "Kila kikundi hugawanya gharama kwa namna tofauti kidogo. Kurasa hizi zinafuata **hali halisi** kuanzia gharama ya kwanza hadi malipo ya mwisho yaliyorekodiwa, pamoja na hesabu zinazoonyeshwa, ili uone kikundi chako mwenyewe kingeishia wapi."
cta:
  heading: "Umepata aina ya kikundi chako?"
  body: "Fungua akaunti, anzisha kikundi na ongeza gharama ya kwanza. Inachukua dakika chache."
  button: "Fungua akaunti ya bure"
cardsHeading: "Chagua hali iliyo karibu zaidi na yako"
sections:
  - heading: "Safari za kikundi"
    body: "Tiketi za ndege kwa pauni, villa kwa euro na chakula cha jioni ambacho watu watatu tu walikula. Weka kikundi kibadilishe kuwa pauni na marafiki wanne mjini Lisbon wanamaliza kwa malipo matatu, badala ya sita sarafu zikitenganishwa. [Gawanya gharama za safari ya kikundi](page:use-case/group-trips)."
  - heading: "Wapangaji wenza"
    body: "Mtu mmoja anamlipa mwenye nyumba, mwingine anakumbuka bili ya umeme, na hakuna anayekubaliana nani alinunua karatasi ya choo. Kodi ikigawanywa kwa ukubwa wa chumba na bili nyingine kwa usawa, wapangaji wanne wanamaliza mwezi kwa malipo matatu, yote kwa yule aliyelipa kodi. [Gawanya bili za nyumbani na wapangaji wenza](page:use-case/housemates)."
  - heading: "Sherehe, harusi na zawadi za kikundi"
    body: "Watu sita wanapiga kura ya zawadi, mmoja anainunua, na si wote wanachangia kiasi sawa. Zawadi ya £150 iliyogawanywa kwa kiasi halisi inaacha malipo matano kwa aliyeinunua, £120 kwa jumla. [Gawanya gharama za tukio](page:use-case/events-and-celebrations)."
  - heading: "Wapenzi"
    body: "Shiriki gharama za kuchosha bila kugeuza usiku wa miadi kuwa mapitio ya fedha ya kila robo mwaka. Kodi iliyogawanywa 60/40 na mboga zilizogawanywa kwa usawa hupunguzwa hadi malipo moja kati yenu wawili."
  - heading: "Tazama kwanza inavyofanya kazi"
    body: "Kila mfano ulio juu unatumia hatua zile zile, kuanzia kuunda kikundi hadi kurekodi malipo. [Inavyofanya kazi](page:how-it-works) inazipitia, na [bei](page:pricing) inasema inagharimu kiasi gani, yaani hakuna kitu, bila matangazo na bila vikomo vya kila siku."
faq:
  heading: "Maswali"
  items:
    - q: "Je, kila mtu kwenye kikundi anahitaji akaunti?"
      a: "Ndiyo. Watu hujiunga kwa kiungo au msimbo wa QR na akaunti ya bure."
    - q: "Je, Side Badger inaweza kukusanya pesa?"
      a: "Hapana. Mnalipa mtakavyo, kisha rekodi malipo ili salio liwe sahihi."
    - q: "Je, lazima nichague aina moja ya kikundi?"
      a: "Hapana. Matumizi haya ni mifano, si mipangilio. Kila kikundi kina vipengele vilevile, kwa hivyo tumia mchanganyiko unaokufaa."
