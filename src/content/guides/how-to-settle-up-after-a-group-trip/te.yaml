meta:
  title: "గ్రూప్ ట్రిప్ తర్వాత లెక్క తేల్చడం | Side Badger"
  description: "అందరూ చెదిరిపోకముందే తేల్చండి. పది చిక్కుముళ్ల అప్పులు నాలుగు పేమెంట్లు అవుతాయి, వచ్చినప్పుడే నమోదు, కొంత చెల్లించినా సరే. ఐదుగురికి లెక్కలతో."
h1: "గ్రూప్ ట్రిప్ తర్వాత లెక్క తేల్చడం"
navLabel: "ట్రిప్ తర్వాత లెక్క తేల్చడం"
lead: "అందరూ చెదిరిపోకముందే తేల్చండి. చివరి ఖర్చును జోడించండి, గ్రూప్ బ్యాలెన్స్‌లు తెరవండి, చిన్న జాబితా నుంచి మీరు బాకీ ఉన్నది మీకు నచ్చిన విధంగా చెల్లించండి. తర్వాత ప్రతి పేమెంట్‌ను Side Badgerలో నమోదు చేయండి, అప్పుడు బ్యాలెన్స్ మొత్తం గ్రూప్‌కు క్లియర్ అవుతుంది. ఐదుగురు స్నేహితులు, ఐదు ఖర్చులకు, పది చిక్కుముళ్ల అప్పులు నాలుగు పేమెంట్లకు తగ్గుతాయి."
cta:
  heading: "ఫోటోలు రాకముందే లెక్కలు ముగించండి"
  body: "ఉచిత ఖాతా తెరవండి, తర్వాతి ట్రిప్ కోసం ఒక గ్రూప్ మొదలుపెట్టండి, ప్రతి ఖర్చు జరిగినప్పుడే జోడించండి. మీరు విమానాశ్రయం చేరేసరికి పేమెంట్ల చిన్న జాబితా సిద్ధంగా ఉంటుంది. ముందు [లెక్క తేల్చడం ఎలా పనిచేస్తుందో](page:feature/settle-up) చూడాలా?"
sections:
  - heading: "ఐదుగురు స్నేహితులు, ఐదు ఖర్చులు, ఒక డిపార్చర్ లాంజ్"
    body: "Mo, Ines, Raf, Tess, Uma సముద్ర తీరంలో ఒక వారం గడిపారు. Mo అపార్ట్‌మెంట్ బుక్ చేసి సరుకులు కొన్నాడు, Ines బోటు ప్రయాణానికి చెల్లించింది, Raf పెద్ద విందు బిల్లు కట్టాడు. Ines, Raf రైలులో వెళ్లారు కాబట్టి, Tess విమానాశ్రయ టాక్సీని Uma, Moతో కలిసి తీసుకుంది. Uma కార్డు ఇంట్లోనే ఉండిపోయింది, కాబట్టి ఆమె దేనికీ చెల్లించలేదు. అంటే మొత్తం ఐదు ఖర్చులు, €1,700, డిపార్చర్ లాంజ్‌లో ఎవరు ముందున్నారో ఎవరూ చెప్పలేకపోయారు."
  - heading: "పది అప్పులు, నాలుగు పేమెంట్లు"
    body: "అపార్ట్‌మెంట్, బోటు, విందు, సరుకులు ఐదుగురి మధ్య సమానంగా పంచబడతాయి. అంటే ఒక్కొక్కరికి €200, €50, €60, €18, కాబట్టి Ines, Raf చెరో €328 బాకీ. టాక్సీని ముగ్గురు పంచుకుంటారు, ఒక్కొక్కరికి €20, కాబట్టి Mo, Tess, Uma €348 బాకీ. Mo €1,090 చెల్లించాడు, €348 బాకీ, కాబట్టి అతనికి €742 రావాలి. మిగతా అందరూ తాము బాకీ ఉన్నదానికంటే తక్కువ చెల్లించారు. Uma €348, Tess €288, Ines €78, Raf €28 తక్కువ, ఇవన్నీ కలిపితే Mo €742 అవుతుంది. ప్రతి జంటనూ నేరుగా తేల్చుకుంటే పది వేర్వేరు అప్పులు వస్తాయి. బదులుగా Side Badger నాలుగు పేమెంట్లను సూచిస్తుంది, అన్నీ Moకే."
  - heading: "అందరూ చెదిరిపోకముందే తేల్చండి"
    body: "ఉత్తమ సమయం చివరి సాయంత్రం లేదా ఇంటికి ప్రయాణంలో, అందరూ ఇంకా ఒకే చోట ఉన్నప్పుడు, €28 అప్పును ప్రస్తావించడం సులువు. ముందు ప్రతి ఖర్చునూ జోడించండి, టాక్సీతో సహా. బాకీ ఉన్నప్పుడు లేదా రావాల్సినప్పుడు ఎవరూ గ్రూప్ వదలలేరు, కాబట్టి లెక్క ఎప్పుడో ఒకసారి ముగియాల్సిందే."
    items:
      - "**జాబితా చూడండి.** గ్రూప్ తెరిచి **బ్యాలెన్స్‌లు** చూడండి. డిఫాల్ట్‌గా మీకు సంబంధించిన అప్పులు కనిపిస్తాయి. మొత్తం గ్రూప్ జాబితా చూడటానికి **అన్నీ చూపించు** ఎంచుకోండి."
      - "**మీకు నచ్చిన విధంగా చెల్లించండి.** బ్యాంక్ బదిలీ, నగదు, గత సెలవు నుంచి రావాల్సిన ఒక సాయం. Side Badger డబ్బును కదపదు."
      - "**నమోదు చేయండి.** **సెటిల్ చేయి** ఎంచుకోండి. **త్వరిత సెటిల్మెంట్** కింద ప్రతి బటన్ మీకు సూచించిన ఒక పేమెంట్, ఒకదాన్ని ఎంచుకుంటే మొత్తం నిండుతుంది. బ్యాంక్ బదిలీ లాంటి **గమనిక**ను జోడించండి, **తేదీ**ని చూసుకోండి (అది భవిష్యత్తులో ఉండకూడదు), **సెటిల్మెంట్‌ను నమోదు చేయి** ఎంచుకోండి."
      - "**క్లియర్ అవ్వడం చూడండి.** బ్యాలెన్స్ అందరికీ అప్‌డేట్ అవుతుంది. చివరి పేమెంట్ నమోదైనప్పుడు **బ్యాలెన్స్‌లు**లో **అన్నీ సెటిల్ అయ్యాయి!** అని కనిపిస్తుంది."
  - heading: "ఇప్పుడు కొంత, మిగిలినది తర్వాత"
    body: "Uma ఈ రాత్రి €200 పంపి, మిగిలినది నెలాఖరున పంపవచ్చు. ఆమె €200 నమోదు చేస్తుంది, తర్వాత కూడా ఆమె Moకు €148 బాకీ ఉంటుందని ఫారం హెచ్చరిస్తుంది, అంటే €348 నుంచి €200 తీసేస్తే. సేవ్ చేస్తే, మిగిలినది నమోదు చేసే వరకు ఆ €148 ఆమె బ్యాలెన్స్‌లో ఉంటుంది. హెచ్చరిక రెండో వైపు కూడా పనిచేస్తుంది. పొరపాటున ఒక సున్నా చేరి €348 కాస్తా €3,480 అయితే, ఆమె Moకు €348 మాత్రమే బాకీ అని, సేవ్ చేస్తే ఎదుటి దిశలో ఒక అప్పు ఏర్పడుతుందని ఫారం చెబుతుంది. సేవ్ చేసే ముందు ఆ సున్నాను సరిచేయండి."
  - heading: "తప్పులు సరిచేయడం, పేమెంట్లకు చప్పట్లు"
    items:
      - "**తప్పు పేమెంట్.** పేమెంట్‌ను నమోదు చేసిన వ్యక్తి మాత్రమే దాన్ని సవరించగలరు. వాళ్లు లేదా గ్రూప్ అడ్మిన్ దాన్ని తొలగించవచ్చు, అప్పుడు దాన్ని మళ్లీ నమోదు చేయవచ్చు."
      - "**గమనించదగ్గ పేమెంట్.** నమోదైన ప్రతి పేమెంట్ దాని తేదీ, గమనికతో **సెటిల్మెంట్స్** కింద ఉంటుంది, అక్కడ గ్రూప్‌లో అందరూ చూడగలరు, స్పందించగలరు. Uma చివరి €148 వచ్చినప్పుడు Mo **వేడుక** ఎంచుకోవచ్చు."
      - "**ముగింపు.** ప్రతి బ్యాలెన్స్ సున్నా అయినప్పుడు, అంకెలు అలాగే ఉండేలా అడ్మిన్ గ్రూప్‌ను లాక్ చేయవచ్చు."
  - heading: "ఇక్కడ Side Badger ఏం చేయదు"
    items:
      - "ఇది ఎప్పుడూ డబ్బును కదపదు. పేమెంట్ లింకులు, పేమెంట్ అభ్యర్థనలు లేవు, కాబట్టి యాప్‌లోని పేమెంట్ అంటే వేరే చోట చేసిన పేమెంట్ రికార్డే."
      - "ఇది రిమైండర్లు పంపదు. ఆలస్యమైన పేమెంట్ వెంటపడటం ఇప్పటికీ మీ పనే."
      - "ఇది గడువులు పెట్టదు. Uma మిగిలిన €148 ఎప్పుడు చెల్లించాలనేది గ్రూప్ ఒప్పుకోవాలి."
      - "సూచించిన పేమెంట్లు ఒక చిన్న జాబితా, సాధ్యమైనంత చిన్న జాబితా అని హామీ కాదు. అవి కరెన్సీ వారీగా లెక్కించబడతాయి, కాబట్టి యూరోలు, పౌండ్లలో చెల్లించిన ట్రిప్‌కు ప్రతిదానికి ఒక జాబితా వస్తుంది."
exampleAfter: 2
example:
  heading: "తీరంలో ఐదుగురు స్నేహితులు"
  currency: EUR
  people:
    - id: mo
      name: Mo
    - id: ines
      name: Ines
    - id: raf
      name: Raf
    - id: tess
      name: Tess
    - id: uma
      name: Uma
  expenses:
    - label: "అపార్ట్‌మెంట్"
      payer: mo
      amount: 1000
      split:
        method: equal
    - label: "బోటు ప్రయాణం"
      payer: ines
      amount: 250
      split:
        method: equal
    - label: "పెద్ద విందు"
      payer: raf
      amount: 300
      split:
        method: equal
    - label: "విమానాశ్రయ టాక్సీ"
      payer: tess
      amount: 60
      split:
        method: equal
        shares:
          tess: 1
          uma: 1
          mo: 1
    - label: "సరుకులు"
      payer: mo
      amount: 90
      split:
        method: equal
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "పేమెంట్‌ను ఎవరు నమోదు చేయాలి, చెల్లించినవాళ్లా, అందుకున్నవాళ్లా?"
      a: "పేమెంట్‌ను నమోదు చేయడానికి ఖర్చులను సవరించే అనుమతి కావాలి, ఫారం **ఎవరు చెల్లించారు?**, **ఎవరు డబ్బు అందుకున్నారు?** అని అడుగుతుంది. నమోదు చేసిన వ్యక్తి మాత్రమే తర్వాత దాన్ని సవరించగలరు, కాబట్టి త్వరిత సెటిల్మెంట్ బటన్ వాడి చెల్లించినవాళ్లే చేయడం సాధారణంగా సులువు."
    - q: "ట్రిప్ రెండు కరెన్సీల్లో నడిస్తే?"
      a: "బ్యాలెన్స్‌లు కరెన్సీ వారీగా ఉంచబడతాయి, కాబట్టి యూరో అప్పు యూరో అప్పుగానే ఉంటుంది, ప్రతి కరెన్సీకి దాని సొంత చిన్న జాబితా వస్తుంది, ఖర్చులు నమోదు చేసేటప్పుడే మార్చి ఉంటే తప్ప. [అనేక కరెన్సీలు](page:guide/how-to-split-a-trip-paid-in-several-currencies) రెండు దారులనూ చూపిస్తుంది."
    - q: "ట్రిప్ సమయంలో తేల్చాలా, చివరిలోనా?"
      a: "ఏదైనా సరే. నమోదైన ప్రతి పేమెంట్ బ్యాలెన్స్‌లను మారుస్తుంది, కాబట్టి ట్రిప్ మధ్యలో చేసిన పేమెంట్ చివరి జాబితాలో లెక్కలోకి వస్తుంది. చివరిలో సులువు, ఎందుకంటే [ట్రిప్ మొత్తం](page:use-case/group-trips) ఒకే చోట ఉంటుంది."
