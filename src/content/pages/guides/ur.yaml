  description: "کرایہ، چھٹیوں کے ولا اور گروپ کے اخراجات منصفانہ طور پر بانٹنے کی عملی گائیڈز، ہر ایک حقیقت پسند گروپ کے ساتھ اور حساب دکھا کر سمجھائی گئی۔"
h1: "اخراجات منصفانہ طور پر بانٹنے کی گائیڈز"
navLabel: "گائیڈز"
lead: "وہ سوال جو لوگ اسپریڈشیٹ کھولنے سے ذرا پہلے پوچھتے ہیں، ایک حقیقت جیسے گروپ، حساب اور ایپ کے مراحل کے ساتھ حل کیے گئے۔"
intro: "ہر گائیڈ **ایک فرضی گروپ** کو پہلے خرچے سے آخری ریکارڈ شدہ ادائیگی تک لے کر چلتی ہے۔ اعداد آپ کے لیے نکال دیے گئے ہیں، اور مراحل میں اسکرینیں ویسے ہی ہیں جیسے ایپ انہیں کہتی ہے۔"
cta:
  heading: "آپ کا بھی ایسا ہی گروپ ہے؟"
  body: "اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلا خرچہ شامل کریں۔ حساب آپ کے لیے ہو جاتا ہے۔"
cardsHeading: "اپنا سوال چنیں"
