meta:
  title: "Scan admháil chun costas a chur leis | Side Badger"
  description: "Lig don bhroc an admháil a léamh. Líonann sé an t-iomlán, an dáta agus an áit duit le seiceáil, gan creidmheasanna scanta. Léann seirbhís AI Google an íomhá."
h1: "Scan admháil, seiceáil na sonraí, roinn é"
navLabel: "Scanadh admhálacha"
lead: "Lig don bhroc an admháil a léamh, agus seiceáil a obair bhaile. Cuir grianghraf le costas nua agus líonann Side Badger an t-iomlán, an dáta agus an áit duit le seiceáil. Ansin [roinneann tú é](page:feature/split-expenses) cosúil le costas ar bith eile. Tá scanadh saor in aisce, gan creidmheasanna scanta. Líonann sé costas amháin isteach agus ní roinneann sé an bille de réir míre. Léann seirbhís AI Google íomhánna admhálacha."
cta:
  heading: "Tóg grianghraf. Seiceáil é. Roinn é."
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa agus cuir costas leis le grianghraf admhála. Féach cad a líonann sé isteach, athraigh cibé rud atá mícheart, agus sábháil nuair atá tú sásta."
problem:
  heading: "Níl aon duine ag iarraidh admháil a chlóscríobh i scuaine tacsaithe"
  body: "Tagann páipéar le turais agus le hoícheanta móra amach. Dinnéar, an tacsaí, an babhta a d'éirigh ina shé cinn. Is é costas a chlóscríobh isteach i bhfón le ordógaí fuara agus scuaine taobh thiar díot an chaoi a ndéantar dearmad ar chostais. Mar sin léann Side Badger an admháil duit. Déanann sé an chéad dréacht agus déanann tú an seiceáil. Oireann sé do [thurais ghrúpa](page:use-case/group-trips) agus d'[imeachtaí agus ceiliúradh](page:use-case/events-and-celebrations), áit a gcruinníonn admhálacha níos tapúla ná mar is mian le haon duine déileáil leo."
workflow:
  heading: "Ó ghrianghraf go costas i dtrí chéim"
  steps:
    - title: "Cuir admháil le costas nua"
      body: "Tosaigh costas nua agus tapáil **Scan admháil**, nó úsáid an gníomh tapa **Scan admháil** ar do phainéal. Tóg grianghraf nó roghnaigh ceann atá agat cheana. Oibríonn **Cuir admháil nó ceangaltán leis** ar an bhfoirm freisin."
    - title: "Lig dó an admháil a léamh"
      body: "Deir an fhoirm **Ag anailísiú admháil...** agus AI Side Badger ag léamh na híomhá. Ansin líonann sé isteach cad a fuair sé, mar an cur síos, an t-iomlán, an t-airgeadra, an dáta, an t-am agus an áit. Fágtar gach rud a bhí clóscríofa agat cheana gan teagmháil."
      shot: S09
      shotAlt: "An fhoirm costais nua ag taispeáint Ag anailísiú admháil..., ansin an fhoirm chéanna agus na sonraí líonta isteach"
    - title: "Seiceáil é, ansin roinn é"
      body: "Cuir an fhoirm i gcomparáid leis an bpáipéar. Ceartaigh aon rud atá mícheart, abair cé a d'íoc agus cé a roinn an costas, roghnaigh conas é a roinnt agus sábháil. Níl an costas ann go dtí go ndéanann tú sin. Clúdaíonn [roinn costais](page:feature/split-expenses) an roinnt."
options:
  heading: "Roghanna"
  items: []
sections:
  - heading: "Cad a líonann sé isteach"
    body: "Cuir íomhá admhála le costas nua agus is féidir leis na réimsí seo líonadh isteach. Fágtar fós ortsa cé a d'íoc, cé a roinn an costas agus conas é a roinnt."
    items:
      - "**Cur síos** ar an gcostas."
      - "An **t-iomlán**."
      - "An **t-airgeadra**, má cheadaíonn do ghrúpa é."
      - "An **dáta** agus an **t-am**."
      - "An **áit**."
      - "Cóip téacs den admháil sna **nótaí**, don uair a théann an ceann páipéir i léig nó tríd an níochán."
  - heading: "Cad a sheiceálann tú fós"
    body: "Gach rud. Caith leis an méid a líonann sé isteach mar dhréacht. Seiceáil an t-iomlán in aghaidh an pháipéir, ansin an t-airgeadra, an dáta agus an áit. Is féidir le grianghraif doiléire agus páipéar crapaithe aon léitheoir a chur amú, agus ní gheallaimid go bhfaigheann sé gach admháil ceart, mar sin féach le do thoil sula sábhálann tú. Má tá rud éigin mícheart, clóscríobh thairis é. Má tá an admháil in yen agus go socraíonn an grúpa i bpuint, clúdaíonn [ilairgeadraí](page:feature/multiple-currencies) cad a tharlaíonn ansin."
  - heading: "Coinnigh an admháil leis an gcostas"
    body: "Cibé ar scanadh í nó nár scanadh, is féidir leis an admháil fanacht leis an gcostas. Ceangail grianghraif nó PDFanna, suas le trí in aghaidh an chostais agus suas le 10 MB an ceann. Feiceann baill an ghrúpa iad ar an gcostas. Taispeántar íomhánna mar mhionsamhlacha a osclaíonn i bhfeiceálaí, agus osclaíonn PDFanna mar naisc. Ceanglaítear an grianghraf a scanann tú freisin, mura mbaineann tú de é sula sábhálann tú. Nuair a fhiafraíonn duine cad a chosain an dinnéar sin i ndáiríre, tá an cruthúnas ansin."
  - heading: "Cá dtéann d'admháil"
    body: "Léann seirbhís AI Google íomhánna admhálacha. Chun an fhoirm a líonadh, léann Google Vertex AI (Gemini) an íomhá in ilréigiún Google sna Stáit Aontaithe. Cuir íomhá le costas nua agus léitear í. Stóráiltear PDF, nó grianghraf a cuireadh le costas atá ann cheana, gan é a léamh. Feiceann baill an ghrúpa admhálacha ceangailte, mar sin má thaispeánann admháil rud nár mhaith leat a roinnt, scipeáil an grianghraf agus clóscríobh an costas sin isteach."
limits:
  heading: "Teorainneacha"
  items:
    - "Íomhánna amháin. JPEG, PNG agus WebP, agus HEIC nuair atá sé tiontaithe. Is féidir PDFanna a cheangal le costas ach ní léitear iad."
    - "Is do chostais nua amháin atá scanadh. Ar chostas atá ann cheana is féidir leat admhálacha a cheangal, ach ní léitear aon rud."
    - "Ní líonann sé ach na réimsí nár bhain tú leo, agus an t-airgeadra ach amháin má cheadaíonn do ghrúpa é."
    - "Ní roinneann sé de réir míre agus ní shanntaíonn sé míreanna líne do dhaoine. Líonann sé costas amháin isteach agus roinneann tú sin mar is gnách."
    - "Níl aon gheallúint ann go bhfuil an méid a líonann sé isteach ceart, ná go n-oibreoidh scanadh gach uair. Seiceáil sula sábhálann tú, agus cuir an costas leis de láimh má theipeann ar scanadh nó mura bhfuil sé ar fáil."
    - "Is féidir suas le trí cheangaltán a bheith ar chostas, suas le 10 MB an ceann, mar JPEG, PNG, WebP, HEIC nó PDF."
    - "Léann Google Vertex AI (Gemini) íomhánna admhálacha in ilréigiún Google sna Stáit Aontaithe, agus feiceann baill an ghrúpa admhálacha ceangailte."
useCasesHeading: "Cá gcruinníonn na hadmhálacha"
faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir leis admháil a roinnt de réir míre?"
      a: "Ní féidir. Líonann sé an costas isteach, an t-iomlán san áireamh, agus roinneann tú sin go cothrom, de réir suimeanna cruinne nó de réir céatadáin. Do bhille inar ordaigh gach duine rud difriúil, cuir isteach cad atá dlite ag gach duine mar shuimeanna cruinne. Tá na sonraí ar [roinn costais](page:feature/split-expenses)."
    - q: "An féidir leis PDF a léamh?"
      a: "Ní féidir. Is féidir leat PDF a cheangal le costas ionas go dtaistealaíonn sé leis na huimhreacha, ach ní léitear ach íomhánna."
    - q: "An bhfuil teorainn ar scanadh?"
      a: "Níl aon chreidmheasanna scanta le rith amach, agus tá scanadh saor in aisce. Tá teorainneacha ar chomhaid, atá suas le trí cheangaltán in aghaidh an chostais agus 10 MB an ceann. Tá an chuid eile ar [cad a chlúdaíonn saor in aisce](page:pricing)."
    - q: "Cé a fheiceann m'admháil?"
      a: "Feiceann baill an ghrúpa na hadmhálacha atá ceangailte le costas. Léann seirbhís AI Google íomhánna admhálacha freisin, agus sin mar a líontar an fhoirm."
    - q: "An féidir liom admháil a scanadh do chostas atá curtha leis agam cheana?"
      a: "Ní féidir, is do chostais nua atá scanadh. Is féidir leat admháil a cheangal le costas atá ann cheana fós, agus stóráiltear í gan í a léamh."
    - q: "Cad má líonann sé rud éigin mícheart?"
      a: "Clóscríobh thairis é. Fanann gach réimse in-athraithe go dtí go sábhálann tú, agus ba cheart duit iad ar fad a sheiceáil ar aon nós. Má theipeann ar scanadh nó mura bhfuil sé ar fáil, cuir an costas leis de láimh mar is gnách."
