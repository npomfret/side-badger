faq:
  heading: "Spurningar"
  items:
    - q: "Hvort er sanngjarnara, stærð herbergja eða tekjur?"
      a: "Hvorugt er alltaf sanngjarnara. Stærð herbergja hentar meðleigjendum sem borga fyrir plássið sem þeir sofa í. Tekjur henta pörum og vinum með mjög ólík laun. Komið ykkur saman um það fyrir fyrsta leigudaginn, ekki eftir hann."
    - q: "Á að skipta reikningunum á sama hátt?"
      a: "Meðal meðleigjenda yfirleitt ekki. Allir nota rafmagnið og internetið, svo jöfn skipting er einfaldari, eins og í dæminu. Eftir tekjum gefur reiknivélin reikningunum sömu hlutföll og leigunni."
    - q: "Get ég notað ferfet?"
      a: "Já. Veldu ft² og sláðu inn flatarmálið í ferfetum. Einingin er aðeins merking og hlutföllin verða þau sömu svo lengi sem allir nota sömu eininguna."
    - q: "Er reiknivélin ókeypis?"
      a: "Já. Ókeypis. Engar auglýsingar. Engin dagleg takmörk. Þú þarft ekki heldur aðgang."
