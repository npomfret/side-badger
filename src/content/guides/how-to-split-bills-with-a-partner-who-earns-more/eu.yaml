meta:
  title: "Fakturak banatu bikotekideak gehiago irabazten badu | Side Badger"
  description: "50/50 deseroso bihurtzen da batek askoz gehiago irabazten duenean. Banatu partekatutako fakturak diru-sarreren arabera, bi pertsonaren kalkuluak erakutsita."
h1: "Nola banatu fakturak gehiago irabazten duen bikotekidearekin"
navLabel: "Soldata desberdinak"
lead: "Batu zuen soldata garbiak, kalkulatu pertsona bakoitzaren zatia guztizkoan eta biribildu ehuneko osoetara. Mayak 2.800 £ eskuratzen ditu eta Jonek 1.700 £, beraz partekatutako fakturak 62/38 banatzen dituzte. Sartu ehuneko horiek Side Badger-eko partekatutako gastu batean, eta kopiatu faktura bera itzultzen den bakoitzean."
cta:
  heading: "Egin kalkulua behin"
  body: "Sortu doako kontu bat, egin talde bat zuen biontzat eta sartu alokairua zuen ehunekoekin. Hurrengo hilabeteko alokairua kopia bat da. Lehenik nolakoa den ikusi nahi duzu? Ikusi [nola funtzionatzen duen](page:how-it-works) edo begiratu [doakoak zer hartzen duen](page:pricing)."
sections:
  - heading: "Bi soldata, pisu bat, isiltasun adeitsu bat"
    body: "Maya eta Jon elkarrekin bizi dira. Mayak hilean 2.800 £ eskuratzen ditu eta Jonek 1.700 £. Bi urtez dena 50/50 banatu zuten, sinplea zelako eta inork ez zuelako gaia atera nahi. Gero Jonek alokairua bakarrik aztertu zuen. Alokairua 1.400 £ da, beraz erdia 700 £ da, hau da, Mayaren soldata garbiaren laurdena eta Jonenaren %41. Inor ez zen bidegabea izan. Inork ez zuen kalkulurik egin. [Bikote](page:use-case/couples) askok puntu honetara iristen dira, azkenean. Eramateko janari bat jaten zuten bitartean, adostu zuten partekatutako fakturek antzeko zati bat kendu behar ziotela soldata bakoitzari."
  - heading: "Metodoa, kontuak erakutsita"
    body: "Lau urrats, kalkulagailu bat eta edozein modutan izango zenuen elkarrizketa bat."
    items:
      - "**Adostu zer kontatzen den soldata gisa.** Mayak eta Jonek soldata garbia erabiltzen dute, hilero bankura iristen den dirua. Elkarrekin 2.800 £ + 1.700 £ = 4.500 £ da."
      - "**Kalkulatu zati bakoitza.** Mayarena 2.800 ÷ 4.500 da, hau da, %62,2. Jonena 1.700 ÷ 4.500 da, hau da, %37,8."
      - "**Biribildu ehuneko osoetara.** %62,2 62 bihurtzen da eta %37,8 38. Bi pertsonarekin, biribildu zifra bat eta kendu 100etik besteari dagokiona lortzeko, eta beti batzen dute 100."
      - "**Egiaztatu zer esan nahi duen.** Alokairua 1.400 £ denez, Mayak 868 £ ordaintzen ditu (%62) eta Jonek 532 £ (%38). Hori bakoitzaren soldata garbiaren %31 inguru da. Erdi bana ordainduz gero, Mayaren soldata garbiaren %25 eta Jonenaren %41 joango lirateke."
  - heading: "Hilabetea irakurtzen"
    body: "Mayak alokairua ordaindu zuen, 1.400 £, eta Jonek gainerako 216 £. Mayaren hilabeteko zatia 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £ da, eta 1.400 £ ordaindu zituenez, 402,40 £ zor zaizkio. Jonen zatia 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £ da, eta 216 £ ordaindu zituenez, 402,40 £ zor ditu. Side Badger-ek ordainketa bat proposatzen du, Jonek Mayari, 402,40 £, eta [kitatzeak](page:feature/settle-up) erregistratzen du egin ondoren. 50/50 banatuta, hilabete berean Jonek Mayari 592,00 £ ordaindu beharko lizkioke."
  - heading: "Prestatu Side Badger-en"
    body: "Hamar minutu, gehiena ehunekoetan emana."
    items:
      - "**Sortu taldea.** Aginte-panelean aukeratu **Sortu taldea** eta jarri pisuaren izena. Aukeratu **Gonbidatu beste batzuk** eta bidali Joni esteka edo QR kodea. Jonek saioa hasten du edo doako kontu bat sortzen du, eta talde honetan erakutsiko zaion izena aukeratzen du. Kideek bakarrik ikus dezakete talde bat, beraz talde hau zuek biona bakarrik da."
      - "**Gehitu alokairua.** Aukeratu **Gehitu gastua**. Sartu deskribapena eta zenbatekoa, eta **Nork ordaindu du?** atalean aukeratu Maya. Utzi bi pertsonak **Banatu honen artean** atalean, eta gero **Nola banatu** atalean aukeratu **Ehunekoa** eta idatzi 62 eta 38. Ehunekoek 100 batzen ez badute, formularioak abisatzen du. Aukeratu **Gorde gastua**."
      - "**Gehitu gainerako fakturak.** Energia eta Interneteko konexioa modu berean sartzen dira, Jon ordaintzaile gisa eta 62 eta 38 berberekin. Eramateko janaria gastu propioa da, **Nola banatu** **Berdin-berdin** aukeran utzita."
      - "**Kopiatu hurrengo hilabetean.** Ireki joan den hilabeteko alokairua eta aukeratu **Kopiatu gastua**. Kopiak ordaintzailea, zenbatekoa eta banaketa mantentzen ditu, eta gaurko data hartzen du. Alokairua aldatu bada, aldatu zenbatekoa, eta gero aukeratu **Sortu kopia**. Energia-fakturak modu berean funtzionatzen du."
      - "**Egiaztatu nork nori zor dion.** **Balantzeak** atalak erakusten du eta ordainketa-zerrenda labur bat proposatzen du. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa **Kitatu** atalean."
  - heading: "50/50, diru-sarreren arabera edo faktura bakoitzeko"
    body: "Ez dago erantzun zuzenik, zuek biok jasan dezakezuena baizik. Hiru ohikoenak."
    items:
      - "**Dena erdi bana.** Eramaten errazena, eta soldata antzekoa duten bikoteentzat egokia."
      - "**Partekatutako guztia diru-sarreren arabera.** Mayak eta Jonek egiten dutena. Elkarrizketa bat, ehuneko-bikote bat."
      - "**Faktura bakoitzeko.** Alokairua eta fakturak diru-sarreren arabera, oporrak eta kapritxoak 50/50 edo adosten duzuen beste edozein modutan, eta faktura bakoitzak egokitzen zaion araua hartzen du."
  - heading: "Adostu zer den partekatua"
    body: "Eztabaidak zerrendari buruz izan ohi dira, ez ehunekoei buruz. Alokairua, energia, Interneteko konexioa, asteko erosketa eta sofa partekatutzat hartzen dira etxe gehienetan. Mayaren gimnasio-kuota eta Jonen futbol-harpidetza agian ez. Adostu zerrenda behin, idatzi eta sartu partekatutako kostuak bakarrik taldean."
  - heading: "Eramateko janaria 50/50 geratzen da, nahita"
    body: "Kapritxoak txikiak eta aukerakoak dira, eta inork ez luke kalkulagailurik beharko dumplingak eskatzeko. Side Badger-en eramateko janaria beste gastu bat da. Jonek 36 £ ordaintzen ditu, **Nola banatu** **Berdin-berdin** aukeran geratzen da eta bakoitzak 18 £ zor ditu."
  - heading: "Norbaiten soldata aldatzen denean"
    body: "Soldata-igoera batek, lan berri batek edo lanetik aldi baterako kanpo egoteak kalkulua aldatzen du. Kalkulatu ehuneko berriak modu berean eta erabili hurrengo gastutik aurrera. Aurreko gastuak lehen bezala geratzen dira. Kopiatu joan den hilabeteko alokairua, aldatu ehunekoak eta gero aukeratu **Sortu kopia**. Dagoeneko sartuta dagoen bat zuzentzeko, editatu taldearen baimenek uzten badute, eta esan lehenik zure bikotekideari, saldoak aldatzen direlako. Aurreko bertsioa gorde egiten da. Adostu noiz birkalkulatuko duzuen, adibidez urtean behin, eta kitatu aldatu aurretik, banaketa zaharra kontu garbiarekin itxi dadin."
  - heading: "Side Badger-ek hemen egiten ez duena"
    items:
      - "Ez du inoiz galdetzen nork zenbat irabazten duen eta ez ditu ehunekoak kalkulatzen. Zuek adostutako zifrak idazten dituzue."
      - "Ezin du talde osorako banaketa lehenetsi bat ezarri. Ehunekoak gastu bakoitzean jartzen dira, beraz kopiatu dagoeneko dituen bat."
      - "Ez dauka faktura errepikaririk, beraz aldi bakoitzean joan den hilabeteko alokairua kopiatzen duzu."
      - "Ez du inoiz dirurik mugitzen. Zuek elkarri ordaintzen diozue nahi duzuen moduan eta erregistratzen duzue."
