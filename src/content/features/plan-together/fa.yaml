meta:
  title: "فهرست، نظرسنجی و نظر برای هزینه‌های گروهی | Side Badger"
  description: "روی هزینه‌ها نظر بدهید، هزینه مشکوک را زیر سؤال ببرید، فهرست خرید نگه دارید و درباره ویلا رأی بدهید. اول برنامه بریزید، بعد تقسیم کنید. رایگان، بدون تبلیغات."
h1: "با هم برنامه بریزید، بعد تقسیم کنید"
navLabel: "برنامه‌ریزی با هم"
lead: "فهرست خرید و صورت‌حساب خرید بالاخره با هم سلام‌علیک پیدا کردند. Side Badger به گروه شما جایی می‌دهد تا پیش از خرج شدن پول و بعد از آن درباره‌اش حرف بزند، با نظر روی هر هزینه، راهی برای زیر سؤال بردن آن‌هایی که مشکوک به نظر می‌رسند، و فهرست‌ها و نظرسنجی‌های مشترک برای تصمیم‌های بزرگ. بعد طبق معمول [هزینه‌ها را تقسیم می‌کنید](page:feature/split-expenses)."
cta:
  heading: "برنامه بریزید، بعد تقسیم کنید"
  body: "یک حساب رایگان بسازید، گروه را شروع کنید و اولین فهرست، نظرسنجی یا پرسش را درست کنار پول بگذارید. مطمئن نیستید بعدش چه می‌شود؟ [نحوه کار](page:how-it-works) را ببینید."
problem:
  heading: "گفت‌وگو این‌طرف است، صورت‌حساب آن‌طرف"
  body: "خرج گروهی معمولاً در دو جا زندگی می‌کند. اعداد در یکی هستند و دعوا بر سر اعداد در گپی که سه‌شنبه بالا رفت و گم شد. فهرست خرید عکسی از یخچال است. ویلا با لایک بیشتر آدم‌ها انتخاب شد، احتمالاً. Side Badger برنامه‌ریزی را درون گروه و کنار هزینه‌ای که درباره‌اش است نگه می‌دارد، پس نظر همان‌جاست که هزینه است، فهرست همان‌جاست که خرید است، نظرسنجی برای تصمیم بزرگ هست و راهی هست که بدون نوشتن یک پاراگراف بگویید «یک لحظه، این درست است؟» همه‌اش درباره پول گروه می‌ماند، که کار گروه همان است."
workflow:
  heading: "از رأی‌گیری ویلا تا صورت‌حساب خرید"
  steps:
    - title: "تصمیم بزرگ را به رأی بگذارید"
      body: "برای تصمیمی که صورت‌حساب را مشخص می‌کند، مثلاً کدام ویلا، نظرسنجی اضافه کنید. دو تا ده گزینه بگذارید، بگویید هر نفر چند رأی دارد، و وقتی همه رأی دادند آن را ببندید تا برنده علامت بخورد."
      shot: S17
      shotAlt: "نظرسنجی بسته‌شده با گزینه برنده علامت‌خورده و تعداد رأی کنار هر گزینه"
    - title: "فهرست خرید را با هم بنویسید"
      body: "فهرستی مشترک شروع کنید، موردها را اضافه کنید و هر چه به سبد رسید تیک بزنید. خرید بعداً به‌عنوان هزینه وارد می‌شود."
      shot: S16
      shotAlt: "فهرست خرید مشترک با چند مورد تیک‌خورده و شمارنده پیشرفت"
    - title: "درباره هزینه همان‌جا که هست حرف بزنید"
      body: "روی خود هزینه نظر بدهید، رسید را پیوست کنید و با ایموجی واکنش نشان دهید. گفت‌وگو کنار عددی می‌ماند که درباره‌اش است."
      shot: S08
      shotAlt: "یک هزینه با جزئیاتش، تصویر کوچک رسید، رشته نظرها و واکنش‌های ایموجی"
    - title: "هزینه‌ای را که مشکوک است زیر سؤال ببرید"
      body: "اگر گروه پرسش درباره هزینه‌ها را روشن کرده باشد، هر کسی که در یک هزینه سهم دارد می‌تواند **یک سؤال دارم** را انتخاب کند. هزینه تا رسیدگی به پرسش از مانده‌ها بیرون می‌ماند."
      shot: S18
      shotAlt: "فهرست هزینه‌ها با نشان «زیر سؤال» و فیلتر «فقط زیر سؤال»"
    - title: "ببینید چه چیزی عوض شد و چه کسی عوضش کرد"
      body: "تاریخچه فعالیت و زنگ اعلان‌ها نشان می‌دهند در گروه‌های شما چه چیز تازه‌ای هست. اگر بخواهید، اعلان‌های فوری هم هستند."
      shot: S19
      shotAlt: "منوی کشویی اعلان‌ها با فهرستی از فعالیت‌های اخیر"
