meta:
  title: "Дели рачуне с партнером, 50/50 или по приходу | Side Badger"
  description: "Дели досадне трошкове без претварања вечере у тромесечни преглед финансија. Дели 50/50, по приходу или рачун по рачун и види ко коме дугује. Бесплатно."
h1: "Дели трошкове као пар, поштено"
navLabel: "Парови"
lead: "Дели досадне трошкове без претварања вечере у тромесечни преглед финансија. Side Badger води једну текућу евиденцију кирије, рачуна и куповине за **парове** који деле дом, кауч и магловито сећање ко је платио интернет. Дели 50/50, по приходу или рачун по рачун и види ко коме дугује."
cta:
  heading: "Оснуј групу за двоје"
  body: "Направи налог, оснуј групу и пошаљи партнеру везу за позивницу. Вечерашња храна за понети може бити први трошак."
scenario:
  heading: "Поштено не мора да значи 50/50"
  body: "Сем и Алекс деле дом. Сем зарађује више, па су се договорили да Сем плаћа 60 % кирије, а Алекс 40 %. Сем плаћа станодавцу, Алекс обавља куповину, и обоје су прилично сигурни да се све на крају изједначи. „Прилично сигурни“ је начин на који белешка на нечијем телефону постаје трајни спор. Зато оснујте групу за вас двоје, изабери име које желиш да партнер види и пошаљи му везу за позивницу или QR код. Додај сваки трошак кад се деси, реци ко је платио и како се дели, а групи препусти да води рачун. Направите посебну групу за сваки одмор (види [групна путовања](page:use-case/group-trips)), да летови остану ван намирница."
sections:
  - heading: "50/50, по приходу или рачун по рачун"
    body: "Не постоји универзално поштена подела, само она око које се обоје слажете, најбоље пре првог рачуна, а не после првог уздаха. Ово су уобичајена три начина."
    items:
      - "**50/50.** Изабери **Једнако** и свако дугује половину. Одговара заједничким трошковима кад су вам приходи близу, и не захтева никакву математику."
      - "**По приходу.** Ако један од вас зарађује више, дели по уделу сваке особе у новцу који долази. Прво се договорите шта се рачуна (плата која остаје у џепу је уобичајен избор), саберите оба износа и подели свој укупним. Ако један од вас носи кући три дела а други два, то је 3 ÷ (3 + 2) = 60 %, па један покрива 60 %, а други 40 %. Заокружи на целе проценте и унеси их под **Проценат**, где морају да дају 100. Нема места где се уноси плата, па куцаш само проценте."
      - "**Рачун по рачун.** Сваки трошак има своју поделу, па можете да мешате: кирија по приходу, намирнице 50/50, а заједнички поклон као **Тачни износи** ако сте сваки изабрали шта ћете уложити."
      - "**Кад се плата промени,** користи нове проценте од следећег трошка. Раније трошкове задржава подела са којом су унети. Да видиш рачуне урађене са правим платним листићима, прочитај [како да делиш рачуне с партнером који зарађује више](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "Месечни преглед"
    body: "Једном месечно, или кад год бројеви почну да свраби, отвори групу и провери **Стања**. Кад сте двоје, у свакој валути увек постоји само једна уплата, од оног ко дугује ономе коме се дугује. Узмимо месец Сема и Алекса. Сем је платио кирију од 1.500 £, а Алексових 40 % од тога је 600 £. Алекс је платио 90 £ за намирнице, подељено једнако, па је Семова половина 45 £. Side Badger једно пребија са другим, 600 £ минус 45 £, и Алекс плаћа Сему 555 £. Платите како хоћете, банковним трансфером, у готовини или услугом коју сте дужни, па то забележите под **Поравнај** да се стање врати на нулу. Нема понављајућих рачуна, зато копирај прошломесечну кирију, промени датум и настави. Side Badger не премешта новац нити шаље подсетнике, па је подсећање и даље на вама."
  - heading: "Само вас двоје"
    body: "Група од двоје има два члана, а групу могу да виде само чланови. Партнер се придружује везом за позивницу или QR кодом. Веза може трајати од 15 минута до 5 дана, зато изабери најкраћу која партнеру даје времена да је искористи. Прављење нове везе не поништава старе, па их не остављај у ћаскању у ком има других људи. Свако ко користи важећу везу може да се придружи, па ако желиш да будеш сигуран, укључи одобравање и администратор пушта сваку особу унутра. Твом партнеру је потребан сопствени налог, који је бесплатан."
exampleAfter: 2
