meta:
  title: "Skupni seznami, ankete in komentarji za stroške | Side Badger"
  description: "Komentiraj stroške, postavi pod vprašaj čudnega, vodi skupni nakupovalni seznam in glasuj o vili. Najprej načrtuj, nato razdeli. Brezplačno, brez oglasov."
h1: "Načrtuj skupaj, deli potem"
navLabel: "Načrtuj skupaj"
lead: "Nakupovalni seznam in nakupovalni račun se končno razumeta. Side Badger skupini nudi prostor, kjer se o denarju pogovarja pred porabo in po njej, s komentarji pri vsakem strošku, načinom, kako postaviti pod vprašaj tiste, ki zgledajo narobe, ter skupnimi seznami in anketami za velike odločitve. Nato [stroške razdeliš](page:feature/split-expenses) kot običajno."
cta:
  heading: "Najprej načrtuj, nato deli"
  body: "Ustvari brezplačen uporabniški račun, ustanovi skupino in daj prvi seznam, anketo ali vprašanje tik ob denar. Ne veš, kaj sledi? Poglej, [kako deluje](page:how-it-works)."
problem:
  heading: "Klepet je tu, račun je tam"
  body: "Skupna poraba običajno živi na dveh mestih. Številke so na enem, prepir o številkah pa v klepetu, ki je v torek odrinil iz vidnega polja. Nakupovalni seznam je fotografija hladilnika. O vili je odločil palec gor večine, verjetno. Side Badger načrtovanje ohranja v skupini, ob stroških, o katerih govori, zato je komentar tam, kjer je cena, seznam tam, kjer je trgovina, anketa za veliko odločitev in način, da rečeš „počakaj, ali je to prav?“, ne da bi napisal odstavek. Vse ostaja o denarju skupine, zaradi česar skupina sploh obstaja."
workflow:
  heading: "Od glasovanja o vili do nakupovalnega računa"
  steps:
    - title: "Daj veliko odločitev na glasovanje"
      body: "Dodaj anketo za odločitev, ki določa račun, na primer katera vila. Izberi od dve do deset možnosti, določi, koliko glasov ima vsaka oseba, in jo zapri, ko so vsi glasovali in je zmagovalec označen."
      shot: S17
      shotAlt: "Zaprta anketa z označeno zmagovalno možnostjo in številom glasov ob vsaki možnosti"
    - title: "Nakupovalni seznam sestavi skupaj z drugimi"
      body: "Začni skupni seznam, dodaj postavke in jih odkljukaj, ko pristanejo v vozičku. Nakup nato vneseš kot strošek."
      shot: S16
      shotAlt: "Skupni nakupovalni seznam z nekaj odkljukanimi postavkami in štetjem napredka"
    - title: "Pogovori se o ceni tam, kjer živi"
      body: "Komentiraj sam strošek, priloži račun in se odzovi z emojijem. Pogovor ostane ob številki, o kateri govori."
      shot: S08
      shotAlt: "Strošek s podrobnostmi, sličico računa, nitjo komentarjev in odzivi z emojiji"
    - title: "Postavi pod vprašaj tistega, ki je čuden"
      body: "Če je skupina vklopila vprašanja o stroških, lahko vsak, ki je vključen v strošek, izbere **Imam vprašanje**. Strošek ostane zunaj stanj, dokler se vprašanje ne razreši."
      shot: S18
      shotAlt: "Seznam stroškov z značko Postavljeno pod vprašaj in filtrom Samo postavljeno pod vprašaj"
    - title: "Poglej, kaj se je spremenilo in kdo je to naredil"
      body: "Dnevnik dejavnosti in zvonec z obvestili kažeta, kaj je novega v vseh tvojih skupinah. Potisna obvestila so na voljo, če jih želiš."
      shot: S19
      shotAlt: "Spustni seznam obvestil s seznamom nedavne dejavnosti"
