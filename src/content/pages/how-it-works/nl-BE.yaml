meta:
  title: "Zo werkt Side Badger | Groepsuitgaven verdelen in vijf stappen"
  description: "Maak een groep, nodig mensen uit, voeg uitgaven toe en reken af. Zie wat er gebeurt tussen “iemand heeft betaald” en “we staan quitte”, met een uitgewerkt voorbeeld."
h1: "Zo werkt Side Badger"
navLabel: "Zo werkt het"
lead: "Wat gebeurt er tussen “iemand heeft betaald” en “we staan quitte”? Vijf stappen, geen spreadsheet en één das die vooral decoratief is. Hier is de hele reis, van de eerste groep tot de laatst geregistreerde betaling. Voor meer details over een stap, zie [uitgaven verdelen](page:feature/split-expenses) en [afrekenen](page:feature/settle-up)."
cta:
  heading: "Van “ik betaal deze wel” tot “we staan quitte”"
  body: "Maak een gratis account aan, start een groep en voeg de eerste uitgave toe. De das oordeelt niet over het bonnetje."
  button: "Maak een gratis account"
steps:
  - title: "Maak een groep"
    body: "Maak één groep per huis, reis of evenement, zodat de huur nooit in dezelfde lijst belandt als het huwelijksgeschenk. Geef de groep een naam, kies de naam waaronder mensen jou zien en beperk, als je wilt, welke valuta’s de groep accepteert. Je dashboard toont dan alle groepen, en hoe je er in elk voor staat, op één scherm."
    shot: S02
    shotAlt: "Het dialoogvenster om een groep te maken, met het onderdeel valutabeperkingen geopend"
  - title: "Nodig je mensen uit"
    body: "Deel een deelnamelink of toon een QR-code, en bepaal hoe lang die geldig blijft, van 15 minuten tot 5 dagen. Iedereen die meedoet heeft een gratis account en een geverifieerd e-mailadres nodig, en een groep telt tot 50 personen. Wil je controleren wie erin komt, zet dan goedkeuring aan en een beheerder laat elke persoon binnen."
    shot: S03
    shotAlt: "Het uitnodigingsvenster op het tabblad Link, met een QR-code en de keuzes voor de geldigheidsduur"
  - title: "Voeg uitgaven toe zodra ze gebeuren"
    body: "Zeg wie betaald heeft, hoeveel en voor wie het was. Verdeel gelijk, op exacte bedragen of op percentage, en laat iedereen weg die er niet bij was. Voeg de uitgave toe en iedereen ziet ze meteen, samen met wat er veranderd is en wie dat deed."
    shot: S05
    shotAlt: "Het uitgavenformulier met een verdeling op percentage, waarbij de huur wordt verdeeld naar grootte van de kamer"
  - title: "Hou de saldi in de gaten"
    body: "Side Badger houdt per valuta een lopend saldo bij, zodat je in één oogopslag ziet wie wie iets schuldig is. In plaats van iedereen een web van kleine schulden te laten ontwarren, stelt het een korte lijst betalingen voor die de groep afrekent."
    shot: S10
    shotAlt: "Het saldoscherm met vereenvoudigde schulden in twee valuta’s, met Alles tonen ingeschakeld"
  - title: "Reken af buiten de app, registreer binnen de app"
    body: "Side Badger verplaatst nooit geld. Betaal elkaar zoals je wilt en registreer dan de betaling, zodat de saldi bijgewerkt worden en het scherm van iedereen zich ververst zonder opnieuw te laden. “Afrekenen” betekent gewoon dat de saldi op nul staan. Niemand kan een groep verlaten zolang die nog geld schuldig is of tegoed heeft, dus wie op vertrekken staat, rekent eerst af."
    shot: S11
    shotAlt: "Het betalingsformulier met knoppen voor snel afrekenen en de melding bij een gedeeltelijke betaling"
requirements:
  heading: "Wat je nodig hebt"
  items:
    - "Een gratis account. Een e-mailadres en een wachtwoord is alles wat je nodig hebt, en je bevestigt het e-mailadres voordat je iets kunt toevoegen."
    - "Minstens 18 jaar zijn."
    - "Een moderne browser op een telefoon of computer, en een verbinding. Side Badger is geen app uit een appstore en werkt niet offline."
    - "Eventueel een plekje op je startscherm. Je hebt geen appstore nodig, want als je bent ingelogd, kun je Side Badger aan je startscherm of dock toevoegen en dan opent het als een app. In de instellingen van de app zie je hoe."
