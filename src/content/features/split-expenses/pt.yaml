meta:
  title: "Divide despesas em partes iguais, por valores exatos ou por percentagem | Side Badger"
  description: "Divide um custo partilhado em partes iguais, por valores exatos ou por percentagem, e deixa de fora quem não estava lá. Grátis, sem anúncios e sem limites diários."
h1: "Divide despesas em partes iguais, por valores exatos ou por percentagem"
navLabel: "Dividir despesas"
lead: "Nem tudo é 50/50. O Side Badger safa-se. Diz quem pagou, escolhe as pessoas que partilharam o custo e divide **em partes iguais, por valores exatos ou por percentagem**. Os rancores vendem-se à parte."
cta:
  heading: "Divide a próxima como deve ser"
  body: "Cria uma conta grátis, começa um grupo e adiciona a despesa que andas a adiar. Não sabes o que acontece a seguir? Vê [como funciona](page:how-it-works) ou confirma [o que o grátis inclui](page:pricing)."
  button: "Criar uma conta grátis"
problem:
  heading: "Nem tudo é 50/50"
  body: "A renda segue o tamanho do quarto. Um presente segue quem prometeu o quê. Um jantar segue quem ficou para a sobremesa. Dividir uma conta a meio funciona até à primeira conta que não é assim, e depois alguém abre uma folha de cálculo. O Side Badger regista quem pagou, quem partilhou o custo e como se divide, para os saldos saírem certos sem ninguém fazer contas de dividir à mesa."
workflow:
  heading: "Adicionar uma despesa, do princípio ao fim"
  steps:
    - title: "Diz quem pagou e por quê"
      body: "Indica o valor, uma descrição curta e a pessoa que pagou. Uma pessoa paga cada despesa, o que mantém a aritmética honesta."
      shot: S05
      shotAlt: "O formulário de despesa com a renda de uma casa de campo dividida por percentagem entre três pessoas"
    - title: "Escolhe a divisão"
      body: "Escolhe partes iguais, valores exatos ou percentagens. As percentagens têm de somar 100 e os valores exatos têm de somar o total."
      shot: S06
      shotAlt: "O formulário de despesa com valores exatos indicados para cada pessoa num presente"
    - title: "Acrescenta a história"
      body: "Define a data, adiciona etiquetas, um local e uma nota. Todas as pessoas do grupo veem os mesmos detalhes e podem comentar ali mesmo."
      shot: S08
      shotAlt: "Uma despesa com os seus detalhes, uma conversa de comentários e o valor original em que foi introduzida"
    - title: "Levanta uma questão se algo parecer estranho"
      body: "Se o grupo tiver ativado as questões sobre despesas, qualquer pessoa incluída numa despesa pode questioná-la, e a lista de despesas pode mostrar apenas as questionadas."
      shot: S18
      shotAlt: "A lista de despesas com um selo de Questionado e o filtro Apenas questionado"
options:
  heading: "Três formas de dividir"
  items:
    - title: "Em partes iguais"
      body: "A opção por defeito para jantares, táxis e tudo o que todos partilharam por igual. Se o total não se dividir exatamente, o cêntimo que sobra vai para uma pessoa ao acaso, e não sempre a mesma. No táxi abaixo, é a Ana."
    - title: "Por valores exatos"
      body: "Escreve o que cada pessoa deve. Ótimo para o presente em que cada um escolheu um preço diferente, ou para a loja em que o carrinho de uma pessoa tinha mais do que as compras partilhadas. Os valores têm de somar o total."
    - title: "Por percentagem"
      body: "Dá a cada pessoa uma parte do total. A renda pelo tamanho do quarto é o clássico, com o quarto maior a pagar a maior parte e ninguém a fingir o contrário."
example:
  heading: "Um fim de semana na casa de campo, quatro despesas, três divisões"
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: "a casa de campo, pelo tamanho do quarto"
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: "jantar"
      payer: ben
      amount: 84
      split:
        method: equal
    - label: "mercearia"
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: "o táxi de regresso"
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: "Só as pessoas que lá estavam"
    body: "Divide um custo por todos ou só pelas pessoas que o partilharam. Deixa de fora quem não fez parte de certos custos e os saldos refletem isso. O colega de casa que esteve fora a semana toda não deve nada pelo take-away, o que os [colegas de casa](page:use-case/housemates) reconhecerão como justiça básica."
  - heading: "Os detalhes que evitam discussões mais tarde"
    items:
      - "Define a **data** e, se quiseres, a hora. Atalhos como hoje, ontem, esta manhã e ontem à noite poupam algum trabalho de escrita."
      - "Adiciona até três **etiquetas** para agrupar despesas, como mercearia ou viagens."
      - "Adiciona o **local**. Cola um link de mapa e o nome do local preenche-se sozinho."
      - "Adiciona uma **nota** com a história por trás do número, com alguma formatação se a história precisar."
      - "Usa os **comentários** para manter a conversa junto da despesa de que fala, em vez de numa conversa de chat a que ninguém volta a ler."
  - heading: "Copiar, editar e ver o que mudou"
    body: "Copia a renda do mês passado em vez de a escreveres outra vez e altera o que for diferente. Se um número estava errado, edita a despesa. A versão anterior fica guardada e a edição aparece na atividade do grupo, por isso ninguém muda um número em silêncio. O que cada pessoa pode editar depende das permissões do grupo."
  - heading: "Quando algo parece errado"
    body: "Um grupo pode ativar as questões sobre despesas. Qualquer pessoa incluída numa despesa pode levantar uma questão e dizer porquê, e a despesa fica de fora dos saldos até a pessoa que perguntou, ou um administrador, a fechar. Vem desligado por defeito e um administrador ativa-o para o grupo. Serve bem para [eventos e celebrações](page:use-case/events-and-celebrations), onde o sinal de que ninguém se lembra passa de repente a ser assunto de todos."
limits:
  heading: "Limites"
  items:
    - "Uma pessoa paga cada despesa. Se duas pessoas pagaram, regista duas despesas."
    - "Não há divisão por item nem por quotas. Partes iguais, valores exatos e percentagens é o que existe."
    - "As percentagens têm de somar 100."
    - "Uma despesa pode ir até 999,999.99 na sua própria moeda, com as casas decimais habituais dessa moeda."
    - "As despesas não se repetem sozinhas. Copia a do mês passado."
    - "As datas não podem estar no futuro nem há mais de 10 anos."
    - "Uma despesa que envolva alguém que saiu do grupo passa a ser só de leitura."
useCasesHeading: "Onde dividir assim ajuda"
faq:
  heading: "Perguntas"
  items:
    - q: "Duas pessoas podem pagar uma despesa?"
      a: "Não numa só despesa. Regista duas, uma para cada pessoa que pagou, e os saldos saem iguais."
    - q: "Posso dividir um recibo por item?"
      a: "Não. Uma divisão é em partes iguais, por valores exatos ou por percentagem. Para uma conta com itens diferentes, introduz o que cada pessoa deve como valores exatos."
    - q: "Posso definir uma divisão por defeito?"
      a: "Não. Copia uma despesa anterior para reutilizar a divisão e altera o que for diferente."
    - q: "As contas podem repetir-se todos os meses?"
      a: "Não. Copia antes a despesa do mês passado, o que demora uns segundos."
    - q: "Quem pode editar uma despesa?"
      a: "Quem as permissões do grupo permitirem. Cada edição aparece na atividade do grupo, por isso as alterações nunca são silenciosas."
    - q: "O que acontece aos saldos depois?"
      a: "Atualizam-se à medida que chegam despesas, e [acertar contas](page:feature/settle-up) transforma-os numa lista curta de pagamentos. Se uma despesa estiver noutra moeda, vê [várias moedas](page:feature/multiple-currencies)."
