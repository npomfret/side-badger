faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Ποια συναλλαγματική ισοτιμία χρησιμοποιεί το Side Badger;"
      a: "Μια τρέχουσα συναλλαγματική ισοτιμία, που ανακτάται όταν καταχωρίζετε το έξοδο, εφόσον υπάρχει διαθέσιμη. Μπορείτε να την αλλάξετε σε αυτήν που πήρατε πραγματικά."
    - q: "Μπορεί η ομάδα να περιοριστεί σε λίρες και γεν;"
      a: "Ναι. Στις **Ρυθμίσεις** της ομάδας, ενεργοποιήστε την επιλογή **Περιορισμός νομισμάτων για αυτή την ομάδα** στις **Ρυθμίσεις Νομισμάτων**, διαλέξτε τα **Επιτρεπόμενα νομίσματα** και ορίστε το **Προεπιλεγμένο νόμισμα για νέα έξοδα**. Λιγότερες επιλογές στη λίστα, λιγότερα λάθος μαντέματα στο ταμείο."
    - q: "Πρέπει οπωσδήποτε να μετατρέψουμε;"
      a: "Όχι. Τα νομίσματα μένουν ξεχωριστά εκτός αν εσείς ή η ομάδα σας επιλέξετε να μετατρέψετε και κάθε νόμισμα παίρνει τη δική του σύντομη λίστα πληρωμών."
