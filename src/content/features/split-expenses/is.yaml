meta:
  title: "Skiptu útgjöldum jafnt, nákvæmt eða í prósentum | Side Badger"
  description: "Skiptu sameiginlegum kostnaði jafnt, eftir nákvæmum upphæðum eða í prósentum, og slepptu þeim sem voru ekki með. Ókeypis, án auglýsinga og án daglegra takmarka."
h1: "Skiptu útgjöldum jafnt, nákvæmt eða í prósentum"
navLabel: "Skipting útgjalda"
lead: "Ekki er allt 50/50. Side Badger ræður við það. Segðu hver greiddi, veldu fólkið sem deildi kostnaðinum og skiptu honum **jafnt, eftir nákvæmum upphæðum eða í prósentum**. Gremjan er seld sér."
cta:
  heading: "Skiptu þeim næsta almennilega"
  body: "Stofnaðu ókeypis aðgang, byrjaðu hóp og bættu við útgjaldinu sem þú hefur ætlað að ganga frá. Ekki viss hvað gerist næst? Sjáðu [hvernig þetta virkar](page:how-it-works) eða skoðaðu [hvað ókeypis nær yfir](page:pricing)."
  button: "Stofna ókeypis aðgang"
problem:
  heading: "Ekki er allt 50/50"
  body: "Leigan fer eftir stærð herbergisins. Gjöfin fer eftir því hver lofaði hverju. Kvöldverðurinn fer eftir því hver var eftir í eftirréttinn. Að skipta reikningi í tvennt gengur þar til kemur að fyrsta reikningnum sem er ekki þannig, og þá opnar einhver töflureikni. Side Badger skráir hver greiddi, hverjir deildu kostnaðinum og hvernig hann skiptist, svo staðan verði rétt án þess að nokkur þurfi að reikna á blaði við borðið."
workflow:
  heading: "Útgjaldi bætt við, frá upphafi til enda"
  steps:
    - title: "Segðu hver greiddi og fyrir hvað"
      body: "Sláðu inn upphæðina, stutta lýsingu og þann sem greiddi. Einn greiðir fyrir hvert útgjald, sem heldur reikningnum heiðarlegum."
      shot: S05
      shotAlt: "Útgjaldaeyðublað með sumarbústaðarleigu skipt í prósentum milli þriggja manna"
    - title: "Veldu skiptinguna"
      body: "Veldu jafnt, nákvæmar upphæðir eða prósentur. Prósentur verða að ná samtals 100 og nákvæmar upphæðir verða að ná heildarupphæðinni."
      shot: S06
      shotAlt: "Útgjaldaeyðublað með nákvæmum upphæðum fyrir hvern og einn vegna gjafar"
    - title: "Bættu við sögunni"
      body: "Settu dagsetningu og bættu við merkjum, stað og athugasemd. Allir í hópnum sjá sömu upplýsingar og geta skrifað athugasemd beint þar."
      shot: S08
      shotAlt: "Útgjald með upplýsingum sínum, athugasemdaþræði og upphaflegu upphæðinni sem það var skráð með"
    - title: "Bentu á það ef eitthvað lítur undarlega út"
      body: "Ef hópurinn hefur kveikt á spurningum um útgjöld getur hver sem tekur þátt í útgjaldi dregið það í efa, og útgjaldalistinn getur sýnt aðeins þau sem eru dregin í efa."
      shot: S18
      shotAlt: "Útgjaldalisti með merkinu Dregið í efa og síunni Aðeins dregið í efa"
options:
  heading: "Þrjár leiðir til að skipta"
  items:
    - title: "Jafnt"
      body: "Sjálfgefið fyrir kvöldverði, leigubíla og allt sem allir deildu jafnt. Ef heildin skiptist ekki hreint fer afgangseyririnn til eins af handahófi, ekki alltaf sama aðilans. Í leigubílnum hér að neðan er það Ana."
    - title: "Eftir nákvæmum upphæðum"
      body: "Sláðu inn hvað hver og einn skuldar. Gott fyrir gjöfina þar sem allir völdu mismunandi verð, eða búðina þar sem körfa eins innihélt meira en sameiginlegu matvörurnar. Upphæðirnar verða að ná heildarupphæðinni."
    - title: "Í prósentum"
      body: "Gefðu hverjum og einum hlut af heildinni. Leiga eftir stærð herbergja er klassíska dæmið, þar sem stærsta herbergið borgar stærsta hlutinn og enginn þykist annað."
