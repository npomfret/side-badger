faq:
  heading: "Domande sulla villa"
  items:
    - q: "E se qualcuno si ritira?"
      a: "Togli le sue notti, rifai i conti e modifica la spesa della villa in modo che gli importi esatti sommino di nuovo al prezzo. La versione precedente viene conservata e la modifica compare nell'attività del gruppo, quindi nessuno cambia un numero di nascosto. Chi può modificare dipende dai permessi del gruppo."
    - q: "Chi ha prenotato dovrebbe pagare meno?"
      a: "Lo decide il gruppo. Prenotare è una seccatura, e i gruppi non la pensano tutti allo stesso modo su uno sconto in cambio. Qualunque cosa concordiate, mettetela negli importi esatti e scrivetela in una nota sulla spesa, o in un commento accanto, così nessuno deve ricordarsi l'accordo."
    - q: "Possiamo dividere le spese di pulizia in modo diverso?"
      a: "Sì. Inserisci la tariffa come spesa a parte e dalle una divisione tutta sua. Dividere in parti uguali va bene per un costo fisso per tutta la casa. Gli importi esatti vanno bene per un gruppo che vuole che anche la tariffa segua le notti."
