sections:
  - heading: Cosa fa bene Splitwise
    body: "Se al tuo gruppo servono un'app nativa, l'uso offline o i pagamenti dentro l'app, Splitwise è la scelta sensata, e preferiamo che tu lo scelga piuttosto che lo scopra dopo. Le sue pagine elencano:"
    items:
      - "**App e uso offline.** App per iPhone e Android oltre al web, e una modalità offline."
      - "**Più modi di dividere.** Quote, aggiustamenti e divisioni per voce, oltre a parti uguali, importi esatti e percentuale."
      - "**Spese ricorrenti.** Imposta l'affitto perché si ripeta e dimenticatene."
      - "**Pagamenti nell'app.** In alcuni paesi può anche spostare il denaro, tramite Splitwise Pay, Venmo, PayPal o Pay by Bank."
  - heading: Gratis qui, a pagamento là
    body: "Splitwise Pro è il piano a pagamento di Splitwise, e la sua pagina Pro vende quattro cose che in Side Badger non costano nulla."
    items:
      - "**Scansione degli scontrini.** Splitwise Pro scansiona la foto del tuo scontrino. Side Badger lo fa gratis, senza crediti di scansione: compila totale, data e luogo perché tu li controlli. Le immagini degli scontrini vengono lette dal servizio di IA di Google."
      - "**Conversione di valuta.** Splitwise Pro converte le spese di un gruppo nella tua valuta predefinita quando tocchi Converti. Side Badger converte ogni spesa mentre la inserisci, a un tasso di cambio attuale o a quello che hai davvero ottenuto, e l'importo originale resta sulla spesa."
      - "**Niente pubblicità.** Splitwise elenca un'esperienza totalmente priva di pubblicità tra le funzioni Pro. Side Badger non ha pubblicità."
      - "**Nessun limite giornaliero.** Splitwise Pro vende spese illimitate, e il suo centro assistenza dice che gli utenti gratuiti possono aggiungere fino a 4 spese al giorno. Side Badger non ha limiti giornalieri."
  - heading: Cosa ha Splitwise e Side Badger no
    body: "Non sono tutte le funzioni di Splitwise, solo quelle che di solito decidono la scelta. L'elenco completo è nelle pagine di Splitwise. Ecco dove Side Badger è carente."
    items:
      - "**App native.** Side Badger funziona nel browser. Accedi, poi aggiungilo alla schermata Home e si apre come un'app."
      - "**Modalità offline.** Side Badger ha bisogno di una connessione."
      - "**Pagamenti nell'app.** Side Badger non tocca mai i tuoi soldi. Pagatevi come vi fa più comodo, poi registrate il pagamento."
      - "**Spese ricorrenti.** Side Badger non ne ha. Copia l'affitto del mese scorso invece di riscriverlo."
      - "**Dividere per quote o per voce.** Side Badger ha un solo pagatore per spesa, divisa in parti uguali, per importi esatti o per percentuale. La sua scansione degli scontrini non assegna le voci alle persone."
      - "**Grafici e divisioni predefinite.** Splitwise Pro ha entrambi. Side Badger tiene il conto di chi deve cosa a chi, e il trucco è tutto lì."
  - heading: Portare qui il tuo gruppo
    body: "Non esiste un importatore, quindi il trasloco è un nuovo inizio. Prima salda i conti in Splitwise, poi crea un gruppo in Side Badger e invita tutti con un link o un codice QR. Ognuno nel gruppo ha bisogno di un account gratuito, e per registrarsi basta un indirizzo email."
