featuresHeading: Etxe batek erabiltzen dituen ezaugarriak
faq:
  heading: Galderak
  items:
    - q: Alokairua automatikoki errepika al daiteke?
      a: Ez, ez dago faktura errepikaririk. Kopiatu joan den hilabeteko alokairua ukitu pare batean, aldatu data eta kitto.
    - q: Gelen tamainaren arabera banatu dezakegu?
      a: Bai, ehunekoen arabera. Eman etxekide bakoitzari bere gelari dagokion zatia, zatiek 100 batzen duten bitartean. [Gastuak banatzea](page:feature/split-expenses) orriak beste banatzeko moduak azaltzen ditu.
    - q: Zer gertatzen da etxekide bat zorrarekin kanpora joaten bada?
      a: Ezin du taldea utzi kitatu arte, inork ezin duelako taldea utzi zor duen edo zor zaion bitartean. Zenbakiak zintzo geratzen dira denak kitatuta egon arte.
    - q: Side Badger-ek fakturak ordaintzen al ditu?
      a: Ez. Kontua eramaten du eta ordainketa-zerrenda labur bat proposatzen du. Zuek ordaintzen duzue nahi duzuen moduan, eta gero erregistratu, [kitatzeak](page:feature/settle-up) azaltzen duen bezala.
    - q: Etxekide batek kontuak eraman al ditzake?
      a: Bai. Egin administratzaile eta erabili kudeatutako talde bat, non kide berriek onarpena behar duten eta sortzaileek eta administratzaileek bakarrik alda ditzaketen gastuak.
