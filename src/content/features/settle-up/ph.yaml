sections:
  - heading: Magtala ng bayad
    body: Kapag may nagbayad, itala ito sa tamang tao. Pinupunan ng mga quick-settle button ang halaga mula sa mga iminungkahing bayad mo, at puwede kang magdagdag ng tala gaya ng “bank transfer” (hanggang 500 character). Kung bahagi lang ng utang ang bayaran mo, mananatili ang natitira sa balanse. Kung sobra o kulang ang inilagay mo, bibigyan ka ng babala ng Side Badger bago mag-save. Kailangan ng pahintulot na mag-edit ng mga gastos para makapagtala ng bayad, at hindi puwedeng nasa hinaharap ang petsa.
  - heading: Nagbayad sa ibang pera?
    body: Nananatili ang mga balanse sa perang ginamit sa pagbayad, kaya nananatiling utang na euro ang utang na euro. May utang na euro, magbabayad sa pounds? Puwede. Kapag nagtatala ka ng bayad, puwede mo rin itong i-convert, sa kasalukuyang exchange rate o sa rate na aktuwal mong nakuha. Nakapirmi ang rate kapag na-save ang bayad. Ipinapaliwanag ng [maraming pera](page:feature/multiple-currencies) kung paano gumagana ang conversion, at ipinapakita ng [group trip](page:use-case/group-trips) ang paggamit nito.
  - heading: Kasaysayang masusuri mo
    body: Nananatili sa kasaysayan ng grupo ang bawat naitalang bayad kasama ang petsa, halaga, at tala. Ang taong nagtala lang ng bayad ang makakapag-edit nito, at siya o admin ng grupo ang makakapagbura. Naka-lock ang bayad na kinasasangkutan ng taong umalis na sa grupo. Para sa halimbawa ng housemates, tingnan ang [housemates](page:use-case/housemates).
limits:
  heading: Ang hindi ginagawa ng Side Badger
  items:
    - Hindi naglilipat ng pera ang Side Badger, at hindi ito nagpapadala ng payment link o payment request. Ang bayad sa app ay talâ ng bayad na ginawa sa ibang lugar.
    - Galing ang mga iminungkahing bayad sa simpleng paraan ng pagtutugma, na ginagawa sa bawat pera. Palagi itong nagmumungkahi ng mas kaunting bayad kaysa sa bilang ng taong may balanse sa perang iyon (apat na tao, tatlong bayad ang pinakamarami), pero hindi nito laging nahahanap ang pinakamaliit na posibleng bilang.
    - Hindi mo mapapatay ang mga mungkahi. Inilista ng **Ipakita lahat** ang bawat iminungkahing bayad sa grupo, hindi lang sa iyo.
    - Hindi kailanman pinagbabawas ang mga pera sa isa't isa maliban kung na-convert ang mga gastos nang ilagay ang mga ito.
    - Walang mga paalala, kaya ikaw pa rin ang maniningil ng bayad.
useCasesHeading: Saan mahalaga ang pag-settle up
faq:
  heading: Mga tanong
  items:
    - q: Ipinapadala ba ng Side Badger ang pera?
      a: Hindi. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad sa Side Badger para mag-update ang balanse.
    - q: Puwede ko bang patayin ang mga iminungkahing bayad?
      a: Hindi. Nananatiling naka-on ang pagpapasimple, at inilista ng **Ipakita lahat** ang bawat iminungkahing bayad sa grupo, hindi lang ang kinasasangkutan mo.
    - q: Bakit magkahiwalay ang euro at pounds?
      a: Nananatili ang mga balanse sa perang ginamit mo sa pagbayad maliban kung nag-convert ka nang ilagay ang gastos o bayad. Hindi kailanman pinagbabawas ang mga utang sa magkakaibang pera.
    - q: Paano kung bahagi lang ng utang ang bayaran ng isang tao?
      a: Itala ang bahaging binayaran. Mananatili ang natitira sa balanse hanggang mabayaran ito.
    - q: Ito ba palagi ang pinakamaliit na posibleng bilang ng bayad?
      a: Hindi garantisado. Palagi itong nagmumungkahi ng mas kaunting bayad kaysa sa bilang ng taong may balanse sa perang iyon, kaya sa apat na tao, hindi ito hihigit sa tatlo. Sa halimbawa ng housemates, dalawang bayad iyon, samantalang anim ang kailangan kapag binayaran nang direkta ang bawat tao.
