featuresHeading: "वे फीचर्स जो एक कपल इस्तेमाल करता है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या हम सब कुछ के लिए एक बार 60/40 सेट कर सकते हैं?"
      a: "नहीं। बंटवारा हर खर्च का अपना होता है। पहले खर्च पर प्रतिशत सेट करें, फिर अगली बार उसे कॉपी करें और जो अलग है उसे बदलें। [खर्च बांटना](page:feature/split-expenses) बांटने के तीनों तरीके बताता है।"
    - q: "क्या यह हमारे बैंक से जुड़ता है?"
      a: "नहीं। Side Badger आपके पैसों को कभी नहीं छूता। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं, फिर उसे रिकॉर्ड करते हैं, जैसा [हिसाब चुकता करना](page:feature/settle-up) समझाता है।"
    - q: "क्या हमारा ग्रुप कोई और देख सकता है?"
      a: "सिर्फ उसके सदस्य, और कपल के ग्रुप में दो होते हैं। चालू इनवाइट लिंक इस्तेमाल करने वाला कोई भी जुड़ सकता है, इसलिए उसे एक ही व्यक्ति के साथ साझा करें और छोटी एक्सपायरी दें।"
    - q: "अगर हम दोनों ने एक ही बिल का अलग-अलग हिस्सा दिया हो तो?"
      a: "एक खर्च का एक ही पेमेंट करने वाला होता है। दो खर्च दर्ज करें, आप दोनों में से हर एक के लिए एक, और बैलेंस वही निकलता है।"
    - q: "क्या यह मेरे पार्टनर को पेमेंट की याद दिलाएगा?"
      a: "नहीं। कोई रिमाइंडर नहीं हैं, इसलिए याद दिलाने का काम अब भी आपका है। कम से कम आप दोनों एक ही संख्या देख रहे होंगे।"
    - q: "जब हम खर्च साझा करना बंद कर दें तो क्या होता है?"
      a: "बैलेंस चुकता करें और पेमेंट रिकॉर्ड करें, ताकि किसी का कुछ बकाया न रहे। फिर कोई एडमिन ग्रुप लॉक कर सकता है, जिससे संख्याएं जैसी हैं वैसी रहती हैं, या उसे हमेशा के लिए बंद कर सकता है, जिससे वह सबके लिए पहुंच से बाहर हो जाता है। उसे तभी बंद करें जब आप दोनों में से किसी को हिस्ट्री की ज़रूरत न हो।"
