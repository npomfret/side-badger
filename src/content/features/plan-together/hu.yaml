faq:
  heading: "Kérdések"
  items:
    - q: "Lehetnek névtelenek a szavazatok?"
      a: "Igen. Kapcsold be a **Névtelen szavazás** opciót a szavazás létrehozásakor, és elrejti, ki mire szavazott. Az első szavazat előtt döntsd el, mert utána már nem módosítható."
    - q: "Lezárulhat egy szavazás magától?"
      a: "Nem. A szavazásnak nincs határideje, ezért aki létrehozta, a **Szavazás lezárása** lehetőséget választja, amint a csoport döntött. Ha a csoport meggondolja magát, a **Szavazás újranyitása** visszahozza."
    - q: "Hány tételt tárolhat egy lista?"
      a: "Listánként legfeljebb 200 tételt, csoportonként pedig legfeljebb 100 listát. Minden tétel legfeljebb 500 karakter lehet, ami rengeteg zabtej."
    - q: "Ki zárhat le egy kérdést, és mi történik közben a költséggel?"
      a: "Az, aki kérdezett, vagy egy csoportadminisztrátor. Amíg egy kérdés nyitva van, az egész költség kint van mindenki egyenlegéből. Visszakerül, amikor az utolsó nyitott kérdést is lezárják rajta, vagy amikor egy szerkesztés kiveszi a költségből azt, aki kérdezett."
    - q: "Használhatom a listákat és a kommenteket teendőlistaként vagy csoportos csevegésként?"
      a: "Nem. A kommentek, listák és szavazások a csoport pénzéről szólnak, ahogy a [feltételek](page:terms) kérik. Gondolj bevásárlólistákra, költségvetési szavazásokra és a „miért 45 £ ez?” kérdésre."
    - q: "Küld nekem e-mailt a Side Badger a tevékenységről?"
      a: "Nem. Tevékenységről nincsenek e-mail- vagy SMS-értesítések. Bekapcsolhatod a push-értesítéseket az egyes eszközökön, az alkalmazás értesítési csengője pedig megmutatja, mi új."
