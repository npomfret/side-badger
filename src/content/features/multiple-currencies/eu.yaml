meta:
  title: "Banatu kostuak 140 monetatan, bihurtuta edo bereizita"
  description: "Sartu gastu bakoitza ordaindu zenuen monetan, mantendu saldoak bereizita edo bihurtu ikus eta alda dezakezun tasa batean, eta gero kitatu ordainketa-zerrenda labur batekin."
h1: Banatu kostuak 140 monetatan
navLabel: Moneta anitz
lead: Euroak, yenak, eta baht-etan ordaindutako taxi hura. Side Badger-ek gastu bakoitza ordaindu zenuen monetan hartzen du, saldoak ordenatuta mantentzen ditu, eta bihur dezake zure taldeak behingoz kitatu nahiago duenean. 140 monetatan funtzionatzen du, eta [taldeko bidaietarako](page:use-case/group-trips) oso egokia da.
cta:
  heading: Ekarri zure euroak, ekarri zure yenak
  body: Sortu kontu bat, hasi talde bat eta gehitu lehen gastua eskuan zenuen monetan.
  button: Sortu doako kontu bat
problem:
  heading: Sartu ordaindu zenuen bezala
  body: Bidaia bat gutxitan ordaintzen da moneta bakarrean. Hotela etxetik erreserbatu zen libera esterlinetan, afaria yenetan ordaindu zen, eta aireportuko kafea geldialdiak erabiltzen zuen monetan. Dena eskuz bihurtzea sartu ahal izan aurretik da kalkulu-orriak abandonatzen diren modua. Side Badger-en gastu bakoitza tiketan dagoen monetan sartzen duzu, eta zenbateko bakoitzak bere monetaren arauak jarraitzen ditu, beraz yenek ez dute hamartarrik eta dinarrek hiru dituzte. Azkenaldian erabilitako monetak zerrendan lehenengo agertzen dira.
workflow:
  heading: Mantendu monetak bereizita, edo bihurtu joan ahala
  steps:
    - title: Gehitu gastua bere monetan
      body: Aukeratu monetak, idatzi zenbatekoa, esan nork ordaindu duen eta nork partekatu duen. Ez da besterik behar. Hau da lehenetsia, eta jatorrizko zenbatekoa sartu zenuen bezala gordetzen du.
      shot: S07
      shotAlt: Yen-zenbateko bat sartuta duen gastu-formularioa
    - title: Ikusi saldo bat moneta bakoitzeko
      body: Saldoak moneta bakoitzeko bereizita gordetzen dira, eta bakoitzak proposatutako ordainketen zerrenda labur propioa du. Libera esterlinak libera esterlinetan kitatzen dira eta yenak yenetan.
      shot: S10
      shotAlt: Bi monetatako zor sinplifikatuak dituen saldoen pantaila
    - title: Edo bihurtu, taldeak behingoz kitatu nahiago duenean
      body: Aukeratu beste moneta bat gastua sartzean eta Side Badger-ek egungo kanbio-tasa batean bihur dezake, eta benetan lortu zenuen tasara alda dezakezu. Bihurtutako zenbatekoa moneta horretako saldoan sartzen da. Bihurketa taldeak hartzen duen erabaki bat da, ez zure bizkar atzean gertatzen den zerbait.
options:
  heading: Ikus eta alda dezakezun tasa
  items:
    - title: Tasa ikusten da
      body: Bihurtzen duzunean, tasa eta bihurtutako zenbatekoa formularioan agertzen dira, beraz inork ez du zenbaki bat fedez onartu behar.
    - title: Idatzi zurea
      body: Kanbio-bulego batean tasa hobea lortu duzu, edo aireportuan txarragoa? Editatu tasa benetan lortu zenuenera eta bihurtutako zenbatekoa eguneratzen da.
    - title: Jatorrizkoa geratzen da
      body: Jatorrizko zenbatekoa gastuan geratzen da, bihurtutakoaren ondoan, yenetan zenbat zen galdetzen duenarentzat.
    - title: Bihurtzea doakoa da
      body: Bihurtzeak ez du ezer kostatzen. Ez dago komisiorik gastu bat beste moneta batean sartzeagatik.
