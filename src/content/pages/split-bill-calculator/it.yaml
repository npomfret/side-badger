faq:
  heading: Domande
  items:
    - q: Il calcolatore è gratuito?
      a: Sì. Gratis. Niente pubblicità. Nessun limite giornaliero. E non ti serve nemmeno un account.
    - q: Salva quello che scrivo?
      a: No. Non viene salvato né inviato da nessuna parte. Per conservare i tuoi numeri, usa Copia link e tieni il link da qualche parte.
    - q: Chi può vedere il link che copio?
      a: "Chiunque ce l'abbia. I numeri sono nel link stesso, dopo il #, quindi condividilo solo con chi deve vederli."
    - q: Sposta denaro?
      a: No. Calcola chi dovrebbe pagare chi, e voi vi pagate come vi fa più comodo. Nemmeno Side Badger tocca mai i tuoi soldi. Vedi [saldare i conti](page:feature/settle-up).
    - q: Posso dividere un viaggio pagato in due valute?
      a: Qui no, perché un calcolo ha una sola valuta. In un gruppo, ogni valuta ha il suo saldo. Vedi [più valute](page:feature/multiple-currencies).
    - q: E se gli importi non tornano?
      a: Il calcolatore lo dice sotto la spesa e non mostra nessun risultato finché non tornano. Gli importi esatti devono sommare al totale e le percentuali devono fare 100.
