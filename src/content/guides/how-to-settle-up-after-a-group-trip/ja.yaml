faq:
  heading: よくある質問
  items:
    - q: 支払いを記録するのは、支払った人と受け取った人のどちらですか？
      a: 支払いの記録には支出を編集する権限が必要で、フォームでは「**誰が支払いましたか？**」と「**誰が支払いを受け取りましたか？**」を尋ねられます。あとから編集できるのは記録した本人だけなので、たいていは支払った人がクイック精算ボタンを使って記録するのがいちばん簡単です。
    - q: 旅行が2つの通貨にまたがっていたら？
      a: 残高は通貨ごとに管理されるので、入力時に換算した場合を除き、ユーロの債務はユーロのままで、通貨ごとにそれぞれ短いリストができます。[複数通貨の旅行](page:guide/how-to-split-a-trip-paid-in-several-currencies)では、両方のやり方を紹介しています。
    - q: 精算は旅行中と最後のどちらがいいですか？
      a: どちらでも構いません。記録された支払いはすべて残高に反映されるので、旅行中に行った支払いも、最終的なリストに反映されます。最後のほうが簡単です。[旅行全体](page:use-case/group-trips)が1か所にそろっているからです。
