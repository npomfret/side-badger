meta:
  title: "Slik deler du husleien etter romstørrelse | Side Badger"
  description: "Større rom, større andel. Sett av fellesrommene, del resten etter gulvareal og legg inn prosentene én gang. Regnestykket vist for tre romkamerater."
h1: "Slik deler du husleien etter romstørrelse"
navLabel: "Husleie etter romstørrelse"
lead: "Bestem hvor mye av husleien som går til fellesrommene, og del den delen likt. Del resten etter gulvarealet i hvert soverom. Rund av til hele prosenter, legg dem inn på husleien i Side Badger én gang, og kopier utgiften hver måned."
cta:
  heading: "Få husleien inn én gang"
  body: "Opprett en gratis konto, start en gruppe for leiligheten og legg inn husleien med prosentene dere ble enige om. Neste måned er en kopi. Vil du ha omvisningen først? Se [hvordan det fungerer](page:how-it-works) eller [hva gratis dekker](page:pricing)."
sections:
  - heading: "Tre personer, én leilighet, én krangel"
    body: "Priya, Tom og Aisha deler en leilighet til 1 950 £ i måneden. I ett år delte de den på tre, fordi det var enkelt. Så målte Aisha soverommet sitt. Priyas rom er 16 m², Toms er 12 m² og Aishas er 10 m², så Aisha betalte det samme som Priya for et rom som var mer enn en tredjedel mindre. Ingen hadde vært urimelige. Ingen hadde gjort regnestykket. Over en takeaway ble de enige om én regel først. Av husleien betaler 40% for kjøkkenet, badet og stua, som alle tre bruker."
  - heading: "Metoden, med regnestykket vist"
    body: "Fire steg, ett målebånd og en lommekalkulator på mobilen."
    items:
      - "**Sett av den felles delen.** Gruppen blir enig om hvor stor andel av husleien som går til rommene alle bruker. For leiligheten er det 40%, som blir 13,33% hver mellom tre personer."
      - "**Del resten etter gulvareal.** De andre 60% går etter soveromsstørrelse. Soverommene utgjør til sammen 38 m² (16 + 12 + 10), så Priyas del er 60% × 16/38, som er 25,26%."
      - "**Legg sammen de to delene.** Priya: 25,26% + 13,33% = 38,6%. Tom: 60% × 12/38 = 18,95%, pluss 13,33% blir 32,3%. Aisha: 60% × 10/38 = 15,79%, pluss 13,33% blir 29,1%."
      - "**Rund av og kontroller.** Hele prosenter er enklere å taste inn og å krangle om, så 38,6% blir 39%, 32,3% blir 32% og 29,1% blir 29%. Kontroller at 39 + 32 + 29 er 100. Hvis avrundingen ender på 99 eller 101, avgjør gruppen hvem sin andel som flyttes ett poeng."
  - heading: "Slik ser leilighetens måned ut"
    body: "Husleie på 39%, 32% og 29% blir 760,50 £, 624,00 £ og 565,50 £. Priya betalte utleieren, så over måneden har hun 1 142,50 £ til gode, mens Tom skylder 566,00 £ og Aisha skylder 576,50 £. Side Badger foreslår to betalinger, begge til Priya."
  - heading: "Sett det opp i Side Badger"
    body: "Én kveld, mesteparten brukt på å diskutere de 40%."
    items:
      - "**Lag gruppen.** På oversikten velger du **Opprett gruppe** og gir den navn etter leiligheten. Velg **Inviter andre** og send lenken eller QR-koden. Alle logger inn eller oppretter en gratis konto, og velger navnet de vil vises med i denne gruppen."
      - "**Legg til husleien.** Velg **Legg til utgift**. Skriv inn beskrivelse og beløp, og under **Hvem betalte?** velger du den som betalte utleieren. La alle tre stå under **Fordel mellom**, og velg så **Prosent** under **Hvordan fordele** og skriv 39, 32 og 29. Skjemaet varsler hvis prosentene ikke summerer seg til 100. Velg **Lagre utgift**."
      - "**Legg til regningene.** Strøm og bredbånd er egne utgifter med hver sin betaler. La **Hvordan fordele** stå på **Likt**."
      - "**Kopier den neste måned.** Åpne forrige måneds husleie og velg **Kopier utgift**. Kopien beholder betaleren, beløpet og fordelingen, og får dagens dato. Endre beløpet hvis husleien har endret seg, og velg så **Opprett kopi**."
      - "**Sjekk hvem som skylder hvem.** Delen **Saldoer** viser det. Betal hverandre slik dere vil, og registrer så betalingen under **Gjør opp**."
  - heading: "Rom med eget bad, kott og folk som flytter"
    items:
      - "**Rom med eget bad og kott.** Gulvareal er et utgangspunkt. Et rom med eget bad er verdt mer enn samme areal uten, og et kott som rommer en seng og en stol med store forhåpninger er verdt mindre. Juster prosentene etter avtale, kontroller at de fortsatt summerer seg til 100, og skriv de endelige tallene ned et sted hele leiligheten ser dem."
      - "**Noen flytter ut midt i måneden.** Regn ut hva hver person skylder for den måneden, og legg inn den månedens husleie med **Eksakte beløp** i stedet for **Prosent**. Beløpene må summere seg til husleien. Gjør det før vedkommende drar. Ingen kan forlate en gruppe mens de skylder eller har penger til gode, og en utgift som involverer noen som har forlatt gruppen, blir skrivebeskyttet."
      - "**Noen flytter inn.** Mål på nytt, gjør regnestykket om med de nye romstørrelsene og bruk de nye prosentene fra neste husleie. Tidligere måneder blir stående som de var."
  - heading: "Hva Side Badger ikke gjør her"
    items:
      - "Den måler ikke rommene dine og velger ikke prosentene. Gulvarealene og de 40% må gruppen bli enig om."
      - "Den har ingen gjentakende regninger, så du kopierer forrige måneds husleie hver gang."
      - "Den flytter aldri penger og betaler ikke utleieren. Dere betaler hverandre slik dere vil, og registrerer det."
      - "Den vet ikke hva leiekontrakten din sier. Den holder regnskapet mellom personene i gruppen."
