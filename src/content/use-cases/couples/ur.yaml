featuresHeading: "وہ خصوصیات جو جوڑا استعمال کرتا ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا ہم 60/40 ایک بار سب کے لیے طے کر سکتے ہیں؟"
      a: "نہیں۔ تقسیم ہر خرچے کی ہوتی ہے۔ پہلے پر فیصد طے کریں، پھر اگلی بار اسے کاپی کریں اور جو مختلف ہو وہ بدلیں۔ [اخراجات کی تقسیم](page:feature/split-expenses) تقسیم کے تینوں طریقے بتاتا ہے۔"
    - q: "کیا یہ ہمارے بینک سے جڑتا ہے؟"
      a: "نہیں۔ Side Badger آپ کے پیسوں کو کبھی ہاتھ نہیں لگاتا۔ آپ جیسے چاہیں ایک دوسرے کو ادا کرتے ہیں، پھر اسے ریکارڈ کرتے ہیں، جیسا کہ [حساب برابر کرنا](page:feature/settle-up) بتاتا ہے۔"
    - q: "کیا ہمارا گروپ کوئی اور دیکھ سکتا ہے؟"
      a: "صرف اس کے ارکان، اور جوڑے کے گروپ میں دو ہوتے ہیں۔ فعال دعوتی لنک استعمال کرنے والا کوئی بھی شامل ہو سکتا ہے، اس لیے اسے ایک شخص سے شیئر کریں اور مختصر میعاد رکھیں۔"
    - q: "اگر ہم دونوں نے ایک ہی بل کا حصہ ادا کیا ہو تو؟"
      a: "ایک خرچے کا ایک ہی ادا کرنے والا ہوتا ہے۔ دو اخراجات ریکارڈ کریں، ہر ایک کے لیے ایک، اور بیلنس وہی نکلتا ہے۔"
    - q: "کیا یہ میرے ساتھی کو ادائیگی یاد دلائے گا؟"
      a: "نہیں۔ یاد دہانیاں نہیں ہیں، اس لیے یاد دلانا اب بھی آپ کا کام ہے۔ کم از کم آپ دونوں ایک ہی عدد دیکھ رہے ہوں گے۔"
    - q: "جب ہم اخراجات بانٹنا بند کر دیں تو کیا ہوتا ہے؟"
      a: "بیلنس کا حساب برابر کریں اور ادائیگی ریکارڈ کریں، تاکہ کسی کے ذمے کچھ نہ رہے۔ پھر ایڈمن گروپ کو لاک کر سکتا ہے، جو اعداد جوں کے توں رکھتا ہے، یا ہمیشہ کے لیے بند کر سکتا ہے، جس سے وہ سب کے لیے ناقابل رسائی ہو جاتا ہے۔ اسے تب ہی بند کریں جب آپ میں سے کسی کو تاریخ کی ضرورت نہ ہو۔"
