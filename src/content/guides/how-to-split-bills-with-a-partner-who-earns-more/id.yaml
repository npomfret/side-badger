meta:
  title: "Bagi tagihan saat pasangan berpenghasilan lebih besar | Side Badger"
  description: "50/50 jadi canggung kalau penghasilan salah satu jauh lebih besar. Bagi tagihan bersama menurut penghasilan, hitungan untuk dua orang, tanpa spreadsheet."
h1: "Cara membagi tagihan dengan pasangan yang berpenghasilan lebih besar"
navLabel: "Pasangan bergaji lebih besar"
lead: "Jumlahkan gaji bersih Anda berdua, hitung bagian tiap orang dari totalnya, lalu bulatkan ke persentase bulat. Gaji bersih Maya £2.800 dan Jon £1.700, jadi mereka membagi tagihan bersama 62/38. Masukkan persentase itu pada pengeluaran bersama di Side Badger, lalu salin setiap kali tagihan yang sama datang lagi."
cta:
  heading: "Hitung sekali saja"
  body: "Buat akun gratis, buat grup untuk berdua, dan masukkan sewa dengan persentase Anda. Sewa bulan depan tinggal salinan. Ingin melihat gambaran dulu? Lihat [cara kerja](page:how-it-works) atau [apa saja yang gratis](page:pricing)."
sections:
  - heading: "Dua gaji, satu apartemen, satu keheningan yang sopan"
    body: "Maya dan Jon tinggal bersama. Maya membawa pulang £2.800 sebulan dan Jon membawa pulang £1.700. Selama dua tahun mereka membagi segalanya 50/50, karena itu sederhana dan tak ada yang mau jadi orang yang mengungkitnya. Lalu Jon melihat sewa saja. Separuh dari £1.400 adalah £700, yaitu seperempat gaji bersih Maya dan 41% gaji bersih Jon. Tak ada yang berlaku tidak adil. Tak ada yang menghitung. Banyak [pasangan](page:use-case/couples) akhirnya sampai di titik ini. Sambil menyantap makanan bungkus, mereka sepakat bahwa tagihan bersama sebaiknya menggerogoti porsi yang kurang lebih sama dari tiap gaji."
  - heading: "Metodenya, lengkap dengan hitungannya"
    body: "Empat langkah, satu kalkulator, dan satu percakapan yang memang akan terjadi juga."
    items:
      - "**Sepakati apa yang dihitung sebagai penghasilan.** Maya dan Jon memakai gaji bersih, uang yang masuk ke rekening tiap bulan. Bersama-sama itu £2.800 + £1.700 = £4.500."
      - "**Hitung bagian masing-masing.** Bagian Maya adalah 2.800 ÷ 4.500, yaitu 62,2%. Bagian Jon adalah 1.700 ÷ 4.500, yaitu 37,8%."
      - "**Bulatkan ke persentase bulat.** 62,2% menjadi 62 dan 37,8% menjadi 38. Dengan dua orang, bulatkan satu angka lalu kurangkan dari 100 untuk mendapat yang lain, sehingga totalnya selalu 100."
      - "**Periksa artinya.** Pada sewa £1.400, Maya membayar £868 (62%) dan Jon membayar £532 (38%). Itu sekitar 31% dari gaji bersih masing-masing. Jika dibagi dua sama rata, porsinya 25% dari gaji Maya dan 41% dari gaji Jon."
  - heading: "Membaca satu bulan"
    body: "Maya membayar sewa £1.400 dan Jon membayar sisanya, £216. Bagian Maya untuk bulan itu adalah £868,00 + £111,60 + £18,00 = £997,60, dan ia membayar £1.400, jadi ia dihutangi £402,40. Bagian Jon adalah £532,00 + £68,40 + £18,00 = £618,40, dan ia membayar £216, jadi ia berutang £402,40. Side Badger menyarankan satu pembayaran, Jon kepada Maya, sebesar £402,40, dan [pelunasan](page:feature/settle-up) mencatatnya setelah pembayaran dilakukan. Jika dibagi 50/50, bulan yang sama akan membuat Jon membayar Maya £592,00."
  - heading: "Siapkan di Side Badger"
    body: "Sepuluh menit, sebagian besar untuk membahas persentase."
    items:
      - "**Buat grupnya.** Di dasbor pilih **Buat Grup** dan beri nama sesuai apartemennya. Pilih **Undang Orang Lain** dan kirim tautan atau kode QR kepada Jon. Ia masuk atau membuat akun gratis, lalu memilih nama yang ingin ia tampilkan di grup ini. Hanya anggota yang bisa melihat sebuah grup, jadi grup ini hanya untuk Anda berdua."
      - "**Tambahkan sewa.** Pilih **Tambah Pengeluaran**. Isi deskripsi dan jumlahnya, lalu di bawah **Siapa yang membayar?** pilih Maya. Biarkan kedua orang tetap di bawah **Dibagi antara**, lalu di bawah **Cara membagi** pilih **Persentase** dan ketik 62 dan 38. Formulir memberi tanda jika total persentasenya bukan 100. Pilih **Simpan Pengeluaran**."
      - "**Tambahkan tagihan lainnya.** Tagihan energi dan internet dimasukkan dengan cara yang sama, dengan Jon sebagai pembayar dan angka 62 dan 38 yang sama. Makanan bungkus adalah pengeluaran tersendiri, dengan **Cara membagi** dibiarkan di **Rata**."
      - "**Salin bulan depan.** Buka sewa bulan lalu dan pilih **Salin pengeluaran**. Salinannya mempertahankan pembayar, jumlah, dan pembagiannya, lalu memakai tanggal hari ini. Ubah jumlahnya jika sewa berubah, kemudian pilih **Buat Salinan**. Tagihan energi bekerja dengan cara yang sama."
      - "**Periksa siapa berutang kepada siapa.** Bagian **Saldo** menunjukkannya dan menyarankan daftar pembayaran singkat. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya di bawah **Lunasi**."
  - heading: "50/50, menurut penghasilan, atau tagihan demi tagihan"
    body: "Tidak ada jawaban yang benar, hanya jawaban yang bisa Anda berdua terima. Tiga yang umum."
    items:
      - "**Separuh-separuh untuk semuanya.** Yang paling mudah dijaga, dan cocok untuk pasangan yang gajinya hampir sama."
      - "**Menurut penghasilan untuk semua yang dibagi.** Yang dilakukan Maya dan Jon. Satu percakapan, satu pasang persentase."
      - "**Tagihan demi tagihan.** Sewa dan tagihan menurut penghasilan, liburan dan jajan 50/50 atau sesuai kesepakatan lain, dan setiap tagihan mendapat aturan yang cocok untuknya."
  - heading: "Sepakati apa yang dianggap bersama"
    body: "Pertengkaran biasanya soal daftarnya, bukan persentasenya. Sewa, energi, internet, belanja mingguan, dan sofa dianggap bersama di kebanyakan rumah. Keanggotaan gym Maya dan langganan sepak bola Jon mungkin tidak. Sepakati daftarnya sekali, tuliskan, dan masukkan hanya biaya bersama ke grup."
  - heading: "Makanan bungkus tetap 50/50, dengan sengaja"
    body: "Jajan itu kecil dan opsional, dan tak ada yang perlu kalkulator untuk memesan dimsum. Di Side Badger makanan bungkus hanyalah pengeluaran lain. Jon membayar £36, **Cara membagi** tetap di **Rata**, dan masing-masing berutang £18."
  - heading: "Saat penghasilan seseorang berubah"
    body: "Kenaikan gaji, pekerjaan baru, atau cuti dari pekerjaan mengubah hitungannya. Hitung persentase baru dengan cara yang sama dan pakai mulai pengeluaran berikutnya. Pengeluaran sebelumnya tetap seperti semula. Salin sewa bulan lalu, ubah persentasenya, lalu pilih **Buat Salinan**. Untuk memperbaiki pengeluaran yang sudah masuk, ubah pengeluarannya jika izin grup mengizinkan, dan beri tahu pasangan Anda lebih dulu, karena saldo berubah. Versi sebelumnya disimpan. Sepakati kapan Anda akan menghitung ulang, misalnya setahun sekali, dan lunasi sebelum beralih agar pembagian lama ditutup dengan hitungan yang bersih."
  - heading: "Yang tidak dilakukan Side Badger di sini"
    items:
      - "Side Badger tidak pernah menanyakan berapa penghasilan siapa pun dan tidak menghitung persentasenya. Anda mengetik angka yang sudah disepakati."
      - "Side Badger tidak bisa menetapkan pembagian bawaan untuk seluruh grup. Persentase dipasang pada tiap pengeluaran, jadi salin pengeluaran yang sudah memilikinya."
      - "Tidak ada tagihan berulang, jadi Anda menyalin sewa bulan lalu setiap kali."
      - "Side Badger tidak pernah memindahkan uang. Anda saling membayar dengan cara apa pun yang disuka, lalu mencatatnya."
