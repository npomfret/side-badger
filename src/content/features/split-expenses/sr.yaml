sections:
  - heading: "Само особе које су биле тамо"
    body: "Подели трошак међу све или само међу особе које су га делиле. Изостави људе из трошкова у којима нису учествовали и стања ће то одразити. Цимер који је целе недеље био одсутан не дугује за храну за понети, што ће [цимери](page:use-case/housemates) препознати као основну правду."
  - heading: "Детаљи који касније штеде свађе"
    items:
      - "Постави **датум** и по жељи време. Пречице попут данас, јуче, јутрос и синоћ штеде нешто куцања."
      - "Додај до три **ознаке** за груписање трошкова, на пример намирнице или путовања."
      - "Додај **место**. Залепи везу са мапе и назив места попуни се сам."
      - "Додај **напомену** са причом иза броја, уз мало форматирања ако прича то тражи."
      - "Приложи до три **рачуна** као фотографије или PDF, да доказ остане уз трошак."
      - "Користи **коментаре** да разговор остане уз трошак на који се односи, а не у низу порука којем се нико не враћа."
  - heading: "Копирај, измени и види шта се променило"
    body: "Копирај прошломесечну кирију уместо да је поново уписујеш, па промени оно што је другачије. Ако је број био погрешан, измени трошак. Ранија верзија се чува, а измена се приказује у активности групе, па нико не мења број неприметно. Шта ко сме да мења зависи од дозвола групе."
  - heading: "Кад нешто изгледа погрешно"
    body: "Група може да укључи питања о трошковима. Свако ко је укључен у трошак може поставити питање и рећи зашто, а трошак остаје ван стања док га особа која је питала или администратор не затвори. Подразумевано је искључено, а администратор га укључује за групу. Погодно је за [догађаје и прославе](page:use-case/events-and-celebrations), где депозит којег се нико не сећа одједном постаје брига свих."
limits:
  heading: "Ограничења"
  items:
    - "За сваки трошак плаћа једна особа. Ако су платиле две, забележи два трошка."
    - "Нема поделе по ставкама ни по уделима. Постоје једнако, тачни износи и проценти."
    - "Проценти морају заједно давати 100."
    - "Трошак може износити до 999.999,99 у својој валути, са уобичајеним бројем децимала те валуте."
    - "Трошкови се не понављају сами. Уместо тога копирај прошломесечни."
    - "Датуми не смеју бити у будућности нити старији од 10 година."
    - "Трошак у ком учествује неко ко је напустио групу постаје само за читање."
useCasesHeading: "Где оваква подела помаже"
faq:
  heading: "Питања"
  items:
    - q: "Могу ли две особе да плате један трошак?"
      a: "Не у једном трошку. Забележи два, по један за сваког платиоца, и стања ће изаћи једнако."
    - q: "Могу ли да поделим рачун по ставкама?"
      a: "Не. Подела је једнака, по тачним износима или по процентима. За рачун са различитим ставкама упиши колико дугује свака особа, као тачне износе."
    - q: "Могу ли да подесим подразумевану поделу?"
      a: "Не. Копирај ранији трошак да поново употребиш његову поделу и промени оно што је другачије."
    - q: "Могу ли се рачуни понављати сваког месеца?"
      a: "Не. Уместо тога копирај прошломесечни трошак, што траје неколико секунди."
    - q: "Ко може да измени трошак?"
      a: "Онај коме то дозвољавају дозволе групе. Свака измена приказује се у активности групе, па промене никад нису неприметне."
    - q: "Шта се после дешава са стањима?"
      a: "Ажурирају се како трошкови пристижу, а [поравнање](page:feature/settle-up) их претвара у кратак списак уплата. Ако је трошак у другој валути, погледај [више валута](page:feature/multiple-currencies)."
