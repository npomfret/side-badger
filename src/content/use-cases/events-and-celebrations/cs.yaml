faq:
  heading: "Otázky"
  items:
    - q: "Mohou hosté vidět skupinu, aniž by se připojili?"
      a: "Ne. Lidé se připojují odkazem nebo QR kódem a bezplatným účtem, takže skupinu uvidí, až budou uvnitř."
    - q: "Může Side Badger vybírat peníze?"
      a: "Ne. Side Badger vede přehled a nikdy nepřesouvá peníze. Platíte si, jak chcete, a pak platbu zaznamenáte. Je zdarma, bez reklam a bez denních limitů; viz [ceník](page:pricing)."
    - q: "Mohou být hlasy anonymní?"
      a: "Ano. Při vytváření hlasování můžete skrýt, kdo pro co hlasoval. Nastavení lze změnit jen před prvním hlasem."
    - q: "Mohou lidé přispět různými částkami?"
      a: "Ano. Rozdělte výdaj podle přesných částek, aby podíl každé osoby byl číslem, na kterém jste se dohodli, nebo vynechte lidi, kteří se nezúčastnili."
    - q: "Může pořadatel vést účetnictví?"
      a: "Ano. Použijte předvolbu spravované skupiny, aby výdaje měnili jen zakladatelé a správci a správci schvalovali nové členy."
