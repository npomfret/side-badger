meta:
  title: "バチェラー・バチェロレッテの週末旅行を割り勘 | Side Badger"
  description: "主役は一銭も払わず、月曜になっても全員まだ口をきいている。バチェラー・バチェロレッテの週末旅行の費用を、計算つきで割り勘する方法です。"
h1: "バチェラー・バチェロレッテの週末旅行の費用を割り勘する方法"
navLabel: "バチェラー・バチェロレッテ旅行"
lead: "主役は何も払わないので、残りのメンバーがすべての費用を[均等](page:feature/split-expenses)に分けます。参加しなかった費用からは外し、サプライズが守られるよう、主役はグループに入れないでおきます。"
cta:
  heading: "集計はつけて、サプライズは守る"
  body: "グループを作り、主役以外の全員にリンクを送って、費用が発生するたびに追加しましょう。Side Badgerは無料で、広告も1日の制限もありません。"
sections:
  - heading: "友人4人とサプライズ1つ"
    body: "Hannah、Isla、Jess、Katは、Graceをバチェロレッテの週末旅行に連れ出します。Graceが主役なので、何も払いません。グループにも入っていないので、友人たちが自分のために何にお金を使っているかも見えません。Hannahはコテージを予約し、Islaはスパの日の料金を払い、Jessは夕食を負担し、Katはタクシー代を出します。日曜になるころには全員が何かしら払っていて、誰が多く立て替えているのか、誰にもわかりません。計算は、バチェラーでもバチェロレッテでも、誰が主役でも同じです。"
  - heading: "そこにいる人数ではなく、払う人数で割る"
    body: "主役の分は消えるわけではなく、ほかの人で分け合います。コテージは£720を友人4人で払うので1人£180で、Graceの分はすでにその金額に含まれています。夕食は£260なので1人£65。タクシーは£44なので1人£11です。誰かが参加しなかった費用は、その支出からだけ外します。Katはスパに行かないので、Graceの分も含めた£360を、Hannah、Isla、Jessが1人£120ずつ分けます。合計すると、Hannah、Isla、Jessは週末分としてそれぞれ£376、Katは£256を負担します。"
  - heading: "Side Badgerで設定する"
    items:
      - "週末用のグループを作り、地味な名前を付けます。たとえば「コテージの週末」。Graceはメンバーではなく、グループを見られるのはメンバーだけです。"
      - "**他の人を招待**を選び、Graceの目に入らない場所でだけ、リンクを送るかQRコードを見せます。リンクには、参加する前にグループのプレビューが表示されます。有効期間は15分から5日までで選べます。古いリンクも期限が切れるまで使えるので、必要以上に長くしないでください。"
      - "費用ごとに**経費を追加**を選び、金額を入力して、**誰が支払いましたか？**で支払った人を選びます。**割り勘相手**では、払う人にチェックを入れ、参加しなかった人（たとえばスパのKat）は外します。**割り勘方法**は**均等**を選びます。"
      - "帰宅したら、グループの**残高**を開きます。Side Badgerが誰が誰に借りているかを表示し、短い支払いリストを提案します。ここでは3回です。KatがHannahに£212、JessがHannahに£116、IslaがHannahに£16を支払います。支払いは好きな方法で行い、**精算する**でそれぞれの支払いを記録します。"
  - heading: "予約の前に、予算と手付金"
    body: "予約する前に、予算を決めましょう。**投票を追加**を選び、コテージにいくらかけるかを尋ねて、いくつかの金額を選択肢にします。作成時に**匿名投票**をオンにすると、誰が何に投票したかが見えなくなるので、控えめな予算を人前で主張しなくて済みます。全員が投票を終えたら投票を閉じると、勝った金額が表示されます。次は手付金です。予約した人が支払い、均等に分ける支出として追加し、残りの代金は期日が来たら2件目の支出として入力します。ほかの人は、自分の分をすぐに送って支払いを記録してもよいし、最終的な集計まで待ってもかまいません。どちらでも、残高は同じになります。"
  - heading: "1泊だけ参加する人がいるとき"
    body: "土曜だけ顔を出す友人が、金曜の分まで払うべきではありません。参加しなかった費用からは外してください。部屋のように、費用が各自の滞在期間によって変わる場合は、**割り勘方法**で**正確な金額**を選び、各自の分を入力します。合計は総額と一致する必要があります。まず1人1泊あたりの料金を出し、それに各自の滞在泊数を掛けてください。全員が同じ額ではない費用については、[グループ旅行](page:use-case/group-trips)のページでさらに詳しく説明しています。"
  - heading: "ここでSide Badgerにできないこと"
    items:
      - "お金を動かすことはありません。銀行振込、現金、都合のよい方法で支払い、そのあと支払いを記録すれば、全員の残高が更新されます。"
      - "支払いのリマインダーは送りません。グループチャットでやんわり催促するのは、引き続き人間の仕事です。"
      - "1件の支出につき、支払った人は1人で、Side Badgerはレシートを品目ごとに分けることもできません。コテージの代金を2枚のカードで払った場合は、2件の支出として入力します。ディナーで一部の人が追加注文した場合は、その追加分を別の支出として入力します。"
      - "管理するのはお金で、旅程ではありません。投票とコメントは費用に付くので、週末の計画はグループチャットに残しておきましょう。"
exampleAfter: 2
example:
  heading: "Graceのバチェロレッテ週末旅行を4人で割り勘"
  currency: GBP
  people:
    - id: hannah
      name: Hannah
    - id: isla
      name: Isla
    - id: jess
      name: Jess
    - id: kat
      name: Kat
  expenses:
    - label: "コテージ"
      payer: hannah
      amount: 720
      split:
        method: equal
    - label: "スパの日"
      payer: isla
      amount: 360
      split:
        method: equal
        shares:
          hannah: 1
          isla: 1
          jess: 1
    - label: "夕食"
      payer: jess
      amount: 260
      split:
        method: equal
    - label: "タクシー"
      payer: kat
      amount: 44
      split:
        method: equal
faq:
  heading: "よくある質問"
  items:
    - q: "ベストマンやメイド・オブ・オナーは多めに払うのですか？"
      a: "グループが合意した場合だけです。アプリは、計算の中で誰にも特別な役割を与えません。誰かが多めに負担する場合は、**割り勘方法**で**正確な金額**または**パーセンテージ**を選び、合意した分担を入力してください。"
    - q: "飲まなかった人がいるドリンク代は？"
      a: "ドリンク代は別の支出として追加し、飲んだ人だけにチェックを入れます。飲んだ量が人によってバラバラなら、**正確な金額**を選んで各自の分を入力します。飲まなかったものの代金を払う人はいません。"
    - q: "主役はあとからグループを見られますか？"
      a: "はい、サプライズが終わったあとなら。主役を招待し、グループ設定の**セキュリティと権限**で、管理者が**閲覧者**にできます。閲覧者はすべてを見られますが、何も変更できないので、秘密がなくなってから招待してください。参加には無料アカウントが必要です。"
