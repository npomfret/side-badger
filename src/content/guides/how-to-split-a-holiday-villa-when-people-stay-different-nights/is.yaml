faq:
  heading: "Spurningar um orlofshús"
  items:
    - q: "Hvað ef einhver hættir við?"
      a: "Taktu næturnar þeirra út, reiknaðu upp á nýtt og breyttu útgjaldinu fyrir orlofshúsið svo nákvæmu upphæðirnar nái aftur verðinu. Fyrri útgáfan er geymd og breytingin birtist í virkni hópsins, svo enginn breytir tölu í kyrrþey. Hver má breyta fer eftir heimildum hópsins."
    - q: "Á sá sem bókaði að borga minna?"
      a: "Það ákveður hópurinn. Að bóka er verk sem enginn sækist eftir og hópar eru ósammála um hvort það veiti afslátt. Hvað sem þið semjið um skaltu setja það í nákvæmu upphæðirnar og skrifa það í minnispunkt á útgjaldinu, eða í athugasemd við hliðina á því, svo enginn þurfi að muna samkomulagið."
    - q: "Getum við skipt þrifagjaldi öðruvísi?"
      a: "Já. Skráðu gjaldið sem sérstakt útgjald og gefðu því sína eigin skiptingu. Jafnt hentar fyrir fast gjald fyrir allt húsið. Nákvæmar upphæðir henta hópi sem vill að gjaldið fylgi nóttunum líka."
