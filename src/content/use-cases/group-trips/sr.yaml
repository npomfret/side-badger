meta:
  title: "Дели трошкове групног путовања, у 140 валута"
  description: "Прати ко је шта платио на групном путовању, уноси трошкове у локалној валути, претварај их или не и поравнајте се једном на крају. Бесплатно, у прегледачу."
h1: "Дели трошкове групног путовања, у 140 валута"
navLabel: "Групна путовања"
lead: "Прати вилу, таксије и ону једну рунду коктела за коју се нико не сећа да се јавио да плати. Side Badger води текућу евиденцију док си на путу, [сналази се са фунтама, еврима и 138 других валута](page:feature/multiple-currencies) и даје ти [кратак списак уплата](page:feature/settle-up) кад се вратиш кући."
cta:
  heading: "Рачуница за одмор готова пре него што избледи препланулост"
  body: "Оснуј групу, пошаљи везу за позивницу људима са путовања и додај трошкове како настају."
  button: "Направи бесплатан налог"
scenario:
  heading: "Свако је за нешто платио, у некој валути"
  body: "Неко је резервисао летове, неко други вилу ставио на картицу, а трећа особа покрила вечеру готовином. До трећег дана нико не зна ко је у плусу. Питање је једноставно, иако одговор обично живи у табели коју нико не жели да отвори. Ко је шта платио, у којој валути и како се сви поравнавају једном на крају?"
sections:
  - heading: "Пре поласка"
    body: "Избор виле стави на гласање, по жељи анонимно, да одлука припада групи, а не ономе ко се најдуже дури. Затим заједнички списак за куповину држи уз рачуне за куповину, да нико не купи три тубе креме за сунчање и ниједан адаптер за утичницу."
  - heading: "Док си на путу"
    body: "Додај сваки трошак кад настане, у валути у којој је плаћен. Сликај рачун, а Side Badger попуни укупан износ, датум и место да их провериш; слике рачуна чита Гуглов AI сервис. Претвори износ по актуелном девизном курсу, који можеш променити у онај који је важио при размени, а изворни износ остаје уз трошак. Или остави евре као евре и одлучи касније. Група може изабрати и једну валуту, а нови трошкови претварају се у њу аутоматски."
  - heading: "Није свако радио све"
    body: "Неки су прескочили вечеру, други нису ишли бродом. Изостави их из трошкова у којима нису учествовали, а остатак подели [једнако, по тачним износима или по процентима](page:feature/split-expenses). Нико не плаћа део путовања који је проспавао."
  - heading: "Поравнајте се кад се вратите кући"
    body: "Side Badger предлаже кратак списак уплата који поравнава све. Платите једни другима како год желите, а затим забележите. Са мешаним валутама водите сваку посебно или претварајте успут; пример из Лисабона испод показује оба."
  - heading: "Момачке и девојачке вечери"
    body: "Викенд са почасним гостом тражи мало више администрације. Направи управљану групу, где администратори одобравају нове чланове, а трошкове могу мењати само оснивачи и администратори. За удео почасног госта користи тачне износе, ограничи групу на валуте које стварно користите и закључај групу кад буде готово да бројеви остану."
exampleAfter: 4
example:
  heading: "Четворо пријатеља у Лисабону"
  currency: GBP
  people:
    - id: ana
      name: Ана
    - id: ben
      name: Бен
    - id: chloe
      name: Клое
    - id: dev
      name: Дев
  expenses:
    - label: "Летови"
      payer: ana
      amount: 480
      split:
        method: equal
    - label: "Вила"
      payer: ben
      amount: 900
      currency: EUR
      split:
        method: equal
    - label: "Вечера"
      payer: chloe
      amount: 120
      currency: EUR
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "Излет бродом"
      payer: dev
      amount: 160
      currency: EUR
      split:
        method: equal
  conversion:
    rates:
      EUR: 0.85
featuresHeading: "На чему путовање стоји"
faq:
  heading: "Питања"
  items:
    - q: "Могу ли се изоставити они који су прескочили вечеру?"
      a: "Да. Изабери ко је учествовао у сваком трошку и само њима се наплаћује."
    - q: "Ради ли без сигнала?"
      a: "Не. Side Badger треба везу, па додај трошкове кад се вратиш на бежичну мрежу."
    - q: "Треба ли свако нешто да инсталира?"
      a: "Не. Ради у прегледачу. Пошаљи везу за позивницу и људи се придружују са својих телефона."
    - q: "Који девизни курс користи?"
      a: "Актуелни девизни курс при уносу трошка или твој сопствени ако си добио другачији. Курс се утврђује кад се трошак сачува, па се стари трошкови никад не ревалоризују."
    - q: "Можемо ли замрзнути групу после путовања?"
      a: "Да. Администратор може закључати групу да бројеви остану."
    - q: "Постоји ли ограничење износа?"
      a: "Да. 999.999,99 по трошку, у његовој валути."
