featuresHeading: "Ce sur quoi un voyage s'appuie"
faq:
  heading: Questions
  items:
    - q: "Peut-on laisser de côté ceux qui ont sauté le dîner ?"
      a: "Oui. Choisissez qui a pris part à chaque dépense et seuls ceux-là la paient."
    - q: "Est-ce que ça marche sans réseau ?"
      a: "Non. Side Badger a besoin d'une connexion, donc ajoutez les frais une fois que vous avez retrouvé le wifi."
    - q: "Chacun doit-il installer quelque chose ?"
      a: "Non. Il fonctionne dans le navigateur. Envoyez le lien d'invitation et chacun rejoint depuis son téléphone."
    - q: "Quel taux de change utilise-t-il ?"
      a: "Un taux de change actuel quand vous saisissez la dépense, ou le vôtre si vous en avez obtenu un autre. Le taux est fixé quand la dépense est enregistrée, donc les anciennes dépenses ne sont jamais réévaluées."
    - q: "Peut-on figer le groupe après le voyage ?"
      a: "Oui. Un admin peut verrouiller le groupe pour que les chiffres ne bougent plus."
    - q: "Y a-t-il une limite sur les montants ?"
      a: "Oui. 999,999.99 par dépense, dans sa propre devise."
