faq:
  heading: "Pertanyaan"
  items:
    - q: "Sebaiknya memakai gaji kotor atau gaji bersih?"
      a: "Grup yang memutuskan. Gaji bersih umum dipakai, karena itu uang yang benar-benar bisa Anda belanjakan. Gaji kotor mengabaikan kenyataan bahwa pajak, iuran pensiun, dan cicilan pinjaman memotong jumlah yang berbeda dari gaji yang berbeda. Mana pun yang Anda pilih, pakai ukuran yang sama untuk kalian berdua."
    - q: "Apakah Side Badger melihat penghasilan kami?"
      a: "Tidak. Anda hanya memasukkan persentase, tidak pernah gaji. Persentasenya terlihat oleh anggota grup, dan untuk pasangan itu hanya Anda berdua."
    - q: "Bisakah kami menetapkan 62/38 sekali untuk semuanya?"
      a: "Pembagian diatur per pengeluaran, bukan per grup. Salin pengeluaran yang sudah memakai 62 dan 38, lalu ubah yang berbeda. [Bagi pengeluaran](page:feature/split-expenses) membahas pilihan lainnya."
