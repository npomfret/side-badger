meta:
  title: "Скенирај рачун и додај трошак | Side Badger"
  description: "Нека јазавац прочита рачун. Попуњава укупан износ, датум и место да их провериш, без кредита за скенирање. Слику чита Googleов AI сервис."
h1: "Скенирај рачун, провери детаље, подели"
navLabel: "Скенирање рачуна"
lead: "Нека јазавац прочита рачун, а ти му прегледај домаћи. Додај слику новом трошку и Side Badger попуњава укупан износ, датум и место да их провериш. Затим га [делиш](page:feature/split-expenses) као сваки други трошак. Скенирање је бесплатно, без кредита за скенирање. Попуњава један трошак и не дели рачун по ставкама. Слике рачуна чита Googleов AI сервис."
cta:
  heading: "Сликај. Провери. Подели."
  body: "Направи бесплатан налог, оснуј групу и додај трошак са сликом рачуна. Погледај шта попуњава, промени шта није у реду и сачувај кад си задовољан."
problem:
  heading: "Нико не жели да куца рачун у реду за такси"
  body: "Путовања и велике ноћи долазе са папирима. Вечера, такси, рунда пића која је постала шест. Куцање сваког у телефон хладним палцима, док иза тебе чека ред, начин је на који се трошкови заборављају. Зато Side Badger чита рачун уместо тебе. Он направи први нацрт, а ти провериш. Одговара [групним путовањима](page:use-case/group-trips) и [догађајима и прославама](page:use-case/events-and-celebrations), где се рачуни гомилају брже него што ико жели да се бави њима."
workflow:
  heading: "Од слике до трошка у три корака"
  steps:
    - title: "Додај рачун новом трошку"
      body: "Започни нови трошак и додирни **Скенирај рачун**, или користи брзу радњу **Скенирај рачун** на контролној табли. Сликај или изабери слику коју већ имаш. Ради и **Додај рачун или прилог** на обрасцу."
    - title: "Нека прочита рачун"
      body: "Образац приказује **Анализирање рачуна...** док AI у Side Badger-у чита слику. Затим попуњава оно што је нашао, као што су опис, укупан износ, валута, датум, време и место. Све што си већ укуцао остаје нетакнуто."
      shot: S09
      shotAlt: "Образац новог трошка који приказује Анализирање рачуна..., а затим исти образац са попуњеним детаљима"
    - title: "Провери, па подели"
      body: "Упореди образац са папиром. Исправи шта није у реду, реци ко је платио и ко је делио трошак, изабери начин поделе и сачувај. Трошак не постоји док то не урадиш. [Подела трошкова](page:feature/split-expenses) покрива дељење."
options:
  heading: "Опције"
  items: []
sections:
  - heading: "Шта попуњава"
    body: "Додај слику рачуна новом трошку и ова поља могу да се попуне. Ко је платио, ко је делио трошак и како се дели и даље зависи од тебе."
    items:
      - "**Опис** трошка."
      - "**Укупан износ**."
      - "**Валута**, ако твоја група то дозвољава."
      - "**Датум** и **време**."
      - "**Место**."
      - "Текстуална копија рачуна у **белешкама**, за кад папирни избледи или прође кроз машину за веш."
  - heading: "Шта ипак провераваш"
    body: "Све. Сматрај да је оно што попуни нацрт. Упореди укупан износ са папиром, па валуту, датум и место. Мутне слике и згужвани папир могу да преваре сваког читаоца, и не обећавамо да погађа сваки рачун, зато погледај пре него што сачуваш. Ако нешто није у реду, преукуцај то. Ако је рачун у јенима, а група се поравнава у фунтама, [више валута](page:feature/multiple-currencies) покрива шта следи."
  - heading: "Задржи рачун уз трошак"
    body: "Скениран или не, рачун може да остане уз трошак. Прикачи слике или PDF-ове, до три по трошку и до 10 MB сваки. Чланови групе их виде уз трошак. Слике се приказују као сличице које се отварају у прегледачу, а PDF-ови се отварају као везе. Слика коју скенираш такође се прилаже, осим ако је уклониш пре чувања. Кад неко пита колико је та вечера заиста коштала, доказ је ту."
  - heading: "Куда иде твој рачун"
    body: "Слике рачуна чита Googleов AI сервис. Да би се образац попунио, слику чита Google Vertex AI (Gemini) у Googleовом мулти-региону у САД. Додај слику новом трошку и она се чита. PDF, или слика додата већ постојећем трошку, чува се без читања. Приложене рачуне виде чланови групе, па ако рачун показује нешто што радије не би делио, прескочи слику и укуцај тај трошак."
limits:
  heading: "Ограничења"
  items:
    - "Само слике. JPEG, PNG и WebP, и HEIC након конверзије. PDF-ови могу да се приложе трошку, али се не читају."
    - "Скенирање је само за нове трошкове. На постојећем трошку можеш да приложиш рачуне, али се ништа не чита."
    - "Попуњава само поља која ниси дирао, а валуту само ако твоја група то дозвољава."
    - "Не дели по ставкама нити додељује ставке рачуна људима. Попуњава један трошак, а ти га делиш као обично."
    - "Нема обећања да је оно што попуни тачно, нити да ће скенирање радити сваки пут. Провери пре чувања, а трошак додај ручно ако скенирање не успе или није доступно."
    - "Трошак може да има до три прилога, сваки до 10 MB, као JPEG, PNG, WebP, HEIC или PDF."
    - "Слике рачуна чита Google Vertex AI (Gemini) у Googleовом мулти-региону у САД, а приложене рачуне виде чланови групе."
useCasesHeading: "Где се рачуни гомилају"
faq:
  heading: "Питања"
  items:
    - q: "Може ли да подели рачун по ставкама?"
      a: "Не. Попуњава трошак, укључујући укупан износ, а ти га делиш једнако, по тачним износима или по процентима. За рачун где је свако наручио другачије, унеси шта сваки човек дугује као тачне износе. [Подела трошкова](page:feature/split-expenses) има појединости."
    - q: "Може ли да прочита PDF?"
      a: "Не. PDF можеш да приложиш трошку да путује уз бројеве, али се читају само слике."
    - q: "Има ли ограничења скенирања?"
      a: "Нема кредита за скенирање који могу да ти истекну, и скенирање је бесплатно. Датотеке имају ограничења: до три прилога по трошку и 10 MB сваки. Остало је у [шта покрива бесплатно](page:pricing)."
    - q: "Ко може да види мој рачун?"
      a: "Чланови групе могу да виде рачуне приложене трошку. Слике рачуна чита и Googleов AI сервис, а тако се образац и попуњава."
    - q: "Могу ли да скенирам рачун за трошак који сам већ додао?"
      a: "Не, скенирање је за нове трошкове. Рачун ипак можеш да приложиш постојећем трошку, и он се чува без читања."
    - q: "Шта ако попуни нешто погрешно?"
      a: "Преукуцај то. Свако поље остаје измењиво док не сачуваш, а ти би их ипак требало све проверити. Ако скенирање не успе или није доступно, додај трошак ручно као обично."
