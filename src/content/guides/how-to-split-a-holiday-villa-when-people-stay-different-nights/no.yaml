faq:
  heading: "Spørsmål om villaen"
  items:
    - q: "Hva om noen avlyser?"
      a: "Ta nettene deres ut, regn om og rediger villautgiften slik at de eksakte beløpene summerer seg til prisen igjen. Den tidligere versjonen blir bevart og redigeringen vises i gruppens aktivitet, så ingen endrer et tall i det stille. Hvem som kan redigere, avhenger av gruppens tillatelser."
    - q: "Bør den som booket betale mindre?"
      a: "Det avgjør gruppen. Å booke er et ork, og grupper er ulike når det gjelder om det gir rabatt. Uansett hva dere blir enige om, legg det inn i de eksakte beløpene og skriv det i et notat på utgiften, eller i en kommentar ved siden av den, så ingen trenger å huske avtalen."
    - q: "Kan vi dele rengjøringsgebyr annerledes?"
      a: "Ja. Legg inn gebyret som en egen utgift og gi det sin egen fordeling. Likt passer for et fast gebyr for hele huset. Eksakte beløp passer for en gruppe som vil at gebyret også skal følge nettene."
