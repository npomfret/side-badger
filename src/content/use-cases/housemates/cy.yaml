faq:
  heading: "Cwestiynau"
  items:
    - q: "All rhent ailadrodd yn awtomatig?"
      a: "Na, does dim biliau cylchol. Copïwch rent y mis diwethaf mewn cwpl o dapiau, newidiwch y dyddiad ac rydych wedi gorffen."
    - q: "Allwn ni rannu yn ôl maint ystafell?"
      a: "Gallwch, yn ôl canran. Rhowch gyfran i bob cyd-letywr sy'n adlewyrchu ei ystafell, cyn belled â bod y cyfrannau'n adio i 100. Mae [rhannu treuliau](page:feature/split-expenses) yn trafod y ffyrdd eraill o rannu."
    - q: "Beth os yw cyd-letywr yn symud allan a dyled arno?"
      a: "Ni all adael y grŵp nes ei fod wedi setlo, oherwydd all neb adael tra bo arian yn ddyledus ganddo neu iddo. Mae'r rhifau'n aros yn onest nes bod pawb yn sgwâr."
    - q: "Ydy Side Badger yn talu'r biliau?"
      a: "Nac ydy. Mae'n cadw'r cyfrif ac yn awgrymu rhestr fer o daliadau. Rydych chi'n talu eich gilydd sut bynnag y dymunwch, yna'n ei gofnodi, fel mae [setlo](page:feature/settle-up) yn esbonio."
    - q: "All un cyd-letywr gadw'r llyfrau?"
      a: "Gall. Gwnewch ef yn weinyddwr a defnyddiwch grŵp rheoledig, lle mae angen cymeradwyaeth ar aelodau newydd a dim ond crewyr a gweinyddwyr all newid costau."
