sections:
  - heading: 39 språk, og laget for flere folk
    body: Bruk Side Badger på 39 språk, blant annet arabisk, persisk og urdu, som skrives fra høyre mot venstre. Alle i gruppen kan velge sitt eget, så gruppesiden kan være på arabisk for én person og på norsk for den neste. Den er også laget med tanke på brukere av tastatur og skjermleser, og medlemsfarger kommer med mønstre, så du slipper å skille grønt fra rødt.
faq:
  heading: Spørsmål
  items:
    - q: Må alle ha en konto?
      a: Ja, en gratis en. Hver person bekrefter e-postadressen sin før de legger til noe.
    - q: Finnes det en app?
      a: Den kjører i nettleseren, og du kan legge den til på startskjermen eller i dokken så den åpnes som en app. Det finnes ingen versjon i appbutikken og ingen frakoblet modus.
    - q: Flytter Side Badger penger?
      a: Nei. Den fører regnskapet og foreslår betalinger, og dere betaler hverandre slik dere vil. Deretter registrerer dere betalingen. Se [gjøre opp](page:feature/settle-up).
    - q: Kan noen forlate gruppen og skylde penger?
      a: Nei. Ingen kan forlate en gruppe mens de skylder eller har penger til gode, så de gjør opp først.
    - q: Hvor mange kan være med i en gruppe?
      a: Opptil 50 personer i en gruppe. Inviter dem med en lenke eller en QR-kode, og slå på godkjenning hvis du vil at en administrator skal slippe inn hver enkelt.
    - q: Hva med turer med mer enn én valuta?
      a: Saldoer føres separat for hver valuta. Se [flere valutaer](page:feature/multiple-currencies).
