faq:
  heading: "Kysymyksiä"
  items:
    - q: "Maksaako bestman tai kaaso enemmän?"
      a: "Vain jos ryhmä niin sopii. Sovellus ei anna kenellekään erityisasemaa laskuissa. Jos joku kattaa enemmän, valitse kohdasta **Miten jaetaan** vaihtoehto **Tarkat summat** tai **Prosentteina** ja syötä sovitut osuudet."
    - q: "Entä juomat, joita jotkut eivät ottaneet?"
      a: "Lisää juomat omana kulunaan ja merkitse vain ne, jotka ne ottivat. Jos jokainen otti eri määrän, valitse **Tarkat summat** ja kirjoita kunkin osuus. Kukaan ei maksa siitä, mitä ei ottanut."
    - q: "Näkeekö polttarisankari ryhmän myöhemmin?"
      a: "Kyllä, kun yllätys on ohi. Kutsu hänet, ja ylläpitäjä voi asettaa hänelle roolin **Katselija** ryhmän asetusten kohdassa **Turvallisuus ja oikeudet**. Katselija näkee kaiken mutta ei muuta mitään, joten odota, kunnes mikään ei ole salaisuus. Hän tarvitsee liittyäkseen ilmaisen tilin."
