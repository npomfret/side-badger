meta:
  title: "Aplikacija za deljenje računov brez prenosa | Side Badger"
  description: "Telefon je poln, razumemo. Side Badger teče v brskalniku, brez trgovine z aplikacijami in brez prenosa. Dodaj ga na domači zaslon in se odpre kot aplikacija."
h1: "Brez trgovine z aplikacijami. Brez prenosa. Pa vseeno kot aplikacija"
navLabel: "Spletna aplikacija"
lead: "Side Badger živi v tvojem brskalniku. Ni trgovine z aplikacijami, ki bi jo iskal, in ničesar, kar bi moral najprej prenesti. Prijavi se na telefonu ali računalniku, deli stroške s skupino prek spleta in ga dodaj na domači zaslon ali v Dock, ko ga želiš na dosegu enega dotika."
cta:
  heading: "Odpri. Prijavi se. Ustanovi skupino."
  body: "Ustvari račun, ustanovi skupino in dodaj prvi strošek, vse v brskalniku, ki ga že imaš odprtega. Najprej želiš ogled? Poglej, [kako deluje](page:how-it-works), ali preveri, [kaj vključuje brezplačna različica](page:pricing)."
problem:
  heading: "Telefon je poln. Razumemo."
  body: "Nekje na njem je štiri tisoč fotografij istega sončnega zahoda in opozorilo o prostoru, ki ga od pomladi odmikaš. Zadnje, kar potrebuje, je še ena aplikacija, samo da razdeliš eno večerjo. Zato je Side Badger spletna aplikacija. Teče v sodobnem brskalniku na telefonu ali računalniku. Na telefonu uporablja mobilne postavitve, s stranjo skupine, razdeljeno na zavihke, in kontrolniki, prijaznimi do dotika. Nekateri dodatki, na primer dodajanje na domači zaslon, so odvisni od brskalnika in povemo, kje."
workflow:
  heading: "Od zavihka brskalnika do domačega zaslona v treh korakih"
  steps:
    - title: "Odpri in se prijavi"
      body: "Pojdi na Side Badger v brskalniku in se prijavi. Potrebuješ samo e-poštni naslov in geslo, e-pošto pa moraš potrditi, preden lahko karkoli dodaš. Vsak v skupini potrebuje račun, zato bodo isto storili povabljeni."
    - title: "Dodaj na domači zaslon ali v Dock"
      body: "Ko si prijavljen, se aplikacija ponudi, da se namesti. Dobiš gumb **Namesti**, kjer ga brskalnik dovoljuje, in **Pokaži, kako**, kjer ne. Si ga zamudil ali rekel ne? **Nastavitve** imajo enako pomoč pod **Dodaj na domači zaslon ali v Dock**. Na iPhonu ali iPadu Nastavitve najprej pokažejo korake za iPhone, druge naprave pa skrijejo pod **Druge naprave**. Tako ali drugače se aplikacija nato odpre v svojem oknu."
      shot: S20
      shotAlt: "Razdelek Dodaj na domači zaslon ali v Dock v Nastavitvah, s koraki za dodajanje aplikacije na napravo"
    - title: "Vklopi obvestila, če jih želiš"
      body: "Obvestila so izklopljena, dokler jih ne vklopiš, vsaka naprava pa se vklopi posebej. Uporabi gumb **Vklopi**, ki ga ponuja zvonec z obvestili, ali stikalo **Potisna obvestila** v **Nastavitvah**. Na iPhonu ali iPadu najprej odpri aplikacijo z domačega zaslona. Samo tam delujejo."
      shot: S19
      shotAlt: "Odprt spustni seznam obvestil s seznamom nedavne dejavnosti v skupini"
options:
  heading: "Kako ga dodati, napravo za napravo"
  items:
    - title: "iPhone in iPad"
      body: "Tapni gumb Deli, kvadrat s puščico navzgor. Če ga ne vidiš, najprej tapni tri pike (•••), nato Deli. Podrsaj navzdol in tapni **Dodaj na začetni zaslon**. Pusti vklopljeno **Odpri kot spletno aplikacijo**, nato tapni **Dodaj**. Če se je povezava odprla znotraj druge aplikacije, najprej odpri stran v Safariju, ker ga ta vgrajeni brskalnik ne more dodati."
    - title: "Android"
      body: "Odpri meni brskalnika in izberi **Dodaj na začetni zaslon** ali **Namesti aplikacijo**."
    - title: "Chrome ali Edge na računalniku"
      body: "Odpri meni brskalnika in izberi možnost za namestitev tega spletnega mesta kot aplikacije. Nato dobi svoje okno in svojo ikono."
    - title: "Safari na Macu"
      body: "Izberi **Datoteka**, nato **Dodaj v Dock**."
sections:
  - heading: "Obvestila, samo če jih zahtevaš"
    body: "Potisna obvestila so izbirna. Vklopi jih in dobiš obvestilo, ko je v tvojih skupinah nova dejavnost, na primer ko nekdo doda strošek, napiše komentar ali zabeleži plačilo. Vklapljajo se po eno napravo naenkrat, z zvonca z obvestili ali iz **Nastavitev**, tam pa jih lahko tudi spet izklopiš. Potrebujejo brskalnik, ki jih podpira, in tvoje dovoljenje. Če jih je brskalnik za to spletno mesto blokiral, jih najprej dovoli v nastavitvah brskalnika. Na iPhonu ali iPadu delujejo samo iz aplikacije, dodane na domači zaslon, ne iz zavihka brskalnika. Dostava ni zagotovljena, zato obvestilo obravnavaj kot rahel sunek, ne kot obljubo. Kaj se pojavi v dnevniku, preberi pri [načrtuj skupaj](page:feature/plan-together)."
  - heading: "Sprotne posodobitve, brez gumba za osvežitev"
    body: "Dodaj strošek in vsi ga vidijo takoj, skupaj s tem, kaj se je spremenilo in kdo je to naredil. Vsaka skupina hrani zgodovino dejavnosti, zvonec z obvestili pa kaže dejavnost v vseh tvojih skupinah. Nihče ne mora vprašati, ali si videl, kar si pravkar dodal. Na njihovem zaslonu je."
  - heading: "39 jezikov, vsak po svoje"
    body: "Side Badger uporabljaj v 39 jezikih, vključno z arabščino, perzijščino in urdujščino, ki se pišejo od desne proti levi. Vsak v skupini izbere svojega, zato je lahko ista stran skupine za eno osebo v arabščini, za naslednjo pa v angleščini. Edino, o čemer se mora skupina strinjati, so številke."
  - heading: "Narejeno za več kot eno vrsto uporabnikov"
    body: "Side Badger je narejen z mislijo na uporabnike tipkovnice in bralnikov zaslona. Barve članov imajo vzorce, zato ti ni treba ločevati zelene od rdeče."
    items:
      - "Povezave za preskok, da lahko uporabniki tipkovnice skočijo naravnost na vsebino."
      - "Pogovorna okna upravljajo fokus tipkovnice."
      - "Kontrolniki so označeni, za bralnike zaslona."
      - "Postavitve se za jezike od desne proti levi obrnejo."
limits:
  heading: "Česa spletna aplikacija ne počne"
  items:
    - "Uporabe brez povezave ni. Side Badger potrebuje povezavo, zato ti na letalu brez wifija skupine ne bo odprl."
    - "Aplikacije v trgovini z aplikacijami ni in ni izvorne aplikacije za iPhone ali Android. Side Badger je spletna aplikacija, dodajanje na domači zaslon ali v Dock pa je način, kako dobiš različico, podobno aplikaciji."
    - "Dodajanje na domači zaslon ali v Dock je odvisno od brskalnika. Imena menijev se med brskalniki in različicami razlikujejo, nekateri brskalniki pa tega ne ponujajo."
    - "Potisna obvestila so izbirna za vsako napravo in potrebujejo brskalnik, ki jih podpira, in tvoje dovoljenje. Na iPhonu ali iPadu delujejo samo iz aplikacije, dodane na domači zaslon. Dostava ni zagotovljena."
    - "Opozoril po e-pošti ali SMS-u in opomnikov za plačila ni. Nova dejavnost se pokaže v aplikaciji, in kot potisna obvestila, če jih vklopiš. Lovljenje plačila je še vedno tvoje."
    - "Dejavnost se hrani 90 dni."
    - "Prijaviš se z e-poštnim naslovom in geslom. Prijave z Googlom ali Applom ni, stari pa moraš biti 18 let ali več."
    - "Ne trdimo, da je Side Badger povsem dostopen ali da izpolnjuje formalni standard dostopnosti. Če ti kaj stoji na poti, nam povej kar v aplikaciji in tam boš videl naš odgovor."
useCasesHeading: "Kjer pride prav, da aplikacije ni treba"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali je Side Badger aplikacija v trgovini z aplikacijami?"
      a: "Ne. Side Badger je spletna aplikacija. Odpreš jo v brskalniku, dodaš pa jo lahko na domači zaslon ali v Dock, da se odpre kot aplikacija. Iz trgovine z aplikacijami ni ničesar za prenesti."
    - q: "Ali lahko delim račune brez prenosa aplikacije?"
      a: "Da. Odpri Side Badger v brskalniku na telefonu ali računalniku, se prijavi in ustanovi skupino. Dodajanje na domači zaslon ali v Dock je izbirno."
    - q: "Ali deluje brez povezave?"
      a: "Ne. Side Badger potrebuje povezavo, tudi ko je dodan na domači zaslon ali v Dock."
    - q: "Zakaj ne dobivam obvestil na iPhonu?"
      a: "Na iPhonu ali iPadu obvestila delujejo samo iz aplikacije, dodane na domači zaslon, ne iz zavihka brskalnika. Dodaj jo, odpri jo z ikone na domačem zaslonu, nato vklopi obvestila v **Nastavitvah**. Dostava ni zagotovljena, zato ti zgodovina dejavnosti skupine še vedno pokaže, kaj je bilo dodano, če kakšno zmanjka."
    - q: "Ali moram vklopiti obvestila?"
      a: "Ne. Izklopljena so, dokler jih ne vklopiš, po eno napravo naenkrat. Brez njih se nova dejavnost še vedno pokaže v aplikaciji, vsi pa spremembo vidijo takoj, ko imajo aplikacijo odprto."
    - q: "Ali mora imeti vsak v skupini račun?"
      a: "Da. Potrebuješ samo e-poštni naslov in geslo, e-pošto pa moraš potrditi, preden lahko karkoli dodaš. Vsak, ki se pridruži skupini, stori enako, na kateremkoli telefonu ali računalniku želi."
