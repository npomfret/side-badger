meta:
  title: "किराया बांटने का कैलकुलेटर: कमरे के आकार या आय से | Side Badger"
  description: "बड़ा कमरा, बड़ा हिस्सा? देखें हर रूममेट कितना देगा, कमरे के आकार या आय के हिसाब से। यह आपके ब्राउज़र में चलता है: कुछ सेव या भेजा नहीं जाता।"
h1: "किराया बांटने का कैलकुलेटर"
navLabel: "किराया बांटने का कैलकुलेटर"
lead: "बड़ा बेडरूम, बड़ा हिस्सा? किराया डालें और देखें कि हर व्यक्ति कितना देगा, कमरे के आकार या आय के हिसाब से, पाई-पाई तक। यह आपके ब्राउज़र में चलता है, कुछ सेव नहीं करता और पैसे नहीं भेजता। जब घर चाहे कि हिसाब रखा जाए, तो Side Badger में [खर्च बांटें](page:feature/split-expenses) और हर महीने किराया कॉपी करें।"
cta:
  heading: "प्रतिशत एक बार तय करें। हमेशा कॉपी करें।"
  body: "टैब बंद करते ही यह कैलकुलेटर सब कुछ भूल जाता है, ठीक उस रूममेट की तरह जिसने ब्रॉडबैंड का बिल “पक्का” भरा था। Side Badger का ग्रुप किराया, बिल और यह सब सहेजकर रखता है कि किसने क्या दिया। यह मुफ्त है, कोई विज्ञापन नहीं और रोज़ाना की कोई सीमा नहीं।"
sections:
  - heading: "किराया बांटने के दो तरीके"
    items:
      - "**कमरे के आकार से।** किराए का एक हिस्सा किचन, बाथरूम और लाउंज का है, जिन्हें सब इस्तेमाल करते हैं। वह हिस्सा आप चुनते हैं (शुरुआत में 40%) और वह बराबर बंटता है। बाकी बेडरूम के क्षेत्रफल के हिसाब से जाता है, इसलिए बड़ा कमरा ज़्यादा देता है और छोटे कमरे को वह छूट मिलती है जिसका वह हकदार है।"
      - "**आय के हिसाब से।** हर व्यक्ति किराए का उतना ही हिस्सा देता है जितना हिस्सा उसकी कमाई सबकी कुल कमाई में है। साझा बिल जोड़ें तो वे भी वही हिस्से अपनाते हैं।"
  - heading: "जोड़-घटाव कैसे चलता है"
    body: "हर व्यक्ति को पहले एक सटीक हिस्सा मिलता है, फिर एक पूरा प्रतिशत, क्योंकि पूरी संख्याएं टाइप करना और उन पर बहस करना आसान है। राउंडिंग सबसे बड़े शेष की विधि (largest remainder) से होती है: हर कोई अपने सटीक हिस्से के नीचे की पूरी संख्या रखता है, और बचे हुए अंक उसे जाते हैं जिसका सबसे ज़्यादा हिस्सा छूट गया। प्रतिशतों का जोड़ हमेशा 100 रहता है। नीचे के फ्लैट में साझा 40% हर किसी के लिए 13.33% है। Priya का कमरा फ्लैट के 38 m² में से 16 का है, इसलिए 60% × 16/38 होता है 25.26%, उसमें 13.33% जोड़ें तो 38.6%, जो राउंड होकर 39% बनता है। Tom और Aisha के 32% और 29% आते हैं, और 39 + 32 + 29 है 100। हर राशि किराए का वही प्रतिशत है: £1,950 का 39% है £760.50।"
  - heading: "फिर उसे Side Badger में डालें"
    body: "पूरी कहानी के लिए, मापने वाले फीते समेत, [कमरे के आकार से किराया कैसे बांटें](page:guide/how-to-split-rent-by-room-size) देखें, या कपल्स के लिए [ज़्यादा कमाने वाला पार्टनर](page:guide/how-to-split-bills-with-a-partner-who-earns-more) देखें।"
    items:
      - "**किराया जोड़ें।** अपने ग्रुप में **व्यय जोड़ें** चुनें, **किसने भुगतान किया?** में चुनें कि मकान-मालिक को किसने दिया, और **विभाजित करें** में सबको रहने दें।"
      - "**प्रतिशत चुनें।** **विभाजन कैसे करें** में **प्रतिशत** चुनें और पूरे प्रतिशत टाइप करें। अगर उनका जोड़ 100 नहीं है, तो फॉर्म बता देता है।"
      - "**अगले महीने कॉपी करें।** पिछले महीने का किराया खोलें और **व्यय कॉपी करें** चुनें। बंटवारा साथ में आ जाता है।"
  - heading: "कैलकुलेटर क्या नहीं करता"
    items:
      - "**आपके कमरे नापना।** क्षेत्रफल बस एक शुरुआत है। अटैच्ड बाथरूम वाला कमरा उतने ही क्षेत्रफल के उस कमरे से ज़्यादा कीमती है जिसमें वह नहीं है, और जिस छोटे कमरे में बस एक बिस्तर और एक उम्मीद भरी कुर्सी समाती है, उसकी कीमत कम है।"
      - "**यह तय करना कि आय में क्या गिना जाए।** हाथ में आने वाली या कुल, तनख्वाह या साइड का काम: यह ग्रुप तय करता है। सबके लिए एक ही अवधि लें।"
      - "**कुछ सेव करना।** टैब बंद करते ही आंकड़े चले जाते हैं। उन्हें रखने के लिए लिंक कॉपी करें। उसमें आपके आंकड़े # के बाद रहते हैं, जिसे ब्राउज़र कभी सर्वर को नहीं भेजते, और जिसके पास भी वह लिंक है वह उन्हें पढ़ सकता है।"
      - "**पैसे भेजना।** मकान-मालिक को आप जैसे चाहें पेमेंट करें।"
      - "**करेंसी मिलाना, या सीमाओं के पार जाना।** एक करेंसी चुनें। इसमें 2 से 10 लोग और 999,999.99 तक का किराया चलता है, जैसा ऐप में है।"
