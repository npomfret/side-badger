featuresHeading: "Funkcije, ki jih to uporablja"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali gostje vidijo skupino, ne da bi se ji pridružili?"
      a: "Ne. Ljudje se pridružijo s povezavo ali kodo QR in brezplačnim uporabniškim računom, zato skupino vidijo, ko so noter."
    - q: "Ali lahko Side Badger zbira denar?"
      a: "Ne. Side Badger vodi štetje in nikoli ne premika denarja. Plačajte si, kakor želite, nato plačilo zabeležite. Je brezplačen, brez oglasov in brez dnevnih omejitev; glej [cenik](page:pricing)."
    - q: "Ali so glasovi lahko anonimni?"
      a: "Da. Ko ustvariš anketo, lahko skriješ, kdo je za kaj glasoval. Nastavitve je mogoče spremeniti samo pred prvim glasom."
    - q: "Ali lahko ljudje prispevajo različne zneske?"
      a: "Da. Strošek razdeli po točnih zneskih, da je delež vsake osebe znesek, o katerem ste se dogovorili, ali izpusti ljudi, ki niso sodelovali."
    - q: "Ali lahko organizator vodi knjige?"
      a: "Da. Uporabi prednastavitev upravljane skupine, da stroške spreminjajo samo ustanovitelji in skrbniki, skrbniki pa potrjujejo nove člane."
