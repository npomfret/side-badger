sections:
  - heading: Was Splitwise gut kann
    body: "Wenn deine Gruppe eine native App, Offline-Nutzung oder Zahlungen in der App braucht, ist Splitwise die vernünftige Wahl, und wir sehen es lieber, dass du es nimmst, als dass du es später merkst. Seine eigenen Seiten nennen:"
    items:
      - "**Apps und Offline-Nutzung.** Apps für iPhone und Android sowie das Web und einen Offline-Modus."
      - "**Mehr Arten zu teilen.** Anteile, Anpassungen und Aufteilung nach Posten, zusätzlich zu gleichmäßig, genau und in Prozent."
      - "**Wiederkehrende Ausgaben.** Lass die Miete sich wiederholen und vergiss sie."
      - "**Zahlungen in der App.** In manchen Ländern kann es auch das Geld bewegen, über Splitwise Pay, Venmo, PayPal oder Pay by Bank."
  - heading: Hier kostenlos, dort bezahlt
    body: "Splitwise Pro ist der bezahlte Tarif von Splitwise, und seine eigene Pro-Seite verkauft vier Dinge, die in Side Badger nichts kosten."
    items:
      - "**Belegscan.** Splitwise Pro scannt ein Foto deines Belegs. Side Badger macht das kostenlos und ohne Scan-Guthaben: Es trägt Summe, Datum und Ort ein, damit du sie prüfen kannst. Belegbilder liest der KI-Dienst von Google."
      - "**Währungsumrechnung.** Splitwise Pro rechnet die Ausgaben einer Gruppe in deine Standardwährung um, wenn du auf Umrechnen tippst. Side Badger rechnet jede Ausgabe beim Eingeben um, zu einem aktuellen Wechselkurs oder dem, den du tatsächlich bekommen hast, und der Originalbetrag bleibt an der Ausgabe."
      - "**Keine Werbung.** Splitwise führt ein komplett werbefreies Erlebnis als Pro-Funktion auf. Side Badger hat keine Werbung."
      - "**Keine Tageslimits.** Splitwise Pro verkauft unbegrenzte Ausgaben, und laut seinem Hilfe-Center können in der kostenlosen Version bis zu 4 Ausgaben pro Tag hinzugefügt werden. Side Badger hat keine Tageslimits."
  - heading: Was Splitwise hat und Side Badger nicht
    body: "Das sind nicht alle Splitwise-Funktionen, nur die, die oft den Ausschlag geben. Die vollständige Liste steht auf Splitwises eigenen Seiten. Hier ist Side Badger im Nachteil."
    items:
      - "**Native Apps.** Side Badger läuft in deinem Browser. Melde dich an und füge es dann zum Home-Bildschirm hinzu, und es öffnet sich wie eine App."
      - "**Offline-Modus.** Side Badger braucht eine Verbindung."
      - "**Zahlungen in der App.** Side Badger fasst dein Geld nie an. Zahlt einander, wie ihr wollt, und erfasst dann die Zahlung."
      - "**Wiederkehrende Ausgaben.** Die gibt es bei Side Badger nicht. Kopiere die Miete vom letzten Monat, statt sie neu zu tippen."
      - "**Teilen nach Anteilen oder nach Posten.** Side Badger hat pro Ausgabe eine zahlende Person, gleichmäßig, nach genauen Beträgen oder in Prozent geteilt. Der Belegscan weist Posten nicht Personen zu."
      - "**Diagramme und Standardaufteilungen.** Beides hat Splitwise Pro. Side Badger führt die Rechnung, wer wem was schuldet, und das ist der ganze Trick."
  - heading: Deine Gruppe umziehen
    body: "Es gibt keinen Import, ein Umzug bedeutet also einen Neuanfang. Rechne zuerst in Splitwise ab, lege dann eine Gruppe in Side Badger an und lade alle per Link oder QR-Code ein. Alle in der Gruppe brauchen ein kostenloses Konto, und zur Anmeldung genügt eine E-Mail-Adresse."
