meta:
  title: "గ్రూప్ బహుమతి కోసం వసూలు చేయడం | Side Badger"
  description: "ఒక్కొక్కరు ఒక్కో మొత్తం వేస్తారు, ఒకరి కార్డుపై భారం పడుతుంది. బడ్జెట్ పోల్ పెట్టండి, కచ్చితమైన మొత్తాలు నమోదు చేయండి, లెక్కలు Side Badgerకు వదలండి."
h1: "గ్రూప్ బహుమతి కోసం వసూలు చేయడం"
navLabel: "గ్రూప్ బహుమతి వసూలు"
lead: "గ్రూప్ బహుమతి కోసం వసూలు చేయడం అంటే ఒకరు డబ్బు ముందు పెడతారు, మిగతావాళ్లు తమ వాటాను వాళ్లకు బాకీ పడతారు. పోల్‌తో బడ్జెట్ ఒప్పుకోండి, కొనేవాళ్లు బహుమతిని తమ కార్డుపై పెట్టనివ్వండి, తర్వాత దాన్ని [కచ్చితమైన మొత్తాలు](page:feature/split-expenses)తో ఒకే ఖర్చుగా నమోదు చేయండి, ప్రతి వ్యక్తికి ఒక అంకె. ఎవరు కొనేవాళ్లకు ఎంత బాకీనో Side Badger చూపిస్తుంది, ప్రతి ఒక్కరూ తమ వాటాను నచ్చిన విధంగా పంపుతారు."
cta:
  heading: "టోపీ లేకుండానే చందా వసూలు"
  body: "ఒక గ్రూప్ చేయండి, బహుమతి అందుకునే వ్యక్తిని అందులో చేర్చకండి, బహుమతిని కచ్చితమైన మొత్తాలతో నమోదు చేయండి. Side Badger ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు. ముందు పరిచయం కావాలా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) లేదా [ఉచితంలో ఏముంది](page:pricing) చూడండి."
sections:
  - heading: "నలుగురు స్నేహితులు, ఒక రికార్డ్ ప్లేయర్, నాలుగు వేర్వేరు మొత్తాలు"
    body: "Beaకు 30 ఏళ్లు నిండుతున్నాయి, ఆమెకు రికార్డ్ ప్లేయర్ కావాలి. Priya, Omar, Lena, Sam దాన్ని ఆమెకు కొంటున్నారు. Priya £240కు ఒకటి కనుగొని తన సొంత కార్డుతో కొంటుంది, ఎవరో ఒకరు ముందు వెళ్లాలి కదా. నలుగురూ సమానంగా వేయరు. Priya, Omar చెరో £60 వేశారు, Lena £80, Sam £40. తమ అంకె గురించి ఎవరూ వివరించరు, ఎవరూ అడగరు. Omar £12కు ఒక కార్డు, ర్యాపింగ్ పేపర్ కూడా కొన్నాడు. నలుగురూ కార్డుపై సంతకం చేస్తారు, కాబట్టి అది సమానంగా పంచబడుతుంది."
  - heading: "కొనుగోలు నొక్కే ముందే బడ్జెట్ ఒప్పుకోండి"
    body: "£400 టర్న్‌టేబుల్ గురించిన వాదనను బడ్జెట్ పోల్ తప్పిస్తుంది. గ్రూప్‌లో **పోల్‌ను జోడించు** ఎంచుకుని బహుమతి ఎంత ఖర్చు కావాలని అడగండి. ఎంపికలను మొత్తాలుగా పెట్టండి, £150 వరకు, £200 వరకు, £250 వరకు లాగా. **అనామక ఓటింగ్** ఆన్ చేయండి, అది ఎవరు దేనికి ఓటు వేశారో దాచుతుంది, కాబట్టి చిన్న అంకెను బహిరంగంగా సమర్థించుకోవాల్సిన పని ఎవరికీ ఉండదు. మొదటి ఓటు పడ్డాక సెట్టింగ్‌లు మార్చలేరు, కాబట్టి ముందే చూసుకోండి. పోల్ తనంతట తాను ముగియదు. అందరూ ఓటు వేశాక **పోల్‌ను ముగించు** ఎంచుకోండి, **విజేత** కనిపిస్తుంది. పోల్ మొత్తాన్ని ఒప్పిస్తుంది, ఎవరి వాటానూ నిర్ణయించదు."
  - heading: "లెక్క చదవడం"
    body: "బహుమతి £60, £60, £80, £40గా విడిపోతుంది, ఇవి కలిసి రసీదులోని £240 అవుతాయి. కార్డు, ర్యాపింగ్ నాలుగు భాగాలుగా ఒక్కొక్కరికి £3 చొప్పున విడిపోతాయి. Priya బిల్లు £60 + £3, అంటే £63, ఆమె £240 చెల్లించింది, కాబట్టి ఆమెకు £177 రావాలి. Omar బిల్లు కూడా £63, కానీ అతను £12 చెల్లించాడు, కాబట్టి అతను £51 బాకీ. Lena £80 + £3, అంటే £83 బాకీ, Sam £40 + £3, అంటే £43 బాకీ. ఆ ముగ్గురివీ కలిపితే Priyaకు రావాల్సిన £177 అవుతుంది. అలాగే వదిలేస్తే అప్పులు గ్రూప్‌లో ఐదు వైపులా తిరుగుతాయి. బదులుగా Side Badger మూడు పేమెంట్లను సూచిస్తుంది, అన్నీ Priyaకే. [లెక్క తేల్చడం](page:feature/settle-up)లో వివరాలు ఉన్నాయి."
  - heading: "Side Badgerలో పెట్టండి"
    body: "Priya వైపు పనికి సుమారు ఐదు నిమిషాలు పడుతుంది."
    items:
      - "**గ్రూప్ చేయండి.** డాష్‌బోర్డ్‌లో **సమూహాన్ని సృష్టించు** ఎంచుకోండి. **ఇతరులను ఆహ్వానించండి** ఎంచుకుని, లింక్ లేదా QR కోడ్‌ను చందా వేసేవాళ్లకు మాత్రమే పంపండి, ఇంకెవరికీ కాదు."
      - "**బహుమతిని జోడించండి.** **ఖర్చును జోడించు** ఎంచుకుని, వివరించండి, 240 నమోదు చేయండి, **ఎవరు చెల్లించారు?** కింద Priyaను ఎంచుకోండి. **ఎవరి మధ్య విభజించాలి** కింద నలుగురినీ ఉంచండి, తర్వాత **ఎలా విభజించాలి** కింద **కచ్చితమైన మొత్తాలు** ఎంచుకుని 60, 60, 80, 40 టైప్ చేయండి. మొత్తాలు కలిపితే 240 అవ్వాలి. కావాలంటే ఆర్డర్ నిర్ధారణను జత చేయండి. **ఖర్చును సేవ్ చేయి** ఎంచుకోండి."
      - "**కార్డును జోడించండి.** Omar £12ను తానే జోడిస్తాడు, **ఎవరు చెల్లించారు?** కింద తనను ఎంచుకుని, నలుగురూ టిక్ అయి ఉండగా **ఎలా విభజించాలి**ని **సమానం**గా వదిలేస్తాడు."
      - "**లెక్క చూడండి, తర్వాత చెల్లించండి.** ప్రతి ఒక్కరూ **బ్యాలెన్స్‌లు** చూస్తారు, అది ఎవరు ఎవరికి బాకీనో చూపిస్తుంది, తమ వాటాను నచ్చిన విధంగా Priyaకు పంపుతారు. తర్వాత **సెటిల్ చేయి**, **సెటిల్మెంట్‌ను నమోదు చేయి**తో నమోదు చేయండి. త్వరిత సెటిల్మెంట్ మొత్తాన్ని నింపుతుంది."
  - heading: "ముందు కొనండి, లేదా ముందు వసూలు చేయండి"
    body: "Side Badger చందా డబ్బును తన దగ్గర ఉంచదు, కాబట్టి “వసూలు చేయడం” అంటే నిజానికి లెక్కించడమే. రెండు వరుసలు పనిచేస్తాయి."
    items:
      - "**ముందు కొనండి.** కొనేవాళ్లు చెల్లించి, అసలు ధరతో ఖర్చును జోడిస్తారు, ప్రతి ఒక్కరికీ తమ వాటా వెంటనే కనిపిస్తుంది. ఇది చక్కగా ఉంటుంది, కానీ జనం చెల్లించే వరకు కొనేవాళ్లే భారం మోస్తారు, కాబట్టి భరించగలిగే వాళ్లను ఎంచుకోండి."
      - "**ముందు వసూలు చేయండి.** కొనుగోలుకు ముందే జనం తమ అంకెను కొనేవాళ్లకు పంపుతారు. ధర తెలిశాక బహుమతిని నమోదు చేయండి, తర్వాత ప్రతి పేమెంట్‌ను డబ్బు నిజంగా కదిలిన తేదీతో నమోదు చేయండి. బహుమతిని ముందు జోడించండి, అప్పుడు ప్రతి పేమెంట్‌కు తగిలే బ్యాలెన్స్ ఉంటుంది."
      - "**ధర మారుతుంది.** డెలివరీ, డిస్కౌంట్ కోడ్, ఆలస్యంగా వచ్చిన ధర పెంపు. బహుమతిని సవరించి, కచ్చితమైన మొత్తాలు ఇంకా కలిసేలా మార్చండి. పాత వెర్షన్ ఉంచబడుతుంది, కానీ ముందు గ్రూప్‌కు చెప్పండి, ఎందుకంటే వాళ్ల బ్యాలెన్స్‌లు మారతాయి."
  - heading: "Beaను దీనికి దూరంగా ఉంచండి"
    body: "గ్రూప్‌లోని సభ్యులు మాత్రమే దాన్ని చూడగలరు, కాబట్టి Bea తాను లేని గ్రూప్‌ను చూడలేదు. చందా వేసేవాళ్లను మాత్రమే ఆహ్వానించండి, ఇంకెవరినీ కాదు. లింక్ గడువు ముగిసే వరకు పనిచేస్తుంది, 15 నిమిషాల నుంచి 5 రోజుల వరకు ఏదైనా ఎంచుకోవచ్చు, కాబట్టి చిన్నదాన్ని ఎంచుకుని Bea చూడని చోట పంపండి. లింక్ తెరిచిన వాళ్లకు గ్రూప్ ప్రివ్యూ కనిపిస్తుంది, కాబట్టి గ్రూప్‌కు శనివారం చందా లాంటి చప్పగా ఉండే పేరు పెట్టండి, Bea పేరును ఖర్చు లేబుళ్లలో, పోల్ ఎంపికల్లో కూడా రానివ్వకండి."
  - heading: "ఇక్కడ Side Badger ఏం చేయదు"
    items:
      - "ఇది డబ్బును ఉంచదు, వసూలు చేయదు. చందాలు బ్యాంక్ బదిలీ, నగదు లేదా మీరు వాడేదాని ద్వారా కొనేవాళ్లకు వెళ్తాయి, తర్వాత ఎవరో వాటిని నమోదు చేస్తారు."
      - "ఇది పేమెంట్ రిమైండర్లు పంపదు. చెల్లించని వాళ్లను గుర్తు చేయడం ఇప్పటికీ మనిషి పనే."
      - "ఇది ఎవరి వాటానూ లెక్కించదు. పోల్ బడ్జెట్‌ను ఒప్పిస్తుంది, “మిగిలినది పంచు” ఎంపిక లేదు, కాబట్టి ప్రతి మొత్తాన్ని మీరే టైప్ చేస్తారు."
      - "ప్రతి ఖర్చుకు ఒకే చెల్లించినవాళ్లు ఉంటారు. బహుమతిలోని వేర్వేరు భాగాలను ఇద్దరు కొంటే, రెండు ఖర్చులు నమోదు చేయండి."
      - "విభజనలో ఉన్న ప్రతి ఒక్కరికీ ఉచిత ఖాతా, గ్రూప్‌లో చోటు కావాలి."
exampleAfter: 2
