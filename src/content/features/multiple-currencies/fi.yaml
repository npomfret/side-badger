sections:
  - heading: Yksi valuutta koko ryhmälle
    body: Jos ryhmäsi ei halua miettiä asiaa, valitse ryhmän valuutta, niin lomake muuntaa jokaisen uuden kulun siihen kurssilla, jonka näet ja voit yhä muuttaa. Tämä koskee vain uusia ja kopioituja kuluja. Muokkauksia ja olemassa olevia kuluja ei muuteta, joten mikään jo kirjattu ei muutu altasi.
  - heading: Velkaa euroja, maksu puntina
    body: Maksoit jeneillä mutta tasaat puntina? Ei ongelmaa. Kun kirjaat maksun, voit muuntaa senkin, joten euroja velkaa oleva voi maksaa puntina ja euro-saldo silti menee oikein. Maksakaa toisillenne miten haluatte ja kirjaa se sitten.
  - heading: Säännöt ryhmälle
    body: Rajaa ryhmä valuuttoihin, joita oikeasti käytät, ja aseta oletus, jotta lomake aukeaa oikeaan. Portugalin lomalla ei tarvita 139 muuta vaihtoehtoa illallislaskun vieressä, ja [ulkomaiset häät](page:use-case/events-and-celebrations) tarvitsevat luultavasti kaksi.
limits:
  heading: Rajat
  items:
    - Kurssi lukitaan, kun kulu tallennetaan. Vanhoja kuluja ei koskaan arvosteta uudelleen.
    - Side Badger hakee nykyisen kurssin, kun mahdollista. Kaikille valuuttapareille ei ole varmuutta kurssista, ja voit aina kirjoittaa kurssin itse.
    - Ryhmän automaattinen muunnos koskee vain uusia ja kopioituja kuluja, ei muokkauksia eikä olemassa olevia kuluja.
    - Jokainen kulu on enintään 999 999,99 omassa valuutassaan.
    - Valuuttoja on 140. Kryptovaluutat ja metallit eivät kuulu joukkoon.
    - Side Badger kirjaa maksuja. Se ei koskaan siirrä rahaa eikä vaihda sitä.
useCasesHeading: Missä tästä on hyötyä
faq:
  heading: Kysymyksiä
  items:
    - q: Mitä valuuttakurssia käytätte?
      a: Nykyistä valuuttakurssia, joka haetaan kulua syötettäessä, kun sellainen on saatavilla. Voit vaihtaa sen kurssiin, jonka todella sait, ja muunnettu summa päivittyy.
    - q: Arvostetaanko vanhat kulut uudelleen?
      a: Ei. Kurssi lukitaan, kun kulu tallennetaan, joten saldo ei ajelehdi markkinoiden mukana.
    - q: Tuetteko kryptoa?
      a: Ei. Valuuttoja on 140, eivätkä kryptovaluutat kuulu niihin.
    - q: Miksi en voi syöttää 2 000 000 rupiaa?
      a: Jokainen kulu on enintään 999 999,99 omassa valuutassaan. Syötä se toisessa valuutassa ja muunna tai jaa kahdeksi kuluksi.
    - q: Maksaako muuntaminen mitään?
      a: Ei. Muuntaminen on ilmaista kuten muukin Side Badgerissa. Katso [hinnoittelu](page:pricing).
    - q: Onko minun pakko muuntaa?
      a: Ei. Valuutat pysyvät erillään, ellet sinä tai ryhmäsi valitse muuntamista, ja jokaisella valuutalla on oma lyhyt maksulistansa.
