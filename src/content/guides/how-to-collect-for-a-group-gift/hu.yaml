faq:
  heading: "Kérdések"
  items:
    - q: "Mi van, ha többet gyűjtünk, mint amennyibe az ajándék kerül?"
      a: "A pontos összegeknek ki kell adniuk az árat, ezért addig csökkentsd a részeket, amíg ez nem sikerül. Vagy költsd a többletet valami valódira, például virágra, és vidd be második költségként, mint a példában az üdvözlőkártyát és a csomagolást."
    - q: "Beszállhat valaki úgy, hogy nem csatlakozik a csoporthoz?"
      a: "Nem, ha azt akarjátok, hogy benne legyen a számolásban. A felosztásban szereplő mindenkinek kell egy ingyenes fiók, és tagnak kell lennie a csoportban. Annak, akinek csak készpénze van, Priya elveheti, és az ajándékot annyiért viheti fel, amennyivel a csoport még tartozik. Például ha Sam 40 £-ot adna neki készpénzben, Priya 200 £-ot vinne fel, és 60, 60 és 80 szerint osztaná el saját maga, Omar és Lena között."
    - q: "Dönthet a szavazás arról, ki mennyit tesz be?"
      a: "Nem. A szavazás az egész csoportra egy számot dönt el, például a keretet. Az egyes részekről köztetek kell megegyeznetek, aztán a költségbe a **Pontos összegek** módszerrel írjátok be őket."
