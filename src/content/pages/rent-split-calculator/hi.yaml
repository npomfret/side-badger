faq:
  heading: "सवाल"
  items:
    - q: "कौन-सा ज़्यादा ठीक है, कमरे का आकार या आय?"
      a: "दोनों में से कोई भी हमेशा नहीं। कमरे का आकार उन फ्लैटमेट्स को जंचता है जो उस जगह के लिए देते हैं जिसमें वे सोते हैं। आय उन कपल्स और दोस्तों को जंचती है जिनकी कमाई में बड़ा फर्क है। इसे किराया देने की पहली तारीख से पहले तय करें, बाद में नहीं।"
    - q: "क्या बिल भी इसी तरह बांटने चाहिए?"
      a: "फ्लैटमेट्स के लिए आमतौर पर नहीं। बिजली और ब्रॉडबैंड सब इस्तेमाल करते हैं, इसलिए बराबर बांटना आसान है, जैसा उदाहरण में है। आय के हिसाब से बांटने पर कैलकुलेटर बिलों को किराए जैसे ही हिस्से देता है।"
    - q: "क्या मैं वर्ग फ़ुट इस्तेमाल कर सकता हूँ?"
      a: "हाँ। ft² चुनें और अपने क्षेत्रफल वर्ग फ़ुट में टाइप करें। इकाई सिर्फ एक लेबल है, और जब तक सब एक ही इकाई इस्तेमाल करें, हिस्से वही निकलते हैं।"
    - q: "क्या कैलकुलेटर मुफ्त है?"
      a: "हाँ। मुफ्त। कोई विज्ञापन नहीं। रोज़ाना की कोई सीमा नहीं। अकाउंट की भी ज़रूरत नहीं।"
