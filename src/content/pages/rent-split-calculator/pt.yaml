faq:
  heading: "Perguntas"
  items:
    - q: "O que é mais justo, o tamanho do quarto ou o rendimento?"
      a: "Nenhum é sempre o mais justo. O tamanho do quarto serve para colegas de casa que pagam pelo espaço onde dormem. O rendimento serve para casais e amigos com salários muito diferentes. Combinem antes do primeiro dia de renda, e não depois."
    - q: "As contas devem ser divididas da mesma maneira?"
      a: "Entre colegas de casa, normalmente não. Todos usam a eletricidade e a internet, por isso partes iguais é mais simples, como no exemplo. Por rendimento, a calculadora dá às contas as mesmas partes da renda."
    - q: "Posso usar pés quadrados?"
      a: "Sim. Escolhe ft² e escreve as áreas em pés quadrados. A unidade é só uma etiqueta, e as partes saem iguais desde que todos usem a mesma."
    - q: "A calculadora é grátis?"
      a: "Sim. Grátis. Sem anúncios. Sem limites diários. Também não precisas de uma conta."
