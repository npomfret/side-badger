    - id: chloe
      name: Chloé
    - id: dev
      name: Dev
  expenses:
    - label: 航空券
      payer: ana
      amount: 480
      split:
        method: equal
    - label: ヴィラ
      payer: ben
      amount: 900
      currency: EUR
      split:
        method: equal
    - label: 夕食
      payer: chloe
      amount: 120
      currency: EUR
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: ボートツアー
      payer: dev
      amount: 160
      currency: EUR
      split:
        method: equal
  conversion:
    rates:
      EUR: 0.85
featuresHeading: 旅行が頼りにする機能
faq:
  heading: よくある質問
  items:
    - q: 夕食を欠席した人を外せますか？
      a: はい。各支出に参加した人を選べば、その人たちだけに請求されます。
    - q: 電波がなくても使えますか？
      a: いいえ。Side Badgerは接続が必要なので、Wi-Fiに戻ってから費用を追加してください。
    - q: 全員が何かをインストールする必要がありますか？
      a: いいえ。ブラウザで動作します。招待リンクを送れば、スマートフォンから参加できます。
    - q: どの為替レートを使いますか？
      a: 支出を入力した時点の現在の為替レートです。異なるレートが適用された場合は、そのレートを入力できます。レートは支出を保存した時点で固定されるので、過去の支出が再評価されることはありません。
    - q: 旅行のあと、グループを固定できますか？
      a: はい。管理者がグループをロックすれば、数字は動きません。
    - q: 金額に上限はありますか？
      a: はい。1件の支出につき、その通貨で999,999.99までです。
