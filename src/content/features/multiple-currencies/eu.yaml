sections:
  - heading: Moneta bat talde osorako
    body: Zure taldeak horretan pentsatu nahi ez badu, aukeratu taldearen moneta bat eta formularioak gastu berri bakoitza horretara bihurtuko du, ikusi eta alda dezakezun tasa batean. Gastu berriei eta kopiatuei bakarrik aplikatzen zaie. Edizioak eta lehendik dauden gastuak dauden bezala uzten dira, beraz jada erregistratuta dagoen ezer ez da aldatzen zure azpian.
  - heading: Euroak zor, libera esterlinetan ordaindu
    body: Yenetan ordaindu, libera esterlinetan kitatu? Ondo. Ordainketa bat erregistratzean hori ere bihur dezakezu, beraz euroak zor dituenak libera esterlinetan ordain dezake eta euro-saldoak ondo ateratzen jarraitzen du. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu.
  - heading: Taldearentzako arauak
    body: Mugatu talde bat benetan erabiltzen ari zareten monetetara, eta ezarri lehenetsi bat formularioa moneta egokian ireki dadin. Portugalen oporraldi batek ez ditu beste 139 aukerak behar afari-fakturaren ondoan, eta [atzerriko ezkontza batek](page:use-case/events-and-celebrations) seguruenik bi behar ditu.
limits:
  heading: Mugak
  items:
    - Tasa gastua gordetzen denean finkatzen da. Gastu zaharrak ez dira inoiz berriro baloratzen.
    - Side Badger egungo tasa bat lortzen saiatzen da ahal duen lekuan. Ez dago bermatuta moneta-pare guztiek tasa bat izango dutenik, eta tasa zeuk idatz dezakezu beti.
    - Taldearen bihurketa automatikoa gastu berriei eta kopiatuei bakarrik aplikatzen zaie, ez edizioei edo lehendik dauden gastuei.
    - Gastu bakoitzak gehienez 999.999,99 du bere monetan.
    - 140 moneta daude. Kriptomonetak eta metalak ez daude haien artean.
    - Side Badger-ek ordainketak erregistratzen ditu. Ez du inoiz dirua mugitzen ez trukatzen.
useCasesHeading: Hau non laguntzen duen
faq:
  heading: Galderak
  items:
    - q: Zer kanbio-tasa erabiltzen duzue?
      a: Egungo kanbio-tasa bat, gastua sartzen duzunean lortua, eskuragarri dagoen lekuan. Benetan lortu zenuen tasara alda dezakezu, eta bihurtutako zenbatekoa eguneratzen da.
    - q: Gastu zaharrak berriro baloratzen al dira?
      a: Ez. Tasa gastua gordetzen denean finkatzen da, beraz saldo bat ez da mugitzen merkatua mugitu delako.
    - q: Kriptomonetak onartzen al dituzue?
      a: Ez. 140 moneta daude, eta kriptomonetak ez daude haien artean.
    - q: Zergatik ezin dut 2.000.000 rupia sartu?
      a: Gastu bakoitzak gehienez 999.999,99 du bere monetan. Sartu beste moneta batean eta bihurtu, edo zatitu bi gastutan.
    - q: Bihurtzeak ezer kostatzen al du?
      a: Ez. Bihurtzea doakoa da, Side Badger-en gainerakoa bezala. Ikusi [prezioak](page:pricing).
    - q: Bihurtu behar al dut?
      a: Ez. Monetak bereizita geratzen dira zuk edo zure taldeak bihurtzea aukeratzen ez baduzue, eta moneta bakoitzak ordainketen zerrenda labur propioa du.
