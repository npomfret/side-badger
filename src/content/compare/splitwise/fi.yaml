meta:
  title: "Side Badger vs Splitwise: koko ryhmälle, ei vain laskuille | Side Badger"
  description: "Ilmainen Splitwise-vaihtoehto koko ryhmälle: kommentit, kysymykset, listat, äänestykset ja kunnon roolit sekä ilmainen kuittien skannaus ja valuuttamuunnos."
h1: "Side Badger vs Splitwise: koko ryhmälle, ei vain laskuille"
navLabel: Side Badger vs Splitwise
lead: "Joku ryhmässäsi on luultavasti sanonut ”käytä vaan Splitwisea”. Ihan reilu ehdotus: se osaa laskea. Side Badger laskee myös ja antaa sitten ryhmälle paikan, jossa asiat voi puhua halki: kommentit, kysymykset, listat, äänestykset ja kunnon ryhmäroolit. Kuittien skannaus ja valuuttamuunnos tulevat kaupan päälle ilmaiseksi."
cta:
  heading: Kokeile seuraavaa yhteistä laskua
  body: "Luo ilmainen tili, perusta ryhmä ja lisää yksi oikea kulu. Jos se ei ole sinua varten, olet käyttänyt pari minuuttia, et tilausta."
asOf: 2026-11-22
asOfNote: "Luimme Splitwisen omat sivut {date}, jotta sinun ei tarvitse, ja kaikki täällä Splitwisesta kerrottu tulee niistä. Jokainen taulukon rivi linkittää lähteeseensä. Tilausmallit muuttuvat, joten tarkistamme ne uudelleen neljännesvuosittain, ja jos Splitwisen sivut ovat eri mieltä tämän sivun kanssa, usko niitä."
