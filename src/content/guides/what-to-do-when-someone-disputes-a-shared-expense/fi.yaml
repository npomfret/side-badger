meta:
  title: Mitä tehdä, kun joku riitauttaa yhteisen kulun | Side Badger
  description: Jätä piikikäs viesti väliin. Kyseenalaista kulu, niin se poistuu kaikkien saldoista keskustelun ajaksi. Läpikäytynä esimerkillä, jossa on 45 £ juhlaviiniä.
h1: Mitä tehdä, kun joku riitauttaa yhteisen kulun
navLabel: Riitautetut kulut
lead: Nosta kulusta kysymys sen sijaan, että lähettäisit piikikkään viestin. Niin kauan kuin kysymys on auki, koko kulu pysyy pois kaikkien saldoista. Käy asia läpi kommenteissa, muokkaa jakoa, jos ryhmä on yhtä mieltä, ja anna kysymyksen esittäjän tai ylläpitäjän sulkea kysymys.
cta:
  heading: Esitä kiusallinen kysymys kohteliaasti
  body: Luo ilmainen tili, perusta ryhmä kämpälle ja pyydä ylläpitäjää ottamaan kulukysymykset käyttöön; ne ovat pois päältä, kunnes joku kytkee ne päälle. Haluatko tutustua ensin? Katso [näin se toimii](page:how-it-works) tai [mitä ilmainen kattaa](page:pricing).
sections:
  - heading: Kolme kämppistä ja 45 £ viiniä
    body: Juhlien jälkeen Tom lisää viinin kämpän ryhmään. Se maksaa 45 £, Tom maksoi sen, ja se jaetaan tasan Tomin, Priyan ja Aishan kesken, eli 15 £ kullekin. Aisha ei juo. Tom osti viinin juhliin, ja juhlat olivat [kämpän](page:use-case/housemates) yhteiset, joten hän ei ole tehnyt mitään väärää. Aishakaan ei ole väärässä kysyessään. Kukaan ei ole tässä pahis. Kiistassa on vain 15 £ viiniä ja monta tapaa tehdä siitä kiusallista. Piikikäs viesti koko talolle on yksi. Kysymys kulusta on lempeämpi.
  - heading: Mitä kysymys tekee
    body: Aisha avaa kulun ja esittää kysymyksen. Koko kulu putoaa kaikkien saldoista, ei vain hänen osuutensa, eikä mikään muu muutu. Isot ruokaostokset (84 £) ja siivooja (60 £) lasketaan edelleen, eli 28 £ + 20 £ = 48 £ kullekin. Kun viini on odotustilassa, Aisha on velkaa 48 £, Tomille ollaan velkaa 36 £ ja Priyalle 12 £. Mitä kämppä viinistä päättääkin, kenenkään saldo ei sillä välin sisällä sitä. Myös kuka tahansa muu kulussa mukana oleva voi esittää oman kysymyksensä. Viini palaa saldoihin vasta, kun sen viimeinenkin avoin kysymys on suljettu, ja kysymyksen sulkee sen esittänyt henkilö tai ylläpitäjä.
  - heading: Keskustelu ensin, korjaus sitten
    body: Aishan kysymys päätyy kulun kommentteihin, joten vastaukset ovat heti sen alla. Lisää kommenteista ja kysymyksistä kertoo [Suunnitelkaa yhdessä](page:feature/plan-together). Tom ja Priya lukevat sen, ja kämppä keskustelee. He päättävät, että viini oli Tomin ja Priyan, koska he joivat sen. Toinen kämppä voisi pitää jaon kolmeen osaan tai sopia jotain siltä väliltä, ja sekin olisi aivan hyvä. Side Badger tallentaa sen, mistä sovitte, eikä sillä ole mielipidettä viinistä. Tom muokkaa kulua niin, että se jaetaan tasan hänen ja Priyan kesken, eli 22,50 £ kummallekin (45 £ ÷ 2). Aisha ei ole enää mukana, joten hänen kysymyksensä jää vanhaan versioon ja viini palaa saldoihin. Aiempi versio säilyy.
  - heading: Tuloksen lukeminen
    body: Kun viini on takaisin mukana, Tomille ollaan velkaa 58,50 £, Priya on velkaa 10,50 £ ja Aisha on velkaa 48 £. Side Badger ehdottaa kahta maksua, molemmat Tomille. Aishan 48 £ on sama luku kuin hänellä oli viinin ollessa odotustilassa, koska hän ei ole viinissä mukana. Priyalle oltiin velkaa 12 £, mutta nyt hän on velkaa 10,50 £, sillä hänen puolikkaansa viinistä on 22,50 £. Jos jako kolmeen osaan olisi jäänyt voimaan, Aisha olisi ollut velkaa 63 £ (28 £ + 20 £ + 15 £). Koko erimielisyyden arvo oli 15 £. Maksakaa toisillenne miten haluatte ja kirjaa sitten jokainen maksu kohdassa **Maksa velat**. Loput kertoo [tilien tasaus](page:feature/settle-up).
  - heading: Muotoile kysymys niin, että ihmiset puhuvat sinulle edelleen
    body: "Aishan kysymys: ”En ottanut viinistä yhtään. Voisimmeko katsoa jakoa?” Se on lyhyt, se nimeää kulun ja se kysyy eikä syytä. Muutama tapa auttaa."
    items:
      - "**Kysy kulusta, älä ihmisestä.** ”Voisimmeko tarkistaa viinin jaon?” aloittaa keskustelun. ”Miksi minulta veloitetaan sinun viinistäsi?” aloittaa toisenlaisen."
      - "**Kerro, mitä toivoisit tapahtuvan.** ”Voisiko se olla vain niiden, jotka joivat sen?” antaa ryhmälle jotain, mihin yhtyä tai mihin vastata."
      - "**Perustele lauseella tai kahdella.** Kenttä on **Kysymyksesi**, eikä sitä voi jättää tyhjäksi."
      - "**Pidä vastaukset yhdessä paikassa.** Vastaukset menevät kulun kommentteihin, niiden lukujen viereen, joita ne koskevat."
  - heading: Ota se käyttöön Side Badgerissa
    items:
      - "**Ota kysymykset käyttöön.** Ne ovat oletuksena pois päältä. Ylläpitäjä avaa ryhmän **Asetukset**, ottaa **Yleiset**-välilehden **Ominaisuudet**-osiossa käyttöön **Salli kysymykset kuluista** ja valitsee **Tallenna**. Jos ominaisuuden kytkee myöhemmin pois, kaikki avoimet kysymykset tyhjennetään."
      - "**Esitä kysymys.** Avaa kulu ja valitse jaossa oman nimesi vierestä **Minulla on kysymys**. Kirjoita perustelusi kenttään **Kysymyksesi** ja valitse uudelleen **Minulla on kysymys**. Vain kulussa mukana olevat voivat tehdä tämän. Kulussa näkyy nyt **Kyseenalaistettu**-merkki."
      - "**Löydä odotustilassa olevat.** Kululistassa **Vain kyseenalaistettu** näyttää kulut, joissa on avoin kysymys."
      - "**Korjaa, jos ryhmä on samaa mieltä.** Avaa kulu, valitse **Muokkaa**, muuta kohtaa **Jaa seuraavien kesken** ja valitse **Päivitä kulu**. Se, kuka voi muokata, riippuu ryhmän oikeuksista."
      - "**Sulje se, jos mitään ei tarvitse korjata.** Kysymyksen esittänyt voi käyttää **Kyseenalaistettu**-merkkinsä sulkupainiketta, jonka nimi on **Sulje kysymys**, ja niin voi ylläpitäjäkin. Kulu palaa saldoihin, kun sen viimeinenkin kysymys on suljettu."
  - heading: Kun asia ei ole noin siisti
    items:
      - "**Muokkaus jättää kysyjän mukaan.** Jos kysymyksen esittänyt on yhä kulussa mukana, hänen kysymyksensä siirtyy muokattuun versioon ja odottaa, että hän tai ylläpitäjä sulkee sen. Summan korjaaminen ei tarkoita, että kaikki ovat samaa mieltä siitä, että se on korjattu."
      - "**Et ollut kulussa mukana.** Vain kulussa mukana olevat voivat kyseenalaistaa sen. Jos jokin näyttää sinusta oudolta, sano se kulun kommenteissa tai kysy siltä, joka sen lisäsi."
      - "**Joku haluaa poistua ryhmästä.** Avoin kysymys estää kulussa mukana olevia poistumasta. Sulje kysymys tai muokkaa kulua niin, etteivät he ole enää siinä mukana, niin he voivat lähteä."
  - heading: Mitä Side Badger ei tee tässä
    items:
      - Se ei ratkaise, kuka on oikeassa. Se pitää kulun poissa saldoista ja tallentaa sen, mistä sovitte.
      - Se ei pyydä ketään hyväksymään kuluja ennen kuin ne lasketaan mukaan. Vain kyseenalaistettu kulu pidetään odotustilassa.
      - Se ei voi pidättää osaa kulusta. Kyseenalaista kulu, ja koko kulu poistuu saldoista.
      - Se ei siirrä rahaa. Maksatte toisillenne miten haluatte ja kirjaatte maksun.
