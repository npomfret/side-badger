faq:
  heading: "Otázky"
  items:
    - q: "Je Side Badger bezplatná alternativa ke Splitwise?"
      a: "Pro dělení účtů ve skupině ano. Skenování účtenek a převod měn jsou zdarma, reklamy tu nejsou a nejsou ani žádné denní limity. Pokud potřebujete nativní aplikaci, použití offline, opakované výdaje nebo platby uvnitř aplikace, Splitwise je umí a Side Badger ne."
    - q: "Odkud pocházejí údaje o Splitwise?"
      a: "Z vlastních stránek Splitwise: jeho domovské stránky, stránky Pro a centra nápovědy. Každý řádek tabulky odkazuje na stránku, odkud pochází, a datum nad tabulkou říká, kdy jsme je četli. Kontrolujeme je každé čtvrtletí."
    - q: "Zůstane Side Badger zdarma?"
      a: "Všechno v Side Badger je dnes zdarma a neexistuje žádný placený tarif. Pokud se to někdy změní, nejdřív vám dáme vědět. Podrobnosti má [stránka s ceníkem](page:pricing)."
    - q: "Musí přejít všichni ve skupině?"
      a: "Ano. Každý ve skupině potřebuje bezplatný účet v Side Badger a může se připojit odkazem nebo QR kódem."
    - q: "Má Side Badger mobilní aplikaci?"
      a: "Ne v obchodě s aplikacemi. Běží v prohlížeči: přihlaste se na telefonu a pak ho přidejte na domovskou obrazovku, aby se otevíral jako aplikace. Jak na to, ukazuje část [Jak to funguje](page:how-it-works)."
