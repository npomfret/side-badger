faq:
  heading: 别墅常见问题
  items:
    - q: 如果有人取消了怎么办？
      a: 扣掉他们的晚数，重新计算，再编辑别墅这笔支出，让确切金额重新加起来等于总价。之前的版本会保留，修改也会显示在群组活动里，所以没人能悄悄改数字。谁能编辑取决于群组的权限。
    - q: 负责订房的人应该少付一点吗？
      a: 这由群组决定。订房是件苦差事，各个群组对它是否值得打折看法不一。无论你们怎么商定，都把它体现在确切金额里，并写进这笔支出的备注或旁边的评论里，这样就不用靠谁来记着这个约定。
    - q: 清洁费可以用不同的方式分吗？
      a: 可以。把清洁费作为单独一笔支出录入，给它自己的分摊方式。整栋房子统一收费的话，适合平分。想让清洁费也跟着晚数走的群组，适合用确切金额。
