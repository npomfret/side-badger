meta:
  title: Jaa kulut tasan, tarkoilla summilla tai prosenteilla | Side Badger
  description: Jaa yhteinen kulu tasan, tarkoilla summilla tai prosenteilla ja jätä pois ne, jotka eivät olleet mukana. Ilmainen, ei mainoksia eikä päivittäisiä rajoja.
h1: Jaa kulut tasan, tarkoilla summilla tai prosenteilla
navLabel: Kulujen jako
lead: Kaikki ei mene 50/50. Side Badger pärjää. Kerro, kuka maksoi, valitse kulun jakaneet ja jaa se **tasan, tarkoilla summilla tai prosenteilla**. Kaunaa myydään erikseen.
cta:
  heading: Jaa seuraava kulu kunnolla
  body: Luo ilmainen tili, perusta ryhmä ja lisää kulu, jonka olet aikonut selvittää. Etkö ole varma, mitä seuraavaksi tapahtuu? Katso [näin se toimii](page:how-it-works) tai tarkista, [mitä ilmaiseen kuuluu](page:pricing).
  button: Luo ilmainen tili
problem:
  heading: Kaikki ei mene 50/50
  body: Vuokra seuraa huoneen kokoa. Lahja seuraa sitä, kuka lupasi mitä. Illallinen seuraa sitä, kuka jäi jälkiruoalle. Laskun jakaminen kahtia toimii siihen asti, kunnes tulee ensimmäinen lasku, joka ei jakaudu niin, ja silloin joku avaa taulukon. Side Badger kirjaa, kuka maksoi, ketkä kulun jakoivat ja miten se jakautuu, joten saldot menevät oikein ilman että kukaan tekee jakolaskua pöydän ääressä.
workflow:
  heading: Kulun lisääminen alusta loppuun
  steps:
    - title: Kerro, kuka maksoi ja mistä
      body: Syötä summa, lyhyt kuvaus ja maksaja. Jokaisella kululla on yksi maksaja, mikä pitää laskut rehellisinä.
      shot: S05
      shotAlt: Kululomake, jossa mökin vuokra on jaettu prosentteina kolmen ihmisen kesken
    - title: Valitse jako
      body: Valitse tasan, tarkat summat tai prosentit. Prosenttien summan on oltava 100 ja tarkkojen summien yhteensä kulun loppusumma.
      shot: S06
      shotAlt: Kululomake, jossa lahjalle on syötetty tarkka summa jokaiselle ihmiselle
    - title: Lisää tarina
      body: Aseta päivämäärä, lisää tunnisteita, paikka ja muistiinpano. Kaikki ryhmässä näkevät samat tiedot ja voivat kommentoida suoraan siinä.
      shot: S08
      shotAlt: Kulu tietoineen, kommenttiketju ja alkuperäinen summa, jolla se syötettiin
    - title: Nosta kysymys, jos jokin näyttää oudolta
      body: Jos ryhmä on ottanut kulukysymykset käyttöön, kuka tahansa kuluun kuuluva voi kyseenalaistaa sen, ja kululista voi näyttää vain kyseenalaistetut.
      shot: S18
      shotAlt: Kululista, jossa Kyseenalaistettu-merkki ja Vain kyseenalaistettu -suodatin
options:
  heading: Kolme tapaa jakaa
  items:
    - title: Tasan
      body: Oletus illallisille, takseille ja kaikelle, minkä kaikki jakoivat tasan. Jos loppusumma ei mene tasan, ylimääräinen penni menee satunnaiselle henkilölle, ei aina samalle. Alla olevassa taksissa se on Ana.
    - title: Tarkoilla summilla
      body: Kirjoita, paljonko kukin on velkaa. Hyvä lahjalle, jossa jokainen valitsi eri hinnan, tai kaupalle, jossa yhden ostoskori sisälsi muutakin kuin yhteiset ruokaostokset. Summien on oltava yhteensä loppusumma.
    - title: Prosenteilla
      body: Anna jokaiselle osuus loppusummasta. Klassikko on vuokra huoneen koon mukaan, jolloin suurin huone maksaa suurimman osan eikä kukaan teeskentele muuta.
