featuresHeading: "Y nodweddion y mae cwpl yn eu defnyddio"
faq:
  heading: "Cwestiynau"
  items:
    - q: "Allwn ni osod 60/40 unwaith ar gyfer popeth?"
      a: "Na. Mae'r rhaniad yn perthyn i bob cost. Gosodwch y canrannau ar y gyntaf, yna copïwch hi y tro nesaf a newidiwch beth sy'n wahanol. Mae [rhannu treuliau](page:feature/split-expenses) yn trafod y tair ffordd o rannu."
    - q: "Ydy Side Badger yn cysylltu â'n banc ni?"
      a: "Nac ydy. Dyw Side Badger byth yn cyffwrdd â'ch arian. Rydych yn talu eich gilydd sut bynnag y dymunwch, yna'n ei gofnodi, fel mae [setlo](page:feature/settle-up) yn esbonio."
    - q: "All unrhyw un arall weld ein grŵp ni?"
      a: "Dim ond ei aelodau, ac mae gan grŵp cwpl ddau. Gall unrhyw un sy'n defnyddio dolen wahodd sy'n dal i weithio ymuno, felly rhannwch hi ag un person a rhowch ddyddiad dod i ben byr iddi."
    - q: "Beth os talodd y ddau ohonom ran o'r un bil?"
      a: "Mae gan gost un talwr. Cofnodwch ddwy gost, un i bob un ohonoch, ac mae'r balans yr un fath."
    - q: "A fydd Side Badger yn atgoffa fy mhartner i dalu?"
      a: "Na fydd. Does dim nodiadau atgoffa, felly chi sy'n dal i wneud y procio. O leiaf bydd y ddau ohonoch yn edrych ar yr un rhif."
    - q: "Beth sy'n digwydd pan fyddwn yn stopio rhannu costau?"
      a: "Setlwch y balans a chofnodwch y taliad, fel nad oes dim yn ddyledus gan neb. Yna gall gweinyddwr gloi'r grŵp, sy'n cadw'r rhifau fel y maent, neu ei gau am byth, sy'n ei wneud yn anhygyrch i bawb. Caewch ef dim ond pan nad oes angen yr hanes ar yr un ohonoch."
