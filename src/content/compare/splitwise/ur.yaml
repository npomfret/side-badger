      source: home
    - feature: "ادائیگیاں اور آپ کا بینک"
      other: "کچھ جگہوں پر یہ ایپ کے اندر سے رقم بھیج سکتا ہے: امریکہ میں Splitwise Pay ، امریکی ڈالر کے بیلنس کے لیے Venmo ، PayPal ، اور منتخب یورپی ممالک میں Pay by Bank ، جو ذاتی کرنٹ اکاؤنٹ جوڑتا ہے۔"
      sideBadger: "آپ کی رقم کو کبھی ہاتھ نہیں لگاتا اور بینک کی تفصیلات نہیں مانگتا۔ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ادائیگی ریکارڈ کریں۔"
      source: payments-help
    - feature: "چارٹس اور ڈیفالٹ تقسیمیں"
      other: "دونوں Pro کی خصوصیات ہیں۔"
      sideBadger: "کوئی نہیں۔"
      source: pro
faq:
  heading: "سوالات"
  items:
    - q: "کیا Side Badger ، Splitwise کا مفت متبادل ہے؟"
      a: "گروپ میں بل تقسیم کرنے کے لیے، جی ہاں، اور یہ صرف حساب سے زیادہ کرتا ہے: تبصرے، سوالات، فہرستیں، پول اور گروپ کے کردار، رسید اسکین اور کرنسی تبدیلی مفت۔ اگر آپ کو ایپ اسٹور کی ایپ، آف لائن استعمال یا ایپ کے اندر ادائیگیاں چاہییں تو یہ Splitwise کرتا ہے اور Side Badger نہیں کرتا۔"
    - q: "Splitwise کی تفصیلات کہاں سے آتی ہیں؟"
      a: "Splitwise کے اپنے صفحات سے: اس کا ہوم پیج، اس کا Pro صفحہ اور اس کا ہیلپ سینٹر۔ جدول کی ہر قطار اس صفحے سے جڑی ہے جہاں سے وہ آئی، اور جدول کے اوپر کی تاریخ بتاتی ہے کہ ہم نے انہیں کب پڑھا۔ ہم انہیں ہر سہ ماہی دیکھتے ہیں۔"
    - q: "کیا Side Badger مفت رہے گا؟"
      a: "Side Badger میں آج سب کچھ مفت ہے۔ اگر یہ کبھی بدلا تو ہم پہلے آپ کو اطلاع دیں گے۔ تفصیل یہاں ہے: [قیمتوں کا صفحہ](page:pricing)۔"
    - q: "کیا میرے گروپ کے ہر شخص کو منتقل ہونا پڑے گا؟"
      a: "جی ہاں۔ گروپ میں ہر ایک کو مفت Side Badger اکاؤنٹ چاہیے، اور وہ لنک یا QR کوڈ سے شامل ہو سکتے ہیں۔"
    - q: "کیا Side Badger کی موبائل ایپ ہے؟"
      a: "ایپ اسٹور میں نہیں۔ یہ آپ کے براؤزر میں چلتا ہے: اپنے فون پر سائن ان کریں، پھر اسے ہوم اسکرین میں شامل کریں تاکہ یہ ایپ کی طرح کھلے۔ [یہ کیسے کام کرتا ہے](page:how-it-works) طریقہ دکھاتا ہے۔"
