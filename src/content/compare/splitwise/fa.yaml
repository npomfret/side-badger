meta:
  title: "Side Badger در برابر Splitwise: بخش‌های رایگان | Side Badger"
  description: "جایگزین رایگان Splitwise، با مقایسه‌ای منصفانه. اسکن رسید، تبدیل ارز و نبود تبلیغات اینجا هزینه‌ای ندارد، و فهرست می‌کنیم Splitwise چه چیزهایی را بهتر دارد."
h1: "Side Badger در برابر Splitwise: بخش‌های رایگان، مقایسه‌شده"
navLabel: "Side Badger در برابر Splitwise"
lead: "احتمالاً یک نفر در گروه شما گفته «فقط از Splitwise استفاده کنید». حرف بدی نیست. Side Badger یک برنامه وب رایگان است با اسکن رسید، تبدیل ارز و بدون تبلیغات، و بدون اشتراکی برای باز کردن‌شان. اینکه کدام برای گروه شما مناسب است به نیازهایش بستگی دارد، پس این هم مقایسه، با اطلاعات Splitwise که فقط از صفحه‌های خود Splitwise گرفته شده است."
cta:
  heading: "روی صورت‌حساب مشترک بعدی امتحانش کنید"
  body: "یک حساب رایگان بسازید، گروه بسازید و یک هزینه واقعی اضافه کنید. اگر به کارتان نیامد، چند دقیقه صرف کرده‌اید، نه یک اشتراک."
asOf: 2026-10-21
asOfNote: "ما صفحه‌های خود Splitwise را در {date} خواندیم تا شما مجبور نباشید، و هر آنچه اینجا درباره Splitwise آمده از همان‌ها است. هر ردیف جدول به منبعش لینک دارد. طرح‌ها تغییر می‌کنند، پس هر سه ماه دوباره بررسی می‌کنیم، و اگر صفحه‌های Splitwise با این صفحه فرق داشتند، آن‌ها را باور کنید."
