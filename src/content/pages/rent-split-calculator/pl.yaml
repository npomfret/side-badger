faq:
  heading: "Pytania"
  items:
    - q: "Co jest uczciwsze: wielkość pokoju czy dochód?"
      a: "Żadne nie jest zawsze uczciwsze. Wielkość pokoju pasuje do współlokatorów, którzy płacą za przestrzeń, w której śpią. Dochód pasuje do par i przyjaciół, którzy zarabiają bardzo różnie. Ustalcie to przed pierwszym dniem płacenia czynszu, a nie po."
    - q: "Czy rachunki dzielić tak samo?"
      a: "Przy współlokatorach zwykle nie. Z energii i internetu korzystają wszyscy, więc po równo jest prościej, jak w przykładzie. Przy podziale według dochodu kalkulator dzieli rachunki według tych samych udziałów co czynsz."
    - q: "Czy mogę użyć stóp kwadratowych?"
      a: "Tak. Wybierz ft² i wpisz powierzchnie w stopach kwadratowych. Jednostka to tylko etykieta, a udziały wychodzą takie same, o ile wszyscy używają jednej."
    - q: "Czy kalkulator jest darmowy?"
      a: "Tak. Za darmo. Bez reklam. Bez dziennych limitów. Konto też nie jest potrzebne."
