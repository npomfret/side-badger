meta:
  title: "Poravnaj se s manje uplata | Side Badger"
  description: "Pogledaj tko u tvojoj grupi kome duguje, dobij kratak popis uplata koji poravnava sve i bilježi svaku uplatu kad se dogodi. Besplatno."
h1: "Poravnaj se s manje uplata"
navLabel: "Poravnanje"
lead: "Side Badger vodi tekuće stanje za svakoga u grupi i predlaže kratak popis uplata koji ga poravnava. Platite si kako god želite, a zatim to zabilježite. Ako prvo želiš vidjeti kako se iznosi dijele, počni s [podjelom troškova](page:feature/split-expenses)."
cta:
  heading: "Spremni razmrsiti tko kome duguje?"
  body: "Napravi korisnički račun, osnuj grupu i dodaj prvi trošak. Stanja će preuzeti ostalo."
  button: "Napravi besplatan račun"
problem:
  heading: "Stanja koja se ažuriraju usput"
  body: "Svaki trošak mijenja tko kome duguje, pa Side Badger održava stanja aktualnima kako se dodaju troškovi i uplate. Svi u grupi vide promjenu odmah, kao i što se promijenilo i tko je to promijenio. Stanja se vode po valutama, pa eura i funte ostaju u svojim stupcima, osim ako je trošak pretvoren pri unosu. Prema zadanim postavkama vidiš dugove koji se tiču tebe; **Prikaži sve** ispisuje cijelu grupu."
workflow:
  heading: "Tri koraka do kvita"
  steps:
    - title: "Pogledaj tko kome duguje"
      body: "Otvori stanja grupe da vidiš što duguješ, što ti duguju i kratak popis uplata koji poravnava sve, izračunan zasebno za svaku valutu. Troškovi dovedeni u pitanje ostaju izvan zbrojeva dok se ne riješe. U primjeru s cimerima ispod šest uplata postaje dvije."
      shot: S10
      shotAlt: "Zaslon stanja s pojednostavljenim dugovima u dvije valute i uključenom opcijom Prikaži sve"
    - title: "Plati kako god želiš, a zatim zabilježi"
      body: "Bankovni prijenos, gotovina, usluga iz prošlog odmora. Side Badger ne premješta novac. Kad novac promijeni vlasnika, zabilježi uplatu i stanje se ažurira za sve."
      shot: S11
      shotAlt: "Obrazac uplate s gumbima za brzo poravnanje i obavijesti prikazanom za djelomičnu uplatu"
    - title: "Provjeri je li stiglo"
      body: "Uplata ide u povijest grupe, gdje je može vidjeti svatko u grupi i reagirati emojijem. Proslavi uplatu kad stigne."
      shot: S12
      shotAlt: "Povijest uplata s reakcijama emojijima na uplatu"
