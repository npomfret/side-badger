sections:
  - heading: Han zeudenak bakarrik
    body: Banatu kostu bat guztien artean, edo partekatu zutenen artean soilik. Utzi jendea kanpoan parte ez ziren kostuetatik, eta saldoek hori islatzen dute. Aste osoan kanpoan egon zen etxekideak ez dio zorrik eramateko janariari, eta [etxekideek](page:use-case/housemates) oinarrizko justizia dela aitortuko dute.
  - heading: Geroko eztabaidak saihesten dituzten xehetasunak
    items:
      - Ezarri **data** eta aukeran ordua. Lasterbideek, hala nola gaur, atzo, gaur goizean eta bart, idazteko lana aurrezten dute.
      - Gehitu gehienez hiru **etiketa** gastuak taldekatzeko, hala nola erosketak edo bidaiak.
      - Gehitu **lekua**. Itsatsi mapa-esteka bat eta lekuaren izena bere kabuz betetzen da.
      - Gehitu **ohar** bat zenbakiaren atzeko istorioarentzat, formatu apur batekin istorioak behar badu.
      - "Erantsi gehienez hiru **ordainagiri**, argazki edo PDF gisa, froga gastuarekin geratu dadin."
      - Erabili **iruzkinak** elkarrizketa dagokion gastuaren ondoan edukitzeko, inork atzera begiratzen ez duen txat-hari batean utzi beharrean.
  - heading: Kopiatu, editatu eta ikusi zer aldatu den
    body: Kopiatu joan den hilabeteko alokairua berriro idatzi beharrean, eta aldatu desberdina dena. Zenbaki bat gaizki bazegoen, editatu gastua. Aurreko bertsioa gordetzen da eta aldaketa taldearen jardueran ageri da, beraz inork ez du zenbaki bat isilean aldatzen. Zer editatu dezakeen bakoitzak taldearen baimenen araberakoa da.
  - heading: Zerbait gaizki dagoenean
    body: Talde batek gastu-galderak aktibatu ditzake. Gastu batean sartuta dagoen edonork galdera bat egin dezake eta zergatik esan, eta gastua saldoetatik kanpo geratzen da galdera egin duenak, edo administratzaile batek, itxi arte. Lehenespenez desaktibatuta dago eta administratzaile batek aktibatzen du taldearentzat. [Ekitaldi eta ospakizunetarako](page:use-case/events-and-celebrations) egokia da, inork gogoratzen ez duen fidantza bat bat-batean denen kontu bihurtzen den lekuan.
limits:
  heading: Mugak
  items:
    - Pertsona batek ordaintzen du gastu bakoitza. Bi pertsonek ordaindu badute, erregistratu bi gastu.
    - Ez dago elementuka banatzerik eta ez dago zatiz banatzerik. Berdin, zenbateko zehatzak eta ehunekoak dira dauden aukerak.
    - Ehunekoek 100 batu behar dute.
    - Gastu batek gehienez 999.999,99 izan dezake bere monetan, moneta horren hamartar arruntekin.
    - Gastuak ezin dira beren kabuz errepikatu. Kopiatu joan den hilabetekoa.
    - Datak ezin dira etorkizunekoak izan, ezta 10 urte baino zaharragoak ere.
    - Taldea utzi duen norbait sartuta dagoen gastua irakurtzeko soilik geratzen da.
useCasesHeading: Horrelako banaketak non laguntzen duen
faq:
  heading: Galderak
  items:
    - q: Bi pertsonek ordain dezakete gastu bat?
      a: Ez gastu bakar batean. Erregistratu bi, ordaintzaile bakoitzeko bat, eta saldoak berdin ateratzen dira.
    - q: Tiketa bat elementuka banatu dezaket?
      a: Ez. Banaketa berdina da, zenbateko zehatzen arabera edo ehunekoen arabera. Elementu desberdinak dituen faktura baterako, sartu bakoitzak zenbat zor duen zenbateko zehatz gisa.
    - q: Lehenetsitako banaketa bat ezar dezaket?
      a: Ez. Kopiatu lehengo gastu bat bere banaketa berrerabiltzeko, eta aldatu desberdina dena.
    - q: Fakturak hilero errepika daitezke?
      a: Ez. Kopiatu joan den hilabeteko gastua, segundo gutxi behar da.
    - q: Nork editatu dezake gastu bat?
      a: Taldearen baimenek uzten dutenak. Edizio guztiak taldearen jardueran ageri dira, beraz aldaketak ez dira inoiz isilak.
    - q: Zer gertatzen da saldoekin gero?
      a: Gastuak iristen diren heinean eguneratzen dira, eta [kitatzeak](page:feature/settle-up) ordainketa-zerrenda labur bihurtzen ditu. Gastu bat beste moneta batean badago, ikusi [moneta anitz](page:feature/multiple-currencies).
