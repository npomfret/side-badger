meta:
  title: "Pamācības par izmaksu godīgu sadali | Side Badger"
  description: "Praktiskas pamācības, kā godīgi sadalīt īri, atvaļinājuma villas un grupas izmaksas, katra izstrādāta ar ticamu grupu un parādītiem aprēķiniem."
h1: "Pamācības par izmaksu godīgu sadali"
navLabel: "Pamācības"
lead: "Jautājumi, ko cilvēki uzdod tieši pirms izklājlapas atvēršanas, atbildēti ar ticamu grupu, aprēķiniem un soļiem lietotnē."
intro: "Katra pamācība seko **vienai izdomātai grupai** no pirmā izdevuma līdz pēdējam reģistrētajam maksājumam. Skaitļi ir izrēķināti jūsu vietā, un soļos izmantoti ekrāni ar tādiem nosaukumiem, kādus tiem dod lietotne."
cta:
  heading: "Jums ir tāda grupa kā šī?"
  body: "Izveidojiet kontu, sāciet grupu un pievienojiet pirmo izdevumu. Aprēķini tiek veikti jūsu vietā."
cardsHeading: "Izvēlieties savu jautājumu"
