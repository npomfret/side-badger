faq:
  heading: "Vragen"
  items:
    - q: "Is Side Badger een gratis alternatief voor Splitwise?"
      a: "Om rekeningen in een groep te verdelen: ja. Bonnetjes scannen, valuta’s omrekenen en geen advertenties zijn gratis, zonder dagelijkse limieten. Heb je een native app, offline gebruik, terugkerende uitgaven of betalingen in de app nodig, dan doet Splitwise dat en Side Badger niet."
    - q: "Waar komen de gegevens over Splitwise vandaan?"
      a: "Uit de eigen pagina’s van Splitwise: de startpagina, de Pro-pagina en het helpcentrum. Elke rij van de tabel verwijst naar de pagina waaruit ze komt, en de datum boven de tabel zegt wanneer we ze lazen. We controleren ze elk kwartaal."
    - q: "Blijft Side Badger gratis?"
      a: "Alles in Side Badger is vandaag gratis en er is geen betaald abonnement. Als dat ooit verandert, laten we het je eerst weten. De [prijzenpagina](page:pricing) heeft de details."
    - q: "Moet iedereen in mijn groep overstappen?"
      a: "Ja. Iedereen in een groep heeft een gratis Side Badger-account nodig en kan meedoen met een link of een QR-code."
    - q: "Heeft Side Badger een mobiele app?"
      a: "Niet in een appstore. Het draait in je browser: log in op je telefoon en voeg het dan toe aan je startscherm, zodat het opent als een app. [Zo werkt het](page:how-it-works) toont hoe."
