sections:
  - heading: Vain ne, jotka olivat paikalla
    body: Jaa kulu kaikkien kesken tai vain niiden, jotka sen jakoivat. Jätä ihmiset pois kuluista, joihin he eivät osallistuneet, ja saldot heijastavat sitä. Kämppis, joka oli poissa koko viikon, ei ole velkaa noutoruoasta, minkä [kämppikset](page:use-case/housemates) tunnistavat perusoikeudenmukaisuudeksi.
  - heading: Yksityiskohdat, jotka säästävät riidoilta myöhemmin
    items:
      - Aseta **päivämäärä** ja halutessasi kellonaika. Pikavalinnat, kuten tänään, eilen, tänä aamuna ja viime yönä, säästävät kirjoittamista.
      - Lisää enintään kolme **tunnistetta** kulujen ryhmittelyyn, kuten ruokaostokset tai matkustus.
      - Lisää **paikka**. Liitä karttalinkki, niin paikan nimi täyttyy itsestään.
      - Lisää **muistiinpano** luvun takana olevalle tarinalle, tarvittaessa hieman muotoiltuna.
      - Käytä **kommentteja**, jotta keskustelu pysyy sen kulun vieressä, jota se koskee, eikä chat-ketjussa, jota kukaan ei selaa taaksepäin.
  - heading: Kopioi, muokkaa ja katso, mikä muuttui
    body: Kopioi viime kuun vuokra sen sijaan, että kirjoittaisit sen uudelleen, ja muuta se, mikä on erilaista. Jos luku oli väärin, muokkaa kulua. Aiempi versio säilyy ja muokkaus näkyy ryhmän toiminnassa, joten kukaan ei muuta lukua hiljaa. Se, mitä kukin saa muokata, riippuu ryhmän oikeuksista.
  - heading: Kun jokin näyttää väärältä
    body: Ryhmä voi ottaa kulukysymykset käyttöön. Kuka tahansa kuluun kuuluva voi nostaa kysymyksen ja kertoa syyn, ja kulu pysyy poissa saldoista, kunnes kysyjä tai ylläpitäjä sulkee sen. Se on oletuksena pois päältä, ja ylläpitäjä ottaa sen ryhmälle käyttöön. Se sopii [tapahtumiin ja juhliin](page:use-case/events-and-celebrations), joissa kukaan ei muista etumaksua, kunnes siitä tulee yhtäkkiä kaikkien asia.
limits:
  heading: Rajat
  items:
    - Yksi ihminen maksaa jokaisen kulun. Jos maksajia oli kaksi, kirjaa kaksi kulua.
    - Jakoa tuotteittain tai osuuksina ei ole. Tasan, tarkat summat ja prosentit ovat ainoat vaihtoehdot.
    - Prosenttien summan on oltava 100.
    - Kulu voi olla enintään 999 999,99 omassa valuutassaan kyseisen valuutan tavallisilla desimaaleilla.
    - Kulut eivät toistu itsestään. Kopioi sen sijaan viime kuun kulu.
    - Päivämäärä ei voi olla tulevaisuudessa eikä yli 10 vuoden takana.
    - Kulu, jossa on mukana ryhmästä lähtenyt, muuttuu vain luettavaksi.
useCasesHeading: Missä tällainen jako auttaa
faq:
  heading: Kysymyksiä
  items:
    - q: Voiko kaksi ihmistä maksaa yhden kulun?
      a: Ei yhdessä kulussa. Kirjaa kaksi, yksi kummallekin maksajalle, niin saldot tulevat samoiksi.
    - q: Voinko jakaa kuitin tuotteittain?
      a: Ei. Jako on tasan, tarkoilla summilla tai prosenteilla. Jos laskussa on eri tuotteita, syötä kunkin velka tarkkoina summina.
    - q: Voinko asettaa oletusjaon?
      a: Ei. Kopioi aiempi kulu käyttääksesi sen jakoa uudelleen ja muuta se, mikä on erilaista.
    - q: Voivatko laskut toistua joka kuukausi?
      a: Ei. Kopioi sen sijaan viime kuun kulu, mihin menee muutama sekunti.
    - q: Kuka voi muokata kulua?
      a: Ne, joille ryhmän oikeudet sen sallivat. Jokainen muokkaus näkyy ryhmän toiminnassa, joten muutokset eivät koskaan tapahdu hiljaa.
    - q: Mitä saldoille tapahtuu sen jälkeen?
      a: Ne päivittyvät kulujen tullessa, ja [tilien tasaus](page:feature/settle-up) muuttaa ne lyhyeksi maksulistaksi. Jos kulu on toisessa valuutassa, katso [useita valuuttoja](page:feature/multiple-currencies).
