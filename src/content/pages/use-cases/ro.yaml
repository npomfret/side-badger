meta:
  title: "Side Badger pentru colegi de casă, excursii și petreceri"
  description: "Împarte costurile cu colegii de casă, în excursii de grup și pentru petreceri, nunți și cadouri comune. Vezi ce face Side Badger pentru fiecare fel de grup."
h1: "Side Badger pentru felul tău de grup"
navLabel: "Cazuri de utilizare"
lead: "Colegi de casă, vacanțe, petreceri de burlăcițe. Alege-ți haosul, apoi vezi cum își ține evidența un grup ca al tău."
intro: "Fiecare grup împarte costurile puțin diferit. Aceste pagini urmăresc un **scenariu realist** de la prima cheltuială până la ultima plată înregistrată, cu socotelile la vedere, ca să vezi cu ce ar rămâne propriul tău grup."
cta:
  heading: "Ți-ai găsit felul de grup?"
  body: "Creează un cont, începe un grup și adaugă prima cheltuială. Durează câteva minute."
  button: "Creează un cont gratuit"
cardsHeading: "Alege situația cea mai apropiată de a ta"
sections:
  - heading: "Excursii de grup"
    body: "Zboruri în lire, o vilă în euro și o cină la care au mâncat doar trei oameni. Setează grupul să convertească în lire și patru prieteni la Lisabona termină cu trei plăți, în loc de șase când valutele sunt ținute separat. [Împarte costurile unei excursii de grup](page:use-case/group-trips)."
  - heading: "Colegi de casă"
    body: "Unul plătește proprietarul, altul își amintește de factura la energie și nimeni nu se pune de acord cine a cumpărat hârtia igienică. Cu chiria împărțită după mărimea camerei și celelalte facturi împărțite egal, patru colegi de casă încheie luna cu trei plăți, toate către cel care a plătit chiria. [Împarte facturile casei cu colegii](page:use-case/housemates)."
  - heading: "Petreceri, nunți și cadouri comune"
    body: "Șase oameni votează cadoul, unul îl cumpără și nu toți contribuie cu aceeași sumă. Un cadou de 150 £ împărțit pe sume exacte lasă cinci plăți către cel care l-a cumpărat, 120 £ în total. [Împarte costurile unui eveniment](page:use-case/events-and-celebrations)."
  - heading: "Cupluri"
    body: "Împărțiți costurile plictisitoare fără să transformați seara în doi într-o ședință trimestrială de buget. Chiria împărțită 60/40 și alimentele împărțite egal se reduc la o singură plată între voi doi."
  - heading: "Vezi mai întâi cum funcționează"
    body: "Toate exemplele de mai sus folosesc aceiași pași, de la crearea unui grup până la înregistrarea plăților. [Cum funcționează](page:how-it-works) îi parcurge, iar [prețurile](page:pricing) spun cât costă, adică nimic, fără reclame și fără limite zilnice."
faq:
  heading: "Întrebări"
  items:
    - q: "Are fiecare din grup nevoie de un cont?"
      a: "Da. Oamenii se alătură cu un link sau un cod QR și un cont gratuit."
    - q: "Poate Side Badger să strângă banii?"
      a: "Nu. Plătiți cum preferați, apoi înregistrați plata, ca soldurile să rămână corecte."
    - q: "Trebuie să aleg un singur fel de grup?"
      a: "Nu. Cazurile de utilizare sunt exemple, nu setări. Fiecare grup are aceleași funcții, așa că folosește combinația care ți se potrivește."
