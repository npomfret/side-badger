sections:
  - heading: "শুধু যারা ছিল তারা"
    body: "একটি খরচ সবার মধ্যে ভাগ করুন, অথবা শুধু যারা সেটা ভাগ করেছে তাদের মধ্যে। যারা কোনো খরচের অংশ ছিল না তাদের সেটা থেকে বাদ দিন, আর ব্যালেন্সে সেটাই প্রতিফলিত হবে। যে রুমমেট পুরো সপ্তাহ বাইরে ছিল সে টেকঅ্যাওয়ের টাকা দেয় না, যা [রুমমেটরা](page:use-case/housemates) মৌলিক ন্যায়বিচার বলেই চিনবে।"
  - heading: "যে খুঁটিনাটি পরের তর্ক বাঁচায়"
    items:
      - "**তারিখ** আর ইচ্ছে হলে সময় দিন। আজ, গতকাল, আজ সকাল আর গতরাতের মতো শর্টকাট কিছু টাইপিং বাঁচায়।"
      - "খরচ গুছিয়ে রাখতে তিনটি পর্যন্ত **লেবেল** যোগ করুন, যেমন বাজার বা ভ্রমণ।"
      - "**জায়গা** যোগ করুন। একটি মানচিত্রের লিঙ্ক পেস্ট করুন, জায়গার নাম নিজেই ভরে যাবে।"
      - "সংখ্যার পেছনের গল্পের জন্য একটি **নোট** যোগ করুন, গল্পটার দরকার হলে সামান্য ফরম্যাটিংসহ।"
      - "আলাপটা যে খরচ নিয়ে সেটার পাশেই রাখতে **মন্তব্য** ব্যবহার করুন, এমন চ্যাটের সুতোয় নয় যেখানে কেউ আর স্ক্রল করে পেছনে যায় না।"
  - heading: "কপি করুন, বদলান, আর দেখুন কী বদলেছে"
    body: "গত মাসের ভাড়া আবার টাইপ না করে কপি করুন, তারপর যা আলাদা তা বদলান। কোনো সংখ্যা ভুল হলে খরচটা সম্পাদনা করুন। আগের সংস্করণ রাখা থাকে আর সম্পাদনা গ্রুপের কার্যকলাপে দেখা যায়, তাই কেউ চুপিচুপি কোনো সংখ্যা বদলাতে পারে না। কে কী সম্পাদনা করতে পারবে তা গ্রুপের অনুমতির ওপর নির্ভর করে।"
  - heading: "যখন কিছু ঠিক লাগে না"
    body: "একটি গ্রুপ খরচ নিয়ে প্রশ্ন তোলা চালু করতে পারে। খরচে অন্তর্ভুক্ত যে কেউ প্রশ্ন তুলে কারণ বলতে পারে, আর যে প্রশ্ন তুলেছে সে বা কোনো অ্যাডমিন সেটা বন্ধ না করা পর্যন্ত খরচটা ব্যালেন্সের বাইরে থাকে। এটি ডিফল্টে বন্ধ থাকে আর অ্যাডমিন গ্রুপের জন্য চালু করেন। এটি [অনুষ্ঠান ও উদযাপনে](page:use-case/events-and-celebrations) মানায়, যেখানে কারও মনে না থাকা ডিপোজিটটা হঠাৎ সবার মাথাব্যথা হয়ে ওঠে।"
limits:
  heading: "সীমা"
  items:
    - "প্রতিটি খরচে একজনই দেয়। দুজন দিলে দুটি খরচ রেকর্ড করুন।"
    - "আইটেম ধরে ভাগ নেই, শেয়ার ধরেও ভাগ নেই। সমান, নির্দিষ্ট পরিমাণ আর শতাংশই আছে।"
    - "শতাংশের যোগফল 100 হতে হবে।"
    - "একটি খরচ নিজস্ব মুদ্রায় 999,999.99 পর্যন্ত হতে পারে, সেই মুদ্রার স্বাভাবিক দশমিক ঘরসহ।"
    - "খরচ নিজে থেকে পুনরাবৃত্ত হতে পারে না। তার বদলে গত মাসেরটা কপি করুন।"
    - "তারিখ ভবিষ্যতের বা 10 বছরের বেশি পুরনো হতে পারে না।"
    - "যে খরচে গ্রুপ ছেড়ে যাওয়া কেউ জড়িত, সেটি শুধু পড়ার জন্য হয়ে যায়।"
useCasesHeading: "এভাবে ভাগ করা কোথায় কাজে লাগে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "দুজন কি একটি খরচ দিতে পারে?"
      a: "একটি খরচে নয়। দুটি রেকর্ড করুন, প্রত্যেক দাতার জন্য একটি, আর ব্যালেন্স একই আসে।"
    - q: "রসিদ কি আইটেম ধরে ভাগ করা যায়?"
      a: "না। ভাগ হয় সমান, নির্দিষ্ট পরিমাণ বা শতাংশে। আলাদা আইটেমের বিলের জন্য প্রত্যেকের দেওয়ার পরিমাণ নির্দিষ্ট পরিমাণ হিসেবে লিখুন।"
    - q: "ডিফল্ট ভাগ ঠিক করা যায় কি?"
      a: "না। আগের একটি খরচ কপি করে তার ভাগ আবার ব্যবহার করুন, আর যা আলাদা তা বদলান।"
    - q: "বিল কি প্রতি মাসে পুনরাবৃত্ত হতে পারে?"
      a: "না। তার বদলে গত মাসের খরচ কপি করুন, তাতে কয়েক সেকেন্ড লাগে।"
    - q: "খরচ কে সম্পাদনা করতে পারে?"
      a: "গ্রুপের অনুমতি যাকে দেয়। প্রতিটি সম্পাদনা গ্রুপের কার্যকলাপে দেখা যায়, তাই পরিবর্তন কখনও নীরবে হয় না।"
    - q: "এরপর ব্যালেন্সের কী হয়?"
      a: "খরচ আসার সঙ্গে সঙ্গে ব্যালেন্স হালনাগাদ হয়, আর [হিসাব মেটানো](page:feature/settle-up) সেগুলোকে পেমেন্টের একটি ছোট তালিকায় বদলে দেয়। কোনো খরচ অন্য মুদ্রায় হলে দেখুন [একাধিক মুদ্রা](page:feature/multiple-currencies)।"
