meta:
  title: "রসিদ স্ক্যান করে খরচ যোগ করুন | Side Badger"
  description: "ব্যাজারকে রসিদটা পড়তে দিন। সে মোট, তারিখ আর জায়গা ভরে দেয় আপনার দেখে নেওয়ার জন্য, কোনো স্ক্যান ক্রেডিট ছাড়াই। ছবিটি পড়ে Google-এর AI পরিষেবা।"
h1: "রসিদ স্ক্যান করুন, বিবরণ দেখে নিন, ভাগ করুন"
navLabel: "রসিদ স্ক্যান"
lead: "ব্যাজারকে রসিদটা পড়তে দিন, আর তার হোমওয়ার্কটা দেখে নিন। একটি নতুন খরচে ছবি যোগ করুন, আর Side Badger মোট, তারিখ আর জায়গা ভরে দেয় আপনার দেখে নেওয়ার জন্য। তারপর অন্য যেকোনো খরচের মতোই সেটা [ভাগ করুন](page:feature/split-expenses)। স্ক্যান করা বিনামূল্যে, কোনো স্ক্যান ক্রেডিট নেই। এটি একটি খরচ ভরে দেয়, আইটেম ধরে বিল ভাগ করে না। রসিদের ছবি পড়ে Google-এর AI পরিষেবা।"
cta:
  heading: "ছবি তুলুন। দেখে নিন। ভাগ করুন।"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর রসিদের ছবিসহ একটি খরচ যোগ করুন। দেখুন সে কী ভরে দেয়, যা ঠিক নয় তা বদলান, আর পছন্দ হলে সেভ করুন।"
problem:
  heading: "ট্যাক্সির লাইনে দাঁড়িয়ে রসিদ টাইপ করতে কেউ চায় না"
  body: "ট্রিপ আর বড় রাতের বেরোনোর সঙ্গে কাগজ আসে। ডিনার, ট্যাক্সি, যে রাউন্ডটা ছয় রাউন্ড হয়ে গেল। ঠান্ডা আঙুলে, পেছনে লাইন নিয়ে, ফোনে প্রতিটি টাইপ করতে গেলেই খরচ ভুলে যাওয়া হয়। তাই Side Badger রসিদটা আপনার হয়ে পড়ে দেয়। প্রথম খসড়া সে করে, দেখে নেওয়ার কাজটা আপনার। এটি [গ্রুপ ট্রিপ](page:use-case/group-trips) আর [অনুষ্ঠান ও উদযাপনে](page:use-case/events-and-celebrations) মানানসই, যেখানে রসিদ জমে যায় কারও সামলানোর ইচ্ছের চেয়ে দ্রুত।"
workflow:
  heading: "ছবি থেকে খরচ, তিন ধাপে"
  steps:
    - title: "নতুন খরচে একটি রসিদ যোগ করুন"
      body: "একটি নতুন খরচ শুরু করুন আর **রসিদ স্ক্যান করুন** ট্যাপ করুন, অথবা আপনার ড্যাশবোর্ডের **রসিদ স্ক্যান করুন** কুইক অ্যাকশন ব্যবহার করুন। একটি ছবি তুলুন বা আগে থেকে থাকা কোনোটি বেছে নিন। ফর্মের **রসিদ বা সংযুক্তি যোগ করুন**-ও কাজ করে।"
    - title: "তাকে রসিদটা পড়তে দিন"
      body: "Side Badger-এর AI ছবিটি পড়ার সময় ফর্মে লেখা থাকে **রসিদ বিশ্লেষণ করা হচ্ছে...**। তারপর সে যা পায় তা ভরে দেয়, যেমন বিবরণ, মোট, মুদ্রা, তারিখ, সময় আর জায়গা। আপনি আগে যা টাইপ করে রেখেছেন তা ছোঁয়া হয় না।"
      shot: S09
      shotAlt: "নতুন খরচের ফর্ম, যেখানে লেখা রসিদ বিশ্লেষণ করা হচ্ছে..., তারপর একই ফর্ম বিবরণ ভরা অবস্থায়"
    - title: "দেখে নিন, তারপর ভাগ করুন"
      body: "ফর্মটা কাগজের সঙ্গে মিলিয়ে দেখুন। যা ঠিক নয় তা শুধরে নিন, বলুন কে দিয়েছে আর কে খরচটা ভাগ করেছে, কীভাবে ভাগ হবে তা বেছে নিন আর সেভ করুন। সেভ না করা পর্যন্ত খরচটার অস্তিত্বই নেই। ভাগ করার বিস্তারিত পাবেন [খরচ ভাগ করা](page:feature/split-expenses) পৃষ্ঠায়।"
options:
  heading: "বিকল্প"
  items: []
sections:
  - heading: "সে কী ভরে দেয়"
    body: "একটি নতুন খরচে রসিদের ছবি যোগ করলে এই ঘরগুলো ভরে যেতে পারে। কে দিয়েছে, কে খরচটা ভাগ করেছে আর কীভাবে ভাগ হবে, সেসব এখনও আপনার ওপর।"
    items:
      - "খরচের একটি **বিবরণ**।"
      - "**মোট**।"
      - "**মুদ্রা**, যদি আপনার গ্রুপ অনুমতি দেয়।"
      - "**তারিখ** আর **সময়**।"
      - "**জায়গা**।"
      - "**নোটে** রসিদের একটি টেক্সট কপি, যখন কাগজের রসিদ ফিকে হয়ে যায় বা কাপড়ের সঙ্গে ধোয়ার মেশিনে চলে যায়।"
  - heading: "যা আপনি এখনও দেখে নেবেন"
    body: "সবকিছুই। সে যা ভরে দেয় তাকে খসড়া ধরুন। মোটটা কাগজের সঙ্গে মেলান, তারপর মুদ্রা, তারিখ আর জায়গা। ঝাপসা ছবি আর কুঁচকে যাওয়া কাগজ যেকোনো পাঠককে ধাঁধায় ফেলতে পারে, আর প্রতিটি রসিদ সে ঠিকঠাক পড়বে এমন প্রতিশ্রুতি আমরা দিই না, তাই সেভ করার আগে অনুগ্রহ করে দেখে নিন। কিছু ঠিক না থাকলে তার ওপরেই টাইপ করে দিন। রসিদ ইয়েনে হলে আর গ্রুপ পাউন্ডে হিসাব মেটালে তারপর কী হয়, তা [একাধিক মুদ্রা](page:feature/multiple-currencies) বলে।"
  - heading: "রসিদটা খরচের সঙ্গেই রাখুন"
    body: "স্ক্যান করা হোক বা না হোক, একটি রসিদ খরচের সঙ্গে থেকে যেতে পারে। ছবি বা PDF জুড়ে দিন, প্রতি খরচে তিনটি পর্যন্ত আর প্রতিটি 10 MB পর্যন্ত। গ্রুপের সদস্যরা সেগুলো খরচের মধ্যে দেখতে পায়। ছবি থাম্বনেইল হিসেবে দেখায় যা ভিউয়ারে খোলে, আর PDF খোলে লিঙ্ক হিসেবে। আপনার স্ক্যান করা ছবিটিও জুড়ে যায়, যদি না সেভ করার আগে সেটা সরিয়ে দেন। কেউ জিজ্ঞেস করলে সেই ডিনারের আসল দাম কত ছিল, প্রমাণ ঠিক সেখানেই আছে।"
  - heading: "আপনার রসিদ কোথায় যায়"
    body: "রসিদের ছবি পড়ে Google-এর AI পরিষেবা। ফর্ম ভরার জন্য ছবিটি পড়ে Google Vertex AI (Gemini), Google-এর US মাল্টি-রিজিয়নে। একটি নতুন খরচে ছবি যোগ করলে সেটি পড়া হয়। PDF, বা আগে থেকে থাকা কোনো খরচে যোগ করা ছবি, না পড়েই জমা রাখা হয়। জুড়ে দেওয়া রসিদ গ্রুপের সদস্যদের কাছে দৃশ্যমান, তাই কোনো রসিদে এমন কিছু থাকলে যা আপনি ভাগ করতে চান না, ছবিটা বাদ দিন আর খরচটা হাতে টাইপ করে দিন।"
limits:
  heading: "সীমা"
  items:
    - "শুধু ছবি। JPEG, PNG আর WebP, এবং রূপান্তরের পর HEIC। PDF খরচের সঙ্গে জুড়ে দেওয়া যায় কিন্তু পড়া হয় না।"
    - "স্ক্যান শুধু নতুন খরচের জন্য। আগে থেকে থাকা খরচে রসিদ জুড়ে দেওয়া যায়, কিন্তু কিছু পড়া হয় না।"
    - "সে শুধু সেই ঘরগুলো ভরে যেগুলো আপনি ছোঁননি, আর মুদ্রা ভরে শুধু আপনার গ্রুপ অনুমতি দিলে।"
    - "সে আইটেম ধরে ভাগ করে না, বা লাইন আইটেম মানুষের নামে বসায় না। সে একটি খরচ ভরে দেয় আর সেটা আপনি যথারীতি ভাগ করেন।"
    - "সে যা ভরে দেয় তা ঠিক হওয়ার, বা স্ক্যান প্রতিবার কাজ করার কোনো প্রতিশ্রুতি নেই। সেভ করার আগে দেখে নিন, আর স্ক্যান ব্যর্থ হলে বা না পাওয়া গেলে খরচটা হাতে যোগ করুন।"
    - "একটি খরচে তিনটি পর্যন্ত সংযুক্তি থাকতে পারে, প্রতিটি 10 MB পর্যন্ত, JPEG, PNG, WebP, HEIC বা PDF হিসেবে।"
    - "রসিদের ছবি পড়ে Google Vertex AI (Gemini), Google-এর US মাল্টি-রিজিয়নে, আর জুড়ে দেওয়া রসিদ গ্রুপের সদস্যদের কাছে দৃশ্যমান।"
useCasesHeading: "যেখানে রসিদ জমে ওঠে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "এটি কি রসিদ আইটেম ধরে ভাগ করতে পারে?"
      a: "না। সে মোটসহ খরচটা ভরে দেয়, আর সেটা আপনি সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করেন। যে বিলে সবাই আলাদা আলাদা অর্ডার করেছে, সেখানে প্রত্যেকের দেওয়ার পরিমাণ নির্দিষ্ট পরিমাণ হিসেবে লিখুন। বিস্তারিত আছে [খরচ ভাগ করা](page:feature/split-expenses) পৃষ্ঠায়।"
    - q: "এটি কি PDF পড়তে পারে?"
      a: "না। একটি খরচের সঙ্গে PDF জুড়ে দিতে পারেন যাতে সেটা সংখ্যাগুলোর সঙ্গে থাকে, কিন্তু পড়া হয় শুধু ছবি।"
    - q: "স্ক্যানের কি কোনো সীমা আছে?"
      a: "ফুরিয়ে যাওয়ার মতো কোনো স্ক্যান ক্রেডিট নেই, আর স্ক্যান বিনামূল্যে। ফাইলের অবশ্য সীমা আছে: প্রতি খরচে তিনটি পর্যন্ত সংযুক্তি আর প্রতিটি 10 MB। বাকিটা আছে [বিনামূল্যে কী কী মেলে](page:pricing) পৃষ্ঠায়।"
    - q: "আমার রসিদ কে দেখতে পায়?"
      a: "গ্রুপের সদস্যরা খরচের সঙ্গে জুড়ে দেওয়া রসিদ দেখতে পায়। রসিদের ছবি Google-এর AI পরিষেবাও পড়ে, আর এভাবেই ফর্ম ভরে।"
    - q: "আমি যে খরচ আগেই যোগ করেছি তার জন্য কি রসিদ স্ক্যান করা যায়?"
      a: "না, স্ক্যান নতুন খরচের জন্য। আগে থেকে থাকা খরচে তবু রসিদ জুড়ে দিতে পারেন, আর সেটি না পড়েই জমা রাখা হয়।"
    - q: "সে ভুল কিছু ভরে দিলে কী হবে?"
      a: "তার ওপরেই টাইপ করে দিন। সেভ না করা পর্যন্ত প্রতিটি ঘর সম্পাদনাযোগ্য থাকে, আর সবগুলো আপনার দেখে নেওয়াই উচিত। স্ক্যান ব্যর্থ হলে বা না পাওয়া গেলে যথারীতি খরচটা হাতে যোগ করুন।"
