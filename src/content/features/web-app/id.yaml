meta:
  title: "Aplikasi pembagi tagihan tanpa unduhan | Side Badger"
  description: "Ponsel Anda penuh, kami paham. Side Badger berjalan di peramban, tanpa toko aplikasi dan unduhan. Tambahkan ke layar utama dan ia terbuka seperti aplikasi."
h1: "Tanpa toko aplikasi. Tanpa unduhan. Tetap terasa seperti aplikasi"
navLabel: "Aplikasi web"
lead: "Side Badger hidup di peramban Anda. Tak ada toko aplikasi untuk dicari dan tak ada yang perlu diunduh dulu. Masuk di ponsel atau komputer, bagi pengeluaran secara online bersama grup Anda, dan tambahkan ke layar utama atau dock saat Anda ingin ia hanya berjarak satu ketukan."
cta:
  heading: "Buka. Masuk. Mulai grup."
  body: "Buat akun, mulai grup, dan tambahkan pengeluaran pertama, semuanya dari peramban yang sudah terbuka. Mau tur dulu? Lihat [cara kerja](page:how-it-works), atau cek [apa saja yang gratis](page:pricing)."
problem:
  heading: "Ponsel Anda penuh. Kami paham."
  body: "Di dalamnya ada empat ribu foto matahari terbenam yang sama dan peringatan penyimpanan yang sudah Anda geser pergi sejak awal tahun. Hal terakhir yang dibutuhkannya adalah aplikasi lain, hanya untuk membagi satu makan malam. Jadi Side Badger adalah aplikasi web. Ia berjalan di peramban modern di ponsel atau komputer. Di ponsel, ia memakai tata letak seluler, dengan halaman grup dibagi menjadi tab dan kontrol yang ramah sentuhan. Beberapa tambahan, seperti menambahkannya ke layar utama, bergantung pada peramban Anda, dan kami sebutkan mana saja."
workflow:
  heading: "Dari tab peramban ke layar utama dalam tiga langkah"
  steps:
    - title: "Buka dan masuk"
      body: "Buka Side Badger di peramban Anda dan masuk. Yang Anda perlukan hanya alamat email dan kata sandi, dan Anda memverifikasi email sebelum bisa menambahkan apa pun. Setiap orang di grup perlu akun, jadi orang yang Anda undang akan melakukan hal yang sama."
    - title: "Tambahkan ke layar utama atau dock"
      body: "Setelah masuk, aplikasi menawarkan untuk memasang dirinya sendiri. Anda mendapat tombol **Pasang** jika peramban Anda mengizinkan, dan **Tunjukkan caranya** jika tidak. Terlewat, atau tadi menolak? **Pengaturan** punya bantuan yang sama di bawah **Tambahkan ke Layar Utama atau Dock**. Di iPhone atau iPad, Pengaturan menampilkan langkah untuk iPhone lebih dulu dan menyimpan perangkat lain di bawah **Perangkat lain**. Bagaimanapun, aplikasinya lalu terbuka di jendelanya sendiri."
      shot: S20
      shotAlt: "Bagian Tambahkan ke Layar Utama atau Dock di Pengaturan, dengan langkah-langkah menambahkan aplikasi ke sebuah perangkat"
    - title: "Aktifkan notifikasi, jika Anda mau"
      body: "Notifikasi mati sampai Anda mengaktifkannya, dan setiap perangkat diaktifkan terpisah. Pakai tombol **Aktifkan** yang ditawarkan lonceng notifikasi, atau sakelar **Notifikasi push** di **Pengaturan**. Di iPhone atau iPad, buka aplikasi dari Layar Utama dulu. Hanya di sanalah notifikasi bekerja."
      shot: S19
      shotAlt: "Dropdown notifikasi yang terbuka, mencantumkan aktivitas terbaru di grup"
options:
  heading: "Cara menambahkannya, perangkat demi perangkat"
  items:
    - title: "iPhone dan iPad"
      body: "Ketuk tombol Bagikan, kotak dengan panah mengarah ke atas. Jika tidak terlihat, ketuk tiga titik (•••) dulu, lalu Bagikan. Gulir ke bawah dan ketuk **Tambah ke Layar Utama**. Biarkan **Buka sebagai Aplikasi Web** tetap aktif, lalu ketuk **Tambah**. Jika sebuah tautan terbuka di dalam aplikasi lain, buka halamannya di Safari dulu, karena peramban bawaan aplikasi itu tidak bisa menambahkannya."
    - title: "Android"
      body: "Buka menu peramban dan pilih **Tambahkan ke Layar utama** atau **Instal aplikasi**."
    - title: "Chrome atau Edge di komputer"
      body: "Buka menu peramban dan pilih opsi untuk menginstal situs ini sebagai aplikasi. Ia lalu mendapat jendela dan ikonnya sendiri."
    - title: "Safari di Mac"
      body: "Pilih **Berkas**, lalu **Tambahkan ke Dock**."
sections:
  - heading: "Notifikasi, hanya jika Anda memintanya"
    body: "Notifikasi push bersifat opsional. Aktifkan dan Anda mendapat notifikasi saat ada aktivitas baru di grup Anda, seperti seseorang menambahkan pengeluaran, meninggalkan komentar, atau mencatat pembayaran. Notifikasi diaktifkan satu perangkat demi satu perangkat, dari lonceng notifikasi atau dari **Pengaturan**, dan Anda bisa mematikannya lagi di sana. Notifikasi memerlukan peramban yang mendukungnya dan izin Anda. Jika peramban Anda memblokirnya untuk situs ini, izinkan dulu di pengaturan peramban. Di iPhone atau iPad, notifikasi hanya bekerja dari aplikasi yang ditambahkan ke Layar Utama, bukan dari tab peramban. Pengiriman tidak dijamin, jadi anggap notifikasi sebagai colekan, bukan janji. Untuk apa yang muncul di umpan, lihat [rencanakan bersama](page:feature/plan-together)."
  - heading: "Pembaruan langsung, tanpa tombol segarkan"
    body: "Tambahkan pengeluaran dan semua orang langsung melihatnya, beserta apa yang berubah dan siapa yang mengubahnya. Setiap grup menyimpan riwayat aktivitas, dan lonceng notifikasi menampilkan aktivitas di semua grup Anda. Tak ada yang perlu bertanya apakah orang lain sudah melihat hal yang baru Anda tambahkan. Hal itu sudah ada di layar mereka."
  - heading: "39 bahasa, tiap orang bahasanya sendiri"
    body: "Gunakan Side Badger dalam 39 bahasa, termasuk bahasa Arab, Persia, dan Urdu yang ditulis dari kanan ke kiri. Setiap orang di grup memilih bahasanya sendiri, jadi halaman grup yang sama bisa berbahasa Arab bagi satu orang dan berbahasa Inggris bagi orang berikutnya. Satu-satunya hal yang harus disepakati grup adalah angkanya."
  - heading: "Dibuat untuk lebih dari satu jenis pengguna"
    body: "Side Badger dibuat dengan mempertimbangkan pengguna keyboard dan pembaca layar. Warna anggota disertai pola, jadi Anda tidak perlu membedakan hijau dari merah."
    items:
      - "Tautan lewati, agar pengguna keyboard bisa langsung melompat ke konten."
      - "Dialog mengelola fokus keyboard."
      - "Kontrol diberi label, untuk pembaca layar."
      - "Tata letak berbalik untuk bahasa yang ditulis dari kanan ke kiri."
limits:
  heading: "Yang tidak dilakukan aplikasi web"
  items:
    - "Tidak ada penggunaan offline. Side Badger memerlukan koneksi, jadi ia tidak akan membuka grup Anda di pesawat tanpa wifi."
    - "Tidak ada aplikasi di toko aplikasi dan tidak ada aplikasi iPhone atau Android native. Side Badger adalah aplikasi web, dan menambahkannya ke layar utama atau dock adalah cara mendapatkan versi yang terasa seperti aplikasi."
    - "Menambahkannya ke layar utama atau dock bergantung pada peramban Anda. Nama menu berbeda-beda antar peramban dan versi, dan sebagian peramban tidak menyediakannya."
    - "Notifikasi push harus diaktifkan sendiri untuk tiap perangkat, dan memerlukan peramban yang mendukungnya serta izin Anda. Di iPhone atau iPad, notifikasi hanya bekerja dari aplikasi yang ditambahkan ke Layar Utama. Pengiriman tidak dijamin."
    - "Tidak ada peringatan lewat email atau pesan teks dan tidak ada pengingat pembayaran. Aktivitas baru tampil di aplikasi, dan sebagai notifikasi push jika Anda mengaktifkannya. Menagih pembayaran tetap urusan Anda."
    - "Aktivitas disimpan selama 90 hari."
    - "Anda masuk dengan alamat email dan kata sandi. Tidak ada masuk dengan Google atau Apple, dan Anda harus berusia 18 tahun atau lebih."
    - "Kami tidak mengklaim Side Badger sepenuhnya mudah diakses, atau memenuhi standar aksesibilitas formal. Jika ada yang menghalangi Anda, beri tahu kami dari dalam aplikasi dan Anda akan melihat balasan kami di sana."
useCasesHeading: "Di mana tak perlu aplikasi itu membantu"
faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah ada aplikasi Side Badger di toko aplikasi?"
      a: "Tidak. Side Badger adalah aplikasi web. Anda membukanya di peramban, dan bisa menambahkannya ke layar utama atau dock agar terbuka seperti aplikasi. Tidak ada yang perlu diunduh dari toko aplikasi."
    - q: "Bisakah saya membagi tagihan tanpa mengunduh aplikasi?"
      a: "Bisa. Buka Side Badger di peramban di ponsel atau komputer Anda, masuk, dan mulai grup. Menambahkannya ke layar utama atau dock bersifat opsional."
    - q: "Apakah berfungsi offline?"
      a: "Tidak. Side Badger memerlukan koneksi, bahkan saat sudah ditambahkan ke layar utama atau dock."
    - q: "Kenapa saya tidak menerima notifikasi di iPhone?"
      a: "Di iPhone atau iPad, notifikasi hanya bekerja dari aplikasi yang ditambahkan ke Layar Utama, bukan dari tab peramban. Tambahkan, buka dari ikon Layar Utama, lalu aktifkan notifikasi di **Pengaturan**. Pengiriman tidak dijamin, jadi jika ada yang hilang, riwayat aktivitas grup tetap menunjukkan apa yang ditambahkan."
    - q: "Apakah saya harus mengaktifkan notifikasi?"
      a: "Tidak. Notifikasi mati sampai Anda mengaktifkannya, satu perangkat demi satu perangkat. Tanpa notifikasi, aktivitas baru tetap tampil di aplikasi, dan semua orang langsung melihat perubahan saat aplikasinya terbuka."
    - q: "Apakah semua orang di grup perlu akun?"
      a: "Ya. Yang Anda perlukan hanya alamat email dan kata sandi, dan Anda memverifikasi email sebelum bisa menambahkan apa pun. Setiap orang yang bergabung ke grup melakukan hal yang sama, di ponsel atau komputer mana pun yang mereka suka."
