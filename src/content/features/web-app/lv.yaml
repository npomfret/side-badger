meta:
  title: "Rēķinu dalīšanas lietotne bez lejupielādes | Side Badger"
  description: "Tālrunis pilns, mēs zinām. Side Badger darbojas pārlūkprogrammā, bez lietotņu veikala un lejupielādes. Pievienojiet to sākuma ekrānam, un tas atveras kā lietotne."
h1: "Bez lietotņu veikala. Bez lejupielādes. Tomēr kā lietotne"
navLabel: "Tīmekļa lietotne"
lead: "Side Badger dzīvo jūsu pārlūkprogrammā. Nav lietotņu veikala, kur meklēt, un nekā, ko vispirms lejupielādēt. Pierakstieties tālrunī vai datorā, sadaliet izdevumus tiešsaistē kopā ar grupu un pievienojiet to sākuma ekrānam vai dokam, kad vēlaties to pieskāriena attālumā."
cta:
  heading: "Atveriet. Pierakstieties. Sāciet grupu."
  body: "Izveidojiet kontu, sāciet grupu un pievienojiet pirmo izdevumu, viss no pārlūkprogrammas, kas jums jau ir atvērta. Vēlaties vispirms ekskursiju? Skatiet [kā tas darbojas](page:how-it-works) vai [ko sedz bezmaksas versija](page:pricing)."
problem:
  heading: "Jūsu tālrunis ir pilns. Mēs saprotam."
  body: "Kaut kur tajā ir četri tūkstoši viena un tā paša saulrieta fotogrāfiju un atmiņas vietas brīdinājums, ko kopš pavasara aizvelkat prom. Pēdējais, kas tam vajadzīgs, ir vēl viena lietotne, tikai lai sadalītu vienas vakariņas. Tāpēc Side Badger ir tīmekļa lietotne. Tā darbojas mūsdienīgā pārlūkprogrammā tālrunī vai datorā. Tālrunī tā izmanto mobilos izkārtojumus, ar grupas lapu sadalītu cilnēs un skārienam piemērotām vadīklām. Daži papildinājumi, piemēram, pievienošana sākuma ekrānam, ir atkarīgi no jūsu pārlūkprogrammas, un mēs sakām, kur."
workflow:
  heading: "No pārlūka cilnes līdz sākuma ekrānam trīs soļos"
  steps:
    - title: "Atveriet un pierakstieties"
      body: "Atveriet Side Badger pārlūkprogrammā un pierakstieties. Vajag tikai e-pasta adresi un paroli, un e-pasts jāapstiprina, pirms varat kaut ko pievienot. Ikvienam grupā vajadzīgs konts, tāpēc cilvēki, ko uzaicināt, darīs to pašu."
    - title: "Pievienojiet to sākuma ekrānam vai dokam"
      body: "Kad esat pierakstījušies, lietotne piedāvā instalēties pati. Jūs saņemat pogu **Instalēt** tur, kur pārlūkprogramma to ļauj, un **Parādīt, kā** tur, kur neļauj. Palaidāt garām vai teicāt nē? **Iestatījumos** ir tā pati palīdzība sadaļā **Pievienot sākuma ekrānam vai Dokam**. iPhone vai iPad ierīcē Iestatījumos vispirms redzami iPhone soļi, bet citas ierīces ir paslēptas zem **Citas ierīces**. Katrā gadījumā lietotne pēc tam atveras savā logā."
      shot: S20
      shotAlt: "Iestatījumu sadaļa Pievienot sākuma ekrānam vai Dokam ar soļiem, kā pievienot lietotni ierīcei"
    - title: "Ieslēdziet paziņojumus, ja vēlaties"
      body: "Paziņojumi ir izslēgti, līdz tos ieslēdzat, un katra ierīce tiek ieslēgta atsevišķi. Izmantojiet pogu **Ieslēgt**, ko piedāvā paziņojumu zvaniņš, vai slēdzi **Push paziņojumi** sadaļā **Iestatījumi**. iPhone vai iPad ierīcē vispirms atveriet lietotni no sākuma ekrāna. Tā ir vienīgā vieta, kur tur darbojas paziņojumi."
      shot: S19
      shotAlt: "Atvērta paziņojumu nolaižamā izvēlne ar grupas nesenās aktivitātes sarakstu"
options:
  heading: "Kā to pievienot, ierīci pa ierīcei"
  items:
    - title: "iPhone un iPad"
      body: "Pieskarieties pogai „Kopīgot”, kas ir kvadrāts ar uz augšu vērstu bultiņu. Ja to neredzat, vispirms pieskarieties trim punktiem (•••), pēc tam „Kopīgot”. Ritiniet uz leju un pieskarieties **Pievienot sākuma ekrānam**. Atstājiet ieslēgtu **Atvērt kā tīmekļa lietotni**, pēc tam pieskarieties **Pievienot**. Ja saite atvērās citā lietotnē, vispirms atveriet lapu pārlūkā Safari, jo šis iebūvētais pārlūks to nevar pievienot."
    - title: "Android"
      body: "Atveriet pārlūkprogrammas izvēlni un izvēlieties **Pievienot sākuma ekrānam** vai **Instalēt lietotni**."
    - title: "Chrome vai Edge datorā"
      body: "Atveriet pārlūkprogrammas izvēlni un izvēlieties iespēju instalēt šo vietni kā lietotni. Tad tā iegūst savu logu un savu ikonu."
    - title: "Safari Mac datorā"
      body: "Izvēlieties **Fails**, tad **Pievienot Dokam**."
sections:
  - heading: "Paziņojumi, tikai ja tos pieprasāt"
    body: "Push paziņojumi ir neobligāti. Ieslēdziet tos, un saņemsiet paziņojumu, kad jūsu grupās ir jauna aktivitāte, piemēram, kāds pievieno izdevumu, atstāj komentāru vai reģistrē maksājumu. Tie tiek ieslēgti pa vienai ierīcei, no paziņojumu zvaniņa vai sadaļas **Iestatījumi**, un tur tos var arī izslēgt. Tiem vajadzīga pārlūkprogramma, kas tos atbalsta, un jūsu atļauja. Ja jūsu pārlūkprogramma ir tos šai vietnei bloķējusi, vispirms atļaujiet tos pārlūkprogrammas iestatījumos. iPhone vai iPad ierīcē tie darbojas tikai no lietotnes, kas pievienota sākuma ekrānam, nevis no pārlūka cilnes. Piegāde netiek garantēta, tāpēc uztveriet paziņojumu kā pamudinājumu, nevis solījumu. Par to, kas parādās plūsmā, skatiet [plānojiet kopā](page:feature/plan-together)."
  - heading: "Atjauninājumi uzreiz, bez pārlādēšanas pogas"
    body: "Pievienojiet izdevumu, un visi to redz uzreiz, kopā ar to, kas mainīts un kurš to mainīja. Katra grupa uztur aktivitāšu vēsturi, un paziņojumu zvaniņš rāda aktivitāti no visām jūsu grupām. Nevienam nav jāprasa, vai esat redzējuši to, ko tikko pievienojāt. Tas ir viņu ekrānā."
  - heading: "39 valodas, katram sava"
    body: "Izmantojiet Side Badger 39 valodās, tostarp arābu, persiešu un urdu valodā, ko raksta no labās uz kreiso pusi. Ikviens grupā izvēlas savu, tāpēc viena un tā pati grupas lapa vienam var būt arābu valodā, bet nākamajam angļu. Vienīgais, par ko grupai jāvienojas, ir skaitļi."
  - heading: "Veidots ne tikai viena veida lietotājiem"
    body: "Side Badger ir veidots, domājot par tastatūras un ekrāna lasītāju lietotājiem. Dalībnieku krāsām ir raksti, tāpēc nav jāatšķir zaļš no sarkana."
    items:
      - "Saites pārejai uz saturu, lai tastatūras lietotāji varētu uzreiz pāriet uz saturu."
      - "Dialogi pārvalda tastatūras fokusu."
      - "Vadīklām ir etiķetes ekrāna lasītājiem."
      - "Izkārtojumi apvēršas valodām, ko raksta no labās uz kreiso pusi."
limits:
  heading: "Ko tīmekļa lietotne nedara"
  items:
    - "Bezsaistes lietošanas nav. Side Badger vajag savienojumu, tāpēc tas neatvērs jūsu grupu lidmašīnā bez wifi."
    - "Nav lietotnes lietotņu veikalā un nav atsevišķas iPhone vai Android lietotnes. Side Badger ir tīmekļa lietotne, un tās pievienošana sākuma ekrānam vai dokam ir veids, kā iegūt lietotnei līdzīgo versiju."
    - "Pievienošana sākuma ekrānam vai dokam ir atkarīga no jūsu pārlūkprogrammas. Izvēļņu nosaukumi atšķiras starp pārlūkprogrammām un versijām, un daži pārlūki to nepiedāvā."
    - "Push paziņojumi ir izvēles kārtībā katrā ierīcē, un tiem vajadzīga pārlūkprogramma, kas tos atbalsta, un jūsu atļauja. iPhone vai iPad ierīcē tie darbojas tikai no lietotnes, kas pievienota sākuma ekrānam. Piegāde netiek garantēta."
    - "Nav e-pasta vai īsziņu brīdinājumu un nav maksājumu atgādinājumu. Jaunā aktivitāte parādās lietotnē un kā push paziņojumi, ja tos ieslēdzat. Maksājuma pakaļdzīšanās joprojām ir jūsu ziņā."
    - "Aktivitāte tiek glabāta 90 dienas."
    - "Pierakstīšanās notiek ar e-pasta adresi un paroli. Pierakstīšanās ar Google vai Apple nav, un vecumam jābūt 18 gadiem vai vairāk."
    - "Mēs neapgalvojam, ka Side Badger ir pilnībā pieejams vai ka tas atbilst formālam pieejamības standartam. Ja kaut kas jums traucē, pastāstiet mums no lietotnes iekšienes, un jūs tur redzēsiet mūsu atbildi."
useCasesHeading: "Kur palīdz tas, ka lietotne nav vajadzīga"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai Side Badger ir pieejams lietotņu veikalā?"
      a: "Nē. Side Badger ir tīmekļa lietotne. Jūs to atverat pārlūkprogrammā un varat pievienot sākuma ekrānam vai dokam, lai tā atveras kā lietotne. Nekas nav jālejupielādē no lietotņu veikala."
    - q: "Vai varu sadalīt rēķinus bez lietotnes lejupielādes?"
      a: "Jā. Atveriet Side Badger pārlūkprogrammā tālrunī vai datorā, pierakstieties un sāciet grupu. Pievienošana sākuma ekrānam vai dokam nav obligāta."
    - q: "Vai tas darbojas bezsaistē?"
      a: "Nē. Side Badger vajag savienojumu, pat ja tas ir pievienots sākuma ekrānam vai dokam."
    - q: "Kāpēc man iPhone nenāk paziņojumi?"
      a: "iPhone vai iPad ierīcē paziņojumi darbojas tikai no lietotnes, kas pievienota sākuma ekrānam, nevis no pārlūka cilnes. Pievienojiet to, atveriet no sākuma ekrāna ikonas, tad ieslēdziet paziņojumus sadaļā **Iestatījumi**. Piegāde netiek garantēta, tāpēc, ja kāds paziņojums pazūd, grupas aktivitāšu vēsturē joprojām redzams, kas pievienots."
    - q: "Vai man jāieslēdz paziņojumi?"
      a: "Nē. Tie ir izslēgti, līdz tos ieslēdzat, pa vienai ierīcei. Bez tiem jaunā aktivitāte joprojām parādās lietotnē, un visi izmaiņas redz uzreiz, kad lietotne viņiem ir atvērta."
    - q: "Vai ikvienam grupā vajadzīgs konts?"
      a: "Jā. Vajag tikai e-pasta adresi un paroli, un e-pasts jāapstiprina, pirms varat kaut ko pievienot. Ikviens, kas pievienojas grupai, dara to pašu, jebkurā tālrunī vai datorā, kādu vēlas."
