faq:
  heading: "Fragen"
  items:
    - q: "Kann ich nur meinen Anteil hinterfragen?"
      a: "Nein. Eine Frage hält die ganze Ausgabe zurück, für alle darin. Stimmt nur die Aufteilung nicht, ist die Lösung eine Änderung der Aufteilung."
    - q: "Wer kann eine Frage schließen?"
      a: "Die Person, die gefragt hat, oder ein Gruppen-Admin. Ist die Person, die die Ausgabe eingetragen hat, kein Admin, kann sie die Frage nicht im Namen der fragenden Person schließen."
    - q: "Löscht eine Bearbeitung das Original?"
      a: "Nein. Die frühere Version bleibt erhalten. Wer bearbeiten darf, bestimmen die Berechtigungen der Gruppe, sag es dem Haus also vorher, denn die Salden ändern sich."
