faq:
  heading: "자주 묻는 질문"
  items:
    - q: "방 크기별과 소득별 중 어느 쪽이 더 공평한가요?"
      a: "어느 쪽이 항상 더 공평하지는 않아요. 방 크기별은 자기가 자는 공간만큼 내는 룸메이트에게 알맞고, 소득별은 소득 차이가 큰 커플이나 친구에게 알맞습니다. 첫 월세 날 이후가 아니라 그 전에 합의하세요."
    - q: "공과금도 같은 방식으로 나눠야 하나요?"
      a: "룸메이트끼리라면 보통은 아니에요. 전기·가스와 인터넷은 모두가 쓰니 예시처럼 똑같이 나누는 편이 간단합니다. 소득별로 나누면 계산기는 공과금에도 월세와 같은 비율을 적용해요."
    - q: "제곱피트를 쓸 수 있나요?"
      a: "네. ft²를 선택하고 면적을 제곱피트로 입력하세요. 단위는 이름표일 뿐이라, 모두 같은 단위를 쓰기만 하면 몫은 똑같이 나와요."
    - q: "계산기는 무료인가요?"
      a: "네. 무료이고, 광고도 일일 한도도 없습니다. 계정도 필요 없어요."
