faq:
  heading: "Cwestiynau"
  items:
    - q: "Pa gyfradd gyfnewid mae Side Badger yn ei defnyddio?"
      a: "Cyfradd gyfnewid gyfredol, wedi'i nôl pan fyddwch yn rhoi'r gost i mewn lle mae un ar gael. Gallwch ei newid i'r gyfradd a gawsoch mewn gwirionedd."
    - q: "A all y grŵp gadw at bunnoedd ac yen?"
      a: "Gall. Yn **Gosodiadau** y grŵp, trowch **Cyfyngu arian cyfred ar gyfer y grŵp hwn** ymlaen o dan **Gosodiadau Arian Cyfred**, dewiswch yr **Arian cyfred a ganiateir** a gosodwch yr **Arian cyfred rhagosodedig ar gyfer costau newydd**. Llai o opsiynau yn y rhestr, llai o ddyfalu anghywir wrth y til."
    - q: "Oes rhaid i ni drosi o gwbl?"
      a: "Nac oes. Mae arian cyfred yn aros ar wahân oni bai eich bod chi neu eich grŵp yn dewis trosi, ac mae pob arian cyfred yn cael ei restr fer ei hun o daliadau."
