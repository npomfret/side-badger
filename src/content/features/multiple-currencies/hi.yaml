sections:
  - heading: "पूरे ग्रुप के लिए एक करेंसी"
    body: "अगर आपका ग्रुप इस बारे में सोचना नहीं चाहता, तो ग्रुप की एक करेंसी चुनें और फॉर्म हर नए खर्च को उसमें बदल देता है, ऐसे रेट पर जिसे आप अब भी देख और बदल सकते हैं। यह सिर्फ नए और कॉपी किए गए खर्चों पर लागू होता है। एडिट और पहले से दर्ज खर्च जैसे हैं वैसे ही रहते हैं, ताकि पहले से दर्ज कुछ भी आपके नीचे से न बदल जाए।"
  - heading: "यूरो देने हैं, पेमेंट पाउंड में"
    body: "येन में पेमेंट हुआ, पर हिसाब पाउंड में चुकाना है? कोई बात नहीं। पेमेंट रिकॉर्ड करते समय आप उसे भी बदल सकते हैं, इसलिए जिसे यूरो देने हैं वह पाउंड में पेमेंट कर सकता है और यूरो का बैलेंस फिर भी सही निकलता है। एक-दूसरे को जैसे चाहें पेमेंट करें, फिर उसे रिकॉर्ड करें।"
  - heading: "ग्रुप के नियम"
    body: "ग्रुप को उन्हीं करेंसी तक सीमित करें जो आप सच में इस्तेमाल कर रहे हैं, और एक डिफ़ॉल्ट तय करें ताकि फॉर्म सही करेंसी पर खुले। पुर्तगाल की छुट्टी को डिनर के बिल के पास 139 और विकल्प नहीं चाहिए, और [विदेश में शादी](page:use-case/events-and-celebrations) को शायद दो चाहिए।"
limits:
  heading: "सीमाएं"
  items:
    - "रेट खर्च सेव होते ही तय हो जाता है। पुराने खर्चों का मूल्य कभी दोबारा नहीं आंका जाता।"
    - "Side Badger जहां हो सके वहां मौजूदा रेट लाता है। हर जोड़ी के लिए रेट की गारंटी नहीं है, और आप रेट हमेशा खुद भी डाल सकते हैं।"
    - "ग्रुप ऑटो-कन्वर्ट सिर्फ नए और कॉपी किए गए खर्चों पर लागू होता है, एडिट या पहले से दर्ज खर्चों पर नहीं।"
    - "हर खर्च अपनी करेंसी में 999,999.99 तक सीमित है।"
    - "140 करेंसी हैं। क्रिप्टोकरेंसी और धातुएं उनमें नहीं हैं।"
    - "Side Badger पेमेंट रिकॉर्ड करता है। यह पैसे कभी नहीं भेजता और न बदलता है।"
useCasesHeading: "यह कहां काम आता है"
faq:
  heading: "सवाल"
  items:
    - q: "आप कौन-सा एक्सचेंज रेट इस्तेमाल करते हैं?"
      a: "मौजूदा एक्सचेंज रेट, जो खर्च डालते समय लाया जाता है जहां उपलब्ध हो। आप उसे उस रेट में बदल सकते हैं जो आपको असल में मिला, और बदली हुई राशि अपडेट हो जाती है।"
    - q: "क्या पुराने खर्चों का मूल्य दोबारा आंका जाता है?"
      a: "नहीं। रेट खर्च सेव होते ही तय हो जाता है, इसलिए बैलेंस इसलिए नहीं खिसकता कि बाज़ार खिसका।"
    - q: "क्या आप क्रिप्टो को सपोर्ट करते हैं?"
      a: "नहीं। 140 करेंसी हैं, और क्रिप्टोकरेंसी उनमें नहीं हैं।"
    - q: "मैं 2,000,000 इंडोनेशियाई रुपिया क्यों नहीं डाल सकता?"
      a: "हर खर्च अपनी करेंसी में 999,999.99 तक सीमित है। उसे किसी दूसरी करेंसी में डालकर बदलें, या दो खर्चों में बांट दें।"
    - q: "क्या बदलने में कुछ खर्च होता है?"
      a: "नहीं। बदलना मुफ्त है, बाकी Side Badger की तरह। [कीमत](page:pricing) देखें।"
    - q: "क्या मुझे बदलना ज़रूरी है?"
      a: "नहीं। करेंसी अलग रहती हैं जब तक आप या आपका ग्रुप बदलने का फैसला न करे, और हर करेंसी को पेमेंट की अपनी छोटी सूची मिलती है।"
