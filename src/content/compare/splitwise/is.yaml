faq:
  heading: "Spurningar"
  items:
    - q: "Er Side Badger ókeypis valkostur við Splitwise?"
      a: "Til að skipta reikningum í hópi, já. Kvittanaskönnun, gjaldmiðlaumreikningur og engar auglýsingar eru ókeypis, án daglegra takmarka. Ef þú þarft sérstakt app, notkun án nettengingar, endurtekin útgjöld eða greiðslur inni í appinu gerir Splitwise það en Side Badger ekki."
    - q: "Hvaðan koma upplýsingarnar um Splitwise?"
      a: "Af síðum Splitwise sjálfs: heimasíðu þess, Pro-síðu og hjálparmiðstöð. Hver lína í töflunni vísar á síðuna sem hún kom af og dagsetningin fyrir ofan töfluna segir hvenær við lásum þær. Við athugum þær ársfjórðungslega."
    - q: "Verður Side Badger áfram ókeypis?"
      a: "Allt í Side Badger er ókeypis í dag og það er ekkert greitt þrep. Ef það breytist einhvern tímann látum við þig vita fyrirfram. [Verðskráin](page:pricing) hefur nánari upplýsingar."
    - q: "Þurfa allir í hópnum mínum að skipta yfir í Side Badger?"
      a: "Já. Allir í hópi þurfa ókeypis aðgang að Side Badger og geta gengið í hann með tengli eða QR-kóða."
    - q: "Er til farsímaapp frá Side Badger?"
      a: "Ekki í appverslun. Það keyrir í vafranum þínum: skráðu þig inn í símanum og bættu því svo við heimaskjáinn svo það opnist eins og app. [Hvernig þetta virkar](page:how-it-works) sýnir hvernig."
