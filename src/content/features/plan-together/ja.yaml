meta:
  title: 割り勘グループの共有リスト・投票・コメント | Side Badger
  description: 支出にコメントし、怪しい1件に質問し、共有の買い物リストを作って、ヴィラを投票で決めましょう。お金の使い方を一緒に計画してから、割り勘。無料で、広告なし。
h1: 一緒に計画して、あとで割り勘
navLabel: 一緒に計画
lead: 買い物リストと買い物の請求書が、ようやく仲直り。Side Badgerには、お金を使う前にも後にも、グループで話し合える場所があります。すべての支出へのコメント、おかしく見える支出への質問、共有リスト、大きな決断のための投票です。あとはいつもどおり、[割り勘の仕方](page:feature/split-expenses)で分けましょう。
cta:
  heading: 計画して、それから割り勘
  body: 無料アカウントを作成し、グループを始めて、最初のリスト、投票、質問をお金のすぐそばに置きましょう。次に何が起きるか気になる方は[使い方](page:how-it-works)をご覧ください。
problem:
  heading: チャットはこちら、請求書はあちら
  body: グループの出費は、たいてい2か所に分かれています。数字は片方に、その数字をめぐる言い合いは、火曜日にスクロールして流れていったチャットにあります。買い物リストは冷蔵庫の写真です。ヴィラは、たぶん、大半の人が付けた「いいね」で決まりました。Side Badgerは、計画をグループの中、対象の支出のすぐそばに置きます。費用のそばにはコメント、買い物のそばにはリスト、大きな決断には投票、そして長文を書かずに「ちょっと待って、これ合ってる？」と言える手段です。すべてグループのお金に関することに限られます。それがグループの役目だからです。
workflow:
  heading: ヴィラの投票から買い物の請求書まで
  steps:
    - title: 大きな決断を投票にかける
      body: 請求額を左右する決断（どのヴィラにするか、など）の投票を追加します。選択肢を2〜10個選び、一人あたりの票数を決めて、全員が投票し終えたら終了すると、勝った選択肢に印が付きます。
      shot: S17
      shotAlt: 勝った選択肢に印が付き、各選択肢の横に得票数が表示された、終了済みの投票
    - title: 買い物リストを一緒に作る
      body: 共有リストを作り、品目を追加して、カートに入れるたびにチェックを入れます。買い物は、あとで支出として追加します。
      shot: S16
      shotAlt: いくつかの品目にチェックが入り、進捗の数が表示された共有の買い物リスト
    - title: 費用の話は、その費用のそばで
      body: 支出そのものにコメントし、レシートを添付し、絵文字でリアクションします。会話は、その数字のすぐそばに残ります。
      shot: S08
      shotAlt: 詳細、レシートのサムネイル、コメントのやり取り、絵文字リアクションが表示された支出
    - title: おかしいと思った支出に質問する
      body: "グループで支出への質問をオンにしている場合、支出に含まれる人なら誰でも**質問があります**を選べます。質問が解決するまで、その支出は残高に含まれません。"
      shot: S18
      shotAlt: 「質問あり」バッジと「質問ありのみ」フィルターが表示された支出リスト
    - title: 何が変わったか、誰が変えたかを見る
      body: アクティビティフィードと通知のベルで、すべてのグループの新しい動きを確認できます。ほしい人には、プッシュ通知もあります。
      shot: S19
      shotAlt: 最近のアクティビティが一覧表示された通知のドロップダウン
