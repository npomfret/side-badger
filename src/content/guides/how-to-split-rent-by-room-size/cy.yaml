faq:
  heading: "Cwestiynau"
  items:
    - q: "Beth os oes gan rywun ystafell fwy ond llai o olau?"
      a: "Dim ond man cychwyn yw arwynebedd llawr, felly gall y grŵp gytuno i addasu. Tynnwch bwynt neu ddau oddi ar yr ystafell dywyll, rhowch nhw i'r lleill a gwiriwch fod y canrannau'n dal i adio i 100. Mae Side Badger yn cadw'r hyn rydych yn cytuno arno ac nid yw'n ei farnu."
    - q: "A ddylai biliau gael eu rhannu yn ôl maint ystafell hefyd?"
      a: "Fel arfer, na. Mae pawb yn defnyddio ynni a band eang, felly mae rhaniad cyfartal yn symlach, fel yn yr enghraifft uchod. Os yw un cyd-letywr gartref drwy'r dydd, gall y grŵp gytuno ar rywbeth arall, fel symiau union. Mae [rhannu treuliau](page:feature/split-expenses) yn trafod y dewisiadau."
    - q: "Allwn ni newid y rhaniad yn nes ymlaen?"
      a: "Gallwch, ar gyfer costau newydd. Newidiwch y canrannau pan fyddwch yn copïo'r rhent ac mae'r misoedd blaenorol yn aros fel yr oeddent. I gywiro cost yn y gorffennol, golygwch hi os yw caniatâd y grŵp yn gadael hynny, a dywedwch wrth y tŷ yn gyntaf, oherwydd bod y balansau'n newid. Cedwir y fersiwn gynharach."
