sections:
  - heading: Splitwise 做得好的地方
    body: "如果你们的群组需要原生应用、离线使用或在应用内付款，Splitwise 是明智之选，我们宁愿你选它，也不愿你日后才发现。它自己的页面列出了："
    items:
      - "**应用与离线使用。**除了网页，还有 iPhone 和 Android 应用，以及离线模式。"
      - "**更多分摊方式。**除了平均、确切金额和按百分比，还有按份数、调整和逐项分摊。"
      - "**定期支出。**把房租设成重复，然后就不用再管了。"
      - "**应用内付款。**在一些国家，它还能转移资金，通过 Splitwise Pay、Venmo、PayPal 或 Pay by Bank。"
  - heading: 这里免费，那里收费
    body: "Splitwise Pro 是 Splitwise 的付费方案，它自己的 Pro 页面卖的四样东西，在 Side Badger 里都不花钱。"
    items:
      - "**收据扫描。**Splitwise Pro 可以扫描收据照片。Side Badger 免费提供，且没有扫描额度：它会填好总额、日期和地点，供你核对。收据图片由 Google 的 AI 服务读取。"
      - "**货币换算。**Splitwise Pro 在你点击 Convert 时，把群组的支出换算成你的默认货币。Side Badger 在你录入每笔支出时就换算，按当前汇率或你实际换到的汇率，原始金额会保留在这笔支出上。"
      - "**无广告。**Splitwise 把完全无广告的体验列为 Pro 功能。Side Badger 没有广告。"
      - "**无每日限制。**Splitwise Pro 卖的是无限支出，它的帮助中心说免费用户每天最多可添加 4 笔支出。Side Badger 没有每日限制。"
  - heading: Splitwise 有而 Side Badger 没有的
    body: "这并不是 Splitwise 的全部功能，只是那些往往决定取舍的功能。Splitwise 自己的页面有完整的列表。下面是 Side Badger 不如它的地方。"
    items:
      - "**原生应用。**Side Badger 在你的浏览器里运行。登录后把它添加到主屏幕，它就会像应用一样打开。"
      - "**离线模式。**Side Badger 需要联网。"
      - "**应用内付款。**Side Badger 从不经手你的钱。你们想怎么付就怎么付，然后记录这笔付款。"
      - "**定期支出。**Side Badger 没有。请复制上个月的房租，而不是再输一遍。"
      - "**按份数或按物品分摊。**Side Badger 每笔支出只有一位付款人，可平均分摊、按确切金额或按百分比分摊。它的收据扫描也不会把物品分配给个人。"
      - "**图表和默认分摊。**Splitwise Pro 两者都有。Side Badger 只记下谁欠谁，整个把戏就这些。"
  - heading: 把你们的群组搬过来
    body: "没有导入工具，所以搬家意味着重新开始。先在 Splitwise 里结清，再在 Side Badger 里建一个群组，用链接或二维码邀请所有人。群组里每个人都需要一个免费账户，注册只需要一个电子邮箱地址。"
