faq:
  heading: "Jautājumi"
  items:
    - q: "Vai varu apšaubīt tikai savu daļu?"
      a: "Nē. Jautājums aiztur visu izdevumu, visiem tajā. Ja nepareiza ir tikai sadale, risinājums ir sadales labojums."
    - q: "Kas var aizvērt jautājumu?"
      a: "Cilvēks, kas jautāja, vai grupas administrators. Ja cilvēks, kas pievienoja izdevumu, nav administrators, viņš nevar to aizvērt jautātāja vietā."
    - q: "Vai izdevuma labošana izdzēš oriģinālu?"
      a: "Nē. Iepriekšējā versija tiek saglabāta. Kurš var labot, nosaka grupas atļaujas, tāpēc vērts vispirms pateikt mājai, jo atlikumi mainās."
