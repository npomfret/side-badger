meta:
  title: Shared lists, polls and comments for group expenses | Side Badger
  description: Comment on expenses, question the odd one, keep a shared shopping list and vote on the villa. Plan the spending together, then split it. Free, no ads.
h1: Plan it together, split it after
navLabel: Plan together
lead: The shopping list and the shopping bill, finally on speaking terms. Side Badger gives your group somewhere to talk about the money before and after it's spent, with comments on every expense, a way to question the ones that look wrong, shared lists and polls for the big calls. Then you [split expenses](page:feature/split-expenses) as usual.
cta:
  heading: Plan it, then split it
  body: Create a free account, start a group and put the first list, poll or question right next to the money. Not sure what happens next? See [how it works](page:how-it-works).
problem:
  heading: The chat is over here, the bill is over there
  body: Group spending usually lives in two places. The numbers are in one, and the argument about the numbers is in a chat that scrolled away on Tuesday. The shopping list is a photo of a fridge. The villa was decided by a thumbs-up from most people, probably. Side Badger keeps the planning in the group, next to the expenses it's about, so there is a comment where the cost is, a list where the shop is, a poll for the big call, and a way to say "hang on, is this right?" without writing a paragraph. All of it stays about the group's money, which is what the group is for.
workflow:
  heading: From the villa vote to the shopping bill
  steps:
    - title: Put the big call to a vote
      body: Add a poll for the decision that sets the bill, such as which villa. Pick two to ten options, say how many votes each person gets, then close it when everyone is in and the winner is marked.
      shot: S17
      shotAlt: A closed poll with the winning option marked and the number of votes beside each option
    - title: Write the shopping list together
      body: Start a shared list, add the items and tick them off as they reach the trolley. The shop goes in afterwards as an expense.
      shot: S16
      shotAlt: A shared shopping list with some items ticked off and a progress count
    - title: Talk about the cost where it lives
      body: Comment on the expense itself, attach the receipt and react with an emoji. The conversation stays next to the number it's about.
      shot: S08
      shotAlt: An expense with its details, a receipt thumbnail, a comment thread and emoji reactions
    - title: Question the one that looks off
      body: If the group has switched on expense questions, anyone included in an expense can choose **I have a question**. The expense stays out of the balances until the question is dealt with.
      shot: S18
      shotAlt: The expenses list with a Questioned badge and the Only questioned filter
    - title: See what changed, and who changed it
      body: The activity feed and the notifications bell show what's new across your groups. Push notifications are there if you want them.
      shot: S19
      shotAlt: The notifications dropdown with a list of recent activity
