meta:
  title: "खर्च उचित तरीके से बांटने की गाइड | Side Badger"
  description: "किराया, हॉलिडे विला और ग्रुप के खर्च उचित तरीके से बांटने की काम की गाइड, हर एक असली-से ग्रुप और पूरे हिसाब के साथ।"
h1: "खर्च उचित तरीके से बांटने की गाइड"
navLabel: "गाइड"
lead: "वे सवाल जो लोग स्प्रेडशीट खोलने से ठीक पहले पूछते हैं, जवाब एक असली-से दिखते ग्रुप, पूरे हिसाब और ऐप के कदमों के साथ।"
intro: "हर गाइड **एक काल्पनिक ग्रुप** को पहले खर्च से आखिरी रिकॉर्ड किए गए पेमेंट तक ले जाती है। संख्याएं आपके लिए निकाल दी गई हैं, और कदमों में स्क्रीन के वही नाम हैं जो ऐप में हैं।"
cta:
  heading: "आपके पास भी ऐसा ही कोई ग्रुप है?"
  body: "अकाउंट बनाएं, ग्रुप शुरू करें और पहला खर्च जोड़ें। जोड़-घटाव आपके लिए हो जाता है।"
cardsHeading: "अपना सवाल चुनें"
