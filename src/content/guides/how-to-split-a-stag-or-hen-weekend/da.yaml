faq:
  heading: Spørgsmål
  items:
    - q: Betaler forloveren mere?
      a: Kun hvis gruppen er enig. Appen giver ingen en særlig rolle i regnestykket. Hvis nogen dækker mere, så vælg **Præcise beløb** eller **Procent** under **Hvordan skal det fordeles** og indtast de andele, I aftalte.
    - q: Hvad med drikkevarer, som nogle ikke fik?
      a: Tilføj drikkevarerne som deres egen udgift, og afkryds kun dem, der fik dem. Hvis alle fik forskellige mængder, så vælg **Præcise beløb** og skriv hver persons andel. Ingen betaler for det, de ikke fik.
    - q: Kan æresgæsten se gruppen senere?
      a: Ja, når overraskelsen er overstået. Inviter vedkommende, og så kan en administrator gøre vedkommende til **Seer** under **Sikkerhed & Tilladelser** i gruppens indstillinger. En seer ser alt og ændrer intet, så vent, til intet længere er en hemmelighed. Vedkommende skal have en gratis konto for at komme med.
