meta:
  title: "Nola banatu agur-festako asteburuaren kostua | Side Badger"
  description: "Ohorezko gonbidatuak ez du ezer ordaintzen eta astelehenerako denek hitz egiten jarraitzen dute. Nola banatu agur-festako asteburu bat, kalkuluak barne."
h1: "Nola banatu agur-festako asteburu baten kostua"
navLabel: "Agur-festako asteburua"
lead: "Ohorezko gonbidatuak ez du ezer ordaintzen, beraz taldeko gainerakoek kostu guztiak [berdin](page:feature/split-expenses) banatzen dituzte euren artean. Utzi kanpoan jendea saltatzen duten kostuetatik, eta eduki ohorezko gonbidatua taldetik kanpo, sorpresa ez hondatzeko."
cta:
  heading: "Eraman kontua, gorde sorpresa"
  body: "Sortu talde bat, bidali esteka ohorezko gonbidatua izan ezik denei eta gehitu kostu bakoitza gertatu ahala. Side Badger doakoa da, iragarkirik gabe eta eguneko mugarik gabe."
sections:
  - heading: "Lau lagun eta sorpresa bat"
    body: "Hannah, Isla, Jess eta Kat Grace bidaiara eramaten ari dira, bere agur-festako asteburuan. Grace ohorezko gonbidatua da, beraz ez du ezer ordaintzen. Taldean ere ez dago, beraz ezin du ikusi bere lagunek berarengatik zer gastatzen duten. Hannah-k landetxea erreserbatzen du, Isla-k spa-eguna ordaintzen du, Jessek afaria hartzen du bere gain eta Katek taxia ordaintzen du. Igandera arte denek zerbait ordaindu dute, eta inork ezin du esan nor dagoen aurretik. Kalkuluak berdinak dira mutilen agur-festan zein nesken agur-festan, ohorezko gonbidatua nor izanda ere."
  - heading: "Banatu ordaintzen dutenen artean, bertan daudenen artean ez"
    body: "Ohorezko gonbidatuaren zatiak ez du desagertzen. Banatu egiten da. Landetxeak 720 £ balio du eta lau lagunek ordaintzen dute, beraz 180 £ bakoitzak, eta Grace-ren tokia zifra horretan sartuta dago dagoeneko. Afaria 260 £ da, beraz 65 £ bakoitzak. Taxia 44 £ da, beraz 11 £ bakoitzak. Norbaitek saltatzen duen edozer gastu horretatik bakarrik ateratzen da. Katek spa-eguna saltatzen du, beraz haren 360 £ (Grace-ren tokia ere barne) Hannah-k, Isla-k eta Jessek banatzen dituzte, 120 £ bakoitzak. Batu guztia eta Hannah-k, Isla-k eta Jessek 376 £ zor dute asteburuagatik bakoitzak, eta Katek 256 £."
  - heading: "Prestatu Side Badger-en"
    items:
      - "Sortu taldea asteburuarentzat eta jarri izen aspergarri bat, adibidez Landetxeko asteburua. Grace ez da kidea, eta taldeko kideek bakarrik ikus dezakete taldea."
      - "Aukeratu **Gonbidatu beste batzuk** eta bidali esteka, edo erakutsi QR kodea, Grace-k ikusiko ez duen tokian bakarrik. Estekak taldearen aurrebista erakusten du inor sartu aurretik. Aukeratu zenbat irauten duen, 15 minututik 5 egunera. Esteka zahar batek funtzionatzen jarraitzen du iraungi arte, beraz ez utzi behar baino luzeago."
      - "Kostu bakoitzerako, aukeratu **Gehitu gastua**, sartu zenbatekoa eta aukeratu ordaintzailea **Nork ordaindu du?** atalean. **Banatu honen artean** atalean, markatu ordaintzen duten pertsonak, saltatu duena kanpoan utzita, adibidez Kat spa-egunerako. Aukeratu **Berdin-berdin** **Nola banatu** atalean."
      - "Etxera iristean, ireki taldearen **Balantzeak**. Side Badger-ek nork nori zor dion erakusten du eta ordainketa-zerrenda labur bat proposatzen du. Hemen hiru dira: Katek Hannah-ri 212 £ ordaintzen dizkio, Jessek Hannah-ri 116 £ eta Isla-k Hannah-ri 16 £. Ordaindu elkarri nahi duzuen moduan, eta gero erabili **Kitatu** ordainketa bakoitza erregistratzeko."
  - heading: "Erreserba egin aurretik, aurrekontua eta fidantza"
    body: "Adostu aurrekontua inork erreserbatu aurretik. Aukeratu **Gehitu inkesta**, galdetu zenbat gastatuko duen taldeak landetxean eta eskaini zifra batzuk aukera gisa. Aktibatu **Boto anonimoa** sortzen duzunean, nork zer bozkatu duen ezkutatzeko, inork aurrekontu txikiago bat ozenki defendatu behar ez izateko. Itxi inkesta denek bozkatu dutenean eta irabazlea agertuko da. Gero fidantza dator. Erreserba egiten duenak ordaintzen du eta gastu gisa gehitzen du, berdin banatuta, eta saldoa bigarren gastu gisa sartzen da dagokionean. Besteek beren zatia berehala bidal dezakete eta ordainketa erregistratu, edo azken kontuaren zain egon. Saldoak berdin ateratzen dira bi kasuetan."
  - heading: "Norbait gau batez bakarrik batzen denean"
    body: "Larunbaterako bakarrik azaltzen den lagun batek ez luke ostiralagatik ordaindu behar. Utzi kanpoan parte ez zen kostuetatik. Kostua pertsona bakoitza zenbat denbora geratzen den araberakoa denean, adibidez gela baten kasuan, aukeratu **Zenbateko zehatzak** **Nola banatu** atalean eta idatzi pertsona bakoitzaren zatia, guztizkoa batu behar duena. Kalkulatu lehenik prezio bat pertsona eta gau bakoitzeko, eta gero biderkatu pertsona bakoitzak egiten dituen gauekin. [Taldeko bidaiak](page:use-case/group-trips) orrian gehiago dago denentzat berdinak ez diren kostuei buruz."
  - heading: "Side Badger-ek hemen egiten ez duena"
    items:
      - "Ez du inoiz dirurik mugitzen. Elkarri ordaintzen diozue banku-transferentziaz, eskudiruz edo komeni zaizuen moduan, eta gero ordainketa erregistratzen duzue, saldoak denentzat eguneratzeko."
      - "Ez du ordainketa-gogorarazpenik bidaltzen. Taldeko txatean bultzadatxo atsegin bat egitea oraindik pertsona baten esku dago."
      - "Gastu bakoitzak ordaintzaile bat du, eta Side Badger-ek ezin du tiket bat lerroz lerro banatu. Bi txartelek ordaindu badute landetxea, sartu bi gastu gisa. Batzuek afarian estrak eskatu badituzte, sartu estrak gastu propio gisa."
      - "Dirua eramaten du, ez ibilbidea. Inkestak eta iruzkinak kostuei buruzkoak dira, beraz asteburuko planak zuen taldeko txatean geratzen dira."
