    - feature: Malipo na benki yako
      other: "Katika sehemu fulani inaweza kutuma pesa kutoka ndani ya programu: Splitwise Pay nchini Marekani, Venmo kwa salio la dola za Marekani, PayPal, na Pay by Bank katika nchi teule za Ulaya, ambayo huunganisha akaunti binafsi ya benki ya matumizi ya kila siku."
      sideBadger: Haigusi pesa zako kamwe na haiombi taarifa zako za benki. Lipaneni kwa njia mnayopenda, kisha rekodi malipo.
