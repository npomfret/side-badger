meta:
  title: "Rhannu costau mewn 140 o arian cyfred, wedi'u trosi neu ar wahân"
  description: "Rhowch bob cost yn yr arian cyfred y talwyd ynddo, cadwch y balansau ar wahân neu drosi ar gyfradd y gallwch ei gweld a'i newid, yna setlwch gyda rhestr fer o daliadau."
h1: "Rhannu costau mewn 140 o arian cyfred"
navLabel: "Arian cyfred lluosog"
lead: "Ewros, yen, a'r un tacsi hwnnw mewn baht. Mae Side Badger yn cymryd pob cost yn yr arian cyfred y talwyd ynddo, yn cadw'r balansau'n gywir, a gall drosi pan fyddai'n well gan eich grŵp setlo unwaith. Mae'n gweithio mewn 140 o arian cyfred, ac mae'n gweddu'n naturiol i [deithiau grŵp](page:use-case/group-trips)."
cta:
  heading: "Dewch â'ch ewros, dewch â'ch yen"
  body: "Creu cyfrif, cychwyn grŵp ac ychwanegu'r gost gyntaf mewn pa bynnag arian cyfred oedd gennych yn eich llaw."
  button: "Creu cyfrif am ddim"
problem:
  heading: "Rhowch hi fel y talwyd"
  body: "Anaml y telir am daith mewn un arian cyfred. Archebwyd y gwesty gartref mewn punnoedd, talwyd am swper mewn yen, a thalwyd am goffi'r maes awyr mewn beth bynnag oedd y lleoliad yn ei ddefnyddio. Trosi popeth â llaw cyn y gallwch hyd yn oed ei deipio yw sut mae taenlenni'n cael eu gadael. Yn Side Badger rydych yn rhoi pob cost yn yr arian cyfred sydd ar y dderbynneb, ac mae pob swm yn dilyn rheolau ei arian cyfred, felly nid oes gan yen leoedd degol ac mae gan ddinarau dri. Daw'r arian cyfred a ddefnyddiwyd yn ddiweddar gyntaf yn y rhestr."
workflow:
  heading: "Cadw arian cyfred ar wahân, neu drosi wrth fynd"
  steps:
    - title: "Ychwanegu'r gost yn ei harian cyfred ei hun"
      body: "Dewiswch yr arian cyfred, teipiwch y swm, dywedwch pwy dalodd a phwy a'i rhannodd. Does dim angen dim byd arall. Dyma'r rhagosodiad, ac mae'n cadw'r swm gwreiddiol yn union fel y'i rhoesoch."
      shot: S07
      shotAlt: "Y ffurflen gost gyda swm mewn yen wedi'i roi"
    - title: "Gwylio balans ar gyfer pob arian cyfred"
      body: "Cedwir balansau ar wahân fesul arian cyfred, ac mae pob un yn cael ei restr fer ei hun o daliadau a awgrymir. Setlir punnoedd mewn punnoedd ac yen mewn yen."
      shot: S10
      shotAlt: "Sgrin y balansau gyda dyledion wedi'u symleiddio mewn dau arian cyfred"
    - title: "Neu drosi, pan fyddai'n well gan y grŵp setlo unwaith"
      body: "Dewiswch arian cyfred arall wrth roi'r gost a gall Side Badger ei drosi ar gyfradd gyfnewid gyfredol, y gallwch ei newid i'r gyfradd a gawsoch mewn gwirionedd. Mae'r swm wedi'i drosi yn ymuno â'r balans yn yr arian cyfred hwnnw. Dewis y mae'r grŵp yn ei wneud yw trosi, byth rhywbeth sy'n digwydd y tu ôl i'ch cefn."
options:
  heading: "Cyfradd y gallwch ei gweld a'i newid"
  items:
    - title: "Dangosir y gyfradd"
      body: "Pan fyddwch yn trosi, mae'r gyfradd a'r swm wedi'i drosi yn ymddangos ar y ffurflen, fel nad oes rhaid i neb gymryd rhif ar ei ffydd."
    - title: "Teipiwch eich un eich hun"
      body: "Cawsoch gyfradd well gan ddesg arian parod, neu un waeth gan faes awyr? Golygwch y gyfradd i'r un a gawsoch mewn gwirionedd ac mae'r swm wedi'i drosi yn diweddaru."
    - title: "Mae'r gwreiddiol yn aros"
      body: "Mae'r swm gwreiddiol yn aros ar y gost, wrth ymyl yr un wedi'i drosi, i unrhyw un sy'n gofyn faint oedd mewn yen."
    - title: "Am ddim i drosi"
      body: "Mae trosi yn costio dim. Does dim ffi am roi cost mewn arian cyfred arall."
