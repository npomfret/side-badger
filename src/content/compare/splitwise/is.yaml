meta:
  title: "Side Badger vs Splitwise: allur hópurinn, ekki bara summurnar | Side Badger"
  description: "Ókeypis valkostur við Splitwise fyrir allan hópinn: athugasemdir, spurningar, listar, kannanir og almennileg hlutverk, með ókeypis kvittanaskönnun og gjaldmiðlaumreikningi."
h1: "Side Badger vs Splitwise: allur hópurinn, ekki bara summurnar"
navLabel: Side Badger á móti Splitwise
lead: "Einhver í hópnum þínum hefur örugglega sagt „notum bara Splitwise“. Sanngjarnt: það er gott í summunum. Side Badger gerir summurnar líka og gefur svo hópnum stað til að ræða þær: athugasemdir, spurningar, lista, kannanir og almennileg hlutverk í hópnum. Kvittanaskönnun og gjaldmiðlaumreikningur fylgja ókeypis með."
cta:
  heading: Prófaðu það á næsta sameiginlega reikningi
  body: Stofnaðu ókeypis aðgang, búðu til hóp og bættu við einu raunverulegu útgjaldi. Ef þetta hentar þér ekki hefurðu eytt nokkrum mínútum, ekki áskrift.
asOf: 2026-11-22
asOfNote: Við lásum síður Splitwise sjálfs þann {date} svo þú þurfir þess ekki, og allt sem hér stendur um Splitwise kemur þaðan. Hver lína í töflunni vísar á heimild sína. Áskriftir breytast, svo við athugum aftur ársfjórðungslega, og ef síður Splitwise stangast á við þessa síðu skaltu trúa þeim.
