    - feature: Talde-rolak eta baimenak
      other: Bere laguntza-zentroak dio ez dituela onartzen talde-administratzailerik, ezta baimen berezirik ere.
      sideBadger: Administratzaileak, kideak eta ikusleak. Bi aurrezarpen edo zure baimenak, sartzeko onarpena eta amaitzen denerako blokeo bat.
      source: permissions-help
    - feature: Ordainagirien eskaneatzea
      other: Pro ezaugarri bat. Ordainagiriaren argazki bat eskaneatzen du, eta Pro-ren artikuluka banatzeak artikuluak pertsonei esleitzen uzten du.
      sideBadger: Doakoa, eskaneatze-kreditu gabe. Guztizkoa, data eta lekua betetzen ditu zuk egiazta ditzazun, eta ez ditu artikuluak pertsonei esleitzen.
      source: pro
    - feature: Moneta-bihurketa
      other: Pro ezaugarri bat. Sakatu “Convert” eta Splitwise-k taldeko gastuak zure lehenespeneko monetara bihurtzen ditu une horretako kanbio-tasarekin.
      sideBadger: Doakoa. Bihurtu gastu bakoitza sartzen duzunean, egungo kanbio-tasa batekin edo benetan lortu zenuenarekin. Jatorrizko zenbatekoa gastuan geratzen da.
      source: currencies-help
    - feature: Monetak eta hizkuntzak
      other: 100+ moneta eta 7+ hizkuntza, bere hasiera orriak dioenez.
      sideBadger: 133 moneta eta 39 hizkuntza. Taldeko bakoitzak bere hizkuntza aukera dezake.
      source: home
    - feature: Non erabiltzen den
      other: iPhone eta Android aplikazioak, eta weba.
