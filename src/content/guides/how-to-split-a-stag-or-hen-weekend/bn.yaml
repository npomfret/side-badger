meta:
  title: "ব্যাচেলর বা ব্যাচেলোরেট সপ্তাহান্তের খরচ ভাগ | Side Badger"
  description: "বিশেষ অতিথি কিছুই দেয় না, আর সোমবারেও সবাই কথা বলছে। ব্যাচেলর বা ব্যাচেলোরেট সপ্তাহান্তের খরচ ভাগ করার উপায়, অঙ্কসহ।"
h1: "ব্যাচেলর বা ব্যাচেলোরেট সপ্তাহান্তের খরচ কীভাবে ভাগ করবেন"
navLabel: "ব্যাচেলর/ব্যাচেলোরেট সপ্তাহান্ত"
lead: "বিশেষ অতিথি কিছুই দেয় না, তাই বাকিরা প্রতিটি খরচ নিজেদের মধ্যে [সমান ভাগে](page:feature/split-expenses) ভাগ করে নেয়। যে খরচে কেউ ছিল না, সেখান থেকে তাকে বাদ দিন, আর বিশেষ অতিথিকে গ্রুপের বাইরে রাখুন যাতে চমকটা টিকে থাকে।"
cta:
  heading: "হিসাব রাখুন, চমকও রাখুন"
  body: "একটি গ্রুপ খুলুন, বিশেষ অতিথি বাদে সবাইকে লিঙ্ক পাঠান, আর প্রতিটি খরচ হওয়ামাত্র যোগ করুন। Side Badger বিনামূল্যে, কোনো বিজ্ঞাপন নেই, দৈনিক কোনো সীমা নেই।"
sections:
  - heading: "চার বন্ধু আর একটা চমক"
    body: "Hannah, Isla, Jess আর Kat, Grace-কে নিয়ে তার ব্যাচেলোরেট সপ্তাহান্তে বেরোচ্ছে। Grace বিশেষ অতিথি, তাই সে কিছুর জন্যই টাকা দেয় না। সে গ্রুপেও নেই, তাই বন্ধুরা তার পেছনে কী খরচ করছে তা সে দেখতে পায় না। Hannah কটেজ বুক করে, Isla স্পা-র দিনের টাকা দেয়, Jess ডিনার মেটায় আর Kat ট্যাক্সির ভাড়া দেয়। রবিবারের মধ্যে প্রত্যেকে কিছু না কিছু দিয়েছে, আর কে এগিয়ে তা কেউ বলতে পারে না। ব্যাচেলর হোক বা ব্যাচেলোরেট, বিশেষ অতিথি যে-ই হোক, অঙ্ক একই।"
  - heading: "যারা দিচ্ছে তাদের ধরে ভাগ করুন, যারা সেখানে ছিল তাদের ধরে নয়"
    body: "বিশেষ অতিথির ভাগ উবে যায় না। সেটা বাকিদের মধ্যে ভাগ হয়ে যায়। কটেজের খরচ £720 আর চার বন্ধু সেটা দেয়, তাই জনপ্রতি £180, আর Grace-এর জায়গার খরচ ওই অঙ্কের মধ্যে আগেই ধরা আছে। ডিনার £260, তাই জনপ্রতি £65। ট্যাক্সি £44, তাই জনপ্রতি £11। কেউ কিছু বাদ দিলে সেটা শুধু ওই খরচ থেকেই বাদ যায়। Kat স্পা-টা বাদ দেয়, তাই স্পা-র £360, যাতে Grace-এর জায়গাও ধরা আছে, ভাগ হয় Hannah, Isla আর Jess-এর মধ্যে, জনপ্রতি £120। সব যোগ করলে সপ্তাহান্তের জন্য Hannah, Isla আর Jess-এর প্রত্যেকের দেওয়ার £376, আর Kat-এর £256।"
  - heading: "Side Badger-এ সাজিয়ে নিন"
    items:
      - "সপ্তাহান্তের জন্য একটি গ্রুপ খুলুন আর তার একটা একেবারে সাদামাটা নাম দিন, যেমন কটেজ সপ্তাহান্ত। Grace সদস্য নয়, আর গ্রুপ শুধু তার সদস্যরাই দেখতে পায়।"
      - "**অন্যদের আমন্ত্রণ জানান** বেছে নিন আর লিঙ্কটা পাঠান, বা QR কোড দেখান, শুধু সেখানে যেখানে Grace দেখবে না। যোগ দেওয়ার আগে লিঙ্কে গ্রুপের একটি প্রিভিউ দেখা যায়। লিঙ্কটা কতক্ষণ চলবে তা বেছে নিন, 15 মিনিট থেকে 5 দিন পর্যন্ত। পুরনো লিঙ্ক মেয়াদ শেষ না হওয়া পর্যন্ত কাজ করে, তাই যতক্ষণ দরকার তার বেশি রাখবেন না।"
      - "প্রতিটি খরচের জন্য **খরচ যোগ করুন** বেছে নিন, পরিমাণ লিখুন, আর **কে টাকা দিয়েছেন?** অংশে যে টাকা দিয়েছে তাকে বাছুন। **যাদের মধ্যে ভাগ হবে** অংশে যারা দিচ্ছে তাদের টিক দিন, যে বাদ দিয়েছে তাকে বাদ রেখে, যেমন স্পা-র জন্য Kat-কে। **কীভাবে ভাগ হবে** অংশে **সমান** বেছে নিন।"
      - "বাড়ি ফিরে গ্রুপের **ব্যালেন্স** খুলুন। Side Badger দেখায় কে কার কাছে ঋণী আর পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে। এখানে সেটা তিনটি: Kat দেয় Hannah-কে £212, Jess দেয় Hannah-কে £116 আর Isla দেয় Hannah-কে £16। যেভাবে খুশি একে অপরকে দিন, তারপর প্রতিটি পেমেন্ট রেকর্ড করতে **সব শোধ করুন** ব্যবহার করুন।"
  - heading: "বুকিংয়ের আগে, একটা বাজেট আর একটা ডিপোজিট"
    body: "কেউ বুক করার আগে বাজেটে একমত হোন। **পোল যোগ করুন** বেছে নিন, জিজ্ঞেস করুন কটেজে গ্রুপ কত খরচ করবে আর বিকল্প হিসেবে কয়েকটি অঙ্ক দিন। পোল বানানোর সময় **বেনামী ভোটদান** চালু করুন, যাতে কে কোনটায় ভোট দিয়েছে তা লুকানো থাকে, আর কম বাজেটের পক্ষে কাউকে সবার সামনে সাফাই দিতে না হয়। সবাই ভোট দিলে পোল বন্ধ করুন, তখন বিজয়ী দেখা যায়। তারপর আসে ডিপোজিট। যে বুক করে সে সেটা দেয় আর একটি খরচ হিসেবে যোগ করে, সমান ভাগে, আর বাকি টাকা দেওয়ার সময় হলে সেটা দ্বিতীয় একটি খরচ হিসেবে যোগ হয়। বাকিরা নিজেদের ভাগ সঙ্গে সঙ্গে পাঠিয়ে পেমেন্টটা রেকর্ড করতে পারে, অথবা চূড়ান্ত হিসাব পর্যন্ত অপেক্ষা করতে পারে। দুভাবেই ব্যালেন্স একই আসে।"
  - heading: "কেউ যখন এক রাতের জন্য আসে"
    body: "যে বন্ধু শুধু শনিবারের জন্য আসে, তার শুক্রবারের টাকা দেওয়া উচিত নয়। যে খরচগুলোতে সে ছিল না, সেখান থেকে তাকে বাদ দিন। যে খরচ প্রত্যেকে কতদিন থাকে তার ওপর নির্ভর করে, যেমন একটি ঘর, সেখানে **কীভাবে ভাগ হবে** অংশে **সঠিক পরিমাণ** বেছে প্রত্যেকের ভাগ লিখুন, যার যোগফল মোটের সমান হতে হবে। আগে জনপ্রতি রাতপ্রতি একটা দাম বের করুন, তারপর প্রত্যেকে যত রাত থাকে তা দিয়ে গুণ করুন। সবার জন্য এক নয় এমন খরচ নিয়ে আরও জানতে দেখুন [গ্রুপ ট্রিপ](page:use-case/group-trips)।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটা কখনও টাকা নাড়াচাড়া করে না। ব্যাংক ট্রান্সফার, নগদ বা যা সুবিধা হয় তা দিয়ে একে অপরকে দিন, তারপর পেমেন্টটা রেকর্ড করুন যাতে সবার জন্য ব্যালেন্স হালনাগাদ হয়।"
      - "এটা পেমেন্টের রিমাইন্ডার পাঠায় না। গ্রুপ চ্যাটে একটু বন্ধুত্বপূর্ণ খোঁচা দেওয়া এখনও মানুষেরই কাজ।"
      - "প্রতিটি খরচে একজনই দেয়, আর Side Badger রসিদ লাইন ধরে ভাগ করতে পারে না। দুটি কার্ডে কটেজের টাকা দেওয়া হলে সেটা দুটি খরচ হিসেবে লিখুন। ডিনারে কেউ বাড়তি অর্ডার করলে সেই বাড়তিগুলো আলাদা খরচ হিসেবে লিখুন।"
      - "এটা টাকার হিসাব রাখে, ভ্রমণসূচি নয়। পোল আর মন্তব্য খরচের সঙ্গেই থাকে, তাই সপ্তাহান্তের পরিকল্পনা আপনার গ্রুপ চ্যাটেই থাকে।"
exampleAfter: 2
