faq:
  heading: "Otázky"
  items:
    - q: "Je kalkulačka zdarma?"
      a: "Ano. Zdarma. Bez reklam. Bez denních limitů. Nepotřebujete ani účet."
    - q: "Ukládá to, co zadám?"
      a: "Ne. Nic se nikam neukládá ani neodesílá. Chcete-li čísla zachovat, použijte tlačítko Zkopírovat odkaz a odkaz si někam uložte."
    - q: "Kdo uvidí odkaz, který zkopíruji?"
      a: "Každý, kdo ho má. Čísla jsou přímo v odkazu, za znakem #, takže ho sdílejte jen s lidmi, kteří je mají vidět."
    - q: "Přesouvá kalkulačka peníze?"
      a: "Ne. Spočítá, kdo by měl komu zaplatit, a vy si platíte, jak chcete. Side Badger se vašich peněz také nikdy nedotkne. Viz [vyrovnání](page:feature/settle-up)."
    - q: "Mohu dělit výlet placený ve dvou měnách?"
      a: "Tady ne, protože výpočet má jednu měnu. Ve skupině má každá měna svůj vlastní zůstatek. Viz [více měn](page:feature/multiple-currencies)."
    - q: "Co když částky nesedí?"
      a: "Kalkulačka to napíše pod výdaj a nezobrazí žádný výsledek, dokud nesedí. Přesné částky se musí sečíst na celkovou částku a procenta musí dát dohromady 100."
