meta:
  title: "كيف تقسّم تكلفة عطلة نهاية أسبوع لتوديع العزوبية | Side Badger"
  description: "ضيف الشرف لا يدفع شيئاً، ويبقى الجميع يتحدثون إلى بعضهم حتى صباح الاثنين. كيف تقسّم تكلفة عطلة توديع العزوبية، مع الحسابات."
h1: "كيف تقسّم تكلفة عطلة نهاية أسبوع لتوديع العزوبية، للعريس أو للعروس"
navLabel: "توديع العزوبية"
lead: "ضيف الشرف لا يدفع شيئاً، فيقسّم بقية المجموعة كل تكلفة [بالتساوي](page:feature/split-expenses) بينهم. استبعد الناس من التكاليف التي تخطّوها، وأبقِ ضيف الشرف خارج المجموعة لتبقى المفاجأة."
cta:
  heading: "احتفظ بالحساب، واحتفظ بالمفاجأة"
  body: "أنشئ مجموعة، وأرسل الرابط إلى الجميع ما عدا ضيف الشرف، وأضف كل تكلفة حين تحدث. Side Badger مجاني، بلا إعلانات وبلا حدود يومية."
sections:
  - heading: "أربعة أصدقاء ومفاجأة واحدة"
    body: "تأخذ هانا وآيلا وجيس وكات غريس في عطلة نهاية أسبوع لتوديع عزوبيتها. غريس هي ضيفة الشرف، فلا تدفع مقابل أي شيء. وهي ليست في المجموعة أيضاً، فلا تستطيع أن ترى ما ينفقه أصدقاؤها عليها. تحجز هانا الكوخ، وتدفع آيلا ثمن يوم السبا، وتتكفل جيس بالعشاء، وتتولى كات سيارة الأجرة. وبحلول يوم الأحد يكون كل واحد قد دفع مقابل شيء، ولا أحد يعرف من دفع أكثر. والحسابات هي نفسها في عطلة نهاية أسبوع لتوديع العزوبية، للعريس أو للعروس، أياً كان ضيف الشرف."
  - heading: "قسّم على من يدفعون، لا على من حضروا"
    body: "حصة ضيف الشرف لا تختفي. بل تُوزَّع. يكلّف الكوخ £720 ويدفعه أربعة أصدقاء، فتكون حصة كل واحد £180، ومكان غريس محسوب في هذا الرقم أصلاً. والعشاء £260، أي £65 لكل واحد. وسيارة الأجرة £44، أي £11 لكل واحد. وأي شيء يتخطّاه أحدهم يُستبعد من ذلك المصروف وحده. تتخطى كات السبا، فتكلفته £360، التي تشمل مكان غريس أيضاً، يتقاسمها هانا وآيلا وجيس بواقع £120 لكل واحد. اجمع ذلك كله فيتحمّل كل من هانا وآيلا وجيس £376 من تكاليف نهاية الأسبوع، وتتحمل كات £256."
  - heading: "جهّزها في Side Badger"
    items:
      - "أنشئ مجموعة لنهاية الأسبوع وسمِّها اسماً مملاً، مثل عطلة الكوخ. غريس ليست عضواً، ولا يرى المجموعة إلا أعضاؤها."
      - >-
        اختر **دعوة الآخرين**، ولا ترسل الرابط ولا تعرض رمز QR إلا في مكان لن تراه فيه غريس. يعرض الرابط معاينة للمجموعة قبل أن ينضم أي أحد. اختر مدة صلاحيته، من 15 دقيقة إلى 5 أيام. ويبقى الرابط القديم يعمل حتى تنتهي صلاحيته، فلا تتركه أطول مما تحتاج.
      - >-
        لكل تكلفة اختر **إضافة مصروف**، وأدخل المبلغ، واختر الدافع تحت **من دفع؟** وتحت **تقسيم بين** حدّد الأشخاص الذين يدفعون، واستبعد كل من تخطّاها، مثل كات في السبا. واختر **بالتساوي** تحت **كيفية التقسيم**.
      - >-
        حين تعودون إلى البيت، افتح **الأرصدة** في المجموعة. يعرض Side Badger من يدين لمن ويقترح قائمة قصيرة من الدفعات. وهي هنا ثلاث: تدفع كات £212 إلى هانا، وتدفع جيس £116 إلى هانا، وتدفع آيلا £16 إلى هانا. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم استخدموا **تسوية** لتسجيل كل دفعة.
  - heading: "قبل أن تحجزوا: ميزانية وعربون"
    body: "اتفقوا على الميزانية قبل أن يحجز أحد. اختر **إضافة استطلاع**، واسأل كم ستنفق المجموعة على الكوخ، واقترح بضعة أرقام خيارات. فعّل **التصويت المجهول** حين تنشئه، لإخفاء من صوّت لماذا، فلا يضطر أحد إلى الدفاع عن ميزانية أصغر بصوت عالٍ. أغلق الاستطلاع حين يصوّت الجميع، ويظهر الفائز. ثم يأتي العربون. من يحجز يدفعه ويضيفه مصروفاً مقسَّماً بالتساوي، ويُدخل المبلغ المتبقي مصروفاً ثانياً حين يحين موعده. ويمكن للآخرين إرسال حصتهم فوراً وتسجيل الدفعة، أو انتظار الحساب النهائي. وتكون الأرصدة نفسها في الحالتين."
  - heading: "حين ينضم أحدهم لليلة واحدة"
    body: "الصديق الذي يصل ليوم السبت فقط لا ينبغي أن يدفع عن الجمعة. استبعده من التكاليف التي لم يكن طرفاً فيها. وحين تتوقف التكلفة على مدة إقامة كل شخص، مثل الغرفة، اختر **مبالغ دقيقة** تحت **كيفية التقسيم** واكتب حصة كل شخص، على أن يساوي مجموعها الإجمالي. احسب أولاً سعراً لكل شخص عن كل ليلة، ثم اضرب في عدد الليالي التي يقيمها كل شخص. وتتناول صفحة [رحلات المجموعات](page:use-case/group-trips) المزيد عن التكاليف التي لا تكون واحدة للجميع."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا ينقل المال أبداً. تدفعون لبعضكم بتحويل مصرفي أو نقداً أو بما يناسبكم، ثم تسجّلون الدفعة لتتحدّث الأرصدة عند الجميع."
      - "لا يرسل تذكيرات بالدفع. والتنبيه الودي في دردشة المجموعة يبقى على عاتق إنسان."
      - "لكل مصروف دافع واحد، ولا يستطيع Side Badger تقسيم إيصال بنداً بنداً. فإذا دفعت بطاقتان ثمن الكوخ فأدخله مصروفين. وإذا طلب بعضهم إضافات في العشاء، فأدخل الإضافات مصروفاً مستقلاً."
      - "يحتفظ بالمال لا بجدول الرحلة. تبقى الاستطلاعات والتعليقات على التكاليف، فتبقى خطط نهاية الأسبوع في دردشة مجموعتكم."
