faq:
  heading: 常见问题
  items:
    - q: 如果收的钱比礼物贵怎么办？
      a: 确切金额必须加起来等于价格，所以把份额削减到刚好相等。或者把多出来的钱花在实实在在的东西上，比如鲜花，并作为第二笔支出录入，就像示例里的贺卡和包装纸。
    - q: 有人能不加入群组就出钱吗？
      a: 如果想让他们算进去，就不行。分摊里的每个人都需要一个免费账户并加入群组。对于只有现金的人，Priya 可以收下现金，并按群组仍欠的金额录入礼物。例如，Sam 给了她 £40 现金，她就录入 £200，并在自己、Omar 和 Lena 之间按 60、60 和 80 分摊。
    - q: 投票能决定每个人出多少吗？
      a: 不能。投票只商定整个群组的一个数字，比如预算。每个人的份额由你们自己商量，再作为**确切金额**输入支出。
