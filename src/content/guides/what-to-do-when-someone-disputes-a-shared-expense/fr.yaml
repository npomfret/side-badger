faq:
  heading: Questions
  items:
    - q: "Puis-je ne questionner que ma part ?"
      a: "Non. Une question met toute la dépense de côté, pour tous ceux qui en font partie. Si seul le partage est faux, la solution est de modifier le partage."
    - q: "Qui peut fermer une question ?"
      a: "La personne qui l'a posée, ou un admin du groupe. Si la personne qui a ajouté la dépense n'est pas admin, elle ne peut pas la fermer à la place de celle qui a posé la question."
    - q: "Modifier une dépense efface-t-il l'original ?"
      a: "Non. La version précédente est conservée. Qui peut modifier est décidé par les permissions du groupe, donc mieux vaut prévenir la maison d'abord, car les soldes changent."
