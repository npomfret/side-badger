featuresHeading: "একটি বাড়ি যে ফিচারগুলো ব্যবহার করে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "ভাড়া কি নিজে থেকে পুনরাবৃত্ত হতে পারে?"
      a: "না, পুনরাবৃত্ত বিল নেই। গত মাসের ভাড়া কয়েক ট্যাপে কপি করুন, তারিখ বদলান আর হয়ে গেল।"
    - q: "আমরা কি ঘরের আকার ধরে ভাগ করতে পারি?"
      a: "হ্যাঁ, শতাংশে। প্রতিটি রুমমেটকে তার ঘর অনুযায়ী একটি ভাগ দিন, ভাগগুলোর যোগফল 100 হলেই হলো। ভাগ করার অন্য উপায়গুলোর জন্য দেখুন [খরচ ভাগ করা](page:feature/split-expenses)।"
    - q: "কোনো রুমমেট দেনা রেখে চলে গেলে কী হবে?"
      a: "হিসাব না মেটানো পর্যন্ত সে গ্রুপ ছাড়তে পারে না, কারণ যার দেওয়ার বা পাওয়ার বাকি আছে সে গ্রুপ ছাড়তে পারে না। সবাই সমান না হওয়া পর্যন্ত সংখ্যাগুলো সৎ থাকে।"
    - q: "Side Badger কি বিল দেয়?"
      a: "না। এটি হিসাব রাখে আর পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে। আপনারা যেভাবে খুশি একে অপরকে দেন, তারপর রেকর্ড করেন, যেমন [হিসাব মেটানো](page:feature/settle-up) ব্যাখ্যা করে।"
    - q: "একজন রুমমেট কি হিসাব রাখতে পারে?"
      a: "হ্যাঁ। তাকে অ্যাডমিন করুন আর ম্যানেজড গ্রুপ ব্যবহার করুন, যেখানে নতুন সদস্যদের অনুমোদন লাগে আর শুধু নির্মাতা ও অ্যাডমিনরা খরচ বদলাতে পারেন।"
