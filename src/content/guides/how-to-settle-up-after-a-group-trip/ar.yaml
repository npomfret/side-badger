faq:
  heading: "أسئلة"
  items:
    - q: "من ينبغي أن يسجّل الدفعة، الدافع أم المدفوع له؟"
      a: "يتطلب تسجيل الدفعة إذن تعديل المصروفات، ويسأل النموذج **من دفع؟** و**من استلم الدفعة؟** ولا يستطيع تعديلها لاحقاً إلا من سجّلها، لذا يكون الأبسط عادةً أن يسجّلها الدافع باستخدام زر التسوية السريعة."
    - q: "ماذا لو كانت الرحلة بعملتين؟"
      a: "تُحفظ الأرصدة لكل عملة، فيبقى دين اليورو ديناً باليورو وتحصل كل عملة على قائمتها القصيرة، ما لم تُحوَّل المصروفات عند إدخالها. ويعرض [عدة عملات](page:guide/how-to-split-a-trip-paid-in-several-currencies) الطريقتين."
    - q: "هل نسوّي الحساب أثناء الرحلة أم في نهايتها؟"
      a: "كلاهما ينفع. فكل دفعة مسجّلة تغيّر الأرصدة، فتُحتسب الدفعة التي تتم في منتصف الرحلة ضمن القائمة النهائية. والنهاية أبسط، لأن [الرحلة كلها](page:use-case/group-trips) في مكان واحد."
