meta:
  title: "Împarte costurile în 140 de valute, convertite sau ținute separat"
  description: "Introdu fiecare cheltuială în valuta în care ai plătit-o, ține soldurile separate sau convertește la un curs pe care îl vezi și îl poți schimba, apoi achită-te cu o listă scurtă de plăți."
h1: "Împarte costurile în 140 de valute"
navLabel: "Mai multe valute"
lead: "Euro, yeni și acel taxi în baht. Side Badger preia fiecare cheltuială în valuta în care ai plătit-o, ține soldurile în ordine și poate converti când grupul preferă să se achite o singură dată. Funcționează în 140 de valute și se potrivește firesc cu [excursiile de grup](page:use-case/group-trips)."
cta:
  heading: "Adu-ți euro, adu-ți yenii"
  body: "Creează un cont, începe un grup și adaugă prima cheltuială în orice valută ai avut la îndemână."
  button: "Creează un cont gratuit"
problem:
  heading: "Introdu-o așa cum ai plătit-o"
  body: "O excursie e rareori plătită într-o singură valută. Hotelul a fost rezervat acasă în lire, cina s-a plătit în yeni, iar cafeaua din aeroport în ce se folosea la escală. Să convertești totul de mână înainte să poți măcar să-l introduci e felul în care foile de calcul sunt abandonate. În Side Badger introduci fiecare cheltuială în valuta de pe chitanță, iar fiecare sumă respectă regulile valutei ei, așa că yenii nu au zecimale, iar dinarii au trei. Valutele folosite recent apar primele în listă."
workflow:
  heading: "Ține valutele separate sau convertește pe parcurs"
  steps:
    - title: "Adaugă cheltuiala în propria valută"
      body: "Alege valuta, scrie suma, spune cine a plătit și cine a împărțit. Nimic altceva nu e necesar. Aceasta e varianta implicită și păstrează suma inițială exact așa cum ai introdus-o."
      shot: S07
      shotAlt: "Formularul de cheltuială cu o sumă în yeni introdusă"
    - title: "Urmărește un sold pentru fiecare valută"
      body: "Soldurile se țin separat pe valute, iar fiecare primește propria listă scurtă de plăți sugerate. Lirele se achită în lire, iar yenii în yeni."
      shot: S10
      shotAlt: "Ecranul de solduri cu datorii simplificate în două valute"
    - title: "Sau convertește, când grupul preferă să se achite o singură dată"
      body: "Alege altă valută la introducerea cheltuielii, iar Side Badger o poate converti la un curs de schimb actual, pe care îl poți schimba cu cursul pe care l-ai primit de fapt. Suma convertită intră în soldul din acea valută. Conversia este o alegere a grupului, nu ceva ce se întâmplă pe la spatele tău."
options:
  heading: "Un curs pe care îl vezi și îl poți schimba"
  items:
    - title: "Cursul este afișat"
      body: "Când convertești, cursul și suma convertită apar în formular, așa că nimeni nu trebuie să ia o cifră pe încredere."
    - title: "Scrie-l pe al tău"
      body: "Ai primit un curs mai bun la o casă de schimb sau unul mai prost la aeroport? Editează cursul cu cel pe care l-ai primit de fapt, iar suma convertită se actualizează."
    - title: "Originalul rămâne"
      body: "Suma inițială rămâne pe cheltuială, lângă cea convertită, pentru oricine întreabă cât a fost în yeni."
    - title: "Conversia e gratuită"
      body: "Conversia nu costă nimic. Nu există taxă pentru introducerea unei cheltuieli în altă valută."
