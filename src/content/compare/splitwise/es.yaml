faq:
  heading: Preguntas
  items:
    - q: ¿Es Side Badger una alternativa gratuita a Splitwise?
      a: "Para dividir gastos en un grupo, sí. El escaneo de recibos, la conversión de monedas y la ausencia de anuncios son gratis, sin límites diarios. Si necesitas una app nativa, uso sin conexión, gastos recurrentes o pagos dentro de la app, Splitwise los ofrece y Side Badger no."
    - q: ¿De dónde salen los datos de Splitwise?
      a: "De las propias páginas de Splitwise: su página de inicio, su página de Pro y su centro de ayuda. Cada fila de la tabla enlaza con la página de la que salió, y la fecha de encima de la tabla dice cuándo las leímos. Las comprobamos cada trimestre."
    - q: ¿Seguirá siendo gratis Side Badger?
      a: "Todo en Side Badger es gratis hoy y no hay plan de pago. Si eso cambia alguna vez, te avisaremos antes. La [página de precios](page:pricing) tiene los detalles."
    - q: ¿Tiene que cambiarse todo mi grupo?
      a: "Sí. Todo el mundo en un grupo necesita una cuenta gratis de Side Badger, y puede unirse con un enlace o un código QR."
    - q: ¿Tiene Side Badger una app móvil?
      a: "No en una tienda de aplicaciones. Funciona en tu navegador: inicia sesión en el móvil y luego añádelo a tu pantalla de inicio para que se abra como una app. [Cómo funciona](page:how-it-works) lo muestra."
