meta:
  title: Sådan deler du huslejen efter værelsesstørrelse | Side Badger
  description: Større værelse, større andel. Sæt de fælles rum til side, del resten efter gulvareal, og indtast procenterne én gang. Regnestykker for tre bofæller.
h1: Sådan deler du huslejen efter værelsesstørrelse
navLabel: Husleje efter værelse
lead: Beslut, hvor meget af huslejen der går til de fælles rum, og del den del ligeligt. Del så resten efter hvert soveværelses gulvareal. Rund af til hele procenter, indtast dem én gang på huslejen i Side Badger, og kopiér udgiften hver måned.
cta:
  heading: Få huslejen ind på én gang
  body: Opret en gratis konto, start en gruppe til lejligheden, og indtast huslejen med de procenter, I blev enige om. Næste måned er en kopi. Vil du have rundvisningen først? Se [sådan virker det](page:how-it-works), eller tjek [hvad gratis dækker](page:pricing).
sections:
  - heading: Tre personer, én lejlighed, én diskussion
    body: Priya, Tom og Aisha deler en lejlighed til 1.950 £ om måneden. I et år delte de huslejen i tre lige store dele, fordi det var nemt. Så målte Aisha sit værelse. Priyas værelse er 16 m², Toms er 12 m², og Aishas er 10 m², så Aisha betalte det samme som Priya for et værelse, der var mere end en tredjedel mindre. Ingen havde været urimelige. Ingen havde regnet efter. Over noget takeaway blev de først enige om én regel. Af huslejen går 40 % til køkken, bad og stue, som alle tre bruger.
  - heading: Metoden, med regnestykkerne vist
    body: Fire trin, ét målebånd og en lommeregner på telefonen.
    items:
      - "**Sæt den fælles del til side.** Gruppen aftaler, hvor stor en andel af huslejen der går til de rum, alle bruger. For lejligheden er det 40 %, hvilket er 13,33 % til hver blandt tre personer."
      - "**Del resten efter gulvareal.** De øvrige 60 % fordeles efter værelsesstørrelse. Soveværelserne er tilsammen 38 m² (16 + 12 + 10), så Priyas del er 60 % × 16/38, hvilket er 25,26 %."
      - "**Læg de to dele sammen.** Priya: 25,26 % + 13,33 % = 38,6 %. Tom: 60 % × 12/38 = 18,95 %, plus 13,33 % giver 32,3 %. Aisha: 60 % × 10/38 = 15,79 %, plus 13,33 % giver 29,1 %."
      - "**Rund af, og tjek.** Hele procenter er nemmere at indtaste og at skændes om, så 38,6 % bliver til 39 %, 32,3 % bliver til 32 %, og 29,1 % bliver til 29 %. Tjek, at 39 + 32 + 29 giver 100. Lander afrundingen på 99 eller 101, aftaler gruppen, hvis tal der flyttes ét point."
  - heading: Sådan ser lejlighedens måned ud
    body: Huslejen fordelt med 39 %, 32 % og 29 % giver 760,50 £, 624,00 £ og 565,50 £. Priya betalte udlejeren, så over måneden har hun 1.142,50 £ til gode, mens Tom skylder 566,00 £, og Aisha skylder 576,50 £. Side Badger foreslår to betalinger, begge til Priya.
  - heading: Sådan sætter du det op i Side Badger
    body: Én aften, hvoraf det meste går med at diskutere de 40 %.
    items:
      - "**Opret gruppen.** Vælg **Opret gruppe** på dashboardet, og navngiv den efter lejligheden. Vælg **Inviter andre**, og send linket eller QR-koden. Alle logger ind eller opretter en gratis konto og vælger det navn, de vil vises under i gruppen."
      - "**Tilføj huslejen.** Vælg **Tilføj udgift**. Indtast beskrivelse og beløb, og vælg den, der betalte udlejeren, under **Hvem betalte?** Lad alle tre blive under **Fordel mellem**, vælg så **Procent** under **Hvordan skal det fordeles**, og skriv 39, 32 og 29. Formularen markerer det, hvis procenterne ikke giver 100 i alt. Vælg **Gem udgift**."
      - "**Tilføj regningerne.** Energi og bredbånd er hver sin udgift med hver sin betaler. Lad **Hvordan skal det fordeles** stå på **Ligeligt**."
      - "**Kopiér den næste måned.** Åbn sidste måneds husleje, og vælg **Kopier udgift**. Kopien beholder betaleren, beløbet og delingen og får dagens dato. Ret beløbet, hvis huslejen er ændret, og vælg så **Opret kopi**."
      - "**Tjek, hvem der skylder hvem.** Det viser afsnittet **Saldi**. Betal hinanden, som I vil, og registrer så betalingen under **Afregn**."
  - heading: Eget bad, pulterkamre og folk, der flytter
    items:
      - "**Eget bad og pulterkamre.** Gulvareal er et udgangspunkt. Et værelse med eget badeværelse er mere værd end det samme areal uden, og et pulterkammer, der kan rumme en seng og en håbefuld stol, er mindre værd. Justér procenterne efter aftale, tjek, at de stadig giver 100 i alt, og skriv de endelige tal ned, hvor hele lejligheden kan se dem."
      - "**Nogen flytter ud midt på måneden.** Regn ud, hvad hver person skylder for den måned, og indtast den måneds husleje med **Præcise beløb** i stedet for **Procent**. Beløbene skal give huslejen. Gør det, før vedkommende flytter. Ingen kan forlade en gruppe, mens de skylder eller er til gode, og en udgift, der involverer en person, som har forladt gruppen, bliver skrivebeskyttet."
      - "**Nogen flytter ind.** Mål igen, regn efter med de nye værelsesstørrelser, og brug de nye procenter fra næste husleje. Tidligere måneder forbliver, som de var."
  - heading: Hvad Side Badger ikke gør her
    items:
      - Den måler ikke dine værelser og vælger ikke procenterne. Gulvarealerne og de 40 % er noget, gruppen skal blive enig om.
      - Den har ingen tilbagevendende regninger, så du kopierer sidste måneds husleje hver gang.
      - Den flytter aldrig penge og betaler ikke udlejeren. I betaler hinanden, som I vil, og registrerer det.
      - Den ved ikke, hvad jeres lejekontrakt siger. Den holder regnskabet mellem personerne i gruppen.
