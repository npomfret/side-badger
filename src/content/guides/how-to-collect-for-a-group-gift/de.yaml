      payer: omar
      amount: 12
      split:
        method: equal
faq:
  heading: "Fragen"
  items:
    - q: "Was, wenn wir mehr sammeln, als das Geschenk kostet?"
      a: "Die genauen Beträge müssen zusammen den Preis ergeben, kürzt die Anteile also, bis es passt. Oder steckt den Überschuss in etwas Echtes, etwa Blumen, und tragt das als zweite Ausgabe ein, wie Grußkarte und Geschenkpapier im Beispiel."
    - q: "Kann jemand etwas beitragen, ohne der Gruppe beizutreten?"
      a: "Nicht, wenn die Person in der Zählung auftauchen soll. Alle in der Aufteilung brauchen ein kostenloses Konto und einen Platz in der Gruppe. Bei jemandem, der nur Bargeld hat, könnte Priya es nehmen und das Geschenk nur in der Höhe eintragen, die die Gruppe noch schuldet. Gibt Sam ihr zum Beispiel 40 £ bar, trägt sie 200 £ ein und teilt sie 60, 60 und 80 auf sich, Omar und Lena auf."
    - q: "Kann die Umfrage entscheiden, wie viel jede Person beiträgt?"
      a: "Nein. Eine Umfrage einigt die Gruppe auf eine Zahl für alle, etwa das Budget. Der Anteil jeder Person ist etwas, worauf ihr euch untereinander einigt, und dann tippst du ihn als **Genaue Beträge** in die Ausgabe ein."
