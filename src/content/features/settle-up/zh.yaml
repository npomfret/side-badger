sections:
  - heading: 记录一笔付款
    body: 有人付款时，把它记在正确的人名下。快速结算按钮会根据你得到的建议付款填好金额，你还可以添加备注，比如“银行转账”（最多 500 个字符）。只付了所欠的一部分，剩下的仍留在余额上。如果输入的金额过少或过多，Side Badger 会在保存前提醒你。记录付款需要编辑支出的权限，日期也不能在未来。
  - heading: 用另一种货币付款？
    body: 余额保持付款时所用的货币，所以欧元的债务仍是欧元的债务。欠的是欧元，付的是英镑？没问题。录入付款时也可以换算，按当前汇率或你实际换到的汇率。汇率在保存付款时固定下来。[多种货币](page:feature/multiple-currencies)介绍换算的工作方式，[团体旅行](page:use-case/group-trips)展示了实际用法。
  - heading: 可以查证的历史
    body: 每笔已记录的付款都会连同日期、金额和备注留在群组历史中。只有记录这笔付款的人可以编辑，他们或群组管理员可以删除。涉及已退出群组之人的付款会被锁定。想看一个完整的室友场景，请看[室友](page:use-case/housemates)。
limits:
  heading: Side Badger 不做什么
  items:
    - Side Badger 不转移资金，不发送付款链接，也不发送付款请求。应用里的一笔付款，只是对在别处完成的付款的记录。
    - 建议的付款来自一种简单的匹配方法，按货币分别应用。它给出的付款笔数总是少于在该货币中有余额的人数（四个人，最多三笔付款），但并不总能找到最少的笔数。
    - 你不能关闭这些建议。**显示全部**列出群组里每一笔建议的付款，而不只是你的。
    - 除非支出在录入时做了换算，否则不同货币之间永远不会互相抵消。
    - 没有提醒功能，所以追着别人付款仍然得靠你自己。
useCasesHeading: 结算很重要的场合
faq:
  heading: 常见问题
  items:
    - q: Side Badger 会转钱吗？
      a: 不会。你们想怎么付就怎么付，然后在 Side Badger 里记录这笔付款，余额随之更新。
    - q: 能关闭建议的付款吗？
      a: 不能。简化始终开启，**显示全部**会列出群组里每一笔建议的付款，而不只是与你相关的。
    - q: 为什么欧元和英镑分开记？
      a: 余额保持你付款时所用的货币，除非你在录入支出或付款时做了换算。不同货币的债务永远不会互相抵消。
    - q: 如果有人只付了所欠的一部分呢？
      a: 记录他们付的那部分。剩下的会留在余额上，直到付清。
    - q: 这一定是最少的付款笔数吗？
      a: 不保证。它给出的付款笔数总是少于在该货币中有余额的人数，所以四个人时最多建议三笔。在室友示例中是两笔付款，而直接逐个还款需要六笔。
