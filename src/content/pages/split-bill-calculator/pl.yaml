meta:
  title: "Kalkulator podziału rachunków: kto komu wisi | Side Badger"
  description: "Kto zapłacił, kto wisi, kto komu płaci: policzone w kilka sekund. Po równo, dokładnie lub procentowo. Za darmo, w przeglądarce, bez zapisywania i wysyłania."
h1: "Kalkulator podziału rachunków"
navLabel: "Kalkulator podziału rachunków"
lead: "Wpisz, kto za co zapłacił, a kalkulator pokaże, kto komu jest winien, razem z krótką listą płatności, które to rozliczają. Działa w przeglądarce, niczego nie zapisuje i nie przesyła pieniędzy. Jeśli twoja grupa potrzebuje rachunku, który przetrwa zamknięcie karty, [dzielenie wydatków](page:feature/split-expenses) i [rozliczanie](page:feature/settle-up) w Side Badger robią te same obliczenia i je zachowują."
cta:
  heading: "Podobają ci się obliczenia? Zachowaj je."
  body: "Ten kalkulator zapomina wszystko po zamknięciu karty, zupełnie jak ten, kto na pewno płacił ostatnim razem. Grupa w Side Badger przechowuje wydatki, aktualizuje saldo każdego i rejestruje płatności. Jest za darmo, bez reklam i bez dziennych limitów."
sections:
  - heading: "Jak działa obliczenie"
    body: "Dla każdego wydatku kalkulator liczy udział każdej osoby. Możesz podzielić wydatek po równo, według dokładnych kwot albo procentowo między wybrane osoby. Saldo każdej osoby to potem to, co zapłaciła, minus to, co jest winna. Plus oznacza, że grupa jest jej winna pieniądze, a minus, że to ona jest winna grupie. Salda zawsze dają w sumie zero, bo ile jedna osoba ma do odzyskania, tyle winni są jej inni."
  - heading: "Dlaczego lista płatności jest krótka"
    body: "Nikt nie musi rozliczać każdego paragonu osobno. Gdy znane jest każde saldo, kalkulator łączy osobę, która jest winna najwięcej, z osobą, której należy się najwięcej, rozlicza tyle, ile zmieści się w jednej płatności, i idzie dalej w dół listy, aż wszyscy są na zerze. Liczba płatności nigdy nie przekracza liczby osób z saldem pomniejszonej o jeden, a często jest mniejsza niż przy rozliczaniu rachunek po rachunku. Kalkulator daje krótką listę płatności i nie obiecuje, że jest to najkrótsza możliwa."
  - heading: "Czego kalkulator nie robi"
    items:
      - "**Nie obsługuje kilku walut.** Wybierz jedną i używaj jej w całym obliczeniu. Aplikacja prowadzi osobne saldo dla każdej waluty i może przeliczyć wydatek po aktualnym kursie, który możesz zmienić."
      - "**Niczego nie zapisuje.** Zamknij kartę, a liczby znikną. Żeby je zachować, skopiuj link. Zawiera twoje liczby po znaku #, a tej części przeglądarka nigdy nie wysyła na serwer. Każdy, komu wyślesz link, może je przeczytać."
      - "**Nie przesyła pieniędzy.** Mówi, kto komu powinien zapłacić. Płacicie sobie, jak chcecie, a potem rejestrujesz płatność w aplikacji, jeśli twoja grupa tam prowadzi rachunek."
      - "**Nie losuje, kto dostaje ostatni grosz.** Gdy rachunek nie dzieli się równo, pozostałe grosze trafiają do pierwszych osób na liście, więc sumy nadal się zgadzają. W aplikacji ostatni grosz trafia do jednej osoby losowo, więc nie zawsze do tej samej."
      - "**Nie wychodzi poza limity.** Kalkulator przyjmuje od 2 do 20 osób, a jeden wydatek może wynosić do 999 999,99, tak jak w aplikacji."
