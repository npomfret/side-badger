featuresHeading: "Yang diandalkan sebuah perjalanan"
faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah orang yang melewatkan makan malam dikeluarkan?"
      a: "Ya. Pilih siapa yang ikut dalam tiap pengeluaran dan hanya mereka yang ditagih."
    - q: "Apakah berfungsi tanpa sinyal?"
      a: "Tidak. Side Badger memerlukan koneksi, jadi tambahkan biayanya setelah Anda kembali terhubung wifi."
    - q: "Apakah semua orang perlu memasang sesuatu?"
      a: "Tidak. Berjalan di peramban. Kirim tautan undangan dan orang bergabung dari ponsel mereka."
    - q: "Kurs apa yang dipakai?"
      a: "Kurs terkini saat Anda memasukkan pengeluaran, atau kurs Anda sendiri jika mendapat yang berbeda. Kurs ditetapkan saat pengeluaran disimpan, jadi pengeluaran lama tidak pernah dinilai ulang."
    - q: "Bisakah kami membekukan grup setelah perjalanan?"
      a: "Ya. Admin bisa mengunci grup agar angkanya tetap."
    - q: "Apakah ada batas jumlah?"
      a: "Ya. 999,999.99 per pengeluaran, dalam mata uangnya sendiri."
