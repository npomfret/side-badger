sections:
  - heading: "Obrolan uang, di samping uangnya"
    body: "Uang bersama selalu datang dengan obrolan, keraguan, dan rencana. Side Badger menyimpan ketiganya di samping angkanya, jadi tak ada yang perlu menggulir mundur obrolan grup."
    items:
      - "**Komentar di tempat yang pas.** Beri komentar di grup itu sendiri, atau di pengeluaran, daftar, atau jajak pendapat mana pun, dan simpan obrolannya di samping hal yang dibicarakan."
      - "**Struk dan foto.** Simpan hingga tiga struk di setiap pengeluaran, dan tambahkan foto atau PDF ke komentar di grup, daftar, atau jajak pendapat."
      - "**Pertanyaan, bukan pertengkaran.** Admin bisa mengaktifkan pertanyaan, lalu siapa pun di sebuah pengeluaran bisa menanyakannya (\"Saya punya pertanyaan\"). Pengeluaran itu tidak masuk hitungan saldo sampai urusannya beres."
      - "**Daftar dan jajak pendapat.** Taruh daftar belanja bersama di samping tagihan belanjanya, dan putuskan daftar pendek vila lewat pemungutan suara, secara anonim kalau mau."
      - "**Sedikit tepuk tangan.** Beri reaksi pada pengeluaran, pembayaran, dan komentar, dan rayakan pembayaran begitu masuk."
  - heading: Grup Anda, aturan Anda
    body: "Pusat bantuan Splitwise menyebut tidak mendukung admin grup atau izin khusus. Side Badger punya peran dan izin, untuk grup yang butuh seseorang yang menjaga angka tetap rapi."
    items:
      - "**Administrator, anggota, dan pengamat.** Jadikan seseorang pengamat: ia melihat semuanya dan tidak mengubah apa pun."
      - "**Dua preset, atau buat sendiri.** Mulai dengan Kolaborasi terbuka atau Grup terkelola, atau atur sendiri tiap izin: siapa yang mengedit dan menghapus pengeluaran, mengedit daftar, mengundang, dan menerima orang baru."
      - "**Persetujuan untuk bergabung.** Aktifkan persetujuan dan seorang administrator menerima tiap orang."
      - "**Pengaturan grup itu sendiri.** Batasi ke mata uang yang benar-benar dipakai, pilih mata uang bawaannya, dan beri gambar header."
      - "**Kunci kalau sudah selesai.** Angkanya tetap di tempat sampai administrator membuka kuncinya."
  - heading: Gratis di sini, berbayar di sana
    body: Splitwise Pro adalah paket berbayar Splitwise, dan halaman Pro miliknya sendiri menjual tiga hal yang gratis di Side Badger.
    items:
      - "**Pemindaian struk.** Splitwise Pro memindai foto struk Anda. Side Badger melakukannya gratis, tanpa kredit pindai: mengisi total, tanggal, dan tempat untuk Anda periksa."
      - "**Konversi mata uang.** Splitwise Pro mengonversi pengeluaran grup ke mata uang bawaan Anda saat Anda mengetuk Convert. Side Badger mengonversi tiap pengeluaran saat Anda memasukkannya, dengan kurs terkini atau kurs yang benar-benar Anda dapatkan, dan jumlah aslinya tetap ada di pengeluaran itu."
      - "**Tanpa batas harian.** Splitwise Pro menjual pengeluaran tanpa batas, dan pusat bantuannya menyebut pengguna gratis bisa menambahkan hingga 4 pengeluaran per hari. Side Badger tidak punya batas harian."
  - heading: Bank Anda tidak ikut campur
    body: "Side Badger tidak terhubung ke bank Anda dan tidak meminta detail bank Anda. Ia mencatat siapa berutang kepada siapa; Anda saling membayar dengan cara apa pun yang disuka, lalu mencatat pembayarannya. Tak ada login bank yang perlu diserahkan, jadi satu hal lagi yang tak perlu dijaga."
  - heading: Satu aplikasi, di peramban dan di ponsel Anda
    body: "Side Badger berjalan di peramban Anda. Masuk, tambahkan ke layar utama, dan ia terbuka seperti aplikasi. Aplikasinya sama di mana pun, jadi fitur baru sudah ada di ponsel Anda saat Anda membuka aplikasi berikutnya, tanpa menunggu pembaruan toko aplikasi."
  - heading: "Dan beberapa trik seru"
    items:
      - "**Tanya asisten Anda.** Side Badger bisa dipakai dengan ChatGPT dan Claude: minta asisten Anda menambahkan pengeluaran, memindai struk, atau mencatat pembayaran."
      - "**Semua orang dengan bahasanya sendiri.** Side Badger berbicara dalam 39 bahasa dan setiap orang memilih bahasanya sendiri. Halaman beranda Splitwise menyebut 7+. Ia juga menangani 133 mata uang, untuk liburan yang menjelajah ke mana-mana."
      - "**Bantuan tanpa keluar dari aplikasi.** Bingung, atau menemukan bug? Beri tahu kami dari aplikasi dan baca balasan kami langsung di sana."
  - heading: Di mana Splitwise masih menang
    body: Kami lebih suka Anda memilih aplikasi yang tepat daripada baru tahu belakangan. Jika grup Anda memerlukan salah satu dari ini, Splitwise punya dan Side Badger tidak.
    items:
      - "**Aplikasi toko aplikasi.** Side Badger hidup di peramban dan layar utama Anda, bukan di toko aplikasi."
      - "**Mode offline.** Side Badger memerlukan koneksi."
      - "**Pembayaran di dalam aplikasi.** Di beberapa negara, Splitwise juga bisa memindahkan uangnya. Side Badger hanya menyimpan catatannya."
      - "**Membagi menurut bagian atau per item.** Side Badger punya satu pembayar per pengeluaran, dibagi rata, menurut jumlah pasti, atau persentase. Pemindaian struknya tidak menetapkan item ke orang tertentu."
      - "**Grafik dan pembagian bawaan.** Splitwise Pro punya keduanya. Side Badger menyimpan hitungan siapa berutang kepada siapa, dan hanya itu triknya."
  - heading: Memindahkan grup Anda
    body: Tidak ada fitur impor, jadi pindah berarti memulai dari awal. Lunasi dulu di Splitwise, lalu buat grup di Side Badger dan undang semua orang dengan tautan atau kode QR. Setiap orang di grup perlu akun gratis, dan untuk mendaftar hanya perlu alamat email.
