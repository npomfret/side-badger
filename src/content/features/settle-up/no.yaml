sections:
  - heading: Registrer en betaling
    body: Når noen betaler, registrerer du den mot riktig person. Hurtigoppgjørsknappene fyller inn beløpet fra de foreslåtte betalingene dine, og du kan legge til et notat som «bankoverføring» (opptil 500 tegn). Betaler du bare en del av det du skylder, blir resten stående på saldoen. Hvis du legger inn for lite eller for mye, advarer Side Badger deg før du lagrer. For å registrere en betaling trenger du tillatelse til å redigere utgifter, og datoen kan ikke ligge i fremtiden.
  - heading: Betalt i en annen valuta?
    body: Saldoer forblir i valutaen de ble betalt i, så en gjeld i euro forblir en gjeld i euro. Skylder du euro og betaler i pund? Konverter betalingen når du legger den inn, med en gjeldende valutakurs eller med kursen du faktisk fikk. Kursen låses når betalingen lagres. [Flere valutaer](page:feature/multiple-currencies) forklarer hvordan konvertering fungerer, og [gruppereiser](page:use-case/group-trips) viser det i bruk.
  - heading: Historikk du kan sjekke
    body: Hver registrerte betaling blir stående i gruppehistorikken med dato, beløp og notat. Bare den som registrerte en betaling, kan redigere den, og vedkommende eller en gruppeadministrator kan slette den. En betaling som involverer noen som har forlatt gruppen, er låst. For et gjennomgått romkameratscenario, se [romkamerater](page:use-case/housemates).
limits:
  heading: Hva Side Badger ikke gjør
  items:
    - Side Badger flytter ikke penger, sender ikke betalingslenker og sender ikke betalingsforespørsler. En betaling i appen er en registrering av en betaling som ble gjort et annet sted.
    - De foreslåtte betalingene kommer fra en enkel matchingsmetode, brukt per valuta. Den foreslår alltid færre betalinger enn det er personer med saldo i den valutaen (fire personer, høyst tre betalinger), men den finner ikke alltid det minst mulige antallet.
    - Du kan ikke slå av forslagene. **Vis alle** lister alle foreslåtte betalinger i gruppen, ikke bare dine.
    - Valutaer utlignes aldri mot hverandre med mindre utgiftene ble konvertert da de ble lagt inn.
    - Det finnes ingen påminnelser, så det er fortsatt opp til deg å purre på en betaling.
useCasesHeading: Hvor oppgjør er viktig
faq:
  heading: Spørsmål
  items:
    - q: Sender Side Badger pengene?
      a: Nei. Betal hverandre slik dere vil, og registrer så betalingen i Side Badger slik at saldoen oppdateres.
    - q: Kan jeg slå av de foreslåtte betalingene?
      a: Nei. Forenkling er alltid på, og **Vis alle** lister alle foreslåtte betalinger i gruppen, ikke bare dem som angår deg.
    - q: Hvorfor holdes euro og pund adskilt?
      a: Saldoer forblir i valutaen du betalte i, med mindre du konverterer når du legger inn en utgift eller betaling. Gjeld i ulike valutaer utlignes aldri mot hverandre.
    - q: Hva om noen bare betaler en del av det de skylder?
      a: Registrer delen de betalte. Resten blir stående på saldoen til den er betalt.
    - q: Er dette alltid det minst mulige antallet betalinger?
      a: Ikke garantert. Den foreslår alltid færre betalinger enn det er personer med saldo i den valutaen, så for fire personer foreslår den aldri mer enn tre. I romkamerateksemplet er det to betalinger, der det å betale hver enkelt tilbake direkte tok seks.
