faq:
  heading: "Maswali"
  items:
    - q: "Je, ninaweza kuhoji sehemu yangu tu?"
      a: "Hapana. Swali linaondoa gharama nzima, kwa kila aliye ndani yake. Ikiwa mgawanyo tu ndio mbaya, suluhisho ni kuhariri mgawanyo."
    - q: "Nani anaweza kufunga swali?"
      a: "Aliyeuliza, au msimamizi wa kikundi. Kama aliyeongeza gharama si msimamizi, hawezi kulifunga kwa niaba ya aliyeuliza."
    - q: "Je, kuhariri gharama kunafuta ya awali?"
      a: "Hapana. Toleo la awali linahifadhiwa. Nani anaweza kuhariri huamuliwa na ruhusa za kikundi, kwa hivyo ni vyema kuiambia nyumba kwanza, kwa sababu salio linabadilika."
