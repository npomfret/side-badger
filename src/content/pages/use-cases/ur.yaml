meta:
  title: "ساتھ رہنے والوں، سفروں اور پارٹیوں کے لیے Side Badger"
  description: "ساتھ رہنے والوں کے ساتھ، گروپ سفروں میں، اور پارٹیوں، شادیوں اور گروپ تحائف کے لیے اخراجات تقسیم کریں۔ دیکھیں Side Badger ہر طرح کے گروپ کے لیے کیا کرتا ہے۔"
h1: "آپ جیسے گروپ کے لیے Side Badger"
navLabel: "استعمال کے مواقع"
lead: "ساتھ رہنے والے، چھٹیاں، دلہا دلہن کی پارٹیاں۔ اپنا ہنگامہ چنیں، پھر دیکھیں کہ آپ جیسا گروپ حساب کیسے رکھتا ہے۔"
intro: "ہر گروپ اخراجات کو کچھ مختلف انداز میں تقسیم کرتا ہے۔ یہ صفحات ایک **حقیقت پسندانہ منظرنامہ** پہلے خرچے سے آخری ریکارڈ شدہ ادائیگی تک دکھاتے ہیں، حساب کے ساتھ، تاکہ آپ دیکھ سکیں آپ کے اپنے گروپ کا کیا بنے گا۔"
cta:
  heading: "اپنی طرح کا گروپ مل گیا؟"
  body: "اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلا خرچہ شامل کریں۔ اس میں چند منٹ لگتے ہیں۔"
cardsHeading: "اپنی صورتِ حال کے سب سے قریب والی چنیں"
sections:
  - heading: "گروپ سفر"
    body: "پاؤنڈ میں پروازیں، یورو میں ولا اور ایسا ڈنر جو صرف تین لوگوں نے کھایا۔ گروپ کو پاؤنڈ میں تبدیل کرنے پر سیٹ کریں تو لزبن میں چار دوست تین ادائیگیوں پر ختم کرتے ہیں، جبکہ کرنسیاں الگ رکھنے پر چھ ہوتیں۔ [گروپ سفر کے اخراجات تقسیم کریں](page:use-case/group-trips)۔"
  - heading: "ساتھ رہنے والے"
    body: "ایک شخص مالک مکان کو دیتا ہے، دوسرے کو بجلی کا بل یاد رہتا ہے، اور کوئی اس پر متفق نہیں کہ ٹوائلٹ رول کس نے خریدا۔ کرایہ کمرے کے سائز کے حساب سے اور باقی بل برابر تقسیم ہونے پر چار ساتھی مہینہ تین ادائیگیوں پر ختم کرتے ہیں، سب اس کو جس نے کرایہ دیا۔ [ساتھ رہنے والوں کے ساتھ گھریلو بل تقسیم کریں](page:use-case/housemates)۔"
  - heading: "پارٹیاں، شادیاں اور گروپ تحائف"
    body: "چھ لوگ تحفے پر ووٹ دیتے ہیں، ایک اسے خریدتا ہے، اور ہر کوئی ایک جتنا حصہ نہیں ڈالتا۔ عین رقم کے مطابق تقسیم کیے گئے £150 کے تحفے میں خریدنے والے کو پانچ ادائیگیاں ملتی ہیں، کل £120۔ [تقریب کے اخراجات تقسیم کریں](page:use-case/events-and-celebrations)۔"
  - heading: "جوڑے"
    body: "روزمرہ کے بورنگ اخراجات بانٹیں، بغیر اس کے کہ ڈنر ڈیٹ سہ ماہی مالی جائزہ بن جائے۔ 60/40 تقسیم والا کرایہ اور برابر تقسیم والی گروسری آپ دونوں کے درمیان ایک ہی ادائیگی میں سمٹ جاتے ہیں۔"
  - heading: "پہلے دیکھیں یہ کیسے کام کرتا ہے"
    body: "اوپر کی ہر مثال ایک جیسے مراحل استعمال کرتی ہے، گروپ بنانے سے ادائیگیاں ریکارڈ کرنے تک۔ [یہ کیسے کام کرتا ہے](page:how-it-works) انہیں دکھاتا ہے، اور [قیمتیں](page:pricing) بتاتی ہیں کہ اس کی قیمت کیا ہے، یعنی کچھ نہیں، بغیر اشتہارات اور بغیر یومیہ حد کے۔"
faq:
  heading: "سوالات"
  items:
    - q: "کیا گروپ کے ہر فرد کو اکاؤنٹ چاہیے؟"
      a: "جی ہاں۔ لوگ لنک یا QR کوڈ اور مفت اکاؤنٹ سے شامل ہوتے ہیں۔"
    - q: "کیا Side Badger رقم جمع کر سکتا ہے؟"
      a: "نہیں۔ آپ جیسے چاہیں ادا کریں، پھر ادائیگی ریکارڈ کریں تاکہ بیلنس درست رہیں۔"
    - q: "کیا مجھے ایک ہی طرح کا گروپ چننا ضروری ہے؟"
      a: "نہیں۔ استعمال کے مواقع مثالیں ہیں، سیٹنگز نہیں۔ ہر گروپ میں وہی خصوصیات ہیں، اس لیے جو امتزاج مناسب ہو استعمال کریں۔"
