faq:
  heading: "자주 묻는 질문"
  items:
    - q: "내 몫에 대해서만 질문할 수 있나요?"
      a: "아니요. 질문은 지출 전체를 보류하며, 지출에 포함된 모든 사람에게 적용됩니다. 분할만 잘못됐다면 해결 방법은 분할을 수정하는 것입니다."
    - q: "누가 질문을 닫을 수 있나요?"
      a: "질문한 사람이나 그룹 관리자입니다. 지출을 추가한 사람이 관리자가 아니라면, 질문한 사람을 대신해 닫을 수 없어요."
    - q: "지출을 수정하면 원본이 지워지나요?"
      a: "아니요. 이전 버전은 보관됩니다. 누가 편집할 수 있는지는 그룹의 권한이 정하는데, 잔액이 바뀌므로 먼저 집에 알려 두는 게 좋습니다."
