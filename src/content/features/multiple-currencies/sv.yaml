meta:
  title: Dela kostnader i 140 valutor, omräknade eller separata
  description: Lägg in varje utgift i den valuta du betalade i, håll saldona separata eller räkna om med en kurs som du kan se och ändra, och gör sedan upp med en kort lista med betalningar.
h1: Dela kostnader i 140 valutor
navLabel: Flera valutor
lead: Euro, yen och den där taxin i baht. Side Badger tar varje utgift i den valuta du betalade i, håller ordning på saldona och kan räkna om när gruppen hellre gör upp en gång. Det fungerar i 140 valutor och passar naturligt för [gruppresor](page:use-case/group-trips).
cta:
  heading: Ta med dina euro, ta med dina yen
  body: Skapa ett konto, starta en grupp och lägg till den första utgiften i vilken valuta du än råkade ha i handen.
  button: Skapa ett gratiskonto
problem:
  heading: Lägg in den som du betalade den
  body: En resa betalas sällan i en enda valuta. Hotellet bokades hemma i pund, middagen betalades i yen och flygplatskaffet i vad mellanlandningen nu använde. Att räkna om allt för hand innan man ens kan skriva in det är hur kalkylblad överges. I Side Badger lägger du in varje utgift i valutan på kvittot, och varje belopp följer sin valutas regler, så yen har inga decimaler och dinarer har tre. Dina senast använda valutor kommer först i listan.
workflow:
  heading: Håll valutorna separata, eller räkna om allt eftersom
  steps:
    - title: Lägg till utgiften i dess egen valuta
      body: Välj valuta, skriv beloppet, ange vem som betalade och vem som delade på den. Mer behövs inte. Det här är standardläget, och det behåller det ursprungliga beloppet precis som du skrev in det.
      shot: S07
      shotAlt: Utgiftsformuläret med ett belopp i yen ifyllt
    - title: Följ ett saldo för varje valuta
      body: Saldona hålls separata per valuta, och var och en får sin egen korta lista med föreslagna betalningar. Pund görs upp i pund och yen i yen.
      shot: S10
      shotAlt: Saldoskärmen med förenklade skulder i två valutor
    - title: Eller räkna om, när gruppen hellre gör upp en gång
      body: Välj en annan valuta när du lägger in utgiften så kan Side Badger räkna om den med en aktuell växelkurs, som du kan ändra till den kurs du faktiskt fick. Det omräknade beloppet läggs till saldot i den valutan. Omräkning är ett val som gruppen gör, aldrig något som sker bakom ryggen på dig.
options:
  heading: En kurs du kan se och ändra
  items:
    - title: Kursen visas
      body: När du räknar om visas kursen och det omräknade beloppet i formuläret, så ingen behöver lita blint på en siffra.
    - title: Skriv din egen
      body: Fick du en bättre kurs på en växlingskiosk, eller en sämre på en flygplats? Ändra kursen till den du faktiskt fick så uppdateras det omräknade beloppet.
    - title: Originalet finns kvar
      body: Det ursprungliga beloppet finns kvar på utgiften, bredvid det omräknade, för den som undrar vad det var i yen.
    - title: Gratis att räkna om
      body: Omräkning kostar ingenting. Det finns ingen avgift för att lägga in en utgift i en annan valuta.
