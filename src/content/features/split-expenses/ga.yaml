sections:
  - heading: "Na daoine a bhí ann amháin"
    body: "Roinn costas idir gach duine, nó idir na daoine a roinn é amháin. Fág daoine amach ó na costais nach raibh siad páirteach iontu, agus léiríonn na hiarmhéideanna é. Níl aon airgead dlite ag an gcomhchónaitheoir a bhí ar shiúl an tseachtain ar fad as an mbéile beir leat, rud a aithneoidh [comhchónaitheoirí](page:use-case/housemates) mar chothroime bhunúsach."
  - heading: "Na sonraí a shábhálann argóintí níos déanaí"
    items:
      - "Socraigh an **dáta** agus am roghnach. Sábhálann aicearraí cosúil le inniu, inné, ar maidin agus aréir roinnt clóscríobh."
      - "Cuir suas le trí **lipéad** leis chun costais a ghrúpáil, amhail earraí grósaera nó taisteal."
      - "Cuir an **áit** leis. Greamaigh nasc léarscáile agus líonann ainm na háite isteach é féin."
      - "Cuir **nóta** leis don scéal taobh thiar den uimhir, le roinnt formáidithe más gá don scéal é."
      - "Úsáid na **tráchtanna** chun an comhrá a choinneáil in aice leis an gcostas a bhfuil sé faoi, in ionad snáithe comhrá nach dtéann aon duine ar ais tríd."
  - heading: "Cóipeáil, cuir in eagar, agus féach cad a athraigh"
    body: "Cóipeáil cíos na míosa seo caite in ionad é a chlóscríobh arís, ansin athraigh an méid atá difriúil. Má bhí uimhir mícheart, cuir an costas in eagar. Coinnítear an leagan níos luaithe agus taispeántar an eagarthóireacht i ngníomhaíocht an ghrúpa, mar sin ní athraíonn aon duine uimhir go ciúin. Braitheann an méid atá cead ag duine a chur in eagar ar cheadanna an ghrúpa."
  - heading: "Nuair a chuireann rud éigin amhras ort"
    body: "Is féidir le grúpa ceisteanna costais a chur ar siúl. Is féidir le duine ar bith atá san áireamh i gcostas ceist a ardú agus a rá cén fáth, agus fanann an costas as na hiarmhéideanna go dtí go ndúnann an duine a d'fhiafraigh, nó riarthóir, é. Tá sé múchta de réir réamhshocraithe agus cuireann riarthóir ar siúl é don ghrúpa. Oireann sé d'[imeachtaí agus ceiliúradh](page:use-case/events-and-celebrations), áit a n-éiríonn an éarlais nach cuimhin le héinne go tobann ina ábhar do chách."
limits:
  heading: "Teorainneacha"
  items:
    - "Íocann duine amháin as gach costas. Má d'íoc beirt, taifead dhá chostas."
    - "Níl aon roinnt de réir míre ná de réir sciar ann. Go cothrom, suimeanna cruinne agus céatadáin atá ann."
    - "Caithfidh na céatadáin 100 a dhéanamh le chéile."
    - "Is féidir costas a bheith suas le 999,999.99 ina airgeadra féin, leis na háiteanna deachúlacha is gnách don airgeadra sin."
    - "Ní féidir costais a athrá astu féin. Cóipeáil ceann na míosa seo caite ina ionad."
    - "Ní féidir dátaí a bheith sa todhchaí nó níos mó ná 10 mbliana ó shin."
    - "Éiríonn costas ina bhfuil duine a d'fhág an grúpa inléite amháin."
useCasesHeading: "Cá gcabhraíonn roinnt mar seo"
faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir le beirt íoc as costas amháin?"
      a: "Ní in aon chostas amháin. Taifead dhá cheann, ceann do gach duine a d'íoc, agus tagann na hiarmhéideanna amach mar an gcéanna."
    - q: "An féidir liom admháil a roinnt de réir míre?"
      a: "Ní féidir. Is é go cothrom, de réir suimeanna cruinne nó de réir céatadáin a bhíonn i roinnt. I gcás billí le míreanna éagsúla, cuir isteach an méid atá dlite ag gach duine mar shuimeanna cruinne."
    - q: "An féidir liom roinnt réamhshocraithe a shocrú?"
      a: "Ní féidir. Cóipeáil costas níos luaithe chun a roinnt a athúsáid, agus athraigh an méid atá difriúil."
    - q: "An féidir le billí athrá gach mí?"
      a: "Ní féidir. Cóipeáil costas na míosa seo caite ina ionad, rud a thógann cúpla soicind."
    - q: "Cé atá in ann costas a chur in eagar?"
      a: "Cibé duine a gceadaíonn ceadanna an ghrúpa dó é. Taispeántar gach eagarthóireacht i ngníomhaíocht an ghrúpa, mar sin ní bhíonn athruithe ciúin riamh."
    - q: "Cad a tharlaíonn do na hiarmhéideanna ina dhiaidh sin?"
      a: "Nuashonraítear iad de réir mar a thagann costais, agus tiontaíonn [socraigh suas](page:feature/settle-up) iad ina liosta gearr íocaíochtaí. Má tá costas in airgeadra eile, féach [ilairgeadraí](page:feature/multiple-currencies)."
