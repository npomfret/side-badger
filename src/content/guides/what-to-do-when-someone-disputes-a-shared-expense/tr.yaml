faq:
  heading: "Sorular"
  items:
    - q: "Yalnızca kendi payımı sorgulayabilir miyim?"
      a: "Hayır. Bir soru, içindeki herkes için harcamanın tamamını dışarıda tutar. Yalnızca bölüşüm yanlışsa çözüm bölüşümü düzenlemektir."
    - q: "Bir soruyu kim kapatabilir?"
      a: "Soruyu soran kişi ya da bir grup yöneticisi. Harcamayı ekleyen kişi yönetici değilse, soruyu soranın yerine kapatamaz."
    - q: "Bir harcamayı düzenlemek aslını siler mi?"
      a: "Hayır. Önceki sürüm saklanır. Kimin düzenleyebileceğine grubun izinleri karar verir; bakiyeler değişeceği için önce eve haber vermekte fayda var."
