example:
  heading: A month in the flat
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: tom
      name: Tom
    - id: aisha
      name: Aisha
  expenses:
    - label: the rent
      payer: priya
      amount: 1950
      split:
        method: percent
        shares:
          priya: 39
          tom: 32
          aisha: 29
    - label: the energy bill
      payer: tom
      amount: 105
      split:
        method: equal
    - label: the broadband
      payer: aisha
      amount: 36
      split:
        method: equal
faq:
  heading: Questions
  items:
    - q: What if someone has a bigger room but less light?
      a: Floor area is only the starting point, so the group can agree to adjust. Take a point or two off the dark room, give them to the others and check the percentages still total 100. Side Badger stores whatever you agree and doesn't judge it.
    - q: Should bills be split by room size too?
      a: Usually not. Energy and broadband are used by everyone, so an equal split is simpler, as in the example above. If one housemate is home all day, the group can agree something else, such as exact amounts. [Split expenses](page:feature/split-expenses) covers the options.
    - q: Can we change the split later?
      a: Yes, for new expenses. Change the percentages when you copy the rent and earlier months stay as they were. To correct a past expense, edit it if the group's permissions allow, and tell the house first, because the balances change. The earlier version is kept.
