meta:
  title: "Side Badger چه می‌کند و چه نمی‌کند"
  description: "تقسیم، تسویه حساب و چند ارز، به‌علاوه گروه‌ها، فهرست‌ها و نظرسنجی‌ها. مجموعه کامل، و فهرستی صادقانه از آنچه Side Badger کنار گذاشته است."
h1: "Side Badger چه می‌کند"
navLabel: "امکانات"
lead: "همه آنچه توی جعبه است، و آنچه نیست."
intro: "این مجموعه کامل است. صفحه‌گسترده را عمداً کنار گذاشتیم. یکی از امکانات زیر را برای نسخه کامل انتخاب کنید، یا بقیه فهرست و فهرست کوتاه کارهایی را که Side Badger نمی‌کند مرور کنید."
cta:
  heading: "آیا کاری را که گروه شما لازم دارد انجام می‌دهد؟"
  body: "یک حساب رایگان بسازید و اول با یک گروه کوچک امتحانش کنید."
cardsHeading: "هر امکان، با جزئیات"
sections:
  - heading: "اسکن رسید"
    body: "از رسید عکس بگیرید تا Side Badger جمع کل، تاریخ و مکان را برای بررسی شما پر کند. تصاویر رسید توسط سرویس هوش مصنوعی Google خوانده می‌شوند. [اسکن رسید چطور کار می‌کند](page:feature/receipt-scanning)."
  - heading: "گروه‌ها و مجوزها"
    body: "برای هر خانه، سفر یا مراسم یک گروه بسازید، با حداکثر 50 نفر. افراد را با لینک یا کد QR دعوت کنید. در گروهی بزرگ‌تر، یک نفر را بیننده کنید که همه‌چیز را می‌بیند و چیزی را تغییر نمی‌دهد. [گروه‌ها و مجوزها](page:feature/groups-and-permissions) جزئیات ریز را دارد."
  - heading: "فهرست‌ها و نظرسنجی‌ها"
    body: "فهرست خرید مشترک را کنار صورت‌حساب‌های خرید نگه دارید. فهرست ویلاها را به رأی بگذارید، اگر خواستید ناشناس. [برنامه‌ریزی با هم](page:feature/plan-together) نظرها، پرسش‌ها، فهرست‌ها و نظرسنجی‌ها را پوشش می‌دهد."
  - heading: "بقیه چیزها"
    items:
      - "**به‌روزرسانی‌های زنده:** یک هزینه اضافه کنید و همه بلافاصله می‌بینند."
      - "**زبان‌ها:** از Side Badger به 39 زبان استفاده کنید. هر عضو گروه می‌تواند زبان خودش را انتخاب کند."
      - "**صفحه اصلی:** به فروشگاه برنامه نیازی نیست. وارد شوید و بعد Side Badger را به صفحه اصلی اضافه کنید تا مثل یک برنامه باز شود. تنظیمات داخل برنامه روش کار را نشان می‌دهد. [بیشتر درباره برنامه وب](page:feature/web-app)."
      - "**اعلان‌ها:** اعلان‌های فوری را در تنظیمات روشن کنید تا وقتی در گروه‌هایتان فعالیت جدیدی هست اعلان بگیرید. در iPhone و iPad، اول Side Badger را به صفحه اصلی اضافه کنید."
      - "**بازخورد:** اشکالی پیدا کردید؟ از داخل برنامه به ما بگویید و پاسخ ما را همان‌جا ببینید."
  - heading: "کارهایی که Side Badger نمی‌کند"
    items:
      - "**جابه‌جایی پول.** Side Badger هرگز به پول شما دست نمی‌زند. هر طور دوست دارید به هم پرداخت کنید. درخواست پرداخت برنامه‌ریزی شده است."
      - "**تکرار صورت‌حساب.** هزینه تکراری وجود ندارد. صورت‌حساب ماه قبل را با دو ضربه کپی کنید."
      - "**تقسیم بر اساس قلم.** برای هر هزینه یک پرداخت‌کننده. مساوی، با مبلغ دقیق یا با درصد تقسیم کنید."
      - "**عرضه برنامه بومی.** در مرورگر شما کار می‌کند. وارد شوید و بعد آن را به صفحه اصلی اضافه کنید."
      - "**کار آفلاین.** به اتصال نیاز دارد."
      - "**ارسال هشدار با ایمیل یا پیامک.** فعالیت جدید در برنامه نشان داده می‌شود و اگر اعلان‌های فوری را روشن کنید، به‌صورت اعلان هم می‌رسد."
      - "**رسم نمودار یا بودجه.** حساب اینکه چه کسی به چه کسی بدهکار است را نگه می‌دارد، و همه ترفند همین است."
      - "**ورود با Google یا Apple.** با ایمیل ثبت‌نام کنید. ورود با Google و Apple برنامه‌ریزی شده است."
      - "**راه دادن افراد بدون حساب.** هر عضو گروه به یک حساب رایگان نیاز دارد."
faq:
  heading: "پرسش‌ها"
  items:
    - q: "می‌توانم از طریق Side Badger پرداخت کنم؟"
      a: "نه. Side Badger حساب را نگه می‌دارد و هرگز به پول شما دست نمی‌زند. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را ثبت کنید."
    - q: "برنامه موبایل دارد؟"
      a: "در فروشگاه برنامه نه. Side Badger در مرورگر شما اجرا می‌شود. روی گوشی وارد شوید و بعد آن را به صفحه اصلی اضافه کنید تا مثل یک برنامه باز شود. تنظیمات داخل برنامه روش کار را نشان می‌دهد."
    - q: "می‌توانم بر اساس قلم تقسیم کنم؟"
      a: "نه. هر هزینه یک پرداخت‌کننده دارد و مساوی، با مبلغ دقیق یا با درصد تقسیمش می‌کنید."
    - q: "آفلاین کار می‌کند؟"
      a: "نه، به اتصال نیاز دارد."
    - q: "آیا همه اعضای گروه به حساب نیاز دارند؟"
      a: "بله. هر عضو گروه به یک حساب رایگان نیاز دارد و برای ثبت‌نام فقط یک نشانی ایمیل لازم است."
