faq:
  heading: "Cwestiynau"
  items:
    - q: "Alla i godi cwestiwn am fy nghyfran i yn unig?"
      a: "Na. Mae cwestiwn yn dal y gost gyfan yn ôl, i bawb sydd ynddi. Os mai dim ond y rhaniad sy'n anghywir, y cywiriad yw golygu'r rhaniad."
    - q: "Pwy all gau cwestiwn?"
      a: "Y person a ofynnodd, neu weinyddwr y grŵp. Os nad yw'r person a ychwanegodd y gost yn weinyddwr, ni all ei gau ar ran yr holwr."
    - q: "Ydy golygu cost yn dileu'r gwreiddiol?"
      a: "Nac ydy. Cedwir y fersiwn gynharach. Caniatâd y grŵp sy'n penderfynu pwy all olygu, felly mae'n werth dweud wrth y tŷ yn gyntaf, oherwydd bod y balansau'n newid."
