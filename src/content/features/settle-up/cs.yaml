meta:
  title: "Vyrovnejte se menším počtem plateb | Side Badger"
  description: "Podívejte se, kdo ve vaší skupině komu dluží, získejte krátký seznam plateb, který vyrovná všechny, a zaznamenávejte každou platbu, jak se stane. Zdarma."
h1: "Vyrovnejte se menším počtem plateb"
navLabel: "Vyrovnání"
lead: "Side Badger vede průběžný zůstatek každého ve skupině a navrhuje krátký seznam plateb, který ho vyrovná. Platíte si, jak chcete, a pak to zaznamenáte. Pokud chcete nejdřív vidět, jak se částky dělí, začněte [dělením výdajů](page:feature/split-expenses)."
cta:
  heading: "Připraveni rozplést, kdo komu dluží?"
  body: "Vytvořte účet, založte skupinu a přidejte první výdaj. Zůstatky se postarají o zbytek."
  button: "Vytvořit účet zdarma"
problem:
  heading: "Zůstatky, které se aktualizují průběžně"
  body: "Každý výdaj mění to, kdo komu dluží, takže Side Badger udržuje zůstatky aktuální, jak přibývají výdaje a platby. Všichni ve skupině změnu hned vidí, stejně jako to, co se změnilo a kdo to změnil. Zůstatky se vedou podle měn, takže eura a libry zůstávají ve svých sloupcích, pokud nebyl výdaj při zadání převeden. Ve výchozím stavu vidíte dluhy, které se týkají vás; **Zobrazit vše** vypíše celou skupinu."
workflow:
  heading: "Tři kroky ke kvitu"
  steps:
    - title: "Podívejte se, kdo komu dluží"
      body: "Otevřete zůstatky skupiny a uvidíte, co dlužíte, co se dluží vám a krátký seznam plateb, který vyrovná všechny, spočítaný zvlášť pro každou měnu. Zpochybněné výdaje zůstávají mimo součty, dokud se nevyřeší. V příkladu se spolubydlícími níže se šest plateb změní na dvě."
      shot: S10
      shotAlt: "Obrazovka zůstatků se zjednodušenými dluhy ve dvou měnách a zapnutou volbou Zobrazit vše"
    - title: "Zaplaťte, jak chcete, a zaznamenejte to"
      body: "Bankovní převod, hotovost, laskavost z minulé dovolené. Side Badger peníze nepřesouvá. Jakmile peníze změní majitele, platbu zaznamenejte a zůstatek se aktualizuje pro všechny."
      shot: S11
      shotAlt: "Formulář platby s tlačítky rychlého vyrovnání a upozorněním zobrazeným při částečné platbě"
    - title: "Ověřte, že platba dorazila"
      body: "Platba se zapíše do historie skupiny, kde ji uvidí každý ve skupině a může na ni reagovat emoji. Oslavte platbu, jakmile dorazí."
      shot: S12
      shotAlt: "Historie plateb s emoji reakcemi u platby"
