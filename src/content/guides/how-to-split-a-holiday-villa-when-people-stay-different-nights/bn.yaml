meta:
  title: "আলাদা আলাদা রাত থাকলে ভিলার খরচ ভাগ | Side Badger"
  description: "Dev তো মাত্র তিন রাত ছিল, তাহলে ছয় রাতের টাকা কেন দেবে? ছুটির ভিলা ভাগ করুন যে যত রাত ছিল সেই হিসাবে, অঙ্ক কষা আছে।"
h1: "সবাই আলাদা আলাদা রাত থাকলে ছুটির ভিলার খরচ কীভাবে ভাগ করবেন"
navLabel: "রাত ধরে ভিলার খরচ ভাগ"
lead: "থাকার দাম জনপ্রতি রাতপ্রতি ধরুন, প্রত্যেকের রাতের সংখ্যা দিয়ে গুণ করুন, আর ভিলাটা লিখুন **সঠিক পরিমাণসহ একটি খরচ** হিসেবে। হিসাব মেটানোর সময় হলে Side Badger হিসাব রাখে আর পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে।"
cta:
  heading: "ভিলাকে একটা গোছানো খরচ দিন"
  body: "একটি গ্রুপ খুলুন, সবাইকে লিঙ্ক বা QR কোড দিয়ে ডাকুন, আর ভিলাটা সঠিক পরিমাণসহ লিখুন। আপনি ছুটি কাটাতে থাকুন, চলমান হিসাব Side Badger রাখবে।"
sections:
  - heading: "ছয় রাত, চারজন, একটা ক্রেডিট কার্ড"
    body: "একটি [গ্রুপ ট্রিপ](page:use-case/group-trips) সাধারণত একজনের কার্ড দিয়ে শুরু হয়। এখানে সেটা Ana-র। কাউকে তো আগে এগোতেই হয়, তাই সে ছয় রাতের জন্য €2,100-এ একটি ভিলা বুক করে। Ana, Ben আর Chloe ছয় রাতই থাকে। Dev শুধু শেষ তিন রাতের জন্য যোগ দিতে পারে, আর আসে ট্রেনে। Ben একটা গাড়ি ভাড়া করে, যে গাড়িতে Dev কখনও বসেই না। Dev বড় বাজারটা করে। ভিলা চারজনে ভাগ করাটাই সবচেয়ে স্বাভাবিক চাল। কিন্তু তাতে Dev এমন তিন রাতের টাকা দেয় যা সে বাড়িতেই কাটিয়েছে, আর এ ধরনের কথা বড়দিনে আবার উঠে আসে। রাত ধরে ভাগ করলে তর্কটাই এড়ানো যায়, আর অঙ্ক কষতে এক মিনিট লাগে।"
  - heading: "এক জন-রাতের দাম বের করুন"
    body: "জন-রাত মানে একজন মানুষের এক রাত থাকা। ভিলার দাম বদলায় না, তাই মোট দামটা সব জন-রাতের ওপর ভাগ করুন, তারপর প্রত্যেকের ভাগে ধরুন সে যতগুলো জন-রাত ব্যবহার করেছে।"
    items:
      - "**জন-রাত গুনুন।** Ana, Ben আর Chloe প্রত্যেকে ছয় রাত থাকে আর Dev থাকে তিন রাত: 6 + 6 + 6 + 3 = 21।"
      - "**একটার দাম বের করুন।** €2,100 ÷ 21 = জন-রাতপ্রতি €100।"
      - "**প্রত্যেকের রাত দিয়ে গুণ করুন।** Ana, Ben আর Chloe প্রত্যেকে 6 × €100 = €600 করে দেয়। Dev দেয় 3 × €100 = €300।"
      - "**মোট মিলিয়ে দেখুন।** €600 + €600 + €600 + €300 = €2,100। আপনাদের ভাগগুলোর যোগফল দামের সমান না হলে কোনো রাত বাদ পড়েছে, নয়তো দুবার গোনা হয়েছে।"
  - heading: "Side Badger-এ লিখুন"
    body: "একটি গ্রুপ খুলুন, বাকি তিনজনকে লিঙ্ক বা QR কোড দিয়ে ডাকুন, তারপর খরচগুলো যোগ করুন। আগে ভিলা।"
    items:
      - "**খরচ যোগ করুন** বেছে নিন। একটা বিবরণ দিন, 2,100 লিখুন, আর **কে টাকা দিয়েছেন?** অংশে Ana-কে বেছে নিন।"
      - "**যাদের মধ্যে ভাগ হবে** অংশে চারজনকেই রাখুন।"
      - "**কীভাবে ভাগ হবে** অংশে **সঠিক পরিমাণ** বেছে নিন। Ana, Ben আর Chloe-র জন্য 600 আর Dev-এর জন্য 300 লিখুন। পরিমাণগুলোর যোগফল মোটের সমান হতে হবে।"
      - "**খরচ সংরক্ষণ করুন** বেছে নিন।"
      - "গাড়ি ভাড়াটা একইভাবে যোগ করুন। Ben দিয়েছে, ভাগ **সমান**, আর Dev বাদ, কারণ সে ট্রেনে এসেছে। খরচ ভাগ করার অন্য উপায়গুলোর জন্য দেখুন [খরচ ভাগ করা](page:feature/split-expenses)।"
      - "বাজারটা যোগ করুন। Dev দিয়েছে, ভাগ **সমান**, আর চারজনই আছে।"
  - heading: "ফলাফল পড়ুন, তারপর হিসাব মেটান"
    body: "প্রত্যেকের বিল হলো তার ভিলার ভাগ, সঙ্গে গাড়ি আর বাজারের ভাগ। Ana, Ben আর Chloe-র প্রত্যেকের দাঁড়ায় €725, মানে €600 + €80 + €45। Dev-এর দাঁড়ায় €345, মানে €300 + €45। প্রত্যেকে যা দিয়েছে তা বাদ দিলেই ব্যালেন্স বেরিয়ে আসে। Ana দিয়েছে €2,100, তাই তার পাওনা €1,375। Ben দিয়েছে €240 আর তার দেওয়ার আছে €485। Dev দিয়েছে €180 আর তার দেওয়ার আছে €165। Chloe কিছুই দেয়নি আর তার দেওয়ার আছে €725। এভাবে ফেলে রাখলে সেই দেনাগুলো গ্রুপের ভেতর ছয় দিকে ছড়িয়ে থাকত। তার বদলে Side Badger তিনটি পেমেন্ট সাজেস্ট করে, সবই Ana-কে। তাকে যেভাবে খুশি দিন, তারপর **সব শোধ করুন** বেছে প্রতিটি পেমেন্টের জন্য **সেটেলমেন্ট রেকর্ড করুন** ব্যবহার করুন, যাতে ব্যালেন্স হালনাগাদ হয়ে যায়। কুইক সেটেল বোতামগুলো পরিমাণ ভরে দেয়। আরও জানতে দেখুন [হিসাব মেটানো](page:feature/settle-up)।"
  - heading: "ভিলার দাম যখন একটা গোছানো অঙ্ক নয়"
    items:
      - "**ঘরগুলো আলাদা হলে।** সুইটের দাম ছোট্ট ঘরটার চেয়ে বেশি হলে আগে ঠিক করুন প্রতিটি ঘরের দাম কত, তারপর জন-রাতের অঙ্ক একটি একটি ঘর ধরে কষুন। ভিলাটা সবার মোট দিয়ে একটি খরচ হিসেবে লিখুন, অথবা প্রতি ঘরের জন্য একটি করে। যেভাবেই করুন, একটি খরচের সঠিক পরিমাণগুলোর যোগফল সেই খরচের মোটের সমান হতে হবে।"
      - "**কয়েক মাস আগে দেওয়া ডিপোজিট।** যে দিয়েছে তার নিজস্ব একটি খরচ থাকবে, তারিখ হবে যেদিন সে দিয়েছে সেদিনের। বাকি টাকার মতো একই অনুপাতে, রাত ধরে সেটা ভাগ করুন।"
      - "**বুকিং অন্য মুদ্রায় হলে।** ভিলাটা যে মুদ্রায় দিয়েছেন সেই মুদ্রায় লিখুন। গ্রুপ চলতে চলতে রূপান্তর করলে বর্তমান এক্সচেঞ্জ রেট ব্যবহার করুন, অথবা আসলে যে রেট পেয়েছেন সেটা লিখুন। মূল পরিমাণ খরচের সঙ্গেই থাকে। বিস্তারিত জানতে দেখুন [একাধিক মুদ্রা](page:feature/multiple-currencies)।"
      - "**আংশিক রাত।** কেউ মাঝরাতে পৌঁছায়, কেউ সকালের নাশতার আগেই চলে যায়। রাত গোনার একটাই নিয়ম ঠিক করুন আর সবার জন্য সেটাই ব্যবহার করুন।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটা আপনার হয়ে রাত গোনে না। রাত ধরে ভাগ বা শেয়ার ধরে ভাগ বলে কিছু নেই, তাই ওপরের মতো প্রতিটি পরিমাণ নিজে হিসাব করে **সঠিক পরিমাণ** লিখতে হয়।"
      - "এটা টাকা নাড়াচাড়া করে না। একে অপরকে যেভাবে খুশি দিন, তারপর পেমেন্টটা রেকর্ড করুন।"
      - "প্রতিটি খরচে একজনই দেয়। দুজন ভিলার টাকা দিলে দুটি খরচ লিখুন।"
      - "এতে অতিথি হিসেবে ঢোকার ব্যবস্থা নেই। Dev-সহ গ্রুপের প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট লাগে।"
exampleAfter: 2
