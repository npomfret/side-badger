sections:
  - heading: "Comments and reactions, next to di numbers"
    body: "Every expense get im own comment thread, and so too di group, each list and each poll. Ask why di taxi cost dat much under di taxi, no be inside chat wey nobody dey scroll back to. Add photo of di receipt or PDF of di booking, then react with thumbs up, heart, laugh, wow, sad or celebrate on expenses, payments and comments. Celebrate payment when e land. Na di closest wey Side Badger go reach to round of applause."
  - heading: "Question expense without starting quarrel"
    body: "When di group don switch on expense questions, anybody wey dey inside expense fit choose **I get question** and talk why. Dem go post di question as comment on di expense, di expense go get **Questioned** badge, and di whole expense go drop out of everybody balances until dem deal with di question."
    items:
      - "**To turn am on.** E dey off by default. Admin go switch on **Allow expense questions** for di group settings, under **Features**."
      - "**To close am.** Di person wey ask, or admin, go choose **Close di question**. If plenty people question di same expense, e go return inside di balances when dem close di last question."
      - "**To edit am.** When dem edit expense, open question go carry over to di new version for everybody wey still get share inside am. Anybody wey di edit leave out, im question go end with di old version, so nothing remain for am to close."
      - "**To find dem.** Di expenses list get **Only questioned** filter. Dis one no be approval step: only di expenses wey somebody question dem dey hold, and everything else dey count as soon as dem add am."
  - heading: "How question go play out"
    body: "Tom add £45 of party wine, wey dem share between all three housemates. Aisha no drink, so she raise question, and while e dey open di wine no count for anybody. Di house agree say di wine na for Tom and Priya, so Tom edit di split to di two of dem. Aisha no dey inside di expense again, so her question end with di earlier version, wey dem keep, and di wine join di balances back sharp sharp at £22.50 each instead of £15 each. If Aisha remain inside di expense, her question for carry over and wait for her or admin to close am. Below, Aisha £48 na £28 from di shop and £20 from di cleaner, and Priya £10.50 na her £70.50 share (£28, £20 and £22.50) less di £60 wey she pay. Very [housemates](page:use-case/housemates) kind of argument. For how to word question, see [wetin to do when somebody dispute shared expense](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Shared lists, for shopping"
    body: "Start list inside di group, name am something like Shopping List, add items and tick dem off. Drag items make dem arrange better, watch di progress count climb and comment on di list when somebody buy wrong oat milk. Keep finished list for corner to tidy am away (**Sho archivd** go bring am back), or copy list to reuse am. Keep di shared shopping list next to di shopping bills, so di list go talk wetin to buy and di expense go talk how much e cost. Who fit create and edit lists depend on di group permissions, wey [groups and permissions](page:feature/groups-and-permissions) explain."
  - heading: "Polls, no-name if you like"
    body: "Ask di group something wey go decide di bill, like which villa, how much to spend on di gift or whether di boat trip worth am. Poll get one question and two to ten options. You go choose how many votes each person get, from single choice reach ten, and whether voting go be no-name. **No-name voting** dey hide who vote for wetin, and nobody fit change am once di first vote enter. People fit change or remove dem vote until di poll close, and you fit reopen am if di group get second thoughts. To choose di villa na exactly wetin [group trips](page:use-case/group-trips) dey about, and to agree di gift budget na classic for [events and celebrations](page:use-case/events-and-celebrations)."
  - heading: "Di activity feed, so nothing go change quietly"
    body: "Every group get activity history, and di notifications bell dey gather activity from all your groups for one place. Add expense and everybody go see am sharp sharp, without refresh, and di feed dey show wetin change and who change am. Dat one cover expenses wey dem add, edit or delete, questions wey dem raise and close, comments, changes to lists and polls, and payments wey dem record."
  - heading: "Push notifications, if you want dem"
    body: "Push notifications na optional. Turn dem on for your account **Settings page**, under **Notifikashons**, and your device go let you know when new activity dey for your groups, like new expense or comment. You go switch on each device separate, and your browser go ask for permission first. For iPhone or iPad, dem only work inside di app wey dem add to Home Screen, wey di [web app](page:feature/web-app) page explain. Treat dem as convenience, no be promise, because dem no guarantee delivery."
limits:
  heading: "Di limits"
  items:
    - "Comments, lists and polls na for di group money. Di [terms](page:terms) ask say everything wey dem post must relate to group finances, so dis na place to plan di spending, no be general chat or to-do app."
    - "Comment fit reach 500 characters, with up to three attachments wey be images or PDFs of up to 5 MB each. Only di author fit delete comment."
    - "Expense questions dey off by default, and admin go turn dem on for each group. Only people wey dey inside expense fit question am, if you turn di feature off e go clear every open question, and nobody fit leave di group while expense wey dem dey part of get open question."
    - "Group fit hold up to 100 lists, each with up to 200 items of up to 500 characters. Group permissions decide who fit create, edit and delete lists, and locked group no allow any changes."
    - "Group fit hold up to 50 polls, each with two to ten options and up to ten votes per person. Polls no get deadline and dem no dey close by themselves."
    - "Dem dey keep di activity history for 90 days."
    - "Push notifications na opt-in for each account and each device. Dem need browser wey support dem and your permission, dem work for iPhone and iPad only from di app wey dem add to Home Screen, and dem no guarantee delivery. No email or text alerts dey for activity and no payment reminders dey, so to chase payment still be your own work."
useCasesHeading: "Where to plan together dey help"
faq:
  heading: "Question dem"
  items:
    - q: "Votes fit be no-name?"
      a: "Yes. Switch on **No-name voting** when you create di poll and e go hide who vote for wetin. Decide before di first vote, because nobody fit change am afterwards."
    - q: "Poll fit close by itself?"
      a: "No. Poll no get deadline, so di person wey create am go choose **Klos poll** once di group don decide. If di group get second thoughts, **Open poll again** go bring am back."
    - q: "How many items fit dey inside one list?"
      a: "Up to 200 items per list and up to 100 lists per group. Each item fit reach 500 characters, wey be plenty oat milk."
    - q: "Who fit close question, and wetin go happen to di expense for di meantime?"
      a: "Di person wey ask, or group admin. While question dey open, di whole expense dey out of everybody balances. E go return inside when dem close di last open question on am, or when edit comot di person wey ask from di expense."
    - q: "I fit use lists and comments as to-do app or group chat?"
      a: "No. Comments, lists and polls na for di group money, wey be wetin di [terms](page:terms) ask. Think shopping lists, budget polls and “why dis one na £45?”."
    - q: "Side Badger go email me about activity?"
      a: "No. No email or text alerts dey for activity. You fit turn on push notifications for each device, and di notifications bell inside di app dey show wetin new."
