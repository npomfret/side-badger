meta:
  title: "Yang bisa dan tidak bisa dilakukan Side Badger"
  description: "Membagi, melunasi, dan beberapa mata uang, plus grup, daftar, dan polling. Perangkat lengkapnya, dan daftar jujur tentang apa yang tidak dilakukan Side Badger."
h1: "Yang dilakukan Side Badger"
navLabel: "Fitur"
lead: "Semua isi kotaknya, dan yang tidak ada di dalamnya."
intro: "Ini perangkat lengkapnya. Spreadsheet sengaja kami tinggalkan. Mulailah dengan tiga pekerjaan yang dilakukan Side Badger setiap hari, lalu periksa sisa daftarnya dan daftar singkat hal-hal yang tidak dilakukannya."
cta:
  heading: "Apakah sudah cukup untuk kebutuhan grup Anda?"
  body: "Buat akun gratis dan coba dulu dengan grup kecil."
  button: "Buat akun gratis"
cardsHeading: "Tiga pekerjaan, secara rinci"
sections:
  - heading: "Pemindaian struk"
    body: "Foto struknya dan Side Badger mengisi total, tanggal, dan tempat untuk Anda periksa. Gambar struk dibaca oleh layanan AI Google."
  - heading: "Grup dan izin"
    body: "Buat grup untuk tiap rumah, perjalanan, atau acara, dengan hingga 50 orang di dalamnya. Undang orang dengan tautan atau kode QR. Dalam grup yang lebih besar, jadikan seseorang pemirsa, yang melihat semuanya dan tidak mengubah apa pun."
  - heading: "Daftar dan polling"
    body: "Simpan daftar belanja bersama di samping tagihan belanja. Ajukan daftar pilihan vila untuk divoting, secara anonim jika Anda mau."
  - heading: "Lainnya"
    items:
      - "**Pembaruan langsung:** tambahkan pengeluaran dan semua orang langsung melihatnya."
      - "**Bahasa:** gunakan Side Badger dalam 39 bahasa. Setiap orang dalam grup bisa memilih bahasanya sendiri."
      - "**Layar utama:** tidak perlu toko aplikasi. Masuk, lalu tambahkan Side Badger ke layar utama dan ia terbuka seperti aplikasi. Pengaturan di dalam aplikasi menunjukkan caranya."
      - "**Umpan balik:** menemukan bug? Beri tahu kami dari dalam aplikasi dan lihat balasan kami di sana."
  - heading: "Yang tidak dilakukan Side Badger"
    items:
      - "**Memindahkan uang.** Side Badger tidak pernah menyentuh uang Anda. Bayar satu sama lain dengan cara apa pun yang Anda suka. Permintaan pembayaran masih direncanakan."
      - "**Mengulang tagihan.** Tidak ada pengeluaran berulang. Salin tagihan bulan lalu dalam dua ketukan."
      - "**Membagi per item.** Satu pembayar per pengeluaran. Bagi rata, berdasarkan jumlah pasti, atau persentase."
      - "**Menyediakan aplikasi native.** Berjalan di peramban Anda. Masuk, lalu tambahkan ke layar utama."
      - "**Bekerja offline.** Perlu koneksi."
      - "**Mengirim peringatan lewat email atau pesan teks.** Notifikasi muncul di dalam aplikasi. Notifikasi push masih direncanakan."
      - "**Menggambar grafik atau anggaran.** Side Badger menyimpan hitungan siapa berutang kepada siapa, dan hanya itu triknya."
      - "**Masuk dengan Google atau Apple.** Daftar dengan email. Masuk dengan Google dan Apple masih direncanakan."
      - "**Membiarkan orang masuk tanpa akun.** Setiap orang dalam grup perlu akun gratis."
faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah saya membayar lewat Side Badger?"
      a: "Tidak. Side Badger menyimpan hitungan dan tidak pernah menyentuh uang Anda. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya."
    - q: "Apakah ada aplikasi seluler?"
      a: "Bukan di toko aplikasi. Side Badger berjalan di peramban. Masuk di ponsel Anda, lalu tambahkan ke layar utama agar terbuka seperti aplikasi. Pengaturan di dalam aplikasi menunjukkan caranya."
    - q: "Bisakah saya membagi per item?"
      a: "Tidak. Setiap pengeluaran punya satu pembayar, dan Anda membaginya secara merata, pasti, atau berdasarkan persentase."
    - q: "Apakah berfungsi offline?"
      a: "Tidak, perlu koneksi."
    - q: "Apakah semua orang dalam grup perlu akun?"
      a: "Ya. Setiap orang dalam grup perlu akun gratis, dan untuk mendaftar Anda hanya perlu alamat email."
