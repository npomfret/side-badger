faq:
  heading: "Pytania"
  items:
    - q: "A co, jeśli ktoś ma większy pokój, ale mniej światła?"
      a: "Powierzchnia to tylko punkt wyjścia, więc grupa może się umówić na korektę. Odejmij punkt albo dwa ciemnemu pokojowi, rozdziel je między pozostałych i sprawdź, czy procenty nadal dają w sumie 100. Side Badger zapisuje to, na co się umówicie, i tego nie ocenia."
    - q: "Czy rachunki też dzielić według wielkości pokoju?"
      a: "Zwykle nie. Z energii i internetu korzystają wszyscy, więc prostszy jest podział po równo, jak w przykładzie powyżej. Jeśli jeden współlokator siedzi w domu cały dzień, grupa może ustalić coś innego, na przykład dokładne kwoty. Opcje opisuje [dzielenie wydatków](page:feature/split-expenses)."
    - q: "Czy możemy później zmienić podział?"
      a: "Tak, w nowych wydatkach. Zmień procenty, gdy kopiujesz czynsz, a wcześniejsze miesiące zostaną, jak były. Żeby poprawić dawny wydatek, edytuj go, jeśli pozwalają na to uprawnienia grupy, i najpierw uprzedź dom, bo salda się zmienią. Wcześniejsza wersja zostaje zachowana."
