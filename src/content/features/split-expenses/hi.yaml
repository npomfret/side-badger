meta:
  title: "खर्च बराबर, सटीक राशि या प्रतिशत से बांटें | Side Badger"
  description: "साझा खर्च को बराबर, सटीक राशि या प्रतिशत से बांटें, और जो वहां नहीं था उसे बाहर रखें। मुफ्त, बिना विज्ञापन और रोज़ाना की किसी सीमा के बिना।"
h1: "खर्च बराबर, सटीक राशि या प्रतिशत से बांटें"
navLabel: "खर्च बांटना"
lead: "हर चीज़ 50/50 नहीं होती। Side Badger यह संभाल लेता है। बताएं किसने पेमेंट किया, उन लोगों को चुनें जिन्होंने खर्च बांटा, और उसे **बराबर, सटीक राशि या प्रतिशत से** बांटें। मनमुटाव अलग से बिकते हैं।"
cta:
  heading: "अगला खर्च ठीक से बांटें"
  body: "मुफ्त अकाउंट बनाएं, ग्रुप शुरू करें और वह खर्च जोड़ें जिसे आप निपटाने की सोच रहे थे। आगे क्या होता है, पक्का नहीं? [यह कैसे काम करता है](page:how-it-works) देखें, या जानें कि [मुफ्त में क्या-क्या मिलता है](page:pricing)।"
  button: "मुफ्त अकाउंट बनाएं"
problem:
  heading: "हर चीज़ 50/50 नहीं होती"
  body: "किराया कमरे के आकार के हिसाब से चलता है। तोहफा इस हिसाब से चलता है कि किसने क्या वादा किया। डिनर इस हिसाब से चलता है कि मिठाई तक कौन रुका। बिल को आधा-आधा बांटना तब तक चलता है जब तक पहला ऐसा बिल न आ जाए जो आधा नहीं है, और फिर कोई स्प्रेडशीट खोल लेता है। Side Badger दर्ज करता है कि किसने पेमेंट किया, किसने खर्च बांटा और वह कैसे बंटता है, ताकि बैलेंस सही निकलें और टेबल पर किसी को लंबा भाग न देना पड़े।"
workflow:
  heading: "खर्च जोड़ना, शुरू से आखिर तक"
  steps:
    - title: "बताएं किसने और किसलिए पेमेंट किया"
      body: "राशि, एक छोटा-सा विवरण और पेमेंट करने वाले का नाम भरें। हर खर्च का एक ही पेमेंट करने वाला होता है, जिससे हिसाब ईमानदार रहता है।"
      shot: S05
      shotAlt: "खर्च का फॉर्म, जिसमें तीन लोगों के बीच कॉटेज का किराया प्रतिशत से बंटा है"
    - title: "बंटवारा चुनें"
      body: "बराबर, सटीक राशि या प्रतिशत चुनें। प्रतिशत का जोड़ 100 होना चाहिए, और सटीक राशियों का जोड़ कुल के बराबर।"
      shot: S06
      shotAlt: "खर्च का फॉर्म, जिसमें एक तोहफे के लिए हर व्यक्ति की सटीक राशि भरी है"
    - title: "कहानी भी जोड़ें"
      body: "तारीख डालें, लेबल, जगह और एक नोट जोड़ें। ग्रुप में सबको वही विवरण दिखते हैं, और वे वहीं कमेंट कर सकते हैं।"
      shot: S08
      shotAlt: "एक खर्च अपने विवरण, कमेंट थ्रेड और उस मूल राशि के साथ, जिसमें वह दर्ज हुआ था"
    - title: "कुछ गड़बड़ लगे तो सवाल उठाएं"
      body: "अगर ग्रुप ने खर्च पर सवाल उठाना चालू किया है, तो खर्च में शामिल कोई भी व्यक्ति उस पर सवाल उठा सकता है, और खर्च की सूची सिर्फ सवाल उठाए गए खर्च दिखा सकती है।"
      shot: S18
      shotAlt: "खर्च की सूची, जिसमें सवाल उठाया गया बैज और केवल सवाल उठाए गए वाला फिल्टर दिख रहा है"
options:
  heading: "बांटने के तीन तरीके"
  items:
    - title: "बराबर"
      body: "डिनर, टैक्सी और हर उस चीज़ के लिए डिफ़ॉल्ट जो सबने बराबर बांटी। अगर कुल राशि ठीक से नहीं बंटती, तो बचा हुआ पैसा किसी एक व्यक्ति को रैंडम तरीके से जाता है, हर बार एक ही को नहीं। नीचे की टैक्सी में वह Ana है।"
    - title: "सटीक राशि से"
      body: "टाइप करें कि हर व्यक्ति का कितना बनता है। उस तोहफे के लिए अच्छा जिसमें सबने अलग कीमत चुनी, या उस दुकान के लिए जहां किसी एक की ट्रॉली में साझा किराने से ज़्यादा सामान था। राशियों का जोड़ कुल के बराबर होना चाहिए।"
    - title: "प्रतिशत से"
      body: "हर व्यक्ति को कुल का एक हिस्सा दें। कमरे के आकार के हिसाब से किराया इसका सबसे पुराना उदाहरण है, जिसमें सबसे बड़ा कमरा सबसे बड़ा हिस्सा देता है और कोई इसका नाटक नहीं करता कि ऐसा नहीं है।"
