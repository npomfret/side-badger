meta:
  title: "Калькулятор оренди: за розміром кімнати чи доходом | Side Badger"
  description: "Більша кімната, більша частка? Дізнайтеся, скільки платить кожен сусід, за розміром кімнати чи за доходом. У браузері, нічого не зберігається й не надсилається."
h1: "Калькулятор розподілу оренди"
navLabel: "Калькулятор оренди"
lead: "Більша спальня, більша частка? Внесіть оренду й побачите, скільки платить кожен, за розміром кімнати чи за доходом, до копійки. Він працює у вашому браузері, нічого не зберігає й не переказує гроші. Коли будинку потрібно вести облік, [розподіляйте витрати](page:feature/split-expenses) у Side Badger і щомісяця копіюйте оренду."
cta:
  heading: "Один раз визначте відсотки. Копіюйте їх назавжди."
  body: "Цей калькулятор забуває все, щойно ви закриєте вкладку, достоту як той сусід, який «точно заплатив за інтернет». Група в Side Badger зберігає оренду, рахунки й хто що заплатив. Це безкоштовно, без реклами й без денних обмежень."
sections:
  - heading: "Два способи поділити оренду"
    items:
      - "**За розміром кімнати.** Частина оренди йде за кухню, ванну й вітальню, якими користуються всі. Ви обираєте цю частку (спершу 40 %), і вона ділиться порівну. Решта залежить від площі спальні, тож велика кімната платить більше, а комірчина отримує знижку, яку заслужила."
      - "**За доходом.** Кожен платить таку саму частку оренди, яку становить його заробіток від загального. Додайте спільні рахунки, і вони підуть за тими самими частками."
  - heading: "Як працюють обчислення"
    body: "Кожна людина отримує точну частку, а потім цілий відсоток, бо цілі числа легше вводити й легше про них сперечатися. Округлення робиться методом найбільшого залишку: кожен зберігає ціле число нижче своєї частки, а зайві пункти діставаються тому, хто втратив найбільше. Відсотки завжди дають у сумі 100. У квартирі нижче спільні 40 % дають по 13,33 % кожному. Кімната Прії займає 16 з 38 м² квартири, тож 60 % × 16/38 дає 25,26 %, плюс 13,33 % виходить 38,6 %, що округлюється до 39 %. Том і Аїша виходять на 32 % і 29 %, а 39 + 32 + 29 — це 100. Кожна сума — це цей відсоток від оренди: 39 % від 1 950 £ — це 760,50 £."
  - heading: "Тоді введіть це в Side Badger"
    body: "Повну історію, з рулеткою включно, читайте в [як розділити оренду за розміром кімнати](page:guide/how-to-split-rent-by-room-size), а для пар є [партнер, який заробляє більше](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
    items:
      - "**Додайте оренду.** У групі оберіть **Додати витрату**, у полі **Хто заплатив?** вкажіть, хто заплатив орендодавцю, а в полі **Розділити між** залиште всіх."
      - "**Оберіть «Відсоток».** У полі **Як розділити** оберіть **Відсоток** і введіть цілі відсотки. Форма попередить, якщо їх сума не дорівнює 100."
      - "**Скопіюйте наступного місяця.** Відкрийте минуломісячну оренду й оберіть **Копіювати витрату**. Розподіл копіюється разом із нею."
  - heading: "Чого калькулятор не робить"
    items:
      - "**Не міряє ваші кімнати.** Площа — лише відправна точка. Кімната з власною ванною коштує більше, ніж така сама площа без неї, а комірчина, де вміщуються ліжко й оптимістичний стілець, коштує менше."
      - "**Не вирішує, що вважати доходом.** Після податків чи до, зарплата чи підробіток: вирішує група. Беріть однаковий період для всіх."
      - "**Нічого не зберігає.** Закрийте вкладку, і цифри зникнуть. Щоб їх зберегти, скопіюйте посилання. Воно містить ваші цифри після #, а браузери ніколи не надсилають цю частину на сервер, і кожен, хто має посилання, може їх прочитати."
      - "**Не переказує гроші.** Орендодавцю ви платите як зручно."
      - "**Не змішує валюти й не виходить за межі.** Оберіть одну валюту. Він приймає від 2 до 10 людей і оренду до 999 999,99, як і в застосунку."
