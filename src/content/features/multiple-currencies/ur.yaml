sections:
  - heading: "پورے گروپ کے لیے ایک کرنسی"
    body: "اگر آپ کا گروپ اس کے بارے میں سوچنا نہیں چاہتا تو گروپ کی ایک کرنسی چنیں اور فارم ہر نئے خرچے کو اس میں تبدیل کر دیتا ہے، ایسے ریٹ پر جسے آپ اب بھی دیکھ اور بدل سکتے ہیں۔ یہ صرف نئے اور کاپی کیے گئے اخراجات پر لاگو ہوتا ہے۔ ترامیم اور موجودہ اخراجات جیسے ہیں ویسے رہتے ہیں، اس لیے جو پہلے درج ہو چکا وہ آپ کے نیچے سے نہیں بدلتا۔"
  - heading: "یورو دینے ہیں، ادائیگی پاؤنڈ میں"
    body: "ین میں ادا کیا اور پاؤنڈ میں حساب برابر کر رہے ہیں؟ کوئی بات نہیں۔ جب آپ ادائیگی ریکارڈ کرتے ہیں تو اسے بھی تبدیل کر سکتے ہیں، تاکہ جس کے ذمے یورو ہیں وہ پاؤنڈ میں ادا کرے اور یورو کا بیلنس پھر بھی درست نکلے۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر اسے ریکارڈ کریں۔"
  - heading: "گروپ کے اصول"
    body: "گروپ کو ان کرنسیوں تک محدود کریں جو آپ واقعی استعمال کر رہے ہیں، اور ڈیفالٹ طے کریں تاکہ فارم درست کرنسی پر کھلے۔ پرتگال میں چھٹیوں کو ڈنر کے بل کے ساتھ 139 اور اختیارات کی ضرورت نہیں، اور [بیرون ملک شادی](page:use-case/events-and-celebrations) کو غالباً دو کی ضرورت ہوتی ہے۔"
limits:
  heading: "حدیں"
  items:
    - "خرچہ محفوظ ہوتے ہی ریٹ طے ہو جاتا ہے۔ پرانے اخراجات کی قدر دوبارہ کبھی نہیں لگائی جاتی۔"
    - "Side Badger جہاں ممکن ہو موجودہ ریٹ لاتا ہے۔ ہر جوڑی کے لیے ضمانت نہیں، اور آپ ہمیشہ ریٹ خود لکھ سکتے ہیں۔"
    - "گروپ کی خودکار تبدیلی صرف نئے اور کاپی کیے گئے اخراجات پر لاگو ہوتی ہے، ترامیم یا موجودہ اخراجات پر نہیں۔"
    - "ہر خرچہ اپنی کرنسی میں 999,999.99 تک محدود ہے۔"
    - "140 کرنسیاں ہیں۔ کرپٹو کرنسیاں اور دھاتیں ان میں شامل نہیں۔"
    - "Side Badger ادائیگیاں ریکارڈ کرتا ہے۔ یہ کبھی رقم منتقل یا ایکسچینج نہیں کرتا۔"
useCasesHeading: "یہ کہاں مدد کرتا ہے"
faq:
  heading: "سوالات"
  items:
    - q: "آپ کون سا ایکسچینج ریٹ استعمال کرتے ہیں؟"
      a: "ایک موجودہ ایکسچینج ریٹ، جو خرچہ درج کرتے وقت لایا جاتا ہے جہاں دستیاب ہو۔ آپ اسے اس ریٹ پر بدل سکتے ہیں جو آپ کو واقعی ملا، اور تبدیل شدہ رقم اپ ڈیٹ ہو جاتی ہے۔"
    - q: "کیا پرانے اخراجات کی قدر دوبارہ لگتی ہے؟"
      a: "نہیں۔ خرچہ محفوظ ہوتے ہی ریٹ طے ہو جاتا ہے، اس لیے صرف اس لیے بیلنس نہیں بہکتا کہ مارکیٹ ہلی۔"
    - q: "کیا آپ کرپٹو سپورٹ کرتے ہیں؟"
      a: "نہیں۔ 140 کرنسیاں ہیں، اور کرپٹو کرنسیاں ان میں شامل نہیں۔"
    - q: "میں 2,000,000 روپیہ کیوں درج نہیں کر سکتا؟"
      a: "ہر خرچہ اپنی کرنسی میں 999,999.99 تک محدود ہے۔ اسے کسی اور کرنسی میں درج کر کے تبدیل کریں، یا دو اخراجات میں بانٹ دیں۔"
    - q: "کیا تبدیلی پر کچھ خرچ آتا ہے؟"
      a: "نہیں۔ تبدیلی مفت ہے، باقی Side Badger کی طرح۔ [قیمتیں](page:pricing) دیکھیں۔"
    - q: "کیا مجھے تبدیل کرنا ضروری ہے؟"
      a: "نہیں۔ کرنسیاں الگ رہتی ہیں جب تک آپ یا آپ کا گروپ تبدیلی نہ چنے، اور ہر کرنسی کی ادائیگیوں کی اپنی مختصر فہرست ہوتی ہے۔"
