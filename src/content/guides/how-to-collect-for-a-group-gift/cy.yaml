faq:
  heading: "Cwestiynau"
  items:
    - q: "Beth os byddwn yn casglu mwy nag y mae'r anrheg yn ei gostio?"
      a: "Rhaid i'r symiau union adio i'r pris, felly tociwch y cyfrannau nes eu bod yn gwneud hynny. Neu rhowch y gweddill ar rywbeth go iawn, fel blodau, a'i roi i mewn fel ail gost, fel y cerdyn a'r papur lapio yn yr enghraifft."
    - q: "A all rhywun gyfrannu heb ymuno â'r grŵp?"
      a: "Nid os ydych am eu cynnwys yn y cyfrif. Mae angen cyfrif am ddim a lle yn y grŵp ar bawb yn y rhaniad. I rywun sydd ag arian parod yn unig, gallai Priya ei gymryd a rhoi'r anrheg i mewn am yr hyn sy'n dal yn ddyledus gan y grŵp. Er enghraifft, pe bai Sam yn rhoi £40 o arian parod iddi, byddai hi'n rhoi £200 i mewn ac yn ei rannu'n 60, 60 ac 80 rhyngddi hi ei hun, Omar a Lena."
    - q: "A all y bleidlais benderfynu faint mae pob person yn ei roi?"
      a: "Na all. Mae pleidlais yn cytuno ar un ffigur i'r grŵp cyfan, fel y gyllideb. Eich lle chi yw cytuno ar gyfran pob person rhyngoch, yna ei theipio i mewn i'r gost fel **Union symiau**."
