meta:
  title: Del kostnader i 140 valutaer, konvertert eller holdt adskilt
  description: Legg inn hver utgift i valutaen du betalte i, hold saldoene adskilt eller konverter med en kurs du kan se og endre, og gjør så opp med en kort liste over betalinger.
h1: Del kostnader i 140 valutaer
navLabel: Flere valutaer
lead: Euro, yen og den ene taxituren i baht. Side Badger tar hver utgift i valutaen du betalte i, holder saldoene i orden og kan konvertere når gruppen heller vil gjøre opp én gang. Den fungerer i 140 valutaer, og passer naturlig til [gruppereiser](page:use-case/group-trips).
cta:
  heading: Ta med euroene dine, ta med yenene dine
  body: Opprett en konto, start en gruppe og legg til den første utgiften i den valutaen du tilfeldigvis hadde i hånden.
problem:
  heading: Legg den inn slik du betalte
  body: En tur betales sjelden i én valuta. Hotellet ble booket hjemme i pund, middagen ble betalt i yen, og flyplasskaffen i det de nå brukte på mellomlandingen. Å konvertere alt for hånd før du i det hele tatt kan skrive det inn, er slik regneark blir forlatt. I Side Badger legger du inn hver utgift i valutaen på kvitteringen, og hvert beløp følger sin valutas regler, så yen har ingen desimaler og dinarer har tre. Valutaene du brukte sist, kommer først i listen.
workflow:
  heading: Hold valutaene adskilt, eller konverter underveis
  steps:
    - title: Legg til utgiften i sin egen valuta
      body: Velg valutaen, skriv inn beløpet, si hvem som betalte og hvem som delte. Mer trengs ikke. Dette er standarden, og den beholder det opprinnelige beløpet nøyaktig slik du la det inn.
      shot: S07
      shotAlt: Utgiftsskjemaet med et beløp i yen lagt inn
    - title: Følg med på en saldo for hver valuta
      body: Saldoer føres separat per valuta, og hver får sin egen korte liste over foreslåtte betalinger. Pund gjøres opp i pund og yen i yen.
      shot: S10
      shotAlt: Saldoskjermen med forenklet gjeld i to valutaer
    - title: Eller konverter, når gruppen heller vil gjøre opp én gang
      body: Velg en annen valuta når du legger inn utgiften, så kan Side Badger konvertere den med en gjeldende valutakurs, som du kan endre til kursen du faktisk fikk. Det konverterte beløpet slås sammen med saldoen i den valutaen. Konvertering er et valg gruppen tar, aldri noe som skjer bak ryggen din.
options:
  heading: En kurs du kan se og endre
  items:
    - title: Kursen vises
      body: Når du konverterer, vises kursen og det konverterte beløpet i skjemaet, så ingen må ta et tall på tillit.
    - title: Skriv inn din egen
      body: Fikk du en bedre kurs på vekslingskontoret, eller en dårligere på flyplassen? Endre kursen til den du faktisk fikk, så oppdateres det konverterte beløpet.
    - title: Originalen blir stående
      body: Det opprinnelige beløpet blir stående på utgiften, ved siden av det konverterte, for alle som spør hva det var i yen.
    - title: Gratis å konvertere
      body: Det koster ingenting å konvertere. Det er ingen avgift for å legge inn en utgift i en annen valuta.
