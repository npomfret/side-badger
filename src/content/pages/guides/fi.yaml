intro: Jokainen opas seuraa **yhtä kuvitteellista ryhmää** ensimmäisestä kulusta viimeiseen kirjattuun maksuun. Luvut on laskettu valmiiksi, ja vaiheissa käytetään näkymiä niin kuin sovellus ne nimeää.
