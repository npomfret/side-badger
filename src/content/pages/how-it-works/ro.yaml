        method: equal
sections:
  - heading: "39 de limbi și construit pentru mai mulți oameni"
    body: "Folosește Side Badger în 39 de limbi, inclusiv araba, persana și urdu, scrise de la dreapta la stânga. Fiecare om din grup își poate alege limba, așa că pagina grupului poate fi în arabă pentru unul și în engleză pentru următorul. E construit și cu gândul la cei care folosesc tastatura sau cititorul de ecran, iar culorile membrilor vin cu modele, așa că nu trebuie să deosebești verdele de roșu."
faq:
  heading: "Întrebări"
  items:
    - q: "Are fiecare nevoie de un cont?"
      a: "Da, unul gratuit. Fiecare persoană își verifică e-mailul înainte de a adăuga ceva."
    - q: "Există o aplicație?"
      a: "Rulează în browser și o poți adăuga pe ecranul de pornire sau în dock, ca să se deschidă ca o aplicație. Nu există o versiune din magazinul de aplicații și nici mod offline."
    - q: "Mută Side Badger bani?"
      a: "Nu. Ține evidența și sugerează plăți, iar voi vă plătiți cum preferați. Apoi înregistrați plata. Vezi [decontarea](page:feature/settle-up)."
    - q: "Poate cineva să plece datorând bani?"
      a: "Nu. Nimeni nu poate părăsi un grup cât timp datorează sau i se datorează bani, așa că se achită mai întâi."
    - q: "Câți oameni pot intra într-un grup?"
      a: "Până la 50 de persoane într-un grup. Invită-i cu un link sau cu un cod QR și activează aprobarea dacă vrei ca un administrator să lase fiecare persoană să intre."
    - q: "Dar excursiile cu mai multe valute?"
      a: "Soldurile se țin separat pentru fiecare valută. Vezi [mai multe valute](page:feature/multiple-currencies)."
