meta:
  title: "Sådan gør I op efter en gruppetur | Side Badger"
  description: "Gør op, før alle spredes. Ti sammenfiltrede gældsposter bliver til fire betalinger, registreret undervejs, og en delbetaling går fint. Regnet for fem venner."
h1: "Sådan gør I op efter en gruppetur"
navLabel: "Gør op efter en tur"
lead: "Gør op, før alle spredes. Tilføj den sidste udgift, åbn gruppens saldi, og betal det, du skylder, fra den korte liste, som du vil. Registrer så hver betaling i Side Badger, så saldoen ryddes for hele gruppen. For fem venner og fem udgifter går ti sammenfiltrede gældsposter ned til fire betalinger."
cta:
  heading: "Luk regnskabet, før billederne lander"
  body: "Opret en gratis konto, start en gruppe til næste tur, og tilføj hver udgift, efterhånden som den sker. Den korte liste over betalinger venter, når du når lufthavnen. Vil du først se, [hvordan man gør op](page:feature/settle-up)?"
sections:
  - heading: "Fem venner, fem udgifter, én afgangshal"
    body: "Mo, Ines, Raf, Tess og Uma tilbragte en uge ved kysten. Mo bookede lejligheden og købte dagligvarerne, Ines betalte for bådturen, og Raf tog den store middag. Tess tog lufthavnstaxaen med Uma og Mo, fordi Ines og Raf tog toget. Umas betalingskort blev hjemme, så hun betalte for ingenting. Det er fem udgifter og 1.700 € i alt, og i afgangshallen kunne ingen sige, hvem der lå foran."
  - heading: "Ti gældsposter, fire betalinger"
    body: "Lejligheden, bådturen, middagen og dagligvarerne deles ligeligt på fem. Det er 200 €, 50 €, 60 € og 18 € hver, så Ines og Raf skylder 328 € hver. Taxaen deles på tre med 20 € hver, så Mo, Tess og Uma skylder 348 €. Mo betalte 1.090 € og skylder 348 €, så han har 742 € til gode. Alle andre betalte mindre, end de skylder. Uma mangler 348 €, Tess 288 €, Ines 78 € og Raf 28 €, og det giver tilsammen Mos 742 €. Gør I hvert par op direkte, ender I med ti separate gældsposter. Side Badger foreslår i stedet fire betalinger, alle til Mo."
  - heading: "Gør op, før alle spredes"
    body: "Det bedste tidspunkt er den sidste aften eller hjemturen, mens alle stadig er samlet ét sted, og en gæld på 28 € er let at nævne. Tilføj alle udgifter først, taxaen med. Ingen kan forlade en gruppe, mens de skylder eller er til gode, så regnskabet skal alligevel lukkes på et tidspunkt."
    items:
      - "**Tjek listen.** Åbn gruppen, og se på **Saldi**. Som standard ser du den gæld, der involverer dig. Vælg **Vis alle** for at se hele gruppens liste."
      - "**Betal, som du vil.** Bankoverførsel, kontanter, en tjeneste, man skylder fra sidste ferie. Side Badger flytter ikke pengene."
      - "**Registrer det.** Vælg **Afregn**. Under **Hurtig afregning** er hver knap en af dine foreslåede betalinger, og et tryk på en udfylder beløbet. Tilføj en **Bemærkning** som bankoverførsel, tjek **Dato** (den kan ikke ligge i fremtiden), og vælg **Registrer afregning**."
      - "**Se det forsvinde.** Saldoen opdateres for alle. Når den sidste betaling er registreret, står der **Alt er afregnet!** under **Saldi**."
  - heading: "Betal en del nu og resten senere"
    body: "Uma kan sende 200 € i aften og resten sidst på måneden. Hun registrerer 200 €, og formularen advarer hende om, at hun bagefter stadig skylder Mo 148 €, hvilket er 348 € minus 200 €. Gem det, og de 148 € bliver stående på hendes saldo, til hun registrerer resten. Advarslen virker også den anden vej. Hvis et vildfarent nul gør 348 € til 3.480 €, siger formularen, at hun kun skylder Mo 348 €, og at et gem ville skabe en gæld i den modsatte retning. Ret nullet, før du gemmer."
  - heading: "Ret fejl, og fejr betalinger"
    items:
      - "**En forkert betaling.** Kun den, der registrerede en betaling, kan redigere den. Vedkommende eller en gruppeadministrator kan slette den, og så kan den registreres igen."
      - "**En betaling, der er værd at lægge mærke til.** Hver registreret betaling står under **Afregninger** med dato og bemærkning, hvor alle i gruppen kan se den og reagere. Mo kan vælge **Fejr**, når Umas sidste 148 € lander."
      - "**Slutningen.** Når alle saldi er på nul, kan en administrator låse gruppen, så tallene bliver stående."
  - heading: "Det her gør Side Badger ikke"
    items:
      - "Den flytter aldrig penge. Den har hverken betalingslinks eller betalingsanmodninger, så en betaling i appen er en registrering af en betaling, der er foretaget andetsteds."
      - "Den sender ingen påmindelser. Det er stadig op til dig at rykke for en forsinket betaling."
      - "Den sætter ingen frister. Hvornår resten af Umas 148 € forfalder, er op til gruppen at aftale."
      - "De foreslåede betalinger er en kort liste, ikke et løfte om den kortest mulige. De udregnes pr. valuta, så en tur betalt i euro og pund får en liste for hver."
