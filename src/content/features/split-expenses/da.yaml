sections:
  - heading: Kun dem, der var der
    body: Del en udgift mellem alle eller kun dem, der delte den. Udelad folk fra de udgifter, de ikke var med i, så afspejler saldiene det. Bofællen, der var væk hele ugen, skylder ikke for takeawayen, hvilket [bofæller](page:use-case/housemates) vil genkende som grundlæggende retfærdighed.
  - heading: Detaljerne, der sparer skænderier senere
    items:
      - Angiv **datoen** og eventuelt et tidspunkt. Genveje som i dag, i går, i morges og i går aftes sparer lidt tastearbejde.
      - Tilføj op til tre **etiketter** for at gruppere udgifter, som dagligvarer eller rejse.
      - Tilføj **stedet**. Indsæt et kortlink, så udfyldes stedets navn af sig selv.
      - Tilføj en **note** til historien bag tallet, med lidt formatering, hvis historien kræver det.
      - "Vedhæft op til tre **kvitteringer** som billeder eller PDF'er, så beviset bliver hos udgiften."
      - Brug **kommentarerne** til at holde samtalen ved siden af den udgift, den handler om, frem for i en chattråd, ingen scroller tilbage i.
  - heading: Kopiér, rediger, og se, hvad der er ændret
    body: Kopiér sidste måneds husleje i stedet for at skrive den igen, og ret så det, der er anderledes. Var et tal forkert, så rediger udgiften. Den tidligere version gemmes, og redigeringen vises i gruppens aktivitet, så ingen ændrer et tal i det stille. Hvad man må redigere, afhænger af gruppens rettigheder.
  - heading: Når noget ser forkert ud
    body: En gruppe kan slå udgiftsspørgsmål til. Enhver, der er med i en udgift, kan stille et spørgsmål og sige hvorfor, og udgiften holdes uden for saldiene, til den, der spurgte, eller en administrator, lukker det. Det er slået fra som standard, og en administrator slår det til for gruppen. Det passer til [begivenheder og fester](page:use-case/events-and-celebrations), hvor depositummet, ingen kan huske, pludselig er alles sag.
limits:
  heading: Grænser
  items:
    - Én person betaler for hver udgift. Hvis to personer betalte, så registrer to udgifter.
    - Der er ingen deling pr. vare og ingen deling i andele. Ligeligt, nøjagtige beløb og procenter er, hvad der findes.
    - Procenter skal give 100 i alt.
    - En udgift kan være op til 999.999,99 i sin egen valuta, med den valutas sædvanlige antal decimaler.
    - Udgifter kan ikke gentage sig selv. Kopiér sidste måneds i stedet.
    - Datoer må ikke ligge i fremtiden eller mere end 10 år tilbage.
    - En udgift, der involverer en person, som har forladt gruppen, bliver skrivebeskyttet.
useCasesHeading: Hvor en deling som denne hjælper
faq:
  heading: Spørgsmål
  items:
    - q: Kan to personer betale for én udgift?
      a: Ikke i én udgift. Registrer to, én for hver betaler, så bliver saldiene de samme.
    - q: Kan jeg dele en kvittering pr. vare?
      a: Nej. En deling er ligelig, efter nøjagtige beløb eller i procent. Til en regning med forskellige varer kan du indtaste, hvad hver person skylder, som nøjagtige beløb.
    - q: Kan jeg indstille en standarddeling?
      a: Nej. Kopiér en tidligere udgift for at genbruge dens deling, og ret det, der er anderledes.
    - q: Kan regninger gentage sig hver måned?
      a: Nej. Kopiér i stedet sidste måneds udgift, hvilket tager et par sekunder.
    - q: Hvem kan redigere en udgift?
      a: Den, som gruppens rettigheder tillader. Hver redigering vises i gruppens aktivitet, så ændringer aldrig sker i det stille.
    - q: Hvad sker der med saldiene bagefter?
      a: De opdateres, efterhånden som udgifter kommer ind, og [gør op](page:feature/settle-up) forvandler dem til en kort liste over betalinger. Hvis en udgift er i en anden valuta, se [flere valutaer](page:feature/multiple-currencies).
