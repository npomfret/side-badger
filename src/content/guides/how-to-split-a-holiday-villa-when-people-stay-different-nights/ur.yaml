faq:
  heading: "ولا کے سوالات"
  items:
    - q: "اگر کوئی منسوخ کر دے تو؟"
      a: "اس کی راتیں نکالیں، حساب دوبارہ لگائیں اور ولا کا خرچہ ایڈٹ کریں تاکہ عین رقموں کا مجموعہ پھر قیمت کے برابر ہو جائے۔ پچھلا ورژن محفوظ رہتا ہے اور ایڈٹ گروپ کی سرگرمی میں دکھائی دیتا ہے، اس لیے کوئی خاموشی سے عدد نہیں بدلتا۔ کون ایڈٹ کر سکتا ہے، یہ گروپ کی اجازتوں پر منحصر ہے۔"
    - q: "کیا بکنگ کرنے والے کو کم دینا چاہیے؟"
      a: "یہ گروپ کا فیصلہ ہے۔ بکنگ ایک ذمہ داری ہے، اور گروپ اس پر متفق نہیں ہوتے کہ اس پر رعایت بنتی ہے یا نہیں۔ جو بھی طے کریں، اسے عین رقموں میں شامل کریں اور خرچے پر نوٹ میں، یا اس کے ساتھ تبصرے میں لکھ دیں، تاکہ کسی کو سودا یاد نہ رکھنا پڑے۔"
    - q: "کیا ہم صفائی کی فیس مختلف طریقے سے بانٹ سکتے ہیں؟"
      a: "جی ہاں۔ فیس کو الگ خرچے کے طور پر درج کریں اور اسے اپنی تقسیم دیں۔ پورے گھر کی ایک مقررہ فیس کے لیے برابر موزوں ہے۔ اگر گروپ چاہتا ہے کہ فیس بھی راتوں کے مطابق چلے تو عین رقمیں موزوں ہیں۔"
