faq:
  heading: Spørgsmål
  items:
    - q: Er Side Badger et gratis alternativ til Splitwise?
      a: "Til at dele regninger i en gruppe, ja. Kvitteringsscanning, valutaomregning og ingen reklamer er gratis, uden daglige grænser. Hvis du har brug for en native app, offline-brug, tilbagevendende udgifter eller betalinger i selve appen, så kan Splitwise det, og Side Badger kan det ikke."
    - q: Hvor kommer oplysningerne om Splitwise fra?
      a: "Splitwises egne sider: dets startside, dets Pro-side og dets hjælpecenter. Hver række i tabellen linker til den side, den kom fra, og datoen over tabellen siger, hvornår vi læste dem. Vi tjekker dem hvert kvartal."
    - q: Forbliver Side Badger gratis?
      a: "Alt i Side Badger er gratis i dag, og der er intet betalt abonnement. Hvis det nogensinde ændrer sig, giver vi besked først. [Prissiden](page:pricing) har detaljerne."
    - q: Skal alle i min gruppe skifte?
      a: "Ja. Alle i en gruppe skal have en gratis Side Badger-konto, og de kan tilmelde sig med et link eller en QR-kode."
    - q: Har Side Badger en mobilapp?
      a: "Ikke i en app store. Den kører i din browser: log ind på din telefon, og føj den så til din startskærm, så den åbner som en app. [Sådan virker det](page:how-it-works) viser hvordan."
