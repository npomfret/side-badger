      payer: omar
      amount: 12
      split:
        method: equal
faq:
  heading: "Запитання"
  items:
    - q: "Що, якщо ми зберемо більше, ніж коштує подарунок?"
      a: "Точні суми мають разом дорівнювати ціні, тож зменшуйте частки, доки так не вийде. Або витратьте надлишок на щось справжнє, наприклад на квіти, і внесіть це як другу витрату, як листівку й обгортку в прикладі."
    - q: "Чи може хтось скинутися, не вступаючи до групи?"
      a: "Ні, якщо ви хочете, щоб його було в підрахунку. Кожен, хто бере участь у розподілі, потребує безкоштовного облікового запису й місця в групі. Для того, у кого є лише готівка, Прія могла б узяти її й внести подарунок на ту суму, яку група ще винна. Наприклад, якщо Сем дав їй 40 £ готівкою, вона внесе 200 £ і розділить як 60, 60 і 80 між собою, Омаром і Леною."
    - q: "Чи може опитування вирішити, скільки вкладає кожен?"
      a: "Ні. Опитування погоджує цифру для всієї групи, наприклад бюджет. Частку кожного ви домовляєтеся між собою, а потім вводите у витрату як **Точні суми**."
