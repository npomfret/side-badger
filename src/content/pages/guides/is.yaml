  title: "Leiðarvísar um sanngjarna skiptingu kostnaðar | Side Badger"
  description: "Hagnýtir leiðarvísar um sanngjarna skiptingu leigu, orlofshúsa og hópkostnaðar, hver unninn með raunhæfum hópi og reikningsdæmin sýnd."
h1: "Leiðarvísar um sanngjarna skiptingu kostnaðar"
navLabel: "Leiðarvísar"
lead: "Spurningarnar sem fólk spyr rétt áður en það opnar töflureikni, svarað með hópi sem gæti verið raunverulegur, útreikningunum og skrefunum í appinu."
intro: "Hver leiðarvísir fylgir **einum uppdiktuðum hópi** frá fyrsta útgjaldinu til síðustu skráðu greiðslunnar. Tölurnar eru reiknaðar fyrir þig og skrefin nota skjáina eins og appið nefnir þá."
cta:
  heading: "Ertu með hóp eins og þennan?"
  body: "Stofnaðu aðgang, byrjaðu hóp og bættu við fyrsta útgjaldinu. Reikningsdæmin eru leyst fyrir þig."
cardsHeading: "Veldu þína spurningu"
