meta:
  title: "Masrafları 140 para biriminde bölüşün, çevirerek veya ayrı tutarak"
  description: "Her harcamayı ödediğiniz para biriminde girin, bakiyeleri ayrı tutun veya görebildiğiniz ve değiştirebildiğiniz bir kurla çevirin, sonra kısa bir ödeme listesiyle ödeşin."
h1: "Masrafları 140 para biriminde bölüşün"
navLabel: "Birden fazla para birimi"
lead: "Euro, yen ve baht ile ödenen o tek taksi. Side Badger her harcamayı ödediğiniz para biriminde alır, bakiyeleri düzenli tutar ve grubunuz bir kerede ödeşmeyi tercih ettiğinde çevirebilir. 140 para biriminde çalışır ve [grup gezilerine](page:use-case/group-trips) doğal olarak uyar."
cta:
  heading: "Euronuzu getirin, yeninizi getirin"
  body: "Bir hesap oluşturun, bir grup kurun ve ilk harcamayı elinizde ne para birimi varsa onunla ekleyin."
  button: "Ücretsiz hesap oluştur"
problem:
  heading: "Ödendiği gibi girin"
  body: "Bir gezi nadiren tek para biriminde ödenir. Otel evde sterlinle ayrılmıştır, akşam yemeği yenle ödenmiştir ve havalimanındaki kahve aktarmada ne kullanılıyorsa onunladır. Girmeden önce her şeyi elle çevirmek, tabloların terk edilme biçimidir. Side Badger'da her harcamayı makbuzdaki para biriminde girersiniz ve her tutar kendi para biriminin kurallarını izler; yenin ondalığı yoktur, dinarın üç ondalığı vardır. Son kullandığınız para birimleri listenin başında gelir."
workflow:
  heading: "Para birimlerini ayrı tutun ya da giderken çevirin"
  steps:
    - title: "Harcamayı kendi para biriminde ekleyin"
      body: "Para birimini seçin, tutarı yazın, kimin ödediğini ve kimin paylaştığını söyleyin. Başka bir şey gerekmez. Bu varsayılandır ve orijinal tutarı tam girdiğiniz gibi korur."
      shot: S07
      shotAlt: "Yen cinsinden bir tutar girilmiş harcama formu"
    - title: "Her para birimi için bir bakiye izleyin"
      body: "Bakiyeler para birimi başına ayrı tutulur ve her birinin önerilen ödemelerden oluşan kendi kısa listesi vardır. Sterlin sterlinle, yen yenle ödeşilir."
      shot: S10
      shotAlt: "İki para biriminde sadeleştirilmiş borçlarla bakiye ekranı"
    - title: "Ya da grup bir kerede ödeşmeyi tercih ettiğinde çevirin"
      body: "Harcamayı girerken başka bir para birimi seçin; Side Badger onu güncel bir döviz kuruyla çevirebilir, siz de kuru gerçekte uygulanan kura değiştirebilirsiniz. Çevrilen tutar o para birimindeki bakiyeye eklenir. Çevirme grubun yaptığı bir seçimdir, asla arkanızdan olan bir şey değil."
options:
  heading: "Görebileceğiniz ve değiştirebileceğiniz bir kur"
  items:
    - title: "Kur gösterilir"
      body: "Çevirirken kur ve çevrilen tutar formda görünür; kimsenin bir sayıya körü körüne güvenmesi gerekmez."
    - title: "Kendi kurunuzu yazın"
      body: "Bir döviz bürosundan daha iyi, havalimanından daha kötü bir kur mu aldınız? Kuru uygulananla değiştirin, çevrilen tutar güncellenir."
    - title: "Orijinal kalır"
      body: "Orijinal tutar, çevrilenin yanında harcamada kalır; yen cinsinden ne kadar olduğunu soran herkes için."
    - title: "Çevirmek ücretsizdir"
      body: "Çevirmenin maliyeti yoktur. Bir harcamayı başka bir para biriminde girmek için ücret alınmaz."
