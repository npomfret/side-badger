faq:
  heading: "Cwestiynau am y fila"
  items:
    - q: "Beth os yw rhywun yn canslo?"
      a: "Tynnwch eu nosweithiau allan, gwnewch y symiau eto a golygwch gost y fila fel bod y symiau union yn adio i'r pris unwaith eto. Cedwir y fersiwn gynharach ac mae'r golygiad i'w weld yng ngweithgarwch y grŵp, felly nid yw neb yn newid rhif yn dawel. Mae pwy a gaiff olygu yn dibynnu ar ganiatâd y grŵp."
    - q: "A ddylai'r sawl a archebodd dalu llai?"
      a: "Mater i'r grŵp yw hynny. Mae archebu'n dasg, ac mae grwpiau'n gwahaniaethu ynghylch a yw'n haeddu gostyngiad. Beth bynnag y cytunwch arno, rhowch ef yn y symiau union a'i ysgrifennu mewn nodyn ar y gost, neu mewn sylw wrth ei hymyl, fel nad oes rhaid i neb gofio'r fargen."
    - q: "Allwn ni rannu ffioedd glanhau'n wahanol?"
      a: "Gallwch. Rhowch y ffi i mewn fel cost ar wahân a rhowch ei rhaniad ei hun iddi. Mae cyfartal yn addas i dâl sefydlog am y tŷ cyfan. Mae symiau union yn addas i grŵp sydd eisiau i'r ffi ddilyn y nosweithiau hefyd."
