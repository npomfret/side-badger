featuresHeading: "Funcțiile pe care le folosește asta"
faq:
  heading: "Întrebări"
  items:
    - q: "Pot invitații să vadă grupul fără să se alăture?"
      a: "Nu. Oamenii se alătură cu un link sau un cod QR și un cont gratuit, așa că pot vedea grupul abia după ce au intrat."
    - q: "Poate Side Badger să strângă banii?"
      a: "Nu. Side Badger ține evidența și nu mută niciodată bani. Plătiți-vă unii altora cum preferați, apoi înregistrați plata. Este gratuit, fără reclame și fără limite zilnice; vezi [prețurile](page:pricing)."
    - q: "Pot fi voturile anonime?"
      a: "Da. Când creezi un sondaj poți ascunde cine a votat ce. Setările se pot schimba doar înainte de primul vot."
    - q: "Pot oamenii să contribuie cu sume diferite?"
      a: "Da. Împarte o cheltuială pe sume exacte, ca partea fiecăruia să fie cifra la care ați convenit, sau exclude oamenii care n-au fost implicați."
    - q: "Poate un organizator să țină contabilitatea?"
      a: "Da. Folosește presetarea grupului gestionat, ca doar creatorii și administratorii să schimbe cheltuielile, iar administratorii să aprobe membrii noi."
