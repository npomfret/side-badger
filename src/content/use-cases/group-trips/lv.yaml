featuresHeading: "Uz ko balstās ceļojums"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai cilvēkus, kas izlaida vakariņas, var izlaist?"
      a: "Jā. Izvēlieties, kas piedalījās katrā izdevumā, un tikai viņiem par to tiek rēķināts."
    - q: "Vai tas darbojas bez signāla?"
      a: "Nē. Side Badger vajadzīgs savienojums, tāpēc pievienojiet izmaksas, kad atkal esat pie wifi."
    - q: "Vai ikvienam kaut kas jāinstalē?"
      a: "Nē. Tas darbojas pārlūkprogrammā. Nosūtiet uzaicinājuma saiti, un cilvēki pievienojas no saviem tālruņiem."
    - q: "Kādu valūtas kursu tas izmanto?"
      a: "Pašreizējo valūtas kursu, ievadot izdevumu, vai jūsu pašu, ja dabūjāt citādu. Kurss tiek fiksēts, kad izdevums tiek saglabāts, tāpēc vecie izdevumi nekad netiek pārvērtēti."
    - q: "Vai grupu pēc ceļojuma var iesaldēt?"
      a: "Jā. Administrators var bloķēt grupu, lai skaitļi paliktu nemainīgi."
    - q: "Vai ir summu ierobežojums?"
      a: "Jā. 999 999,99 par izdevumu, savā valūtā."
