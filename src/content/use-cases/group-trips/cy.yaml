meta:
  title: "Rhannu costau taith grŵp, mewn 140 o arian cyfred"
  description: "Cadwch olwg ar bwy dalodd beth ar daith grŵp, rhowch gostau yn yr arian lleol, troswch nhw neu beidio, a setlwch unwaith ar y diwedd. Am ddim, yn eich porwr."
h1: "Rhannu costau taith grŵp, mewn 140 o arian cyfred"
navLabel: "Teithiau grŵp"
lead: "Cadwch olwg ar y fila, y tacsis, a'r un rownd o goctels nad oes neb yn cofio gwirfoddoli i'w phrynu. Mae Side Badger yn cadw'r cyfrif tra byddwch i ffwrdd, yn [trin punnoedd, ewros a 138 o arian cyfred eraill](page:feature/multiple-currencies), ac yn rhoi [rhestr fer o daliadau](page:feature/settle-up) i chi pan gyrhaeddwch adref."
cta:
  heading: "Mathemateg gwyliau, wedi'i wneud cyn i'r lliw haul bylu"
  body: "Creu grŵp, anfon y ddolen wahodd at y bobl ar y daith, ac ychwanegu costau wrth iddynt ddigwydd."
scenario:
  heading: "Mae pawb wedi talu am rywbeth, mewn rhyw arian cyfred"
  body: "Archebodd rhywun yr hediadau, rhoddodd rhywun arall y fila ar gerdyn, a thalodd trydydd person am swper mewn arian parod. Erbyn diwrnod tri, does neb yn gwybod pwy sydd ar y blaen. Mae'r cwestiwn yn syml, hyd yn oed os yw'r ateb fel arfer yn byw mewn taenlen nad oes neb eisiau ei hagor. Pwy dalodd beth, mewn pa arian cyfred, a sut mae pawb yn setlo unwaith ar y diwedd?"
sections:
  - heading: "Cyn i chi fynd"
    body: "Rhowch restr fer y fila i bleidlais, yn ddienw os dymunwch, fel bod y penderfyniad yn perthyn i'r grŵp ac nid i bwy bynnag sy'n pwdu hiraf. Yna cadwch y rhestr siopa a rennir wrth ymyl y biliau siopa, fel nad oes neb yn prynu tri thiwb o eli haul a dim addaswyr plwg."
  - heading: "Tra byddwch i ffwrdd"
    body: "Ychwanegwch bob cost wrth iddi ddigwydd, yn yr arian cyfred y talwyd ynddo. Tynnwch lun o'r dderbynneb ac mae Side Badger yn llenwi'r cyfanswm, y dyddiad a'r lle i chi eu gwirio; mae delweddau derbynebau yn cael eu darllen gan wasanaeth AI Google. Gallwch drosi'r swm ar gyfradd gyfnewid gyfredol, a newid y gyfradd i'r un a gawsoch mewn gwirionedd; mae'r swm gwreiddiol yn aros ar y gost. Neu gadewch yr ewros fel ewros a phenderfynu yn nes ymlaen. Gall grŵp hefyd ddewis un arian cyfred, ac mae costau newydd yn trosi iddo'n awtomatig."
  - heading: "Heb i bawb wneud popeth"
    body: "Hepgorodd rhai y swper, eisteddodd rhai allan o'r cwch. Gadewch nhw allan o'r costau nad oeddent yn rhan ohonynt, a rhannwch y gweddill [yn gyfartal, yn ôl symiau union neu yn ôl canran](page:feature/split-expenses). Does neb yn talu am y rhan o'r daith a dreuliodd yn cysgu."
  - heading: "Setlo unwaith y byddwch adref"
    body: "Mae Side Badger yn awgrymu rhestr fer o daliadau sy'n setlo pawb. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch ef. Gydag arian cyfred cymysg, cadwch bob un ar wahân neu drosi wrth fynd; mae'r enghraifft o Lisbon isod yn dangos y ddau."
  - heading: "Penwythnosau stag a phlu"
    body: "Mae angen ychydig mwy o waith gweinyddol ar benwythnos i ffwrdd gyda gwestai anrhydeddus. Gwnewch ef yn grŵp rheoledig, lle mae gweinyddwyr yn cymeradwyo aelodau newydd a dim ond crewyr a gweinyddwyr all newid costau. Defnyddiwch symiau union ar gyfer cyfran y gwestai anrhydeddus, cyfyngwch y grŵp i'r arian cyfred rydych chi'n ei ddefnyddio mewn gwirionedd, a chlowch y grŵp pan fydd drosodd fel bod y rhifau'n aros yn eu lle."
