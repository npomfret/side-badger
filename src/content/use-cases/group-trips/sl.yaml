featuresHeading: "Na kaj se potovanje opira"
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali lahko izpustim ljudi, ki so izpustili večerjo?"
      a: "Da. Izberi, kdo je sodeloval pri posameznem strošku, in samo njim se zaračuna."
    - q: "Ali deluje brez signala?"
      a: "Ne. Side Badger potrebuje povezavo, zato stroške dodaj, ko se vrneš na wifi."
    - q: "Ali mora vsak kaj namestiti?"
      a: "Ne. Deluje v brskalniku. Pošlji povezavo za povabilo in ljudje se pridružijo s telefonov."
    - q: "Kateri menjalni tečaj uporablja?"
      a: "Trenutni menjalni tečaj ob vnosu stroška ali tvojega, če si dobil drugačnega. Tečaj se določi ob shranitvi stroška, zato se stari stroški nikoli ne revalorizirajo."
    - q: "Ali lahko skupino po potovanju zamrznemo?"
      a: "Da. Skrbnik lahko skupino zaklene, da številke ostanejo."
    - q: "Ali obstaja omejitev zneskov?"
      a: "Da. 999.999,99 na strošek, v njegovi valuti."
