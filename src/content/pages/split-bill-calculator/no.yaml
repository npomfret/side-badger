faq:
  heading: Spørsmål
  items:
    - q: Er kalkulatoren gratis?
      a: Ja. Gratis. Ingen annonser. Ingen daglige grenser. Du trenger heller ingen konto.
    - q: Lagrer den det jeg skriver inn?
      a: Nei. Ingenting lagres eller sendes noe sted. Vil du beholde tallene, bruk «Kopier lenke» og lagre lenken et sted.
    - q: Hvem kan se lenken jeg kopierer?
      a: "Alle som har den. Tallene ligger i selve lenken, etter #-tegnet, så del den bare med dem som skal se dem."
    - q: Flytter den penger?
      a: Nei. Den regner ut hvem som bør betale hvem, og dere betaler hverandre slik dere vil. Side Badger rører heller aldri pengene dine. Se [gjøre opp](page:feature/settle-up).
    - q: Kan jeg dele en tur som er betalt i to valutaer?
      a: Ikke her, for en utregning har én valuta. I en gruppe har hver valuta sin egen saldo. Se [flere valutaer](page:feature/multiple-currencies).
    - q: Hva om beløpene ikke går opp?
      a: Kalkulatoren sier fra under utgiften og viser ikke noe resultat før de gjør det. Nøyaktige beløp må summere seg til totalen, og prosentene må bli 100.
