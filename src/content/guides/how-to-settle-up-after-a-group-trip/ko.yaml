meta:
  title: "그룹 여행이 끝난 뒤 정산하는 방법 | 사이드 배저"
  description: "다들 흩어지기 전에 정산하세요. 얽힌 빚 10건이 결제 4건으로 줄고, 도착하는 대로 기록하며, 일부만 내도 괜찮아요. 친구 다섯 명의 계산을 보여 드립니다."
h1: "그룹 여행이 끝난 뒤 정산하는 방법"
navLabel: "여행 후 정산하기"
lead: "다들 흩어지기 전에 정산하세요. 마지막 지출을 추가하고, 그룹의 잔액을 열어서 짧은 목록에 있는 대로 원하는 방법으로 내 몫을 지불하세요. 그런 다음 사이드 배저에 결제를 기록하면 그룹 모두의 잔액이 정리됩니다. 친구 다섯 명과 지출 다섯 건이라면 얽힌 빚 10건이 결제 4건으로 줄어듭니다."
cta:
  heading: "사진이 도착하기 전에 장부를 닫으세요"
  body: "무료 계정을 만들고, 다음 여행 그룹을 시작하고, 비용이 생길 때마다 추가하세요. 공항에 도착할 즈음이면 짧은 결제 목록이 기다리고 있습니다. 먼저 [정산이 어떻게 되는지](page:feature/settle-up) 보고 싶으신가요?"
sections:
  - heading: "친구 다섯 명, 지출 다섯 건, 출발 라운지 하나"
    body: "Mo, Ines, Raf, Tess, Uma는 일주일 동안 바닷가에서 지냈습니다. Mo는 아파트를 예약하고 장을 봤고, Ines는 보트 투어를, Raf는 큰 저녁을 샀어요. Tess는 Uma, Mo와 함께 공항 택시를 탔는데, Ines와 Raf는 기차를 탔기 때문입니다. Uma는 카드를 집에 두고 와서 아무것도 결제하지 않았고요. 그래서 지출은 다섯 건에 총 €1,700이고, 출발 라운지에서는 아무도 누가 앞서 있는지 말하지 못했습니다."
  - heading: "빚 10건, 결제 4건"
    body: "아파트, 보트, 저녁, 장보기는 다섯 명이 똑같이 나눕니다. 1인당 €200, €50, €60, €18이므로 Ines와 Raf의 부담액은 각각 €328입니다. 택시는 세 명이 1인당 €20씩 나누니 Mo, Tess, Uma의 부담액은 €348입니다. Mo는 €1,090를 결제했고 부담액이 €348이므로 €742를 받을 돈이 있습니다. 나머지는 모두 결제한 돈이 부담액보다 적어요. 모자란 금액은 Uma가 €348, Tess가 €288, Ines가 €78, Raf가 €28이고, 합하면 Mo의 €742입니다. 사람 사이를 하나씩 직접 정산하면 빚이 10건이 됩니다. 사이드 배저는 대신 결제 4건을 제안하며, 모두 Mo에게 갑니다."
  - heading: "다들 흩어지기 전에 정산하세요"
    body: "가장 좋은 때는 마지막 저녁이나 집으로 돌아가는 길입니다. 모두가 한자리에 있고, €28 정도의 빚은 말을 꺼내기 쉬우니까요. 먼저 택시를 포함해 모든 지출을 추가하세요. 줄 돈이나 받을 돈이 있으면 그룹을 나갈 수 없으므로, 어차피 계산은 언젠가 마무리해야 합니다."
    items:
      - "**목록 확인하기.** 그룹을 열고 **잔액**을 보세요. 기본적으로 나와 관련된 빚이 보입니다. **모두 보기**를 선택하면 그룹 전체의 목록이 나옵니다."
      - "**원하는 방법으로 지불하기.** 계좌 이체, 현금, 지난 휴가에서 진 신세. 사이드 배저는 돈을 옮기지 않습니다."
      - "**기록하기.** **정산하기**를 선택하세요. **빠른 정산** 아래의 버튼은 각각 제안된 결제 하나이며, 하나를 선택하면 금액이 채워집니다. **메모**에 계좌 이체 같은 내용을 적고, **날짜**를 확인한(미래일 수 없습니다) 다음 **정산 기록**을 선택하세요."
      - "**정리되는 모습 보기.** 잔액이 모두에게 업데이트됩니다. 마지막 결제가 들어오면 **잔액**에 **모두 정산되었습니다!**가 표시됩니다."
  - heading: "일부는 지금, 나머지는 나중에"
    body: "Uma는 오늘 밤 €200를 보내고 나머지는 월말에 보낼 수 있습니다. €200를 기록하면 양식이 이후에도 Mo에게 €148를 줘야 한다고 알려 주는데, €348에서 €200를 뺀 금액입니다. 저장하면 나머지를 기록할 때까지 €148가 Uma의 잔액에 남아요. 경고는 반대 방향으로도 작동합니다. 실수로 0이 하나 붙어 €348이 €3,480이 되면, 양식은 Uma가 Mo에게 줄 돈이 €348뿐이며 저장하면 반대 방향의 빚이 생긴다고 알려 줍니다. 저장하기 전에 0을 고치세요."
  - heading: "실수 고치기, 결제 축하하기"
    items:
      - "**잘못된 결제.** 결제를 기록한 사람만 수정할 수 있습니다. 기록한 사람이나 그룹 관리자는 삭제할 수 있고, 그러면 다시 기록할 수 있어요."
      - "**눈에 띌 만한 결제.** 기록된 모든 결제는 날짜, 메모와 함께 **정산**에 남아 그룹의 모든 사람이 보고 반응할 수 있습니다. Uma의 마지막 €148가 도착하면 Mo가 **축하**를 선택할 수 있어요."
      - "**끝.** 모든 잔액이 0이 되면 관리자가 그룹을 잠가서 숫자가 그대로 유지되게 할 수 있습니다."
  - heading: "사이드 배저가 하지 않는 일"
    items:
      - "돈을 옮기지 않습니다. 결제 링크도 결제 요청도 없으므로, 앱에서의 결제는 다른 곳에서 이뤄진 결제의 기록입니다."
      - "알림을 보내지 않습니다. 늦은 결제를 독촉하는 일은 여전히 여러분 몫입니다."
      - "기한을 정하지 않습니다. Uma가 나머지 €148를 언제까지 낼지는 그룹이 합의할 일입니다."
      - "제안되는 결제는 짧은 목록일 뿐, 가능한 가장 짧은 목록이라는 약속은 아닙니다. 통화별로 계산되므로, 유로와 파운드로 결제한 여행이라면 통화마다 목록이 생깁니다."
exampleAfter: 2
