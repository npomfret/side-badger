faq:
  heading: "أسئلة"
  items:
    - q: "هل أستطيع الاستفسار عن حصتي وحدها؟"
      a: "لا. السؤال يُبقي المصروف كله خارج الأرصدة، لكل من فيه. وإذا كان التقسيم وحده هو الخاطئ، فالحل تعديل التقسيم."
    - q: "من يستطيع إغلاق السؤال؟"
      a: "من طرحه، أو مشرف المجموعة. وإذا لم يكن من أضاف المصروف مشرفاً، فلا يستطيع إغلاقه نيابة عن السائل."
    - q: "هل يمحو تعديل المصروف النسخة الأصلية؟"
      a: "لا. تُحفظ النسخة السابقة. ومن يستطيع التعديل تحدده أذونات المجموعة، فمن الأفضل إخبار البيت أولاً، لأن الأرصدة تتغير."
