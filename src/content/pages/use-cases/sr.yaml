meta:
  title: "Side Badger за цимере, путовања и журке"
  description: "Дели трошкове са цимерима, на групним путовањима и за журке, свадбе и заједничке поклоне. Погледај шта Side Badger ради за сваку врсту групе."
h1: "Side Badger за твоју врсту групе"
navLabel: "Примери коришћења"
lead: "Цимери, одмори, девојачке и момачке вечери. Изабери свој хаос, а затим погледај како група као твоја води евиденцију."
intro: "Свака група дели трошкове мало другачије. Ове странице прате **реалистичан сценарио** од првог трошка до последње забележене уплате, уз приказане прорачуне, па можеш видети до чега би дошла твоја група."
cta:
  heading: "Препознајеш ли своју врсту групе?"
  body: "Направи кориснички налог, оснуј групу и додај први трошак. Треба неколико минута."
cardsHeading: "Изабери ситуацију која је најближа твојој"
sections:
  - heading: "Групна путовања"
    body: "Летови у фунтама, вила у еврима и вечера коју су јеле само три особе. Подеси групу да претвара у фунте и четири пријатеља у Лисабону заврше са три уплате уместо шест, колико их је кад се валуте воде посебно. [Дели трошкове групног путовања](page:use-case/group-trips)."
  - heading: "Цимери"
    body: "Једна особа плаћа станодавцу, друга се сети рачуна за струју и нико се не слаже ко је купио тоалет папир. Уз кирију подељену по величини собе и остале рачуне подељене једнако, четворо цимера месец заврши са три уплате, све ономе ко је платио кирију. [Дели кућне рачуне са цимерима](page:use-case/housemates)."
  - heading: "Журке, свадбе и заједнички поклони"
    body: "Шесторо људи гласа за поклон, један га купи, а не доприноси свако исти износ. Поклон од 150 £ подељен по тачним износима оставља пет уплата особи која га је купила, укупно 120 £. [Дели трошкове догађаја](page:use-case/events-and-celebrations)."
  - heading: "Парови"
    body: "Дели досадне трошкове, а да вечера за двоје не постане тромесечни финансијски преглед. Кирија подељена 60/40 и намирнице подељене једнако своде се на једну уплату између вас двоје. [Дели трошкове као пар](page:use-case/couples)."
  - heading: "Прво погледај како ради"
    body: "Сваки од горњих примера користи исте кораке, од прављења групе до бележења уплата. [Како ради](page:how-it-works) их пролази, [водичи](page:guides) обрађују по једну тешку ситуацију, а [ценовник](page:pricing) каже колико кошта, а то је ништа, без огласа и без дневних ограничења."
faq:
  heading: "Питања"
  items:
    - q: "Да ли свако у групи треба кориснички налог?"
      a: "Да. Људи се придружују везом или QR кодом и бесплатним корисничким налогом."
    - q: "Може ли Side Badger да прикупља новац?"
      a: "Не. Плаћаш како год желиш, а затим забележиш уплату да стања остану тачна."
    - q: "Морам ли да изаберем једну врсту групе?"
      a: "Не. Примери коришћења су примери, а не подешавања. Свака група има исте функције, па користи оно што ти одговара."
