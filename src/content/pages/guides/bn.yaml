meta:
  title: "খরচ ন্যায্যভাবে ভাগ করার গাইড | Side Badger"
  description: "ভাড়া, ছুটির ভিলা আর গ্রুপের খরচ ন্যায্যভাবে ভাগ করার ব্যবহারিক গাইড, প্রতিটিতে একটি বাস্তবসম্মত গ্রুপ আর পুরো অঙ্ক কষে দেখানো।"
h1: "খরচ ন্যায্যভাবে ভাগ করার গাইড"
navLabel: "গাইড"
lead: "স্প্রেডশিট খোলার ঠিক আগে মানুষ যে প্রশ্নগুলো করে, তার উত্তর: একটি বাস্তবসম্মত গ্রুপ, পুরো অঙ্ক আর অ্যাপের ধাপসহ।"
intro: "প্রতিটি গাইড **একটি কাল্পনিক গ্রুপকে** প্রথম খরচ থেকে শেষ রেকর্ড করা পেমেন্ট পর্যন্ত অনুসরণ করে। অঙ্কগুলো আপনার জন্য কষা আছে, আর ধাপগুলোতে স্ক্রিনগুলোর নাম অ্যাপে যেমন আছে তেমনই ব্যবহার করা হয়েছে।"
cta:
  heading: "আপনার গ্রুপটাও কি এমন?"
  body: "অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম খরচটা যোগ করুন। অঙ্কগুলো আপনার হয়ে কষা হয়ে যায়।"
cardsHeading: "আপনার প্রশ্নটি বেছে নিন"
