meta:
  title: "De kosten van een vrijgezellenweekend verdelen | Side Badger"
  description: "De eregast betaalt niets en tegen maandag praat iedereen nog met elkaar. Zo verdeel je een vrijgezellenweekend, sommen inbegrepen."
h1: "Hoe verdeel je de kosten van een vrijgezellenweekend"
navLabel: "Vrijgezellenweekend"
lead: "De eregast betaalt niets, dus de rest van de groep verdeelt elke kost [gelijk](page:feature/split-expenses) onder elkaar. Laat mensen weg uit de kosten die ze overslaan en hou de eregast buiten de groep, zodat de verrassing blijft."
cta:
  heading: "Hou de rekening bij, hou de verrassing"
  body: "Maak een groep, stuur de link naar iedereen behalve de eregast en voeg elke kost toe zodra hij gebeurt. Side Badger is gratis, zonder advertenties en zonder dagelijkse limieten."
sections:
  - heading: "Vier vrienden en één verrassing"
    body: "Hannah, Isla, Jess en Kat nemen Grace mee voor haar vrijgezellenweekend. Grace is de eregast, dus zij betaalt nergens voor. Ze zit ook niet in de groep, dus ze kan niet zien wat haar vrienden aan haar uitgeven. Hannah boekt het huisje, Isla betaalt de spadag, Jess neemt het diner voor haar rekening en Kat betaalt de taxi. Tegen zondag heeft iedereen iets betaald en kan niemand zeggen wie er voor staat. De sommen zijn dezelfde voor elk vrijgezellenweekend, wie de eregast ook is."
  - heading: "Deel door de mensen die betalen, niet door de mensen die er zijn"
    body: "Het aandeel van de eregast verdwijnt niet. Het wordt verdeeld. Het huisje kost £ 720 en vier vrienden betalen het, dus dat is £ 180 per persoon, en de plaats van Grace zit al in dat bedrag. Het diner is £ 260, dus £ 65 per persoon. De taxi is £ 44, dus £ 11 per persoon. Wat iemand overslaat, gaat enkel van die uitgave af. Kat slaat de spa over, dus de £ 360 daarvan, waarin ook de plaats van Grace zit, wordt door Hannah, Isla en Jess gedeeld aan £ 120 per persoon. Tel alles op en Hannah, Isla en Jess zijn elk £ 376 schuldig voor het weekend, en Kat £ 256."
  - heading: "Zet het op in Side Badger"
    items:
      - "Maak een groep voor het weekend en geef ze een saaie naam, zoals Huisjesweekend. Grace is geen lid en alleen leden van een groep kunnen ze zien."
      - "Kies **Anderen uitnodigen** en stuur de link, of toon de QR-code, alleen op een plek waar Grace het niet ziet. De link toont een voorvertoning van de groep voordat iemand lid wordt. Kies hoe lang hij geldig blijft, van 15 minuten tot 5 dagen. Een oude link blijft werken tot hij verloopt, dus laat hem niet langer openstaan dan nodig."
      - "Kies voor elke kost **Uitgave toevoegen**, voer het bedrag in en kies de betaler bij **Wie heeft betaald?** Vink bij **Verdelen tussen** de mensen aan die betalen en laat wie het oversloeg weg, zoals Kat voor de spa. Kies **Gelijk** bij **Hoe te verdelen**."
      - "Als je thuis bent, open je de **Saldi** van de groep. Side Badger toont wie wie iets schuldig is en stelt een korte lijst betalingen voor. Hier zijn het er drie: Kat betaalt Hannah £ 212, Jess betaalt Hannah £ 116 en Isla betaalt Hannah £ 16. Betaal elkaar zoals je wilt en gebruik dan **Vereffenen** om elke betaling te registreren."
  - heading: "Voor je boekt, een budget en een voorschot"
    body: "Spreek het budget af voordat iemand boekt. Kies **Poll toevoegen**, vraag hoeveel de groep aan het huisje wil uitgeven en geef een paar bedragen als opties. Zet **Anoniem stemmen** aan wanneer je de peiling maakt, om te verbergen wie waarvoor stemde, zodat niemand een lager budget luidop hoeft te verdedigen. Sluit de peiling zodra iedereen gestemd heeft en de winnaar verschijnt. Dan komt het voorschot. Wie boekt, betaalt het en voegt het toe als uitgave, gelijk verdeeld, en het resterende bedrag komt als tweede uitgave erbij wanneer het betaald moet worden. De anderen kunnen meteen hun aandeel overmaken en de betaling registreren, of wachten op de eindrekening. De saldi komen in beide gevallen op hetzelfde uit."
  - heading: "Als iemand maar één nacht meekomt"
    body: "Iemand die enkel voor zaterdag komt, hoeft niet voor vrijdag te betalen. Laat die persoon weg uit de kosten waar hij of zij geen deel van uitmaakte. Hangt de kost af van hoelang elke persoon blijft, zoals een kamer, kies dan **Exacte bedragen** bij **Hoe te verdelen** en typ het aandeel van elke persoon, dat samen het totaal moet zijn. Bereken eerst een prijs per persoon per nacht en vermenigvuldig die met het aantal nachten dat elke persoon blijft. De pagina [groepsreizen](page:use-case/group-trips) zegt meer over kosten die niet voor iedereen hetzelfde zijn."
  - heading: "Wat Side Badger hier niet doet"
    items:
      - "Het verplaatst nooit geld. Jullie betalen elkaar via bankoverschrijving, cash of wat past, en registreren de betaling dan zodat de saldi voor iedereen bijgewerkt worden."
      - "Het stuurt geen betalingsherinneringen. Een vriendelijk duwtje in de groepschat blijft een mensenzaak."
      - "Elke uitgave heeft één betaler en Side Badger kan een bonnetje niet regel per regel verdelen. Als twee kaarten het huisje betaalden, voer je het in als twee uitgaven. Als sommige mensen extra’s bestelden bij het diner, voer je die extra’s in als een eigen uitgave."
      - "Het houdt het geld bij, niet het programma. Peilingen en opmerkingen blijven bij de kosten, dus de plannen voor het weekend blijven in jullie groepschat."
