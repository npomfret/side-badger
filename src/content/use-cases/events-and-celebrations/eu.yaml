featuresHeading: Zertan oinarritzen den
faq:
  heading: Galderak
  items:
    - q: Gonbidatuek taldea ikus dezakete sartu gabe?
      a: Ez. Jendea esteka edo QR kode batekin eta doako kontu batekin sartzen da, beraz sartu ondoren ikus dezakete taldea.
    - q: Side Badger-ek dirua bil dezake?
      a: Ez. Side Badger-ek kontua eramaten du eta ez du inoiz dirurik mugitzen. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa. Doakoa da, iragarkirik gabe eta eguneko mugarik gabe; ikusi [prezioak](page:pricing).
    - q: Botoak anonimoak izan daitezke?
      a: Bai. Inkesta sortzen duzunean, nork zer bozkatu duen ezkuta dezakezu. Ezarpenak lehen botoaren aurretik bakarrik alda daitezke.
    - q: Jendeak zenbateko desberdinak jar ditzake?
      a: Bai. Banatu gastu bat zenbateko zehatzen arabera, pertsona bakoitzaren zatia adostu duzuen zifra izan dadin, edo utzi kanpoan parte ez zuten pertsonak.
    - q: Antolatzaile batek kontuak eraman ditzake?
      a: Bai. Erabili kudeatutako taldearen aurrezarpena, sortzaileek eta administratzaileek bakarrik alda ditzaten gastuak eta administratzaileek kide berriak onar ditzaten.
