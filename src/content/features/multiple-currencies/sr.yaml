sections:
  - heading: "Једна валута за целу групу"
    body: "Ако група о томе радије не мисли, изабери валуту групе и образац у њу претвара сваки нови трошак, по курсу који и даље видиш и можеш променити. То важи само за нове и копиране трошкове. Измене и постојећи трошкови остају какви јесу, па се ништа већ забележено не мења испод тебе."
  - heading: "Дугујеш евре, плаћаш у фунтама"
    body: "Плаћено у јенима, а поравнаваш у фунтама? У реду. Кад бележиш уплату, можеш је такође претворити, па ко дугује евре може платити у фунтама, а стање у еврима и даље излази тачно. Платите једни другима како год желите, а затим забележите."
  - heading: "Правила за групу"
    body: "Ограничи групу на валуте које стварно користите и подеси подразумевану да се образац отвара на правој. Одмор у Португалу не треба 139 других опција уз рачун за вечеру, а [свадба у иностранству](page:use-case/events-and-celebrations) вероватно треба две."
limits:
  heading: "Ограничења"
  items:
    - "Курс се утврђује кад се трошак сачува. Стари трошкови се никад не ревалоризују."
    - "Side Badger преузима актуелни курс где може. Није сваки пар загарантован, а курс увек можеш уписати сам."
    - "Аутоматско претварање у групи важи само за нове и копиране трошкове, не за измене ни постојеће трошкове."
    - "Сваки трошак ограничен је на 999.999,99 у својој валути."
    - "Постоји 140 валута. Криптовалуте и метали нису међу њима."
    - "Side Badger бележи уплате. Никад не премешта ни не размењује новац."
useCasesHeading: "Где ово помаже"
faq:
  heading: "Питања"
  items:
    - q: "Који девизни курс користите?"
      a: "Актуелни девизни курс, преузет при уносу трошка где је доступан. Можеш га променити у онај који је важио при размени и претворени износ се ажурира."
    - q: "Да ли се стари трошкови ревалоризују?"
      a: "Не. Курс се утврђује кад се трошак сачува, па стање не одлази само зато што се тржиште померило."
    - q: "Да ли подржавате крипто?"
      a: "Не. Постоји 140 валута, а криптовалуте нису међу њима."
    - q: "Зашто не могу да унесем 2.000.000 индонежанских рупија?"
      a: "Сваки трошак ограничен је на 999.999,99 у својој валути. Унеси га у другој валути и претвори или га подели на два трошка."
    - q: "Да ли претварање икако кошта?"
      a: "Не. Претварање је бесплатно, као и остатак Side Badger-а. Погледај [ценовник](page:pricing)."
    - q: "Морам ли да претварам?"
      a: "Не. Валуте остају посебне осим ако ти или твоја група одлучите да претварате, а свака валута има сопствени кратак списак уплата."
