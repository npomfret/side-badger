meta:
  title: "అద్దె పంపకం కాలిక్యులేటర్: గది లేదా ఆదాయం | Side Badger"
  description: "పెద్ద గది, పెద్ద వాటా? గది పరిమాణం లేదా ఆదాయం ప్రకారం ప్రతి రూమ్‌మేట్ ఎంత చెల్లించాలో లెక్కించండి. బ్రౌజర్‌లోనే, ఏదీ సేవ్ కాదు, పంపబడదు."
h1: "అద్దె పంపకం కాలిక్యులేటర్"
navLabel: "అద్దె పంపకం కాలిక్యులేటర్"
lead: "పెద్ద బెడ్‌రూమ్, పెద్ద వాటా? అద్దె టైప్ చేయండి, గది పరిమాణం లేదా ఆదాయం ప్రకారం ప్రతి ఒక్కరూ ఎంత చెల్లిస్తారో పైసా వరకు చూడండి. ఇది మీ బ్రౌజర్‌లోనే నడుస్తుంది, ఏదీ సేవ్ చేయదు, డబ్బును కదిలించదు. ఇంటి లెక్క ఉంచాలనుకున్నప్పుడు, Side Badgerలో [ఖర్చులను పంచండి](page:feature/split-expenses), ప్రతి నెలా అద్దెను కాపీ చేయండి."
cta:
  heading: "శాతాలను ఒక్కసారి తేల్చండి. ఎప్పటికీ కాపీ చేయండి."
  body: "ట్యాబ్ మూసేస్తే ఈ కాలిక్యులేటర్ అంతా మర్చిపోతుంది, బ్రాడ్‌బ్యాండ్ బిల్లు కచ్చితంగా తానే కట్టానని చెప్పే రూమ్‌మేట్‌లాగే. Side Badger గ్రూప్ అద్దెను, బిల్లులను, ఎవరు ఏం చెల్లించారో ఉంచుతుంది. ఇది ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
sections:
  - heading: "అద్దెను పంచుకునే రెండు మార్గాలు"
    items:
      - "**గది పరిమాణం ప్రకారం.** అద్దెలో కొంత భాగం వంటగది, బాత్రూమ్, హాల్‌కు వెళ్తుంది, వాటిని అందరూ వాడతారు. ఆ వాటాను మీరు ఎంచుకుంటారు (మొదట 40%), అది సమానంగా పంచబడుతుంది. మిగిలినది బెడ్‌రూమ్ విస్తీర్ణం ప్రకారం వెళ్తుంది, కాబట్టి పెద్ద గది ఎక్కువ చెల్లిస్తుంది, స్టోర్ రూమ్‌కు అది సంపాదించుకున్న తగ్గింపు దక్కుతుంది."
      - "**ఆదాయం ప్రకారం.** మొత్తం ఆదాయంలో తాము సంపాదించిన వాటా ఎంతో, అద్దెలో అంతే వాటాను ప్రతి ఒక్కరూ చెల్లిస్తారు. ఉమ్మడి బిల్లులు జోడిస్తే అవి అవే వాటాలను అనుసరిస్తాయి."
  - heading: "లెక్కలు ఎలా పనిచేస్తాయి"
    body: "ప్రతి ఒక్కరికీ ముందు కచ్చితమైన వాటా వస్తుంది, తర్వాత పూర్తి శాతం, ఎందుకంటే పూర్తి సంఖ్యలను టైప్ చేయడం, వాటిపై వాదించడం తేలిక. రౌండింగ్ గరిష్ఠ మిగులు పద్ధతిలో జరుగుతుంది: ప్రతి ఒక్కరూ తమ వాటా కంటే కింది పూర్తి సంఖ్యను ఉంచుకుంటారు, మిగిలిన పాయింట్లు అత్యధికంగా కోల్పోయినవారికి వెళ్తాయి. శాతాల మొత్తం ఎప్పుడూ 100. కింది ఫ్లాట్‌లో ఉమ్మడి 40% ఒక్కొక్కరికి 13.33%. Priya గది ఫ్లాట్‌లోని 38 m²లో 16, కాబట్టి 60% × 16/38 అంటే 25.26%, దానికి 13.33% కలిపితే 38.6%, అది 39%కి రౌండ్ అవుతుంది. Tom, Aisha 32%, 29% వస్తారు, 39 + 32 + 29 అంటే 100. ప్రతి మొత్తం అద్దెలో ఆ శాతమే: £1,950లో 39% అంటే £760.50."
  - heading: "తర్వాత Side Badgerలో టైప్ చేయండి"
    body: "మొత్తం కథ కోసం, టేప్ కొలతతో సహా, [గది పరిమాణం ప్రకారం అద్దె ఎలా పంచాలి](page:guide/how-to-split-rent-by-room-size) చూడండి, జంటల కోసం అయితే [ఎక్కువ సంపాదించే భాగస్వామి](page:guide/how-to-split-bills-with-a-partner-who-earns-more) చూడండి."
    items:
      - "**అద్దెను జోడించండి.** మీ గ్రూప్‌లో **ఖర్చును జోడించు** ఎంచుకోండి, **ఎవరు చెల్లించారు?** కింద ఇంటి యజమానికి ఎవరు చెల్లించారో ఎంచుకోండి, **ఎవరి మధ్య విభజించాలి**లో అందరినీ ఉంచండి."
      - "**శాతం ఎంచుకోండి.** **ఎలా విభజించాలి** కింద **శాతం** ఎంచుకుని పూర్తి శాతాలను టైప్ చేయండి. అవి 100 కాకపోతే ఫారం చెబుతుంది."
      - "**వచ్చే నెల కాపీ చేయండి.** గత నెల అద్దెను తెరిచి **ఖర్చును కాపీ చేయి** ఎంచుకోండి. పంపకం దానితో పాటే వస్తుంది."
  - heading: "కాలిక్యులేటర్ చేయనివి"
    items:
      - "**మీ గదులను కొలవడం.** విస్తీర్ణం ఒక ప్రారంభ బిందువు మాత్రమే. అటాచ్డ్ బాత్రూమ్ ఉన్న గది అది లేని అదే విస్తీర్ణం గది కంటే విలువైనది, మంచం, ఒక ఆశావహమైన కుర్చీ మాత్రమే పట్టే స్టోర్ రూమ్ విలువ తక్కువ."
      - "**ఆదాయం అంటే ఏమిటో నిర్ణయించడం.** చేతికి వచ్చేదా, స్థూలమా, జీతమా, సైడ్ హస్టలా: గ్రూప్ నిర్ణయిస్తుంది. అందరికీ ఒకే కాలాన్ని వాడండి."
      - "**ఏదైనా సేవ్ చేయడం.** ట్యాబ్ మూసేస్తే అంకెలు పోతాయి. వాటిని ఉంచుకోవాలంటే లింక్‌ను కాపీ చేయండి. అందులో మీ అంకెలు # తర్వాత ఉంటాయి, బ్రౌజర్లు వాటిని సర్వర్‌కు ఎప్పుడూ పంపవు, లింక్ ఉన్నవాళ్లు వాటిని చదవగలరు."
      - "**డబ్బు కదిలించడం.** ఇంటి యజమానికి మీకు నచ్చిన విధంగా చెల్లించండి."
      - "**కరెన్సీలను కలపడం, లేదా పరిమితులు దాటడం.** ఒక కరెన్సీని ఎంచుకోండి. ఇది 2 నుండి 10 మందిని, 999,999.99 వరకు అద్దెను తీసుకుంటుంది, యాప్‌లో లాగే."
exampleAfter: 2
