meta:
  title: "Side Badger برای هم‌خانه‌ها، سفرها و مهمانی‌ها"
  description: "هزینه‌ها را با هم‌خانه‌ها، در سفرهای گروهی و برای مهمانی‌ها، عروسی‌ها و کادوهای گروهی تقسیم کنید. ببینید Side Badger برای هر نوع گروه چه می‌کند."
h1: "Side Badger برای نوع گروه شما"
navLabel: "کاربردها"
lead: "هم‌خانه‌ها، تعطیلات، مهمانی‌های پیش از عروسی. آشفتگی خودتان را انتخاب کنید، بعد ببینید گروهی مثل شما چطور حساب نگه می‌دارد."
intro: "هر گروهی هزینه‌ها را کمی متفاوت تقسیم می‌کند. این صفحه‌ها یک **سناریوی واقع‌بینانه** را از اولین هزینه تا آخرین پرداخت ثبت‌شده دنبال می‌کنند، با محاسبه‌ها، تا ببینید گروه خودتان به چه چیزی می‌رسد."
cta:
  heading: "نوع گروه خودتان را پیدا کردید؟"
  body: "یک حساب بسازید، گروه را شروع کنید و اولین هزینه را اضافه کنید. چند دقیقه بیشتر طول نمی‌کشد."
  button: "ساخت حساب رایگان"
cardsHeading: "نزدیک‌ترین وضعیت به وضعیت خودتان را انتخاب کنید"
sections:
  - heading: "سفرهای گروهی"
    body: "پرواز به پوند، ویلا به یورو و شامی که فقط سه نفر خوردند. گروه را روی تبدیل به پوند تنظیم کنید تا چهار دوست در لیسبون با سه پرداخت تمام کنند، به‌جای شش پرداخت وقتی ارزها جدا نگه داشته می‌شوند. [تقسیم هزینه‌های سفر گروهی](page:use-case/group-trips)."
  - heading: "هم‌خانه‌ها"
    body: "یک نفر به صاحبخانه می‌پردازد، یکی دیگر قبض انرژی را یادش است و کسی روی اینکه دستمال‌توالت را چه کسی خرید توافق ندارد. با اجاره‌ای که بر اساس اندازه اتاق تقسیم شده و قبض‌های دیگری که مساوی تقسیم شده‌اند، چهار هم‌خانه ماه را با سه پرداخت تمام می‌کنند، همه به همان کسی که اجاره را داده است. [تقسیم قبض‌های خانه با هم‌خانه‌ها](page:use-case/housemates)."
  - heading: "مهمانی‌ها، عروسی‌ها و کادوهای گروهی"
    body: "شش نفر روی کادو رأی می‌دهند، یک نفر آن را می‌خرد و همه یک مبلغ نمی‌دهند. یک کادوی £150 که با مبلغ دقیق تقسیم شده پنج پرداخت به خریدار می‌ماند، روی هم £120. [تقسیم هزینه‌های یک مراسم](page:use-case/events-and-celebrations)."
  - heading: "زوج‌ها"
    body: "هزینه‌های خسته‌کننده را تقسیم کنید، بی‌آنکه قرار شام تبدیل به جلسه مالی فصلی شود. اجاره 60/40 و خواربار مساوی تقسیم‌شده به یک پرداخت بین شما دو نفر خلاصه می‌شود."
  - heading: "اول ببینید چطور کار می‌کند"
    body: "همه مثال‌های بالا همان مرحله‌ها را دارند، از ساخت گروه تا ثبت پرداخت‌ها. [نحوه کار](page:how-it-works) آن‌ها را مرور می‌کند و [قیمت‌ها](page:pricing) می‌گوید چقدر هزینه دارد، که هیچ است، بدون تبلیغات و بدون محدودیت روزانه."
faq:
  heading: "پرسش‌ها"
  items:
    - q: "آیا همه اعضای گروه به حساب نیاز دارند؟"
      a: "بله. افراد با پیوند یا کد QR و یک حساب رایگان می‌پیوندند."
    - q: "آیا Side Badger می‌تواند پول جمع کند؟"
      a: "نه. هر طور دوست دارید پرداخت می‌کنید، بعد پرداخت را ثبت می‌کنید تا مانده‌ها درست بمانند."
    - q: "باید حتماً یک نوع گروه انتخاب کنم؟"
      a: "نه. کاربردها نمونه‌اند، نه تنظیمات. هر گروهی همین امکانات را دارد، پس هر ترکیبی که به کارتان می‌آید استفاده کنید."
