meta:
  title: Split group trip costs, in 140 currencies
  description: Track who paid what on a group trip, enter costs in the local currency, convert them or not, and settle once at the end. Free, in your browser.
h1: Split group trip costs, in 140 currencies
navLabel: Group trips
lead: Track the villa, the taxi, and the one cocktail round nobody remembers volunteering to buy. Side Badger keeps the running count while you're away, [handles pounds, euros and whatever else turns up](page:feature/multiple-currencies), and gives you a [short list of payments](page:feature/settle-up) when you get home.
cta:
  heading: Holiday maths, done before the tan fades
  body: Create a group, send the invite link to the people on the trip, and add costs as they happen.
  button: Create a free account
scenario:
  heading: Everyone paid for something, in some currency
  body: Somebody booked the flights, somebody else put the villa on a card, and a third person covered dinner in cash. By day three nobody knows who is ahead. The question is simple, even if the answer usually lives in a spreadsheet nobody wants to open. Who paid what, in which currency, and how does everyone settle once at the end?
sections:
  - heading: Before you go
    body: Put the villa shortlist to a vote, anonymously if you like, so the decision belongs to the group and not to whoever sulks longest. Then keep the shared shopping list next to the shopping bills, so nobody buys three tubes of sun cream and no plug adaptors.
  - heading: While you're away
    body: Add each cost as it happens, in the currency you paid it in. Snap the receipt and Side Badger fills in the total, date and place for you to check; receipt images are read by Google's AI service. Convert the amount at a current exchange rate, which you can change to the rate you actually got, and the original amount stays on the expense. Or leave the euros as euros and decide later. A group can also pick one currency, and new expenses convert into it automatically.
  - heading: Not everyone did everything
    body: Some people skipped the dinner, some sat out the boat. Leave them out of the costs they weren't part of, and split the rest equally, by exact amounts or by percentage. Nobody pays for the part of the trip they spent asleep.
  - heading: Settle once you're home
    body: Side Badger suggests a short list of payments that settles everyone. Pay each other however you like, then record it. With mixed currencies you choose how it looks, and the Lisbon example below shows both.
  - heading: Stag and hen weekends
    body: A weekend away with a guest of honour needs a little more admin. Make it a managed group, where admins approve new members and only creators and admins can change expenses. Use exact amounts for the guest of honour's share, limit the group to the currencies you're actually using, and lock the group when it's over so the numbers stay put.
exampleAfter: 4
example:
  heading: Four friends in Lisbon
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: chloe
      name: Chloé
    - id: dev
      name: Dev
  expenses:
    - label: Flights
      payer: ana
      amount: 480
      split:
        method: equal
    - label: Villa
      payer: ben
      amount: 900
      currency: EUR
      split:
        method: equal
    - label: Dinner
      payer: chloe
      amount: 120
      currency: EUR
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: Boat trip
      payer: dev
      amount: 160
      currency: EUR
      split:
        method: equal
  conversion:
    rates:
      EUR: 0.85
featuresHeading: What a trip leans on
faq:
  heading: Questions
  items:
    - q: Can people who skipped dinner be left out?
      a: Yes. Pick who was part of each expense and only they are charged for it.
    - q: Does it work without signal?
      a: No. Side Badger needs a connection, so add the costs once you're back on wifi.
    - q: Does everyone need to install something?
      a: No. It runs in the browser. Send the invite link and people join from their phones.
    - q: Which exchange rate does it use?
      a: A current exchange rate when you enter the expense, or your own if you got a different one. The rate is fixed when the expense is saved, so old expenses are never revalued.
    - q: Can we freeze the group after the trip?
      a: Yes. An admin can lock the group so the numbers stay put.
    - q: Is there a limit on amounts?
      a: Yes. 999,999.99 per expense, in its own currency.
