meta:
  title: ルームメイト、旅行、パーティーに使えるSide Badger
  description: ルームメイトとの生活費、グループ旅行、パーティー、結婚式、みんなでの贈り物の費用を分け合います。グループの種類ごとにSide Badgerでできることを紹介します。
h1: あなたのグループに合ったSide Badger
navLabel: 活用シーン
lead: ルームシェア、休暇、女子会。あなたのカオスを選んで、同じようなグループがどう記録しているか見てみましょう。
intro: 費用の分け方はグループごとに少しずつ違います。このページでは、最初の支出から最後に記録する支払いまでを**現実的なシナリオ**で追い、計算も示しているので、自分のグループがどうなるかをイメージできます。
cta:
  heading: あなたのグループは見つかりましたか？
  body: アカウントを作成し、グループを始めて、最初の支出を追加しましょう。数分で済みます。
  button: 無料アカウントを作成
cardsHeading: 自分に一番近い状況を選ぶ
sections:
  - heading: グループ旅行
    body: ポンドの航空券、ユーロのヴィラ、3人しか食べなかった夕食。グループの通貨をポンドに換算する設定にすると、リスボンの4人の友だちは3回の支払いで済み、通貨を別々にした場合の6回より少なくなります。[グループ旅行の費用を割り勘する](page:use-case/group-trips)。
  - heading: ルームメイト
    body: 一人が家主に支払い、別の人が光熱費を覚えていて、トイレットペーパーを誰が買ったかは誰も一致しない。家賃を部屋の広さで、それ以外の請求を均等に分けると、4人のルームメイトは月末に3回の支払いで済み、すべて家賃を払った人宛てです。[ルームメイトと生活費を割り勘する](page:use-case/housemates)。
  - heading: パーティー、結婚式、みんなでの贈り物
    body: 6人が贈り物に投票し、1人が購入し、全員が同じ金額を出すとは限りません。£150の贈り物を金額指定で分けると、購入した人への支払いが5回で、合計£120になります。[イベントの費用を割り勘する](page:use-case/events-and-celebrations)。
  - heading: カップル
    body: 地味な出費も、デートの夜を四半期決算会議にせずに分け合えます。家賃を60/40で、食料品を均等に分けると、2人の間の支払いは1回にまとまります。
  - heading: まずは使い方を見る
    body: 上の例はどれも、グループの作成から支払いの記録まで同じステップを使っています。[使い方](page:how-it-works)で流れを確認でき、費用については[料金](page:pricing)で、無料で、広告も1日の制限もないことをお伝えしています。
faq:
  heading: よくある質問
  items:
    - q: グループの全員にアカウントが必要ですか？
      a: はい。リンクまたはQRコードと、無料アカウントで参加します。
    - q: Side Badgerでお金を集められますか？
      a: いいえ。支払いは好きな方法で行い、そのあと支払いを記録して残高を正しく保ちます。
    - q: グループの種類を1つ選ぶ必要がありますか？
      a: いいえ。活用シーンは例であって、設定ではありません。どのグループも同じ機能を持っているので、合う組み合わせで使ってください。
