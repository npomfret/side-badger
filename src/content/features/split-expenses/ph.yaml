sections:
  - heading: Ang mga nandoon lang
    body: Hatiin ang gastos sa lahat, o sa mga nagsalo lang dito. Huwag isama ang mga hindi kasali sa gastos, at makikita iyon sa mga balanse. Ang housemate na wala buong linggo ay hindi may utang sa takeout, na makikilala ng mga [housemate](page:use-case/housemates) bilang batayang katarungan.
  - heading: Ang mga detalyeng pumipigil sa away sa susunod
    items:
      - Itakda ang **petsa** at opsyonal na oras. Nakakatipid sa pag-type ang mga shortcut gaya ng ngayon, kahapon, kaninang umaga, at kagabi.
      - Magdagdag ng hanggang tatlong **label** para pagsama-samahin ang mga gastos, gaya ng grocery o biyahe.
      - Idagdag ang **lugar**. I-paste ang map link at kusang mapupunan ang pangalan ng lugar.
      - Magdagdag ng **tala** para sa kuwento sa likod ng numero, na may kaunting formatting kung kailangan.
      - Gamitin ang **mga komento** para manatili ang usapan sa tabi ng gastos na pinag-uusapan, sa halip na sa chat thread na walang nag-i-scroll pabalik.
  - heading: Kopyahin, i-edit, at tingnan kung ano ang nagbago
    body: Kopyahin ang upa noong nakaraang buwan sa halip na i-type muli, saka baguhin ang kaibahan. Kung mali ang numero, i-edit ang gastos. Napapanatili ang naunang bersyon at lumalabas ang pag-edit sa activity ng grupo, kaya walang tahimik na nagbabago ng numero. Nakadepende sa mga pahintulot ng grupo kung ano ang puwedeng i-edit ng sinuman.
  - heading: Kapag may mukhang mali
    body: Puwedeng i-on ng grupo ang mga tanong sa gastos. Sinumang kasali sa isang gastos ay maaaring magtanong at ipaliwanag kung bakit, at nananatili sa labas ng mga balanse ang gastos hanggang isara ito ng nagtanong, o ng admin. Naka-off ito bilang default at ang admin ang nag-o-on nito para sa grupo. Bagay ito sa mga [event at selebrasyon](page:use-case/events-and-celebrations), kung saan biglang usapin ng lahat ang deposit na walang nakakaalala.
limits:
  heading: Mga limitasyon
  items:
    - Isang tao ang nagbabayad sa bawat gastos. Kung dalawa ang nagbayad, magtala ng dalawang gastos.
    - Walang paghahati ayon sa item at walang paghahati ayon sa shares. Pantay, eksaktong halaga, at porsyento lang ang mayroon.
    - Dapat umabot sa 100 ang kabuuan ng mga porsyento.
    - Hanggang 999,999.99 ang isang gastos sa sarili nitong pera, na may karaniwang decimal places ng perang iyon.
    - Hindi kusang umuulit ang mga gastos. Kopyahin na lang ang noong nakaraang buwan.
    - Hindi puwedeng nasa hinaharap ang mga petsa o mahigit 10 taon na ang nakaraan.
    - Nagiging read-only ang gastos na may kasamang taong umalis na sa grupo.
useCasesHeading: Saan nakakatulong ang ganitong paghahati
faq:
  heading: Mga tanong
  items:
    - q: Puwede bang dalawang tao ang magbayad para sa isang gastos?
      a: Hindi sa iisang gastos. Magtala ng dalawa, isa para sa bawat nagbayad, at pareho lang ang kalalabasan ng mga balanse.
    - q: Puwede ba akong maghati ng resibo ayon sa item?
      a: Hindi. Ang paghahati ay pantay, ayon sa eksaktong halaga, o ayon sa porsyento. Para sa bayarin na may iba't ibang item, ilagay ang utang ng bawat tao bilang eksaktong halaga.
    - q: Puwede ba akong magtakda ng default na paghahati?
      a: Hindi. Kopyahin ang naunang gastos para magamit muli ang paghahati nito, at baguhin ang kaibahan.
    - q: Puwede bang umulit ang mga bayarin buwan-buwan?
      a: Hindi. Kopyahin na lang ang gastos noong nakaraang buwan, na ilang segundo lang.
    - q: Sino ang puwedeng mag-edit ng gastos?
      a: Sinumang pinapayagan ng mga pahintulot ng grupo. Lumalabas sa activity ng grupo ang bawat pag-edit, kaya walang tahimik na pagbabago.
    - q: Ano ang mangyayari sa mga balanse pagkatapos?
      a: Nag-a-update ang mga ito habang dumarating ang mga gastos, at ginagawa ng [settle up](page:feature/settle-up) na maikling listahan ng mga bayad ang mga ito. Kung nasa ibang pera ang gastos, tingnan ang [maraming pera](page:feature/multiple-currencies).
