meta:
  title: "Hogyan működik a Side Badger | Csoportos költségek felosztása öt lépésben"
  description: "Hozz létre csoportot, hívj meg embereket, add hozzá a költségeket, és számoljatok el. Nézd meg, mi történik a „valaki fizetett” és a „kvittek vagyunk” között, egy végigvezetett példával."
h1: "Hogyan működik a Side Badger"
navLabel: "Hogyan működik"
lead: "Mi történik a „valaki fizetett” és a „kvittek vagyunk” között? Öt lépés, nulla táblázat, és egy borz, aki többnyire dísz. Itt az egész út, az első csoporttól az utolsó rögzített kifizetésig. Az egyes lépések részleteit a [költségek felosztása](page:feature/split-expenses) és az [elszámolás](page:feature/settle-up) oldalon találod."
cta:
  heading: "Az „én állom”-tól a „kvittek vagyunk”-ig"
  body: "Hozz létre ingyenes fiókot, indíts csoportot, és add hozzá az első költséget. A borz nem ítéli meg a nyugtát."
  button: "Ingyenes fiók létrehozása"
steps:
  - title: "Hozz létre egy csoportot"
    body: "Csinálj egy csoportot minden házhoz, utazáshoz vagy eseményhez, hogy a lakbér sose kerüljön ugyanarra a listára, mint az esküvői ajándék. Adj neki nevet, válaszd ki a nevet, amelyen az emberek látnak, és ha szeretnéd, korlátozd, mely pénznemeket fogadja. A műszerfalad ezután egyetlen képernyőn mutatja az összes csoportot, és hogy melyikben hogy állsz."
    shot: S02
    shotAlt: "A csoportlétrehozó ablak megnyitott pénznemkorlátozási résszel"
  - title: "Hívd meg az embereidet"
    body: "Oszd meg a csatlakozási linket, vagy mutass egy QR-kódot, és állítsd be, meddig él, 15 perctől 5 napig. Mindenkinek, aki csatlakozik, ingyenes fiók és megerősített e-mail-cím kell, és egy csoportba legfeljebb 50 ember fér. Ha szeretnéd válogatni, ki jön be, kapcsold be a jóváhagyást, és egy adminisztrátor beengedi az egyes embereket."
    shot: S03
    shotAlt: "A meghívó ablak a link lapon, QR-kóddal és a lejárati lehetőségekkel"
  - title: "Add hozzá a költségeket, ahogy felmerülnek"
    body: "Mondd meg, ki fizetett, mennyit és kikért. Oszd fel egyenlően, pontos összegek szerint vagy százalékosan, és hagyd ki azt, aki nem vett részt benne. Add hozzá a költséget, és mindenki azonnal látja, azzal együtt, hogy mi változott, és ki változtatta."
    shot: S05
    shotAlt: "A költségűrlap százalékos felosztással, a lakbért a szobák mérete szerint elosztva"
  - title: "Figyeld az egyenlegeket"
    body: "A Side Badger pénznemenként folyamatos egyenleget vezet, így első pillantásra látod, ki kinek tartozik. Ahelyett, hogy mindenkire hagyná a kis tartozások hálójának kibogozását, egy rövid kifizetéslistát javasol, amely elszámoltatja a csoportot."
    shot: S10
    shotAlt: "Az egyenlegek képernyője egyszerűsített tartozásokkal két pénznemben, az Összes megjelenítése bekapcsolva"
  - title: "Számoljatok el az alkalmazáson kívül, rögzítsd benne"
    body: "A Side Badger sosem mozgat pénzt. Fizessetek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést, hogy az egyenlegek felzárkózzanak, és mindenki képernyője frissüljön újratöltés nélkül. Az „elszámolt” egyszerűen azt jelenti, hogy az egyenlegek nullák. Senki nem hagyhat el egy csoportot, amíg tartozik, vagy neki tartoznak, ezért aki a kijárat felé tart, előbb elszámol."
    shot: S11
    shotAlt: "A kifizetési űrlap gyors rendezés gombokkal és a részleges kifizetés értesítésével"
requirements:
  heading: "Mire van szükséged"
  items:
    - "Egy ingyenes fiókra. Elég egy e-mail-cím és egy jelszó, az e-mailt pedig megerősíted, mielőtt bármit hozzáadhatnál."
    - "18 éves vagy idősebb kor."
    - "Egy modern böngészőre telefonon vagy számítógépen, és kapcsolatra. A Side Badger nem alkalmazásbolti app, és nem működik offline."
    - "Opcionálisan egy helyre a kezdőképernyőn. Nem kell alkalmazásbolt, mert a Side Badgert hozzáadhatod a kezdőképernyődhöz vagy a dokkodhoz, és úgy nyílik meg, mint egy alkalmazás."
