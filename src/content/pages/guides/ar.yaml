lead: "الأسئلة التي يطرحها الناس قبل أن يفتحوا جدول بيانات مباشرة، مجاباً عنها بمجموعة تبدو حقيقية، مع الحسابات وخطوات العمل في التطبيق."
intro: "يتبع كل دليل **مجموعة خيالية واحدة** من أول مصروف إلى آخر دفعة مسجَّلة. والأرقام محسوبة لك، وتستخدم الخطوات الشاشات بأسمائها كما في التطبيق."
cta:
  heading: "عندك مجموعة مثل هذه؟"
  body: "أنشئ حساباً، وابدأ مجموعة، وأضف أول مصروف. والحسابات تُجرى عنك."
