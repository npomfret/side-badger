meta:
  title: "كيف يعمل Side Badger | قسّم مصروفات المجموعة في خمس خطوات"
  description: "أنشئ مجموعة، وادعُ الناس، وأضف المصروفات وسوِّ الحسابات. تعرّف على ما يحدث بين «أحدهم دفع» و«تعادلنا»، مع مثال عملي."
h1: "كيف يعمل Side Badger"
navLabel: "كيف يعمل"
lead: "ماذا يحدث بين «أحدهم دفع» و«تعادلنا»؟ خمس خطوات، بلا جدول بيانات، ومعها غرير واحد زينته أكثر من فائدته. هذه هي الرحلة كاملة، من أول مجموعة إلى آخر دفعة مسجَّلة. وللتفاصيل عن أي خطوة، انظر [تقسيم المصروفات](page:feature/split-expenses) و[تسوية الحسابات](page:feature/settle-up)."
cta:
  heading: "من «سأدفع هذه المرة» إلى «تعادلنا»"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة، وأضف أول مصروف. الغرير لن يحكم على الإيصال."
  button: "أنشئ حساباً مجانياً"
steps:
  - title: "أنشئ مجموعة"
    body: "أنشئ مجموعة لكل منزل أو رحلة أو مناسبة، حتى لا يختلط الإيجار بهدية الزفاف في القائمة نفسها. أعطها اسماً، واختر الاسم الذي سيراه الناس لك، وإن أردت فحدّد العملات التي تقبلها. بعدها تعرض لوحتك كل مجموعاتك، ومكانك في كل منها، على شاشة واحدة."
    shot: S02
    shotAlt: "مربع حوار إنشاء المجموعة وقسم قيود العملات مفتوح"
  - title: "ادعُ أصدقاءك"
    body: "شارك رابط انضمام أو اعرض رمز QR، وحدّد مدة صلاحيته من 15 دقيقة حتى 5 أيام. كل من ينضم يحتاج حساباً مجانياً وبريداً إلكترونياً موثَّقاً، وتتسع المجموعة لما يصل إلى 50 شخصاً. وإذا أردت أن تنتقي من يدخل، فشغّل الموافقة ليسمح المشرف لكل شخص بالدخول."
    shot: S03
    shotAlt: "مربع حوار الدعوة في تبويب الرابط، يعرض رمز QR وخيارات مدة الصلاحية"
  - title: "أضف المصروفات حين تحدث"
    body: "حدّد من دفع، وكم دفع، ولمن كان المصروف. قسّمه بالتساوي أو بمبالغ محددة أو بنسبة مئوية، واستبعد كل من لم يشارك فيه. أضف المصروف فيراه الجميع على الفور، مع ما تغيّر ومن غيّره."
    shot: S05
    shotAlt: "نموذج المصروف مع تقسيم بنسبة مئوية، يوزّع الإيجار بحسب مساحة الغرفة"
  - title: "راقب الأرصدة"
    body: "يحتفظ Side Badger برصيد جارٍ لكل عملة، فترى من يدين لمن بنظرة واحدة. وبدلاً من ترك الجميع يفكّون شبكة من الديون الصغيرة، يقترح قائمة قصيرة من الدفعات تسوّي حسابات المجموعة."
    shot: S10
    shotAlt: "شاشة الأرصدة تعرض ديوناً مبسّطة بعملتين، مع تفعيل «عرض الكل»"
  - title: "سوِّ الحساب خارج التطبيق، وسجّله داخله"
    body: "لا ينقل Side Badger الأموال أبداً. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة لتلحق بها الأرصدة، وتتحدث شاشة كل شخص دون تحديث الصفحة. و«التسوية» تعني ببساطة أن الأرصدة صارت صفراً. ولا يمكن لأحد مغادرة المجموعة ما دام عليه مبلغ أو له مبلغ، فمن يتجه إلى الخروج يسوّي حسابه أولاً."
    shot: S11
    shotAlt: "نموذج الدفعة مع أزرار التسوية السريعة وإشعار الدفعة الجزئية"
requirements:
  heading: "ما الذي تحتاجه"
  items:
    - "حساب مجاني. كل ما تحتاجه عنوان بريد إلكتروني وكلمة مرور، وتوثّق البريد قبل أن تتمكن من إضافة أي شيء."
    - "أن يكون عمرك 18 عاماً أو أكثر."
    - "متصفح حديث على هاتف أو حاسوب، واتصال بالإنترنت. Side Badger ليس تطبيق متجر ولا يعمل دون اتصال."
    - "اختيارياً، مكان على شاشتك الرئيسية. لا حاجة إلى متجر تطبيقات، فيمكنك إضافة Side Badger إلى شاشتك الرئيسية أو شريط التطبيقات ليفتح كأنه تطبيق."
