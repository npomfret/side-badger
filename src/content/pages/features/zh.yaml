meta:
  title: Side Badger 能做什么，不能做什么
  description: 分摊、结算和多种货币，外加群组、清单和投票。完整的功能一览，以及一份诚实的 Side Badger 不做之事清单。
h1: Side Badger 能做什么
navLabel: 功能
lead: 盒子里有的，和没有的。
intro: 这就是全部家当。电子表格是我们特意没放进去的。先看 Side Badger 每天做的三件事，再看清单里的其余功能，以及那份简短的“不做”清单。
cta:
  heading: 它能满足你们群组的需要吗？
  body: 创建免费账户，先拿一个小群组试试。
  button: 创建免费账户
cardsHeading: 三件事，细说
sections:
  - heading: 收据扫描
    body: 拍下收据，Side Badger 会填好总额、日期和地点，供你核对。收据图片由 Google 的 AI 服务读取。
  - heading: 群组与权限
    body: 每个住处、每次旅行或每场活动各建一个群组，一个群组最多 50 人。用链接或二维码邀请大家。群组较大时，可以让某人当查看者，能看到一切，但什么也改不了。
  - heading: 清单与投票
    body: 把共享购物清单放在购物账单旁边。把别墅候选拿出来投票，想匿名也可以。
  - heading: 其他功能
    items:
      - "**实时更新**：添加一笔支出，所有人立即就能看到。"
      - "**语言**：Side Badger 支持 39 种语言，群组里每个人都可以选自己的语言。"
      - "**主屏幕**：无需应用商店。把 Side Badger 添加到主屏幕，它会像应用一样打开。"
      - "**反馈**：发现 bug？在应用内告诉我们，并在那里查看我们的回复。"
  - heading: Side Badger 不做什么
    items:
      - "**转移资金**。Side Badger 从不经手你的钱，大家想怎么付就怎么付。付款请求在计划中。"
      - "**重复账单**。没有定期支出。两下点击就能复制上个月的账单。"
      - "**按物品分摊**。每笔支出只有一位付款人。可平均分摊、按确切金额或按比例分摊。"
      - "**提供原生应用**。它在浏览器里运行。把它添加到主屏幕即可。"
      - "**离线使用**。需要联网。"
      - "**通过邮件或短信发送提醒**。通知显示在应用内。推送通知在计划中。"
      - "**绘制图表或预算**。它只负责记下谁欠谁，整个把戏就这些。"
      - "**用 Google 或 Apple 登录**。用电子邮箱注册。Google 和 Apple 登录在计划中。"
      - "**让没有账户的人加入**。群组里的每个人都需要一个免费账户。"
faq:
  heading: 常见问题
  items:
    - q: 能通过 Side Badger 付款吗？
      a: 不能。Side Badger 只负责记账，从不经手你的钱。大家想怎么付就怎么付，之后记录这笔付款。
    - q: 有手机应用吗？
      a: 应用商店里没有。Side Badger 在浏览器中运行，你可以把它添加到主屏幕，让它像应用一样打开。
    - q: 能按物品分摊吗？
      a: 不能。每笔支出只有一位付款人，可平均分摊、按确切金额或按比例分摊。
    - q: 能离线使用吗？
      a: 不能，需要联网。
    - q: 群组里每个人都需要账户吗？
      a: 是的。群组里每个人都需要一个免费账户，注册只需要一个电子邮箱地址。
