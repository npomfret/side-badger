sections:
  - heading: "O singură valută pentru tot grupul"
    body: "Dacă grupul preferă să nu se gândească la asta, alege o valută a grupului, iar formularul convertește fiecare cheltuială nouă în ea, la un curs pe care îl poți vedea și schimba în continuare. Se aplică doar cheltuielilor noi și celor copiate. Editările și cheltuielile existente rămân cum sunt, așa că nimic deja înregistrat nu se schimbă sub ochii tăi."
  - heading: "Datorezi euro, plătești în lire"
    body: "Ai plătit în yeni, dar te achiți în lire? Nicio problemă. Când înregistrezi o plată o poți converti și pe ea, așa că cine datorează euro poate plăti în lire, iar soldul în euro tot iese corect. Plătiți-vă unii altora cum preferați, apoi înregistrați."
  - heading: "Reguli pentru grup"
    body: "Limitează un grup la valutele pe care le folosești de fapt și setează una implicită, ca formularul să se deschidă pe cea potrivită. O vacanță în Portugalia nu are nevoie de alte 139 de opțiuni lângă nota de la cină, iar o [nuntă în străinătate](page:use-case/events-and-celebrations) probabil are nevoie de două."
limits:
  heading: "Limite"
  items:
    - "Cursul se fixează la salvarea cheltuielii. Cheltuielile vechi nu sunt niciodată reevaluate."
    - "Side Badger ia un curs actual acolo unde poate. Nu pentru orice pereche e garantat unul și îți poți scrie oricând singur cursul."
    - "Conversia automată a grupului se aplică doar cheltuielilor noi și celor copiate, nu editărilor sau cheltuielilor existente."
    - "Fiecare cheltuială este limitată la 999.999,99 în propria valută."
    - "Există 140 de valute. Criptomonedele și metalele nu se numără printre ele."
    - "Side Badger înregistrează plăți. Nu mută și nu schimbă niciodată bani."
useCasesHeading: "Unde ajută asta"
faq:
  heading: "Întrebări"
  items:
    - q: "Ce curs de schimb folosiți?"
      a: "Un curs de schimb actual, luat când introduci cheltuiala, acolo unde există unul. Îl poți schimba cu cursul pe care l-ai primit de fapt, iar suma convertită se actualizează."
    - q: "Se reevaluează cheltuielile vechi?"
      a: "Nu. Cursul se fixează la salvarea cheltuielii, așa că un sold nu se schimbă pentru că s-a schimbat piața."
    - q: "Acceptați criptomonede?"
      a: "Nu. Există 140 de valute, iar criptomonedele nu se numără printre ele."
    - q: "De ce nu pot introduce 2.000.000 de rupiah?"
      a: "Fiecare cheltuială este limitată la 999.999,99 în propria valută. Introdu-o în altă valută și convertește, sau împarte-o în două cheltuieli."
    - q: "Costă ceva conversia?"
      a: "Nu. Conversia e gratuită, ca restul Side Badger. Vezi [prețurile](page:pricing)."
    - q: "Trebuie să convertesc?"
      a: "Nu. Valutele rămân separate, dacă tu sau grupul nu alegeți să convertiți, iar fiecare valută primește propria listă scurtă de plăți."
