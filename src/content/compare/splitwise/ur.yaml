sections:
  - heading: "Splitwise کیا اچھا کرتا ہے"
    body: "اگر آپ کے گروپ کو نیٹو ایپ، آف لائن استعمال یا ایپ کے اندر ادائیگیاں چاہییں تو Splitwise سمجھ داری کا انتخاب ہے، اور ہم چاہیں گے کہ آپ اسے چنیں بجائے اس کے کہ بعد میں پتا چلے۔ اس کے اپنے صفحات یہ بتاتے ہیں:"
    items:
      - "**ایپس اور آف لائن استعمال۔** ویب کے ساتھ iPhone اور Android ایپس، اور آف لائن موڈ۔"
      - "**تقسیم کے مزید طریقے۔** برابر، عین رقم اور فیصد کے علاوہ حصے، ایڈجسٹمنٹ اور آئٹم وار تقسیم۔"
      - "**بار بار آنے والے اخراجات۔** کرائے کو دہرانے پر لگا دیں اور بھول جائیں۔"
      - "**ایپ کے اندر ادائیگیاں۔** کچھ ممالک میں یہ رقم بھی منتقل کر سکتا ہے، Splitwise Pay، Venmo، PayPal یا Pay by Bank کے ذریعے۔"
  - heading: "یہاں مفت، وہاں ادائیگی سے"
    body: "Splitwise Pro، Splitwise کا ادائیگی والا پلان ہے، اور اس کا اپنا Pro صفحہ چار چیزیں بیچتا ہے جو Side Badger میں کچھ نہیں لیتیں۔"
    items:
      - "**رسید اسکین۔** Splitwise Pro آپ کی رسید کی تصویر اسکین کرتا ہے۔ Side Badger یہ مفت کرتا ہے، بغیر اسکین کریڈٹس کے: یہ کل رقم، تاریخ اور جگہ آپ کے جانچنے کے لیے بھر دیتا ہے۔ رسید کی تصاویر Google کی AI سروس پڑھتی ہے۔"
      - "**کرنسی تبدیلی۔** Splitwise Pro جب آپ Convert دباتے ہیں تو گروپ کے اخراجات آپ کی ڈیفالٹ کرنسی میں تبدیل کر دیتا ہے۔ Side Badger ہر خرچے کو اسے لکھتے وقت تبدیل کرتا ہے، موجودہ ایکسچینج ریٹ پر یا اس ریٹ پر جو آپ کو واقعی ملا، اور اصل رقم خرچے پر رہتی ہے۔"
      - "**کوئی اشتہار نہیں۔** Splitwise ایک مکمل طور پر اشتہار سے پاک تجربے کو Pro کی خصوصیت بتاتا ہے۔ Side Badger میں اشتہارات نہیں ہیں۔"
      - "**کوئی یومیہ حد نہیں۔** Splitwise Pro لامحدود اخراجات بیچتا ہے، اور اس کا ہیلپ سینٹر کہتا ہے کہ مفت صارفین روزانہ 4 اخراجات تک شامل کر سکتے ہیں۔ Side Badger میں کوئی یومیہ حد نہیں۔"
  - heading: "Splitwise کے پاس وہ ہے جو Side Badger کے پاس نہیں"
    body: "یہ Splitwise کی ہر خصوصیت نہیں، صرف وہ جو عموماً فیصلہ کرتی ہیں۔ پوری فہرست Splitwise کے اپنے صفحات پر ہے۔ یہ ہیں وہ جگہیں جہاں Side Badger پیچھے رہ جاتا ہے۔"
    items:
      - "**نیٹو ایپس۔** Side Badger آپ کے براؤزر میں کام کرتا ہے۔ سائن ان کریں، پھر اسے اپنی ہوم اسکرین میں شامل کریں اور یہ ایپ کی طرح کھلتا ہے۔"
      - "**آف لائن موڈ۔** Side Badger کو کنکشن چاہیے۔"
      - "**ایپ کے اندر ادائیگیاں۔** Side Badger آپ کی رقم کو کبھی ہاتھ نہیں لگاتا۔ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ادائیگی ریکارڈ کریں۔"
      - "**بار بار آنے والے اخراجات۔** Side Badger میں نہیں ہیں۔ پچھلے مہینے کا کرایہ دوبارہ لکھنے کے بجائے کاپی کریں۔"
      - "**حصوں یا آئٹم کے حساب سے تقسیم۔** Side Badger میں ہر خرچے کا ایک ادا کرنے والا ہوتا ہے، جسے برابر، عین رقم یا فیصد کے مطابق بانٹا جاتا ہے۔ اس کی رسید اسکین آئٹمز کو لوگوں میں تقسیم نہیں کرتی۔"
      - "**چارٹس اور ڈیفالٹ تقسیمیں۔** Splitwise Pro میں دونوں ہیں۔ Side Badger یہ حساب رکھتا ہے کہ کس کو کس کا دینا ہے، اور بس یہی پوری ترکیب ہے۔"
  - heading: "اپنا گروپ منتقل کرنا"
    body: "کوئی امپورٹر نہیں ہے، اس لیے منتقل ہونے کا مطلب نئی شروعات ہے۔ پہلے Splitwise میں حساب برابر کریں، پھر Side Badger میں گروپ بنائیں اور سب کو لنک یا QR کوڈ سے مدعو کریں۔ گروپ میں ہر ایک کو مفت اکاؤنٹ چاہیے، اور سائن اپ کے لیے بس ایک ای میل ایڈریس درکار ہے۔"
