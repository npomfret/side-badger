meta:
  title: パートナーと割り勘、半分ずつでも収入に応じても | Side Badger
  description: 退屈な出費を分け合っても、デートの夜が四半期ごとの家計会議になることはありません。半分ずつ、収入に応じて、または請求ごとに分けて、誰が誰に借りているかを確認できます。無料。
h1: カップルで、公平に費用を分け合う
navLabel: カップル
lead: 退屈な出費を分け合っても、デートの夜を四半期ごとの家計会議にしないために。Side Badgerは、家とソファ、そして「ネット代、誰が払ったっけ？」というあいまいな記憶を共有している**カップル**のために、家賃、請求書、買い物の記録を1つにまとめます。半分ずつ、収入に応じて、または請求ごとに分けて、誰が誰に借りているかを確認できます。
cta:
  heading: 2人だけのグループを始めよう
  body: アカウントを作成し、グループを作って、パートナーに招待リンクを送りましょう。今夜のテイクアウトを、最初の支出にできます。
scenario:
  heading: 公平は、半分ずつとは限らない
  body: SamとAlexは同じ家に住んでいます。Samのほうが収入が多いので、家賃はSamが60%、Alexが40%と取り決めました。Samは大家さんに支払い、Alexは買い物を担当し、2人とも、だいたい帳尻は合っているはずだと思っています。「たぶん合ってる」から、誰かのスマートフォンのメモは、いつまでも続く言い争いのタネになります。そこで、2人のグループを作り、パートナーに見せたい名前を選んで、招待リンクかQRコードを送りましょう。費用はそのつど追加し、誰が支払ったか、どう分けるかを入力して、集計はグループに任せます。休暇ごとに別のグループを作れば（[グループ旅行](page:use-case/group-trips)をご覧ください）、航空券が食料品に紛れ込みません。
sections:
  - heading: 半分ずつ、収入に応じて、請求ごとに
    body: 誰にとっても公平な分け方というものはなく、あるのは2人が合意した分け方だけです。できれば、最初のため息のあとではなく、最初の請求の前に。よくある3つを紹介します。
    items:
      - "**半分ずつ（50/50）。**分け方に**均等**を選ぶと、2人がそれぞれ半分を負担します。収入が近いときの共同の費用に向いていて、計算はまったく要りません。"
      - "**収入に応じて。**どちらかの収入が多いなら、それぞれの収入の割合で分けます。まず何を収入に数えるかを決め（手取りがよく選ばれます）、2人の分を足して、自分の分を合計で割ります。一方の手取りが3、もう一方が2の比率なら、3 ÷ (3 + 2) = 60%で、一方が60%、もう一方が40%を負担します。割合は整数に丸めて**パーセンテージ**に入力し、合計が100になる必要があります。給料を入力する場所はないので、入力するのは割合だけです。"
      - "**請求ごとに。**支出ごとに分け方があるので、組み合わせられます。家賃は収入に応じて、食料品は半分ずつ、2人で贈るプレゼントは、それぞれ出す額を選んだなら**正確な金額**で。"
      - "**収入が変わったら、**次の支出から新しい割合を使います。以前の支出は、入力したときの分け方のままです。実際の給与明細で計算する例は、[収入が多いパートナーと請求書を分ける方法](page:guide/how-to-split-bills-with-a-partner-who-earns-more)をご覧ください。"
  - heading: 月に一度の総まとめ
    body: 月に一度、または数字がむずむずしてきたら、グループを開いて**残高**を確認しましょう。2人なら、通貨ごとに支払いは常に1回だけで、借りている人から貸している人へ向かいます。SamとAlexのひと月を見てみましょう。Samが家賃£1,500を支払い、そのうちAlexの40%は£600です。Alexが食料品に£90を支払い、均等に分けたので、Samの半分は£45です。Side Badgerは一方をもう一方と相殺して、£600から£45を引き、AlexがSamに£555を支払います。支払いは、銀行振込、現金、貸しを返す形など、好きな方法で行い、そのあと**精算する**に記録すると、残高がゼロに戻ります。定期的な請求はないので、先月の家賃をコピーし、日付を変えて、そのまま進めます。Side Badgerはお金を動かしたり、リマインダーを送ったりしないので、声をかけるのは引き続きご自身です。
  - heading: 2人だけで
    body: 2人のグループのメンバーは2人で、グループを見られるのはメンバーだけです。パートナーは、招待リンクかQRコードで参加します。リンクの有効期間は15分から5日までなので、パートナーが使う時間を確保できる、いちばん短い期間を選んでください。新しいリンクを作っても古いリンクは無効にならないので、ほかの人がいるチャットに残さないようにしましょう。有効なリンクを使った人は誰でも参加できるので、確実にしたいなら承認をオンにして、管理者が一人ずつ許可します。パートナーには自分のアカウントが必要で、アカウントは無料です。
exampleAfter: 2
example:
  heading: 今月、誰が誰に借りているか
  currency: GBP
  people:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  expenses:
    - label: 家賃
      payer: sam
      amount: 1500
      split:
        method: percent
        shares:
          sam: 60
          alex: 40
    - label: 食料品
      payer: alex
      amount: 90
      split:
        method: equal
featuresHeading: カップルが使う機能
faq:
  heading: よくある質問
  items:
    - q: 60/40を一度設定して、全部に使えますか？
      a: いいえ。分け方は支出ごとに設定されます。最初の支出で割合を設定し、次はそれをコピーして、違う部分だけ変更してください。3つの分け方はすべて[割り勘の仕方](page:feature/split-expenses)で説明しています。
    - q: 銀行口座と連携しますか？
      a: いいえ。Side Badgerがお金に触れることはありません。支払いは好きな方法で行い、そのあと記録します。詳しくは[精算](page:feature/settle-up)をご覧ください。
    - q: ほかの人にグループを見られますか？
      a: 見られるのはメンバーだけで、カップルのグループのメンバーは2人です。有効な招待リンクを使った人は誰でも参加できるので、リンクは1人にだけ送り、有効期間を短くしてください。
    - q: 同じ請求書を、2人で一部ずつ支払った場合は？
      a: 1つの支出につき支払う人は1人です。2人それぞれの支出を2つ記録すれば、残高は同じになります。
    - q: パートナーに支払いを催促してくれますか？
      a: いいえ。リマインダーはないので、声をかけるのは引き続きご自身です。少なくとも、2人とも同じ数字を見ていることになります。
    - q: 費用を分け合うのをやめたら、どうなりますか？
      a: 残高を精算して支払いを記録し、誰も借りていない状態にします。そのあと、管理者はグループをロックして数字をそのまま残すことも、完全に閉鎖して全員がアクセスできないようにすることもできます。閉鎖は、2人とも履歴が必要ないときだけにしてください。
