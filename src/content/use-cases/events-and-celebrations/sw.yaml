faq:
  heading: "Maswali"
  items:
    - q: "Je, wageni wanaweza kuona kikundi bila kujiunga?"
      a: "Hapana. Watu hujiunga kwa kiungo au msimbo wa QR na akaunti ya bure, kwa hivyo wanaweza kuona kikundi wakishaingia."
    - q: "Je, Side Badger inaweza kukusanya pesa?"
      a: "Hapana. Side Badger huweka hesabu na haisogezi pesa kamwe. Lipaneni mtakavyo, kisha rekodi malipo. Ni bure, bila matangazo na bila vikomo vya kila siku; tazama [bei](page:pricing)."
    - q: "Je, kura zinaweza kuwa za siri?"
      a: "Ndiyo. Unapounda kura ya maoni unaweza kuficha nani alimpigia nani kura. Mipangilio inaweza kubadilishwa kabla ya kura ya kwanza tu."
    - q: "Je, watu wanaweza kuchangia kiasi tofauti?"
      a: "Ndiyo. Gawanya gharama kwa kiasi halisi, ili sehemu ya kila mtu iwe kiasi mlichokubaliana, au waache nje wasiohusika."
    - q: "Je, mwandaaji anaweza kuweka hesabu?"
      a: "Ndiyo. Tumia mpangilio wa kikundi kinachosimamiwa, ili ni waundaji na wasimamizi tu wabadilishe gharama na wasimamizi waidhinishe wanachama wapya."
