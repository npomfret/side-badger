sections:
  - heading: Nur die, die dabei waren
    body: Teile Kosten auf alle oder nur auf die Personen, die sie sich geteilt haben. Lass Leute bei Kosten weg, an denen sie nicht beteiligt waren, und die Salden spiegeln das wider. Die Person, die die ganze Woche weg war, schuldet nichts fürs Takeaway, was [Mitbewohner](page:use-case/housemates) als schlichte Gerechtigkeit erkennen werden.
  - heading: Die Details, die späteren Streit sparen
    items:
      - Lege das **Datum** und optional eine Uhrzeit fest. Kürzel wie heute, gestern, heute Morgen und gestern Abend sparen etwas Tipparbeit.
      - Füge bis zu drei **Etiketten** hinzu, um Ausgaben zu gruppieren, etwa Lebensmittel oder Reisen.
      - Füge den **Ort** hinzu. Füge einen Kartenlink ein, und der Ortsname trägt sich selbst ein.
      - Füge eine **Notiz** für die Geschichte hinter der Zahl hinzu, auf Wunsch mit etwas Formatierung.
      - Nutze die **Kommentare**, um das Gespräch bei der Ausgabe zu halten, um die es geht, statt in einem Chat, den niemand zurückscrollt.
  - heading: Kopieren, bearbeiten und sehen, was sich geändert hat
    body: Kopiere die Miete vom letzten Monat, statt sie neu einzutippen, und ändere, was anders ist. Wenn eine Zahl falsch war, bearbeite die Ausgabe. Die frühere Version bleibt erhalten, und die Änderung erscheint in der Aktivität der Gruppe, sodass niemand eine Zahl heimlich ändert. Was jemand bearbeiten darf, hängt von den Berechtigungen der Gruppe ab.
  - heading: Wenn etwas falsch aussieht
    body: Eine Gruppe kann Ausgabenfragen einschalten. Jede an einer Ausgabe beteiligte Person kann eine Frage stellen und sagen, warum, und die Ausgabe bleibt aus den Salden, bis die fragende Person oder ein Admin sie schließt. Standardmäßig ist es aus, und ein Admin schaltet es für die Gruppe ein. Es passt zu [Events und Feiern](page:use-case/events-and-celebrations), wo die Anzahlung, an die sich keiner erinnert, plötzlich alle angeht.
limits:
  heading: Grenzen
  items:
    - Pro Ausgabe zahlt eine Person. Wenn zwei Personen bezahlt haben, erfasse zwei Ausgaben.
    - Es gibt kein Teilen nach Posten und kein Teilen nach Anteilen. Gleichmäßig, genaue Beträge und Prozentsätze sind alles, was es gibt.
    - Prozentsätze müssen zusammen 100 ergeben.
    - Eine Ausgabe kann bis zu 999.999,99 in der jeweiligen Währung betragen, mit den üblichen Dezimalstellen dieser Währung.
    - Ausgaben wiederholen sich nicht von selbst. Kopiere stattdessen die vom letzten Monat.
    - Daten dürfen nicht in der Zukunft liegen oder mehr als 10 Jahre zurückliegen.
    - Eine Ausgabe, an der jemand beteiligt ist, der die Gruppe verlassen hat, wird schreibgeschützt.
useCasesHeading: Wo solches Teilen hilft
faq:
  heading: Fragen
  items:
    - q: Können zwei Personen für eine Ausgabe bezahlen?
      a: Nicht in einer Ausgabe. Erfasse zwei, eine für jede zahlende Person, und die Salden kommen gleich heraus.
    - q: Kann ich einen Beleg nach Posten teilen?
      a: Nein. Eine Aufteilung ist gleichmäßig, nach genauen Beträgen oder in Prozent. Bei einer Rechnung mit verschiedenen Posten gib als genaue Beträge ein, was jede Person schuldet.
    - q: Kann ich eine Standardaufteilung festlegen?
      a: Nein. Kopiere eine frühere Ausgabe, um ihre Aufteilung wiederzuverwenden, und ändere, was anders ist.
    - q: Können sich Rechnungen jeden Monat wiederholen?
      a: Nein. Kopiere stattdessen die Ausgabe vom letzten Monat, das dauert ein paar Sekunden.
    - q: Wer kann eine Ausgabe bearbeiten?
      a: Wer laut den Berechtigungen der Gruppe darf. Jede Änderung erscheint in der Aktivität der Gruppe, Änderungen geschehen also nie unbemerkt.
    - q: Was passiert danach mit den Salden?
      a: Sie aktualisieren sich, sobald Ausgaben eintreffen, und [Abrechnen](page:feature/settle-up) macht daraus eine kurze Liste von Zahlungen. Wenn eine Ausgabe in einer anderen Währung ist, siehe [Mehrere Währungen](page:feature/multiple-currencies).
