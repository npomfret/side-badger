meta:
  title: "Како се поравнати после групног путовања | Side Badger"
  description: "Поравнајте се пре него што се сви разиђу. Десет замршених дугова постаје четири уплате, бележене како стижу, а делимична уплата је у реду. Рачуница за петоро пријатеља."
h1: "Како се поравнати после групног путовања"
navLabel: "Поравнање после путовања"
lead: "Поравнајте се пре него што се сви разиђу. Додај последњи трошак, отвори стања групе и плати оно што дугујеш са кратког списка, како год желиш. Затим забележи сваку уплату у Side Badgeru да се стање очисти за целу групу. За петоро пријатеља и пет трошкова, десет замршених дугова своди се на четири уплате."
cta:
  heading: "Затвори књиге пре него што слике стигну"
  body: "Направи бесплатан налог, оснуј групу за следеће путовање и додај сваки трошак како настаје. Кратак списак уплата чека кад стигнеш на аеродром. Желиш прво да видиш [како функционише поравнање](page:feature/settle-up)?"
sections:
  - heading: "Петоро пријатеља, пет трошкова, једна сала за полазак"
    body: "Мо, Инес, Раф, Тес и Ума провели су недељу дана на обали. Мо је резервисао апартман и купио намирнице, Инес је платила излет бродом, а Раф је преузео велику вечеру. Тес је узела аеродромски такси са Умом и Мом, јер су Инес и Раф ишли возом. Умина картица остала је код куће, па она није платила ништа. То је пет трошкова и укупно 1.700 €, а у сали за полазак нико није могао да каже ко је у плусу."
  - heading: "Десет дугова, четири уплате"
    body: "Апартман, брод, вечера и намирнице деле се једнако на петоро. То је 200 €, 50 €, 60 € и 18 € по особи, па Инес и Раф дугују по 328 €. Такси деле троје по 20 €, па Мо, Тес и Ума дугују 348 €. Мо је платио 1.090 € и дугује 348 €, што му оставља 742 € потраживања. Сви остали су платили мање него што дугују. Ума фали 348 €, Тес 288 €, Инес 78 €, а Рафу 28 €, и то заједно даје 742 € које Мо потражује. Поравнајте сваки пар људи директно и добијате десет засебних дугова. Side Badger уместо тога предлаже четири уплате, све упућене Мо."
  - heading: "Поравнајте се пре него што се разиђете"
    body: "Најбољи тренутак је последње вече или вожња кући, док су сви још на окупу и дуг од 28 € лако је споменути. Прво додај сваки трошак, такси такође. Нико не може да напусти групу док дугује или му се дугује новац, па се рачуница ионако мора некад затворити."
    items:
      - "**Провери списак.** Отвори групу и погледај **Стања**. Подразумевано видиш дугове који се тичу тебе. Изабери **Прикажи све** да видиш списак целе групе."
      - "**Плати како желиш.** Банковни трансфер, готовина, услуга која се дугује од прошлог одмора. Side Badger не премешта новац."
      - "**Забележи.** Изабери **Поравнај**. Под **Брзо поравнање** свако дугме је једна од твојих предложених уплата, а избор једне попуњава износ. Додај **Напомену**, на пример банковни трансфер, провери **Датум** (не може бити у будућности) и изабери **Забележи поравнање**."
      - "**Гледај како се чисти.** Стање се ажурира за све. Кад последња уплата уђе, **Стања** приказују **Све је сређено!**"
  - heading: "Плати део сада, остатак касније"
    body: "Ума може вечерас да пошаље 200 €, а остало до краја месеца. Она бележи 200 €, а образац је упозорава да ће и даље дуговати Мо 148 €, а то је 348 € минус 200 €. Сачувај и тих 148 € остаје на њеном стању док не забележи остатак. Упозорење ради и у другом смеру. Ако залутала нула претвори 348 € у 3.480 €, образац каже да она Мои дугује само 348 € и да би чување направило дуг у супротном смеру. Исправи нулу пре него што сачуваш."
  - heading: "Исправљање грешака и навијање за уплате"
    items:
      - "**Погрешна уплата.** Само особа која је забележила уплату може да је уређује. Она или администратор групе може да је обрише, а затим се може поново забележити."
      - "**Уплата која вреди пажње.** Свака забележена уплата стоји под **Поравнања** са датумом и напоменом, где је сви у групи могу видети и реаговати. Мо може да изабере **Прослави** кад стигне Умина последња 148 €."
      - "**Крај.** Кад је свако стање на нули, администратор може закључати групу да бројеви остану на месту."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Никад не премешта новац. Нема линкова за плаћање нити захтева за уплату, па је уплата у апликацији запис о уплати која је обављена негде другде."
      - "Не шаље подсетнике. Јурење закашњеле уплате и даље је на теби."
      - "Не поставља рокове. Када је рок за остатак Уминих 148 € договара група."
      - "Предложене уплате су кратак списак, а не обећање најкраћег могућег. Рачунају се по валути, па путовање плаћено у еврима и фунтама добија по један списак за сваку."
