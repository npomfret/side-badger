meta:
  title: Was Side Badger kann und was nicht
  description: Teilen, Abrechnen und mehrere Währungen, dazu Gruppen, Listen und Umfragen. Das ganze Paket und eine ehrliche Liste dessen, was Side Badger weglässt.
h1: Was Side Badger kann
navLabel: Funktionen
lead: Alles, was drin ist, und was nicht.
intro: Hier ist das ganze Paket. Die Tabellenkalkulation haben wir mit Absicht weggelassen. Such dir unten eine Funktion für die lange Fassung aus oder überfliege den Rest der Liste und die kurze Liste dessen, was Side Badger nicht kann.
cta:
  heading: Kann es, was deine Gruppe braucht?
  body: Erstelle ein kostenloses Konto und probiere es zuerst mit einer kleinen Gruppe aus.
cardsHeading: Jede Funktion im Detail
sections:
  - heading: Belegscan
    body: Fotografiere den Beleg, und Side Badger trägt Summe, Datum und Ort ein, damit du sie prüfen kannst. Belegbilder liest der KI-Dienst von Google. [So funktioniert der Belegscan](page:feature/receipt-scanning).
  - heading: Gruppen und Berechtigungen
    body: Lege für jedes Haus, jede Reise und jedes Event eine Gruppe mit bis zu 50 Personen an. Lade Leute per Link oder QR-Code ein. In einer größeren Gruppe kannst du jemanden zum Betrachter machen, der alles sieht und nichts ändert. [Gruppen und Berechtigungen](page:feature/groups-and-permissions) hat das Kleingedruckte.
  - heading: Listen und Umfragen
    body: Führe die gemeinsame Einkaufsliste neben den Einkaufsrechnungen. Lass über die Villa-Auswahl abstimmen, auf Wunsch anonym. [Gemeinsam planen](page:feature/plan-together) behandelt Kommentare, Fragen, Listen und Umfragen.
  - heading: Alles andere
    items:
      - "**Live-Updates:** Füge eine Ausgabe hinzu, und alle sehen sie sofort."
      - "**Sprachen:** Nutze Side Badger in 39 Sprachen. Alle in der Gruppe können ihre eigene wählen."
      - "**Home-Bildschirm:** Du brauchst keinen App-Store. Melde dich an und füge Side Badger dann zum Home-Bildschirm hinzu, und es öffnet sich wie eine App. Die Einstellungen in der App zeigen dir, wie. [Mehr zur Web-App](page:feature/web-app)."
      - "**Benachrichtigungen:** Schalte in den Einstellungen Push-Benachrichtigungen ein, dann bekommst du eine Benachrichtigung, wenn es neue Aktivitäten in deinen Gruppen gibt. Füge Side Badger auf iPhone und iPad zuerst zum Home-Bildschirm hinzu."
      - "**Feedback:** Fehler gefunden? Sag es uns direkt in der App und lies dort unsere Antwort."
  - heading: Was Side Badger nicht kann
    items:
      - "**Geld bewegen.** Side Badger fasst dein Geld nie an. Zahlt einander, wie ihr wollt. Zahlungsanfragen sind geplant."
      - "**Rechnungen wiederholen.** Es gibt keine wiederkehrenden Ausgaben. Kopiere die Rechnung vom letzten Monat in zwei Fingertipps."
      - "**Nach Posten teilen.** Eine zahlende Person pro Ausgabe. Teile gleichmäßig, genau oder in Prozent."
      - "**Eine native App liefern.** Es läuft in deinem Browser. Melde dich an und füge es dann zum Home-Bildschirm hinzu."
      - "**Offline arbeiten.** Es braucht eine Verbindung."
      - "**Hinweise per E-Mail oder SMS senden.** Neue Aktivitäten erscheinen in der App und, wenn du sie einschaltest, als Push-Benachrichtigungen."
      - "**Diagramme oder Budgets zeichnen.** Es führt die Rechnung, wer wem was schuldet, und das ist der ganze Trick."
      - "**Mit Google oder Apple anmelden.** Registriere dich per E-Mail. Anmeldung mit Google und Apple ist geplant."
      - "**Leute ohne Konto hereinlassen.** Alle in der Gruppe brauchen ein kostenloses Konto."
faq:
  heading: Fragen
  items:
    - q: Kann ich über Side Badger bezahlen?
      a: Nein. Side Badger führt die Rechnung und fasst dein Geld nie an. Zahlt einander, wie ihr wollt, und erfasst dann die Zahlung.
    - q: Gibt es eine mobile App?
      a: Nicht im App-Store. Side Badger läuft in deinem Browser. Melde dich auf deinem Handy an und füge es dann zum Home-Bildschirm hinzu, damit es sich wie eine App öffnet. Die Einstellungen in der App zeigen dir, wie.
    - q: Kann ich nach Posten teilen?
      a: Nein. Jede Ausgabe hat eine zahlende Person, und du teilst sie gleichmäßig, nach genauen Beträgen oder in Prozent.
    - q: Funktioniert es offline?
      a: Nein, es braucht eine Verbindung.
    - q: Braucht jede Person in der Gruppe ein Konto?
      a: Ja. Alle in der Gruppe brauchen ein kostenloses Konto, und zur Anmeldung genügt eine E-Mail-Adresse.
