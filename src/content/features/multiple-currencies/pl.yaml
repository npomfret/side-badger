sections:
  - heading: "Jedna waluta dla całej grupy"
    body: "Jeśli grupa wolałaby o tym nie myśleć, wybierz walutę grupy, a formularz przeliczy na nią każdy nowy wydatek, po kursie, który nadal widzisz i możesz zmienić. Dotyczy to tylko nowych i skopiowanych wydatków. Edycje i istniejące wydatki zostają bez zmian, więc nic już zapisanego nie zmienia się pod tobą."
  - heading: "Jesteś winien euro, płacisz w funtach"
    body: "Zapłacone w jenach, a rozliczasz w funtach? W porządku. Gdy rejestrujesz płatność, możesz przeliczyć także ją, więc kto jest winien euro, może zapłacić w funtach, a saldo w euro nadal wyjdzie dobrze. Płaćcie sobie, jak chcecie, a potem zarejestruj to."
  - heading: "Zasady dla grupy"
    body: "Ogranicz grupę do walut, których naprawdę używacie, i ustaw domyślną, żeby formularz otwierał się na właściwej. Wakacje w Portugalii nie potrzebują 139 innych opcji obok rachunku za kolację, a [wesele za granicą](page:use-case/events-and-celebrations) prawdopodobnie potrzebuje dwóch."
limits:
  heading: "Limity"
  items:
    - "Kurs jest ustalany w chwili zapisu wydatku. Stare wydatki nigdy nie są przeszacowywane."
    - "Side Badger pobiera aktualny kurs, gdy może. Nie każda para ma go zagwarantowanego, a kurs zawsze możesz wpisać sam."
    - "Automatyczne przeliczanie w grupie dotyczy tylko nowych i skopiowanych wydatków, a nie edycji ani istniejących wydatków."
    - "Każdy wydatek ma limit 999 999,99 w swojej walucie."
    - "Jest 140 walut. Kryptowalut ani metali wśród nich nie ma."
    - "Side Badger rejestruje płatności. Nigdy nie przesyła pieniędzy ani ich nie wymienia."
useCasesHeading: "Gdzie to pomaga"
faq:
  heading: "Pytania"
  items:
    - q: "Jakiego kursu wymiany używacie?"
      a: "Aktualnego kursu wymiany, pobieranego przy wpisywaniu wydatku, gdy jest dostępny. Możesz zmienić go na ten, który faktycznie obowiązywał, a przeliczona kwota się zaktualizuje."
    - q: "Czy stare wydatki są przeszacowywane?"
      a: "Nie. Kurs jest ustalany w chwili zapisu wydatku, więc saldo nie dryfuje dlatego, że ruszył się rynek."
    - q: "Czy obsługujecie kryptowaluty?"
      a: "Nie. Jest 140 walut, a kryptowalut wśród nich nie ma."
    - q: "Dlaczego nie mogę wpisać 2 000 000 rupii indonezyjskich?"
      a: "Każdy wydatek ma limit 999 999,99 w swojej walucie. Wpisz go w innej walucie i przelicz albo podziel na dwa wydatki."
    - q: "Czy przeliczanie coś kosztuje?"
      a: "Nie. Przeliczanie jest darmowe, tak jak reszta Side Badger. Zobacz [cennik](page:pricing)."
    - q: "Czy muszę przeliczać?"
      a: "Nie. Waluty zostają osobno, chyba że ty lub twoja grupa zdecydujecie się przeliczać, a każda waluta ma własną krótką listę płatności."
