featuresHeading: "Функције које ово користи"
faq:
  heading: "Питања"
  items:
    - q: "Могу ли гости да виде групу без придруживања?"
      a: "Не. Људи се придружују везом или QR кодом и бесплатним корисничким налогом, па групу виде тек кад уђу."
    - q: "Може ли Side Badger да прикупља новац?"
      a: "Не. Side Badger води евиденцију и никад не премешта новац. Платите једни другима како год желите, а затим забележите уплату. Бесплатан је, без огласа и без дневних ограничења; погледај [ценовник](page:pricing)."
    - q: "Могу ли гласови да буду анонимни?"
      a: "Да. Приликом прављења анкете можеш сакрити ко је за шта гласао. Подешавања се могу мењати само пре првог гласа."
    - q: "Могу ли људи да допринесу различите износе?"
      a: "Да. Подели трошак по тачним износима, па је удео сваке особе износ о коме сте се договорили, или изостави особе које нису учествовале."
    - q: "Може ли организатор да води књиге?"
      a: "Да. Користи шаблон управљане групе, па трошкове мењају само оснивачи и администратори, а администратори одобравају нове чланове."
