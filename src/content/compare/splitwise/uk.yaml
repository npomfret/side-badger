sections:
  - heading: "Що Splitwise робить добре"
    body: "Якщо вашій групі потрібні нативний застосунок, офлайн-режим чи платежі всередині застосунку, Splitwise — розумний вибір, і ми б хотіли, щоб ви обрали його, а не дізналися пізніше. Його власні сторінки називають:"
    items:
      - "**Застосунки й офлайн-режим.** Застосунки для iPhone та Android, а також веб і офлайн-режим."
      - "**Більше способів розподілу.** Частки, коригування й розподіл за позиціями, на додачу до порівну, за точними сумами й за відсотками."
      - "**Регулярні витрати.** Налаштуйте повтор оренди й забудьте про неї."
      - "**Платежі в застосунку.** У деяких країнах він може й переказати гроші, через Splitwise Pay, Venmo, PayPal або Pay by Bank."
  - heading: "Тут безкоштовно, там платно"
    body: "Splitwise Pro — платний план Splitwise, і на його власній сторінці Pro продаються чотири речі, що в Side Badger нічого не коштують."
    items:
      - "**Сканування чеків.** Splitwise Pro сканує фото вашого чека. Side Badger робить це безкоштовно, без кредитів на сканування: він заповнює загальну суму, дату й місце, щоб ви їх перевірили. Зображення чеків читає ШІ-сервіс Google."
      - "**Конвертація валют.** Splitwise Pro конвертує витрати групи у вашу валюту за замовчуванням, коли ви торкаєтеся «Convert». Side Badger конвертує кожну витрату під час введення, за актуальним курсом обміну або за тим, який ви справді отримали, а початкова сума лишається біля витрати."
      - "**Без реклами.** Splitwise зазначає повністю безрекламний досвід як функцію Pro. У Side Badger реклами немає."
      - "**Без денних обмежень.** Splitwise Pro продає необмежену кількість витрат, а в його довідковому центрі сказано, що безкоштовні користувачі можуть додавати до 4 витрат на день. У Side Badger денних обмежень немає."
  - heading: "Що є у Splitwise, а в Side Badger немає"
    body: "Це не всі функції Splitwise, лише ті, що найчастіше вирішують вибір. Повний перелік є на власних сторінках Splitwise. Ось де Side Badger поступається."
    items:
      - "**Нативні застосунки.** Side Badger працює у вашому браузері. Увійдіть, додайте його на головний екран, і він відкриватиметься як застосунок."
      - "**Офлайн-режим.** Side Badger потребує з'єднання."
      - "**Платежі в застосунку.** Side Badger ніколи не торкається ваших грошей. Платіть одне одному як зручно, а потім запишіть платіж."
      - "**Регулярні витрати.** У Side Badger їх немає. Скопіюйте оренду минулого місяця замість того, щоб вводити її знову."
      - "**Розподіл за частками чи за позиціями.** У Side Badger одна людина платить за витрату, а розподіл іде порівну, за точними сумами або у відсотках. Його сканування чеків не розподіляє позиції між людьми."
      - "**Діаграми й типові розподіли.** У Splitwise Pro є і те, і те. Side Badger веде облік, хто кому винен, і в цьому весь фокус."
  - heading: "Переїзд вашої групи"
    body: "Імпортера немає, тож переїзд означає новий початок. Спершу розрахуйтеся в Splitwise, потім заведіть групу в Side Badger і запросіть усіх за посиланням або QR-кодом. Кожному в групі потрібен безкоштовний обліковий запис, а для реєстрації достатньо електронної адреси."
