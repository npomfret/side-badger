meta:
  title: Divide gastos en 140 monedas, convertidas o por separado
  description: Introduce cada gasto en la moneda en la que pagaste, mantén los saldos por separado o conviértelos a un tipo que puedes ver y cambiar, y salda cuentas con una lista corta de pagos.
h1: Divide gastos en 140 monedas
navLabel: Varias monedas
lead: Euros, yenes y ese taxi en bahts. Side Badger toma cada gasto en la moneda en la que pagaste, mantiene los saldos en orden y puede convertir cuando tu grupo prefiera saldar de una vez. Funciona en 140 monedas y encaja de forma natural con los [viajes en grupo](page:use-case/group-trips).
cta:
  heading: Trae tus euros, trae tus yenes
  body: Crea una cuenta, empieza un grupo y añade el primer gasto en la moneda que tuvieras a mano.
  button: Crear una cuenta gratis
problem:
  heading: Introdúcelo como lo pagaste
  body: Un viaje rara vez se paga en una sola moneda. El hotel se reservó en casa en libras, la cena se pagó en yenes y el café del aeropuerto fue en lo que usara la escala. Convertirlo todo a mano antes de poder siquiera introducirlo es como se abandonan las hojas de cálculo. En Side Badger introduces cada gasto en la moneda del recibo, y cada importe sigue las reglas de su moneda, así que los yenes no tienen decimales y los dinares tienen tres. Las monedas que has usado hace poco salen primero en la lista.
workflow:
  heading: Mantén las monedas por separado o convierte sobre la marcha
  steps:
    - title: Añade el gasto en su propia moneda
      body: Elige la moneda, escribe el importe e indica quién pagó y quién lo compartió. No hace falta nada más. Es lo predeterminado, y conserva el importe original exactamente como lo introdujiste.
      shot: S07
      shotAlt: El formulario de gasto con un importe en yenes
    - title: Vigila un saldo para cada moneda
      body: Los saldos se llevan por separado para cada moneda, y cada uno tiene su propia lista corta de pagos sugeridos. Las libras se saldan en libras y los yenes en yenes.
      shot: S10
      shotAlt: La pantalla de saldos con las deudas simplificadas en dos monedas
    - title: O convierte, cuando el grupo prefiera saldar de una vez
      body: Elige otra moneda al introducir el gasto y Side Badger puede convertirlo con un tipo de cambio actual, que puedes cambiar por el tipo que te aplicaron de verdad. El importe convertido se suma al saldo en esa moneda. La conversión es una decisión del grupo, nunca algo que ocurra a tus espaldas.
options:
  heading: Un tipo que puedes ver y cambiar
  items:
    - title: Se muestra el tipo
      body: Cuando conviertes, el tipo y el importe convertido aparecen en el formulario, así que nadie tiene que fiarse de un número sin más.
    - title: Escribe el tuyo
      body: ¿Conseguiste un tipo mejor en una casa de cambio, o uno peor en un aeropuerto? Edita el tipo por el que te aplicaron de verdad y el importe convertido se actualiza.
    - title: El original se queda
      body: El importe original se queda en el gasto, junto al convertido, para quien pregunte cuánto fue en yenes.
    - title: Convertir es gratis
      body: Convertir no cuesta nada. No hay comisión por introducir un gasto en otra moneda.
