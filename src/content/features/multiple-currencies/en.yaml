      JPY: 0.005
sections:
  - heading: One currency for the whole group
    body: If your group would rather not think about it, pick a group currency and new expenses convert into it automatically. This applies to new and copied expenses only. Edits and existing expenses are left as they are, so nothing already recorded changes under you.
  - heading: Owe euros, pay in pounds
    body: Paid in yen, settling in pounds? Fine. When you record a payment you can convert it into another currency too, so the person who owes euros can pay in pounds and the balance still comes out right. Pay each other however you like, then record it.
  - heading: Rules for the group
    body: Limit a group to the currencies you are actually using, and set a default so the form opens on the right one. A holiday in Portugal does not need 139 other options next to the dinner bill.
  - heading: See also
    body: Planning a party? [Events and celebrations](page:use-case/events-and-celebrations) covers deposits, decorations and the guest who paid in another currency.
limits:
  heading: Limits
  items:
    - The rate is fixed when the expense is saved. Old expenses are never revalued.
    - Side Badger fetches a current rate where it can. Not every pair is guaranteed one, and you can always type the rate yourself.
    - Group auto-convert applies to new and copied expenses only, not to edits or existing expenses.
    - Each expense is capped at 999,999.99 in its own currency.
    - There are 140 currencies. Cryptocurrencies and metals are not among them.
    - Side Badger records payments. It never moves money or converts it for you.
useCasesHeading: Where this helps
faq:
  heading: Questions
  items:
    - q: Which exchange rate do you use?
      a: A current rate, fetched when you enter the expense. You can change it to the rate you actually got, and the converted amount updates.
    - q: Do old expenses get revalued?
      a: No. The rate is fixed when the expense is saved, so a balance does not drift because the market did.
    - q: Do you support crypto?
      a: No. There are 140 currencies, and cryptocurrencies are not among them.
    - q: Why can't I enter 2,000,000 rupiah?
      a: Each expense is capped at 999,999.99 in its own currency. Enter it in another currency and convert, or split it into two expenses.
    - q: Does conversion cost anything?
      a: No. Converting is free, like the rest of Side Badger. See [pricing](page:pricing).
    - q: Do I have to convert?
      a: No. Currencies stay separate unless you or your group choose to convert, and each currency gets its own short list of payments.
