sections:
  - heading: "Запишіть платіж"
    body: "Коли хтось платить, запишіть це біля потрібної людини. Кнопки швидкого розрахунку підставляють суму з ваших підказаних платежів, а ще можна додати примітку, наприклад «банківський переказ» (до 500 символів). Якщо заплатити лише частину боргу, решта лишається на балансі. Якщо введете замало чи забагато, Side Badger попередить вас перед збереженням. Запис платежу потребує дозволу редагувати витрати, а дата не може бути в майбутньому."
  - heading: "Сплачено в іншій валюті?"
    body: "Баланси лишаються у валюті, в якій сплачено, тож борг у євро лишається боргом у євро. Винні євро, а платите у фунтах? Конвертуйте платіж під час введення, за актуальним курсом обміну або за курсом, що діяв під час обміну. Курс фіксується, коли платіж збережено. [Кілька валют](page:feature/multiple-currencies) пояснюють, як працює конвертація, а [групові поїздки](page:use-case/group-trips) показують її в дії."
  - heading: "Історія, яку можна перевірити"
    body: "Кожен записаний платіж лишається в історії групи з датою, сумою та приміткою. Редагувати платіж може лише людина, яка його записала, а видалити його може вона або адміністратор групи. Платіж, у якому бере участь той, хто залишив групу, заблоковано. Приклад зі сусідами дивіться в розділі [сусіди](page:use-case/housemates)."
limits:
  heading: "Чого Side Badger не робить"
  items:
    - "Side Badger не переказує гроші, не надсилає посилань для оплати чи запитів на платіж. Платіж у застосунку — це запис платежу, здійсненого деінде."
    - "Підказані платежі походять із простого методу зіставлення, застосованого окремо для кожної валюти. Він завжди підказує менше платежів, ніж людей із балансом у цій валюті (для чотирьох людей щонайбільше три), але не завжди знаходить найменшу можливу кількість."
    - "Підказки вимкнути не можна. **Показати все** виводить кожен підказаний платіж у групі, а не лише ваші."
    - "Валюти ніколи не взаємозараховуються, якщо витрати не було конвертовано під час введення."
    - "Нагадувань немає, тож вибивати платіж і далі вам."
useCasesHeading: "Де розрахунок має значення"
faq:
  heading: "Запитання"
  items:
    - q: "Чи надсилає Side Badger гроші?"
      a: "Ні. Платіть одне одному як зручно, а потім запишіть платіж у Side Badger, щоб баланс оновився."
    - q: "Чи можна вимкнути підказані платежі?"
      a: "Ні. Спрощення лишається ввімкненим, а **Показати все** виводить кожен підказаний платіж у групі, а не лише ті, що стосуються вас."
    - q: "Чому євро та фунти окремо?"
      a: "Баланси лишаються у валюті, якою ви платили, якщо не конвертувати під час введення витрати чи платежу. Борги в різних валютах ніколи не взаємозараховуються."
    - q: "А якщо хтось платить лише частину боргу?"
      a: "Запишіть сплачену частину. Решта лишається на балансі, доки її не буде сплачено."
    - q: "Це завжди найменша можлива кількість платежів?"
      a: "Не гарантовано. Він завжди підказує менше платежів, ніж людей із балансом у цій валюті, тож для чотирьох людей ніколи не більше трьох. У прикладі із сусідами це два платежі, де пряме повернення кожному потребувало шести."
