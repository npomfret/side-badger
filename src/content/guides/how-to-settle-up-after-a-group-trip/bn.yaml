meta:
  title: "গ্রুপ ট্রিপের পর হিসাব কীভাবে মেটাবেন | Side Badger"
  description: "সবাই ছড়িয়ে পড়ার আগেই হিসাব মেটান। দশটি জট পাকানো দেনা হয়ে যায় চারটি পেমেন্ট, পৌঁছানোমাত্র রেকর্ড করা, আর আংশিক পেমেন্টেও সমস্যা নেই। পাঁচ বন্ধুর অঙ্কসহ।"
h1: "গ্রুপ ট্রিপের পর হিসাব কীভাবে মেটাবেন"
navLabel: "ট্রিপের পর হিসাব মেটানো"
lead: "সবাই ছড়িয়ে পড়ার আগেই হিসাব মেটান। শেষ খরচটা যোগ করুন, গ্রুপের ব্যালেন্স খুলুন আর ছোট তালিকা থেকে যা দেওয়ার আছে তা যেভাবে খুশি দিয়ে দিন। তারপর প্রতিটি পেমেন্ট Side Badger-এ রেকর্ড করুন, যাতে পুরো গ্রুপের জন্য ব্যালেন্স মিটে যায়। পাঁচ বন্ধু আর পাঁচটি খরচে দশটি জট পাকানো দেনা নেমে আসে চারটি পেমেন্টে।"
cta:
  heading: "ট্রিপের ছবি গ্রুপে আসার আগেই খাতা বন্ধ করুন"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, পরের ট্রিপের জন্য একটি গ্রুপ শুরু করুন আর প্রতিটি খরচ ঘটার সঙ্গে সঙ্গে যোগ করুন। এয়ারপোর্টে পৌঁছানোর সময় পেমেন্টের ছোট তালিকা তৈরিই থাকে। আগে দেখতে চান [হিসাব মেটানো কীভাবে কাজ করে](page:feature/settle-up)?"
sections:
  - heading: "পাঁচ বন্ধু, পাঁচটি খরচ, একটি ডিপার্চার লাউঞ্জ"
    body: "Mo, Ines, Raf, Tess আর Uma সমুদ্রের ধারে এক সপ্তাহ কাটাল। Mo অ্যাপার্টমেন্ট বুক করেছিল আর বাজার করেছিল, Ines নৌকাভ্রমণের টাকা দিয়েছিল আর Raf বড় ডিনারের বিল মিটিয়েছিল। Tess এয়ারপোর্টের ট্যাক্সি নিয়েছিল Uma আর Mo-কে সঙ্গে নিয়ে, কারণ Ines আর Raf গিয়েছিল ট্রেনে। Uma-র কার্ড বাড়িতে রয়ে গিয়েছিল, তাই সে কিছুরই টাকা দেয়নি। মোট পাঁচটি খরচ আর €1,700, আর ডিপার্চার লাউঞ্জে কেউ বলতে পারছিল না কে এগিয়ে আছে।"
  - heading: "দশটি দেনা, চারটি পেমেন্ট"
    body: "অ্যাপার্টমেন্ট, নৌকা, ডিনার আর বাজার পাঁচজনে সমান ভাগ হয়। সেটা জনপ্রতি €200, €50, €60 আর €18, তাই Ines আর Raf প্রত্যেকের দেওয়ার আছে €328। ট্যাক্সি ভাগ হয় তিনজনে, জনপ্রতি €20, তাই Mo, Tess আর Uma-র দেওয়ার আছে €348। Mo দিয়েছে €1,090 আর তার দেওয়ার আছে €348, ফলে তার পাওনা €742। বাকি সবাই যা দেওয়ার কথা তার চেয়ে কম দিয়েছে। Uma-র €348 কম পড়েছে, Tess-এর €288, Ines-এর €78 আর Raf-এর €28, আর এগুলোর যোগফল Mo-র €742। প্রতিটি জোড়ার মধ্যে সরাসরি হিসাব মেটাতে গেলে আলাদা দশটি দেনা দাঁড়ায়। তার বদলে Side Badger চারটি পেমেন্ট সাজেস্ট করে, সবই Mo-কে।"
  - heading: "সবাই ছড়িয়ে পড়ার আগেই হিসাব মেটান"
    body: "সবচেয়ে ভালো সময় শেষ সন্ধ্যা বা বাড়ি ফেরার পথ, যখন সবাই এখনও এক জায়গায় আর €28-এর একটা দেনার কথা তোলা সহজ। আগে সব খরচ যোগ করুন, ট্যাক্সিসহ। কারও দেওয়ার বা পাওনা থাকলে সে গ্রুপ ছাড়তে পারে না, তাই হিসাবটা কোনো এক সময় তো বন্ধ করতেই হয়।"
    items:
      - "**তালিকা দেখুন।** গ্রুপটা খুলে **ব্যালেন্স** দেখুন। ডিফল্টে আপনি আপনার জড়িত দেনাগুলো দেখেন। পুরো গ্রুপের তালিকা দেখতে **সব দেখুন** বেছে নিন।"
      - "**যেভাবে খুশি দিন।** ব্যাংক ট্রান্সফার, নগদ, বা গত ছুটির সময়ের কোনো পাওনা উপকার। Side Badger টাকা নাড়াচাড়া করে না।"
      - "**রেকর্ড করুন।** **সব শোধ করুন** বেছে নিন। **কুইক সেটেল**-এর নিচে প্রতিটি বোতাম আপনার সাজেস্ট করা একটি পেমেন্ট, আর একটি বেছে নিলে পরিমাণ ভরে যায়। ব্যাংক ট্রান্সফারের মতো একটি **নোট** যোগ করুন, **তারিখ** দেখে নিন (ভবিষ্যতের হতে পারে না) আর **সেটেলমেন্ট রেকর্ড করুন** বেছে নিন।"
      - "**মিটে যেতে দেখুন।** ব্যালেন্স সবার জন্য হালনাগাদ হয়। শেষ পেমেন্টটা ঢুকে গেলে **ব্যালেন্স**-এ লেখা আসে **সব শোধ হয়ে গেছে!**"
  - heading: "এখন কিছুটা, বাকিটা পরে"
    body: "Uma আজ রাতে €200 পাঠাতে পারে আর বাকিটা মাসের শেষে। সে €200 রেকর্ড করে, আর ফর্ম তাকে সতর্ক করে যে এরপরেও Mo-র কাছে তার €148 দেওয়ার থাকবে, অর্থাৎ €348 থেকে €200 বাদ। সেভ করলে €148 তার ব্যালেন্সে থেকে যায়, যতক্ষণ না সে বাকিটা রেকর্ড করে। সতর্কতাটা উল্টো দিকেও কাজ করে। একটা বাড়তি শূন্য পড়ে €348 হয়ে গেলে €3,480, ফর্ম বলে যে সে Mo-র কাছে শুধু €348 ঋণী আর সেভ করলে উল্টো দিকে একটি দেনা তৈরি হবে। সেভ করার আগে শূন্যটা ঠিক করে নিন।"
  - heading: "ভুল শোধরানো, আর পেমেন্টে উল্লাস"
    items:
      - "**ভুল পেমেন্ট।** পেমেন্ট সম্পাদনা করতে পারে শুধু যে সেটা রেকর্ড করেছে। সে বা গ্রুপের একজন অ্যাডমিন সেটা মুছতে পারে, তারপর আবার রেকর্ড করা যায়।"
      - "**নজর কাড়ার মতো পেমেন্ট।** রেকর্ড করা প্রতিটি পেমেন্ট তারিখ আর নোটসহ **সেটেলমেন্টসমূহ**-এর নিচে থাকে, যেখানে গ্রুপের সবাই সেটা দেখতে আর রিঅ্যাক্ট করতে পারে। Uma-র শেষ €148 এসে পৌঁছালে Mo **উৎসব** বেছে নিতে পারে।"
      - "**শেষ কথা।** প্রতিটি ব্যালেন্স শূন্য হলে একজন অ্যাডমিন গ্রুপ লক করতে পারেন, যাতে সংখ্যাগুলো যেখানে আছে সেখানেই থাকে।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটি কখনও টাকা নাড়াচাড়া করে না। এতে পেমেন্ট লিঙ্ক বা পেমেন্টের অনুরোধ নেই, তাই অ্যাপে একটি পেমেন্ট মানে অন্য কোথাও হওয়া পেমেন্টের রেকর্ড।"
      - "এটি কোনো রিমাইন্ডার পাঠায় না। দেরি করা পেমেন্টের তাগাদা দেওয়া এখনও আপনার ওপরই।"
      - "এটি কোনো সময়সীমা ঠিক করে না। Uma-র বাকি €148 কবে দেওয়ার কথা, তা গ্রুপ নিজেরা ঠিক করবে।"
      - "সাজেস্ট করা পেমেন্টগুলো একটি ছোট তালিকা, সম্ভাব্য সবচেয়ে ছোট তালিকার কোনো নিশ্চয়তা নয়। এগুলো মুদ্রা ধরে হিসাব করা হয়, তাই ইউরো আর পাউন্ডে দেওয়া একটি ট্রিপে প্রতিটি মুদ্রার জন্য আলাদা তালিকা পাওয়া যায়।"
