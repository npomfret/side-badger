meta:
  title: "Як ділити рахунки з партнером, який заробляє більше | Side Badger"
  description: "Порівну стає незручно, коли один заробляє значно більше. Діліть спільні рахунки за доходом, із розрахунками для двох і без таблиць."
h1: "Як ділити рахунки з партнером, який заробляє більше"
navLabel: "Партнер, що заробляє більше"
lead: "Складіть свої доходи на руки, обчисліть частку кожного від загальної суми й округліть до цілих відсотків. Майя отримує на руки 2 800 £, а Джон 1 700 £, тож спільні рахунки вони ділять 62/38. Уведіть ці відсотки у спільну витрату в Side Badger і копіюйте її щоразу, коли той самий рахунок повертається."
cta:
  heading: "Порахуйте один раз"
  body: "Створіть безкоштовний обліковий запис, заведіть групу для вас двох і внесіть оренду з вашими відсотками. Оренда наступного місяця буде копією. Хочете спершу екскурсію? Подивіться, [як це працює](page:how-it-works) або [що охоплює безкоштовний план](page:pricing)."
sections:
  - heading: "Дві зарплати, одна квартира, одне чемне мовчання"
    body: "Майя та Джон живуть разом. Майя отримує на руки 2 800 £ на місяць, а Джон — 1 700 £. Два роки вони ділили все порівну, бо так було просто і жоден не хотів бути тим, хто підніме цю тему. Потім Джон подивився на саму лише оренду. Половина від 1 400 £ — це 700 £, що становить чверть від доходу Майї на руки й 41 % від його. Ніхто не був несправедливим. Ніхто просто не порахував. До цього рано чи пізно доходить багато [пар](page:use-case/couples). За замовленою їжею вони домовилися, що спільні рахунки мають відкушувати від кожної зарплати схожий шматок."
  - heading: "Метод із розрахунками"
    body: "Чотири кроки, один калькулятор і розмова, яку ви все одно збиралися провести."
    items:
      - "**Домовтеся, що вважати доходом.** Майя та Джон беруть гроші на руки, ті, що щомісяця надходять на рахунок. Разом це 2 800 £ + 1 700 £ = 4 500 £."
      - "**Обчисліть частки.** Частка Майї — 2 800 ÷ 4 500, тобто 62,2 %. Частка Джона — 1 700 ÷ 4 500, тобто 37,8 %."
      - "**Округліть до цілих відсотків.** 62,2 % стають 62, а 37,8 % — 38. Для двох людей округліть одну цифру й відніміть її від 100, щоб отримати другу, і разом вони завжди дають 100."
      - "**Перевірте, що це означає.** З оренди 1 400 £ Майя платить 868 £ (62 %), а Джон — 532 £ (38 %). Це близько 31 % доходу кожного на руки. Порівну це забрало б 25 % у Майї та 41 % у Джона."
  - heading: "Як читати місяць"
    body: "Майя заплатила оренду 1 400 £, а Джон — решту 216 £. Частка Майї за місяць — 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, а заплатила вона 1 400 £, тож їй винні 402,40 £. Частка Джона — 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, а заплатив він 216 £, тож він винен 402,40 £. Side Badger підказує один платіж, від Джона Майї, на 402,40 £, а [розрахунок](page:feature/settle-up) записує його, щойно його зроблено. Якби розділили порівну, у тому ж місяці Джон платив би Майї 592,00 £."
  - heading: "Налаштування в Side Badger"
    body: "Десять хвилин, більшість яких піде на відсотки."
    items:
      - "**Створіть групу.** На панелі керування оберіть **Створити групу** й назвіть її на честь квартири. Оберіть **Запросити інших** і надішліть Джонові посилання або QR-код. Він входить або створює безкоштовний обліковий запис і обирає ім'я, під яким його бачитимуть у цій групі. Групу бачать лише учасники, тож тут будете тільки ви двоє."
      - "**Додайте оренду.** Оберіть **Додати витрату**. Уведіть опис і суму, а в полі **Хто заплатив?** виберіть Майю. Залиште обох у полі **Розділити між**, потім у полі **Як розділити** оберіть **Відсоток** і введіть 62 та 38. Форма попередить, якщо відсотки в сумі не дають 100. Оберіть **Зберегти витрату**."
      - "**Додайте інші рахунки.** Енергія й інтернет вносяться так само, з Джоном як платником і тими самими 62 та 38. Їжа на винос — окрема витрата, де в полі **Як розділити** лишається **Порівну**."
      - "**Скопіюйте наступного місяця.** Відкрийте минуломісячну оренду й оберіть **Копіювати витрату**. Копія зберігає платника, суму й розподіл, а датою стає сьогоднішня. Змініть суму, якщо оренда змінилася, і оберіть **Створити копію**. Рахунок за енергію працює так само."
      - "**Перевірте, хто кому винен.** Це показує розділ **Баланси**, що також підказує короткий список платежів. Платіть одне одному як зручно, а потім запишіть платіж у розділі **Розрахуватися**."
  - heading: "Порівну, за доходом чи рахунок за рахунком"
    body: "Правильної відповіді немає, є лише та, з якою вам обом можна жити. Три поширені варіанти."
    items:
      - "**Порівну за все.** Найпростіше вести, і пасує парам із близькими доходами."
      - "**За доходом для всього спільного.** Так роблять Майя та Джон. Одна розмова, одна пара відсотків."
      - "**Рахунок за рахунком.** Оренда й комунальні за доходом, відпустки й ласощі порівну чи як ви ще домовитеся, і кожен рахунок отримує правило, що йому пасує."
  - heading: "Домовтеся, що вважати спільним"
    body: "Суперечки зазвичай виникають про список, а не про відсотки. Оренда, енергія, інтернет, щотижнева закупівля продуктів і диван у більшості домівок вважаються спільними. Абонемент Майї до спортзалу й підписка Джона на футбол, можливо, ні. Погодьте список один раз, запишіть його й вносьте в групу лише спільні витрати."
  - heading: "Їжа на винос лишається порівну, і це навмисно"
    body: "Ласощі дрібні й необов'язкові, і нікому не потрібен калькулятор, щоб замовити пельмені. У Side Badger їжа на винос — просто ще одна витрата. Джон платить 36 £, у полі **Як розділити** лишається **Порівну**, і кожен винен по 18 £."
  - heading: "Коли змінюється чийсь дохід"
    body: "Підвищення, нова робота чи перерва в роботі змінюють розрахунок. Обчисліть нові відсотки так само й користуйтеся ними з наступної витрати. Попередні витрати лишаються як були. Скопіюйте оренду минулого місяця, змініть відсотки й оберіть **Створити копію**. Щоб виправити витрату, яка вже внесена, відредагуйте її, якщо це дозволяють дозволи групи, і спершу скажіть про це партнерові, бо баланси зміняться. Попередня версія зберігається. Домовтеся, коли перераховуватимете, наприклад раз на рік, і розрахуйтеся перед перемиканням, щоб старий розподіл закрився з чистим підрахунком."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він ніколи не питає, хто скільки заробляє, і не обчислює відсотки. Ви вводите цифри, про які домовилися."
      - "Він не вміє встановлювати типовий розподіл для всієї групи. Відсотки йдуть у кожну витрату, тож копіюйте ту, де вони вже є."
      - "У ньому немає регулярних рахунків, тож щоразу ви копіюєте оренду минулого місяця."
      - "Він ніколи не переказує гроші. Ви платите одне одному як зручно й записуєте це."
