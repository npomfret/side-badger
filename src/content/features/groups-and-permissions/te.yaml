meta:
  title: "గ్రూప్ అడ్మిన్, అనుమతులు | Side Badger"
  description: "లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి, ఎవరు చేరాలో ఆమోదించండి, వ్యూయర్లను పెట్టండి, పని అయ్యాక గ్రూప్‌ను లాక్ చేయండి. మీ గ్రూప్, మీ నియమాలు, హద్దులో."
h1: "గ్రూప్ అడ్మిన్, అనుమతులు: మీ నియమాలు, హద్దులో"
navLabel: "గ్రూప్‌లు, అనుమతులు"
lead: "కొన్ని గ్రూప్‌లకు కోశాధికారి కావాలి. దానికోసం Side Badgerలో ఒక సెట్టింగ్ ఉంది. లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి, ఎవరు లోపలికి రావాలో నిర్ణయించండి, అంకెలను ఎవరు మార్చగలరో ఎంచుకోండి. స్నేహితుల చిన్న గ్రూప్ ఇవన్నీ వదిలేయవచ్చు, ఎందుకంటే కొత్త గ్రూప్‌లు పూర్తిగా తెరిచే మొదలవుతాయి."
cta:
  heading: "చక్కగా నడిచే గ్రూప్‌కు సిద్ధమా?"
  body: "ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, ఆహ్వాన లింక్ పంపండి. ఓపెన్‌గా వదిలేయండి, లేదా గ్రూప్ పెద్దదైనప్పుడు, లేదా కాస్త పట్టింపు ఎక్కువైనప్పుడు నియమాలు బిగించండి."
problem:
  heading: అంకెలను ఎవరో ఒకరు చక్కగా ఉంచాలి
  body: "నలుగురు రూమ్‌మేట్లు నమ్మకంతో నడుపుకోగలరు. పెళ్లి వారాంతంలో ముప్పై మంది అతిథులకు అది బహుశా సాధ్యం కాదు. ప్రతి ఇంటికి, ట్రిప్‌కు, వేడుకకు ఒక గ్రూప్ చేయండి, ఒక్కో దానిలో 50 మంది వరకు ఉండవచ్చు, ప్రతి గ్రూప్‌కు సొంత సభ్యులు, సొంత పాత్రలు, సొంత నియమాలు ఉంటాయి. మీ డాష్‌బోర్డ్ వాటన్నింటినీ, ప్రతిదానిలో మీ స్థితితో సహా, ఒకే స్క్రీన్‌లో చూపుతుంది. చాలా గ్రూప్‌లు సెట్టింగ్‌లను ముట్టుకోనే ముట్టుకోవు. ముట్టుకునేవాటిలో సాధారణంగా వాటిని కోరుకునేంత పద్ధతి ఉన్న ఎవరో ఒకరు ఉంటారు."
workflow:
  heading: ఖాళీ గ్రూప్ నుండి లాక్ చేసిన గ్రూప్ వరకు
  steps:
    - title: "లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి"
      body: "**ఇతరులను ఆహ్వానించండి** తెరిచి, లింక్ ఎంతసేపు పనిచేయాలో ఎంచుకోండి (15 నిమిషాలు, 1 గంట, 1 రోజు లేదా 5 రోజులు), తర్వాత లింక్‌ను కాపీ చేయండి, లేదా స్కాన్ చేయడానికి QR కోడ్‌ను చూపించండి. మీరు ఇప్పటికే మరో గ్రూప్‌ను పంచుకునే వాళ్లను యాప్ లోపల నుండే ఆహ్వానించవచ్చు."
      shot: S03
      shotAlt: "గ్రూప్ లింక్, దాని QR కోడ్, లింక్ ఎంతసేపు ఉండాలో ఎంపికతో ఆహ్వాన డైలాగ్"
    - title: "చేరే ముందే చూడనివ్వండి"
      body: "లింక్ ఉన్న ఎవరైనా సైన్ ఇన్ అవుతారు లేదా ఖాతా తెరుస్తారు, గ్రూప్ ప్రివ్యూ చూస్తారు, అందులో వాడాలనుకునే పేరును ఎంచుకుంటారు. తర్వాత **సమూహంలో చేరు** నొక్కుతారు."
      shot: S04
      shotAlt: "సైన్ ఇన్ అయిన వ్యక్తి చేరే ముందు చూసే గ్రూప్ జాయిన్ ప్రివ్యూ"
    - title: "ఎవరు చేరాలో ఆమోదించండి"
      body: "ఆమోదాన్ని ఆన్ చేస్తే, లింక్ వాడిన వాళ్లు అడ్మిన్ లోపలికి రానిచ్చే వరకు వేచి ఉన్న సభ్యులుగా ఉంటారు. అడ్మిన్లు వాళ్లను **భద్రత**లో **వేచి ఉన్న సభ్యులు** కింద చూసి, **ఆమోదించు** లేదా **తిరస్కరించు** ఎంచుకుంటారు. అప్పటి వరకు వేచి ఉన్న వ్యక్తికి గ్రూప్‌లో ఏదీ కనిపించదు."
      shot: S14
      shotAlt: "అడ్మిన్ ఆమోదించడానికి లేదా తిరస్కరించడానికి వేచి ఉన్న సభ్యులు"
    - title: "ఎవరు ఏం మార్చగలరో ఎంచుకోండి"
      body: "**ఓపెన్ సహకారం** లేదా **మేనేజ్డ్ గ్రూప్** ఎంచుకోండి, లేదా అనుమతులను ఒక్కొక్కటిగా సెట్ చేయండి. తర్వాత ప్రతి వ్యక్తికి అడ్మిన్, సభ్యుడు లేదా వ్యూయర్ అనే పాత్ర ఇవ్వండి. అనుమతులు, పాత్రలు అడ్మిన్లు మాత్రమే మార్చగలరు."
      shot: S13
      shotAlt: "రెండు ప్రీసెట్లు, అనుకూల అనుమతులతో గ్రూప్ సెట్టింగ్‌ల భద్రత ట్యాబ్"
    - title: "పని అయ్యాక లాక్ చేయండి"
      body: "ట్రిప్ ముగిసి, అంకెలు తేలిపోయాక, అడ్మిన్ **సమూహాన్ని లాక్ చేయి**ని ఆన్ చేయవచ్చు. ఎవరూ ఖర్చులను జోడించలేరు, మార్చలేరు, పేమెంట్లను రికార్డ్ చేయలేరు, జాబితాలు, పోల్స్‌ను సవరించలేరు, ఆ విషయం ఒక బ్యానర్ చెబుతుంది. ఆలస్యంగా వచ్చిన టాక్సీని ఎవరూ చప్పుడు లేకుండా జోడించలేరు. నిజంగా ఒకటి తేలితే, అడ్మిన్ గ్రూప్‌ను అన్‌లాక్ చేయవచ్చు."
      shot: S15
      shotAlt: "గ్రూప్ లాక్ అయిందని చెప్పే బ్యానర్ చూపుతున్న గ్రూప్"
options:
  heading: అడ్మిన్లు, సభ్యులు, వ్యూయర్లు
  items:
    - title: "అడ్మిన్"
      body: "గ్రూప్‌ను నడుపుతారు. అడ్మిన్లు కొత్త సభ్యులను ఆమోదిస్తారు, పాత్రలు, అనుమతులు మారుస్తారు, గ్రూప్‌ను లాక్, అన్‌లాక్ చేస్తారు, మూసివేస్తారు. గ్రూప్ సృష్టించిన వ్యక్తి మొదట దాని అడ్మిన్‌గా ఉంటారు, చివరి అడ్మిన్‌ను తగ్గించలేరు కాబట్టి గ్రూప్‌కు అడ్మిన్ లేకుండా ఎప్పుడూ ఉండదు."
    - title: "సభ్యుడు"
      body: "పాల్గొంటారు. సభ్యుడు ఏం చేయగలరన్నది గ్రూప్ అనుమతులపై ఆధారపడి ఉంటుంది. ఓపెన్ సహకారం గ్రూప్‌లో దాదాపు అన్నీ చేయవచ్చు. మేనేజ్డ్ గ్రూప్‌లో సభ్యులు తాము సృష్టించిన ఖర్చులను, జాబితాలను మాత్రమే మార్చగలరు."
    - title: "వ్యూయర్"
      body: "అన్నీ చూస్తారు, ఏదీ మార్చరు. వ్యూయర్ ఖర్చులను లేదా జాబితాలను జోడించలేరు, సవరించలేరు, ఎవరినీ ఆహ్వానించలేరు, సెట్టింగ్‌లను మార్చలేరు, హెడర్ ఇమేజ్‌ను ముట్టుకోలేరు. అంకెలను చూస్తూ ఉంటాను, వేలు పెట్టను అని మాట ఇచ్చే వ్యక్తికి ఇది అనువైనది."
sections:
  - heading: "ఓపెన్, మేనేజ్డ్, లేదా మీ సొంత నియమాలు"
    body: "కొత్త గ్రూప్‌లు **ఓపెన్ సహకారం**తో మొదలవుతాయి, అక్కడ ప్రతి ఒక్కరూ ఎవరినైనా ఆహ్వానించవచ్చు, ఖర్చులను మార్చవచ్చు, జాబితాలను సవరించవచ్చు, కొత్త సభ్యులు తనంతట తామే చేరతారు. ఎవరో ఒకరు పెద్దరికం తీసుకోవాల్సినప్పుడు **మేనేజ్డ్ గ్రూప్**. మీరు ఏడు అనుమతులను ఒక్కొక్కటిగా కూడా సెట్ చేయవచ్చు, ఒకదాన్ని చేత్తో మారిస్తే గ్రూప్ అనుకూలంగా మారుతుంది. ఏది ఎంచుకున్నా, అనుమతులను అడ్మిన్లు మాత్రమే మార్చగలరు, ప్రతి మార్పు యాక్టివిటీ ఫీడ్‌లో కనిపిస్తుంది. [రూమ్‌మేట్ల](page:use-case/housemates) ఫ్లాట్ అంతా తెరిచే ఉంచవచ్చు. పెద్ద [వేడుక](page:use-case/events-and-celebrations)కు తరచుగా మేనేజ్డ్ కావాలి, అప్పుడు ఎవరు చేరాలో ఎవరో ఒకరు చూస్తారు. ఇవన్నీ కొత్తగా ఉన్నాయా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) మొదటి ఖర్చు నుండి లెక్క తేలే వరకు మొత్తం ప్రయాణాన్ని చూపుతుంది."
    items:
      - "**ఖర్చులను ఎవరు సవరించగలరు.** ఓపెన్ సహకారం: ఏ సభ్యుడైనా. మేనేజ్డ్ గ్రూప్: సృష్టికర్తలు, అడ్మిన్లు."
      - "**ఖర్చులను ఎవరు తొలగించగలరు.** ఓపెన్ సహకారం: ఏ సభ్యుడైనా. మేనేజ్డ్ గ్రూప్: సృష్టికర్తలు, అడ్మిన్లు."
      - "**జాబితాలను ఎవరు సవరించగలరు.** ఓపెన్ సహకారం: ఏ సభ్యుడైనా. మేనేజ్డ్ గ్రూప్: సృష్టికర్తలు, అడ్మిన్లు."
      - "**సభ్యులను ఎవరు ఆహ్వానించగలరు.** ఓపెన్ సహకారం: ఏ సభ్యుడైనా. మేనేజ్డ్ గ్రూప్: అడ్మిన్లు మాత్రమే."
      - "**కొత్త సభ్యుల ఆమోదం.** ఓపెన్ సహకారం: ఆటోమేటిక్. మేనేజ్డ్ గ్రూప్: అడ్మిన్ ఆమోదం అవసరం."
      - "**సెట్టింగ్‌లను ఎవరు మార్చగలరు.** ఓపెన్ సహకారం: ఏ సభ్యుడైనా. మేనేజ్డ్ గ్రూప్: అడ్మిన్లు మాత్రమే."
      - "**హెడర్ ఇమేజ్‌ను ఎవరు మార్చగలరు.** ఓపెన్ సహకారం: ఏ సభ్యుడైనా. మేనేజ్డ్ గ్రూప్: అడ్మిన్లు మాత్రమే."
  - heading: "మీ పేరు, మీ ఫోటో, మీ హెడర్ ఇమేజ్"
    body: "ప్రతి గ్రూప్‌కు సొంత పాత్రధారుల జాబితా ఉంటుంది. ప్రతి గ్రూప్‌లో ప్రజలకు కనిపించే పేరును (2 నుండి 50 అక్షరాలు, గ్రూప్‌లో ప్రత్యేకంగా ఉండాలి), మీ ప్రొఫైల్ ఫోటోలలో అక్కడ ఏది వేసుకోవాలో ఎంచుకోండి. ఇంట్లో **Sam**గా, ట్రిప్‌లో **Sam (కారు ఉంది)**గా ఉండండి. సెట్టింగ్‌లను మార్చడానికి అనుమతి ఉన్న ఎవరైనా గ్రూప్ పేరు మార్చవచ్చు, వివరణను సవరించవచ్చు. హెడర్ ఇమేజ్‌కు (10 MB వరకు JPEG, PNG, GIF లేదా WebP) దాని సొంత అనుమతి ఉంది."
  - heading: "ఆర్కైవ్, లాక్ లేదా మూసివేత"
    body: "గ్రూప్‌ను పక్కన పెట్టడానికి మూడు మార్గాలు, తక్కువ తీవ్రత నుండి ఎక్కువ తీవ్రత వరకు."
    items:
      - "**ఆర్కైవ్** గ్రూప్‌ను మీ సొంత డాష్‌బోర్డ్ నుండి మాత్రమే దాస్తుంది, ఇంకెవరిదీ కాదు. మీరు దాన్ని ఇంకా తెరిచి మునుపటిలా వాడవచ్చు, **ఆర్కైవ్ నుండి వెలికితీయి** దాన్ని తిరిగి తెస్తుంది."
      - "**లాక్** అడ్మిన్ అన్‌లాక్ చేసే వరకు మార్పులను ఆపుతుంది. ప్రతి ఒక్కరూ ఇంకా గ్రూప్‌ను, దాని చరిత్రను చదవవచ్చు."
      - "**మూసివేత** శాశ్వతం, అందరికీ. అడ్మిన్ మాత్రమే చేయగలరు, నిర్ధారించడానికి గ్రూప్ పేరు టైప్ చేయాలి, ఆ తర్వాత ఎవరూ ఆ గ్రూప్‌ను మళ్లీ తెరవలేరు."
  - heading: "గ్రూప్ వదిలి వెళ్లడం"
    body: "లెక్క తేల్చుకున్న తర్వాత ఎవరైనా వెళ్లిపోవచ్చు. ఒక్క కరెన్సీలో అయినా మీరు ఇవ్వాల్సినవి లేదా రావాల్సినవి ఉంటే, ఒక ఖర్చు గురించి తేలని ప్రశ్న మీకు సంబంధించి ఉంటే, లేదా మీరు చివరి అడ్మిన్ లేదా ఒకే ఒక్క సభ్యులైతే వెళ్లలేరు. [పేమెంట్‌ను రికార్డ్ చేయండి](page:feature/settle-up), [ఖర్చు ప్రశ్న](page:guide/what-to-do-when-someone-disputes-a-shared-expense)ను పరిష్కరించండి, లేదా వేరొకరిని అడ్మిన్‌ను చేయండి, తర్వాత వెళ్లండి. తిరిగి రావాలంటే కొత్త ఆహ్వానం కావాలి."
limits:
  heading: "హద్దులో: చిన్న అక్షరాలు"
  items:
    - "ఒక గ్రూప్‌లో 50 మంది వరకు ఉండవచ్చు."
    - "అనుమతులు, పాత్రలను అడ్మిన్లు మాత్రమే మార్చగలరు. చివరి అడ్మిన్‌ను తగ్గించలేరు."
    - "ఖర్చుల సవరణను **నిర్వాహకులు మాత్రమే**కి సెట్ చేస్తే, అడ్మిన్లు మాత్రమే ఖర్చులను జోడించగలరని కూడా అర్థం."
    - "లాక్ ఖర్చుల మార్పులను, కొత్త పేమెంట్లను, జాబితాలను, పోల్స్‌ను ఆపుతుంది. ప్రతి ఒక్కరూ ఇంకా గ్రూప్‌ను, దాని చరిత్రను చదవవచ్చు, పేమెంట్లపై రియాక్ట్ అవ్వవచ్చు."
    - "మూసివేత శాశ్వతం. మూసివేసిన గ్రూప్‌ను తిరిగి తెరిచే మార్గం యాప్‌లో లేదు."
    - "కొత్త ఆహ్వాన లింక్ చేస్తే పాతవి రద్దు కావు. ప్రతి లింక్ తన సొంత గడువు వరకు పనిచేస్తుంది, కాబట్టి అది ఎక్కడికి చేరుతుందోనని భయంగా ఉంటే చిన్న గడువు ఎంచుకోండి."
    - "యాప్‌లోని ఆహ్వానాలు మీ 10 అత్యంత ఇటీవలి యాక్టివ్ గ్రూప్‌ల నుండి వ్యక్తులను చూపుతాయి. మిగతా వాళ్లకు లింక్ కావాలి, ఎవరు ఆహ్వానించవచ్చో గ్రూప్ అనుమతులపై ఆధారపడి ఉంటుంది."
    - "చేరడానికి ఖాతా కావాలి, ఏదైనా జోడించే ముందు ప్రజలు తమ ఇమెయిల్‌ను ధ్రువీకరించాలి."
useCasesHeading: "కాస్త క్రమం ఎక్కడ ఉపయోగపడుతుంది"
faq:
  heading: ప్రశ్నలు
  items:
    - q: "వ్యూయర్ ఖర్చులను జోడించవచ్చా?"
      a: "లేదు. వ్యూయర్ అన్నీ చూస్తారు, ఏదీ మార్చరు. వాళ్లు ఖర్చులను లేదా జాబితాలను జోడించలేరు, సవరించలేరు, ఎవరినీ ఆహ్వానించలేరు, సెట్టింగ్‌లను మార్చలేరు."
    - q: "బాకీ ఉండగా ఎవరైనా వెళ్లిపోవచ్చా?"
      a: "లేదు. ఒక్క కరెన్సీలో అయినా ఇవ్వాల్సినవి లేదా రావాల్సినవి ఉంటే ఎవరూ గ్రూప్ వదలలేరు. ముందు లెక్క తేల్చుకోండి, తర్వాత వెళ్లండి."
    - q: "గ్రూప్ మూసివేస్తే ఏమవుతుంది?"
      a: "దాన్ని ఎవరూ మళ్లీ తెరవలేరు. అడ్మిన్ మాత్రమే గ్రూప్‌ను మూసివేయగలరు, నిర్ధారించడానికి గ్రూప్ పేరు టైప్ చేయాలి, తర్వాత గ్రూప్ అందరికీ అందుబాటులో ఉండదు. మార్పులను ఆపాలనుకుంటే మాత్రమే, లాక్ చేయండి. మీ సొంత డాష్‌బోర్డ్ నుండి తీసేయాలనుకుంటే మాత్రమే, ఆర్కైవ్ చేయండి."
    - q: "లాక్‌ను వెనక్కి తీసుకోవచ్చా?"
      a: "అవును. అడ్మిన్ గ్రూప్‌ను అన్‌లాక్ చేయవచ్చు, మార్పులు మళ్లీ పనిచేస్తాయి."
    - q: "ప్రజలు చేరే ముందు వాళ్లను ఆమోదించాలా?"
      a: "మీకు కావాలంటేనే. కొత్త గ్రూప్‌లు ఓపెన్ సహకారంతో మొదలవుతాయి, అక్కడ లింక్ వాడినవాళ్లు తనంతట తామే చేరతారు. అడ్మిన్ ఆమోదాన్ని ఆన్ చేస్తే, లేదా మేనేజ్డ్ గ్రూప్ ఎంచుకుంటే, అడ్మిన్ లోపలికి రానిచ్చే వరకు ప్రతి వ్యక్తి వేచి ఉంటారు."
    - q: "ఒక గ్రూప్‌లో ఎంతమంది ఉండవచ్చు?"
      a: "50 మంది వరకు."
