meta:
  title: Ang ginagawa at hindi ginagawa ng Side Badger
  description: Paghahati, pag-settle up, at maraming pera, kasama ang mga grupo, listahan, at poll. Ang buong gamit, at tapat na listahan ng mga hindi ginagawa ng Side Badger.
h1: Ang ginagawa ng Side Badger
navLabel: Mga feature
lead: Lahat ng laman ng kahon, at ang wala.
intro: Narito ang buong gamit. Sadyang iniwan namin ang spreadsheet. Magsimula sa tatlong trabahong ginagawa ng Side Badger araw-araw, saka tingnan ang iba pa sa listahan at ang maikling listahan ng mga hindi nito ginagawa.
cta:
  heading: Kaya ba nitong gawin ang kailangan ng grupo mo?
  body: Gumawa ng libreng account at subukan muna sa maliit na grupo.
  button: Gumawa ng libreng account
cardsHeading: Ang tatlong trabaho, nang detalyado
sections:
  - heading: Pag-scan ng resibo
    body: Kunan ng litrato ang resibo at pupunan ng Side Badger ang kabuuan, petsa, at lugar para suriin mo. Binabasa ng AI service ng Google ang mga larawan ng resibo.
  - heading: Mga grupo at pahintulot
    body: Gumawa ng grupo para sa bawat bahay, biyahe, o event, na may hanggang 50 tao. Mag-imbita gamit ang link o QR code. Sa mas malaking grupo, gawing viewer ang isang tao, na nakakakita ng lahat pero walang binabago.
  - heading: Mga listahan at poll
    body: Ilagay ang shared na listahan ng bibilhin sa tabi ng mga bayarin sa pamimili. Ipaboto ang shortlist ng villa, nang anonymous kung gusto mo.
  - heading: Lahat ng iba pa
    items:
      - "**Live na update:** magdagdag ng gastos at makikita ito agad ng lahat."
      - "**Mga wika:** gamitin ang Side Badger sa 39 wika. Makakapili ang bawat isa sa grupo ng sarili niyang wika."
      - "**Home screen:** hindi kailangan ng app store. Mag-sign in, saka idagdag ang Side Badger sa home screen mo at bubukas ito na parang app. Ipinapakita ng Settings sa app kung paano."
      - "**Feedback:** may nakitang bug? Sabihin sa amin mula sa loob ng app at mababasa mo roon ang sagot namin."
  - heading: Ang hindi ginagawa ng Side Badger
    items:
      - "**Maglipat ng pera.** Hindi kailanman ginagalaw ng Side Badger ang pera mo. Magbayaran kayo sa paraang gusto ninyo. Nakaplano ang mga payment request."
      - "**Umulit ng bayarin.** Walang umuulit na gastos. Kopyahin ang bayarin noong nakaraang buwan sa dalawang tap."
      - "**Maghati ayon sa item.** Isang nagbayad sa bawat gastos. Hatiin nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento."
      - "**Magbigay ng native app.** Gumagana ito sa browser mo. Mag-sign in, saka idagdag ito sa home screen."
      - "**Gumana offline.** Kailangan nito ng koneksyon."
      - "**Magpadala ng alerto sa email o text.** Lumalabas ang mga notification sa app. Nakaplano ang mga push notification."
      - "**Gumuhit ng tsart o budget.** Binibilang lang nito kung sino ang may utang kanino, at iyon na ang buong gimik."
      - "**Mag-sign in gamit ang Google o Apple.** Mag-sign up gamit ang email. Nakaplano ang pag-sign in gamit ang Google at Apple."
      - "**Magpapasok ng taong walang account.** Kailangan ng libreng account ng lahat sa grupo."
faq:
  heading: Mga tanong
  items:
    - q: Puwede ba akong magbayad sa pamamagitan ng Side Badger?
      a: Hindi. Nagbibilang lang ang Side Badger at hindi nito ginagalaw ang pera mo. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad.
    - q: May mobile app ba?
      a: Wala sa app store. Gumagana ang Side Badger sa browser mo. Mag-sign in sa telepono mo, saka idagdag ito sa home screen para bumukas na parang app. Ipinapakita ng Settings sa app kung paano.
    - q: Puwede ba akong maghati ayon sa item?
      a: Hindi. Isa ang nagbabayad sa bawat gastos, at hinahati mo ito nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento.
    - q: Gumagana ba ito offline?
      a: Hindi, kailangan nito ng koneksyon.
    - q: Kailangan ba ng account ng lahat sa grupo?
      a: Oo. Kailangan ng libreng account ng lahat sa grupo, at email address lang ang kailangan para mag-sign up.
