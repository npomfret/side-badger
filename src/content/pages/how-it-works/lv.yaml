sections:
  - heading: "39 valodas, un veidots vairāk cilvēkiem"
    body: "Izmantojiet Side Badger 39 valodās, tostarp arābu, persiešu un urdu valodā ar rakstību no labās uz kreiso. Katrs grupas dalībnieks var izvēlēties savu valodu, tāpēc grupas lapa vienam cilvēkam var būt arābu, nākamajam angļu valodā. Tas veidots arī, domājot par tastatūras un ekrāna lasītāja lietotājiem, un dalībnieku krāsām ir raksti, lai nebūtu jāšķir zaļš no sarkana."
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai ikvienam vajadzīgs konts?"
      a: "Jā, bezmaksas konts. Katrs cilvēks apstiprina savu e-pastu, pirms ko pievieno."
    - q: "Vai ir lietotne?"
      a: "Tā darbojas pārlūkprogrammā. Pierakstieties un pēc tam pievienojiet to sākuma ekrānam vai dokam, lai tā atvērtos kā lietotne. Kā to izdarīt, parāda lietotnes iestatījumi. Lietotņu veikala versijas un bezsaistes režīma nav."
    - q: "Vai Side Badger pārvieto naudu?"
      a: "Nē. Tas uztur uzskaiti un iesaka maksājumus, bet jūs samaksājat viens otram, kā vēlaties. Pēc tam maksājumu reģistrējat. Skatiet [norēķināšanās](page:feature/settle-up)."
    - q: "Vai kāds var aiziet, būdams parādā?"
      a: "Nē. Neviens nevar pamest grupu, kamēr viņam kāds ir parādā vai viņš ir parādā, tāpēc vispirms jānorēķinās."
    - q: "Cik cilvēku var pievienoties grupai?"
      a: "Līdz 50 cilvēkiem grupā. Uzaiciniet tos ar saiti vai QR kodu un ieslēdziet apstiprināšanu, ja vēlaties, lai administrators katru ielaiž."
    - q: "Kā ar ceļojumiem, kuros ir vairāk nekā viena valūta?"
      a: "Atlikumi tiek uzturēti atsevišķi katrai valūtai. Skatiet [vairākas valūtas](page:feature/multiple-currencies)."
