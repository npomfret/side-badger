meta:
  title: "총각·처녀 파티 주말 비용 나누는 방법 | 사이드 배저"
  description: "주인공은 한 푼도 내지 않고, 월요일에도 모두 서로 말을 하고 지냅니다. 총각·처녀 파티 주말 비용을 계산식과 함께 나누는 방법입니다."
h1: "총각·처녀 파티 주말 비용 나누는 방법"
navLabel: "총각·처녀 파티 주말"
lead: "주인공은 아무것도 내지 않으니, 나머지 그룹이 모든 비용을 그들끼리 [똑같이](page:feature/split-expenses) 나눕니다. 빠진 비용에서는 사람을 빼고, 서프라이즈가 유지되도록 주인공은 그룹에 넣지 마세요."
cta:
  heading: "계산은 챙기고, 서프라이즈는 지키세요"
  body: "그룹을 만들고, 주인공만 빼고 모두에게 링크를 보내고, 비용이 생길 때마다 추가하세요. 사이드 배저는 무료이고, 광고도 일일 한도도 없습니다."
sections:
  - heading: "친구 넷과 서프라이즈 하나"
    body: "Hannah, Isla, Jess, Kat은 Grace를 위한 처녀 파티 주말 여행을 떠납니다. Grace가 주인공이라 아무것도 내지 않아요. Grace는 그룹에도 없으므로, 친구들이 자기를 위해 얼마를 쓰는지 볼 수 없습니다. Hannah는 시골집을 예약하고, Isla는 스파 데이 비용을 내고, Jess는 저녁을 사고, Kat은 택시비를 냅니다. 일요일쯤이면 모두가 무언가를 결제했고, 누가 앞서 있는지는 아무도 말하지 못해요. 계산은 총각 파티든 처녀 파티든, 주인공이 누구든 똑같습니다."
  - heading: "그 자리에 있는 사람이 아니라 내는 사람 수로 나누세요"
    body: "주인공의 몫은 사라지지 않습니다. 나눠서 냅니다. 시골집은 £720인데 친구 네 명이 내니까 한 사람당 £180이고, Grace의 자리는 이 금액에 이미 들어 있어요. 저녁은 £260이니 한 사람당 £65, 택시는 £44이니 한 사람당 £11입니다. 누군가 빠진 비용은 그 지출에서만 빠집니다. Kat은 스파에 빠지므로, Grace의 자리까지 포함한 스파 비용 £360를 Hannah, Isla, Jess가 한 사람당 £120씩 나눕니다. 모두 더하면 Hannah, Isla, Jess는 각각 주말 비용 £376를 내야 하고, Kat은 £256를 내야 합니다."
  - heading: "사이드 배저에서 설정하기"
    items:
      - "주말을 위한 그룹을 만들고 눈에 띄지 않는 심심한 이름을 붙이세요. 예를 들면 ‘시골집 주말’이요. Grace는 멤버가 아니고, 그룹은 멤버만 볼 수 있습니다."
      - "**다른 사람 초대**를 누르고, Grace가 볼 수 없는 곳에서만 링크를 보내거나 QR 코드를 보여 주세요. 링크를 열면 참여하기 전에 그룹 미리보기가 나옵니다. 링크가 유지되는 기간은 15분에서 5일 사이에서 고르세요. 오래된 링크도 만료될 때까지는 계속 작동하니, 필요한 기간보다 길게 두지 마세요."
      - "비용마다 **비용 추가**를 누르고 금액을 입력한 뒤 **누가 지불했나요?**에서 결제자를 고르세요. **분할 대상**에서는 비용을 내는 사람에게만 체크하고, 스파에 빠진 Kat처럼 빠진 사람은 빼세요. **분할 방법**에서는 **균등**을 고르세요."
      - "집에 돌아오면 그룹의 **잔액**을 여세요. 사이드 배저는 누가 누구에게 빚졌는지 보여 주고 짧은 결제 목록을 제안합니다. 여기서는 세 건입니다. Kat이 Hannah에게 £212를, Jess가 Hannah에게 £116를, Isla가 Hannah에게 £16를 지불합니다. 원하는 방법으로 서로 지불한 다음 **정산하기**에서 결제를 하나씩 기록하세요."
  - heading: "예약하기 전에, 예산과 보증금"
    body: "예약하기 전에 예산부터 합의하세요. **투표 추가**를 누르고 시골집에 얼마까지 쓸지 물은 다음, 몇 가지 금액을 선택지로 올리세요. 투표를 만들 때 **익명 투표**를 켜서 누가 무엇에 투표했는지 숨기면, 아무도 더 적은 예산을 소리 내어 변호할 필요가 없습니다. 모두가 투표하면 투표를 종료하세요. 가장 많은 표를 얻은 선택지가 표시됩니다. 그다음은 보증금입니다. 예약하는 사람이 보증금을 내고 똑같이 나눈 지출로 추가하며, 잔금은 기한이 되면 두 번째 지출로 넣습니다. 나머지 사람들은 자기 몫을 바로 보내고 결제를 기록할 수도 있고, 최종 계산을 기다려도 됩니다. 어느 쪽이든 잔액은 똑같이 나옵니다."
  - heading: "하룻밤만 합류하는 사람이 있을 때"
    body: "토요일에만 나타나는 친구가 금요일 몫까지 내서는 안 됩니다. 함께하지 않은 비용에서는 그 친구를 빼세요. 방처럼 사람마다 머문 기간에 따라 비용이 달라질 때는 **분할 방법**에서 **정확한 금액**을 고르고 각자의 몫을 입력하세요. 몫의 합은 총액과 같아야 합니다. 먼저 한 사람의 하룻밤 값을 구한 다음, 각자 묵는 밤 수를 곱하세요. 모두에게 똑같지 않은 비용에 대해서는 [그룹 여행](page:use-case/group-trips) 페이지에 더 자세히 나와 있습니다."
  - heading: "이 경우 사이드 배저가 하지 않는 일"
    items:
      - "돈을 옮기지 않습니다. 계좌 이체, 현금, 편한 방법으로 서로 지불한 다음 결제를 기록해서 모두의 잔액이 업데이트되게 하세요."
      - "결제 알림을 보내지 않습니다. 단체 채팅방에서 다정하게 재촉하는 일은 여전히 사람의 몫입니다."
      - "지출 하나에 결제자는 한 명이고, 사이드 배저는 영수증을 품목별로 나눌 수 없습니다. 시골집을 카드 두 장으로 결제했다면 지출을 두 건 입력하세요. 저녁에 일부가 추가 주문을 했다면 추가 주문분을 별도 지출로 입력하세요."
      - "돈을 기록할 뿐 일정은 기록하지 않습니다. 투표와 댓글은 비용에만 남으므로, 주말 계획은 단체 채팅방에 두세요."
exampleAfter: 2
