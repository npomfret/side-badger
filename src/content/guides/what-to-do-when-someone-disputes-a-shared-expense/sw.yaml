meta:
  title: "Cha kufanya mtu akipinga gharama ya pamoja | Side Badger"
  description: "Achana na ujumbe wa kuchomoa. Hoji gharama badala yake nayo inaondoka kwenye salio la kila mtu mnapozungumza. Imehesabiwa kwa £45 za divai ya sherehe."
h1: "Cha kufanya mtu akipinga gharama ya pamoja"
navLabel: "Gharama zinazopingwa"
lead: "Uliza swali kwenye gharama badala ya kutuma ujumbe wa kuchomoa. Swali likiwa wazi, gharama nzima inabaki nje ya salio la kila mtu. Zungumzeni kwenye maoni, hariri mgawanyo kama kikundi kinakubali, na mwache aliyeuliza, au msimamizi, afunge swali."
cta:
  heading: "Uliza swali gumu kwa upole"
  body: "Fungua akaunti ya bure, anzisha kikundi cha nyumba na umwombe msimamizi awashe maswali ya gharama, ambayo yamezimwa hadi mtu awashe. Unataka ziara kwanza? Tazama [jinsi inavyofanya kazi](page:how-it-works) au [kile ambacho bure inajumuisha](page:pricing)."
sections:
  - heading: "Wapangaji wenza watatu na £45 za divai"
    body: "Baada ya sherehe, Tom anaongeza divai kwenye kikundi cha nyumba. Ni £45, zililipwa na Tom, zikigawanywa sawa kati ya Tom, Priya na Aisha, yaani £15 kila mmoja. Aisha hanywi pombe. Tom aliinunua kwa ajili ya sherehe, na sherehe ilikuwa ya [nyumba](page:use-case/housemates), kwa hivyo hajafanya kosa lolote. Aisha pia hakosei kuuliza. Hapa hakuna mtu mbaya. Kuna tu £15 za divai zinazobishaniwa na njia nyingi za kulifanya liwe gumu. Ujumbe wa kuchomoa kwa nyumba nzima ni mojawapo. Swali kwenye gharama ni njia ya upole zaidi."
  - heading: "Swali hufanya nini"
    body: "Aisha anafungua gharama na kuuliza swali. Gharama nzima inaondoka kwenye salio la kila mtu, si sehemu yake tu, na hakuna kingine kinachoathirika. Ununuzi mkubwa (£84) na mfanyakazi wa usafi (£60) bado vinahesabiwa, yaani £28 + £20 = £48 kila mmoja. Kwa hivyo divai ikiwa imesimamishwa, Aisha anadaiwa £48, Tom anadai £36 na Priya anadai £12. Chochote nyumba itakachoamua kuhusu divai, salio la mtu halilijumuishi kwa sasa. Yeyote mwingine kwenye gharama pia anaweza kuuliza swali lake. Divai inarudi kwenye salio tu swali la mwisho lililo wazi likifungwa, na swali linafungwa na aliyeuliza au na msimamizi."
  - heading: "Kuzungumza, kisha kurekebisha"
    body: "Swali la Aisha linaingia kwenye maoni ya gharama, kwa hivyo majibu yanakaa chini yake moja kwa moja. [Kupanga pamoja](page:feature/plan-together) kuna zaidi kuhusu maoni na maswali. Tom na Priya wanalisoma na nyumba inazungumza. Wanaamua divai ilikuwa ya Tom na Priya, kwa sababu ndio waliyoinywa. Nyumba nyingine ingeweza kuweka mgawanyo wa watatu, au kukubaliana kitu cha katikati, na hilo pia lingekuwa sawa. Side Badger inahifadhi mnachokubaliana na haina maoni kuhusu divai. Tom anahariri gharama igawanywe sawa kati yake na Priya, yaani £22.50 kila mmoja (£45 ÷ 2). Aisha hayumo tena, kwa hivyo swali lake linaondoka na toleo la zamani na divai inarudi kwenye salio. Toleo la awali linahifadhiwa."
  - heading: "Kusoma matokeo"
    body: "Divai ikiwa imerudi, Tom anadai £58.50, Priya anadaiwa £10.50 na Aisha anadaiwa £48. Side Badger inapendekeza malipo mawili, yote kwa Tom. £48 za Aisha ni kiasi alichokuwa nacho divai ilipokuwa imesimamishwa, kwa sababu hayumo ndani yake. Priya ametoka kudai £12 hadi kudaiwa £10.50, ambazo ni nusu yake ya £22.50 za divai. Mgawanyo wa watatu ungebaki, Aisha angedaiwa £63 (£28 + £20 + £15). Mzozo wote ulikuwa na thamani ya £15. Lipaneni mtakavyo, kisha rekodi kila malipo chini ya **Lipa deni**. [Kumaliza hesabu](page:feature/settle-up) kunaeleza yaliyobaki."
  - heading: "Kuandika ili watu waendelee kuzungumza nawe"
    body: "Swali la Aisha: \"Sikunywa divai yoyote. Tunaweza kuangalia mgawanyo?\" Ni fupi, linataja gharama na linauliza badala ya kushutumu. Tabia chache zinasaidia."
    items:
      - "**Uliza kuhusu gharama, si mtu.** \"Tunaweza kuangalia mgawanyo wa divai?\" huanzisha mazungumzo. \"Kwa nini nimetozwa divai yako?\" huanzisha aina nyingine."
      - "**Sema unachotaka kitokee.** \"Inaweza kuwa watu walioinywa tu?\" inawapa kikundi kitu cha kukubali au kujibu."
      - "**Toa sababu kwa sentensi moja au mbili.** Sehemu hiyo inaitwa **Swali lako** na haiwezi kuachwa tupu."
      - "**Weka majibu mahali pamoja.** Majibu yanaenda kwenye maoni ya gharama, karibu na nambari zinazohusika."
  - heading: "Iweke kwenye Side Badger"
    items:
      - "**Washa maswali.** Yamezimwa kwa chaguomsingi. Msimamizi anafungua **Mipangilio** ya kikundi, anawasha **Ruhusu maswali ya gharama** chini ya **Vipengele** kwenye kichupo cha **Jumla** na kuchagua **Hifadhi**. Ukizima baadaye, maswali yote yaliyo wazi yanafutwa."
      - "**Uliza moja.** Fungua gharama na, kando ya jina lako kwenye mgawanyo, chagua **Nina swali**. Andika sababu yako kwenye **Swali lako** na uchague **Nina swali** tena. Watu walio kwenye gharama pekee ndio wanaoweza kufanya hivi. Gharama sasa inaonyesha beji ya **Inahojiwa**."
      - "**Tafuta kilichosimamishwa.** Kwenye orodha ya gharama, **Inahojiwa tu** inaonyesha gharama zenye swali lililo wazi."
      - "**Irekebishe, kikundi kikikubali.** Fungua gharama, chagua **Hariri**, badilisha **Gawanya kati ya** na uchague **Sasisha Gharama**. Nani anaweza kuhariri inategemea ruhusa za kikundi."
      - "**Ifunge, kama hakuna kinachohitaji kurekebishwa.** Aliyeuliza anaweza kutumia kitufe cha kufunga kwenye beji yake ya **Inahojiwa**, kinachoitwa **Funga swali**, na msimamizi pia anaweza. Gharama inarudi kwenye salio swali lake la mwisho likifungwa."
  - heading: "Wakati si nadhifu hivyo"
    items:
      - "**Uhariri unamweka aliyeuliza ndani.** Aliyeuliza akiwa bado kwenye gharama, swali lake linahamia kwenye toleo lililohaririwa na linasubiri yeye, au msimamizi, alifunge. Kurekebisha kiasi si sawa na kukubali kwamba kimerekebishwa."
      - "**Hukuwa kwenye gharama.** Watu walio kwenye gharama pekee ndio wanaoweza kuihoji. Kitu kikionekana kibaya kwako, kitaje kwenye maoni yake au muulize aliyeiongeza."
      - "**Mtu anataka kuondoka kwenye kikundi.** Swali lililo wazi linawazuia watu walio kwenye gharama hiyo kuondoka. Funga swali, au hariri gharama wasiwemo tena, nao wanaweza kwenda."
  - heading: "Kile ambacho Side Badger haifanyi hapa"
    items:
      - "Haiamui nani yuko sahihi. Inaiweka gharama nje ya salio na kuhifadhi mnachokubaliana."
      - "Haimwombi mtu yeyote aidhinishe gharama kabla hazijahesabiwa. Gharama inayohojiwa pekee ndiyo inayosimamishwa."
      - "Haiwezi kuzuia sehemu ya gharama. Ihoji na gharama nzima inaondoka kwenye salio."
      - "Haihamishi pesa. Mnalipana mtakavyo na mnarekodi."
