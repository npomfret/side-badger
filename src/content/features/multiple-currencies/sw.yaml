meta:
  title: "Gawanya gharama kwa sarafu 140, zilizobadilishwa au kutenganishwa"
  description: "Weka kila gharama kwa sarafu uliyolipia, weka salio kando au ubadilishe kwa kiwango unachoweza kuona na kubadilisha, kisha maliza hesabu kwa orodha fupi ya malipo."
h1: "Gawanya gharama kwa sarafu 140"
navLabel: "Sarafu nyingi"
lead: "Euro, yen, na ile teksi moja kwa baht. Side Badger inapokea kila gharama kwa sarafu uliyolipia, inaweka salio sawa, na inaweza kubadilisha kikundi chenu kikipendelea kumaliza mara moja. Inafanya kazi kwa sarafu 140, na inafaa asili kwa [safari za kikundi](page:use-case/group-trips)."
cta:
  heading: "Leta euro zako, leta yen zako"
  body: "Fungua akaunti, anzisha kikundi na ongeza gharama ya kwanza kwa sarafu yoyote uliyokuwa nayo mkononi."
  button: "Fungua akaunti ya bure"
problem:
  heading: "Iweke kama ulivyolipa"
  body: "Safari hulipiwa kwa sarafu moja mara chache. Hoteli ilihifadhiwa nyumbani kwa pauni, chakula cha jioni kililipwa kwa yen, na kahawa ya uwanja wa ndege ilikuwa kwa sarafu yoyote iliyotumika mahali pa kusubiri ndege. Kubadilisha kila kitu kwa mkono kabla hata hujakiweka ndiko kunakofanya lahajedwali ziachwe. Katika Side Badger unaweka kila gharama kwa sarafu iliyo kwenye risiti, na kila kiasi hufuata kanuni za sarafu yake, kwa hivyo yen hazina desimali na dinari zina tatu. Sarafu ulizotumia hivi karibuni huja kwanza kwenye orodha."
workflow:
  heading: "Weka sarafu kando, au badilisha unavyoendelea"
  steps:
    - title: "Ongeza gharama kwa sarafu yake yenyewe"
      body: "Chagua sarafu, andika kiasi, sema nani alilipa na nani alishiriki. Hakuna kingine kinachohitajika. Hili ndilo chaguo-msingi, na linahifadhi kiasi cha awali kama ulivyokiweka hasa."
      shot: S07
      shotAlt: "Fomu ya gharama yenye kiasi cha yen kilichowekwa"
    - title: "Tazama salio kwa kila sarafu"
      body: "Salio huwekwa kando kwa kila sarafu, na kila moja hupata orodha yake fupi ya malipo yanayopendekezwa. Pauni humalizwa kwa pauni na yen kwa yen."
      shot: S10
      shotAlt: "Skrini ya salio yenye madeni yaliyorahisishwa kwa sarafu mbili"
    - title: "Au badilisha, kikundi kikipendelea kumaliza mara moja"
      body: "Chagua sarafu nyingine unapoweka gharama na Side Badger inaweza kuibadilisha kwa kiwango cha sasa cha kubadilisha fedha, ambacho unaweza kukibadilisha kiwe kiwango ulichopata kwa kweli. Kiasi kilichobadilishwa kinaungana na salio katika sarafu hiyo. Ubadilishaji ni uchaguzi wa kikundi, si kitu kinachotokea nyuma ya mgongo wako."
options:
  heading: "Kiwango unachoweza kuona na kubadilisha"
  items:
    - title: "Kiwango kinaonyeshwa"
      body: "Unapobadilisha, kiwango na kiasi kilichobadilishwa huonekana kwenye fomu, kwa hivyo hakuna anayelazimika kuamini nambari bila uthibitisho."
    - title: "Andika chako mwenyewe"
      body: "Umepata kiwango bora kwenye dawati la fedha, au kibaya uwanja wa ndege? Hariri kiwango kiwe ulichopata kwa kweli na kiasi kilichobadilishwa kinasasishwa."
    - title: "Cha awali kinabaki"
      body: "Kiasi cha awali kinabaki kwenye gharama, kando ya kilichobadilishwa, kwa yeyote atakayeuliza kilikuwa kiasi gani kwa yen."
    - title: "Kubadilisha ni bure"
      body: "Kubadilisha hakugharimu chochote. Hakuna ada ya kuweka gharama kwa sarafu nyingine."
