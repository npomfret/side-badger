faq:
  heading: "Maswali"
  items:
    - q: "Je, kikokotoo ni bure?"
      a: "Ndiyo. Bure. Hakuna matangazo. Hakuna vikomo vya kila siku. Huhitaji akaunti pia."
    - q: "Je, kinahifadhi ninachoandika?"
      a: "Hapana. Hakuna kinachohifadhiwa wala kutumwa popote. Ili kutunza nambari zako, tumia Nakili kiungo na uhifadhi kiungo mahali fulani."
    - q: "Nani anaweza kuona kiungo ninachonakili?"
      a: "Yeyote anayekuwa nacho. Nambari ziko ndani ya kiungo chenyewe, baada ya #, kwa hivyo kitume tu kwa watu wanaopaswa kuziona."
    - q: "Je, kinasogeza pesa?"
      a: "Hapana. Kinakokotoa nani anapaswa kulipa nani, nanyi mnalipana mtakavyo. Side Badger pia haigusi pesa zako kamwe. Tazama [kumaliza hesabu](page:feature/settle-up)."
    - q: "Je, naweza kugawanya safari iliyolipwa kwa sarafu mbili?"
      a: "Si hapa, kwa sababu hesabu moja ina sarafu moja. Kwenye kikundi, kila sarafu ina salio lake. Tazama [sarafu mbalimbali](page:feature/multiple-currencies)."
    - q: "Je, kiasi kisipojumlisha sawa?"
      a: "Kikokotoo kinasema hivyo chini ya gharama na hakionyeshi matokeo hadi vijumlishe sawa. Viasi kamili lazima vijumlishe jumla ya gharama, na asilimia lazima zifikie 100."
