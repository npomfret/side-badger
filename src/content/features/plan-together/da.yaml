meta:
  title: Fælles lister, afstemninger og kommentarer | Side Badger
  description: Kommentér udgifter, sæt spørgsmålstegn ved den mærkelige, hold en fælles indkøbsliste, og stem om villaen. Planlæg først, del bagefter. Gratis, uden reklamer.
h1: Planlæg det sammen, del det bagefter
navLabel: Planlæg sammen
lead: Indkøbslisten og indkøbsregningen, endelig på talefod. Side Badger giver jeres gruppe et sted at tale om pengene, både før og efter de er brugt, med kommentarer på hver udgift, en måde at sætte spørgsmålstegn ved dem, der ser forkerte ud, og fælles lister og afstemninger til de store beslutninger. Så [deler I udgifterne](page:feature/split-expenses) som sædvanligt.
cta:
  heading: Planlæg det, og del det så
  body: Opret en gratis konto, start en gruppe, og læg den første liste, afstemning eller det første spørgsmål lige ved siden af pengene. Ved du ikke, hvad der sker bagefter? Se [sådan virker det](page:how-it-works).
problem:
  heading: Chatten er herovre, regningen er derovre
  body: Gruppens udgifter bor som regel to steder. Tallene står ét sted, og skænderiet om tallene står i en chat, der scrollede væk tirsdag. Indkøbslisten er et billede af et køleskab. Villaen blev besluttet med en tommelfinger op fra de fleste, formentlig. Side Badger holder planlægningen i gruppen, lige ved siden af de udgifter, den handler om, så der er en kommentar, hvor prisen er, en liste, hvor indkøbet er, en afstemning til den store beslutning og en måde at sige »vent lidt, er det her rigtigt?« uden at skrive et helt afsnit. Det hele handler om gruppens penge, og det er det, gruppen er til for.
workflow:
  heading: Fra villaafstemning til indkøbsregning
  steps:
    - title: Stil den store beslutning til afstemning
      body: Tilføj en afstemning om den beslutning, der afgør regningen, f.eks. hvilken villa. Vælg to til ti muligheder, sig, hvor mange stemmer hver person får, og luk den, når alle har stemt, og vinderen er markeret.
      shot: S17
      shotAlt: En lukket afstemning med den vindende mulighed markeret og antallet af stemmer ved siden af hver mulighed
    - title: Skriv indkøbslisten sammen
      body: Start en fælles liste, tilføj varerne, og kryds dem af, efterhånden som de lander i indkøbsvognen. Indkøbet kommer bagefter ind som en udgift.
      shot: S16
      shotAlt: En fælles indkøbsliste med nogle varer krydset af og en optælling af fremskridt
    - title: Tal om prisen, dér hvor den bor
      body: Kommentér selve udgiften, vedhæft kvitteringen, og reager med en emoji. Samtalen bliver stående ved siden af det tal, den handler om.
      shot: S08
      shotAlt: En udgift med sine detaljer, et miniaturebillede af kvitteringen, en kommentartråd og emoji-reaktioner
    - title: Sæt spørgsmålstegn ved den, der ser skæv ud
      body: Hvis gruppen har slået udgiftsspørgsmål til, kan enhver, der er med i en udgift, vælge **Jeg har et spørgsmål**. Udgiften holdes uden for saldiene, til spørgsmålet er afklaret.
      shot: S18
      shotAlt: Udgiftslisten med et mærke for Betvivlet og filteret Kun betvivlet
    - title: Se, hvad der er ændret, og hvem der ændrede det
      body: Aktivitetsfeedet og notifikationsklokken viser, hvad der er nyt på tværs af dine grupper. Push-notifikationer er der, hvis du vil have dem.
      shot: S19
      shotAlt: Notifikationslisten med en oversigt over seneste aktivitet
