faq:
  heading: "Villa question dem"
  items:
    - q: "Wetin if somebody cancel?"
      a: "Remove dem nights, redo di sums and edit di villa expense so di exact amounts go add up to di price again. Di earlier version dey kept and di edit go show for di group activity, so nobody go change number quietly. Who fit edit depend on di group permissions."
    - q: "Di person wey book suppose pay less?"
      a: "Na for di group to decide. To book na work, and groups no dey agree on whether e deserve discount. Whatever una agree, put am inside di exact amounts and write am for note on di expense, or for comment next to am, so nobody go need remember di deal."
    - q: "We fit share cleaning fees different way?"
      a: "Yes. Enter di fee as separate expense and give am im own split. Equal-equal suit flat charge for di whole house. Exact amounts suit group wey wan make di fee follow di nights too."
