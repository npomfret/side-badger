faq:
  heading: "Maswali"
  items:
    - q: "Side Badger inatumia kiwango gani cha kubadilisha fedha?"
      a: "Kiwango cha sasa cha kubadilisha fedha, kinachochukuliwa unapoingiza gharama pale kinapopatikana. Unaweza kukibadilisha kiwe kile ulichopata kweli."
    - q: "Je, kikundi kinaweza kushikilia pauni na yeni tu?"
      a: "Ndiyo. Kwenye **Mipangilio** ya kikundi, washa **Weka vizuizi vya sarafu kwa kikundi hiki** chini ya **Mipangilio ya Sarafu**, chagua **Sarafu zinazoruhusiwa** na uweke **Sarafu chaguomsingi kwa gharama mpya**. Chaguo chache kwenye orodha, makosa machache kwenye kaunta ya malipo."
    - q: "Je, ni lazima tubadilishe kabisa?"
      a: "Hapana. Sarafu hubaki tofauti isipokuwa wewe au kikundi chenu mchague kubadilisha, na kila sarafu ina orodha yake fupi ya malipo."
