sections:
  - heading: Eine Zahlung erfassen
    body: Wenn jemand zahlt, erfasse es bei der richtigen Person. Die Schnellausgleich-Schaltflächen tragen den Betrag aus deinen vorgeschlagenen Zahlungen ein, und du kannst eine Notiz wie "Banküberweisung" hinzufügen (bis zu 500 Zeichen). Zahlst du nur einen Teil dessen, was du schuldest, bleibt der Rest auf dem Saldo. Wenn du zu wenig oder zu viel eingibst, warnt dich Side Badger vor dem Speichern. Zum Erfassen einer Zahlung brauchst du die Berechtigung, Ausgaben zu bearbeiten, und das Datum darf nicht in der Zukunft liegen.
  - heading: In einer anderen Währung bezahlt?
    body: Salden bleiben in der Währung, in der sie bezahlt wurden, eine Euro-Schuld bleibt also eine Euro-Schuld. Du schuldest Euro und zahlst in Pfund? Rechne die Zahlung bei der Eingabe um, zu einem aktuellen Wechselkurs oder zu dem Kurs, den du tatsächlich bekommen hast. Der Kurs wird beim Speichern der Zahlung festgelegt. [Mehrere Währungen](page:feature/multiple-currencies) erklärt, wie die Umrechnung funktioniert, und [Gruppenreisen](page:use-case/group-trips) zeigt sie im Einsatz.
  - heading: Ein Verlauf, den du prüfen kannst
    body: Jede erfasste Zahlung bleibt mit Datum, Betrag und Notiz im Gruppenverlauf. Nur die Person, die eine Zahlung erfasst hat, kann sie bearbeiten, und sie oder ein Gruppen-Admin kann sie löschen. Eine Zahlung, an der jemand beteiligt ist, der die Gruppe verlassen hat, ist gesperrt. Ein durchgerechnetes Mitbewohner-Szenario findest du unter [Mitbewohner](page:use-case/housemates).
limits:
  heading: Was Side Badger nicht kann
  items:
    - Side Badger bewegt kein Geld, sendet keine Zahlungslinks und keine Zahlungsanfragen. Eine Zahlung in der App ist die Aufzeichnung einer Zahlung, die anderswo erfolgt ist.
    - Die vorgeschlagenen Zahlungen stammen aus einem einfachen Zuordnungsverfahren, pro Währung angewendet. Es schlägt immer weniger Zahlungen vor, als es Personen mit einem Saldo in dieser Währung gibt (bei vier Personen höchstens drei Zahlungen), findet aber nicht immer die kleinstmögliche Zahl.
    - Du kannst die Vorschläge nicht ausschalten. **Alle anzeigen** listet jede vorgeschlagene Zahlung der Gruppe, nicht nur deine.
    - Währungen werden nie gegeneinander verrechnet, es sei denn, die Ausgaben wurden bei der Eingabe umgerechnet.
    - Es gibt keine Erinnerungen, das Hinterherlaufen bleibt also deine Sache.
useCasesHeading: Wo Abrechnen zählt
faq:
  heading: Fragen
  items:
    - q: Schickt Side Badger das Geld?
      a: Nein. Zahlt einander, wie ihr wollt, und erfasse die Zahlung dann in Side Badger, damit sich der Saldo aktualisiert.
    - q: Kann ich die vorgeschlagenen Zahlungen ausschalten?
      a: Nein. Die Vereinfachung bleibt an, und **Alle anzeigen** listet jede vorgeschlagene Zahlung der Gruppe, nicht nur die, die dich betreffen.
    - q: Warum werden Euro und Pfund getrennt geführt?
      a: Salden bleiben in der Währung, in der du bezahlt hast, es sei denn, du rechnest bei der Eingabe einer Ausgabe oder Zahlung um. Schulden in verschiedenen Währungen werden nie gegeneinander verrechnet.
    - q: Was, wenn jemand nur einen Teil seiner Schulden zahlt?
      a: Erfasse den gezahlten Teil. Der Rest bleibt auf dem Saldo, bis er bezahlt ist.
    - q: Ist das immer die kleinstmögliche Zahl von Zahlungen?
      a: Nicht garantiert. Es schlägt immer weniger Zahlungen vor, als es Personen mit einem Saldo in dieser Währung gibt, bei vier Personen also nie mehr als drei. Im Mitbewohner-Beispiel sind das zwei Zahlungen, wo es beim direkten Zurückzahlen an jede Person sechs waren.
