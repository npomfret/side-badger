faq:
  heading: "सवाल"
  items:
    - q: "क्या बेस्ट मैन या मेड ऑफ़ ऑनर को ज़्यादा देना होता है?"
      a: "सिर्फ़ तब जब ग्रुप सहमत हो। ऐप किसी को हिसाब में कोई खास भूमिका नहीं देता। अगर कोई ज़्यादा उठा रहा है, तो **विभाजन कैसे करें** में **सटीक राशियाँ** या **प्रतिशत** चुनें और वे हिस्से डालें जिन पर आप सहमत हुए हैं।"
    - q: "उन ड्रिंक्स का क्या जो कुछ लोगों ने नहीं पीं?"
      a: "ड्रिंक्स को अलग खर्च के रूप में जोड़ें और सिर्फ़ उन्हीं को टिक करें जिन्होंने वे लीं। अगर सबने अलग-अलग मात्रा में लीं, तो **सटीक राशियाँ** चुनें और हर व्यक्ति का हिस्सा टाइप करें। जो उन्होंने नहीं लिया, उसका पैसा कोई नहीं देता।"
    - q: "क्या मेहमान-ए-खास को बाद में ग्रुप दिख सकता है?"
      a: "हाँ, जब सरप्राइज़ खत्म हो जाए। उन्हें इनवाइट करें, फिर एक एडमिन ग्रुप की सेटिंग में **सुरक्षा और अनुमतियाँ** के तहत उन्हें **दर्शक** बना सकता है। दर्शक सब कुछ देखता है और कुछ बदलता नहीं, इसलिए तब तक रुकें जब तक कुछ भी राज़ न रहे। जुड़ने के लिए उन्हें मुफ्त अकाउंट चाहिए।"
