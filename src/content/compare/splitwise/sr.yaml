sections:
  - heading: Разговор о новцу, уз новац
    body: Уз заједнички новац иду брбљање, недоумице и планови. Side Badger држи сва три уз бројке, па нико не мора да листа уназад по чету.
    items:
      - "**Коментари тамо где им је место.** Коментариши саму групу или било који трошак, листу или анкету, и држи разговор уз ствар на коју се односи."
      - "**Фискални рачуни и фотографије.** Уз сваки трошак чувај до три фискална рачуна, а коментарима на групу, листу или анкету додај фотографије или PDF-ове."
      - "**Питања, а не свађе.** Администратор може да укључи питања, па свако у трошку може да постави питање о њему. Не улази у стања док се не реши."
      - "**Листе и анкете.** Држи заједничку листу за куповину уз трошкове куповине, а ужи избор вила стави на гласање, анонимно ако хоћеш."
      - "**Мало аплауза.** Реагуј на трошкове, уплате и коментаре, и прослави уплату кад стигне."
  - heading: Твоја група, твоја правила
    body: Splitwise-ов центар за помоћ каже да не подржава администраторе групе ни посебна овлашћења. Side Badger има улоге и овлашћења, за групе којима треба неко ко води рачуна да бројке буду уредне.
    items:
      - "**Администратори, чланови и посматрачи.** Некога направи посматрачем: види све, а не мења ништа."
      - "**Два унапред подешена режима или свој.** Почни са режимом Отворено или Управљано, или сам подеси свако овлашћење: ко уређује и брише трошкове, уређује листе, позива и прима нове људе."
      - "**Одобрење за придруживање.** Укључи одобрење и администратор прима сваку особу."
      - "**Подешавања саме групе.** Ограничи је на валуте које заиста користиш, изабери њену подразумевану валуту и дај јој насловну слику."
      - "**Закључај кад је готово.** Бројке остају како јесу док администратор не откључа."
  - heading: Бесплатно овде, плаћено тамо
    body: Splitwise Pro је Splitwise-ов плаћени план, а његова Pro страница продаје три ствари које у Side Badger-у ништа не коштају.
    items:
      - "**Скенирање рачуна.** Splitwise Pro скенира слику твог рачуна. Side Badger то ради бесплатно, без кредита за скенирање: попуњава укупан износ, датум и место да их провериш."
      - "**Претварање валута.** Splitwise Pro претвара трошкове групе у твоју подразумевану валуту кад додирнеш Convert. Side Badger претвара сваки трошак док га уносиш, по актуелном девизном курсу или оном који си заиста добио, а изворни износ остаје уз трошак."
      - "**Без дневних ограничења.** Splitwise Pro продаје неограничене трошкове, а његов центар за помоћ каже да бесплатни корисници могу додати до 4 трошка дневно. Side Badger нема дневних ограничења."
  - heading: Твоја банка остаје по страни
    body: Side Badger се не повезује са твојом банком и не тражи податке о твојој банци. Води евиденцију ко коме дугује; платите једни другима како год желите, па забележи уплату. Банковну пријаву не мораш никоме да дајеш, па је једна брига мање.
  - heading: Једна апликација, у прегледачу и на телефону
    body: Side Badger ради у твом прегледачу. Пријави се, додај га на почетни екран и отвара се као апликација. То је иста апликација у оба случаја, па је нова функција на твом телефону чим га следећи пут отвориш, без чекања на ажурирање из продавнице апликација.
  - heading: И неколико малих трикова
    items:
      - "**Питај свог асистента.** Side Badger ради са ChatGPT-ом и Claude-ом: затражи од свог да дода трошак, скенира рачун или забележи уплату."
      - "**Свако на свом језику.** Side Badger говори 39 језика и свако бира свој. Splitwise-ова почетна страница наводи 7+. Подржава и 133 валуте, за путовања која воде свуда."
      - "**Помоћ без изласка из апликације.** Заглавио си или нашао грешку? Јави нам из апликације и ту прочитај наш одговор."
  - heading: Где Splitwise и даље побеђује
    body: Радије бисмо да изабереш праву апликацију него да касније сазнаш. Ако твојој групи треба нешто од овога, Splitwise то има, а Side Badger нема.
    items:
      - "**Апликације из продавнице.** Side Badger живи у твом прегледачу и на почетном екрану, а не у продавницама апликација."
      - "**Режим ван мреже.** Side Badger-у је потребна веза."
      - "**Уплате у апликацији.** У неким земљама Splitwise може и да премести новац. Side Badger само води евиденцију."
      - "**Подела по уделима или по ставкама.** Side Badger има једног платиоца по трошку, подељеног једнако, по тачним износима или по процентима. Његово скенирање рачуна не додељује ставке људима."
      - "**Графикони и подразумеване поделе.** Splitwise Pro има обоје. Side Badger води евиденцију ко коме дугује, и то је цео трик."
  - heading: Пребацивање твоје групе
    body: Нема увоза, па селидба значи нови почетак. Прво се поравнајте у Splitwise-у, затим направи групу у Side Badger-у и позови све везом или QR кодом. Свако у групи треба бесплатан кориснички налог, а за регистрацију је довољна имејл адреса.
