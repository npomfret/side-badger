meta:
  title: "গ্রুপ উপহারের জন্য কীভাবে চাঁদা তুলবেন | Side Badger"
  description: "সবাই আলাদা অঙ্ক দেয় আর ধাক্কাটা খায় একজনের কার্ড। বাজেটের পোল চালান, সঠিক পরিমাণ লিখুন আর অঙ্কগুলো Side Badger-কে করতে দিন।"
h1: "গ্রুপ উপহারের জন্য কীভাবে চাঁদা তুলবেন"
navLabel: "গ্রুপ উপহারের চাঁদা"
lead: "গ্রুপ উপহারের জন্য চাঁদা তোলা মানে একজন আগে নিজের পকেট থেকে টাকা দেয় আর বাকি সবাই তাকে নিজ নিজ চাঁদা দিতে ঋণী থাকে। পোল করে একটি বাজেট ঠিক করুন, ক্রেতা উপহারটা নিজের কার্ডে কিনুক, তারপর সেটা একটি খরচ হিসেবে লিখুন [সঠিক পরিমাণে](page:feature/split-expenses), প্রত্যেকের জন্য একটি করে অঙ্ক। ক্রেতার কাছে কার কত দেনা তা Side Badger দেখায়, আর প্রত্যেকে নিজের ভাগ যেভাবে খুশি পাঠিয়ে দেয়।"
cta:
  heading: "চাঁদার বাক্স ছাড়াই চাঁদা তুলুন"
  body: "একটি গ্রুপ বানান, যে উপহারটা পাবে তাকে গ্রুপের বাইরে রাখুন আর উপহারটা সঠিক পরিমাণ দিয়ে লিখুন। Side Badger বিনামূল্যে, কোনো বিজ্ঞাপন নেই, দৈনিক কোনো সীমা নেই। আগে ঘুরে দেখতে চান? দেখুন [কীভাবে কাজ করে](page:how-it-works) বা [বিনামূল্যে কী কী মেলে](page:pricing)।"
sections:
  - heading: "চার বন্ধু, একটি রেকর্ড প্লেয়ার, চার রকম অঙ্ক"
    body: "Bea 30 বছরে পা দিচ্ছে আর তার একটি রেকর্ড প্লেয়ার চাই। Priya, Omar, Lena আর Sam মিলে সেটা তাকে দিচ্ছে। Priya £240-এ একটা খুঁজে পায় আর নিজের কার্ডে কিনে ফেলে, কারণ কাউকে তো আগে শুরু করতে হবে। চারজন সমান চাঁদা দেয় না। Priya আর Omar দেয় £60 করে, Lena £80 আর Sam £40। কেউ নিজের অঙ্কের কারণ বলে না, আর কেউ জিজ্ঞেসও করে না। Omar £12-এ একটি কার্ড আর মোড়কের কাগজও কেনে। চারজনই কার্ডে সই করবে, তাই সেটা সমান ভাগ হয়।"
  - heading: "কেনার বোতামে চাপ দেওয়ার আগেই বাজেট ঠিক করুন"
    body: "একটি বাজেট পোল £400-এর টার্নটেবল নিয়ে তর্ক বাঁচায়। গ্রুপে **পোল যোগ করুন** বেছে জিজ্ঞেস করুন উপহারটির দাম কত হওয়া উচিত। বিকল্পগুলো অঙ্কে রাখুন, যেমন £150 পর্যন্ত, £200 পর্যন্ত আর £250 পর্যন্ত। **বেনামী ভোটদান** চালু করুন, যা কে কীসে ভোট দিয়েছে তা লুকিয়ে রাখে, যাতে ছোট অঙ্কের পক্ষে কাউকে সবার সামনে সাফাই দিতে না হয়। প্রথম ভোট পড়ে গেলে সেটিংস আর বদলানো যায় না, তাই আগে দেখে নিন। পোল নিজে থেকে বন্ধ হয় না। সবাই ভোট দিলে **পোল বন্ধ করুন** বেছে নিন, তখন **বিজয়ী** দেখা যাবে। পোল মোট অঙ্কটা ঠিক করে। কারও ভাগ ঠিক করে না।"
  - heading: "গুনে দেখা"
    body: "উপহারটা ভাগ হয় £60, £60, £80 আর £40-এ, যার যোগফল রসিদের £240। কার্ড আর মোড়ক চারজনে ভাগ হয়, জনপ্রতি £3। Priya-র বিল £60 + £3, অর্থাৎ £63, আর সে দিয়েছে £240, তাই তার পাওনা £177। Omar-এর বিলও £63, কিন্তু সে দিয়েছে £12, তাই তার দেওয়ার আছে £51। Lena-র দেওয়ার আছে £80 + £3, অর্থাৎ £83, আর Sam-এর £40 + £3, অর্থাৎ £43। এই তিনটির যোগফল Priya-র £177। এমনি ছেড়ে দিলে দেনাগুলো গ্রুপের ভেতর পাঁচটি আলাদা পথে ঘুরত। Side Badger তার বদলে তিনটি পেমেন্ট সাজেস্ট করে, সবই Priya-কে। বিস্তারিত জানতে দেখুন [হিসাব মেটানো](page:feature/settle-up)।"
  - heading: "Side Badger-এ বসিয়ে দিন"
    body: "Priya-র দিকের কাজটা প্রায় পাঁচ মিনিটের।"
    items:
      - "**গ্রুপ বানান।** ড্যাশবোর্ডে **গ্রুপ তৈরি করুন** বেছে নিন। তারপর **অন্যদের আমন্ত্রণ জানান** বেছে যারা চাঁদা দিচ্ছে শুধু তাদের কাছে লিঙ্ক বা QR কোড পাঠান, আর কাউকে নয়।"
      - "**উপহার যোগ করুন।** **খরচ যোগ করুন** বেছে বিবরণ লিখুন, 240 লিখুন আর **কে টাকা দিয়েছেন?** অংশে Priya-কে বাছুন। **যাদের মধ্যে ভাগ হবে** অংশে চারজনকেই রাখুন, তারপর **কীভাবে ভাগ হবে** অংশে **সঠিক পরিমাণ** বেছে 60, 60, 80 আর 40 লিখুন। অঙ্কগুলোর যোগফল 240 হতে হবে। চাইলে অর্ডার কনফার্মেশন জুড়ে দিন। **খরচ সংরক্ষণ করুন** বেছে নিন।"
      - "**কার্ড যোগ করুন।** Omar £12 নিজেই যোগ করে, **কে টাকা দিয়েছেন?** অংশে নিজেকে বাছে আর **কীভাবে ভাগ হবে** অংশে **সমান** রেখে দেয়, চারজনকেই টিক দিয়ে।"
      - "**গুনুন, তারপর দিন।** প্রত্যেকে **ব্যালেন্স** দেখে, যেখানে কে কার কাছে ঋণী তা লেখা থাকে, আর নিজের ভাগ যেভাবে খুশি Priya-কে পাঠায়। তারপর **সব শোধ করুন** আর **সেটেলমেন্ট রেকর্ড করুন** দিয়ে রেকর্ড করে। কুইক সেটেল পরিমাণটা ভরে দেয়।"
  - heading: "আগে কিনুন, নাকি আগে তুলুন"
    body: "Side Badger চাঁদার টাকা নিজের কাছে রাখে না, তাই “তোলা” আসলে মানে গোনা। দুটি ক্রম চলে।"
    items:
      - "**আগে কিনুন।** ক্রেতা টাকা দেয়, আসল দামে খরচটা যোগ করে আর সবাই সঙ্গে সঙ্গে নিজের ভাগ দেখে। এটা বেশি গোছানো, কিন্তু লোকজন না দেওয়া পর্যন্ত খরচটা ক্রেতাকে বইতে হয়, তাই এমন কাউকে ক্রেতা বানান যার সেটা বইবার সামর্থ্য আছে।"
      - "**আগে তুলুন।** কেনার আগেই লোকজন ক্রেতাকে নিজের অঙ্ক পাঠায়। দাম জানা হয়ে গেলে উপহারটা লিখুন, তারপর প্রতিটি পেমেন্ট রেকর্ড করুন সেই তারিখে, যেদিন টাকা আসলে হাত বদলেছে। আগে উপহারটা যোগ করুন, যাতে প্রতিটি পেমেন্ট কোনো ব্যালেন্সের বিপরীতে বসতে পারে।"
      - "**দাম নড়ে গেলে।** ডেলিভারি, ডিসকাউন্ট কোড, দেরিতে দাম বাড়া। উপহারটা সম্পাদনা করে সঠিক পরিমাণগুলো এমনভাবে বদলান যাতে যোগফল মেলে। আগের সংস্করণটা রাখা থাকে, তবে আগে গ্রুপকে জানান, কারণ তাদের ব্যালেন্স বদলে যায়।"
  - heading: "Bea-কে এ থেকে দূরে রাখুন"
    body: "একটি গ্রুপ শুধু তার সদস্যরাই দেখতে পায়, তাই যে গ্রুপে Bea নেই সেটা সে দেখতে পাবে না। যারা চাঁদা দিচ্ছে তাদের আমন্ত্রণ জানান, আর কাউকে নয়। একটি লিঙ্ক মেয়াদ শেষ না হওয়া পর্যন্ত কাজ করে, আর আপনি 15 মিনিট থেকে 5 দিনের মধ্যে যেকোনো মেয়াদ বেছে নিতে পারেন, তাই ছোট মেয়াদ বেছে নিন আর লিঙ্কটা এমন জায়গায় পাঠান যেখানে Bea দেখবে না। যে-ই লিঙ্ক খোলে তাকে গ্রুপের একটি প্রিভিউ দেখানো হয়, তাই গ্রুপের নাম এমন কিছু রাখুন যা নিরস, যেমন শনিবারের তহবিল, আর খরচের লেবেল ও পোলের বিকল্প থেকেও Bea-র নাম বাদ রাখুন।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটি টাকা ধরে রাখে না বা তোলে না। চাঁদা ক্রেতার কাছে যায় ব্যাংক ট্রান্সফারে, নগদে, বা আপনারা যা-ই ব্যবহার করেন তাতে, তারপর কেউ সেগুলো রেকর্ড করে।"
      - "এটি পেমেন্টের কোনো রিমাইন্ডার পাঠায় না। যে দেয়নি তাকে মনে করানো এখনও মানুষের কাজ।"
      - "এটি কারও ভাগ হিসাব করে দেয় না। পোল বাজেট ঠিক করে, আর “বাকিটা ভাগ করুন” বলে কোনো বিকল্প নেই, তাই প্রতিটি অঙ্ক আপনাকেই লিখতে হয়।"
      - "প্রতিটি খরচে টাকা দেয় একজনই। দুজন উপহারের আলাদা আলাদা অংশ কিনলে দুটি খরচ লিখুন।"
      - "ভাগে থাকা প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট আর গ্রুপে একটি জায়গা লাগে।"
exampleAfter: 2
example:
  heading: "Bea-র রেকর্ড প্লেয়ার, আর কার্ড"
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: omar
      name: Omar
    - id: lena
      name: Lena
    - id: sam
      name: Sam
  expenses:
    - label: "উপহার"
      payer: priya
      amount: 240
      split:
        method: exact
        shares:
          priya: 60
          omar: 60
          lena: 80
          sam: 40
