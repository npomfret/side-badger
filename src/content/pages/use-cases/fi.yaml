meta:
  title: Side Badger kämppiksille, matkoille ja juhliin
  description: Jaa kulut kämppisten kesken, ryhmämatkoilla sekä juhlissa, häissä ja ryhmälahjoissa. Katso, mitä Side Badger tekee kullekin ryhmätyypille.
h1: Side Badger sinun tyyppiselle ryhmällesi
navLabel: Käyttötilanteet
lead: Kämppikset, lomat, polttarit. Valitse oma kaaoksesi ja katso, miten sinun kaltaisesi ryhmä pitää kirjaa.
intro: Jokainen ryhmä jakaa kulut hieman eri tavalla. Nämä sivut seuraavat **realistista tilannetta** ensimmäisestä kulusta viimeiseen kirjattuun maksuun laskut näyttäen, jotta näet, mihin oma ryhmäsi päätyisi.
cta:
  heading: Löysitkö oman ryhmätyyppisi?
  body: Luo tili, perusta ryhmä ja lisää ensimmäinen kulu. Siihen menee pari minuuttia.
  button: Luo ilmainen tili
cardsHeading: Valitse omaa tilannettasi lähin
sections:
  - heading: Ryhmämatkat
    body: Lennot punnissa, huvila euroissa ja illallinen, jolla oli vain kolme syöjää. Aseta ryhmä muuntamaan puntiin, niin neljä ystävää Lissabonissa päätyy kolmeen maksuun, kun erillisillä valuutoilla maksuja olisi kuusi. [Jaa ryhmämatkan kulut](page:use-case/group-trips).
  - heading: Kämppikset
    body: Yksi maksaa vuokranantajalle, toinen muistaa sähkölaskun, eikä kukaan ole samaa mieltä siitä, kuka osti vessapaperin. Kun vuokra jaetaan huoneen koon mukaan ja muut laskut tasan, neljä kämppistä päätyy kuukauden lopussa kolmeen maksuun, kaikki vuokran maksaneelle. [Jaa kotitalouden laskut kämppisten kesken](page:use-case/housemates).
  - heading: Juhlat, häät ja ryhmälahjat
    body: Kuusi ihmistä äänestää lahjasta, yksi ostaa sen, eivätkä kaikki osallistu samalla summalla. Tarkoilla summilla jaettu 150 £ lahja jättää viisi maksua ostajalle, yhteensä 120 £. [Jaa tapahtuman kulut](page:use-case/events-and-celebrations).
  - heading: Pariskunnat
    body: Jakakaa tylsät kulut muuttamatta treffi-iltaa neljännesvuosittaiseksi talouskatsaukseksi. Vuokra jaettuna 60/40 ja ruokaostokset tasan supistuvat yhdeksi maksuksi teidän kahden välillä.
  - heading: Katso ensin, miten se toimii
    body: Jokainen yllä oleva esimerkki käyttää samoja vaiheita ryhmän luomisesta maksujen kirjaamiseen. [Näin se toimii](page:how-it-works) käy ne läpi, ja [hinnoittelu](page:pricing) kertoo, mitä se maksaa eli ei mitään, ilman mainoksia ja päivittäisiä rajoja.
faq:
  heading: Kysymyksiä
  items:
    - q: Tarvitseeko jokainen tilin?
      a: Kyllä. Ihmiset liittyvät linkillä tai QR-koodilla ja ilmaisella tilillä.
    - q: Voiko Side Badger kerätä rahat?
      a: Ei. Maksat miten haluat ja kirjaat sitten maksun, jotta saldot pysyvät oikeina.
    - q: Pitääkö minun valita yksi ryhmätyyppi?
      a: Ei. Käyttötilanteet ovat esimerkkejä, eivät asetuksia. Jokaisella ryhmällä on samat ominaisuudet, joten käytä sitä yhdistelmää, joka sopii.
