faq:
  heading: "Spørsmål"
  items:
    - q: "Hvem bør registrere en betaling, den som betaler eller den som får betalt?"
      a: "Å registrere en betaling krever tillatelse til å redigere utgifter, og skjemaet spør **Hvem betalte?** og **Hvem mottok betalingen?** Bare den som registrerte den, kan redigere den senere, så det er vanligvis enklest at betaleren gjør det, med hurtigoppgjørsknappen."
    - q: "Hva om turen gikk i to valutaer?"
      a: "Saldoer føres per valuta, så en gjeld i euro forblir en gjeld i euro, og hver valuta får sin egen korte liste, med mindre utgiftene ble konvertert da de ble lagt inn. [Flere valutaer](page:guide/how-to-split-a-trip-paid-in-several-currencies) viser begge måtene."
    - q: "Bør vi gjøre opp under turen eller til slutt?"
      a: "Begge deler fungerer. Hver registrerte betaling endrer saldoene, så en betaling midt i turen teller med i den endelige listen. Til slutt er enklere, fordi [hele turen](page:use-case/group-trips) er samlet på ett sted."
