meta:
  title: "Side Badger pro spolubydlící, výlety a oslavy"
  description: "Dělte náklady se spolubydlícími, na skupinových výletech a při oslavách, svatbách a společných dárcích. Podívejte se, co Side Badger dělá pro každý druh skupiny."
h1: "Side Badger pro váš druh skupiny"
navLabel: "Příklady použití"
lead: "Spolubydlící, dovolené, rozlučky. Vyberte si svůj chaos a podívejte se, jak si skupina jako ta vaše vede přehled."
intro: "Každá skupina dělí náklady trochu jinak. Tyto stránky sledují **realistický scénář** od prvního výdaje po poslední zaznamenanou platbu, s ukázanými výpočty, abyste viděli, k čemu by dospěla vaše skupina."
cta:
  heading: "Našli jste svůj druh skupiny?"
  body: "Vytvořte účet, založte skupinu a přidejte první výdaj. Zabere to pár minut."
  button: "Vytvořit účet zdarma"
cardsHeading: "Vyberte situaci, která je té vaší nejblíž"
sections:
  - heading: "Skupinové výlety"
    body: "Letenky v librách, vila v eurech a večeře, kterou jedli jen tři lidé. Nastavte skupinu na převod do liber a čtyři přátelé v Lisabonu skončí se třemi platbami místo šesti, když se měny vedou zvlášť. [Dělte náklady skupinového výletu](page:use-case/group-trips)."
  - heading: "Spolubydlící"
    body: "Jeden platí pronajímateli, druhý si pamatuje účet za energie a nikdo se neshodne, kdo koupil toaletní papír. Při nájmu děleném podle velikosti pokoje a ostatních účtech dělených rovným dílem čtyři spolubydlící končí měsíc se třemi platbami, všemi tomu, kdo zaplatil nájem. [Dělte domácí účty se spolubydlícími](page:use-case/housemates)."
  - heading: "Oslavy, svatby a společné dárky"
    body: "Šest lidí hlasuje o dárku, jeden ho koupí a ne každý přispěje stejnou částkou. Dárek za 150 £ rozdělený podle přesných částek zanechá pět plateb tomu, kdo ho koupil, celkem 120 £. [Dělte náklady na akci](page:use-case/events-and-celebrations)."
  - heading: "Páry"
    body: "Sdílejte nudné náklady, aniž byste z rande udělali čtvrtletní finanční audit. Nájem dělený 60/40 a nákupy dělené rovným dílem se zredukují na jednu platbu mezi vámi dvěma."
  - heading: "Nejdřív se podívejte, jak to funguje"
    body: "Každý z příkladů výše používá stejné kroky, od založení skupiny po zaznamenání plateb. [Jak to funguje](page:how-it-works) je provází a [ceník](page:pricing) říká, kolik to stojí, tedy nic, bez reklam a bez denních limitů."
faq:
  heading: "Otázky"
  items:
    - q: "Potřebuje účet každý ve skupině?"
      a: "Ano. Lidé se připojují odkazem nebo QR kódem a bezplatným účtem."
    - q: "Může Side Badger vybírat peníze?"
      a: "Ne. Platíte, jak chcete, a pak platbu zaznamenáte, aby zůstatky seděly."
    - q: "Musím si vybrat jeden druh skupiny?"
      a: "Ne. Příklady použití jsou ukázky, ne nastavení. Každá skupina má stejné funkce, takže použijte tu kombinaci, která vám sedí."
