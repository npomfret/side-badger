meta:
  title: "برنامه تقسیم صورت‌حساب بدون دانلود | Side Badger"
  description: "گوشی‌تان پر است، می‌فهمیم. Side Badger در مرورگر شما اجرا می‌شود، بدون فروشگاه برنامه و بدون دانلود. به صفحه اصلی اضافه‌اش کنید تا مثل یک برنامه باز شود."
h1: "بدون فروشگاه برنامه. بدون دانلود. باز هم مثل یک برنامه"
navLabel: "برنامه وب"
lead: "Side Badger در مرورگر شما زندگی می‌کند. نه فروشگاه برنامه‌ای هست که در آن بگردید و نه چیزی که اول دانلود کنید. روی گوشی یا رایانه وارد شوید، هزینه‌ها را با گروهتان آنلاین تقسیم کنید و هر وقت خواستید یک ضربه دورتر باشد، به صفحه اصلی یا Dock اضافه‌اش کنید."
cta:
  heading: "بازش کنید. وارد شوید. گروه بسازید."
  body: "یک حساب بسازید، گروه را شروع کنید و اولین هزینه را اضافه کنید، همه از مرورگری که از قبل باز است. اول گشتی می‌خواهید؟ [نحوه کار](page:how-it-works) را ببینید، یا [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing) را بررسی کنید."
problem:
  heading: "گوشی‌تان پر است. می‌فهمیم."
  body: "جایی روی آن چهار هزار عکس از همان یک غروب هست و هشدار حافظه‌ای که از بهار ردش می‌کنید. آخرین چیزی که لازم دارد برنامه‌ای دیگر است، فقط برای تقسیم یک شام. پس Side Badger یک برنامه وب است. در یک مرورگر مدرن روی گوشی یا رایانه اجرا می‌شود. روی گوشی از چیدمان‌های موبایل استفاده می‌کند، با صفحه گروه که به تب‌ها تقسیم شده و کنترل‌های مناسب لمس. بعضی امکانات اضافه، مثل افزودن به صفحه اصلی، به مرورگر شما بستگی دارند و می‌گوییم کجا."
workflow:
  heading: "از تب مرورگر تا صفحه اصلی در سه مرحله"
  steps:
    - title: "بازش کنید و وارد شوید"
      body: "در مرورگرتان به Side Badger بروید و وارد شوید. فقط یک نشانی ایمیل و یک رمز عبور لازم است و پیش از افزودن هر چیزی ایمیل را تأیید می‌کنید. همه اعضای گروه حساب لازم دارند، پس افرادی که دعوت می‌کنید هم همین کار را می‌کنند."
    - title: "به صفحه اصلی یا Dock اضافه‌اش کنید"
      body: "وقتی وارد شدید، برنامه پیشنهاد می‌دهد خودش را نصب کند. هر جا مرورگر اجازه بدهد دکمه **نصب** را می‌گیرید و هر جا ندهد **نشانم بده چگونه** را. از دستش دادید یا نه گفتید؟ **تنظیمات** همین راهنما را زیر **افزودن به صفحه اصلی یا Dock** دارد. در iPhone یا iPad، تنظیمات اول مراحل iPhone را نشان می‌دهد و دستگاه‌های دیگر را زیر **دستگاه‌های دیگر** جمع می‌کند. در هر حال، برنامه بعد در پنجره‌ای مخصوص خودش باز می‌شود."
      shot: S20
      shotAlt: "بخش «افزودن به صفحه اصلی یا Dock» در تنظیمات، با مراحل افزودن برنامه به یک دستگاه"
    - title: "اعلان‌ها را روشن کنید، اگر خواستید"
      body: "اعلان‌ها تا وقتی روشنشان نکنید خاموش‌اند و هر دستگاه جداگانه روشن می‌شود. از دکمه **روشن کردن** که زنگ اعلان‌ها پیشنهاد می‌دهد یا کلید **اعلان‌های فوری** در **تنظیمات** استفاده کنید. در iPhone یا iPad، اول برنامه را از صفحه اصلی باز کنید. آنجا تنها جایی است که اعلان‌ها کار می‌کنند."
      shot: S19
      shotAlt: "منوی کشویی اعلان‌ها باز، با فهرست فعالیت‌های اخیر گروه"
options:
  heading: "افزودن، دستگاه‌به‌دستگاه"
  items:
    - title: "iPhone و iPad"
      body: "روی دکمه همرسانی بزنید، مربعی با فلشی رو به بالا. اگر آن را نمی‌بینید، اول روی سه نقطه (•••) و بعد روی همرسانی بزنید. به پایین پیمایش کنید و روی **افزودن به صفحه اصلی** بزنید. **باز کردن به‌عنوان برنامه وب** را روشن نگه دارید، بعد روی **افزودن** بزنید. اگر لینکی داخل برنامه‌ای دیگر باز شد، صفحه را اول در Safari باز کنید، چون آن مرورگر داخلی نمی‌تواند اضافه‌اش کند."
    - title: "Android"
      body: "منوی مرورگر را باز کنید و **افزودن به صفحه اصلی** یا **نصب برنامه** را انتخاب کنید."
    - title: "Chrome یا Edge روی رایانه"
      body: "منوی مرورگر را باز کنید و گزینه نصب این وب‌سایت به‌عنوان برنامه را انتخاب کنید. بعد پنجره و نماد مخصوص خودش را می‌گیرد."
    - title: "Safari روی Mac"
      body: "**فایل** و بعد **افزودن به Dock** را انتخاب کنید."
sections:
  - heading: "اعلان‌ها، فقط اگر بخواهید"
    body: "اعلان‌های فوری اختیاری‌اند. روشنشان کنید تا وقتی در گروه‌هایتان فعالیت تازه‌ای هست، مثلاً کسی هزینه‌ای اضافه می‌کند، نظری می‌گذارد یا پرداختی ثبت می‌کند، اعلانی بگیرید. هر بار روی یک دستگاه روشن می‌شوند، از زنگ اعلان‌ها یا از **تنظیمات**، و همان‌جا می‌توانید دوباره خاموششان کنید. به مرورگری که از آن‌ها پشتیبانی کند و اجازه شما نیاز دارند. اگر مرورگرتان آن‌ها را برای سایت مسدود کرده، اول در تنظیمات مرورگر مجازشان کنید. در iPhone یا iPad فقط از برنامه‌ای که به صفحه اصلی اضافه شده کار می‌کنند، نه از تب مرورگر. تحویل تضمین نمی‌شود، پس اعلان را یک تلنگر بدانید، نه یک قول. برای اینکه چه چیزهایی در تاریخچه فعالیت پیدا می‌شود، [برنامه‌ریزی با هم](page:feature/plan-together) را ببینید."
  - heading: "به‌روزرسانی زنده، بدون دکمه تازه‌سازی"
    body: "یک هزینه اضافه کنید و همه بلافاصله آن را می‌بینند، همراه با اینکه چه چیزی عوض شد و چه کسی عوضش کرد. هر گروه تاریخچه فعالیتی دارد و زنگ اعلان‌ها فعالیت همه گروه‌های شما را نشان می‌دهد. هیچ‌کس لازم نیست بپرسد چیزی را که تازه اضافه کردید دیده‌اید یا نه. روی صفحه‌اش است."
  - heading: "39 زبان، هر کس زبان خودش"
    body: "از Side Badger به 39 زبان استفاده کنید، از جمله عربی، فارسی و اردو که راست‌به‌چپ‌اند. هر عضو گروه زبان خودش را انتخاب می‌کند، پس همین صفحه گروه برای یک نفر می‌تواند عربی باشد و برای نفر بعدی انگلیسی. تنها چیزی که گروه باید روی آن توافق کند عددهاست."
  - heading: "ساخته‌شده برای بیش از یک نوع کاربر"
    body: "Side Badger با در نظر گرفتن کاربران صفحه‌کلید و صفحه‌خوان ساخته شده. رنگ اعضا همراه با الگو می‌آید، پس لازم نیست سبز را از قرمز تشخیص دهید."
    items:
      - "پیوندهای پرش، تا کاربران صفحه‌کلید مستقیم به محتوا بپرند."
      - "پنجره‌ها فوکوس صفحه‌کلید را مدیریت می‌کنند."
      - "کنترل‌ها برای صفحه‌خوان‌ها برچسب دارند."
      - "چیدمان‌ها برای زبان‌های راست‌به‌چپ وارونه می‌شوند."
limits:
  heading: "آنچه برنامه وب نمی‌کند"
  items:
    - "استفاده آفلاین وجود ندارد. Side Badger به اتصال نیاز دارد، پس گروهتان را در هواپیما بدون وای‌فای باز نمی‌کند."
    - "برنامه‌ای در فروشگاه برنامه و برنامه بومی iPhone یا Android وجود ندارد. Side Badger یک برنامه وب است و افزودنش به صفحه اصلی یا Dock راهی است که نسخه شبیه برنامه را می‌گیرید."
    - "افزودن به صفحه اصلی یا Dock به مرورگر شما بستگی دارد. نام منوها بین مرورگرها و نسخه‌ها فرق می‌کند و بعضی مرورگرها آن را ارائه نمی‌دهند."
    - "اعلان‌های فوری برای هر دستگاه اختیاری‌اند و به مرورگری که از آن‌ها پشتیبانی کند و اجازه شما نیاز دارند. در iPhone یا iPad فقط از برنامه‌ای که به صفحه اصلی اضافه شده کار می‌کنند. تحویل تضمین نمی‌شود."
    - "هشدار ایمیلی یا پیامکی و یادآوری پرداخت وجود ندارد. فعالیت جدید در برنامه نشان داده می‌شود، و اگر اعلان‌های فوری را روشن کنید به‌صورت اعلان هم. پیگیری یک پرداخت هنوز با خود شماست."
    - "فعالیت 90 روز نگه داشته می‌شود."
    - "با نشانی ایمیل و رمز عبور وارد می‌شوید. ورود با Google یا Apple وجود ندارد و باید دست‌کم 18 سال داشته باشید."
    - "ادعا نمی‌کنیم Side Badger کاملاً دسترس‌پذیر است یا از استاندارد رسمی دسترس‌پذیری پیروی می‌کند. اگر چیزی سر راهتان قرار گرفت، از داخل برنامه به ما بگویید و پاسخ ما را همان‌جا می‌بینید."
useCasesHeading: "جایی که نیاز نداشتن به برنامه کمک می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "برنامه‌ای از Side Badger در فروشگاه برنامه هست؟"
      a: "نه. Side Badger یک برنامه وب است. آن را در مرورگرتان باز می‌کنید و می‌توانید به صفحه اصلی یا Dock اضافه‌اش کنید تا مثل یک برنامه باز شود. چیزی برای دانلود از فروشگاه برنامه نیست."
    - q: "می‌توانم بدون دانلود برنامه صورت‌حساب‌ها را تقسیم کنم؟"
      a: "بله. Side Badger را در مرورگر گوشی یا رایانه‌تان باز کنید، وارد شوید و گروهی شروع کنید. افزودنش به صفحه اصلی یا Dock اختیاری است."
    - q: "آفلاین کار می‌کند؟"
      a: "نه. Side Badger به اتصال نیاز دارد، حتی وقتی به صفحه اصلی یا Dock اضافه شده باشد."
    - q: "چرا در iPhone اعلان نمی‌گیرم؟"
      a: "در iPhone یا iPad اعلان‌ها فقط از برنامه‌ای کار می‌کنند که به صفحه اصلی اضافه شده، نه از تب مرورگر. اضافه‌اش کنید، از نماد صفحه اصلی بازش کنید، بعد اعلان‌ها را در **تنظیمات** روشن کنید. تحویل تضمین نمی‌شود، پس اگر یکی گم شد، تاریخچه فعالیت گروه هنوز نشان می‌دهد چه چیزی اضافه شده."
    - q: "باید اعلان‌ها را روشن کنم؟"
      a: "نه. تا وقتی روشنشان نکنید خاموش‌اند، و هر دستگاه جداگانه روشن می‌شود. بدون آن‌ها هم فعالیت جدید در برنامه نشان داده می‌شود و وقتی برنامه باز باشد همه تغییر را بلافاصله می‌بینند."
    - q: "همه اعضای گروه حساب لازم دارند؟"
      a: "بله. فقط یک نشانی ایمیل و یک رمز عبور لازم است و پیش از افزودن هر چیزی ایمیل را تأیید می‌کنید. هر که به گروه می‌پیوندد همین کار را می‌کند، روی هر گوشی یا رایانه‌ای که دوست دارد."
