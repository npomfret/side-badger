meta:
  title: "Side Badger lakótársaknak, utazásokhoz és bulikhoz"
  description: "Oszd meg a költségeket lakótársakkal, csoportos utazásokon, valamint bulikra, esküvőkre és közös ajándékokra. Nézd meg, mit tesz a Side Badger az egyes csoporttípusokért."
h1: "Side Badger a te csoporttípusodnak"
navLabel: "Felhasználási esetek"
lead: "Lakótársak, nyaralások, lánybúcsúk. Válaszd ki a magad káoszát, aztán nézd meg, hogyan vezet számolást egy hozzád hasonló csoport."
intro: "Minden csoport kicsit másképp osztja meg a költségeket. Ezek az oldalak egy **valósághű forgatókönyvet** követnek az első költségtől az utolsó rögzített kifizetésig, a számításokat is megmutatva, hogy lásd, mi jönne ki a te csoportodnál."
cta:
  heading: "Megtaláltad a csoporttípusodat?"
  body: "Hozz létre fiókot, indíts csoportot, és add hozzá az első költséget. Pár percet vesz igénybe."
  button: "Ingyenes fiók létrehozása"
cardsHeading: "Válaszd a hozzád legközelebb álló helyzetet"
sections:
  - heading: "Csoportos utazások"
    body: "Repjegyek fontban, villa euróban és egy vacsora, amit csak hárman ettek. Állítsd a csoportot fontra váltásra, és a négy barát Lisszabonban három kifizetéssel végez hat helyett, ami akkor jön ki, ha a pénznemeket külön vezetik. [Oszd meg egy csoportos utazás költségeit](page:use-case/group-trips)."
  - heading: "Lakótársak"
    body: "Az egyik fizet a háziurnak, a másik emlékszik az áramszámlára, és senki nem tudja, ki vette a vécépapírt. A szobák mérete szerint elosztott lakbérrel és az egyenlően elosztott többi számlával a négy lakótárs három kifizetéssel zárja a hónapot, mind annak, aki a lakbért fizette. [Oszd meg a háztartási számlákat lakótársakkal](page:use-case/housemates)."
  - heading: "Bulik, esküvők és közös ajándékok"
    body: "Hat ember szavaz az ajándékról, egy megveszi, és nem mindenki ad ugyanannyit. Egy 150 £-os ajándék pontos összegek szerint elosztva öt kifizetést hagy annak, aki megvette, összesen 120 £-t. [Oszd meg egy rendezvény költségeit](page:use-case/events-and-celebrations)."
  - heading: "Párok"
    body: "Osszátok meg az unalmas költségeket anélkül, hogy a randit negyedéves pénzügyi áttekintéssé változtatnátok. A 60/40 arányban elosztott lakbér és az egyenlően elosztott bevásárlás egyetlen kifizetésre olvad kettőtök között."
  - heading: "Előbb nézd meg, hogyan működik"
    body: "A fenti példák mind ugyanazokat a lépéseket használják, a csoport létrehozásától a kifizetések rögzítéséig. A [hogyan működik](page:how-it-works) végigvezet rajtuk, az [árak](page:pricing) pedig megmondják, mibe kerül, vagyis semmibe, hirdetések és napi korlátok nélkül."
faq:
  heading: "Kérdések"
  items:
    - q: "A csoport minden tagjának kell fiók?"
      a: "Igen. Az emberek linkkel vagy QR-kóddal és ingyenes fiókkal csatlakoznak."
    - q: "Beszedheti a Side Badger a pénzt?"
      a: "Nem. Úgy fizetsz, ahogy akarsz, aztán rögzíted a kifizetést, hogy az egyenlegek helyesek maradjanak."
    - q: "Egy csoporttípust kell választanom?"
      a: "Nem. A felhasználási esetek példák, nem beállítások. Minden csoportnak ugyanazok a funkciói vannak, úgyhogy használd azt a kombinációt, amelyik illik hozzád."
