faq:
  heading: "Ceisteanna"
  items:
    - q: "Cad má bhailímid níos mó ná costas an bhronntanais?"
      a: "Caithfidh na méideanna cruinne praghas an bhronntanais a bhaint amach, mar sin gearr na sciar síos go dtí go ndéanann siad sin. Nó caith an breis ar rud éigin fíor, mar bhláthanna, agus cuir isteach é sin mar dhara costas, cosúil leis an gcárta agus leis an bpáipéar sa sampla."
    - q: "An féidir le duine ranníocaíocht a dhéanamh gan dul isteach sa ghrúpa?"
      a: "Ní féidir, más mian leat iad a bheith sa chomhaireamh. Teastaíonn cuntas saor in aisce ó gach duine sa roinnt agus caithfidh siad a bheith sa ghrúpa. I gcás duine nach bhfuil aige ach airgead tirim, d'fhéadfadh Priya é a ghlacadh agus an bronntanas a chur isteach ar an méid atá fós dlite ag an ngrúpa. Mar shampla, dá dtabharfadh Sam £40 in airgead tirim di, chuirfeadh sí £200 isteach agus roinnfeadh sí é 60, 60 agus 80 idir í féin, Omar agus Lena."
    - q: "An féidir leis an vótaíocht a shocrú cé mhéad a chuireann gach duine isteach?"
      a: "Ní féidir. Aontaíonn vótaíocht suim don ghrúpa ar fad, mar an buiséad. Is oraibh féin atá sé sciar gach duine a aontú eadraibh, ansin é a chlóscríobh isteach sa chostas mar **Méideanna cruinne**."
