faq:
  heading: "Sorular"
  items:
    - q: "Konuklar katılmadan grubu görebilir mi?"
      a: "Hayır. İnsanlar bir bağlantı veya QR kodu ve ücretsiz bir hesapla katılır, yani grubu içeri girdikten sonra görürler."
    - q: "Side Badger parayı toplayabilir mi?"
      a: "Hayır. Side Badger hesabı tutar ve hiçbir zaman para taşımaz. Birbirinize istediğiniz yolla ödeyin, sonra ödemeyi kaydedin. Ücretsizdir, reklamsızdır ve günlük sınırı yoktur; [fiyatlandırma](page:pricing) sayfasına bakın."
    - q: "Oylar anonim olabilir mi?"
      a: "Evet. Bir anket oluştururken kimin neye oy verdiğini gizleyebilirsiniz. Ayarlar yalnızca ilk oydan önce değiştirilebilir."
    - q: "İnsanlar farklı tutarlarda katkıda bulunabilir mi?"
      a: "Evet. Bir harcamayı tam tutarlarla bölüştürün; böylece her kişinin payı üzerinde anlaştığınız rakam olur. Ya da dahil olmayanları dışarıda bırakın."
    - q: "Bir organizatör defterleri tutabilir mi?"
      a: "Evet. Yönetilen grup ön ayarını kullanın; böylece harcamaları yalnızca oluşturanlar ve yöneticiler değiştirir, yeni üyeleri yöneticiler onaylar."
