faq:
  heading: "Spørgsmål"
  items:
    - q: "Hvad hvis vi samler mere ind, end gaven koster?"
      a: "De præcise beløb skal give prisen i alt, så beskær andelene, til de gør. Eller brug det overskydende på noget virkeligt, for eksempel blomster, og indtast det som en anden udgift, ligesom kortet og gavepapiret i eksemplet."
    - q: "Kan nogen bidrage uden at være med i gruppen?"
      a: "Ikke hvis personen skal med i regnskabet. Alle i fordelingen skal have en gratis konto og være med i gruppen. Til en, der kun har kontanter, kan Priya tage imod dem og indtaste gaven for det, gruppen stadig skylder. Hvis Sam for eksempel gav hende 40 £ kontant, ville hun indtaste 200 £ og dele dem 60, 60 og 80 mellem sig selv, Omar og Lena."
    - q: "Kan afstemningen afgøre, hvor meget hver person lægger?"
      a: "Nej. En afstemning aftaler et tal for hele gruppen, for eksempel budgettet. Hver persons andel aftaler I indbyrdes og skriver så ind i udgiften som **Præcise beløb**."
