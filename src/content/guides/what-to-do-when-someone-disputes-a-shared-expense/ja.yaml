meta:
  title: 誰かが共有の支出に異議を唱えたときの対処法 | Side Badger
  description: 棘のあるメッセージは控えて、支出に質問を付けましょう。話し合っている間、その支出は全員の残高から外れます。£45のパーティーワインで実例を紹介します。
h1: 誰かが共有の支出に異議を唱えたときの対処法
navLabel: 異議のある支出
lead: 棘のあるメッセージを送る代わりに、支出に質問を付けましょう。質問が開いている間、その支出は丸ごと全員の残高から外れます。コメントで話し合い、グループが合意すれば分け方を編集し、質問した本人か管理者が質問を閉じます。
cta:
  heading: 気まずい質問を、感じよく
  body: 無料アカウントを作成し、家のグループを始めて、管理者に支出への質問をオンにしてもらいましょう。誰かがオンにするまで、この機能はオフです。先に全体を知りたい方は、[使い方](page:how-it-works)や[無料で使える範囲](page:pricing)をご覧ください。
sections:
  - heading: ルームメイト3人と、£45のワイン
    body: パーティーのあと、Tomが家のグループにワインを追加します。金額は£45で、支払ったのはTomです。Tom、Priya、Aishaの3人で均等に分けるので、1人£15です。Aishaはお酒を飲みません。Tomはパーティーのためにワインを買い、そのパーティーは[家のみんな](page:use-case/housemates)のためのものだったので、Tomは何も間違っていません。Aishaが尋ねるのも間違いではありません。ここに悪者はいません。争点は£15のワインだけで、それを気まずくする方法はいくらでもあります。家のみんなへの棘のあるメッセージも、その1つです。支出への質問は、もう少しやさしい方法です。
  - heading: 質問をするとどうなるか
    body: Aishaが支出を開いて、質問を付けます。支出は丸ごと全員の残高から外れ、外れるのはAishaの負担分だけではありません。ほかには何も影響しません。まとめ買い（£84）と清掃代（£60）は引き続き計算に含まれ、1人あたり£28 + £20 = £48です。つまり、ワインが保留になっている間、Aishaは£48を借りていて、Tomは£36、Priyaは£12を受け取る側です。ワインについて家で何が決まるにせよ、それまで誰の残高にもワインは含まれません。その支出に含まれているほかの人も、自分の質問を付けることができます。ワインが残高に戻るのは、それに付いている最後の質問が閉じられたときだけで、質問を閉じられるのは、質問した本人か管理者です。
  - heading: 話し合って、直す
    body: Aishaの質問は支出のコメントに載るので、返信はそのすぐ下に並びます。コメントと質問の詳細は、[一緒に計画](page:feature/plan-together)をご覧ください。TomとPriyaが読んで、家で話し合いをします。ワインはTomとPriyaのものだと決まりました。2人が飲んだからです。ほかの家なら、3人での分割のままにしたり、その中間で合意したりするかもしれません。それでも問題ありません。Side Badgerは合意した内容を保存するだけで、ワインについての意見は持っていません。Tomは支出を編集し、自分とPriyaの2人で均等に分けるように変更します。1人あたり£22.50（£45 ÷ 2）です。Aishaはもう含まれていないので、Aishaの質問は古いバージョンに付いたままになり、ワインは残高に戻ります。以前のバージョンは残ります。
  - heading: 結果を読む
    body: ワインが戻ると、Tomは£58.50を受け取る側で、Priyaは£10.50、Aishaは£48を借りています。Side Badgerは、どちらもTom宛ての2回の支払いを提案します。Aishaの£48は、ワインが保留だった間と同じ金額です。ワインに含まれていないからです。Priyaは£12を受け取る側から£10.50を借りる側に変わりましたが、これはワインの半分の£22.50を負担したためです。3人での分割のままだったら、Aishaは£63（£28 + £20 + £15）を借りることになっていました。この言い争いの価値は、しめて£15でした。支払いは好きな方法で行い、そのあと**精算する**から各支払いを記録します。詳しくは[精算](page:feature/settle-up)をご覧ください。
  - heading: 相手に口をきいてもらえる言い方
    body: Aishaの質問は、「ワインは1口も飲んでいません。分け方を見直せませんか？」です。短く、支出に触れ、責めるのではなく尋ねています。いくつか心がけると役に立ちます。
    items:
      - "**人ではなく、支出について尋ねる。** 「ワインの分け方を確認できますか？」なら会話が始まります。「どうして私があなたのワイン代を払うことになってるの？」なら、別の種類の会話が始まります。"
      - "**どうしてほしいかを伝える。** 「飲んだ人だけにできませんか？」と言えば、グループは賛成するか、答えるかできます。"
      - "**理由は1、2文で添える。** 入力欄は**あなたの質問**で、空のままにはできません。"
      - "**返信は1か所にまとめる。** 答えは、その数字のすぐ隣にある、支出のコメントに書きます。"
  - heading: Side Badgerで設定する
    items:
      - "**質問をオンにする。** 初期設定ではオフです。管理者がグループの**設定**を開き、**一般**タブの**機能**にある**費用への質問を許可する**をオンにして、**保存**を選びます。あとでオフにすると、開いている質問はすべて消えます。"
      - "**質問を付ける。** 支出を開き、分割の中の自分の名前の隣で**質問があります**を選びます。**あなたの質問**に理由を書き、もう一度**質問があります**を選びます。これができるのは、その支出に含まれている人だけです。支出に**質問あり**のバッジが表示されます。"
      - "**保留中のものを探す。** 支出リストで**質問ありのみ**を選ぶと、開いている質問のある支出が表示されます。"
      - "**グループが合意したら、直す。** 支出を開いて**編集**を選び、**割り勘相手**を変更して**経費を更新**を選びます。誰が編集できるかは、グループの権限で決まります。"
      - "**直す必要がなければ、閉じる。** 質問した本人は、自分の**質問あり**バッジにある閉じるボタン（**質問を閉じる**と表示されています）を使えます。管理者も使えます。最後の質問が閉じられると、その支出は残高に戻ります。"
  - heading: そう簡単にいかないとき
    items:
      - "**編集しても質問者が残っている。** 質問した人がまだその支出に含まれている場合、その質問は編集後のバージョンに引き継がれ、本人か管理者が閉じるのを待ちます。金額を直したからといって、直ったことに合意したとは限りません。"
      - "**自分が含まれていない支出。** 支出に質問できるのは、その支出に含まれている人だけです。おかしいと思うことがあれば、コメントで伝えるか、追加した人に尋ねてください。"
      - "**グループを抜けたい人がいる。** 質問が開いていると、その支出に含まれている人は退出できません。質問を閉じるか、その人が含まれないように支出を編集すれば、退出できます。"
  - heading: ここでSide Badgerにできないこと
    items:
      - 誰が正しいかを決めることはしません。支出を残高から外して保留にし、合意した内容を保存します。
      - 支出が計算に含まれる前に、誰かの承認を求めることはしません。保留になるのは、質問が付いた支出だけです。
      - 支出の一部だけを保留にすることはできません。質問を付けると、その支出は丸ごと残高から外れます。
      - お金を動かすことはしません。支払いは好きな方法で行い、そのあと記録します。
