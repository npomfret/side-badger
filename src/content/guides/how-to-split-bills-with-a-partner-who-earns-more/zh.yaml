faq:
  heading: 常见问题
  items:
    - q: 该用税前还是税后收入？
      a: 由你们自己决定。税后收入比较常见，因为那才是你们真正能花的钱。税前收入没有考虑到税、养老金缴款和贷款还款在不同工资里扣掉的金额各不相同。无论选哪种，两个人都要用同一个口径。
    - q: Side Badger 看得到我们的收入吗？
      a: 看不到。你只输入百分比，从不输入工资。百分比对群组成员可见，对情侣来说，就是你们两个人。
    - q: 能不能一次设好 62/38，所有支出都用？
      a: 分摊方式是按支出设置的，不是按群组设置的。复制一笔已经是 62 和 38 的支出，再改不一样的地方就行。其他选项见[分摊支出](page:feature/split-expenses)。
