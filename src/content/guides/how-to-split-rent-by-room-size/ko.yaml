faq:
  heading: "자주 묻는 질문"
  items:
    - q: "방은 더 큰데 빛이 덜 들어오면요?"
      a: "바닥 면적은 출발점일 뿐이니 그룹이 합의해서 조정할 수 있어요. 어두운 방에서 한두 포인트를 빼 다른 사람들에게 나눠 주고, 합이 여전히 100인지 확인하세요. 사이드 배저는 합의한 대로 저장할 뿐 판단하지 않습니다."
    - q: "공과금도 방 크기로 나눠야 하나요?"
      a: "보통은 아닙니다. 전기·가스 요금과 인터넷은 모두가 쓰니 위 예시처럼 똑같이 나누는 편이 간단해요. 한 룸메이트가 하루 종일 집에 있다면 정확한 금액처럼 다른 방식을 그룹이 합의할 수도 있습니다. 선택지는 [지출 나누기](page:feature/split-expenses)에서 설명합니다."
    - q: "나중에 분할 방식을 바꿀 수 있나요?"
      a: "네, 새 지출에는요. 월세를 복사할 때 비율을 바꾸면 이전 달은 그대로 남습니다. 지난 지출을 바로잡으려면 그룹의 권한이 허용하는 경우 수정하되, 잔액이 바뀌므로 먼저 집 사람들에게 알리세요. 이전 버전은 보관됩니다."
