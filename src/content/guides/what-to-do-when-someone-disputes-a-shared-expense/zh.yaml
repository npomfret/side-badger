faq:
  heading: 常见问题
  items:
    - q: 我能只对自己那一份提问吗？
      a: 不能。提问会搁置整笔支出，对其中所有人都一样。如果只是分摊不对，办法是编辑分摊。
    - q: 谁可以关闭问题？
      a: 提问的人，或者群组管理员。如果添加这笔支出的人不是管理员，他就不能代替提问的人关闭它。
    - q: 编辑支出会抹掉原来的版本吗？
      a: 不会。先前的版本会保留。谁可以编辑由群组的权限决定，所以最好先告诉全家，因为余额会变。
