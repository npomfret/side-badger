featuresHeading: The features this uses
faq:
  heading: Questions
  items:
    - q: Can guests see the group without joining?
      a: No. People join with a link or QR code and a free account, so they can see the group once they are in.
    - q: Can Side Badger collect the money?
      a: No. Side Badger keeps the count and never moves money. Pay each other however you like, then record the payment. It is free, with no ads and no daily limits; see [pricing](page:pricing).
    - q: Can votes be anonymous?
      a: Yes. When you create a poll you can hide who voted for what. The settings can only change before the first vote.
    - q: Can people chip in different amounts?
      a: Yes. Split an expense by exact amounts, so each person's share is the figure you agreed, or leave out the people who weren't involved.
    - q: Can an organiser keep the books?
      a: Yes. Use the managed group preset, so only creators and admins change expenses and admins approve new members.
