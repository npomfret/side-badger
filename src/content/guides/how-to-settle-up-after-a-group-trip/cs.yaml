faq:
  heading: "Otázky"
  items:
    - q: "Kdo by měl platbu zaznamenat, ten, kdo platí, nebo ten, kdo dostává?"
      a: "Zaznamenání platby vyžaduje oprávnění upravovat výdaje a formulář se ptá **Kdo platil?** a **Kdo platbu přijal?** Platbu může později upravit jen ten, kdo ji zaznamenal, takže je obvykle nejjednodušší, když ji zadá plátce pomocí tlačítka rychlého vyrovnání."
    - q: "Co když výlet běžel ve dvou měnách?"
      a: "Zůstatky se vedou podle měn, takže dluh v eurech zůstane dluhem v eurech a každá měna dostane vlastní krátký seznam, pokud nebyly výdaje při zadání převedeny. [Výlet placený v několika měnách](page:guide/how-to-split-a-trip-paid-in-several-currencies) ukazuje obě cesty."
    - q: "Máme se vyrovnat během výletu, nebo na konci?"
      a: "Obojí funguje. Každá zaznamenaná platba mění zůstatky, takže platba uprostřed výletu se započítá do konečného seznamu. Na konci je to jednodušší, protože [celý výlet](page:use-case/group-trips) je na jednom místě."
