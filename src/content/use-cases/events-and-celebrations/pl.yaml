featuresHeading: "Funkcje, z których to korzysta"
faq:
  heading: "Pytania"
  items:
    - q: "Czy goście mogą zobaczyć grupę bez dołączania?"
      a: "Nie. Ludzie dołączają przez link lub kod QR i darmowe konto, więc grupę widzą dopiero po wejściu."
    - q: "Czy Side Badger może zbierać pieniądze?"
      a: "Nie. Side Badger prowadzi rachunek i nigdy nie przesyła pieniędzy. Płaćcie sobie, jak chcecie, a potem zarejestrujcie płatność. Jest darmowy, bez reklam i bez dziennych limitów; zobacz [cennik](page:pricing)."
    - q: "Czy głosy mogą być anonimowe?"
      a: "Tak. Tworząc ankietę, możesz ukryć, kto na co głosował. Ustawienia można zmienić tylko przed pierwszym głosem."
    - q: "Czy ludzie mogą dokładać różne kwoty?"
      a: "Tak. Podziel wydatek według dokładnych kwot, żeby udział każdej osoby był kwotą, na którą się umówiono, albo pomiń osoby, które nie brały udziału."
    - q: "Czy organizator może prowadzić księgi?"
      a: "Tak. Użyj ustawienia grupy zarządzanej, żeby wydatki zmieniali tylko twórcy i administratorzy, a administratorzy zatwierdzali nowych członków."
