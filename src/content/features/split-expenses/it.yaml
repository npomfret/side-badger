meta:
  title: Dividi le spese in parti uguali, per importi esatti o per percentuale | Side Badger
  description: Dividi una spesa condivisa in parti uguali, per importi esatti o per percentuale, ed escludi chi non c'era. Gratis, senza pubblicità e senza limiti giornalieri.
h1: Dividi le spese in parti uguali, per importi esatti o per percentuale
navLabel: Dividere le spese
lead: Non tutto si fa a metà. Side Badger se la cava. Indica chi ha pagato, scegli le persone che hanno condiviso la spesa e dividila **in parti uguali, per importi esatti o per percentuale**. I rancori si vendono a parte.
cta:
  heading: Dividi bene la prossima
  body: Crea un account gratuito, avvia un gruppo e aggiungi la spesa che rimandavi da un po'. Non sai cosa succede dopo? Vedi [come funziona](page:how-it-works), oppure [cosa include il gratuito](page:pricing).
  button: Crea un account gratuito
problem:
  heading: Non tutto si fa a metà
  body: L'affitto segue la dimensione della stanza. Un regalo segue chi ha promesso cosa. Una cena segue chi è rimasto fino al dolce. Dividere un conto a metà funziona fino al primo conto che non si lascia dividere così, e allora qualcuno apre un foglio di calcolo. Side Badger registra chi ha pagato, chi ha condiviso la spesa e come si divide, così i saldi tornano senza che nessuno faccia lunghe divisioni a tavola.
workflow:
  heading: Aggiungere una spesa, dall'inizio alla fine
  steps:
    - title: Indica chi ha pagato e per cosa
      body: Inserisci l'importo, una breve descrizione e la persona che ha pagato. Una sola persona paga ogni spesa, il che tiene onesta l'aritmetica.
      shot: S05
      shotAlt: Il modulo della spesa con l'affitto di un cottage diviso per percentuale tra tre persone
    - title: Scegli la divisione
      body: Scegli parti uguali, importi esatti o percentuali. Le percentuali devono sommare a 100 e gli importi esatti devono sommare al totale.
      shot: S06
      shotAlt: Il modulo della spesa con gli importi esatti inseriti per ogni persona per un regalo
    - title: Aggiungi la storia
      body: Imposta la data, aggiungi etichette, un luogo e una nota. Tutti nel gruppo vedono gli stessi dettagli e possono commentare proprio lì.
      shot: S08
      shotAlt: Una spesa con i suoi dettagli, una discussione di commenti e l'importo originale con cui è stata inserita
    - title: Segnala un dubbio se qualcosa non torna
      body: Se il gruppo ha attivato le domande sulle spese, chiunque sia incluso in una spesa può metterla in discussione, e l'elenco delle spese può mostrare solo quelle contestate.
      shot: S18
      shotAlt: L'elenco delle spese con un badge In discussione e il filtro Solo in discussione
options:
  heading: Tre modi di dividere
  items:
    - title: In parti uguali
      body: L'impostazione predefinita per cene, taxi e tutto ciò che tutti hanno condiviso allo stesso modo. Se il totale non si divide in modo esatto, il centesimo di troppo va a una persona a caso, non sempre alla stessa. Nel taxi qui sotto, tocca ad Ana.
    - title: Per importi esatti
      body: Scrivi quanto deve ciascuno. Va bene per il regalo in cui ognuno ha scelto un prezzo diverso, o per la spesa in cui il carrello di una persona conteneva più della spesa condivisa. Gli importi devono sommare al totale.
    - title: Per percentuale
      body: Dai a ogni persona una quota del totale. L'affitto in base alla dimensione delle stanze è il classico, con la stanza più grande che paga la quota più grande e nessuno che finge il contrario.
