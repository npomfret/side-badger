meta:
  title: Mitä Side Badger tekee ja mitä ei
  description: Kulujen jako, tilien tasaus ja useat valuutat sekä ryhmät, listat ja kyselyt. Koko paletti ja rehellinen lista siitä, mitä Side Badger jättää tekemättä.
h1: Mitä Side Badger tekee
navLabel: Ominaisuudet
lead: Kaikki mitä laatikossa on, ja mitä ei.
intro: Tässä koko paletti. Taulukkolaskennan jätimme tarkoituksella pois. Valitse alta ominaisuus, niin pääset pitkään versioon, tai silmäile listan loppuosa ja lyhyt luettelo asioista, joita Side Badger ei tee.
cta:
  heading: Tekeekö se sen, mitä ryhmäsi tarvitsee?
  body: Luo ilmainen tili ja kokeile ensin pienellä ryhmällä.
cardsHeading: Jokainen ominaisuus tarkemmin
sections:
  - heading: Kuittien skannaus
    body: Ota kuva kuitista, niin Side Badger täyttää summan, päivämäärän ja paikan tarkistettavaksesi. Googlen tekoälypalvelu lukee kuittikuvat. [Näin kuittien skannaus toimii](page:feature/receipt-scanning).
  - heading: Ryhmät ja oikeudet
    body: Tee oma ryhmä jokaiselle kodille, matkalle tai tapahtumalle, enintään 50 ihmisen kokoisena. Kutsu ihmiset linkillä tai QR-koodilla. Isommassa ryhmässä voit tehdä jonkun katselijaksi, joka näkee kaiken mutta ei muuta mitään. [Ryhmät ja oikeudet](page:feature/groups-and-permissions) sisältää sen pienen präntin.
  - heading: Listat ja kyselyt
    body: Pidä yhteinen ostoslista ostoslaskujen vieressä. Laita huvilakandidaatit äänestykseen, halutessasi nimettömänä. [Suunnitelkaa yhdessä](page:feature/plan-together) käsittelee kommentit, kysymykset, listat ja kyselyt.
  - heading: Kaikki muu
    items:
      - "**Päivitykset heti:** lisää kulu, niin kaikki näkevät sen heti."
      - "**Kielet:** käytä Side Badgeria 39 kielellä. Jokainen ryhmän jäsen voi valita oman kielensä."
      - "**Aloitusnäyttö:** sovelluskauppaa ei tarvita. Kirjaudu sisään ja lisää sitten Side Badger aloitusnäytölle, niin se avautuu kuin sovellus. Sovelluksen Asetukset näyttää, miten. [Lisää verkkosovelluksesta](page:feature/web-app)."
      - "**Ilmoitukset:** ota push-ilmoitukset käyttöön Asetuksissa, niin saat ilmoituksen, kun ryhmissäsi on uutta toimintaa. Lisää iPhonessa ja iPadissa Side Badger ensin aloitusnäytölle."
      - "**Palaute:** löysitkö virheen? Kerro siitä sovelluksen sisällä ja näe vastauksemme siellä."
  - heading: Mitä Side Badger ei tee
    items:
      - "**Siirtää rahaa.** Side Badger ei koske rahoihisi koskaan. Maksakaa toisillenne miten haluatte. Maksupyynnöt ovat suunnitteilla."
      - "**Toistaa laskuja.** Toistuvia kuluja ei ole. Kopioi viime kuun lasku kahdella napautuksella."
      - "**Jakaa tuotteittain.** Yksi maksaja kulua kohden. Jaa tasan, tarkoilla summilla tai prosenteilla."
      - "**Toimittaa natiivisovellusta.** Se toimii selaimessa. Kirjaudu sisään ja lisää se sitten aloitusnäytölle."
      - "**Toimia offline-tilassa.** Se tarvitsee yhteyden."
      - "**Lähettää hälytyksiä sähköpostilla tai tekstiviestillä.** Uusi toiminta näkyy sovelluksessa ja push-ilmoituksina, jos otat ne käyttöön."
      - "**Piirtää kaavioita tai budjetteja.** Se pitää kirjaa siitä, kuka on velkaa kenelle, ja siinä koko temppu."
      - "**Kirjautua Googlella tai Applella.** Rekisteröidy sähköpostilla. Google- ja Apple-kirjautuminen ovat suunnitteilla."
      - "**Päästää sisään ilman tiliä.** Jokainen ryhmässä tarvitsee ilmaisen tilin."
faq:
  heading: Kysymyksiä
  items:
    - q: Voinko maksaa Side Badgerin kautta?
      a: Ei. Side Badger pitää kirjaa eikä koske rahoihisi koskaan. Maksakaa toisillenne miten haluatte ja kirjaa sitten maksu.
    - q: Onko mobiilisovellusta?
      a: Ei sovelluskaupassa. Side Badger toimii selaimessa. Kirjaudu sisään puhelimella ja lisää se sitten aloitusnäytölle, jolloin se avautuu kuin sovellus. Sovelluksen Asetukset näyttää, miten.
    - q: Voinko jakaa tuotteittain?
      a: Ei. Jokaisella kululla on yksi maksaja, ja jaat sen tasan, tarkoilla summilla tai prosenteilla.
    - q: Toimiiko se offline-tilassa?
      a: Ei, se tarvitsee yhteyden.
    - q: Tarvitseeko jokainen tilin?
      a: Kyllä. Jokainen ryhmässä tarvitsee ilmaisen tilin, ja rekisteröitymiseen riittää sähköpostiosoite.
