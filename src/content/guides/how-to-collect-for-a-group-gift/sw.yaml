meta:
  title: "Jinsi ya kukusanya michango ya zawadi ya kikundi | Side Badger"
  description: "Kila mtu anachanga kiasi tofauti na kadi ya mtu mmoja ndiyo inayobeba mzigo. Piga kura ya bajeti, weka kiasi halisi na Side Badger ifanye hesabu."
h1: "Jinsi ya kukusanya michango ya zawadi ya kikundi"
navLabel: "Kusanya kwa zawadi ya kikundi"
lead: "Kukusanya kwa zawadi ya kikundi kunamaanisha mtu mmoja anatoa pesa mbele na wengine wote wanamdai mchango wao. Kubalianeni bajeti kwa kura, mwache mnunuzi aweke zawadi kwenye kadi yake, kisha iingize kama gharama moja kwa [viasi halisi](page:feature/split-expenses), kiasi kwa kila mtu. Side Badger inaonyesha nani anamdai mnunuzi nini, na kila mtu anatuma sehemu yake mtakavyo."
cta:
  heading: "Pitisha kofia bila kofia"
  body: "Tengeneza kikundi, mwache nje mtu anayepokea zawadi na uingize zawadi kwa viasi halisi. Side Badger ni ya bure, haina matangazo wala vikomo vya kila siku. Unataka ziara kwanza? Tazama [jinsi inavyofanya kazi](page:how-it-works) au [kile ambacho bure inajumuisha](page:pricing)."
sections:
  - heading: "Marafiki wanne, santuri moja, jumla nne tofauti"
    body: "Bea anatimiza miaka 30 na anataka santuri. Priya, Omar, Lena na Sam wanamnunulia. Priya anapata moja kwa £240 na kuinunua kwa kadi yake mwenyewe, kwa sababu lazima mtu aanze. Wanne hawachangii sawa. Priya na Omar wanaweka £60 kila mmoja, Lena £80 na Sam £40. Hakuna anayeeleza kiasi chake na hakuna anayeuliza. Omar pia ananunua kadi na karatasi ya kufungia kwa £12. Wote wanne wanasaini kadi, kwa hivyo hiyo inagawanywa sawa."
  - heading: "Kubalianeni bajeti kabla ya mtu kubofya Nunua"
    body: "Kura ya bajeti inaepusha ubishi kuhusu santuri ya £400. Kwenye kikundi, chagua **Ongeza Kura** na uulize zawadi igharimu kiasi gani. Fanya chaguo ziwe kiasi, kama hadi £150, hadi £200 na hadi £250. Washa **Kupiga kura bila jina**, kunakoficha nani alipigia nini, ili mtu asilazimike kutetea nambari ndogo hadharani. Mipangilio haiwezi kubadilika kura ya kwanza ikishaingia, kwa hivyo ihakiki kwanza. Kura haijifungi yenyewe. Kila mtu akishapiga, chagua **Funga kura** na **Mshindi** anaonekana. Kura inakubaliana jumla. Haiweki sehemu ya mtu yeyote."
  - heading: "Kusoma hesabu"
    body: "Zawadi inagawanywa £60, £60, £80 na £40, ambazo zinajumlisha £240 za kwenye risiti. Kadi na karatasi ya kufungia vinagawanywa kwa wanne, £3 kila mmoja. Bili ya Priya ni £60 + £3, yaani £63, na alilipa £240, kwa hivyo anadai £177. Bili ya Omar pia ni £63, lakini alilipa £12, kwa hivyo anadaiwa £51. Lena anadaiwa £80 + £3, yaani £83, na Sam anadaiwa £40 + £3, yaani £43. Hizo tatu zinajumlisha £177 za Priya. Zikiachwa hivyo, madeni yangezunguka pande tano za kikundi. Side Badger inapendekeza malipo matatu badala yake, yote kwa Priya. [Kumaliza hesabu](page:feature/settle-up) kuna maelezo."
  - heading: "Iweke kwenye Side Badger"
    body: "Upande wa Priya unachukua takriban dakika tano."
    items:
      - "**Tengeneza kikundi.** Kwenye dashibodi chagua **Unda Kikundi**. Chagua **Alika wengine** na utume kiungo au msimbo wa QR kwa wanaochangia tu, na si mtu mwingine yeyote."
      - "**Ongeza zawadi.** Chagua **Ongeza Gharama**, ielezee, weka 240 na chini ya **Nani alilipa?** chagua Priya. Waache wote wanne chini ya **Gawanya kati ya**, kisha chini ya **Jinsi ya kugawanya** chagua **Kiasi halisi** na uandike 60, 60, 80 na 40. Viasi lazima vijumlishe 240. Ambatisha uthibitisho wa oda ukipenda. Chagua **Hifadhi Gharama**."
      - "**Ongeza kadi.** Omar anaongeza £12 mwenyewe, anajichagua chini ya **Nani alilipa?** na kuacha **Jinsi ya kugawanya** kwenye **Sawa**, wote wanne wakiwa wametiwa tiki."
      - "**Hesabu, kisha lipa.** Kila mtu anaangalia **Salio**, linaloonyesha nani anamdai nani, na kumtumia Priya sehemu yake mtakavyo. Kisha irekodi kwa **Lipa deni** na **Rekodi Malipo**. Lipa haraka hujaza kiasi."
  - heading: "Nunua kwanza, au kusanya kwanza"
    body: "Side Badger haishikilii mfuko wa pamoja, kwa hivyo \"kukusanya\" kwa kweli ni kuhesabu. Mpangilio wowote kati ya miwili unafaa."
    items:
      - "**Nunua kwanza.** Mnunuzi analipa, anaongeza gharama kwa bei halisi na kila mtu anaona sehemu yake mara moja. Ni nadhifu zaidi, lakini mnunuzi anabeba gharama hadi watu walipe, kwa hivyo chagua mnunuzi anayeweza."
      - "**Kusanya kwanza.** Watu wanatuma kiasi chao kwa mnunuzi kabla ya ununuzi. Mkishapata bei, ingizeni zawadi, kisha rekodini kila malipo kwa tarehe pesa ilipohamia kweli. Ongeza zawadi kwanza, ili kila malipo yawe na salio la kutua."
      - "**Bei inabadilika.** Usafirishaji, msimbo wa punguzo, bei kupanda kwa kuchelewa. Hariri zawadi na ubadilishe viasi halisi vijumlishe tena. Toleo la awali linahifadhiwa, lakini iambieni kikundi kwanza, kwa sababu salio lao linabadilika."
  - heading: "Mweke Bea nje ya hili"
    body: "Wanachama wa kikundi pekee ndio wanaokiona, kwa hivyo Bea hawezi kuona kikundi ambacho si mwanachama wake. Alika wanaochangia tu na si mtu mwingine. Kiungo kinafanya kazi hadi kiishe muda, na unaweza kuchagua kuanzia dakika 15 hadi siku 5, kwa hivyo chagua kifupi na ukitume mahali Bea hataona. Kiungo kinaonyesha onyesho la awali la kikundi kwa yeyote anayekifungua, kwa hivyo kipe kikundi jina la kuchosha, kama Mfuko wa Jumamosi, na uweke jina la Bea nje ya lebo za gharama na chaguo za kura pia."
  - heading: "Kile ambacho Side Badger haifanyi hapa"
    items:
      - "Haishikilii wala kukusanya pesa. Michango huenda kwa mnunuzi kwa uhamisho wa benki, taslimu au kitu mnachotumia, kisha mtu anaurekodi."
      - "Haitumi vikumbusho vya malipo. Kumsukuma asiyelipa bado ni kazi ya binadamu."
      - "Haikokotoi sehemu ya mtu yeyote. Kura inakubaliana bajeti na hakuna chaguo la \"gawanya kilichobaki\", kwa hivyo unaandika kila kiasi."
      - "Kila gharama ina mlipaji mmoja. Kama watu wawili walinunua sehemu tofauti za zawadi, ingiza gharama mbili."
      - "Kila mtu aliye kwenye mgawanyo anahitaji akaunti ya bure na nafasi kwenye kikundi."
