faq:
  heading: "Perguntas"
  items:
    - q: "Que taxa de câmbio usa o Side Badger?"
      a: "Uma taxa de câmbio atual, obtida quando introduzes a despesa, sempre que houver uma disponível. Podes alterá-la para a taxa que realmente tiveste."
    - q: "O grupo pode ficar só por libras e ienes?"
      a: "Sim. Nas **Definições** do grupo, ativa **Restringir moedas para este grupo** em **Definições de moeda**, escolhe as **Moedas permitidas** e define a **Moeda predefinida para novas despesas**. Menos opções na lista, menos palpites errados à caixa."
    - q: "Temos mesmo de converter?"
      a: "Não. As moedas ficam separadas, a menos que tu ou o teu grupo escolham converter, e cada moeda tem a sua própria lista curta de pagamentos."
