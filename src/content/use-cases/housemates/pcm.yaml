meta:
  title: "Share household bills with housemates"
  description: "Share rent by room size, share light and groceries equal-equal, and see who owe who every month. Free way for housemates, flatmates and people wey share room to keep count."
h1: "Share household bills with housemates"
navLabel: "Housemates"
lead: "For di housemate wey dey buy toilet roll, and di housemates wey never see am happen. Side Badger dey keep one running count of di rent, di bills and di shop for **housemates, flatmates and people wey share room**, so nobody go chase anybody and di fridge fit go back to be just fridge."
cta:
  heading: "Start from your own house"
  body: "Create account, make group for di house and send everybody di invite link. Dis month bills fit enter tonight."
  button: "Create free account"
scenario:
  heading: "Set up di house"
  body: "Make group for di house, choose di name wey you want people to see for am, and invite everybody with link or QR code. Di group fit dey open, where everybody dey add and edit, or managed, where new members need admin approval and only creators and admins fit change expenses, wey suit di housemate wey dey keep di books. Anybody wey just wan watch di numbers fit be viewer, wey go see everything and change nothing. Everybody dey see new expense sharp sharp, so “I go add am later” get fewer places to hide."
sections:
  - heading: "Rent and bill dem"
    body: "Rent hardly divide by four, because bedrooms no equal. Share am by percentage, so di big room go pay more and di cupboard with window go pay less. Percentages must add up to 100. Bills wey everybody use get equal split, and housemate wey no dey part of expense fit dey left out. When equal split leave odd penny, e go to one person at random. No recurring bills dey, so every month you go copy last month rent, change di date and carry on."
  - heading: "Di shared shop"
    body: "Keep di shared shopping list for di same group as di shopping bills, and tick items off as dem reach di trolley. Whoever do di shop go add di receipt total as expense and share am equal-equal, or between only di people wey go chop di thing. Who keep buying di oat milk wey nobody else dey drink still be matter for di house, but at least di expense list go correct. Di group permissions decide who fit create and edit lists. Put di rent, di bills and di shop together and you go get month like di one below, for house of four: Jo pay £2,000 rent, wey dem share 30%, 25%, 25% and 20% by room size, then Kwame pay £120 for energy, Lena £40 for internet and Matt £80 for groceries, each one shared equal-equal. Jo end up owed £1,340, and Side Badger suggest three payments, all to Jo."
  - heading: "Fair ways to share house money"
    items:
      - "**Equal-equal** suit wetin everybody use about the same, like internet, cleaning supplies and di communal shop. E quick, and nobody need argue about di maths."
      - "**By room size** suit rent, because rooms different and so too wetin people dey ready to pay for dem. Agree di percentages once, when somebody move in, and reuse dem every month."
      - "**By use** suit bills where one person clearly use more, like home-office heating bill or streaming account wey only two people dey watch. Leave out di people wey no dey part of am, or enter exact amounts for each person."
      - "Whichever one you choose, agree am before di first bill instead of after di first argument, and write di rule down somewhere wey di whole house fit see."
  - heading: "When somebody move out"
    body: "Dem go settle first. Nobody fit leave group while dem owe or dem owe dem money, so di person wey dey leave go pay or dem go pay am, you record am, and then e go. Keep di group going for di housemates wey remain and invite di new person with link. When di house itself finish, admin fit lock di group so di numbers go stay put, or close am for good, wey make am inaccessible to everybody, so do dat one only when nobody need di history."
