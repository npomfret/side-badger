meta:
  title: "Taldeko zerrendak, inkestak eta iruzkinak | Side Badger"
  description: "Iruzkindu gastuak, galdetu bitxia dirudienari, partekatu erosketa-zerrenda eta bozkatu villa. Planifikatu elkarrekin, banatu gero. Doakoa, iragarkirik gabe."
h1: Planifikatu elkarrekin, banatu gero
navLabel: Planifikatu elkarrekin
lead: Erosketa-zerrenda eta erosketen faktura, azkenean elkarri hitz egiten. Side Badger-ek zure taldeari dirua gastatu aurretik eta ondoren hitz egiteko toki bat ematen dio, gastu bakoitzean iruzkinekin, gaizki dirudienari galdetzeko modu batekin, zerrenda partekatuekin eta inkestekin erabaki handietarako. Gero [gastuak banatzen dituzu](page:feature/split-expenses) ohi bezala.
cta:
  heading: Planifikatu, eta gero banatu
  body: Sortu doako kontu bat, hasi talde bat eta jarri lehen zerrenda, inkesta edo galdera dirua dagoen tokian bertan. Ez dakizu zer gertatzen den gero? Ikusi [nola funtzionatzen duen](page:how-it-works).
problem:
  heading: Txata hemen dago, faktura han
  body: Taldeko gastua bi tokitan bizi ohi da. Zenbakiak toki batean daude, eta zenbakiei buruzko eztabaida asteartean korrituta desagertu zen txat batean. Erosketa-zerrenda hozkailu baten argazkia da. Villa gehienen 👍 batekin erabaki zen, ziurrenik. Side Badger-ek planifikazioa taldean gordetzen du, dagozkion gastuen ondoan, beraz kostua dagoen tokian iruzkin bat dago, erosketa dagoen tokian zerrenda bat, erabaki handirako inkesta bat, eta “itxaron, hau zuzena al da?” esateko modu bat paragrafo bat idatzi gabe. Guztia taldearen diruari buruzkoa izaten jarraitzen du, horretarako baitago taldea.
workflow:
  heading: Villa-bozketatik erosketen fakturara
  steps:
    - title: Jarri erabaki handia bozketara
      body: Gehitu inkesta faktura finkatzen duen erabakiarentzat, adibidez zein villa. Aukeratu bi eta hamar aukera artean, esan pertsona bakoitzak zenbat boto dituen, eta itxi denek bozkatu dutenean; irabazlea markatuta geratzen da.
      shot: S17
      shotAlt: Irabazlea markatuta eta aukera bakoitzaren ondoan boto kopurua dituen inkesta itxi bat
    - title: Idatzi erosketa-zerrenda elkarrekin
      body: Hasi zerrenda partekatu bat, gehitu elementuak eta markatu saskira iristen diren heinean. Erosketa gero gastu gisa sartzen da.
      shot: S16
      shotAlt: Erosketa-zerrenda partekatu bat, elementu batzuk markatuta eta aurrerapen-kontagailu batekin
    - title: Hitz egin kostuaz dagoen tokian
      body: Iruzkindu gastuan bertan, erantsi ordainagiria eta erreakzionatu emoji batekin. Elkarrizketa dagokion zenbakiaren ondoan geratzen da.
      shot: S08
      shotAlt: Gastu bat bere xehetasunekin, ordainagiri baten miniatura, iruzkin-hari bat eta emoji erreakzioak
    - title: Galdetu gaizki dirudienari
      body: Taldeak gastu-galderak aktibatuta baditu, gastu batean sartuta dagoen edonork **Galdera bat daukat** aukera dezake. Gastua saldoetatik kanpo geratzen da galdera konpondu arte.
      shot: S18
      shotAlt: Gastu-zerrenda, “Zalantzan jarri da” bereizgarri batekin eta “Zalantzan jarritakoak bakarrik” iragazkiarekin
    - title: Ikusi zer aldatu den, eta nork aldatu duen
      body: Jarduera-historiak eta jakinarazpen-kanpaiak zure talde guztietan zer berri dagoen erakusten dute. Push jakinarazpenak ere badaude, nahi baduzu.
      shot: S19
      shotAlt: Jakinarazpenen goitibeherakoa, azken jardueren zerrenda batekin
