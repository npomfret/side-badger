meta:
  title: "భాగస్వామితో బిల్లులు పంచండి, 50/50 లేదా ఆదాయం బట్టి | Side Badger"
  description: "డేట్ నైట్‌ను త్రైమాసిక ఆర్థిక సమీక్షగా మార్చకుండా బోరింగ్ ఖర్చులు పంచుకోండి. 50/50, ఆదాయం ప్రకారం లేదా బిల్లు వారీగా పంచండి, ఎవరు ఎవరికి బాకీనో చూడండి. ఉచితం."
h1: "జంటగా ఖర్చులను న్యాయంగా పంచుకోండి"
navLabel: "జంటలు"
lead: "డేట్ నైట్‌ను త్రైమాసిక ఆర్థిక సమీక్షగా మార్చకుండా బోరింగ్ ఖర్చులు పంచుకోండి. ఇల్లు, సోఫా, బ్రాడ్‌బ్యాండ్ ఎవరు కట్టారో అస్పష్టమైన జ్ఞాపకం పంచుకునే **జంటల** కోసం అద్దె, బిల్లులు, సరుకుల నడుస్తున్న లెక్కను Side Badger ఒకే చోట ఉంచుతుంది. 50/50 పంచండి, ఆదాయం ప్రకారం లేదా బిల్లు వారీగా పంచండి, ఎవరు ఎవరికి బాకీనో చూడండి."
cta:
  heading: "ఇద్దరి కోసం ఒక గ్రూప్ మొదలుపెట్టండి"
  body: "ఖాతా తెరవండి, గ్రూప్ చేయండి, మీ భాగస్వామికి ఆహ్వాన లింక్ పంపండి. ఈ రాత్రి టేక్‌అవే మొదటి ఖర్చు కావచ్చు."
scenario:
  heading: "న్యాయం అంటే 50/50 కానక్కర్లేదు"
  body: "Sam, Alex ఒక ఇంటిని పంచుకుంటారు. Samకు ఎక్కువ సంపాదన, కాబట్టి అద్దెలో Sam 60%, Alex 40% తీసుకోవాలని ఒప్పుకున్నారు. Sam ఇంటి యజమానికి చెల్లిస్తారు, Alex సరుకులు కొంటారు, ఇద్దరూ అంతా సరిపోతుందని దాదాపు నమ్ముతున్నారు. దాదాపు నమ్మకమే ఎవరో ఫోన్‌లోని నోట్‌ను శాశ్వత విభేదంగా మార్చేది. కాబట్టి మీ ఇద్దరికీ ఒక గ్రూప్ చేయండి, మీ భాగస్వామికి కనిపించాలనుకునే పేరును ఎంచుకోండి, వాళ్లకు ఆహ్వాన లింక్ లేదా QR కోడ్ పంపండి. ప్రతి ఖర్చు జరిగినప్పుడు జోడించండి, ఎవరు చెల్లించారో, ఎలా పంచాలో చెప్పండి, లెక్క గ్రూప్‌ను ఉంచనివ్వండి. ప్రతి సెలవుకు విడిగా ఒక గ్రూప్ చేయండి ([గ్రూప్ ట్రిప్‌లు](page:use-case/group-trips) చూడండి), అప్పుడు విమాన టికెట్లు సరుకుల నుండి వేరుగా ఉంటాయి."
sections:
  - heading: "50/50, ఆదాయం ప్రకారం, లేదా బిల్లు వారీగా"
    body: "అందరికీ న్యాయమైన పంపకం అంటూ ఏదీ లేదు, మీరిద్దరూ ఒప్పుకున్నదే ఉంది, వీలైతే మొదటి నిట్టూర్పు తర్వాత కాకుండా మొదటి బిల్లుకు ముందే. సాధారణంగా ఈ మూడు ఉంటాయి."
    items:
      - "**50/50.** **సమానం** ఎంచుకోండి, ఇద్దరూ సగం ఇవ్వాలి. ఆదాయాలు దగ్గరగా ఉన్నప్పుడు ఉమ్మడి ఖర్చులకు ఇది సరిపోతుంది, ఏ లెక్కా అవసరం లేదు."
      - "**ఆదాయం ప్రకారం.** ఇద్దరిలో ఒకరికి ఎక్కువ సంపాదన ఉంటే, వచ్చే డబ్బులో ప్రతి వ్యక్తి వాటా ప్రకారం పంచండి. ముందు ఏది లెక్కలోకి వస్తుందో ఒప్పుకోండి (చేతికొచ్చే జీతం సాధారణ ఎంపిక), ఇద్దరివీ కలపండి, మీదాన్ని మొత్తంతో భాగించండి. ఒకరికి మూడు భాగాలు, ఇంకొకరికి రెండు భాగాలు చేతికొస్తే, అది 3 ÷ (3 + 2) = 60%, కాబట్టి ఒకరు 60%, ఇంకొకరు 40% భరిస్తారు. పూర్తి శాతాలకు రౌండ్ చేసి, వాటిని **శాతం** కింద నమోదు చేయండి, అక్కడ అవి కలిపి 100 కావాలి. మీ జీతం నమోదు చేయడానికి చోటు లేదు, కాబట్టి మీరు శాతాలనే టైప్ చేస్తారు."
      - "**బిల్లు వారీగా.** ప్రతి ఖర్చుకు సొంత పంపకం ఉంటుంది, కాబట్టి కలపవచ్చు: అద్దె ఆదాయం ప్రకారం, సరుకులు 50/50, ఉమ్మడి బహుమతిలో ఎవరు ఎంత వేయాలో మీరే ఎంచుకుంటే **కచ్చితమైన మొత్తాలు**."
      - "**జీతం మారినప్పుడు,** తర్వాతి ఖర్చు నుండి కొత్త శాతాలు వాడండి. ముందటి ఖర్చులు నమోదు చేసినప్పటి పంపకాన్నే ఉంచుకుంటాయి. అసలైన జీతం స్లిప్పులతో లెక్కలు చూడటానికి [ఎక్కువ సంపాదించే భాగస్వామితో బిల్లులు ఎలా పంచాలి](page:guide/how-to-split-bills-with-a-partner-who-earns-more) చదవండి."
  - heading: "నెలవారీ సమీక్ష"
    body: "నెలకు ఒకసారి, లేదా అంకెలు దురద పెట్టడం మొదలైనప్పుడు, గ్రూప్ తెరిచి **బ్యాలెన్స్‌లు** చూడండి. ఇద్దరే ఉన్నప్పుడు ప్రతి కరెన్సీలో ఇవ్వాల్సినవాళ్ల నుండి రావాల్సినవాళ్లకు ఒకే పేమెంట్ ఉంటుంది. Sam, Alex నెలను తీసుకోండి. Sam £1,500 అద్దె చెల్లించారు, దానిలో Alex 40% £600. Alex సరుకులకు £90 చెల్లించారు, సమానంగా పంచబడింది, కాబట్టి Sam సగం £45. Side Badger ఒకదాన్ని ఇంకోదానితో సరిచేస్తుంది, £600 నుండి £45 తీసివేయగా, Alex Samకు £555 చెల్లిస్తారు. మీకు నచ్చినట్టు చెల్లించండి, బ్యాంక్ ట్రాన్స్‌ఫర్, నగదు లేదా ఇవ్వాల్సిన ఒక ఉపకారంతో, తర్వాత బ్యాలెన్స్ మళ్లీ సున్నా అయ్యేలా దాన్ని **సెటిల్ చేయి** కింద రికార్డ్ చేయండి. పునరావృత బిల్లులు లేవు, కాబట్టి గత నెల అద్దెను కాపీ చేయండి, తేదీ మార్చండి, ముందుకు సాగండి. Side Badger డబ్బును కదిలించదు, రిమైండర్‌లు పంపదు, కాబట్టి గుర్తు చేయడం ఇంకా మీ పనే."
  - heading: "మీరిద్దరే"
    body: "ఇద్దరి గ్రూప్‌లో ఇద్దరు సభ్యులు ఉంటారు, గ్రూప్‌లోని సభ్యులు మాత్రమే దాన్ని చూడగలరు. మీ భాగస్వామి ఆహ్వాన లింక్ లేదా QR కోడ్‌తో చేరతారు. లింక్ 15 నిమిషాల నుండి 5 రోజుల వరకు ఎంతసేపైనా ఉండవచ్చు, కాబట్టి మీ భాగస్వామికి వాడడానికి సమయం ఇచ్చే అతి చిన్నదాన్ని ఎంచుకోండి. కొత్త లింక్ చేస్తే పాతవి రద్దు కావు, కాబట్టి ఇతరులు ఉన్న చాట్‌లో వాటిని వదలకండి. పనిచేసే లింక్ వాడిన ఎవరైనా చేరవచ్చు, కాబట్టి కచ్చితంగా ఉండాలనుకుంటే, ఆమోదాన్ని ఆన్ చేయండి, అప్పుడు అడ్మిన్ ప్రతి వ్యక్తిని లోపలికి రానిస్తారు. మీ భాగస్వామికి సొంత ఖాతా కావాలి, అది ఉచితం."
exampleAfter: 2
example:
  heading: "ఈ నెల ఎవరు ఎవరికి బాకీ"
  currency: GBP
  people:
    - id: sam
      name: Sam
    - id: alex
      name: Alex
  expenses:
    - label: "అద్దె"
      payer: sam
      amount: 1500
      split:
        method: percent
        shares:
          sam: 60
          alex: 40
    - label: "సరుకులు"
      payer: alex
      amount: 90
      split:
        method: equal
featuresHeading: "ఒక జంట వాడే ఫీచర్లు"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "అన్నింటికీ ఒకేసారి 60/40 సెట్ చేయవచ్చా?"
      a: "లేదు. పంపకం ప్రతి ఖర్చుకు చెందినది. మొదటి దానిపై శాతాలు సెట్ చేయండి, తర్వాత దాన్ని కాపీ చేసి మారేదాన్ని మార్చండి. పంచే మూడు మార్గాలనూ [ఖర్చుల పంపకం](page:feature/split-expenses) వివరిస్తుంది."
    - q: "ఇది మా బ్యాంక్‌కు లింక్ అవుతుందా?"
      a: "లేదు. Side Badger మీ డబ్బును ఎప్పుడూ ముట్టుకోదు. మీకు నచ్చినట్టు ఒకరికొకరు చెల్లించుకుంటారు, తర్వాత [లెక్క తేల్చడం](page:feature/settle-up) వివరించినట్టు రికార్డ్ చేస్తారు."
    - q: "మా గ్రూప్‌ను ఇంకెవరైనా చూడగలరా?"
      a: "దాని సభ్యులు మాత్రమే, జంట గ్రూప్‌లో ఇద్దరు ఉంటారు. పనిచేసే ఆహ్వాన లింక్ వాడిన ఎవరైనా చేరవచ్చు, కాబట్టి దాన్ని ఒక్కరితో పంచుకోండి, చిన్న గడువు పెట్టండి."
    - q: "ఒకే బిల్లులో మేమిద్దరం కొంత కొంత చెల్లిస్తే?"
      a: "ఒక ఖర్చుకు ఒక్క చెల్లింపుదారు మాత్రమే ఉంటారు. రెండు ఖర్చులు నమోదు చేయండి, ఒక్కొక్కరికి ఒకటి, బ్యాలెన్స్ అదే వస్తుంది."
    - q: "నా భాగస్వామికి చెల్లించమని ఇది గుర్తు చేస్తుందా?"
      a: "లేదు. రిమైండర్‌లు లేవు, కాబట్టి గుర్తు చేయడం ఇంకా మీ పనే. కనీసం మీరిద్దరూ ఒకే అంకెను చూస్తూ ఉంటారు."
    - q: "మేము ఖర్చులు పంచుకోవడం ఆపేస్తే ఏమవుతుంది?"
      a: "బ్యాలెన్స్ తేల్చి పేమెంట్‌ను రికార్డ్ చేయండి, అప్పుడు ఎవరికీ ఏమీ బాకీ ఉండదు. తర్వాత అడ్మిన్ గ్రూప్‌ను లాక్ చేయవచ్చు, అప్పుడు అంకెలు ఉన్నట్టే ఉంటాయి, లేదా శాశ్వతంగా మూసివేయవచ్చు, అప్పుడు అది అందరికీ అందుబాటులో ఉండదు. ఇద్దరికీ చరిత్ర అవసరం లేనప్పుడే మూసివేయండి."
