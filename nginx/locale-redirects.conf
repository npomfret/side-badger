# Regional aliases share their target's content (src/i18n/index.ts aliasConfig).
# They are not pages: each URL gets one permanent hop to the locale it copied.
# A slashless path gets its slash here, and /index.html is dropped, so an old
# link takes one hop, not two. Included at http level by default.conf.
# src/__tests__/nginx-config.test.ts checks this file against localeAliasMap.
map $uri $side_badger_locale_redirect {
    default "";
    ~^/(?:en-us|en-au|en-gb|en-ca|en-ie|en-sc)/?$                          /;
    ~^/(?:en-us|en-au|en-gb|en-ca|en-ie|en-sc)(?<a0>/(?:.+/)?)index\.html$ $a0;
    ~^/(?:en-us|en-au|en-gb|en-ca|en-ie|en-sc)(?<a1>/[^.]*[^/.])$          $a1/;
    ~^/(?:en-us|en-au|en-gb|en-ca|en-ie|en-sc)(?<a2>/.+)$                  $a2;
    ~^/nl-NL/?$                                                             /nl-BE/;
    ~^/nl-NL(?<n0>/(?:.+/)?)index\.html$                                    /nl-BE$n0;
    ~^/nl-NL(?<n1>/[^.]*[^/.])$                                             /nl-BE$n1/;
    ~^/nl-NL(?<n2>/.+)$                                                     /nl-BE$n2;
}
