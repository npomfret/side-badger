meta:
  title: "Як розділити оренду за розміром кімнати | Side Badger"
  description: "Більша кімната, більша частка. Виділіть спільні кімнати, решту поділіть за площею й один раз уведіть відсотки. Розрахунки для трьох сусідів."
h1: "Як розділити оренду за розміром кімнати"
navLabel: "Оренда за розміром кімнати"
lead: "Вирішіть, яка частина оренди йде на спільні кімнати, і поділіть її порівну, а решту розділіть за площею кожної спальні. Округліть до цілих відсотків, один раз уведіть їх в оренду в Side Badger і щомісяця копіюйте витрату."
cta:
  heading: "Внесіть оренду раз і надовго"
  body: "Створіть безкоштовний обліковий запис, заведіть групу для квартири й уведіть оренду з погодженими відсотками. Наступного місяця це буде копія. Хочете спершу екскурсію? Подивіться, [як це працює](page:how-it-works) або [що охоплює безкоштовний план](page:pricing)."
sections:
  - heading: "Троє людей, одна квартира, одна суперечка"
    body: "Прія, Том і Айша винаймають квартиру за 1 950 £ на місяць. Цілий рік вони ділили оренду на трьох, бо так було просто. Потім Айша виміряла свою спальню. Кімната Прії має 16 м², Тома — 12 м², а Айші — 10 м², тож Айша платила стільки ж, скільки Прія, за кімнату більш ніж на третину меншу. Ніхто не був нерозумним. Ніхто просто не порахував. За замовленою їжею вони спершу погодили одне правило: 40 % оренди йде на кухню, ванну й вітальню, якими користуються всі троє."
  - heading: "Метод із розрахунками"
    body: "Чотири кроки, одна рулетка й калькулятор у телефоні."
    items:
      - "**Виділіть спільну частину.** Група погоджує, яка частка оренди йде на кімнати, якими користуються всі. Для цієї квартири це 40 %, тобто по 13,33 % на кожного з трьох."
      - "**Решту поділіть за площею.** Інші 60 % діляться за розміром спальні. Спальні разом мають 38 м² (16 + 12 + 10), тож частка Прії — 60 % × 16/38, тобто 25,26 %."
      - "**Додайте дві частини.** Прія: 25,26 % + 13,33 % = 38,6 %. Том: 60 % × 12/38 = 18,95 %, плюс 13,33 % — це 32,3 %. Айша: 60 % × 10/38 = 15,79 %, плюс 13,33 % — це 29,1 %."
      - "**Округліть і перевірте.** Цілі відсотки легше вводити й обговорювати, тож 38,6 % стають 39 %, 32,3 % — 32 %, а 29,1 % — 29 %. Перевірте, що 39 + 32 + 29 дорівнює 100. Якщо після округлення виходить 99 або 101, група домовляється, чия цифра зміститься на один пункт."
  - heading: "Як читати місяць у квартирі"
    body: "Оренда за частками 39 %, 32 % і 29 % становить 760,50 £, 624,00 £ і 565,50 £. Орендодавцю заплатила Прія, тож за місяць їй винні 1 142,50 £, а Том винен 566,00 £ і Айша винна 576,50 £. Side Badger підказує два платежі, обидва Прії."
  - heading: "Налаштування в Side Badger"
    body: "Один вечір, більшу частину якого займе обговорення тих 40 %."
    items:
      - "**Створіть групу.** На панелі керування оберіть **Створити групу** й назвіть її на честь квартири. Оберіть **Запросити інших** і надішліть посилання або QR-код. Кожен входить або створює безкоштовний обліковий запис і обирає ім'я, під яким його бачитимуть у цій групі."
      - "**Додайте оренду.** Оберіть **Додати витрату**. Уведіть опис і суму, а в полі **Хто заплатив?** виберіть того, хто заплатив орендодавцю. Залиште всіх трьох у полі **Розділити між**, потім у полі **Як розділити** оберіть **Відсоток** і введіть 39, 32 і 29. Форма попередить, якщо відсотки в сумі не дають 100. Оберіть **Зберегти витрату**."
      - "**Додайте рахунки.** Енергія та інтернет — окремі витрати зі своїми платниками. Залиште в полі **Як розділити** значення **Порівну**."
      - "**Скопіюйте наступного місяця.** Відкрийте минуломісячну оренду й оберіть **Копіювати витрату**. Копія зберігає платника, суму й розподіл, а датою стає сьогоднішня. Змініть суму, якщо оренда змінилася, і оберіть **Створити копію**."
      - "**Перевірте, хто кому винен.** Це показує розділ **Баланси**. Платіть одне одному як зручно, а потім запишіть платіж у розділі **Розрахуватися**."
  - heading: "Кімнати з ванною, комірки й ті, хто з'їжджає"
    items:
      - "**Кімнати з власною ванною й комірки.** Площа — лише відправна точка. Кімната з власною ванною цінніша за таку саму площу без неї, а комірка, куди влазять ліжко й сповнений надії стілець, вартує менше. Скоригуйте відсотки за домовленістю, перевірте, що в сумі вони досі дають 100, і запишіть остаточні цифри там, де їх бачить уся квартира."
      - "**Хтось з'їжджає посеред місяця.** Порахуйте, скільки кожен винен за цей місяць, і внесіть оренду за цей місяць із варіантом **Точні суми** замість **Відсоток**. Суми мають дорівнювати оренді. Зробіть це, поки людина не пішла. Ніхто не може покинути групу, поки винен гроші або йому їх винні, а витрата, у якій бере участь той, хто пішов, стає доступною лише для читання."
      - "**Хтось заселяється.** Виміряйте знову, перерахуйте з новими розмірами кімнат і користуйтеся новими відсотками від наступної оренди. Попередні місяці лишаються як були."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він не міряє ваші кімнати й не обирає відсотки. Площі та ті 40 % група погоджує сама."
      - "У ньому немає регулярних рахунків, тож щоразу ви копіюєте оренду минулого місяця."
      - "Він ніколи не переказує гроші й не платить орендодавцю. Ви платите одне одному як зручно й записуєте це."
      - "Він не знає, що написано у вашому договорі оренди. Він веде облік між людьми з групи."
