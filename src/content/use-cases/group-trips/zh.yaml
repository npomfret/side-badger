featuresHeading: 旅行要用到的功能
faq:
  heading: 常见问题
  items:
    - q: 没去吃晚餐的人可以排除吗？
      a: 可以。选出每笔支出中参与的人，只向他们收取这笔费用。
    - q: 没有信号也能用吗？
      a: 不能。Side Badger 需要联网，所以等回到有 Wi-Fi 的地方再添加费用吧。
    - q: 每个人都需要安装什么吗？
      a: 不需要。它在浏览器中运行。发出邀请链接，大家用手机就能加入。
    - q: 它使用哪个汇率？
      a: 录入支出时的当前汇率，如果你换到的汇率不同，也可以用你自己的。汇率在保存支出时固定，所以旧的支出永远不会重新估值。
    - q: 旅行结束后可以冻结群组吗？
      a: 可以。管理员可以锁定群组，让数字不再变动。
    - q: 金额有上限吗？
      a: 有。每笔支出以其自身货币计，最高 999,999.99。
