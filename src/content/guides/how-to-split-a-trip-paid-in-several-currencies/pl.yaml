faq:
  heading: "Pytania"
  items:
    - q: "Jakiego kursu wymiany używa Side Badger?"
      a: "Aktualnego kursu wymiany, pobieranego przy wpisywaniu wydatku, gdy jest dostępny. Możesz zmienić go na ten, który faktycznie obowiązywał."
    - q: "Czy grupa może trzymać się funtów i jenów?"
      a: "Tak. Otwórz **Ustawienia** grupy, w sekcji **Ustawienia walut** włącz **Ogranicz waluty dla tej grupy**, wybierz **Dozwolone waluty** i ustaw **Domyślna waluta dla nowych wydatków**. Mniej opcji na liście to mniej pomyłek przy kasie."
    - q: "Czy w ogóle trzeba przeliczać?"
      a: "Nie. Waluty zostają osobno, chyba że ty lub twoja grupa zdecydujecie się przeliczać, a każda waluta ma własną krótką listę płatności."
