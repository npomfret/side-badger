meta:
  title: "کم ادائیگیوں میں حساب برابر کریں | Side Badger"
  description: "دیکھیں آپ کے گروپ میں کس کو کس کا دینا ہے، ادائیگیوں کی ایک مختصر فہرست پائیں جو سب کا حساب برابر کر دے، اور ہر ادائیگی ہوتے ہی ریکارڈ کریں۔ استعمال مفت ہے۔"
h1: "کم ادائیگیوں میں حساب برابر کریں"
navLabel: "حساب برابر کریں"
lead: "Side Badger گروپ کے ہر فرد کا چلتا ہوا بیلنس رکھتا ہے اور ادائیگیوں کی ایک مختصر فہرست تجویز کرتا ہے جو اسے برابر کر دیتی ہے۔ آپ جیسے چاہیں ایک دوسرے کو ادا کرتے ہیں، پھر اسے ریکارڈ کرتے ہیں۔ اگر پہلے دیکھنا چاہتے ہیں کہ اعداد کیسے تقسیم ہوتے ہیں تو [اخراجات کی تقسیم](page:feature/split-expenses) سے شروع کریں۔"
cta:
  heading: "کس کو کس کا دینا ہے، یہ الجھن سلجھانے کو تیار ہیں؟"
  body: "اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلا خرچہ شامل کریں۔ بیلنس آگے سنبھال لیں گے۔"
  button: "مفت اکاؤنٹ بنائیں"
problem:
  heading: "بیلنس جو ساتھ ساتھ اپ ڈیٹ ہوتے ہیں"
  body: "ہر خرچہ بدل دیتا ہے کہ کس کو کس کا دینا ہے، اس لیے Side Badger اخراجات اور ادائیگیاں شامل ہونے کے ساتھ بیلنس تازہ رکھتا ہے۔ گروپ کا ہر فرد تبدیلی فوراً دیکھتا ہے، اور یہ بھی کہ کیا بدلا اور کس نے بدلا۔ بیلنس ہر کرنسی کے لیے الگ رکھے جاتے ہیں، اس لیے یورو اور پاؤنڈ اپنے اپنے کالم میں رہتے ہیں جب تک کہ کوئی خرچہ شامل کرتے وقت تبدیل نہ کیا گیا ہو۔ ڈیفالٹ میں آپ وہ قرض دیکھتے ہیں جن کا آپ سے تعلق ہے؛ **سب دکھائیں** پورے گروپ کو فہرست کرتا ہے۔"
workflow:
  heading: "حساب برابر ہونے تک تین مراحل"
  steps:
    - title: "دیکھیں کس کو کس کا دینا ہے"
      body: "گروپ کے بیلنس کھولیں تاکہ دیکھ سکیں آپ کے ذمے کیا ہے، آپ کو کیا ملنا ہے، اور ادائیگیوں کی مختصر فہرست جو سب کا حساب برابر کرتی ہے، ہر کرنسی کے لحاظ سے نکالی ہوئی۔ سوال والے اخراجات طے ہونے تک حساب سے باہر رہتے ہیں۔ نیچے ساتھ رہنے والوں کی مثال میں چھ ادائیگیاں دو بن جاتی ہیں۔"
      shot: S10
      shotAlt: "بیلنس اسکرین جو دو کرنسیوں میں آسان کیے گئے قرض دکھا رہی ہے، «سب دکھائیں» آن ہے"
    - title: "جیسے چاہیں ادا کریں، پھر ریکارڈ کریں"
      body: "بینک ٹرانسفر، نقد، یا پچھلی چھٹیوں کا کوئی احسان۔ Side Badger رقم نہیں منتقل کرتا۔ جب رقم ہاتھ بدل لے تو ادائیگی ریکارڈ کریں اور بیلنس سب کے لیے اپ ڈیٹ ہو جاتا ہے۔"
      shot: S11
      shotAlt: "فوری تصفیہ کے بٹنوں اور جزوی ادائیگی پر دکھائے جانے والے نوٹس کے ساتھ ادائیگی کا فارم"
    - title: "دیکھ لیں کہ پہنچ گئی"
      body: "ادائیگی گروپ کی تاریخ میں چلی جاتی ہے، جہاں گروپ کا ہر فرد اسے دیکھ سکتا ہے اور ایموجی سے ردعمل دے سکتا ہے۔ ادائیگی پہنچ جائے تو جشن منائیں۔"
      shot: S12
      shotAlt: "ایک ادائیگی پر ایموجی ردعمل کے ساتھ ادائیگیوں کی تاریخ"
