faq:
  heading: Fragen
  items:
    - q: Ist Side Badger eine kostenlose Alternative zu Splitwise?
      a: "Zum Teilen von Rechnungen in einer Gruppe: ja. Belegscan, Währungsumrechnung und keine Werbung sind kostenlos, ohne Tageslimits. Brauchst du eine native App, Offline-Nutzung, wiederkehrende Ausgaben oder Zahlungen in der App, kann Splitwise das und Side Badger nicht."
    - q: Woher stammen die Angaben zu Splitwise?
      a: "Von Splitwises eigenen Seiten: seiner Startseite, seiner Pro-Seite und seinem Hilfe-Center. Jede Zeile der Tabelle verlinkt auf die Seite, von der sie stammt, und das Datum über der Tabelle sagt, wann wir sie gelesen haben. Wir prüfen sie jedes Quartal."
    - q: Bleibt Side Badger kostenlos?
      a: "Heute ist alles in Side Badger kostenlos, und es gibt keinen bezahlten Tarif. Sollte sich das je ändern, sagen wir vorher Bescheid. Die [Preisseite](page:pricing) hat die Einzelheiten."
    - q: Müssen alle in meiner Gruppe wechseln?
      a: "Ja. Alle in einer Gruppe brauchen ein kostenloses Side-Badger-Konto, und sie können per Link oder QR-Code beitreten."
    - q: Hat Side Badger eine mobile App?
      a: "Nicht in einem App-Store. Es läuft in deinem Browser: Melde dich auf dem Handy an und füge es dann zum Home-Bildschirm hinzu, damit es sich wie eine App öffnet. [So funktioniert es](page:how-it-works) zeigt, wie."
