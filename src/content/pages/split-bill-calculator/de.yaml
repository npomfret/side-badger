faq:
  heading: Fragen
  items:
    - q: Ist der Rechner kostenlos?
      a: Ja. Kostenlos. Keine Werbung. Keine Tageslimits. Ein Konto brauchst du dafür auch nicht.
    - q: Speichert er, was ich eingebe?
      a: Nein. Nichts wird gespeichert oder irgendwohin gesendet. Um deine Zahlen zu behalten, nutze „Link kopieren“ und speichere den Link irgendwo.
    - q: Wer kann den Link sehen, den ich kopiere?
      a: "Alle, die ihn haben. Die Zahlen stecken im Link selbst, hinter dem #, schick ihn also nur an die, die sie sehen sollen."
    - q: Bewegt er Geld?
      a: Nein. Er rechnet aus, wer wem zahlen sollte, und ihr zahlt einander, wie ihr wollt. Auch Side Badger fasst dein Geld nie an. Siehe [Abrechnen](page:feature/settle-up).
    - q: Kann ich eine Reise teilen, die in zwei Währungen bezahlt wurde?
      a: Hier nicht, denn eine Berechnung hat nur eine Währung. In einer Gruppe führt jede Währung einen eigenen Saldo. Siehe [Mehrere Währungen](page:feature/multiple-currencies).
    - q: Was, wenn die Beträge nicht aufgehen?
      a: Der Rechner sagt das unter der Ausgabe und zeigt kein Ergebnis, bis es stimmt. Genaue Beträge müssen die Gesamtsumme ergeben, und Prozentsätze müssen zusammen 100 ergeben.
