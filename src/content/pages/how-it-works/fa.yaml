sections:
  - heading: "39 زبان، برای افراد بیشتر"
    body: "از Side Badger به 39 زبان استفاده کنید، از جمله عربی، فارسی و اردو با نوشتار راست‌به‌چپ. هر عضو گروه می‌تواند زبان خودش را انتخاب کند، پس صفحه گروه برای یک نفر می‌تواند عربی باشد و برای نفر بعد انگلیسی. همچنین با در نظر گرفتن کاربران صفحه‌کلید و صفحه‌خوان ساخته شده و رنگ اعضا با الگو همراه است، پس لازم نیست سبز و قرمز را از هم تشخیص دهید."
faq:
  heading: "پرسش‌ها"
  items:
    - q: "آیا همه به حساب نیاز دارند؟"
      a: "بله، یک حساب رایگان. هر نفر پیش از افزودن هر چیزی ایمیلش را تأیید می‌کند."
    - q: "برنامه دارد؟"
      a: "در مرورگر اجرا می‌شود. وارد شوید و بعد آن را به صفحه اصلی یا داک اضافه کنید تا مثل یک برنامه باز شود. تنظیمات داخل برنامه روش کار را نشان می‌دهد. نسخه فروشگاهی و حالت آفلاین ندارد."
    - q: "آیا Side Badger پول جابه‌جا می‌کند؟"
      a: "نه. حساب را نگه می‌دارد و پرداخت‌ها را پیشنهاد می‌دهد و شما هر طور دوست دارید به هم پرداخت می‌کنید. بعد پرداخت را ثبت می‌کنید. [تسویه حساب](page:feature/settle-up) را ببینید."
    - q: "می‌شود در حالت بدهکاری از گروه رفت؟"
      a: "نه. تا وقتی کسی بدهکار یا طلبکار است نمی‌تواند از گروه خارج شود، پس اول تسویه می‌کند."
    - q: "چند نفر می‌توانند به یک گروه بپیوندند؟"
      a: "تا 50 نفر در هر گروه. با لینک یا کد QR دعوتشان کنید و اگر می‌خواهید مدیر به هر نفر اجازه ورود بدهد، تأیید را روشن کنید."
    - q: "سفرهایی که بیش از یک ارز دارند چه؟"
      a: "مانده‌ها برای هر ارز جداگانه نگه داشته می‌شوند. [چند ارز](page:feature/multiple-currencies) را ببینید."
