sections:
  - heading: "Satu mata uang untuk seluruh grup"
    body: "Jika grup Anda tidak mau repot memikirkannya, pilih mata uang grup dan formulir akan mengonversi tiap pengeluaran baru ke dalamnya, dengan kurs yang tetap bisa Anda lihat dan ubah. Ini hanya berlaku untuk pengeluaran baru dan salinan. Perubahan dan pengeluaran yang sudah ada dibiarkan apa adanya, jadi tak ada yang sudah tercatat berubah di bawah Anda."
  - heading: "Berutang euro, membayar dalam pound"
    body: "Membayar dalam yen, melunasi dalam pound? Tidak masalah. Saat mencatat pembayaran Anda juga bisa mengonversinya, jadi yang berutang euro bisa membayar dalam pound dan saldo euro tetap keluar dengan benar. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat."
  - heading: "Aturan untuk grup"
    body: "Batasi grup pada mata uang yang benar-benar Anda pakai, dan tetapkan bawaan agar formulir terbuka pada yang tepat. Liburan di Portugal tidak memerlukan 139 pilihan lain di samping tagihan makan malam, dan [pernikahan di luar negeri](page:use-case/events-and-celebrations) mungkin memerlukan dua."
limits:
  heading: "Batas"
  items:
    - "Kurs ditetapkan saat pengeluaran disimpan. Pengeluaran lama tidak pernah dinilai ulang."
    - "Side Badger mengambil kurs terkini jika bisa. Tidak semua pasangan mata uang dijamin mendapatkannya, dan Anda selalu bisa mengetik kursnya sendiri."
    - "Konversi otomatis grup hanya berlaku untuk pengeluaran baru dan salinan, bukan untuk perubahan atau pengeluaran yang sudah ada."
    - "Setiap pengeluaran dibatasi 999,999.99 dalam mata uangnya sendiri."
    - "Ada 140 mata uang. Mata uang kripto dan logam tidak termasuk."
    - "Side Badger mencatat pembayaran. Ia tidak pernah memindahkan atau menukar uang."
useCasesHeading: "Di mana ini membantu"
faq:
  heading: "Pertanyaan"
  items:
    - q: "Kurs apa yang Anda pakai?"
      a: "Kurs terkini, diambil saat Anda memasukkan pengeluaran jika tersedia. Anda bisa mengubahnya ke kurs yang benar-benar Anda dapatkan, dan jumlah yang dikonversi diperbarui."
    - q: "Apakah pengeluaran lama dinilai ulang?"
      a: "Tidak. Kurs ditetapkan saat pengeluaran disimpan, jadi saldo tidak bergeser hanya karena pasar bergerak."
    - q: "Apakah mendukung kripto?"
      a: "Tidak. Ada 140 mata uang, dan mata uang kripto tidak termasuk."
    - q: "Mengapa saya tidak bisa memasukkan 2,000,000 rupiah?"
      a: "Setiap pengeluaran dibatasi 999,999.99 dalam mata uangnya sendiri. Masukkan dalam mata uang lain lalu konversi, atau pecah menjadi dua pengeluaran."
    - q: "Apakah konversi dikenai biaya?"
      a: "Tidak. Mengonversi gratis, seperti bagian Side Badger lainnya. Lihat [harga](page:pricing)."
    - q: "Apakah saya harus mengonversi?"
      a: "Tidak. Mata uang tetap terpisah kecuali Anda atau grup memilih untuk mengonversi, dan setiap mata uang mendapat daftar pembayaran singkatnya sendiri."
