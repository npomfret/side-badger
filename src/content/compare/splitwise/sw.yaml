    - feature: Chati na migawanyo chaguo-msingi
      other: Vyote viwili ni vipengele vya Pro.
      sideBadger: Hakuna.
      source: pro
faq:
  heading: Maswali
  items:
    - q: Je, Side Badger ni mbadala wa bure wa Splitwise?
      a: "Kwa kugawanya bili kwenye kikundi, ndiyo, na inafanya zaidi ya hesabu: maoni, maswali, orodha, kura na majukumu ya kikundi, pamoja na kuchanganua risiti na kubadilisha sarafu bila malipo. Ukihitaji programu ya duka la programu, matumizi bila mtandao au malipo ndani ya programu, Splitwise inafanya hayo na Side Badger haifanyi."
    - q: Maelezo ya Splitwise yanatoka wapi?
      a: "Kurasa za Splitwise yenyewe: ukurasa wake wa mwanzo, ukurasa wake wa Pro na kituo chake cha msaada. Kila safu ya jedwali ina kiungo cha ukurasa ilikotoka, na tarehe iliyo juu ya jedwali inasema tuliyasoma lini. Tunayakagua kila robo mwaka."
    - q: Je, Side Badger itaendelea kuwa bure?
      a: Kila kitu kwenye Side Badger ni bure leo. Hilo likibadilika siku moja, tutakupa taarifa kwanza. [Ukurasa wa bei](page:pricing) una maelezo.
    - q: Je, kila mtu kwenye kikundi changu lazima ahamie?
      a: Ndiyo. Kila mtu kwenye kikundi anahitaji akaunti ya bure ya Side Badger, na anaweza kujiunga kwa kiungo au msimbo wa QR.
    - q: Je, Side Badger ina programu ya simu?
      a: "Si kwenye duka la programu. Inafanya kazi kwenye kivinjari chako: ingia kwenye simu yako, kisha iweke kwenye skrini ya kwanza ili ifunguke kama programu. [Inavyofanya kazi](page:how-it-works) inaonyesha jinsi."
