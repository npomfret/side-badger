sections:
  - heading: Registrera en betalning
    body: När någon betalar registrerar du det på rätt person. Snabbregleringsknapparna fyller i beloppet från dina föreslagna betalningar, och du kan lägga till en anteckning som "banköverföring" (upp till 500 tecken). Betalar du bara en del av det du är skyldig ligger resten kvar på saldot. Anger du för lite eller för mycket varnar Side Badger dig innan du sparar. För att registrera en betalning krävs behörighet att redigera utgifter, och datumet får inte ligga i framtiden.
  - heading: Betalat i en annan valuta?
    body: Saldona stannar i den valuta de betalades i, så en skuld i euro förblir en skuld i euro. Är du skyldig euro men betalar i pund? Räkna om betalningen när du lägger in den, med en aktuell växelkurs eller med den kurs du faktiskt fick. Kursen fastställs när betalningen sparas. [Flera valutor](page:feature/multiple-currencies) förklarar hur omräkning fungerar, och [gruppresor](page:use-case/group-trips) visar den i bruk.
  - heading: Historik du kan kontrollera
    body: Varje registrerad betalning finns kvar i gruppens historik med datum, belopp och anteckning. Bara den som registrerade en betalning kan redigera den, och hen eller en gruppadministratör kan ta bort den. En betalning som rör någon som har lämnat gruppen är låst. Ett genomarbetat scenario med rumskamrater finns under [rumskamrater](page:use-case/housemates).
limits:
  heading: Vad Side Badger inte gör
  items:
    - Side Badger flyttar inte pengar, skickar inte betalningslänkar och skickar inte betalningsförfrågningar. En betalning i appen är en registrering av en betalning som gjorts någon annanstans.
    - De föreslagna betalningarna kommer från en enkel matchningsmetod som tillämpas per valuta. Den föreslår alltid färre betalningar än det finns personer med saldo i den valutan (fyra personer, högst tre betalningar), men den hittar inte alltid det minsta möjliga antalet.
    - Du kan inte stänga av förslagen. **Visa alla** listar varje föreslagen betalning i gruppen, inte bara dina.
    - Valutor räknas aldrig mot varandra om inte utgifterna räknades om när de lades in.
    - Det finns inga påminnelser, så det är fortfarande upp till dig att jaga en betalning.
useCasesHeading: Där det betyder något att göra upp
faq:
  heading: Frågor
  items:
    - q: Skickar Side Badger pengarna?
      a: Nej. Betala varandra hur ni vill och registrera sedan betalningen i Side Badger så att saldot uppdateras.
    - q: Kan jag stänga av de föreslagna betalningarna?
      a: Nej. Förenklingen är alltid på, och **Visa alla** listar varje föreslagen betalning i gruppen, inte bara de som rör dig.
    - q: Varför hålls euro och pund separata?
      a: Saldona stannar i den valuta du betalade i om du inte räknar om när du lägger in en utgift eller betalning. Skulder i olika valutor räknas aldrig mot varandra.
    - q: Vad händer om någon bara betalar en del av det hen är skyldig?
      a: Registrera den del som betalades. Resten ligger kvar på saldot tills den är betald.
    - q: Är det alltid det minsta möjliga antalet betalningar?
      a: Det garanteras inte. Det föreslår alltid färre betalningar än det finns personer med saldo i den valutan, så för fyra personer föreslås aldrig fler än tre. I exemplet med rumskamrater blir det två betalningar, där en direkt återbetalning till varje person krävde sex.
