faq:
  heading: "Domande"
  items:
    - q: "E se qualcuno ha una camera più grande ma con meno luce?"
      a: "La superficie è solo il punto di partenza, quindi il gruppo può concordare un aggiustamento. Togli un punto o due alla camera buia, assegnali agli altri e controlla che le percentuali sommino ancora a 100. Side Badger registra quello che concordate e non lo giudica."
    - q: "Anche le bollette vanno divise in base alla dimensione delle stanze?"
      a: "Di solito no. Energia e internet li usano tutti, quindi una divisione in parti uguali è più semplice, come nell'esempio qui sopra. Se un coinquilino è in casa tutto il giorno, il gruppo può accordarsi su qualcos'altro, come gli importi esatti. [Dividere le spese](page:feature/split-expenses) spiega le opzioni."
    - q: "Possiamo cambiare la divisione in seguito?"
      a: "Sì, per le nuove spese. Cambia le percentuali quando copi l'affitto e i mesi precedenti restano com'erano. Per correggere una spesa passata, modificala se i permessi del gruppo lo consentono, e avvisa prima la casa, perché i saldi cambiano. La versione precedente viene conservata."
