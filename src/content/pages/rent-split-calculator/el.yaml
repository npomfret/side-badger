faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Τι είναι δικαιότερο, το μέγεθος του δωματίου ή το εισόδημα;"
      a: "Κανένα δεν είναι πάντα το δικαιότερο. Το μέγεθος του δωματίου ταιριάζει σε συγκατοίκους που πληρώνουν για τον χώρο όπου κοιμούνται. Το εισόδημα ταιριάζει σε ζευγάρια και φίλους με πολύ διαφορετικές αποδοχές. Συμφωνήστε το πριν από την πρώτη μέρα του ενοικίου, όχι μετά."
    - q: "Πρέπει να χωριστούν οι λογαριασμοί με τον ίδιο τρόπο;"
      a: "Για συγκατοίκους, συνήθως όχι. Το ρεύμα και το ίντερνετ τα χρησιμοποιούν όλοι, οπότε το εξίσου είναι πιο απλό, όπως στο παράδειγμα. Ανάλογα με το εισόδημα, η αριθμομηχανή δίνει στους λογαριασμούς τα ίδια μερίδια με το ενοίκιο."
    - q: "Μπορώ να χρησιμοποιήσω τετραγωνικά πόδια;"
      a: "Ναι. Επιλέξτε ft² και πληκτρολογήστε τα εμβαδά σε τετραγωνικά πόδια. Η μονάδα είναι μόνο ετικέτα και τα μερίδια βγαίνουν ίδια αρκεί όλοι να χρησιμοποιούν την ίδια."
    - q: "Είναι δωρεάν η αριθμομηχανή;"
      a: "Ναι. Δωρεάν. Χωρίς διαφημίσεις. Χωρίς ημερήσια όρια. Ούτε λογαριασμό χρειάζεστε."
