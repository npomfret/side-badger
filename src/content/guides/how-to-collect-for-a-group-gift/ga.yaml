meta:
  title: "Conas airgead a bhailiú do bhronntanas grúpa | Side Badger"
  description: "Suim dhifriúil an duine, cárta duine amháin ag glacadh an bhuille. Vótaíocht buiséid, méideanna cruinne, agus Side Badger ag déanamh na matamaitice."
h1: "Conas airgead a bhailiú do bhronntanas grúpa"
navLabel: "Bailigh do bhronntanas grúpa"
lead: "Ciallaíonn bailiú do bhronntanas grúpa go gcuireann duine amháin an t-airgead amach as a phóca féin agus go bhfuil a ranníocaíocht dlite ag gach duine eile dó. Aontaigh buiséad le vótaíocht, lig don cheannaitheoir an bronntanas a chur ar a chárta, ansin cuir isteach é mar chostas amháin le [méideanna cruinne](page:feature/split-expenses), suim do gach duine. Taispeánann Side Badger cad atá dlite ag gach duine don cheannaitheoir, agus seolann gach duine a sciar ar an gcaoi is fearr leo."
cta:
  heading: "Cuir an hata thart gan hata"
  body: "Déan grúpa, fág an duine atá ag fáil an bhronntanais amach as agus cuir isteach an bronntanas le méideanna cruinne. Tá Side Badger saor in aisce, gan fógraí agus gan teorainneacha laethúla. An bhfuil léargas gasta uait ar dtús? Féach [conas a oibríonn sé](page:how-it-works) nó [cad a chlúdaíonn saor in aisce](page:pricing)."
sections:
  - heading: "Ceathrar cairde, seinnteoir ceirníní amháin, suim dhifriúil an duine"
    body: "Beidh Bea 30 bliain d'aois agus ba mhaith léi seinnteoir ceirníní. Tá Priya, Omar, Lena agus Sam chun ceann a cheannach di. Aimsíonn Priya ceann ar £240 agus ceannaíonn sí é ar a cárta féin, mar caithfidh duine éigin tosú. Ní chuireann an ceathrar isteach go cothrom. Cuireann Priya agus Omar £60 isteach an duine, Lena £80 agus Sam £40. Ní mhíníonn aon duine a shuim agus ní fhiafraíonn aon duine. Ceannaíonn Omar cárta beannachta agus páipéar bronntanais freisin ar £12. Síníonn an ceathrar acu an cárta, mar sin roinntear an ceann sin go cothrom."
  - heading: "Aontaigh an buiséad sula gcliceálann aon duine Ceannaigh"
    body: "Sábhálann vótaíocht buiséid an argóint faoi bhord casta £400. Sa ghrúpa, roghnaigh **Cuir Vótaíocht Leis** agus fiafraigh cé mhéad ba cheart don bhronntanas a chostas. Déan suimeanna de na roghanna, mar suas le £150, suas le £200 agus suas le £250. Cuir **Vótáil gan ainm** ar siúl, a cheileann cé a vótáil ar son cad, ionas nach gcaithfidh aon duine uimhir níos lú a chosaint os ard. Ní féidir na socruithe a athrú a luaithe a chaitear an chéad vóta, mar sin seiceáil iad ar dtús. Ní dhúnann vótaíocht í féin. Nuair a bhíonn vóta caite ag gach duine, roghnaigh **Dún an vótaíocht** agus taispeántar an **Buaiteoir**. Aontaíonn an vótaíocht an t-iomlán. Ní shocraíonn sí sciar aon duine."
  - heading: "An cuntas a léamh"
    body: "Roinntear an bronntanas £60, £60, £80 agus £40, rud a dhéanann an £240 ar an admháil. Roinntear an cárta beannachta agus an páipéar bronntanais ceithre bhealach ar £3 an duine. Is é £60 + £3 bille Priya, mar sin £63, agus d'íoc sí £240, rud a fhágann £177 dlite di. Is £63 é bille Omar freisin, ach d'íoc sé £12, mar sin tá £51 dlite aige. Tá £80 + £3 dlite ag Lena, is é sin £83, agus tá £40 + £3 dlite ag Sam, is é sin £43. Is ionann an triúr sin le chéile agus £177 Priya. Dá bhfágfaí é mar atá, rithfeadh na fiacha cúig bhealach timpeall an ghrúpa. Molann Side Badger trí íocaíocht ina áit, gach ceann acu chuig Priya. Tá na sonraí le fáil ar [shocrú suas](page:feature/settle-up)."
  - heading: "Cuir isteach i Side Badger é"
    body: "Tógann taobh Priya thart ar chúig nóiméad."
    items:
      - "**Déan an grúpa.** Ar an bpainéal roghnaigh **Cruthaigh Grúpa**. Roghnaigh **Tabhair Cuireadh do Dhaoine Eile** agus seol an nasc nó an cód QR chuig na daoine atá ag cur isteach, agus ná seol chuig aon duine eile é."
      - "**Cuir an bronntanas leis.** Roghnaigh **Cuir Costas Leis**, cuir cur síos air, clóscríobh 240 agus faoi **Cé a d'íoc?** roghnaigh Priya. Fág an ceathrar roghnaithe faoi **Roinn idir**, ansin faoi **Conas a roinntear** roghnaigh **Méideanna cruinne** agus clóscríobh 60, 60, 80 agus 40. Caithfidh na suimeanna 240 a bhaint amach le chéile. Ceangail deimhniú an ordaithe más maith leat. Roghnaigh **Sábháil an Costas**."
      - "**Cuir an cárta leis.** Cuireann Omar an costas £12 leis é féin, roghnaíonn sé é féin faoi **Cé a d'íoc?** agus fágann sé **Conas a roinntear** ar **Cothrom**, agus tic ag gach duine den cheathrar."
      - "**Comhair, ansin íoc.** Seiceálann gach duine **Iarmhéideanna**, a thaispeánann cé atá i bhfiacha le cé, agus seolann a sciar chuig Priya ar an gcaoi is fearr leo. Ansin taifeadann siad é le **Socraigh** agus **Taifead Socrú**. Líonann Socrú gasta an méid isteach."
  - heading: "Ceannaigh ar dtús, nó bailigh ar dtús"
    body: "Ní choinníonn Side Badger an pota, mar sin ciallaíonn “bailiú” comhaireamh i ndáiríre. Oibríonn dhá chur chuige."
    items:
      - "**Ceannaigh ar dtús.** Íocann an ceannaitheoir, cuireann sé an costas leis ag an bpraghas ceart agus feiceann gach duine a sciar gan mhoill. Tá sé níos néata, ach iompraíonn an ceannaitheoir an costas go n-íocann daoine, mar sin roghnaigh ceannaitheoir atá in ann."
      - "**Bailigh ar dtús.** Seolann daoine a suim chuig an gceannaitheoir roimh an gceannach. Nuair atá an praghas agat, cuir an bronntanas isteach, ansin taifead gach íocaíocht leis an dáta ar bhog an t-airgead i ndáiríre. Cuir an bronntanas leis ar dtús, ionas go mbeidh iarmhéid lena mbaineann gach íocaíocht."
      - "**Athraíonn an praghas.** Seachadadh, cód lascaine, ardú praghais déanach. Cuir an bronntanas in eagar agus athraigh na méideanna cruinne ionas go mbainfidh siad an t-iomlán amach fós. Coinnítear an leagan roimhe, ach inis don ghrúpa ar dtús, mar athraíonn a n-iarmhéideanna."
  - heading: "Fág Bea amach as"
    body: "Ní féidir ach le baill de ghrúpa é a fheiceáil, mar sin ní féidir le Bea grúpa nach bhfuil sí ann a fheiceáil. Tabhair cuireadh do na daoine atá ag cur isteach agus d'aon duine eile ná tabhair. Oibríonn nasc go dtí go dtéann sé as feidhm, agus is féidir leat aon rud ó 15 nóiméad go 5 lá a roghnú, mar sin roghnaigh ceann gearr agus seol é áit nach bhfeicfidh Bea é. Taispeánann an nasc réamhamharc den ghrúpa don té a osclaíonn é, mar sin tabhair ainm leadránach ar an ngrúpa, mar shampla Ciste an tSathairn, agus fág ainm Bea as lipéid costais agus roghanna vótaíochta freisin."
  - heading: "Cad nach ndéanann Side Badger anseo"
    items:
      - "Ní choinníonn sé ná ní bhailíonn sé an t-airgead. Téann ranníocaíochtaí chuig an gceannaitheoir trí aistriú bainc, airgead tirim nó cibé rud a úsáideann sibh, agus ansin taifeadann duine éigin iad."
      - "Ní sheolann sé meabhrúcháin íocaíochta. Is obair dhaonna fós é an té nár íoc a spreagadh."
      - "Ní oibríonn sé amach sciar aon duine. Aontaíonn vótaíocht an buiséad agus níl aon rogha “roinn an chuid eile” ann, mar sin clóscríobhann tú gach méid."
      - "Íocann duine amháin as gach costas. Má cheannaigh dhá dhuine codanna éagsúla den bhronntanas, cuir isteach dhá chostas."
      - "Teastaíonn cuntas saor in aisce agus áit sa ghrúpa ó gach duine sa roinnt."
