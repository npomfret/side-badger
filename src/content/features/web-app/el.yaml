meta:
  title: "Εφαρμογή για χωρισμό λογαριασμών χωρίς λήψη | Side Badger"
  description: "Γεμάτο το κινητό; Το ξέρουμε. Το Side Badger τρέχει στον browser, χωρίς κατάστημα εφαρμογών ή λήψη. Προσθέστε το στην αρχική οθόνη και ανοίγει σαν εφαρμογή."
h1: "Χωρίς κατάστημα εφαρμογών. Χωρίς λήψη. Και πάλι σαν εφαρμογή"
navLabel: "Εφαρμογή ιστού"
lead: "Το Side Badger ζει στο πρόγραμμα περιήγησής σας. Δεν υπάρχει κατάστημα εφαρμογών να ψάξετε και τίποτα να κατεβάσετε πρώτα. Συνδεθείτε από κινητό ή υπολογιστή, χωρίστε έξοδα στο διαδίκτυο με την ομάδα σας και προσθέστε το στην αρχική οθόνη ή στο dock όταν το θέλετε ένα άγγιγμα μακριά."
cta:
  heading: "Ανοίξτε το. Συνδεθείτε. Ξεκινήστε μια ομάδα."
  body: "Δημιουργήστε λογαριασμό, ξεκινήστε μια ομάδα και προσθέστε το πρώτο έξοδο, όλα από το πρόγραμμα περιήγησης που έχετε ήδη ανοιχτό. Θέλετε πρώτα την ξενάγηση; Δείτε [πώς λειτουργεί](page:how-it-works) ή τι [καλύπτει το δωρεάν πακέτο](page:pricing)."
problem:
  heading: "Το κινητό σας είναι γεμάτο. Το καταλαβαίνουμε."
  body: "Κάπου εκεί μέσα είναι τέσσερις χιλιάδες φωτογραφίες από το ίδιο ηλιοβασίλεμα και μια προειδοποίηση για τον χώρο αποθήκευσης που διώχνετε με το δάχτυλο από την άνοιξη. Το τελευταίο που χρειάζεται είναι άλλη μία εφαρμογή, μόνο και μόνο για να χωρίσετε ένα δείπνο. Γι' αυτό το Side Badger είναι εφαρμογή ιστού. Τρέχει σε ένα σύγχρονο πρόγραμμα περιήγησης σε κινητό ή υπολογιστή. Στο κινητό χρησιμοποιεί διατάξεις για κινητά, με τη σελίδα της ομάδας χωρισμένη σε καρτέλες και χειριστήρια φιλικά προς την αφή. Κάποιες επιπλέον δυνατότητες, όπως η προσθήκη στην αρχική οθόνη, εξαρτώνται από το πρόγραμμα περιήγησής σας και λέμε πού."
workflow:
  heading: "Από την καρτέλα του προγράμματος περιήγησης στην αρχική οθόνη σε τρία βήματα"
  steps:
    - title: "Ανοίξτε το και συνδεθείτε"
      body: "Μπείτε στο Side Badger από το πρόγραμμα περιήγησής σας και συνδεθείτε. Χρειάζεστε μόνο μια διεύθυνση email και έναν κωδικό πρόσβασης και επιβεβαιώνετε το email πριν μπορέσετε να προσθέσετε οτιδήποτε. Όλοι στην ομάδα χρειάζονται λογαριασμό, οπότε τα άτομα που προσκαλείτε θα κάνουν το ίδιο."
    - title: "Προσθέστε το στην αρχική οθόνη ή στο dock"
      body: "Μόλις συνδεθείτε, η εφαρμογή προσφέρεται να εγκαταστήσει τον εαυτό της. Βλέπετε ένα κουμπί **Εγκατάσταση** όπου το επιτρέπει το πρόγραμμα περιήγησής σας και ένα κουμπί **Δείξε μου πώς** όπου δεν το επιτρέπει. Το χάσατε ή είπατε όχι; Οι **Ρυθμίσεις** έχουν την ίδια βοήθεια στην ενότητα **Προσθήκη στην αρχική οθόνη ή στο Dock**. Σε iPhone ή iPad, οι Ρυθμίσεις δείχνουν πρώτα τα βήματα για iPhone και βάζουν τις υπόλοιπες συσκευές κάτω από την επιλογή **Άλλες συσκευές**. Όπως και να έχει, η εφαρμογή ανοίγει μετά σε δικό της παράθυρο."
      shot: S20
      shotAlt: "Η ενότητα Προσθήκη στην αρχική οθόνη ή στο Dock των Ρυθμίσεων, με τα βήματα για την προσθήκη της εφαρμογής σε μια συσκευή"
    - title: "Ενεργοποιήστε τις ειδοποιήσεις, αν τις θέλετε"
      body: "Οι ειδοποιήσεις είναι απενεργοποιημένες μέχρι να τις ενεργοποιήσετε και κάθε συσκευή ενεργοποιείται ξεχωριστά. Χρησιμοποιήστε το κουμπί **Ενεργοποίηση** που προσφέρει το καμπανάκι ειδοποιήσεων ή τον διακόπτη **Ειδοποιήσεις push** στις **Ρυθμίσεις**. Σε iPhone ή iPad, ανοίξτε πρώτα την εφαρμογή από την οθόνη Αφετηρίας. Μόνο από εκεί λειτουργούν οι ειδοποιήσεις σε αυτές τις συσκευές."
      shot: S19
      shotAlt: "Το αναπτυσσόμενο μενού ειδοποιήσεων ανοιχτό, με λίστα πρόσφατης δραστηριότητας στην ομάδα"
options:
  heading: "Πώς να το προσθέσετε, συσκευή προς συσκευή"
  items:
    - title: "iPhone και iPad"
      body: "Πατήστε το κουμπί Κοινοποίηση, ένα τετράγωνο με ένα βέλος που δείχνει προς τα πάνω. Αν δεν το βλέπετε, πατήστε πρώτα τις τρεις τελείες (•••) και μετά Κοινοποίηση. Κάντε κύλιση προς τα κάτω και πατήστε **Προσθήκη στην οθόνη Αφετηρίας**. Αφήστε ενεργοποιημένο το **Άνοιγμα ως εφαρμογή ιστού** και μετά πατήστε **Προσθήκη**. Αν ένας σύνδεσμος άνοιξε μέσα σε άλλη εφαρμογή, ανοίξτε πρώτα τη σελίδα στο Safari, γιατί αυτό το ενσωματωμένο πρόγραμμα περιήγησης δεν μπορεί να την προσθέσει."
    - title: "Android"
      body: "Ανοίξτε το μενού του προγράμματος περιήγησης και επιλέξτε **Προσθήκη στην αρχική οθόνη** ή **Εγκατάσταση εφαρμογής**."
    - title: "Chrome ή Edge σε υπολογιστή"
      body: "Ανοίξτε το μενού του προγράμματος περιήγησης και επιλέξτε την επιλογή εγκατάστασης αυτού του ιστότοπου ως εφαρμογής. Έτσι αποκτά δικό του παράθυρο και δικό του εικονίδιο."
    - title: "Safari σε Mac"
      body: "Επιλέξτε **Αρχείο** και μετά **Προσθήκη στο Dock**."
sections:
  - heading: "Ειδοποιήσεις, μόνο αν τις ζητήσετε"
    body: "Οι ειδοποιήσεις push ενεργοποιούνται μόνο αν τις επιλέξετε. Ενεργοποιήστε τις και λαμβάνετε μια ειδοποίηση όταν υπάρχει νέα δραστηριότητα στις ομάδες σας, όπως όταν κάποιος προσθέτει ένα έξοδο, αφήνει ένα σχόλιο ή καταγράφει μια πληρωμή. Ενεργοποιούνται μία συσκευή τη φορά, από το καμπανάκι ειδοποιήσεων ή από τις **Ρυθμίσεις**, και μπορείτε να τις απενεργοποιήσετε ξανά εκεί. Χρειάζονται πρόγραμμα περιήγησης που τις υποστηρίζει και την άδειά σας. Αν το πρόγραμμα περιήγησής σας τις έχει αποκλείσει για τον ιστότοπο, επιτρέψτε τις πρώτα στις ρυθμίσεις του προγράμματος. Σε iPhone ή iPad λειτουργούν μόνο από την εφαρμογή που έχει προστεθεί στην οθόνη Αφετηρίας, όχι από μια καρτέλα του προγράμματος περιήγησης. Η παράδοση δεν είναι εγγυημένη, οπότε αντιμετωπίστε μια ειδοποίηση ως σκούντημα και όχι ως υπόσχεση. Για όσα εμφανίζονται στη ροή, δείτε τη σελίδα [Σχεδιάστε μαζί](page:feature/plan-together)."
  - heading: "Άμεσες ενημερώσεις, χωρίς κουμπί ανανέωσης"
    body: "Προσθέστε ένα έξοδο και όλοι το βλέπουν αμέσως, μαζί με το τι άλλαξε και ποιος το άλλαξε. Κάθε ομάδα κρατά ιστορικό δραστηριότητας και το καμπανάκι ειδοποιήσεων δείχνει τη δραστηριότητα σε όλες τις ομάδες σας. Κανείς δεν χρειάζεται να ρωτήσει αν είδατε αυτό που μόλις προσθέσατε. Είναι στην οθόνη του."
  - heading: "39 γλώσσες, ο καθένας τη δική του"
    body: "Χρησιμοποιήστε το Side Badger σε 39 γλώσσες, συμπεριλαμβανομένων των αραβικών, των περσικών και των ουρντού, που γράφονται από δεξιά προς τα αριστερά. Ο καθένας στην ομάδα διαλέγει τη δική του, οπότε η ίδια σελίδα ομάδας μπορεί να είναι στα αραβικά για ένα άτομο και στα αγγλικά για το επόμενο. Το μόνο που πρέπει να συμφωνήσει η ομάδα είναι οι αριθμοί."
  - heading: "Φτιαγμένο για περισσότερα από ένα είδη χρηστών"
    body: "Το Side Badger είναι φτιαγμένο με γνώμονα όσους χρησιμοποιούν πληκτρολόγιο και αναγνώστη οθόνης. Τα χρώματα των μελών συνοδεύονται από μοτίβα, ώστε να μη χρειάζεται να ξεχωρίζετε το πράσινο από το κόκκινο."
    items:
      - "Σύνδεσμοι παράκαμψης, ώστε όσοι χρησιμοποιούν πληκτρολόγιο να πηγαίνουν κατευθείαν στο περιεχόμενο."
      - "Τα παράθυρα διαλόγου διαχειρίζονται την εστίαση του πληκτρολογίου."
      - "Τα χειριστήρια φέρουν ετικέτες, για αναγνώστες οθόνης."
      - "Οι διατάξεις αναστρέφονται για γλώσσες που γράφονται από δεξιά προς τα αριστερά."
limits:
  heading: "Τι δεν κάνει η εφαρμογή ιστού"
  items:
    - "Δεν υπάρχει χρήση χωρίς σύνδεση. Το Side Badger χρειάζεται σύνδεση, οπότε δεν θα ανοίξει την ομάδα σας σε ένα αεροπλάνο χωρίς wifi."
    - "Δεν υπάρχει εφαρμογή σε κατάστημα εφαρμογών ούτε εγγενής εφαρμογή για iPhone ή Android. Το Side Badger είναι εφαρμογή ιστού και η προσθήκη του στην αρχική οθόνη ή στο dock είναι ο τρόπος να αποκτήσετε την έκδοση που μοιάζει με εφαρμογή."
    - "Η προσθήκη στην αρχική οθόνη ή στο dock εξαρτάται από το πρόγραμμα περιήγησής σας. Τα ονόματα των μενού διαφέρουν ανάμεσα σε προγράμματα περιήγησης και εκδόσεις και ορισμένα δεν την προσφέρουν."
    - "Οι ειδοποιήσεις push ενεργοποιούνται μόνο αν τις επιλέξετε, ανά συσκευή, και χρειάζονται πρόγραμμα περιήγησης που τις υποστηρίζει και την άδειά σας. Σε iPhone ή iPad λειτουργούν μόνο από την εφαρμογή που έχει προστεθεί στην οθόνη Αφετηρίας. Η παράδοση δεν είναι εγγυημένη."
    - "Δεν υπάρχουν ειδοποιήσεις με email ή SMS ούτε υπενθυμίσεις πληρωμής. Η νέα δραστηριότητα εμφανίζεται στην εφαρμογή και ως ειδοποιήσεις push αν τις ενεργοποιήσετε. Το κυνήγι μιας πληρωμής μένει σε εσάς."
    - "Η δραστηριότητα διατηρείται για 90 ημέρες."
    - "Συνδέεστε με διεύθυνση email και κωδικό πρόσβασης. Δεν υπάρχει σύνδεση με Google ή Apple και πρέπει να είστε 18 ετών και άνω."
    - "Δεν ισχυριζόμαστε ότι το Side Badger είναι πλήρως προσβάσιμο ή ότι πληροί επίσημο πρότυπο προσβασιμότητας. Αν κάτι σας εμποδίσει, πείτε μας το μέσα από την εφαρμογή και θα δείτε εκεί την απάντησή μας."
useCasesHeading: "Εκεί που βοηθά το να μη χρειάζεστε εφαρμογή"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Υπάρχει εφαρμογή Side Badger σε κατάστημα εφαρμογών;"
      a: "Όχι. Το Side Badger είναι εφαρμογή ιστού. Το ανοίγετε στο πρόγραμμα περιήγησής σας και μπορείτε να το προσθέσετε στην αρχική οθόνη ή στο dock ώστε να ανοίγει σαν εφαρμογή. Δεν υπάρχει τίποτα να κατεβάσετε από κατάστημα εφαρμογών."
    - q: "Μπορώ να χωρίσω λογαριασμούς χωρίς να κατεβάσω εφαρμογή;"
      a: "Ναι. Ανοίξτε το Side Badger σε ένα πρόγραμμα περιήγησης στο κινητό ή τον υπολογιστή σας, συνδεθείτε και ξεκινήστε μια ομάδα. Η προσθήκη στην αρχική οθόνη ή στο dock είναι προαιρετική."
    - q: "Λειτουργεί χωρίς σύνδεση;"
      a: "Όχι. Το Side Badger χρειάζεται σύνδεση, ακόμη και όταν έχει προστεθεί στην αρχική οθόνη ή στο dock."
    - q: "Γιατί δεν λαμβάνω ειδοποιήσεις στο iPhone μου;"
      a: "Σε iPhone ή iPad, οι ειδοποιήσεις λειτουργούν μόνο από την εφαρμογή που έχει προστεθεί στην οθόνη Αφετηρίας, όχι από μια καρτέλα του προγράμματος περιήγησης. Προσθέστε την, ανοίξτε την από το εικονίδιο στην οθόνη Αφετηρίας και μετά ενεργοποιήστε τις ειδοποιήσεις στις **Ρυθμίσεις**. Η παράδοση δεν είναι εγγυημένη, οπότε αν χαθεί κάποια, το ιστορικό δραστηριότητας της ομάδας δείχνει ακόμη τι προστέθηκε."
    - q: "Πρέπει να ενεργοποιήσω τις ειδοποιήσεις;"
      a: "Όχι. Είναι απενεργοποιημένες μέχρι να τις ενεργοποιήσετε, μία συσκευή τη φορά. Χωρίς αυτές, η νέα δραστηριότητα εμφανίζεται πάντως στην εφαρμογή και ο καθένας βλέπει μια αλλαγή αμέσως όταν την έχει ανοιχτή."
    - q: "Χρειάζεται λογαριασμό ο καθένας στην ομάδα;"
      a: "Ναι. Χρειάζεστε μόνο μια διεύθυνση email και έναν κωδικό πρόσβασης και επιβεβαιώνετε το email πριν μπορέσετε να προσθέσετε οτιδήποτε. Όλοι όσοι μπαίνουν σε μια ομάδα κάνουν το ίδιο, από όποιο κινητό ή υπολογιστή θέλουν."
