faq:
  heading: "Otázky"
  items:
    - q: "Mohu zpochybnit jen svůj podíl?"
      a: "Ne. Dotaz pozastaví celý výdaj, pro všechny, kdo v něm jsou. Pokud je špatně jen rozdělení, řešením je jeho úprava."
    - q: "Kdo může dotaz uzavřít?"
      a: "Ten, kdo se ptal, nebo správce skupiny. Pokud ten, kdo výdaj přidal, není správce, nemůže dotaz uzavřít za tazatele."
    - q: "Smaže úprava výdaje originál?"
      a: "Ne. Dřívější verze se uchová. O tom, kdo může upravovat, rozhodují oprávnění skupiny, takže se vyplatí nejdřív to říct bytu, protože se změní zůstatky."
