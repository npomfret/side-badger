sections:
  - heading: Sgwrs am arian, wrth ymyl yr arian
    body: Daw sgwrsio, amheuon a chynlluniau gydag arian a rennir. Mae Side Badger yn cadw'r tri wrth ymyl y rhifau, fel nad oes rhaid i neb sgrolio'n ôl drwy sgwrs y grŵp.
    items:
      - "**Sylwadau lle maen nhw'n perthyn.** Gwnewch sylwadau ar y grŵp ei hun, neu ar unrhyw gost, rhestr neu bleidlais, a chadwch y sgwrs wrth ymyl y peth y mae'n sôn amdano."
      - "**Derbynebau a lluniau.** Cadwch hyd at dair derbynneb ar bob cost, ac ychwanegwch luniau neu PDFs at sylwadau ar y grŵp, rhestr neu bleidlais."
      - "**Cwestiynau, nid dadleuon.** Gall gweinyddwr droi cwestiynau ymlaen, ac yna gall unrhyw un mewn cost ofyn amdani. Mae'n aros allan o'r balansau nes iddo gael ei ddatrys."
      - "**Rhestrau a phleidleisiau.** Cadwch y rhestr siopa a rennir wrth ymyl y biliau siopa, a rhowch restr fer y fila i bleidlais, yn ddienw os mynnwch."
      - "**Ychydig o gymeradwyaeth.** Ymatebwch i gostau, taliadau a sylwadau, a dathlwch daliad pan fydd yn cyrraedd."
  - heading: Eich grŵp, eich rheolau
    body: Mae canolfan gymorth Splitwise yn dweud nad yw'n cefnogi gweinyddwyr grŵp na chaniatâd arbennig. Mae gan Side Badger rolau a chaniatâd, ar gyfer y grwpiau sydd angen rhywun i gadw'r rhifau'n daclus.
    items:
      - "**Gweinyddwyr, aelodau a gwylwyr.** Gwnewch rywun yn wyliwr: mae'n gweld popeth ac yn newid dim."
      - "**Dau osodiad parod, neu eich un chi.** Dechreuwch gyda Chydweithio agored neu Grŵp rheoledig, neu gosodwch bob caniatâd eich hun: pwy sy'n golygu ac yn dileu costau, yn golygu rhestrau, yn gwahodd ac yn gadael pobl newydd i mewn."
      - "**Cymeradwyaeth i ymuno.** Trowch gymeradwyaeth ymlaen a bydd gweinyddwr yn gadael pob person i mewn."
      - "**Gosodiadau'r grŵp ei hun.** Cyfyngwch ef i'r arian cyfred rydych chi'n ei ddefnyddio mewn gwirionedd, dewiswch ei arian cyfred diofyn a rhowch ddelwedd pennawd iddo."
      - "**Cloiwch ef pan fydd drosodd.** Mae'r rhifau'n aros yn eu lle nes bydd gweinyddwr yn ei ddatgloi."
  - heading: Am ddim yma, â thâl yno
    body: Splitwise Pro yw cynllun taledig Splitwise, ac mae ei dudalen Pro ei hun yn gwerthu tri pheth sy'n costio dim yn Side Badger.
    items:
      - "**Sganio derbynebau.** Mae Splitwise Pro yn sganio llun o'ch derbynneb. Mae Side Badger yn gwneud hynny am ddim, heb gredydau sganio: mae'n llenwi'r cyfanswm, y dyddiad a'r lle i chi eu gwirio."
      - "**Trosi arian cyfred.** Mae Splitwise Pro yn trosi costau grŵp i'ch arian cyfred diofyn pan fyddwch yn tapio “Convert”. Mae Side Badger yn trosi pob cost wrth i chi ei rhoi i mewn, ar gyfradd gyfnewid gyfredol neu'r un a gawsoch mewn gwirionedd, ac mae'r swm gwreiddiol yn aros ar y gost."
      - "**Dim terfynau dyddiol.** Mae Splitwise Pro yn gwerthu costau diderfyn, ac mae ei ganolfan gymorth yn dweud y gall defnyddwyr am ddim ychwanegu hyd at 4 cost bob dydd. Does gan Side Badger ddim terfynau dyddiol."
  - heading: Mae eich banc yn aros allan ohoni
    body: Dyw Side Badger ddim yn cysylltu â'ch banc nac yn gofyn am fanylion eich banc. Mae'n cadw'r cofnod o bwy sy'n gorfod talu i bwy; rydych chi'n talu eich gilydd sut bynnag y dymunwch, yna'n cofnodi'r taliad. Dim mewngofnod banc i'w drosglwyddo, felly un peth yn llai i'w gadw'n ddiogel.
  - heading: Un ap, yn eich porwr ac ar eich ffôn
    body: Mae Side Badger yn rhedeg yn eich porwr. Mewngofnodwch, ychwanegwch ef at eich sgrin gartref, ac mae'n agor fel ap. Yr un ap ydyw y naill ffordd neu'r llall, felly mae nodwedd newydd ar eich ffôn y tro nesaf y byddwch yn ei agor, heb ddiweddariad siop apiau i aros amdano.
  - heading: A rhai pethau bach hwyliog
    items:
      - "**Gofynnwch i'ch cynorthwyydd.** Mae Side Badger yn gweithio gyda ChatGPT a Claude: gofynnwch i'ch un chi ychwanegu cost, sganio derbynneb neu gofnodi taliad."
      - "**Pawb yn eu hiaith eu hunain.** Mae Side Badger yn siarad 39 iaith ac mae pob person yn dewis ei iaith ei hun. Mae hafan Splitwise yn dweud 7+. Mae'n trin 133 o arian cyfred hefyd, ar gyfer y daith sy'n mynd i bobman."
      - "**Cymorth heb adael yr ap.** Yn sownd, neu wedi dod o hyd i wall? Dywedwch wrthym o'r ap a darllenwch ein hateb reit yno."
  - heading: Lle mae Splitwise yn dal i ennill
    body: Byddai'n well gennym i chi ddewis yr ap iawn na darganfod yn nes ymlaen. Os oes angen un o'r rhain ar eich grŵp, mae gan Splitwise ef ac nid oes gan Side Badger.
    items:
      - "**Apiau o siop apiau.** Mae Side Badger yn byw yn eich porwr ac ar eich sgrin gartref, nid yn y siopau apiau."
      - "**Modd all-lein.** Mae angen cysylltiad ar Side Badger."
      - "**Taliadau yn yr ap.** Mewn rhai gwledydd gall Splitwise symud yr arian hefyd. Dim ond cadw'r cofnod mae Side Badger yn ei wneud."
      - "**Rhannu yn ôl cyfrannau neu fesul eitem.** Mae gan Side Badger un talwr fesul cost, wedi'i rannu'n gyfartal, yn ôl symiau union neu yn ôl canran. Dyw ei sganio derbynebau ddim yn neilltuo eitemau i bobl."
      - "**Siartiau a rhaniadau diofyn.** Mae gan Splitwise Pro y ddau. Mae Side Badger yn cadw'r cyfrif o bwy sy'n gorfod talu i bwy, a dyna'r gyfrinach gyfan."
  - heading: Symud eich grŵp drosodd
    body: Does dim mewnforiwr, felly mae symud yn golygu dechrau o'r newydd. Cliriwch y cyfrifon yn Splitwise yn gyntaf, yna crëwch grŵp yn Side Badger a gwahoddwch bawb gyda dolen neu god QR. Mae angen cyfrif am ddim ar bawb yn y grŵp, a chyfeiriad e-bost yw'r cyfan sydd ei angen i gofrestru.
