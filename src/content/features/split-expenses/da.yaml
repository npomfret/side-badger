meta:
  title: Del udgifter ligeligt, nøjagtigt eller i procent | Side Badger
  description: Del en fælles udgift ligeligt, efter nøjagtige beløb eller i procent, og udelad dem, der ikke var med. Gratis, uden reklamer og uden daglige grænser.
h1: Del udgifter ligeligt, nøjagtigt eller i procent
navLabel: Del udgifter
lead: Ikke alt er 50/50. Det klarer Side Badger. Sig, hvem der betalte, vælg de personer, der delte udgiften, og del den **ligeligt, efter nøjagtige beløb eller i procent**. Nag sælges separat.
cta:
  heading: Del den næste ordentligt
  body: Opret en gratis konto, start en gruppe, og tilføj den udgift, du længe har villet få styr på. Ved du ikke, hvad der sker bagefter? Se [sådan virker det](page:how-it-works), eller tjek [hvad gratis dækker](page:pricing).
  button: Opret en gratis konto
problem:
  heading: Ikke alt er 50/50
  body: Huslejen følger værelsets størrelse. En gave følger den, der lovede hvad. En middag følger den, der blev til dessert. At dele en regning på midten virker, indtil den første regning, hvor det ikke gør, og så åbner nogen et regneark. Side Badger registrerer, hvem der betalte, hvem der delte udgiften, og hvordan den fordeles, så saldiene bliver rigtige, uden at nogen laver lange divisioner ved bordet.
workflow:
  heading: At tilføje en udgift, fra start til slut
  steps:
    - title: Sig, hvem der betalte, og hvad for
      body: Indtast beløbet, en kort beskrivelse og den person, der betalte. Én person betaler for hver udgift, hvilket holder regnestykket ærligt.
      shot: S05
      shotAlt: Udgiftsformularen med en hytteleje delt i procent mellem tre personer
    - title: Vælg delingen
      body: Vælg ligeligt, nøjagtige beløb eller procenter. Procenter skal give 100 i alt, og nøjagtige beløb skal give totalen.
      shot: S06
      shotAlt: Udgiftsformularen med nøjagtige beløb indtastet for hver person på en gave
    - title: Tilføj historien
      body: Angiv datoen, og tilføj etiketter, et sted og en note. Alle i gruppen ser de samme detaljer og kan kommentere lige dér.
      shot: S08
      shotAlt: En udgift med sine detaljer, en kommentartråd og det oprindelige beløb, den blev indtastet som
    - title: Stil et spørgsmål, hvis noget ser forkert ud
      body: Hvis gruppen har slået udgiftsspørgsmål til, kan enhver, der er med i en udgift, sætte spørgsmålstegn ved den, og udgiftslisten kan kun vise dem med spørgsmål.
      shot: S18
      shotAlt: Udgiftslisten med et mærke for Betvivlet og filteret Kun betvivlet
options:
  heading: Tre måder at dele på
  items:
    - title: Ligeligt
      body: Standarden til middage, taxaer og alt, alle delte lige. Hvis totalen ikke går op, går det ulige øre til én person tilfældigt, ikke altid den samme. I taxaen nedenfor er det Ana.
    - title: Efter nøjagtige beløb
      body: Skriv, hvad hver person skylder. Godt til gaven, hvor alle valgte en forskellig pris, eller butikken, hvor én persons indkøbsvogn rummede mere end de fælles dagligvarer. Beløbene skal give totalen.
    - title: I procent
      body: Giv hver person en andel af totalen. Husleje efter værelsesstørrelse er klassikeren, hvor det største værelse betaler den største andel, og ingen lader som andet.
