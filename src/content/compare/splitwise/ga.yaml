sections:
  - heading: "Cad a dhéanann Splitwise go maith"
    body: "Má theastaíonn aip dhúchasach, úsáid as líne nó íocaíochtaí laistigh den aip ó do ghrúpa, is é Splitwise an rogha chiallmhar, agus b'fhearr linn gur roghnaigh tú é ná go bhfaighfeá amach níos déanaí. Liostaíonn a leathanaigh féin:"
    items:
      - "**Aipeanna agus úsáid as líne.** Aipeanna iPhone agus Android chomh maith leis an ngréasán, agus mód as líne."
      - "**Tuilleadh bealaí chun roinnt.** Sciair, coigeartuithe agus roinnt de réir míre, chomh maith le cothrom, cruinn agus céatadán."
      - "**Costais athfhillteacha.** Socraigh an cíos le hathrá agus déan dearmad air."
      - "**Íocaíochtaí san aip.** I roinnt tíortha, is féidir leis an t-airgead a bhogadh freisin, trí Splitwise Pay, Venmo, PayPal nó Pay by Bank."
  - heading: "Saor in aisce anseo, íoctha ansin"
    body: "Is é Splitwise Pro plean íoctha Splitwise, agus díolann a leathanach Pro féin ceithre rud nach gcosnaíonn tada i Side Badger."
    items:
      - "**Scanadh admhálacha.** Scanann Splitwise Pro grianghraf d'admháil. Déanann Side Badger é saor in aisce, gan creidmheasanna scanta: líonann sé isteach an t-iomlán, an dáta agus an áit duit le seiceáil. Léann seirbhís AI Google íomhánna admhálacha."
      - "**Tiontú airgeadra.** Tiontaíonn Splitwise Pro costais grúpa go dtí d'airgeadra réamhshocraithe nuair a thapálann tú Convert. Tiontaíonn Side Badger gach costas agus tú á chur isteach, ar ráta malairte reatha nó ar an ráta a fuair tú i ndáiríre, agus fanann an tsuim bhunaidh ar an gcostas."
      - "**Gan fógraí.** Liostaíonn Splitwise taithí go hiomlán saor ó fhógraí mar ghné Pro. Níl aon fhógraí i Side Badger."
      - "**Gan teorainneacha laethúla.** Díolann Splitwise Pro costais gan teorainn, agus deir a lárionad cabhrach gur féidir le húsáideoirí saor in aisce suas le 4 chostas a chur leis gach lá. Níl aon teorainneacha laethúla i Side Badger."
  - heading: "Cad atá ag Splitwise nach bhfuil ag Side Badger"
    body: "Ní hé seo gach gné de chuid Splitwise, ach na cinn a bhíonn de ghnáth i gceist leis an gcinneadh. Tá an liosta iomlán ar leathanaigh Splitwise féin. Seo na háiteanna ina bhfuil Side Badger ag titim gearr."
    items:
      - "**Aipeanna dúchasacha.** Oibríonn Side Badger i do bhrabhsálaí. Sínigh isteach, ansin cuir le do scáileán baile é agus osclaíonn sé cosúil le haip."
      - "**Mód as líne.** Teastaíonn nasc ó Side Badger."
      - "**Íocaíochtaí san aip.** Ní théann Side Badger i dteagmháil le d'airgead choíche. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht."
      - "**Costais athfhillteacha.** Níl aon cheann ag Side Badger. Cóipeáil cíos na míosa seo caite in ionad é a chlóscríobh arís."
      - "**Roinnt de réir sciar nó de réir míre.** Tá duine amháin ag íoc as gach costas i Side Badger, roinnte go cothrom, de réir suimeanna cruinne nó de réir céatadáin. Ní shanntaíonn a scanadh admhálacha míreanna do dhaoine."
      - "**Cairteacha agus roinnt réamhshocraithe.** Tá an dá cheann ag Splitwise Pro. Coinníonn Side Badger cuntas ar cé atá i bhfiacha le cé, agus sin an cleas ar fad."
  - heading: "Do ghrúpa a aistriú anall"
    body: "Níl aon uirlis allmhairithe ann, mar sin ciallaíonn aistriú tús nua. Socraigh suas i Splitwise ar dtús, ansin cruthaigh grúpa i Side Badger agus tabhair cuireadh do gach duine le nasc nó le cód QR. Teastaíonn cuntas saor in aisce ó gach duine sa ghrúpa, agus níl uait chun clárú ach seoladh ríomhphoist."
