faq:
  heading: Spørsmål
  items:
    - q: Hva er mest rettferdig, romstørrelse eller inntekt?
      a: Ingen av dem er alltid mest rettferdig. Romstørrelse passer for romkamerater som betaler for plassen de sover i. Inntekt passer for par og venner med svært ulik lønn. Bli enige om det før den første husleiedagen, ikke etter.
    - q: Bør regningene deles på samme måte?
      a: For romkamerater vanligvis ikke. Alle bruker strømmen og bredbåndet, så likt er enklere, som i eksempelet. Etter inntekt gir kalkulatoren regningene de samme andelene som husleien.
    - q: Kan jeg bruke kvadratfot?
      a: Ja. Velg ft² og skriv inn arealene i kvadratfot. Enheten er bare en etikett, og andelene blir de samme så lenge alle bruker den samme.
    - q: Er kalkulatoren gratis?
      a: Ja. Gratis. Ingen annonser. Ingen daglige grenser. Du trenger heller ingen konto.
