featuresHeading: "Funkcje, z których korzysta dom"
faq:
  heading: "Pytania"
  items:
    - q: "Czy czynsz może powtarzać się automatycznie?"
      a: "Nie, nie ma rachunków cyklicznych. Skopiuj zeszłomiesięczny czynsz w kilka dotknięć, zmień datę i gotowe."
    - q: "Czy możemy dzielić według wielkości pokoju?"
      a: "Tak, procentowo. Daj każdemu współlokatorowi udział odpowiadający jego pokojowi, byle udziały dawały w sumie 100. O innych sposobach dzielenia przeczytasz w [dzieleniu wydatków](page:feature/split-expenses)."
    - q: "Co, jeśli współlokator wyprowadza się, będąc komuś winien pieniądze?"
      a: "Nie może opuścić grupy, dopóki się nie rozliczy, bo nikt nie może jej opuścić, dopóki jest komuś winien pieniądze albo ktoś jest winien jemu. Liczby pozostają uczciwe, dopóki wszyscy nie są kwita."
    - q: "Czy Side Badger płaci rachunki?"
      a: "Nie. Prowadzi rachunek i podpowiada krótką listę płatności. Płacicie sobie, jak chcecie, a potem rejestrujecie to, jak wyjaśnia [rozliczanie](page:feature/settle-up)."
    - q: "Czy jeden współlokator może prowadzić księgi?"
      a: "Tak. Ustaw go jako administratora i użyj grupy zarządzanej, w której nowi członkowie wymagają zatwierdzenia, a wydatki mogą zmieniać tylko twórcy i administratorzy."
