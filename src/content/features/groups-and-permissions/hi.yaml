meta:
  title: "साझा खर्च के लिए ग्रुप एडमिन और अनुमतियां | Side Badger"
  description: "लिंक या QR कोड से लोगों को बुलाएं, तय करें कौन जुड़े, दर्शक बनाएं, अनुमतियां सेट करें और काम पूरा होने पर ग्रुप लॉक करें। आपका ग्रुप, आपके नियम, एक हद तक।"
h1: "ग्रुप एडमिन और अनुमतियां: आपके नियम, एक हद तक"
navLabel: "ग्रुप और अनुमतियां"
lead: "कुछ ग्रुप को एक खजांची चाहिए होता है। Side Badger में उसके लिए सेटिंग है। लिंक या QR कोड से लोगों को बुलाएं, तय करें कौन अंदर आए, और चुनें कि संख्याएं कौन बदल सकता है। दोस्तों का छोटा ग्रुप इस सबको अनदेखा कर सकता है, क्योंकि नए ग्रुप पूरी तरह खुले शुरू होते हैं।"
cta:
  heading: "एक सलीकेदार ग्रुप चलाने के लिए तैयार?"
  body: "अकाउंट बनाएं, ग्रुप शुरू करें और इनवाइट लिंक भेजें। उसे खुला रहने दें, या ग्रुप के बड़े या ज़्यादा नखरेबाज़ होने पर नियम कस दें।"
problem:
  heading: "किसी को तो संख्याएं सलीके से रखनी होती हैं"
  body: "चार रूममेट्स भरोसे पर चल सकते हैं। शादी के वीकेंड पर तीस मेहमान शायद नहीं चल सकते। हर घर, ट्रिप या इवेंट के लिए एक ग्रुप बनाएं, जिसमें 50 लोगों तक हो सकते हैं, और हर ग्रुप के अपने सदस्य, अपनी भूमिकाएं और अपने नियम होते हैं। आपका डैशबोर्ड उन सबको एक स्क्रीन पर दिखाता है, हर एक में आपकी स्थिति के साथ। ज़्यादातर ग्रुप सेटिंग्स को कभी छूते ही नहीं। जो छूते हैं, उनमें आमतौर पर कोई इतना व्यवस्थित होता है कि उसे इनकी ज़रूरत महसूस हो।"
workflow:
  heading: "खाली ग्रुप से लॉक ग्रुप तक"
  steps:
    - title: "लिंक या QR कोड से बुलाएं"
      body: "**दूसरों को आमंत्रित करें** खोलें, चुनें कि लिंक कितनी देर चले (15 मिनट, 1 घंटा, 1 दिन या 5 दिन), फिर लिंक कॉपी करें या लोगों के स्कैन करने के लिए QR कोड दिखाएं। जिन लोगों के साथ आप पहले से कोई दूसरा ग्रुप साझा करते हैं, उन्हें ऐप के भीतर से भी बुला सकते हैं।"
      shot: S03
      shotAlt: "आमंत्रण का डायलॉग, जिसमें ग्रुप का लिंक, उसका QR कोड और लिंक कितनी देर चले यह चुनने का विकल्प है"
    - title: "जुड़ने से पहले उन्हें देख लेने दें"
      body: "लिंक वाला कोई भी व्यक्ति साइन इन करता है या अकाउंट बनाता है, ग्रुप का प्रीव्यू देखता है और वह नाम चुनता है जो वह उसमें इस्तेमाल करना चाहता है। फिर वह **समूह में शामिल हों** दबाता है।"
      shot: S04
      shotAlt: "किसी ग्रुप का जॉइन प्रीव्यू, जो साइन इन किए हुए व्यक्ति को जुड़ने से पहले दिखता है"
    - title: "तय करें कौन जुड़ेगा"
      body: "अप्रूवल चालू करें, तो लिंक इस्तेमाल करने वाले लोग लंबित सदस्य के रूप में तब तक इंतज़ार करते हैं जब तक कोई एडमिन उन्हें अंदर न आने दे। एडमिन उन्हें **सुरक्षा और अनुमतियाँ** में **लंबित सदस्य** के नीचे पाते हैं, और **स्वीकार करें** या **अस्वीकार करें** चुनते हैं। तब तक लंबित व्यक्ति ग्रुप में कुछ नहीं देख सकता।"
      shot: S14
      shotAlt: "लंबित सदस्य, जो एडमिन के स्वीकार या अस्वीकार करने का इंतज़ार कर रहे हैं"
    - title: "चुनें कि कौन क्या बदल सकता है"
      body: "**खुला सहयोग** या **प्रबंधित समूह** चुनें, या अनुमतियां एक-एक करके सेट करें। फिर हर व्यक्ति को एक भूमिका दें: एडमिन, सदस्य या दर्शक। अनुमतियां और भूमिकाएं सिर्फ एडमिन बदल सकते हैं।"
      shot: S13
      shotAlt: "ग्रुप सेटिंग्स का सुरक्षा टैब, जिसमें दो प्रीसेट और कस्टम अनुमतियां हैं"
    - title: "काम पूरा हो जाए तो लॉक कर दें"
      body: "जब ट्रिप खत्म हो जाए और संख्याएं बैठ चुकी हों, तो कोई एडमिन **समूह लॉक करें** चालू कर सकता है। कोई खर्च जोड़ या बदल नहीं सकता, पेमेंट रिकॉर्ड नहीं कर सकता, और सूचियां या पोल एडिट नहीं कर सकता, और एक बैनर यह बताता है। अब कोई चुपके से देर रात की टैक्सी नहीं जोड़ सकता। अगर सच में कोई निकल आए, तो एडमिन ग्रुप अनलॉक कर सकता है।"
      shot: S15
      shotAlt: "एक ग्रुप, जिसमें वह बैनर दिख रहा है जो बताता है कि ग्रुप लॉक है"
options:
  heading: "एडमिन, सदस्य और दर्शक"
  items:
    - title: "एडमिन"
      body: "ग्रुप चलाता है। एडमिन नए सदस्यों को मंज़ूरी देते हैं, भूमिकाएं और अनुमतियां बदलते हैं, ग्रुप को लॉक और अनलॉक करते हैं, और उसे बंद करते हैं। जो ग्रुप बनाता है वह शुरू में उसका एडमिन होता है, और ग्रुप कभी बिना एडमिन के नहीं रहता, क्योंकि आखिरी एडमिन को पद से हटाया नहीं जा सकता।"
    - title: "सदस्य"
      body: "हिस्सा लेता है। सदस्य क्या कर सकता है यह ग्रुप की अनुमतियों पर निर्भर करता है। खुला सहयोग वाले ग्रुप में लगभग सब कुछ। प्रबंधित समूह में सदस्य सिर्फ वे खर्च और सूचियां बदल सकते हैं जो उन्होंने खुद बनाई हों।"
    - title: "दर्शक"
      body: "सब कुछ देखता है और कुछ नहीं बदलता। दर्शक न खर्च या सूचियां जोड़ या एडिट कर सकता है, न लोगों को बुला सकता है, न सेटिंग्स बदल सकता है और न हेडर इमेज को हाथ लगा सकता है। उस व्यक्ति के लिए काम का, जो संख्याएं देखना चाहता है और वादा करता है कि उनसे छेड़छाड़ नहीं करेगा।"
sections:
  - heading: "खुला, प्रबंधित या अपने नियम"
    body: "नए ग्रुप **खुला सहयोग** पर शुरू होते हैं, जहां हर कोई लोगों को बुला सकता है, खर्च बदल सकता है और सूचियां एडिट कर सकता है, और नए सदस्य अपने आप जुड़ जाते हैं। **प्रबंधित समूह** तब के लिए है जब किसी को समझदार बड़ा बनना पड़े। आप सातों अनुमतियां एक-एक करके भी सेट कर सकते हैं, और किसी एक को हाथ से बदलने पर ग्रुप कस्टम पर चला जाता है। जो भी चुनें, अनुमतियां खुद सिर्फ एडमिन बदल सकते हैं, और हर बदलाव गतिविधि फ़ीड में दिखता है। [रूममेट्स](page:use-case/housemates) का एक फ्लैट सब कुछ खुला छोड़ सकता है। किसी बड़े [इवेंट या जश्न](page:use-case/events-and-celebrations) को अक्सर प्रबंधित समूह चाहिए, ताकि कोई तय करे कि कौन जुड़ेगा। इस सबमें नए हैं? [यह कैसे काम करता है](page:how-it-works) पूरा सफर समझाता है, पहले खर्च से लेकर हिसाब चुकता होने तक।"
    items:
      - "**खर्च कौन संपादित कर सकता है।** खुला सहयोग: कोई भी सदस्य। प्रबंधित समूह: निर्माता और एडमिन।"
      - "**खर्च कौन हटा सकता है।** खुला सहयोग: कोई भी सदस्य। प्रबंधित समूह: निर्माता और एडमिन।"
      - "**सूचियाँ कौन संपादित कर सकता है।** खुला सहयोग: कोई भी सदस्य। प्रबंधित समूह: निर्माता और एडमिन।"
      - "**सदस्यों को कौन आमंत्रित कर सकता है।** खुला सहयोग: कोई भी सदस्य। प्रबंधित समूह: केवल एडमिन।"
      - "**नए सदस्य की स्वीकृति।** खुला सहयोग: स्वचालित। प्रबंधित समूह: एडमिन स्वीकृति आवश्यक।"
      - "**सेटिंग्स कौन बदल सकता है।** खुला सहयोग: कोई भी सदस्य। प्रबंधित समूह: केवल एडमिन।"
      - "**हेडर इमेज कौन बदल सकता है।** खुला सहयोग: कोई भी सदस्य। प्रबंधित समूह: केवल एडमिन।"
  - heading: "आपका नाम, आपकी फोटो, आपकी हेडर इमेज"
    body: "हर ग्रुप की अपनी कास्ट होती है। हर ग्रुप में वह नाम चुनें जो लोग देखें (2 से 50 अक्षर, और ग्रुप में अनोखा) और अपनी प्रोफ़ाइल की कौन-सी फोटो आप वहां लगाएंगे। घर में **Sam** बनें और ट्रिप पर **Sam (जिसके पास गाड़ी है)**। सेटिंग्स बदलने की अनुमति वाला कोई भी व्यक्ति ग्रुप का नाम बदल सकता है और उसका विवरण एडिट कर सकता है। हेडर इमेज, जो 10 MB तक की JPEG, PNG, GIF या WebP हो सकती है, की अपनी अलग अनुमति होती है।"
  - heading: "संग्रहीत करें, लॉक करें या बंद करें"
    body: "ग्रुप को किनारे रखने के तीन तरीके, कम गंभीर से ज़्यादा गंभीर के क्रम में।"
    items:
      - "**संग्रहीत करें** ग्रुप को सिर्फ आपके अपने डैशबोर्ड से छिपाता है, किसी और के नहीं। आप उसे अब भी पहले की तरह खोलकर इस्तेमाल कर सकते हैं, और **समूह पुनर्स्थापित करें** उसे वापस ले आता है।"
      - "**लॉक** बदलाव तब तक रोक देता है जब तक कोई एडमिन उसे अनलॉक न करे। ग्रुप और उसकी हिस्ट्री सब अब भी पढ़ सकते हैं।"
      - "**बंद करना** स्थायी है, और सबके लिए। यह सिर्फ कोई एडमिन कर सकता है, पुष्टि के लिए ग्रुप का नाम टाइप करके, और उसके बाद ग्रुप को कोई दोबारा नहीं खोल सकता।"
  - heading: "ग्रुप छोड़ना"
    body: "हिसाब चुकता होने के बाद कोई भी ग्रुप छोड़ सकता है। आप तब नहीं छोड़ सकते जब आपको किसी एक भी करेंसी में पैसे देने या पाने बाकी हों, जब किसी खर्च पर कोई खुला सवाल आपसे जुड़ा हो, या जब आप आखिरी एडमिन हों या इकलौते सदस्य। [पेमेंट रिकॉर्ड करें](page:feature/settle-up), [खर्च के सवाल](page:guide/what-to-do-when-someone-disputes-a-shared-expense) को सुलझाएं, या किसी और को एडमिन बनाएं, फिर जाएं। वापस आने के लिए आपको नया इनवाइट चाहिए होगा।"
limits:
  heading: "एक हद के भीतर: बारीक अक्षरों की बातें"
  items:
    - "एक ग्रुप में 50 लोगों तक हो सकते हैं।"
    - "अनुमतियां और भूमिकाएं सिर्फ एडमिन बदल सकते हैं। आखिरी एडमिन को पद से हटाया नहीं जा सकता।"
    - "खर्च एडिट करने की अनुमति को **केवल एडमिन** पर सेट करने का मतलब यह भी है कि खर्च सिर्फ एडमिन जोड़ सकते हैं।"
    - "लॉक खर्चों में बदलाव, नए पेमेंट, सूचियों और पोल को रोक देता है। ग्रुप और उसकी हिस्ट्री सब अब भी पढ़ सकते हैं, और पेमेंट पर रिएक्ट भी कर सकते हैं।"
    - "बंद करना स्थायी है। बंद किए गए ग्रुप को दोबारा खोलने का ऐप में कोई तरीका नहीं है।"
    - "नया इनवाइट लिंक बनाने से पुराने रद्द नहीं होते। हर लिंक अपनी एक्सपायरी तक चलता है, इसलिए अगर आपको चिंता है कि वह कहां पहुंच सकता है तो छोटी एक्सपायरी चुनें।"
    - "ऐप के भीतर के इनवाइट में आपके 10 सबसे हाल के सक्रिय ग्रुप के लोग दिखते हैं। बाकी किसी को लिंक चाहिए, और कौन बुला सकता है यह ग्रुप की अनुमतियों पर निर्भर करता है।"
    - "जुड़ने के लिए अकाउंट चाहिए, और कुछ भी जोड़ने से पहले लोगों को अपना ईमेल वेरिफाई करना होता है।"
useCasesHeading: "जहां थोड़ी व्यवस्था काम आती है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या दर्शक खर्च जोड़ सकता है?"
      a: "नहीं। दर्शक सब कुछ देखता है और कुछ नहीं बदलता। वह न खर्च या सूचियां जोड़ या एडिट कर सकता है, न लोगों को बुला सकता है, न सेटिंग्स बदल सकता है।"
    - q: "क्या कोई पैसे देने बाकी रहते हुए ग्रुप छोड़ सकता है?"
      a: "नहीं। जब तक किसी के पास एक भी करेंसी में देना या पाना बाकी हो, वह ग्रुप नहीं छोड़ सकता। पहले हिसाब चुकता करें, फिर जाएं।"
    - q: "ग्रुप बंद होने पर क्या होता है?"
      a: "उसे कोई दोबारा नहीं खोल सकता। ग्रुप सिर्फ कोई एडमिन बंद कर सकता है, पुष्टि के लिए उसे ग्रुप का नाम टाइप करना पड़ता है, और ग्रुप सबके लिए अनुपलब्ध हो जाता है। अगर आप बस बदलाव रोकना चाहते हैं, तो उसे लॉक करें। अगर सिर्फ अपने डैशबोर्ड से हटाना चाहते हैं, तो उसे संग्रहीत करें।"
    - q: "क्या मैं लॉक वापस ले सकता हूँ?"
      a: "हाँ। एडमिन ग्रुप अनलॉक कर सकता है, और बदलाव फिर से काम करने लगते हैं।"
    - q: "क्या लोगों के जुड़ने से पहले मुझे उन्हें मंज़ूरी देनी होगी?"
      a: "सिर्फ तब, जब आप चाहें। नए ग्रुप खुला सहयोग पर शुरू होते हैं, जहां लिंक इस्तेमाल करने वाले अपने आप जुड़ जाते हैं। एडमिन अप्रूवल चालू करें, या प्रबंधित समूह चुनें, और हर व्यक्ति तब तक इंतज़ार करता है जब तक कोई एडमिन उसे अंदर न आने दे।"
    - q: "एक ग्रुप में कितने लोग हो सकते हैं?"
      a: "50 तक।"
