meta:
  title: "Side Badger ve Splitwise: ücretsiz kısımlar | Side Badger"
  description: "Splitwise'a ücretsiz bir alternatif, adilce karşılaştırıldı. Makbuz tarama, para birimi çevirme ve reklamsızlık burada ücretsiz; Splitwise'ın daha iyi yaptıklarını da yazdık."
h1: "Side Badger ve Splitwise: ücretsiz kısımlar karşılaştırıldı"
navLabel: "Side Badger ve Splitwise"
lead: "Grubunuzdan biri muhtemelen “Splitwise kullanın işte” demiştir. Haklı. Side Badger; makbuz tarama, para birimi çevirme ve reklamsızlık sunan, bunların kilidini açmak için abonelik istemeyen ücretsiz bir web uygulamasıdır. Hangisinin grubunuza uyacağı neye ihtiyaç duyduğunuza bağlı; işte karşılaştırma, Splitwise tarafı yalnızca Splitwise'ın kendi sayfalarından alınarak."
cta:
  heading: "Bir sonraki ortak faturanızda deneyin"
  body: "Ücretsiz bir hesap oluşturun, bir grup kurun ve gerçek bir harcama ekleyin. Size uymazsa abonelik değil, birkaç dakika harcamış olursunuz."
asOf: 2026-10-21
asOfNote: "Siz uğraşmayın diye Splitwise'ın kendi sayfalarını {date} tarihinde okuduk ve burada Splitwise hakkında yazılan her şey onlardan gelir. Tablonun her satırı kaynağına bağlanır. Planlar değişir, bu yüzden her çeyrekte yeniden kontrol ederiz; Splitwise'ın sayfaları bu sayfayla çelişirse onlara inanın."
