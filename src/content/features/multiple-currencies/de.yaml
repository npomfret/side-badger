meta:
  title: Kosten in 140 Währungen teilen, umgerechnet oder getrennt
  description: Gib jede Ausgabe in der Währung ein, in der du bezahlt hast, führe die Salden getrennt oder rechne zu einem Kurs um, den du sehen und ändern kannst, und rechne dann mit einer kurzen Liste von Zahlungen ab.
h1: Kosten in 140 Währungen teilen
navLabel: Mehrere Währungen
lead: Euro, Yen und dieses eine Taxi in Baht. Side Badger nimmt jede Ausgabe in der Währung, in der du bezahlt hast, hält die Salden sauber und kann umrechnen, wenn deine Gruppe lieber einmal abrechnet. Es funktioniert in 140 Währungen und passt bestens zu [Gruppenreisen](page:use-case/group-trips).
cta:
  heading: Bring deine Euro, bring deine Yen
  body: Erstelle ein Konto, starte eine Gruppe und füge die erste Ausgabe in der Währung hinzu, die du gerade in der Hand hattest.
  button: Kostenloses Konto erstellen
problem:
  heading: Gib es ein, wie du bezahlt hast
  body: Eine Reise wird selten in nur einer Währung bezahlt. Das Hotel wurde zu Hause in Pfund gebucht, das Abendessen in Yen bezahlt, und der Kaffee am Flughafen in dem, was beim Zwischenstopp galt. Alles von Hand umzurechnen, bevor man es überhaupt eintippen kann, ist der Grund, warum Tabellen aufgegeben werden. In Side Badger gibst du jede Ausgabe in der Währung auf dem Beleg ein, und jeder Betrag folgt den Regeln seiner Währung, Yen haben also keine Dezimalstellen und Dinar drei. Deine zuletzt genutzten Währungen stehen zuerst in der Liste.
workflow:
  heading: Währungen getrennt halten oder unterwegs umrechnen
  steps:
    - title: Füge die Ausgabe in ihrer eigenen Währung hinzu
      body: Wähle die Währung, gib den Betrag ein und sag, wer bezahlt hat und wer sich die Kosten teilt. Mehr braucht es nicht. Das ist die Voreinstellung, und sie behält den Originalbetrag genau so, wie du ihn eingegeben hast.
      shot: S07
      shotAlt: Das Ausgabenformular mit eingegebenem Yen-Betrag
    - title: Behalte für jede Währung einen Saldo im Blick
      body: Salden werden pro Währung getrennt geführt, und jeder bekommt seine eigene kurze Liste vorgeschlagener Zahlungen. Pfund werden in Pfund beglichen und Yen in Yen.
      shot: S10
      shotAlt: Der Salden-Bildschirm mit vereinfachten Schulden in zwei Währungen
    - title: Oder rechne um, wenn die Gruppe lieber einmal abrechnet
      body: Wähle bei der Eingabe der Ausgabe eine andere Währung, und Side Badger kann sie zu einem aktuellen Wechselkurs umrechnen, den du auf den Kurs ändern kannst, den du tatsächlich bekommen hast. Der umgerechnete Betrag geht in den Saldo dieser Währung ein. Umrechnen ist eine Entscheidung der Gruppe, nie etwas, das hinter deinem Rücken passiert.
options:
  heading: Ein Kurs, den du sehen und ändern kannst
  items:
    - title: Der Kurs wird angezeigt
      body: Beim Umrechnen erscheinen der Kurs und der umgerechnete Betrag im Formular, niemand muss also eine Zahl auf Treu und Glauben nehmen.
    - title: Gib deinen eigenen ein
      body: Einen besseren Kurs an der Wechselstube bekommen oder einen schlechteren am Flughafen? Ändere den Kurs auf den, den du tatsächlich bekommen hast, und der umgerechnete Betrag aktualisiert sich.
    - title: Das Original bleibt
      body: Der Originalbetrag bleibt neben dem umgerechneten an der Ausgabe, für alle, die fragen, wie viel es in Yen war.
    - title: Umrechnen kostet nichts
      body: Das Umrechnen kostet nichts. Für die Eingabe einer Ausgabe in einer anderen Währung fällt keine Gebühr an.
