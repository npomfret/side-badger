faq:
  heading: "پرسش‌ها"
  items:
    - q: "Side Badger از کدام نرخ تبدیل استفاده می‌کند؟"
      a: "نرخ تبدیل روز، که هنگام وارد کردن هزینه در صورت وجود گرفته می‌شود. می‌توانید آن را به نرخی که واقعاً گرفته‌اید تغییر دهید."
    - q: "گروه می‌تواند فقط روی پوند و ین بماند؟"
      a: "بله. در **تنظیمات** گروه، زیر **تنظیمات ارز**، **محدود کردن ارزها برای این گروه** را روشن کنید، **ارزهای مجاز** را انتخاب کنید و **ارز پیش‌فرض برای هزینه‌های جدید** را تعیین کنید. گزینه‌های کمتر در فهرست، حدس اشتباه کمتر پشت صندوق."
    - q: "اصلاً باید تبدیل کنیم؟"
      a: "نه. ارزها جدا می‌مانند مگر اینکه شما یا گروه‌تان تبدیل را انتخاب کنید و هر ارز فهرست کوتاه پرداخت‌های خودش را دارد."
