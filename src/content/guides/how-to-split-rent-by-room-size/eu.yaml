faq:
  heading: "Galderak"
  items:
    - q: "Zer gertatzen da norbaitek gela handiagoa baina argi gutxiago badu?"
      a: "Azalera abiapuntua baino ez da, beraz taldeak doitzea adostu dezake. Kendu puntu bat edo bi gela ilunari, eman besteei eta egiaztatu ehunekoek 100 batzen jarraitzen dutela. Side Badger-ek adosten duzuena gordetzen du, eta ez du epaitzen."
    - q: "Fakturak ere gelen tamainaren arabera banatu behar dira?"
      a: "Normalean ez. Energia eta Interneteko konexioa denek erabiltzen dituzte, beraz banaketa berdina errazagoa da, goiko adibidean bezala. Etxekide bat egun osoa etxean pasatzen badu, taldeak beste zerbait adostu dezake, adibidez zenbateko zehatzak. [Gastuak banatzea](page:feature/split-expenses) orriak aukerak azaltzen ditu."
    - q: "Banaketa geroago alda dezakegu?"
      a: "Bai, gastu berrientzat. Aldatu ehunekoak alokairua kopiatzen duzunean eta aurreko hilabeteak lehen bezala geratzen dira. Iragan bateko gastu bat zuzentzeko, editatu taldearen baimenek uzten badute, eta esan lehenik etxekoei, saldoak aldatzen direlako. Aurreko bertsioa gorde egiten da."
