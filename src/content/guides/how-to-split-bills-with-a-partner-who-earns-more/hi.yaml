faq:
  heading: "सवाल"
  items:
    - q: "हमें ग्रॉस पे लेनी चाहिए या टेक-होम पे?"
      a: "यह ग्रुप तय करता है। टेक-होम आम है, क्योंकि वही पैसा है जो आपके पास खर्च करने के लिए असल में होता है। ग्रॉस पे इस बात को अनदेखा करती है कि टैक्स, पेंशन योगदान और लोन की किस्तें अलग-अलग तनख्वाहों से अलग-अलग रकम निकालती हैं। जो भी चुनें, दोनों के लिए एक ही पैमाना इस्तेमाल करें।"
    - q: "क्या Side Badger हमारी आमदनी देखता है?"
      a: "नहीं। आप सिर्फ़ प्रतिशत डालते हैं, तनख्वाह कभी नहीं। प्रतिशत ग्रुप के सदस्यों को दिखते हैं, और एक कपल के लिए वे सदस्य आप दोनों हैं।"
    - q: "क्या हम 62/38 एक बार सबके लिए सेट कर सकते हैं?"
      a: "बंटवारा हर खर्च पर तय होता है, ग्रुप पर नहीं। ऐसा खर्च कॉपी करें जिसमें 62 और 38 पहले से हैं, फिर जो अलग है उसे बदलें। बाकी विकल्प [खर्च बांटना](page:feature/split-expenses) में हैं।"
