meta:
  title: "Sadaliet izmaksas 140 valūtās, konvertētas vai atsevišķi"
  description: "Ievadiet katru izdevumu valūtā, kurā maksājāt, turiet atlikumus atsevišķi vai konvertējiet pēc kursa, ko redzat un varat mainīt, tad norēķinieties ar īsu maksājumu sarakstu."
h1: "Sadaliet izmaksas 140 valūtās"
navLabel: "Vairākas valūtas"
lead: "Eiro, jenas un tas viens taksometrs bahtos. Side Badger pieņem katru izdevumu valūtā, kurā maksājāt, uztur atlikumus kārtībā un var konvertēt, kad jūsu grupa labāk vēlas norēķināties vienreiz. Tas darbojas 140 valūtās un ir dabiska izvēle [grupas ceļojumiem](page:use-case/group-trips)."
cta:
  heading: "Nesiet savus eiro, nesiet savas jenas"
  body: "Izveidojiet kontu, sāciet grupu un pievienojiet pirmo izdevumu jebkurā valūtā, kāda jums gadījās rokās."
  button: "Izveidot bezmaksas kontu"
problem:
  heading: "Ievadiet to tā, kā samaksājāt"
  body: "Par ceļojumu reti maksā vienā valūtā. Viesnīca tika rezervēta mājās mārciņās, vakariņas apmaksātas jenās, un lidostas kafija bija tajā valūtā, kāda bija pārsēšanās vietā. Visu konvertēt ar rokām, pirms to vispār var ievadīt, ir tas, kā izklājlapas tiek pamestas. Lietotnē Side Badger katru izdevumu ievadiet valūtā, kas norādīta čekā, un katra summa seko savas valūtas noteikumiem, tāpēc jenām nav decimāldaļu, bet dīnāriem ir trīs. Nesen izmantotās valūtas sarakstā ir pirmās."
workflow:
  heading: "Turiet valūtas atsevišķi vai konvertējiet līdzi"
  steps:
    - title: "Pievienojiet izdevumu tā valūtā, kurā maksājāt"
      body: "Izvēlieties valūtu, ierakstiet summu, norādiet, kas maksāja un kas dalījās. Nekas cits nav vajadzīgs. Tas ir noklusējums, un tas saglabā sākotnējo summu tieši tādu, kādu ievadījāt."
      shot: S07
      shotAlt: "Izdevuma veidlapa ar ievadītu summu jenās"
    - title: "Sekojiet atlikumam katrā valūtā"
      body: "Atlikumi tiek uzturēti atsevišķi katrā valūtā, un katram ir savs īss ieteikto maksājumu saraksts. Mārciņas tiek nokārtotas mārciņās, jenas jenās."
      shot: S10
      shotAlt: "Atlikumu ekrāns ar vienkāršotiem parādiem divās valūtās"
    - title: "Vai konvertējiet, kad grupa labāk vēlas norēķināties vienreiz"
      body: "Izvēlieties citu valūtu, ievadot izdevumu, un Side Badger var to konvertēt pēc pašreizējā valūtas kursa, ko varat nomainīt uz kursu, ko patiešām saņēmāt. Konvertētā summa pievienojas atlikumam šajā valūtā. Konvertēšana ir izvēle, ko pieņem grupa, nevis kas notiek aiz jūsu muguras."
options:
  heading: "Kurss, ko redzat un varat mainīt"
  items:
    - title: "Kurss ir redzams"
      body: "Kad konvertējat, kurss un konvertētā summa parādās veidlapā, tāpēc nevienam nav jātic skaitlim uz vārda."
    - title: "Ierakstiet savu"
      body: "Dabūjāt labāku kursu kasē vai sliktāku lidostā? Nomainiet kursu uz to, ko patiešām saņēmāt, un konvertētā summa atjaunojas."
    - title: "Oriģināls paliek"
      body: "Sākotnējā summa paliek pie izdevuma blakus konvertētajai, tiem, kas jautā, cik tas bija jenās."
    - title: "Konvertēt var bez maksas"
      body: "Konvertēšana nemaksā neko. Par izdevuma ievadīšanu citā valūtā nav nodevas."
