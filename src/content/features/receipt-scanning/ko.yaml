meta:
  title: "영수증을 스캔해 지출 추가하기 | 사이드 배저"
  description: "오소리에게 영수증을 읽히세요. 합계, 날짜, 장소를 채워 주니 확인만 하면 되고, 스캔 크레딧은 없습니다. 이미지는 Google의 AI 서비스가 읽습니다."
h1: "영수증을 스캔하고, 내용을 확인하고, 나누세요"
navLabel: "영수증 스캔"
lead: "영수증은 오소리가 읽게 하고, 숙제 검사는 직접 하세요. 새 지출에 사진을 추가하면 사이드 배저가 합계, 날짜, 장소를 채워 주니 확인만 하면 됩니다. 그다음에는 다른 지출과 똑같이 [나누면](page:feature/split-expenses) 돼요. 스캔은 무료이고 스캔 크레딧도 없습니다. 지출 하나를 채워 줄 뿐 계산서를 항목별로 나누지는 않습니다. 영수증 이미지는 Google의 AI 서비스가 읽습니다."
cta:
  heading: "찍고, 확인하고, 나누세요"
  body: "무료 계정을 만들고, 그룹을 시작하고, 영수증 사진으로 지출을 추가하세요. 무엇이 채워지는지 보고, 틀린 건 고친 다음, 마음에 들면 저장하세요."
problem:
  heading: "택시 줄에서 영수증을 직접 입력하고 싶은 사람은 없습니다"
  body: "여행과 큰 술자리에는 종이가 따라옵니다. 저녁 식사, 택시, 한 잔만 하자던 것이 여섯 라운드가 된 술자리. 차가운 손가락으로, 뒤에 줄 선 사람들을 의식하며 하나하나 휴대폰에 입력하다 보면 지출이 잊히기 마련이에요. 그래서 사이드 배저가 영수증을 대신 읽어 줍니다. 초안은 사이드 배저가 쓰고, 확인은 여러분이 합니다. 영수증이 아무도 처리하고 싶지 않은 속도로 쌓이는 [그룹 여행](page:use-case/group-trips)과 [행사와 기념 모임](page:use-case/events-and-celebrations)에 잘 맞습니다."
workflow:
  heading: "사진에서 지출까지 세 단계"
  steps:
    - title: "새 지출에 영수증 추가하기"
      body: "새 지출을 시작하고 **영수증 스캔**을 탭하거나, 대시보드의 **영수증 스캔** 빠른 실행을 쓰세요. 사진을 찍거나 이미 있는 사진을 고르면 됩니다. 양식의 **영수증 또는 첨부 추가**도 같은 일을 합니다."
    - title: "영수증을 읽게 하기"
      body: "사이드 배저의 AI가 이미지를 읽는 동안 양식에 **영수증 분석 중...**이라고 표시됩니다. 그런 다음 찾아낸 내용, 예를 들어 설명, 합계, 통화, 날짜, 시간, 장소를 채워 줍니다. 이미 입력해 둔 내용은 그대로 둡니다."
      shot: S09
      shotAlt: "‘영수증 분석 중...’이 표시된 새 지출 양식과, 세부 정보가 채워진 같은 양식"
    - title: "확인하고, 나누기"
      body: "양식을 종이와 비교하세요. 틀린 건 고치고, 누가 결제했고 누가 비용을 나눴는지 말하고, 나누는 방법을 고른 다음 저장하세요. 저장하기 전까지는 지출이 만들어지지 않습니다. 나누는 방법은 [지출 나누기](page:feature/split-expenses)에서 다룹니다."
options:
  heading: "옵션"
  items: []
sections:
  - heading: "채워지는 내용"
    body: "새 지출에 영수증 이미지를 추가하면 다음 항목이 채워질 수 있습니다. 누가 결제했는지, 누가 비용을 나눴는지, 어떻게 나눌지는 여전히 여러분이 정합니다."
    items:
      - "지출의 **설명**."
      - "**합계**."
      - "**통화**, 그룹이 허용하는 경우에만."
      - "**날짜**와 **시간**."
      - "**장소**."
      - "종이 영수증이 바래거나 세탁기에 들어갔을 때를 대비한, 영수증의 텍스트 사본을 **메모**에."
  - heading: "여전히 확인할 것"
    body: "전부요. 채워진 내용은 초안으로 보세요. 합계를 종이와 맞춰 보고, 그다음 통화, 날짜, 장소를 확인하세요. 흐릿한 사진과 구겨진 종이는 어떤 독자도 속일 수 있고, 모든 영수증을 정확히 읽는다고 약속하지는 않으니, 저장하기 전에 꼭 살펴보세요. 틀린 게 있으면 그 위에 덮어쓰면 됩니다. 영수증은 엔화인데 그룹이 파운드로 정산한다면, 그다음에 일어나는 일은 [여러 통화](page:feature/multiple-currencies)에서 설명합니다."
  - heading: "영수증을 지출과 함께 보관하기"
    body: "스캔했든 안 했든 영수증은 지출과 함께 남길 수 있습니다. 사진이나 PDF를 지출마다 최대 세 개, 각각 최대 10 MB까지 첨부하세요. 그룹 멤버는 지출에서 그것들을 볼 수 있습니다. 이미지는 첨부 뷰어에서 열리는 썸네일로 보이고, PDF는 링크로 열립니다. 스캔한 사진도 저장하기 전에 제거하지 않으면 함께 첨부됩니다. 누군가 그 저녁이 정말 얼마였는지 물을 때, 증거가 바로 거기 있어요."
  - heading: "영수증이 가는 곳"
    body: "영수증 이미지는 Google의 AI 서비스가 읽습니다. 양식을 채우기 위해, 이미지는 Google의 미국 멀티 리전에 있는 Google Vertex AI(Gemini)가 읽어요. 새 지출에 이미지를 추가하면 읽힙니다. PDF나, 이미 있는 지출에 추가한 사진은 읽지 않고 저장만 됩니다. 첨부한 영수증은 그룹 멤버에게 보이므로, 영수증에 공유하고 싶지 않은 내용이 있다면 사진은 건너뛰고 그 지출은 직접 입력하세요."
limits:
  heading: "한계"
  items:
    - "이미지만 읽습니다. JPEG, PNG, WebP, 그리고 변환된 HEIC. PDF는 지출에 첨부할 수 있지만 읽지는 않습니다."
    - "스캔은 새 지출에만 쓸 수 있습니다. 이미 있는 지출에는 영수증을 첨부할 수 있지만 아무것도 읽지 않습니다."
    - "손대지 않은 항목만 채우며, 통화는 그룹이 허용하는 경우에만 채웁니다."
    - "항목별로 나누거나 품목을 사람에게 배정하지 않습니다. 지출 하나를 채워 주고, 나누는 건 평소처럼 여러분이 합니다."
    - "채워진 내용이 맞다는 약속도, 스캔이 매번 된다는 약속도 없습니다. 저장하기 전에 확인하고, 스캔이 실패하거나 쓸 수 없을 땐 지출을 직접 추가하세요."
    - "지출 하나에는 첨부를 최대 세 개까지, 각각 최대 10 MB로 붙일 수 있고, 형식은 JPEG, PNG, WebP, HEIC 또는 PDF입니다."
    - "영수증 이미지는 Google의 미국 멀티 리전에 있는 Google Vertex AI(Gemini)가 읽고, 첨부한 영수증은 그룹 멤버에게 보입니다."
useCasesHeading: "영수증이 쌓이는 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "영수증을 항목별로 나눌 수 있나요?"
      a: "아니요. 합계를 포함해 지출을 채워 주고, 그것을 똑같이, 정확한 금액으로, 비율로 나누는 건 여러분입니다. 사람마다 다르게 시킨 계산서라면 각자 낼 금액을 정확한 금액으로 입력하세요. 자세한 내용은 [지출 나누기](page:feature/split-expenses)에 있어요."
    - q: "PDF도 읽나요?"
      a: "아니요. PDF를 지출에 첨부해 숫자와 함께 보관할 수는 있지만, 읽는 건 이미지뿐입니다."
    - q: "스캔 횟수에 제한이 있나요?"
      a: "다 써 버릴 스캔 크레딧이 없고, 스캔은 무료입니다. 파일에는 한도가 있어서, 지출마다 첨부 최대 세 개에 각각 최대 10 MB입니다. 나머지는 [무료로 제공되는 것](page:pricing)에서 확인하세요."
    - q: "내 영수증은 누가 볼 수 있나요?"
      a: "그룹 멤버는 지출에 첨부된 영수증을 볼 수 있습니다. 영수증 이미지는 Google의 AI 서비스도 읽는데, 양식이 채워지는 방법이 바로 그것입니다."
    - q: "이미 추가한 지출의 영수증을 스캔할 수 있나요?"
      a: "아니요, 스캔은 새 지출용입니다. 이미 있는 지출에 영수증을 첨부할 수는 있고, 그 경우 읽지 않고 저장만 됩니다."
    - q: "잘못 채워지면 어떡하나요?"
      a: "그 위에 덮어쓰세요. 저장하기 전까지 모든 항목을 수정할 수 있고, 어차피 전부 확인하셔야 해요. 스캔이 실패하거나 쓸 수 없다면 평소처럼 지출을 직접 추가하세요."
