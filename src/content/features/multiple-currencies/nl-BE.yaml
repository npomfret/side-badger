meta:
  title: "Verdeel kosten in 140 valuta’s, omgerekend of apart gehouden"
  description: "Voer elke uitgave in de valuta in waarin je betaalde, hou saldi apart of reken om tegen een koers die je kunt zien en aanpassen, en reken dan af met een korte lijst betalingen."
h1: "Verdeel kosten in 140 valuta’s"
navLabel: "Meerdere valuta’s"
lead: "Euro’s, yen en dat ene taxiritje in baht. Side Badger neemt elke uitgave aan in de valuta waarin je betaalde, houdt de saldi netjes en kan omrekenen wanneer je groep liever één keer afrekent. Het werkt in 140 valuta’s en past vanzelf bij [groepsreizen](page:use-case/group-trips)."
cta:
  heading: "Neem je euro’s mee, neem je yen mee"
  body: "Maak een account aan, start een groep en voeg de eerste uitgave toe in welke valuta je toevallig bij de hand had."
  button: "Maak een gratis account"
problem:
  heading: "Voer het in zoals je betaalde"
  body: "Een reis wordt zelden in één valuta betaald. Het hotel werd thuis in ponden geboekt, het diner werd in yen betaald en de koffie op de luchthaven in wat de tussenstop ook gebruikte. Alles met de hand omrekenen voor je het zelfs maar kunt invoeren, daar raken spreadsheets door verlaten. In Side Badger voer je elke uitgave in de valuta van het bonnetje in, en elk bedrag volgt de regels van zijn valuta, dus yen hebben geen decimalen en dinars drie. Je recent gebruikte valuta’s staan bovenaan de lijst."
workflow:
  heading: "Hou valuta’s apart, of reken om terwijl je bezig bent"
  steps:
    - title: "Voeg de uitgave toe in haar eigen valuta"
      body: "Kies de valuta, typ het bedrag, zeg wie betaald heeft en wie de kost deelde. Meer is niet nodig. Dit is de standaard, en het houdt het oorspronkelijke bedrag precies zoals je het invoerde."
      shot: S07
      shotAlt: "Het uitgavenformulier met een bedrag in yen ingevuld"
    - title: "Volg een saldo per valuta"
      body: "Saldi worden per valuta apart bijgehouden, en elk krijgt zijn eigen korte lijst voorgestelde betalingen. Ponden worden in ponden afgerekend en yen in yen."
      shot: S10
      shotAlt: "Het saldoscherm met vereenvoudigde schulden in twee valuta’s"
    - title: "Of reken om, wanneer de groep liever één keer afrekent"
      body: "Kies een andere valuta terwijl je de uitgave invoert en Side Badger kan ze omrekenen tegen een actuele wisselkoers, die je kunt aanpassen naar de koers die je echt kreeg. Het omgerekende bedrag komt bij het saldo in die valuta. Omrekenen is een keuze van de groep, nooit iets wat achter je rug gebeurt."
options:
  heading: "Een koers die je kunt zien en aanpassen"
  items:
    - title: "De koers wordt getoond"
      body: "Wanneer je omrekent, verschijnen de koers en het omgerekende bedrag op het formulier, zodat niemand een getal op goed vertrouwen hoeft aan te nemen."
    - title: "Typ je eigen koers"
      body: "Een betere koers gekregen aan een wisselkantoor, of een slechtere op een luchthaven? Pas de koers aan naar degene die je echt kreeg en het omgerekende bedrag wordt bijgewerkt."
    - title: "Het origineel blijft"
      body: "Het oorspronkelijke bedrag blijft bij de uitgave staan, naast het omgerekende, voor wie vraagt hoeveel het in yen was."
    - title: "Gratis omrekenen"
      body: "Omrekenen kost niets. Er is geen vergoeding om een uitgave in een andere valuta in te voeren."
