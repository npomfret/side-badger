meta:
  title: "묵은 밤이 다를 때 빌라 비용 나누기 | 사이드 배저"
  description: "Dev는 3박만 있었는데 왜 6박 값을 내야 할까요? 휴가 빌라를 실제로 묵은 밤 수에 따라 나누세요. 계산 과정까지 정리해 두었습니다."
h1: "묵은 밤이 다를 때 휴가 빌라 비용 나누는 방법"
navLabel: "밤 수로 빌라 나누기"
lead: "한 사람이 하룻밤 묵는 값을 구해서 각자의 숙박 일수를 곱하고, 빌라를 **정확한 금액으로 나눈 지출 한 건**으로 입력하세요. 사이드 배저는 계산을 이어 가다가 정산할 때가 되면 짧은 결제 목록을 제안합니다."
cta:
  heading: "빌라는 지출 한 건으로 깔끔하게"
  body: "그룹을 만들고, 링크나 QR 코드로 모두를 초대하고, 빌라를 정확한 금액으로 입력하세요. 사이드 배저는 여러분이 휴가를 즐기는 동안 계산을 이어 갑니다."
sections:
  - heading: "여섯 밤, 네 사람, 카드 한 장"
    body: "[그룹 여행](page:use-case/group-trips)은 보통 한 사람의 카드로 시작합니다. 이번에는 Ana의 카드예요. 누군가는 먼저 나서야 하니까, Ana가 빌라를 6박, €2,100에 예약합니다. Ana, Ben, Chloe는 여섯 밤을 모두 묵습니다. Dev는 마지막 3박만 함께할 수 있고, 기차로 옵니다. Ben은 렌터카를 빌리는데, Dev는 한 번도 타지 않습니다. 큰 장보기는 Dev가 합니다. 빌라를 네 명이 똑같이 나누는 게 가장 뻔한 방법이지만, 그러면 Dev는 집에서 보낸 3박 값까지 내게 되고, 그런 일은 크리스마스에 다시 튀어나옵니다. 묵은 밤 수로 나누면 그 말다툼을 피할 수 있고, 계산은 1분이면 됩니다."
  - heading: "1인 1박의 값 구하기"
    body: "1인 1박은 한 사람이 하룻밤 묵는 것입니다. 빌라 값은 정해져 있으니, 그 가격을 전체 1인 1박 수로 나눈 다음 각자 묵은 만큼의 몫을 주세요."
    items:
      - "**1인 1박 수를 세세요.** Ana, Ben, Chloe는 각각 여섯 밤을, Dev는 세 밤을 묵으므로 6 + 6 + 6 + 3 = 21입니다."
      - "**1인 1박의 값을 구하세요.** €2,100 ÷ 21 = 1인 1박당 €100입니다."
      - "**각자 묵은 밤 수를 곱하세요.** Ana, Ben, Chloe는 각각 6 × €100 = €600를 내고, Dev는 3 × €100 = €300를 냅니다."
      - "**합계를 확인하세요.** €600 + €600 + €600 + €300 = €2,100입니다. 각자의 몫을 더해도 가격과 맞지 않는다면 하룻밤이 빠졌거나 두 번 세어진 것입니다."
  - heading: "사이드 배저에 입력하기"
    body: "그룹을 만들고, 링크나 QR 코드로 나머지 세 명을 초대한 다음 비용을 추가하세요. 빌라가 먼저입니다."
    items:
      - "**비용 추가**를 누르세요. 설명을 쓰고 2,100을 입력한 다음 **누가 지불했나요?**를 Ana로 정합니다."
      - "**분할 대상**에 네 사람이 모두 들어 있는지 확인하세요."
      - "**분할 방법**에서 **정확한 금액**을 고르세요. Ana, Ben, Chloe에는 600을, Dev에는 300을 입력합니다. 금액의 합은 총액과 같아야 합니다."
      - "**비용 저장**을 누르세요."
      - "렌터카도 같은 방법으로 추가하세요. Ben이 결제했고 분할은 **균등**이며, Dev는 기차로 왔으니 뺍니다. 비용을 나누는 다른 방법은 [지출 나누기](page:feature/split-expenses)에서 설명합니다."
      - "장보기를 추가하세요. Dev가 결제했고 분할은 **균등**이며 네 명 모두 포함합니다."
  - heading: "결과를 읽고 정산하기"
    body: "각자의 몫은 빌라 몫에 렌터카와 장보기 몫을 더한 금액입니다. Ana, Ben, Chloe는 각각 €725이고, €600 + €80 + €45입니다. Dev는 €345이고, €300 + €45입니다. 여기서 각자 결제한 금액을 빼면 잔액이 나옵니다. Ana는 €2,100를 결제했으니 €1,375를 받아야 합니다. Ben은 €240를 결제했고 €485를 내야 합니다. Dev는 €180를 결제했고 €165를 내야 합니다. Chloe는 아무것도 결제하지 않았고 €725를 내야 합니다. 그대로 두면 이 빚은 그룹 안을 여섯 갈래로 오가게 됩니다. 사이드 배저는 대신 결제 세 건을 제안하며, 모두 Ana에게 갑니다. 원하는 방법으로 Ana에게 지불한 다음 **정산하기**를 누르고 결제마다 **정산 기록**을 써서 잔액이 따라잡게 하세요. 빠른 정산 버튼은 금액을 채워 줍니다. [정산하기](page:feature/settle-up)에서 더 자세히 설명합니다."
  - heading: "빌라 가격이 깔끔하지 않을 때"
    items:
      - "**방이 서로 다를 때.** 스위트룸이 작은 방보다 값어치가 높다면, 먼저 방마다 얼마인지 합의한 다음 방별로 1인 1박 계산을 하세요. 빌라를 모두의 총액이 담긴 지출 한 건으로 입력하거나 방마다 한 건씩 입력해도 됩니다. 어느 쪽이든 지출의 정확한 금액은 그 총액과 합이 같아야 합니다."
      - "**몇 달 전에 낸 보증금.** 보증금을 낸 사람의 지출을 따로 만들고, 낸 날짜를 날짜로 정하세요. 잔금과 같은 비율로 묵은 밤 수에 따라 나눕니다."
      - "**예약이 다른 통화로 되어 있을 때.** 결제한 통화로 빌라를 입력하세요. 그룹이 입력하면서 환산한다면 현재 환율을 쓰거나, 실제로 적용받은 환율을 직접 입력하세요. 원래 금액은 지출에 그대로 남습니다. 자세한 내용은 [여러 통화](page:feature/multiple-currencies)를 보세요."
      - "**일부만 묵는 밤.** 누구는 자정에 도착하고 누구는 아침 식사 전에 떠납니다. 밤 수를 세는 규칙을 하나 정해서 모두에게 똑같이 적용하세요."
  - heading: "이 경우 사이드 배저가 하지 않는 일"
    items:
      - "밤 수를 대신 세 주지 않습니다. 밤 수별 분할이나 지분별 분할은 없으므로, 위처럼 각자의 금액을 계산해 **정확한 금액**으로 입력하세요."
      - "돈을 옮기지 않습니다. 원하는 방법으로 서로 지불한 다음 결제를 기록하세요."
      - "지출 하나에 결제자는 한 명입니다. 두 사람이 빌라를 결제했다면 지출을 두 건 입력하세요."
      - "게스트 접속이 없습니다. Dev를 포함해 그룹의 모든 사람에게 무료 계정이 필요합니다."
exampleAfter: 2
example:
  heading: "빌라, 렌터카, 장보기"
  currency: EUR
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: chloe
      name: Chloe
    - id: dev
      name: Dev
  expenses:
    - label: "빌라 6박"
      payer: ana
      amount: 2100
      split:
        method: exact
        shares:
          ana: 600
          ben: 600
          chloe: 600
          dev: 300
    - label: "렌터카"
      payer: ben
      amount: 240
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "장보기"
      payer: dev
      amount: 180
      split:
        method: equal
faq:
  heading: "빌라에 관한 질문"
  items:
    - q: "누가 취소하면요?"
      a: "그 사람의 밤 수를 빼고 계산을 다시 해서, 정확한 금액의 합이 다시 가격과 같아지도록 빌라 지출을 수정하세요. 이전 버전은 보관되고 수정 내용은 그룹의 활동에 표시되므로 아무도 몰래 숫자를 바꿀 수 없습니다. 누가 수정할 수 있는지는 그룹의 권한에 따라 달라집니다."
    - q: "예약한 사람은 덜 내야 하나요?"
      a: "그룹이 정할 일입니다. 예약은 번거로운 일이고, 그것이 할인을 받을 만한 일인지는 그룹마다 달라요. 무엇에 합의하든 정확한 금액에 반영하고, 지출의 메모나 그 옆의 댓글에 적어 두세요. 그러면 아무도 그 약속을 기억하고 있을 필요가 없습니다."
    - q: "청소비는 다르게 나눌 수 있나요?"
      a: "네. 청소비를 별도 지출로 입력하고 그 지출만의 분할을 정하세요. 집 전체에 붙는 고정 요금이라면 **균등**이 알맞고, 청소비도 묵은 밤 수를 따르게 하고 싶은 그룹에는 **정확한 금액**이 알맞습니다."
