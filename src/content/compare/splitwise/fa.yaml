sections:
  - heading: حرف پول، کنار خود پول
    body: پول مشترک با حرف و شک و برنامه‌ریزی همراه است. Side Badger هر سه را کنار عددها نگه می‌دارد تا هیچ‌کس مجبور نشود در گروه چت به عقب برگردد و بگردد.
    items:
      - "**نظر، همان‌جا که باید باشد.** درباره خود گروه یا هر هزینه، لیست یا نظرسنجی نظر بدهید و گفتگو را کنار چیزی که درباره‌اش است نگه دارید."
      - "**رسید و عکس.** تا سه رسید برای هر هزینه نگه دارید و به نظرهای گروه، یک لیست یا یک نظرسنجی عکس یا PDF اضافه کنید."
      - "**سؤال، نه دعوا.** مدیر می‌تواند سؤال را روشن کند، و بعد هر کسی در یک هزینه می‌تواند درباره‌اش بپرسد. تا وقتی روشن نشده از مانده‌ها بیرون می‌ماند."
      - "**لیست و نظرسنجی.** لیست خرید مشترک را کنار صورت‌حساب‌های خرید نگه دارید و فهرست کوتاه ویلاها را به رأی بگذارید، اگر خواستید بی‌نام."
      - "**کمی کف‌زدن.** به هزینه‌ها، پرداخت‌ها و نظرها واکنش نشان دهید و وقتی پرداختی رسید جشنش بگیرید."
  - heading: گروه شما، قانون‌های شما
    body: مرکز راهنمای Splitwise می‌گوید مدیر گروه و مجوزهای ویژه را پشتیبانی نمی‌کند. Side Badger نقش و مجوز دارد، برای گروه‌هایی که کسی را می‌خواهند تا حساب‌ها را مرتب نگه دارد.
    items:
      - "**مدیر، عضو و بیننده.** کسی را بیننده کنید: همه‌چیز را می‌بیند و هیچ‌چیز را تغییر نمی‌دهد."
      - "**دو پیش‌فرض، یا مال خودتان.** با همکاری باز یا گروه مدیریت شده شروع کنید، یا هر مجوز را خودتان تعیین کنید: چه کسی هزینه‌ها را ویرایش و حذف می‌کند، لیست‌ها را ویرایش می‌کند، دعوت می‌کند و افراد تازه را راه می‌دهد."
      - "**تأیید برای پیوستن.** تأیید را روشن کنید و یک مدیر هر نفر را راه می‌دهد."
      - "**تنظیمات خود گروه.** آن را به ارزهایی که واقعاً استفاده می‌کنید محدود کنید، ارز پیش‌فرضش را انتخاب کنید و یک تصویر هدر به آن بدهید."
      - "**وقتی تمام شد قفلش کنید.** عددها سر جایشان می‌مانند تا یک مدیر قفل را باز کند."
  - heading: اینجا رایگان، آنجا پولی
    body: Splitwise Pro طرح پولی Splitwise است و صفحه Pro خودش سه چیز می‌فروشد که در Side Badger هزینه‌ای ندارند.
    items:
      - "**اسکن رسید.** Splitwise Pro عکس رسید شما را اسکن می‌کند. Side Badger آن را رایگان و بدون اعتبار اسکن انجام می‌دهد: جمع کل، تاریخ و مکان را برای بررسی شما پر می‌کند."
      - "**تبدیل ارز.** Splitwise Pro وقتی روی «Convert» بزنید هزینه‌های یک گروه را به ارز پیش‌فرض شما تبدیل می‌کند. Side Badger هر هزینه را همان موقع ورود تبدیل می‌کند، با یک نرخ تبدیل روز یا نرخی که واقعاً گرفته‌اید، و مبلغ اصلی روی هزینه می‌ماند."
      - "**بدون محدودیت روزانه.** Splitwise Pro هزینه نامحدود می‌فروشد و مرکز راهنمای خودش می‌گوید کاربران رایگان هر روز می‌توانند تا 4 هزینه اضافه کنند. Side Badger محدودیت روزانه ندارد."
  - heading: بانک شما بیرون می‌ماند
    body: Side Badger به بانک شما وصل نمی‌شود و اطلاعات بانکی شما را نمی‌خواهد. فقط ثبت می‌کند چه کسی به چه کسی بدهکار است؛ شما هر طور دوست دارید به هم پرداخت می‌کنید و بعد پرداخت را ثبت می‌کنید. اطلاعات ورود به حساب بانکی‌تان را به کسی نمی‌دهید، پس یک نگرانی کمتر.
  - heading: یک برنامه، در مرورگر و روی گوشی
    body: Side Badger در مرورگر شما اجرا می‌شود. وارد شوید، آن را به صفحه اصلی گوشی اضافه کنید تا مثل یک برنامه باز شود. در هر دو حالت همان برنامه است، پس ویژگی تازه دفعه بعد که باز کنید روی گوشی شماست، بدون اینکه منتظر به‌روزرسانی فروشگاه برنامه بمانید.
  - heading: و چند غافلگیری بامزه
    items:
      - "**از دستیارتان بپرسید.** Side Badger با ChatGPT و Claude کار می‌کند: از دستیار خودتان بخواهید هزینه‌ای اضافه کند، رسیدی را اسکن کند یا پرداختی را ثبت کند."
      - "**هر کس به زبان خودش.** Side Badger به 39 زبان حرف می‌زند و هر نفر زبان خودش را انتخاب می‌کند. صفحه اصلی Splitwise می‌گوید 7+. 133 ارز را هم پوشش می‌دهد، برای سفری که همه‌جا می‌رود."
      - "**راهنمایی بدون ترک برنامه.** گیر کرده‌اید یا اشکالی پیدا کرده‌اید؟ از برنامه به ما بگویید و پاسخ ما را همان‌جا بخوانید."
  - heading: جاهایی که Splitwise هنوز جلوتر است
    body: ترجیح می‌دهیم برنامه درست را انتخاب کنید تا اینکه بعداً بفهمید. اگر گروه شما به یکی از این‌ها نیاز دارد، Splitwise آن را دارد و Side Badger ندارد.
    items:
      - "**برنامه‌های فروشگاه برنامه.** Side Badger در مرورگر و روی صفحه اصلی گوشی شما زندگی می‌کند، نه در فروشگاه‌های برنامه."
      - "**حالت آفلاین.** Side Badger به اتصال نیاز دارد."
      - "**پرداخت داخل برنامه.** در برخی کشورها Splitwise می‌تواند پول را هم جابه‌جا کند. Side Badger فقط ثبت را نگه می‌دارد."
      - "**تقسیم بر اساس سهم یا قلم.** Side Badger برای هر هزینه یک پرداخت‌کننده دارد و خود هزینه مساوی، با مبلغ دقیق یا با درصد تقسیم می‌شود. اسکن رسیدش قلم‌ها را به افراد اختصاص نمی‌دهد."
      - "**نمودارها و تقسیم‌های پیش‌فرض.** Splitwise Pro هر دو را دارد. Side Badger حساب اینکه چه کسی به چه کسی بدهکار است را نگه می‌دارد، و کل ماجرا همین است."
  - heading: انتقال گروه‌تان به اینجا
    body: ابزاری برای انتقال داده از Splitwise وجود ندارد، پس انتقال یعنی شروعی تازه. اول در Splitwise تسویه کنید، بعد در Side Badger یک گروه بسازید و همه را با لینک یا کد QR دعوت کنید. هر عضو گروه به یک حساب رایگان نیاز دارد و برای ثبت‌نام فقط یک نشانی ایمیل لازم است.
