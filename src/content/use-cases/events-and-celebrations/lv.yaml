meta:
  title: "Sadaliet ballīšu, kāzu un kopīgu dāvanu izmaksas"
  description: "Dalieties ballītes, kāzu vai kopīgas dāvanas izmaksās, kad cilvēki iemaksā dažādas summas. Balsojiet par plānu, sadaliet pēc precīzām summām un skatiet, kurš kam ir parādā."
h1: "Sadaliet ballīšu, kāzu un kopīgu dāvanu izmaksas"
navLabel: "Pasākumi un svinības"
lead: "Sadaliet depozītus, dekorācijas un ārkārtas lietussargus. Sēdvietu plānu atstājiet kādam drosmīgākam. Side Badger vienuviet uztur, **kurš cik iemaksāja**, lai organizators arī var izbaudīt ballīti."
cta:
  heading: "Sāciet ar nākamajām svinībām"
  body: "Izveidojiet kontu, izveidojiet grupu pasākumam un nosūtiet uzaicinājuma saiti. Side Badger ir bez maksas, bez reklāmām un bez dienas ierobežojumiem."
  button: "Izveidot bezmaksas kontu"
scenario:
  heading: "Visi iemaksā, ne vienmēr vienādi"
  body: "Kāds maksā vietas depozītu, cits nopērk kūku, un trešais kopīgo dāvanu apmaksā ar savu karti. Daži viesi nāk uz visu, daži tikai uz vakariņām. Taisnīgi to visu uzskaitīt tērzēšanas pavedienā ir darbs, uz ko neviens nepieteicās. Side Badger grupa notur visu, lai kāds būtu summu sajaukums, un parāda katram, cik viņš ir parādā vai cik viņam pienākas. Pamatus skatiet sadaļā [kā tas darbojas](page:how-it-works) vai lasiet tālāk par pasākumu."
sections:
  - heading: "Izlemiet kopā"
    body: "Pirms jebkura naudas kustības nodod izvēli **aptaujai**. Pievienojiet līdz 10 variantiem, piemēram, divas norises vietas vai trīs dāvanu idejas, un ļaujiet visiem balsot. Varat paslēpt, kurš par ko balsoja, lai katrs variants tiek godīgi uzklausīts, un uzvarētājs parādās, kad aptauja ir slēgta. Nevienam nav jāritina atpakaļ četrdesmit ziņojumu, lai uzzinātu, kas nolemts."
  - heading: "Kurš par ko iemaksā"
    body: "Ne visi maksā vienādi, un ne visi piedalās katrās izmaksās. Sadaliet izdevumu vienādi, procentuāli vai **pēc precīzām summām**, lai katra daļa ir skaitlis, par ko vienojāties. Izlaidiet ikvienu, kurš nebija iesaistīts, piemēram, viesus, kas izlaida vakariņas, vai draugus, kas nepievienojās dāvanai. Katram izdevumam ir viens maksātājs, un visi pārējie sadalē viņam ir parādā savu daļu. Detaļas ir lapā [izdevumu sadale](page:feature/split-expenses)."
  - heading: "Saglabājiet dokumentus"
    body: "Pievienojiet izdevumam piezīmes, piemēram, ko izmaksas sedza. Komentāri paliek **blakus izdevumam**, par kuru tie ir, tāpēc jautājums „vai kūka bija £45 vai £54?” un tā atbilde atrodas vienā vietā. Komentāri var būt līdz 500 rakstzīmēm, kas ir daudz jautājumam par depozītu."
  - heading: "Organizatora vadīklas"
    body: "Atvērta sadarbība ļauj jebkuram dalībniekam pievienot un labot izdevumus, kas der nelielai dāvanai. Kāzām vai lielākai ballītei izvēlieties **pārvaldītas grupas** sagatavi. Administratori apstiprina katru jauno dalībnieku, un izdevumus var mainīt tikai veidotāji un administratori. Uzaiciniet cilvēkus ar saiti vai QR kodu; ar ieslēgtu apstiprināšanu administrators katru ielaiž, tāpēc viesu saraksts paliek viesu saraksts. Kad pasākums beidzies, bloķējiet grupu, lai skaitļi paliktu nemainīgi."
  - heading: "Norēķinieties pēc ballītes"
    body: "Kad pēdējais rēķins ir iekšā, atlikumi parāda, **kurš kam ir parādā**, un Side Badger iesaka īsu maksājumu sarakstu, kas nokārto visus. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu grupā. Side Badger nekad nepārvieto naudu, tāpēc grupa uztur uzskaiti, kamēr pārskaitījumi notiek jūsu pašu bankas lietotnēs. Lapa [norēķināšanās](page:feature/settle-up) parāda, kā mezgls kļūst par īsu sarakstu."
