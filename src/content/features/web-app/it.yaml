meta:
  title: App per dividere le spese senza scaricare nulla | Side Badger
  description: Il telefono è pieno, lo sappiamo. Side Badger funziona nel browser, senza app store e senza download. Aggiungilo alla schermata Home e si apre come un'app.
h1: "Niente app store. Niente download. Ma sembra comunque un'app"
navLabel: App web
lead: Side Badger vive nel tuo browser. Non c'è nessun app store da cercare e niente da scaricare prima. Accedi dal telefono o dal computer, dividi le spese online con il tuo gruppo e aggiungilo alla schermata Home o al dock quando lo vuoi a portata di tocco.
cta:
  heading: Aprilo. Accedi. Avvia un gruppo.
  body: Crea un account, avvia un gruppo e aggiungi la prima spesa, tutto dal browser che hai già aperto. Vuoi prima il giro turistico? Vedi [come funziona](page:how-it-works), oppure [cosa include il gratuito](page:pricing).
problem:
  heading: Il tuo telefono è pieno. Lo sappiamo.
  body: Da qualche parte ci sono quattromila foto dello stesso tramonto e un avviso di memoria piena che ignori da primavera. L'ultima cosa che gli serve è un'altra app, solo per dividere una cena. Per questo Side Badger è un'app web. Funziona in un browser moderno, su un telefono o un computer. Sul telefono usa layout per mobile, con la pagina del gruppo divisa in schede e controlli adatti al tocco. Alcuni extra, come aggiungerlo alla schermata Home, dipendono dal tuo browser, e diciamo dove.
workflow:
  heading: Dalla scheda del browser alla schermata Home in tre passaggi
  steps:
    - title: Aprilo e accedi
      body: Vai su Side Badger nel browser e accedi. Bastano un indirizzo email e una password, e devi verificare l'email prima di poter aggiungere qualsiasi cosa. Tutti nel gruppo hanno bisogno di un account, quindi le persone che inviti faranno lo stesso.
    - title: Aggiungilo alla schermata Home o al dock
      body: Una volta effettuato l'accesso, l'app si propone di installarsi da sola. Trovi un pulsante **Installa** dove il tuo browser lo permette, e **Mostrami come** dove non lo permette. Te lo sei perso, o hai detto di no? Le **Impostazioni** hanno lo stesso aiuto sotto **Aggiungi alla schermata Home o al Dock**. Su iPhone o iPad, le Impostazioni mostrano prima i passaggi per iPhone e mettono gli altri dispositivi sotto **Altri dispositivi**. In ogni caso, l'app si apre poi in una finestra tutta sua.
      shot: S20
      shotAlt: La sezione Aggiungi alla schermata Home o al Dock delle Impostazioni, con i passaggi per aggiungere l'app a un dispositivo
    - title: Attiva le notifiche, se le vuoi
      body: Le notifiche sono disattivate finché non le attivi, e ogni dispositivo si attiva separatamente. Usa il pulsante **Attiva** che offre la campanella delle notifiche, oppure l'interruttore **Notifiche push** nelle **Impostazioni**. Su iPhone o iPad, apri prima l'app dalla schermata Home. È l'unico posto in cui le notifiche funzionano.
      shot: S19
      shotAlt: Il menu a tendina delle notifiche aperto, con l'elenco delle attività recenti nel gruppo
options:
  heading: Come aggiungerlo, dispositivo per dispositivo
  items:
    - title: iPhone e iPad
      body: Tocca il pulsante Condividi, un quadrato con una freccia rivolta verso l'alto. Se non lo vedi, tocca prima i tre puntini (•••), poi Condividi. Scorri verso il basso e tocca **Aggiungi a Home**. Lascia attivata l'opzione **Apri come app web**, poi tocca **Aggiungi**. Se un link si è aperto dentro un'altra app, apri prima la pagina in Safari, perché quel browser integrato non può aggiungerla.
    - title: Android
      body: Apri il menu del browser e scegli **Aggiungi a schermata Home** oppure **Installa app**.
    - title: Chrome o Edge su computer
      body: Apri il menu del browser e scegli l'opzione per installare questo sito come app. Avrà così una finestra tutta sua e una propria icona.
    - title: Safari su Mac
      body: Scegli **File**, poi **Aggiungi al Dock**.
sections:
  - heading: Notifiche, solo se le chiedi
    body: Le notifiche push sono facoltative. Attivale e ricevi una notifica quando c'è una nuova attività nei tuoi gruppi, come qualcuno che aggiunge una spesa, lascia un commento o registra un pagamento. Si attivano un dispositivo alla volta, dalla campanella delle notifiche o dalle **Impostazioni**, e da lì puoi anche disattivarle. Richiedono un browser che le supporti e il tuo permesso. Se il browser le ha bloccate per il sito, consentile prima nelle impostazioni del browser. Su iPhone o iPad funzionano solo dall'app aggiunta alla schermata Home, non da una scheda del browser. La consegna non è garantita, quindi considera una notifica una spintarella, non una promessa. Per sapere cosa compare nello storico, vedi [pianificare insieme](page:feature/plan-together).
  - heading: Aggiornamenti subito visibili, senza tasto di ricarica
    body: Aggiungi una spesa e tutti la vedono subito, insieme a cosa è cambiato e a chi l'ha cambiato. Ogni gruppo tiene uno storico delle attività, e la campanella delle notifiche mostra l'attività di tutti i tuoi gruppi. Nessuno deve chiedere se hai visto quello che hai appena aggiunto. È già sul suo schermo.
  - heading: 39 lingue, ognuno la sua
    body: Usa Side Badger in 39 lingue, tra cui l'arabo, il persiano e l'urdu con scrittura da destra a sinistra. Ognuno nel gruppo sceglie la propria, quindi la stessa pagina del gruppo può essere in arabo per una persona e in inglese per la successiva. L'unica cosa su cui il gruppo deve essere d'accordo sono i numeri.
  - heading: Pensato per più di un tipo di utente
    body: Side Badger è pensato anche per chi usa la tastiera e gli screen reader. I colori dei membri hanno anche dei motivi, così non devi distinguere il verde dal rosso.
    items:
      - Link per saltare ai contenuti, così chi usa la tastiera ci arriva subito.
      - Le finestre di dialogo gestiscono il focus della tastiera.
      - I controlli hanno un'etichetta, per gli screen reader.
      - I layout si invertono per le lingue da destra a sinistra.
limits:
  heading: Cosa non fa l'app web
  items:
    - Non si usa offline. Side Badger ha bisogno di una connessione, quindi non aprirà il tuo gruppo su un aereo senza wifi.
    - Non c'è nessuna app negli app store e nessuna app nativa per iPhone o Android. Side Badger è un'app web, e aggiungerlo alla schermata Home o al dock è il modo per avere la versione simile a un'app.
    - Aggiungerlo alla schermata Home o al dock dipende dal tuo browser. I nomi dei menu variano tra browser e versioni, e alcuni browser non lo offrono.
    - Le notifiche push sono facoltative per ogni dispositivo e richiedono un browser che le supporti e il tuo permesso. Su iPhone o iPad funzionano solo dall'app aggiunta alla schermata Home. La consegna non è garantita.
    - Non ci sono avvisi via email o SMS né promemoria di pagamento. Le nuove attività compaiono nell'app, e come notifiche push se le attivi. Sollecitare un pagamento resta compito tuo.
    - L'attività viene conservata per 90 giorni.
    - Accedi con un indirizzo email e una password. Non c'è l'accesso con Google o Apple, e devi avere 18 anni o più.
    - Non affermiamo che Side Badger sia pienamente accessibile, né che rispetti uno standard formale di accessibilità. Se qualcosa ti intralcia, dillo dall'app e lì vedrai la nostra risposta.
useCasesHeading: Dove non avere bisogno di un'app aiuta
faq:
  heading: Domande
  items:
    - q: C'è un'app di Side Badger in un app store?
      a: No. Side Badger è un'app web. Lo apri nel browser e puoi aggiungerlo alla schermata Home o al dock, così si apre come un'app. Non c'è niente da scaricare da un app store.
    - q: Posso dividere le spese senza scaricare un'app?
      a: Sì. Apri Side Badger in un browser sul telefono o sul computer, accedi e avvia un gruppo. Aggiungerlo alla schermata Home o al dock è facoltativo.
    - q: Funziona offline?
      a: No. Side Badger ha bisogno di una connessione, anche quando è aggiunto alla schermata Home o al dock.
    - q: Perché non ricevo le notifiche sul mio iPhone?
      a: Su iPhone o iPad le notifiche funzionano solo dall'app aggiunta alla schermata Home, non da una scheda del browser. Aggiungila, aprila dall'icona nella schermata Home, poi attiva le notifiche nelle **Impostazioni**. La consegna non è garantita, quindi se una si perde, lo storico delle attività del gruppo mostra comunque cosa è stato aggiunto.
    - q: Devo attivare le notifiche?
      a: No. Sono disattivate finché non le attivi, un dispositivo alla volta. Senza, le nuove attività compaiono comunque nell'app, e tutti vedono subito una modifica quando hanno l'app aperta.
    - q: Serve un account a tutti nel gruppo?
      a: Sì. Bastano un indirizzo email e una password, e devi verificare l'email prima di poter aggiungere qualsiasi cosa. Chiunque entri in un gruppo fa lo stesso, da qualunque telefono o computer preferisca.
