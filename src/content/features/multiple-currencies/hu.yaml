meta:
  title: "Oszd meg a költségeket 140 pénznemben, átváltva vagy külön"
  description: "Add meg minden költséget abban a pénznemben, amelyben fizettél, vezesd külön az egyenlegeket, vagy válts át egy általad látott és módosítható árfolyamon, aztán számoljatok el egy rövid kifizetéslistával."
h1: "Oszd meg a költségeket 140 pénznemben"
navLabel: "Több pénznem"
lead: "Euró, jen és az az egy taxi báthban. A Side Badger minden költséget abban a pénznemben fogad el, amelyben fizettél, rendben tartja az egyenlegeket, és át tud váltani, ha a csoport inkább egyszer számolna el. 140 pénznemben működik, és természetesen illik a [csoportos utazásokhoz](page:use-case/group-trips)."
cta:
  heading: "Hozd az eurókat, hozd a jeneket"
  body: "Hozz létre fiókot, indíts csoportot, és add hozzá az első költséget bármilyen pénznemben, amely éppen a kezedben volt."
  button: "Ingyenes fiók létrehozása"
problem:
  heading: "Add meg úgy, ahogy fizették"
  body: "Egy utazást ritkán fizetnek egyetlen pénznemben. A szállást otthon foglalták fontban, a vacsorát jenben fizették, a reptéri kávét pedig abban, amit az átszálláskor használtak. Mindent kézzel átváltani, mielőtt egyáltalán beírnád, így hagyják el az emberek a táblázatokat. A Side Badgerben minden költséget a nyugtán szereplő pénznemben adsz meg, és minden összeg a pénzneme szabályait követi, így a jennek nincs tizedesjegye, a dinárnak három. A nemrég használt pénznemek a lista elején állnak."
workflow:
  heading: "Vezesd külön a pénznemeket, vagy válts át menet közben"
  steps:
    - title: "Add hozzá a költséget a saját pénznemében"
      body: "Válaszd ki a pénznemet, írd be az összeget, mondd meg, ki fizetett, és ki osztozott. Mást nem kell. Ez az alapértelmezés, és az eredeti összeget pontosan úgy őrzi meg, ahogy beírtad."
      shot: S07
      shotAlt: "A költségűrlap jenben beírt összeggel"
    - title: "Figyelj minden pénznem egyenlegére"
      body: "Az egyenlegeket pénznemenként külön vezetjük, és mindegyiknek megvan a maga rövid javasolt kifizetéslistája. A fontot fontban, a jent jenben rendezik."
      shot: S10
      shotAlt: "Az egyenlegek képernyője egyszerűsített tartozásokkal két pénznemben"
    - title: "Vagy válts át, ha a csoport inkább egyszer számolna el"
      body: "Válassz másik pénznemet a költség megadásakor, és a Side Badger át tudja váltani egy aktuális árfolyamon, amelyet átírhatsz arra, amelyet ténylegesen kaptál. Az átváltott összeg hozzáadódik az adott pénznem egyenlegéhez. Az átváltás a csoport döntése, sosem olyasmi, ami a háta mögött történik."
options:
  heading: "Egy árfolyam, amelyet látsz és módosíthatsz"
  items:
    - title: "Az árfolyam látszik"
      body: "Amikor átváltasz, az árfolyam és az átváltott összeg megjelenik az űrlapon, így senkinek nem kell szó nélkül elhinnie egy számot."
    - title: "Írd be a sajátodat"
      body: "Jobb árfolyamot kaptál a pénzváltóban vagy rosszabbat a reptéren? Szerkeszd az árfolyamot arra, amelyet ténylegesen kaptál, és az átváltott összeg frissül."
    - title: "Az eredeti marad"
      body: "Az eredeti összeg a költségnél marad, az átváltott mellett, annak, aki megkérdezi, mennyi volt jenben."
    - title: "Az átváltás ingyenes"
      body: "Az átváltás nem kerül semmibe. Nincs díj azért, ha egy költséget másik pénznemben adsz meg."
