meta:
  title: "Banatu festen, ezkontzen eta talde-opariaren kostuak"
  description: "Partekatu festa, ezkontza edo talde-opari baten kostuak jendeak zenbateko desberdinak jartzen dituenean. Bozkatu plana, banatu zenbateko zehatzen arabera eta ikusi nork nori zor dion."
h1: Banatu festen, ezkontzen eta talde-opariaren kostuak
navLabel: Ekitaldiak eta ospakizunak
lead: Banatu fidantzak, apaingarriak eta larrialdiko aterkiak. Eserleku-plana ausartagoren baten esku utzi. Side Badger-ek **nork zer jarri duen** leku bakarrean gordetzen du, antolatzaileak ere festaz goza dezan.
cta:
  heading: Hasi hurrengo ospakizunarekin
  body: Sortu kontu bat, egin talde bat ekitaldirako eta bidali gonbidapen-esteka. Side Badger doakoa da, iragarkirik gabe eta eguneko mugarik gabe.
scenario:
  heading: Denek jartzen dute, ez beti zenbateko bera
  body: Norbaitek aretoaren fidantza ordaintzen du, beste norbaitek pastela erosten du, eta hirugarren batek taldearen oparia bere txartelean jartzen du. Gonbidatu batzuk dena egitera etortzen dira eta beste batzuk afarira bakarrik. Txat-hari batean horren kontu zuzena eramatea inork eskatu ez duen lana da. Side Badger-eko talde batek dena hartzen du, zenbatekoen nahasketa dena delakoa izanda, eta pertsona bakoitzari erakusten dio zenbat zor duen edo zenbat zor zaion. Ikusi [nola funtzionatzen duen](page:how-it-works) oinarriak ikusteko, edo jarraitu irakurtzen ekitaldi baterako.
sections:
  - heading: Erabaki elkarrekin
    body: Dirurik mugitu aurretik, jarri aukera **inkesta** batera. Gehitu gehienez 10 aukera, adibidez bi areto edo hiru opari-ideia, eta utzi denei bozkatzen. Nork zer bozkatu duen ezkuta dezakezu, aukera bakoitzak entzute bidezkoa izan dezan, eta irabazlea inkesta itxi ondoren agertzen da. Inork ez du berrogei mezutan atzera egin behar zer erabaki zen jakiteko.
  - heading: Nor sartzen den zertan
    body: Ez denek ordaintzen dute berdin, eta ez denak dira kostu guztien parte. Banatu gastu bat berdin, ehunekoen arabera edo **zenbateko zehatzen arabera**, pertsona bakoitzaren zatia adostu duzuen zifra izan dadin. Utzi kanpoan parte ez zuten pertsonak, adibidez afaria saltatu zuten gonbidatuak edo oparian sartu ez ziren lagunak. Gastu bakoitzak ordaintzaile bakarra du, eta banaketako gainerako guztiek bere zatia zor diote. Xehetasunak [gastuak banatzea](page:feature/split-expenses) orrian daude.
  - heading: Gorde paperak
    body: Gehitu oharrak gastu bati, hala nola kostuak zer estaltzen zuen. Iruzkinak dagokien **gastuaren ondoan** geratzen dira, beraz “pastela 45 £ zen ala 54 £?” galdera eta bere erantzuna toki berean bizi dira. Iruzkinek 500 karaktere dituzte gehienez, fidantza bati buruzko galdera egiteko nahikoa.
  - heading: Antolatzailearen kontrolak
    body: Lankidetza irekiak edozein kideri uzten dio gastuak gehitzen eta editatzen, opari txiki baterako ondo dagoena. Ezkontza edo festa handiago baterako, aukeratu **Kudeatutako taldea** aurrezarpena. Administratzaileek kide berri bakoitza onartzen dute, eta sortzaileek eta administratzaileek bakarrik alda ditzakete gastuak. Gonbidatu jendea esteka edo QR kode batekin; onarpena aktibatuta, administratzaile batek pertsona bakoitza sartzen uzten du, beraz gonbidatuen zerrendak gonbidatuen zerrenda izaten jarraitzen du. Ekitaldia amaitzen denean, blokeatu taldea zenbakiak lekuan geratzeko.
  - heading: Kitatu festaren ondoren
    body: Azken faktura sartu denean, saldoek **nork nori zor dion** erakusten dute, eta Side Badger-ek denak kitatzen dituen ordainketa-zerrenda labur bat proposatzen du. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa taldean. Side Badger-ek ez du inoiz dirurik mugitzen, beraz taldeak kontua eramaten du transferentziak zuen banku-aplikazioetan egiten diren bitartean. [Kitatzea](page:feature/settle-up) orriak erakusten du nola bihurtzen den korapilo bat zerrenda labur.
