sections:
  - heading: "39 bahasa, dan dibuat untuk lebih banyak orang"
    body: "Gunakan Side Badger dalam 39 bahasa, termasuk bahasa Arab, Persia, dan Urdu yang ditulis dari kanan ke kiri. Setiap orang dalam grup bisa memilih bahasanya sendiri, jadi halaman grup bisa berbahasa Arab bagi satu orang dan berbahasa Inggris bagi orang berikutnya. Side Badger juga dibuat dengan mempertimbangkan pengguna keyboard dan pembaca layar, dan warna anggota disertai pola, sehingga Anda tidak perlu membedakan hijau dari merah."
faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah semua orang perlu akun?"
      a: "Ya, akun gratis. Setiap orang memverifikasi emailnya sebelum menambahkan apa pun."
    - q: "Apakah ada aplikasinya?"
      a: "Side Badger berjalan di peramban. Masuk, lalu tambahkan ke layar utama atau dock agar terbuka seperti aplikasi. Pengaturan di dalam aplikasi menunjukkan caranya. Tidak ada versi toko aplikasi dan tidak ada mode offline."
    - q: "Apakah Side Badger memindahkan uang?"
      a: "Tidak. Side Badger mencatat hitungan dan menyarankan pembayaran, dan Anda membayar satu sama lain dengan cara apa pun yang Anda suka. Setelah itu Anda mencatat pembayarannya. Lihat [pelunasan](page:feature/settle-up)."
    - q: "Bisakah seseorang keluar dengan utang?"
      a: "Tidak. Tidak ada yang bisa keluar dari grup selagi masih berutang atau dihutangi, jadi mereka melunasi dulu."
    - q: "Berapa banyak orang yang bisa bergabung dalam satu grup?"
      a: "Hingga 50 orang dalam satu grup. Undang mereka dengan tautan atau kode QR, dan aktifkan persetujuan jika Anda ingin admin meloloskan tiap orang."
    - q: "Bagaimana dengan perjalanan yang memakai lebih dari satu mata uang?"
      a: "Saldo disimpan terpisah untuk setiap mata uang. Lihat [beberapa mata uang](page:feature/multiple-currencies)."
