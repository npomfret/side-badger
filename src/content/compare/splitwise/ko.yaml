      sideBadger: "일일 한도 없음."
      source: pro-help
    - feature: "그룹 역할과 권한"
      other: "도움말 센터에 따르면 그룹 관리자나 특별 권한을 지원하지 않아요."
      sideBadger: "관리자, 멤버, 뷰어. 사전 설정 두 가지 또는 직접 정하는 권한, 참여 승인, 끝났을 때 쓰는 잠금."
      source: permissions-help
    - feature: "영수증 스캔"
      other: "Pro 기능이에요. 영수증 사진을 스캔하고, Pro의 품목별 분할로 품목을 사람에게 배정할 수 있어요."
      sideBadger: "스캔 크레딧 없이 무료예요. 합계, 날짜, 장소를 채워 줄 테니 확인만 하면 되고, 품목을 사람에게 배정하지는 않아요."
      source: pro
    - feature: "통화 환산"
      other: "Pro 기능이에요. “변환” 버튼을 누르면 Splitwise가 그 시점의 환율로 그룹의 지출을 기본 통화로 환산해요."
      sideBadger: "무료예요. 지출을 입력할 때마다 현재 환율이나 실제로 적용받은 환율로 환산하세요. 원래 금액은 지출에 그대로 남아요."
      source: currencies-help
    - feature: "통화와 언어"
      other: "홈페이지 표현대로 100개 이상의 통화와 7개 이상의 언어."
      sideBadger: "133개 통화와 39개 언어. 그룹의 모든 사람이 각자 언어를 고를 수 있어요."
      source: home
    - feature: "사용 환경"
      other: "iPhone과 Android 앱, 그리고 웹."
      sideBadger: "브라우저에서 사용합니다. 로그인한 다음 홈 화면에 추가하면 앱처럼 열려요. 앱 스토어에는 없어요."
      source: home
    - feature: "분할 방식"
      other: "똑같이, 정확한 금액으로, 비율로, 지분별로, 조정별로, 또는 품목별로."
      sideBadger: "지출 하나에 결제자는 한 명이고, 똑같이, 정확한 금액으로, 또는 비율로 나눕니다. 지분별이나 품목별 분할은 없어요."
      source: split-help
    - feature: "오프라인 사용"
      other: "핵심 기능 중 하나로 오프라인 모드를 내세워요."
      sideBadger: "없어요. 인터넷 연결이 필요해요."
      source: home
    - feature: "결제와 은행"
      other: "일부 지역에서는 앱 안에서 돈을 보낼 수 있어요. 미국의 Splitwise Pay, 미국 달러 잔액에 대한 Venmo, PayPal, 그리고 일부 유럽 국가의 Pay by Bank이며, Pay by Bank는 개인 입출금 계좌를 연결합니다."
      sideBadger: "여러분의 돈을 절대 건드리지 않고 은행 정보도 요구하지 않아요. 원하는 방법으로 서로 지불한 다음 결제를 기록하세요."
      source: payments-help
    - feature: "차트와 기본 분할"
      other: "둘 다 Pro 기능이에요."
      sideBadger: "둘 다 없음."
      source: pro
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "사이드 배저는 Splitwise의 무료 대안인가요?"
      a: "그룹에서 비용을 나누는 용도라면 그래요. 계산만 하는 게 아니라 댓글, 질문, 목록, 투표, 그룹 역할까지 있고, 영수증 스캔과 통화 환산도 무료예요. 앱 스토어 앱, 오프라인 사용, 앱 안에서의 결제가 필요하다면 그건 Splitwise에는 있고 사이드 배저에는 없어요."
    - q: "Splitwise 내용은 어디서 가져왔나요?"
      a: "Splitwise 자체 페이지, 즉 홈페이지, Pro 페이지, 도움말 센터예요. 표의 각 행은 출처 페이지로 연결되고, 표 위의 날짜는 우리가 읽은 시점을 알려 줍니다. 분기마다 다시 확인해요."
    - q: "사이드 배저는 계속 무료인가요?"
      a: "사이드 배저의 모든 기능은 오늘 기준으로 무료예요. 바뀌게 되면 먼저 알려 드릴게요. 자세한 내용은 [가격 페이지](page:pricing)에 있어요."
    - q: "그룹의 모든 사람이 옮겨야 하나요?"
      a: "네. 그룹의 모든 사람에게 무료 사이드 배저 계정이 필요하며, 링크나 QR 코드로 참여할 수 있어요."
    - q: "사이드 배저에는 모바일 앱이 있나요?"
      a: "앱 스토어에는 없어요. 브라우저에서 실행되니, 휴대폰에서 로그인한 다음 홈 화면에 추가하면 앱처럼 열려요. 방법은 [사용 방법](page:how-it-works)에서 볼 수 있어요."
