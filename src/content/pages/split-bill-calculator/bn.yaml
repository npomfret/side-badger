meta:
  title: "বিল ভাগের ক্যালকুলেটর: কে কার কাছে ঋণী, ঝটপট | Side Badger"
  description: "কে দিল, কে ঋণী, কে কাকে দেবে: কয়েক সেকেন্ডেই গোছানো। সমান ভাগে, সঠিক পরিমাণে বা শতাংশে ভাগ করুন। বিনামূল্যে, ব্রাউজারেই চলে, কিছু সেভ বা পাঠানো হয় না।"
h1: "বিল ভাগের ক্যালকুলেটর"
navLabel: "বিল ভাগের ক্যালকুলেটর"
lead: "কে কীসের জন্য কত দিয়েছে লিখুন, আর ক্যালকুলেটর বলে দেবে কে কার কাছে ঋণী, সঙ্গে হিসাব মেটানোর জন্য পেমেন্টের একটি ছোট তালিকা। এটি আপনার ব্রাউজারেই চলে, কিছু সেভ করে না আর টাকাও নাড়াচাড়া করে না। ট্যাব বন্ধ করার পরেও গ্রুপের হিসাবটা থেকে যাক, এমন চাইলে Side Badger-এর [খরচ ভাগ করা](page:feature/split-expenses) আর [হিসাব মেটানো](page:feature/settle-up) একই অঙ্ক কষে এবং সেগুলো জমা রাখে।"
cta:
  heading: "অঙ্কগুলো পছন্দ হলো? তাহলে রেখে দিন।"
  body: "ট্যাব বন্ধ করলেই এই ক্যালকুলেটর সব ভুলে যায়, ঠিক সেই মানুষটির মতো, যে হলফ করে বলে গতবার সে-ই দিয়েছিল। Side Badger-এর একটি গ্রুপ খরচগুলো রেখে দেয়, সবার ব্যালেন্স হালনাগাদ রাখে আর পেমেন্ট রেকর্ড করে। এটি বিনামূল্যে, কোনো বিজ্ঞাপন নেই, দৈনিক কোনো সীমা নেই।"
sections:
  - heading: "হিসাবটা কীভাবে কাজ করে"
    body: "প্রতিটি খরচের জন্য ক্যালকুলেটর প্রত্যেকের ভাগ বের করে। আপনার বেছে নেওয়া মানুষদের মধ্যে খরচটা আপনি সমান ভাগে, সঠিক পরিমাণে বা শতাংশে ভাগ করতে পারেন। তারপর প্রত্যেকের ব্যালেন্স হলো সে যা দিয়েছে, তার থেকে তার যা দেওয়ার কথা তা বাদ দিলে যা থাকে। প্লাস চিহ্নের মানে গ্রুপ তাকে দেবে, মাইনাস চিহ্নের মানে সে গ্রুপকে দেবে। ব্যালেন্সগুলোর যোগফল সবসময় শূন্য, কারণ একজনের যা পাওনা, বাকিদের ঠিক ততটাই দেনা।"
  - heading: "পেমেন্টের তালিকা ছোট কেন"
    body: "প্রতিটি রসিদ আলাদা করে মেটানোর দরকার নেই। প্রত্যেকের ব্যালেন্স জানা হয়ে গেলে ক্যালকুলেটর যার দেনা সবচেয়ে বেশি তাকে জুড়ে দেয় যার পাওনা সবচেয়ে বেশি তার সঙ্গে, একটি পেমেন্টে যতটা মেটানো যায় ততটা মিটিয়ে দেয়, আর তালিকা ধরে এগোতে থাকে যতক্ষণ না সবাই শূন্যে পৌঁছায়। ব্যালেন্স আছে এমন মানুষের সংখ্যার চেয়ে এক কম পেমেন্টের বেশি এর কখনও লাগে না, আর বিল ধরে ধরে মেটানোর চেয়ে প্রায়ই কম লাগে। এটি পেমেন্টের একটি ছোট তালিকা দেয়, সম্ভাব্য সবচেয়ে ছোট তালিকার প্রতিশ্রুতি দেয় না।"
  - heading: "ক্যালকুলেটর যা করে না"
    items:
      - "**একাধিক মুদ্রা সামলায় না।** একটি বেছে নিয়ে পুরো হিসাবে সেটাই ব্যবহার করুন। অ্যাপ প্রতিটি মুদ্রার ব্যালেন্স আলাদা রাখে, আর বর্তমান এক্সচেঞ্জ রেটে একটি খরচ রূপান্তর করতে পারে, যে রেট আপনি বদলাতে পারেন।"
      - "**কিছু সেভ করে না।** ট্যাব বন্ধ করলে সংখ্যাগুলো চলে যায়। রেখে দিতে চাইলে লিঙ্ক কপি করুন। সেটি আপনার সংখ্যাগুলো # চিহ্নের পরে ধরে রাখে, যা আপনার ব্রাউজার কখনও সার্ভারে পাঠায় না, আর যাকে লিঙ্কটা পাঠাবেন সে-ও সেগুলো পড়তে পারবে।"
      - "**টাকা নাড়াচাড়া করে না।** কে কাকে দেবে তা এটি বলে দেয়। আপনারা যেভাবে খুশি একে অপরকে দেন, তারপর গ্রুপের হিসাব অ্যাপে রাখা হলে পেমেন্টটা সেখানে রেকর্ড করেন।"
      - "**বাড়তি পয়সা এলোমেলোভাবে বেছে নেয় না।** কোনো বিল সমান ভাগে না মিললে বাড়তি পয়সাগুলো তালিকার প্রথম দিকের মানুষদের কাছে যায়, যাতে মোট ঠিকই মেলে। অ্যাপে বাড়তি পয়সা এলোমেলোভাবে একজনের কাছে যায়, তাই সেটা সবসময় একই জনের কাছে যায় না।"
      - "**সীমা ছাড়ায় না।** ক্যালকুলেটরে 2 থেকে 20 জন থাকতে পারে, আর একটি খরচ সর্বোচ্চ 999,999.99 পর্যন্ত হতে পারে, অ্যাপের মতোই।"
