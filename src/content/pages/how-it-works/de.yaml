sections:
  - heading: 39 Sprachen, gebaut für mehr Menschen
    body: Nutze Side Badger in 39 Sprachen, darunter die Rechts-nach-links-Sprachen Arabisch, Persisch und Urdu. Alle in der Gruppe können ihre eigene wählen, die Gruppenseite kann also für eine Person arabisch und für die nächste englisch sein. Es ist außerdem mit Blick auf Tastatur- und Screenreader-Nutzung gebaut, und Mitgliederfarben kommen mit Mustern, sodass du Grün nicht von Rot unterscheiden musst.
faq:
  heading: Fragen
  items:
    - q: Braucht jede Person ein Konto?
      a: Ja, ein kostenloses. Jede Person bestätigt ihre E-Mail-Adresse, bevor sie etwas hinzufügt.
    - q: Gibt es eine App?
      a: Es läuft im Browser, und du kannst es zum Home-Bildschirm oder Dock hinzufügen, damit es sich wie eine App öffnet. Es gibt keine App-Store-Version und keinen Offline-Modus.
    - q: Bewegt Side Badger Geld?
      a: Nein. Es führt die Rechnung und schlägt Zahlungen vor, und ihr zahlt einander, wie ihr wollt. Danach erfasst du die Zahlung. Siehe [Abrechnen](page:feature/settle-up).
    - q: Kann jemand mit Schulden gehen?
      a: Nein. Niemand kann eine Gruppe verlassen, solange er noch Geld schuldet oder bekommt, deshalb wird vorher abgerechnet.
    - q: Wie viele Leute können einer Gruppe beitreten?
      a: Bis zu 50 Personen pro Gruppe. Lade sie mit einem Link oder QR-Code ein und schalte die Freigabe ein, wenn ein Admin jede Person hereinlassen soll.
    - q: Und Reisen mit mehr als einer Währung?
      a: Salden werden für jede Währung getrennt geführt. Siehe [Mehrere Währungen](page:feature/multiple-currencies).
