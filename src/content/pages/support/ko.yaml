meta:
  title: "도움말과 지원 | 사이드 배저"
  description: "비밀번호를 잊었거나, 링크가 열리지 않거나, 결제를 잘못 기록했나요? 사이드 배저에서 사람들이 자주 막히는 문제의 짧은 답변과 문의 방법입니다."
h1: "도움말과 지원, 대기 음악은 빼고"
navLabel: "도움말과 지원"
lead: "비밀번호를 잊은 순간부터 그룹을 영영 닫는 일까지, 사람들이 자주 막히는 문제의 짧은 답변입니다. 각 답변에서 더 자세히 설명하는 페이지로 이동할 수 있어요. 찾는 질문이 없나요? 앱 안에서 알려 주시거나 메일을 보내 주세요."
cta:
  heading: "도움받으러 왔다가 나누기까지 하고 가실래요?"
  body: "아직 계정이 없나요? 그룹을 시작하고, 링크를 공유하고, 첫 지출을 추가하세요. 무료이며 광고도 일일 한도도 없습니다."
groups:
  - heading: "로그인"
    items:
      - q: "비밀번호를 잊으셨나요?"
        a: "가장 훌륭한 오소리에게도 생기는 일이에요. **로그인** 화면에서 **비밀번호를 잊으셨나요?** 항목을 선택하고 계정 이메일을 입력한 다음, 보내 드리는 이메일의 링크를 따라 새 비밀번호를 정하세요. 계정에 필요한 나머지는 [사용 방법](page:how-it-works)에서 확인할 수 있어요."
      - q: "가입했는데 아무것도 추가할 수 없어요. 왜죠?"
        a: "대부분은 아직 이메일이 인증되지 않은 경우예요. 인증 이메일의 링크를 열거나, 안내 배너에서 **인증 이메일 재전송**을 선택해 새 이메일을 받으세요. 인증이 끝났다면 그룹이 잠겨 있거나 그룹의 권한상 할 수 없는 것일 수 있어요. 뷰어는 모든 것을 볼 수 있지만 아무것도 바꿀 수 없습니다. 자세한 내용은 [그룹과 권한](page:feature/groups-and-permissions)에서 설명합니다."
      - q: "이메일이나 비밀번호는 어떻게 바꾸나요?"
        a: "**설정**에서 **이메일 변경** 또는 **비밀번호 변경**을 선택하세요. 둘 다 먼저 현재 비밀번호를 물어보고, 새 이메일 주소는 그 주소로 보내 드리는 링크로 인증해야 해요. 계정에 대해서는 [사용 방법](page:how-it-works)에서 다룹니다."
      - q: "Google이나 Apple로 로그인할 수 있나요?"
        a: "아니요. 이메일 주소와 12자 이상의 비밀번호만 있으면 되고, 내 휴대폰이나 컴퓨터에서는 **로그인 상태 유지**를 체크할 수 있어요. 시작하는 데 필요한 나머지는 [웹 앱](page:feature/web-app) 페이지에서 확인하세요."
  - heading: "그룹에 참여하기"
    items:
      - q: "누군가 초대 링크를 보냈어요. 어떻게 참여하나요?"
        a: "링크를 열고 로그인하거나 무료 계정을 만드세요. 그룹 미리보기가 나오면, 그곳에서 사람들에게 보일 이름을 고르고 **그룹 가입**을 누르면 됩니다. 참여하는 전체 과정은 [그룹과 권한](page:feature/groups-and-permissions)에서 볼 수 있어요."
      - q: "“승인 대기 중”이라고 나와요. 제가 뭘 잘못했나요?"
        a: "전혀 아니에요. 이 그룹은 관리자가 한 사람씩 들여보내는 방식이라 가입 요청이 관리자에게 전달되었고, 관리자 중 한 명이 승인하기 전에는 안을 볼 수 없습니다. 직접 만나서 슬쩍 재촉하는 건 괜찮아요. 승인 방식은 [그룹과 권한](page:feature/groups-and-permissions)에서 설명합니다."
      - q: "링크가 유효하지 않거나 만료되었다고 나와요."
        a: "초대 링크는 만든 사람이 정한 기간 동안 유효하며, 짧게는 15분부터 길게는 5일까지입니다. 그룹의 누군가에게 새 링크를 요청하거나, 같은 공간에 있다면 QR 코드를 보여 달라고 하세요. 초대에 대해서는 [사용 방법](page:how-it-works)에서 다룹니다."
  - heading: "지출"
    items:
      - q: "지출은 어떻게 추가하나요?"
        a: "그룹을 열고 **비용 추가**를 선택하세요. 무엇이었는지, 얼마인지, 누가 결제했고 누가 함께 나누는지 입력한 다음, 똑같이, 정확한 금액으로, 또는 비율로 나누세요. 모든 옵션은 [지출 나누기](page:feature/split-expenses)에서 차례로 설명합니다."
      - q: "월세를 매달 자동으로 반복할 수 있나요?"
        a: "저절로는 안 돼요. 반복 지출이 없거든요. 지난달 월세를 열고 **비용 복사**를 선택하면 양식이 채워진 채로 열려서, 새 날짜와 바뀐 부분만 고치면 됩니다. 복사에 대한 자세한 내용은 [지출 나누기](page:feature/split-expenses)에 있어요."
      - q: "금액을 잘못 입력했어요. 고칠 수 있나요?"
        a: "네. 그룹의 권한이 허용하고 그룹이 잠겨 있지 않다면 지출을 수정할 수 있어요. 이전 버전이 남아 있어서 무엇이 바뀌었는지 누구도 말만 믿을 필요가 없습니다. [지출 나누기](page:feature/split-expenses)에서 설명해요."
      - q: "지출이 이상해 보이는데 제 것이 아니에요. 어떻게 하죠?"
        a: "그 지출에서 **질문이 있습니다**를 선택하고 이유를 적으세요. 질문한 사람이나 관리자가 질문을 닫을 때까지 그 지출 전체가 모두의 잔액에서 제외됩니다. 버튼이 없나요? 지출에 포함된 사람만 질문할 수 있고, 관리자가 먼저 그룹 설정에서 **지출 질문 허용**을 켜야 해요. 대화를 부드럽게 푸는 방법은 [이의가 제기된 지출 가이드](page:guide/what-to-do-when-someone-disputes-a-shared-expense)에 있습니다."
  - heading: "결제"
    items:
      - q: "사이드 배저가 돈을 보내 주나요?"
        a: "아니요, 사이드 배저는 돈을 절대 옮기지 않습니다. 계좌 이체든 현금이든 편한 방법으로 서로 지불한 다음, 잔액이 맞춰지도록 결제를 기록하세요. 처음부터 끝까지의 과정은 [그룹 여행 후 정산하는 방법](page:guide/how-to-settle-up-after-a-group-trip)에서 볼 수 있어요."
      - q: "결제는 어떻게 기록하나요?"
        a: "그룹에서 **정산하기**를 선택하고, 누가 지불했고 누가 받았는지 고른 뒤 금액을 입력하거나 **빠른 정산** 버튼으로 채우고, **정산 기록**을 선택하세요. 일부만 지불했나요? 지불한 만큼만 기록하면 나머지는 잔액에 남습니다. 자세한 내용은 [정산하기](page:feature/settle-up)에서 설명해요."
      - q: "결제를 잘못 기록했어요. 고칠 수 있나요?"
        a: "기록한 사람이 그룹의 **정산** 내역에서 수정할 수 있고, 기록한 사람이나 관리자가 삭제할 수 있어요. 삭제하면 잔액에서 빠집니다. 이후 그룹을 나간 사람이 포함된 결제는 수정할 수 없습니다. 내역에 대해서는 [정산하기](page:feature/settle-up)에서 다룹니다."
  - heading: "알림과 홈 화면"
    items:
      - q: "알림은 어떻게 켜나요?"
        a: "**설정**에서 **푸시 알림**을 켜고, 브라우저가 물어보면 허용하세요. 브라우저가 이미 차단한 상태라면 먼저 브라우저 자체 설정에서 허용해야 해요. 기기마다 따로 켜야 하고 전달이 보장되지는 않으므로, 알림은 약속이 아니라 슬쩍 건네는 신호로 생각하세요. [웹 앱](page:feature/web-app) 페이지에서 설명합니다."
      - q: "iPhone에서 알림이 오지 않는 이유는 뭔가요?"
        a: "iPhone이나 iPad에서는 홈 화면에 추가한 앱에서만 작동하고, 브라우저 탭에서는 절대 작동하지 않아요. 홈 화면에 추가하고, 홈 화면 아이콘으로 연 다음, **설정**에서 알림을 켜세요. 알림이 무엇을 알려 주는지는 [함께 계획하기](page:feature/plan-together)에서 볼 수 있어요."
      - q: "다운로드할 앱이 있나요?"
        a: "앱 스토어에는 없어요. 사이드 배저는 브라우저에서 실행되니까요. 로그인한 다음 **설정**의 **홈 화면 또는 Dock에 추가**를 따라 하면 앱처럼 자기만의 창으로 열립니다. 기기별 방법은 [웹 앱](page:feature/web-app) 페이지에 있어요."
  - heading: "나가기, 보관, 잠금, 닫기"
    items:
      - q: "그룹은 어떻게 나가나요?"
        a: "먼저 정산한 다음 **그룹 나가기**를 선택하세요. 통화 하나에서라도 줄 돈이나 받을 돈이 있을 때, 내가 포함된 지출에 열린 질문이 있을 때, 내가 마지막 관리자이거나 유일한 멤버일 때는 나갈 수 없고, 다시 돌아오려면 새 초대가 필요합니다. 자세한 내용은 [그룹과 권한](page:feature/groups-and-permissions)에 있어요."
      - q: "오래된 그룹을 대시보드에서 치우려면 어떻게 하나요?"
        a: "**그룹 보관**을 선택하세요. 내 대시보드에서만 사라지고 다른 사람의 화면에서는 사라지지 않으며, 그룹을 열어 계속 쓸 수 있고 **그룹 보관 취소**를 선택하면 다시 돌아옵니다. 보관, 잠금, 닫기의 차이는 [그룹과 권한](page:feature/groups-and-permissions)에서 비교해요."
      - q: "여행이 끝났어요. 숫자가 더 바뀌지 않게 할 수 있나요?"
        a: "네. 관리자가 그룹 설정에서 **그룹 잠금**을 켜면, 관리자가 잠금을 해제할 때까지 아무도 지출을 추가하거나 수정하거나, 새 결제를 기록하거나, 목록과 투표를 바꿀 수 없어요. 그룹과 내역은 모두가 계속 읽을 수 있고, 뒤늦은 택시비가 슬쩍 끼어들 일도 없습니다. [그룹과 권한](page:feature/groups-and-permissions)에서 설명해요."
      - q: "그룹을 삭제할 수 있나요?"
        a: "관리자가 그룹 이름을 입력해 확인한 뒤 **그룹 닫기**로 닫을 수 있어요. 닫으면 되돌릴 수 없고 모두가 그룹을 쓸 수 없게 되므로, 눈에 안 보이게만 하고 싶다면 대신 보관하세요. 자세한 조건은 [그룹과 권한](page:feature/groups-and-permissions)에 있어요."
contact:
  heading: "아직도 막혔나요?"
  items:
    - q: "버그를 찾았거나 바뀌었으면 하는 게 있나요?"
      a: "앱 안에서 알려 주세요. 계정 메뉴에서 **피드백**을 선택하고 **피드백 보내기**를 선택한 다음, **문제 신고**, **도움 요청**, **기능 요청** 중에서 고르세요. 도움이 된다면 스크린샷을 첨부하세요. 답변은 같은 스레드에서 확인할 수 있어요."
    - q: "이메일로 보내고 싶으신가요?"
      a: "아래 주소로 보내 주세요. 어떤 그룹에 관한 것인지, 무엇을 했는지, 어떻게 되기를 기대했는지 알려 주세요. 하소연은 환영이지만 비밀번호는 안 돼요. 절대 보내지 마세요."
  emailLabel: "이메일로 문의하기"
  email: support@sidebadger.me
