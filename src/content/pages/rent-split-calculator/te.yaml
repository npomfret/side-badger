faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "గది పరిమాణం, ఆదాయం: ఏది న్యాయం?"
      a: "ఎప్పుడూ ఒకటే కాదు. తాము పడుకునే చోటుకు చెల్లించే రూమ్‌మేట్లకు గది పరిమాణం సరిపోతుంది. జంటలకు, చాలా వేర్వేరు జీతాలు ఉన్న స్నేహితులకు ఆదాయం సరిపోతుంది. మొదటి అద్దె రోజుకు ముందే ఒప్పుకోండి, తర్వాత కాదు."
    - q: "బిల్లులను కూడా అలాగే పంచాలా?"
      a: "రూమ్‌మేట్లకు సాధారణంగా కాదు. కరెంటు, బ్రాడ్‌బ్యాండ్ అందరూ వాడతారు, కాబట్టి ఉదాహరణలో లాగే సమానంగా పంచడం తేలిక. ఆదాయం ప్రకారం అయితే, కాలిక్యులేటర్ బిల్లులకు అద్దె వాటాలనే ఇస్తుంది."
    - q: "చదరపు అడుగులు వాడవచ్చా?"
      a: "అవును. ft² ఎంచుకుని మీ విస్తీర్ణాలను చదరపు అడుగులలో టైప్ చేయండి. యూనిట్ కేవలం ఒక లేబుల్, అందరూ ఒకటే వాడినంత కాలం వాటాలు అవే వస్తాయి."
    - q: "కాలిక్యులేటర్ ఉచితమా?"
      a: "అవును. ఉచితం. ప్రకటనలు లేవు. రోజువారీ పరిమితులు లేవు. ఖాతా కూడా అవసరం లేదు."
