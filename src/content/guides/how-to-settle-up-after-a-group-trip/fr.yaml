meta:
  title: "Comment régler les comptes après un voyage en groupe | Side Badger"
  description: "Réglez avant la dispersion. Dix dettes emmêlées deviennent quatre paiements, enregistrés à mesure, et un paiement partiel passe aussi. Calculs pour cinq amis."
h1: "Comment régler les comptes après un voyage en groupe"
navLabel: "Régler après un voyage"
lead: "Réglez avant que tout le monde se disperse. Ajoutez la dernière dépense, ouvrez les soldes du groupe et payez ce que vous devez d'après la courte liste, comme vous voulez. Puis enregistrez chaque paiement dans Side Badger pour que le solde s'efface pour tout le groupe. Pour cinq amis et cinq dépenses, dix dettes emmêlées se réduisent à quatre paiements."
cta:
  heading: "Bouclez les comptes avant que les photos n'arrivent"
  body: "Créez un compte gratuit, lancez un groupe pour le prochain voyage et ajoutez chaque dépense au fur et à mesure. La courte liste de paiements vous attend quand vous arrivez à l'aéroport. Envie de voir d'abord [comment fonctionne le règlement](page:feature/settle-up) ?"
sections:
  - heading: "Cinq amis, cinq dépenses, une salle d'embarquement"
    body: "Mo, Ines, Raf, Tess et Uma ont passé une semaine sur la côte. Mo a réservé l'appartement et payé les courses, Ines a réglé la sortie en bateau et Raf a pris en charge le grand dîner. Tess a pris le taxi de l'aéroport avec Uma et Mo, parce qu'Ines et Raf avaient le train. La carte d'Uma était restée à la maison, donc elle n'a rien payé. Cela fait cinq dépenses et 1 700 € en tout, et dans la salle d'embarquement, personne n'aurait su dire qui était en avance."
  - heading: "Dix dettes, quatre paiements"
    body: "L'appartement, le bateau, le dîner et les courses sont partagés à parts égales entre les cinq. Cela fait 200 €, 50 €, 60 € et 18 € chacun, donc Ines et Raf doivent 328 € chacun. Le taxi est partagé à trois, à 20 € chacun, donc Mo, Tess et Uma doivent 348 €. Mo a payé 1 090 € et doit 348 €, ce qui lui laisse 742 € à recevoir. Tous les autres ont payé moins que ce qu'ils doivent. Au final, Uma doit 348 €, Tess 288 €, Ines 78 € et Raf 28 €, et ces montants font les 742 € de Mo. Réglez chaque paire de personnes directement et vous obtenez dix dettes distinctes. Side Badger suggère plutôt quatre paiements, tous pour Mo."
  - heading: "Réglez avant que tout le monde se disperse"
    body: "Le meilleur moment, c'est la dernière soirée ou le trajet du retour, quand tout le monde est encore au même endroit et qu'une dette de 28 € est facile à mentionner. Ajoutez d'abord toutes les dépenses, taxi compris. Personne ne peut quitter un groupe tant qu'il doit de l'argent ou qu'on lui en doit, donc le compte doit de toute façon se clore un jour."
    items:
      - "**Vérifiez la liste.** Ouvrez le groupe et regardez les **Soldes**. Par défaut, vous voyez les dettes qui vous concernent. Choisissez **Tout afficher** pour voir la liste de tout le groupe."
      - "**Payez comme vous voulez.** Virement bancaire, espèces, un service rendu depuis les dernières vacances. Side Badger ne fait pas circuler l'argent."
      - "**Enregistrez-le.** Choisissez **Régler**. Sous **Règlement rapide**, chaque bouton est l'un de vos paiements suggérés, et en choisir un remplit le montant. Ajoutez une **Note** comme virement bancaire, vérifiez la **Date** (elle ne peut pas être dans le futur) et choisissez **Enregistrer Règlement**."
      - "**Regardez-le s'effacer.** Le solde se met à jour pour tout le monde. Quand le dernier paiement est enregistré, les **Soldes** affichent **Tout est réglé !**"
  - heading: "Payer une partie maintenant, le reste plus tard"
    body: "Uma peut envoyer 200 € ce soir et le reste à la fin du mois. Elle enregistre 200 €, et le formulaire l'avertit qu'elle devra encore 148 € à Mo ensuite, soit 348 € moins 200 €. Enregistrez-le, et les 148 € restent sur son solde jusqu'à ce qu'elle enregistre le reste. L'avertissement fonctionne aussi dans l'autre sens. Si un zéro de trop transforme 348 € en 3 480 €, le formulaire dit qu'elle ne doit que 348 € à Mo et qu'enregistrer créerait une dette dans le sens inverse. Corrigez le zéro avant d'enregistrer."
  - heading: "Corriger les erreurs, et applaudir les paiements"
    items:
      - "**Un paiement erroné.** Seule la personne qui a enregistré un paiement peut le modifier. Elle ou un admin du groupe peut le supprimer, et il peut alors être enregistré de nouveau."
      - "**Un paiement qui mérite d'être remarqué.** Chaque paiement enregistré se trouve sous **Règlements** avec sa date et sa note, où tout le groupe peut le voir et réagir. Mo peut choisir **Célébrer** quand les derniers 148 € d'Uma arrivent."
      - "**La fin.** Quand tous les soldes sont à zéro, un admin peut verrouiller le groupe pour que les chiffres ne bougent plus."
  - heading: "Ce que Side Badger ne fait pas ici"
    items:
      - "Il ne fait jamais circuler d'argent. Il n'a ni liens de paiement ni demandes de paiement, donc un paiement dans l'appli est l'enregistrement d'un paiement fait ailleurs."
      - "Il n'envoie aucun rappel. Relancer un paiement en retard reste à votre charge."
      - "Il ne fixe pas d'échéances. La date à laquelle le reste des 148 € d'Uma est dû, c'est au groupe d'en convenir."
      - "Les paiements suggérés forment une courte liste, pas la promesse de la plus courte possible. Ils sont calculés par devise, donc un voyage payé en euros et en livres obtient une liste pour chacune."
