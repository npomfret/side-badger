meta:
  title: "ఉమ్మడి ఖర్చుపై ఎవరైనా అభ్యంతరం చెబితే | Side Badger"
  description: "గుచ్చే మెసేజ్ వద్దు. ఖర్చునే ప్రశ్నించండి, మాట్లాడుకునేంత వరకు అది అందరి బ్యాలెన్స్‌ల నుంచి తప్పుకుంటుంది. £45 పార్టీ వైన్‌తో వివరంగా."
h1: "ఉమ్మడి ఖర్చుపై ఎవరైనా అభ్యంతరం చెబితే ఏం చేయాలి"
navLabel: "అభ్యంతరం ఉన్న ఖర్చులు"
lead: "గుచ్చే మెసేజ్ పంపకుండా, ఖర్చుపైనే ఒక ప్రశ్న లేవనెత్తండి. ప్రశ్న తెరిచి ఉన్నంత వరకు మొత్తం ఖర్చు అందరి బ్యాలెన్స్‌ల నుంచి బయటే ఉంటుంది. కామెంట్లలో మాట్లాడుకోండి, గ్రూప్ ఒప్పుకుంటే విభజనను సవరించండి, అడిగిన వ్యక్తి లేదా అడ్మిన్ ప్రశ్నను మూసివేయనివ్వండి."
cta:
  heading: "ఇబ్బందికరమైన ప్రశ్నను మర్యాదగా అడగండి"
  body: "ఉచిత ఖాతా తెరవండి, ఫ్లాట్ కోసం ఒక గ్రూప్ మొదలుపెట్టండి, ఖర్చు ప్రశ్నలను ఆన్ చేయమని అడ్మిన్‌ను అడగండి, ఎవరైనా ఆన్ చేసే వరకు అవి ఆఫ్‌లోనే ఉంటాయి. ముందు పరిచయం కావాలా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) లేదా [ఉచితంలో ఏముంది](page:pricing) చూడండి."
sections:
  - heading: "ముగ్గురు రూమ్‌మేట్లు, £45 వైన్"
    body: "పార్టీ తర్వాత Tom వైన్‌ను ఫ్లాట్ గ్రూప్‌లో జోడిస్తాడు. అది £45, Tom చెల్లించాడు, Tom, Priya, Aisha మధ్య సమానంగా పంచబడింది, అంటే ఒక్కొక్కరికి £15. Aisha తాగదు. Tom దాన్ని పార్టీ కోసం కొన్నాడు, పార్టీ [ఫ్లాట్](page:use-case/housemates) కోసమే, కాబట్టి అతను తప్పేమీ చేయలేదు. Aisha అడగడం కూడా తప్పు కాదు. ఇక్కడ ఎవరూ విలన్ కాదు. వివాదంలో ఉన్నది £15 వైన్ మాత్రమే, దాన్ని ఇబ్బందిగా మార్చే దారులు మాత్రం బోలెడు. ఇంటికి గుచ్చే మెసేజ్ పంపడం ఒకటి. ఖర్చుపై ప్రశ్న అడగడం మృదువైన దారి."
  - heading: "ప్రశ్న ఏం చేస్తుంది"
    body: "Aisha ఖర్చును తెరిచి ఒక ప్రశ్నను లేవనెత్తుతుంది. మొత్తం ఖర్చు అందరి బ్యాలెన్స్‌ల నుంచి తప్పుకుంటుంది, ఆమె వాటా మాత్రమే కాదు, మరేదీ ప్రభావితం కాదు. పెద్ద సరుకులు (£84), క్లీనర్ (£60) ఇంకా లెక్కలోనే ఉంటాయి, అంటే £28 + £20 = ఒక్కొక్కరికి £48. కాబట్టి వైన్ నిలిపి ఉన్నప్పుడు Aisha £48 బాకీ, Tomకు £36 రావాలి, Priyaకు £12 రావాలి. వైన్ గురించి ఫ్లాట్ ఏం నిర్ణయించినా, ఈలోపు ఎవరి బ్యాలెన్స్‌లోనూ అది ఉండదు. ఖర్చులో ఉన్న మరెవరైనా కూడా తమ సొంత ప్రశ్నను లేవనెత్తవచ్చు. దానిపై తెరిచి ఉన్న చివరి ప్రశ్న మూసివేసినప్పుడే వైన్ మళ్లీ బ్యాలెన్స్‌లలోకి వస్తుంది, ప్రశ్నను అడిగిన వ్యక్తి లేదా అడ్మిన్ మూసివేస్తారు."
  - heading: "మాట్లాడుకోవడం, తర్వాత సరిచేయడం"
    body: "Aisha ప్రశ్న ఖర్చు కామెంట్లలో పడుతుంది, కాబట్టి సమాధానాలు సరిగ్గా దాని కిందే ఉంటాయి. కామెంట్లు, ప్రశ్నల గురించి [కలిసి ప్లాన్ చేయండి](page:feature/plan-together)లో మరింత ఉంది. Tom, Priya చదివి, ఫ్లాట్ ఒక చర్చ చేసుకుంటుంది. వైన్ Tom, Priyaలదే అని నిర్ణయిస్తారు, ఎందుకంటే వాళ్లే తాగారు. మరో ఫ్లాట్ ముగ్గురి విభజననే ఉంచవచ్చు, లేదా మధ్యస్థంగా ఒప్పుకోవచ్చు, అదీ సరైనదే. మీరు ఒప్పుకున్నదాన్ని Side Badger నిల్వ చేస్తుంది, వైన్ గురించి దానికి అభిప్రాయం లేదు. Tom ఖర్చును సవరించి తనకు, Priyaకు మధ్య సమానంగా విభజిస్తాడు, అంటే ఒక్కొక్కరికి £22.50 (£45 ÷ 2). Aisha ఇక అందులో లేదు, కాబట్టి ఆమె ప్రశ్న పాత వెర్షన్‌తోనే పోతుంది, వైన్ మళ్లీ బ్యాలెన్స్‌లలో చేరుతుంది. పాత వెర్షన్ ఉంచబడుతుంది."
  - heading: "ఫలితాన్ని చదవడం"
    body: "వైన్ తిరిగి వచ్చాక Tomకు £58.50 రావాలి, Priya £10.50 బాకీ, Aisha £48 బాకీ. Side Badger రెండు పేమెంట్లను సూచిస్తుంది, రెండూ Tomకే. Aisha £48 అనేది వైన్ నిలిపి ఉన్నప్పుడు ఆమెకు ఉన్న అంకెనే, ఎందుకంటే ఆమె అందులో లేదు. Priya తనకు £12 రావాల్సిన స్థితి నుంచి £10.50 బాకీ పడే స్థితికి వచ్చింది, అది వైన్‌లో ఆమె £22.50 సగం. ముగ్గురి విభజన అలాగే నిలిచి ఉంటే, Aisha £63 బాకీ పడేది (£28 + £20 + £15). మొత్తం విభేదం విలువ £15. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత ప్రతి పేమెంట్‌ను **సెటిల్ చేయి** కింద నమోదు చేయండి. మిగతాది [లెక్క తేల్చడం](page:feature/settle-up)లో ఉంది."
  - heading: "జనం మీతో మాట్లాడుతూనే ఉండేలా ఎలా రాయాలి"
    body: "Aisha ప్రశ్న: “నేను వైన్ ఏమీ తాగలేదు. విభజనను ఒకసారి చూద్దామా?” ఇది చిన్నది, ఖర్చు పేరు చెబుతుంది, నిందించకుండా అడుగుతుంది. కొన్ని అలవాట్లు సాయపడతాయి."
    items:
      - >-
        **వ్యక్తి గురించి కాదు, ఖర్చు గురించి అడగండి.** “వైన్‌పై విభజనను ఒకసారి చూద్దామా?” సంభాషణను మొదలుపెడుతుంది. “మీ వైన్‌కు నాకెందుకు వేశారు?” మరో రకం సంభాషణను మొదలుపెడుతుంది.
      - >-
        **మీరు ఏం జరగాలనుకుంటున్నారో చెప్పండి.** “తాగినవాళ్లకే వేస్తే సరిపోతుందా?” అనేది గ్రూప్ అంగీకరించడానికి లేదా జవాబివ్వడానికి ఏదో ఒకటి ఇస్తుంది.
      - >-
        **ఒకటి రెండు వాక్యాల్లో కారణం చెప్పండి.** ఆ గడి **మీ ప్రశ్న**, దాన్ని ఖాళీగా వదలలేరు.
      - >-
        **సమాధానాలు ఒకే చోట ఉంచండి.** జవాబులు ఖర్చు కామెంట్లలో వెళ్తాయి, అవి సంబంధించిన అంకెల పక్కనే.
  - heading: "Side Badgerలో సెటప్ చేయండి"
    items:
      - >-
        **ప్రశ్నలను ఆన్ చేయండి.** అవి డిఫాల్ట్‌గా ఆఫ్‌లో ఉంటాయి. అడ్మిన్ గ్రూప్ **సెట్టింగ్‌లు** తెరిచి, **సాధారణ** ట్యాబ్‌లో **లక్షణాలు** కింద **ఖర్చు ప్రశ్నలను అనుమతించండి** ఆన్ చేసి **సేవ్ చేయి** ఎంచుకుంటారు. తర్వాత ఆఫ్ చేస్తే తెరిచి ఉన్న ప్రతి ప్రశ్నా తొలగిపోతుంది.
      - >-
        **ఒకటి లేవనెత్తండి.** ఖర్చును తెరిచి, విభజనలో మీ పేరు పక్కన **నాకు ఒక ప్రశ్న ఉంది** ఎంచుకోండి. **మీ ప్రశ్న**లో కారణం రాసి, మళ్లీ **నాకు ఒక ప్రశ్న ఉంది** ఎంచుకోండి. ఖర్చులో ఉన్నవాళ్లు మాత్రమే ఇలా చేయగలరు. ఖర్చుపై ఇప్పుడు **ప్రశ్నించబడింది** బ్యాడ్జ్ కనిపిస్తుంది.
      - >-
        **నిలిపి ఉన్నవాటిని కనుగొనండి.** ఖర్చుల జాబితాలో **ప్రశ్నించబడినవి మాత్రమే** తెరిచి ఉన్న ప్రశ్న ఉన్న ఖర్చులను చూపిస్తుంది.
      - >-
        **గ్రూప్ ఒప్పుకుంటే, సరిచేయండి.** ఖర్చును తెరిచి, **సవరించు** ఎంచుకుని, **ఎవరి మధ్య విభజించాలి**ని మార్చి **ఖర్చును నవీకరించు** ఎంచుకోండి. ఎవరు సవరించవచ్చో గ్రూప్ అనుమతులపై ఆధారపడి ఉంటుంది.
      - >-
        **ఏదీ సరిచేయాల్సిన పని లేకపోతే, మూసివేయండి.** అడిగిన వ్యక్తి తమ **ప్రశ్నించబడింది** బ్యాడ్జ్‌పై ఉన్న, **ప్రశ్నను మూసివేయండి** అని పేరున్న మూసివేత బటన్ వాడవచ్చు, అడ్మిన్ కూడా వాడవచ్చు. దాని చివరి ప్రశ్న మూసివేయబడిన తర్వాత ఖర్చు బ్యాలెన్స్‌లలోకి తిరిగి వస్తుంది.
  - heading: "అంత చక్కగా లేనప్పుడు"
    items:
      - >-
        **సవరణ తర్వాత కూడా అడిగినవాళ్లు ఖర్చులోనే ఉంటే.** ప్రశ్న అడిగిన వ్యక్తి ఇంకా ఖర్చులో ఉంటే, వాళ్ల ప్రశ్న సవరించిన వెర్షన్‌కు కొనసాగుతుంది, వాళ్లు లేదా అడ్మిన్ మూసివేసే వరకు వేచి ఉంటుంది. మొత్తాన్ని సరిచేయడం అంటే అది సరైందని ఒప్పుకోవడం కాదు.
      - >-
        **మీరు ఖర్చులో లేరు.** ఖర్చులో ఉన్నవాళ్లు మాత్రమే దాన్ని ప్రశ్నించగలరు. మీకు ఏదైనా తప్పుగా అనిపిస్తే, దాని కామెంట్లలో చెప్పండి, లేదా దాన్ని జోడించిన వ్యక్తిని అడగండి.
      - >-
        **ఎవరైనా గ్రూప్ వదిలి వెళ్లాలనుకుంటే.** తెరిచి ఉన్న ప్రశ్న ఆ ఖర్చులో ఉన్నవాళ్లను వెళ్లకుండా ఆపుతుంది. ప్రశ్నను మూసివేయండి, లేదా వాళ్లు ఇక అందులో లేకుండా ఖర్చును సవరించండి, అప్పుడు వాళ్లు వెళ్లవచ్చు.
  - heading: "ఇక్కడ Side Badger ఏం చేయదు"
    items:
      - "ఎవరు సరైనవాళ్లో ఇది నిర్ణయించదు. ఖర్చును బ్యాలెన్స్‌ల నుంచి బయట ఉంచి, మీరు ఒప్పుకున్నదాన్ని నిల్వ చేస్తుంది."
      - "ఖర్చులు లెక్కలోకి రాకముందే ఎవరినీ ఆమోదించమని అడగదు. ప్రశ్నించిన ఖర్చును మాత్రమే నిలుపుతుంది."
      - "ఇది ఖర్చులో కొంత భాగాన్ని మాత్రమే నిలపదు. ప్రశ్నిస్తే మొత్తం ఖర్చు బ్యాలెన్స్‌ల నుంచి వెళ్లిపోతుంది."
      - "ఇది డబ్బును కదపదు. మీరు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుని నమోదు చేస్తారు."
exampleAfter: 3
