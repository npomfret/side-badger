meta:
  title: "140 کرنسیوں میں اخراجات تقسیم کریں، تبدیل شدہ یا الگ"
  description: "ہر خرچہ اس کرنسی میں درج کریں جس میں آپ نے ادا کیا، بیلنس الگ رکھیں یا ایسے ریٹ پر تبدیل کریں جو آپ دیکھ اور بدل سکیں، پھر ادائیگیوں کی مختصر فہرست سے حساب برابر کریں۔"
h1: "140 کرنسیوں میں اخراجات تقسیم کریں"
navLabel: "متعدد کرنسیاں"
lead: "یورو، ین، اور وہ ایک ٹیکسی جو تھائی بھات میں تھی۔ Side Badger ہر خرچہ اسی کرنسی میں لیتا ہے جس میں آپ نے ادا کیا، بیلنس سیدھے رکھتا ہے، اور جب آپ کا گروپ ایک بار میں حساب برابر کرنا چاہے تو تبدیل کر سکتا ہے۔ یہ 140 کرنسیوں میں کام کرتا ہے، اور [گروپ سفروں](page:use-case/group-trips) کے لیے بہت موزوں ہے۔"
cta:
  heading: "اپنے یورو لائیں، اپنے ین بھی"
  body: "اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلا خرچہ اس کرنسی میں شامل کریں جو اتفاق سے آپ کے پاس تھی۔"
  button: "مفت اکاؤنٹ بنائیں"
problem:
  heading: "جیسے ادا کیا ویسے درج کریں"
  body: "سفر کی ادائیگی شاذ ہی ایک کرنسی میں ہوتی ہے۔ ہوٹل گھر سے پاؤنڈ میں بک ہوا، ڈنر ین میں ادا ہوا، اور ایئرپورٹ کی کافی اس کرنسی میں جو لے اوور والی جگہ چلتی تھی۔ ٹائپ کرنے سے پہلے سب کچھ ہاتھ سے تبدیل کرنا ہی وہ چیز ہے جس سے اسپریڈشیٹس چھوڑ دی جاتی ہیں۔ Side Badger میں آپ ہر خرچہ رسید والی کرنسی میں درج کرتے ہیں، اور ہر رقم اپنی کرنسی کے اصولوں پر چلتی ہے، اس لیے ین میں اعشاریہ نہیں ہوتا اور دینار میں تین ہوتے ہیں۔ آپ کی حال ہی میں استعمال کی گئی کرنسیاں فہرست میں پہلے آتی ہیں۔"
workflow:
  heading: "کرنسیاں الگ رکھیں، یا ساتھ ساتھ تبدیل کریں"
  steps:
    - title: "خرچہ اس کی اپنی کرنسی میں شامل کریں"
      body: "کرنسی چنیں، رقم لکھیں، بتائیں کس نے ادا کیا اور کس نے حصہ لیا۔ اور کچھ نہیں چاہیے۔ یہ ڈیفالٹ ہے، اور یہ اصل رقم کو بالکل ویسے ہی رکھتا ہے جیسے آپ نے درج کی۔"
      shot: S07
      shotAlt: "ین کی رقم درج کیے ہوئے خرچے کا فارم"
    - title: "ہر کرنسی کا بیلنس دیکھیں"
      body: "بیلنس ہر کرنسی کے لیے الگ رکھے جاتے ہیں، اور ہر ایک کی اپنی تجویز کردہ ادائیگیوں کی مختصر فہرست ہوتی ہے۔ پاؤنڈ پاؤنڈ میں برابر ہوتے ہیں اور ین ین میں۔"
      shot: S10
      shotAlt: "دو کرنسیوں میں آسان کیے گئے قرض کے ساتھ بیلنس اسکرین"
    - title: "یا تبدیل کریں، جب گروپ ایک بار میں حساب برابر کرنا چاہے"
      body: "خرچہ درج کرتے وقت کوئی اور کرنسی چنیں اور Side Badger اسے موجودہ ایکسچینج ریٹ پر تبدیل کر سکتا ہے، جسے آپ اس ریٹ پر بدل سکتے ہیں جو آپ کو واقعی ملا۔ تبدیل شدہ رقم اس کرنسی کے بیلنس میں شامل ہو جاتی ہے۔ تبدیلی ایسا انتخاب ہے جو گروپ کرتا ہے، ایسی چیز نہیں جو آپ کی پیٹھ پیچھے ہو جائے۔"
options:
  heading: "ایسا ریٹ جو آپ دیکھ اور بدل سکتے ہیں"
  items:
    - title: "ریٹ دکھایا جاتا ہے"
      body: "جب آپ تبدیل کرتے ہیں تو ریٹ اور تبدیل شدہ رقم فارم پر نظر آتی ہیں، اس لیے کسی کو کوئی عدد آنکھ بند کر کے ماننا نہیں پڑتا۔"
    - title: "اپنا ریٹ لکھیں"
      body: "کیش ڈیسک سے بہتر ریٹ ملا، یا ایئرپورٹ سے بدتر؟ ریٹ کو اس پر بدل دیں جو آپ کو واقعی ملا اور تبدیل شدہ رقم اپ ڈیٹ ہو جاتی ہے۔"
    - title: "اصل رقم رہتی ہے"
      body: "اصل رقم خرچے پر تبدیل شدہ رقم کے ساتھ رہتی ہے، ان کے لیے جو پوچھیں کہ ین میں کتنی تھی۔"
    - title: "تبدیلی مفت ہے"
      body: "تبدیلی پر کچھ خرچ نہیں آتا۔ دوسری کرنسی میں خرچہ درج کرنے پر کوئی فیس نہیں۔"
