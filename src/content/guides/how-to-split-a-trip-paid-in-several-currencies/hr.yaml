faq:
  heading: "Pitanja"
  items:
    - q: "Koji tečaj koristi Side Badger?"
      a: "Aktualni tečaj, dohvaćen pri unosu troška gdje je dostupan. Možeš ga promijeniti u onaj koji si stvarno dobio."
    - q: "Može li grupa ostati pri funtama i jenima?"
      a: "Da. U **Postavkama** grupe uključi **Ograniči valute za ovu grupu** pod **Postavke valuta**, odaberi **Dopuštene valute** i postavi **Zadana valuta za nove troškove**. Manje opcija na popisu, manje pogrešnih pogađanja na blagajni."
    - q: "Moramo li uopće pretvarati?"
      a: "Ne. Valute ostaju zasebne osim ako ti ili tvoja grupa odlučite pretvarati, a svaka valuta ima vlastiti kratak popis uplata."
