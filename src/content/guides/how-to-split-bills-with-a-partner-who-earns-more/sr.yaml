meta:
  title: "Како делити рачуне са партнером који зарађује више | Side Badger"
  description: "50/50 постане незгодно кад један од вас зарађује знатно више. Дели заједничке рачуне према приходима, са рачуном за двоје и без табеле."
h1: "Како делити рачуне са партнером који зарађује више"
navLabel: "Партнер који зарађује више"
lead: "Сабери нето плате, израчунај удео сваке особе у збиру и заокружи на целе проценте. Маја прима 2.800 £, а Џон 1.700 £, па заједничке рачуне деле 62/38. Унеси те проценте на заједнички трошак у Side Badger-у, па га копирај кад год дође исти рачун."
cta:
  heading: "Израчунај једном"
  body: "Направи бесплатан кориснички налог, оснуј групу за вас двоје и унеси кирију са својим процентима. Кирија следећег месеца је копија. Хоћеш прво обилазак? Погледај [како функционише](page:how-it-works) или [шта покрива бесплатан план](page:pricing)."
sections:
  - heading: "Две плате, један стан, једно уљудно ћутање"
    body: "Маја и Џон живе заједно. Маја месечно прима 2.800 £, а Џон 1.700 £. Две године су све делили 50/50, јер је било једноставно и нико није хтео да први отвори тему. Онда је Џон погледао саму кирију. Половина од 1.400 £ је 700 £, а то је четвртина Мајине плате и 41 % његове. Нико није био неправедан. Нико није израчунао. Многи [парови](page:use-case/couples) на крају дођу дотле. Уз храну за понети договорили су се да заједнички рачуни треба да одузму сличан залогај од сваке плате."
  - heading: "Метод, са приказаним рачуном"
    body: "Четири корака, један калкулатор и разговор који ћеш ионако морати да водиш."
    items:
      - "**Договорите шта се рачуна као приход.** Маја и Џон користе нето плату, новац који сваког месеца легне на рачун. Заједно то је 2.800 £ + 1.700 £ = 4.500 £."
      - "**Израчунај уделе.** Мајин је 2.800 ÷ 4.500, што је 62,2 %. Џонов је 1.700 ÷ 4.500, што је 37,8 %."
      - "**Заокружи на целе проценте.** 62,2 % постаје 62, а 37,8 % постаје 38. Кад су двоје, заокружи једну вредност и одузми је од 100 да добијеш другу, па увек дају 100."
      - "**Провери шта то значи.** На кирију од 1.400 £ Маја плаћа 868 £ (62 %), а Џон 532 £ (38 %). То је око 31 % нето плате сваког од њих. Пола-пола би узело 25 % Мајине и 41 % Џонове."
  - heading: "Како изгледа месец"
    body: "Маја је платила кирију од 1.400 £, а Џон осталих 216 £. Мајин део месеца је 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, а платила је 1.400 £, па јој припада 402,40 £. Џонов део је 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, а платио је 216 £, па дугује 402,40 £. Side Badger предлаже једну уплату, од Џона Маји, у износу од 402,40 £, а [поравнање](page:feature/settle-up) је бележи кад буде извршена. Да је подела била 50/50, исти месец би значио да Џон плаћа Маји 592,00 £."
  - heading: "Подеси у Side Badger-у"
    body: "Десет минута, од чега већину одузму проценти."
    items:
      - "**Направи групу.** На контролној табли изабери **Креирај групу** и назови је по стану. Изабери **Позови друге** и пошаљи Џону везу или QR код. Он се пријави или направи бесплатан кориснички налог и изабере име под којим жели да буде приказан у овој групи. Групу виде само чланови, па је ова само за вас двоје."
      - "**Додај кирију.** Изабери **Додај трошак**. Унеси опис и износ, а под **Ко је платио?** изабери Мају. Остави обоје под **Подели између**, затим под **Начин поделе** изабери **Проценат** и укуцај 62 и 38. Образац упозорава ако проценти не дају 100. Изабери **Сачувај трошак**."
      - "**Додај остале рачуне.** Струја и интернет иду на исти начин, са Џоном као платиоцем и истим 62 и 38. Храна за понети је посебан трошак, са **Начин поделе** на **Једнако**."
      - "**Копирај следећег месеца.** Отвори прошломесечну кирију и изабери **Копирај трошак**. Копија задржава платиоца, износ и поделу, а добија данашњи датум. Промени износ ако се кирија променила, па изабери **Креирај копију**. Рачун за струју ради на исти начин."
      - "**Провери ко коме дугује.** Одељак **Стања** га приказује и предлаже кратак списак уплата. Платите једно другом како год желите, а затим забележите уплату под **Поравнај**."
  - heading: "50/50, према приходима или рачун по рачун"
    body: "Не постоји тачан одговор, само онај са којим можете да живите обоје. Три уобичајена."
    items:
      - "**Пола-пола за све.** Најлакше за вођење и одговара паровима чије су плате блиске."
      - "**Према приходима за све заједничко.** Оно што раде Маја и Џон. Један разговор, један пар процената."
      - "**Рачун по рачун.** Кирија и рачуни према приходима, одмори и ситна задовољства 50/50 или како год се договорите, а сваки рачун добија правило које му одговара."
  - heading: "Договорите шта је заједничко"
    body: "Свађе су обично око списка, а не око процената. Кирија, струја, интернет, недељна куповина и софа су у већини домова заједнички. Мајина чланарина за теретану и Џонова претплата за фудбал можда нису. Договорите списак једном, запишите га и у групу стављајте само заједничке трошкове."
  - heading: "Храна за понети остаје 50/50, намерно"
    body: "Ситна задовољства су мала и необавезна, а нико не би требало да треба калкулатор да наручи кнедле. У Side Badger-у је храна за понети само још један трошак. Џон плаћа 36 £, **Начин поделе** остаје на **Једнако** и свако дугује 18 £."
  - heading: "Кад се нечија плата промени"
    body: "Повишица, нови посао или одсуство с посла мењају рачун. Израчунај нове проценте на исти начин и користи их од следећег трошка. Ранији трошкови остају какви су били. Копирај прошломесечну кирију, промени проценте, па изабери **Креирај копију**. Да исправиш трошак који је већ унет, измени га ако то дозвољавају дозволе групе и прво обавести партнера, јер се стања мењају. Претходна верзија се чува. Договорите када ћете поново рачунати, на пример једном годишње, и поравнајте се пре промене да се стара подела затвори чистим стањем."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Никад не пита шта ко зарађује и не рачуна проценте. Ти уносиш бројеве око којих сте се договорили."
      - "Не може да постави подразумевану поделу за целу групу. Проценти иду на сваки трошак, зато копирај онај који их већ има."
      - "Нема понављајућих рачуна, па сваки пут копираш прошломесечну кирију."
      - "Никад не премешта новац. Платите једно другом како год желите и то забележите."
