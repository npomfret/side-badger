meta:
  title: "Clear di account with fewer payments | Side Badger"
  description: "See who owe who for your group, get short list of payments wey go settle everybody, and record each payment as e happen. Free to use."
h1: "Clear di account with fewer payments"
navLabel: "Clear di account"
lead: "Side Badger dey keep running balance for everybody for di group and suggest short list of payments wey go settle am. You go pay each other anyhow you like, then record am. If you wan see first how di numbers dey split, start with [share expenses](page:feature/split-expenses)."
cta:
  heading: "You ready to untangle who owe who?"
  body: "Create account, start group and add di first expense. Di balances go take am from there."
  button: "Create free account"
problem:
  heading: "Balances wey dey update as you dey go"
  body: "Every expense dey change who owe who, so Side Badger dey keep di balances current as expenses and payments dey enter. Everybody for di group go see change sharp sharp, and see wetin change and who change am. Balances dey kept per currency, so euros and pounds go stay for dem own columns unless dem convert expense when dem enter am. By default you go see di debts wey involve you; **Sho all** go list di whole group."
workflow:
  heading: "Three steps to clear am"
  steps:
    - title: "See who owe who"
      body: "Open di group balances to see wetin you owe, wetin dem owe you, and short list of payments wey go settle everybody, worked out per currency. Questioned expenses go stay out of di sums until dem sort am. For di housemates example below, six payments become two."
      shot: S10
      shotAlt: "Di balances screen showing simplified debts for two currencies, with Sho all switched on"
    - title: "Pay anyhow you like, then record am"
      body: "Bank transfer, cash, favour wey you owe from last holiday. Side Badger no dey move di money. Once e don change hand, record di payment and di balance go update for everybody."
      shot: S11
      shotAlt: "Di payment form with Kwik settul buttons and di notice wey show for part payment"
    - title: "Check say e land"
      body: "Di payment go enter di group history, where everybody for di group fit see am and react with emoji. Celebrate payment when e land."
      shot: S12
      shotAlt: "Di payment history with emoji reactions on one payment"
