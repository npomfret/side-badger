sections:
  - heading: "Splitwise inafanya nini vizuri"
    body: "Kama kikundi chenu kinahitaji programu asilia, matumizi bila mtandao au malipo ndani ya programu, Splitwise ni chaguo la busara, na tungependa uichague kuliko kugundua baadaye. Kurasa zake zenyewe zinaorodhesha:"
    items:
      - "**Programu na matumizi bila mtandao.** Programu za iPhone na Android pamoja na wavuti, na hali ya nje ya mtandao."
      - "**Njia zaidi za kugawanya.** Sehemu, marekebisho na migawanyo kwa kila bidhaa, juu ya usawa, kiasi kamili na asilimia."
      - "**Gharama zinazojirudia.** Weka kodi ijirudie na uisahau."
      - "**Malipo ndani ya programu.** Katika baadhi ya nchi inaweza kusogeza pesa pia, kupitia Splitwise Pay, Venmo, PayPal au Pay by Bank."
  - heading: "Bure hapa, kwa malipo kule"
    body: "Splitwise Pro ni mpango wa kulipia wa Splitwise, na ukurasa wake wa Pro unauza vitu vinne ambavyo havigharimu chochote kwenye Side Badger."
    items:
      - "**Kuchanganua risiti.** Splitwise Pro inachanganua picha ya risiti yako. Side Badger inafanya hivyo bure, bila vocha za kuchanganua: inajaza jumla, tarehe na mahali ili uvihakiki. Picha za risiti husomwa na huduma ya AI ya Google."
      - "**Kubadilisha sarafu.** Splitwise Pro inabadilisha gharama za kikundi kuwa sarafu yako chaguo-msingi unapogusa Convert. Side Badger inabadilisha kila gharama unapoiingiza, kwa kiwango cha sasa cha ubadilishaji au kile ulichopata kweli, na kiasi cha awali kinabaki kwenye gharama."
      - "**Hakuna matangazo.** Splitwise inaorodhesha uzoefu usio na matangazo kabisa kama kipengele cha Pro. Side Badger haina matangazo."
      - "**Hakuna vikomo vya kila siku.** Splitwise Pro inauza gharama zisizo na kikomo, na kituo chake cha msaada kinasema watumiaji wa bure wanaweza kuongeza hadi gharama 4 kila siku. Side Badger haina vikomo vya kila siku."
  - heading: "Splitwise ina nini ambacho Side Badger haina"
    body: "Hizi si zana zote za Splitwise, ni zile tu zinazoelekea kuamua. Kurasa za Splitwise zenyewe zina orodha kamili. Hapa ndipo Side Badger inapopungukiwa."
    items:
      - "**Programu asilia.** Side Badger inafanya kazi kwenye kivinjari chako. Ingia, kisha iongeze kwenye skrini yako ya mwanzo na inafunguka kama programu."
      - "**Hali ya nje ya mtandao.** Side Badger inahitaji muunganisho."
      - "**Malipo ndani ya programu.** Side Badger haigusi pesa zako kamwe. Lipaneni mtakavyo, kisha rekodi malipo."
      - "**Gharama zinazojirudia.** Side Badger haina. Nakili kodi ya mwezi uliopita badala ya kuiandika tena."
      - "**Kugawanya kwa sehemu au kwa bidhaa.** Side Badger ina mlipaji mmoja kwa kila gharama, anayegawanywa kwa usawa, kwa viasi kamili au kwa asilimia. Kuchanganua kwake risiti hakugawi bidhaa kwa watu."
      - "**Chati na migawanyo chaguo-msingi.** Splitwise Pro ina vyote viwili. Side Badger inaweka hesabu ya nani anadaiwa na nani, na hiyo ndiyo ujanja wote."
  - heading: "Kuhamisha kikundi chako"
    body: "Hakuna kiingizaji, kwa hivyo kuhama ni kuanza upya. Maliza hesabu kwenye Splitwise kwanza, kisha tengeneza kikundi kwenye Side Badger na umwalike kila mtu kwa kiungo au msimbo wa QR. Kila mtu kwenye kikundi anahitaji akaunti ya bure, na kujisajili kunahitaji anwani ya barua pepe tu."
