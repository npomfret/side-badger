faq:
  heading: "Întrebări"
  items:
    - q: "Plătește mai mult cavalerul de onoare sau domnișoara de onoare?"
      a: "Doar dacă grupul e de acord. Aplicația nu dă nimănui un rol special în calcule. Dacă cineva acoperă mai mult, alege **Sume exacte** sau **Procentaj** la **Cum se împarte** și introdu părțile la care ați ajuns."
    - q: "Dar băuturile pe care unii nu le-au băut?"
      a: "Adaugă băuturile ca o cheltuială separată și bifează doar oamenii care le-au băut. Dacă fiecare a băut altă cantitate, alege **Sume exacte** și scrie partea fiecăruia. Nimeni nu plătește pentru ce n-a luat."
    - q: "Poate invitatul de onoare să vadă grupul mai târziu?"
      a: "Da, după ce s-a terminat surpriza. Invită-l, apoi un administrator îl poate face **Vizualizator** la **Securitate**, în setările grupului. Un vizualizator vede tot și nu schimbă nimic, așa că așteaptă până când nu mai e nimic secret. Are nevoie de un cont gratuit ca să se alăture."
