featuresHeading: "Fitur yang dipakai pasangan"
faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah kami menetapkan 60/40 sekali untuk semuanya?"
      a: "Tidak. Pembagian melekat pada tiap pengeluaran. Atur persentase pada yang pertama, lalu salin lain kali dan ubah apa yang berbeda. [Bagi pengeluaran](page:feature/split-expenses) membahas ketiga cara membagi."
    - q: "Apakah ini terhubung ke bank kami?"
      a: "Tidak. Side Badger tidak pernah menyentuh uang Anda. Anda saling membayar dengan cara apa pun yang disuka, lalu mencatatnya, seperti dijelaskan [pelunasan](page:feature/settle-up)."
    - q: "Bisakah orang lain melihat grup kami?"
      a: "Hanya anggotanya, dan grup pasangan punya dua. Siapa pun yang memakai tautan undangan yang masih aktif bisa bergabung, jadi bagikan kepada satu orang saja dan beri masa berlaku singkat."
    - q: "Bagaimana jika kami masing-masing membayar sebagian dari tagihan yang sama?"
      a: "Satu pengeluaran punya satu pembayar. Catat dua pengeluaran, satu untuk masing-masing dari Anda, dan saldonya tetap sama."
    - q: "Apakah ia akan mengingatkan pasangan saya untuk membayar?"
      a: "Tidak. Tidak ada pengingat, jadi colekannya tetap tugas Anda. Setidaknya Anda berdua akan melihat angka yang sama."
    - q: "Apa yang terjadi saat kami berhenti berbagi biaya?"
      a: "Lunasi saldo dan catat pembayarannya, supaya tak ada yang berutang. Lalu admin bisa mengunci grup, yang menjaga angkanya tetap seperti adanya, atau menutupnya untuk selamanya, yang membuatnya tidak dapat diakses semua orang. Tutup hanya jika Anda berdua tidak lagi memerlukan riwayatnya."
