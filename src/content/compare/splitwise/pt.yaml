faq:
  heading: "Perguntas"
  items:
    - q: "O Side Badger é uma alternativa grátis ao Splitwise?"
      a: "Para dividir contas num grupo, sim. A leitura de recibos, a conversão de moedas e a ausência de anúncios são grátis, sem limites diários. Se precisas de uma app nativa, uso offline, despesas recorrentes ou pagamentos dentro da app, o Splitwise faz isso e o Side Badger não."
    - q: "De onde vêm os detalhes do Splitwise?"
      a: "Das páginas do próprio Splitwise: a página inicial, a página Pro e o centro de ajuda. Cada linha da tabela liga à página de onde veio, e a data acima da tabela diz quando as lemos. Verificamo-las todos os trimestres."
    - q: "O Side Badger vai continuar grátis?"
      a: "Tudo no Side Badger é grátis hoje e não existe nível pago. Se isso mudar, avisamos-te primeiro. A [página de preços](page:pricing) tem os detalhes."
    - q: "Toda a gente do meu grupo tem de mudar?"
      a: "Sim. Todas as pessoas de um grupo precisam de uma conta grátis no Side Badger, e podem entrar com um link ou um código QR."
    - q: "O Side Badger tem app para telemóvel?"
      a: "Não numa loja de aplicações. Funciona no navegador: inicia sessão no telemóvel e depois adiciona-o ao ecrã principal para abrir como uma app. [Como funciona](page:how-it-works) mostra como."
