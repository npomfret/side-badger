meta:
  title: Split expenses equally, exactly or by percentage | Side Badger
  description: Split a shared cost equally, by exact amounts or by percentage, and leave out anyone who wasn't there. Free, with no ads and no daily limits.
h1: Split expenses equally, exactly or by percentage
navLabel: Split expenses
lead: Not everything is 50/50. Side Badger copes. Say who paid, pick the people who shared the cost, and split it **equally, by exact amounts or by percentage**. Grudges sold separately.
cta:
  heading: Split the next one properly
  body: Create a free account, start a group and add the expense you've been meaning to sort out. Not sure what happens next? See [how it works](page:how-it-works), or check [what free covers](page:pricing).
  button: Create a free account
problem:
  heading: Not everything is 50/50
  body: Rent follows the size of the room. A gift follows whoever promised what. A dinner follows whoever stayed for dessert. Splitting a bill in half works until the first bill that isn't, and then somebody opens a spreadsheet. Side Badger records who paid, who shared the cost and how it divides, so the balances come out right without anyone doing long division at the table.
workflow:
  heading: Adding an expense, start to finish
  steps:
    - title: Say who paid and what for
      body: Enter the amount, a short description and the person who paid. One person pays for each expense, which keeps the arithmetic honest.
      shot: S05
      shotAlt: The expense form with a cottage rent split by percentage between three people
    - title: Pick the split
      body: Choose equal, exact amounts or percentages. Percentages must add up to 100, and exact amounts must add up to the total.
      shot: S06
      shotAlt: The expense form with exact amounts entered for each person on a gift
    - title: Add the story
      body: Set the date, add labels, a place and a note. Everyone in the group sees the same details, and can comment right there.
      shot: S08
      shotAlt: An expense with its details, a comment thread and the original amount it was entered as
    - title: Raise a question if something looks off
      body: If the group has turned expense questions on, anyone included in an expense can question it, and the expenses list can show only the questioned ones.
      shot: S18
      shotAlt: The expenses list with a Questioned badge and the Only questioned filter
options:
  heading: Three ways to split
  items:
    - title: Equally
      body: The default for dinners, taxis and anything everyone shared evenly. If the total doesn't divide cleanly, the odd penny goes to one person at random, not always the same one. In the taxi below, it's Ana.
    - title: By exact amounts
      body: Type what each person owes. Good for the gift where everyone chose a different price, or the shop where one person's trolley held more than the shared groceries. The amounts must add up to the total.
    - title: By percentage
      body: Give each person a share of the total. Rent by room size is the classic, with the biggest room paying the biggest share and nobody pretending otherwise.
example:
  heading: A cottage weekend, four expenses, three splits
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: the cottage, by room size
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: dinner
      payer: ben
      amount: 84
      split:
        method: equal
    - label: groceries
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: the taxi home
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: Only the people who were there
    body: Split a cost between everyone, or only the people who shared it. Leave people out of the costs they weren't part of, and the balances reflect it. The housemate who was away all week doesn't owe for the takeaway, which [housemates](page:use-case/housemates) will recognise as basic justice.
  - heading: The details that save arguments later
    items:
      - Set the **date** and an optional time. Shortcuts such as today, yesterday, this morning and last night save some typing.
      - Add up to three **labels** to group expenses, such as groceries or travel.
      - Add the **place**. Paste a map link and the place name fills itself in.
      - Add a **note** for the story behind the number, with some formatting if the story needs it.
      - Use the **comments** to keep the conversation next to the expense it's about, rather than in a chat thread nobody scrolls back through.
  - heading: Copy, edit, and see what changed
    body: Copy last month's rent instead of typing it again, then change what's different. If a number was wrong, edit the expense. The earlier version is kept and the edit shows in the group's activity, so nobody changes a number quietly. What anyone is allowed to edit depends on the group's permissions.
  - heading: When something looks wrong
    body: A group can turn on expense questions. Anyone included in an expense can raise a question and say why, and the expense stays out of the balances until the person who asked, or an admin, closes it. It is off by default and an admin turns it on for the group. It suits [events and celebrations](page:use-case/events-and-celebrations), where the deposit nobody remembers is suddenly everyone's business.
limits:
  heading: Limits
  items:
    - One person pays for each expense. If two people paid, record two expenses.
    - There is no split by item and no split by shares. Equal, exact amounts and percentages are what there is.
    - Percentages must add up to 100.
    - An expense can be up to 999,999.99 in its own currency, with that currency's usual decimal places.
    - Expenses can't repeat on their own. Copy last month's instead.
    - Dates can't be in the future or more than 10 years ago.
    - An expense involving someone who has left the group becomes read-only.
useCasesHeading: Where splitting like this helps
faq:
  heading: Questions
  items:
    - q: Can two people pay for one expense?
      a: Not in one expense. Record two, one for each payer, and the balances come out the same.
    - q: Can I split a receipt by item?
      a: No. A split is equal, by exact amounts or by percentage. For a bill with different items, enter what each person owes as exact amounts.
    - q: Can I set a default split?
      a: No. Copy an earlier expense to reuse its split, and change what's different.
    - q: Can bills repeat every month?
      a: No. Copy last month's expense instead, which takes a few seconds.
    - q: Who can edit an expense?
      a: Whoever the group's permissions allow. Every edit shows in the group's activity, so changes are never silent.
    - q: What happens to the balances afterwards?
      a: They update as expenses arrive, and [settle up](page:feature/settle-up) turns them into a short list of payments. If an expense is in another currency, see [multiple currencies](page:feature/multiple-currencies).
