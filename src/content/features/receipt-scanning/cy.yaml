faq:
  heading: "Cwestiynau"
  items:
    - q: "Ydy sganio'n gallu rhannu derbynneb fesul eitem?"
      a: "Nac ydy. Mae'n llenwi'r gost, gan gynnwys y cyfanswm, ac rydych chi'n ei rhannu'n gyfartal, yn ôl symiau union neu yn ôl canran. Ar gyfer bil lle mae pawb wedi archebu rhywbeth gwahanol, rhowch yr hyn sy'n ddyledus gan bob person fel symiau union. Mae [rhannu treuliau](page:feature/split-expenses) yn rhoi'r manylion."
    - q: "Ydy sganio'n gallu darllen PDF?"
      a: "Nac ydy. Gallwch atodi PDF at gost fel ei fod yn teithio gyda'r rhifau, ond dim ond delweddau a ddarllenir."
    - q: "Oes terfyn ar sganiau?"
      a: "Does dim credydau sganio i redeg allan ohonynt, ac mae sganio am ddim. Mae terfynau ar ffeiliau, sef hyd at dri atodiad fesul cost a 10 MB yr un. Mae [beth mae am ddim yn ei gynnwys](page:pricing) yn rhoi'r gweddill."
    - q: "Pwy all weld fy nerbynneb?"
      a: "Gall aelodau'r grŵp weld y derbynebau sydd wedi'u hatodi i gost. Mae delweddau derbynebau hefyd yn cael eu darllen gan wasanaeth AI Google, a dyna sut mae'r ffurflen yn cael ei llenwi."
    - q: "Alla i sganio derbynneb ar gyfer cost rydw i eisoes wedi'i hychwanegu?"
      a: "Na, mae sganio ar gyfer costau newydd. Gallwch ddal i atodi derbynneb at gost sy'n bodoli eisoes, a chaiff ei storio heb ei darllen."
    - q: "Beth os yw'n llenwi rhywbeth o'i le?"
      a: "Teipiwch drosto. Mae pob maes yn aros yn olygadwy nes i chi gadw, a dylech eu gwirio i gyd beth bynnag. Os bydd sganio'n methu neu os nad yw ar gael, ychwanegwch y gost â llaw fel arfer."
