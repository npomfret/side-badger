meta:
  title: "Skiptu reikningum með maka sem þénar meira | Side Badger"
  description: "50/50 verður vandræðalegt þegar annað ykkar þénar miklu meira. Skiptu sameiginlegum reikningum eftir tekjum, með útreikningum fyrir tvö og engum töflureikni."
h1: "Hvernig á að skipta reikningum með maka sem þénar meira"
navLabel: "Maki sem þénar meira"
lead: "Leggðu saman útborguð laun ykkar, reiknaðu hlut hvors um sig af heildinni og námundaðu í heilar prósentur. Maya fær 2.800 £ útborgaðar og Jon 1.700 £, svo þau skipta sameiginlegum reikningum 62/38. Settu þessar prósentur á sameiginlegt útgjald í Side Badger og afritaðu það svo í hvert sinn sem sami reikningur kemur aftur."
cta:
  heading: "Reiknaðu dæmið einu sinni"
  body: "Stofnaðu ókeypis aðgang, búðu til hóp fyrir ykkur tvö og settu leiguna inn með ykkar prósentum. Leiga næsta mánaðar er afrit. Viltu fá kynninguna fyrst? Sjáðu [hvernig þetta virkar](page:how-it-works) eða skoðaðu [hvað ókeypis nær yfir](page:pricing)."
sections:
  - heading: "Tvenn laun, ein íbúð, ein kurteis þögn"
    body: "Maya og Jon búa saman. Maya fær 2.800 £ útborgaðar á mánuði og Jon fær 1.700 £. Í tvö ár skiptu þau öllu 50/50, því það var einfalt og hvorugt vildi vekja máls á því. Svo skoðaði Jon leiguna eina og sér. Helmingur af 1.400 £ er 700 £, sem er fjórðungur af útborguðum launum Maya og 41% af hans. Enginn hafði verið ósanngjarn. Enginn hafði reiknað dæmið. Mörg [pör](page:use-case/couples) lenda í þessu á endanum. Yfir skyndibita komu þau sér saman um að sameiginlegir reikningar ættu að taka svipaðan bita af hvorum launum."
  - heading: "Aðferðin, með öllum útreikningum"
    body: "Fjögur skref, ein reiknivél og samtal sem þið þurftuð hvort sem er að taka."
    items:
      - "**Semjið um hvað telst til launa.** Maya og Jon nota útborguð laun, peningana sem lenda í bankanum í hverjum mánuði. Saman eru það 2.800 £ + 1.700 £ = 4.500 £."
      - "**Reiknið hlut hvors.** Hlutur Maya er 2.800 ÷ 4.500, sem er 62,2%. Hlutur Jon er 1.700 ÷ 4.500, sem er 37,8%."
      - "**Námundið í heilar prósentur.** 62,2% verða 62 og 37,8% verða 38. Þegar þið eruð tvö námundið þið aðra töluna og dragið hana frá 100 til að fá hina, svo þær ná alltaf samtals 100."
      - "**Athugið hvað það þýðir.** Af leigunni, 1.400 £, borgar Maya 868 £ (62%) og Jon borgar 532 £ (38%). Það er um 31% af útborguðum launum hvors. Helmingur hvort hefði tekið 25% af launum Maya og 41% af launum Jon."
  - heading: "Mánuðurinn lesinn"
    body: "Maya greiddi 1.400 £ leiguna og Jon greiddi hin 216 £. Hlutur Maya af mánuðinum er 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £ og hún greiddi 1.400 £, svo hún á inni 402,40 £. Hlutur Jon er 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £ og hann greiddi 216 £, svo hann skuldar 402,40 £. Side Badger leggur til eina greiðslu, frá Jon til Maya, upp á 402,40 £, og [uppgjör](page:feature/settle-up) skráir hana þegar hún hefur verið greidd. Ef sami mánuður hefði verið skiptur 50/50 hefði Jon greitt Maya 592,00 £."
  - heading: "Settu það upp í Side Badger"
    body: "Tíu mínútur, að mestu í prósenturnar."
    items:
      - "**Búðu til hópinn.** Veldu **Búa til hóp** á stjórnborðinu og nefndu hann eftir íbúðinni. Veldu **Bjóða öðrum** og sendu Jon tengilinn eða QR-kóðann. Hann skráir sig inn eða stofnar ókeypis aðgang og velur nafnið sem hann vill að birtist í þessum hópi. Aðeins meðlimir sjá hóp, svo þessi er bara fyrir ykkur tvö."
      - "**Bættu leigunni við.** Veldu **Skrá útgjöld**. Sláðu inn lýsingu og upphæð og veldu Maya undir **Hver greiddi?** Hafðu bæði undir **Skipta á milli**, veldu svo **Prósenta** undir **Hvernig á að skipta** og sláðu inn 62 og 38. Eyðublaðið lætur vita ef prósenturnar ná ekki samtals 100. Veldu **Vista útgjöld**."
      - "**Bættu hinum reikningunum við.** Rafmagn og internet fara inn á sama hátt, með Jon sem greiðanda og sömu 62 og 38. Skyndibitinn er sitt eigið útgjald, með **Hvernig á að skipta** á **Jafnt**."
      - "**Afritaðu leiguna í næsta mánuði.** Opnaðu leigu síðasta mánaðar og veldu **Afrita útgjöld**. Afritið heldur greiðandanum, upphæðinni og skiptingunni og fær dagsetningu dagsins í dag. Breyttu upphæðinni ef leigan breyttist og veldu svo **Búa til afrit**. Rafmagnsreikningurinn virkar á sama hátt."
      - "**Athugaðu hver skuldar hverjum.** Hlutinn **Staða** sýnir það og leggur til stuttan lista yfir greiðslur. Borgið hvert öðru eins og ykkur hentar og skráið greiðsluna svo undir **Gera upp**."
  - heading: "50/50, eftir tekjum eða reikningur fyrir reikning"
    body: "Það er ekkert eitt rétt svar, bara það sem þið getið bæði lifað með. Þrjár algengar leiðir."
    items:
      - "**Helmingur hvort fyrir allt.** Auðveldast að halda utan um og hentar pörum þar sem launin eru svipuð."
      - "**Eftir tekjum fyrir allt sameiginlegt.** Það sem Maya og Jon gera. Eitt samtal, eitt par af prósentum."
      - "**Reikningur fyrir reikning.** Leiga og reikningar eftir tekjum, frí og dekur 50/50 eða hvernig sem þið semjið, og hver reikningur fær regluna sem hentar honum."
  - heading: "Komið ykkur saman um hvað telst sameiginlegt"
    body: "Rifrildin snúast yfirleitt um listann, ekki prósenturnar. Leiga, rafmagn, internet, vikuleg innkaup og sófinn teljast sameiginleg á flestum heimilum. Líkamsræktarkortið hennar Maya og fótboltaáskriftin hans Jon gera það kannski ekki. Komið ykkur saman um listann einu sinni, skrifið hann niður og setjið aðeins sameiginlegan kostnað í hópinn."
  - heading: "Skyndibitinn er áfram 50/50, af ásettu ráði"
    body: "Dekur er smátt og valfrjálst og enginn ætti að þurfa reiknivél til að panta dim sum. Í Side Badger er skyndibitinn bara enn eitt útgjaldið. Jon borgar 36 £, **Hvernig á að skipta** helst á **Jafnt** og hvort þeirra skuldar 18 £."
  - heading: "Þegar launin breytast"
    body: "Launahækkun, nýtt starf eða leyfi frá vinnu breytir dæminu. Reiknaðu nýju prósenturnar á sama hátt og notaðu þær frá næsta útgjaldi. Fyrri útgjöld haldast eins og þau voru. Afritaðu leigu síðasta mánaðar, breyttu prósentunum og veldu svo **Búa til afrit**. Til að leiðrétta útgjald sem er þegar inni skaltu breyta því ef heimildir hópsins leyfa, og láta maka þinn vita fyrst, því staðan breytist. Fyrri útgáfan er geymd. Ákveðið hvenær þið reiknið upp á nýtt, til dæmis einu sinni á ári, og gerið upp áður en þið skiptið svo gamla skiptingin endi með hreinum reikningi."
  - heading: "Það sem Side Badger gerir ekki hér"
    items:
      - "Það spyr aldrei hvað neinn þénar og reiknar ekki prósenturnar. Þú slærð inn tölurnar sem þið sömduð um."
      - "Það getur ekki stillt sjálfgefna skiptingu fyrir allan hópinn. Prósenturnar fara á hvert útgjald, svo afritaðu eitt sem hefur þær þegar."
      - "Það eru engir endurteknir reikningar, svo þú afritar leigu síðasta mánaðar í hvert skipti."
      - "Það flytur aldrei peninga. Þið borgið hvert öðru eins og ykkur hentar og skráið það."
