faq:
  heading: "Maswali"
  items:
    - q: "Nani arekodi malipo, anayelipa au anayelipwa?"
      a: "Kurekodi malipo kunahitaji ruhusa ya kuhariri gharama, na fomu inauliza **Nani alilipa?** na **Nani alipokea malipo?** Aliyerekodi pekee ndiye anayeweza kuyahariri baadaye, kwa hivyo mara nyingi ni rahisi zaidi mlipaji afanye hivyo, kwa kitufe cha kulipa haraka."
    - q: "Je, safari ikiwa na sarafu mbili?"
      a: "Salio huwekwa kwa kila sarafu, kwa hivyo deni la euro linabaki deni la euro na kila sarafu ina orodha yake fupi, isipokuwa gharama zilibadilishwa zilipoingizwa. [Sarafu kadhaa](page:guide/how-to-split-a-trip-paid-in-several-currencies) inaonyesha njia zote mbili."
    - q: "Je, tumalize hesabu wakati wa safari au mwishoni?"
      a: "Yoyote inafaa. Kila malipo yaliyorekodiwa yanabadilisha salio, kwa hivyo malipo yaliyofanywa katikati ya safari yanahesabiwa kwenye orodha ya mwisho. Mwishoni ni rahisi zaidi, kwa sababu [safari nzima](page:use-case/group-trips) iko mahali pamoja."
