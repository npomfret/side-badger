meta:
  title: "Заједнички спискови, анкете и коментари за групне трошкове | Side Badger"
  description: "Коментиши трошкове, доведи у питање чудан, води заједнички списак за куповину и гласај за вилу. Планирај потрошњу заједно, па подели. Бесплатно, без огласа."
h1: "Планирајте заједно, поделите после"
navLabel: "Планирање заједно"
lead: "Списак за куповину и рачун за куповину, коначно у пријатељским односима. Side Badger даје твојој групи место да прича о новцу пре и после трошења, са коментарима на сваком трошку, начином да се доведу у питање они који делују погрешно, заједничким списковима и анкетама за велике одлуке. Затим [делиш трошкове](page:feature/split-expenses) као и обично."
cta:
  heading: "Испланирај, па подели"
  body: "Направи бесплатан налог, оснуј групу и стави први списак, анкету или питање одмах уз новац. Не знаш шта следи? Погледај [како функционише](page:how-it-works)."
problem:
  heading: "Ћаскање је овде, а рачун тамо"
  body: "Групна потрошња обично живи на два места. Бројеви су на једном, а свађа око бројева у ћаскању које је у уторак измакло из видокруга. Списак за куповину је слика фрижидера. Вилу је одлучио палац горе већине људи, вероватно. Side Badger држи планирање у групи, уз трошкове на које се односи, па коментар стоји тамо где је цена, списак тамо где је куповина, анкета за велику одлуку и начин да кажеш „чекај, је ли ово тачно?“ без писања читавог пасуса. Све остаје о новцу групе, због чега група и постоји."
workflow:
  heading: "Од гласања за вилу до рачуна за куповину"
  steps:
    - title: "Пусти велику одлуку на гласање"
      body: "Додај анкету за одлуку која одређује рачун, на пример коју вилу. Изабери од две до десет опција, одреди колико гласова добија свака особа, а затим је затвори кад су сви гласали и победник је означен."
      shot: S17
      shotAlt: "Затворена анкета са означеном победничком опцијом и бројем гласова уз сваку опцију"
    - title: "Заједно напишите списак за куповину"
      body: "Започни заједнички списак, додај ставке и квачицом их означавај кад стигну у колица. Куповина се касније уноси као трошак."
      shot: S16
      shotAlt: "Заједнички списак за куповину са неколико означених ставки и бројачем напретка"
    - title: "Причај о цени тамо где живи"
      body: "Коментиши сам трошак, прикачи рачун и реагуј емоџијем. Разговор остаје уз број на који се односи."
      shot: S08
      shotAlt: "Трошак са детаљима, сличицом рачуна, нитом коментара и емоџи реакцијама"
    - title: "Доведи у питање онај који делује чудно"
      body: "Ако је група укључила питања о трошковима, свако ко је укључен у трошак може да изабере **Имам питање**. Трошак остаје ван стања док се питање не реши."
      shot: S18
      shotAlt: "Списак трошкова са ознаком Доведено у питање и филтером Само доведено у питање"
    - title: "Види шта се променило и ко је то променио"
      body: "Дневник активности и звонце обавештења показују шта је ново у твојим групама. Push обавештења су ту ако их желиш."
      shot: S19
      shotAlt: "Падајући списак обавештења са недавним активностима"
