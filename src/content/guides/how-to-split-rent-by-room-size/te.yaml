meta:
  title: "గది పరిమాణం ప్రకారం అద్దె ఎలా పంచాలి | Side Badger"
  description: "పెద్ద గది, పెద్ద వాటా. ఉమ్మడి గదులను పక్కన పెట్టి, మిగిలినది గది విస్తీర్ణం ప్రకారం పంచండి, శాతాలను ఒకసారే నమోదు చేయండి. ముగ్గురికి లెక్కలతో."
h1: "గది పరిమాణం ప్రకారం అద్దె ఎలా పంచాలి"
navLabel: "గది పరిమాణం ప్రకారం అద్దె"
lead: "అద్దెలో ఎంత భాగం ఉమ్మడి గదులకో నిర్ణయించి దాన్ని సమానంగా పంచండి, మిగిలినదాన్ని ప్రతి బెడ్‌రూమ్ విస్తీర్ణం ప్రకారం పంచండి. శాతాలను పూర్తి సంఖ్యలకు మార్చి, Side Badgerలో అద్దె ఖర్చుపై ఒకసారి నమోదు చేయండి, ప్రతి నెలా ఆ ఖర్చును కాపీ చేయండి."
cta:
  heading: అద్దెను ఒక్కసారే నమోదు చేయండి
  body: "ఉచిత ఖాతా తెరిచి, ఫ్లాట్ కోసం గ్రూప్ మొదలుపెట్టి, మీరు ఒప్పుకున్న శాతాలతో అద్దెను నమోదు చేయండి. వచ్చే నెల అంటే ఒక కాపీ మాత్రమే. ముందు పరిచయం కావాలా? [ఇది ఎలా పనిచేస్తుంది](page:how-it-works) చూడండి, లేదా [ఉచితంలో ఏమేం ఉన్నాయో](page:pricing) చూడండి."
sections:
  - heading: "ముగ్గురు మనుషులు, ఒక ఫ్లాట్, ఒక వాదన"
    body: "Priya, Tom, Aisha నెలకు £1,950 అద్దెతో ఒక ఫ్లాట్ పంచుకుంటారు. ఒక ఏడాది పాటు వాళ్లు అద్దెను ముగ్గురికి సమానంగా పంచారు, ఎందుకంటే అది సులువు. తర్వాత Aisha తన బెడ్‌రూమ్ కొలిచింది. Priya గది 16 m², Tom గది 12 m², Aisha గది 10 m². అంటే Priya చెల్లించినంతే Aisha చెల్లిస్తోంది, కానీ ఆమె గది మూడో వంతుకు పైగా చిన్నది. ఎవరూ అన్యాయంగా ప్రవర్తించలేదు. ఎవరూ లెక్క వేయలేదు అంతే. టేకవే తింటూ వాళ్లు ముందుగా ఒక నియమం ఒప్పుకున్నారు. అద్దెలో 40% వంటగది, బాత్రూమ్, లాంజ్ కోసం, ఎందుకంటే ఆ ముగ్గురూ వాటిని వాడతారు."
  - heading: "పద్ధతి, లెక్కలతో సహా"
    body: "నాలుగు దశలు, ఒక టేప్, ఫోన్‌లో ఒక కాలిక్యులేటర్."
    items:
      - "**ఉమ్మడి భాగాన్ని పక్కన పెట్టండి.** అందరూ వాడే గదుల కోసం అద్దెలో ఎంత వాటా అన్నది గ్రూప్ ఒప్పుకోవాలి. ఈ ఫ్లాట్‌కు అది 40%, ముగ్గురి మధ్య ఒక్కొక్కరికి 13.33%."
      - "**మిగిలినదాన్ని గది విస్తీర్ణం ప్రకారం పంచండి.** మిగతా 60% బెడ్‌రూమ్ పరిమాణం ప్రకారం వెళ్తుంది. బెడ్‌రూమ్‌లు కలిపి 38 m² (16 + 12 + 10), కాబట్టి Priya భాగం 60% × 16/38, అంటే 25.26%."
      - "**రెండు భాగాలను కలపండి.** Priya: 25.26% + 13.33% = 38.6%. Tom: 60% × 12/38 = 18.95%, దానికి 13.33% కలిపితే 32.3%. Aisha: 60% × 10/38 = 15.79%, దానికి 13.33% కలిపితే 29.1%."
      - "**పూర్తి సంఖ్యలుగా మార్చి సరిచూడండి.** పూర్తి శాతాలు టైప్ చేయడానికి, వాదించడానికి సులువు, కాబట్టి 38.6% 39% అవుతుంది, 32.3% 32% అవుతుంది, 29.1% 29% అవుతుంది. 39 + 32 + 29 మొత్తం 100 అవుతోందా చూడండి. మీ రౌండింగ్ 99 లేదా 101 వస్తే, ఎవరి సంఖ్యను ఒక పాయింట్ మార్చాలో గ్రూప్ ఒప్పుకుంటుంది."
  - heading: "ఈ ఫ్లాట్ నెలను చదవడం"
    body: "అద్దె 39%, 32%, 29% ప్రకారం £760.50, £624.00, £565.50 అవుతుంది. Priya యజమానికి చెల్లించింది, కాబట్టి నెల మొత్తంలో ఆమెకు £1,142.50 రావాలి, Tom £566.00 ఇవ్వాలి, Aisha £576.50 ఇవ్వాలి. Side Badger రెండు పేమెంట్లను సూచిస్తుంది, రెండూ Priyaకే."
  - heading: "Side Badgerలో సెట్ చేయడం"
    body: "ఒక సాయంత్రం చాలు, అందులో ఎక్కువ సమయం ఆ 40% గురించి చర్చకే పోతుంది."
    items:
      - "**గ్రూప్ చేయండి.** డాష్‌బోర్డ్‌లో **సమూహాన్ని సృష్టించు** ఎంచుకుని ఫ్లాట్ పేరు పెట్టండి. **ఇతరులను ఆహ్వానించండి** ఎంచుకుని లింక్ లేదా QR కోడ్ పంపండి. అందరూ సైన్ ఇన్ అవుతారు లేదా ఉచిత ఖాతా తెరుస్తారు, ఈ గ్రూప్‌లో తమకు కనిపించాల్సిన పేరును ఎంచుకుంటారు."
      - "**అద్దెను జోడించండి.** **ఖర్చును జోడించు** ఎంచుకోండి. వివరణ, మొత్తం నింపండి, **ఎవరు చెల్లించారు?** కింద యజమానికి చెల్లించిన వారిని ఎంచుకోండి. **ఎవరి మధ్య విభజించాలి** కింద ముగ్గురినీ ఉంచి, **ఎలా విభజించాలి** కింద **శాతం** ఎంచుకుని 39, 32, 29 టైప్ చేయండి. శాతాల మొత్తం 100 కాకపోతే ఫారం చూపిస్తుంది. **ఖర్చును సేవ్ చేయి** ఎంచుకోండి."
      - "**బిల్లులను జోడించండి.** కరెంటు, బ్రాడ్‌బ్యాండ్ వేర్వేరు ఖర్చులు, వాటికి వేర్వేరు చెల్లించినవాళ్లు ఉంటారు. **ఎలా విభజించాలి**ను **సమానం**గా వదిలేయండి."
      - "**వచ్చే నెల కాపీ చేయండి.** గత నెల అద్దెను తెరిచి **ఖర్చును కాపీ చేయి** ఎంచుకోండి. కాపీలో చెల్లించినవారు, మొత్తం, పంపకం అలాగే ఉంటాయి, తేదీ ఈ రోజుది అవుతుంది. అద్దె మారితే మొత్తం మార్చి, **కాపీని సృష్టించు** ఎంచుకోండి."
      - "**ఎవరు ఎవరికి బాకీనో చూడండి.** **బ్యాలెన్స్‌లు** విభాగం చూపిస్తుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుని, ఆ పేమెంట్‌ను **సెటిల్ చేయి** కింద రికార్డ్ చేయండి."
  - heading: "ఎన్-సూట్లు, బాక్స్ రూమ్‌లు, వెళ్లిపోయేవాళ్లు"
    items:
      - "**ఎన్-సూట్లు, బాక్స్ రూమ్‌లు.** గది విస్తీర్ణం ఒక ప్రారంభ బిందువు మాత్రమే. సొంత బాత్రూమ్ ఉన్న గది, అదే విస్తీర్ణంలో బాత్రూమ్ లేని గది కంటే విలువైనది. ఒక మంచం, ఆశగా ఒక కుర్చీ పట్టే బాక్స్ రూమ్ విలువ తక్కువ. ఒప్పందంతో శాతాలను సర్దుబాటు చేయండి, మొత్తం ఇంకా 100 అవుతోందో చూడండి, తుది అంకెలను ఫ్లాట్ అందరికీ కనిపించే చోట రాయండి."
      - "**ఎవరైనా నెల మధ్యలో వెళ్లిపోతే.** ఆ నెలకు ప్రతి ఒక్కరూ ఎంత ఇవ్వాలో లెక్క వేసి, ఆ నెల అద్దెను **శాతం** బదులు **కచ్చితమైన మొత్తాలు**తో నమోదు చేయండి. మొత్తాలు కలిపితే అద్దె అవ్వాలి. వాళ్లు వెళ్లేలోపే చేయండి. ఎవరికైనా ఇవ్వాల్సినవి లేదా రావాల్సినవి ఉన్నంత వరకు గ్రూప్ వదలలేరు, వెళ్లిపోయిన వ్యక్తి ఉన్న ఖర్చు చదవడానికి మాత్రమే మిగులుతుంది."
      - "**ఎవరైనా కొత్తగా చేరితే.** మళ్లీ కొలవండి, కొత్త గది పరిమాణాలతో లెక్కలు మళ్లీ వేయండి, వచ్చే అద్దె నుంచి కొత్త శాతాలు వాడండి. ముందటి నెలలు ఉన్నట్టే ఉంటాయి."
  - heading: "ఇక్కడ Side Badger చేయనివి"
    items:
      - "ఇది మీ గదులను కొలవదు, శాతాలను ఎంచదు. గది విస్తీర్ణాలు, ఆ 40% గ్రూప్ ఒప్పుకోవాల్సినవి."
      - "ఇందులో పునరావృత బిల్లులు లేవు, కాబట్టి ప్రతిసారీ గత నెల అద్దెను కాపీ చేస్తారు."
      - "ఇది డబ్బు కదపదు, యజమానికి చెల్లించదు. మీరు ఒకరికొకరు మీకు నచ్చిన విధంగా చెల్లించుకుని రికార్డ్ చేస్తారు."
      - "మీ అద్దె ఒప్పందంలో ఏముందో దానికి తెలియదు. ఇది గ్రూప్‌లోని వ్యక్తుల మధ్య లెక్క మాత్రమే ఉంచుతుంది."
exampleAfter: 2
example:
  heading: "ఫ్లాట్‌లో ఒక నెల"
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: tom
      name: Tom
    - id: aisha
      name: Aisha
  expenses:
    - label: "అద్దె"
      payer: priya
      amount: 1950
      split:
        method: percent
        shares:
          priya: 39
          tom: 32
          aisha: 29
    - label: "కరెంటు బిల్లు"
      payer: tom
      amount: 105
      split:
        method: equal
    - label: "బ్రాడ్‌బ్యాండ్"
      payer: aisha
      amount: 36
      split:
        method: equal
faq:
  heading: ప్రశ్నలు
  items:
    - q: "ఒకరి గది పెద్దది కానీ వెలుతురు తక్కువైతే?"
      a: "గది విస్తీర్ణం ప్రారంభ బిందువు మాత్రమే, కాబట్టి గ్రూప్ సర్దుబాటుకు ఒప్పుకోవచ్చు. చీకటి గది నుంచి ఒకటి రెండు పాయింట్లు తీసి, మిగతావాళ్లకు ఇచ్చి, మొత్తం ఇంకా 100 అవుతోందో చూడండి. మీరు ఒప్పుకున్నది Side Badger నిల్వ చేస్తుంది, దాన్ని తీర్పు చెప్పదు."
    - q: "బిల్లులను కూడా గది పరిమాణం ప్రకారం పంచాలా?"
      a: "సాధారణంగా వద్దు. కరెంటు, బ్రాడ్‌బ్యాండ్ అందరూ వాడతారు, కాబట్టి పై ఉదాహరణలా సమానంగా పంచడం సులువు. ఒక రూమ్‌మేట్ రోజంతా ఇంట్లోనే ఉంటే, గ్రూప్ కచ్చితమైన మొత్తాల లాంటి వేరే ఏర్పాటుకు ఒప్పుకోవచ్చు. ఎంపికలను [ఖర్చుల పంపకం](page:feature/split-expenses) వివరిస్తుంది."
    - q: "తర్వాత పంపకాన్ని మార్చవచ్చా?"
      a: "అవును, కొత్త ఖర్చులకు. అద్దెను కాపీ చేసేటప్పుడు శాతాలు మార్చండి, ముందటి నెలలు అలాగే ఉంటాయి. గతంలోని ఖర్చును సరిచేయాలంటే, గ్రూప్ అనుమతులు ఒప్పుకుంటే దాన్ని సవరించండి, బ్యాలెన్స్‌లు మారతాయి కాబట్టి ముందు ఇంట్లో వాళ్లకు చెప్పండి. ముందటి వెర్షన్ ఉంచబడుతుంది."
