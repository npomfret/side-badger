faq:
  heading: "सवाल"
  items:
    - q: "क्या मैं सिर्फ अपने हिस्से पर सवाल उठा सकता हूँ?"
      a: "नहीं। सवाल पूरे खर्च को रोकता है, उसमें शामिल सबके लिए। अगर सिर्फ बंटवारा गलत है, तो उपाय बंटवारे को एडिट करना है।"
    - q: "सवाल कौन बंद कर सकता है?"
      a: "सवाल उठाने वाला व्यक्ति, या ग्रुप का एडमिन। अगर खर्च जोड़ने वाला एडमिन नहीं है, तो वह सवाल उठाने वाले की तरफ से उसे बंद नहीं कर सकता।"
    - q: "क्या खर्च एडिट करने से मूल वर्शन मिट जाता है?"
      a: "नहीं। पहले वाला वर्शन रखा जाता है। कौन एडिट कर सकता है, यह ग्रुप की अनुमतियां तय करती हैं, इसलिए घर में पहले बता देना ठीक रहता है, क्योंकि बैलेंस बदलते हैं।"
