featuresHeading: The features a house uses
faq:
  heading: Questions
  items:
    - q: Can rent repeat automatically?
      a: No, there are no recurring bills. Copy last month's rent in a couple of taps, change the date and you are done.
    - q: Can we split by room size?
      a: Yes, by percentage. Give each housemate a share that reflects their room, as long as the shares add up to 100. [Split expenses](page:feature/split-expenses) covers the other ways to split.
    - q: What if a housemate moves out owing money?
      a: They can't leave the group until they have settled, because nobody can leave while they owe or are owed money. The numbers stay honest until everyone is square.
    - q: Does Side Badger pay the bills?
      a: No. It keeps the count and suggests a short list of payments. You pay each other however you like, then record it, as [settle up](page:feature/settle-up) explains.
    - q: Can one housemate keep the books?
      a: Yes. Make them an admin and use a managed group, where new members need approval and only creators and admins can change expenses.
