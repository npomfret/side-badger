meta:
  title: "Lunasi dengan lebih sedikit pembayaran | Side Badger"
  description: "Lihat siapa berutang kepada siapa di grup Anda, dapatkan daftar pembayaran singkat yang melunasi semua orang, dan catat setiap pembayaran saat terjadi. Gratis digunakan."
h1: "Lunasi dengan lebih sedikit pembayaran"
navLabel: "Pelunasan"
lead: "Side Badger menyimpan saldo berjalan untuk semua orang di grup dan menyarankan daftar pembayaran singkat yang melunasinya. Anda membayar satu sama lain dengan cara apa pun yang disuka, lalu mencatatnya. Jika ingin melihat dulu bagaimana angkanya dibagi, mulai dengan [bagi pengeluaran](page:feature/split-expenses)."
cta:
  heading: "Siap mengurai siapa berutang kepada siapa?"
  body: "Buat akun, mulai grup, dan tambahkan pengeluaran pertama. Saldo akan mengurus sisanya."
problem:
  heading: "Saldo yang diperbarui seiring berjalan"
  body: "Setiap pengeluaran mengubah siapa berutang kepada siapa, jadi Side Badger menjaga saldo tetap terkini saat pengeluaran dan pembayaran ditambahkan. Semua orang di grup langsung melihat perubahan, dan melihat apa yang berubah serta siapa yang mengubahnya. Saldo disimpan per mata uang, jadi euro dan pound tetap di kolomnya masing-masing kecuali sebuah pengeluaran dikonversi saat dimasukkan. Secara bawaan Anda melihat utang yang melibatkan Anda; **Tampilkan semua** mencantumkan seluruh grup."
workflow:
  heading: "Tiga langkah menuju impas"
  steps:
    - title: "Lihat siapa berutang kepada siapa"
      body: "Buka saldo grup untuk melihat apa yang Anda utang, apa yang dihutangi kepada Anda, dan daftar pembayaran singkat yang melunasi semua orang, dihitung per mata uang. Pengeluaran yang dipertanyakan tetap di luar hitungan sampai beres. Pada contoh teman serumah di bawah, enam pembayaran menjadi dua."
      shot: S10
      shotAlt: "Layar saldo yang menampilkan utang yang disederhanakan dalam dua mata uang, dengan Tampilkan semua diaktifkan"
    - title: "Bayar dengan cara apa pun, lalu catat"
      body: "Transfer bank, tunai, atau utang budi dari liburan lalu. Side Badger tidak memindahkan uangnya. Setelah uang berpindah tangan, catat pembayarannya dan saldo diperbarui untuk semua orang."
      shot: S11
      shotAlt: "Formulir pembayaran dengan tombol lunasi cepat dan pemberitahuan yang ditampilkan untuk pembayaran sebagian"
    - title: "Pastikan sudah sampai"
      body: "Pembayaran masuk ke riwayat grup, tempat semua orang di grup dapat melihatnya dan memberi reaksi emoji. Rayakan pembayaran saat sudah sampai."
      shot: S12
      shotAlt: "Riwayat pembayaran dengan reaksi emoji pada sebuah pembayaran"
