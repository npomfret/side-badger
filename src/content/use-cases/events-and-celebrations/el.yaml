featuresHeading: "Οι λειτουργίες που χρησιμοποιεί αυτό"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορούν οι καλεσμένοι να δουν την ομάδα χωρίς να μπουν;"
      a: "Όχι. Τα άτομα μπαίνουν με σύνδεσμο ή κωδικό QR και δωρεάν λογαριασμό, οπότε βλέπουν την ομάδα μόλις μπουν."
    - q: "Μπορεί το Side Badger να μαζέψει τα χρήματα;"
      a: "Όχι. Το Side Badger κρατά τον λογαριασμό και δεν μετακινεί ποτέ χρήματα. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή. Είναι δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια· δείτε τις [τιμές](page:pricing)."
    - q: "Μπορούν οι ψήφοι να είναι ανώνυμοι;"
      a: "Ναι. Όταν δημιουργείτε μια δημοσκόπηση, μπορείτε να κρύψετε ποιος ψήφισε τι. Οι ρυθμίσεις μπορούν να αλλάξουν μόνο πριν από την πρώτη ψήφο."
    - q: "Μπορούν οι άνθρωποι να συνεισφέρουν διαφορετικά ποσά;"
      a: "Ναι. Χωρίστε ένα έξοδο με ακριβή ποσά, ώστε το μερίδιο του καθενός να είναι το ποσό που συμφωνήσατε, ή αφήστε έξω όσους δεν συμμετείχαν."
    - q: "Μπορεί ένας διοργανωτής να κρατά τα βιβλία;"
      a: "Ναι. Χρησιμοποιήστε την προεπιλογή της διαχειριζόμενης ομάδας, ώστε μόνο οι δημιουργοί και οι διαχειριστές να αλλάζουν έξοδα και οι διαχειριστές να εγκρίνουν τα νέα μέλη."
