sections:
  - heading: 39 kieltä, tehty useammille
    body: Käytä Side Badgeria 39 kielellä, myös oikealta vasemmalle kirjoitettavilla arabialla, persialla ja urdulla. Jokainen ryhmän jäsen voi valita oman kielensä, joten ryhmäsivu voi olla yhdelle arabiaksi ja seuraavalle englanniksi. Palvelu on tehty myös näppäimistön ja ruudunlukijan käyttäjät huomioiden, ja jäsenten väreissä on kuviot, joten vihreää ja punaista ei tarvitse erottaa pelkästä sävystä.
faq:
  heading: Kysymyksiä
  items:
    - q: Tarvitseeko jokainen tilin?
      a: Kyllä, ilmaisen. Jokainen vahvistaa sähköpostinsa ennen kuin voi lisätä mitään.
    - q: Onko olemassa sovellusta?
      a: Se toimii selaimessa. Kirjaudu sisään ja lisää se sitten aloitusnäytölle tai telakkaan, jolloin se avautuu kuin sovellus. Sovelluksen Asetukset näyttää, miten. Sovelluskauppaversiota ei ole, eikä offline-tilaa.
    - q: Siirtääkö Side Badger rahaa?
      a: Ei. Se pitää kirjaa ja ehdottaa maksuja, ja te maksatte toisillenne miten haluatte. Sen jälkeen kirjaat maksun. Katso [tilien tasaus](page:feature/settle-up).
    - q: Voiko joku lähteä ryhmästä velkaa?
      a: Ei. Kukaan ei voi poistua ryhmästä, jos hän on vielä velkaa tai hänelle ollaan velkaa, joten hän tasaa ensin.
    - q: Kuinka monta ihmistä ryhmään voi liittyä?
      a: Ryhmässä voi olla enintään 50 ihmistä. Kutsu heidät linkillä tai QR-koodilla, ja ota hyväksyntä käyttöön, jos haluat ylläpitäjän päästävän jokaisen sisään erikseen.
    - q: Entä matkat, joilla on useampi kuin yksi valuutta?
      a: Saldot pidetään erikseen jokaiselle valuutalle. Katso [useita valuuttoja](page:feature/multiple-currencies).
