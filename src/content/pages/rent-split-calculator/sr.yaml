meta:
  title: "Калкулатор поделе кирије: по соби или примањима | Side Badger"
  description: "Већа соба, већи удео? Израчунај колико плаћа сваки цимер, по величини собе или по примањима. Ради у прегледачу: ништа се не чува ни шаље."
h1: "Калкулатор поделе кирије"
navLabel: "Калкулатор поделе кирије"
lead: "Већа спаваћа соба, већи удео? Унеси кирију и види шта плаћа свако, по величини собе или по примањима, до последњег пенија. Ради у твом прегледачу, ништа не чува и не премешта новац. Кад кућа жели да рачуница остане, [подели трошкове](page:feature/split-expenses) у Side Badger-у и копирај кирију сваког месеца."
cta:
  heading: "Договори проценте једном. Копирај их заувек."
  body: "Овај калкулатор заборавља све кад затвориш картицу, баш као цимер који је сигурно платио интернет. Side Badger група чува кирију, рачуне и ко је шта платио. Бесплатно је, без огласа и без дневних ограничења."
sections:
  - heading: "Два начина да се подели кирија"
    items:
      - "**По величини собе.** Део кирије плаћа кухињу, купатило и дневну собу, које сви користе. Ти бираш тај удео (за почетак 40 %) и он се дели једнако. Остатак иде по површини спаваће собе, па велика соба плаћа више, а остава добија попуст који је заслужила."
      - "**По примањима.** Свако плаћа исти део кирије колики је његов део укупне зараде. Додај заједничке рачуне и они прате исте уделе."
  - heading: "Како раде рачуни"
    body: "Свако добија тачан удео, а затим цео проценат, јер је целе бројеве лакше укуцати и око њих се препирати. Заокруживање иде методом највећег остатка: свако задржава цео број испод свог удела, а преостали поени иду ономе ко је највише изгубио. Проценти увек дају 100. У стану испод, заједнички део од 40 % је по 13,33 % за свакога. Пријина соба има 16 од 38 m² стана, па је 60 % × 16/38 једнако 25,26 %, плус 13,33 % даје 38,6 %, што се заокружује на 39 %. Том и Аиша излазе на 32 % и 29 %, а 39 + 32 + 29 је 100. Сваки износ је тај проценат кирије: 39 % од 1.950 £ је 760,50 £."
  - heading: "Затим то укуцај у Side Badger"
    body: "За целу причу, са метром укључено, погледај [како поделити кирију по величини собе](page:guide/how-to-split-rent-by-room-size), а за парове [партнера који више зарађује](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
    items:
      - "**Додај кирију.** У својој групи изабери **Додај трошак**, под **Ко је платио?** изабери ко је платио станодавцу и остави све под **Подели између**."
      - "**Изабери Проценат.** Под **Начин поделе** изабери **Проценат** и укуцај целе проценте. Образац те упозори ако не дају 100."
      - "**Копирај је следећег месеца.** Отвори прошломесечну кирију и изабери **Копирај трошак**. Подела долази уз њу."
  - heading: "Шта калкулатор не ради"
    items:
      - "**Не мери твоје собе.** Површина је полазна тачка. Соба са сопственим купатилом вреди више од исте површине без њега, а остава у коју стаје кревет и једна оптимистична столица вреди мање."
      - "**Не одлучује шта су примања.** Нето или бруто, плата или хонорарни посао: одлучује група. Користи исти период за све."
      - "**Не чува ништа.** Затвориш картицу и бројеви нестану. Да их сачуваш, копирај везу. Она садржи твоје бројеве иза знака #, које прегледачи никад не шаљу серверу, а свако ко је има може их прочитати."
      - "**Не премешта новац.** Станодавцу плаћаш како год желиш."
      - "**Не меша валуте и не прелази ограничења.** Изабери једну валуту. Прихвата од 2 до 10 људи и кирију до 999.999,99, као у апликацији."
exampleAfter: 2
example:
  heading: "Један стан, један месец"
  currency: GBP
  people:
    - id: priya
      name: Прија
    - id: tom
      name: Том
    - id: aisha
      name: Аиша
  expenses:
    - label: "кирија"
      payer: priya
      amount: 1950
      split:
        method: percent
        shares:
          priya: 39
          tom: 32
          aisha: 29
    - label: "струја"
      payer: tom
      amount: 105
      split:
        method: equal
    - label: "интернет"
      payer: aisha
      amount: 36
      split:
        method: equal
faq:
  heading: "Питања"
  items:
    - q: "Шта је поштеније, величина собе или примања?"
      a: "Ниједно увек. Величина собе одговара цимерима који плаћају простор у коме спавају. Примања одговарају паровима и пријатељима са веома различитим платама. Договорите се пре првог дана кирије, а не после."
    - q: "Да ли рачуне треба делити на исти начин?"
      a: "За цимере, обично не. Сви користе струју и интернет, па је једнако једноставније, као у примеру. По примањима, калкулатор рачунима даје исте уделе као кирији."
    - q: "Могу ли да користим квадратне стопе?"
      a: "Да. Изабери ft² и укуцај површине у квадратним стопама. Јединица је само ознака, а удели излазе исти све док сви користе једну."
    - q: "Да ли је калкулатор бесплатан?"
      a: "Да. Бесплатан. Без огласа. Без дневних ограничења. Не треба ти ни кориснички налог."
