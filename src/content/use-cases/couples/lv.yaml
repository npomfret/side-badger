featuresHeading: "Funkcijas, ko izmanto pāris"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai varam vienreiz iestatīt 60/40 visam?"
      a: "Nē. Sadale pieder katram izdevumam. Iestatiet procentus pirmajā, tad nākamreiz to nokopējiet un nomainiet to, kas atšķiras. [Izdevumu sadale](page:feature/split-expenses) aptver visus trīs sadales veidus."
    - q: "Vai tas savienojas ar mūsu banku?"
      a: "Nē. Side Badger nekad neskar jūsu naudu. Jūs samaksājat viens otram, kā vēlaties, tad to reģistrējat, kā skaidro [norēķināšanās](page:feature/settle-up)."
    - q: "Vai kāds cits var redzēt mūsu grupu?"
      a: "Tikai tās dalībnieki, un pāra grupā to ir divi. Ikviens, kas izmanto derīgu uzaicinājuma saiti, var pievienoties, tāpēc kopīgojiet to ar vienu cilvēku un iestatiet īsu derīguma termiņu."
    - q: "Ko darīt, ja katrs samaksājām daļu no viena un tā paša rēķina?"
      a: "Izdevumam ir viens maksātājs. Reģistrējiet divus izdevumus, vienu katram, un atlikums sanāk tāds pats."
    - q: "Vai tas atgādinās partnerim samaksāt?"
      a: "Nē. Atgādinājumu nav, tāpēc pamudināšana joprojām ir jūsu ziņā. Vismaz abi skatīsieties uz vienu un to pašu skaitli."
    - q: "Kas notiek, kad pārtraucam dalīt izmaksas?"
      a: "Nokārtojiet atlikumu un reģistrējiet maksājumu, lai neviens nav parādā. Tad administrators var bloķēt grupu, kas saglabā skaitļus, kādi tie ir, vai aizvērt to uz visiem laikiem, kas padara to nepieejamu visiem. Aizveriet to tikai tad, kad nevienam no jums vairs nevajag vēsturi."
