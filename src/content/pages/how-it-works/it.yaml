meta:
  title: Come funziona Side Badger | Dividi le spese di gruppo in cinque passaggi
  description: Crea un gruppo, invita le persone, aggiungi le spese e salda i conti. Scopri cosa succede tra "qualcuno ha pagato" e "siamo pari", con un esempio svolto.
h1: Come funziona Side Badger
navLabel: Come funziona
lead: Cosa succede tra "qualcuno ha pagato" e "siamo pari"? Cinque passaggi, nessun foglio di calcolo e un tasso che è per lo più decorativo. Ecco l'intero percorso, dal primo gruppo all'ultimo pagamento registrato. Per i dettagli di ogni passaggio, vedi [dividere le spese](page:feature/split-expenses) e [saldare i conti](page:feature/settle-up).
cta:
  heading: Da "offro io" a "siamo pari"
  body: Crea un account gratuito, avvia un gruppo e aggiungi la prima spesa. Il tasso non giudicherà lo scontrino.
  button: Crea un account gratuito
steps:
  - title: Crea un gruppo
    body: Crea un gruppo per ogni casa, viaggio o evento, così l'affitto non finisce mai nella stessa lista del regalo di nozze. Dagli un nome, scegli il nome con cui vuoi essere visto e, se vuoi, limita le valute accettate. La tua dashboard mostra poi tutti i gruppi, e a che punto sei in ciascuno, in un'unica schermata.
    shot: S02
    shotAlt: La finestra di creazione del gruppo con la sezione delle restrizioni sulle valute aperta
  - title: Invita le tue persone
    body: Condividi un link di invito o mostra un codice QR, e decidi per quanto tempo vale, da 15 minuti fino a 5 giorni. Chi si unisce ha bisogno di un account gratuito e di un'email verificata, e un gruppo può contenere fino a 50 persone. Se vuoi scegliere chi entra, attiva l'approvazione e un admin farà entrare ogni persona.
    shot: S03
    shotAlt: La finestra di invito nella scheda del link, con un codice QR e le scelte di scadenza
  - title: Aggiungi le spese man mano che succedono
    body: Indica chi ha pagato, quanto e per chi. Dividi in parti uguali, per importi esatti o per percentuale, ed escludi chi non c'entrava. Aggiungi la spesa e tutti la vedono subito, insieme a cosa è cambiato e a chi l'ha cambiato.
    shot: S05
    shotAlt: Il modulo della spesa con una divisione percentuale, che ripartisce l'affitto in base alla dimensione delle stanze
  - title: Tieni d'occhio i saldi
    body: Side Badger tiene un saldo aggiornato per ogni valuta, così vedi a colpo d'occhio chi deve cosa a chi. Invece di lasciare che ognuno districhi una ragnatela di piccoli debiti, suggerisce una breve lista di pagamenti che salda il gruppo.
    shot: S10
    shotAlt: La schermata dei saldi con i debiti semplificati in due valute e l'opzione Mostra tutti attivata
  - title: Salda fuori dall'app, registra dentro
    body: Side Badger non sposta mai denaro. Pagatevi come vi fa più comodo, poi registrate il pagamento perché i saldi si aggiornino, e lo schermo di tutti si aggiorna senza ricaricare. "Saldare" significa semplicemente che i saldi sono a zero. Nessuno può lasciare un gruppo finché deve o deve ricevere denaro, quindi chi sta per andarsene salda prima.
    shot: S11
    shotAlt: Il modulo del pagamento con i pulsanti di saldo rapido e l'avviso per il pagamento parziale
requirements:
  heading: Cosa ti serve
  items:
    - Un account gratuito. Bastano un indirizzo email e una password, e devi verificare l'email prima di poter aggiungere qualsiasi cosa.
    - Avere 18 anni o più.
    - Un browser moderno su telefono o computer e una connessione. Side Badger non è un'app da store e non funziona offline.
    - Facoltativamente, un posto nella schermata Home. Non serve nessuno store, perché puoi aggiungere Side Badger alla schermata Home o al dock e si apre come un'app.
