meta:
  title: "Side Badger vs Splitwise: celá skupina, ne jen součty | Side Badger"
  description: "Bezplatná alternativa ke Splitwise pro celou skupinu: komentáře, otázky, seznamy, hlasování a pořádné role, k tomu skenování účtenek a převod měn zdarma."
h1: "Side Badger vs Splitwise: celá skupina, ne jen součty"
navLabel: Side Badger vs Splitwise
lead: "Někdo ve vaší skupině už nejspíš řekl: „Použijme Splitwise.“ To je fér: v počtech je dobrý. Side Badger počítá taky a pak dá skupině místo, kde si to probrat: komentáře, otázky, seznamy, hlasování a pořádné role ve skupině. Skenování účtenek a převod měn jsou zdarma."
cta:
  heading: Vyzkoušejte to na dalším společném účtu
  body: Vytvořte si bezplatný účet, založte skupinu a přidejte jeden skutečný výdaj. Pokud to nebude pro vás, stálo vás to pár minut, ne předplatné.
asOf: 2026-11-22
asOfNote: Vlastní stránky Splitwise jsme přečetli dne {date}, abyste to nemuseli vy, a všechno, co se tu o Splitwise píše, pochází z nich. Každý řádek tabulky odkazuje na svůj zdroj. Plány se mění, proto je kontrolujeme znovu každé čtvrtletí, a pokud se stránky Splitwise s touto neshodují, věřte jim.
