    - feature: Konexiorik gabeko erabilera
      other: Konexiorik gabeko modu bat zerrendatzen du bere oinarrizko ezaugarrien artean.
      sideBadger: Ez. Konexioa behar du.
      source: home
    - feature: Ordainketak eta zure bankua
      other: "Toki batzuetan dirua bidal dezake aplikazioaren barrutik: Splitwise Pay AEBetan, Venmo dolar estatubatuarreko saldoetarako, PayPal eta Pay by Bank Europako herrialde jakin batzuetan, zeinak kontu korronte pertsonal bat lotzen duen."
      sideBadger: Ez du inoiz zure dirua ukitzen eta ez dizu zure banku-daturik eskatzen. Ordaindu besteei nahi duzun moduan, eta gero erregistratu ordainketa.
      source: payments-help
    - feature: Grafikoak eta lehenetsitako banaketak
      other: Biak Pro ezaugarriak dira.
      sideBadger: Bat ere ez.
      source: pro
faq:
  heading: Galderak
  items:
    - q: Side Badger Splitwise-ren ordezko doakoa al da?
      a: "Talde batean kontuak banatzeko, bai, eta zenbakiak baino gehiago egiten du: iruzkinak, galderak, zerrendak, inkestak eta talde-rolak, ordainagirien eskaneatzea eta moneta-bihurketa doan. Aplikazio-denda bateko aplikazio bat, konexiorik gabeko erabilera edo aplikazioaren barruko ordainketak behar badituzu, Splitwise-k egiten ditu eta Side Badger-ek ez."
    - q: Nondik datoz Splitwise-ri buruzko xehetasunak?
      a: "Splitwise-ren bere orrietatik: bere hasiera orritik, bere Pro orritik eta bere laguntza-zentrotik. Taulako errenkada bakoitzak jatorri duen orrira lotzen du, eta taularen gaineko datak noiz irakurri genituen esaten du. Hiruhilekoro egiaztatzen ditugu."
    - q: Side Badger-ek doakoa izaten jarraituko al du?
      a: Side Badger-en dena doakoa da gaur egun. Hori aldatuz gero, aurretik jakinaraziko dizugu. [Prezioen orrian](page:pricing) xehetasunak daude.
    - q: Nire taldeko guztiek aldatu behar dute?
      a: Bai. Talde bateko guztiek doako Side Badger kontu bat behar dute, eta esteka edo QR kode batekin sar daitezke.
    - q: Side Badger-ek mugikorrerako aplikaziorik al du?
      a: "Aplikazio-denda batean ez. Zure nabigatzailean dabil: hasi saioa telefonoan, eta gero gehitu hasierako pantailara aplikazio bat bezala ireki dadin. [Nola funtzionatzen duen](page:how-it-works) orrian erakusten da."
