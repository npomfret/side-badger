meta:
  title: "더치페이 계산기: 누가 누구에게 낼지 정리 | 사이드 배저"
  description: "누가 결제했고, 누가 빚졌고, 누가 누구에게 낼지 몇 초 만에 정리하세요. 똑같이, 정확한 금액으로, 비율로 나눌 수 있어요. 무료이고, 브라우저에서 작동하며, 아무것도 저장하거나 전송하지 않습니다."
h1: "더치페이 계산기"
navLabel: "더치페이 계산기"
lead: "누가 무엇을 결제했는지 입력하면 계산기가 누가 누구에게 빚졌는지, 그리고 정산에 필요한 짧은 결제 목록을 알려 줍니다. 브라우저에서 작동하고, 아무것도 저장하지 않으며, 돈을 옮기지도 않아요. 그룹의 계산이 탭을 닫은 뒤에도 남아야 한다면, 사이드 배저의 [지출 나누기](page:feature/split-expenses)와 [정산하기](page:feature/settle-up)가 같은 계산을 하고 기록까지 남겨 줍니다."
cta:
  heading: "계산이 마음에 드셨나요? 간직하세요."
  body: "이 계산기는 탭을 닫으면 모든 걸 잊어버려요. 지난번에 분명히 냈다던 바로 그 사람처럼요. 사이드 배저 그룹은 지출을 보관하고, 모두의 잔액을 업데이트하고, 결제를 기록합니다. 무료이며 광고도, 일일 한도도 없습니다."
sections:
  - heading: "계산은 이렇게 작동해요"
    body: "계산기는 지출마다 사람별 몫을 계산합니다. 고른 사람들끼리 똑같이, 정확한 금액으로, 또는 비율로 나눌 수 있어요. 그다음 각 사람의 잔액은 낸 돈에서 내야 할 돈을 뺀 값입니다. 잔액이 플러스면 그룹이 그 사람에게 줄 돈이 있다는 뜻이고, 마이너스면 그 사람이 그룹에 줄 돈이 있다는 뜻이에요. 한 사람이 받을 돈은 다른 사람들이 줄 돈이므로 잔액의 합은 언제나 0입니다."
  - heading: "결제 목록이 짧은 이유"
    body: "영수증마다 따로 정산할 필요는 없어요. 모든 잔액이 나오면 계산기는 가장 많이 줘야 하는 사람과 가장 많이 받아야 하는 사람을 짝지어 결제 한 번으로 정리할 수 있는 만큼 정산하고, 모두가 0이 될 때까지 목록을 따라 계속 진행합니다. 필요한 결제는 많아도 잔액이 있는 사람 수보다 한 건 적은 수를 넘지 않고, 지출을 하나씩 정산할 때보다 적은 경우가 많아요. 짧은 결제 목록을 제공하지만, 가능한 가장 짧은 목록이라고 장담하지는 않습니다."
  - heading: "계산기가 하지 않는 일"
    items:
      - "**여러 통화 다루기.** 하나를 골라 계산 전체에 쓰세요. 앱은 통화마다 잔액을 따로 관리하고, 지출을 현재 환율로 환산할 수 있으며, 그 환율은 직접 바꿀 수 있어요."
      - "**저장하기.** 탭을 닫으면 입력한 금액은 사라집니다. 남기고 싶다면 링크를 복사하세요. 링크에는 주소의 # 뒤에 금액이 담기는데, 브라우저는 이 부분을 서버로 보내지 않아요. 다만 링크를 받은 사람은 누구나 그 금액을 볼 수 있습니다."
      - "**돈 옮기기.** 누가 누구에게 지불해야 하는지 알려 줄 뿐입니다. 서로 원하는 방법으로 지불하고, 그룹이 앱에서 계산을 관리한다면 그다음 앱에 결제를 기록하세요."
      - "**남는 한 푼을 무작위로 배정하기.** 금액이 딱 나누어떨어지지 않으면 남는 몇 푼은 목록 앞쪽 사람들에게 가므로 합계는 그대로 맞습니다. 앱에서는 남는 한 푼이 무작위로 한 사람에게 가서 늘 같은 사람이 되지는 않아요."
      - "**한도 넘기기.** 계산기에는 2명에서 20명까지 입력할 수 있고, 지출 한 건은 최대 999,999.99까지 가능해요. 앱과 같습니다."
exampleAfter: 2
