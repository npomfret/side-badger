meta:
  title: "Paano hatiin ang upa ayon sa laki ng kuwarto | Side Badger"
  description: "Mas malaki ang kuwarto, mas malaki ang bahagi. Ihiwalay ang shared na espasyo, hatiin ang iba ayon sa floor area, at ilagay ang porsyento nang isang beses. May kuwenta para sa tatlong housemate."
h1: "Paano hatiin ang upa ayon sa laki ng kuwarto"
navLabel: "Upa ayon sa laki ng kuwarto"
lead: "Pagpasyahan kung gaano kalaking bahagi ng upa ang para sa mga shared na kuwarto at hatiin iyon nang pantay, saka hatiin ang natitira ayon sa floor area ng bawat kuwarto. I-round sa buong porsyento, ilagay ang mga ito sa upa sa Side Badger nang isang beses, at kopyahin ang gastos bawat buwan."
cta:
  heading: "Ilagay ang upa nang isang beses"
  body: "Gumawa ng libreng account, magsimula ng grupo para sa apartment, at ilagay ang upa kasama ang mga porsyentong napagkasunduan ninyo. Kopya na lang ang susunod na buwan. Gusto munang silipin ang app? Tingnan ang [paano ito gumagana](page:how-it-works) o ang [saklaw ng libre](page:pricing)."
sections:
  - heading: "Tatlong tao, isang apartment, isang pagtatalo"
    body: "Magkasamang umuupa sina Priya, Tom, at Aisha ng apartment sa halagang £1,950 kada buwan. Isang taon nila itong hinati sa tatlo, dahil madali iyon. Tapos sinukat ni Aisha ang kuwarto niya. 16 m² ang kuwarto ni Priya, 12 m² ang kay Tom, at 10 m² ang kay Aisha, kaya kapareho ng binabayaran ni Priya ang binabayaran ni Aisha para sa kuwartong mas maliit nang mahigit isang-katlo. Walang naging hindi makatwiran. Wala lang talagang nagkuwenta. Habang may take-out sa harap, nagkasundo muna sila sa isang patakaran: 40% ng upa ang pambayad sa kusina, banyo, at sala, na ginagamit nilang tatlo."
  - heading: "Ang paraan, kasama ang kuwenta"
    body: "Apat na hakbang, isang panukat, at calculator sa telepono."
    items:
      - "**Ihiwalay ang shared na bahagi.** Nagkakasundo ang grupo kung gaano kalaking bahagi ng upa ang para sa mga kuwartong ginagamit ng lahat. Sa apartment na ito, 40% iyon, na 13.33% bawat isa sa tatlong tao."
      - "**Hatiin ang natitira ayon sa floor area.** Ang natitirang 60% ay ayon sa laki ng kuwarto. Umaabot sa 38 m² ang kabuuan ng mga kuwarto (16 + 12 + 10), kaya ang bahagi ni Priya ay 60% × 16/38, na 25.26%."
      - "**Pagsamahin ang dalawang bahagi.** Priya: 25.26% + 13.33% = 38.6%. Tom: 60% × 12/38 = 18.95%, dagdagan ng 13.33% ay 32.3%. Aisha: 60% × 10/38 = 15.79%, dagdagan ng 13.33% ay 29.1%."
      - "**I-round at i-check.** Mas madaling i-type at pagtalunan ang buong porsyento, kaya ang 38.6% ay nagiging 39%, ang 32.3% ay nagiging 32%, at ang 29.1% ay nagiging 29%. Tiyaking 100 ang 39 + 32 + 29. Kung 99 o 101 ang kinalabasan ng pag-round mo, magkakasundo ang grupo kung kaninong bilang ang gagalaw nang isang punto."
  - heading: "Pagbasa sa isang buwan ng apartment"
    body: "Ang upa sa 39%, 32%, at 29% ay lumalabas na £760.50, £624.00, at £565.50. Si Priya ang nagbayad sa landlord, kaya sa buong buwan, may makukuha siyang £1,142.50, samantalang may utang si Tom na £566.00 at si Aisha na £576.50. Nagmumungkahi ang Side Badger ng dalawang bayad, parehong kay Priya."
  - heading: "I-set up sa Side Badger"
    body: "Isang gabi lang, at halos lahat ng oras ay napupunta sa pag-uusap tungkol sa 40%."
    items:
      - "**Gawin ang grupo.** Sa dashboard, piliin ang **Gumawa ng Grupo** at ipangalan ito sa apartment. Piliin ang **Mag-imbita ng Iba** at ipadala ang link o QR code. Magsa-sign in o gagawa ng libreng account ang lahat, at pipiliin ng bawat isa ang pangalang gusto niyang makita sa grupong ito."
      - "**Idagdag ang upa.** Piliin ang **Magdagdag ng Gastusin**. Ilagay ang deskripsyon at halaga, at sa ilalim ng **Sino ang nagbayad?** piliin kung sino ang nagbayad sa landlord. Panatilihin ang lahat ng tatlong tao sa ilalim ng **Hatiin sa pagitan ng**, saka sa ilalim ng **Paano hatiin** piliin ang **Porsyento** at i-type ang 39, 32, at 29. Magbababala ang form kung hindi umabot sa 100 ang kabuuan ng mga porsyento. Piliin ang **I-save ang Gastusin**."
      - "**Idagdag ang mga bayarin.** Magkahiwalay na gastos ang kuryente at internet, bawat isa ay may sariling nagbayad. Iwanan ang **Paano hatiin** sa **Pantay**."
      - "**Kopyahin ito sa susunod na buwan.** Buksan ang upa noong nakaraang buwan at piliin ang **Kopyahin ang gastusin**. Pinapanatili ng kopya ang nagbayad, ang halaga, at ang hati, at kinukuha nito ang petsa ngayon. Baguhin ang halaga kung nagbago ang upa, saka piliin ang **Gumawa ng Kopya**."
      - "**Tingnan kung sino ang may utang kanino.** Ipinapakita ito ng seksyong **Mga Balanse**. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad sa ilalim ng **Magbayad**."
  - heading: "Kuwartong may sariling banyo, napakaliit na kuwarto, at mga aalis"
    items:
      - "**Kuwartong may sariling banyo at napakaliit na kuwarto.** Panimulang punto lang ang floor area. Mas mahalaga ang kuwartong may sariling banyo kaysa sa kuwartong kasinlaki nito na wala, at mas mababa ang halaga ng kuwartong kasya lang ang kama at isang upuang nagbabakasakali. Isaayos ang mga porsyento ayon sa kasunduan, tiyaking 100 pa rin ang kabuuan, at isulat ang pinal na bilang sa lugar na nakikita ng buong apartment."
      - "**May lumipat palabas sa kalagitnaan ng buwan.** Kuwentahin kung magkano ang utang ng bawat isa para sa buwang iyon at ilagay ang upa ng buwang iyon gamit ang **Eksaktong halaga** sa halip na **Porsyento**. Dapat umabot sa upa ang kabuuan ng mga halaga. Gawin ito bago sila umalis. Walang makakaalis sa grupo habang may utang o may sisingilin pa, at nagiging read-only ang gastos na kinasasangkutan ng taong umalis na."
      - "**May lumipat papasok.** Sukatin ulit, ulitin ang kuwenta gamit ang bagong sukat ng mga kuwarto, at gamitin ang bagong porsyento simula sa susunod na upa. Nananatili ang mga naunang buwan kung ano ang mga ito."
  - heading: "Ang hindi ginagawa ng Side Badger dito"
    items:
      - "Hindi nito sinusukat ang mga kuwarto ninyo o pinipili ang mga porsyento. Ang grupo ang dapat magkasundo sa floor area at sa 40%."
      - "Walang umuulit na bayarin, kaya kokopyahin mo ang upa noong nakaraang buwan tuwing kailangan."
      - "Hindi ito naglilipat ng pera at hindi nito binabayaran ang landlord. Magbayaran kayo sa paraang gusto ninyo, saka itala."
      - "Hindi nito alam ang nakasulat sa tenancy agreement ninyo. Ang bilang sa pagitan ng mga tao sa grupo lang ang iniingatan nito."
