sections:
  - heading: "Tikai tie, kas tur bija"
    body: "Sadaliet izmaksas starp visiem vai tikai tiem, kas tajās dalījās. Izlaidiet cilvēkus no izmaksām, kurās viņi nepiedalījās, un atlikumi to atspoguļos. Mājokļa biedrs, kurš visu nedēļu bija prom, nav parādā par līdzņemamo ēdienu, ko [mājokļa biedri](page:use-case/housemates) atpazīs kā elementāru taisnīgumu."
  - heading: "Detaļas, kas vēlāk ietaupa strīdus"
    items:
      - "Iestatiet **datumu** un neobligātu laiku. Īsceļi, piemēram, šodien, vakar, šorīt un pagājušajā vakarā, ietaupa rakstīšanu."
      - "Pievienojiet līdz trim **birkām**, lai grupētu izdevumus, piemēram, pārtikas pirkumi vai ceļošana."
      - "Pievienojiet **vietu**. Ielīmējiet kartes saiti, un vietas nosaukums aizpildās pats."
      - "Pievienojiet **piezīmi** par stāstu aiz skaitļa, ar nelielu formatējumu, ja stāstam vajag."
      - "Izmantojiet **komentārus**, lai sarunu turētu blakus izdevumam, par kuru tā ir, nevis tērzēšanas pavedienā, kurā neviens neritina atpakaļ."
  - heading: "Kopējiet, labojiet un redziet, kas mainījies"
    body: "Nokopējiet pagājušā mēneša īri, nevis rakstiet to no jauna, un nomainiet to, kas atšķiras. Ja skaitlis bija nepareizs, labojiet izdevumu. Iepriekšējā versija tiek saglabāta, un labojums redzams grupas aktivitātēs, tāpēc neviens skaitli nemaina neziņojot. Ko kurš drīkst labot, atkarīgs no grupas atļaujām."
  - heading: "Kad kaut kas šķiet nepareizi"
    body: "Grupa var ieslēgt izdevumu jautājumus. Ikviens, kas iekļauts izdevumā, var uzdot jautājumu un pateikt, kāpēc, un izdevums paliek ārpus atlikumiem, kamēr to neaizver tas, kas jautāja, vai administrators. Pēc noklusējuma tas ir izslēgts, un administrators to ieslēdz grupai. Tas der [pasākumiem un svinībām](page:use-case/events-and-celebrations), kur depozīts, ko neviens neatceras, pēkšņi kļūst par visu darīšanu."
limits:
  heading: "Ierobežojumi"
  items:
    - "Par katru izdevumu maksā viens cilvēks. Ja maksāja divi, reģistrējiet divus izdevumus."
    - "Nav sadales pa pozīcijām un nav sadales pa daļām. Ir vienādi, precīzas summas un procenti."
    - "Procentiem jāsakrīt ar 100."
    - "Izdevums var būt līdz 999 999,99 savā valūtā, ar tās valūtas ierastajām decimālzīmēm."
    - "Izdevumi neatkārtojas paši. Tā vietā nokopējiet pagājušā mēneša."
    - "Datumi nevar būt nākotnē vai vairāk nekā 10 gadus senā pagātnē."
    - "Izdevums, kurā iesaistīts cilvēks, kas pametis grupu, kļūst tikai lasāms."
useCasesHeading: "Kur tāda sadale palīdz"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai divi cilvēki var maksāt par vienu izdevumu?"
      a: "Ne vienā izdevumā. Reģistrējiet divus, vienu katram maksātājam, un atlikumi sanāk tādi paši."
    - q: "Vai varu sadalīt čeku pa pozīcijām?"
      a: "Nē. Sadale ir vienāda, pēc precīzām summām vai procentuāla. Rēķinam ar dažādām pozīcijām ievadiet, cik katrs ir parādā, kā precīzas summas."
    - q: "Vai varu iestatīt noklusējuma sadali?"
      a: "Nē. Nokopējiet iepriekšēju izdevumu, lai atkārtoti izmantotu tā sadali, un nomainiet to, kas atšķiras."
    - q: "Vai rēķini var atkārtoties katru mēnesi?"
      a: "Nē. Tā vietā nokopējiet pagājušā mēneša izdevumu, kas aizņem dažas sekundes."
    - q: "Kurš var labot izdevumu?"
      a: "Tas, kam ļauj grupas atļaujas. Katrs labojums redzams grupas aktivitātēs, tāpēc izmaiņas nekad nav klusas."
    - q: "Kas notiek ar atlikumiem pēc tam?"
      a: "Tie atjaunojas, kad parādās izdevumi, un [norēķināšanās](page:feature/settle-up) tos pārvērš īsā maksājumu sarakstā. Ja izdevums ir citā valūtā, skatiet [vairākas valūtas](page:feature/multiple-currencies)."
