meta:
  title: App para dividir gastos sin descargar nada | Side Badger
  description: Tu móvil está lleno, lo sabemos. Side Badger funciona en el navegador, sin tienda de apps ni descargas. Añádelo a la pantalla de inicio y se abre como una app.
h1: Sin tienda de apps. Sin descargas. Y aun así parece una app
navLabel: Aplicación web
lead: Side Badger vive en tu navegador. No hay tienda de apps que buscar ni nada que descargar primero. Inicia sesión en un móvil o en un ordenador, divide gastos en línea con tu grupo y añádelo a tu pantalla de inicio o a tu Dock cuando lo quieras a un toque.
cta:
  heading: Ábrelo. Inicia sesión. Empieza un grupo.
  body: Crea una cuenta, empieza un grupo y añade el primer gasto, todo desde el navegador que ya tienes abierto. ¿Quieres primero el recorrido? Mira [cómo funciona](page:how-it-works), o consulta [qué cubre lo gratis](page:pricing).
problem:
  heading: Tu móvil está lleno. Lo entendemos.
  body: En algún rincón hay cuatro mil fotos del mismo atardecer y un aviso de almacenamiento que llevas descartando desde la primavera. Lo último que necesita es otra app, solo para dividir una cena. Así que Side Badger es una aplicación web. Funciona en un navegador moderno, en un móvil o en un ordenador. En el móvil usa diseños para móvil, con la página del grupo dividida en pestañas y controles pensados para el tacto. Algunos extras, como añadirla a la pantalla de inicio, dependen de tu navegador, y te decimos dónde.
workflow:
  heading: Del navegador a la pantalla de inicio en tres pasos
  steps:
    - title: Ábrelo e inicia sesión
      body: Ve a Side Badger en tu navegador e inicia sesión. Solo necesitas una dirección de correo electrónico y una contraseña, y verificas el correo antes de poder añadir nada. Todo el mundo en el grupo necesita una cuenta, así que las personas a las que invites harán lo mismo.
    - title: Añádelo a tu pantalla de inicio o al Dock
      body: Cuando hayas iniciado sesión, la app se ofrece a instalarse sola. Verás un botón **Instalar** donde tu navegador lo permita, y **Muéstrame cómo** donde no. ¿Se te pasó, o dijiste que no? **Configuración** tiene la misma ayuda en **Añadir a la pantalla de inicio o al Dock**. En un iPhone o iPad, la Configuración muestra primero los pasos del iPhone y esconde los demás dispositivos en **Otros dispositivos**. En cualquier caso, la app se abre después en una ventana propia.
      shot: S20
      shotAlt: La sección Añadir a la pantalla de inicio o al Dock de la Configuración, con los pasos para añadir la app a un dispositivo
    - title: Activa las notificaciones, si quieres
      body: Las notificaciones están desactivadas hasta que las actives, y cada dispositivo se activa por separado. Usa el botón **Activar** que ofrece la campana de notificaciones, o el interruptor **Notificaciones push** de la **Configuración**. En un iPhone o iPad, abre primero la app desde la pantalla de inicio. Es el único sitio donde las notificaciones funcionan allí.
      shot: S19
      shotAlt: El menú desplegable de notificaciones abierto, con la actividad reciente del grupo
options:
  heading: Cómo añadirla, dispositivo por dispositivo
  items:
    - title: iPhone y iPad
      body: Toca el botón Compartir, un cuadrado con una flecha que apunta hacia arriba. Si no lo ves, toca primero los tres puntos (•••) y después Compartir. Desplázate hacia abajo y toca **Añadir a pantalla de inicio**. Deja activada la opción **Abrir como app web** y toca **Añadir**. Si un enlace se abrió dentro de otra app, abre primero la página en Safari, porque ese navegador integrado no puede añadirla.
    - title: Android
      body: Abre el menú del navegador y elige **Añadir a la pantalla de inicio** o **Instalar aplicación**.
    - title: Chrome o Edge en un ordenador
      body: Abre el menú del navegador y elige la opción para instalar este sitio como aplicación. Después tiene su propia ventana y su propio icono.
    - title: Safari en un Mac
      body: Elige **Archivo** y después **Añadir al Dock**.
sections:
  - heading: Notificaciones, solo si las pides
    body: Las notificaciones push son opcionales. Actívalas y recibirás una notificación cuando haya actividad nueva en tus grupos, como que alguien añada un gasto, deje un comentario o registre un pago. Se activan dispositivo a dispositivo, desde la campana de notificaciones o desde la **Configuración**, y desde allí puedes volver a desactivarlas. Necesitan un navegador que las admita y tu permiso. Si tu navegador las ha bloqueado para el sitio, permítelas primero en la configuración del navegador. En un iPhone o iPad solo funcionan desde la app añadida a la pantalla de inicio, no desde una pestaña del navegador. La entrega no está garantizada, así que tómate una notificación como un empujoncito, no como una promesa. Para ver lo que aparece en el historial, consulta [planear juntos](page:feature/plan-together).
  - heading: Actualizaciones al momento, sin botón de refrescar
    body: Añade un gasto y todo el mundo lo ve enseguida, junto con qué cambió y quién lo cambió. Cada grupo guarda un historial de actividad, y la campana de notificaciones muestra la actividad de todos tus grupos. Nadie tiene que preguntar si has visto lo que acabas de añadir. Está en su pantalla.
  - heading: 39 idiomas, cada persona el suyo
    body: Usa Side Badger en 39 idiomas, incluidos el árabe, el persa y el urdu, que se escriben de derecha a izquierda. Cada persona del grupo elige el suyo, así que la misma página del grupo puede estar en árabe para uno y en inglés para el siguiente. Lo único en lo que el grupo tiene que ponerse de acuerdo son los números.
  - heading: Pensada para más de un tipo de usuario
    body: Side Badger se ha creado pensando en quienes usan teclado y lector de pantalla. Los colores de los miembros llevan patrones, así que no hace falta distinguir el verde del rojo.
    items:
      - Enlaces de salto, para que quien use teclado pueda ir directo al contenido.
      - Los cuadros de diálogo gestionan el foco del teclado.
      - Los controles llevan etiqueta, para los lectores de pantalla.
      - Los diseños se invierten en los idiomas que se escriben de derecha a izquierda.
limits:
  heading: Lo que la aplicación web no hace
  items:
    - No se puede usar sin conexión. Side Badger necesita conexión, así que no abrirá tu grupo en un avión sin wifi.
    - No hay app en ninguna tienda de apps ni app nativa para iPhone o Android. Side Badger es una aplicación web, y añadirla a la pantalla de inicio o al Dock es como consigues la versión que se parece a una app.
    - Añadirla a una pantalla de inicio o al Dock depende de tu navegador. Los nombres de los menús varían entre navegadores y versiones, y algunos navegadores no lo ofrecen.
    - Las notificaciones push son opcionales en cada dispositivo, y necesitan un navegador que las admita y tu permiso. En un iPhone o iPad solo funcionan desde la app añadida a la pantalla de inicio. La entrega no está garantizada.
    - No hay alertas por correo electrónico ni por mensaje de texto, ni recordatorios de pago. La actividad nueva aparece en la app, y como notificaciones push si las activas. Reclamar un pago sigue siendo cosa tuya.
    - La actividad se conserva durante 90 días.
    - Inicias sesión con una dirección de correo electrónico y una contraseña. No hay inicio de sesión con Google ni con Apple, y tienes que tener 18 años o más.
    - No afirmamos que Side Badger sea totalmente accesible, ni que cumpla una norma formal de accesibilidad. Si algo te lo pone difícil, cuéntanoslo desde dentro de la app y verás nuestra respuesta allí.
useCasesHeading: Donde ayuda no necesitar una app
faq:
  heading: Preguntas
  items:
    - q: ¿Hay una app de Side Badger en alguna tienda de apps?
      a: No. Side Badger es una aplicación web. La abres en tu navegador, y puedes añadirla a tu pantalla de inicio o a tu Dock para que se abra como una app. No hay nada que descargar de una tienda de apps.
    - q: ¿Puedo dividir gastos sin descargar una app?
      a: Sí. Abre Side Badger en un navegador de tu móvil o de tu ordenador, inicia sesión y empieza un grupo. Añadirla a la pantalla de inicio o al Dock es opcional.
    - q: ¿Funciona sin conexión?
      a: No. Side Badger necesita conexión, incluso cuando está añadida a tu pantalla de inicio o a tu Dock.
    - q: ¿Por qué no me llegan las notificaciones en el iPhone?
      a: En un iPhone o iPad, las notificaciones solo funcionan desde la app añadida a la pantalla de inicio, no desde una pestaña del navegador. Añádela, ábrela desde el icono de la pantalla de inicio y luego activa las notificaciones en **Configuración**. La entrega no está garantizada, así que si alguna se pierde, el historial de actividad del grupo sigue mostrando lo que se añadió.
    - q: ¿Tengo que activar las notificaciones?
      a: No. Están desactivadas hasta que las actives, dispositivo a dispositivo. Sin ellas, la actividad nueva sigue apareciendo en la app, y todo el mundo ve un cambio enseguida cuando la tiene abierta.
    - q: ¿Necesita una cuenta todo el mundo en el grupo?
      a: Sí. Solo hace falta una dirección de correo electrónico y una contraseña, y verificas el correo antes de poder añadir nada. Todo el que se une a un grupo hace lo mismo, desde el móvil o el ordenador que prefiera.
