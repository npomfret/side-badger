meta:
  title: "రూమ్‌మేట్లతో ఇంటి బిల్లులు పంచండి"
  description: "అద్దెను గది పరిమాణం ప్రకారం పంచండి, కరెంటు, సరుకులను సమానంగా పంచుకోండి, ప్రతి నెలా ఎవరు ఎవరికి బాకీనో చూడండి. రూమ్‌మేట్లు లెక్క ఉంచడానికి ఉచిత మార్గం."
h1: "రూమ్‌మేట్లతో ఇంటి బిల్లులు పంచండి"
navLabel: "రూమ్‌మేట్లు"
lead: "టాయిలెట్ రోల్ కొనే రూమ్‌మేట్ కోసం, అది ఎప్పుడూ జరగడం చూడని రూమ్‌మేట్ల కోసం. Side Badger **రూమ్‌మేట్లు, ఫ్లాట్‌మేట్ల** అద్దె, బిల్లులు, సరుకుల నడుస్తున్న లెక్కను ఒకే చోట ఉంచుతుంది, దాంతో ఎవరూ ఎవరినీ వెంటాడాల్సిన పని ఉండదు, ఫ్రిజ్ మళ్లీ ఫ్రిజ్‌గానే ఉంటుంది."
cta:
  heading: "మీ సొంత ఇంటితో మొదలుపెట్టండి"
  body: "ఖాతా తెరవండి, ఇంటికి ఒక గ్రూప్ చేయండి, అందరికీ ఆహ్వాన లింక్ పంపండి. ఈ నెల బిల్లులు ఈ రాత్రే జోడించవచ్చు."
  button: "ఉచిత ఖాతా తెరవండి"
scenario:
  heading: "ఇంటిని సిద్ధం చేయండి"
  body: "ఇంటికి ఒక గ్రూప్ చేయండి, వాళ్లకు మీరు ఏ పేరుతో కనిపించాలో ఎంచుకోండి, అందరినీ లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి. గ్రూప్ ఓపెన్‌గా ఉండవచ్చు, అప్పుడు అందరూ జోడిస్తారు, సవరిస్తారు, లేదా మేనేజ్డ్‌గా ఉండవచ్చు, అప్పుడు కొత్త సభ్యులకు అడ్మిన్ ఆమోదం కావాలి, సృష్టికర్తలు, అడ్మిన్లు మాత్రమే ఖర్చులను మార్చగలరు, ఇది లెక్కలు చూసే రూమ్‌మేట్‌కు సరిపోతుంది. అంకెలు చూడాలనుకునే వాళ్లు వ్యూయర్ కావచ్చు, వాళ్లు అన్నీ చూస్తారు, ఏదీ మార్చరు. కొత్త ఖర్చు అందరికీ వెంటనే కనిపిస్తుంది, కాబట్టి “తర్వాత జోడిస్తా”కు దాక్కోవడానికి తక్కువ చోట్లే ఉంటాయి."
sections:
  - heading: "అద్దె, బిల్లులు"
    body: "అద్దె నలుగురికి సమానంగా విడిపోవడం అరుదు, ఎందుకంటే బెడ్‌రూమ్‌లు సమానం కావు. దాన్ని శాతంతో పంచండి, పెద్ద గది ఎక్కువ ఇస్తుంది, కిటికీ ఉన్న చిన్న గది తక్కువ ఇస్తుంది. శాతాల మొత్తం 100 కావాలి. అందరూ వాడే బిల్లులను సమానంగా పంచండి, ఖర్చులో భాగం కాని రూమ్‌మేట్‌ను దాని నుండి వదిలేయవచ్చు. సమాన పంపకంలో మిగిలిన పైసా యాదృచ్ఛికంగా ఒకరికి వెళ్తుంది. పునరావృత బిల్లులు లేవు, కాబట్టి ప్రతి నెలా గత నెల అద్దెను కాపీ చేయండి, తేదీ మార్చండి, ముందుకు సాగండి."
  - heading: "ఉమ్మడి సరుకులు"
    body: "ఉమ్మడి షాపింగ్ జాబితాను షాపింగ్ బిల్లుల గ్రూప్‌లోనే ఉంచండి, వస్తువులు ట్రాలీలోకి చేరినప్పుడు టిక్ చేయండి. షాపింగ్ చేసినవాళ్లు రసీదు మొత్తాన్ని ఖర్చుగా జోడించి సమానంగా పంచుతారు, లేదా ఆ వస్తువు తినే వాళ్ల మధ్య మాత్రమే. ఎవరూ తాగని ఓట్ మిల్క్‌ను ఎవరు కొంటూనే ఉన్నారన్నది ఇంటి వ్యవహారంగానే ఉంటుంది, కానీ కనీసం ఖర్చుల జాబితా కచ్చితంగా ఉంటుంది. జాబితాలను ఎవరు సృష్టించవచ్చో, సవరించవచ్చో గ్రూప్ అనుమతులు నిర్ణయిస్తాయి. అద్దె, బిల్లులు, సరుకులు కలిపితే నలుగురి ఇంట్లో నెల ఇలా ఉంటుంది: Jo £2,000 అద్దె చెల్లిస్తారు, అది గది పరిమాణం ప్రకారం 30%, 25%, 25%, 20%గా పంచబడుతుంది, తర్వాత Kwame కరెంటుకు £120, Lena ఇంటర్నెట్‌కు £40, Matt సరుకులకు £80 చెల్లిస్తారు, ప్రతిదీ సమానంగా పంచబడుతుంది. Joకు £1,340 రావాలి, Side Badger మూడు పేమెంట్లను సూచిస్తుంది, అన్నీ Joకే."
  - heading: "ఇంటి ఖర్చులను పంచడానికి న్యాయమైన మార్గాలు"
    items:
      - "**సమానంగా** అందరూ దాదాపు ఒకేలా వాడేవాటికి సరిపోతుంది, ఇంటర్నెట్, శుభ్రత సామగ్రి, ఉమ్మడి సరుకుల లాంటివి. ఇది వేగంగా ఉంటుంది, లెక్క గురించి ఎవరూ వాదించాల్సిన అవసరం లేదు."
      - "**గది పరిమాణం ప్రకారం** అద్దెకు సరిపోతుంది, ఎందుకంటే గదులు వేరు, వాటికి ఇవ్వడానికి ప్రజలు ఇష్టపడే మొత్తమూ వేరు. శాతాలను ఎవరైనా చేరినప్పుడు ఒకసారి ఒప్పుకోండి, ప్రతి నెలా వాటినే వాడండి."
      - "**వాడకం ప్రకారం** ఒక్కరు స్పష్టంగా ఎక్కువ వాడే బిల్లులకు సరిపోతుంది, హోమ్-ఆఫీస్ హీటింగ్ బిల్లు లేదా ఇద్దరే చూసే స్ట్రీమింగ్ ఖాతా లాంటివి. భాగం కాని వాళ్లను వదిలేయండి, లేదా ప్రతి వ్యక్తికి ఖచ్చితమైన మొత్తాలు నమోదు చేయండి."
      - "ఏది ఎంచుకున్నా, మొదటి వాదన తర్వాత కాకుండా మొదటి బిల్లుకు ముందే ఒప్పుకోండి, నియమాన్ని ఇంటి అందరికీ కనిపించే చోట రాసి ఉంచండి."
  - heading: "ఎవరైనా ఇల్లు ఖాళీ చేసినప్పుడు"
    body: "వాళ్లు ముందు లెక్క తేల్చుకుంటారు. ఎవరికైనా ఇవ్వాల్సినవి లేదా రావాల్సినవి ఉన్నంత వరకు గ్రూప్ వదలలేరు, కాబట్టి వెళ్లేవాళ్లు చెల్లిస్తారు లేదా అందుకుంటారు, మీరు దాన్ని రికార్డ్ చేస్తారు, తర్వాత వాళ్లు వెళ్తారు. మిగిలిన రూమ్‌మేట్ల కోసం గ్రూప్‌ను కొనసాగించండి, కొత్త వ్యక్తిని లింక్‌తో ఆహ్వానించండి. ఇల్లే అయిపోయినప్పుడు, అంకెలు ఉన్నచోటే ఉండేలా అడ్మిన్ గ్రూప్‌ను లాక్ చేయవచ్చు, లేదా శాశ్వతంగా మూసివేయవచ్చు, అప్పుడు అది అందరికీ అందుబాటులో ఉండదు, కాబట్టి చరిత్ర ఎవరికీ అవసరం లేనప్పుడే అలా చేయండి."
exampleAfter: 2
