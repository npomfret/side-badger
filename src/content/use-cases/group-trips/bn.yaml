meta:
  title: "গ্রুপ ট্রিপের খরচ ভাগ করুন, 140টি মুদ্রায়"
  description: "গ্রুপ ট্রিপে কে কী দিয়েছে হিসাব রাখুন, স্থানীয় মুদ্রায় খরচ লিখুন, চাইলে রূপান্তর করুন, আর শেষে একবারে হিসাব মেটান। বিনামূল্যে, আপনার ব্রাউজারে।"
h1: "গ্রুপ ট্রিপের খরচ ভাগ করুন, 140টি মুদ্রায়"
navLabel: "গ্রুপ ট্রিপ"
lead: "ভিলা, ট্যাক্সি আর সেই ককটেলের রাউন্ডের হিসাব রাখুন, যেটা কিনবে বলে কারও মনেই নেই। আপনি বাইরে থাকাকালীন Side Badger চলমান হিসাব রাখে, [পাউন্ড, ইউরো আর আরও 138টি মুদ্রা সামলায়](page:feature/multiple-currencies), আর বাড়ি ফিরলে আপনাকে [পেমেন্টের একটি ছোট তালিকা](page:feature/settle-up) দেয়।"
cta:
  heading: "ছুটির অঙ্ক, রোদে পোড়া দাগ মিলিয়ে যাওয়ার আগেই শেষ"
  body: "একটি গ্রুপ খুলুন, ট্রিপের লোকজনকে আমন্ত্রণ লিঙ্ক পাঠান, আর খরচ হওয়ামাত্র যোগ করুন।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
scenario:
  heading: "সবাই কিছু না কিছু দিয়েছে, কোনো না কোনো মুদ্রায়"
  body: "কেউ বিমানের টিকিট বুক করেছে, আরেকজন কার্ডে ভিলা নিয়েছে, আর তৃতীয়জন নগদে ডিনার মিটিয়েছে। তৃতীয় দিনের মধ্যে কেউ জানে না কে এগিয়ে। প্রশ্নটা সোজা, যদিও উত্তরটা সাধারণত এমন একটা স্প্রেডশিটে থাকে যা কেউ খুলতে চায় না। কে কী দিয়েছে, কোন মুদ্রায়, আর শেষে সবাই একবারে হিসাব মেটাবে কীভাবে?"
sections:
  - heading: "যাওয়ার আগে"
    body: "ভিলার বাছাই তালিকা ভোটে দিন, চাইলে নাম না জানিয়ে, যাতে সিদ্ধান্তটা গ্রুপের হয়, যে সবচেয়ে বেশিক্ষণ মুখ ভার করে থাকে তার নয়। তারপর বাজারের বিলের পাশে যৌথ বাজারের তালিকা রাখুন, যাতে কেউ তিন টিউব সানক্রিম কেনে আর প্লাগ অ্যাডাপ্টার একটাও না।"
  - heading: "যখন আপনি বাইরে"
    body: "প্রতিটি খরচ হওয়ামাত্র যোগ করুন, যে মুদ্রায় দিয়েছেন সেই মুদ্রায়। রসিদের ছবি তুলুন, Side Badger মোট, তারিখ আর জায়গা ভরে দেবে, আপনি দেখে নেবেন; রসিদের ছবি Google-এর AI পরিষেবা পড়ে। পরিমাণটা বর্তমান এক্সচেঞ্জ রেটে রূপান্তর করুন, যেটা আপনি আসলে যে রেট পেয়েছেন তাতে বদলাতে পারেন, আর মূল পরিমাণ খরচের সঙ্গে থেকে যায়। অথবা ইউরোকে ইউরোই থাকতে দিন আর পরে ঠিক করুন। গ্রুপ একটি মুদ্রাও বেছে নিতে পারে, আর নতুন খরচ নিজে থেকেই তাতে রূপান্তরিত হয়।"
  - heading: "সবাই সব কিছু করেনি"
    body: "কেউ ডিনার বাদ দিয়েছে, কেউ নৌকাভ্রমণে যায়নি। যে খরচের অংশ ছিল না তা থেকে তাদের বাদ দিন, আর বাকিটা [সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে](page:feature/split-expenses) ভাগ করুন। ট্রিপের যে অংশটা কেউ ঘুমিয়ে কাটিয়েছে তার দাম কেউ দেয় না।"
  - heading: "বাড়ি ফিরে হিসাব মেটান"
    body: "Side Badger পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে যাতে সবার হিসাব মেটে। যেভাবে খুশি একে অপরকে দিন, তারপর রেকর্ড করুন। মিশ্র মুদ্রা হলে প্রতিটি আলাদা রাখুন বা চলতে চলতে রূপান্তর করুন; নিচের লিসবনের উদাহরণ দুটিই দেখায়।"
  - heading: "ব্যাচেলর ও ব্যাচেলোরেট সপ্তাহান্ত"
    body: "বিশেষ অতিথিকে নিয়ে সপ্তাহান্তে একটু বেশি গোছগাছ লাগে। এটিকে ম্যানেজড গ্রুপ করুন, যেখানে অ্যাডমিনরা নতুন সদস্যদের অনুমোদন দেন আর শুধু নির্মাতা ও অ্যাডমিনরা খরচ বদলাতে পারেন। বিশেষ অতিথির ভাগের জন্য নির্দিষ্ট পরিমাণ ব্যবহার করুন, গ্রুপকে সেই মুদ্রাগুলোতেই সীমিত রাখুন যা আপনি আসলে ব্যবহার করছেন, আর শেষ হলে গ্রুপ লক করুন যাতে সংখ্যাগুলো যেখানে আছে সেখানেই থাকে।"
