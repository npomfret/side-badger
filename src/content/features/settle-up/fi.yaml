meta:
  title: Tasaa tilit vähemmillä maksuilla | Side Badger
  description: Katso, kuka on velkaa kenelle ryhmässäsi, saat lyhyen maksulistan, joka tasaa kaikki, ja kirjaa jokainen maksu sitä mukaa kuin se tapahtuu. Ilmainen.
h1: Tasaa tilit vähemmillä maksuilla
navLabel: Tilien tasaus
lead: Side Badger pitää kaikille ryhmässä juoksevaa saldoa ja ehdottaa lyhyttä maksulistaa, joka tasaa tilit. Maksatte toisillenne miten haluatte ja kirjaatte sen sitten. Jos haluat ensin nähdä, miten luvut jaetaan, aloita sivulta [kulujen jako](page:feature/split-expenses).
cta:
  heading: Valmiina selvittämään, kuka on velkaa kenelle?
  body: Luo tili, perusta ryhmä ja lisää ensimmäinen kulu. Saldot hoitavat lopun.
  button: Luo ilmainen tili
problem:
  heading: Saldot, jotka päivittyvät matkan varrella
  body: Jokainen kulu muuttaa sitä, kuka on velkaa kenelle, joten Side Badger pitää saldot ajan tasalla kulujen ja maksujen tullessa. Kaikki ryhmässä näkevät muutoksen heti sekä sen, mikä muuttui ja kuka muutti. Saldot pidetään valuuttakohtaisesti, joten eurot ja punnat pysyvät omissa sarakkeissaan, ellei kulua muunnettu sitä syötettäessä. Oletuksena näet sinua koskevat velat; **Näytä kaikki** listaa koko ryhmän.
workflow:
  heading: Kolme askelta tasoihin
  steps:
    - title: Katso, kuka on velkaa kenelle
      body: Avaa ryhmän saldot nähdäksesi, mitä olet velkaa, mitä sinulle ollaan velkaa ja lyhyen maksulistan, joka tasaa kaikki, laskettuna valuutoittain. Kyseenalaistetut kulut pysyvät pois summista, kunnes ne on selvitetty. Alla olevassa kämppisesimerkissä kuusi maksua muuttuu kahdeksi.
      shot: S10
      shotAlt: Saldonäkymä, jossa yksinkertaistetut velat kahdessa valuutassa ja Näytä kaikki -valinta päällä
    - title: Maksa miten haluat, kirjaa sitten
      body: Pankkisiirto, käteinen, edellisen loman palvelus. Side Badger ei siirrä rahaa. Kun raha on vaihtanut omistajaa, kirjaa maksu, niin saldo päivittyy kaikille.
      shot: S11
      shotAlt: Maksulomake pikaselvityspainikkeineen ja osamaksusta näytettävine ilmoituksineen
    - title: Tarkista, että se meni perille
      body: Maksu tallentuu ryhmän historiaan, jossa kaikki ryhmässä näkevät sen ja voivat reagoida emojilla. Juhli maksua, kun se on perillä.
      shot: S12
      shotAlt: Maksuhistoria, jossa maksulla on emoji-reaktioita
