meta:
  title: "İndirmesiz hesap bölüşme uygulaması | Side Badger"
  description: "Telefonunuz dolu, anlıyoruz. Side Badger tarayıcınızda çalışır; uygulama mağazası ve indirme yok. Ana ekranınıza ekleyin, uygulama gibi açılsın."
h1: "Uygulama mağazası yok. İndirme yok. Yine de uygulama gibi"
navLabel: "Web uygulaması"
lead: "Side Badger tarayıcınızda yaşar. Aranacak bir uygulama mağazası ve önce indirilecek bir şey yok. Telefondan veya bilgisayardan oturum açın, harcamaları grubunuzla çevrimiçi bölüşün ve tek dokunuş uzakta olsun istediğinizde ana ekranınıza ya da Dock'unuza ekleyin."
cta:
  heading: "Açın. Oturum açın. Bir grup kurun."
  body: "Bir hesap oluşturun, bir grup kurun ve ilk harcamayı ekleyin; hepsi zaten açık olan tarayıcıdan. Önce tur mu istiyorsunuz? [Nasıl çalışır](page:how-it-works) sayfasına bakın ya da [ücretsiz olanları](page:pricing) görün."
problem:
  heading: "Telefonunuz dolu. Anlıyoruz."
  body: "İçinde bir yerlerde aynı gün batımının dört bin fotoğrafı ve baharından beri kaydırıp geçtiğiniz bir depolama uyarısı var. Tek bir akşam yemeğini bölüşmek için ona en son lazım olan şey bir uygulama daha. Bu yüzden Side Badger bir web uygulamasıdır. Telefonda ya da bilgisayarda modern bir tarayıcıda çalışır. Telefonda mobil düzenler kullanır; grup sayfası sekmelere bölünür ve denetimler dokunmaya uygundur. Ana ekrana eklemek gibi bazı ekstralar tarayıcınıza bağlıdır ve bunun nerede geçerli olduğunu söyleriz."
workflow:
  heading: "Tarayıcı sekmesinden ana ekrana üç adımda"
  steps:
    - title: "Açın ve oturum açın"
      body: "Tarayıcınızda Side Badger'a gidin ve oturum açın. Tek ihtiyacınız bir e-posta adresi ve bir parola; bir şey ekleyebilmek için e-postayı doğrularsınız. Gruptaki herkesin bir hesabı olmalı, bu yüzden davet ettikleriniz de aynısını yapacak."
    - title: "Ana ekranınıza ya da Dock'unuza ekleyin"
      body: "Oturum açtıktan sonra uygulama kendini yüklemeyi önerir. Tarayıcınızın izin verdiği yerde bir **Yükle** düğmesi, vermediği yerde **Nasıl yapılacağını göster** görürsünüz. Kaçırdınız mı ya da hayır mı dediniz? **Ayarlar**'da aynı yardım **Ana Ekrana veya Dock'a Ekle** altında duruyor. iPhone veya iPad'de Ayarlar önce iPhone adımlarını gösterir, diğer cihazları **Diğer cihazlar** altına koyar. Hangisi olursa olsun, uygulama bundan sonra kendi penceresinde açılır."
      shot: S20
      shotAlt: "Uygulamanın bir cihaza eklenme adımlarını gösteren Ayarlar'daki Ana Ekrana veya Dock'a Ekle bölümü"
    - title: "İsterseniz bildirimleri açın"
      body: "Bildirimler siz açana kadar kapalıdır ve her cihaz ayrı ayrı açılır. Bildirim zilinin sunduğu **Aç** düğmesini ya da **Ayarlar**'daki **Anlık bildirimler** anahtarını kullanın. iPhone veya iPad'de önce uygulamayı Ana Ekran'dan açın. Orada bildirimlerin çalıştığı tek yer orasıdır."
      shot: S19
      shotAlt: "Gruptaki son etkinlikleri listeleyen açık bildirimler açılır menüsü"
options:
  heading: "Cihaz cihaz nasıl eklenir"
  items:
    - title: "iPhone ve iPad"
      body: "Paylaş düğmesine, yani yukarı bakan oklu kareye dokunun. Görmüyorsanız önce üç noktaya (•••), sonra Paylaş'a dokunun. Aşağı kaydırın ve **Ana Ekrana Ekle**'ye dokunun. **Web Uygulaması Olarak Aç** açık kalsın, sonra **Ekle**'ye dokunun. Bir bağlantı başka bir uygulamanın içinde açıldıysa önce sayfayı Safari'de açın, çünkü o yerleşik tarayıcı onu ekleyemez."
    - title: "Android"
      body: "Tarayıcı menüsünü açın ve **Ana ekrana ekle** veya **Uygulamayı yükle**'yi seçin."
    - title: "Bilgisayarda Chrome veya Edge"
      body: "Tarayıcı menüsünü açın ve bu siteyi uygulama olarak yükleme seçeneğini seçin. Sonra kendi penceresine ve kendi simgesine kavuşur."
    - title: "Mac'te Safari"
      body: "**Dosya**'yı, sonra **Dock'a Ekle**'yi seçin."
sections:
  - heading: "Bildirimler, yalnızca isterseniz"
    body: "Anlık bildirimler isteğe bağlıdır. Açarsanız gruplarınızda birinin harcama eklemesi, yorum bırakması ya da ödeme kaydetmesi gibi yeni etkinlik olduğunda bir bildirim alırsınız. Bir cihazda tek tek açılırlar; bildirim zilinden ya da **Ayarlar**'dan açıp yine oradan kapatabilirsiniz. Bunları destekleyen bir tarayıcı ve sizin izniniz gerekir. Tarayıcınız bunları site için engellediyse önce tarayıcının ayarlarında izin verin. iPhone veya iPad'de yalnızca Ana Ekran'a eklenmiş uygulamada çalışırlar, tarayıcı sekmesinde değil. İletim garanti değildir; bu yüzden bir bildirimi söz olarak değil, dürtme olarak görün. Akışta neler çıktığı için [birlikte planlama](page:feature/plan-together) sayfasına bakın."
  - heading: "Canlı güncellemeler, yenile düğmesi yok"
    body: "Bir harcama ekleyin, herkes neyin değiştiğiyle ve kimin değiştirdiğiyle birlikte hemen görür. Her grup bir etkinlik geçmişi tutar ve bildirim zili tüm gruplarınızdaki etkinliği gösterir. Kimsenin, az önce eklediğiniz şeyi görüp görmediğinizi sorması gerekmez. Ekranlarında, zaten."
  - heading: "39 dil, herkes kendisine göre"
    body: "Side Badger'ı sağdan sola yazılan Arapça, Farsça ve Urduca dahil 39 dilde kullanın. Gruptaki herkes kendi dilini seçer; böylece aynı grup sayfası bir kişi için Arapça, yanındaki için İngilizce olabilir. Grubun üzerinde anlaşması gereken tek şey rakamlardır."
  - heading: "Tek tür kullanıcı için yapılmadı"
    body: "Side Badger klavye ve ekran okuyucu kullanıcıları düşünülerek yapılmıştır. Üye renklerine desenler eşlik eder; böylece yeşille kırmızıyı ayırt etmeniz gerekmez."
    items:
      - "Klavye kullanıcıları doğrudan içeriğe atlayabilsin diye atlama bağlantıları."
      - "Pencereler klavye odağını yönetir."
      - "Denetimler ekran okuyucular için etiketlidir."
      - "Düzenler sağdan sola yazılan dillerde yön değiştirir."
limits:
  heading: "Web uygulamasının yapmadıkları"
  items:
    - "Çevrimdışı kullanım yok. Side Badger'ın bağlantıya ihtiyacı var; bu yüzden wifi'siz bir uçakta grubunuzu açmaz."
    - "Uygulama mağazası uygulaması ve yerel bir iPhone ya da Android uygulaması yok. Side Badger bir web uygulamasıdır ve ana ekrana ya da Dock'a eklemek, uygulama gibi sürümünü almanın yoludur."
    - "Ana ekrana ya da Dock'a eklemek tarayıcınıza bağlıdır. Menü adları tarayıcılara ve sürümlere göre değişir, bazı tarayıcılar bunu hiç sunmaz."
    - "Anlık bildirimler cihaz başına isteğe bağlıdır ve bunları destekleyen bir tarayıcı ile sizin izniniz gerekir. iPhone veya iPad'de yalnızca Ana Ekran'a eklenmiş uygulamada çalışırlar. İletim garanti değildir."
    - "E-posta veya kısa mesaj uyarısı ve ödeme hatırlatıcısı yok. Yeni etkinlik uygulamada, açarsanız anlık bildirim olarak da görünür. Ödemenin peşine düşmek hâlâ size kalmış."
    - "Etkinlik 90 gün saklanır."
    - "Bir e-posta adresi ve parolayla oturum açarsınız. Google veya Apple ile oturum açma yoktur ve 18 yaşında veya daha büyük olmanız gerekir."
    - "Side Badger'ın tam erişilebilir olduğunu ya da resmî bir erişilebilirlik standardını karşıladığını iddia etmiyoruz. Bir şey önünüze çıkarsa uygulamanın içinden bize söyleyin; yanıtımızı orada görürsünüz."
useCasesHeading: "Uygulamaya ihtiyaç duymamanın işe yaradığı yerler"
faq:
  heading: "Sorular"
  items:
    - q: "Bir uygulama mağazasında Side Badger uygulaması var mı?"
      a: "Hayır. Side Badger bir web uygulamasıdır. Tarayıcınızda açarsınız ve uygulama gibi açılsın diye ana ekranınıza ya da Dock'unuza ekleyebilirsiniz. Bir uygulama mağazasından indirilecek bir şey yok."
    - q: "Uygulama indirmeden hesap bölüşebilir miyim?"
      a: "Evet. Side Badger'ı telefonunuzda veya bilgisayarınızda bir tarayıcıda açın, oturum açın ve bir grup kurun. Ana ekrana ya da Dock'a eklemek isteğe bağlıdır."
    - q: "Çevrimdışı çalışır mı?"
      a: "Hayır. Ana ekranınıza ya da Dock'unuza eklenmiş olsa bile Side Badger'ın bağlantıya ihtiyacı var."
    - q: "iPhone'umda neden bildirim almıyorum?"
      a: "iPhone veya iPad'de bildirimler yalnızca Ana Ekran'a eklenmiş uygulamada çalışır, tarayıcı sekmesinde değil. Ekleyin, Ana Ekran simgesinden açın, sonra **Ayarlar**'da bildirimleri açın. İletim garanti değildir; bu yüzden biri kaybolursa grubun etkinlik geçmişi nelerin eklendiğini yine gösterir."
    - q: "Bildirimleri açmak zorunda mıyım?"
      a: "Hayır. Siz açana kadar kapalıdırlar ve cihaz cihaz açılırlar. Onlar olmadan da yeni etkinlik uygulamada görünür ve uygulama açıkken herkes bir değişikliği hemen görür."
    - q: "Gruptaki herkesin bir hesabı olmalı mı?"
      a: "Evet. Tek ihtiyaç bir e-posta adresi ve bir parola; bir şey ekleyebilmek için e-postayı doğrularsınız. Bir gruba katılan herkes, istediği telefonda veya bilgisayarda aynısını yapar."
