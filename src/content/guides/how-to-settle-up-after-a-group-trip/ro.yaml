faq:
  heading: "Întrebări"
  items:
    - q: "Cine ar trebui să înregistreze o plată, cel care plătește sau cel care primește?"
      a: "Pentru a înregistra o plată e nevoie de permisiunea de a edita cheltuieli, iar formularul întreabă **Cine a plătit?** și **Cine a primit plata?** Doar cel care a înregistrat plata o poate edita ulterior, așa că de obicei e mai simplu s-o facă plătitorul, cu butonul de decontare rapidă."
    - q: "Dacă excursia a fost în două valute?"
      a: "Soldurile se țin pe valute, așa că o datorie în euro rămâne o datorie în euro, iar fiecare valută primește propria listă scurtă, dacă cheltuielile nu au fost convertite la introducere. [Excursii în mai multe valute](page:guide/how-to-split-a-trip-paid-in-several-currencies) arată ambele variante."
    - q: "Ne achităm în timpul excursiei sau la final?"
      a: "Merg ambele. Fiecare plată înregistrată schimbă soldurile, așa că o plată făcută pe parcurs se ia în calcul pentru lista finală. La final e mai simplu, pentru că [toată excursia](page:use-case/group-trips) e într-un singur loc."
