      source: home
    - feature: Banatzeko moduak
      other: Berdin, zenbateko zehatzen arabera, ehunekoen arabera, kuoten arabera, doikuntzaren arabera edo artikuluka.
      sideBadger: Berdin, zenbateko zehatzen arabera edo ehunekoen arabera, ordaintzaile bakarrarekin gastu bakoitzeko. Ez kuoten edo artikuluen arabera.
