faq:
  heading: "پرسش‌ها"
  items:
    - q: "می‌توانم فقط سهم خودم را زیر سؤال ببرم؟"
      a: "نه. یک سؤال کل هزینه را برای همه افراد آن بیرون نگه می‌دارد. اگر فقط تقسیم اشتباه است، راه‌حل ویرایش تقسیم است."
    - q: "چه کسی می‌تواند سؤال را ببندد؟"
      a: "کسی که پرسیده، یا یک مدیر گروه. اگر کسی که هزینه را اضافه کرده مدیر نباشد، نمی‌تواند از طرف کسی که پرسیده آن را ببندد."
    - q: "ویرایش هزینه نسخه اصلی را پاک می‌کند؟"
      a: "نه. نسخه قبلی نگه داشته می‌شود. اینکه چه کسی می‌تواند ویرایش کند را مجوزهای گروه تعیین می‌کنند، پس ارزش دارد اول به خانه بگویید، چون مانده‌ها تغییر می‌کنند."
