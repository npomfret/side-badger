meta:
  title: "जब कोई साझा खर्च पर आपत्ति उठाए तो क्या करें | Side Badger"
  description: "चुभता हुआ मैसेज न भेजें। खर्च पर सवाल उठाएं, तो बात होने तक वह सबके बैलेंस से बाहर रहता है। £45 की पार्टी वाली वाइन से हल करके।"
h1: "जब कोई साझा खर्च पर आपत्ति उठाए तो क्या करें"
navLabel: "विवादित खर्च"
lead: "चुभता हुआ मैसेज भेजने के बजाय खर्च पर एक सवाल उठाएं। सवाल खुला रहने तक पूरा खर्च सबके बैलेंस से बाहर रहता है। कमेंट में बात करके सुलझाएं, ग्रुप राज़ी हो तो बंटवारा एडिट करें, और सवाल उठाने वाला व्यक्ति, या कोई एडमिन, सवाल बंद कर दे।"
cta:
  heading: "अटपटा सवाल, सलीके से पूछें"
  body: "मुफ्त अकाउंट बनाएं, फ्लैट के लिए ग्रुप शुरू करें और किसी एडमिन से खर्च के सवाल चालू करने को कहें, जो तब तक बंद रहते हैं जब तक कोई उन्हें चालू न करे। पहले पूरा टूर देखना है? [यह कैसे काम करता है](page:how-it-works) या [मुफ्त में क्या-क्या मिलता है](page:pricing) देखें।"
sections:
  - heading: "तीन रूममेट्स और £45 की वाइन"
    body: "पार्टी के बाद Tom फ्लैट के ग्रुप में वाइन जोड़ता है। यह £45 है, Tom ने दिए, और Tom, Priya और Aisha में बराबर बंटी है, यानी £15 प्रति व्यक्ति। Aisha शराब नहीं पीती। Tom ने वाइन पार्टी के लिए खरीदी थी, और पार्टी [फ्लैट](page:use-case/housemates) के लिए थी, इसलिए उसने कुछ गलत नहीं किया। Aisha का पूछना भी गलत नहीं है। यहां कोई विलेन नहीं है। बस £15 की वाइन पर असहमति है और उसे अटपटा बनाने के ढेर सारे तरीके हैं। घर में चुभता हुआ मैसेज भेजना उनमें से एक है। खर्च पर सवाल उठाना नरम तरीका है।"
  - heading: "सवाल उठाने से क्या होता है"
    body: "Aisha खर्च खोलकर एक सवाल उठाती है। पूरा खर्च सबके बैलेंस से बाहर हो जाता है, सिर्फ उसका हिस्सा नहीं, और बाकी कुछ प्रभावित नहीं होता। बड़ी किराना खरीदारी (£84) और सफाई वाले (£60) अब भी गिने जाते हैं, जो £28 + £20 = £48 प्रति व्यक्ति है। तो जब तक वाइन रुकी हुई है, Aisha को £48 देने हैं, Tom को £36 मिलने हैं और Priya को £12। फ्लैट वाइन के बारे में जो भी तय करे, इस बीच किसी के बैलेंस में वह शामिल नहीं है। खर्च में शामिल कोई और भी अपना सवाल उठा सकता है। वाइन बैलेंस में तभी लौटती है जब उस पर आखिरी खुला सवाल बंद हो जाए, और सवाल को वही बंद करता है जिसने उसे उठाया था, या कोई एडमिन।"
  - heading: "बात करें, फिर ठीक करें"
    body: "Aisha का सवाल खर्च के कमेंट में जाता है, इसलिए जवाब ठीक उसके नीचे रहते हैं। कमेंट और सवालों के बारे में [साथ मिलकर प्लान करें](page:feature/plan-together) में और है। Tom और Priya उसे पढ़ते हैं और फ्लैट में बातचीत होती है। वे तय करते हैं कि वाइन Tom और Priya की थी, क्योंकि उन्हीं दोनों ने पी। कोई दूसरा फ्लैट तीन-तरफा बंटवारा रख सकता है, या बीच का कुछ तय कर सकता है, और वह भी ठीक होता। Side Badger वही सहेजता है जो आप तय करते हैं, और वाइन के बारे में उसकी कोई राय नहीं है। Tom खर्च एडिट करता है ताकि वह खुद और Priya में बराबर बंटे, यानी £22.50 प्रति व्यक्ति (£45 ÷ 2)। Aisha अब उसमें नहीं है, इसलिए उसका सवाल पुराने वर्शन के साथ चला जाता है और वाइन बैलेंस में लौट आती है। पहले वाला वर्शन रखा जाता है।"
  - heading: "नतीजा पढ़ना"
    body: "वाइन लौटने पर Tom को £58.50 मिलने हैं, Priya को £10.50 देने हैं और Aisha को £48। Side Badger दो पेमेंट सुझाता है, दोनों Tom को। Aisha के £48 वही आंकड़ा हैं जो वाइन रुकी होने पर था, क्योंकि वह उसमें नहीं है। Priya को £12 मिलने थे और अब £10.50 देने हैं, यह वाइन में उसके £22.50 के आधे हिस्से की वजह से है। अगर तीन-तरफा बंटवारा बना रहता, तो Aisha को £63 देने होते (£28 + £20 + £15)। पूरी असहमति £15 की थी। एक-दूसरे को जैसे चाहें पेमेंट करें, फिर हर पेमेंट **हिसाब बराबर करें** के तहत रिकॉर्ड करें। बाकी [हिसाब चुकता करना](page:feature/settle-up) में है।"
  - heading: "ऐसे शब्द चुनें कि लोग आपसे बात करते रहें"
    body: "Aisha का सवाल: “मैंने वाइन ली ही नहीं। क्या हम बंटवारा एक बार देख सकते हैं?” यह छोटा है, खर्च का नाम लेता है और इल्ज़ाम नहीं लगाता, पूछता है। कुछ आदतें काम आती हैं।"
    items:
      - "**खर्च के बारे में पूछें, व्यक्ति के बारे में नहीं।** “क्या हम वाइन का बंटवारा एक बार देख लें?” से बातचीत शुरू होती है। “मुझसे तुम्हारी वाइन के पैसे क्यों लिए गए?” से दूसरी तरह की बातचीत शुरू होती है।"
      - "**बताएं कि आप क्या चाहते हैं।** “क्या यह सिर्फ उन लोगों में बंट सकता है जिन्होंने पी?” ग्रुप को हामी भरने या जवाब देने के लिए कुछ देता है।"
      - "**एक-दो वाक्य में वजह दें।** फ़ील्ड का नाम **आपका प्रश्न** है और उसे खाली नहीं छोड़ा जा सकता।"
      - "**जवाब एक ही जगह रखें।** जवाब खर्च के कमेंट में जाएं, उन आंकड़ों के पास जिनके बारे में वे हैं।"
  - heading: "Side Badger में सेट करें"
    items:
      - "**सवाल चालू करें।** ये डिफ़ॉल्ट रूप से बंद होते हैं। कोई एडमिन ग्रुप की **सेटिंग्स** खोलता है, **सामान्य** टैब पर **सुविधाएँ** के तहत **खर्च संबंधी प्रश्नों की अनुमति दें** चालू करता है और **सहेजें** चुनता है। बाद में इसे बंद करने पर हर खुला सवाल साफ हो जाता है।"
      - "**सवाल उठाएं।** खर्च खोलें और बंटवारे में अपने नाम के पास **मेरा एक प्रश्न है** चुनें। **आपका प्रश्न** में अपनी वजह लिखें और फिर **मेरा एक प्रश्न है** चुनें। यह सिर्फ खर्च में शामिल लोग कर सकते हैं। अब खर्च पर **प्रश्नित** बैज दिखता है।"
      - "**रुके हुए खर्च ढूंढें।** खर्चों की सूची में **केवल प्रश्नित** वे खर्च दिखाता है जिन पर कोई सवाल खुला है।"
      - "**ठीक करें, अगर ग्रुप राज़ी हो।** खर्च खोलें, **संपादित करें** चुनें, **विभाजित करें** बदलें और **व्यय अपडेट करें** चुनें। कौन एडिट कर सकता है, यह ग्रुप की अनुमतियों पर निर्भर है।"
      - "**बंद करें, अगर कुछ ठीक करने को न हो।** सवाल उठाने वाला व्यक्ति अपने **प्रश्नित** बैज के बंद करने वाले बटन का इस्तेमाल कर सकता है, जिसका लेबल **प्रश्न बंद करें** है, और कोई एडमिन भी कर सकता है। आखिरी सवाल बंद होते ही खर्च बैलेंस में लौट आता है।"
  - heading: "जब मामला इतना सीधा न हो"
    items:
      - "**एडिट के बाद भी सवाल उठाने वाला बना रहे।** अगर सवाल उठाने वाला अब भी खर्च में है, तो उसका सवाल एडिट किए गए वर्शन पर चला जाता है और उसके, या किसी एडमिन के, बंद करने का इंतज़ार करता है। राशि ठीक करना यह मानना नहीं है कि मामला ठीक हो गया।"
      - "**आप खर्च में नहीं थे।** खर्च पर सिर्फ उसमें शामिल लोग सवाल उठा सकते हैं। अगर आपको कुछ गड़बड़ लगे, तो उसके कमेंट में कहें या जिसने उसे जोड़ा उससे पूछें।"
      - "**कोई ग्रुप छोड़ना चाहता है।** खुला सवाल उस खर्च में शामिल लोगों को ग्रुप छोड़ने से रोकता है। सवाल बंद करें, या खर्च एडिट करें ताकि वे उसमें न रहें, और वे जा सकते हैं।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह तय नहीं करता कि कौन सही है। यह खर्च को बैलेंस से बाहर रखता है और वही सहेजता है जो आप तय करते हैं।"
      - "यह खर्च गिने जाने से पहले किसी से मंज़ूरी नहीं मांगता। सिर्फ सवाल उठाया गया खर्च रोका जाता है।"
      - "यह खर्च का एक हिस्सा नहीं रोक सकता। सवाल उठाएं और पूरा खर्च बैलेंस से बाहर हो जाता है।"
      - "यह पैसे नहीं भेजता। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं और उसे रिकॉर्ड करते हैं।"
