meta:
  title: "কম পেমেন্টে হিসাব মেটান | Side Badger"
  description: "আপনার গ্রুপে কে কার কাছে ঋণী দেখুন, সবার হিসাব মেটানোর মতো পেমেন্টের একটি ছোট তালিকা পান, আর প্রতিটি পেমেন্ট হওয়ামাত্র রেকর্ড করুন। ব্যবহার বিনামূল্যে।"
h1: "কম পেমেন্টে হিসাব মেটান"
navLabel: "হিসাব মেটানো"
lead: "Side Badger গ্রুপের প্রত্যেকের চলমান ব্যালেন্স রাখে আর পেমেন্টের একটি ছোট তালিকা সাজেস্ট করে যাতে হিসাব মিটে যায়। আপনারা যেভাবে খুশি একে অপরকে দেন, তারপর সেটা রেকর্ড করেন। আগে দেখতে চান সংখ্যাগুলো কীভাবে ভাগ হয়? শুরু করুন [খরচ ভাগ করা](page:feature/split-expenses) দিয়ে।"
cta:
  heading: "কে কার কাছে ঋণী, তার জট খুলতে তৈরি?"
  body: "অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম খরচটা যোগ করুন। বাকিটা ব্যালেন্সই সামলে নেবে।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
problem:
  heading: "ব্যালেন্স যা সঙ্গে সঙ্গে হালনাগাদ হয়"
  body: "প্রতিটি খরচ বদলে দেয় কে কার কাছে ঋণী, তাই খরচ আর পেমেন্ট যোগ হলে Side Badger ব্যালেন্স হালনাগাদ রাখে। গ্রুপের সবাই পরিবর্তনটা সঙ্গে সঙ্গে দেখে, সঙ্গে কী বদলেছে আর কে বদলেছে সেটাও। ব্যালেন্স রাখা হয় মুদ্রা ধরে, তাই ইউরো আর পাউন্ড নিজ নিজ কলামেই থাকে, যদি না কোনো খরচ লেখার সময় রূপান্তর করা হয়। ডিফল্টে আপনি আপনার জড়িত দেনাগুলো দেখেন; **সবাইকে দেখান** পুরো গ্রুপের তালিকা দেয়।"
workflow:
  heading: "সমান হওয়ার তিন ধাপ"
  steps:
    - title: "দেখুন কে কার কাছে ঋণী"
      body: "গ্রুপের ব্যালেন্স খুলে দেখুন আপনার কী দেওয়ার আছে, কী পাওনা আছে, আর সবার হিসাব মেটানোর মতো পেমেন্টের একটি ছোট তালিকা, মুদ্রা ধরে হিসাব করা। প্রশ্ন তোলা খরচগুলো মীমাংসা না হওয়া পর্যন্ত যোগফলের বাইরে থাকে। নিচের রুমমেটদের উদাহরণে ছয়টি পেমেন্ট দুটিতে নেমে আসে।"
      shot: S10
      shotAlt: "ব্যালেন্সের স্ক্রিন, দুটি মুদ্রায় সহজ করা দেনা, সবাইকে দেখান চালু"
    - title: "যেভাবে খুশি দিন, তারপর রেকর্ড করুন"
      body: "ব্যাংক ট্রান্সফার, নগদ, বা গত ছুটির কোনো ধার। Side Badger টাকা নাড়াচাড়া করে না। টাকা হাত বদলালে পেমেন্ট রেকর্ড করুন, আর ব্যালেন্স সবার জন্য হালনাগাদ হয়ে যায়।"
      shot: S11
      shotAlt: "পেমেন্টের ফর্ম, দ্রুত-সেটল বোতাম আর আংশিক পেমেন্টের নোটিসসহ"
    - title: "দেখে নিন পৌঁছেছে"
      body: "পেমেন্ট চলে যায় গ্রুপের ইতিহাসে, যেখানে গ্রুপের সবাই সেটা দেখতে আর ইমোজি দিয়ে রিঅ্যাক্ট করতে পারে। পেমেন্ট পৌঁছালে উদযাপন করুন।"
      shot: S12
      shotAlt: "পেমেন্টের ইতিহাস, একটি পেমেন্টে ইমোজি রিঅ্যাকশনসহ"
