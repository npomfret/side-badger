faq:
  heading: "أسئلة"
  items:
    - q: "هل يمكن أن تكون الأصوات مجهولة؟"
      a: "نعم. فعّل **التصويت المجهول** عند إنشاء الاستطلاع فيخفي من صوّت لماذا. قرّر ذلك قبل أول صوت، لأنه لا يمكن تغييره بعد ذلك."
    - q: "هل يمكن أن يُغلق الاستطلاع من تلقاء نفسه؟"
      a: "لا. ليس للاستطلاع موعد نهائي، فيختار من أنشأه **إغلاق الاستطلاع** حين تقرر المجموعة. وإذا راجعت المجموعة رأيها فإن **إعادة فتح الاستطلاع** تعيده."
    - q: "كم عنصراً تتسع له القائمة؟"
      a: "ما يصل إلى 200 عنصر لكل قائمة وما يصل إلى 100 قائمة لكل مجموعة. ويمكن أن يبلغ طول كل عنصر 500 حرف، وهذا كثير من حليب الشوفان."
    - q: "من يستطيع إغلاق سؤال، وماذا يحدث للمصروف في الأثناء؟"
      a: "من طرحه، أو مشرف المجموعة. وما دام السؤال مفتوحاً، يخرج المصروف كله من أرصدة الجميع. ويعود حين يُغلق آخر سؤال مفتوح عنه، أو حين يُخرج تعديلٌ من سأل من المصروف."
    - q: "هل أستطيع استخدام القوائم والتعليقات كتطبيق مهام أو كدردشة جماعية؟"
      a: "لا. التعليقات والقوائم والاستطلاعات مخصصة لمال المجموعة، وهذا ما تطلبه [الشروط](page:terms). فكّر في قوائم التسوق واستطلاعات الميزانية و«لماذا هذا £45؟»."
    - q: "هل سيراسلني Side Badger بالبريد عن النشاط؟"
      a: "لا. لا توجد تنبيهات بالبريد الإلكتروني أو بالرسائل النصية للنشاط. يمكنك تفعيل الإشعارات الفورية على كل جهاز، ويعرض جرس الإشعارات في التطبيق ما الجديد."
