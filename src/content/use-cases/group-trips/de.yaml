meta:
  title: Kosten für Gruppenreisen teilen, in 140 Währungen
  description: Halte fest, wer auf einer Gruppenreise was bezahlt hat, gib Kosten in der Landeswährung ein, rechne sie um oder nicht und rechne am Ende einmal ab. Kostenlos, im Browser.
h1: Kosten für Gruppenreisen teilen, in 140 Währungen
navLabel: Gruppenreisen
lead: Erfasse die Villa, die Taxis und die eine Cocktailrunde, für die sich keiner erinnert, sich zum Bezahlen gemeldet zu haben. Side Badger führt die laufende Rechnung, solange ihr weg seid, [kommt mit Pfund, Euro und 138 weiteren Währungen klar](page:feature/multiple-currencies) und gibt dir daheim eine [kurze Liste von Zahlungen](page:feature/settle-up).
cta:
  heading: Urlaubsrechnerei, erledigt, bevor die Bräune verblasst
  body: Erstelle eine Gruppe, schicke den Einladungslink an die Leute auf der Reise und füge Kosten hinzu, sobald sie anfallen.
  button: Kostenloses Konto erstellen
scenario:
  heading: Alle haben für etwas bezahlt, in irgendeiner Währung
  body: Jemand hat die Flüge gebucht, jemand anderes die Villa auf die Karte gesetzt, und eine dritte Person hat das Abendessen bar bezahlt. Am dritten Tag weiß keiner mehr, wer vorn liegt. Die Frage ist einfach, auch wenn die Antwort meist in einer Tabelle steckt, die keiner öffnen will. Wer hat was in welcher Währung bezahlt, und wie rechnen alle am Ende einmal ab?
sections:
  - heading: Vor der Abreise
    body: Lass über die Villa-Auswahl abstimmen, auf Wunsch anonym, damit die Entscheidung der Gruppe gehört und nicht der Person, die am längsten schmollt. Führe dann die gemeinsame Einkaufsliste neben den Einkaufsrechnungen, damit niemand drei Tuben Sonnencreme kauft und keinen Reisestecker.
  - heading: Unterwegs
    body: Füge jede Ausgabe hinzu, sobald sie anfällt, in der Währung, in der du bezahlt hast. Fotografiere den Beleg, und Side Badger trägt Summe, Datum und Ort ein, damit du sie prüfen kannst; Belegbilder liest der KI-Dienst von Google. Rechne den Betrag zu einem aktuellen Wechselkurs um, den du auf den Kurs ändern kannst, den du tatsächlich bekommen hast, und der Originalbetrag bleibt an der Ausgabe. Oder lass die Euro Euro sein und entscheide später. Eine Gruppe kann auch eine Währung wählen, und neue Ausgaben werden automatisch in sie umgerechnet.
  - heading: Nicht alle haben alles mitgemacht
    body: Manche haben das Abendessen ausgelassen, manche die Bootsfahrt. Lass sie bei den Kosten weg, an denen sie nicht beteiligt waren, und teile den Rest [gleichmäßig, nach genauen Beträgen oder in Prozent](page:feature/split-expenses). Niemand zahlt für den Teil der Reise, den er verschlafen hat.
  - heading: Rechnet ab, wenn ihr zu Hause seid
    body: Side Badger schlägt eine kurze Liste von Zahlungen vor, die alle ausgleicht. Zahlt einander, wie ihr wollt, und erfasst es dann. Bei gemischten Währungen haltet ihr jede getrennt oder rechnet unterwegs um; das Lissabon-Beispiel unten zeigt beides.
  - heading: Junggesellenabschiede
    body: Ein Wochenende mit Ehrengast braucht etwas mehr Verwaltung. Mach daraus eine verwaltete Gruppe, in der Admins neue Mitglieder freigeben und nur Ersteller und Admins Ausgaben ändern dürfen. Nutze genaue Beträge für den Anteil des Ehrengasts, beschränke die Gruppe auf die Währungen, die ihr wirklich nutzt, und sperre die Gruppe, wenn alles vorbei ist, damit die Zahlen stehen bleiben.
exampleAfter: 4
