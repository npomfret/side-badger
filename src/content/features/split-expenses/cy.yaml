sections:
  - heading: "Dim ond y bobl a oedd yno"
    body: "Rhannwch gost rhwng pawb, neu dim ond y bobl a'i rhannodd. Gadewch bobl allan o'r costau nad oeddent yn rhan ohonynt, ac mae'r balansau'n adlewyrchu hynny. Dyw'r cyd-letywr a oedd i ffwrdd drwy'r wythnos ddim yn ddyledus am y tecawê, ac fe fydd [cyd-letywyr](page:use-case/housemates) yn cydnabod hynny fel cyfiawnder sylfaenol."
  - heading: "Y manylion sy'n arbed dadleuon yn nes ymlaen"
    items:
      - "Gosodwch y **dyddiad** ac amser dewisol. Mae llwybrau byr fel heddiw, ddoe, y bore yma a neithiwr yn arbed teipio."
      - "Ychwanegwch hyd at dri **label** i grwpio costau, fel nwyddau bwyd neu deithio."
      - "Ychwanegwch y **lle**. Gludwch ddolen map ac mae enw'r lle yn llenwi ei hun."
      - "Ychwanegwch **nodyn** am y stori y tu ôl i'r rhif, gydag ychydig o fformatio os oes ei angen ar y stori."
      - "Defnyddiwch y **sylwadau** i gadw'r sgwrs wrth ymyl y gost y mae'n ymwneud â hi, yn hytrach nag mewn sgwrs nad oes neb yn sgrolio'n ôl drwyddi."
  - heading: "Copïo, golygu, a gweld beth newidiodd"
    body: "Copïwch rent y mis diwethaf yn lle ei deipio eto, yna newidiwch beth sy'n wahanol. Os oedd rhif yn anghywir, golygwch y gost. Cedwir y fersiwn gynharach ac mae'r golygiad yn ymddangos yng ngweithgaredd y grŵp, felly does neb yn newid rhif yn dawel. Mae'r hyn y caniateir i unrhyw un ei olygu yn dibynnu ar ganiatâd y grŵp."
  - heading: "Pan fydd rhywbeth yn edrych yn anghywir"
    body: "Gall grŵp droi cwestiynau cost ymlaen. Gall unrhyw un sy'n rhan o gost godi cwestiwn a dweud pam, ac mae'r gost yn aros allan o'r balansau nes bod y person a ofynnodd, neu weinyddwr, yn ei chau. Mae i ffwrdd yn ddiofyn ac mae gweinyddwr yn ei droi ymlaen ar gyfer y grŵp. Mae'n addas ar gyfer [digwyddiadau a dathliadau](page:use-case/events-and-celebrations), lle mae'r blaendal nad oes neb yn ei gofio'n sydyn yn fusnes i bawb."
limits:
  heading: "Cyfyngiadau"
  items:
    - "Mae un person yn talu am bob cost. Os talodd dau berson, cofnodwch ddwy gost."
    - "Does dim rhannu fesul eitem na rhannu fesul cyfrannau. Yn gyfartal, symiau union a chanrannau yw'r cyfan sydd ar gael."
    - "Rhaid i ganrannau adio i 100."
    - "Gall cost fod hyd at 999,999.99 yn ei harian cyfred ei hun, gyda'r lleoedd degol arferol ar gyfer yr arian cyfred hwnnw."
    - "Ni all costau ailadrodd ar eu pen eu hunain. Copïwch un y mis diwethaf yn lle hynny."
    - "Ni all dyddiadau fod yn y dyfodol na mwy na 10 mlynedd yn ôl."
    - "Mae cost sy'n cynnwys rhywun sydd wedi gadael y grŵp yn dod yn ddarllen yn unig."
useCasesHeading: "Lle mae rhannu fel hyn yn helpu"
faq:
  heading: "Cwestiynau"
  items:
    - q: "All dau berson dalu am un gost?"
      a: "Nid mewn un gost. Cofnodwch ddwy, un ar gyfer pob talwr, ac mae'r balansau'n dod allan yr un fath."
    - q: "Alla i rannu derbynneb fesul eitem?"
      a: "Na. Mae rhaniad yn gyfartal, yn ôl symiau union neu yn ôl canran. Ar gyfer bil gydag eitemau gwahanol, rhowch yr hyn sy'n ddyledus gan bob person fel symiau union."
    - q: "Alla i osod rhaniad rhagosodedig?"
      a: "Na. Copïwch gost gynharach i ailddefnyddio ei rhaniad, a newidiwch beth sy'n wahanol."
    - q: "All biliau ailadrodd bob mis?"
      a: "Na. Copïwch gost y mis diwethaf yn lle hynny, sy'n cymryd ychydig eiliadau."
    - q: "Pwy all olygu cost?"
      a: "Pwy bynnag y mae caniatâd y grŵp yn ei ganiatáu. Mae pob golygiad yn ymddangos yng ngweithgaredd y grŵp, felly nid yw newidiadau byth yn dawel."
    - q: "Beth sy'n digwydd i'r balansau wedyn?"
      a: "Maen nhw'n diweddaru wrth i gostau gyrraedd, ac mae [setlo](page:feature/settle-up) yn eu troi'n rhestr fer o daliadau. Os yw cost mewn arian cyfred arall, gweler [arian cyfred lluosog](page:feature/multiple-currencies)."
