meta:
  title: "Дели кућне рачуне са цимерима"
  description: "Дели кирију по величини собе, струју и намирнице једнако и сваког месеца види ко коме дугује. Бесплатан начин да цимери воде евиденцију."
h1: "Дели кућне рачуне са цимерима"
navLabel: "Цимери"
lead: "За цимера који купује тоалет папир и цимере који никад не виде да се то дешава. Side Badger води једну текућу евиденцију кирије, рачуна и куповине за **цимере**, па нико никога не мора јурити, а фрижидер опет може бити само фрижидер."
cta:
  heading: "Почни са својом кућом"
  body: "Направи кориснички налог, оснуј групу за кућу и свима пошаљи везу за позивницу. Рачуни овог месеца могу ући већ вечерас."
  button: "Направи бесплатан налог"
scenario:
  heading: "Уреди кућу"
  body: "Оснуј групу за кућу, изабери име под којим желиш да будеш видљив у њој и позови све везом или QR кодом. Група може бити отворена, где свако додаје и мења, или управљана, где нове чланове одобрава администратор, а трошкове могу мењати само оснивачи и администратори, што одговара цимеру који води књиге. Ко само жели да гледа бројеве може бити посматрач, који види све и ништа не мења. Сви нови трошак виде одмах, па „додаћу касније“ има мање склоништа."
sections:
  - heading: "Кирија и рачуни"
    body: "Кирија се ретко дели са четири јер собе нису исте. Подели је по процентима, па велика соба плаћа више, а орман са прозором мање. Проценти морају заједно давати 100. Рачуни које сви користе добијају једнаку поделу, а цимер који није учествовао у трошку може бити изостављен. Кад једнака подела остави преостали цент, он иде једној особи насумично. Нема понављајућих рачуна, па сваког месеца копираш прошломесечну кирију, промениш датум и наставиш."
  - heading: "Заједничка куповина"
    body: "Заједнички списак за куповину држи у истој групи као и рачуне за куповину и квачицом означавај ставке кад стигну у корпу. Ко обави куповину, додаје укупан износ са рачуна као трошак и дели га једнако или само међу особе које ће то појести. Ко стално купује овсено млеко које нико други не пије остаје ствар куће, али ће списак трошкова бар бити тачан. Дозволе групе одређују ко може да прави и мења спискове. Стави кирију, рачуне и куповину заједно и добијаш месец попут оног испод, у кући од четворо: Јо плаћа 2.000 £ кирије, подељене 30 %, 25 %, 25 % и 20 % према величини собе, затим Кваме плаћа 120 £ за струју, Лена 40 £ за интернет, а Мет 80 £ за намирнице, све подељено једнако. Јо на крају потражује 1.340 £, а Side Badger предлаже три уплате, све Јоу."
  - heading: "Поштени начини дељења кућних трошкова"
    items:
      - "**Једнако** одговара ономе што сви користе отприлике једнако, као интернет, средства за чишћење и заједничка куповина. Брзо је и нико се не мора свађати око математике."
      - "**Према величини собе** одговара кирији, јер се собе разликују и колико су људи вољни да плате за њих. Договорите проценте једном, кад се неко усели, и користите их сваког месеца."
      - "**Према коришћењу** одговара рачунима где једна особа очигледно троши више, као рачун за грејање кућне канцеларије или стриминг налог који гледају две особе. Изостави особе које нису учествовале или унеси тачне износе за сваку."
      - "Шта год изабереш, договорите се пре првог рачуна, а не после прве свађе, и запишите правило негде где га види цела кућа."
  - heading: "Кад се неко исели"
    body: "Прво се поравнава. Нико не може напустити групу док дугује или му се дугује новац, па онај који се сели плати или прими, ти то забележиш, а тек тада одлази. Настави групу за преостале цимере и позови нову особу везом. Кад куће више нема, администратор може закључати групу да бројеви остану или је заувек затворити, чиме постаје недоступна свима, па то уради тек кад никоме не треба историја."
