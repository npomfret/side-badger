meta:
  title: "Rozliczaj się w mniejszej liczbie płatności | Side Badger"
  description: "Zobacz, kto komu jest winien w twojej grupie, dostań krótką listę płatności, która rozlicza wszystkich, i rejestruj każdą płatność na bieżąco. Za darmo."
h1: "Rozliczaj się w mniejszej liczbie płatności"
navLabel: "Rozliczanie"
lead: "Side Badger prowadzi bieżące saldo każdego w grupie i podpowiada krótką listę płatności, która je rozlicza. Płacicie sobie, jak chcecie, a potem rejestrujecie to. Jeśli chcesz najpierw zobaczyć, jak dzielą się kwoty, zacznij od [dzielenia wydatków](page:feature/split-expenses)."
cta:
  heading: "Gotowi rozplątać, kto komu jest winien?"
  body: "Załóż konto, utwórz grupę i dodaj pierwszy wydatek. Resztą zajmą się salda."
  button: "Załóż darmowe konto"
problem:
  heading: "Salda, które aktualizują się na bieżąco"
  body: "Każdy wydatek zmienia to, kto komu jest winien, więc Side Badger utrzymuje salda aktualne w miarę dodawania wydatków i płatności. Każdy w grupie widzi zmianę od razu oraz to, co się zmieniło i kto to zmienił. Salda są prowadzone osobno dla każdej waluty, więc euro i funty zostają w swoich kolumnach, chyba że wydatek przeliczono przy wpisywaniu. Domyślnie widzisz długi, które cię dotyczą; **Pokaż wszystko** wyświetla całą grupę."
workflow:
  heading: "Trzy kroki do kwita"
  steps:
    - title: "Zobacz, kto komu jest winien"
      body: "Otwórz salda grupy, żeby zobaczyć, ile jesteś winien, ile ci się należy i krótką listę płatności, która rozlicza wszystkich, policzoną osobno dla każdej waluty. Zakwestionowane wydatki zostają poza sumami, dopóki nie zostaną wyjaśnione. W przykładzie ze współlokatorami poniżej sześć płatności zamienia się w dwie."
      shot: S10
      shotAlt: "Ekran sald z uproszczonymi długami w dwóch walutach i włączonym przyciskiem Pokaż wszystko"
    - title: "Zapłać, jak chcesz, i zarejestruj to"
      body: "Przelew, gotówka, przysługa z ostatnich wakacji. Side Badger nie przesyła pieniędzy. Gdy pieniądze zmienią właściciela, zarejestruj płatność, a saldo zaktualizuje się dla wszystkich."
      shot: S11
      shotAlt: "Formularz płatności z przyciskami szybkiego rozliczenia i komunikatem pokazywanym przy płatności częściowej"
    - title: "Sprawdź, czy dotarło"
      body: "Płatność trafia do historii grupy, gdzie każdy w grupie może ją zobaczyć i zareagować emoji. Uczcij płatność, gdy dotrze."
      shot: S12
      shotAlt: "Historia płatności z reakcjami emoji przy płatności"
