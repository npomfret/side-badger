featuresHeading: "Ang mga feature na ginagamit ng magkapareha"
faq:
  heading: "Mga tanong"
  items:
    - q: "Puwede ba naming itakda ang 60/40 nang isang beses para sa lahat?"
      a: "Hindi. Nasa bawat gastos ang hati. Itakda ang mga porsyento sa una, saka kopyahin ito sa susunod at baguhin ang kaibahan. Tinatalakay ng [paghahati ng gastos](page:feature/split-expenses) ang tatlong paraan ng paghahati."
    - q: "Kokonekta ba ito sa bangko namin?"
      a: "Hindi. Hindi kailanman ginagalaw ng Side Badger ang pera mo. Magbayaran kayo sa paraang gusto ninyo, saka itala, gaya ng ipinaliliwanag ng [settle up](page:feature/settle-up)."
    - q: "May iba bang makakakita ng grupo namin?"
      a: "Ang mga miyembro lang nito, at dalawa ang sa magkapareha. Makakasali ang sinumang gumamit ng invite link na hindi pa nag-e-expire, kaya ibahagi ito sa isang tao at bigyan ng maikling expiry."
    - q: "Paano kung parehong nagbayad ng bahagi ng iisang bayarin?"
      a: "Isa ang nagbabayad sa bawat gastos. Magtala ng dalawang gastos, isa para sa bawat isa sa inyo, at pareho lang ang kalalabasan ng balanse."
    - q: "Ipapaalala ba nito sa partner ko na magbayad?"
      a: "Hindi. Walang paalala, kaya sa iyo pa rin ang pagsundot. Kahit paano, iisang numero ang tinitingnan ninyong dalawa."
    - q: "Ano ang mangyayari kapag tumigil na kaming maghati ng gastos?"
      a: "I-settle ang balanse at itala ang bayad, para walang may utang. Saka puwedeng i-lock ng admin ang grupo, para manatili ang mga numero, o isara nang tuluyan, na magiging hindi na ma-access ng sinuman. Isara lang ito kapag wala sa inyong dalawa ang nangangailangan ng kasaysayan."
