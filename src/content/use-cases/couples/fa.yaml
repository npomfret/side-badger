featuresHeading: "امکاناتی که یک زوج استفاده می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "می‌توانیم 60/40 را یک بار برای همه‌چیز تنظیم کنیم؟"
      a: "نه. تقسیم به هر هزینه تعلق دارد. درصدها را روی اولی بگذارید، بعد دفعه بعد آن را کپی کنید و آنچه فرق دارد عوض کنید. [تقسیم هزینه‌ها](page:feature/split-expenses) هر سه روش تقسیم را توضیح می‌دهد."
    - q: "به بانک ما وصل می‌شود؟"
      a: "نه. Side Badger هرگز به پول شما دست نمی‌زند. هر طور دوست دارید به هم پرداخت می‌کنید، بعد ثبتش می‌کنید، همان‌طور که [تسویه حساب](page:feature/settle-up) توضیح می‌دهد."
    - q: "کس دیگری می‌تواند گروه ما را ببیند؟"
      a: "فقط اعضای آن، و گروه یک زوج دو عضو دارد. هر کسی که از لینک دعوت زنده استفاده کند می‌تواند بپیوندد، پس آن را فقط برای یک نفر بفرستید و انقضای کوتاهی برایش بگذارید."
    - q: "اگر هر کدام بخشی از یک صورت‌حساب را پرداخت کرده باشیم چه؟"
      a: "هر هزینه یک پرداخت‌کننده دارد. دو هزینه ثبت کنید، یکی برای هر کدام از شما، و مانده همان درمی‌آید."
    - q: "به شریک زندگی‌ام یادآوری می‌کند که پرداخت کند؟"
      a: "نه. یادآوری وجود ندارد، پس تلنگر هنوز با شماست. دست‌کم هر دو به یک عدد نگاه می‌کنید."
    - q: "وقتی دیگر هزینه‌ها را با هم تقسیم نمی‌کنیم چه می‌شود؟"
      a: "مانده را تسویه کنید و پرداخت را ثبت کنید تا کسی بدهکار نباشد. بعد مدیر می‌تواند گروه را قفل کند، که اعداد را همان‌طور که هستند نگه می‌دارد، یا برای همیشه ببندد، که آن را برای همه غیرقابل دسترس می‌کند. فقط وقتی ببندید که هیچ‌کدام از شما به تاریخچه نیاز ندارید."
