meta:
  title: "అనేక కరెన్సీల్లో చెల్లించిన ట్రిప్‌ను పంచడం | Side Badger"
  description: "హోటల్‌కు పౌండ్లు, రామెన్‌కు యెన్. ప్రతి కరెన్సీని విడిగా తేల్చండి, లేదా మీకు కనిపించే రేటుతో మార్చండి. రెండు దారులు, లెక్కలతో."
h1: "అనేక కరెన్సీల్లో చెల్లించిన ట్రిప్‌ను పంచడం"
navLabel: "అనేక కరెన్సీల ట్రిప్పులు"
lead: "ప్రతి ఖర్చును మీరు చెల్లించిన కరెన్సీలోనే నమోదు చేయండి, తర్వాత ఒక దారి ఎంచుకోండి. కరెన్సీలను విడివిడిగా ఉంచి ప్రతిదాన్ని దాని సొంత డబ్బులో తేల్చవచ్చు, లేదా ప్రస్తుత మారకం రేటుతో మార్చి ఒక్కసారే తేల్చవచ్చు. ఇదే జపాన్ ట్రిప్ మొదటి దారిలో నాలుగు పేమెంట్లు అవుతుంది, రెండో దారిలో రెండు."
cta:
  heading: "మీరు చెల్లించిన డబ్బులోనే నమోదు చేయండి"
  body: "ఉచిత ఖాతా తెరవండి, ట్రిప్ కోసం ఒక గ్రూప్ మొదలుపెట్టండి, రసీదుపై ఏ కరెన్సీ ఉంటే ఆ కరెన్సీలో ప్రతి ఖర్చును జోడించండి. ముందు వివరాలు కావాలా? [బహుళ కరెన్సీలు](page:feature/multiple-currencies) లేదా [ఉచితంలో ఏముంది](page:pricing) చూడండి."
sections:
  - heading: "ముగ్గురు స్నేహితులు, ఒక హోటల్, బోలెడన్ని యెన్"
    body: "Zoe, Kenji, Lucy ఒక వారం జపాన్‌లో [గ్రూప్ ట్రిప్](page:use-case/group-trips) చేస్తున్నారు, ప్రతి ఖర్చు ముగ్గురి మధ్య సమానంగా పంచబడుతుంది. Zoe ఇంటి నుంచే పౌండ్లలో £600కు హోటల్ బుక్ చేసింది. Lucy టోక్యోలో రైలు పాస్‌లను ¥90,000కు కొంది. Kenji రామెన్ రాత్రికి ¥9,000 చెల్లించాడు, అప్పటి నుంచి రోజూ గుర్తు చేస్తూనే ఉన్నాడు. రైల్వే ప్లాట్‌ఫామ్ మీద నిల్చుని మూడు రసీదులను మార్చాలని ఎవరికీ లేదు. ఇక్కడి లెక్కల కోసం ¥1 అంటే £0.005, ఈ గైడ్ కోసం కల్పించిన గుండ్రని రేటు. యాప్‌లో మీరు ప్రస్తుత మారకం రేటును వాడతారు, లేదా మీకు నిజంగా దొరికిన రేటును టైప్ చేస్తారు."
  - heading: "రసీదుపై ఉన్న డబ్బులోనే ప్రతిదీ నమోదు చేయండి"
    body: "ఏ దారి ఎంచుకున్నా ఈ భాగం చేయండి. ఇంకా ఏదీ మార్చాల్సిన పని లేదు."
    items:
      - "**గ్రూప్ చేయండి.** డాష్‌బోర్డ్‌లో **సమూహాన్ని సృష్టించు** ఎంచుకోండి, ట్రిప్ పేరు పెట్టండి, తర్వాత **ఇతరులను ఆహ్వానించండి** ఎంచుకుని లింక్ లేదా QR కోడ్ పంపండి."
      - "**హోటల్‌ను జోడించండి.** **ఖర్చును జోడించు** ఎంచుకుని 600 నమోదు చేయండి, మొత్తం పక్కన కరెన్సీగా పౌండ్లు ఎంచుకోండి. **ఎవరు చెల్లించారు?** కింద Zoeను ఎంచుకోండి. **ఎవరి మధ్య విభజించాలి** కింద ముగ్గురినీ ఉంచండి, **ఎలా విభజించాలి**ని **సమానం**గా వదిలేసి **ఖర్చును సేవ్ చేయి** ఎంచుకోండి."
      - "**యెన్‌ను జోడించండి.** రైలు పాస్‌లకు (Lucy చెల్లించింది), రామెన్‌కు (Kenji చెల్లించాడు) కూడా ఇలాగే చేయండి, కరెన్సీగా యెన్ ఎంచుకోండి. యెన్‌కు దశాంశాలు ఉండవు, కాబట్టి ఫారం వాటిని అడగదు."
  - heading: "మొదటి దారి: కరెన్సీలను విడిగా ఉంచండి"
    body: "Side Badger ప్రతి కరెన్సీకి ఒక బ్యాలెన్స్ ఉంచుతుంది, ఒకదాన్ని మరొకదానితో కలిపి లెక్కించదు. పౌండ్లలో హోటల్ ఒక్కొక్కరికి £200, కాబట్టి Kenji, Lucy ఇద్దరూ Zoeకు £200 చొప్పున బాకీ. యెన్‌లో రైలు పాస్‌లు, రామెన్ కలిసి ¥99,000, అంటే ఒక్కొక్కరికి ¥33,000. Lucy ¥90,000 చెల్లించింది, కాబట్టి ఆమెకు ¥57,000 రావాలి. Zoe యెన్ ఏమీ చెల్లించలేదు, ¥33,000 బాకీ. Kenji ¥9,000 చెల్లించాడు, కాబట్టి అతను ¥24,000 బాకీ."
    items:
      - "**పౌండ్లు.** Kenji Zoeకు £200 చెల్లిస్తాడు, Lucy Zoeకు £200 చెల్లిస్తుంది."
      - "**యెన్.** Zoe Lucyకి ¥33,000 చెల్లిస్తుంది, Kenji Lucyకి ¥24,000 చెల్లిస్తాడు."
      - "**మొత్తం నాలుగు పేమెంట్లు.** Zoe, Lucy రెండు కరెన్సీల్లో ఒకరికొకరు బాకీ, అవి ఒకదానికొకటి రద్దు కావు. రేటుకు ఇక్కడ పనే లేదు, కాబట్టి వాదించడానికి ఏమీ ఉండదు."
      - "**యెన్ బాకీ, పౌండ్లలో చెల్లింపు.** యెన్ లేనివాళ్లు కూడా పౌండ్లలో చెల్లించవచ్చు. పేమెంట్‌ను నమోదు చేసేటప్పుడు **వేరే కరెన్సీనా?** తెరిచి, పౌండ్లకు **దీనికి మార్చు** ఎంచుకుని రేటును చూసుకోండి. ఈ గైడ్ రేటులో Zoe ¥33,000 అంటే £165, యెన్ బ్యాలెన్స్ ఇంకా సరిగ్గానే తేలుతుంది."
      - "**ప్రతి పేమెంట్‌ను నమోదు చేయండి.** మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత **సెటిల్ చేయి** ఎంచుకుని **సెటిల్మెంట్‌ను నమోదు చేయి** వాడండి. [లెక్క తేల్చడం](page:feature/settle-up) గురించి మరింత ఉంది."
  - heading: "రెండో దారి: ఎంటర్ చేస్తూనే మార్చండి"
    body: "గ్రూప్ ఒక్కొక్కరికి ఒకే అంకె చూడాలనుకుంటే, ఖర్చు నమోదు చేసేటప్పుడే మార్చండి."
    items:
      - "**ఫారంలోనే మార్చండి.** **ఖర్చును నమోదు చేయి**లో **దీనికి మార్చు** ఎంచుకుని పౌండ్లను ఎంచుకోండి. Side Badger రేటును, మార్చిన మొత్తాన్ని చూపిస్తుంది, ≈ గుర్తుతో. మీకు వేరే రేటు దొరికితే రేటును మార్చండి. అసలు యెన్ మొత్తం ఖర్చులో అలాగే ఉంటుంది."
      - "**పౌండ్లలో చదవండి.** ¥1 = £0.005 వద్ద రైలు పాస్‌లు £450, రామెన్ £45 అవుతాయి. £600 హోటల్‌తో కలిపితే £600 + £450 + £45 = £1,095, అంటే ఒక్కొక్కరికి £365. Zoe £600 చెల్లించింది, కాబట్టి ఆమెకు £235 రావాలి. Lucy £450 చెల్లించింది, ఆమెకు £85 రావాలి. Kenji £45 చెల్లించాడు, అతను £320 బాకీ."
      - "**రెండు పేమెంట్లు.** రెండూ Kenji నుంచే: Zoeకు £235, Lucyకి £85. Zoe, Lucy ఇక ఒకరికొకరు అస్సలు చెల్లించుకోరు."
      - "**లేదా గ్రూప్ కరెన్సీని సెట్ చేయండి.** ఈ అదనపు అడుగు వద్దనుకుంటే, గ్రూప్ **సెట్టింగ్‌లు** తెరిచి, **కరెన్సీ సెట్టింగ్‌లు**లో **ఖర్చులను స్వయంచాలకంగా మార్చు** ఎంచుకోండి. అప్పుడు ప్రతి కొత్త ఖర్చు ఆ కరెన్సీలోకి మారుతుంది, అయినా రేటు మీకు కనిపిస్తుంది, మార్చవచ్చు."
  - heading: "ఏ దారి తీసుకోవాలి?"
    items:
      - "**విడిగా ఉంచండి**, ఒకవేళ ఇంకా ఎవరి పర్సుల్లోనైనా యెన్ ఉంటే, లేదా రేటు గురించి వాదించడం ఇష్టం లేకపోతే. దీనికి ఖరీదు ఎక్కువ పేమెంట్లు, ఒకటి కంటే ఎక్కువ కరెన్సీల్లో."
      - "**మార్చండి**, ఒకవేళ గ్రూప్ ఒకే కరెన్సీలో నడుస్తూ, ఒక్కొక్కరికి ఒకే అంకె, చిన్న జాబితా కావాలనుకుంటే, Kenji రెండు బదిలీల్లాగే. దీనికి ఖరీదు, గ్రూప్ ఒక రేటును నమ్మాలి, ఆ రేటు ప్రతి ఖర్చు సేవ్ అయినప్పుడే స్థిరపడుతుంది."
      - "**ముందే నిర్ణయించండి.** గ్రూప్ కరెన్సీ కొత్త ఖర్చులను, కాపీ చేసిన ఖర్చులను మాత్రమే మారుస్తుంది. ఇప్పటికే నమోదు చేసినవాటిని వెనక్కి వెళ్లి సరిచేయదు."
  - heading: "రేటు, గరిష్ఠ పరిమితి"
    items:
      - "**సేవ్ చేసినప్పుడే రేటు స్థిరపడుతుంది.** పాత ఖర్చుల విలువ ఎప్పుడూ మళ్లీ లెక్కించబడదు, కాబట్టి మార్కెట్ కదిలిందని బ్యాలెన్స్ జారదు. వేర్వేరు రోజుల్లో నమోదు చేసిన ఖర్చులకు వేర్వేరు రేట్లు ఉండవచ్చు, కాబట్టి ట్రిప్ మొత్తానికి ఒకే రేటు కావాలంటే, దాన్ని ఒప్పుకుని ప్రతిసారీ టైప్ చేయండి."
      - "**రేటు లేదా? మీరే టైప్ చేయండి.** Side Badger వీలైన చోట ప్రస్తుత మారకం రేటును తెస్తుంది, కానీ ప్రతి జతకూ రేటు ఉంటుందని హామీ లేదు. లేకపోతే, లేదా క్యాష్ కౌంటర్ మంచి రేటు ఇస్తే, మీ సొంతది టైప్ చేయండి."
      - "**ఒక్కో ఖర్చుకు, దాని సొంత కరెన్సీలో 999,999.99.** ఏ డబ్బైనా ఒకే పరిమితి. యెన్‌లో అది ¥1,000,000 కంటే కొంచెం తక్కువ, ఈ గైడ్ రేటులో సుమారు £5,000. ఇండోనేషియా రుపియా లాంటి పెద్ద అంకెల కరెన్సీలో ఒక్క బిల్లే దాన్ని త్వరగా తాకవచ్చు. బిల్లును రెండు ఖర్చులుగా విడగొట్టండి, లేదా మరో కరెన్సీలో నమోదు చేసి మార్చండి."
  - heading: "ఇక్కడ Side Badger ఏం చేయదు"
    items:
      - "ఇది డబ్బును కదపదు, మార్చదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుని, తర్వాత పేమెంట్‌ను నమోదు చేస్తారు."
      - "ఇందులో 140 కరెన్సీలు ఉన్నాయి. క్రిప్టోకరెన్సీలు, లోహాలు వాటిలో లేవు."
