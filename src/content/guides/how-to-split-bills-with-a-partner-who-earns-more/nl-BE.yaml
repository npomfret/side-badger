meta:
  title: "Rekeningen verdelen met een partner die meer verdient | Side Badger"
  description: "50/50 wordt lastig als een van jullie veel meer verdient. Verdeel de gedeelde rekeningen naar inkomen, met de sommen voor twee personen en zonder spreadsheet."
h1: "Hoe verdeel je rekeningen met een partner die meer verdient"
navLabel: "Partner die meer verdient"
lead: "Tel jullie nettoloon op, bereken het aandeel van elke persoon in het totaal en rond af op hele percentages. Maya verdient netto £ 2.800 en Jon £ 1.700, dus verdelen zij de gedeelde rekeningen 62/38. Voer die percentages in bij een gedeelde uitgave in Side Badger en kopieer die uitgave telkens als dezelfde rekening terugkomt."
cta:
  heading: "Maak de som één keer"
  body: "Maak een gratis account aan, maak een groep voor jullie tweeën en zet de huur erin met jullie percentages. De huur van volgende maand is een kopie. Eerst de rondleiding? Zie [zo werkt het](page:how-it-works) of [wat gratis dekt](page:pricing)."
sections:
  - heading: "Twee lonen, één appartement, één beleefde stilte"
    body: "Maya en Jon wonen samen. Maya verdient netto £ 2.800 per maand en Jon £ 1.700. Twee jaar lang verdeelden ze alles 50/50, omdat het simpel was en geen van beiden het onderwerp wilde aanbrengen. Toen keek Jon naar de huur op zich. De helft van £ 1.400 is £ 700, wat een kwart van het nettoloon van Maya is en 41% van het zijne. Niemand was oneerlijk geweest. Niemand had de som gemaakt. Heel wat [koppels](page:use-case/couples) komen daar uiteindelijk uit. Bij een afhaalmaaltijd spraken ze af dat de gedeelde rekeningen een vergelijkbare hap uit elk loon moeten nemen."
  - heading: "De methode, met de sommen erbij"
    body: "Vier stappen, één rekenmachine en een gesprek dat je toch al moest voeren."
    items:
      - "**Spreek af wat als loon telt.** Maya en Jon gebruiken het nettoloon, het geld dat elke maand op de bank belandt. Samen is dat £ 2.800 + £ 1.700 = £ 4.500."
      - "**Bereken elk aandeel.** Dat van Maya is 2.800 ÷ 4.500, ofwel 62,2%. Dat van Jon is 1.700 ÷ 4.500, ofwel 37,8%."
      - "**Rond af op hele percentages.** 62,2% wordt 62 en 37,8% wordt 38. Bij twee personen rond je één cijfer af en trek je het af van 100 om het andere te krijgen, zodat ze altijd samen 100 zijn."
      - "**Controleer wat het betekent.** Op de huur van £ 1.400 betaalt Maya £ 868 (62%) en Jon £ 532 (38%). Dat is ongeveer 31% van het nettoloon van elke persoon. De helft elk zou 25% van dat van Maya hebben gekost en 41% van dat van Jon."
  - heading: "De maand lezen"
    body: "Maya betaalde de huur van £ 1.400 en Jon de andere £ 216. Het aandeel van Maya in de maand is £ 868,00 + £ 111,60 + £ 18,00 = £ 997,60, en ze betaalde £ 1.400, dus heeft ze £ 402,40 tegoed. Het aandeel van Jon is £ 532,00 + £ 68,40 + £ 18,00 = £ 618,40, en hij betaalde £ 216, dus is hij £ 402,40 schuldig. Side Badger stelt één betaling voor, van Jon aan Maya, van £ 402,40, en je registreert ze bij [afrekenen](page:feature/settle-up) zodra ze gebeurd is. Bij een 50/50-verdeling zou Jon dezelfde maand £ 592,00 aan Maya hebben betaald."
  - heading: "Zet het op in Side Badger"
    body: "Tien minuten, waarvan het grootste deel opgaat aan de percentages."
    items:
      - "**Maak de groep.** Kies op het dashboard **Groep aanmaken** en geef de groep de naam van het appartement. Kies **Anderen uitnodigen** en stuur Jon de link of QR-code. Hij meldt zich aan of maakt een gratis account aan en kiest de naam waaronder hij in deze groep getoond wil worden. Alleen leden kunnen een groep zien, dus deze is enkel van jullie tweeën."
      - "**Voeg de huur toe.** Kies **Uitgave toevoegen**. Vul de beschrijving en het bedrag in en kies bij **Wie heeft betaald?** Maya. Laat beide personen staan bij **Verdelen tussen**, kies dan bij **Hoe te verdelen** voor **Percentage** en typ 62 en 38. Het formulier waarschuwt als de percentages samen geen 100 zijn. Kies **Uitgave opslaan**."
      - "**Voeg de andere rekeningen toe.** Energie en internet gaan op dezelfde manier erin, met Jon als betaler en dezelfde 62 en 38. De afhaalmaaltijd is een eigen uitgave, met **Hoe te verdelen** op **Gelijk**."
      - "**Kopieer ze volgende maand.** Open de huur van vorige maand en kies **Uitgave kopiëren**. De kopie behoudt de betaler, het bedrag en de verdeling en krijgt de datum van vandaag. Pas het bedrag aan als de huur veranderd is en kies dan **Kopie aanmaken**. De energierekening werkt op dezelfde manier."
      - "**Controleer wie wie iets schuldig is.** Het onderdeel **Saldi** toont het en stelt een korte lijst betalingen voor. Betaal elkaar zoals je wilt en registreer de betaling dan onder **Vereffenen**."
  - heading: "50/50, naar inkomen, of rekening per rekening"
    body: "Er is geen juist antwoord, enkel het antwoord waar jullie allebei mee kunnen leven. Drie gangbare."
    items:
      - "**Voor alles de helft elk.** Het makkelijkst vol te houden, en het past bij koppels met een vergelijkbaar loon."
      - "**Naar inkomen voor alles wat gedeeld is.** Wat Maya en Jon doen. Eén gesprek, één paar percentages."
      - "**Rekening per rekening.** Huur en rekeningen naar inkomen, vakanties en extraatjes 50/50 of wat jullie ook afspreken, en elke rekening krijgt de regel die erbij past."
  - heading: "Spreek af wat als gedeeld telt"
    body: "De ruzies gaan meestal over de lijst, niet over de percentages. Huur, energie, internet, de wekelijkse boodschappen en de zetel gelden in de meeste huizen als gedeeld. Het fitnessabonnement van Maya en het voetbalabonnement van Jon misschien niet. Spreek de lijst één keer af, schrijf ze op en zet enkel de gedeelde kosten in de groep."
  - heading: "De afhaalmaaltijd blijft bewust 50/50"
    body: "Extraatjes zijn klein en optioneel, en niemand zou een rekenmachine nodig mogen hebben om dumplings te bestellen. In Side Badger is de afhaalmaaltijd gewoon een andere uitgave. Jon betaalt £ 36, **Hoe te verdelen** blijft op **Gelijk** staan en elk van hen is £ 18 schuldig."
  - heading: "Als iemands loon verandert"
    body: "Een loonsverhoging, een nieuwe job of een periode verlof verandert de som. Bereken de nieuwe percentages op dezelfde manier en gebruik ze vanaf de volgende uitgave. Eerdere uitgaven blijven zoals ze waren. Kopieer de huur van vorige maand, pas de percentages aan en kies dan **Kopie aanmaken**. Om een uitgave te corrigeren die er al in staat, bewerk je ze als de machtigingen van de groep het toelaten, en zeg het eerst aan je partner, want de saldi veranderen. De eerdere versie blijft bewaard. Spreek af wanneer jullie opnieuw rekenen, bijvoorbeeld één keer per jaar, en reken af voor jullie overschakelen, zodat de oude verdeling met een kloppende rekening afsluit."
  - heading: "Wat Side Badger hier niet doet"
    items:
      - "Het vraagt nooit wat iemand verdient en berekent de percentages niet. Jullie typen de cijfers in die jullie afspraken."
      - "Het kan geen standaardverdeling voor de hele groep instellen. De percentages horen bij elke uitgave, dus kopieer een uitgave die ze al heeft."
      - "Er zijn geen terugkerende rekeningen, dus kopieer je elke keer de huur van vorige maand."
      - "Het verplaatst nooit geld. Jullie betalen elkaar zoals jullie willen en registreren het dan."
