featuresHeading: "As funcionalidades que uma casa usa"
faq:
  heading: "Perguntas"
  items:
    - q: "A renda pode repetir-se automaticamente?"
      a: "Não, não há contas recorrentes. Copia a renda do mês passado em dois toques, muda a data e está feito."
    - q: "Podemos dividir pelo tamanho do quarto?"
      a: "Sim, por percentagem. Dá a cada colega uma parte que reflita o seu quarto, desde que as partes somem 100. [Dividir despesas](page:feature/split-expenses) explica as outras formas de dividir."
    - q: "E se um colega se mudar a dever dinheiro?"
      a: "Não pode sair do grupo até acertar as contas, porque ninguém pode sair enquanto deve ou tem dinheiro a receber. Os números mantêm-se honestos até todos estarem quites."
    - q: "O Side Badger paga as contas?"
      a: "Não. Mantém a conta e sugere uma lista curta de pagamentos. Paguem-se como preferirem e depois registem, como explica [acertar contas](page:feature/settle-up)."
    - q: "Um colega pode tratar das contas?"
      a: "Sim. Torna-o administrador e usa um grupo gerido, onde os novos membros precisam de aprovação e só os criadores e administradores podem alterar despesas."
