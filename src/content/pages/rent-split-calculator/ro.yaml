faq:
  heading: "Întrebări"
  items:
    - q: "Ce e mai corect, mărimea camerei sau venitul?"
      a: "Niciuna nu e mereu mai corectă. Mărimea camerei se potrivește colegilor de apartament care plătesc pentru spațiul în care dorm. Venitul se potrivește cuplurilor și prietenilor cu venituri foarte diferite. Puneți-vă de acord înainte de prima zi de chirie, nu după."
    - q: "Ar trebui facturile împărțite la fel?"
      a: "La colegii de apartament, de obicei nu. Toți folosesc energia și internetul, deci egal e mai simplu, ca în exemplu. La împărțirea după venit, calculatorul dă facturilor aceleași părți ca chiriei."
    - q: "Pot folosi picioare pătrate?"
      a: "Da. Alege ft² și scrie suprafețele în picioare pătrate. Unitatea e doar o etichetă, iar părțile ies la fel atâta timp cât toți folosesc aceeași unitate."
    - q: "Este calculatorul gratuit?"
      a: "Da. Gratuit. Fără reclame. Fără limite zilnice. Nici cont nu îți trebuie."
