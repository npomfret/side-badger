sections:
  - heading: Registrer en betaling
    body: Når nogen betaler, registrer det på den rigtige person. Hurtigafregningsknapperne udfylder beløbet ud fra dine foreslåede betalinger, og du kan tilføje en note som »bankoverførsel« (op til 500 tegn). Betaler du kun en del af det, du skylder, bliver resten stående på saldoen. Indtaster du for lidt eller for meget, advarer Side Badger dig, før du gemmer. For at registrere en betaling skal du have tilladelse til at redigere udgifter, og datoen må ikke ligge i fremtiden.
  - heading: Betalt i en anden valuta?
    body: Saldi bliver i den valuta, de blev betalt i, så en gæld i euro forbliver en gæld i euro. Skylder du euro, men betaler i pund? Omregn betalingen, mens du indtaster den, med en aktuel valutakurs eller med den kurs, du faktisk fik. Kursen fastlåses, når betalingen gemmes. [Flere valutaer](page:feature/multiple-currencies) forklarer, hvordan omregning virker, og [gruppeture](page:use-case/group-trips) viser det i brug.
  - heading: Historik, du kan tjekke
    body: Hver registreret betaling bliver i gruppens historik med dato, beløb og note. Kun den, der registrerede en betaling, kan redigere den, og vedkommende eller en gruppeadministrator kan slette den. En betaling, der involverer en person, som har forladt gruppen, er låst. Et gennemregnet scenarie med bofæller finder du under [bofæller](page:use-case/housemates).
limits:
  heading: Hvad Side Badger ikke gør
  items:
    - Side Badger flytter ikke penge, sender ikke betalingslinks og sender ikke betalingsanmodninger. En betaling i appen er en registrering af en betaling, der er foretaget andetsteds.
    - De foreslåede betalinger kommer fra en enkel afstemningsmetode, anvendt pr. valuta. Den foreslår altid færre betalinger, end der er personer med en saldo i den valuta (fire personer, højst tre betalinger), men den finder ikke altid det mindst mulige antal.
    - Du kan ikke slå forslagene fra. **Vis alle** viser alle foreslåede betalinger i gruppen, ikke kun dine.
    - Valutaer modregnes aldrig mod hinanden, medmindre udgifterne blev omregnet, da de blev indtastet.
    - Der er ingen påmindelser, så det er stadig op til dig at rykke for en betaling.
useCasesHeading: Hvor det betyder noget at gøre op
faq:
  heading: Spørgsmål
  items:
    - q: Sender Side Badger pengene?
      a: Nej. Betal hinanden, som I vil, og registrer så betalingen i Side Badger, så saldoen opdateres.
    - q: Kan jeg slå de foreslåede betalinger fra?
      a: Nej. Forenkling er altid slået til, og **Vis alle** viser alle foreslåede betalinger i gruppen, ikke kun dem, der involverer dig.
    - q: Hvorfor holdes euro og pund adskilt?
      a: Saldi bliver i den valuta, du betalte i, medmindre du omregner, når du indtaster en udgift eller betaling. Gæld i forskellige valutaer modregnes aldrig mod hinanden.
    - q: Hvad hvis nogen kun betaler en del af det, de skylder?
      a: Registrer den del, de betalte. Resten bliver stående på saldoen, indtil den er betalt.
    - q: Er det altid det mindst mulige antal betalinger?
      a: Det er ikke garanteret. Den foreslår altid færre betalinger, end der er personer med en saldo i den valuta, så for fire personer foreslår den aldrig mere end tre. I bofælle-eksemplet er det to betalinger, hvor det tog seks at betale hver person direkte tilbage.
