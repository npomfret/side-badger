meta:
  title: Cómo funciona Side Badger | Divide gastos de grupo en cinco pasos
  description: Crea un grupo, invita a la gente, añade gastos y salda cuentas. Descubre qué pasa entre «alguien pagó» y «estamos en paz», con un ejemplo práctico.
h1: Cómo funciona Side Badger
navLabel: Cómo funciona
lead: ¿Qué pasa entre «alguien pagó» y «estamos en paz»? Cinco pasos, ninguna hoja de cálculo y un tejón que es sobre todo decorativo. Este es el recorrido completo, desde el primer grupo hasta el último pago registrado. Para ver cada paso al detalle, consulta [dividir gastos](page:feature/split-expenses) y [saldar cuentas](page:feature/settle-up).
cta:
  heading: De «ya invito yo» a «estamos en paz»
  body: Crea una cuenta gratis, empieza un grupo y añade el primer gasto. El tejón no juzgará el recibo.
  button: Crear una cuenta gratis
steps:
  - title: Crea un grupo
    body: Haz un grupo para cada casa, viaje o evento, para que el alquiler nunca acabe en la misma lista que el regalo de boda. Ponle nombre, elige el nombre con el que te verá la gente y, si quieres, limita las monedas que acepta. Tu panel muestra todos los grupos, y cómo estás en cada uno, en una sola pantalla.
    shot: S02
    shotAlt: El cuadro de diálogo de crear grupo con la sección de restricciones de moneda abierta
  - title: Invita a tu gente
    body: Comparte un enlace para unirse o muestra un código QR, y define cuánto dura, desde 15 minutos hasta 5 días. Cada persona que se une necesita una cuenta gratis y un correo verificado, y un grupo admite hasta 50 personas. Si quieres controlar quién entra, activa la aprobación y un administrador deja pasar a cada persona.
    shot: S03
    shotAlt: El cuadro de diálogo de invitación en la pestaña del enlace, con un código QR y las opciones de caducidad
  - title: Añade gastos según ocurren
    body: Indica quién pagó, cuánto y para quién. Divídelo a partes iguales, por importes exactos o por porcentaje, y deja fuera a quien no participó. Añade el gasto y todo el mundo lo ve enseguida, junto con lo que cambió y quién lo cambió.
    shot: S05
    shotAlt: El formulario de gasto con una división por porcentaje, repartiendo el alquiler según el tamaño de cada habitación
  - title: Vigila los saldos
    body: Side Badger lleva un saldo al día para cada moneda, así que puedes ver de un vistazo quién debe a quién. En lugar de dejar que cada uno desenrede una maraña de deudas pequeñas, sugiere una lista corta de pagos que deja saldado al grupo.
    shot: S10
    shotAlt: La pantalla de saldos con las deudas simplificadas en dos monedas y la opción «Mostrar todo» activada
  - title: Salda cuentas fuera de la app y regístralo dentro
    body: Side Badger nunca mueve dinero. Pagaos como queráis y después registra el pago para que los saldos se pongan al día; la pantalla de todos se actualiza sin recargar. «Saldar» solo significa que los saldos llegan a cero. Nadie puede salir de un grupo mientras deba o le deban dinero, así que quien quiera irse salda primero.
    shot: S11
    shotAlt: El formulario de pago con botones de liquidación rápida y el aviso de pago parcial
requirements:
  heading: Lo que necesitas
  items:
    - Una cuenta gratis. Solo hace falta una dirección de correo electrónico y una contraseña, y verificas el correo antes de poder añadir nada.
    - Tener 18 años o más.
    - Un navegador moderno en un móvil o un ordenador, y conexión. Side Badger no es una app de tienda de aplicaciones y no funciona sin conexión.
    - "Opcionalmente, un hueco en tu pantalla de inicio. No hace falta tienda de aplicaciones: inicia sesión y luego añade Side Badger a tu pantalla de inicio o a tu dock y se abre como una app. Los Ajustes de la app te muestran cómo."
