meta:
  title: "그룹 선물 돈을 모으는 방법 | 사이드 배저"
  description: "다들 내는 금액은 제각각이고 카드는 한 사람 것만 긁혀요. 예산 투표를 하고 정확한 금액을 입력하면, 계산은 사이드 배저가 합니다."
h1: "그룹 선물 돈을 모으는 방법"
navLabel: "그룹 선물 돈 모으기"
lead: "그룹 선물 돈을 모은다는 건 한 사람이 먼저 돈을 내고, 나머지가 각자 보태기로 한 만큼 그 사람에게 빚지는 것입니다. 투표로 예산을 정하고, 사는 사람이 선물을 자기 카드로 결제한 다음, 사람마다 금액을 적는 [정확한 금액](page:feature/split-expenses)으로 지출 하나를 입력하세요. 사이드 배저가 누가 산 사람에게 얼마를 줘야 하는지 보여 주고, 각자 원하는 방법으로 자기 몫을 보내면 됩니다."
cta:
  heading: "모자는 빼고 모금은 그대로"
  body: "그룹을 만들고, 선물을 받을 사람은 빼고, 선물은 정확한 금액으로 입력하세요. 사이드 배저는 무료이며 광고도 일일 한도도 없습니다. 먼저 둘러보고 싶다면 [사용 방법](page:how-it-works) 또는 [무료로 쓸 수 있는 범위](page:pricing)를 확인하세요."
sections:
  - heading: "친구 넷, 레코드플레이어 하나, 제각각인 금액 넷"
    body: "Bea는 30번째 생일을 맞아 레코드플레이어를 갖고 싶어 합니다. Priya, Omar, Lena, Sam이 선물하기로 했어요. Priya가 £240짜리를 찾아서 자기 카드로 삽니다. 누군가는 먼저 내야 하니까요. 네 사람이 똑같이 내는 건 아닙니다. Priya와 Omar는 각각 £60를, Lena는 £80를, Sam은 £40를 보탭니다. 아무도 자기 금액을 설명하지 않고, 아무도 묻지 않아요. Omar는 축하 카드와 포장지도 £12에 삽니다. 카드에는 네 명이 모두 서명하니, 이건 똑같이 나눕니다."
  - heading: "구매 버튼을 누르기 전에 예산부터 정하세요"
    body: "예산 투표로 £400짜리 턴테이블 때문에 벌어질 말다툼을 줄일 수 있어요. 그룹에서 **투표 추가**를 선택하고 선물 가격을 얼마로 할지 물어보세요. 선택지는 £150 이하, £200 이하, £250 이하처럼 금액으로 만드세요. **익명 투표**를 켜면 누가 무엇에 투표했는지 가려지므로, 더 작은 금액을 소리 내어 변호하지 않아도 됩니다. 첫 표가 들어오면 설정을 바꿀 수 없으니 먼저 확인하세요. 투표는 저절로 닫히지 않습니다. 모두 투표했으면 **투표 종료**를 선택하세요. 그러면 **우승**이 표시됩니다. 투표는 총액을 정할 뿐, 누구의 몫도 정하지 않습니다."
  - heading: "계산 읽기"
    body: "선물은 네 몫(£60, £60, £80, £40)으로 나뉘고, 합하면 영수증의 £240입니다. 축하 카드와 포장지는 네 명이 1인당 £3씩 나눕니다. Priya의 몫은 £60 + £3, 즉 £63이고 £240를 결제했으니 £177를 받을 돈이 있습니다. Omar의 몫도 £63이지만 £12를 결제했으니 £51를 줘야 합니다. Lena는 £80 + £3, 즉 £83를 줘야 하고, Sam은 £40 + £3, 즉 £43를 줘야 합니다. 이 세 금액을 합치면 Priya가 받을 £177입니다. 그대로 두면 빚이 그룹 안에서 다섯 갈래로 오갑니다. 사이드 배저는 대신 결제 3건을 제안하며, 모두 Priya에게 갑니다. 자세한 내용은 [정산하기](page:feature/settle-up)에서 확인하세요."
  - heading: "사이드 배저에 입력하기"
    body: "Priya가 할 일은 5분 정도면 됩니다."
    items:
      - "**그룹 만들기.** 대시보드에서 **그룹 만들기**를 선택하세요. **다른 사람 초대**를 선택하고, 돈을 보탤 사람들에게만 링크나 QR 코드를 보내세요. 다른 사람에게는 보내지 마세요."
      - "**선물 추가하기.** **비용 추가**를 선택하고 설명을 쓴 다음 240을 입력하고, **누가 지불했나요?**에서 Priya를 고르세요. **분할 대상**에는 네 사람 모두를 두고, **분할 방법**에서 **정확한 금액**을 선택해 60, 60, 80, 40을 입력합니다. 금액의 합은 240이어야 해요. 원하면 주문 확인서를 첨부하세요. **비용 저장**을 선택합니다."
      - "**축하 카드 추가하기.** Omar가 직접 £12를 추가하고, **누가 지불했나요?**에서 자신을 고르고, **분할 방법**은 **균등**으로 두며 네 사람 모두를 체크해 둡니다."
      - "**계산하고, 지불하기.** 모두 누가 누구에게 빚졌는지 보여 주는 **잔액**을 확인하고, 자기 몫을 원하는 방법으로 Priya에게 보내세요. 그런 다음 **정산하기**와 **정산 기록**으로 기록합니다. 빠른 정산이 금액을 채워 줍니다."
  - heading: "먼저 사기, 먼저 모으기"
    body: "사이드 배저는 모아 둔 돈을 맡아 두지 않으므로, 여기서 “모으기”는 사실 “세기”입니다. 순서는 두 가지가 가능해요."
    items:
      - "**먼저 사기.** 산 사람이 결제하고 실제 가격으로 지출을 추가하면, 모두가 바로 자기 몫을 봅니다. 더 깔끔하지만 사람들이 낼 때까지 산 사람이 비용을 떠안으니, 감당할 수 있는 사람이 사세요."
      - "**먼저 모으기.** 구매 전에 사람들이 자기 금액을 산 사람에게 보냅니다. 가격이 정해지면 선물을 입력한 다음, 돈이 실제로 오간 날짜로 결제를 하나씩 기록하세요. 선물을 먼저 추가해야 결제마다 반영될 잔액이 있습니다."
      - "**가격이 바뀌면.** 배송비, 할인 코드, 뒤늦은 가격 인상 같은 일이 생길 수 있어요. 선물을 수정해서 정확한 금액의 합이 맞도록 바꾸세요. 이전 버전은 보관되지만, 잔액이 바뀌므로 먼저 그룹에 알리세요."
  - heading: "Bea는 빼세요"
    body: "그룹은 멤버만 볼 수 있으므로, Bea는 자신이 속하지 않은 그룹을 볼 수 없습니다. 돈을 보탤 사람들만 초대하세요. 링크는 만료될 때까지 작동하고 만료 시간은 15분부터 5일까지 고를 수 있으니, 짧게 정하고 Bea가 보지 않을 곳으로 보내세요. 링크를 여는 사람에게는 그룹 미리보기가 보이므로, 그룹 이름은 “토요일 회비”처럼 따분하게 짓고 지출 이름과 투표 선택지에도 Bea의 이름을 쓰지 마세요."
  - heading: "사이드 배저가 하지 않는 일"
    items:
      - "모금한 돈을 맡거나 걷어 주지 않습니다. 보탠 돈은 계좌 이체, 현금 등 쓰는 방법으로 산 사람에게 가고, 그다음 누군가 기록합니다."
      - "결제 알림을 보내지 않습니다. 아직 안 낸 사람을 슬쩍 재촉하는 일은 여전히 사람이 해야 해요."
      - "누구의 몫도 계산해 주지 않습니다. 투표는 예산을 정할 뿐이고 “남은 금액 나누기” 옵션도 없으므로, 금액은 직접 입력합니다."
      - "지출 하나에는 결제한 사람이 한 명입니다. 두 사람이 선물의 서로 다른 부분을 샀다면 지출을 두 건 입력하세요."
      - "분할에 포함되는 모든 사람은 무료 계정이 있어야 하고 그룹의 멤버여야 합니다."
exampleAfter: 2
example:
  heading: "Bea의 레코드플레이어와 카드"
  currency: GBP
  people:
    - id: priya
      name: Priya
    - id: omar
      name: Omar
    - id: lena
      name: Lena
    - id: sam
      name: Sam
  expenses:
    - label: "선물"
      payer: priya
      amount: 240
      split:
        method: exact
        shares:
          priya: 60
          omar: 60
          lena: 80
          sam: 40
    - label: "축하 카드와 포장지"
      payer: omar
      amount: 12
      split:
        method: equal
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "모은 돈이 선물 값보다 많으면요?"
      a: "정확한 금액의 합이 가격과 같아야 하니, 맞을 때까지 몫을 줄이세요. 아니면 남는 돈을 꽃처럼 실제로 쓸 데에 쓰고, 예시의 축하 카드와 포장지처럼 두 번째 지출로 입력하세요."
    - q: "그룹에 들어오지 않고 돈을 보탤 수 있나요?"
      a: "계산에 포함하고 싶다면 안 됩니다. 분할에 포함되는 모든 사람은 무료 계정이 있어야 하고 그룹에 있어야 해요. 현금밖에 없는 사람이라면 Priya가 그 돈을 받고, 그룹이 아직 내야 할 금액만큼으로 선물을 입력할 수 있습니다. 예를 들어 Sam이 현금으로 £40를 줬다면, Priya는 선물을 £200로 입력하고 자신, Omar, Lena가 60, 60, 80으로 나누면 됩니다."
    - q: "투표로 각자 얼마 낼지도 정할 수 있나요?"
      a: "아니요. 투표는 예산처럼 그룹 전체의 금액 하나를 정합니다. 각자의 몫은 여러분끼리 합의한 다음, 지출에 **정확한 금액**으로 입력하세요."
