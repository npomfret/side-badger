meta:
  title: "Ce que Side Badger fait, et ce qu'il ne fait pas"
  description: "Partager, régler les comptes et gérer plusieurs devises, plus les groupes, les listes et les sondages. Tout le kit, et une liste honnête de ce que Side Badger laisse de côté."
h1: "Ce que fait Side Badger"
navLabel: "Fonctionnalités"
lead: "Tout ce qu'il y a dans la boîte, et ce qui n'y est pas."
intro: "Voici le kit complet. Nous avons volontairement laissé le tableur de côté. Commencez par les trois tâches que Side Badger accomplit chaque jour, puis parcourez le reste de la liste et la courte liste de ce qu'il ne fait pas."
cta:
  heading: "Est-ce que ça fait ce dont votre groupe a besoin ?"
  body: "Créez un compte gratuit et essayez d'abord avec un petit groupe."
  button: "Créer un compte gratuit"
cardsHeading: "Les trois tâches, en détail"
sections:
  - heading: "Scan de reçus"
    body: "Photographiez le reçu et Side Badger remplit le total, la date et le lieu pour que vous les vérifiiez. Les images de reçus sont lues par le service d'IA de Google."
  - heading: "Groupes et permissions"
    body: "Faites un groupe par maison, voyage ou événement, avec jusqu'à 50 personnes. Invitez des personnes avec un lien ou un code QR. Dans un groupe plus grand, donnez à quelqu'un le rôle de lecteur : il voit tout et ne change rien."
  - heading: "Listes et sondages"
    body: "Gardez la liste de courses partagée à côté des factures de courses. Soumettez la sélection de villas à un vote, anonymement si vous le souhaitez."
  - heading: "Tout le reste"
    items:
      - "**Mises à jour en direct :** ajoutez une dépense et tout le monde la voit tout de suite."
      - "**Langues :** utilisez Side Badger en 39 langues. Chaque membre du groupe peut choisir la sienne."
      - "**Écran d'accueil :** pas besoin de boutique d'applications. Ajoutez Side Badger à votre écran d'accueil et il s'ouvre comme une appli."
      - "**Retours :** vous avez trouvé un bug ? Dites-le-nous depuis l'appli et lisez notre réponse sur place."
  - heading: "Ce que Side Badger ne fait pas"
    items:
      - "**Faire circuler l'argent.** Side Badger ne touche jamais à votre argent. Remboursez-vous comme vous voulez. Les demandes de paiement sont prévues."
      - "**Répéter les factures.** Il n'y a pas de dépenses récurrentes. Copiez la facture du mois dernier en deux touches."
      - "**Partager par article.** Un seul payeur par dépense. Partagez à parts égales, par montants exacts ou par pourcentage."
      - "**Proposer une appli native.** Il fonctionne dans votre navigateur. Ajoutez-le à votre écran d'accueil."
      - "**Fonctionner hors connexion.** Il faut une connexion."
      - "**Envoyer des alertes par e-mail ou SMS.** Les notifications apparaissent dans l'appli. Les notifications push sont prévues."
      - "**Dessiner des graphiques ou des budgets.** Il tient le compte de qui doit quoi à qui, et c'est tout le tour de magie."
      - "**Se connecter avec Google ou Apple.** Inscrivez-vous avec une adresse e-mail. La connexion Google et Apple est prévue."
      - "**Laisser entrer sans compte.** Chaque membre du groupe a besoin d'un compte gratuit."
faq:
  heading: Questions
  items:
    - q: "Puis-je payer via Side Badger ?"
      a: "Non. Side Badger tient le compte et ne touche jamais à votre argent. Remboursez-vous comme vous voulez, puis enregistrez le paiement."
    - q: "Y a-t-il une appli mobile ?"
      a: "Pas dans une boutique d'applications. Side Badger fonctionne dans votre navigateur, et vous pouvez l'ajouter à votre écran d'accueil pour qu'il s'ouvre comme une appli."
    - q: "Puis-je partager par article ?"
      a: "Non. Chaque dépense a un seul payeur, et vous la partagez à parts égales, par montants exacts ou par pourcentage."
    - q: "Fonctionne-t-il hors connexion ?"
      a: "Non, il faut une connexion."
    - q: "Chaque membre du groupe a-t-il besoin d'un compte ?"
      a: "Oui. Chaque membre du groupe a besoin d'un compte gratuit, et il suffit d'une adresse e-mail pour s'inscrire."
