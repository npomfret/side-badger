meta:
  title: "Έξοδα με σύντροφο: 50/50 ή ανάλογα με το εισόδημα | Side Badger"
  description: "Μοιραστείτε τα βαρετά έξοδα χωρίς να κάνετε το ραντεβού τριμηνιαίο οικονομικό απολογισμό. Χωρίστε 50/50, ανάλογα με το εισόδημα ή ανά λογαριασμό. Δωρεάν."
h1: "Μοιραστείτε τα έξοδα ως ζευγάρι, δίκαια"
navLabel: "Ζευγάρια"
lead: "Μοιραστείτε τα βαρετά έξοδα χωρίς να κάνετε το ραντεβού τριμηνιαίο οικονομικό απολογισμό. Το Side Badger κρατά έναν τρέχοντα λογαριασμό για το ενοίκιο, τους λογαριασμούς και τα ψώνια για **ζευγάρια** που μοιράζονται ένα σπίτι, έναν καναπέ και μια θολή ανάμνηση για το ποιος πλήρωσε το ίντερνετ. Χωρίστε το 50/50, ανάλογα με το εισόδημα ή ανά λογαριασμό, και δείτε ποιος χρωστά σε ποιον."
cta:
  heading: "Ξεκινήστε μια ομάδα για δύο"
  body: "Δημιουργήστε λογαριασμό, φτιάξτε μια ομάδα και στείλτε στον σύντροφό σας τον σύνδεσμο πρόσκλησης. Το φαγητό που θα πάρετε απόψε από έξω μπορεί να είναι το πρώτο έξοδο."
scenario:
  heading: "Δίκαιο δεν σημαίνει απαραίτητα 50/50"
  body: "Ο Σαμ και η Άλεξ μοιράζονται ένα σπίτι. Ο Σαμ κερδίζει περισσότερα, οπότε συμφώνησαν ότι ο Σαμ αναλαμβάνει το 60% του ενοικίου και η Άλεξ το 40%. Ο Σαμ πληρώνει τον ιδιοκτήτη, η Άλεξ κάνει τα ψώνια και οι δύο είναι σχεδόν σίγουροι ότι τελικά βγαίνουν ίσα. Το «σχεδόν σίγουροι» είναι ο τρόπος που μια σημείωση στο κινητό κάποιου γίνεται χρόνια διαφωνία. Φτιάξτε λοιπόν μια ομάδα για τους δυο σας, διαλέξτε το όνομα που θέλετε να βλέπει ο σύντροφός σας και στείλτε του τον σύνδεσμο πρόσκλησης ή τον κωδικό QR. Προσθέτετε κάθε έξοδο όταν προκύπτει, λέτε ποιος πλήρωσε και πώς χωρίζεται και αφήνετε την ομάδα να κρατά τον λογαριασμό. Φτιάξτε ξεχωριστή ομάδα για κάθε διακοπές (δείτε τα [ομαδικά ταξίδια](page:use-case/group-trips)), ώστε οι πτήσεις να μένουν έξω από τα ψώνια."
sections:
  - heading: "50/50, ανάλογα με το εισόδημα ή ανά λογαριασμό"
    body: "Δεν υπάρχει καθολικά δίκαιος διαχωρισμός, μόνο αυτός που συμφωνείτε και οι δύο, κατά προτίμηση πριν από τον πρώτο λογαριασμό και όχι μετά τον πρώτο αναστεναγμό. Αυτοί είναι οι τρεις συνηθισμένοι."
    items:
      - "**50/50.** Διαλέξτε **Εξίσου** και ο καθένας σας χρωστά το μισό. Ταιριάζει στα κοινά έξοδα όταν τα εισοδήματά σας είναι κοντά και δεν χρειάζεται καθόλου αριθμητική."
      - "**Ανάλογα με το εισόδημα.** Αν ο ένας σας κερδίζει περισσότερα, χωρίστε ανάλογα με το μερίδιο του καθενός στα χρήματα που μπαίνουν. Συμφωνήστε πρώτα τι μετράει (οι καθαρές αποδοχές είναι η συνηθισμένη επιλογή), προσθέστε τα δύο ποσά και διαιρέστε το δικό σας με το σύνολο. Αν ο ένας φέρνει σπίτι τρία μέρη και ο άλλος δύο, αυτό είναι 3 ÷ (3 + 2) = 60%, οπότε ο ένας σας καλύπτει το 60% και ο άλλος το 40%. Στρογγυλοποιήστε σε ακέραια ποσοστά και εισαγάγετέ τα στην επιλογή **Ποσοστό**, όπου πρέπει να κάνουν συνολικά 100. Δεν υπάρχει πεδίο όπου να βάλετε τις αποδοχές σας, οπότε πληκτρολογείτε πάντα μόνο τα ποσοστά."
      - "**Ανά λογαριασμό.** Κάθε έξοδο έχει τον δικό του διαχωρισμό, οπότε μπορείτε να τα συνδυάσετε: ενοίκιο ανάλογα με το εισόδημα, ψώνια 50/50 και ένα κοινό δώρο με **Ακριβή ποσά** αν ο καθένας σας διάλεξε πόσα θα βάλει."
      - "**Όταν αλλάζουν οι αποδοχές,** χρησιμοποιήστε τα νέα ποσοστά από το επόμενο έξοδο. Τα προηγούμενα έξοδα κρατούν τον διαχωρισμό με τον οποίο καταχωρίστηκαν. Για να δείτε τις πράξεις με πραγματικά εκκαθαριστικά αποδοχών, διαβάστε [πώς να χωρίσετε λογαριασμούς με σύντροφο που κερδίζει περισσότερα](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "Ο μηνιαίος απολογισμός"
    body: "Μία φορά τον μήνα, ή όποτε οι αριθμοί αρχίσουν να σας φαγουρίζουν, ανοίξτε την ομάδα και ελέγξτε τα **Υπόλοιπα**. Με δύο άτομα υπάρχει πάντα μόνο μία πληρωμή σε κάθε νόμισμα, από όποιον χρωστά σε όποιον του οφείλεται. Πάρτε για παράδειγμα τον μήνα του Σαμ και της Άλεξ. Ο Σαμ πλήρωσε το ενοίκιο των 1.500 £ και το 40% της Άλεξ είναι 600 £. Η Άλεξ πλήρωσε 90 £ για ψώνια, χωρισμένα εξίσου, οπότε το μισό του Σαμ είναι 45 £. Το Side Badger συμψηφίζει το ένα με το άλλο, 600 £ μείον 45 £, και η Άλεξ πληρώνει στον Σαμ 555 £. Πληρώστε το όπως θέλετε, με τραπεζική μεταφορά, με μετρητά ή με μια χάρη που σας χρωστούν, και μετά καταγράψτε το στην **Τακτοποίηση** ώστε το υπόλοιπο να επιστρέψει στο μηδέν. Δεν υπάρχουν επαναλαμβανόμενοι λογαριασμοί, οπότε αντιγράψτε το ενοίκιο του προηγούμενου μήνα, αλλάξτε την ημερομηνία και συνεχίστε. Το Side Badger δεν μετακινεί τα χρήματα ούτε στέλνει υπενθυμίσεις, οπότε το σκούντημα μένει δικό σας."
  - heading: "Μόνο οι δυο σας"
    body: "Μια ομάδα δύο ατόμων έχει δύο μέλη και μόνο τα μέλη μιας ομάδας μπορούν να τη δουν. Ο σύντροφός σας μπαίνει με τον σύνδεσμο πρόσκλησης ή τον κωδικό QR. Ένας σύνδεσμος μπορεί να διαρκεί από 15 λεπτά έως 5 ημέρες, οπότε διαλέξτε τη συντομότερη διάρκεια που αφήνει στον σύντροφό σας χρόνο να τον χρησιμοποιήσει. Η δημιουργία νέου συνδέσμου δεν ακυρώνει τους παλιούς, οπότε μην τους αφήνετε σε μια συνομιλία όπου συμμετέχουν και άλλα άτομα. Όποιος χρησιμοποιήσει έναν ενεργό σύνδεσμο μπορεί να μπει, οπότε αν θέλετε να είστε βέβαιοι, ενεργοποιήστε την έγκριση και ένας διαχειριστής αφήνει να μπει κάθε άτομο. Ο σύντροφός σας χρειάζεται δικό του λογαριασμό, που είναι δωρεάν."
exampleAfter: 2
