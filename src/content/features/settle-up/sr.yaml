meta:
  title: "Поравнај се са мање уплата | Side Badger"
  description: "Погледај ко у твојој групи коме дугује, добиј кратак списак уплата који поравнава све и бележи сваку уплату кад се деси. Бесплатно."
h1: "Поравнај се са мање уплата"
navLabel: "Поравнање"
lead: "Side Badger води текуће стање за свакога у групи и предлаже кратак списак уплата који га поравнава. Платите једни другима како год желите, а затим то забележите. Ако прво желиш да видиш како се износи деле, почни са [поделом трошкова](page:feature/split-expenses)."
cta:
  heading: "Спремни да размрсите ко коме дугује?"
  body: "Направи кориснички налог, оснуј групу и додај први трошак. Стања ће преузети остало."
problem:
  heading: "Стања која се ажурирају успут"
  body: "Сваки трошак мења ко коме дугује, па Side Badger одржава стања актуелним како се додају трошкови и уплате. Сви у групи виде промену одмах, као и шта се променило и ко је то променио. Стања се воде по валутама, па евра и фунте остају у својим колонама, осим ако је трошак претворен при уносу. Подразумевано видиш дугове који се тичу тебе; **Прикажи све** исписује целу групу."
workflow:
  heading: "Три корака до квита"
  steps:
    - title: "Погледај ко коме дугује"
      body: "Отвори стања групе да видиш шта дугујеш, шта ти дугују и кратак списак уплата који поравнава све, израчунат посебно за сваку валуту. Трошкови доведени у питање остају ван збирова док се не реше. У примеру са цимерима испод шест уплата постаје две."
      shot: S10
      shotAlt: "Екран стања са поједностављеним дуговима у две валуте и укљученом опцијом Прикажи све"
    - title: "Плати како год желиш, а затим забележи"
      body: "Банковни трансфер, готовина, услуга из прошлог одмора. Side Badger не премешта новац. Кад новац промени власника, забележи уплату и стање се ажурира за све."
      shot: S11
      shotAlt: "Образац уплате са дугмадима за брзо поравнање и обавештењем приказаним за делимичну уплату"
    - title: "Провери да ли је стигло"
      body: "Уплата иде у историју групе, где је може видети свако у групи и реаговати емоџијем. Прослави уплату кад стигне."
      shot: S12
      shotAlt: "Историја уплата са реакцијама емоџијима на уплату"
