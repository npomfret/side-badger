sections:
  - heading: "అంకెల పక్కనే కామెంట్లు, రియాక్షన్లు"
    body: "ప్రతి ఖర్చుకు సొంత కామెంట్ థ్రెడ్ ఉంది, గ్రూప్‌కు, ప్రతి జాబితాకు, ప్రతి పోల్‌కు కూడా. ఎవరూ వెనక్కి స్క్రోల్ చేయని చాట్‌లో కాకుండా, టాక్సీ ఖర్చు కింద టాక్సీ ఎందుకంత అయిందో అడగండి. రసీదు ఫోటోను లేదా బుకింగ్ PDFను జోడించండి, తర్వాత ఖర్చులు, పేమెంట్లు, కామెంట్లపై థంబ్స్ అప్, హార్ట్, నవ్వు, వావ్, బాధ లేదా సంబరంతో రియాక్ట్ అవ్వండి. పేమెంట్ చేరినప్పుడు సంబరం చేసుకోండి. చప్పట్లకు Side Badger ఇవ్వగలిగిన అత్యంత దగ్గరి విషయం అదే."
  - heading: "గొడవ లేకుండా ఖర్చును ప్రశ్నించండి"
    body: "గ్రూప్ ఖర్చు ప్రశ్నలను ఆన్ చేసి ఉన్నప్పుడు, ఒక ఖర్చులో ఉన్న ఎవరైనా **నాకు ఒక ప్రశ్న ఉంది** ఎంచుకుని కారణం చెప్పవచ్చు. ప్రశ్న ఆ ఖర్చుపై కామెంట్‌గా పోస్ట్ అవుతుంది, ఖర్చుకు **ప్రశ్నించబడింది** బ్యాడ్జ్ వస్తుంది, ప్రశ్న తేలే వరకు ఆ మొత్తం ఖర్చు ప్రతి ఒక్కరి బ్యాలెన్స్‌ల నుండి బయటకు వెళ్తుంది."
    items:
      - "**ఆన్ చేయడం.** ఇది డిఫాల్ట్‌గా ఆఫ్‌లో ఉంటుంది. అడ్మిన్ గ్రూప్ సెట్టింగ్‌లలో **లక్షణాలు** కింద **ఖర్చు ప్రశ్నలను అనుమతించండి**ని ఆన్ చేస్తారు."
      - "**మూసివేయడం.** అడిగిన వ్యక్తి, లేదా అడ్మిన్, **ప్రశ్నను మూసివేయండి** ఎంచుకుంటారు. అదే ఖర్చును చాలామంది ప్రశ్నిస్తే, చివరి ప్రశ్న మూసివేసినప్పుడు అది మళ్లీ బ్యాలెన్స్‌లలోకి వెళ్తుంది."
      - "**సవరించడం.** ఒక ఖర్చును సవరించినప్పుడు, తెరిచి ఉన్న ప్రశ్న ఇంకా దానిలో వాటా ఉన్న ప్రతి ఒక్కరికి కొత్త వెర్షన్‌కు కొనసాగుతుంది. సవరణ ఎవరినైనా బయటకు పంపితే, వాళ్ల ప్రశ్న పాత వెర్షన్‌తోనే ముగుస్తుంది, కాబట్టి వాళ్లు మూసివేయడానికి ఏమీ మిగలదు."
      - "**వాటిని కనుగొనడం.** ఖర్చుల జాబితాలో **ప్రశ్నించబడినవి మాత్రమే** ఫిల్టర్ ఉంది. ఇది ఆమోద దశ కాదు: ఎవరైనా ప్రశ్నించిన ఖర్చులు మాత్రమే ఆగుతాయి, మిగతావన్నీ జోడించిన వెంటనే లెక్కలోకి వస్తాయి."
  - heading: "ఒక ప్రశ్న ఎలా సాగుతుంది"
    body: "Tom £45 పార్టీ వైన్‌ను ముగ్గురు రూమ్‌మేట్ల మధ్య పంచి జోడిస్తాడు. Aisha తాగలేదు, కాబట్టి ఆమె ప్రశ్న లేవనెత్తుతుంది, అది తెరిచి ఉన్నంతసేపు వైన్ ఎవరి లెక్కలోనూ ఉండదు. వైన్ Tom, Priyaలదే అని ఇల్లు ఒప్పుకుంటుంది, కాబట్టి Tom పంపకాన్ని ఇద్దరికే మారుస్తాడు. Aisha ఇక ఖర్చులో లేదు, కాబట్టి ఆమె ప్రశ్న ముందటి వెర్షన్‌తో ముగుస్తుంది, ఆ వెర్షన్ ఉంచబడుతుంది, వైన్ ఒక్కొక్కరికి £15కు బదులు £22.50తో వెంటనే బ్యాలెన్స్‌లలోకి తిరిగి చేరుతుంది. Aisha ఖర్చులోనే ఉండి ఉంటే, ఆమె ప్రశ్న కొనసాగి, ఆమె లేదా అడ్మిన్ మూసివేసే వరకు వేచి ఉండేది. కింద, Aisha యొక్క £48 అంటే సరుకుల £28, క్లీనర్ £20, Priya యొక్క £10.50 అంటే ఆమె £70.50 వాటా (£28, £20, £22.50) నుండి ఆమె చెల్లించిన £60 తీసివేయగా వచ్చినది. చాలా [రూమ్‌మేట్ల](page:use-case/housemates) తరహా వాదన. ప్రశ్నను ఎలా రాయాలో [ఉమ్మడి ఖర్చుపై ఎవరైనా అభ్యంతరం చెబితే ఏం చేయాలి](page:guide/what-to-do-when-someone-disputes-a-shared-expense) చూడండి."
  - heading: "ఉమ్మడి జాబితాలు, సరుకుల కోసం"
    body: "గ్రూప్‌లో జాబితా మొదలుపెట్టండి, దానికి సరుకుల జాబితా లాంటి పేరు పెట్టండి, వస్తువులు జోడించండి, టిక్ చేయండి. వస్తువులను మెరుగైన క్రమంలోకి లాగండి, పురోగతి లెక్క పెరగడం చూడండి, ఎవరైనా తప్పు ఓట్ మిల్క్ కొన్నప్పుడు జాబితాపై కామెంట్ చేయండి. పూర్తయిన జాబితాను ఆర్కైవ్ చేసి పక్కన పెట్టండి (**ఆర్కైవ్ చేసినవి చూపించు** దాన్ని తిరిగి తెస్తుంది), లేదా మళ్లీ వాడటానికి జాబితాను కాపీ చేయండి. ఉమ్మడి సరుకుల జాబితాను షాపింగ్ బిల్లుల పక్కనే ఉంచండి, అప్పుడు జాబితా ఏం కొనాలో చెబుతుంది, ఖర్చు దాని ధర చెబుతుంది. జాబితాలను ఎవరు సృష్టించవచ్చో, సవరించవచ్చో గ్రూప్ అనుమతులపై ఆధారపడి ఉంటుంది, దాన్ని [గ్రూప్‌లు, అనుమతులు](page:feature/groups-and-permissions) వివరిస్తుంది."
  - heading: "పోల్స్, మీకు కావాలంటే అనామకంగా"
    body: "బిల్లును నిర్ణయించే విషయం గురించి గ్రూప్‌ను అడగండి, ఏ విల్లా, బహుమతికి ఎంత ఖర్చు చేయాలి, లేదా బోట్ ట్రిప్ విలువైనదేనా లాంటివి. పోల్‌కు ఒక ప్రశ్న, రెండు నుండి పది ఎంపికలు ఉంటాయి. ప్రతి వ్యక్తికి ఎన్ని ఓట్లో, ఒక్క ఎంపిక నుండి పది వరకు, ఓటింగ్ అనామకమా కాదా అని మీరు ఎంచుకుంటారు. **అనామక ఓటింగ్** ఎవరు దేనికి ఓటు వేశారో దాస్తుంది, మొదటి ఓటు పడ్డాక దాన్ని మార్చలేరు. పోల్ ముగిసే వరకు ప్రజలు తమ ఓటును మార్చవచ్చు లేదా తీసివేయవచ్చు, గ్రూప్ మనసు మార్చుకుంటే పోల్‌ను మళ్లీ తెరవవచ్చు. విల్లాను ఎంచుకోవడమే [గ్రూప్ ట్రిప్‌ల](page:use-case/group-trips) సారాంశం, బహుమతి బడ్జెట్‌ను ఒప్పుకోవడం [వేడుకల](page:use-case/events-and-celebrations) పాత కథ."
  - heading: "యాక్టివిటీ ఫీడ్, ఏదీ చప్పుడు లేకుండా మారకుండా"
    body: "ప్రతి గ్రూప్‌కు యాక్టివిటీ చరిత్ర ఉంటుంది, నోటిఫికేషన్ల బెల్ మీ అన్ని గ్రూప్‌ల కార్యకలాపాలను ఒకే చోట చూపుతుంది. ఖర్చు జోడించండి, రిఫ్రెష్ చేయకుండానే అందరికీ వెంటనే కనిపిస్తుంది, ఏం మారిందో, ఎవరు మార్చారో ఫీడ్ చూపుతుంది. ఖర్చులు జోడించడం, సవరించడం, తొలగించడం, ప్రశ్నలు లేవనెత్తడం, మూసివేయడం, కామెంట్లు, జాబితా, పోల్ మార్పులు, రికార్డ్ చేసిన పేమెంట్లు అన్నీ అందులో ఉంటాయి."
  - heading: "పుష్ నోటిఫికేషన్లు, మీకు కావాలంటే"
    body: "పుష్ నోటిఫికేషన్లు ఐచ్ఛికం. మీ ఖాతా **సెట్టింగ్‌లు**లో **నోటిఫికేషన్లు** కింద వాటిని ఆన్ చేయండి, మీ గ్రూప్‌లలో కొత్త ఖర్చు లేదా కామెంట్ లాంటి కొత్త కార్యకలాపం ఉన్నప్పుడు మీ పరికరం మీకు తెలియజేస్తుంది. ప్రతి పరికరాన్ని విడిగా ఆన్ చేయాలి, ముందు మీ బ్రౌజర్ అనుమతి అడుగుతుంది. iPhone లేదా iPadలో అవి హోమ్ స్క్రీన్‌కు జోడించిన యాప్‌లో మాత్రమే పనిచేస్తాయి, దాన్ని [వెబ్ యాప్](page:feature/web-app) పేజీ వివరిస్తుంది. వాటిని సౌకర్యంగా చూడండి, వాగ్దానంగా కాదు, ఎందుకంటే చేరడానికి హామీ లేదు."
limits:
  heading: "పరిమితులు"
  items:
    - "కామెంట్లు, జాబితాలు, పోల్స్ గ్రూప్ డబ్బు కోసం. పోస్ట్ చేసే ప్రతిదీ గ్రూప్ ఆర్థిక విషయాలకు సంబంధించి ఉండాలని [నిబంధనలు](page:terms) కోరుతాయి, కాబట్టి ఇది ఖర్చును ప్లాన్ చేసే చోటు, సాధారణ చాట్ లేదా చేయవలసిన పనుల యాప్ కాదు."
    - "కామెంట్ 500 అక్షరాల వరకు ఉండవచ్చు, ఒక్కొక్కటి 5 MB వరకు ఉన్న మూడు చిత్రాలు లేదా PDFల అటాచ్‌మెంట్లు ఉండవచ్చు. కామెంట్‌ను దాని రచయిత మాత్రమే తొలగించగలరు."
    - "ఖర్చు ప్రశ్నలు డిఫాల్ట్‌గా ఆఫ్‌లో ఉంటాయి, ప్రతి గ్రూప్‌కు అడ్మిన్ ఆన్ చేస్తారు. ఖర్చులో ఉన్నవాళ్లు మాత్రమే దాన్ని ప్రశ్నించగలరు, ఫీచర్‌ను ఆఫ్ చేస్తే తెరిచి ఉన్న ప్రతి ప్రశ్న తొలగిపోతుంది, తాము భాగమైన ఖర్చుకు తెరిచి ఉన్న ప్రశ్న ఉన్నంతసేపు ఎవరూ గ్రూప్ వదలలేరు."
    - "ఒక గ్రూప్‌లో 100 జాబితాల వరకు ఉండవచ్చు, ఒక్కొక్కదానిలో 500 అక్షరాల వరకు ఉన్న 200 వస్తువులు ఉండవచ్చు. జాబితాలను ఎవరు సృష్టించవచ్చో, సవరించవచ్చో, తొలగించవచ్చో గ్రూప్ అనుమతులు నిర్ణయిస్తాయి, లాక్ చేసిన గ్రూప్‌లో మార్పులు అనుమతించబడవు."
    - "ఒక గ్రూప్‌లో 50 పోల్స్ వరకు ఉండవచ్చు, ఒక్కొక్కదానిలో రెండు నుండి పది ఎంపికలు, ప్రతి వ్యక్తికి పది ఓట్ల వరకు ఉండవచ్చు. పోల్స్‌కు గడువు లేదు, అవి వాటంతట అవే ముగియవు."
    - "యాక్టివిటీ చరిత్ర 90 రోజులు ఉంచబడుతుంది."
    - "పుష్ నోటిఫికేషన్లు ప్రతి ఖాతాకు, ప్రతి పరికరానికి ఎంచుకుంటేనే. వాటికి వాటిని సపోర్ట్ చేసే బ్రౌజర్, మీ అనుమతి కావాలి, iPhone, iPadలో అవి హోమ్ స్క్రీన్‌కు జోడించిన యాప్ నుండి మాత్రమే పనిచేస్తాయి, చేరడానికి హామీ లేదు. కార్యకలాపానికి ఇమెయిల్ లేదా టెక్స్ట్ అలర్ట్‌లు లేవు, పేమెంట్ రిమైండర్‌లు లేవు, కాబట్టి పేమెంట్ కోసం వెంటపడడం ఇంకా మీ పనే."
useCasesHeading: "కలిసి ప్లాన్ చేయడం ఎక్కడ ఉపయోగపడుతుంది"
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "ఓట్లు అనామకంగా ఉండవచ్చా?"
      a: "అవును. పోల్ సృష్టించేటప్పుడు **అనామక ఓటింగ్**ను ఆన్ చేయండి, ఎవరు దేనికి ఓటు వేశారో అది దాస్తుంది. మొదటి ఓటుకు ముందే నిర్ణయించండి, తర్వాత మార్చలేరు."
    - q: "పోల్ తనంతట తానే ముగియగలదా?"
      a: "లేదు. పోల్‌కు గడువు లేదు, కాబట్టి గ్రూప్ నిర్ణయించాక దాన్ని సృష్టించిన వ్యక్తి **పోల్‌ను ముగించు** ఎంచుకుంటారు. గ్రూప్ మనసు మార్చుకుంటే, **పోల్‌ను మళ్ళీ తెరువు** దాన్ని తిరిగి తెస్తుంది."
    - q: "ఒక జాబితాలో ఎన్ని వస్తువులు ఉండవచ్చు?"
      a: "ఒక్కో జాబితాలో 200 వస్తువుల వరకు, ఒక్కో గ్రూప్‌లో 100 జాబితాల వరకు. ప్రతి వస్తువు 500 అక్షరాల వరకు ఉండవచ్చు, అంటే చాలా ఓట్ మిల్క్."
    - q: "ప్రశ్నను ఎవరు మూసివేయగలరు, అంతవరకు ఖర్చుకు ఏమవుతుంది?"
      a: "అడిగిన వ్యక్తి, లేదా గ్రూప్ అడ్మిన్. ప్రశ్న తెరిచి ఉన్నంతసేపు ఆ మొత్తం ఖర్చు ప్రతి ఒక్కరి బ్యాలెన్స్‌ల నుండి బయట ఉంటుంది. దానిపై తెరిచి ఉన్న చివరి ప్రశ్న మూసివేసినప్పుడు, లేదా సవరణ అడిగిన వ్యక్తిని ఖర్చు నుండి తీసేసినప్పుడు, అది మళ్లీ లోపలికి వెళ్తుంది."
    - q: "జాబితాలను, కామెంట్లను చేయవలసిన పనుల యాప్‌గా లేదా గ్రూప్ చాట్‌గా వాడవచ్చా?"
      a: "లేదు. కామెంట్లు, జాబితాలు, పోల్స్ గ్రూప్ డబ్బు కోసం, [నిబంధనలు](page:terms) కోరేది అదే. సరుకుల జాబితాలు, బడ్జెట్ పోల్స్, “ఈ £45 ఎందుకు?” అని ఆలోచించండి."
    - q: "కార్యకలాపం గురించి Side Badger నాకు ఇమెయిల్ చేస్తుందా?"
      a: "లేదు. కార్యకలాపానికి ఇమెయిల్ లేదా టెక్స్ట్ అలర్ట్‌లు లేవు. ప్రతి పరికరంలో పుష్ నోటిఫికేషన్లను ఆన్ చేయవచ్చు, యాప్‌లోని నోటిఫికేషన్ల బెల్ కొత్తగా ఏముందో చూపుతుంది."
