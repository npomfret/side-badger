featuresHeading: 家で使う機能
faq:
  heading: よくある質問
  items:
    - q: 家賃を自動で繰り返せますか？
      a: いいえ、定期的な請求はありません。先月の家賃を数タップでコピーし、日付を変えれば完了です。
    - q: 部屋の広さで分けられますか？
      a: はい、割合指定で分けられます。部屋に見合った割合を各ルームメイトに割り当ててください。割合の合計は100になる必要があります。ほかの分け方は[割り勘の仕方](page:feature/split-expenses)をご覧ください。
    - q: ルームメイトが借りたまま引っ越す場合は？
      a: 精算するまでグループを退出できません。債務や債権が残っている間は誰も退出できないからです。全員がおあいこになるまで、数字は正直なままです。
    - q: Side Badgerは請求を支払ってくれますか？
      a: いいえ。残高を記録して短い支払いリストを提案するだけです。[精算](page:feature/settle-up)で説明しているように、支払いは好きな方法で行い、そのあと記録します。
    - q: 一人が家計簿を管理できますか？
      a: はい。その人を管理者にして管理グループを使うと、新しいメンバーには承認が必要で、支出を変更できるのは作成者と管理者だけになります。
