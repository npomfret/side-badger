meta:
  title: "Side Badger pour les colocataires, les voyages et les fêtes"
  description: "Partagez les frais entre colocataires, en voyage de groupe, et pour les fêtes, les mariages et les cadeaux collectifs. Découvrez ce que Side Badger fait pour chaque type de groupe."
h1: "Side Badger pour votre type de groupe"
navLabel: "Cas d'usage"
lead: "Colocs, vacances, enterrements de vie. Choisissez votre chaos, puis voyez comment un groupe comme le vôtre tient le compte."
intro: "Chaque groupe partage les frais un peu différemment. Ces pages suivent un **scénario réaliste** de la première dépense au dernier paiement enregistré, calculs à l'appui, pour que vous voyiez ce que donnerait votre propre groupe."
cta:
  heading: "Vous avez trouvé votre type de groupe ?"
  body: "Créez un compte, lancez un groupe et ajoutez la première dépense. Cela prend quelques minutes."
  button: "Créer un compte gratuit"
cardsHeading: "Choisissez la situation la plus proche de la vôtre"
sections:
  - heading: "Voyages en groupe"
    body: "Des vols en livres, une villa en euros et un dîner auquel seules trois personnes ont assisté. Réglez le groupe pour convertir en livres et quatre amis à Lisbonne s'en sortent avec trois paiements, au lieu de six quand les devises restent séparées. [Partager les frais d'un voyage en groupe](page:use-case/group-trips)."
  - heading: "Colocataires"
    body: "Une personne paie le propriétaire, une autre pense à la facture d'énergie, et personne ne sait qui a acheté le papier toilette. Avec le loyer réparti selon la taille des chambres et les autres factures à parts égales, quatre colocataires finissent le mois avec trois paiements, tous pour celui qui a payé le loyer. [Partager les factures du foyer entre colocataires](page:use-case/housemates)."
  - heading: "Fêtes, mariages et cadeaux collectifs"
    body: "Six personnes votent pour le cadeau, une l'achète, et chacun ne participe pas du même montant. Un cadeau de £150 partagé par montants exacts laisse cinq paiements à la personne qui l'a acheté, £120 en tout. [Partager les frais d'un événement](page:use-case/events-and-celebrations)."
  - heading: "Couples"
    body: "Partagez les dépenses ennuyeuses sans transformer la soirée en tête-à-tête en revue financière trimestrielle. Un loyer réparti 60/40 et des courses à parts égales se réduisent à un seul paiement entre vous deux."
  - heading: "Voyez d'abord comment ça marche"
    body: "Tous les exemples ci-dessus suivent les mêmes étapes, de la création d'un groupe à l'enregistrement des paiements. [Comment ça marche](page:how-it-works) les passe en revue, et les [tarifs](page:pricing) disent ce que ça coûte, c'est-à-dire rien, sans publicité et sans limite quotidienne."
faq:
  heading: Questions
  items:
    - q: "Chaque membre du groupe a-t-il besoin d'un compte ?"
      a: "Oui. On rejoint un groupe avec un lien ou un code QR et un compte gratuit."
    - q: "Side Badger peut-il collecter l'argent ?"
      a: "Non. Vous payez comme vous voulez, puis vous enregistrez le paiement pour que les soldes restent justes."
    - q: "Dois-je choisir un seul type de groupe ?"
      a: "Non. Les cas d'usage sont des exemples, pas des réglages. Chaque groupe a les mêmes fonctionnalités, utilisez donc la combinaison qui vous convient."
