faq:
  heading: "أسئلة"
  items:
    - q: "هل نستخدم الراتب الإجمالي أم الصافي؟"
      a: "تقرر المجموعة ذلك. الصافي شائع لأنه المال الذي تملكانه فعلاً لإنفاقه. أما الراتب الإجمالي فيتجاهل أن الضريبة والمساهمات التقاعدية وأقساط القروض تقتطع مبالغ مختلفة من رواتب مختلفة. وأياً كان ما تختارانه، استخدما المقياس نفسه لكليكما."
    - q: "هل يرى Side Badger دخلنا؟"
      a: "لا. تدخلان النسب المئوية فقط، لا الرواتب أبداً. والنسب ظاهرة لأعضاء المجموعة، وفي حالة الزوجين هما أنتما الاثنان."
    - q: "هل نستطيع تعيين 62/38 مرة واحدة لكل شيء؟"
      a: "يُحدَّد التقسيم لكل مصروف، لا لكل مجموعة. انسخ مصروفاً فيه 62 و38 بالفعل، ثم غيّر ما يختلف. ويشرح [تقسيم المصروفات](page:feature/split-expenses) الخيارات الأخرى."
