meta:
  title: "Harcamaları eşit, tam tutarlarla veya yüzdelerle bölüşün | Side Badger"
  description: "Ortak bir masrafı eşit, tam tutarlarla veya yüzdelerle bölüşün ve orada olmayanı dışarıda bırakın. Ücretsiz, reklamsız ve günlük sınırsız."
h1: "Harcamaları eşit, tam tutarlarla veya yüzdelerle bölüşün"
navLabel: "Harcamaları bölüşme"
lead: "Her şey 50/50 bölünmez. Side Badger bunun üstesinden gelir. Kimin ödediğini söyleyin, masrafı paylaşan kişileri seçin ve onu **eşit, tam tutarlarla veya yüzdelerle** bölüştürün. Kırgınlıklar ayrıca satılır."
cta:
  heading: "Bir sonrakini düzgünce bölüşün"
  body: "Ücretsiz bir hesap oluşturun, bir grup kurun ve bir türlü halledemediğiniz harcamayı ekleyin. Sonra ne olacağını bilmiyor musunuz? [Nasıl çalıştığına](page:how-it-works) bakın ya da [ücretsiz planın neleri kapsadığını](page:pricing) kontrol edin."
  button: "Ücretsiz hesap oluştur"
problem:
  heading: "Her şey 50/50 bölünmez"
  body: "Kira oda büyüklüğünü izler. Hediye, kimin ne vaat ettiğini. Akşam yemeği, kimin tatlıya kaldığını. Bir hesabı ikiye bölmek, öyle olmayan ilk hesaba kadar işe yarar ve sonra biri tabloyu açar. Side Badger kimin ödediğini, kimin masrafı paylaştığını ve nasıl bölündüğünü kaydeder; böylece kimse masada uzun bölme yapmadan bakiyeler doğru çıkar."
workflow:
  heading: "Baştan sona bir harcama ekleme"
  steps:
    - title: "Kimin neye ödediğini söyleyin"
      body: "Tutarı, kısa bir açıklamayı ve ödeyen kişiyi girin. Her harcamayı bir kişi öder, bu da hesabı dürüst tutar."
      shot: S05
      shotAlt: "Bir kulübe kirasının üç kişi arasında yüzdelerle bölündüğü harcama formu"
    - title: "Bölüşümü seçin"
      body: "Eşit, tam tutarlar veya yüzdeler arasından seçin. Yüzdelerin toplamı 100 olmalı, tam tutarların toplamı ise toplam tutarı vermeli."
      shot: S06
      shotAlt: "Bir hediye için her kişiye tam tutarların girildiği harcama formu"
    - title: "Hikâyeyi ekleyin"
      body: "Tarihi belirleyin, etiketler, bir yer ve bir not ekleyin. Gruptaki herkes aynı ayrıntıları görür ve orada hemen yorum yapabilir."
      shot: S08
      shotAlt: "Ayrıntıları, bir yorum dizisi ve girildiği orijinal tutarla bir harcama"
    - title: "Bir şey yanlış görünüyorsa soru sorun"
      body: "Grup harcama sorularını açtıysa, bir harcamaya dahil olan herkes onu sorgulayabilir ve harcama listesi yalnızca sorgulananları gösterebilir."
      shot: S18
      shotAlt: "Sorgulandı rozeti ve Yalnızca sorgulanan filtresiyle harcama listesi"
options:
  heading: "Üç bölüşüm yolu"
  items:
    - title: "Eşit"
      body: "Akşam yemekleri, taksiler ve herkesin eşit paylaştığı her şey için varsayılan. Toplam tam bölünmüyorsa artan kuruş rastgele bir kişiye gider, her zaman aynı kişiye değil. Aşağıdaki taksi için bu Ana'dır."
    - title: "Tam tutarlarla"
      body: "Herkesin ne kadar borçlu olduğunu yazın. Herkesin farklı bir fiyat seçtiği hediye veya birinin sepetinin ortak alışverişten fazlasını içerdiği market için iyidir. Tutarların toplamı toplam tutarı vermelidir."
    - title: "Yüzdelerle"
      body: "Her kişiye toplamdan bir pay verin. Oda büyüklüğüne göre kira klasiktir: en büyük oda en büyük payı öder ve kimse aksini ima etmez."
