meta:
  title: Vad Side Badger gör och inte gör
  description: Delning, uppgörelse och flera valutor, plus grupper, listor och omröstningar. Hela paketet, och en ärlig lista över vad Side Badger lämnar utanför.
h1: Vad Side Badger gör
navLabel: Funktioner
lead: Allt som finns i lådan, och det som inte gör det.
intro: Här är hela paketet. Kalkylbladet har vi medvetet lämnat utanför. Börja med de tre jobb Side Badger gör varje dag, och titta sedan på resten av listan och den korta listan över sådant som appen inte gör.
cta:
  heading: Gör den det din grupp behöver?
  body: Skapa ett gratiskonto och prova först med en liten grupp.
cardsHeading: De tre jobben, i detalj
sections:
  - heading: Kvittoskanning
    body: Ta en bild på kvittot så fyller Side Badger i summa, datum och plats så att du kan kontrollera dem. Kvittobilder läses av Googles AI-tjänst.
  - heading: Grupper och behörigheter
    body: Gör en grupp för varje hushåll, resa eller event, med upp till 50 personer i. Bjud in folk med en länk eller en QR-kod. I en större grupp kan du göra någon till tittare, som ser allt men inte ändrar något.
  - heading: Listor och omröstningar
    body: Ha den gemensamma inköpslistan bredvid inköpsnotorna. Låt gruppen rösta om villorna på kortlistan, anonymt om du vill.
  - heading: Allt annat
    items:
      - "**Liveuppdateringar:** lägg till en utgift så ser alla den direkt."
      - "**Språk:** använd Side Badger på 39 språk. Alla i gruppen kan välja sitt eget."
      - "**Hemskärm:** ingen appbutik behövs. Logga in och lägg sedan till Side Badger på hemskärmen så öppnas det som en app. Inställningar i appen visar hur."
      - "**Aviseringar:** slå på pushaviseringar i Inställningar så får du en avisering när det finns ny aktivitet i dina grupper. På iPhone och iPad lägger du först till Side Badger på hemskärmen."
      - "**Feedback:** hittat en bugg? Berätta för oss inifrån appen och se vårt svar där."
  - heading: Vad Side Badger inte gör
    items:
      - "**Flytta pengar.** Side Badger rör aldrig dina pengar. Betala varandra hur ni vill. Betalningsförfrågningar är planerade."
      - "**Upprepa räkningar.** Det finns inga återkommande utgifter. Kopiera förra månadens räkning med två tryck."
      - "**Dela per artikel.** En betalare per utgift. Dela lika, exakt eller i procent."
      - "**Levereras som en inbyggd app.** Den fungerar i webbläsaren. Logga in och lägg sedan till den på hemskärmen."
      - "**Fungera offline.** Den behöver en uppkoppling."
      - "**Skicka aviseringar med e-post eller sms.** Ny aktivitet visas i appen, och som pushaviseringar om du slår på dem."
      - "**Rita diagram eller budgetar.** Den håller räkningen på vem som är skyldig vem, och det är hela tricket."
      - "**Logga in med Google eller Apple.** Registrera dig med e-post. Inloggning med Google och Apple är planerad."
      - "**Släppa in folk utan konto.** Alla i gruppen behöver ett gratiskonto."
faq:
  heading: Frågor
  items:
    - q: Kan jag betala via Side Badger?
      a: Nej. Side Badger håller räkningen och rör aldrig dina pengar. Betala varandra hur ni vill och registrera sedan betalningen.
    - q: Finns det en mobilapp?
      a: Inte i någon appbutik. Side Badger körs i webbläsaren. Logga in på mobilen och lägg sedan till det på hemskärmen så öppnas det som en app. Inställningar i appen visar hur.
    - q: Kan jag dela per artikel?
      a: Nej. Varje utgift har en betalare, och du delar den lika, exakt eller i procent.
    - q: Fungerar det offline?
      a: Nej, det behöver en uppkoppling.
    - q: Behöver alla i gruppen ett konto?
      a: Ja. Alla i gruppen behöver ett gratiskonto, och allt som behövs för att registrera sig är en e-postadress.
