faq:
  heading: "سوالات"
  items:
    - q: "اگر کسی کا کمرہ بڑا ہو مگر روشنی کم ہو تو؟"
      a: "رقبہ صرف آغاز ہے، اس لیے گروپ ایڈجسٹ کرنے پر اتفاق کر سکتا ہے۔ تاریک کمرے سے ایک دو پوائنٹ کم کریں، وہ باقیوں کو دے دیں اور جانچیں کہ فیصد کا مجموعہ پھر بھی 100 ہے۔ جو آپ طے کریں Side Badger وہی محفوظ کرتا ہے اور اس پر فیصلہ نہیں سناتا۔"
    - q: "کیا بل بھی کمرے کے سائز پر بانٹنے چاہئیں؟"
      a: "عموماً نہیں۔ بجلی گیس اور براڈ بینڈ سب استعمال کرتے ہیں، اس لیے برابر تقسیم آسان ہے، جیسا اوپر مثال میں ہے۔ اگر ایک ساتھی سارا دن گھر پر ہو تو گروپ کچھ اور طے کر سکتا ہے، جیسے عین رقمیں۔ [اخراجات کی تقسیم](page:feature/split-expenses) اختیارات بتاتا ہے۔"
    - q: "کیا ہم تقسیم بعد میں بدل سکتے ہیں؟"
      a: "جی ہاں، نئے اخراجات کے لیے۔ کرایہ کاپی کرتے وقت فیصد بدلیں اور پچھلے مہینے جیسے تھے ویسے ہی رہیں گے۔ کسی پرانے خرچے کو درست کرنے کے لیے، اگر گروپ کی اجازتیں دیں تو اسے ایڈٹ کریں، اور پہلے گھر والوں کو بتا دیں، کیونکہ بیلنس بدل جاتے ہیں۔ پچھلا ورژن محفوظ رہتا ہے۔"
