meta:
  title: "Rhannu fila pan fo pobl yn aros nosweithiau gwahanol | Side Badger"
  description: "Dim ond tair noson y daeth Dev, felly pam talu am chwech? Rhannwch fila gwyliau yn ôl y nosweithiau yr arhosodd pobl, gyda'r symiau wedi'u gwneud i chi."
h1: "Sut i rannu fila gwyliau pan fydd pobl yn aros nosweithiau gwahanol"
navLabel: "Rhannu fila yn ôl nosweithiau"
lead: "Prisiwch yr arhosiad fesul person fesul noson, lluoswch â nosweithiau pob person, a rhowch y fila i mewn fel **un gost gyda symiau union**. Mae Side Badger yn cadw'r cyfrif ac yn awgrymu rhestr fer o daliadau pan fydd yn bryd setlo."
cta:
  heading: "Rhowch un gost daclus i'r fila"
  body: "Gwnewch grŵp, gwahoddwch bawb gyda dolen neu god QR a rhowch y fila i mewn gyda symiau union. Mae Side Badger yn cadw'r cyfrif tra byddwch chi'n bwrw ymlaen â'r gwyliau."
sections:
  - heading: "Chwe noson, pedwar person, un cerdyn credyd"
    body: "Mae [taith grŵp](page:use-case/group-trips) fel arfer yn dechrau gyda cherdyn un person. Yma, cerdyn Ana ydyw. Mae hi'n archebu fila am chwe noson, €2,100, oherwydd mae'n rhaid i rywun fynd yn gyntaf. Mae Ana, Ben a Chloe yn aros pob un o'r chwe noson. Dim ond am y tair noson olaf y gall Dev ymuno, ac mae'n dod ar y trên. Mae Ben yn llogi car, na fydd Dev byth yn eistedd ynddo. Dev sy'n gwneud y siopa bwyd mawr. Rhannu'r fila'n bedair yw'r cam amlwg. Mae hynny'n golygu bod Dev yn talu am dair noson a dreuliodd gartref, ac mae pethau felly'n codi eu pen adeg y Nadolig. Mae rhannu yn ôl nosweithiau yn osgoi'r ddadl, ac mae'r mathemateg yn cymryd munud."
  - heading: "Prisio un person-noson"
    body: "Person-noson yw un person yn aros un noson. Mae'r fila'n costio'r hyn y mae'n ei gostio, felly rhannwch y pris ar draws yr holl berson-nosweithiau, yna rhowch i bob person y rhai a ddefnyddiodd."
    items:
      - "**Cyfrifwch y person-nosweithiau.** Mae Ana, Ben a Chloe yn aros chwe noson yr un ac mae Dev yn aros tair: 6 + 6 + 6 + 3 = 21."
      - "**Prisiwch un.** €2,100 ÷ 21 = €100 fesul person-noson."
      - "**Lluoswch â nosweithiau pob person.** Mae Ana, Ben a Chloe yn talu 6 × €100 = €600 yr un. Mae Dev yn talu 3 × €100 = €300."
      - "**Gwiriwch y cyfanswm.** €600 + €600 + €600 + €300 = €2,100. Os nad yw eich cyfrannau'n adio i'r pris, mae noson ar goll neu wedi'i chyfrif ddwywaith."
  - heading: "Ei roi i mewn yn Side Badger"
    body: "Gwnewch grŵp, gwahoddwch y tri arall gyda dolen neu god QR, yna ychwanegwch y costau. Y fila yn gyntaf."
    items:
      - "Dewiswch **Ychwanegu Cost**. Disgrifiwch hi, rhowch 2,100 a gosodwch **Pwy dalodd?** i Ana."
      - "O dan **Rhannu rhwng**, gwnewch yn siŵr bod y pedwar person i mewn."
      - "O dan **Sut i rannu**, dewiswch **Union symiau**. Teipiwch 600 ar gyfer Ana, Ben a Chloe a 300 ar gyfer Dev. Rhaid i'r symiau adio i'r cyfanswm."
      - "Dewiswch **Cadw Cost**."
      - "Ychwanegwch y car llog yr un ffordd. Talodd Ben, y rhaniad yw **Cyfartal**, ac mae Dev wedi'i adael allan, oherwydd iddo ddod ar y trên. Mae [rhannu treuliau](page:feature/split-expenses) yn trafod y ffyrdd eraill o rannu cost."
      - "Ychwanegwch y nwyddau bwyd. Talodd Dev, y rhaniad yw **Cyfartal**, ac mae'r pedwar i mewn."
  - heading: "Darllen y canlyniad, yna setlo"
    body: "Bil pob person yw cyfran y fila ynghyd â'i gyfran o'r car a'r siopa. Mae Ana, Ben a Chloe yn dod i €725 yr un, sef €600 + €80 + €45. Mae Dev yn dod i €345, sef €300 + €45. Tynnwch yr hyn a dalodd pob person ac mae'r balansau'n dod i'r golwg. Talodd Ana €2,100, felly mae €1,375 yn ddyledus iddi. Talodd Ben €240 ac mae €485 yn ddyledus ganddo. Talodd Dev €180 ac mae €165 yn ddyledus ganddo. Ni thalodd Chloe ddim ac mae €725 yn ddyledus ganddi. Pe baech yn eu gadael fel y maent, byddai'r dyledion hynny'n rhedeg chwe ffordd o gwmpas y grŵp. Yn lle hynny, mae Side Badger yn awgrymu tri thaliad, pob un i Ana. Talwch hi sut bynnag y dymunwch, yna dewiswch **Setlo** a defnyddiwch **Cofnodi Setliad** ar gyfer pob taliad, fel bod y balansau'n dal i fyny. Mae'r botymau setlo cyflym yn llenwi'r swm. Mae mwy am [setlo](page:feature/settle-up)."
  - heading: "Pan nad yw'r fila'n un pris taclus"
    items:
      - "**Mae'r ystafelloedd yn wahanol.** Os yw'r swît yn werth mwy na'r ystafell fach, cytunwch yn gyntaf beth mae pob ystafell yn ei gostio, yna gwnewch symiau'r person-nosweithiau un ystafell ar y tro. Rhowch y fila i mewn fel un gost gyda chyfanswm pawb, neu un gost i bob ystafell. Y naill ffordd neu'r llall, rhaid i'r symiau union ar gost adio i'w chyfanswm."
      - "**Blaendal a dalwyd fisoedd ynghynt.** Mae pwy bynnag a'i talodd yn cael ei gost ei hun, wedi'i dyddio ar y diwrnod y talodd. Rhannwch hi yn ôl nosweithiau yn yr un cyfrannau â'r balans."
      - "**Mae'r archeb mewn arian cyfred arall.** Rhowch y fila yn yr arian cyfred y talasoch ynddo. Os yw'r grŵp yn trosi wrth fynd, defnyddiwch gyfradd gyfnewid gyfredol, neu teipiwch y gyfradd a gawsoch mewn gwirionedd. Mae'r swm gwreiddiol yn aros ar y gost. Mae [arian cyfred lluosog](page:feature/multiple-currencies) yn rhoi'r manylion."
      - "**Nosweithiau rhannol.** Mae rhywun yn cyrraedd am hanner nos, mae rhywun yn gadael cyn brecwast. Cytunwch ar un rheol ar gyfer cyfrif nosweithiau a'i defnyddio ar gyfer pawb."
  - heading: "Beth nad yw Side Badger yn ei wneud yma"
    items:
      - "Dyw Side Badger ddim yn cyfrif nosweithiau i chi. Does dim rhaniad yn ôl nosweithiau nac yn ôl cyfrannau, felly rydych yn gweithio allan pob swm fel uchod ac yn rhoi **symiau union** i mewn."
      - "Dyw Side Badger ddim yn symud arian. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad."
      - "Mae gan bob cost un talwr yn unig. Os talodd dau berson am y fila, rhowch ddwy gost i mewn."
      - "Does dim mynediad i westeion. Mae angen cyfrif am ddim ar bawb yn y grŵp, gan gynnwys Dev."
