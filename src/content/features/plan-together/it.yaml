sections:
  - heading: Commenti e reazioni, accanto ai numeri
    body: Ogni spesa ha la sua discussione di commenti, e così il gruppo, ogni lista e ogni sondaggio. Chiedi perché il taxi è costato tanto sotto il taxi, non in una chat che nessuno rilegge. Aggiungi la foto di uno scontrino o il PDF di una prenotazione, poi reagisci con pollice in su, cuore, risata, wow, triste o festeggia sulle spese, sui pagamenti e sui commenti. Festeggia un pagamento quando arriva. È la cosa più vicina a un applauso che Side Badger sappia offrire.
  - heading: Metti in discussione una spesa senza litigare
    body: Quando il gruppo ha attivato le domande sulle spese, chiunque sia incluso in una spesa può scegliere **Ho una domanda** e spiegare perché. La domanda viene pubblicata come commento sulla spesa, la spesa riceve un badge **In discussione**, e l'intera spesa esce dai saldi di tutti finché la domanda non è risolta.
    items:
      - "**Attivarla.** È disattivata di default. Un admin attiva **Consenti domande sulle spese** nelle impostazioni del gruppo, sotto **Funzionalità**."
      - "**Chiuderla.** La persona che l'ha posta, o un admin, sceglie **Chiudi domanda**. Se più persone hanno messo in discussione la stessa spesa, questa rientra nei saldi quando viene chiusa l'ultima domanda."
      - "**Modificarla.** Quando una spesa viene modificata, una domanda aperta passa alla nuova versione per chiunque abbia ancora una quota. Se la modifica lascia fuori qualcuno, la sua domanda finisce con la vecchia versione, così non resta niente da chiudere."
      - "**Trovarle.** L'elenco delle spese ha un filtro **Solo in discussione**. Non è un passaggio di approvazione: vengono trattenute solo le spese che qualcuno mette in discussione, e tutto il resto conta appena viene aggiunto."
  - heading: Come va a finire una domanda
    body: Tom aggiunge 45 £ di vino per la festa, diviso tra tutti e tre i coinquilini. Aisha non ha bevuto, quindi solleva una domanda, e finché è aperta il vino non conta per nessuno. La casa concorda che il vino è di Tom e Priya, quindi Tom modifica la divisione tra i due. Aisha non fa più parte della spesa, quindi la sua domanda finisce con la versione precedente, che viene conservata, e il vino rientra subito nei saldi a 22,50 £ a testa invece di 15 £ a testa. Se Aisha fosse rimasta nella spesa, la sua domanda sarebbe passata alla nuova versione e avrebbe aspettato che lei o un admin la chiudesse. Qui sotto, i 48 £ di Aisha sono 28 £ della spesa e 20 £ delle pulizie, e i 10,50 £ di Priya sono la sua quota di 70,50 £ (28 £, 20 £ e 22,50 £) meno i 60 £ che ha pagato. Una discussione molto da [coinquilini](page:use-case/housemates). Per sapere come formulare una domanda, vedi [cosa fare quando qualcuno contesta una spesa condivisa](page:guide/what-to-do-when-someone-disputes-a-shared-expense).
  - heading: Liste condivise, per la spesa
    body: Avvia una lista nel gruppo, chiamala per esempio Lista della spesa, aggiungi gli articoli e spuntali. Trascina gli articoli in un ordine migliore, guarda salire il conteggio dei progressi e commenta la lista quando qualcuno compra il latte d'avena sbagliato. Archivia una lista finita per metterla via (**Mostra archiviati** la riporta indietro), oppure copiala per riusarla. Tieni la lista della spesa condivisa accanto ai conti della spesa, così la lista dice cosa comprare e la spesa dice quanto è costato. Chi può creare e modificare le liste dipende dai permessi del gruppo, che [gruppi e permessi](page:feature/groups-and-permissions) spiega.
  - heading: Sondaggi, anche anonimi se vuoi
    body: Chiedi al gruppo qualcosa che decide il conto, come quale villa, quanto spendere per il regalo o se la gita in barca vale la pena. Un sondaggio ha una domanda e da due a dieci opzioni. Scegli quanti voti ha ogni persona, da una sola scelta fino a dieci, e se il voto è anonimo. **Voto anonimo** nasconde chi ha votato per cosa e non si può cambiare dopo il primo voto. Le persone possono cambiare o togliere il proprio voto finché il sondaggio non si chiude, e puoi riaprirlo se il gruppo ci ripensa. Scegliere la villa è esattamente il genere di cose di cui sono fatti i [viaggi di gruppo](page:use-case/group-trips), e concordare il budget del regalo è un classico per [eventi e feste](page:use-case/events-and-celebrations).
  - heading: Lo storico delle attività, così niente cambia di nascosto
    body: Ogni gruppo ha uno storico delle attività, e la campanella delle notifiche raccoglie in un posto solo l'attività di tutti i tuoi gruppi. Aggiungi una spesa e tutti la vedono subito, senza ricaricare, e lo storico mostra cosa è cambiato e chi l'ha cambiato. Comprende spese aggiunte, modificate o eliminate, domande poste e chiuse, commenti, modifiche a liste e sondaggi e pagamenti registrati.
  - heading: Notifiche push, se le vuoi
    body: Le notifiche push sono facoltative. Attivale nelle **Impostazioni** del tuo account, sotto **Notifiche**, e il tuo dispositivo ti avvisa quando c'è una nuova attività nei tuoi gruppi, come una nuova spesa o un commento. Ogni dispositivo si attiva separatamente, e il browser chiede prima il permesso. Su iPhone o iPad funzionano solo dall'app aggiunta alla schermata Home, come spiega la pagina [app web](page:feature/web-app). Considerale una comodità, non una promessa, perché la consegna non è garantita.
limits:
  heading: Limiti
  items:
    - Commenti, liste e sondaggi riguardano i soldi del gruppo. I [termini](page:terms) chiedono che tutto ciò che si pubblica riguardi le finanze del gruppo, quindi questo è un posto per pianificare le spese, non una chat generica né un'app di to-do.
    - Un commento può arrivare a 500 caratteri, con fino a tre allegati che sono immagini o PDF da massimo 5 MB ciascuno. Solo l'autore può eliminare un commento.
    - Le domande sulle spese sono disattivate di default, e un admin le attiva per ogni gruppo. Solo le persone incluse in una spesa possono metterla in discussione, disattivare la funzione cancella ogni domanda aperta, e nessuno può lasciare il gruppo finché una spesa di cui fa parte ha una domanda aperta.
    - Un gruppo può contenere fino a 100 liste, ciascuna con fino a 200 voci da massimo 500 caratteri. I permessi del gruppo decidono chi può creare, modificare ed eliminare le liste, e un gruppo bloccato non permette modifiche.
    - Un gruppo può contenere fino a 50 sondaggi, ciascuno con da due a dieci opzioni e fino a dieci voti per persona. I sondaggi non hanno scadenza e non si chiudono da soli.
    - Lo storico delle attività viene conservato per 90 giorni.
    - Le notifiche push sono facoltative per ogni account e ogni dispositivo. Richiedono un browser che le supporti e il tuo permesso, su iPhone e iPad funzionano solo dall'app aggiunta alla schermata Home, e la consegna non è garantita. Non ci sono avvisi via email o SMS per l'attività né promemoria di pagamento, quindi sollecitare un pagamento resta compito tuo.
