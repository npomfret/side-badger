sections:
  - heading: Kirjaa maksu
    body: Kun joku maksaa, kirjaa se oikean ihmisen kohdalle. Pikaselvityspainikkeet täyttävät summan ehdotetuista maksuistasi, ja voit lisätä muistiinpanon, kuten ”pankkisiirto” (enintään 500 merkkiä). Jos maksat vain osan velastasi, loput jää saldolle. Jos syötät liian vähän tai liikaa, Side Badger varoittaa ennen tallennusta. Maksun kirjaaminen vaatii oikeuden muokata kuluja, eikä päivämäärä voi olla tulevaisuudessa.
  - heading: Maksettu toisessa valuutassa?
    body: Saldot pysyvät siinä valuutassa, jolla maksettiin, joten euroina oleva velka pysyy euroina. Oletko velkaa euroja mutta maksat puntina? Muunna maksu syöttäessäsi nykyisellä valuuttakurssilla tai kurssilla, jonka todella sait. Kurssi lukitaan, kun maksu tallennetaan. [Useita valuuttoja](page:feature/multiple-currencies) kertoo, miten muunnos toimii, ja [ryhmämatkat](page:use-case/group-trips) näyttää sen käytössä.
  - heading: Historia, jonka voit tarkistaa
    body: Jokainen kirjattu maksu säilyy ryhmän historiassa päivämäärineen, summineen ja muistiinpanoineen. Vain maksun kirjannut voi muokata sitä, ja hän tai ryhmän ylläpitäjä voi poistaa sen. Maksu, jossa on mukana ryhmästä lähtenyt, on lukittu. Kämppisesimerkki löytyy sivulta [kämppikset](page:use-case/housemates).
limits:
  heading: Mitä Side Badger ei tee
  items:
    - Side Badger ei siirrä rahaa, lähetä maksulinkkejä eikä maksupyyntöjä. Maksu sovelluksessa on kirjaus muualla tehdystä maksusta.
    - Ehdotetut maksut tulevat yksinkertaisesta täsmäytystavasta, jota sovelletaan valuutoittain. Se ehdottaa aina vähemmän maksuja kuin on ihmisiä, joilla on saldo kyseisessä valuutassa (neljä ihmistä, enintään kolme maksua), mutta se ei aina löydä pienintä mahdollista määrää.
    - Ehdotuksia ei voi poistaa käytöstä. **Näytä kaikki** listaa kaikki ryhmän ehdotetut maksut, ei vain omiasi.
    - Valuuttoja ei koskaan kuitata toisiaan vastaan, ellei kuluja muunnettu niitä syötettäessä.
    - Muistutuksia ei ole, joten maksun perään kyseleminen on edelleen sinun vastuullasi.
useCasesHeading: Missä tilien tasaus on tärkeää
faq:
  heading: Kysymyksiä
  items:
    - q: Lähettääkö Side Badger rahat?
      a: Ei. Maksakaa toisillenne miten haluatte ja kirjaa sitten maksu Side Badgerissa, jotta saldo päivittyy.
    - q: Voinko poistaa ehdotetut maksut käytöstä?
      a: Ei. Yksinkertaistus pysyy päällä, ja **Näytä kaikki** listaa kaikki ryhmän ehdotetut maksut, ei vain sinua koskevia.
    - q: Miksi eurot ja punnat pidetään erillään?
      a: Saldot pysyvät siinä valuutassa, jolla maksoit, ellet muunna kulua tai maksua sitä syöttäessäsi. Eri valuuttojen velkoja ei koskaan kuitata toisiaan vastaan.
    - q: Entä jos joku maksaa vain osan velastaan?
      a: Kirjaa maksettu osa. Loput jää saldolle, kunnes se maksetaan.
    - q: Onko tämä aina pienin mahdollinen määrä maksuja?
      a: Ei taattu. Se ehdottaa aina vähemmän maksuja kuin on ihmisiä, joilla on saldo kyseisessä valuutassa, joten neljälle ihmiselle se ei koskaan ehdota yli kolmea. Kämppisesimerkissä se on kaksi maksua, kun jokaiselle takaisin maksaminen suoraan vaati kuusi.
