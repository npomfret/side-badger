meta:
  title: "Діліть витрати вечірок, весіль і спільних подарунків"
  description: "Діліть витрати вечірки, весілля чи спільного подарунка, коли люди вносять різні суми. Голосуйте за план, діліть за точними сумами й бачте, хто кому винен."
h1: "Діліть витрати вечірок, весіль і спільних подарунків"
navLabel: "Події та свята"
lead: "Розділіть завдатки, прикраси й запасні парасольки. Розсадження гостей залиште комусь відважнішому. Side Badger тримає в одному місці, **хто скільки вніс**, щоб і організатор міг розважитися."
cta:
  heading: "Почніть із наступного свята"
  body: "Створіть обліковий запис, заведіть групу для події й надішліть посилання із запрошенням. Side Badger безкоштовний, без реклами та без денних обмежень."
  button: "Створити безкоштовний обліковий запис"
scenario:
  heading: "Кожен вносить, не завжди однаково"
  body: "Хтось платить завдаток за зал, хтось інший купує торт, а третя людина платить за спільний подарунок власною карткою. Деякі гості приходять на все, а деякі лише на вечерю. Вести чесний облік цього в чаті — робота, на яку ніхто не наймався. Група в Side Badger тримає все, яка б не була суміш сум, і показує кожному, що він винен або що йому винні. Основи дивіться в [як це працює](page:how-it-works) або читайте далі про подію."
sections:
  - heading: "Вирішуйте разом"
    body: "Перш ніж почнуть рухатися гроші, винесіть вибір на **опитування**. Додайте до 10 варіантів, наприклад два зали чи три ідеї подарунка, і хай усі проголосують. Можна приховати, хто за що голосував, щоб кожен варіант мав чесний шанс, а переможець з'явиться, коли опитування закрито. Нікому не треба гортати сорок повідомлень, щоб дізнатися, що вирішили."
  - heading: "Хто в чому бере участь"
    body: "Не всі платять однаково й не всі беруть участь у кожній витраті. Розділіть витрату порівну, у відсотках або за **точними сумами**, щоб частка кожного була сумою, про яку ви домовилися. Пропустіть тих, хто не брав участі, як-от гостей, що пропустили вечерю, або друзів, які не долучилися до подарунка. У кожної витрати один платник, а всі інші в розподілі винні йому свою частку. Подробиці на сторінці [розподіл витрат](page:feature/split-expenses)."
  - heading: "Збережіть документи"
    body: "Додавайте до витрати примітки, наприклад що саме покривала витрата. Коментарі лишаються **поруч із витратою**, якої стосуються, тож запитання «торт коштував 45 £ чи 54 £?» і відповідь на нього живуть в одному місці. Коментарі можуть мати до 500 символів, що з запасом вистачає на запитання про завдаток."
  - heading: "Керування для організатора"
    body: "Відкрита співпраця дозволяє кожному учаснику додавати й редагувати витрати, що годиться для невеликого подарунка. Для весілля чи більшої вечірки оберіть шаблон **Керована група**. Адміністратори схвалюють кожного нового учасника, а витрати можуть змінювати лише творці й адміністратори. Запрошуйте людей за посиланням чи QR-кодом; за ввімкненого схвалення адміністратор пускає кожну людину, тож список гостей лишається списком гостей. Коли подія скінчилася, заблокуйте групу, щоб цифри лишилися на місці."
  - heading: "Розрахуйтеся після вечірки"
    body: "Коли надходить останній рахунок, баланси показують, **хто кому винен**, а Side Badger підказує короткий список платежів, який розраховує всіх. Платіть одне одному як зручно, а потім запишіть платіж у групі. Side Badger ніколи не переказує гроші, тож група веде облік, а перекази відбуваються у ваших банківських застосунках. Сторінка [розрахунок](page:feature/settle-up) показує, як клубок стає коротким списком."
exampleAfter: 5
