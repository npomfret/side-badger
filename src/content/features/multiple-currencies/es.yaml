sections:
  - heading: Una sola moneda para todo el grupo
    body: Si tu grupo prefiere no pensar en ello, elige una moneda de grupo y el formulario convierte cada gasto nuevo a ella, con un tipo que sigues pudiendo ver y cambiar. Esto se aplica solo a gastos nuevos y copiados. Las ediciones y los gastos existentes se dejan como están, así que nada de lo ya registrado cambia por sorpresa.
  - heading: Debes euros, pagas en libras
    body: ¿Pagaste en yenes y saldas en libras? Sin problema. Al registrar un pago también puedes convertirlo, así que quien deba euros puede pagar en libras y el saldo en euros sigue saliendo bien. Pagaos como queráis y después registradlo.
  - heading: Reglas para el grupo
    body: Limita un grupo a las monedas que realmente usas y fija una por defecto para que el formulario se abra en la correcta. Unas vacaciones en Portugal no necesitan otras 139 opciones junto a la cuenta de la cena, y una [boda en el extranjero](page:use-case/events-and-celebrations) probablemente necesita dos.
limits:
  heading: Límites
  items:
    - El tipo queda fijado al guardar el gasto. Los gastos antiguos nunca se revalorizan.
    - Side Badger obtiene un tipo actual cuando puede. No se garantiza uno para cada par, y siempre puedes escribir el tipo tú.
    - La conversión automática del grupo se aplica solo a gastos nuevos y copiados, no a ediciones ni a gastos existentes.
    - Cada gasto tiene un tope de 999.999,99 en su propia moneda.
    - Hay 140 monedas. Las criptomonedas y los metales no están entre ellas.
    - Side Badger registra pagos. Nunca mueve ni cambia dinero.
useCasesHeading: Dónde ayuda
faq:
  heading: Preguntas
  items:
    - q: ¿Qué tipo de cambio se usa?
      a: Un tipo de cambio actual, obtenido al introducir el gasto cuando hay uno disponible. Puedes cambiarlo por el tipo que te aplicaron de verdad, y el importe convertido se actualiza.
    - q: ¿Se revalorizan los gastos antiguos?
      a: No. El tipo queda fijado al guardar el gasto, así que un saldo no se desvía porque se mueva el mercado.
    - q: ¿Se admiten criptomonedas?
      a: No. Hay 140 monedas, y las criptomonedas no están entre ellas.
    - q: ¿Por qué no puedo introducir 2.000.000 de rupias indonesias?
      a: Cada gasto tiene un tope de 999.999,99 en su propia moneda. Introdúcelo en otra moneda y conviértelo, o divídelo en dos gastos.
    - q: ¿Cuesta algo convertir?
      a: No. Convertir es gratis, como el resto de Side Badger. Consulta [precios](page:pricing).
    - q: ¿Tengo que convertir?
      a: No. Las monedas se quedan por separado salvo que tú o tu grupo decidáis convertir, y cada moneda tiene su propia lista corta de pagos.
