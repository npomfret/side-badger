faq:
  heading: "Pytania"
  items:
    - q: "Czy świadek albo świadkowa płaci więcej?"
      a: "Tylko jeśli grupa się na to zgodzi. Aplikacja nie daje nikomu specjalnej roli w rachunkach. Jeśli ktoś pokrywa więcej, wybierz w polu **Sposób podziału** **Dokładne kwoty** albo **Procentowo** i wpisz udziały, na które się umówiliście."
    - q: "A napoje, których część osób nie piła?"
      a: "Dodaj napoje jako osobny wydatek i zaznacz tylko osoby, które je piły. Jeśli każda osoba wypiła inną ilość, wybierz **Dokładne kwoty** i wpisz udział każdej z nich. Nikt nie płaci za to, czego nie miał."
    - q: "Czy gość honorowy może później zobaczyć grupę?"
      a: "Tak, gdy niespodzianka się skończy. Zaproś tę osobę, a potem administrator może nadać jej rolę **Widz** w zakładce **Bezpieczeństwo** w ustawieniach grupy. Widz widzi wszystko i niczego nie zmienia, więc poczekaj, aż nic nie będzie tajemnicą. Do dołączenia potrzebne jest darmowe konto."
