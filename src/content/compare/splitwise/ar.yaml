meta:
  title: "Side Badger مقابل Splitwise: المجموعة كلها، لا الحسابات وحدها | Side Badger"
  description: "بديل مجاني لـ Splitwise للمجموعة كلها: تعليقات وأسئلة وقوائم واستطلاعات وأدوار وأذونات حقيقية، مع مسح إيصالات وتحويل عملات مجانيين."
h1: "Side Badger مقابل Splitwise: المجموعة كلها، لا الحسابات وحدها"
navLabel: Side Badger مقابل Splitwise
lead: "على الأرجح قال أحد في مجموعتك: «استخدموا Splitwise وحسب». كلام معقول: فهو بارع في الحسابات. Side Badger يتولى الحسابات أيضاً، ثم يمنح المجموعة مكاناً تتحدث فيه عنها: تعليقات وأسئلة وقوائم واستطلاعات وأدوار مجموعة حقيقية. ومسح الإيصالات وتحويل العملات مجانيان."
cta:
  heading: جرّبه على فاتورتك المشتركة القادمة
  body: أنشئ حساباً مجانياً، وأنشئ مجموعة، وأضف مصروفاً واحداً حقيقياً. وإن لم يناسبك، فقد أنفقت بضع دقائق لا اشتراكاً.
asOf: 2026-11-22
asOfNote: قرأنا صفحات Splitwise نفسها في {date} حتى لا تضطر إلى ذلك، وكل ما هنا عن Splitwise مأخوذ منها. ويرتبط كل صف في الجدول بمصدره. والخطط تتغير، لذا نراجع مرة كل ربع سنة، وإذا خالفت صفحات Splitwise هذه الصفحة فصدّقها هي.
