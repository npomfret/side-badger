sections:
  - heading: "पेमेंट रिकॉर्ड करें"
    body: "जब कोई पेमेंट करे, उसे सही व्यक्ति के नाम पर रिकॉर्ड करें। त्वरित निपटान बटन आपकी सुझाई गई पेमेंट से राशि भर देते हैं, और आप “बैंक ट्रांसफर” जैसा नोट जोड़ सकते हैं (500 अक्षर तक)। जितना देना है उसका सिर्फ एक हिस्सा दें तो बाकी बैलेंस पर रहता है। अगर आप बहुत कम या बहुत ज़्यादा राशि डालें, तो सेव करने से पहले Side Badger आपको चेतावनी देता है। पेमेंट रिकॉर्ड करने के लिए खर्च एडिट करने की अनुमति चाहिए, और तारीख भविष्य की नहीं हो सकती।"
  - heading: "दूसरी करेंसी में पेमेंट किया?"
    body: "बैलेंस उसी करेंसी में रहते हैं जिसमें पेमेंट हुआ, इसलिए यूरो का कर्ज यूरो का कर्ज ही रहता है। यूरो देने हैं, पर पेमेंट पाउंड में करना है? पेमेंट दर्ज करते समय उसे बदलें, मौजूदा एक्सचेंज रेट पर या उस रेट पर जो आपको असल में मिला। रेट पेमेंट सेव होते ही तय हो जाता है। [कई करेंसी](page:feature/multiple-currencies) बताता है कि बदलाव कैसे काम करता है, और [ग्रुप ट्रिप](page:use-case/group-trips) इसे इस्तेमाल में दिखाता है।"
  - heading: "हिस्ट्री जिसे आप जांच सकें"
    body: "हर रिकॉर्ड किया गया पेमेंट अपनी तारीख, राशि और नोट के साथ ग्रुप की हिस्ट्री में रहता है। पेमेंट को सिर्फ वही व्यक्ति एडिट कर सकता है जिसने उसे रिकॉर्ड किया, और उसे वह या ग्रुप का कोई एडमिन हटा सकता है। ग्रुप छोड़ चुके किसी व्यक्ति से जुड़ा पेमेंट लॉक हो जाता है। रूममेट्स के एक पूरे उदाहरण के लिए [रूममेट्स](page:use-case/housemates) देखें।"
limits:
  heading: "Side Badger क्या नहीं करता"
  items:
    - "Side Badger पैसे नहीं भेजता, पेमेंट लिंक या पेमेंट रिक्वेस्ट नहीं भेजता। ऐप में दर्ज पेमेंट कहीं और किए गए पेमेंट का रिकॉर्ड है।"
    - "सुझाए गए पेमेंट एक सरल मिलान तरीके से निकलते हैं, जो हर करेंसी पर अलग लगता है। वह हमेशा उस करेंसी में बैलेंस वाले लोगों की गिनती से कम पेमेंट सुझाता है (चार लोग, ज़्यादा से ज़्यादा तीन पेमेंट), पर ज़रूरी नहीं कि वह सबसे कम संभव संख्या ढूंढे।"
    - "आप सुझावों को बंद नहीं कर सकते। **सभी दिखाएं** ग्रुप का हर सुझाया गया पेमेंट दिखाता है, सिर्फ आपके नहीं।"
    - "करेंसी एक-दूसरे में तब तक नहीं कटतीं जब तक खर्च दर्ज करते समय बदले न गए हों।"
    - "कोई रिमाइंडर नहीं हैं, इसलिए पेमेंट के पीछे पड़ना अब भी आपके हाथ में है।"
useCasesHeading: "जहां हिसाब चुकता करना मायने रखता है"
faq:
  heading: "सवाल"
  items:
    - q: "क्या Side Badger पैसे भेजता है?"
      a: "नहीं। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर Side Badger में पेमेंट रिकॉर्ड करें ताकि बैलेंस अपडेट हो।"
    - q: "क्या मैं सुझाए गए पेमेंट बंद कर सकता हूँ?"
      a: "नहीं। सरलीकरण चालू रहता है, और **सभी दिखाएं** ग्रुप का हर सुझाया गया पेमेंट दिखाता है, सिर्फ वे नहीं जिनमें आप शामिल हैं।"
    - q: "यूरो और पाउंड अलग क्यों रखे जाते हैं?"
      a: "बैलेंस उसी करेंसी में रहते हैं जिसमें आपने पेमेंट किया, जब तक आप खर्च या पेमेंट दर्ज करते समय न बदलें। अलग-अलग करेंसी की उधारियां एक-दूसरे में कभी नहीं काटी जातीं।"
    - q: "अगर कोई जितना देना है उसका सिर्फ एक हिस्सा दे तो?"
      a: "जो हिस्सा दिया गया उसे रिकॉर्ड करें। बाकी बैलेंस पर तब तक रहता है जब तक वह चुकाया न जाए।"
    - q: "क्या यह हमेशा पेमेंट की सबसे कम संभव संख्या होती है?"
      a: "गारंटी नहीं है। यह हमेशा उस करेंसी में बैलेंस वाले लोगों की गिनती से कम पेमेंट सुझाता है, इसलिए चार लोगों के लिए यह तीन से ज़्यादा कभी नहीं सुझाता। रूममेट्स के उदाहरण में वह दो पेमेंट हैं, जबकि हर व्यक्ति को सीधे चुकाने में छह लगे थे।"
