meta:
  title: "Side Badger dla współlokatorów, wyjazdów i imprez"
  description: "Dziel koszty ze współlokatorami, na wyjazdach grupowych oraz przy imprezach, weselach i wspólnych prezentach. Zobacz, co Side Badger robi dla każdego rodzaju grupy."
h1: "Side Badger dla twojego rodzaju grupy"
navLabel: "Zastosowania"
lead: "Współlokatorzy, wakacje, wieczory panieńskie. Wybierz swój chaos, a potem zobacz, jak grupa taka jak twoja prowadzi rachunek."
intro: "Każda grupa dzieli koszty trochę inaczej. Te strony prowadzą przez **realistyczny scenariusz** od pierwszego wydatku do ostatniej zarejestrowanej płatności, z pokazanymi obliczeniami, żeby było widać, co wyszłoby w twojej grupie."
cta:
  heading: "Rozpoznajesz swoją grupę?"
  body: "Załóż konto, utwórz grupę i dodaj pierwszy wydatek. Zajmie to kilka minut."
  button: "Załóż darmowe konto"
cardsHeading: "Wybierz sytuację najbliższą twojej"
sections:
  - heading: "Wyjazdy grupowe"
    body: "Loty w funtach, willa w euro i kolacja, którą jadły tylko trzy osoby. Ustaw grupę na przeliczanie na funty, a czworo znajomych w Lizbonie skończy z trzema płatnościami zamiast sześciu, które wychodzą, gdy waluty są osobno. [Dziel koszty wyjazdu grupowego](page:use-case/group-trips)."
  - heading: "Współlokatorzy"
    body: "Jedna osoba płaci właścicielowi, druga pamięta o rachunku za energię i nikt nie zgadza się, kto kupił papier toaletowy. Przy czynszu dzielonym według wielkości pokoju i pozostałych rachunkach dzielonych po równo czworo współlokatorów kończy miesiąc z trzema płatnościami, wszystkimi do osoby, która zapłaciła czynsz. [Dziel rachunki domowe ze współlokatorami](page:use-case/housemates)."
  - heading: "Imprezy, wesela i wspólne prezenty"
    body: "Sześć osób głosuje na prezent, jedna go kupuje i nie każdy dokłada tyle samo. Prezent za 150 £ podzielony według dokładnych kwot daje pięć płatności do osoby, która go kupiła, razem 120 £. [Dziel koszty wydarzenia](page:use-case/events-and-celebrations)."
  - heading: "Pary"
    body: "Dziel nudne koszty, nie zamieniając randki w kwartalny przegląd finansów. Czynsz dzielony 60/40 i zakupy spożywcze dzielone po równo sprowadzają się do jednej płatności między wami dwojgiem."
  - heading: "Najpierw zobacz, jak to działa"
    body: "Każdy z powyższych przykładów korzysta z tych samych kroków, od utworzenia grupy do rejestrowania płatności. [Jak to działa](page:how-it-works) przeprowadza przez nie, a [cennik](page:pricing) mówi, ile to kosztuje, czyli nic, bez reklam i bez dziennych limitów."
faq:
  heading: "Pytania"
  items:
    - q: "Czy każdy w grupie potrzebuje konta?"
      a: "Tak. Ludzie dołączają przez link lub kod QR i darmowe konto."
    - q: "Czy Side Badger może zbierać pieniądze?"
      a: "Nie. Płacisz, jak chcesz, a potem rejestrujesz płatność, żeby salda się zgadzały."
    - q: "Czy muszę wybrać jeden rodzaj grupy?"
      a: "Nie. Zastosowania to przykłady, a nie ustawienia. Każda grupa ma te same funkcje, więc korzystaj z takiego zestawu, jaki pasuje."
