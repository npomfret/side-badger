meta:
  title: "Що Side Badger робить, а що ні"
  description: "Розподіл, розрахунок і кілька валют, а також групи, списки та опитування. Повний набір і чесний перелік того, чого Side Badger не має."
h1: "Що робить Side Badger"
navLabel: "Можливості"
lead: "Усе, що є в коробці, і те, чого немає."
intro: "Ось повний набір. Таблицю ми пропустили навмисно. Почніть із трьох завдань, які Side Badger виконує щодня, а тоді перегляньте решту списку й короткий перелік того, чого він не робить."
cta:
  heading: "Чи робить він те, що потрібно вашій групі?"
  body: "Створіть безкоштовний обліковий запис і спершу спробуйте його з маленькою групою."
  button: "Створити безкоштовний обліковий запис"
cardsHeading: "Три завдання докладно"
sections:
  - heading: "Сканування чеків"
    body: "Сфотографуйте чек, і Side Badger заповнить загальну суму, дату та місце, щоб ви їх перевірили. Зображення чеків читає ШІ-сервіс Google."
  - heading: "Групи та дозволи"
    body: "Заведіть групу для кожного будинку, поїздки чи події, до 50 людей у ній. Запрошуйте людей за посиланням або QR-кодом. У більшій групі когось можна зробити глядачем, який бачить усе й нічого не змінює."
  - heading: "Списки та опитування"
    body: "Тримайте спільний список покупок поруч із чеками за покупки. Винесіть добірку вілл на голосування, за бажання анонімно."
  - heading: "Решта"
    items:
      - "**Оновлення наживо:** додайте витрату, і всі побачать її одразу."
      - "**Мови:** користуйтеся Side Badger 39 мовами. Кожен у групі може вибрати свою."
      - "**Головний екран:** магазин застосунків не потрібен. Увійдіть, а потім додайте Side Badger на головний екран, і він відкриється як застосунок. Налаштування в застосунку покажуть, як це зробити."
      - "**Відгуки:** трапилася помилка? Напишіть нам із застосунку й прочитайте нашу відповідь там."
  - heading: "Чого Side Badger не робить"
    items:
      - "**Не переказує гроші.** Side Badger ніколи не торкається ваших грошей. Платіть одне одному як зручно. Запити на платіж у планах."
      - "**Не повторює рахунки.** Регулярних витрат немає. Скопіюйте рахунок минулого місяця двома дотиками."
      - "**Не ділить за позиціями.** За одну витрату платить одна людина. Розподіляйте порівну, за точними сумами або у відсотках."
      - "**Не має нативного застосунку.** Він працює в браузері. Увійдіть, а потім додайте його на головний екран."
      - "**Не працює офлайн.** Йому потрібне з'єднання."
      - "**Не надсилає сповіщення електронною поштою чи SMS.** Сповіщення з'являються в застосунку. Push-сповіщення у планах."
      - "**Не малює діаграм чи бюджетів.** Він веде облік, хто кому винен, і в цьому весь фокус."
      - "**Не входить через Google чи Apple.** Реєструйтеся електронною поштою. Вхід через Google та Apple у планах."
      - "**Не пускає людей без облікового запису.** Кожному в групі потрібен безкоштовний обліковий запис."
faq:
  heading: "Запитання"
  items:
    - q: "Чи можу я платити через Side Badger?"
      a: "Ні. Side Badger веде облік і ніколи не торкається ваших грошей. Платіть одне одному як зручно, а потім запишіть платіж."
    - q: "Чи є мобільний застосунок?"
      a: "Не в магазині застосунків. Side Badger працює в браузері. Увійдіть на телефоні, а потім додайте його на головний екран, щоб він відкривався як застосунок. Налаштування в застосунку покажуть, як це зробити."
    - q: "Чи можна ділити за позиціями?"
      a: "Ні. Кожна витрата має одного платника, і ви розподіляєте її порівну, за точними сумами або у відсотках."
    - q: "Чи працює офлайн?"
      a: "Ні, потрібне з'єднання."
    - q: "Чи потрібен обліковий запис кожному в групі?"
      a: "Так. Кожному в групі потрібен безкоштовний обліковий запис, а для реєстрації достатньо електронної адреси."
