meta:
  title: "Como dividir as contas quando um dos dois ganha mais | Side Badger"
  description: "O 50/50 complica-se quando um dos dois ganha bem mais. Divide as despesas partilhadas pelo rendimento, com cálculos para duas pessoas e sem folha de cálculo."
h1: "Como dividir as contas quando um dos dois ganha mais"
navLabel: "Um dos dois ganha mais"
lead: "Soma o salário líquido de cada um, calcula a parte de cada pessoa no total e arredonda para percentagens inteiras. A Maya leva para casa 2 800 £ e o Jon 1 700 £, por isso dividem as contas partilhadas 62/38. Introduz essas percentagens numa despesa partilhada no Side Badger e copia-a sempre que a mesma conta voltar."
cta:
  heading: "Faz a conta uma só vez"
  body: "Cria uma conta grátis, faz um grupo para os dois e introduz a renda com as vossas percentagens. A renda do mês seguinte é uma cópia. Queres primeiro uma visita guiada? Vê [como funciona](page:how-it-works) ou [o que o grátis inclui](page:pricing)."
sections:
  - heading: "Dois salários, um apartamento, um silêncio educado"
    body: "A Maya e o Jon vivem juntos. A Maya leva para casa 2 800 £ por mês e o Jon leva 1 700 £. Durante dois anos dividiram tudo 50/50, porque era simples e nenhum queria ser quem tocava no assunto. Depois o Jon olhou para a renda sozinha. Metade de 1 400 £ são 700 £, que é um quarto do salário líquido da Maya e 41% do dele. Ninguém tinha sido injusto. Ninguém tinha feito a conta. Muitos [casais](page:use-case/couples) acabam por chegar aqui. Entre duas embalagens de comida para levar, combinaram que as contas partilhadas deviam pesar de forma parecida em cada salário."
  - heading: "O método, com as contas à vista"
    body: "Quatro passos, uma calculadora e uma conversa que de qualquer maneira ias ter."
    items:
      - "**Combinem o que conta como rendimento.** A Maya e o Jon usam o salário líquido, o dinheiro que cai no banco todos os meses. Juntos, somam 2 800 £ + 1 700 £ = 4 500 £."
      - "**Calcula a parte de cada um.** A da Maya é 2 800 ÷ 4 500, ou seja, 62,2%. A do Jon é 1 700 ÷ 4 500, ou seja, 37,8%."
      - "**Arredonda para percentagens inteiras.** 62,2% passa a 62 e 37,8% passa a 38. Com duas pessoas, arredonda um valor e subtrai-o a 100 para obter o outro, e a soma dá sempre 100."
      - "**Confirma o que significa.** Na renda de 1 400 £, a Maya paga 868 £ (62%) e o Jon paga 532 £ (38%). É cerca de 31% do salário líquido de cada um. Metade para cada um teria levado 25% do salário da Maya e 41% do do Jon."
  - heading: "Ler o mês"
    body: "A Maya pagou a renda de 1 400 £ e o Jon pagou as outras 216 £. A parte da Maya no mês é 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, e como ela pagou 1 400 £, tem 402,40 £ a receber. A parte do Jon é 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, e como ele pagou 216 £, deve 402,40 £. O Side Badger sugere um pagamento, do Jon para a Maya, de 402,40 £, e o [acerto de contas](page:feature/settle-up) regista-o depois de feito. Com a divisão 50/50, o mesmo mês teria o Jon a pagar 592,00 £ à Maya."
  - heading: "Prepara tudo no Side Badger"
    body: "Dez minutos, a maior parte passada nas percentagens."
    items:
      - "**Faz o grupo.** No painel, escolhe **Criar grupo** e dá-lhe o nome do apartamento. Escolhe **Convidar outras pessoas** e envia ao Jon o link ou o código QR. Ele inicia sessão ou cria uma conta grátis e escolhe o nome com que quer aparecer neste grupo. Só os membros podem ver um grupo, por isso este é só para os dois."
      - "**Adiciona a renda.** Escolhe **Adicionar despesa**. Introduz a descrição e o valor e, em **Quem pagou?**, escolhe a Maya. Mantém as duas pessoas em **Dividir entre** e, em **Como dividir**, escolhe **Percentagem** e escreve 62 e 38. O formulário avisa se as percentagens não somarem 100. Escolhe **Guardar despesa**."
      - "**Adiciona as outras contas.** A energia e a internet entram da mesma maneira, com o Jon como pagador e os mesmos 62 e 38. A comida para levar é uma despesa à parte, com **Como dividir** em **Igual**."
      - "**Copia-a no mês seguinte.** Abre a renda do mês passado e escolhe **Copiar despesa**. A cópia mantém o pagador, o valor e a divisão, e fica com a data de hoje. Muda o valor se a renda mudou e depois escolhe **Criar cópia**. A conta da energia funciona da mesma forma."
      - "**Vê quem deve a quem.** A secção **Saldos** mostra-o e sugere uma lista curta de pagamentos. Paguem-se como preferirem e depois registem o pagamento em **Acertar contas**."
  - heading: "50/50, por rendimento ou conta a conta"
    body: "Não há uma resposta certa, só aquela com que os dois conseguem viver. Eis três das mais comuns."
    items:
      - "**Metade para cada um em tudo.** A mais fácil de manter, e serve para casais com salários parecidos."
      - "**Por rendimento em tudo o que é partilhado.** É o que a Maya e o Jon fazem. Uma conversa, um par de percentagens."
      - "**Conta a conta.** Renda e contas por rendimento, férias e mimos 50/50 ou como combinarem, e cada conta tem a regra que lhe convém."
  - heading: "Combinem o que conta como partilhado"
    body: "As discussões costumam ser sobre a lista, não sobre as percentagens. A renda, a energia, a internet, as compras da semana e o sofá contam como partilhados na maioria das casas. O ginásio da Maya e a subscrição de futebol do Jon talvez não. Combinem a lista uma só vez, escrevam-na e ponham no grupo só os custos partilhados."
  - heading: "A comida para levar fica 50/50, de propósito"
    body: "Os mimos são pequenos e opcionais, e ninguém devia precisar de uma calculadora para pedir uns dumplings. No Side Badger, a comida para levar é só mais uma despesa. O Jon paga 36 £, **Como dividir** fica em **Igual** e cada um deve 18 £."
  - heading: "Quando o salário muda"
    body: "Um aumento, um emprego novo ou um período sem trabalhar muda a conta. Calcula as novas percentagens da mesma maneira e usa-as a partir da despesa seguinte. As despesas anteriores ficam como estavam. Copia a renda do mês passado, muda as percentagens e escolhe **Criar cópia**. Para corrigir uma que já lá esteja, edita-a se as permissões do grupo o permitirem e avisa primeiro a outra pessoa, porque os saldos mudam. A versão anterior fica guardada. Combinem quando vão voltar a calcular, por exemplo uma vez por ano, e acertem as contas antes de mudar, para a divisão antiga fechar com a conta certa."
  - heading: "O que o Side Badger não faz aqui"
    items:
      - "Nunca pergunta quanto alguém ganha e não calcula as percentagens. Escreves os valores que combinaram."
      - "Não consegue definir uma divisão por defeito para o grupo todo. As percentagens vão em cada despesa, por isso copia uma que já as tenha."
      - "Não tem contas recorrentes, por isso copias a renda do mês passado de cada vez."
      - "Nunca movimenta dinheiro. Pagam-se como preferirem e registam o pagamento."
