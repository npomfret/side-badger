faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Είναι δωρεάν η αριθμομηχανή;"
      a: "Ναι. Δωρεάν. Χωρίς διαφημίσεις. Χωρίς ημερήσια όρια. Ούτε λογαριασμό χρειάζεστε."
    - q: "Αποθηκεύει ό,τι πληκτρολογώ;"
      a: "Όχι. Τίποτα δεν αποθηκεύεται ούτε στέλνεται πουθενά. Για να κρατήσετε τα ποσά σας, χρησιμοποιήστε το «Αντιγραφή συνδέσμου» και αποθηκεύστε τον σύνδεσμο κάπου."
    - q: "Ποιος μπορεί να δει τον σύνδεσμο που αντιγράφω;"
      a: "Όποιος τον έχει. Τα ποσά βρίσκονται μέσα στον ίδιο τον σύνδεσμο, μετά το #, οπότε στείλτε τον μόνο στα άτομα που πρέπει να τα δουν."
    - q: "Μετακινεί χρήματα;"
      a: "Όχι. Βρίσκει ποιος πρέπει να πληρώσει ποιον και πληρώνετε ο ένας τον άλλον όπως θέλετε. Ούτε το Side Badger αγγίζει ποτέ τα χρήματά σας. Δείτε την [εκκαθάριση](page:feature/settle-up)."
    - q: "Μπορώ να χωρίσω ένα ταξίδι που πληρώθηκε σε δύο νομίσματα;"
      a: "Όχι εδώ, επειδή ένας υπολογισμός έχει ένα νόμισμα. Σε μια ομάδα, κάθε νόμισμα κρατά το δικό του υπόλοιπο. Δείτε τα [πολλά νομίσματα](page:feature/multiple-currencies)."
    - q: "Τι γίνεται αν τα ποσά δεν βγαίνουν;"
      a: "Η αριθμομηχανή το λέει κάτω από το έξοδο και δεν δείχνει αποτέλεσμα μέχρι να βγουν. Τα ακριβή ποσά πρέπει να αθροίζονται στο σύνολο και τα ποσοστά να κάνουν 100."
