sections:
  - heading: "Što Splitwise radi dobro"
    body: "Ako tvojoj grupi treba izvorna aplikacija, rad izvan mreže ili plaćanje unutar aplikacije, Splitwise je razuman izbor i radije bismo da ga odabereš nego da to otkriješ poslije. Njegove vlastite stranice navode:"
    items:
      - "**Aplikacije i rad izvan mreže.** Aplikacije za iPhone i Android uz web te način rada izvan mreže."
      - "**Više načina podjele.** Udjeli, prilagodbe i podjele po stavkama, povrh jednake, točne i po postocima."
      - "**Ponavljajući troškovi.** Postavi da se najamnina ponavlja i zaboravi na nju."
      - "**Plaćanje u aplikaciji.** U nekim državama može i premjestiti novac, putem usluga Splitwise Pay, Venmo, PayPal ili Pay by Bank."
  - heading: "Ovdje besplatno, tamo plaćeno"
    body: "Splitwise Pro je Splitwiseov plaćeni plan, a njegova vlastita stranica Pro prodaje četiri stvari koje u Side Badgeru ne koštaju ništa."
    items:
      - "**Skeniranje računa.** Splitwise Pro skenira fotografiju tvog računa. Side Badger to radi besplatno, bez kredita za skeniranje: popunjava ukupni iznos, datum i mjesto da ih provjeriš. Slike računa čita Googleova AI usluga."
      - "**Pretvorba valuta.** Splitwise Pro pretvara troškove grupe u tvoju zadanu valutu kad dodirneš Convert. Side Badger pretvara svaki trošak dok ga unosiš, po aktualnom tečaju ili po onom koji si stvarno dobio/la, a izvorni iznos ostaje uz trošak."
      - "**Bez oglasa.** Splitwise navodi potpuno iskustvo bez oglasa kao značajku Pro. Side Badger nema oglasa."
      - "**Bez dnevnih ograničenja.** Splitwise Pro prodaje neograničen broj troškova, a njegov centar za pomoć kaže da besplatni korisnici mogu dodati do 4 troška dnevno. Side Badger nema dnevnih ograničenja."
  - heading: "Što Splitwise ima, a Side Badger nema"
    body: "Ovo nisu sve Splitwiseove značajke, samo one koje obično odlučuju. Cijeli popis nalazi se na Splitwiseovim stranicama. Evo gdje Side Badger zaostaje."
    items:
      - "**Izvorne aplikacije.** Side Badger radi u pregledniku. Prijavi se, a zatim ga dodaj na početni zaslon i otvara se kao aplikacija."
      - "**Rad izvan mreže.** Side Badgeru treba veza."
      - "**Plaćanje u aplikaciji.** Side Badger nikad ne dira tvoj novac. Platite si kako god želite, a zatim zabilježite uplatu."
      - "**Ponavljajući troškovi.** Side Badger ih nema. Kopiraj prošlomjesečnu najamninu umjesto da je ponovno upisuješ."
      - "**Podjela po udjelima ili po stavkama.** Side Badger ima jednog platitelja po trošku, a trošak se dijeli jednako, po točnim iznosima ili po postocima. Njegovo skeniranje računa ne dodjeljuje stavke osobama."
      - "**Grafikoni i zadane podjele.** Splitwise Pro ima oboje. Side Badger vodi evidenciju tko kome duguje, i to je cijeli trik."
  - heading: "Prelazak tvoje grupe"
    body: "Nema uvoznika, pa selidba znači novi početak. Najprije se poravnajte u Splitwiseu, zatim napravi grupu u Side Badgeru i pozovi sve poveznicom ili QR kodom. Svatko u grupi treba besplatan korisnički račun, a za registraciju je dovoljna e-adresa."
