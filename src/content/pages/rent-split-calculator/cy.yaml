faq:
  heading: "Cwestiynau"
  items:
    - q: "Pa un sy'n decach, maint ystafell neu incwm?"
      a: "Nid yw'r naill na'r llall yn decach bob tro. Mae maint ystafell yn addas i gyd-letywyr sy'n talu am y lle maen nhw'n cysgu ynddo. Mae incwm yn addas i gyplau a ffrindiau ar gyflogau gwahanol iawn. Cytunwch arno cyn y diwrnod rhent cyntaf, nid ar ei ôl."
    - q: "Ddylai'r biliau gael eu rhannu yr un ffordd?"
      a: "I gyd-letywyr, fel arfer ddim. Mae pawb yn defnyddio'r ynni a'r band eang, felly mae cyfartal yn symlach, fel yn yr enghraifft. Yn ôl incwm, mae'r gyfrifiannell yn rhoi'r un cyfrannau i'r biliau ag i'r rhent."
    - q: "Alla i ddefnyddio troedfeddi sgwâr?"
      a: "Gallwch. Dewiswch ft² a theipiwch eich arwynebeddau mewn troedfeddi sgwâr. Dim ond label yw'r uned, ac mae'r cyfrannau'n dod allan yr un fath cyn belled â bod pawb yn defnyddio'r un uned."
    - q: "Ydy'r gyfrifiannell am ddim?"
      a: "Ydy. Am ddim. Dim hysbysebion. Dim cyfyngiadau dyddiol. Does dim angen cyfrif arnoch chwaith."
