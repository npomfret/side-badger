sections:
  - heading: "Splitwise-k ondo egiten duena"
    body: "Zure taldeak aplikazio natibo bat, konexiorik gabeko erabilera edo aplikazioaren barruko ordainketak behar baditu, Splitwise da aukera zentzuduna, eta nahiago dugu hura aukeratzea geroago jakitea baino. Bere orrietan hau zerrendatzen da:"
    items:
      - "**Aplikazioak eta konexiorik gabeko erabilera.** iPhone eta Android aplikazioak eta weba, eta konexiorik gabeko modu bat."
      - "**Banatzeko modu gehiago.** Zatien, doikuntzen eta elementuen arabera banatzea, berdin, zenbateko zehatzen eta ehunekoen arabera banatzeaz gain."
      - "**Gastu errepikariak.** Ezarri alokairua errepika dadin eta ahaztu."
      - "**Aplikazioaren barruko ordainketak.** Herrialde batzuetan dirua ere mugi dezake, Splitwise Pay, Venmo, PayPal edo Pay by Bank bidez."
  - heading: "Hemen doakoa, hor ordainpekoa"
    body: "Splitwise Pro Splitwise-ren ordainpeko plana da, eta bere Pro orriak Side Badger-en ezer kostatzen ez duten lau gauza saltzen ditu."
    items:
      - "**Tiketen eskaneatzea.** Splitwise Pro-k zure tiketaren argazkia eskaneatzen du. Side Badger-ek doan egiten du, eskaneatze-kreditu gabe: guztizkoa, data eta lekua betetzen ditu zuk egiazta ditzazun. Tiketen irudiak Googleren adimen artifizialeko zerbitzuak irakurtzen ditu."
      - "**Moneta-bihurketa.** Splitwise Pro-k taldeko gastuak zure lehenespeneko monetara bihurtzen ditu “Convert” sakatzen duzunean. Side Badger-ek gastu bakoitza sartzen duzunean bihurtzen du, egungo kanbio-tasa batekin edo benetan lortu zenuenarekin, eta jatorrizko zenbatekoa gastuan geratzen da."
      - "**Iragarkirik ez.** Splitwise-k iragarkirik gabeko esperientzia osoa Pro ezaugarri gisa zerrendatzen du. Side Badger-ek ez du iragarkirik."
      - "**Eguneko mugarik ez.** Splitwise Pro-k gastu mugagabeak saltzen ditu, eta bere laguntza-zentroak dio doako erabiltzaileek egunean gehienez 4 gastu gehi ditzaketela. Side Badger-ek ez du eguneko mugarik."
  - heading: "Splitwise-k duena eta Side Badger-ek ez duena"
    body: "Hau ez da Splitwise-ren ezaugarri guztien zerrenda, erabakitzen ohi dutenak baizik. Splitwise-ren orrietan zerrenda osoa dago. Hona non gelditzen den Side Badger motz."
    items:
      - "**Aplikazio natiboak.** Side Badger zure nabigatzailean dabil. Hasi saioa, eta gero gehitu hasierako pantailara eta aplikazio bat bezala irekitzen da."
      - "**Konexiorik gabeko modua.** Side Badger-ek konexioa behar du."
      - "**Aplikazioaren barruko ordainketak.** Side Badger-ek ez du inoiz zure dirua ukitzen. Ordaindu elkarri nahi duzuen moduan, eta gero erregistratu ordainketa."
      - "**Gastu errepikariak.** Side Badger-ek ez du. Kopiatu joan den hilabeteko alokairua berriro idatzi beharrean."
      - "**Zatien edo elementuen arabera banatzea.** Side Badger-ek ordaintzaile bakarra du gastu bakoitzeko, berdin, zenbateko zehatzen arabera edo ehunekoen arabera banatua. Bere tiketen eskaneatzeak ez ditu elementuak pertsonei esleitzen."
      - "**Grafikoak eta lehenetsitako banaketak.** Splitwise Pro-k bi gauzak ditu. Side Badger-ek nork nori zor dion kontatzen du, eta hori da trikimailu osoa."
  - heading: "Zure taldea aldatzea"
    body: "Ez dago inportatzailerik, beraz aldatzeak hasiera berria esan nahi du. Kitatu lehenik Splitwise-n, eta gero sortu talde bat Side Badger-en eta gonbidatu denak esteka edo QR kode batekin. Taldeko guztiek doako kontu bat behar dute, eta izena emateko posta elektroniko bat besterik ez da behar."
