faq:
  heading: "Pytania"
  items:
    - q: "Użyć pensji brutto czy na rękę?"
      a: "Decyduje grupa. Pensja na rękę jest częstym wyborem, bo to pieniądze, które faktycznie macie do wydania. Brutto pomija to, że podatek, składki emerytalne i spłaty kredytów zabierają z różnych pensji różne kwoty. Cokolwiek wybierzecie, użyjcie tej samej miary dla obojga."
    - q: "Czy Side Badger widzi nasze zarobki?"
      a: "Nie. Wpisujesz tylko procenty, nigdy pensje. Procenty widzą członkowie grupy, a w przypadku pary to wy dwoje."
    - q: "Czy możemy ustawić 62/38 raz dla wszystkiego?"
      a: "Podział ustawia się przy wydatku, nie przy grupie. Skopiuj wydatek, który już ma 62 i 38, a potem zmień to, co się różni. Pozostałe opcje opisuje [dzielenie wydatków](page:feature/split-expenses)."
