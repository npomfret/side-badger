meta:
  title: "Діліть рахунки з партнером: 50/50 чи за доходом | Side Badger"
  description: "Діліть буденні витрати, не перетворюючи побачення на квартальний фінзвіт. Діліть 50/50, за доходом чи рахунок за рахунком і бачте, хто кому винен. Безкоштовно."
h1: "Справедливо ділити витрати парою"
navLabel: "Пари"
lead: "Діліть буденні витрати, не перетворюючи побачення на квартальний фінансовий звіт. Side Badger веде один поточний облік оренди, рахунків і закупів для **пар**, які ділять дім, диван і туманну пам'ять про те, хто платив за інтернет. Діліть 50/50, за доходом чи рахунок за рахунком і бачте, хто кому винен."
cta:
  heading: "Заведіть групу для двох"
  body: "Створіть обліковий запис, заведіть групу й надішліть партнеру посилання із запрошенням. Першою витратою може стати сьогоднішня їжа на винос."
scenario:
  heading: "Справедливо не завжди означає 50/50"
  body: "Сем і Алекс ділять дім. Сем заробляє більше, тож вони домовилися, що Сем бере 60 % оренди, а Алекс 40 %. Сем платить орендодавцю, Алекс робить закупи, і обоє доволі певні, що все сходиться. «Доволі певні» — так нотатка в чиємусь телефоні стає постійною незгодою. Тож заведіть групу для вас двох, оберіть ім'я, яке хочете, щоб бачив партнер, і надішліть йому посилання із запрошенням або QR-код. Додавайте кожну витрату, коли вона трапляється, вказуйте, хто платив і як вона ділиться, і нехай група веде облік. Заведіть окрему групу для кожної відпустки (дивіться [групові подорожі](page:use-case/group-trips)), щоб квитки не потрапляли до продуктів."
sections:
  - heading: "50/50, за доходом чи рахунок за рахунком"
    body: "Універсально справедливого розподілу не існує, є лише той, на який ви обоє погодилися, найкраще до першого рахунку, а не після першого зітхання. Ось три звичні."
    items:
      - "**50/50.** Оберіть **Порівну**, і кожен винен половину. Пасує для спільних витрат, коли ваші доходи близькі, і не потребує жодної арифметики."
      - "**За доходом.** Якщо один із вас заробляє більше, діліть за часткою кожного в тому, що надходить. Спершу домовтеся, що враховувати (зазвичай це дохід на руки), додайте обидва числа й поділіть своє на суму. Якщо один отримує на руки три частини, а другий дві, це 3 ÷ (3 + 2) = 60 %, тож один покриває 60 %, а другий 40 %. Округліть до цілих відсотків і введіть їх у **Відсоток**, де вони мають у сумі давати 100. Місця, де вводити зарплату, немає, тож ви завжди вводите лише відсотки."
      - "**Рахунок за рахунком.** У кожної витрати свій розподіл, тож можна поєднувати: оренда за доходом, продукти 50/50, а спільний подарунок за **Точні суми**, якщо кожен обирав, скільки вкласти."
      - "**Коли зарплата змінюється,** використовуйте нові відсотки з наступної витрати. Попередні витрати зберігають розподіл, з яким їх було внесено. Щоб побачити розрахунки на справжніх розрахункових листках, читайте [як ділити рахунки з партнером, який заробляє більше](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "Щомісячний підсумок"
    body: "Раз на місяць або щойно цифри почнуть свербіти, відкрийте групу й перегляньте **Баланси**. Коли вас двоє, у кожній валюті завжди лише один платіж, від того, хто винен, до того, кому винні. Візьмімо місяць Сема й Алекса. Сем заплатив оренду 1 500 £, і 40 % Алекса становлять 600 £. Алекс заплатив 90 £ за продукти, розділені порівну, тож половина Сема — 45 £. Side Badger зараховує одне проти одного, 600 £ мінус 45 £, і Алекс платить Сему 555 £. Платіть як зручно, банківським переказом, готівкою чи боргом послуги, а потім запишіть це в **Розрахуватися**, щоб баланс повернувся до нуля. Регулярних рахунків немає, тож скопіюйте оренду минулого місяця, змініть дату й рухайтеся далі. Side Badger не переказує гроші й не надсилає нагадувань, тож підштовхнути все одно вам."
  - heading: "Тільки ви двоє"
    body: "У групі двох є двоє учасників, а бачити групу можуть лише її учасники. Партнер приєднується за посиланням із запрошенням або QR-кодом. Посилання може діяти від 15 хвилин до 5 днів, тож оберіть найкоротше, якого партнеру вистачить, щоб ним скористатися. Створення нового посилання не скасовує старі, тож не залишайте їх у чаті, де є інші люди. Приєднатися може кожен, хто скористався чинним посиланням, тож для певності ввімкніть схвалення, і адміністратор впустить кожного. Партнеру потрібен власний обліковий запис, який безкоштовний."
exampleAfter: 2
example:
  heading: "Хто кому винен цього місяця"
  currency: GBP
  people:
    - id: sam
      name: Сем
    - id: alex
      name: Алекс
  expenses:
    - label: "Оренда"
      payer: sam
      amount: 1500
      split:
        method: percent
        shares:
          sam: 60
          alex: 40
    - label: "Продукти"
      payer: alex
      amount: 90
      split:
        method: equal
featuresHeading: "Можливості, які використовує пара"
faq:
  heading: "Запитання"
  items:
    - q: "Чи можна один раз задати 60/40 для всього?"
      a: "Ні. Розподіл належить кожній витраті. Задайте відсотки для першої, а наступного разу скопіюйте її й змініть те, що відрізняється. [Розподіл витрат](page:feature/split-expenses) охоплює всі три способи."
    - q: "Чи підключається він до нашого банку?"
      a: "Ні. Side Badger ніколи не торкається ваших грошей. Ви платите одне одному як зручно, а потім записуєте це, як пояснює [розрахунок](page:feature/settle-up)."
    - q: "Чи може хтось інший бачити нашу групу?"
      a: "Лише її учасники, а в групі пари їх двоє. Приєднатися може кожен, хто скористався чинним посиланням із запрошенням, тож діліться ним з однією людиною й задайте короткий строк дії."
    - q: "Що, якщо ми обоє заплатили частину того самого рахунку?"
      a: "У витрати один платник. Запишіть дві витрати, по одній від кожного з вас, і баланс вийде той самий."
    - q: "Чи нагадає він партнеру заплатити?"
      a: "Ні. Нагадувань немає, тож підштовхнути все одно вам. Принаймні ви обоє дивитиметеся на те саме число."
    - q: "Що буде, коли ми припинимо ділити витрати?"
      a: "Розрахуйте баланс і запишіть платіж, щоб ніхто нічого не був винен. Потім адміністратор може заблокувати групу, що збереже цифри як є, або закрити її назавжди, що зробить її недоступною для всіх. Закривайте, лише коли жодному з вас не потрібна історія."
