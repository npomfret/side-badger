meta:
  title: "Orodha, kura na maoni ya pamoja kwa gharama za kikundi | Side Badger"
  description: "Toa maoni kwenye gharama, hoji ile ya ajabu, weka orodha ya ununuzi ya pamoja na pigeni kura kuhusu villa. Pangeni matumizi pamoja, kisha mgawanye. Bure, bila matangazo."
h1: "Pangeni pamoja, mgawanye baadaye"
navLabel: "Pangeni pamoja"
lead: "Orodha ya ununuzi na bili ya ununuzi, hatimaye zinazungumzana. Side Badger inaipa kikundi chako mahali pa kuzungumzia pesa kabla na baada ya kutumika, kukiwa na maoni kwenye kila gharama, njia ya kuhoji zile zinazoonekana kukosea, orodha za pamoja na kura kwa maamuzi makubwa. Kisha mnafanya [kugawanya gharama](page:feature/split-expenses) kama kawaida."
cta:
  heading: "Panga, kisha ugawanye"
  body: "Fungua akaunti ya bure, anzisha kikundi na weka orodha, kura au swali la kwanza kando ya pesa. Huna uhakika nini kinafuata? Tazama [jinsi inavyofanya kazi](page:how-it-works)."
problem:
  heading: "Gumzo liko huku, bili iko kule"
  body: "Matumizi ya kikundi kwa kawaida huishi mahali pawili. Nambari ziko sehemu moja, na mabishano kuhusu nambari yako kwenye gumzo lililosogea mbali Jumanne. Orodha ya ununuzi ni picha ya friji. Villa iliamuliwa kwa dole gumba la watu wengi, pengine. Side Badger huweka mipango ndani ya kikundi, kando ya gharama zinazohusika, kwa hivyo kuna maoni palipo gharama, orodha palipo ununuzi, kura kwa uamuzi mkubwa, na njia ya kusema “subiri kidogo, hii ni sahihi?” bila kuandika aya nzima. Yote hubaki kuhusu pesa za kikundi, ndiyo kazi ya kikundi."
workflow:
  heading: "Kutoka kura ya villa hadi bili ya ununuzi"
  steps:
    - title: "Weka uamuzi mkubwa kwenye kura"
      body: "Ongeza kura kwa uamuzi unaoamua bili, kama ni villa ipi. Chagua chaguo mbili hadi kumi, sema kila mtu ana kura ngapi, kisha ifunge kila mtu akishapiga na mshindi ataonyeshwa."
      shot: S17
      shotAlt: "Kura iliyofungwa yenye chaguo lililoshinda limetiwa alama na idadi ya kura kando ya kila chaguo"
    - title: "Andikeni orodha ya ununuzi pamoja"
      body: "Anzisheni orodha ya pamoja, ongezeni vitu na viwekeeni tiki vinapofika kwenye kikapu. Ununuzi unaingia baadaye kama gharama."
      shot: S16
      shotAlt: "Orodha ya ununuzi ya pamoja yenye vitu vichache vilivyowekewa tiki na idadi ya maendeleo"
    - title: "Zungumzeni kuhusu gharama palipo"
      body: "Toa maoni kwenye gharama yenyewe, ambatisha risiti na uitikie kwa emoji. Mazungumzo yanabaki kando ya nambari inayohusika."
      shot: S08
      shotAlt: "Gharama yenye maelezo yake, picha ndogo ya risiti, mazungumzo ya maoni na miitikio ya emoji"
    - title: "Hoji ile inayoonekana kukosea"
      body: "Kikundi kikiwa kimewasha maswali ya gharama, yeyote aliyejumuishwa kwenye gharama anaweza kuchagua **Nina swali**. Gharama inabaki nje ya salio hadi swali litakaposhughulikiwa."
      shot: S18
      shotAlt: "Orodha ya gharama yenye alama ya Inahojiwa na kichujio cha Inahojiwa tu"
    - title: "Ona nini kilibadilika, na nani alibadilisha"
      body: "Mlisho wa shughuli na kengele ya arifa vinaonyesha kipya katika vikundi vyako vyote. Arifa za push zipo ukizitaka."
      shot: S19
      shotAlt: "Orodha ya arifa iliyofunguka na orodha ya shughuli za hivi karibuni"
