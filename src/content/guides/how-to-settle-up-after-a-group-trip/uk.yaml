meta:
  title: "Як розрахуватися після групової поїздки | Side Badger"
  description: "Розрахуйтеся, поки всі не роз'їхалися. Десять заплутаних боргів стають чотирма платежами, записаними по мірі надходження. Часткова оплата теж годиться."
h1: "Як розрахуватися після групової поїздки"
navLabel: "Розрахунок після поїздки"
lead: "Розрахуйтеся, поки всі не роз'їхалися. Додайте останню витрату, відкрийте баланси групи й заплатіть те, що винні, за коротким списком, як зручно. Потім запишіть кожен платіж у Side Badger, щоб баланс очистився для всієї групи. Для п'ятьох друзів і п'яти витрат десять заплутаних боргів зводяться до чотирьох платежів."
cta:
  heading: "Закрийте рахунки, поки не посипалися фото"
  body: "Створіть безкоштовний обліковий запис, заведіть групу для наступної поїздки й додавайте кожну витрату по ходу. Короткий список платежів чекатиме на вас, поки ви дістанетеся аеропорту. Хочете спершу побачити, [як працює розрахунок](page:feature/settle-up)?"
sections:
  - heading: "П'ятеро друзів, п'ять витрат, один зал вильоту"
    body: "Мо, Інес, Раф, Тесс і Ума провели тиждень на узбережжі. Мо забронював квартиру й купив продукти, Інес заплатила за прогулянку на човні, а Раф оплатив велику вечерю. Тесс взяла таксі до аеропорту з Умою та Мо, бо Інес і Раф їхали потягом. Картка Уми лишилася вдома, тож вона не платила ні за що. Це п'ять витрат і 1 700 € разом, а в залі вильоту ніхто не міг сказати, хто в плюсі."
  - heading: "Десять боргів, чотири платежі"
    body: "Квартира, човен, вечеря й продукти діляться порівну на п'ятьох. Це 200 €, 50 €, 60 € і 18 € на кожного, тож Інес і Раф винні по 328 €. Таксі ділять утрьох по 20 €, тож Мо, Тесс і Ума винні 348 €. Мо заплатив 1 090 € і винен 348 €, тож йому винні 742 €. Усі інші заплатили менше, ніж винні. Уми не вистачає 348 €, Тесс 288 €, Інес 78 €, а Рафа 28 €, і це разом дає 742 € Мо. Якщо розраховувати кожну пару людей напряму, вийде десять окремих боргів. Side Badger натомість пропонує чотири платежі, усі Мо."
  - heading: "Розрахуйтеся, поки всі не роз'їхалися"
    body: "Найкращий момент — останній вечір або дорога додому, поки всі ще в одному місці й борг у 28 € легко згадати. Спершу додайте всі витрати, таксі теж. Ніхто не може покинути групу, поки винен гроші або йому їх винні, тож підрахунок усе одно колись доведеться закрити."
    items:
      - "**Перевірте список.** Відкрийте групу й подивіться **Баланси**. За замовчуванням ви бачите борги, у яких берете участь. Оберіть **Показати все**, щоб побачити список усієї групи."
      - "**Платіть як зручно.** Банківський переказ, готівка, послуга за борг з минулої відпустки. Side Badger не переказує гроші."
      - "**Запишіть.** Оберіть **Розрахуватися**. У **Швидкий розрахунок** кожна кнопка — це один із запропонованих вам платежів, і вибір кнопки підставляє суму. Додайте **Примітка**, наприклад «банківський переказ», перевірте **Дата** (вона не може бути в майбутньому) й оберіть **Записати розрахунок**."
      - "**Дивіться, як воно очищується.** Баланс оновлюється для всіх. Коли надходить останній платіж, у **Баланси** з'являється **Все розраховано!**"
  - heading: "Платити частину зараз, решту потім"
    body: "Ума може надіслати 200 € сьогодні ввечері, а решту в кінці місяця. Вона записує 200 €, і форма попереджає, що після цього вона все ще буде винна Мо 148 €, тобто 348 € мінус 200 €. Збережіть, і 148 € лишаються на її балансі, доки вона не запише решту. Попередження працює і в інший бік. Якщо зайвий нуль перетворить 348 € на 3 480 €, форма скаже, що вона винна Мо лише 348 € і що збереження створить борг у протилежному напрямку. Виправте нуль, перш ніж зберігати."
  - heading: "Виправляємо помилки й вітаємо платежі"
    items:
      - "**Неправильний платіж.** Редагувати платіж може лише той, хто його записав. Він або адміністратор групи може його видалити, і тоді його можна записати знову."
      - "**Платіж, гідний уваги.** Кожен записаний платіж стоїть в **Історія платежів** з датою й приміткою, де кожен у групі може його побачити й відреагувати. Мо може обрати **Святкувати**, коли надійде останні 148 € Уми."
      - "**Кінець.** Коли всі баланси дорівнюють нулю, адміністратор може заблокувати групу, щоб цифри лишалися на місці."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він ніколи не переказує гроші. У ньому немає посилань на оплату чи запитів на платіж, тож платіж у застосунку — це запис про платіж, здійснений деінде."
      - "Він не надсилає нагадувань. Наздоганяти того, хто запізнюється з платежем, як і раніше, маєте ви."
      - "Він не встановлює строків. Коли належить решта 148 € Уми, група домовляється сама."
      - "Запропоновані платежі — це короткий список, а не обіцянка найкоротшого з можливих. Їх обчислюють для кожної валюти окремо, тож поїздка, оплачена в євро та фунтах, отримує список для кожної."
