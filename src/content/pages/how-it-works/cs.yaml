meta:
  title: "Jak funguje Side Badger | Dělení výdajů skupiny v pěti krocích"
  description: "Vytvořte skupinu, pozvěte lidi, přidávejte výdaje a vyrovnejte se. Podívejte se, co se děje mezi „někdo zaplatil“ a „jsme si kvit“, na názorném příkladu."
h1: "Jak funguje Side Badger"
navLabel: "Jak to funguje"
lead: "Co se děje mezi „někdo zaplatil“ a „jsme si kvit“? Pět kroků, žádná tabulka a jeden jezevec, který je většinou na ozdobu. Tady je celá cesta, od první skupiny po poslední zaznamenanou platbu. Podrobnosti o kterémkoli kroku najdete v části [dělení výdajů](page:feature/split-expenses) a [vyrovnání](page:feature/settle-up)."
cta:
  heading: "Od „platím já“ po „jsme si kvit“"
  body: "Vytvořte si účet zdarma, založte skupinu a přidejte první výdaj. Jezevec účtenku nesoudí."
  button: "Vytvořit účet zdarma"
steps:
  - title: "Vytvořte skupinu"
    body: "Založte jednu skupinu pro každý dům, výlet nebo akci, aby se nájem nikdy nedostal do stejného seznamu jako svatební dar. Dejte jí název, vyberte jméno, pod kterým vás lidé uvidí, a pokud chcete, omezte měny, které přijímá. Váš přehled pak na jedné obrazovce ukazuje všechny skupiny a to, jak v každé stojíte."
    shot: S02
    shotAlt: "Dialog pro vytvoření skupiny s otevřenou částí omezení měn"
  - title: "Pozvěte své lidi"
    body: "Sdílejte odkaz k připojení nebo ukažte QR kód a nastavte, jak dlouho platí, od 15 minut až po 5 dní. Každý, kdo se připojí, potřebuje bezplatný účet a ověřený e-mail a skupina pojme až 50 lidí. Pokud chcete mít přehled, kdo vstoupí, zapněte schvalování a správce každou osobu pustí dovnitř."
    shot: S03
    shotAlt: "Dialog pozvánky na záložce s odkazem, s QR kódem a možnostmi platnosti"
  - title: "Přidávejte výdaje, jak vznikají"
    body: "Řekněte, kdo platil, kolik a za koho. Rozdělte rovnoměrně, podle přesných částek nebo procentuálně a vynechte každého, kdo u toho nebyl. Přidejte výdaj a všichni ho hned uvidí, spolu s tím, co se změnilo a kdo to změnil."
    shot: S05
    shotAlt: "Formulář výdaje s procentuálním rozdělením nájmu podle velikosti pokoje"
  - title: "Sledujte zůstatky"
    body: "Side Badger vede průběžný zůstatek pro každou měnu, takže na první pohled vidíte, kdo komu dluží. Místo aby nechal všechny rozplétat změť drobných dluhů, navrhne krátký seznam plateb, který skupinu vyrovná."
    shot: S10
    shotAlt: "Obrazovka zůstatků se zjednodušenými dluhy ve dvou měnách a zapnutou volbou Zobrazit vše"
  - title: "Vyrovnejte se mimo aplikaci, zaznamenejte to v ní"
    body: "Side Badger nikdy nepřesouvá peníze. Zaplaťte si, jak chcete, a pak platbu zaznamenejte, aby zůstatky držely krok, a obrazovka každého se aktualizuje bez obnovení. „Vyrovnáno“ znamená jednoduše to, že zůstatky jsou nula. Nikdo nemůže skupinu opustit, dokud dluží nebo se mu dluží peníze, takže kdo míří ke dveřím, nejdřív se vyrovná."
    shot: S11
    shotAlt: "Formulář platby s tlačítky rychlého vyrovnání a upozorněním na částečnou platbu"
requirements:
  heading: "Co potřebujete"
  items:
    - "Bezplatný účet. Stačí e-mailová adresa a heslo a před přidáním čehokoli e-mail ověříte."
    - "Mít alespoň 18 let."
    - "Moderní prohlížeč v telefonu nebo počítači a připojení. Side Badger není aplikace z obchodu a nefunguje offline."
    - "Volitelně místo na domovské obrazovce. Obchod s aplikacemi není potřeba, protože Side Badger můžete přidat na domovskou obrazovku nebo do docku a otevírá se jako aplikace."
