meta:
  title: "Μοιράστε μια βίλα ανάλογα με τις νύχτες διαμονής | Side Badger"
  description: "Ο Ντεβ ήρθε μόνο για τρεις νύχτες, γιατί να πληρώσει για έξι; Μοιράστε μια βίλα διακοπών ανάλογα με τις νύχτες που έμεινε ο καθένας, με τις πράξεις έτοιμες."
h1: "Πώς να μοιράσετε μια βίλα διακοπών όταν ο καθένας μένει διαφορετικές νύχτες"
navLabel: "Βίλα ανάλογα με τις νύχτες"
lead: "Βρείτε την τιμή της διαμονής ανά άτομο και ανά νύχτα, πολλαπλασιάστε με τις νύχτες του καθενός και καταχωρίστε τη βίλα ως **ένα έξοδο με ακριβή ποσά**. Το Side Badger κρατά τον λογαριασμό και προτείνει μια σύντομη λίστα πληρωμών όταν έρθει η ώρα να τακτοποιηθείτε."
cta:
  heading: "Δώστε στη βίλα ένα τακτοποιημένο έξοδο"
  body: "Φτιάξτε μια ομάδα, προσκαλέστε όλους με σύνδεσμο ή κωδικό QR και καταχωρίστε τη βίλα με ακριβή ποσά. Το Side Badger κρατά τον τρέχοντα λογαριασμό όσο εσείς απολαμβάνετε τις διακοπές."
sections:
  - heading: "Έξι νύχτες, τέσσερα άτομα, μία πιστωτική κάρτα"
    body: "Ένα [ομαδικό ταξίδι](page:use-case/group-trips) ξεκινά συνήθως με την κάρτα ενός ανθρώπου. Εδώ είναι της Άνας. Κλείνει μια βίλα για έξι νύχτες, 2.100 €, επειδή κάποιος πρέπει να πάει πρώτος. Η Άνα, ο Μπεν και η Κλόι μένουν και τις έξι νύχτες. Ο Ντεβ μπορεί να έρθει μόνο για τις τρεις τελευταίες και έρχεται με τρένο. Ο Μπεν νοικιάζει αυτοκίνητο, στο οποίο ο Ντεβ δεν μπαίνει ποτέ. Ο Ντεβ κάνει τα μεγάλα ψώνια. Το να μοιραστεί η βίλα στα τέσσερα είναι η προφανής κίνηση. Έτσι όμως ο Ντεβ πληρώνει για τρεις νύχτες που πέρασε στο σπίτι του, και τέτοια πράγματα ξαναβγαίνουν στην επιφάνεια τα Χριστούγεννα. Το μοίρασμα ανάλογα με τις νύχτες γλιτώνει τον καβγά και η αριθμητική θέλει ένα λεπτό."
  - heading: "Βρείτε την τιμή μιας διανυκτέρευσης ατόμου"
    body: "Μια διανυκτέρευση ατόμου είναι ένα άτομο που μένει μία νύχτα. Η βίλα κοστίζει ό,τι κοστίζει, οπότε μοιράστε την τιμή σε όλες τις διανυκτερεύσεις και δώστε σε κάθε άτομο όσες χρησιμοποίησε."
    items:
      - "**Μετρήστε τις διανυκτερεύσεις.** Η Άνα, ο Μπεν και η Κλόι μένουν έξι νύχτες ο καθένας και ο Ντεβ μένει τρεις: 6 + 6 + 6 + 3 = 21."
      - "**Βρείτε την τιμή μιας.** 2.100 € ÷ 21 = 100 € ανά διανυκτέρευση ατόμου."
      - "**Πολλαπλασιάστε με τις νύχτες του καθενός.** Η Άνα, ο Μπεν και η Κλόι πληρώνουν 6 × 100 € = 600 € ο καθένας. Ο Ντεβ πληρώνει 3 × 100 € = 300 €."
      - "**Ελέγξτε το σύνολο.** 600 € + 600 € + 600 € + 300 € = 2.100 €. Αν τα μερίδια δεν βγάζουν την τιμή, μια νύχτα λείπει ή μετρήθηκε δύο φορές."
  - heading: "Καταχωρίστε το στο Side Badger"
    body: "Φτιάξτε μια ομάδα, προσκαλέστε τους άλλους τρεις με σύνδεσμο ή κωδικό QR και μετά προσθέστε τα κόστη. Πρώτα η βίλα."
    items:
      - "Επιλέξτε **Προσθήκη Εξόδου**. Περιγράψτε το, πληκτρολογήστε 2.100 και ορίστε στο **Ποιος πλήρωσε;** την Άνα."
      - "Στο **Μοιράζεται μεταξύ**, βεβαιωθείτε ότι είναι και τα τέσσερα άτομα."
      - "Στο **Τρόπος διαχωρισμού** επιλέξτε **Ακριβή ποσά**. Πληκτρολογήστε 600 για την Άνα, τον Μπεν και την Κλόι και 300 για τον Ντεβ. Τα ποσά πρέπει να βγάζουν το σύνολο."
      - "Επιλέξτε **Αποθήκευση Εξόδου**."
      - "Προσθέστε με τον ίδιο τρόπο την ενοικίαση αυτοκινήτου. Πλήρωσε ο Μπεν, ο διαχωρισμός είναι **Εξίσου** και ο Ντεβ μένει έξω, επειδή ήρθε με τρένο. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) καλύπτει τους άλλους τρόπους να μοιραστεί ένα κόστος."
      - "Προσθέστε τα ψώνια. Πλήρωσε ο Ντεβ, ο διαχωρισμός είναι **Εξίσου** και συμμετέχουν και τα τέσσερα άτομα."
  - heading: "Διαβάστε το αποτέλεσμα και μετά τακτοποιηθείτε"
    body: "Ο λογαριασμός του καθενός είναι το μερίδιό του στη βίλα συν το μερίδιό του στο αυτοκίνητο και στα ψώνια. Η Άνα, ο Μπεν και η Κλόι βγάζουν 725 € ο καθένας, δηλαδή 600 € + 80 € + 45 €. Ο Ντεβ βγάζει 345 €, δηλαδή 300 € + 45 €. Αφαιρέστε όσα πλήρωσε ο καθένας και τα υπόλοιπα προκύπτουν μόνα τους. Η Άνα πλήρωσε 2.100 €, οπότε της οφείλονται 1.375 €. Ο Μπεν πλήρωσε 240 € και χρωστά 485 €. Ο Ντεβ πλήρωσε 180 € και χρωστά 165 €. Η Κλόι δεν πλήρωσε τίποτα και χρωστά 725 €. Αν τα αφήνατε ως έχουν, αυτά τα χρέη θα κυκλοφορούσαν σε έξι κατευθύνσεις μέσα στην παρέα. Το Side Badger προτείνει αντί γι' αυτό τρεις πληρωμές, όλες προς την Άνα. Πληρώστε την όπως θέλετε και μετά επιλέξτε **Τακτοποίηση** και χρησιμοποιήστε την **Καταγραφή Εκκαθάρισης** για κάθε πληρωμή, ώστε να ενημερωθούν τα υπόλοιπα. Τα κουμπιά γρήγορης τακτοποίησης συμπληρώνουν το ποσό. Περισσότερα υπάρχουν στην [εκκαθάριση](page:feature/settle-up)."
  - heading: "Όταν η βίλα δεν έχει μία απλή, ενιαία τιμή"
    items:
      - "**Τα δωμάτια διαφέρουν.** Αν η σουίτα αξίζει περισσότερο από το δωματιάκι, συμφωνήστε πρώτα πόσο κοστίζει το κάθε δωμάτιο και μετά κάντε τις πράξεις των διανυκτερεύσεων ένα δωμάτιο τη φορά. Καταχωρίστε τη βίλα ως ένα έξοδο με το σύνολο του καθενός ή ως ένα έξοδο ανά δωμάτιο. Και στις δύο περιπτώσεις, τα ακριβή ποσά ενός εξόδου πρέπει να βγάζουν το σύνολό του."
      - "**Προκαταβολή που πληρώθηκε μήνες νωρίτερα.** Όποιος την πλήρωσε παίρνει δικό του έξοδο, με ημερομηνία τη μέρα που πλήρωσε. Μοιράστε την ανάλογα με τις νύχτες, με τις ίδιες αναλογίες όπως το υπόλοιπο ποσό της βίλας."
      - "**Η κράτηση είναι σε άλλο νόμισμα.** Καταχωρίστε τη βίλα στο νόμισμα στο οποίο πληρώσατε. Αν η ομάδα μετατρέπει καθώς προχωρά, χρησιμοποιήστε μια τρέχουσα συναλλαγματική ισοτιμία ή πληκτρολογήστε την ισοτιμία που πράγματι πήρατε. Το αρχικό ποσό μένει στο έξοδο. Τα [πολλά νομίσματα](page:feature/multiple-currencies) έχουν τις λεπτομέρειες."
      - "**Νύχτες που δεν είναι ολόκληρες.** Κάποιος φτάνει τα μεσάνυχτα, κάποιος φεύγει πριν από το πρωινό. Συμφωνήστε έναν κανόνα για το πώς μετράτε τις νύχτες και χρησιμοποιήστε τον για όλους."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν μετράει τις νύχτες για εσάς. Δεν υπάρχει διαχωρισμός ανάλογα με τις νύχτες ή με μερίδια, οπότε υπολογίζετε κάθε ποσό όπως παραπάνω και καταχωρίζετε **ακριβή ποσά**."
      - "Δεν μετακινεί χρήματα. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή."
      - "Επιτρέπει έναν πληρωτή ανά έξοδο. Αν δύο άτομα πλήρωσαν τη βίλα, καταχωρίστε δύο έξοδα."
      - "Δεν έχει πρόσβαση για επισκέπτες. Όλοι στην ομάδα, και ο Ντεβ μαζί, χρειάζονται έναν δωρεάν λογαριασμό."
exampleAfter: 2
example:
  heading: "Η βίλα, το αυτοκίνητο και τα ψώνια"
  currency: EUR
  people:
    - id: ana
      name: Άνα
    - id: ben
      name: Μπεν
    - id: chloe
      name: Κλόι
    - id: dev
      name: Ντεβ
  expenses:
    - label: "έξι νύχτες στη βίλα"
      payer: ana
      amount: 2100
      split:
        method: exact
        shares:
          ana: 600
          ben: 600
          chloe: 600
          dev: 300
    - label: "την ενοικίαση του αυτοκινήτου"
      payer: ben
      amount: 240
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "τα ψώνια"
      payer: dev
      amount: 180
      split:
        method: equal
faq:
  heading: "Ερωτήσεις για τη βίλα"
  items:
    - q: "Τι γίνεται αν κάποιος ακυρώσει;"
      a: "Αφαιρέστε τις νύχτες του, ξανακάντε τις πράξεις και επεξεργαστείτε το έξοδο της βίλας ώστε τα ακριβή ποσά να βγάζουν ξανά την τιμή. Η προηγούμενη έκδοση διατηρείται και η αλλαγή φαίνεται στη δραστηριότητα της ομάδας, οπότε κανείς δεν αλλάζει ένα νούμερο στα κρυφά. Ποιος μπορεί να επεξεργάζεται εξαρτάται από τα δικαιώματα της ομάδας."
    - q: "Να πληρώνει λιγότερο όποιος έκανε την κράτηση;"
      a: "Το αποφασίζει η ομάδα. Η κράτηση είναι αγγαρεία και οι παρέες διαφωνούν για το αν δικαιολογεί έκπτωση. Ό,τι κι αν συμφωνήσετε, βάλτε το στα ακριβή ποσά και γράψτε το σε μια σημείωση στο έξοδο ή σε ένα σχόλιο δίπλα του, ώστε κανείς να μη χρειάζεται να θυμάται τη συμφωνία."
    - q: "Μπορούμε να μοιράσουμε αλλιώς τα έξοδα καθαρισμού;"
      a: "Ναι. Καταχωρίστε το τέλος ως ξεχωριστό έξοδο και δώστε του δικό του διαχωρισμό. Ο εξίσου διαχωρισμός ταιριάζει σε μια πάγια χρέωση για όλο το σπίτι. Τα ακριβή ποσά ταιριάζουν σε μια παρέα που θέλει το τέλος να ακολουθεί κι αυτό τις νύχτες."
