faq:
  heading: "Spørsmål"
  items:
    - q: "Hva om vi samler inn mer enn gaven koster?"
      a: "De nøyaktige beløpene må summere seg til prisen, så kutt andelene til de gjør det. Eller bruk overskuddet på noe ekte, for eksempel blomster, og legg det inn som en egen utgift, slik som kortet og gavepapiret i eksemplet."
    - q: "Kan noen bidra uten å bli med i gruppen?"
      a: "Ikke hvis dere vil ha dem med i regnskapet. Alle i delingen trenger en gratis konto og må være med i gruppen. For en som bare har kontanter, kan Priya ta imot dem og legge inn gaven for det gruppen fortsatt skylder. Hvis for eksempel Sam ga henne 40 £ kontant, ville hun lagt inn 200 £ og delt dem 60, 60 og 80 mellom seg selv, Omar og Lena."
    - q: "Kan avstemningen avgjøre hvor mye hver person legger inn?"
      a: "Nei. En avstemning avklarer ett tall for hele gruppen, for eksempel budsjettet. Hver persons andel må dere bli enige om dere imellom, og så skriver dere den inn på utgiften som **Eksakte beløp**."
