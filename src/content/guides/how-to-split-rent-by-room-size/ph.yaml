faq:
  heading: "Mga tanong"
  items:
    - q: "Paano kung mas malaki ang kuwarto ng isa pero mas madilim?"
      a: "Panimulang punto lang ang floor area, kaya puwedeng magkasundo ang grupo na mag-adjust. Bawasan ng isa o dalawang punto ang madilim na kuwarto, ibigay ang mga iyon sa iba, at tiyaking 100 pa rin ang kabuuan ng mga porsyento. Itinatabi ng Side Badger ang anumang napagkasunduan ninyo at hindi ito humuhusga."
    - q: "Dapat bang hatiin din ayon sa laki ng kuwarto ang mga bayarin?"
      a: "Kadalasan, hindi. Ginagamit ng lahat ang kuryente at internet, kaya mas simple ang pantay na hati, gaya ng sa halimbawa sa itaas. Kung may housemate na buong araw sa bahay, puwedeng magkasundo ang grupo sa ibang paraan, gaya ng eksaktong halaga. Tinatalakay ng [paghahati ng gastos](page:feature/split-expenses) ang mga opsyon."
    - q: "Puwede ba naming baguhin ang hati mamaya?"
      a: "Oo, para sa mga bagong gastos. Baguhin ang mga porsyento kapag kinopya mo ang upa at mananatili ang mga naunang buwan kung ano ang mga ito. Para itama ang nakaraang gastos, i-edit ito kung pinapayagan ng mga pahintulot ng grupo, at sabihan muna ang buong bahay, dahil magbabago ang mga balanse. Iniingatan ang naunang bersyon."
