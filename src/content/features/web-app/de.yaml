meta:
  title: App zum Kostenteilen ohne Download | Side Badger
  description: Dein Handy ist voll, wir verstehen das. Side Badger läuft im Browser, ohne App-Store und Download. Leg es auf den Home-Bildschirm, und es öffnet sich wie eine App.
h1: Kein App-Store. Kein Download. Fühlt sich trotzdem wie eine App an
navLabel: Web-App
lead: Side Badger lebt in deinem Browser. Es gibt keinen App-Store zu durchsuchen und nichts, was du zuerst herunterladen musst. Melde dich auf dem Handy oder am Computer an, teile Ausgaben online mit deiner Gruppe und lege es auf deinen Home-Bildschirm oder ins Dock, wenn du es einen Fingertipp entfernt haben willst.
cta:
  heading: Öffnen. Anmelden. Gruppe starten.
  body: Erstelle ein Konto, starte eine Gruppe und füge die erste Ausgabe hinzu, alles in dem Browser, den du ohnehin offen hast. Willst du erst die Tour? Lies [so funktioniert es](page:how-it-works) oder sieh nach, [was kostenlos abgedeckt ist](page:pricing).
problem:
  heading: Dein Handy ist voll. Wir verstehen das.
  body: Irgendwo darauf liegen viertausend Fotos vom selben Sonnenuntergang und eine Speicherwarnung, die du seit dem Frühling wegwischst. Das Letzte, was es braucht, ist noch eine App, nur um ein Abendessen zu teilen. Deshalb ist Side Badger eine Web-App. Sie läuft in einem modernen Browser auf dem Handy oder am Computer. Auf dem Handy nutzt sie mobile Layouts, mit der Gruppenseite in Tabs aufgeteilt und fingerfreundlichen Bedienelementen. Manche Extras, etwa das Hinzufügen zum Home-Bildschirm, hängen von deinem Browser ab, und wir sagen dir, wo.
workflow:
  heading: Vom Browser-Tab zum Home-Bildschirm in drei Schritten
  steps:
    - title: Öffnen und anmelden
      body: Geh in deinem Browser zu Side Badger und melde dich an. Du brauchst nur eine E-Mail-Adresse und ein Passwort, und du bestätigst die E-Mail, bevor du etwas hinzufügen kannst. Alle in der Gruppe brauchen ein Konto, die Leute, die du einlädst, tun also dasselbe.
    - title: Zum Home-Bildschirm oder Dock hinzufügen
      body: Sobald du angemeldet bist, bietet die App an, sich selbst zu installieren. Du bekommst eine Schaltfläche **Installieren**, wo dein Browser es erlaubt, und **Zeig mir, wie**, wo nicht. Verpasst oder abgelehnt? Die **Einstellungen** haben dieselbe Hilfe unter **Zum Home-Bildschirm oder Dock hinzufügen**. Auf einem iPhone oder iPad zeigen die Einstellungen zuerst die iPhone-Schritte und stecken die anderen Geräte unter **Andere Geräte**. So oder so öffnet sich die App danach in einem eigenen Fenster.
      shot: S20
      shotAlt: Der Abschnitt „Zum Home-Bildschirm oder Dock hinzufügen“ in den Einstellungen mit den Schritten, um die App einem Gerät hinzuzufügen
    - title: Benachrichtigungen einschalten, wenn du sie willst
      body: Benachrichtigungen sind aus, bis du sie einschaltest, und jedes Gerät wird einzeln eingeschaltet. Nutze die Schaltfläche **Aktivieren**, die die Benachrichtigungsglocke anbietet, oder den Schalter **Push-Benachrichtigungen** in den **Einstellungen**. Öffne die App auf einem iPhone oder iPad zuerst vom Home-Bildschirm. Nur dort funktionieren Benachrichtigungen.
      shot: S19
      shotAlt: Das geöffnete Benachrichtigungs-Dropdown mit den letzten Aktivitäten in der Gruppe
options:
  heading: So fügst du es hinzu, Gerät für Gerät
  items:
    - title: iPhone und iPad
      body: Tippe auf die Schaltfläche „Teilen“, ein Quadrat mit einem Pfeil nach oben. Siehst du sie nicht, tippe zuerst auf die drei Punkte (•••) und dann auf „Teilen“. Scrolle nach unten und tippe auf **Zum Home-Bildschirm**. Lass **Als Web-App öffnen** eingeschaltet und tippe dann auf **Hinzufügen**. Hat sich ein Link in einer anderen App geöffnet, öffne die Seite zuerst in Safari, weil dieser eingebaute Browser sie nicht hinzufügen kann.
    - title: Android
      body: Öffne das Browsermenü und wähle **Zum Startbildschirm hinzufügen** oder **App installieren**.
    - title: Chrome oder Edge am Computer
      body: Öffne das Browsermenü und wähle die Option, diese Website als App zu installieren. Sie bekommt dann ein eigenes Fenster und ein eigenes Symbol.
    - title: Safari auf dem Mac
      body: Wähle **Ablage** und dann **Zum Dock hinzufügen**.
sections:
  - heading: Benachrichtigungen, nur wenn du sie willst
    body: Push-Benachrichtigungen sind freiwillig. Schalte sie ein, und du bekommst eine Benachrichtigung, wenn es neue Aktivität in deinen Gruppen gibt, etwa wenn jemand eine Ausgabe hinzufügt, einen Kommentar hinterlässt oder eine Zahlung erfasst. Sie werden einzeln pro Gerät eingeschaltet, über die Benachrichtigungsglocke oder die **Einstellungen**, und dort auch wieder ausgeschaltet. Sie brauchen einen Browser, der sie unterstützt, und deine Erlaubnis. Hat dein Browser sie für die Website blockiert, erlaube sie zuerst in den Einstellungen des Browsers. Auf einem iPhone oder iPad funktionieren sie nur in der App, die zum Home-Bildschirm hinzugefügt wurde, nicht in einem Browser-Tab. Die Zustellung ist nicht garantiert, sieh eine Benachrichtigung also als Anstupser, nicht als Versprechen. Was im Aktivitätsverlauf auftaucht, steht unter [Gemeinsam planen](page:feature/plan-together).
  - heading: Live-Updates, kein Neuladen
    body: Füge eine Ausgabe hinzu, und alle sehen sie sofort, samt dem, was sich geändert hat und wer es geändert hat. Jede Gruppe führt einen Aktivitätsverlauf, und die Benachrichtigungsglocke zeigt die Aktivität in allen deinen Gruppen. Niemand muss nachfragen, ob die anderen schon gesehen haben, was du gerade hinzugefügt hast. Es steht längst auf ihrem Bildschirm.
  - heading: 39 Sprachen, jede Person ihre eigene
    body: Nutze Side Badger in 39 Sprachen, darunter die Rechts-nach-links-Sprachen Arabisch, Persisch und Urdu. Alle in der Gruppe wählen ihre eigene, die Gruppenseite kann also für eine Person auf Arabisch und für die nächste auf Englisch sein. Nur über die Zahlen muss sich die Gruppe einig sein.
  - heading: Gebaut für mehr als eine Art, es zu nutzen
    body: Side Badger ist mit Blick auf Tastatur- und Screenreader-Nutzung gebaut. Mitgliederfarben kommen mit Mustern, du musst also Grün nicht von Rot unterscheiden.
    items:
      - Sprunglinks, damit man mit der Tastatur direkt zum Inhalt springen kann.
      - Dialoge verwalten den Tastaturfokus.
      - Bedienelemente sind beschriftet, für Screenreader.
      - Layouts spiegeln sich für Rechts-nach-links-Sprachen.
limits:
  heading: Was die Web-App nicht kann
  items:
    - Offline nutzen geht nicht. Side Badger braucht eine Verbindung, deine Gruppe öffnet sich also nicht in einem Flugzeug ohne WLAN.
    - Es gibt keine App im App-Store und keine native iPhone- oder Android-App. Side Badger ist eine Web-App, und sie zum Home-Bildschirm oder Dock hinzuzufügen ist der Weg zur App-ähnlichen Version.
    - Ob sich die App zum Home-Bildschirm oder Dock hinzufügen lässt, hängt von deinem Browser ab. Menünamen unterscheiden sich je nach Browser und Version, und manche Browser bieten es nicht an.
    - Push-Benachrichtigungen sind pro Gerät freiwillig und brauchen einen Browser, der sie unterstützt, und deine Erlaubnis. Auf einem iPhone oder iPad funktionieren sie nur in der App, die zum Home-Bildschirm hinzugefügt wurde. Die Zustellung ist nicht garantiert.
    - Es gibt keine E-Mail- oder SMS-Hinweise und keine Zahlungserinnerungen. Neue Aktivität erscheint in der App und, wenn du sie einschaltest, als Push-Benachrichtigung. Einer Zahlung hinterherzulaufen bleibt deine Sache.
    - Aktivität wird 90 Tage aufbewahrt.
    - Du meldest dich mit einer E-Mail-Adresse und einem Passwort an. Es gibt keine Anmeldung mit Google oder Apple, und du musst mindestens 18 Jahre alt sein.
    - Wir behaupten nicht, dass Side Badger vollständig barrierefrei ist oder einen formalen Barrierefreiheitsstandard erfüllt. Wenn dir etwas im Weg steht, sag es uns direkt in der App, und du siehst unsere Antwort dort.
useCasesHeading: Wo es hilft, keine App zu brauchen
faq:
  heading: Fragen
  items:
    - q: Gibt es eine Side-Badger-App in einem App-Store?
      a: Nein. Side Badger ist eine Web-App. Du öffnest es in deinem Browser und kannst es zum Home-Bildschirm oder Dock hinzufügen, damit es sich wie eine App öffnet. Aus einem App-Store gibt es nichts herunterzuladen.
    - q: Kann ich Rechnungen teilen, ohne eine App herunterzuladen?
      a: Ja. Öffne Side Badger in einem Browser auf deinem Handy oder Computer, melde dich an und starte eine Gruppe. Es zum Home-Bildschirm oder Dock hinzuzufügen ist optional.
    - q: Funktioniert es offline?
      a: Nein. Side Badger braucht eine Verbindung, auch wenn es zum Home-Bildschirm oder Dock hinzugefügt ist.
    - q: Warum bekomme ich auf meinem iPhone keine Benachrichtigungen?
      a: Auf einem iPhone oder iPad funktionieren Benachrichtigungen nur in der App, die zum Home-Bildschirm hinzugefügt wurde, nicht in einem Browser-Tab. Füge sie hinzu, öffne sie über das Symbol auf dem Home-Bildschirm und schalte dann die Benachrichtigungen in den **Einstellungen** ein. Die Zustellung ist nicht garantiert. Geht eine verloren, zeigt der Aktivitätsverlauf der Gruppe trotzdem, was hinzugefügt wurde.
    - q: Muss ich Benachrichtigungen einschalten?
      a: Nein. Sie sind aus, bis du sie einschaltest, Gerät für Gerät. Ohne sie erscheint neue Aktivität trotzdem in der App, und alle sehen eine Änderung sofort, wenn sie die App offen haben.
    - q: Braucht jede Person in der Gruppe ein Konto?
      a: Ja. Du brauchst nur eine E-Mail-Adresse und ein Passwort, und du bestätigst die E-Mail, bevor du etwas hinzufügen kannst. Alle, die einer Gruppe beitreten, tun dasselbe, auf welchem Handy oder Computer sie wollen.
