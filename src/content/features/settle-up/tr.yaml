meta:
  title: "Daha az ödemeyle ödeşin | Side Badger"
  description: "Grubunuzda kimin kime borçlu olduğunu görün, herkesi ödeştiren kısa bir ödeme listesi alın ve her ödemeyi olduğu anda kaydedin. Kullanması ücretsiz."
h1: "Daha az ödemeyle ödeşin"
navLabel: "Hesaplaşma"
lead: "Side Badger gruptaki herkes için güncel bir bakiye tutar ve onu ödeştiren kısa bir ödeme listesi önerir. Birbirinize istediğiniz yolla ödersiniz, sonra kaydedersiniz. Önce tutarların nasıl bölündüğünü görmek istiyorsanız [harcamaları bölüşme](page:feature/split-expenses) ile başlayın."
cta:
  heading: "Kimin kime borçlu olduğunu çözmeye hazır mısınız?"
  body: "Bir hesap oluşturun, bir grup kurun ve ilk harcamayı ekleyin. Bakiyeler gerisini halleder."
  button: "Ücretsiz hesap oluştur"
problem:
  heading: "İlerledikçe güncellenen bakiyeler"
  body: "Her harcama kimin kime borçlu olduğunu değiştirir; bu yüzden Side Badger harcamalar ve ödemeler eklendikçe bakiyeleri güncel tutar. Gruptaki herkes bir değişikliği hemen görür; neyin değiştiğini ve kimin değiştirdiğini de. Bakiyeler para birimi başına tutulur, yani euro ve sterlin, girişte çevrilmediyse kendi sütunlarında kalır. Varsayılan olarak sizi ilgilendiren borçları görürsünüz; **Tümünü göster** bütün grubu listeler."
workflow:
  heading: "Başabaş olmak için üç adım"
  steps:
    - title: "Kimin kime borçlu olduğunu görün"
      body: "Neyi borçlu olduğunuzu, neyi alacaklı olduğunuzu ve herkesi ödeştiren, her para birimi için hesaplanmış kısa bir ödeme listesini görmek için grubun bakiyelerini açın. Sorgulanan harcamalar çözülene kadar toplamların dışında kalır. Aşağıdaki ev arkadaşları örneğinde altı ödeme ikiye iner."
      shot: S10
      shotAlt: "İki para biriminde sadeleştirilmiş borçları gösteren ve Tümünü göster açık olan bakiye ekranı"
    - title: "İstediğiniz yolla ödeyin, sonra kaydedin"
      body: "Banka havalesi, nakit, geçen tatilden kalma bir iyilik. Side Badger parayı taşımaz. Para el değiştirdikten sonra ödemeyi kaydedin, bakiye herkes için güncellenir."
      shot: S11
      shotAlt: "Hızlı ödeşme düğmeleri ve kısmi ödemede gösterilen bildirimle ödeme formu"
    - title: "Ulaştığını kontrol edin"
      body: "Ödeme, gruptaki herkesin görebileceği ve emojiyle tepki verebileceği grup geçmişine girer. Bir ödeme ulaştığında kutlayın."
      shot: S12
      shotAlt: "Bir ödemede emoji tepkileriyle ödeme geçmişi"
