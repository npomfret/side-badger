faq:
  heading: "پرسش‌ها"
  items:
    - q: "کدام منصفانه‌تر است، اندازه اتاق یا درآمد؟"
      a: "هیچ‌کدام همیشه منصفانه‌تر نیست. اندازه اتاق به هم‌خانه‌هایی می‌خورد که بابت فضایی که در آن می‌خوابند پول می‌دهند. درآمد به زوج‌ها و دوستانی می‌خورد که حقوق‌شان خیلی فرق دارد. پیش از اولین روز پرداخت اجاره توافقش کنید، نه بعد از آن."
    - q: "قبض‌ها هم باید همین‌طور تقسیم شوند؟"
      a: "برای هم‌خانه‌ها معمولاً نه. همه از انرژی و اینترنت استفاده می‌کنند، پس مساوی ساده‌تر است، مثل مثال. در حالت درآمد، ماشین‌حساب به قبض‌ها همان سهم‌های اجاره را می‌دهد."
    - q: "می‌توانم از فوت مربع استفاده کنم؟"
      a: "بله. ft² را انتخاب کنید و مساحت‌ها را به فوت مربع تایپ کنید. واحد فقط یک برچسب است و تا وقتی همه از یک واحد استفاده کنند سهم‌ها همان درمی‌آیند."
    - q: "ماشین‌حساب رایگان است؟"
      a: "بله. رایگان. بدون تبلیغات. بدون محدودیت روزانه. حساب کاربری هم لازم ندارید."
