sections:
  - heading: 39 språk, och byggt för fler människor
    body: Använd Side Badger på 39 språk, bland annat arabiska, persiska och urdu som skrivs från höger till vänster. Alla i gruppen kan välja sitt eget, så gruppsidan kan vara på arabiska för en person och på engelska för nästa. Det är också byggt med tanke på användare av tangentbord och skärmläsare, och medlemsfärgerna kommer med mönster, så du behöver inte skilja grönt från rött.
faq:
  heading: Frågor
  items:
    - q: Behöver alla ha ett konto?
      a: Ja, ett gratiskonto. Alla verifierar sin e-postadress innan de lägger till något.
    - q: Finns det en app?
      a: Den körs i webbläsaren. Logga in och lägg sedan till den på hemskärmen eller i dockan så öppnas den som en app. Inställningar i appen visar hur. Det finns ingen version i appbutik och inget offlineläge.
    - q: Flyttar Side Badger pengar?
      a: Nej. Den håller räkningen och föreslår betalningar, och ni betalar varandra hur ni vill. Sedan registrerar ni betalningen. Se [göra upp](page:feature/settle-up).
    - q: Kan någon lämna gruppen med en skuld?
      a: Nej. Ingen kan lämna en grupp så länge hen är skyldig eller har pengar att få, så hen gör upp först.
    - q: Hur många kan gå med i en grupp?
      a: Upp till 50 personer i en grupp. Bjud in dem med en länk eller en QR-kod, och slå på godkännande om du vill att en administratör ska släppa in varje person.
    - q: Hur är det med resor med mer än en valuta?
      a: Saldona hålls separata för varje valuta. Se [flera valutor](page:feature/multiple-currencies).
