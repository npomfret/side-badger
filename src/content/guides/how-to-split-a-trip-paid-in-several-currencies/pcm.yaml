  heading: "Japan, we settle am two ways"
  currency: GBP
  people:
    - id: zoe
      name: Zoe
    - id: kenji
      name: Kenji
    - id: lucy
      name: Lucy
  expenses:
    - label: "di hotel, wey dem book from house"
      payer: zoe
      amount: 600
      split:
        method: equal
    - label: "train passes"
      payer: lucy
      amount: 90000
      currency: JPY
      split:
        method: equal
    - label: "di ramen night"
      payer: kenji
      amount: 9000
      currency: JPY
      split:
        method: equal
  conversion:
    rates:
      JPY: 0.005
faq:
  heading: "Question dem"
  items:
    - q: "Which exchange rate Side Badger dey use?"
      a: "Current exchange rate, wey dem fetch when you enter di expense where one dey available. You fit change am to di rate wey you really get."
    - q: "Di group fit stick to pounds and yen?"
      a: "Yes. For di group **Settings page**, turn on **Limit currencies for dis group** under **Karensi Settings**, pick di **Currencies wey we gree** and set di **Main currency for new expenses**. Fewer options for di list, fewer wrong guesses for di till."
    - q: "We must convert at all?"
      a: "No. Currencies go stay separate unless you or your group choose to convert, and each currency get im own short list of payments."
