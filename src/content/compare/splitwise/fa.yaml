meta:
  title: "Side Badger در برابر Splitwise: کل گروه، نه فقط محاسبات | Side Badger"
  description: "جایگزین رایگان Splitwise برای کل گروه: نظر، سؤال، لیست، نظرسنجی و نقش‌ها و مجوزهای درست، به‌اضافه اسکن رسید و تبدیل ارز رایگان."
h1: "Side Badger در برابر Splitwise: کل گروه، نه فقط محاسبات"
navLabel: Side Badger در برابر Splitwise
lead: "احتمالاً یک نفر در گروه شما گفته «فقط از Splitwise استفاده کنید». حرف بدی نیست: در محاسبات خوب است. Side Badger هم محاسبات را انجام می‌دهد، بعد به گروه جایی می‌دهد که درباره‌اش حرف بزند: نظر، سؤال، لیست، نظرسنجی و نقش‌های درست گروه. اسکن رسید و تبدیل ارز رایگان همراهش است."
