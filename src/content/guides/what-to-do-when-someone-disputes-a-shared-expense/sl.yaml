faq:
  heading: "Vprašanja"
  items:
    - q: "Ali lahko pod vprašaj postavim samo svoj delež?"
      a: "Ne. Vprašanje zadrži cel strošek, za vse v njem. Če je narobe samo razdelitev, je popravek urejanje razdelitve."
    - q: "Kdo lahko zapre vprašanje?"
      a: "Oseba, ki ga je postavila, ali skrbnik skupine. Če oseba, ki je strošek dodala, ni skrbnik, ga ne more zapreti namesto spraševalca."
    - q: "Ali urejanje stroška izbriše izvirnik?"
      a: "Ne. Prejšnja različica se ohrani. Kdo lahko ureja, določajo dovoljenja skupine, zato je dobro najprej povedati hiši, ker se stanja spremenijo."
