featuresHeading: "Di features wey house dey use"
faq:
  heading: "Question dem"
  items:
    - q: "Rent fit repeat automatically?"
      a: "No, no recurring bills dey. Copy last month rent with couple of taps, change di date and you don finish."
    - q: "We fit share by room size?"
      a: "Yes, by percentage. Give each housemate share wey reflect im room, as long as di shares add up to 100. [Share expenses](page:feature/split-expenses) cover di other ways to split."
    - q: "Wetin if housemate move out owing money?"
      a: "Dem no fit leave di group until dem don settle, because nobody fit leave while dem owe or dem owe dem money. Di numbers go stay honest until everybody clear."
    - q: "Side Badger dey pay di bills?"
      a: "No. E dey keep di count and suggest short list of payments. You go pay each other anyhow you like, then record am, as [settle up](page:feature/settle-up) explain."
    - q: "One housemate fit keep di books?"
      a: "Yes. Make am admin and use managed group, where new members need approval and only creators and admins fit change expenses."
