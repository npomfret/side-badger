        method: equal
sections:
  - heading: "39 језика, направљено за више људи"
    body: "Користи Side Badger на 39 језика, укључујући арапски, персијски и урду, који се пишу здесна налево. Свако у групи може изабрати свој, па страница групе може бити на арапском за једну особу, а на енглеском за следећу. Направљен је и са мишљу на кориснике тастатуре и читача екрана, а боје чланова имају узорке, па не мораш разликовати зелено од црвеног."
faq:
  heading: "Питања"
  items:
    - q: "Да ли свако треба кориснички налог?"
      a: "Да, бесплатан. Свака особа потврђује свој имејл пре него што било шта дода."
    - q: "Да ли постоји апликација?"
      a: "Ради у прегледачу. Пријави се, па је додај на почетни екран или у док да се отвара као апликација. Подешавања у апликацији ти показују како. Нема верзије из продавнице апликација ни режима рада ван мреже."
    - q: "Да ли Side Badger премешта новац?"
      a: "Не. Води евиденцију и предлаже уплате, а ви једни другима плаћате како год желите. Затим забележиш уплату. Погледај [поравнање](page:feature/settle-up)."
    - q: "Може ли неко да оде док дугује новац?"
      a: "Не. Нико не може напустити групу док дугује или му се дугује новац, па се прво поравна."
    - q: "Колико људи може да се придружи групи?"
      a: "До 50 особа у групи. Позови их везом или QR кодом и укључи одобравање ако желиш да администратор пушта сваку особу унутра."
    - q: "А путовања са више од једне валуте?"
      a: "Стања се воде посебно за сваку валуту. Погледај [више валута](page:feature/multiple-currencies)."
