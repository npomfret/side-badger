meta:
  title: "140개 통화로 비용 나누기, 환산하거나 따로 관리하기"
  description: "결제한 통화로 지출을 입력하고, 잔액을 따로 관리하거나 직접 보고 바꿀 수 있는 환율로 환산한 다음, 짧은 결제 목록으로 정산하세요."
h1: "140개 통화로 비용 나누기"
navLabel: "여러 통화"
lead: "유로, 엔, 그리고 바트로 낸 그 택시 한 대. 사이드 배저는 각 지출을 결제한 통화로 받아 잔액을 정리하고, 그룹이 한 번에 정산하고 싶을 때는 환산도 할 수 있습니다. 140개 통화를 지원하며 [그룹 여행](page:use-case/group-trips)에 잘 어울립니다."
cta:
  heading: "유로도 엔도 가져오세요"
  body: "계정을 만들고, 그룹을 시작하고, 마침 가지고 있던 통화로 첫 지출을 추가하세요."
problem:
  heading: "결제한 그대로 입력하세요"
  body: "여행 비용은 한 가지 통화로만 치러지는 경우가 드뭅니다. 호텔은 집에서 파운드로 예약했고, 저녁은 엔으로 냈고, 공항 커피는 경유지의 통화로 샀죠. 입력하기도 전에 모든 걸 손으로 환산하다 보면 스프레드시트는 버려지기 마련입니다. 사이드 배저에서는 영수증에 적힌 통화로 각 지출을 입력하고, 모든 금액은 그 통화의 규칙을 따릅니다. 그래서 엔은 소수점이 없고 디나르는 세 자리예요. 최근에 사용한 통화가 목록 맨 위에 나옵니다."
workflow:
  heading: "통화를 따로 두거나, 하면서 환산하기"
  steps:
    - title: "지출을 해당 통화로 추가하기"
      body: "통화를 고르고, 금액을 입력하고, 누가 결제했고 누가 나눴는지 말하세요. 그게 전부예요. 이것이 기본값이며, 입력한 원래 금액이 그대로 유지됩니다."
      shot: S07
      shotAlt: "엔화 금액이 입력된 지출 양식"
    - title: "통화마다 잔액 확인하기"
      body: "잔액은 통화별로 따로 관리되고, 각각 제안되는 짧은 결제 목록이 따로 생깁니다. 파운드는 파운드로, 엔은 엔으로 정산합니다."
      shot: S10
      shotAlt: "두 가지 통화로 간소화된 빚이 표시된 잔액 화면"
    - title: "또는 그룹이 한 번에 정산하고 싶다면 환산하기"
      body: "지출을 입력할 때 다른 통화를 고르면 사이드 배저가 현재 환율로 환산해 줄 수 있고, 실제로 적용받은 환율로 바꿀 수도 있습니다. 환산된 금액은 해당 통화의 잔액에 합쳐집니다. 환산은 그룹이 선택하는 것이며, 몰래 일어나는 일은 없습니다."
options:
  heading: "직접 보고 바꿀 수 있는 환율"
  items:
    - title: "환율이 표시됩니다"
      body: "환산하면 환율과 환산된 금액이 양식에 나타나므로 아무도 숫자를 그냥 믿을 필요가 없습니다."
    - title: "직접 입력하기"
      body: "환전소에서 더 좋은 환율을 받았거나 공항에서 더 나쁜 환율을 받았나요? 실제로 받은 환율로 수정하면 환산 금액이 업데이트됩니다."
    - title: "원래 금액은 남습니다"
      body: "원래 금액은 환산된 금액 옆에 지출과 함께 남아 있어서, 엔으로 얼마였는지 묻는 사람이 있어도 괜찮습니다."
    - title: "환산은 무료"
      body: "환산에는 비용이 들지 않습니다. 다른 통화로 지출을 입력하는 데 수수료는 없습니다."
