faq:
  heading: "Domande"
  items:
    - q: "Che tasso di cambio usa Side Badger?"
      a: "Un tasso di cambio attuale, recuperato quando inserisci la spesa dove ce n'è uno disponibile. Puoi cambiarlo con quello che hai davvero ottenuto."
    - q: "Il gruppo può restare su sterline e yen?"
      a: "Sì. Nelle **Impostazioni** del gruppo, attiva **Limita valute per questo gruppo** sotto **Impostazioni valuta**, scegli le **Valute consentite** e imposta la **Valuta predefinita per le nuove spese**. Meno opzioni nell'elenco, meno errori alla cassa."
    - q: "Dobbiamo convertire per forza?"
      a: "No. Le valute restano separate a meno che tu o il tuo gruppo scegliate di convertire, e ogni valuta ha la sua breve lista di pagamenti."
