faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah saya mempertanyakan bagian saya saja?"
      a: "Tidak. Pertanyaan menahan seluruh pengeluaran, untuk semua orang di dalamnya. Jika hanya pembagiannya yang salah, perbaikannya adalah mengubah pembagian."
    - q: "Siapa yang bisa menutup pertanyaan?"
      a: "Orang yang bertanya, atau admin grup. Jika orang yang menambahkan pengeluaran bukan admin, ia tidak bisa menutupnya atas nama penanya."
    - q: "Apakah mengubah pengeluaran menghapus aslinya?"
      a: "Tidak. Versi sebelumnya tetap tersimpan. Siapa yang bisa mengubah ditentukan oleh izin grup, jadi sebaiknya beri tahu seisi rumah dulu, karena saldo berubah."
