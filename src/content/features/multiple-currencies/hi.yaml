meta:
  title: "140 करेंसी में खर्च बांटें, बदलकर या अलग रखकर"
  description: "हर खर्च उसी करेंसी में डालें जिसमें पेमेंट किया, बैलेंस अलग रखें या ऐसे रेट पर बदलें जिसे आप देख और बदल सकें, फिर पेमेंट की छोटी सूची से हिसाब चुकता करें।"
h1: "140 करेंसी में खर्च बांटें"
navLabel: "कई करेंसी"
lead: "यूरो, येन, और थाई बाट में चुकाई गई वह एक टैक्सी। Side Badger हर खर्च को उसी करेंसी में लेता है जिसमें आपने पेमेंट किया, बैलेंस सीधे रखता है, और जब आपका ग्रुप एक बार में हिसाब चुकता करना चाहे तो बदल भी सकता है। यह 140 करेंसी में काम करता है, और [ग्रुप ट्रिप](page:use-case/group-trips) के लिए बिल्कुल सही बैठता है।"
cta:
  heading: "अपने यूरो लाइए, अपने येन लाइए"
  body: "अकाउंट बनाएं, ग्रुप शुरू करें और पहला खर्च उसी करेंसी में जोड़ें जो आपके हाथ में थी।"
  button: "मुफ्त अकाउंट बनाएं"
problem:
  heading: "जैसे पेमेंट किया वैसे डालें"
  body: "ट्रिप का खर्च शायद ही कभी एक करेंसी में होता है। होटल घर से पाउंड में बुक हुआ, डिनर येन में चुकाया गया, और एयरपोर्ट की कॉफी उस करेंसी में जो लेओवर वाली जगह चलती थी। डालने से पहले सब कुछ हाथ से बदलना ही वह तरीका है जिससे स्प्रेडशीट छोड़ दी जाती हैं। Side Badger में आप हर खर्च उसी करेंसी में डालते हैं जो रसीद पर है, और हर राशि अपनी करेंसी के नियम मानती है, इसलिए येन में दशमलव नहीं होते और दीनार में तीन होते हैं। आपकी हाल में इस्तेमाल की गई करेंसी सूची में सबसे ऊपर आती हैं।"
workflow:
  heading: "करेंसी अलग रखें, या साथ-साथ बदलें"
  steps:
    - title: "खर्च उसकी अपनी करेंसी में जोड़ें"
      body: "करेंसी चुनें, राशि टाइप करें, बताएं किसने पेमेंट किया और किसने बांटा। इसके अलावा कुछ नहीं चाहिए। यही डिफ़ॉल्ट है, और यह मूल राशि को ठीक वैसा ही रखता है जैसा आपने डाली थी।"
      shot: S07
      shotAlt: "खर्च का फॉर्म, जिसमें येन की राशि भरी है"
    - title: "हर करेंसी का बैलेंस देखें"
      body: "बैलेंस हर करेंसी के लिए अलग रखे जाते हैं, और हर एक को सुझाए गए पेमेंट की अपनी छोटी सूची मिलती है। पाउंड का हिसाब पाउंड में और येन का येन में चुकता होता है।"
      shot: S10
      shotAlt: "बैलेंस की स्क्रीन, जिसमें दो करेंसी में सरल की गई उधारियां दिख रही हैं"
    - title: "या बदलें, जब ग्रुप एक बार में हिसाब चुकता करना चाहे"
      body: "खर्च डालते समय दूसरी करेंसी चुनें और Side Badger उसे मौजूदा एक्सचेंज रेट पर बदल सकता है, जिसे आप उस रेट में बदल सकते हैं जो आपको असल में मिला। बदली हुई राशि उसी करेंसी के बैलेंस में जुड़ जाती है। बदलना ग्रुप का चुनाव है, कोई ऐसी चीज़ नहीं जो आपकी पीठ पीछे हो जाए।"
options:
  heading: "ऐसा रेट जिसे आप देख और बदल सकें"
  items:
    - title: "रेट दिखाया जाता है"
      body: "जब आप बदलते हैं, तो रेट और बदली हुई राशि फॉर्म पर दिखती हैं, ताकि किसी को कोई संख्या आंख मूंदकर न माननी पड़े।"
    - title: "अपना रेट खुद डालें"
      body: "कैश डेस्क पर बेहतर रेट मिला, या एयरपोर्ट पर खराब? रेट को वही कर दें जो आपको असल में मिला और बदली हुई राशि अपडेट हो जाती है।"
    - title: "मूल राशि बनी रहती है"
      body: "मूल राशि खर्च पर बदली हुई राशि के पास बनी रहती है, उसके लिए जो पूछे कि येन में वह कितना था।"
    - title: "बदलना मुफ्त है"
      body: "बदलने में कुछ खर्च नहीं होता। खर्च को दूसरी करेंसी में डालने की कोई फीस नहीं है।"
