meta:
  title: "Διαχείριση ομάδας και δικαιώματα για κοινά έξοδα | Side Badger"
  description: "Προσκαλέστε με σύνδεσμο ή κωδικό QR, εγκρίνετε ποιος μπαίνει, ορίστε θεατές και κλειδώστε την ομάδα όταν τελειώσει. Οι κανόνες δικοί σας, με μέτρο."
h1: "Διαχείριση ομάδας και δικαιώματα: οι κανόνες σας, με μέτρο"
navLabel: "Ομάδες και δικαιώματα"
lead: "Κάποιες ομάδες χρειάζονται ταμία. Το Side Badger έχει ρύθμιση γι' αυτό. Προσκαλέστε άτομα με σύνδεσμο ή κωδικό QR, αποφασίστε ποιος μπαίνει και διαλέξτε ποιος μπορεί να αλλάζει τους αριθμούς. Μια μικρή παρέα φίλων μπορεί να τα αγνοήσει όλα, γιατί οι νέες ομάδες ξεκινούν τελείως ανοιχτές."
cta:
  heading: "Έτοιμοι να τρέξετε μια ομάδα με τάξη;"
  body: "Δημιουργήστε λογαριασμό, ξεκινήστε μια ομάδα και στείλτε τον σύνδεσμο πρόσκλησης. Αφήστε την ανοιχτή ή σφίξτε τους κανόνες όταν η ομάδα μεγαλώσει ή γίνει πιο ιδιότροπη."
problem:
  heading: "Κάποιος πρέπει να κρατά τους αριθμούς τακτοποιημένους"
  body: "Τέσσερις συγκάτοικοι τα βγάζουν πέρα με εμπιστοσύνη. Τριάντα καλεσμένοι σε ένα Σαββατοκύριακο γάμου μάλλον όχι. Φτιάξτε μια ομάδα για κάθε σπίτι, ταξίδι ή εκδήλωση, με έως 50 άτομα, και κάθε ομάδα κρατά τα δικά της μέλη, τους δικούς της ρόλους και τους δικούς της κανόνες. Ο πίνακας ελέγχου τις παραθέτει όλες, μαζί με το πού βρίσκεστε σε καθεμία, σε μία οθόνη. Οι περισσότερες ομάδες δεν αγγίζουν ποτέ τις ρυθμίσεις. Όσες το κάνουν έχουν συνήθως κάποιον αρκετά οργανωμένο ώστε να τις θέλει."
workflow:
  heading: "Από την άδεια ομάδα στην κλειδωμένη ομάδα"
  steps:
    - title: "Προσκαλέστε με σύνδεσμο ή κωδικό QR"
      body: "Ανοίξτε την επιλογή **Πρόσκληση Άλλων**, διαλέξτε πόσο θα διαρκεί ο σύνδεσμος (15 λεπτά, 1 ώρα, 1 ημέρα ή 5 ημέρες) και μετά αντιγράψτε τον ή δείξτε τον κωδικό QR για να τον σαρώσουν. Μπορείτε επίσης να προσκαλέσετε άτομα με τα οποία μοιράζεστε ήδη κάποια άλλη ομάδα, μέσα από την εφαρμογή."
      shot: S03
      shotAlt: "Το παράθυρο πρόσκλησης με τον σύνδεσμο της ομάδας, τον κωδικό QR και την επιλογή για το πόσο θα διαρκεί ο σύνδεσμος"
    - title: "Αφήστε τους να ρίξουν μια ματιά πριν μπουν"
      body: "Όποιος έχει τον σύνδεσμο συνδέεται ή δημιουργεί λογαριασμό, βλέπει μια προεπισκόπηση της ομάδας και διαλέγει το όνομα που θέλει να χρησιμοποιεί σε αυτήν. Μετά πατά **Συμμετοχή στην Ομάδα**."
      shot: S04
      shotAlt: "Η προεπισκόπηση συμμετοχής σε μια ομάδα, όπως τη βλέπει ένα συνδεδεμένο άτομο πριν μπει"
    - title: "Εγκρίνετε ποιος μπαίνει"
      body: "Ενεργοποιήστε την έγκριση και όσοι χρησιμοποιούν τον σύνδεσμο περιμένουν ως εκκρεμή μέλη μέχρι να τους αφήσει να μπουν ένας διαχειριστής. Οι διαχειριστές τους βρίσκουν στα **Εκκρεμή μέλη**, στην ενότητα **Ασφάλεια & Δικαιώματα**, και επιλέγουν **Έγκριση** ή **Απόρριψη**. Μέχρι τότε, ένα άτομο σε αναμονή δεν βλέπει τίποτα στην ομάδα."
      shot: S14
      shotAlt: "Εκκρεμή μέλη που περιμένουν να τα εγκρίνει ή να τα απορρίψει ένας διαχειριστής"
    - title: "Διαλέξτε ποιος αλλάζει τι"
      body: "Διαλέξτε **Ανοιχτή συνεργασία** ή **Διαχειριζόμενη ομάδα** ή ορίστε τα δικαιώματα ένα προς ένα. Μετά δώστε σε κάθε άτομο έναν ρόλο: διαχειριστής, μέλος ή θεατής. Μόνο οι διαχειριστές αλλάζουν δικαιώματα και ρόλους."
      shot: S13
      shotAlt: "Η καρτέλα ασφάλειας στις ρυθμίσεις της ομάδας, με τις δύο προεπιλογές και τα προσαρμοσμένα δικαιώματα"
    - title: "Κλειδώστε την όταν τελειώσει"
      body: "Όταν τελειώσει το ταξίδι και οι αριθμοί έχουν τακτοποιηθεί, ένας διαχειριστής μπορεί να ενεργοποιήσει το **Κλείδωμα Ομάδας**. Κανείς δεν μπορεί να προσθέσει ή να αλλάξει έξοδα, να καταγράψει πληρωμές ή να επεξεργαστεί λίστες και ψηφοφορίες, και ένα banner το λέει. Κανείς δεν μπορεί να προσθέσει στα ήσυχα ένα ταξί που θυμήθηκε αργότερα. Αν όντως ξεφυτρώσει κάποιο, ένας διαχειριστής μπορεί να ξεκλειδώσει την ομάδα."
      shot: S15
      shotAlt: "Μια ομάδα που δείχνει το banner ότι είναι κλειδωμένη"
options:
  heading: "Διαχειριστές, μέλη και θεατές"
  items:
    - title: "Διαχειριστής"
      body: "Τρέχει την ομάδα. Οι διαχειριστές εγκρίνουν νέα μέλη, αλλάζουν ρόλους και δικαιώματα, κλειδώνουν και ξεκλειδώνουν την ομάδα και την κλείνουν. Όποιος δημιουργεί μια ομάδα ξεκινά ως διαχειριστής της και μια ομάδα δεν μένει ποτέ χωρίς διαχειριστή, γιατί ο τελευταίος διαχειριστής δεν μπορεί να υποβιβαστεί."
    - title: "Μέλος"
      body: "Συμμετέχει. Τι μπορεί να κάνει ένα μέλος εξαρτάται από τα δικαιώματα της ομάδας. Σε μια ομάδα με Ανοιχτή συνεργασία είναι σχεδόν τα πάντα. Σε μια Διαχειριζόμενη ομάδα, τα μέλη αλλάζουν μόνο τα έξοδα και τις λίστες που δημιούργησαν."
    - title: "Θεατής"
      body: "Βλέπει τα πάντα και δεν αλλάζει τίποτα. Ένας θεατής δεν μπορεί να προσθέσει ή να επεξεργαστεί έξοδα ή λίστες, να προσκαλέσει άτομα, να αλλάξει ρυθμίσεις ή να αγγίξει την εικόνα κεφαλίδας. Βολικό για όποιον θέλει να παρακολουθεί τους αριθμούς και υπόσχεται να μην τους πειράξει."
sections:
  - heading: "Ανοιχτή, διαχειριζόμενη ή με δικούς σας κανόνες"
    body: "Οι νέες ομάδες ξεκινούν με **Ανοιχτή συνεργασία**, όπου όλοι μπορούν να προσκαλούν άτομα, να αλλάζουν έξοδα και να επεξεργάζονται λίστες, και τα νέα μέλη μπαίνουν αυτόματα. Η **Διαχειριζόμενη ομάδα** είναι για όταν κάποιος πρέπει να παίξει τον ρόλο του ενήλικα. Μπορείτε επίσης να ορίσετε τα επτά δικαιώματα ένα προς ένα, και αν αλλάξετε ένα με το χέρι, η ομάδα περνά σε προσαρμοσμένη ρύθμιση. Ό,τι κι αν διαλέξετε, μόνο οι διαχειριστές αλλάζουν τα ίδια τα δικαιώματα και κάθε αλλαγή εμφανίζεται στη ροή δραστηριότητας. Ένα διαμέρισμα με [συγκατοίκους](page:use-case/housemates) μπορεί να τα αφήσει όλα ανοιχτά. Μια μεγάλη [εκδήλωση ή γιορτή](page:use-case/events-and-celebrations) θέλει συχνά Διαχειριζόμενη ομάδα, ώστε κάποιος να ελέγχει ποιος μπαίνει. Είστε καινούργιοι σε όλα αυτά; Το [πώς λειτουργεί](page:how-it-works) διατρέχει ολόκληρη τη διαδρομή, από το πρώτο έξοδο μέχρι να τακτοποιηθούν όλοι."
    items:
      - "**Ποιος μπορεί να επεξεργαστεί έξοδα.** Ανοιχτή συνεργασία: οποιοδήποτε μέλος. Διαχειριζόμενη ομάδα: δημιουργοί και διαχειριστές."
      - "**Ποιος μπορεί να διαγράψει έξοδα.** Ανοιχτή συνεργασία: οποιοδήποτε μέλος. Διαχειριζόμενη ομάδα: δημιουργοί και διαχειριστές."
      - "**Ποιος μπορεί να επεξεργαστεί λίστες.** Ανοιχτή συνεργασία: οποιοδήποτε μέλος. Διαχειριζόμενη ομάδα: δημιουργοί και διαχειριστές."
      - "**Ποιος μπορεί να προσκαλέσει μέλη.** Ανοιχτή συνεργασία: οποιοδήποτε μέλος. Διαχειριζόμενη ομάδα: μόνο διαχειριστές."
      - "**Έγκριση νέου μέλους.** Ανοιχτή συνεργασία: αυτόματη. Διαχειριζόμενη ομάδα: απαιτείται έγκριση διαχειριστή."
      - "**Ποιος μπορεί να αλλάξει ρυθμίσεις.** Ανοιχτή συνεργασία: οποιοδήποτε μέλος. Διαχειριζόμενη ομάδα: μόνο διαχειριστές."
      - "**Ποιος μπορεί να αλλάξει την εικόνα κεφαλίδας.** Ανοιχτή συνεργασία: οποιοδήποτε μέλος. Διαχειριζόμενη ομάδα: μόνο διαχειριστές."
  - heading: "Το όνομά σας, η φωτογραφία σας, η εικόνα κεφαλίδας σας"
    body: "Κάθε ομάδα έχει τη δική της διανομή ρόλων. Διαλέξτε το όνομα που βλέπουν οι άλλοι σε κάθε ομάδα (2 έως 50 χαρακτήρες και μοναδικό μέσα στην ομάδα) και ποια από τις φωτογραφίες προφίλ σας φοράτε εκεί. Γίνετε **Σαμ** στο σπίτι και **Σαμ (με το αμάξι)** στο ταξίδι. Όποιος μπορεί να αλλάζει ρυθμίσεις μπορεί να μετονομάσει την ομάδα και να επεξεργαστεί την περιγραφή της. Η εικόνα κεφαλίδας, ένα JPEG, PNG, GIF ή WebP έως 10 MB, έχει δικό της δικαίωμα."
  - heading: "Αρχειοθέτηση, κλείδωμα ή κλείσιμο"
    body: "Τρεις τρόποι να βάλετε μια ομάδα στην άκρη, από τον πιο ήπιο ως τον πιο σοβαρό."
    items:
      - "Η **Αρχειοθέτηση** κρύβει την ομάδα από τον δικό σας πίνακα ελέγχου και όχι από των υπολοίπων. Μπορείτε ακόμη να την ανοίξετε και να τη χρησιμοποιήσετε όπως πριν, και η επιλογή **Επαναφορά Ομάδας** τη φέρνει πίσω."
      - "Το **Κλείδωμα** παγώνει τις αλλαγές μέχρι να το ξεκλειδώσει ένας διαχειριστής. Όλοι μπορούν ακόμη να διαβάζουν την ομάδα και το ιστορικό της."
      - "Το **Κλείσιμο** είναι μόνιμο και για όλους. Μόνο ένας διαχειριστής μπορεί να το κάνει, πληκτρολογώντας το όνομα της ομάδας για επιβεβαίωση, και κανείς δεν μπορεί να ανοίξει ξανά την ομάδα."
  - heading: "Αποχώρηση από μια ομάδα"
    body: "Μπορεί να φύγει όποιος έχει τακτοποιηθεί. Δεν μπορείτε να φύγετε όσο χρωστάτε ή σας οφείλονται χρήματα έστω και σε ένα νόμισμα, όσο ένα ανοιχτό ερώτημα για κάποιο έξοδο σας αφορά, ή αν είστε ο τελευταίος διαχειριστής ή το μοναδικό μέλος. [Καταγράψτε την πληρωμή](page:feature/settle-up), λύστε το [ερώτημα για το έξοδο](page:guide/what-to-do-when-someone-disputes-a-shared-expense) ή κάντε διαχειριστή κάποιον άλλον και μετά φύγετε. Για να επιστρέψετε, θα χρειαστείτε νέα πρόσκληση."
limits:
  heading: "Με μέτρο: τα ψιλά γράμματα"
  items:
    - "Μια ομάδα χωρά έως 50 άτομα."
    - "Μόνο οι διαχειριστές αλλάζουν δικαιώματα και ρόλους. Ο τελευταίος διαχειριστής δεν μπορεί να υποβιβαστεί."
    - "Αν ορίσετε την επεξεργασία εξόδων σε **Μόνο διαχειριστές**, αυτό σημαίνει ότι και την προσθήκη εξόδων μπορούν να την κάνουν μόνο οι διαχειριστές."
    - "Ένα κλείδωμα σταματά τις αλλαγές σε έξοδα, νέες πληρωμές, λίστες και ψηφοφορίες. Όλοι μπορούν ακόμη να διαβάζουν την ομάδα και το ιστορικό της και να αντιδρούν σε πληρωμές."
    - "Το κλείσιμο είναι μόνιμο. Η εφαρμογή δεν έχει τρόπο να ξανανοίξει μια κλειστή ομάδα."
    - "Η δημιουργία νέου συνδέσμου πρόσκλησης δεν ακυρώνει τους παλιούς. Κάθε σύνδεσμος διαρκεί μέχρι τη δική του λήξη, οπότε διαλέξτε σύντομη διάρκεια όταν ανησυχείτε πού μπορεί να καταλήξει."
    - "Οι προσκλήσεις μέσα από την εφαρμογή εμφανίζουν άτομα από τις 10 πιο πρόσφατες ενεργές ομάδες σας. Όποιος άλλος χρειάζεται τον σύνδεσμο, ενώ το ποιος μπορεί να προσκαλεί εξαρτάται από τα δικαιώματα της ομάδας."
    - "Η συμμετοχή απαιτεί λογαριασμό και τα άτομα πρέπει να επιβεβαιώσουν το email τους πριν μπορέσουν να προσθέσουν οτιδήποτε."
useCasesHeading: "Εκεί που βοηθά λίγη τάξη"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορεί ένας θεατής να προσθέσει έξοδα;"
      a: "Όχι. Ένας θεατής βλέπει τα πάντα και δεν αλλάζει τίποτα. Δεν μπορεί να προσθέσει ή να επεξεργαστεί έξοδα ή λίστες, να προσκαλέσει άτομα ή να αλλάξει ρυθμίσεις."
    - q: "Μπορεί κάποιος να φύγει ενώ χρωστά χρήματα;"
      a: "Όχι. Κανείς δεν μπορεί να αφήσει μια ομάδα όσο χρωστά ή του οφείλονται χρήματα έστω και σε ένα νόμισμα. Τακτοποιηθείτε πρώτα και μετά φύγετε."
    - q: "Τι γίνεται όταν μια ομάδα κλείνει;"
      a: "Κανείς δεν μπορεί να την ανοίξει ξανά. Μόνο ένας διαχειριστής μπορεί να κλείσει μια ομάδα, πρέπει να πληκτρολογήσει το όνομά της για επιβεβαίωση και η ομάδα γίνεται μη διαθέσιμη για όλους. Αν θέλετε μόνο να σταματήσουν οι αλλαγές, κλειδώστε την. Αν θέλετε μόνο να φύγει από τον δικό σας πίνακα ελέγχου, αρχειοθετήστε την."
    - q: "Μπορώ να αναιρέσω ένα κλείδωμα;"
      a: "Ναι. Ένας διαχειριστής μπορεί να ξεκλειδώσει την ομάδα και οι αλλαγές ξαναδουλεύουν."
    - q: "Πρέπει να εγκρίνω τα άτομα πριν μπουν;"
      a: "Μόνο αν θέλετε. Οι νέες ομάδες ξεκινούν με Ανοιχτή συνεργασία, όπου όσοι χρησιμοποιούν τον σύνδεσμο μπαίνουν αυτόματα. Ενεργοποιήστε την έγκριση διαχειριστή ή διαλέξτε Διαχειριζόμενη ομάδα και κάθε άτομο περιμένει μέχρι να το αφήσει να μπει ένας διαχειριστής."
    - q: "Πόσα άτομα χωρά μια ομάδα;"
      a: "Έως 50."
