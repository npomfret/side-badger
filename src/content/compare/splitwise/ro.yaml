sections:
  - heading: Discuții despre bani, lângă bani
    body: Banii comuni vin cu discuții, nelămuriri și planuri. Side Badger le ține pe toate trei lângă cifre, ca nimeni să nu mai deruleze înapoi prin chat.
    items:
      - "**Comentarii unde le e locul.** Comentează grupul în sine sau orice cheltuială, listă ori sondaj și ține conversația lângă subiectul ei."
      - "**Chitanțe și fotografii.** Păstrează până la trei chitanțe la fiecare cheltuială și adaugă fotografii sau PDF-uri la comentariile din grup, dintr-o listă sau dintr-un sondaj."
      - "**Întrebări, nu certuri.** Un administrator poate activa întrebările, iar oricine e într-o cheltuială poate întreba despre ea. Rămâne în afara soldurilor până se lămurește."
      - "**Liste și sondaje.** Ține lista de cumpărături comună lângă bonurile de la cumpărături și supune la vot lista scurtă de vile, anonim dacă vrei."
      - "**Câteva aplauze.** Reacționează la cheltuieli, plăți și comentarii și sărbătorește o plată când ajunge."
  - heading: Grupul tău, regulile tale
    body: Centrul de ajutor al Splitwise spune că nu are administratori de grup și nici permisiuni speciale. Side Badger are roluri și permisiuni, pentru grupurile care au nevoie de cineva care să țină cifrele în ordine.
    items:
      - "**Administratori, membri și vizualizatori.** Fă pe cineva vizualizator: vede tot și nu schimbă nimic."
      - "**Două presetări sau ale tale.** Pornește de la Colaborare deschisă sau Grup gestionat, sau setează tu fiecare permisiune: cine editează și șterge cheltuieli, editează liste, invită și lasă oameni noi să intre."
      - "**Aprobare pentru a intra.** Activează aprobarea și un administrator lasă fiecare persoană să intre."
      - "**Setările proprii ale grupului.** Limitează-l la valutele pe care le folosești de fapt, alege-i valuta implicită și pune-i o imagine antet."
      - "**Blochează-l când s-a terminat.** Cifrele rămân cum sunt până când un administrator îl deblochează."
  - heading: Gratuit aici, plătit acolo
    body: Splitwise Pro este planul plătit al Splitwise, iar propria lui pagină Pro oferă contra cost trei lucruri care nu costă nimic în Side Badger.
    items:
      - "**Scanarea chitanțelor.** Splitwise Pro scanează o fotografie a chitanței. Side Badger o face gratuit, fără credite de scanare: completează totalul, data și locul ca să le verifici."
      - "**Conversia valutară.** Splitwise Pro convertește cheltuielile unui grup în valuta ta implicită când atingi „Convertește”. Side Badger convertește fiecare cheltuială pe măsură ce o introduci, la un curs de schimb actual sau la cel pe care l-ai primit de fapt, iar suma inițială rămâne pe cheltuială."
      - "**Fără limită zilnică.** Splitwise Pro oferă cheltuieli nelimitate, iar centrul lui de ajutor spune că utilizatorii gratuiți pot adăuga până la 4 cheltuieli pe zi. Side Badger nu are limită zilnică."
  - heading: Banca ta rămâne pe dinafară
    body: "Side Badger nu se conectează la banca ta și nu îți cere datele băncii. Ține evidența cine cui datorează; plătești cum preferi, apoi înregistrezi plata. Nicio autentificare în bancă de predat, deci o grijă în minus."
  - heading: O singură aplicație, în browser și pe telefon
    body: Side Badger rulează în browser. Conectează-te, adaugă-l pe ecranul de pornire și se deschide ca o aplicație. E aceeași aplicație în ambele cazuri, așa că o funcție nouă e pe telefonul tău data viitoare când deschizi aplicația, fără să aștepți o actualizare din magazinul de aplicații.
  - heading: Și câteva trucuri de efect
    items:
      - "**Întreabă-ți asistentul.** Side Badger funcționează cu ChatGPT și Claude: cere-i asistentului tău să adauge o cheltuială, să scaneze o chitanță sau să înregistreze o plată."
      - "**Fiecare în limba lui.** Side Badger vorbește 39 de limbi, iar fiecare persoană o alege pe a ei. Pagina principală a Splitwise listează peste 7. Se descurcă și cu 133 de valute, pentru excursia care ajunge peste tot."
      - "**Ajutor fără să ieși din aplicație.** Te-ai blocat sau ai găsit o greșeală? Spune-ne din aplicație și citește chiar acolo răspunsul nostru."
  - heading: Unde Splitwise tot câștigă
    body: Preferăm să alegi aplicația potrivită decât să afli mai târziu. Dacă grupul tău are nevoie de una dintre acestea, Splitwise o are, iar Side Badger nu.
    items:
      - "**Aplicații din magazin.** Side Badger trăiește în browser și pe ecranul de pornire, nu în magazinele de aplicații."
      - "**Mod offline.** Side Badger are nevoie de o conexiune."
      - "**Plăți în aplicație.** În unele țări Splitwise poate transfera și banii. Side Badger doar ține evidența."
      - "**Împărțire pe cote sau pe articole.** Side Badger are un singur plătitor pe cheltuială, iar cheltuiala se împarte egal, pe sume exacte sau procentual. Scanarea chitanțelor nu atribuie articole persoanelor."
      - "**Grafice și împărțiri implicite.** Splitwise Pro le are pe amândouă. Side Badger ține evidența cine cui datorează, și asta e tot trucul."
  - heading: Mutarea grupului tău
    body: Nu există o funcție de import, deci mutarea înseamnă un nou început. Închide mai întâi conturile în Splitwise, apoi creează un grup în Side Badger și invită pe toată lumea cu un link sau un cod QR. Toți cei din grup au nevoie de un cont gratuit, iar pentru înscriere ai nevoie doar de o adresă de e-mail.
