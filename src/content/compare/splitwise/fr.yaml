meta:
  title: "Side Badger vs Splitwise : tout le groupe, pas seulement les comptes | Side Badger"
  description: "Une alternative gratuite à Splitwise pour tout le groupe : commentaires, questions, listes, sondages et vrais rôles, avec scan de reçus et conversion de devises gratuits."
h1: "Side Badger vs Splitwise : tout le groupe, pas seulement les comptes"
navLabel: Side Badger vs Splitwise
lead: "Quelqu'un dans votre groupe a probablement déjà dit « prenez Splitwise, tout simplement ». Pas faux : il est bon pour les calculs. Side Badger fait aussi les calculs, puis donne au groupe un endroit pour en discuter : commentaires, questions, listes, sondages et vrais rôles de groupe. Le scan de reçus et la conversion de devises sont gratuits."
cta:
  heading: "Essayez-le sur votre prochaine facture partagée"
  body: "Créez un compte gratuit, faites un groupe et ajoutez une vraie dépense. Si ce n'est pas pour vous, vous y aurez consacré quelques minutes, pas un abonnement."
asOf: 2026-11-22
asOfNote: "Nous avons lu les pages de Splitwise le {date} pour que vous n'ayez pas à le faire, et tout ce qui est écrit ici sur Splitwise en vient. Chaque ligne du tableau renvoie à sa source. Les offres changent, donc nous revérifions chaque trimestre, et si les pages de Splitwise contredisent celle-ci, croyez-les."
