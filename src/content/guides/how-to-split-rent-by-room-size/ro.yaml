faq:
  heading: "Întrebări"
  items:
    - q: "Ce facem dacă cineva are o cameră mai mare, dar cu mai puțină lumină?"
      a: "Suprafața este doar punctul de pornire, așa că grupul poate conveni să ajusteze. Scade un punct sau două de la camera întunecată, dă-le celorlalți și verifică dacă procentele tot dau 100. Side Badger păstrează ce stabiliți și nu judecă."
    - q: "Să împărțim și facturile după mărimea camerei?"
      a: "De obicei nu. Energia și internetul le folosesc toți, așa că o împărțire egală e mai simplă, ca în exemplul de mai sus. Dacă un coleg e acasă toată ziua, grupul poate conveni altceva, de exemplu sume exacte. [Împărțirea cheltuielilor](page:feature/split-expenses) explică opțiunile."
    - q: "Putem schimba împărțirea mai târziu?"
      a: "Da, pentru cheltuielile noi. Schimbă procentele când copiezi chiria, iar lunile anterioare rămân cum erau. Ca să corectezi o cheltuială din trecut, editează-o dacă permisiunile grupului o permit și spune mai întâi tuturor din casă, pentru că soldurile se schimbă. Versiunea anterioară se păstrează."
