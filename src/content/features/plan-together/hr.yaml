meta:
  title: "Zajednički popisi, ankete i komentari za troškove | Side Badger"
  description: "Komentiraj troškove, dovedi u pitanje čudne, vodi zajednički popis za kupnju i glasaj o vili. Planirajte zajedno, pa podijelite. Besplatno, bez oglasa."
h1: "Planiraj zajedno, podijeli poslije"
navLabel: "Planiranje zajedno"
lead: "Popis za kupnju i račun za kupnju napokon razgovaraju jedno s drugim. Side Badger daje tvojoj grupi mjesto za razgovor o novcu prije i nakon što se potroši, s komentarima na svakom trošku, načinom da dovedeš u pitanje one koji izgledaju krivo, zajedničkim popisima i anketama za velike odluke. Zatim [dijeliš troškove](page:feature/split-expenses) kao i inače."
cta:
  heading: "Isplaniraj, pa podijeli"
  body: "Napravi besplatan korisnički račun, osnuj grupu i stavi prvi popis, anketu ili pitanje točno uz novac. Ne znaš što slijedi? Pogledaj [kako radi](page:how-it-works)."
problem:
  heading: "Razgovor je ovdje, račun je ondje"
  body: "Troškovi grupe obično žive na dva mjesta. Brojevi su na jednom, a svađa oko brojeva u chatu koji je u utorak otklizao daleko gore. Popis za kupnju je fotografija hladnjaka. Vila je odlučena palcem gore od većine ljudi, vjerojatno. Side Badger drži planiranje u grupi, uz troškove na koje se odnosi, pa komentar stoji ondje gdje i trošak, popis ondje gdje i kupnja, anketa uz veliku odluku, a „čekaj, je li ovo točno?“ možeš reći bez pisanja eseja. Sve ostaje o novcu grupe, zbog čega grupa i postoji."
workflow:
  heading: "Od glasanja o vili do računa za kupnju"
  steps:
    - title: "Stavi veliku odluku na glasanje"
      body: "Dodaj anketu za odluku koja određuje račun, primjerice koja vila. Odaberi od dvije do deset opcija, reci koliko glasova svaka osoba ima, a zatim je zatvori kad su svi glasali i pobjednik je označen."
      shot: S17
      shotAlt: "Zatvorena anketa s označenom pobjedničkom opcijom i brojem glasova uz svaku opciju"
    - title: "Zajedno napišite popis za kupnju"
      body: "Započni zajednički popis, dodaj stavke i kvačicom ih označavaj kad stignu u kolica. Kupnja se poslije unosi kao trošak."
      shot: S16
      shotAlt: "Zajednički popis za kupnju s nekoliko označenih stavki i brojačem napretka"
    - title: "Razgovaraj o cijeni tamo gdje živi"
      body: "Komentiraj sam trošak, priloži račun i reagiraj emojijem. Razgovor ostaje uz broj na koji se odnosi."
      shot: S08
      shotAlt: "Trošak s pojedinostima, sličicom računa, nitom komentara i reakcijama emojijima"
    - title: "Dovedi u pitanje onaj koji izgleda čudno"
      body: "Ako je grupa uključila pitanja o troškovima, svatko tko je uključen u trošak može odabrati **Imam pitanje**. Trošak ostaje izvan stanja dok se pitanje ne riješi."
      shot: S18
      shotAlt: "Popis troškova s oznakom Dovedeno u pitanje i filtrom Samo dovedeno u pitanje"
    - title: "Vidi što se promijenilo i tko je to promijenio"
      body: "Aktivnost grupe i zvonce obavijesti prikazuju što je novo u svim tvojim grupama. Push obavijesti su tu ako ih želiš."
      shot: S19
      shotAlt: "Padajući izbornik obavijesti s popisom nedavne aktivnosti"
