sections:
  - heading: "Ce face bine Splitwise"
    body: "Dacă grupul tău are nevoie de o aplicație nativă, de utilizare offline sau de plăți în aplicație, Splitwise este alegerea rațională și am prefera să-l alegi decât să afli mai târziu. Paginile lui proprii enumeră:"
    items:
      - "**Aplicații și utilizare offline.** Aplicații pentru iPhone și Android, pe lângă web, și un mod offline."
      - "**Mai multe moduri de a împărți.** Împărțire pe părți, ajustări și împărțire pe articole, pe lângă egal, exact și procentual."
      - "**Cheltuieli recurente.** Setează chiria să se repete și uită de ea."
      - "**Plăți în aplicație.** În unele țări poate muta și banii, prin Splitwise Pay, Venmo, PayPal sau Pay by Bank."
  - heading: "Gratuit aici, cu plată acolo"
    body: "Splitwise Pro este planul cu plată al Splitwise, iar propria lui pagină Pro vinde patru lucruri care nu costă nimic în Side Badger."
    items:
      - "**Scanarea chitanțelor.** Splitwise Pro scanează o fotografie a chitanței. Side Badger o face gratuit, fără credite de scanare: completează totalul, data și locul ca să le verifici. Imaginile chitanțelor sunt citite de serviciul AI al Google."
      - "**Conversia valutară.** Splitwise Pro convertește cheltuielile unui grup în valuta ta implicită când atingi „Convert”. Side Badger convertește fiecare cheltuială pe măsură ce o introduci, la un curs de schimb actual sau la cel pe care l-ai primit de fapt, iar suma inițială rămâne pe cheltuială."
      - "**Fără reclame.** Splitwise listează o experiență complet fără reclame drept funcție Pro. Side Badger nu are reclame."
      - "**Fără limite zilnice.** Splitwise Pro vinde cheltuieli nelimitate, iar centrul lui de ajutor spune că utilizatorii gratuiți pot adăuga până la 4 cheltuieli pe zi. Side Badger nu are limite zilnice."
  - heading: "Ce are Splitwise și Side Badger nu"
    body: "Aceasta nu e fiecare funcție Splitwise, ci doar cele care tind să decidă. Paginile proprii ale Splitwise au lista completă. Iată unde Side Badger rămâne în urmă."
    items:
      - "**Aplicații native.** Side Badger funcționează în browser. Conectează-te, apoi adaugă-l pe ecranul de pornire și se deschide ca o aplicație."
      - "**Mod offline.** Side Badger are nevoie de o conexiune."
      - "**Plăți în aplicație.** Side Badger nu se atinge niciodată de banii tăi. Vă plătiți unii altora cum preferați, apoi înregistrați plata."
      - "**Cheltuieli recurente.** Side Badger nu are. Copiază chiria lunii trecute în loc să o scrii din nou."
      - "**Împărțire pe părți sau pe articole.** Side Badger are un singur plătitor pe cheltuială, împărțit egal, pe sume exacte sau procentual. Scanarea chitanțelor nu atribuie articole persoanelor."
      - "**Grafice și împărțiri implicite.** Splitwise Pro le are pe amândouă. Side Badger ține evidența cine cui datorează, și asta e tot trucul."
  - heading: "Mutarea grupului tău"
    body: "Nu există un importator, deci mutarea înseamnă un nou început. Achită-te mai întâi în Splitwise, apoi creează un grup în Side Badger și invită pe toată lumea cu un link sau un cod QR. Fiecare din grup are nevoie de un cont gratuit, iar pentru înscriere ai nevoie doar de o adresă de e-mail."
