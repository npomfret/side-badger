sections:
  - heading: Missä Splitwise on hyvä
    body: "Jos ryhmäsi tarvitsee natiivisovelluksen, offline-käyttöä tai maksuja sovelluksen sisällä, Splitwise on järkevä valinta, ja haluamme mieluummin, että valitset sen, kuin että saat sen selville myöhemmin. Sen omilla sivuilla luetellaan:"
    items:
      - "**Sovellukset ja offline-käyttö.** iPhone- ja Android-sovellukset verkon lisäksi sekä offline-tila."
      - "**Enemmän tapoja jakaa.** Jako osuuksina, säätöinä ja tuotteittain tasajaon, tarkkojen summien ja prosenttien lisäksi."
      - "**Toistuvat kulut.** Aseta vuokra toistumaan ja unohda koko asia."
      - "**Maksut sovelluksessa.** Joissakin maissa se voi siirtää myös rahat Splitwise Pay -palvelun, Venmon, PayPalin tai Pay by Bank -palvelun kautta."
  - heading: Täällä ilmaista, siellä maksullista
    body: "Splitwise Pro on Splitwisen maksullinen tilaus, ja sen oma Pro-sivu myy neljää asiaa, jotka eivät maksa Side Badgerissa mitään."
    items:
      - "**Kuittien skannaus.** Splitwise Pro skannaa kuvan kuitistasi. Side Badger tekee sen ilmaiseksi ilman skannauskrediittejä: se täyttää summan, päivämäärän ja paikan tarkistettavaksesi. Googlen tekoälypalvelu lukee kuittikuvat."
      - "**Valuuttojen muunnos.** Splitwise Pro muuntaa ryhmän kulut oletusvaluuttaasi, kun napautat Convert-painiketta. Side Badger muuntaa jokaisen kulun sitä syöttäessäsi nykyisellä valuuttakurssilla tai kurssilla, jonka todella sait, ja alkuperäinen summa säilyy kulussa."
      - "**Ei mainoksia.** Splitwise listaa täysin mainoksettoman käyttökokemuksen Pro-ominaisuudeksi. Side Badgerissa ei ole mainoksia."
      - "**Ei päivittäisiä rajoja.** Splitwise Pro myy rajattomia kuluja, ja sen ohjekeskuksen mukaan ilmaiskäyttäjät voivat lisätä enintään 4 kulua päivässä. Side Badgerissa ei ole päivittäisiä rajoja."
  - heading: Mitä Splitwisessa on, mitä Side Badgerissa ei ole
    body: "Nämä eivät ole kaikki Splitwisen ominaisuudet, vain ne, jotka yleensä ratkaisevat. Täydellinen lista on Splitwisen omilla sivuilla. Tässä kohdat, joissa Side Badger jää jälkeen."
    items:
      - "**Natiivisovellukset.** Side Badger toimii selaimessa. Kirjaudu sisään ja lisää se sitten aloitusnäytölle, niin se avautuu kuin sovellus."
      - "**Offline-tila.** Side Badger tarvitsee yhteyden."
      - "**Maksut sovelluksessa.** Side Badger ei koske rahoihisi koskaan. Maksakaa toisillenne miten haluatte ja kirjatkaa maksu sitten."
      - "**Toistuvat kulut.** Side Badgerissa ei ole niitä. Kopioi viime kuun vuokra sen sijaan, että kirjoittaisit sen uudelleen."
      - "**Jako osuuksina tai tuotteittain.** Side Badgerissa on yksi maksaja kulua kohden, ja kulu jaetaan tasan, tarkoilla summilla tai prosenteilla. Sen kuittien skannaus ei kohdista tuotteita ihmisille."
      - "**Kaaviot ja oletusjaot.** Splitwise Prossa on molemmat. Side Badger pitää kirjaa siitä, kuka on velkaa kenelle, ja siinä koko temppu."
  - heading: Ryhmän siirtäminen
    body: "Tuontityökalua ei ole, joten siirtyminen tarkoittaa uutta alkua. Tasaa tilit ensin Splitwisessa, perusta sitten ryhmä Side Badgerissa ja kutsu kaikki linkillä tai QR-koodilla. Jokainen ryhmässä tarvitsee ilmaisen tilin, ja rekisteröitymiseen riittää sähköpostiosoite."
