faq:
  heading: "Vprašanja"
  items:
    - q: "Kaj, če ima nekdo večjo sobo, a manj svetlobe?"
      a: "Površina je le izhodišče, zato se skupina lahko dogovori za popravek. Temni sobi odvzemi točko ali dve, ju daj drugim in preveri, da so odstotki še vedno skupaj 100. Side Badger shrani, kar se dogovorite, in o tem ne sodi."
    - q: "Ali naj tudi račune delimo po velikosti sobe?"
      a: "Običajno ne. Energijo in internet uporabljajo vsi, zato je enaka delitev preprostejša, kot v zgornjem primeru. Če je en sostanovalec ves dan doma, se lahko skupina dogovori drugače, na primer za točne zneske. Možnosti so opisane pri [delitvi stroškov](page:feature/split-expenses)."
    - q: "Ali lahko delitev pozneje spremenimo?"
      a: "Da, za nove stroške. Odstotke spremeni, ko kopiraš najemnino, in prejšnji meseci ostanejo, kakršni so bili. Če želiš popraviti pretekli strošek, ga uredi, če dovoljenja skupine to dopuščajo, in prej obvesti hišo, ker se stanja spremenijo. Prejšnja različica se ohrani."
