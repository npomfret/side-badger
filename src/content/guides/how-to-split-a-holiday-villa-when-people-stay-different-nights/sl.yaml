faq:
  heading: "Vprašanja o vili"
  items:
    - q: "Kaj, če kdo odpove?"
      a: "Odštej njegove noči, preračunaj in uredi strošek vile, da se točni zneski spet seštejejo v ceno. Prejšnja različica se ohrani, urejanje pa se pokaže v dejavnosti skupine, zato nihče ne spremeni številke neopazno. Kdo lahko ureja, je odvisno od dovoljenj skupine."
    - q: "Ali naj tisti, ki je rezerviral, plača manj?"
      a: "To odloči skupina. Rezervacija je opravilo in skupine se razlikujejo glede tega, ali si zasluži popust. Karkoli se dogovorite, vnesite v točne zneske in zapišite v opombo pri strošku ali v komentar ob njem, da si dogovora ni treba nikomur zapomniti."
    - q: "Ali lahko čiščenje delimo drugače?"
      a: "Da. Pristojbino vnesi kot ločen strošek in mu daj lastno delitev. Enako ustreza pavšalni pristojbini za vso hišo. Točni zneski ustrezajo skupini, ki želi, da pristojbina sledi tudi nočem."
