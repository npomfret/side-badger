meta:
  title: "إدارة المجموعة والأذونات للمصروفات المشتركة | Side Badger"
  description: "ادعُ الناس برابط أو رمز QR، ووافق على من ينضم، وعيّن مشاهدين، وحدّد الأذونات، وأقفل المجموعة حين تنتهي. مجموعتك، قواعدك، ضمن المعقول."
h1: "إدارة المجموعة والأذونات: قواعدك، ضمن المعقول"
navLabel: "المجموعات والأذونات"
lead: "بعض المجموعات تحتاج إلى أمين صندوق، ولدى Side Badger إعداد لذلك. ادعُ الناس برابط أو رمز QR، وقرّر من يدخل، واختر من يستطيع تغيير الأرقام. ومجموعة صغيرة من الأصدقاء تستطيع تجاهل هذا كله، لأن المجموعات الجديدة تبدأ مفتوحة على مصراعيها."
cta:
  heading: "مستعد لإدارة مجموعة مرتبة؟"
  body: "أنشئ حساباً، وابدأ مجموعة، وأرسل رابط الدعوة. اتركها مفتوحة، أو شدّد القواعد حين تكبر المجموعة أو تزداد تطلباً."
problem:
  heading: "لا بدّ أن يحافظ أحدهم على ترتيب الأرقام"
  body: "أربعة من زملاء السكن يستطيعون الاعتماد على الثقة. أما ثلاثون ضيفاً في عطلة نهاية أسبوع لحفل زفاف فمن المرجّح ألا يستطيعوا. أنشئ مجموعة لكل منزل أو رحلة أو مناسبة، بما يصل إلى 50 شخصاً في كل منها، فتحتفظ كل مجموعة بأعضائها وأدوارها وقواعدها. وتعرضها لوحة التحكم كلها، مع موقعك في كل واحدة، على شاشة واحدة. ومعظم المجموعات لا تلمس الإعدادات أبداً. أما التي تلمسها فعادةً ما يكون فيها شخص منظّم بما يكفي ليريدها."
workflow:
  heading: "من مجموعة فارغة إلى مجموعة مقفلة"
  steps:
    - title: "ادعُ برابط أو رمز QR"
      body: "افتح **دعوة الآخرين**، واختر مدة صلاحية الرابط (15 دقيقة أو ساعة واحدة أو يوم واحد أو 5 أيام)، ثم انسخ الرابط أو اعرض رمز QR ليمسحه الناس. ويمكنك أيضاً دعوة من تشاركهم مجموعة أخرى بالفعل، من داخل التطبيق."
      shot: S03
      shotAlt: "نافذة الدعوة مع رابط المجموعة ورمز QR الخاص به وخيار مدة صلاحية الرابط"
    - title: "دعهم يلقون نظرة قبل أن ينضموا"
      body: "كل من معه الرابط يسجّل الدخول أو ينشئ حساباً، ويرى معاينة للمجموعة، ويختار الاسم الذي يريد استخدامه فيها. ثم يضغط **الانضمام إلى المجموعة**."
      shot: S04
      shotAlt: "معاينة الانضمام إلى مجموعة، تظهر لشخص مسجّل الدخول قبل أن ينضم"
    - title: "وافق على من ينضم"
      body: "فعّل الموافقة، فيبقى من يستخدمون الرابط أعضاء معلقين إلى أن يسمح لهم مشرف بالدخول. يجد المشرفون هؤلاء تحت **الأعضاء المعلقون** في **الأمان والأذونات**، ويختارون **موافقة** أو **رفض**. وإلى ذلك الحين، لا يرى الشخص المعلق أي شيء في المجموعة."
      shot: S14
      shotAlt: "أعضاء معلقون ينتظرون أن يوافق عليهم مشرف أو يرفضهم"
    - title: "اختر من يستطيع تغيير ماذا"
      body: "اختر **تعاون مفتوح** أو **مجموعة مُدارة**، أو اضبط الأذونات واحداً واحداً. ثم أعطِ كل شخص دوراً: مشرف أو عضو أو مشاهد. ولا يستطيع تغيير الأذونات والأدوار إلا المشرفون."
      shot: S13
      shotAlt: "علامة تبويب الأمان في إعدادات المجموعة مع الإعدادين المسبقين والأذونات المخصصة"
    - title: "أقفلها حين تنتهي"
      body: "حين تنتهي الرحلة وتستقر الأرقام، يستطيع المشرف تفعيل **قفل المجموعة**. فلا يستطيع أحد إضافة مصروفات أو تغييرها، ولا تسجيل دفعات، ولا تعديل القوائم والاستطلاعات، وتظهر لافتة تقول ذلك. ولن يتمكن أحد من تمرير تاكسي متأخر في هدوء. وإن ظهر واحد فعلاً، يستطيع المشرف فتح قفل المجموعة."
      shot: S15
      shotAlt: "مجموعة تظهر فيها لافتة تقول إنها مقفلة"
options:
  heading: "المشرفون والأعضاء والمشاهدون"
  items:
    - title: "مشرف"
      body: "يدير المجموعة. يوافق المشرفون على الأعضاء الجدد، ويغيّرون الأدوار والأذونات، ويقفلون المجموعة ويفتحون قفلها، ويغلقونها. ومن ينشئ المجموعة يبدأ مشرفاً عليها، ولا تُترك المجموعة بلا مشرف أبداً، لأن آخر مشرف لا يمكن خفض دوره."
    - title: "عضو"
      body: "يشارك. وما يستطيع العضو فعله يعتمد على أذونات المجموعة. ففي مجموعة التعاون المفتوح يشمل ذلك كل شيء تقريباً. وفي المجموعة المُدارة لا يغيّر الأعضاء إلا المصروفات والقوائم التي أنشؤوها."
    - title: "مشاهد"
      body: "يرى كل شيء ولا يغيّر شيئاً. لا يستطيع المشاهد إضافة المصروفات أو القوائم أو تعديلها، ولا دعوة الناس، ولا تغيير الإعدادات، ولا لمس صورة الغلاف. مفيد لمن يريد مراقبة الأرقام ويعد بألا يعبث بها."
sections:
  - heading: "مفتوحة أو مُدارة أو بقواعدك أنت"
    body: "تبدأ المجموعات الجديدة على **تعاون مفتوح**، حيث يستطيع الجميع دعوة الناس وتغيير المصروفات وتعديل القوائم، وينضم الأعضاء الجدد تلقائياً. أما **مجموعة مُدارة** فللحالات التي يحتاج فيها أحدهم إلى أن يكون الراشد في الغرفة. ويمكنك أيضاً ضبط الأذونات السبعة واحداً واحداً، وتغيير أحدها يدوياً ينقل المجموعة إلى الإعداد المخصص. وأياً كان اختيارك، لا يغيّر الأذونات نفسها إلا المشرفون، ويظهر كل تغيير في سجل النشاط. وشقة من [زملاء السكن](page:use-case/housemates) تستطيع ترك كل شيء مفتوحاً. أما [مناسبة أو احتفال](page:use-case/events-and-celebrations) كبير فغالباً ما يريد الإعداد المُدار، ليكون أحدهم مسؤولاً عمّن ينضم. جديد على كل هذا؟ يستعرض [كيف يعمل](page:how-it-works) الرحلة كلها، من أول مصروف إلى تسوية الحساب."
    items:
      - "**من يمكنه تعديل المصروفات.** تعاون مفتوح: أي عضو. مجموعة مُدارة: المنشئون والمشرفون."
      - "**من يمكنه حذف المصروفات.** تعاون مفتوح: أي عضو. مجموعة مُدارة: المنشئون والمشرفون."
      - "**من يمكنه تعديل القوائم.** تعاون مفتوح: أي عضو. مجموعة مُدارة: المنشئون والمشرفون."
      - "**من يمكنه دعوة الأعضاء.** تعاون مفتوح: أي عضو. مجموعة مُدارة: المشرفون فقط."
      - "**موافقة عضو جديد.** تعاون مفتوح: تلقائية. مجموعة مُدارة: تتطلب موافقة مشرف."
      - "**من يمكنه تغيير الإعدادات.** تعاون مفتوح: أي عضو. مجموعة مُدارة: المشرفون فقط."
      - "**من يمكنه تغيير صورة الغلاف.** تعاون مفتوح: أي عضو. مجموعة مُدارة: المشرفون فقط."
  - heading: "اسمك وصورتك وصورة غلافك"
    body: "لكل مجموعة قائمة ممثليها الخاصة. اختر الاسم الذي يراه الناس في كل مجموعة (من 2 إلى 50 حرفاً، ويكون فريداً داخل المجموعة)، واختر أي صورة من صور ملفك الشخصي تظهر بها هناك. كن **سام** في البيت و**سام (صاحب السيارة)** في الرحلة. ويستطيع كل من يُسمح له بتغيير الإعدادات أن يعيد تسمية المجموعة ويعدّل وصفها. أما صورة الغلاف، وهي JPEG أو PNG أو GIF أو WebP بحجم يصل إلى 10 MB، فلها إذن خاص بها."
  - heading: "الأرشفة أو القفل أو الإغلاق"
    body: "ثلاث طرق لوضع المجموعة جانباً، من الأخف إلى الأشد."
    items:
      - "**الأرشفة** تخفي المجموعة من لوحة التحكم الخاصة بك وحدك، لا من لوحة أي شخص آخر. ويمكنك مع ذلك فتحها واستخدامها كما كانت، و**إلغاء أرشفة المجموعة** يعيدها."
      - "**القفل** يجمّد التغييرات إلى أن يفتح المشرف القفل. ويظل بوسع الجميع قراءة المجموعة وسجلها."
      - "**الإغلاق** نهائي، وللجميع. لا يستطيع فعله إلا مشرف، بكتابة اسم المجموعة للتأكيد، ولا يستطيع أحد فتح المجموعة مرة أخرى."
  - heading: "مغادرة مجموعة"
    body: "يستطيع أي شخص المغادرة بعد أن يسوّي حسابه. لا يمكنك المغادرة وأنت مدين أو دائن بمبلغ ولو بعملة واحدة، أو ما دام هناك سؤال مفتوح عن مصروف يخصك، أو إن كنت آخر مشرف أو العضو الوحيد. [سجّل الدفعة](page:feature/settle-up)، أو حلّ [سؤال المصروف](page:guide/what-to-do-when-someone-disputes-a-shared-expense)، أو اجعل شخصاً آخر مشرفاً، ثم غادر. وللعودة ستحتاج إلى دعوة جديدة."
limits:
  heading: "ضمن المعقول: الحروف الصغيرة"
  items:
    - "تتسع المجموعة لما يصل إلى 50 شخصاً."
    - "لا يغيّر الأذونات والأدوار إلا المشرفون. وآخر مشرف لا يمكن خفض دوره."
    - "ضبط تعديل المصروفات على الخيار **المسؤولون فقط** يعني أيضاً أن المشرفين وحدهم يستطيعون إضافة المصروفات."
    - "يوقف القفل تغييرات المصروفات والدفعات الجديدة والقوائم والاستطلاعات. ويظل بوسع الجميع قراءة المجموعة وسجلها، والتفاعل مع الدفعات."
    - "الإغلاق نهائي. وليس في التطبيق طريقة لإعادة فتح مجموعة مغلقة."
    - "إنشاء رابط دعوة جديد لا يلغي الروابط القديمة. فكل رابط يبقى صالحاً إلى انتهاء مدته، لذا اختر مدة قصيرة حين يقلقك المكان الذي قد يصل إليه الرابط."
    - "تعرض الدعوات داخل التطبيق الأشخاص من أحدث 10 مجموعات نشطة لديك. وأي شخص آخر يحتاج إلى الرابط، ومن يحق له الدعوة يعتمد على أذونات المجموعة."
    - "الانضمام يتطلب حساباً، ويجب على الناس التحقق من بريدهم الإلكتروني قبل أن يتمكنوا من إضافة أي شيء."
useCasesHeading: "حيث يفيد بعض النظام"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يستطيع المشاهد إضافة مصروفات؟"
      a: "لا. المشاهد يرى كل شيء ولا يغيّر شيئاً. لا يستطيع إضافة المصروفات أو القوائم أو تعديلها، ولا دعوة الناس ولا تغيير الإعدادات."
    - q: "هل يستطيع أحد المغادرة وهو مدين؟"
      a: "لا. لا يستطيع أحد مغادرة مجموعة وهو مدين أو دائن بمبلغ ولو بعملة واحدة. سوِّ الحساب أولاً ثم غادر."
    - q: "ماذا يحدث حين تُغلق المجموعة؟"
      a: "لا يستطيع أحد فتحها مرة أخرى. لا يغلق المجموعة إلا مشرف، وعليه كتابة اسم المجموعة للتأكيد، وتصبح المجموعة غير متاحة للجميع. وإن كنت تريد فقط إيقاف التغييرات فأقفلها. وإن كنت تريد فقط إخفاءها من لوحة التحكم الخاصة بك فأرشفها."
    - q: "هل أستطيع التراجع عن القفل؟"
      a: "نعم. يستطيع المشرف فتح قفل المجموعة، فتعمل التغييرات من جديد."
    - q: "هل يجب أن أوافق على الناس قبل أن ينضموا؟"
      a: "فقط إن أردت. تبدأ المجموعات الجديدة على التعاون المفتوح، حيث ينضم من يستخدمون الرابط تلقائياً. فعّل موافقة المشرف، أو اختر المجموعة المُدارة، فينتظر كل شخص إلى أن يسمح له مشرف بالدخول."
    - q: "كم شخصاً يمكن أن يكون في المجموعة؟"
      a: "حتى 50."
