meta:
  title: "Kalkulator for å dele regningen: hvem skylder hvem | Side Badger"
  description: "Hvem betalte, hvem skylder, hvem betaler hvem: ordnet på sekunder. Del likt, nøyaktig eller etter prosent. Gratis, i nettleseren: ingenting lagres eller sendes."
h1: Kalkulator for å dele regningen
navLabel: Kalkulator for å dele regningen
lead: Skriv inn hvem som betalte for hva, så sier kalkulatoren hvem som skylder hvem, med en kort liste over betalinger som gjør opp for det. Den kjører i nettleseren din, lagrer ingenting og flytter ingen penger. Trenger gruppen at regnskapet overlever fanen, kan dere [dele utgifter](page:feature/split-expenses) og [gjøre opp](page:feature/settle-up) i Side Badger, som gjør de samme regnestykkene og beholder dem.
cta:
  heading: Liker du regnestykkene? Behold dem.
  body: Denne kalkulatoren glemmer alt når du lukker fanen, omtrent som den som definitivt betalte forrige gang. En Side Badger-gruppe beholder utgiftene, oppdaterer alles saldo og registrerer betalingene. Den er gratis, uten annonser og uten daglige grenser.
sections:
  - heading: Slik fungerer utregningen
    body: For hver utgift regner kalkulatoren ut hver persons andel. Du kan dele den likt, etter nøyaktige beløp eller etter prosent, mellom de du velger. Hver persons saldo er så det vedkommende betalte minus det vedkommende skylder. Et plusstegn betyr at gruppen skylder personen, og et minustegn betyr at personen skylder gruppen. Saldoene summerer seg alltid til null, for det én person har til gode, skylder andre.
  - heading: Hvorfor listen over betalinger er kort
    body: Ingen trenger å gjøre opp hver kvittering for seg. Når hver saldo er kjent, setter kalkulatoren den som skylder mest sammen med den som har mest til gode, gjør opp så mye som én betaling kan, og fortsetter nedover listen til alle står på null. Den trenger aldri flere betalinger enn antall personer med en saldo minus én, og ofte færre enn om dere gjør opp regning for regning. Den gir en kort liste over betalinger, og lover ikke at den er den kortest mulige.
  - heading: Hva kalkulatoren ikke gjør
    items:
      - "**Håndtere mer enn én valuta.** Velg én og bruk den i hele utregningen. Appen fører en egen saldo for hver valuta, og kan konvertere en utgift med en gjeldende valutakurs, som du kan endre."
      - "**Lagre noe.** Lukker du fanen, er tallene borte. Vil du beholde dem, kopierer du lenken. Den inneholder tallene dine etter #-tegnet, som nettleseren din aldri sender til en server, og alle du sender den til, kan lese dem."
      - "**Flytte penger.** Den sier hvem som bør betale hvem. Dere betaler hverandre slik dere vil, og registrerer så betalingen i appen hvis gruppen fører regnskapet der."
      - "**Velge det odde øret tilfeldig.** Når en regning ikke går opp likt, går de overskytende øre til de første på listen, så summene fortsatt stemmer. I appen går det odde øret til én person tilfeldig, så det er ikke alltid den samme."
      - "**Gå over grensene.** Kalkulatoren tar 2 til 20 personer, og én utgift kan være opptil 999 999,99, som i appen."
