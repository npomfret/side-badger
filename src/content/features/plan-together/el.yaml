sections:
  - heading: "Σχόλια και αντιδράσεις, δίπλα στους αριθμούς"
    body: "Κάθε έξοδο έχει το δικό του νήμα σχολίων, όπως και η ομάδα, κάθε λίστα και κάθε ψηφοφορία. Ρωτήστε γιατί κόστισε τόσο το ταξί εκεί, στο έξοδο του ταξί, και όχι σε μια συνομιλία που κανείς δεν ξαναδιαβάζει. Προσθέστε μια φωτογραφία της απόδειξης ή ένα PDF της κράτησης και μετά αντιδράστε με αντίχειρα, καρδιά, γέλιο, wow, λύπη ή γιορτή σε έξοδα, πληρωμές και σχόλια. Γιορτάστε μια πληρωμή όταν φτάσει. Είναι ό,τι πιο κοντά σε χειροκρότημα έχει το Side Badger."
  - heading: "Αμφισβητήστε ένα έξοδο χωρίς να ξεκινήσετε καβγά"
    body: "Όταν η ομάδα έχει ενεργοποιημένες τις ερωτήσεις εξόδων, όποιος περιλαμβάνεται σε ένα έξοδο μπορεί να επιλέξει **Έχω μια ερώτηση** και να πει γιατί. Η ερώτηση δημοσιεύεται ως σχόλιο στο έξοδο, το έξοδο παίρνει την ένδειξη **Αμφισβητήθηκε** και ολόκληρο το έξοδο βγαίνει από τα υπόλοιπα όλων μέχρι να λυθεί η ερώτηση."
    items:
      - "**Ενεργοποίηση.** Είναι απενεργοποιημένο από προεπιλογή. Ένας διαχειριστής ενεργοποιεί την επιλογή **Να επιτρέπονται ερωτήσεις για έξοδα** στις ρυθμίσεις της ομάδας, στις **Λειτουργίες**."
      - "**Κλείσιμο.** Το άτομο που ρώτησε ή ένας διαχειριστής επιλέγει **Κλείσιμο ερώτησης**. Αν περισσότερα άτομα αμφισβήτησαν το ίδιο έξοδο, επιστρέφει στα υπόλοιπα όταν κλείσει η τελευταία ερώτηση."
      - "**Επεξεργασία.** Όταν ένα έξοδο επεξεργάζεται, μια ανοιχτή ερώτηση περνά στη νέα έκδοση για όλους όσοι έχουν ακόμη μερίδιο σε αυτό. Όσους η επεξεργασία αφήνει έξω, η ερώτησή τους τελειώνει με την παλιά έκδοση, οπότε δεν μένει τίποτα να κλείσουν."
      - "**Εύρεση.** Η λίστα εξόδων έχει φίλτρο **Μόνο υπό αμφισβήτηση**. Δεν είναι βήμα έγκρισης: παγώνουν μόνο τα έξοδα που αμφισβητεί κάποιος και όλα τα υπόλοιπα μετράνε μόλις προστεθούν."
  - heading: "Πώς εξελίσσεται μια ερώτηση"
    body: "Ο Τομ προσθέτει κρασί για το πάρτι αξίας 45 £, χωρισμένο και στους τρεις συγκατοίκους. Η Αΐσα δεν ήπιε, οπότε θέτει μια ερώτηση και όσο είναι ανοιχτή το κρασί δεν μετράει για κανέναν. Το σπίτι συμφωνεί ότι το κρασί είναι του Τομ και της Πρίγια, οπότε ο Τομ αλλάζει τον διαχωρισμό στους δύο τους. Η Αΐσα δεν είναι πια στο έξοδο, οπότε η ερώτησή της τελειώνει με την προηγούμενη έκδοση, η οποία διατηρείται, και το κρασί επιστρέφει αμέσως στα υπόλοιπα με 22,50 £ τον καθένα αντί για 15 £ τον καθένα. Αν η Αΐσα είχε μείνει στο έξοδο, η ερώτησή της θα είχε περάσει στη νέα έκδοση και θα περίμενε να την κλείσει η ίδια ή ένας διαχειριστής. Παρακάτω, τα 48 £ της Αΐσας είναι 28 £ από τα ψώνια και 20 £ από την καθαρίστρια, και τα 10,50 £ της Πρίγια είναι το μερίδιό της των 70,50 £ (28 £, 20 £ και 22,50 £) μείον τα 60 £ που πλήρωσε. Ο κλασικός καβγάς των [συγκατοίκων](page:use-case/housemates). Για το πώς να διατυπώσετε μια ερώτηση, δείτε [τι να κάνετε όταν κάποιος αμφισβητεί ένα κοινό έξοδο](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Κοινές λίστες, για τα ψώνια"
    body: "Ξεκινήστε μια λίστα στην ομάδα, δώστε της ένα όνομα όπως Λίστα Ψωνιών, προσθέστε είδη και τσεκάρετέ τα. Σύρετε τα είδη σε καλύτερη σειρά, δείτε τη μέτρηση προόδου να ανεβαίνει και σχολιάστε τη λίστα όταν κάποιος αγοράσει το λάθος γάλα βρώμης. Αρχειοθετήστε μια ολοκληρωμένη λίστα για να τη βάλετε στην άκρη (η **Προβολή αρχειοθετημένων** τη φέρνει πίσω) ή αντιγράψτε μια λίστα για να τη χρησιμοποιήσετε ξανά. Κρατήστε την κοινή λίστα ψωνιών δίπλα στους λογαριασμούς των ψωνιών, ώστε η λίστα να λέει τι να αγοράσετε και το έξοδο να λέει πόσο κόστισε. Το ποιος μπορεί να δημιουργεί και να επεξεργάζεται λίστες εξαρτάται από τα δικαιώματα της ομάδας, κάτι που εξηγεί η σελίδα για τις [ομάδες και τα δικαιώματα](page:feature/groups-and-permissions)."
  - heading: "Ψηφοφορίες, ανώνυμες αν θέλετε"
    body: "Ρωτήστε την ομάδα κάτι που ορίζει τον λογαριασμό, όπως ποια βίλα, πόσα να ξοδέψετε στο δώρο ή αν αξίζει η βαρκάδα. Μια ψηφοφορία έχει μια ερώτηση και δύο έως δέκα επιλογές. Εσείς διαλέγετε πόσες ψήφους έχει ο καθένας, από μία, δηλαδή μονή επιλογή, μέχρι δέκα, και αν η ψηφοφορία είναι ανώνυμη. Η **Ανώνυμη ψηφοφορία** κρύβει ποιος ψήφισε τι και δεν μπορεί να αλλάξει μόλις μπει η πρώτη ψήφος. Τα άτομα μπορούν να αλλάξουν ή να αφαιρέσουν την ψήφο τους μέχρι να κλείσει η ψηφοφορία και μπορείτε να την ανοίξετε ξανά αν η ομάδα το ξανασκεφτεί. Η επιλογή της βίλας είναι ακριβώς το υλικό των [ομαδικών ταξιδιών](page:use-case/group-trips) και η συμφωνία για τον προϋπολογισμό του δώρου είναι κλασικό για τις [εκδηλώσεις και γιορτές](page:use-case/events-and-celebrations)."
  - heading: "Η ροή δραστηριότητας, για να μην αλλάζει τίποτα στα κρυφά"
    body: "Κάθε ομάδα έχει ιστορικό δραστηριότητας και το καμπανάκι ειδοποιήσεων συγκεντρώνει τη δραστηριότητα από όλες τις ομάδες σας σε ένα μέρος. Προσθέστε ένα έξοδο και όλοι το βλέπουν αμέσως, χωρίς ανανέωση, και η ροή δείχνει τι άλλαξε και ποιος το άλλαξε. Αυτό καλύπτει έξοδα που προστέθηκαν, επεξεργάστηκαν ή διαγράφηκαν, ερωτήσεις που τέθηκαν και έκλεισαν, σχόλια, αλλαγές σε λίστες και ψηφοφορίες και πληρωμές που καταγράφηκαν."
  - heading: "Ειδοποιήσεις push, αν τις θέλετε"
    body: "Οι ειδοποιήσεις push είναι προαιρετικές. Ενεργοποιήστε τις στις **Ρυθμίσεις** του λογαριασμού σας, στις **Ειδοποιήσεις**, και η συσκευή σας σάς ενημερώνει όταν υπάρχει νέα δραστηριότητα στις ομάδες σας, όπως ένα νέο έξοδο ή ένα σχόλιο. Κάθε συσκευή ενεργοποιείται ξεχωριστά και το πρόγραμμα περιήγησής σας ζητά πρώτα άδεια. Σε iPhone ή iPad λειτουργούν μόνο στην εφαρμογή που έχει προστεθεί στην οθόνη Αφετηρίας, κάτι που εξηγεί η σελίδα για την [εφαρμογή ιστού](page:feature/web-app). Αντιμετωπίστε τις ως ευκολία και όχι ως υπόσχεση, γιατί η παράδοση δεν είναι εγγυημένη."
limits:
  heading: "Όρια"
  items:
    - "Τα σχόλια, οι λίστες και οι ψηφοφορίες είναι για τα χρήματα της ομάδας. Οι [όροι](page:terms) ζητούν όλα όσα δημοσιεύονται να σχετίζονται με τα οικονομικά της ομάδας, οπότε αυτό είναι ένα μέρος για να σχεδιάσετε τα έξοδα, όχι μια γενική συνομιλία ή μια εφαρμογή εργασιών."
    - "Ένα σχόλιο μπορεί να έχει έως 500 χαρακτήρες, με έως τρία συνημμένα που είναι εικόνες ή PDF έως 5 MB το καθένα. Μόνο ο συντάκτης μπορεί να διαγράψει ένα σχόλιο."
    - "Οι ερωτήσεις εξόδων είναι απενεργοποιημένες από προεπιλογή και ένας διαχειριστής τις ενεργοποιεί για κάθε ομάδα. Μόνο τα άτομα που περιλαμβάνονται σε ένα έξοδο μπορούν να το αμφισβητήσουν, η απενεργοποίηση της λειτουργίας εκκαθαρίζει κάθε ανοιχτή ερώτηση και κανείς δεν μπορεί να αφήσει την ομάδα όσο ένα έξοδο στο οποίο συμμετέχει έχει ανοιχτή ερώτηση."
    - "Μια ομάδα μπορεί να έχει έως 100 λίστες, καθεμία με έως 200 στοιχεία των έως 500 χαρακτήρων. Τα δικαιώματα της ομάδας ορίζουν ποιος μπορεί να δημιουργεί, να επεξεργάζεται και να διαγράφει λίστες και μια κλειδωμένη ομάδα δεν επιτρέπει αλλαγές."
    - "Μια ομάδα μπορεί να έχει έως 50 ψηφοφορίες, καθεμία με δύο έως δέκα επιλογές και έως δέκα ψήφους ανά άτομο. Οι ψηφοφορίες δεν έχουν προθεσμία και δεν κλείνουν μόνες τους."
    - "Το ιστορικό δραστηριότητας διατηρείται για 90 ημέρες."
    - "Οι ειδοποιήσεις push ενεργοποιούνται μόνο αν τις επιλέξετε, για κάθε λογαριασμό και κάθε συσκευή. Χρειάζονται πρόγραμμα περιήγησης που τις υποστηρίζει και την άδειά σας, σε iPhone και iPad λειτουργούν μόνο από την εφαρμογή που έχει προστεθεί στην οθόνη Αφετηρίας και η παράδοση δεν είναι εγγυημένη. Δεν υπάρχουν ειδοποιήσεις με email ή SMS για τη δραστηριότητα ούτε υπενθυμίσεις πληρωμής, οπότε το κυνήγι μιας πληρωμής μένει σε εσάς."
useCasesHeading: "Εκεί που βοηθά ο κοινός σχεδιασμός"
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Μπορούν οι ψήφοι να είναι ανώνυμες;"
      a: "Ναι. Ενεργοποιήστε την **Ανώνυμη ψηφοφορία** όταν δημιουργείτε την ψηφοφορία και κρύβει ποιος ψήφισε τι. Αποφασίστε πριν από την πρώτη ψήφο, γιατί δεν μπορεί να αλλάξει μετά."
    - q: "Μπορεί μια ψηφοφορία να κλείσει μόνη της;"
      a: "Όχι. Μια ψηφοφορία δεν έχει προθεσμία, οπότε το άτομο που τη δημιούργησε επιλέγει **Κλείσιμο ψηφοφορίας** όταν η ομάδα αποφασίσει. Αν η ομάδα το ξανασκεφτεί, το **Άνοιγμα ψηφοφορίας ξανά** την επαναφέρει."
    - q: "Πόσα στοιχεία χωρά μια λίστα;"
      a: "Έως 200 στοιχεία ανά λίστα και έως 100 λίστες ανά ομάδα. Κάθε στοιχείο μπορεί να έχει έως 500 χαρακτήρες, που είναι πολύ γάλα βρώμης."
    - q: "Ποιος μπορεί να κλείσει μια ερώτηση και τι γίνεται στο μεταξύ με το έξοδο;"
      a: "Το άτομο που ρώτησε ή ένας διαχειριστής της ομάδας. Όσο μια ερώτηση είναι ανοιχτή, ολόκληρο το έξοδο είναι εκτός των υπολοίπων όλων. Επιστρέφει όταν κλείσει η τελευταία ανοιχτή ερώτηση γι' αυτό ή όταν μια επεξεργασία βγάζει από το έξοδο το άτομο που ρώτησε."
    - q: "Μπορώ να χρησιμοποιήσω τις λίστες και τα σχόλια ως εφαρμογή εργασιών ή ομαδική συνομιλία;"
      a: "Όχι. Τα σχόλια, οι λίστες και οι ψηφοφορίες είναι για τα χρήματα της ομάδας, κάτι που ζητούν και οι [όροι](page:terms). Σκεφτείτε λίστες ψωνιών, ψηφοφορίες για τον προϋπολογισμό και «γιατί είναι 45 £ αυτό;»."
    - q: "Θα μου στέλνει email το Side Badger για τη δραστηριότητα;"
      a: "Όχι. Δεν υπάρχουν ειδοποιήσεις με email ή SMS για τη δραστηριότητα. Μπορείτε να ενεργοποιήσετε τις ειδοποιήσεις push σε κάθε συσκευή και το καμπανάκι ειδοποιήσεων στην εφαρμογή δείχνει τι νέο υπάρχει."
