sections:
  - heading: টাকার কথা, টাকার পাশেই
    body: যৌথ টাকার সঙ্গে আসে আড্ডা, দ্বিধা আর পরিকল্পনা। Side Badger তিনটেই অঙ্কের পাশে রাখে, তাই গ্রুপ চ্যাটে পিছিয়ে গিয়ে স্ক্রল করতে হয় না কাউকে।
    items:
      - "**মন্তব্য যেখানে থাকা উচিত।** গ্রুপটার ওপরেই মন্তব্য করুন, কিংবা যেকোনো খরচ, তালিকা বা পোলে, আর কথাবার্তা রাখুন যার কথা হচ্ছে তার পাশেই।"
      - "**রসিদ আর ছবি।** প্রতিটি খরচে তিনটি পর্যন্ত রসিদ রাখুন, আর গ্রুপ, তালিকা বা পোলের মন্তব্যে ছবি বা PDF যোগ করুন।"
      - "**প্রশ্ন, ঝগড়া নয়।** অ্যাডমিন প্রশ্ন চালু করতে পারেন, তখন খরচে থাকা যে কেউ সেটা নিয়ে প্রশ্ন করতে পারে। মীমাংসা না হওয়া পর্যন্ত সেটা ব্যালেন্সের বাইরে থাকে।"
      - "**তালিকা আর পোল।** যৌথ বাজারের তালিকাটা বাজারের বিলের পাশেই রাখুন, আর ভিলার বাছাই তালিকা ভোটে তুলুন, চাইলে নাম না জানিয়ে।"
      - "**একটু হাততালি।** খরচ, পেমেন্ট আর মন্তব্যে রিঅ্যাক্ট করুন, আর পেমেন্ট এসে পৌঁছালে উদ্‌যাপন করুন।"
  - heading: আপনার গ্রুপ, আপনার নিয়ম
    body: Splitwise-এর সহায়তা কেন্দ্র বলে তারা গ্রুপ অ্যাডমিন বা বিশেষ অনুমতি সমর্থন করে না। Side Badger-এ রোল আর অনুমতি আছে, যে গ্রুপগুলোর কাউকে হিসাব গোছানো রাখতে হয় তাদের জন্য।
    items:
      - "**অ্যাডমিন, সদস্য আর দর্শক।** কাউকে দর্শক বানান: সে সবকিছু দেখে, কিছুই বদলাতে পারে না।"
      - "**দুটি প্রিসেট, অথবা নিজের মতো।** শুরু করুন ওপেন কোলাবরেশন বা ম্যানেজড গ্রুপ দিয়ে, কিংবা প্রতিটি অনুমতি নিজে ঠিক করুন: কে খরচ এডিট ও ডিলিট করবে, কে তালিকা এডিট করবে, কে আমন্ত্রণ জানাবে আর নতুন মানুষকে ঢুকতে দেবে।"
      - "**যোগ দিতে অনুমোদন।** অনুমোদন চালু করুন, আর একজন অ্যাডমিন প্রত্যেককে ঢুকতে দেবেন।"
      - "**গ্রুপের নিজস্ব সেটিংস।** শুধু যে মুদ্রাগুলো আপনারা আসলে ব্যবহার করছেন সেগুলোতেই সীমিত রাখুন, ডিফল্ট মুদ্রা বেছে নিন আর একটি হেডার ইমেজ দিন।"
      - "**শেষ হলে লক করে দিন।** অ্যাডমিন আনলক না করা পর্যন্ত অঙ্কগুলো যেমন আছে তেমনই থাকে।"
  - heading: এখানে বিনামূল্যে, ওখানে টাকা দিয়ে
    body: Splitwise Pro হলো Splitwise-এর পেইড প্ল্যান, আর এর নিজের Pro পৃষ্ঠা এমন তিনটি জিনিস বিক্রি করে যেগুলোর জন্য Side Badger-এ কিছু লাগে না।
    items:
      - "**রসিদ স্ক্যান।** Splitwise Pro আপনার রসিদের ছবি স্ক্যান করে। Side Badger সেটা বিনামূল্যে করে, কোনো স্ক্যান ক্রেডিট ছাড়া: এটি মোট, তারিখ আর জায়গা ভরে দেয় আপনার দেখে নেওয়ার জন্য।"
      - "**মুদ্রা রূপান্তর।** Splitwise Pro আপনি “Convert” চাপলে একটি গ্রুপের খরচগুলো আপনার ডিফল্ট মুদ্রায় রূপান্তর করে। Side Badger প্রতিটি খরচ লেখার সময়ই রূপান্তর করে, বর্তমান এক্সচেঞ্জ রেটে বা আপনি আসলে যে রেট পেয়েছেন সেটায়, আর মূল পরিমাণ খরচের সঙ্গেই থাকে।"
      - "**দৈনিক কোনো সীমা নেই।** Splitwise Pro সীমাহীন খরচ বিক্রি করে, আর এর সহায়তা কেন্দ্র বলে বিনামূল্যের ব্যবহারকারীরা প্রতিদিন 4টি পর্যন্ত খরচ যোগ করতে পারে। Side Badger-এ দৈনিক কোনো সীমা নেই।"
  - heading: আপনার ব্যাংক থাকে বাইরেই
    body: Side Badger আপনার ব্যাংকের সঙ্গে যুক্ত হয় না, আর ব্যাংকের তথ্যও চায় না। কে কাকে কত দেবে তার হিসাব এটি রাখে; আপনারা যেভাবে খুশি একে অপরকে টাকা মিটিয়ে দেন, তারপর পেমেন্টটা রেকর্ড করেন। ব্যাংকের লগইন তুলে দিতে হয় না, তাই সামলানোর একটা দুশ্চিন্তা কম।
  - heading: একটাই অ্যাপ, ব্রাউজারে আর ফোনে
    body: Side Badger আপনার ব্রাউজারে চলে। সাইন ইন করুন, হোম স্ক্রিনে যোগ করুন, আর এটি অ্যাপের মতো খোলে। দুই জায়গায় একই অ্যাপ, তাই নতুন ফিচার আপনার ফোনে আসে পরের বার খোলার সঙ্গে সঙ্গেই, অ্যাপ স্টোরের আপডেটের অপেক্ষা ছাড়াই।
  - heading: আর কয়েকটা মজার ট্রিক
    items:
      - "**আপনার অ্যাসিস্ট্যান্টকে বলুন।** Side Badger ChatGPT আর Claude-এর সঙ্গে কাজ করে: আপনারটিকে বলুন খরচ যোগ করতে, রসিদ স্ক্যান করতে বা পেমেন্ট রেকর্ড করতে।"
      - "**প্রত্যেকে নিজের ভাষায়।** Side Badger 39টি ভাষায় কথা বলে আর প্রত্যেকে নিজের ভাষা বেছে নেয়। Splitwise-এর হোম পেজ বলছে 7+। 133টি মুদ্রাও চলে, যে ট্রিপ সব জায়গায় যায় তার জন্য।"
      - "**অ্যাপ না ছেড়েই সাহায্য।** আটকে গেছেন, বা বাগ পেয়েছেন? অ্যাপ থেকেই আমাদের জানান আর সেখানেই আমাদের উত্তর পড়ুন।"
  - heading: যেখানে Splitwise এখনও এগিয়ে
    body: আমরা চাই পরে ঠেকে শেখার চেয়ে আপনি শুরুতেই সঠিক অ্যাপটা বেছে নিন। আপনার গ্রুপের এগুলোর কোনোটা দরকার হলে সেটা Splitwise-এ আছে, Side Badger-এ নেই।
    items:
      - "**অ্যাপ স্টোরের অ্যাপ।** Side Badger থাকে আপনার ব্রাউজারে আর হোম স্ক্রিনে, অ্যাপ স্টোরে নয়।"
      - "**অফলাইন মোড।** Side Badger-এর সংযোগ লাগে।"
      - "**অ্যাপের ভেতরে পেমেন্ট।** কিছু দেশে Splitwise টাকাও পাঠাতে পারে। Side Badger শুধু হিসাবটা রাখে।"
      - "**শেয়ার বা আইটেম ধরে ভাগ।** Side Badger-এ প্রতি খরচে একজন পেমেন্টকারী, যা সমান ভাগে, সঠিক পরিমাণে বা শতাংশে ভাগ হয়। এর রসিদ স্ক্যান আইটেমগুলো আলাদা আলাদা মানুষের ভাগে ভাগ করে দেয় না।"
      - "**চার্ট আর ডিফল্ট ভাগ।** Splitwise Pro-তে দুটোই আছে। Side Badger কে কাকে কত দেবে তার হিসাব রাখে, আর পুরো কেরামতি ওইটুকুই।"
  - heading: আপনার গ্রুপকে নিয়ে আসা
    body: কোনো ইমপোর্টার নেই, তাই চলে আসা মানে নতুন করে শুরু। আগে Splitwise-এ হিসাব মিটিয়ে নিন, তারপর Side Badger-এ একটি গ্রুপ বানিয়ে সবাইকে লিঙ্ক বা QR কোড দিয়ে ডাকুন। গ্রুপের প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট লাগে, আর সাইন আপ করতে শুধু একটি ইমেইল ঠিকানাই লাগে।
