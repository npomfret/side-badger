meta:
  title: "Dělení účtů bez stahování aplikace | Side Badger"
  description: "Telefon je plný, chápeme. Side Badger běží v prohlížeči, bez obchodu s aplikacemi a bez stahování. Přidejte si ho na plochu a otevře se jako aplikace."
h1: "Žádný obchod s aplikacemi. Žádné stahování. Přesto jako aplikace"
navLabel: "Webová aplikace"
lead: "Side Badger žije ve vašem prohlížeči. Nemusíte hledat v obchodě s aplikacemi ani nic nejdřív stahovat. Přihlaste se na telefonu nebo počítači, dělte výdaje online se skupinou a až budete chtít, přidejte si ho na plochu nebo do Docku, aby byl na jedno klepnutí."
cta:
  heading: "Otevřete. Přihlaste se. Založte skupinu."
  body: "Vytvořte si účet, založte skupinu a přidejte první výdaj, vše z prohlížeče, který už máte otevřený. Chcete nejdřív prohlídku? Podívejte se, [jak to funguje](page:how-it-works), nebo [co zahrnuje bezplatná verze](page:pricing)."
problem:
  heading: "Telefon je plný. Chápeme."
  body: "Někde v něm je čtyři tisíce fotek stejného západu slunce a upozornění na plné úložiště, které odkládáte od jara. Poslední, co potřebuje, je další aplikace jen kvůli rozdělení jedné večeře. Proto je Side Badger webová aplikace. Běží v moderním prohlížeči na telefonu i na počítači. Na telefonu používá mobilní rozvržení, se stránkou skupiny rozdělenou na karty a ovládacími prvky pro dotyk. Některé extra věci, například přidání na plochu, závisejí na vašem prohlížeči, a říkáme, které."
workflow:
  heading: "Od karty v prohlížeči po plochu ve třech krocích"
  steps:
    - title: "Otevřete a přihlaste se"
      body: "Otevřete Side Badger v prohlížeči a přihlaste se. Stačí e-mailová adresa a heslo a e-mail ověříte, než můžete cokoli přidat. Každý ve skupině potřebuje účet, takže lidé, které pozvete, udělají totéž."
    - title: "Přidejte si ho na plochu nebo do Docku"
      body: "Jakmile jste přihlášeni, aplikace nabídne, že se sama nainstaluje. Tam, kde to prohlížeč dovoluje, uvidíte tlačítko **Nainstalovat**, a kde ne, **Ukázat, jak na to**. Propásli jste nabídku, nebo jste ji odmítli? Stejnou nápovědu najdete v **Nastavení** pod **Přidat na plochu nebo do Docku**. Na iPhonu nebo iPadu Nastavení ukáže nejdřív kroky pro iPhone a ostatní zařízení schová pod **Další zařízení**. Tak či onak se aplikace pak otevírá ve vlastním okně."
      shot: S20
      shotAlt: "Část Přidat na plochu nebo do Docku v Nastavení s kroky pro přidání aplikace do zařízení"
    - title: "Zapněte oznámení, pokud je chcete"
      body: "Oznámení jsou vypnutá, dokud je nezapnete, a každé zařízení se zapíná zvlášť. Použijte tlačítko **Zapnout**, které nabízí zvonek oznámení, nebo přepínač **Push oznámení** v **Nastavení**. Na iPhonu nebo iPadu nejdřív otevřete aplikaci z plochy. Jen tam oznámení fungují."
      shot: S19
      shotAlt: "Rozbalená nabídka oznámení se seznamem nedávné aktivity ve skupině"
options:
  heading: "Jak ji přidat, zařízení po zařízení"
  items:
    - title: "iPhone a iPad"
      body: "Klepněte na tlačítko Sdílet, čtverec se šipkou směřující nahoru. Pokud ho nevidíte, klepněte nejprve na tři tečky (•••), pak na Sdílet. Přejděte dolů a klepněte na **Přidat na plochu**. Nechte zapnuté **Otevřít jako webovou aplikaci** a klepněte na **Přidat**. Pokud se odkaz otevřel uvnitř jiné aplikace, otevřete stránku nejdřív v Safari, protože tento vestavěný prohlížeč ji přidat neumí."
    - title: "Android"
      body: "Otevřete nabídku prohlížeče a vyberte **Přidat na plochu** nebo **Nainstalovat aplikaci**."
    - title: "Chrome nebo Edge v počítači"
      body: "Otevřete nabídku prohlížeče a vyberte možnost instalace tohoto webu jako aplikace. Dostane vlastní okno a vlastní ikonu."
    - title: "Safari na Macu"
      body: "Vyberte **Soubor** a pak **Přidat do Docku**."
sections:
  - heading: "Oznámení, jen když o ně požádáte"
    body: "Push oznámení jsou dobrovolná. Zapněte je a dostanete oznámení, když ve vašich skupinách vznikne nová aktivita, třeba když někdo přidá výdaj, napíše komentář nebo zaznamená platbu. Zapínají se po jednom zařízení, ze zvonku oznámení nebo z **Nastavení**, a tam je také můžete zase vypnout. Vyžadují prohlížeč, který je podporuje, a vaše povolení. Pokud je prohlížeč pro tento web zablokoval, povolte je nejdřív v nastavení prohlížeče. Na iPhonu nebo iPadu fungují jen z aplikace přidané na plochu, ne z karty prohlížeče. Doručení není zaručeno, berte tedy oznámení jako šťouchnutí, ne jako slib. Co se objeví v aktivitě, najdete na stránce [plánujte spolu](page:feature/plan-together)."
  - heading: "Živé aktualizace, žádné tlačítko Obnovit"
    body: "Přidáte výdaj a všichni ho hned vidí, spolu s tím, co se změnilo a kdo to změnil. Každá skupina vede historii aktivity a zvonek oznámení ukazuje aktivitu ze všech vašich skupin. Nikdo se nemusí ptát, jestli jste viděli, co jste právě přidali. Mají to na obrazovce."
  - heading: "39 jazyků, každý po svém"
    body: "Side Badger můžete používat ve 39 jazycích, včetně arabštiny, perštiny a urdštiny psaných zprava doleva. Každý ve skupině si vybere svůj, takže stejná stránka skupiny může být pro jednoho v arabštině a pro dalšího v angličtině. Jediné, na čem se skupina musí shodnout, jsou čísla."
  - heading: "Postavená pro víc než jeden druh uživatelů"
    body: "Side Badger je postaven s ohledem na uživatele klávesnice a čteček obrazovky. Barvy členů mají vzory, takže nemusíte rozlišovat zelenou od červené."
    items:
      - "Odkazy pro přeskočení, aby uživatelé klávesnice mohli skočit rovnou na obsah."
      - "Dialogy řídí fokus klávesnice."
      - "Ovládací prvky jsou popsané pro čtečky obrazovky."
      - "Rozvržení se převracejí pro jazyky psané zprava doleva."
limits:
  heading: "Co webová aplikace nedělá"
  items:
    - "Nefunguje offline. Side Badger potřebuje připojení, takže vaši skupinu v letadle bez wifi neotevře."
    - "Neexistuje aplikace v obchodě s aplikacemi ani nativní aplikace pro iPhone nebo Android. Side Badger je webová aplikace a přidání na plochu nebo do Docku je způsob, jak získat verzi podobnou aplikaci."
    - "Přidání na plochu nebo do Docku závisí na vašem prohlížeči. Názvy nabídek se mezi prohlížeči a verzemi liší a některé prohlížeče tuto možnost nenabízejí."
    - "Push oznámení jsou volitelná pro každé zařízení a vyžadují prohlížeč, který je podporuje, a vaše povolení. Na iPhonu a iPadu fungují jen z aplikace přidané na plochu. Doručení není zaručeno."
    - "Neexistují žádná e-mailová ani SMS upozornění a žádné připomínky plateb. Nová aktivita se zobrazuje v aplikaci a jako push oznámení, pokud je zapnete. Vymáhání platby zůstává na vás."
    - "Aktivita se uchovává 90 dní."
    - "Přihlašujete se e-mailovou adresou a heslem. Přihlášení přes Google nebo Apple neexistuje a musíte mít alespoň 18 let."
    - "Netvrdíme, že Side Badger je plně přístupný, ani že splňuje formální standard přístupnosti. Pokud vám něco překáží, napište nám přímo z aplikace a odpověď tam uvidíte."
useCasesHeading: "Kde pomáhá nepotřebovat aplikaci"
faq:
  heading: "Otázky"
  items:
    - q: "Je Side Badger v obchodě s aplikacemi?"
      a: "Ne. Side Badger je webová aplikace. Otevřete ji v prohlížeči a můžete si ji přidat na plochu nebo do Docku, aby se otevírala jako aplikace. Z obchodu s aplikacemi není co stahovat."
    - q: "Mohu dělit účty bez stahování aplikace?"
      a: "Ano. Otevřete Side Badger v prohlížeči na telefonu nebo počítači, přihlaste se a založte skupinu. Přidání na plochu nebo do Docku je volitelné."
    - q: "Funguje to offline?"
      a: "Ne. Side Badger potřebuje připojení, i když je přidaný na plochu nebo do Docku."
    - q: "Proč mi na iPhonu nechodí oznámení?"
      a: "Na iPhonu nebo iPadu fungují oznámení jen z aplikace přidané na plochu, ne z karty prohlížeče. Přidejte ji, otevřete z ikony na ploše a pak zapněte oznámení v **Nastavení**. Doručení není zaručeno, takže pokud jedno chybí, historie aktivity skupiny pořád ukazuje, co se přidalo."
    - q: "Musím oznámení zapnout?"
      a: "Ne. Jsou vypnutá, dokud je nezapnete, po jednom zařízení. Bez nich se nová aktivita pořád zobrazuje v aplikaci a všichni vidí změnu hned, když mají aplikaci otevřenou."
    - q: "Potřebuje účet každý ve skupině?"
      a: "Ano. Stačí e-mailová adresa a heslo a e-mail ověříte, než můžete cokoli přidat. Totéž udělá každý, kdo se ke skupině připojí, na jakémkoli telefonu nebo počítači."
