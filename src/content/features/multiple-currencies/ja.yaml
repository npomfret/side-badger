meta:
  title: 140の通貨で割り勘。換算も、別々の管理も
  description: 各支出を支払った通貨で入力し、残高を別々に保つか、確認も変更もできるレートで換算して、短い支払いリストで精算できます。
h1: 140の通貨で割り勘
navLabel: 複数の通貨
lead: ユーロに円、そしてバーツで払ったあのタクシー。Side Badgerは各支出を支払った通貨のまま受け取って残高を整理し、グループが一度で精算したいときは換算もできます。140の通貨に対応し、[グループ旅行](page:use-case/group-trips)にぴったりです。
cta:
  heading: ユーロも円も、そのままどうぞ
  body: アカウントを作成し、グループを始めて、たまたま手元にあった通貨で最初の支出を追加しましょう。
  button: 無料アカウントを作成
problem:
  heading: 支払ったとおりに入力
  body: 旅行の支払いが1つの通貨で済むことはまずありません。ホテルは自宅でポンドで予約し、夕食は円で払い、空港のコーヒーは乗り継ぎ先の通貨でした。入力する前にすべて手作業で換算するのは、表計算シートが放置される原因です。Side Badgerでは、レシートに書かれた通貨で各支出を入力でき、どの金額もその通貨のルールに従うので、円には小数がなく、ディナールは3桁です。最近使った通貨はリストの先頭に表示されます。
workflow:
  heading: 通貨を別々に保つか、入力しながら換算するか
  steps:
    - title: その通貨のまま支出を追加
      body: 通貨を選び、金額を入力し、誰が支払い、誰が分け合ったかを指定します。必要なのはそれだけです。これが初期設定で、入力した元の金額がそのまま保たれます。
      shot: S07
      shotAlt: 円の金額を入力した支出フォーム
    - title: 通貨ごとの残高を見る
      body: 残高は通貨ごとに別々に管理され、それぞれに提案される短い支払いリストがあります。ポンドはポンドで、円は円で精算します。
      shot: S10
      shotAlt: 2つの通貨で簡略化された債務を表示した残高画面
    - title: または、グループが一度で精算したいときは換算
      body: 支出の入力時に別の通貨を選ぶと、Side Badgerは現在の為替レートで換算でき、レートは実際に適用されたものに変更できます。換算後の金額は、その通貨の残高に加わります。換算はグループが選ぶもので、知らないうちに行われることはありません。
options:
  heading: 確認も変更もできるレート
  items:
    - title: レートが表示される
      body: 換算するとレートと換算後の金額がフォームに表示されるので、誰も数字を鵜呑みにする必要がありません。
    - title: 自分で入力する
      body: 両替所でもっと良いレートだった、あるいは空港でもっと悪かった。実際に適用されたレートに編集すれば、換算後の金額も更新されます。
    - title: 元の金額は残る
      body: 元の金額は、換算後の金額の隣で支出にそのまま残るので、円でいくらだったかと聞かれても答えられます。
    - title: 換算は無料
      body: 換算は無料です。別の通貨で支出を入力しても、手数料はかかりません。
