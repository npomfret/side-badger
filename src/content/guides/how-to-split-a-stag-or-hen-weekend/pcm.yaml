    - label: Taxi
      payer: kat
      amount: 44
      split:
        method: equal
faq:
  heading: "Question dem"
  items:
    - q: "Best man or maid of honour go pay more?"
      a: "Only if di group agree. Di app no dey give anybody special role for di sums. If somebody dey cover more, choose **Exact amaunts** or **Pasentej** under **How we go split am** and enter di shares wey una agree."
    - q: "Wetin about drinks wey some people no drink?"
      a: "Add di drinks as dem own expense and tick only di people wey drink dem. If everybody drink different amount, choose **Exact amaunts** and type each person share. Nobody go pay for wetin im no take."
    - q: "Guest of honour fit see di group later?"
      a: "Yes, once di surprise don finish. Invite am, then admin fit make am **Viua** under **Security** for di group settings. Viua go see everything and change nothing, so wait until nothing be secret again. E need free account to join."
