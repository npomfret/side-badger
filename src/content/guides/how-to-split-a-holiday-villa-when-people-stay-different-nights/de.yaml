faq:
  heading: "Fragen zur Villa"
  items:
    - q: "Was, wenn jemand absagt?"
      a: "Nimm die Nächte der Person heraus, rechne neu und bearbeite die Villa-Ausgabe, damit die genauen Beträge wieder den Preis ergeben. Die frühere Version bleibt erhalten, und die Änderung erscheint in der Aktivität der Gruppe, niemand ändert also heimlich eine Zahl. Wer bearbeiten darf, hängt von den Berechtigungen der Gruppe ab."
    - q: "Soll die Person, die gebucht hat, weniger zahlen?"
      a: "Das entscheidet die Gruppe. Buchen ist eine lästige Pflicht, und Gruppen sind unterschiedlicher Meinung, ob das einen Rabatt verdient. Was auch immer ihr vereinbart, setzt es in die genauen Beträge und schreibt es in eine Notiz an der Ausgabe oder in einen Kommentar daneben, damit sich niemand die Abmachung merken muss."
    - q: "Können wir die Reinigungsgebühr anders aufteilen?"
      a: "Ja. Trage die Gebühr als eigene Ausgabe ein und gib ihr eine eigene Aufteilung. Gleichmäßig passt zu einer Pauschale für das ganze Haus. Genaue Beträge passen zu einer Gruppe, bei der die Gebühr ebenfalls den Nächten folgen soll."
