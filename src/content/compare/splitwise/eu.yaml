faq:
  heading: "Galderak"
  items:
    - q: "Side Badger Splitwise-ren ordezko doakoa al da?"
      a: "Talde batean fakturak banatzeko, bai. Tiketen eskaneatzea, moneta-bihurketa eta iragarkirik eza doakoak dira, eguneko mugarik gabe. Aplikazio natibo bat, konexiorik gabeko erabilera, gastu errepikariak edo aplikazioaren barruko ordainketak behar badituzu, Splitwise-k egiten ditu eta Side Badger-ek ez."
    - q: "Nondik datoz Splitwise-ri buruzko xehetasunak?"
      a: "Splitwise-ren bere orrietatik: bere hasiera orritik, bere Pro orritik eta bere laguntza-zentrotik. Taulako errenkada bakoitzak jatorri duen orrira lotzen du, eta taularen gaineko datak noiz irakurri genituen esaten du. Hiruhilekoro egiaztatzen ditugu."
    - q: "Side Badger doakoa izaten jarraituko al du?"
      a: "Side Badger-en dena doakoa da gaur egun, eta ez dago ordainpeko mailarik. Hori aldatuz gero, aurretik jakinaraziko dizugu. [Prezioen orrian](page:pricing) xehetasunak daude."
    - q: "Nire taldeko guztiek aldatu behar dute?"
      a: "Bai. Talde bateko guztiek doako Side Badger kontu bat behar dute, eta esteka edo QR kode batekin sar daitezke."
    - q: "Side Badger-ek mugikorrerako aplikaziorik al du?"
      a: "Aplikazio-denda batean ez. Zure nabigatzailean dabil: hasi saioa telefonoan, eta gero gehitu hasierako pantailara aplikazio bat bezala ireki dadin. [Nola funtzionatzen duen](page:how-it-works) orrian erakusten da."
