meta:
  title: "Ev arkadaşları, geziler ve partiler için Side Badger"
  description: "Masrafları ev arkadaşlarıyla, grup gezilerinde ve partilerde, düğünlerde ve ortak hediyelerde bölüşün. Side Badger'ın her tür grup için neler yaptığını görün."
h1: "Sizin tür grubunuz için Side Badger"
navLabel: "Kullanım örnekleri"
lead: "Ev arkadaşları, tatiller, bekarlığa veda partileri. Kaosunuzu seçin, sonra sizinki gibi bir grubun hesabı nasıl tuttuğuna bakın."
intro: "Her grup masrafları biraz farklı bölüşür. Bu sayfalar ilk harcamadan son kaydedilen ödemeye kadar **gerçekçi bir senaryoyu** izler ve hesapları gösterir; böylece kendi grubunuzun ne ile karşılaşacağını görebilirsiniz."
cta:
  heading: "Kendi grup türünüzü buldunuz mu?"
  body: "Bir hesap oluşturun, bir grup kurun ve ilk harcamayı ekleyin. Birkaç dakika sürer."
  button: "Ücretsiz hesap oluştur"
cardsHeading: "Sizinkine en yakın durumu seçin"
sections:
  - heading: "Grup gezileri"
    body: "Sterlinle uçuşlar, euroyla bir villa ve yalnızca üç kişinin yediği bir akşam yemeği. Grubu sterline çevirecek şekilde ayarlayın; Lizbon'daki dört arkadaş, para birimleri ayrı tutulduğunda çıkan altı ödeme yerine üç ödemeyle biter. [Grup gezisi masraflarını bölüşün](page:use-case/group-trips)."
  - heading: "Ev arkadaşları"
    body: "Biri ev sahibine öder, biri enerji faturasını hatırlar ve tuvalet kağıdını kimin aldığı konusunda kimse anlaşamaz. Kira oda büyüklüğüne göre, diğer faturalar eşit bölününce dört ev arkadaşı ayı, hepsi kirayı ödeyene giden üç ödemeyle kapatır. [Ev faturalarını ev arkadaşlarıyla bölüşün](page:use-case/housemates)."
  - heading: "Partiler, düğünler ve ortak hediyeler"
    body: "Altı kişi hediyeye oy verir, biri satın alır ve herkes aynı tutarı vermez. Tam tutarlarla bölünen 150 £'lık bir hediye, onu satın alan kişiye beş ödeme bırakır; toplam 120 £. [Bir etkinliğin masraflarını bölüşün](page:use-case/events-and-celebrations)."
  - heading: "Çiftler"
    body: "Sıkıcı masrafları bölüşün, ama randevuyu üç aylık mali incelemeye çevirmeyin. 60/40 bölünen kira ve eşit bölünen market alışverişi ikinizin arasında tek bir ödemeye iner."
  - heading: "Önce nasıl çalıştığına bakın"
    body: "Yukarıdaki her örnek, grup kurmaktan ödemeleri kaydetmeye kadar aynı adımları kullanır. [Nasıl çalışır](page:how-it-works) bunları gösterir, [fiyatlandırma](page:pricing) ise maliyetini söyler: hiçbir şey, reklam ve günlük sınır yok."
faq:
  heading: "Sorular"
  items:
    - q: "Gruptaki herkesin hesabı olması gerekir mi?"
      a: "Evet. İnsanlar bir bağlantı veya QR kodu ve ücretsiz bir hesapla katılır."
    - q: "Side Badger parayı toplayabilir mi?"
      a: "Hayır. İstediğiniz yolla ödersiniz, sonra bakiyeler doğru kalsın diye ödemeyi kaydedersiniz."
    - q: "Tek bir grup türü seçmem gerekir mi?"
      a: "Hayır. Kullanım örnekleri örnektir, ayar değildir. Her grubun özellikleri aynıdır; size uyan kombinasyonu kullanın."
