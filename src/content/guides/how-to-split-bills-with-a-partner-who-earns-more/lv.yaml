meta:
  title: "Kā sadalīt rēķinus ar partneri, kas pelna vairāk | Side Badger"
  description: "50/50 kļūst neērti, ja viens no jums pelna ievērojami vairāk. Sadaliet kopīgos rēķinus pēc ienākumiem, ar aprēķiniem diviem cilvēkiem un bez izklājlapas."
h1: "Kā sadalīt rēķinus ar partneri, kas pelna vairāk"
navLabel: "Partneris, kas pelna vairāk"
lead: "Saskaitiet savas neto algas, aprēķiniet katra daļu no kopsummas un noapaļojiet līdz veseliem procentiem. Maya saņem uz rokas 2 800 £, bet Jon 1 700 £, tāpēc kopīgos rēķinus viņi dala 62/38. Ievadiet šos procentus kopīgam izdevumam Side Badger un kopējiet to ikreiz, kad pienāk tāds pats rēķins."
cta:
  heading: "Izrēķiniet vienreiz"
  body: "Izveidojiet bezmaksas kontu, izveidojiet grupu abiem un ievadiet īri ar saviem procentiem. Nākamā mēneša īre ir kopija. Gribat vispirms apskatīties? Skatiet, [kā tas darbojas](page:how-it-works) vai [ko sedz bezmaksas lietošana](page:pricing)."
sections:
  - heading: "Divas algas, viens dzīvoklis, viens pieklājīgs klusums"
    body: "Maya un Jon dzīvo kopā. Maya mēnesī saņem 2 800 £ neto, bet Jon 1 700 £. Divus gadus viņi visu dalīja 50/50, jo tā bija vienkārši un neviens negribēja būt tas, kurš to sāk. Tad Jon paskatījās uz īri atsevišķi. Puse no 1 400 £ ir 700 £. Personai Maya tā ir ceturtdaļa no neto algas, bet personai Jon 41%. Neviens nebija rīkojies negodīgi. Neviens vienkārši nebija izdarījis aprēķinu. Daudzi [pāri](page:use-case/couples) agri vai vēlu nonāk šādā situācijā. Pie līdzņemtām vakariņām viņi vienojās, ka kopīgajiem rēķiniem no katras algas jāatkož līdzīgs gabals."
  - heading: "Metode, parādot aprēķinus"
    body: "Četri soļi, viens kalkulators un saruna, kas jums tāpat bija jāaizvada."
    items:
      - "**Vienojieties, ko skaitīt par algu.** Maya un Jon izmanto neto algu, naudu, kas katru mēnesi ienāk bankā. Kopā tas ir 2 800 £ + 1 700 £ = 4 500 £."
      - "**Aprēķiniet katra daļu.** Maya: 2 800 ÷ 4 500 = 62,2%. Jon: 1 700 ÷ 4 500 = 37,8%."
      - "**Noapaļojiet līdz veseliem procentiem.** 62,2% kļūst par 62 un 37,8% par 38. Ar diviem cilvēkiem noapaļojiet vienu skaitli un atņemiet to no 100, lai iegūtu otru, un kopā tie vienmēr dos 100."
      - "**Pārbaudiet, ko tas nozīmē.** Ar 1 400 £ lielu īri Maya maksā 868 £ (62%), bet Jon 532 £ (38%). Tas ir apmēram 31% no katra neto algas. Ja katrs maksātu pusi, personai Maya tas aizņemtu 25% no neto algas, bet personai Jon 41%."
  - heading: "Kā lasīt mēnesi"
    body: "Īri 1 400 £ apmērā samaksāja Maya, bet pārējos 216 £ samaksāja Jon. Personai Maya mēneša daļa ir 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, un viņa samaksāja 1 400 £, tāpēc viņai pienākas 402,40 £. Personai Jon mēneša daļa ir 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, un viņš samaksāja 216 £, tāpēc viņš ir parādā 402,40 £. Side Badger iesaka vienu maksājumu: Jon maksā personai Maya 402,40 £, un [norēķināšanās](page:feature/settle-up) to reģistrē, kad maksājums ir veikts. Ja sadalītu 50/50, tajā pašā mēnesī Jon maksātu personai Maya 592,00 £."
  - heading: "Iestatiet to Side Badger"
    body: "Desmit minūtes, no kurām lielāko daļu aizņem procenti."
    items:
      - "**Izveidojiet grupu.** Informācijas panelī izvēlieties **Izveidot grupu** un nosauciet to pēc dzīvokļa. Izvēlieties **Uzaicināt citus** un nosūtiet saiti vai QR kodu personai Jon. Viņš pierakstās vai izveido bezmaksas kontu un izvēlas vārdu, ar kādu vēlas būt redzams šajā grupā. Grupu redz tikai dalībnieki, tāpēc tā būs tikai jūsu abu."
      - "**Pievienojiet īri.** Izvēlieties **Pievienot izdevumus**. Ievadiet aprakstu un summu, bet laukā **Kas samaksāja?** izvēlieties Maya. Laukā **Sadalīt starp** atstājiet abus cilvēkus, tad laukā **Kā sadalīt** izvēlieties **Procenti** un ievadiet 62 un 38. Veidlapa norāda, ja procenti kopā nav 100. Izvēlieties **Saglabāt izdevumus**."
      - "**Pievienojiet pārējos rēķinus.** Enerģija un internets tiek pievienoti tāpat, maksātājam norādot Jon un ievadot tos pašus 62 un 38. Līdzņemamais ēdiens ir atsevišķs izdevums, kurā **Kā sadalīt** paliek uz **Vienādi**."
      - "**Nokopējiet to nākamajā mēnesī.** Atveriet pagājušā mēneša īri un izvēlieties **Kopēt izdevumus**. Kopija saglabā maksātāju, summu un sadali, un tai tiek piešķirts šodienas datums. Ja īre mainījusies, nomainiet summu, tad izvēlieties **Izveidot kopiju**. Enerģijas rēķins darbojas tāpat."
      - "**Pārbaudiet, kurš kam ir parādā.** To rāda sadaļa **Bilances**, un tā iesaka īsu maksājumu sarakstu. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu sadaļā **Norēķināties**."
  - heading: "50/50, pēc ienākumiem vai rēķins pa rēķinam"
    body: "Pareizas atbildes nav, ir tikai tā, ar kuru jūs abi varat dzīvot. Trīs biežākās."
    items:
      - "**Puse katram par visu.** Visvieglāk uzturēt, un tas der pāriem, kuru ienākumi ir tuvi."
      - "**Pēc ienākumiem par visu kopīgo.** To dara Maya un Jon. Viena saruna, viens procentu pāris."
      - "**Rēķins pa rēķinam.** Īre un rēķini pēc ienākumiem, atvaļinājumi un našķi 50/50 vai kā citādi vienojaties, un katram rēķinam tiek piemērots noteikums, kas tam der."
  - heading: "Vienojieties, kas skaitās kopīgs"
    body: "Strīdi parasti ir par sarakstu, nevis par procentiem. Īre, enerģija, internets, iknedēļas iepirkšanās un dīvāns lielākajā daļā mājokļu skaitās kopīgi. Sporta zāles abonements, ko lieto Maya, un futbola abonements, ko lieto Jon, var neskaitīties. Vienojieties par sarakstu vienreiz, pierakstiet to un grupā ievadiet tikai kopīgās izmaksas."
  - heading: "Līdzņemamais ēdiens paliek 50/50, ar nodomu"
    body: "Našķi ir nelieli un neobligāti, un nevienam nav vajadzīgs kalkulators, lai pasūtītu pelmeņus. Lietotnē Side Badger līdzņemamais ēdiens ir vienkārši vēl viens izdevums. Jon samaksā 36 £, **Kā sadalīt** paliek uz **Vienādi**, un katram sanāk 18 £."
  - heading: "Kad kāda alga mainās"
    body: "Algas pielikums, jauns darbs vai darba pārtraukums maina aprēķinu. Jaunos procentus aprēķiniet tāpat un izmantojiet tos no nākamā izdevuma. Iepriekšējie izdevumi paliek tādi, kādi bija. Nokopējiet pagājušā mēneša īri, nomainiet procentus, tad izvēlieties **Izveidot kopiju**. Lai izlabotu jau ievadītu izdevumu, rediģējiet to, ja to ļauj grupas atļaujas, un vispirms pastāstiet otrai pusei, jo atlikumi mainīsies. Iepriekšējā versija tiek saglabāta. Vienojieties, kad pārrēķināsiet, piemēram, reizi gadā, un pirms pārslēgšanās norēķinieties, lai vecā sadale noslēdzas ar tīru uzskaiti."
  - heading: "Ko Side Badger šeit nedara"
    items:
      - "Tas nekad nejautā, cik kurš pelna, un neaprēķina procentus. Jūs ievadāt skaitļus, par kuriem vienojāties."
      - "Tas nevar iestatīt noklusējuma sadali visai grupai. Procenti tiek norādīti katram izdevumam, tāpēc nokopējiet izdevumu, kuram tie jau ir."
      - "Atkārtotu rēķinu nav, tāpēc katru reizi nokopējiet pagājušā mēneša īri."
      - "Tas nekad nepārvieto naudu. Jūs samaksājat viens otram, kā vēlaties, un to reģistrējat."
