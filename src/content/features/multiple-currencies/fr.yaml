sections:
  - heading: "Une seule devise pour tout le groupe"
    body: "Si votre groupe préfère ne pas y penser, choisissez une devise de groupe et le formulaire convertit chaque nouvelle dépense dedans, à un taux que vous pouvez toujours voir et changer. Cela ne s'applique qu'aux dépenses nouvelles et copiées. Les modifications et les dépenses existantes restent telles quelles, donc rien de déjà enregistré ne change sous vos yeux."
  - heading: "Vous devez des euros, vous payez en livres"
    body: "Payé en yens, réglé en livres ? Pas de souci. Quand vous enregistrez un paiement, vous pouvez le convertir aussi, pour que celui qui doit des euros puisse payer en livres et que le solde en euros tombe tout de même juste. Remboursez-vous comme vous voulez, puis enregistrez."
  - heading: "Des règles pour le groupe"
    body: "Limitez un groupe aux devises que vous utilisez vraiment, et définissez une valeur par défaut pour que le formulaire s'ouvre sur la bonne. Des vacances au Portugal n'ont pas besoin de 139 autres options à côté de la note du dîner, et un [mariage à l'étranger](page:use-case/events-and-celebrations) en demande probablement deux."
limits:
  heading: Limites
  items:
    - "Le taux est fixé quand la dépense est enregistrée. Les anciennes dépenses ne sont jamais réévaluées."
    - "Side Badger récupère un taux actuel quand il le peut. Il n'est pas garanti pour chaque paire, et vous pouvez toujours saisir le taux vous-même."
    - "La conversion automatique du groupe ne s'applique qu'aux dépenses nouvelles et copiées, pas aux modifications ni aux dépenses existantes."
    - "Chaque dépense est plafonnée à 999,999.99 dans sa propre devise."
    - "Il y a 140 devises. Les cryptomonnaies et les métaux n'en font pas partie."
    - "Side Badger enregistre les paiements. Il ne fait jamais circuler ni échanger l'argent."
useCasesHeading: "Où cela aide"
faq:
  heading: Questions
  items:
    - q: "Quel taux de change utilisez-vous ?"
      a: "Un taux de change actuel, récupéré quand vous saisissez la dépense là où il y en a un. Vous pouvez le changer pour le taux que vous avez réellement obtenu, et le montant converti se met à jour."
    - q: "Les anciennes dépenses sont-elles réévaluées ?"
      a: "Non. Le taux est fixé quand la dépense est enregistrée, donc un solde ne dérive pas parce que le marché a bougé."
    - q: "Prenez-vous en charge les cryptomonnaies ?"
      a: "Non. Il y a 140 devises, et les cryptomonnaies n'en font pas partie."
    - q: "Pourquoi ne puis-je pas saisir 2,000,000 de roupies indonésiennes ?"
      a: "Chaque dépense est plafonnée à 999,999.99 dans sa propre devise. Saisissez-la dans une autre devise et convertissez, ou scindez-la en deux dépenses."
    - q: "La conversion coûte-t-elle quelque chose ?"
      a: "Non. Convertir est gratuit, comme le reste de Side Badger. Voir les [tarifs](page:pricing)."
    - q: "Dois-je convertir ?"
      a: "Non. Les devises restent séparées sauf si vous ou votre groupe choisissez de convertir, et chaque devise a sa propre courte liste de paiements."
