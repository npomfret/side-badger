featuresHeading: "De functies die een koppel gebruikt"
faq:
  heading: "Vragen"
  items:
    - q: "Kunnen we 60/40 één keer voor alles instellen?"
      a: "Nee. De verdeling hoort bij elke uitgave. Stel de percentages in bij de eerste, kopieer ze de volgende keer en wijzig wat anders is. [Uitgaven verdelen](page:feature/split-expenses) behandelt alle drie de manieren om te verdelen."
    - q: "Is het gekoppeld aan onze bank?"
      a: "Nee. Side Badger raakt je geld nooit aan. Jullie betalen elkaar zoals jullie willen en registreren het dan, zoals [afrekenen](page:feature/settle-up) uitlegt."
    - q: "Kan iemand anders onze groep zien?"
      a: "Enkel de leden, en de groep van een koppel heeft er twee. Iedereen die een geldige uitnodigingslink gebruikt, kan lid worden, dus deel hem met één persoon en geef hem een korte vervaldatum."
    - q: "Wat als we elk een deel van dezelfde rekening betaalden?"
      a: "Een uitgave heeft één betaler. Registreer twee uitgaven, een voor elk van jullie, en het saldo komt hetzelfde uit."
    - q: "Herinnert het mijn partner eraan om te betalen?"
      a: "Nee. Er zijn geen herinneringen, dus het aanmanen blijft aan jou. Jullie kijken wel allebei naar hetzelfde getal."
    - q: "Wat gebeurt er als we geen kosten meer delen?"
      a: "Reken het saldo af en registreer de betaling, zodat niemand nog iets schuldig is. Dan kan een beheerder de groep vergrendelen, wat de cijfers laat zoals ze zijn, of ze definitief sluiten, waardoor ze voor iedereen ontoegankelijk wordt. Sluit ze pas als geen van beiden de geschiedenis nog nodig heeft."
