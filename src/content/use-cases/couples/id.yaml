meta:
  title: "Bagi tagihan berdua, 50/50 atau sesuai penghasilan | Side Badger"
  description: "Bagi biaya membosankan tanpa mengubah kencan malam jadi rapat keuangan kuartalan. Bagi 50/50, sesuai penghasilan, atau per tagihan. Gratis."
h1: "Bagi biaya sebagai pasangan, secara adil"
navLabel: "Pasangan"
lead: "Bagi biaya yang membosankan tanpa mengubah kencan malam menjadi rapat keuangan kuartalan. Side Badger menyimpan satu hitungan berjalan untuk sewa, tagihan, dan belanjaan bagi **pasangan** yang berbagi rumah, sofa, dan ingatan samar tentang siapa yang membayar tagihan internet. Bagi 50/50, sesuai penghasilan, atau tagihan per tagihan, dan lihat siapa berutang kepada siapa."
cta:
  heading: "Mulai grup berdua"
  body: "Buat akun, buat grup, dan kirim tautan undangan ke pasangan Anda. Makanan bungkus malam ini bisa jadi pengeluaran pertama."
scenario:
  heading: "Adil tak harus berarti 50/50"
  body: "Sam dan Alex berbagi rumah. Sam berpenghasilan lebih besar, jadi mereka sepakat Sam menanggung 60% sewa dan Alex 40%. Sam membayar pemilik rumah, Alex berbelanja, dan keduanya cukup yakin semuanya impas pada akhirnya. \"Cukup yakin\" adalah cara catatan di ponsel seseorang berubah menjadi perselisihan yang tak kunjung selesai. Jadi buat grup untuk Anda berdua, pilih nama yang ingin dilihat pasangan Anda, dan kirim tautan undangan atau kode QR. Tambahkan tiap biaya saat terjadi, tentukan siapa yang membayar dan bagaimana pembagiannya, dan biarkan grup menyimpan hitungan. Buat grup terpisah untuk tiap liburan (lihat [perjalanan grup](page:use-case/group-trips)), supaya tiket pesawat tidak tercampur dengan belanjaan."
sections:
  - heading: "50/50, sesuai penghasilan, atau tagihan per tagihan"
    body: "Tidak ada pembagian yang adil secara universal, hanya pembagian yang Anda berdua setujui, idealnya sebelum tagihan pertama, bukan sesudah helaan napas pertama. Ini tiga cara yang lazim."
    items:
      - "**50/50.** Pilih **Rata** dan masing-masing berutang separuh. Cocok untuk biaya bersama saat penghasilan Anda berdua hampir sama, dan sama sekali tak perlu berhitung."
      - "**Sesuai penghasilan.** Jika salah satu dari Anda berpenghasilan lebih besar, bagi menurut porsi masing-masing dari uang yang masuk. Sepakati dulu apa yang dihitung (gaji bersih adalah pilihan umum), jumlahkan keduanya, lalu bagi bagian Anda dengan totalnya. Jika salah satu membawa pulang tiga bagian dibanding dua bagian milik yang lain, itu 3 ÷ (3 + 2) = 60%, jadi satu orang menanggung 60% dan yang lain 40%. Bulatkan ke persentase bulat dan masukkan di bawah **Persentase**, yang harus berjumlah 100. Tidak ada tempat untuk memasukkan gaji Anda, jadi Anda hanya mengetik persentasenya."
      - "**Tagihan per tagihan.** Setiap pengeluaran punya pembagiannya sendiri, jadi Anda bisa mencampur: sewa menurut penghasilan, belanjaan 50/50, dan kado bersama dengan **Jumlah pasti** jika masing-masing memilih berapa yang dimasukkan."
      - "**Saat gaji berubah,** pakai persentase baru mulai pengeluaran berikutnya. Pengeluaran sebelumnya tetap memakai pembagian saat dimasukkan. Untuk melihat hitungannya dengan slip gaji sungguhan, baca [cara membagi tagihan dengan pasangan yang berpenghasilan lebih besar](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "Rekap bulanan"
    body: "Sebulan sekali, atau kapan pun angkanya mulai gatal, buka grup dan periksa **Saldo**. Berdua, hanya ada satu pembayaran dalam tiap mata uang, dari yang berutang kepada yang dihutangi. Ambil bulan Sam dan Alex. Sam membayar sewa £1.500, dan 40% bagian Alex adalah £600. Alex membayar £90 untuk belanjaan, dibagi rata, jadi £45 adalah separuh bagian Sam. Side Badger mengurangkan yang satu dari yang lain, £600 dikurangi £45, dan Alex membayar Sam £555. Bayar dengan cara apa pun yang Anda suka, lewat transfer bank, tunai, atau utang budi, lalu catat di bawah **Lunasi** agar saldo kembali ke nol. Tidak ada tagihan berulang, jadi salin sewa bulan lalu, ganti tanggalnya, dan lanjut. Side Badger tidak memindahkan uangnya dan tidak mengirim pengingat, jadi colekannya tetap tugas Anda."
  - heading: "Hanya berdua"
    body: "Grup berdua punya dua anggota, dan hanya anggota grup yang bisa melihatnya. Pasangan Anda bergabung dengan tautan undangan atau kode QR. Sebuah tautan bisa berlaku dari 15 menit sampai 5 hari, jadi pilih yang paling singkat yang masih memberi pasangan Anda waktu untuk memakainya. Membuat tautan baru tidak membatalkan yang lama, jadi jangan tinggalkan tautan di obrolan yang berisi orang lain. Siapa pun yang memakai tautan yang masih aktif bisa bergabung, jadi jika Anda ingin benar-benar yakin, aktifkan persetujuan dan seorang admin meloloskan tiap orang. Pasangan Anda perlu akun sendiri, yang gratis."
