meta:
  title: "Πώς να μαζέψετε χρήματα για ένα ομαδικό δώρο | Side Badger"
  description: "Ο καθένας βάζει άλλο ποσό και η κάρτα ενός ατόμου παίρνει το βάρος. Δημοσκόπηση για τον προϋπολογισμό, ακριβή ποσά και τις πράξεις τις κάνει το Side Badger."
h1: "Πώς να μαζέψετε χρήματα για ένα ομαδικό δώρο"
navLabel: "Συλλογή για ομαδικό δώρο"
lead: "Όταν μαζεύετε χρήματα για ένα ομαδικό δώρο, ένα άτομο προκαταβάλλει το ποσό και όλοι οι άλλοι του οφείλουν τη συνεισφορά τους. Συμφωνήστε έναν προϋπολογισμό με μια δημοσκόπηση, αφήστε τον αγοραστή να χρεώσει το δώρο στην κάρτα του και μετά καταχωρίστε το ως ένα έξοδο με [ακριβή ποσά](page:feature/split-expenses), ένα ποσό για κάθε άτομο. Το Side Badger δείχνει ποιος οφείλει τι στον αγοραστή και ο καθένας στέλνει το μερίδιό του όπως θέλει."
cta:
  heading: "Γυρίστε το καπέλο χωρίς το καπέλο"
  body: "Φτιάξτε μια ομάδα, αφήστε έξω από αυτήν το άτομο που θα πάρει το δώρο και καταχωρίστε το δώρο με ακριβή ποσά. Το Side Badger είναι δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια. Θέλετε πρώτα μια ξενάγηση; Δείτε [πώς λειτουργεί](page:how-it-works) ή [τι καλύπτει το δωρεάν](page:pricing)."
sections:
  - heading: "Τέσσερις φίλοι, ένα πικάπ, τέσσερα διαφορετικά ποσά"
    body: "Η Μπία κλείνει τα 30 και θέλει ένα πικάπ. Η Πρίγια, ο Ομάρ, η Λένα και ο Σαμ της το παίρνουν. Η Πρίγια βρίσκει ένα με 240 £ και το αγοράζει με τη δική της κάρτα, επειδή κάποιος πρέπει να πάει πρώτος. Οι τέσσερις δεν συνεισφέρουν εξίσου. Η Πρίγια και ο Ομάρ βάζουν από 60 £, η Λένα 80 £ και ο Σαμ 40 £. Κανείς δεν εξηγεί το ποσό του και κανείς δεν ρωτά. Ο Ομάρ αγοράζει επίσης μια κάρτα και χαρτί περιτυλίγματος για 12 £. Και οι τέσσερις υπογράφουν την κάρτα, οπότε αυτή μοιράζεται εξίσου."
  - heading: "Συμφωνήστε τον προϋπολογισμό πριν πατήσει κανείς Αγορά"
    body: "Μια δημοσκόπηση για τον προϋπολογισμό γλιτώνει τον καβγά για ένα πικάπ των 400 £. Στην ομάδα επιλέξτε **Προσθήκη Ψηφοφορίας** και ρωτήστε πόσο πρέπει να κοστίσει το δώρο. Κάντε τις επιλογές ποσά, όπως έως 150 £, έως 200 £ και έως 250 £. Ενεργοποιήστε την **Ανώνυμη ψηφοφορία**, που κρύβει ποιος ψήφισε τι, ώστε κανείς να μην χρειάζεται να υπερασπιστεί φωναχτά ένα μικρότερο ποσό. Οι ρυθμίσεις δεν αλλάζουν όταν μπει η πρώτη ψήφος, οπότε ελέγξτε τις πρώτα. Η δημοσκόπηση δεν κλείνει μόνη της. Όταν έχουν ψηφίσει όλοι, επιλέξτε **Κλείσιμο ψηφοφορίας** και εμφανίζεται ο **Νικητής**. Η δημοσκόπηση συμφωνεί το σύνολο. Δεν ορίζει το μερίδιο κανενός."
  - heading: "Διαβάζοντας τα νούμερα"
    body: "Το δώρο μοιράζεται 60 £, 60 £, 80 £ και 40 £, που κάνουν τις 240 £ της απόδειξης. Η κάρτα και το περιτύλιγμα μοιράζονται στα τέσσερα, 3 £ το άτομο. Ο λογαριασμός της Πρίγιας είναι 60 £ + 3 £, δηλαδή 63 £, και εκείνη πλήρωσε 240 £, οπότε της οφείλονται 177 £. Ο λογαριασμός του Ομάρ είναι επίσης 63 £, αλλά ο ίδιος πλήρωσε 12 £, οπότε χρωστά 51 £. Η Λένα χρωστά 80 £ + 3 £, δηλαδή 83 £, και ο Σαμ χρωστά 40 £ + 3 £, δηλαδή 43 £. Αυτά τα τρία κάνουν μαζί τις 177 £ της Πρίγιας. Αν τα αφήνατε ως έχουν, τα χρέη θα κυκλοφορούσαν σε πέντε κατευθύνσεις μέσα στην ομάδα. Το Side Badger προτείνει αντί γι' αυτό τρεις πληρωμές, όλες προς την Πρίγια. Η [εκκαθάριση](page:feature/settle-up) έχει τις λεπτομέρειες."
  - heading: "Βάλτε το στο Side Badger"
    body: "Το δικό της μέρος η Πρίγια το κάνει σε πέντε περίπου λεπτά."
    items:
      - "**Φτιάξτε την ομάδα.** Στον πίνακα ελέγχου επιλέξτε **Δημιουργία Ομάδας**. Επιλέξτε **Πρόσκληση Άλλων** και στείλτε τον σύνδεσμο ή τον κωδικό QR στους ανθρώπους που συνεισφέρουν και σε κανέναν άλλον."
      - "**Προσθέστε το δώρο.** Επιλέξτε **Προσθήκη Εξόδου**, περιγράψτε το, πληκτρολογήστε 240 και στο **Ποιος πλήρωσε;** διαλέξτε την Πρίγια. Κρατήστε και τους τέσσερις στο **Μοιράζεται μεταξύ** και μετά, στο **Τρόπος διαχωρισμού**, επιλέξτε **Ακριβή ποσά** και πληκτρολογήστε 60, 60, 80 και 40. Τα ποσά πρέπει να κάνουν συνολικά 240. Επισυνάψτε την επιβεβαίωση της παραγγελίας αν θέλετε. Επιλέξτε **Αποθήκευση Εξόδου**."
      - "**Προσθέστε την κάρτα.** Ο Ομάρ προσθέτει μόνος του τις 12 £, διαλέγει τον εαυτό του στο **Ποιος πλήρωσε;** και αφήνει το **Τρόπος διαχωρισμού** στο **Εξίσου**, με και τα τέσσερα άτομα επιλεγμένα."
      - "**Μετρήστε και μετά πληρώστε.** Ο καθένας ελέγχει τα **Υπόλοιπα**, που δείχνουν ποιος χρωστά σε ποιον, και στέλνει στην Πρίγια το μερίδιό του όπως θέλει. Μετά το καταγράφει με την **Τακτοποίηση** και την **Καταγραφή Εκκαθάρισης**. Η γρήγορη τακτοποίηση συμπληρώνει το ποσό."
  - heading: "Αγοράστε πρώτα ή μαζέψτε πρώτα"
    body: "Το Side Badger δεν κρατά το κοινό ταμείο, οπότε το «μάζεμα» στην πράξη σημαίνει καταμέτρηση. Δουλεύουν δύο σειρές."
    items:
      - "**Αγοράστε πρώτα.** Ο αγοραστής πληρώνει, προσθέτει το έξοδο στην πραγματική τιμή και ο καθένας βλέπει αμέσως το μερίδιό του. Είναι πιο τακτοποιημένο, αλλά ο αγοραστής σηκώνει το κόστος μέχρι να πληρώσουν οι άλλοι, οπότε διαλέξτε αγοραστή που αντέχει."
      - "**Μαζέψτε πρώτα.** Οι άνθρωποι στέλνουν το ποσό τους στον αγοραστή πριν από την αγορά. Μόλις έχετε την τιμή, καταχωρίστε το δώρο και μετά καταγράψτε κάθε πληρωμή με την ημερομηνία που κινήθηκαν πραγματικά τα χρήματα. Προσθέστε πρώτα το δώρο, ώστε κάθε πληρωμή να έχει ένα υπόλοιπο απέναντι στο οποίο να καταχωριστεί."
      - "**Η τιμή αλλάζει.** Τα μεταφορικά, ένας κωδικός έκπτωσης, μια αύξηση τιμής την τελευταία στιγμή. Επεξεργαστείτε το δώρο και αλλάξτε τα ακριβή ποσά ώστε να βγάζουν και πάλι το σωστό σύνολο. Η προηγούμενη έκδοση διατηρείται, αλλά ενημερώστε πρώτα την ομάδα, επειδή αλλάζουν τα υπόλοιπά της."
  - heading: "Κρατήστε την Μπία έξω από την υπόθεση"
    body: "Μόνο τα μέλη μιας ομάδας μπορούν να τη δουν, οπότε η Μπία δεν μπορεί να δει μια ομάδα στην οποία δεν ανήκει. Προσκαλέστε όσους συνεισφέρουν και κανέναν άλλον. Ένας σύνδεσμος λειτουργεί μέχρι να λήξει και μπορείτε να διαλέξετε οποιαδήποτε διάρκεια από 15 λεπτά έως 5 ημέρες, οπότε διαλέξτε μια σύντομη και στείλτε τον κάπου που δεν θα τον δει η Μπία. Ο σύνδεσμος δείχνει μια προεπισκόπηση της ομάδας σε όποιον τον ανοίξει, οπότε δώστε στην ομάδα ένα βαρετό όνομα, όπως «Ταμείο Σαββάτου», και κρατήστε το όνομα της Μπίας έξω και από τις περιγραφές των εξόδων και από τις επιλογές της δημοσκόπησης."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν κρατά ούτε εισπράττει τα χρήματα. Οι συνεισφορές πηγαίνουν στον αγοραστή με τραπεζική μεταφορά, μετρητά ή ό,τι χρησιμοποιείτε και μετά κάποιος τις καταγράφει."
      - "Δεν στέλνει υπενθυμίσεις πληρωμής. Το σκούντημα όποιου δεν έχει πληρώσει μένει ανθρώπινη δουλειά."
      - "Δεν υπολογίζει το μερίδιο κανενός. Η δημοσκόπηση συμφωνεί τον προϋπολογισμό και δεν υπάρχει επιλογή «χώρισε ό,τι περισσεύει», οπότε πληκτρολογείτε εσείς κάθε ποσό."
      - "Κάθε έξοδο έχει έναν πληρωτή. Αν δύο άτομα αγόρασαν διαφορετικά μέρη του δώρου, καταχωρίστε δύο έξοδα."
      - "Όλοι στον διαχωρισμό χρειάζονται δωρεάν λογαριασμό και θέση στην ομάδα."
