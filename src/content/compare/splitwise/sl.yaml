sections:
  - heading: Pogovor o denarju, ob denarju
    body: Skupni denar prinese klepet, dvome in načrte. Side Badger vse troje hrani ob številkah, da nihče ne rije nazaj po klepetu.
    items:
      - "**Komentarji tam, kamor sodijo.** Komentiraj kar skupino ali kateri koli strošek, seznam ali anketo in pogovor imej ob stvari, o kateri teče beseda."
      - "**Potrdila in fotografije.** Pri vsakem strošku obdrži do tri potrdila o nakupu, h komentarjem pri skupini, seznamu ali anketi pa dodaj fotografije ali PDF-je."
      - "**Vprašanja, ne prepiri.** Administrator lahko vklopi vprašanja, nato lahko vsak v strošku vpraša o njem. V stanja se ne všteva, dokler ni rešeno."
      - "**Seznami in ankete.** Skupni nakupovalni seznam imej ob stroških nakupov, o ožjem izboru vil pa glasuj, anonimno, če želiš."
      - "**Malo aplavza.** Odzovi se na stroške, plačila in komentarje ter proslavi plačilo, ko prispe."
  - heading: Tvoja skupina, tvoja pravila
    body: Splitwisov center za pomoč pravi, da ne podpira administratorjev skupin ali posebnih dovoljenj. Side Badger ima vloge in dovoljenja, za skupine, ki potrebujejo nekoga, ki drži številke urejene.
    items:
      - "**Administratorji, člani in gledalci.** Nekoga naredi za gledalca: vidi vse, spreminja pa nič."
      - "**Dve prednastavitvi ali tvoje lastne.** Začni z Odprtim sodelovanjem ali Upravljano skupino ali pa vsako dovoljenje nastavi posebej: kdo ureja in briše stroške, ureja sezname, vabi in spušča nove ljudi noter."
      - "**Odobritev za vstop.** Vklopi odobritev in administrator vsakogar posebej sprejme."
      - "**Lastne nastavitve skupine.** Omeji jo na valute, ki jih res uporabljaš, izberi njeno privzeto valuto in ji daj sliko glave."
      - "**Zakleni, ko je konec.** Številke ostanejo, kakršne so, dokler administrator ne odklene."
  - heading: Tu zastonj, tam za denar
    body: Splitwise Pro je Splitwisov plačljiv paket, njegova lastna stran Pro pa prodaja tri stvari, ki v Side Badgerju ne stanejo nič.
    items:
      - "**Skeniranje računov.** Splitwise Pro skenira fotografijo računa. Side Badger to dela brezplačno, brez kreditov za skeniranje: izpolni skupni znesek, datum in kraj, da jih preveriš."
      - "**Pretvorba valut.** Splitwise Pro pretvori stroške skupine v tvojo privzeto valuto, ko pritisneš Convert. Side Badger pretvori vsak strošek, ko ga vneseš, po trenutnem menjalnem tečaju ali tistem, ki ga res dobiš, izvirni znesek pa ostane pri stroških."
      - "**Brez dnevnih omejitev.** Splitwise Pro prodaja neomejene stroške, njegov center za pomoč pa pravi, da lahko brezplačni uporabniki dodajo do 4 stroške na dan. Side Badger nima dnevnih omejitev."
  - heading: Tvoja banka ostane ob strani
    body: Side Badger se ne povezuje z tvojo banko in ne prosi za podatke o tvoji banki. Vodi evidenco, kdo komu dolguje; plačajte si, kakor želite, nato plačilo zabeležite. Bančne prijave ti ni treba nikomur izročiti, zato je ena stvar manj, ki jo moraš varovati.
  - heading: Ena aplikacija, v brskalniku in na telefonu
    body: Side Badger deluje v brskalniku. Prijavi se, dodaj ga na domači zaslon in odpre se kot aplikacija. V obeh primerih je ista aplikacija, zato je nova funkcija na tvojem telefonu, ko ga naslednjič odpreš, brez čakanja na posodobitev iz trgovine z aplikacijami.
  - heading: Pa še nekaj trikov
    items:
      - "**Vprašaj svojega pomočnika.** Side Badger deluje s ChatGPT in Claude: prosi svojega, naj doda strošek, skenira račun ali zabeleži plačilo."
      - "**Vsak v svojem jeziku.** Side Badger govori 39 jezikov in vsak izbere svojega. Splitwisova domača stran navaja 7+. Podpira tudi 133 valut, za potovanja, ki vodijo povsod."
      - "**Pomoč, ne da bi zapustil aplikacijo.** Se ti zatakne ali opaziš napako? Sporoči nam iz aplikacije in tam preberi naš odgovor."
  - heading: Kje Splitwise še vedno zmaga
    body: Raje vidimo, da izbereš pravo aplikacijo, kot da to ugotoviš pozneje. Če tvoja skupina potrebuje katero od teh stvari, jo ima Splitwise, Side Badger pa ne.
    items:
      - "**Aplikacije iz trgovine.** Side Badger živi v brskalniku in na domačem zaslonu, ne v trgovinah z aplikacijami."
      - "**Način brez povezave.** Side Badger potrebuje povezavo."
      - "**Plačila v aplikaciji.** V nekaterih državah lahko Splitwise denar tudi premakne. Side Badger vodi samo evidenco."
      - "**Delitev po deležih ali postavkah.** Side Badger ima enega plačnika na strošek, razdeljenega enako, po točnih zneskih ali po odstotkih. Njegovo skeniranje računov ne dodeljuje postavk ljudem."
      - "**Grafikoni in privzete delitve.** Splitwise Pro ima oboje. Side Badger zapiše, kdo komu dolguje, in to je ves trik."
  - heading: Selitev skupine
    body: Orodja za uvoz ni, zato selitev pomeni nov začetek. Najprej se poravnajte v Splitwisu, nato ustvari skupino v Side Badgerju in povabi vse s povezavo ali kodo QR. Vsak v skupini potrebuje brezplačen uporabniški račun, za registracijo pa je dovolj e-poštni naslov.
