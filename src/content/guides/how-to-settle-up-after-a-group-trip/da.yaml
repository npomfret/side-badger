faq:
  heading: "Spørgsmål"
  items:
    - q: "Hvem skal registrere en betaling, den der betaler, eller den der modtager?"
      a: "At registrere en betaling kræver tilladelse til at redigere udgifter, og formularen spørger **Hvem betalte?** og **Hvem modtog betalingen?** Kun den, der registrerede den, kan redigere den senere, så det er som regel enklest, hvis betaleren gør det med hurtigafregningsknappen."
    - q: "Hvad hvis turen foregik i to valutaer?"
      a: "Saldi føres pr. valuta, så en gæld i euro forbliver en gæld i euro, og hver valuta får sin egen korte liste, medmindre udgifterne blev omregnet, da de blev indtastet. [Flere valutaer](page:guide/how-to-split-a-trip-paid-in-several-currencies) viser begge måder."
    - q: "Skal vi gøre op under turen eller til sidst?"
      a: "Begge dele fungerer. Hver registreret betaling ændrer saldiene, så en betaling midt på turen tæller med i den endelige liste. Til sidst er enklest, fordi [hele turen](page:use-case/group-trips) er samlet ét sted."
