faq:
  heading: "Vragen"
  items:
    - q: "Kan ik enkel mijn deel in vraag stellen?"
      a: "Nee. Een vraag houdt de hele uitgave tegen, voor iedereen die erin zit. Klopt enkel de verdeling niet, dan is de oplossing een bewerking van de verdeling."
    - q: "Wie kan een vraag sluiten?"
      a: "Degene die de vraag stelde, of een groepsbeheerder. Is degene die de uitgave toevoegde geen beheerder, dan kan die persoon de vraag niet sluiten in naam van de vraagsteller."
    - q: "Wist het bewerken van een uitgave het origineel uit?"
      a: "Nee. De vorige versie blijft bewaard. Wie mag bewerken, wordt bepaald door de rechten van de groep, dus het loont om het huis eerst te verwittigen, want de saldi veranderen."
