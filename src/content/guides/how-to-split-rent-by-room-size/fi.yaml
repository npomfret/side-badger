faq:
  heading: "Kysymyksiä"
  items:
    - q: "Entä jos jollain on isompi huone mutta vähemmän valoa?"
      a: "Lattiapinta-ala on vain lähtökohta, joten ryhmä voi sopia säädöstä. Ota pimeästä huoneesta piste tai kaksi pois, anna ne muille ja tarkista, että prosentit yhä tekevät yhteensä 100. Side Badger tallentaa sen, mistä sovitte, eikä arvostele sitä."
    - q: "Pitäisikö laskutkin jakaa huoneen koon mukaan?"
      a: "Yleensä ei. Sähköä ja internetiä käyttävät kaikki, joten tasajako on yksinkertaisempi, kuten yllä olevassa esimerkissä. Jos yksi kämppis on kotona koko päivän, ryhmä voi sopia jotain muuta, kuten tarkat summat. [Kulujen jako](page:feature/split-expenses) kertoo vaihtoehdoista."
    - q: "Voiko jakoa muuttaa myöhemmin?"
      a: "Kyllä, uusiin kuluihin. Muuta prosentteja, kun kopioit vuokran, niin aiemmat kuukaudet pysyvät ennallaan. Jos haluat korjata jo syötetyn kulun, muokkaa sitä, jos ryhmän oikeudet sen sallivat, ja kerro siitä ensin talolle, koska saldot muuttuvat. Aiempi versio säilyy."
