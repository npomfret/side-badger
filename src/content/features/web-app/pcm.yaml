meta:
  title: "Bill-sharing app wey no need download | Side Badger"
  description: "Your phone don full, we understand. Side Badger dey run for your browser, with no app store and no download. Add am to your home screen and e go open like app."
h1: "No app store. No download. E still feel like app"
navLabel: "App for browser"
lead: "Side Badger dey live for your browser. No app store dey to search and nothing dey to download first. Sign in on phone or computer, share expenses online with your group, and add am to your home screen or dock when you want am one tap away."
cta:
  heading: "Open am. Sign in. Start group."
  body: "Create account, start group and add di first expense, all from di browser wey you don open already. You wan see di tour first? See [how e dey work](page:how-it-works), or check [wetin free cover](page:pricing)."
problem:
  heading: "Your phone don full. We understand."
  body: "Inside am, four thousand photos of di same sunset dey, plus storage warning wey you don dey swipe away since spring. Di last thing wey e need na another app, just to share one dinner. So Side Badger na web app. E dey run for modern browser on phone or computer. On phone e dey use mobile layouts, with di group page wey dem divide into tabs and touch-friendly controls. Some extras, like adding am to your home screen, depend on your browser, and we go talk where."
workflow:
  heading: "From browser tab reach home screen in three steps"
  steps:
    - title: "Open am and sign in"
      body: "Open Side Badger for your browser and sign in. All wey you need na email address and password, and you go verify di email before you fit add anything. Everybody inside di group need account, so di people wey you invite go do di same."
    - title: "Add am to your home screen or dock"
      body: "Once you don sign in, di app go offer to install itself. You go see **Install** button where your browser allow am, and **Show me how e dey go** where e no allow. You miss am, or you say no? **Settings page** get di same help under **Add am to Home Screen or Dock**. On iPhone or iPad, Settings go show di iPhone steps first and put di other devices under **Oda devices**. Either way, di app go then open for window of im own."
      shot: S20
      shotAlt: "Di Add am to Home Screen or Dock section of Settings page, with di steps for adding di app to device"
    - title: "Turn on notifications, if you want dem"
      body: "Notifications dey off until you switch dem on, and you go switch on each device separate. Use di **On am** button wey di notifications bell offer, or di **Push notifikashons** switch for **Settings page**. On iPhone or iPad, open di app from Home Screen first. Na di only place wey notifications dey work there."
      shot: S19
      shotAlt: "Di notifications dropdown wey open, wey list recent activity for di group"
options:
  heading: "How to add am, device by device"
  items:
    - title: "iPhone and iPad"
      body: "Tap di Share button, na square wey get arrow wey dey point up. If you no see am, tap di three dots (•••) first, then Share. Scroll down then tap **Add to Home Screen**. Make **Open as Web App** stay on, then tap **Add**. If link open inside another app, open di page for Safari first, because dat built-in browser no fit add am."
    - title: "Android"
      body: "Open di browser menu, then choose **Add to Home screen** or **Install app**."
    - title: "Chrome or Edge for computer"
      body: "Open di browser menu, then choose di option to install dis site as app. E go then get im own window and im own icon."
    - title: "Safari for Mac"
      body: "Go **File**, then choose **Add to Dock**."
sections:
  - heading: "Notifications, only if you ask for dem"
    body: "Push notifications na opt-in. Switch dem on and you go get notification when new activity dey for your groups, like when somebody add expense, leave comment or record payment. You dey switch dem on one device at a time, from di notifications bell or from **Settings page**, and you fit switch dem off again there. Dem need browser wey support dem and your permission. If your browser don block dem for di site, allow dem for di browser settings first. For iPhone or iPad dem only work from di app wey dem add to Home Screen, no be from browser tab. Dem no guarantee delivery, so treat notification as nudge, no be promise. For wetin dey show for di feed, see [plan am together](page:feature/plan-together)."
  - heading: "Updates dey show sharp sharp, no refresh button"
    body: "Add expense and everybody go see am sharp sharp, together with wetin change and who change am. Each group dey keep activity history, and di notifications bell dey show activity across all your groups. Nobody go need ask whether you don see di thing wey you just add. E dey on dem screen."
  - heading: "39 languages, each person get im own"
    body: "Use Side Badger for 39 languages, including right-to-left Arabic, Persian and Urdu. Everybody inside di group dey pick dem own, so di same group page fit dey Arabic for one person and English for di next person. Di only thing wey di group must agree on na di numbers."
  - heading: "Dem build am for more than one kind of person"
    body: "Dem build Side Badger with keyboard and screen-reader users for mind. Member colours dey come with patterns, so you no need tell green from red."
    items:
      - "Skip links, so keyboard users fit jump straight go di content."
      - "Dialogs dey manage keyboard focus."
      - "Controls get labels, for screen readers."
      - "Layouts dey flip for right-to-left languages."
limits:
  heading: "Wetin di web app no dey do"
  items:
    - "No offline use dey. Side Badger need connection, so e no go open your group for plane wey no get wifi."
    - "No app-store app dey and no native iPhone or Android app. Side Badger na web app, and to add am to your home screen or dock na how you go get di app-like version."
    - "To add am to home screen or dock depend on your browser. Menu names no dey di same between browsers and versions, and some browsers no dey offer am."
    - "Push notifications na opt-in per device, and dem need browser wey support dem and your permission. For iPhone or iPad dem only work from di app wey dem add to Home Screen. Dem no guarantee delivery."
    - "No email or text alerts dey and no payment reminders. New activity dey show inside di app, and as push notifications if you turn dem on. To chase payment still be your own work."
    - "Dem dey keep activity for 90 days."
    - "You dey sign in with email address and password. No Google or Apple sign-in dey, and you must be 18 or over."
    - "We no dey claim say Side Badger fully accessible, or say e meet formal accessibility standard. If something block your way, tell us from inside di app and you go see our reply there."
useCasesHeading: "Where e help say you no need app"
faq:
  heading: "Question dem"
  items:
    - q: "Side Badger app dey for app store?"
      a: "No. Side Badger na web app. You dey open am for your browser, and you fit add am to your home screen or dock so e go open like app. Nothing dey to download from app store."
    - q: "I fit share bills without to download app?"
      a: "Yes. Open Side Badger for browser on your phone or computer, sign in, and start group. To add am to your home screen or dock na optional."
    - q: "E dey work offline?"
      a: "No. Side Badger need connection, even when dem add am to your home screen or dock."
    - q: "Why I no dey get notifications on my iPhone?"
      a: "For iPhone or iPad, notifications dey work only from di app wey dem add to Home Screen, no be from browser tab. Add am, open am from di Home Screen icon, then turn notifications on for **Settings page**. Dem no guarantee delivery, so if one miss, di group activity history still dey show wetin dem add."
    - q: "I must turn notifications on?"
      a: "No. Dem dey off until you switch dem on, one device at a time. Without dem, new activity still dey show inside di app, and everybody go see change sharp sharp when dem open am."
    - q: "Everybody inside di group need account?"
      a: "Yes. All wey you need na email address and password, and you go verify di email before you fit add anything. Everybody wey join group go do di same, on whichever phone or computer dem like."
