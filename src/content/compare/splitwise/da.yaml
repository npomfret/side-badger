sections:
  - heading: Pengeprat lige ved siden af pengene
    body: Fælles penge kommer med prat, tvivl og planer. Side Badger holder alle tre ved siden af tallene, så ingen skal scrolle tilbage i gruppechatten.
    items:
      - "**Kommentarer, hvor de hører hjemme.** Kommentér selve gruppen eller en hvilken som helst udgift, liste eller afstemning, og lad snakken blive hos det, den handler om."
      - "**Kvitteringer og fotos.** Gem op til tre kvitteringer på hver udgift, og tilføj fotos eller PDF'er til kommentarer på gruppen, en liste eller en afstemning."
      - "**Spørgsmål, ikke skænderier.** En admin kan slå spørgsmål til, så kan alle i en udgift spørge ind til den. Den holdes uden for saldi, til det er afklaret."
      - "**Lister og afstemninger.** Hav den fælles indkøbsliste ved siden af indkøbsregningerne, og send feriehus-shortlisten til afstemning, anonymt, hvis du vil."
      - "**Lidt bifald.** Reagér på udgifter, betalinger og kommentarer, og fejr en betaling, når den er nået frem."
  - heading: Din gruppe, dine regler
    body: Splitwises hjælpecenter siger, at den ikke understøtter gruppeadministratorer eller særlige tilladelser. Side Badger har roller og tilladelser, til de grupper, der har brug for én, der holder tallene i orden.
    items:
      - "**Admins, medlemmer og seere.** Gør nogen til seer: de ser alt og ændrer intet."
      - "**To forudindstillinger, eller dine egne.** Start med Åbent samarbejde eller Administreret gruppe, eller indstil hver tilladelse selv: hvem der redigerer og sletter udgifter, redigerer lister, inviterer og lukker nye ind."
      - "**Godkendelse for at deltage.** Slå godkendelse til, så lukker en admin hver person ind."
      - "**Gruppens egne indstillinger.** Begræns den til de valutaer, du faktisk bruger, vælg dens standardvaluta, og giv den et billede øverst."
      - "**Lås den, når det er slut.** Tallene bliver, som de er, til en admin låser op."
  - heading: Gratis her, betalt dér
    body: Splitwise Pro er Splitwises betalte abonnement, og dets egen Pro-side sælger tre ting, der ikke koster noget i Side Badger.
    items:
      - "**Kvitteringsscanning.** Splitwise Pro scanner et billede af din kvittering. Side Badger gør det gratis, uden scanningskreditter: den udfylder total, dato og sted, så du kan tjekke dem."
      - "**Valutaomregning.** Splitwise Pro omregner en gruppes udgifter til din standardvaluta, når du trykker på »Convert«. Side Badger omregner hver udgift, mens du indtaster den, med en aktuel valutakurs eller den, du faktisk fik, og det oprindelige beløb bliver stående på udgiften."
      - "**Ingen daglige grænser.** Splitwise Pro sælger ubegrænsede udgifter, og dets hjælpecenter siger, at gratis brugere kan tilføje op til 4 udgifter om dagen. Side Badger har ingen daglige grænser."
  - heading: Din bank holdes uden for
    body: Side Badger forbinder sig ikke til din bank og beder ikke om dine bankoplysninger. Den fører regnskab med, hvem der skylder hvem; man betaler hinanden, som man vil, og registrerer så betalingen. Intet bank-login at aflevere, så én ting mindre at passe på.
  - heading: Én app, i din browser og på din telefon
    body: Side Badger kører i din browser. Log ind, føj den til din startskærm, og den åbner som en app. Det er den samme app begge steder, så en ny funktion er på din telefon, næste gang du åbner den, uden en app store-opdatering at vente på.
  - heading: Og et par ekstra overraskelser
    items:
      - "**Spørg din assistent.** Side Badger virker sammen med ChatGPT og Claude: bed din om at tilføje en udgift, scanne en kvittering eller registrere en betaling."
      - "**Alle på deres eget sprog.** Side Badger taler 39 sprog, og hver person vælger sit eget. Splitwises startside siger 7+. Den håndterer også 133 valutaer, til turen, der går overalt."
      - "**Hjælp uden at forlade appen.** Kørt fast, eller fundet en fejl? Skriv til os fra appen, og læs vores svar lige dér."
  - heading: Hvor Splitwise stadig vinder
    body: Vi vil hellere have, at du vælger den rigtige app, end at du finder ud af det senere. Hvis din gruppe har brug for noget af dette, har Splitwise det, og Side Badger har det ikke.
    items:
      - "**App store-apps.** Side Badger bor i din browser og på din startskærm, ikke i app stores."
      - "**Offline-tilstand.** Side Badger kræver en forbindelse."
      - "**Betalinger i appen.** I nogle lande kan Splitwise også flytte pengene. Side Badger fører kun regnskabet."
      - "**Deling efter andele eller pr. vare.** Side Badger har én betaler pr. udgift, delt ligeligt, efter nøjagtige beløb eller i procent. Kvitteringsscanningen fordeler ikke varer på personer."
      - "**Diagrammer og standardopdelinger.** Splitwise Pro har begge dele. Side Badger holder regnskab med, hvem der skylder hvem, og det er hele kunsten."
  - heading: Flyt din gruppe over
    body: Der er ingen importfunktion, så en flytning betyder en frisk start. Gør først op i Splitwise, opret så en gruppe i Side Badger, og inviter alle med et link eller en QR-kode. Alle i gruppen skal have en gratis konto, og det eneste, der skal til for at tilmelde sig, er en e-mailadresse.
