faq:
  heading: "Pytania"
  items:
    - q: "Co, jeśli zbierzemy więcej, niż kosztuje prezent?"
      a: "Dokładne kwoty muszą dawać w sumie cenę, więc przytnij udziały, aż się zgodzą. Albo przeznacz nadwyżkę na coś prawdziwego, na przykład kwiaty, i wpisz to jako drugi wydatek, jak kartkę i papier w przykładzie."
    - q: "Czy ktoś może się dorzucić bez dołączania do grupy?"
      a: "Nie, jeśli ma być w rachunku. Każdy w podziale potrzebuje darmowego konta i miejsca w grupie. Dla kogoś, kto ma tylko gotówkę, Priya może ją przyjąć i wpisać prezent na kwotę, którą grupa jeszcze jest winna. Na przykład jeśli Sam przekaże jej 40 £ gotówką, Priya wpisze 200 £ i podzieli je 60, 60 i 80 między siebie, Omara i Lenę."
    - q: "Czy ankieta może ustalić, ile dorzuca każdy?"
      a: "Nie. Ankieta ustala kwotę dla całej grupy, na przykład budżet. Udział każdej osoby ustalacie między sobą, a potem wpisujecie go do wydatku jako **Dokładne kwoty**."
