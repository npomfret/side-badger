sections:
  - heading: "Jedna měna pro celou skupinu"
    body: "Pokud na to skupina nechce myslet, vyberte měnu skupiny a formulář do ní převede každý nový výdaj, podle kurzu, který stále vidíte a můžete změnit. Týká se to jen nových a zkopírovaných výdajů. Úpravy a stávající výdaje zůstávají, jak jsou, takže se nic už zaznamenaného nemění pod rukama."
  - heading: "Dlužíte eura, platíte v librách"
    body: "Platilo se v jenech a vyrovnáváte v librách? V pořádku. Když zaznamenáváte platbu, můžete ji také převést, takže ten, kdo dluží eura, může zaplatit v librách a zůstatek v eurech stále vyjde správně. Platíte si, jak chcete, a pak to zaznamenáte."
  - heading: "Pravidla pro skupinu"
    body: "Omezte skupinu na měny, které opravdu používáte, a nastavte výchozí, aby se formulář otevíral na té správné. Dovolená v Portugalsku nepotřebuje vedle účtu za večeři 139 dalších možností a [svatba v zahraničí](page:use-case/events-and-celebrations) pravděpodobně potřebuje dvě."
limits:
  heading: "Limity"
  items:
    - "Kurz se zafixuje při uložení výdaje. Staré výdaje se nikdy nepřeceňují."
    - "Side Badger stáhne aktuální kurz, kde to jde. Ne každá dvojice ho má zaručený a kurz můžete vždy zadat sami."
    - "Automatický převod ve skupině platí jen pro nové a zkopírované výdaje, ne pro úpravy ani stávající výdaje."
    - "Každý výdaj je omezen na 999 999,99 ve své měně."
    - "Existuje 140 měn. Kryptoměny a kovy mezi nimi nejsou."
    - "Side Badger zaznamenává platby. Nikdy peníze nepřesouvá ani nevyměňuje."
useCasesHeading: "Kde to pomáhá"
faq:
  heading: "Otázky"
  items:
    - q: "Jaký směnný kurz používáte?"
      a: "Aktuální směnný kurz, stažený při zadání výdaje tam, kde je k dispozici. Můžete ho změnit na ten, který platil při výměně, a převedená částka se aktualizuje."
    - q: "Přeceňují se staré výdaje?"
      a: "Ne. Kurz se zafixuje při uložení výdaje, takže se zůstatek nehýbe jen proto, že se pohnul trh."
    - q: "Podporujete kryptoměny?"
      a: "Ne. Existuje 140 měn a kryptoměny mezi nimi nejsou."
    - q: "Proč nemohu zadat 2 000 000 indonéských rupií?"
      a: "Každý výdaj je omezen na 999 999,99 ve své měně. Zadejte ho v jiné měně a převeďte, nebo ho rozdělte na dva výdaje."
    - q: "Stojí převod něco?"
      a: "Ne. Převod je zdarma, stejně jako zbytek Side Badger. Viz [ceník](page:pricing)."
    - q: "Musím převádět?"
      a: "Ne. Měny zůstávají zvlášť, pokud se vy nebo vaše skupina nerozhodnete převádět, a každá měna má vlastní krátký seznam plateb."
