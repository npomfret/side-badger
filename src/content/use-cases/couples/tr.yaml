    - label: "Market"
      payer: alex
      amount: 90
      split:
        method: equal
featuresHeading: "Bir çiftin kullandığı özellikler"
faq:
  heading: "Sorular"
  items:
    - q: "Her şey için bir kez %60/%40 ayarlayabilir miyiz?"
      a: "Hayır. Bölüşüm her harcamaya aittir. Yüzdeleri ilkinde ayarlayın, sonra bir sonrakinde onu kopyalayıp farklı olanı değiştirin. Üç bölüşüm yolunun hepsi için [harcamaları bölüşme](page:feature/split-expenses) sayfasına bakın."
    - q: "Bankamıza bağlanıyor mu?"
      a: "Hayır. Side Badger paranıza hiç dokunmaz. Birbirinize istediğiniz yolla ödersiniz, sonra [hesaplaşma](page:feature/settle-up) sayfasında açıklandığı gibi kaydedersiniz."
    - q: "Başka biri grubumuzu görebilir mi?"
      a: "Yalnızca üyeleri, bir çiftin grubunda da iki kişi var. Geçerli bir davet bağlantısını kullanan herkes katılabilir; bu yüzden onu tek bir kişiyle paylaşın ve kısa bir süre verin."
    - q: "Aynı faturanın bir kısmını ikimiz ayrı ödediysek?"
      a: "Bir harcamanın tek ödeyeni vardır. İkiniz için birer tane olmak üzere iki harcama kaydedin; bakiye aynı çıkar."
    - q: "Partnerime ödemesini hatırlatır mı?"
      a: "Hayır. Hatırlatıcı yok, dürtme işi hâlâ sizde. En azından ikiniz de aynı rakama bakıyor olacaksınız."
    - q: "Masrafları paylaşmayı bıraktığımızda ne olur?"
      a: "Bakiyeyi ödeyip ödemeyi kaydedin, böylece kimse borçlu kalmaz. Sonra bir yönetici rakamları olduğu gibi tutan grubu kilitleyebilir ya da herkes için erişilemez yapan kalıcı biçimde kapatabilir. Grubu yalnızca ikinizin de geçmişe ihtiyacı kalmadığında kapatın."
