meta:
  title: "Side Badger для сусідів, поїздок і вечірок"
  description: "Діліть витрати із сусідами, у групових поїздках і для вечірок, весіль та спільних подарунків. Подивіться, що Side Badger робить для кожного виду групи."
h1: "Side Badger для вашого виду групи"
navLabel: "Сценарії"
lead: "Сусіди, відпустки, дівич-вечори. Оберіть свій хаос, а тоді подивіться, як група на кшталт вашої веде облік."
intro: "Кожна група ділить витрати трохи по-своєму. Ці сторінки йдуть за **реалістичним сценарієм** від першої витрати до останнього записаного платежу, з показаними розрахунками, щоб було видно, до чого дійшла б ваша група."
cta:
  heading: "Впізнаєте свій вид групи?"
  body: "Створіть обліковий запис, заведіть групу й додайте першу витрату. Це займе кілька хвилин."
cardsHeading: "Оберіть ситуацію, найближчу до вашої"
sections:
  - heading: "Групові поїздки"
    body: "Перельоти у фунтах, вілла в євро й вечеря, яку їли лише троє. Налаштуйте групу на конвертацію у фунти, і четверо друзів у Лісабоні закінчують трьома платежами замість шести, як буває, коли валюти ведуться окремо. [Діліть витрати групової поїздки](page:use-case/group-trips)."
  - heading: "Сусіди"
    body: "Одна людина платить власникові, інша пам'ятає про рахунок за електрику, і ніхто не згоден, хто купив туалетний папір. З орендою, розділеною за розміром кімнати, й іншими рахунками, розділеними порівну, четверо сусідів закінчують місяць трьома платежами, усіма на користь того, хто заплатив оренду. [Діліть побутові рахунки із сусідами](page:use-case/housemates)."
  - heading: "Вечірки, весілля та спільні подарунки"
    body: "Шестеро людей голосують за подарунок, один його купує, і не всі вносять однакову суму. Подарунок за 150 £, розділений за точними сумами, залишає п'ять платежів людині, яка його купила, разом 120 £. [Діліть витрати події](page:use-case/events-and-celebrations)."
  - heading: "Пари"
    body: "Діліть нудні витрати, не перетворюючи побачення на щоквартальний фінансовий огляд. Оренда, розділена 60/40, і продукти, розділені порівну, зводяться до одного платежу між вами двома. [Ділімо витрати вдвох](page:use-case/couples)."
  - heading: "Спершу подивіться, як це працює"
    body: "Кожен із наведених прикладів використовує ті самі кроки, від створення групи до запису платежів. [Як це працює](page:how-it-works) проводить крізь них, [посібники](page:guides) розбирають по одній складній ситуації, а [ціни](page:pricing) кажуть, скільки це коштує, тобто нічого, без реклами та без денних обмежень."
faq:
  heading: "Запитання"
  items:
    - q: "Чи потрібен обліковий запис кожному в групі?"
      a: "Так. Люди приєднуються за посиланням чи QR-кодом і з безкоштовним обліковим записом."
    - q: "Чи може Side Badger збирати гроші?"
      a: "Ні. Ви платите як зручно, а потім записуєте платіж, щоб баланси лишалися правильними."
    - q: "Чи треба обирати один вид групи?"
      a: "Ні. Сценарії — це приклади, а не налаштування. Кожна група має ті самі можливості, тож користуйтеся тим поєднанням, що підходить."
