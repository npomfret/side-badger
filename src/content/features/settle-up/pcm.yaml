exampleAfter: 0
sections:
  - heading: "Record payment"
    body: "When somebody pay, record am against di right person. Di Kwik settul buttons dey fill di amount from your suggested payments, and you fit add note like “bank transfer” (up to 500 characters). Pay only part of wetin you owe and di rest go stay on di balance. If you enter too little or too much, Side Badger go warn you before you save. To record payment, you need permission to edit expenses, and di date no fit dey for future."
  - heading: "You pay for different currency?"
    body: "Balances dey stay for di currency dem pay am, so euro debt go stay euro debt. You owe euros, pay for pounds? Convert di payment as you dey enter am, for current exchange rate or for di rate wey you really get. Di rate dey fixed when dem save di payment. [Multiple currencies](page:feature/multiple-currencies) explain how conversion dey work, and [group trips](page:use-case/group-trips) show am for use."
  - heading: "History wey you fit check"
    body: "Every payment wey dem record dey stay for di group history with im date, amount and note. Only di person wey record payment fit edit am, and di person or group admin fit delete am. Payment wey involve person wey don leave di group dey locked. For worked housemate scenario, see [housemates](page:use-case/housemates)."
limits:
  heading: "Wetin Side Badger no dey do"
  items:
    - "Side Badger no dey move money, send payment links or send payment requests. Payment for di app na record of payment wey dem make somewhere else."
    - "Di suggested payments dey come from simple matching method, wey dem apply per currency. E always suggest fewer payments than di number of people wey get balance for dat currency (four people, three payments at most), but e no always find di smallest possible number."
    - "You no fit switch di suggestions off. **Sho all** list every suggested payment for di group, no be only yours."
    - "Currencies no dey net against each other unless dem convert di expenses when dem enter am."
    - "No reminders dey, so to chase payment still be your own work."
useCasesHeading: "Where settling up matter"
faq:
  heading: "Question dem"
  items:
    - q: "Side Badger dey send di money?"
      a: "No. Pay each other anyhow you like, then record di payment for Side Badger so di balance go update."
    - q: "I fit turn di suggested payments off?"
      a: "No. Simplification dey stay on, and **Sho all** list every suggested payment for di group, no be only di ones wey involve you."
    - q: "Why euros and pounds dey separate?"
      a: "Balances dey stay for di currency wey you pay unless you convert when you enter expense or payment. Debts for different currencies no dey net against each other."
    - q: "Wetin if somebody pay only part of wetin e owe?"
      a: "Record di part wey e pay. Di rest go stay on di balance until dem pay am."
    - q: "Na always di smallest possible number of payments?"
      a: "No guarantee. E always suggest fewer payments than di number of people wey get balance for dat currency, so for four people e no go ever suggest more than three. For di housemates example, na two payments, where to pay each person back direct take six."
