meta:
  title: "Τι να κάνετε όταν αμφισβητείται ένα κοινό έξοδο | Side Badger"
  description: "Ξεχάστε το μήνυμα με τα υπονοούμενα. Αμφισβητήστε το έξοδο και βγαίνει από τα υπόλοιπα όλων όσο μιλάτε. Με παράδειγμα 45 £ κρασί για πάρτι."
h1: "Τι να κάνετε όταν κάποιος αμφισβητεί ένα κοινό έξοδο"
navLabel: "Αμφισβητούμενα έξοδα"
lead: "Θέστε μια ερώτηση στο έξοδο αντί να στείλετε ένα μήνυμα με υπονοούμενα. Όσο η ερώτηση είναι ανοιχτή, ολόκληρο το έξοδο μένει εκτός των υπολοίπων όλων. Συζητήστε το στα σχόλια, επεξεργαστείτε τον διαχωρισμό αν συμφωνεί η ομάδα και αφήστε το άτομο που ρώτησε, ή έναν διαχειριστή, να κλείσει την ερώτηση."
cta:
  heading: "Κάντε ευγενικά την άβολη ερώτηση"
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα για το σπίτι και ζητήστε από έναν διαχειριστή να ενεργοποιήσει τις ερωτήσεις για έξοδα, που είναι απενεργοποιημένες μέχρι να το κάνει κάποιος. Θέλετε πρώτα μια ξενάγηση; Δείτε [πώς λειτουργεί](page:how-it-works) ή [τι καλύπτει το δωρεάν](page:pricing)."
sections:
  - heading: "Τρεις συγκάτοικοι και 45 £ κρασί"
    body: "Μετά το πάρτι, ο Τομ προσθέτει το κρασί στην ομάδα του σπιτιού. Είναι 45 £, πληρωμένα από τον Τομ, χωρισμένα εξίσου ανάμεσα στον Τομ, την Πρίγια και την Αΐσα, δηλαδή 15 £ το άτομο. Η Αΐσα δεν πίνει. Ο Τομ το αγόρασε για το πάρτι και το πάρτι ήταν για το [σπίτι](page:use-case/housemates), οπότε δεν έχει κάνει κάτι λάθος. Ούτε η Αΐσα κάνει λάθος που ρωτά. Κανείς εδώ δεν είναι ο κακός της υπόθεσης. Υπάρχουν απλώς 15 £ κρασί υπό αμφισβήτηση και πολλοί τρόποι να γίνει άβολο. Ένα μήνυμα με υπονοούμενα προς όλο το σπίτι είναι ένας τρόπος. Μια ερώτηση στο έξοδο είναι ένας πιο ήπιος τρόπος."
  - heading: "Τι κάνει μια ερώτηση"
    body: "Η Αΐσα ανοίγει το έξοδο και θέτει μια ερώτηση. Ολόκληρο το έξοδο βγαίνει από τα υπόλοιπα όλων, όχι μόνο το δικό της μερίδιο, και τίποτε άλλο δεν επηρεάζεται. Τα μεγάλα ψώνια (84 £) και ο καθαρισμός (60 £) μετράνε ακόμα, δηλαδή 28 £ + 20 £ = 48 £ το άτομο. Έτσι, όσο το κρασί είναι σε αναμονή, η Αΐσα χρωστά 48 £, στον Τομ οφείλονται 36 £ και στην Πρίγια 12 £. Ό,τι κι αν αποφασίσει το σπίτι για το κρασί, στο μεταξύ κανενός το υπόλοιπο δεν το περιλαμβάνει. Και όποιος άλλος συμμετέχει στο έξοδο μπορεί να θέσει τη δική του ερώτηση. Το κρασί επιστρέφει στα υπόλοιπα μόνο όταν κλείσει η τελευταία ανοιχτή ερώτηση γι' αυτό, και κάθε ερώτηση την κλείνει το άτομο που ρώτησε ή ένας διαχειριστής."
  - heading: "Συζήτηση και μετά διόρθωση"
    body: "Η ερώτηση της Αΐσας πέφτει στα σχόλια του εξόδου, οπότε οι απαντήσεις μπαίνουν ακριβώς από κάτω. Η σελίδα [Σχεδιάστε μαζί](page:feature/plan-together) έχει περισσότερα για τα σχόλια και τις ερωτήσεις. Ο Τομ και η Πρίγια τη διαβάζουν και το σπίτι κάνει μια κουβέντα. Αποφασίζουν ότι το κρασί ήταν του Τομ και της Πρίγιας, επειδή αυτοί το ήπιαν. Ένα άλλο σπίτι θα μπορούσε να κρατήσει τον διαχωρισμό στα τρία ή να συμφωνήσει κάτι ενδιάμεσο και κι αυτό θα ήταν εντάξει. Το Side Badger αποθηκεύει ό,τι συμφωνείτε και δεν έχει άποψη για το κρασί. Ο Τομ επεξεργάζεται το έξοδο ώστε να χωρίζεται εξίσου ανάμεσα στον ίδιο και την Πρίγια, δηλαδή 22,50 £ το άτομο (45 £ ÷ 2). Η Αΐσα δεν συμμετέχει πια, οπότε η ερώτησή της φεύγει με την παλιά έκδοση και το κρασί επιστρέφει στα υπόλοιπα. Η προηγούμενη έκδοση διατηρείται."
  - heading: "Διαβάζοντας το αποτέλεσμα"
    body: "Με το κρασί πίσω στα υπόλοιπα, στον Τομ οφείλονται 58,50 £, η Πρίγια χρωστά 10,50 £ και η Αΐσα χρωστά 48 £. Το Side Badger προτείνει δύο πληρωμές, και οι δύο προς τον Τομ. Τα 48 £ της Αΐσας είναι το ποσό που είχε όσο το κρασί ήταν σε αναμονή, επειδή εκείνη δεν συμμετέχει σε αυτό. Η Πρίγια πέρασε από το να της οφείλονται 12 £ στο να χρωστά 10,50 £, λόγω του μισού του κρασιού που της αναλογεί, 22,50 £. Αν είχε μείνει ο διαχωρισμός στα τρία, η Αΐσα θα χρωστούσε 63 £ (28 £ + 20 £ + 15 £). Ολόκληρη η διαφωνία άξιζε 15 £. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε κάθε πληρωμή στην **Τακτοποίηση**. Η [εκκαθάριση](page:feature/settle-up) καλύπτει τα υπόλοιπα."
  - heading: "Πώς να το διατυπώσετε ώστε να σας μιλάνε ακόμα"
    body: "Η ερώτηση της Αΐσας: «Δεν ήπια καθόλου κρασί. Μπορούμε να δούμε τον διαχωρισμό;» Είναι σύντομη, κατονομάζει το έξοδο και ρωτά αντί να κατηγορεί. Βοηθούν μερικές συνήθειες."
    items:
      - "**Ρωτήστε για το έξοδο, όχι για το άτομο.** Το «Μπορούμε να ελέγξουμε τον διαχωρισμό για το κρασί;» ανοίγει μια συζήτηση. Το «Γιατί με χρέωσαν για το δικό σου κρασί;» ανοίγει το άλλο είδος."
      - "**Πείτε τι θα θέλατε να γίνει.** Το «Θα μπορούσε να είναι μόνο όσοι το ήπιαν;» δίνει στην ομάδα κάτι με το οποίο να συμφωνήσει ή να απαντήσει."
      - "**Δώστε έναν λόγο σε μία-δυο προτάσεις.** Το πεδίο λέγεται **Η ερώτησή σας** και δεν μπορεί να μείνει κενό."
      - "**Κρατήστε τις απαντήσεις σε ένα μέρος.** Οι απαντήσεις μπαίνουν στα σχόλια του εξόδου, δίπλα στους αριθμούς στους οποίους αναφέρονται."
  - heading: "Στήστε το στο Side Badger"
    items:
      - "**Ενεργοποιήστε τις ερωτήσεις.** Είναι απενεργοποιημένες από προεπιλογή. Ένας διαχειριστής ανοίγει τις **Ρυθμίσεις** της ομάδας, ενεργοποιεί το **Να επιτρέπονται ερωτήσεις για έξοδα** στις **Λειτουργίες** της καρτέλας **Γενικά** και επιλέγει **Αποθήκευση**. Αν το απενεργοποιήσετε αργότερα, αφαιρούνται όλες οι ανοιχτές ερωτήσεις."
      - "**Θέστε μία.** Ανοίξτε το έξοδο και, δίπλα στο δικό σας όνομα στον διαχωρισμό, επιλέξτε **Έχω μια ερώτηση**. Γράψτε τον λόγο σας στο **Η ερώτησή σας** και επιλέξτε ξανά **Έχω μια ερώτηση**. Μόνο όσοι συμμετέχουν στο έξοδο μπορούν να το κάνουν. Το έξοδο δείχνει τώρα ένα σήμα **Αμφισβητήθηκε**."
      - "**Βρείτε τι είναι σε αναμονή.** Στη λίστα εξόδων, το **Μόνο υπό αμφισβήτηση** δείχνει τα έξοδα με ανοιχτή ερώτηση."
      - "**Διορθώστε το, αν συμφωνεί η ομάδα.** Ανοίξτε το έξοδο, επιλέξτε **Επεξεργασία**, αλλάξτε το **Μοιράζεται μεταξύ** και επιλέξτε **Ενημέρωση Εξόδου**. Το ποιος μπορεί να επεξεργάζεται εξαρτάται από τα δικαιώματα της ομάδας."
      - "**Κλείστε την, αν δεν χρειάζεται διόρθωση.** Το άτομο που ρώτησε μπορεί να χρησιμοποιήσει το κουμπί κλεισίματος στο σήμα **Αμφισβητήθηκε**, με την ετικέτα **Κλείσιμο ερώτησης**, και το ίδιο μπορεί να κάνει ένας διαχειριστής. Το έξοδο επιστρέφει στα υπόλοιπα μόλις κλείσει η τελευταία του ερώτηση."
  - heading: "Όταν δεν είναι τόσο τακτοποιημένα τα πράγματα"
    items:
      - "**Η επεξεργασία κρατά μέσα αυτόν που ρώτησε.** Αν το άτομο που ρώτησε συμμετέχει ακόμα στο έξοδο, η ερώτησή του περνά στην επεξεργασμένη έκδοση και περιμένει να την κλείσει το ίδιο ή ένας διαχειριστής. Το να διορθώσετε το ποσό δεν σημαίνει ότι συμφωνήσατε πως διορθώθηκε."
      - "**Δεν συμμετείχατε στο έξοδο.** Μόνο όσοι συμμετέχουν σε ένα έξοδο μπορούν να το αμφισβητήσουν. Αν κάτι σας φαίνεται παράξενο, πείτε το στα σχόλιά του ή ρωτήστε όποιον το πρόσθεσε."
      - "**Κάποιος θέλει να φύγει από την ομάδα.** Μια ανοιχτή ερώτηση εμποδίζει να φύγουν όσοι συμμετέχουν σε εκείνο το έξοδο. Κλείστε την ερώτηση ή επεξεργαστείτε το έξοδο ώστε να μην συμμετέχουν πια και μπορούν να φύγουν."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν αποφασίζει ποιος έχει δίκιο. Κρατά το έξοδο εκτός των υπολοίπων και διατηρεί ό,τι συμφωνείτε."
      - "Δεν ζητά από κανέναν να εγκρίνει τα έξοδα πριν μετρήσουν. Μόνο ένα έξοδο που αμφισβητείται κρατιέται σε αναμονή."
      - "Δεν μπορεί να κρατήσει εκτός ένα μέρος ενός εξόδου. Αμφισβητήστε το και ολόκληρο φεύγει από τα υπόλοιπα."
      - "Δεν μετακινεί χρήματα. Πληρώνετε ο ένας τον άλλον όπως θέλετε και το καταγράφετε."
