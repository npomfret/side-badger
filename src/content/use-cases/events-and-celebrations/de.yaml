meta:
  title: Kosten für Partys, Hochzeiten und Gruppengeschenke teilen
  description: Teile die Kosten einer Party, Hochzeit oder eines Gruppengeschenks, wenn alle unterschiedlich viel beisteuern. Stimmt über den Plan ab, teile nach genauen Beträgen und sieh, wer wem was schuldet.
h1: Kosten für Partys, Hochzeiten und Gruppengeschenke teilen
navLabel: Events und Feiern
lead: Teile Anzahlungen, Deko und Notfall-Regenschirme. Die Sitzordnung überlässt du jemand Mutigerem. Side Badger hält an einem Ort fest, **wer was beigesteuert hat**, damit auch die Organisation die Party genießen kann.
cta:
  heading: Fang mit der nächsten Feier an
  body: Erstelle ein Konto, mach eine Gruppe für das Event und schick den Einladungslink. Side Badger ist kostenlos, ohne Werbung und ohne Tageslimits.
  button: Kostenloses Konto erstellen
scenario:
  heading: Alle steuern etwas bei, nicht immer gleich viel
  body: Jemand zahlt die Anzahlung für die Location, jemand anderes kauft den Kuchen, und eine dritte Person setzt das Gruppengeschenk auf die eigene Karte. Manche Gäste kommen zu allem, manche nur zum Essen. Darüber in einem Chat fair Buch zu führen, ist ein Job, für den sich keiner beworben hat. Eine Side-Badger-Gruppe hält alles fest, egal wie bunt die Beträge gemischt sind, und zeigt jeder Person, was sie schuldet oder bekommt. Die Grundlagen findest du unter [so funktioniert es](page:how-it-works), oder lies weiter für ein Event.
sections:
  - heading: Gemeinsam entscheiden
    body: Bevor Geld fließt, stell die Entscheidung in einer **Umfrage** zur Wahl. Füge bis zu 10 Optionen hinzu, etwa zwei Locations oder drei Geschenkideen, und lass alle abstimmen. Du kannst verbergen, wer wofür gestimmt hat, damit jede Option fair gehört wird, und der Gewinner erscheint, sobald die Umfrage geschlossen ist. Niemand muss vierzig Nachrichten zurückscrollen, um herauszufinden, was beschlossen wurde.
  - heading: Wer wofür dabei ist
    body: Nicht alle zahlen gleich viel, und nicht alle sind an jeder Ausgabe beteiligt. Teile eine Ausgabe gleichmäßig, in Prozent oder nach **genauen Beträgen**, damit der Anteil jeder Person die Zahl ist, auf die ihr euch geeinigt habt. Lass alle weg, die nicht beteiligt waren, etwa die Gäste, die das Essen ausgelassen haben, oder die Freunde, die beim Geschenk nicht mitgemacht haben. Jede Ausgabe hat eine zahlende Person, und alle anderen in der Aufteilung schulden ihr ihren Anteil. Die Details stehen auf der Seite [Ausgaben teilen](page:feature/split-expenses).
  - heading: Die Unterlagen behalten
    body: Füge einer Ausgabe Notizen hinzu, etwa wofür die Kosten waren. Kommentare bleiben **bei der Ausgabe**, um die es geht, die Frage "War der Kuchen £45 oder £54?" und ihre Antwort stehen also am selben Ort. Kommentare dürfen 500 Zeichen lang sein, was für eine Frage zu einer Anzahlung reichlich ist.
  - heading: Steuerung für die Organisation
    body: Offene Zusammenarbeit lässt jedes Mitglied Ausgaben hinzufügen und bearbeiten, was für ein kleines Geschenk in Ordnung ist. Für eine Hochzeit oder eine größere Party wähle die Voreinstellung **Verwaltete Gruppe**. Admins geben jedes neue Mitglied frei, und nur Ersteller und Admins können Ausgaben ändern. Lade Leute per Link oder QR-Code ein; bei eingeschalteter Freigabe lässt ein Admin jede Person herein, die Gästeliste bleibt also die Gästeliste. Wenn das Event vorbei ist, sperre die Gruppe, damit die Zahlen stehen bleiben.
  - heading: Nach der Party abrechnen
    body: Sobald die letzte Rechnung drin ist, zeigen die Salden, **wer wem was schuldet**, und Side Badger schlägt eine kurze Liste von Zahlungen vor, die alle ausgleicht. Zahlt einander, wie ihr wollt, und erfasst die Zahlung dann in der Gruppe. Side Badger bewegt nie Geld, die Gruppe führt also die Rechnung, während die Überweisungen in euren eigenen Banking-Apps laufen. Die Seite [Abrechnen](page:feature/settle-up) zeigt, wie aus einem Knäuel eine kurze Liste wird.
