faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah Side Badger alternatif gratis untuk Splitwise?"
      a: "Untuk membagi tagihan dalam grup, ya. Pemindaian struk, konversi mata uang, dan tanpa iklan semuanya gratis, tanpa batas harian. Jika Anda memerlukan aplikasi native, penggunaan offline, pengeluaran berulang, atau pembayaran di dalam aplikasi, Splitwise punya semuanya dan Side Badger tidak."
    - q: "Dari mana rincian Splitwise berasal?"
      a: "Dari halaman Splitwise sendiri: halaman berandanya, halaman Pro-nya, dan pusat bantuannya. Setiap baris tabel menaut ke halaman asalnya, dan tanggal di atas tabel menyebut kapan kami membacanya. Kami memeriksanya setiap kuartal."
    - q: "Apakah Side Badger akan tetap gratis?"
      a: "Semua yang ada di Side Badger gratis saat ini, dan tidak ada paket berbayar. Jika itu berubah, kami akan memberi tahu Anda lebih dulu. [Halaman harga](page:pricing) memuat rinciannya."
    - q: "Apakah semua orang di grup saya harus pindah?"
      a: "Ya. Setiap orang di grup perlu akun Side Badger gratis, dan mereka bisa bergabung dengan tautan atau kode QR."
    - q: "Apakah Side Badger punya aplikasi seluler?"
      a: "Bukan di toko aplikasi. Ia berjalan di peramban Anda: masuk di ponsel, lalu tambahkan ke layar utama agar terbuka seperti aplikasi. [Cara kerja](page:how-it-works) menunjukkan caranya."
