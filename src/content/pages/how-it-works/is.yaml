sections:
  - heading: "39 tungumál, gert fyrir fleira fólk"
    body: "Notaðu Side Badger á 39 tungumálum, þar á meðal arabísku, persnesku og úrdú sem eru skrifuð frá hægri til vinstri. Hver og einn í hópnum getur valið sitt eigið, svo hópsíðan getur verið á arabísku fyrir einn og ensku fyrir þann næsta. Það er líka hannað með lyklaborðs- og skjálesaranotendur í huga, og litir meðlima fylgja mynstur, svo þú þarft ekki að greina grænt frá rauðu."
faq:
  heading: "Spurningar"
  items:
    - q: "Þurfa allir aðgang?"
      a: "Já, ókeypis aðgang. Hver og einn staðfestir netfangið sitt áður en hann bætir einhverju við."
    - q: "Er til app?"
      a: "Það keyrir í vafranum. Skráðu þig inn og bættu því svo við heimaskjáinn eða Dock-ið svo það opnist eins og app. Stillingar í appinu sýna þér hvernig. Það er engin útgáfa í appverslun og engin ónettengd stilling."
    - q: "Flytur Side Badger peninga?"
      a: "Nei. Það heldur utan um stöðuna og leggur til greiðslur, og þið borgið hvert öðru eins og ykkur hentar. Svo skráið þið greiðsluna. Sjá [uppgjör](page:feature/settle-up)."
    - q: "Getur einhver yfirgefið hóp með skuld?"
      a: "Nei. Enginn getur yfirgefið hóp á meðan hann skuldar eða á inni pening, svo hann gerir upp fyrst."
    - q: "Hve margir geta gengið í hóp?"
      a: "Allt að 50 manns í hóp. Bjóddu þeim með tengli eða QR-kóða og kveiktu á samþykki ef þú vilt að stjórnandi hleypi hverjum og einum inn."
    - q: "Hvað með ferðir með fleiri en einum gjaldmiðli?"
      a: "Staðan er haldin sérstaklega fyrir hvern gjaldmiðil. Sjá [marga gjaldmiðla](page:feature/multiple-currencies)."
