meta:
  title: Dividi le spese in 140 valute, convertite o tenute separate
  description: Inserisci ogni spesa nella valuta in cui hai pagato, tieni i saldi separati o converti a un tasso che puoi vedere e modificare, poi salda con una breve lista di pagamenti.
h1: Dividi le spese in 140 valute
navLabel: Più valute
lead: Euro, yen e quel taxi in baht. Side Badger registra ogni spesa nella valuta in cui hai pagato, tiene i saldi in ordine e può convertire quando il gruppo preferisce saldare una volta sola. Funziona in 140 valute ed è perfetto per i [viaggi di gruppo](page:use-case/group-trips).
cta:
  heading: Porta i tuoi euro, porta i tuoi yen
  body: Crea un account, avvia un gruppo e aggiungi la prima spesa nella valuta che avevi in tasca.
problem:
  heading: Inseriscila come l'hai pagata
  body: Un viaggio si paga di rado in una sola valuta. L'hotel è stato prenotato da casa in sterline, la cena è stata pagata in yen e il caffè in aeroporto in qualunque valuta usasse lo scalo. Convertire tutto a mano prima ancora di poterlo inserire è il modo in cui i fogli di calcolo vengono abbandonati. In Side Badger inserisci ogni spesa nella valuta dello scontrino, e ogni importo segue le regole della sua valuta, quindi gli yen non hanno decimali e i dinari ne hanno tre. Le valute usate di recente compaiono per prime nell'elenco.
workflow:
  heading: Tieni le valute separate, o converti man mano
  steps:
    - title: Aggiungi la spesa nella sua valuta
      body: Scegli la valuta, scrivi l'importo, indica chi ha pagato e chi ha condiviso. Non serve altro. È l'impostazione predefinita e conserva l'importo originale esattamente come l'hai inserito.
      shot: S07
      shotAlt: Il modulo della spesa con un importo in yen inserito
    - title: Guarda un saldo per ogni valuta
      body: I saldi sono tenuti separati per valuta, e ognuno ha la sua breve lista di pagamenti suggeriti. Le sterline si saldano in sterline e gli yen in yen.
      shot: S10
      shotAlt: La schermata dei saldi con i debiti semplificati in due valute
    - title: Oppure converti, quando il gruppo preferisce saldare una volta sola
      body: Scegli un'altra valuta mentre inserisci la spesa e Side Badger può convertirla a un tasso di cambio attuale, che puoi cambiare con quello che hai davvero ottenuto. L'importo convertito si somma al saldo in quella valuta. La conversione è una scelta del gruppo, mai qualcosa che succede alle tue spalle.
options:
  heading: Un tasso che puoi vedere e modificare
  items:
    - title: Il tasso è visibile
      body: Quando converti, il tasso e l'importo convertito compaiono nel modulo, così nessuno deve fidarsi di un numero sulla parola.
    - title: Scrivi il tuo
      body: Hai ottenuto un tasso migliore da uno sportello di cambio, o peggiore in aeroporto? Modifica il tasso con quello che hai davvero ottenuto e l'importo convertito si aggiorna.
    - title: L'originale resta
      body: L'importo originale resta sulla spesa, accanto a quello convertito, per chi chiede quanto fosse in yen.
    - title: Convertire non costa
      body: Convertire non costa nulla. Non c'è nessuna commissione per inserire una spesa in un'altra valuta.
