sections:
  - heading: "Það sem Splitwise gerir vel"
    body: "Ef hópurinn þinn þarf sérstakt app, notkun án nettengingar eða greiðslur inni í appinu er Splitwise skynsamlegt val, og við viljum frekar að þú veljir það en komist að því seinna. Síður þess sjálfs telja upp:"
    items:
      - "**Öpp og notkun án nettengingar.** iPhone- og Android-öpp auk vefsins, og ónettengd stilling."
      - "**Fleiri leiðir til að skipta.** Skipting eftir hlutföllum, leiðréttingar og skipting eftir liðum, auk þess að skipta jafnt, nákvæmt og í prósentum."
      - "**Endurtekin útgjöld.** Láttu leiguna endurtaka sig og gleymdu henni."
      - "**Greiðslur í appinu.** Í sumum löndum getur það líka flutt peningana, í gegnum Splitwise Pay, Venmo, PayPal eða Pay by Bank."
  - heading: "Ókeypis hér, greitt þar"
    body: "Splitwise Pro er greidd áskriftarleið Splitwise og Pro-síða þess sjálfs selur fjögur atriði sem kosta ekkert í Side Badger."
    items:
      - "**Kvittanaskönnun.** Splitwise Pro skannar mynd af kvittuninni þinni. Side Badger gerir það ókeypis, án skönnunarinneigna: það fyllir út heildarupphæð, dagsetningu og stað fyrir þig til að yfirfara. Myndir af kvittunum eru lesnar af gervigreindarþjónustu Google."
      - "**Gjaldmiðlaumreikningur.** Splitwise Pro umreiknar útgjöld hóps í sjálfgefinn gjaldmiðil þinn þegar þú ýtir á „Convert“. Side Badger umreiknar hvert útgjald um leið og þú skráir það, á núverandi gengi eða því sem þú fékkst í raun, og upphaflega upphæðin helst á útgjaldinu."
      - "**Engar auglýsingar.** Splitwise telur algjörlega auglýsingalausa upplifun upp sem Pro-eiginleika. Side Badger er án auglýsinga."
      - "**Engin dagleg takmörk.** Splitwise Pro selur ótakmörkuð útgjöld og hjálparmiðstöð þess segir að ókeypis notendur geti bætt við allt að 4 útgjöldum á dag. Side Badger hefur engin dagleg takmörk."
  - heading: "Það sem Splitwise hefur en Side Badger ekki"
    body: "Þetta eru ekki allir eiginleikar Splitwise, aðeins þeir sem hafa tilhneigingu til að ráða úrslitum. Síður Splitwise sjálfs hafa allan listann. Hér er það sem Side Badger vantar."
    items:
      - "**Sérstök öpp.** Side Badger virkar í vafranum þínum. Skráðu þig inn og bættu því svo við heimaskjáinn og það opnast eins og app."
      - "**Notkun án nettengingar.** Side Badger þarf nettengingu."
      - "**Greiðslur í appinu.** Side Badger snertir aldrei peningana þína. Borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna."
      - "**Endurtekin útgjöld.** Side Badger hefur þau ekki. Afritaðu leigu síðasta mánaðar í stað þess að slá hana inn aftur."
      - "**Skipting eftir hlutföllum eða liðum.** Side Badger hefur einn greiðanda fyrir hvert útgjald, skipt jafnt, eftir nákvæmum upphæðum eða í prósentum. Kvittanaskönnunin úthlutar ekki liðum á fólk."
      - "**Línurit og sjálfgefin skipting.** Splitwise Pro hefur hvort tveggja. Side Badger heldur utan um hver skuldar hverjum og það er allt galdraverkið."
  - heading: "Að flytja hópinn yfir"
    body: "Það er ekkert innflutningsverkfæri, svo flutningur þýðir nýtt upphaf. Gerðu fyrst upp í Splitwise, búðu svo til hóp í Side Badger og bjóddu öllum með tengli eða QR-kóða. Allir í hópnum þurfa ókeypis aðgang og allt sem þarf til að skrá sig er netfang."
