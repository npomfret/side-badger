    - label: Energie
      payer: kwame
      amount: 120
      split:
        method: equal
    - label: Internetanschluss
      payer: lena
      amount: 40
      split:
        method: equal
    - label: Lebensmittel
      payer: matt
      amount: 80
      split:
        method: equal
featuresHeading: Die Funktionen, die ein Haus nutzt
faq:
  heading: Fragen
  items:
    - q: Kann sich die Miete automatisch wiederholen?
      a: Nein, es gibt keine wiederkehrenden Rechnungen. Kopiere die Miete vom letzten Monat in ein paar Fingertipps, ändere das Datum, und du bist fertig.
    - q: Können wir nach Zimmergröße teilen?
      a: Ja, in Prozent. Gib jeder Person einen Anteil, der ihr Zimmer widerspiegelt, solange die Anteile zusammen 100 ergeben. [Ausgaben teilen](page:feature/split-expenses) behandelt die anderen Arten zu teilen.
    - q: Was, wenn jemand auszieht und noch Schulden hat?
      a: Er kann die Gruppe erst verlassen, wenn abgerechnet ist, denn niemand kann gehen, solange er Geld schuldet oder bekommt. Die Zahlen bleiben ehrlich, bis alle quitt sind.
    - q: Bezahlt Side Badger die Rechnungen?
      a: Nein. Es führt die Rechnung und schlägt eine kurze Liste von Zahlungen vor. Ihr zahlt einander, wie ihr wollt, und erfasst es dann, wie [Abrechnen](page:feature/settle-up) erklärt.
    - q: Kann eine Person die Bücher führen?
      a: Ja. Mach sie zum Admin und nutze eine verwaltete Gruppe, in der neue Mitglieder eine Freigabe brauchen und nur Ersteller und Admins Ausgaben ändern dürfen.
