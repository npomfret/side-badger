sections:
  - heading: "Parler argent, à côté de l'argent"
    body: "L'argent partagé s'accompagne de bavardages, de doutes et de projets. Side Badger garde les trois à côté des chiffres, pour que personne n'ait à remonter toute la conversation de groupe."
    items:
      - "**Des commentaires au bon endroit.** Commentez le groupe lui-même, ou n'importe quelle dépense, liste ou sondage, et gardez la discussion à côté de ce dont elle parle."
      - "**Des reçus et des photos.** Gardez jusqu'à trois reçus sur chaque dépense, et ajoutez des photos ou des PDF aux commentaires du groupe, d'une liste ou d'un sondage."
      - "**Des questions, pas des disputes.** Un administrateur peut activer les questions, et toute personne concernée par une dépense peut alors la questionner. Elle reste hors des soldes tant que ce n'est pas réglé."
      - "**Des listes et des sondages.** Gardez la liste de courses partagée à côté des factures de courses, et soumettez la présélection de villas au vote, de façon anonyme si vous voulez."
      - "**Un petit applaudissement.** Réagissez aux dépenses, aux paiements et aux commentaires, et fêtez un paiement quand il arrive."
  - heading: "Votre groupe, vos règles"
    body: "Le centre d'aide de Splitwise indique qu'il ne gère ni administrateurs de groupe ni autorisations spéciales. Side Badger propose des rôles et des autorisations, pour les groupes qui ont besoin de quelqu'un pour tenir les comptes au propre."
    items:
      - "**Administrateurs, membres et spectateurs.** Faites de quelqu'un un spectateur : il voit tout et ne change rien."
      - "**Deux préréglages, ou le vôtre.** Partez de Collaboration ouverte ou de Groupe géré, ou réglez chaque autorisation vous-même : qui modifie et supprime les dépenses, modifie les listes, invite et laisse entrer de nouvelles personnes."
      - "**Approbation pour rejoindre.** Activez l'approbation et un administrateur fait entrer chaque personne."
      - "**Les réglages du groupe.** Limitez-le aux devises que vous utilisez vraiment, choisissez sa devise par défaut et donnez-lui une image d'en-tête."
      - "**Verrouillez-le quand c'est fini.** Les chiffres ne bougent plus tant qu'un administrateur ne le déverrouille pas."
  - heading: "Gratuit ici, payant là-bas"
    body: "Splitwise Pro est l'offre payante de Splitwise, et sa propre page Pro vend trois choses qui ne coûtent rien dans Side Badger."
    items:
      - "**Scan de reçus.** Splitwise Pro scanne une photo de votre reçu. Side Badger le fait gratuitement, sans crédits de scan : il remplit le total, la date et le lieu pour que vous les vérifiiez."
      - "**Conversion de devises.** Splitwise Pro convertit les dépenses d'un groupe dans votre devise par défaut quand vous touchez Convertir. Side Badger convertit chaque dépense à la saisie, à un taux de change actuel ou à celui que vous avez réellement obtenu, et le montant d'origine reste sur la dépense."
      - "**Pas de limite quotidienne.** Splitwise Pro vend des dépenses illimitées, et son centre d'aide indique que les utilisateurs gratuits peuvent ajouter jusqu'à 4 dépenses par jour. Side Badger n'a pas de limite quotidienne."
  - heading: "Votre banque reste en dehors"
    body: "Side Badger ne se connecte pas à votre banque et ne demande pas vos coordonnées bancaires. Il tient le registre de qui doit quoi à qui ; vous vous remboursez comme vous voulez, puis vous enregistrez le paiement. Aucun accès bancaire à confier, donc une chose de moins à protéger."
  - heading: "Une seule appli, dans votre navigateur et sur votre téléphone"
    body: "Side Badger fonctionne dans votre navigateur. Connectez-vous, ajoutez-le à votre écran d'accueil et il s'ouvre comme une appli. C'est la même appli dans les deux cas, donc une nouveauté est sur votre téléphone dès la prochaine ouverture, sans mise à jour de boutique d'applications à attendre."
  - heading: "Et quelques tours de magie"
    items:
      - "**Demandez à votre assistant.** Side Badger fonctionne avec ChatGPT et Claude : demandez au vôtre d'ajouter une dépense, de scanner un reçu ou d'enregistrer un paiement."
      - "**Chacun dans sa langue.** Side Badger parle 39 langues et chacun choisit la sienne. La page d'accueil de Splitwise en annonce plus de 7. Il gère aussi 133 devises, pour le voyage qui va partout."
      - "**De l'aide sans quitter l'appli.** Un blocage, ou un bug ? Dites-le-nous depuis l'appli et lisez notre réponse sur place."
  - heading: "Là où Splitwise gagne encore"
    body: "Nous préférons que vous choisissiez la bonne appli plutôt que de le découvrir plus tard. Si votre groupe a besoin de l'un de ces points, Splitwise l'a et Side Badger non."
    items:
      - "**Les applis des boutiques d'applications.** Side Badger vit dans votre navigateur et sur votre écran d'accueil, pas dans les boutiques d'applications."
      - "**Un mode hors connexion.** Side Badger a besoin d'une connexion."
      - "**Des paiements dans l'appli.** Dans certains pays, Splitwise peut aussi faire circuler l'argent. Side Badger se contente de tenir le registre."
      - "**Le partage par parts ou par article.** Side Badger a un seul payeur par dépense, partagée à parts égales, par montants exacts ou par pourcentage. Son scan de reçus n'attribue pas les articles aux personnes."
      - "**Des graphiques et des partages par défaut.** Splitwise Pro a les deux. Side Badger tient le compte de qui doit quoi à qui, et c'est tout le tour de magie."
  - heading: "Déplacer votre groupe"
    body: "Il n'y a pas d'outil d'import, donc changer, c'est repartir de zéro. Réglez d'abord les comptes dans Splitwise, puis créez un groupe dans Side Badger et invitez tout le monde avec un lien ou un code QR. Chaque membre du groupe a besoin d'un compte gratuit, et il suffit d'une adresse e-mail pour s'inscrire."
