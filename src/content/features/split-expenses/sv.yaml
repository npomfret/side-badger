sections:
  - heading: Bara de som var med
    body: Dela en kostnad mellan alla, eller bara mellan de som delade på den. Lämna folk utanför de kostnader de inte var med på, så speglar saldona det. Rumskamraten som var borta hela veckan är inte skyldig för takeawayn, vilket [rumskamrater](page:use-case/housemates) känner igen som grundläggande rättvisa.
  - heading: Detaljerna som sparar gräl senare
    items:
      - Ange **datum** och en valfri tid. Genvägar som i dag, i går, i morse och i går kväll sparar lite skrivande.
      - Lägg till upp till tre **etiketter** för att gruppera utgifter, till exempel matinköp eller resa.
      - Lägg till **platsen**. Klistra in en kartlänk så fylls platsnamnet i av sig självt.
      - Lägg till en **anteckning** med historien bakom siffran, med lite formatering om historien kräver det.
      - "Bifoga upp till tre **kvitton** som bilder eller PDF, så att beviset stannar kvar vid utgiften."
      - Använd **kommentarerna** för att hålla samtalet bredvid den utgift det gäller, i stället för i en chatt som ingen scrollar tillbaka i.
  - heading: Kopiera, redigera och se vad som ändrats
    body: Kopiera förra månadens hyra i stället för att skriva in den igen, och ändra det som skiljer sig. Om en siffra var fel redigerar du utgiften. Den tidigare versionen sparas och ändringen syns i gruppens aktivitet, så ingen ändrar en siffra i smyg. Vad var och en får redigera beror på gruppens behörigheter.
  - heading: När något ser fel ut
    body: En grupp kan slå på utgiftsfrågor. Alla som ingår i en utgift kan ställa en fråga och förklara varför, och utgiften hålls utanför saldona tills den som frågade, eller en administratör, avslutar frågan. Funktionen är avstängd som standard och en administratör slår på den för gruppen. Den passar [event och firanden](page:use-case/events-and-celebrations), där depositionen som ingen minns plötsligt blir allas angelägenhet.
limits:
  heading: Gränser
  items:
    - En person betalar för varje utgift. Om två personer betalade registrerar du två utgifter.
    - Det finns ingen delning per artikel och ingen delning efter andelar. Lika, exakta belopp och procent är vad som finns.
    - Procenten måste bli 100 tillsammans.
    - En utgift kan vara upp till 999 999,99 i sin egen valuta, med den valutans vanliga antal decimaler.
    - Utgifter kan inte upprepas av sig själva. Kopiera förra månadens i stället.
    - Datum får inte ligga i framtiden eller mer än 10 år tillbaka.
    - En utgift som rör någon som har lämnat gruppen blir skrivskyddad.
useCasesHeading: Där en sådan delning hjälper
faq:
  heading: Frågor
  items:
    - q: Kan två personer betala för en utgift?
      a: Inte i en utgift. Registrera två, en för varje betalare, så blir saldona desamma.
    - q: Kan jag dela ett kvitto per artikel?
      a: Nej. En delning är lika, efter exakta belopp eller i procent. För en räkning med olika artiklar anger du vad var och en är skyldig som exakta belopp.
    - q: Kan jag ställa in en standarddelning?
      a: Nej. Kopiera en tidigare utgift för att återanvända dess delning, och ändra det som skiljer sig.
    - q: Kan räkningar upprepas varje månad?
      a: Nej. Kopiera förra månadens utgift i stället, vilket tar några sekunder.
    - q: Vem kan redigera en utgift?
      a: De som gruppens behörigheter tillåter. Varje redigering syns i gruppens aktivitet, så ändringar sker aldrig i tysthet.
    - q: Vad händer med saldona efteråt?
      a: De uppdateras när utgifter kommer in, och [göra upp](page:feature/settle-up) gör om dem till en kort lista med betalningar. Om en utgift är i en annan valuta, se [flera valutor](page:feature/multiple-currencies).
