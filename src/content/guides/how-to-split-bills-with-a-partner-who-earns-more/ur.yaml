meta:
  title: "زیادہ کمانے والے ساتھی کے ساتھ بل کیسے بانٹیں | Side Badger"
  description: "جب ایک کی آمدنی بہت زیادہ ہو تو آدھا آدھا بانٹنا کھٹکتا ہے۔ مشترکہ بل آمدنی کے حساب سے بانٹیں، دو لوگوں کا حساب دیکھیں، اسپریڈ شیٹ کے بغیر۔"
h1: "زیادہ کمانے والے ساتھی کے ساتھ بل کیسے بانٹیں"
navLabel: "زیادہ کمانے والا ساتھی"
lead: "اپنی ہاتھ میں آنے والی تنخواہیں جمع کریں، کل میں ہر شخص کا حصہ نکالیں اور مکمل فیصد میں گول کریں۔ مایا کے ہاتھ میں £2,800 آتے ہیں اور جون کے £1,700، اس لیے وہ مشترکہ بل 62/38 میں بانٹتے ہیں۔ یہی فیصد Side Badger میں مشترکہ خرچے پر درج کریں، پھر جب بھی وہی بل آئے اسے کاپی کریں۔"
cta:
  heading: "حساب ایک بار لگائیں"
  body: "مفت اکاؤنٹ بنائیں، آپ دونوں کے لیے گروپ بنائیں اور کرایہ اپنے فیصد کے ساتھ درج کریں۔ اگلے مہینے کا کرایہ ایک کاپی ہے۔ پہلے سیر کرنا چاہتے ہیں؟ [یہ کیسے کام کرتا ہے](page:how-it-works) یا [مفت میں کیا شامل ہے](page:pricing) دیکھیں۔"
sections:
  - heading: "دو تنخواہیں، ایک فلیٹ، ایک شائستہ خاموشی"
    body: "مایا اور جون ساتھ رہتے ہیں۔ مایا کے ہاتھ میں ہر مہینے £2,800 آتے ہیں اور جون کے £1,700۔ دو سال تک وہ ہر چیز 50/50 بانٹتے رہے، کیونکہ یہ سادہ تھا اور کوئی بھی بات چھیڑنے والا نہیں بننا چاہتا تھا۔ پھر جون نے صرف کرائے کو دیکھا۔ £1,400 کا آدھا £700 ہے، جو مایا کی تنخواہ کا چوتھائی ہے اور اس کی اپنی تنخواہ کا 41%۔ کسی نے ناانصافی نہیں کی تھی۔ کسی نے حساب ہی نہیں لگایا تھا۔ بہت سے [جوڑے](page:use-case/couples) آخرکار یہاں پہنچتے ہیں۔ ٹیک اوے کھاتے ہوئے انہوں نے طے کیا کہ مشترکہ بل دونوں کی تنخواہ سے ملتا جلتا حصہ لیں۔"
  - heading: "طریقہ، حساب کے ساتھ"
    body: "چار مراحل، ایک کیلکولیٹر اور ایک بات چیت جو آپ نے ویسے بھی کرنی تھی۔"
    items:
      - "**طے کریں کہ تنخواہ کیا شمار ہو گی۔** مایا اور جون ہاتھ میں آنے والی تنخواہ لیتے ہیں، یعنی ہر مہینے بینک میں آنے والی رقم۔ دونوں کی مل کر £2,800 + £1,700 = £4,500 ہے۔"
      - "**ہر ایک کا حصہ نکالیں۔** مایا کا 2,800 ÷ 4,500 ہے، یعنی 62.2%۔ جون کا 1,700 ÷ 4,500 ہے، یعنی 37.8%۔"
      - "**مکمل فیصد میں گول کریں۔** 62.2% کا 62 اور 37.8% کا 38 ہو جاتا ہے۔ دو لوگوں کے ساتھ ایک عدد گول کریں اور اسے 100 سے گھٹا کر دوسرا نکالیں، تو مجموعہ ہمیشہ 100 رہتا ہے۔"
      - "**دیکھیں اس کا مطلب کیا ہے۔** £1,400 کے کرائے پر مایا £868 (62%) دیتی ہے اور جون £532 (38%)۔ یہ ہر ایک کی ہاتھ میں آنے والی تنخواہ کا تقریباً 31% ہے۔ آدھا آدھا بانٹنے میں مایا کی تنخواہ کا 25% اور جون کی تنخواہ کا 41% جاتا۔"
  - heading: "مہینہ پڑھنا"
    body: "مایا نے £1,400 کا کرایہ دیا اور جون نے باقی £216۔ مایا کا مہینے کا حصہ £868.00 + £111.60 + £18.00 = £997.60 ہے، اور اس نے £1,400 ادا کیے، اس لیے اسے £402.40 ملنے ہیں۔ جون کا حصہ £532.00 + £68.40 + £18.00 = £618.40 ہے، اور اس نے £216 ادا کیے، اس لیے اسے £402.40 دینے ہیں۔ Side Badger ایک ادائیگی تجویز کرتا ہے، جون سے مایا کو، £402.40 کی، اور [حساب برابر کرنا](page:feature/settle-up) اسے ادا ہونے کے بعد ریکارڈ کرتا ہے۔ اگر یہی مہینہ 50/50 بانٹا جاتا تو جون کو مایا کو £592.00 دینے پڑتے۔"
  - heading: "Side Badger میں ترتیب دیں"
    body: "دس منٹ، جن کا بیشتر حصہ فیصد پر گزرتا ہے۔"
    items:
      - "**گروپ بنائیں۔** ڈیش بورڈ پر **گروپ بنائیں** چنیں اور اس کا نام فلیٹ کے نام پر رکھیں۔ **دوسروں کو مدعو کریں** چنیں اور جون کو لنک یا QR کوڈ بھیجیں۔ وہ سائن ان کرتا ہے یا مفت اکاؤنٹ بناتا ہے، اور وہ نام چنتا ہے جو وہ اس گروپ میں دکھانا چاہتا ہے۔ گروپ صرف ارکان دیکھ سکتے ہیں، اس لیے یہ صرف آپ دونوں کا ہے۔"
      - "**کرایہ شامل کریں۔** **خرچہ شامل کریں** چنیں۔ تفصیل اور رقم درج کریں، اور **کس نے ادائیگی کی؟** کے تحت مایا کو چنیں۔ **کے درمیان تقسیم کریں** کے تحت دونوں لوگ رہنے دیں، پھر **کیسے تقسیم کریں** کے تحت **فیصد** چنیں اور 62 اور 38 ٹائپ کریں۔ اگر فیصد کا مجموعہ 100 نہ ہو تو فارم نشاندہی کر دیتا ہے۔ **خرچہ محفوظ کریں** چنیں۔"
      - "**باقی بل شامل کریں۔** بجلی گیس اور براڈ بینڈ اسی طرح جاتے ہیں، جون ادا کنندہ کے طور پر اور وہی 62 اور 38 کے ساتھ۔ ٹیک اوے اپنا الگ خرچہ ہے، جس میں **کیسے تقسیم کریں** **برابر** پر رہتا ہے۔"
      - "**اگلے مہینے کاپی کریں۔** پچھلے مہینے کا کرایہ کھولیں اور **خرچہ کاپی کریں** چنیں۔ کاپی میں ادا کنندہ، رقم اور تقسیم وہی رہتی ہے اور تاریخ آج کی ہو جاتی ہے۔ اگر کرایہ بدلا ہو تو رقم بدلیں، پھر **کاپی بنائیں** چنیں۔ بجلی گیس کا بل بھی اسی طرح چلتا ہے۔"
      - "**دیکھیں کس کو کس کا دینا ہے۔** **بیلنسز** کا حصہ یہ دکھاتا ہے اور ادائیگیوں کی مختصر فہرست تجویز کرتا ہے۔ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ادائیگی **تصفیہ کریں** کے تحت ریکارڈ کریں۔"
  - heading: "50/50، آمدنی کے حساب سے، یا بل بہ بل"
    body: "کوئی درست جواب نہیں ہے، صرف وہ جس کے ساتھ آپ دونوں رہ سکیں۔ تین عام طریقے۔"
    items:
      - "**ہر چیز آدھی آدھی۔** سب سے آسان رکھنا، اور ان جوڑوں کے لیے موزوں جن کی تنخواہیں قریب ہیں۔"
      - "**ہر مشترکہ چیز آمدنی کے حساب سے۔** مایا اور جون یہی کرتے ہیں۔ ایک بات چیت، فیصد کی ایک جوڑی۔"
      - "**بل بہ بل۔** کرایہ اور بل آمدنی کے حساب سے، چھٹیاں اور شوق 50/50 یا جو بھی آپ طے کریں، اور ہر بل کو وہ اصول ملتا ہے جو اس کے مطابق ہو۔"
  - heading: "طے کریں کہ مشترکہ کیا ہے"
    body: "بحثیں عموماً فہرست پر ہوتی ہیں، فیصد پر نہیں۔ کرایہ، بجلی گیس، براڈ بینڈ، ہفتے بھر کی خریداری اور صوفہ زیادہ تر گھروں میں مشترکہ شمار ہوتے ہیں۔ مایا کی جم کی رکنیت اور جون کی فٹبال کی سبسکرپشن شاید نہیں۔ فہرست ایک بار طے کریں، لکھ لیں اور گروپ میں صرف مشترکہ اخراجات ڈالیں۔"
  - heading: "ٹیک اوے جان بوجھ کر 50/50 رہتا ہے"
    body: "یہ چھوٹے اور اختیاری خرچے ہیں، اور ڈمپلنگ منگوانے کے لیے کسی کو کیلکولیٹر نہیں چاہیے۔ Side Badger میں ٹیک اوے بس ایک اور خرچہ ہے۔ جون £36 ادا کرتا ہے، **کیسے تقسیم کریں** **برابر** پر رہتا ہے اور ہر ایک کے ذمے £18 آتے ہیں۔"
  - heading: "جب کسی کی تنخواہ بدلے"
    body: "اضافہ، نئی نوکری یا کام سے چھٹی حساب بدل دیتی ہے۔ نئے فیصد اسی طرح نکالیں اور اگلے خرچے سے انہیں استعمال کریں۔ پچھلے اخراجات جیسے تھے ویسے ہی رہتے ہیں۔ پچھلے مہینے کا کرایہ کاپی کریں، فیصد بدلیں، پھر **کاپی بنائیں** چنیں۔ جو پہلے سے درج ہے اسے درست کرنے کے لیے، اگر گروپ کی اجازتیں دیں تو اسے ایڈٹ کریں، اور پہلے اپنے ساتھی کو بتا دیں، کیونکہ بیلنس بدل جاتے ہیں۔ پچھلا ورژن محفوظ رہتا ہے۔ طے کریں کہ دوبارہ حساب کب لگائیں گے، جیسے سال میں ایک بار، اور بدلنے سے پہلے حساب برابر کر لیں تاکہ پرانی تقسیم صاف گنتی کے ساتھ بند ہو۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ کبھی نہیں پوچھتا کہ کوئی کیا کماتا ہے اور فیصد خود نہیں نکالتا۔ آپ وہ اعداد ٹائپ کرتے ہیں جو آپ نے طے کیے۔"
      - "یہ پورے گروپ کے لیے ڈیفالٹ تقسیم طے نہیں کر سکتا۔ فیصد ہر خرچے پر جاتے ہیں، اس لیے ایسا خرچہ کاپی کریں جس میں پہلے سے ہوں۔"
      - "اس میں بار بار آنے والے بل نہیں ہیں، اس لیے آپ ہر بار پچھلے مہینے کا کرایہ کاپی کرتے ہیں۔"
      - "یہ کبھی رقم نہیں منتقل کرتا۔ آپ ایک دوسرے کو جیسے چاہیں ادا کرتے ہیں اور اسے ریکارڈ کرتے ہیں۔"
