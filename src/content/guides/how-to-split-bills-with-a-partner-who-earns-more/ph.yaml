faq:
  heading: "Mga tanong"
  items:
    - q: "Gross o take-home pay ba ang gagamitin namin?"
      a: "Kayo ang magpapasya. Karaniwan ang take-home, dahil iyon ang perang talagang magagastos ninyo. Hindi isinasaalang-alang ng gross pay na magkaiba ang kinukuha ng buwis, kontribusyon sa pension, at bayad sa utang sa magkakaibang sahod. Alinman ang piliin ninyo, gamitin ang parehong panukat para sa inyong dalawa."
    - q: "Nakikita ba ng Side Badger ang kita namin?"
      a: "Hindi. Porsyento lang ang inilalagay mo, hindi kailanman ang sahod. Nakikita ng mga miyembro ng grupo ang mga porsyento, at sa magkapareha, kayong dalawa iyon."
    - q: "Puwede bang itakda nang isang beses ang 62/38 para sa lahat?"
      a: "Itinatakda ang hati kada gastos, hindi kada grupo. Kopyahin ang gastos na may 62 at 38 na, saka baguhin ang magkaiba. Tinatalakay ng [paghahati ng gastos](page:feature/split-expenses) ang iba pang opsyon."
