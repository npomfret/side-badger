meta:
  title: "వేర్వేరు రాత్రులు ఉండేవాళ్లతో విల్లా ఖర్చు పంచండి | Side Badger"
  description: "Dev మూడు రాత్రులే వచ్చాడు, ఆరింటికి ఎందుకు చెల్లించాలి? హాలిడే విల్లాను నిజంగా ఉన్న రాత్రుల ప్రకారం పంచండి, లెక్కలు చేసి చూపిస్తాం."
h1: "వేర్వేరు రాత్రులు ఉండేవాళ్లతో హాలిడే విల్లా ఖర్చును ఎలా పంచాలి"
navLabel: "రాత్రుల ప్రకారం విల్లా"
lead: "ఒక్కొక్కరికి ఒక్క రాత్రికి ధర లెక్క వేసి, ప్రతి ఒక్కరి రాత్రులతో గుణించి, విల్లాను **కచ్చితమైన మొత్తాలతో ఒకే ఖర్చు**గా నమోదు చేయండి. Side Badger లెక్క ఉంచుతుంది, తేల్చుకునే సమయం వచ్చినప్పుడు పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది."
cta:
  heading: విల్లాకు ఒకే చక్కని ఖర్చు ఇవ్వండి
  body: "గ్రూప్ చేయండి, అందరినీ లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి, విల్లాను కచ్చితమైన మొత్తాలతో నమోదు చేయండి. మీరు హాలిడేను ఆస్వాదిస్తుండగా Side Badger నడుస్తున్న లెక్కను ఉంచుతుంది."
sections:
  - heading: "ఆరు రాత్రులు, నలుగురు, ఒక క్రెడిట్ కార్డ్"
    body: "[గ్రూప్ ట్రిప్](page:use-case/group-trips) సాధారణంగా ఒకరి కార్డుతో మొదలవుతుంది. ఇక్కడ అది Ana ది. ఎవరో ఒకరు ముందు వెళ్లాలి కదా, అందుకే ఆమె ఆరు రాత్రులకు €2,100తో విల్లా బుక్ చేస్తుంది. Ana, Ben, Chloe ఆరు రాత్రులూ ఉంటారు. Dev చివరి మూడు రాత్రులకే రాగలడు, రైలులో వస్తాడు. Ben కారు అద్దెకు తీసుకుంటాడు, అందులో Dev ఎప్పుడూ కూర్చోడు. Dev పెద్ద సరుకుల షాపింగ్ చేస్తాడు. విల్లాను నలుగురికి సమానంగా పంచడం తేలికైన దారి. కానీ అప్పుడు Dev తన ఇంట్లో గడిపిన మూడు రాత్రులకూ కూడా చెల్లిస్తున్నట్టు అవుతుంది, ఇలాంటివి క్రిస్మస్ సమయంలో మళ్లీ తెరపైకి వస్తాయి. రాత్రుల ప్రకారం పంచితే వాదన తప్పుతుంది, లెక్కకు ఒక నిమిషం చాలు."
  - heading: "ఒక వ్యక్తి-రాత్రి ధర లెక్క వేయండి"
    body: "వ్యక్తి-రాత్రి అంటే ఒక వ్యక్తి ఒక రాత్రి ఉండటం. విల్లా ధర ఎంతో అంతే, కాబట్టి ఆ ధరను మొత్తం వ్యక్తి-రాత్రులపై పంచి, ప్రతి ఒక్కరికి వాళ్లు వాడినవి ఇవ్వండి."
    items:
      - "**వ్యక్తి-రాత్రులను లెక్కించండి.** Ana, Ben, Chloe ఒక్కొక్కరు ఆరు రాత్రులు, Dev మూడు: 6 + 6 + 6 + 3 = 21."
      - "**ఒక్కదాని ధర లెక్క వేయండి.** €2,100 ÷ 21 = ఒక వ్యక్తి-రాత్రికి €100."
      - "**ప్రతి ఒక్కరి రాత్రులతో గుణించండి.** Ana, Ben, Chloe ఒక్కొక్కరు 6 × €100 = €600 చెల్లిస్తారు. Dev 3 × €100 = €300 చెల్లిస్తాడు."
      - "**మొత్తాన్ని సరిచూడండి.** €600 + €600 + €600 + €300 = €2,100. మీ వాటాల మొత్తం ధరతో సరిపోకపోతే, ఒక రాత్రి మిస్ అయింది లేదా రెండుసార్లు లెక్కించారు."
  - heading: "Side Badgerలో నమోదు చేయండి"
    body: "గ్రూప్ చేసి, మిగతా ముగ్గురినీ లింక్ లేదా QR కోడ్‌తో ఆహ్వానించి, ఖర్చులు జోడించండి. ముందు విల్లా."
    items:
      - "**ఖర్చును జోడించు** ఎంచుకోండి. వివరణ రాసి, 2,100 నింపి, **ఎవరు చెల్లించారు?**ను Anaకు సెట్ చేయండి."
      - "**ఎవరి మధ్య విభజించాలి** కింద నలుగురూ ఉన్నారో చూసుకోండి."
      - "**ఎలా విభజించాలి** కింద **కచ్చితమైన మొత్తాలు** ఎంచుకోండి. Ana, Ben, Chloeకు 600, Devకు 300 టైప్ చేయండి. మొత్తాలు కలిపితే మొత్తం అవ్వాలి."
      - "**ఖర్చును సేవ్ చేయి** ఎంచుకోండి."
      - "కారు అద్దెను అదే విధంగా జోడించండి. Ben చెల్లించాడు, పంపకం **సమానం**, Dev రైలులో వచ్చాడు కాబట్టి అతన్ని వదిలేయండి. ఖర్చును పంచే ఇతర మార్గాలను [ఖర్చుల పంపకం](page:feature/split-expenses) వివరిస్తుంది."
      - "సరుకులను జోడించండి. Dev చెల్లించాడు, పంపకం **సమానం**, నలుగురూ ఉన్నారు."
  - heading: "ఫలితం చదివి, లెక్క తేల్చుకోండి"
    body: "ప్రతి ఒక్కరి బిల్లు అంటే వాళ్ల విల్లా వాటా, దానికి కారు, సరుకుల్లో వాళ్ల వాటా కలిపినది. Ana, Ben, Chloe ఒక్కొక్కరికి €725 అవుతుంది, అంటే €600 + €80 + €45. Devకు €345, అంటే €300 + €45. ప్రతి ఒక్కరు చెల్లించినదాన్ని తీసేస్తే బ్యాలెన్స్‌లు బయటకు వస్తాయి. Ana €2,100 చెల్లించింది, కాబట్టి ఆమెకు €1,375 రావాలి. Ben €240 చెల్లించాడు, €485 ఇవ్వాలి. Dev €180 చెల్లించాడు, €165 ఇవ్వాలి. Chloe ఏమీ చెల్లించలేదు, €725 ఇవ్వాలి. అలాగే వదిలేస్తే ఆ బాకీలు గ్రూప్‌లో ఆరు వైపులా తిరుగుతాయి. బదులుగా Side Badger మూడు పేమెంట్లను సూచిస్తుంది, అన్నీ Anaకే. మీకు నచ్చిన విధంగా ఆమెకు చెల్లించి, **సెటిల్ చేయి** ఎంచుకుని, ప్రతి పేమెంట్‌కు **సెటిల్మెంట్‌ను నమోదు చేయి** వాడండి, అప్పుడు బ్యాలెన్స్‌లు సరిపోతాయి. త్వరిత సెటిల్ బటన్లు మొత్తాన్ని నింపుతాయి. [లెక్క తేల్చడం](page:feature/settle-up) గురించి మరింత ఉంది."
  - heading: "విల్లా ఒకే చక్కని ధర కానప్పుడు"
    items:
      - "**గదులు వేర్వేరుగా ఉంటే.** సూట్ విలువ బాక్స్ రూమ్ కంటే ఎక్కువైతే, ముందు ప్రతి గదికి ఎంతో ఒప్పుకుని, తర్వాత వ్యక్తి-రాత్రి లెక్కలను గది గదికి వేయండి. విల్లాను అందరి మొత్తాలతో ఒకే ఖర్చుగా, లేదా గదికి ఒక ఖర్చుగా నమోదు చేయండి. ఎలా చేసినా, ఒక ఖర్చులోని కచ్చితమైన మొత్తాలు దాని మొత్తానికి సమానం కావాలి."
      - "**నెలల ముందే చెల్లించిన డిపాజిట్.** అది చెల్లించినవారికి సొంత ఖర్చు ఉంటుంది, వాళ్లు చెల్లించిన రోజు తేదీతో. బ్యాలెన్స్‌కు వేసిన నిష్పత్తిలోనే రాత్రుల ప్రకారం దాన్నీ పంచండి."
      - "**బుకింగ్ వేరే కరెన్సీలో ఉంటే.** విల్లాను మీరు చెల్లించిన కరెన్సీలో నమోదు చేయండి. గ్రూప్ ఎప్పటికప్పుడు మారిస్తే, ప్రస్తుత ఎక్స్ఛేంజ్ రేటు వాడండి, లేదా మీకు నిజంగా వచ్చిన రేటును టైప్ చేయండి. అసలు మొత్తం ఖర్చుతోనే ఉంటుంది. వివరాలు [అనేక కరెన్సీలు](page:feature/multiple-currencies)లో ఉన్నాయి."
      - "**ఆ రాత్రిలో కొంత భాగమే ఉంటే.** ఒకరు అర్ధరాత్రి వస్తారు, ఒకరు అల్పాహారానికి ముందే వెళ్తారు. రాత్రులను లెక్కించడానికి ఒకే నియమం ఒప్పుకుని అందరికీ అదే వాడండి."
  - heading: "ఇక్కడ Side Badger చేయనివి"
    items:
      - "ఇది మీ కోసం రాత్రులను లెక్కించదు. రాత్రుల ప్రకారం లేదా వాటాల ప్రకారం పంపకం లేదు, కాబట్టి పైన చూపినట్టు ప్రతి మొత్తాన్ని మీరే లెక్క వేసి **కచ్చితమైన మొత్తాలు** నమోదు చేస్తారు."
      - "ఇది డబ్బు కదపదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుని, పేమెంట్‌ను రికార్డ్ చేయండి."
      - "ఒక ఖర్చుకు ఒక చెల్లింపుదారు మాత్రమే. ఇద్దరు కలిసి విల్లాకు చెల్లిస్తే, రెండు ఖర్చులు నమోదు చేయండి."
      - "అతిథి యాక్సెస్ లేదు. Devతో సహా గ్రూప్‌లోని ప్రతి ఒక్కరికీ ఉచిత ఖాతా కావాలి."
exampleAfter: 2
example:
  heading: "విల్లా, కారు, సరుకులు"
  currency: EUR
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: chloe
      name: Chloe
    - id: dev
      name: Dev
  expenses:
    - label: "విల్లాలో ఆరు రాత్రులు"
      payer: ana
      amount: 2100
      split:
        method: exact
        shares:
          ana: 600
          ben: 600
          chloe: 600
          dev: 300
    - label: "కారు అద్దె"
      payer: ben
      amount: 240
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "సరుకులు"
      payer: dev
      amount: 180
      split:
        method: equal
faq:
  heading: "విల్లా ప్రశ్నలు"
  items:
    - q: "ఎవరైనా రద్దు చేసుకుంటే?"
      a: "వాళ్ల రాత్రులను తీసేసి, లెక్కలు మళ్లీ వేసి, కచ్చితమైన మొత్తాలు మళ్లీ ధరతో సరిపోయేలా విల్లా ఖర్చును సవరించండి. ముందటి వెర్షన్ ఉంచబడుతుంది, సవరణ గ్రూప్ కార్యకలాపంలో కనిపిస్తుంది, కాబట్టి ఎవరూ చప్పుడు చేయకుండా అంకె మార్చలేరు. ఎవరు సవరించవచ్చో గ్రూప్ అనుమతులపై ఆధారపడి ఉంటుంది."
    - q: "బుక్ చేసినవాళ్లు తక్కువ చెల్లించాలా?"
      a: "అది గ్రూప్ నిర్ణయించాలి. బుక్ చేయడం ఒక పని, దానికి రాయితీ ఇవ్వాలా అన్నదానిపై గ్రూపులు వేరుగా ఆలోచిస్తాయి. ఏది ఒప్పుకున్నా, కచ్చితమైన మొత్తాల్లో పెట్టండి, ఖర్చుపై నోట్‌లో లేదా దాని పక్కన కామెంట్‌లో రాయండి, అప్పుడు ఒప్పందం ఎవరూ గుర్తుపెట్టుకోనక్కర్లేదు."
    - q: "క్లీనింగ్ ఫీజును వేరేగా పంచవచ్చా?"
      a: "అవును. ఫీజును వేరే ఖర్చుగా నమోదు చేసి, దానికి సొంత పంపకం ఇవ్వండి. మొత్తం ఇంటికి ఒకే ఛార్జ్ అయితే సమానం సరిపోతుంది. ఫీజు కూడా రాత్రుల ప్రకారం వెళ్లాలనుకునే గ్రూప్‌కు కచ్చితమైన మొత్తాలు సరిపోతాయి."
