meta:
  title: "Како прикупити новац за заједнички поклон | Side Badger"
  description: "Сви дају различит износ, а једној картици иде ударац. Направи анкету о буџету, унеси тачне износе и препусти рачуницу Side Badgeru."
h1: "Како прикупити новац за заједнички поклон"
navLabel: "Прикупљање за заједнички поклон"
lead: "Прикупљање за заједнички поклон значи да једна особа авансира новац, а сви остали јој дугују свој прилог. Договорите буџет анкетом, нека купац плати поклон својом картицом, па га унесите као један трошак са [тачним износима](page:feature/split-expenses), по једном износу за сваку особу. Side Badger показује ко купцу шта дугује, а свако шаље свој део како год жели."
cta:
  heading: "Скупљајте прилоге без шешира"
  body: "Направи групу без особе која добија поклон и унеси поклон са тачним износима. Side Badger је бесплатан, без огласа и без дневних ограничења. Желиш прво кратак обилазак? Погледај [како функционише](page:how-it-works) или [шта покрива бесплатан налог](page:pricing)."
sections:
  - heading: "Четворо пријатеља, један грамофон, четири различита износа"
    body: "Беа пуни 30 година и жели грамофон. Прија, Омар, Лена и Сем га купују за њу. Прија налази један за 240 £ и купује га својом картицом, јер неко мора први. Њих четворо не дају једнако. Прија и Омар дају по 60 £, Лена 80 £, а Сем 40 £. Нико не објашњава свој износ и нико не пита. Омар такође купује честитку и папир за умотавање за 12 £. Сви потписују честитку, па се она дели једнако."
  - heading: "Договорите буџет пре него што неко кликне на Купи"
    body: "Анкета о буџету штеди свађу око грамофона од 400 £. У групи изабери **Додај анкету** и питај колико би поклон требало да кошта. Нека опције буду износи, на пример до 150 £, до 200 £ и до 250 £. Укључи **Анонимно гласање**, које сакрива ко је за шта гласао, па нико не мора наглас да брани мањи износ. Подешавања се не могу променити кад стигне први глас, па их прво провери. Анкета се не затвара сама. Кад сви гласају, изабери **Затвори анкету** и појављује се **Победник**. Анкета договара укупан износ. Не одређује ничији удео."
  - heading: "Читање рачуна"
    body: "Поклон се дели на 60 £, 60 £, 80 £ и 40 £, што даје 240 £ са рачуна. Честитка и папир деле се на четворо по 3 £. Пријин рачун је 60 £ + 3 £, дакле 63 £, а она је платила 240 £, па потражује 177 £. Омаров рачун је такође 63 £, али је он платио 12 £, па дугује 51 £. Лена дугује 80 £ + 3 £, што је 83 £, а Сем дугује 40 £ + 3 £, што је 43 £. Те три суме дају Пријиних 177 £. Да се дугови оставе како јесу, кружили би на пет страна кроз групу. Side Badger уместо тога предлаже три уплате, све Прији. [Поравнање](page:feature/settle-up) има детаље."
  - heading: "Унеси то у Side Badger"
    body: "Пријина страна посла траје око пет минута."
    items:
      - "**Оснуј групу.** На контролној табли изабери **Креирај групу**. Изабери **Позови друге** и пошаљи везу или QR код људима који дају прилог, и никоме другом."
      - "**Додај поклон.** Изабери **Додај трошак**, опиши га, унеси 240 и под **Ко је платио?** изабери Прију. Остави сво четворо под **Подели између**, па под **Начин поделе** изабери **Тачни износи** и укуцај 60, 60, 80 и 40. Износи морају давати 240. Приложи потврду поруџбине ако желиш. Изабери **Сачувај трошак**."
      - "**Додај честитку.** Омар сам додаје 12 £, бира себе под **Ко је платио?** и оставља **Начин поделе** на **Једнако**, са сво четворо означених."
      - "**Пребројте, па платите.** Сви проверавају **Стања**, која показују ко коме дугује, и шаљу Прији свој део како год желе. Затим то забележе преко **Поравнај** и **Забележи поравнање**. Брзо поравнање попуњава износ."
  - heading: "Прво купи или прво скупи"
    body: "Side Badger не држи заједничку касу, па „прикупљање“ заправо значи бројање. Могу оба редоследа."
    items:
      - "**Прво купи.** Купац плаћа, додаје трошак по стварној цени и сви одмах виде свој део. Уредније је, али купац сноси трошак док људи не плате, па изабери купца који то може."
      - "**Прво скупи.** Људи шаљу свој износ купцу пре куповине. Кад знате цену, унесите поклон, па забележите сваку уплату са датумом када је новац заиста прешао. Прво додајте поклон, да свака уплата има стање на које слеже."
      - "**Цена се мења.** Достава, код за попуст, касно поскупљење. Измени поклон и промени тачне износе да и даље дају тачан збир. Претходна верзија се чува, али прво реци групи, јер се њихова стања мењају."
  - heading: "Држи Беу ван свега"
    body: "Групу могу да виде само њени чланови, па Беа не може да види групу у којој није. Позови људе који дају прилог и никог другог. Веза важи док не истекне, а можеш изабрати било шта од 15 минута до 5 дана, зато изабери кратку и пошаљи је тамо где је Беа неће видети. Веза свакоме ко је отвори показује преглед групе, па групу назови нечим досадним, као што је суботња каса, и држи Беино име ван назива трошкова и опција анкете."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Не држи и не прикупља новац. Прилози иду купцу банковним трансфером, готовином или чиме већ користите, а затим их неко забележи."
      - "Не шаље подсетнике за уплату. Подсећање оних који нису платили и даље је људски посао."
      - "Не рачуна ничији удео. Анкета договара буџет, а опције „подели оно што остане“ нема, па сваки износ укуцаш сам."
      - "Сваки трошак има једног платиоца. Ако су двоје купили различите делове поклона, унеси два трошка."
      - "Свима у подели треба бесплатан налог и место у групи."
