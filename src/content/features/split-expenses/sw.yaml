sections:
  - heading: "Watu waliokuwepo tu"
    body: "Gawanya gharama kati ya kila mtu, au kati ya watu walioshiriki tu. Waache watu nje ya gharama ambazo hawakuhusika nazo, na salio litaakisi hilo. Mpangaji mwenza aliyekuwa safarini wiki nzima hadaiwi chakula cha kuchukua, jambo ambalo [wapangaji wenza](page:use-case/housemates) wataliona kuwa haki ya msingi."
  - heading: "Maelezo yanayookoa mabishano baadaye"
    items:
      - "Weka **tarehe** na saa ukipenda. Njia za mkato kama leo, jana, asubuhi hii na usiku wa jana huokoa kuandika."
      - "Ongeza hadi **lebo** tatu za kupanga gharama, kama mboga au safari."
      - "Ongeza **mahali**. Bandika kiungo cha ramani na jina la mahali hujijaza lenyewe."
      - "Ongeza **maelezo** ya hadithi iliyo nyuma ya nambari, kwa muundo kidogo ikihitajika."
      - "Ambatisha hadi **risiti** tatu, kama picha au PDF, ili ushahidi ubaki pamoja na gharama."
      - "Tumia **maoni** kuweka mazungumzo karibu na gharama inayohusika, badala ya mjadala wa gumzo ambao hakuna anayerudi kuusoma."
  - heading: "Nakili, hariri, na uone kilichobadilika"
    body: "Nakili kodi ya mwezi uliopita badala ya kuiandika tena, kisha ubadilishe kilicho tofauti. Nambari ikiwa si sahihi, hariri gharama. Toleo la awali linahifadhiwa na uhariri unaonekana kwenye shughuli za kikundi, kwa hivyo hakuna anayebadilisha nambari kimya kimya. Nani anaweza kuhariri nini hutegemea ruhusa za kikundi."
  - heading: "Kitu kikionekana si sawa"
    body: "Kikundi kinaweza kuwasha maswali ya gharama. Yeyote aliyejumuishwa kwenye gharama anaweza kuuliza swali na kueleza kwa nini, na gharama hubaki nje ya salio hadi aliyeuliza, au msimamizi, aifunge. Imezimwa kwa chaguo-msingi na msimamizi huiwasha kwa kikundi. Inafaa kwa [matukio na sherehe](page:use-case/events-and-celebrations), ambapo amana ambayo hakuna anayeikumbuka ghafla inakuwa jambo la kila mtu."
limits:
  heading: "Vikomo"
  items:
    - "Mtu mmoja analipa kila gharama. Ikiwa watu wawili walilipa, rekodi gharama mbili."
    - "Hakuna mgawanyo kwa bidhaa wala kwa hisa. Usawa, kiasi halisi na asilimia ndivyo vilivyopo."
    - "Asilimia lazima zijumlishe 100."
    - "Gharama inaweza kuwa hadi 999,999.99 katika sarafu yake yenyewe, kwa nafasi za desimali za kawaida za sarafu hiyo."
    - "Gharama haziwezi kujirudia zenyewe. Nakili ya mwezi uliopita badala yake."
    - "Tarehe haziwezi kuwa za baadaye au za zaidi ya miaka 10 iliyopita."
    - "Gharama inayomhusisha mtu aliyeondoka kwenye kikundi inakuwa ya kusoma tu."
useCasesHeading: "Mahali ambapo kugawanya hivi kunasaidia"
faq:
  heading: "Maswali"
  items:
    - q: "Je, watu wawili wanaweza kulipa gharama moja?"
      a: "Si kwa gharama moja. Rekodi mbili, moja kwa kila mlipaji, na salio hutoka sawa."
    - q: "Je, ninaweza kugawanya risiti kwa bidhaa?"
      a: "Hapana. Mgawanyo ni wa usawa, kwa kiasi halisi au kwa asilimia. Kwa bili yenye bidhaa tofauti, weka kile ambacho kila mtu anadaiwa kama kiasi halisi."
    - q: "Je, ninaweza kuweka mgawanyo wa chaguo-msingi?"
      a: "Hapana. Nakili gharama ya awali ili kutumia tena mgawanyo wake, na ubadilishe kilicho tofauti."
    - q: "Je, bili zinaweza kujirudia kila mwezi?"
      a: "Hapana. Nakili gharama ya mwezi uliopita badala yake, jambo linalochukua sekunde chache."
    - q: "Nani anaweza kuhariri gharama?"
      a: "Yeyote ambaye ruhusa za kikundi zinamruhusu. Kila uhariri unaonekana kwenye shughuli za kikundi, kwa hivyo mabadiliko hayafanywi kimya kimya."
    - q: "Nini hutokea kwa salio baadaye?"
      a: "Husasishwa gharama zinapofika, na [kumaliza hesabu](page:feature/settle-up) huyageuza kuwa orodha fupi ya malipo. Ikiwa gharama iko katika sarafu nyingine, tazama [sarafu nyingi](page:feature/multiple-currencies)."
