meta:
  title: Side Badger til bofæller, rejser og fester
  description: Del udgifter med bofæller, på gruppeture og til fester, bryllupper og fælles gaver. Se, hvad Side Badger gør for hver slags gruppe.
h1: Side Badger til din slags gruppe
navLabel: Anvendelser
lead: Bofæller, ferier, polterabender. Vælg dit kaos, og se så, hvordan en gruppe som din holder styr på regnskabet.
intro: Hver gruppe deler udgifter lidt forskelligt. Disse sider følger et **realistisk scenarie** fra den første udgift til den sidste registrerede betaling, med regnestykkerne vist, så du kan se, hvad din egen gruppe ville ende med.
cta:
  heading: Fundet din slags gruppe?
  body: Opret en konto, start en gruppe, og tilføj den første udgift. Det tager et par minutter.
  button: Opret en gratis konto
cardsHeading: Vælg den situation, der ligner din mest
sections:
  - heading: Gruppeture
    body: Fly i pund, en villa i euro og en middag, kun tre spiste med til. Sæt gruppen til at omregne til pund, så slutter fire venner i Lissabon med tre betalinger i stedet for seks, når valutaerne holdes adskilt. [Del udgifter på gruppeture](page:use-case/group-trips).
  - heading: Bofæller
    body: Én betaler udlejeren, en anden husker energiregningen, og ingen kan blive enige om, hvem der købte toiletpapiret. Med husleje delt efter værelsesstørrelse og de øvrige regninger delt ligeligt slutter fire bofæller måneden med tre betalinger, alle til den, der betalte huslejen. [Del husholdningsudgifter med bofæller](page:use-case/housemates).
  - heading: Fester, bryllupper og fælles gaver
    body: Seks personer stemmer om gaven, én køber den, og ikke alle bidrager med det samme beløb. En gave til 150 £ delt efter nøjagtige beløb giver fem betalinger til den, der købte den, 120 £ i alt. [Del udgifterne til en begivenhed](page:use-case/events-and-celebrations).
  - heading: Par
    body: Del de kedelige udgifter uden at gøre date night til et kvartalsvist økonomimøde. Husleje delt 60/40 og dagligvarer delt ligeligt ender som én betaling mellem jer to.
  - heading: Se først, hvordan det virker
    body: Alle eksemplerne ovenfor bruger de samme trin, fra at oprette en gruppe til at registrere betalingerne. [Sådan virker det](page:how-it-works) gennemgår dem, og [priser](page:pricing) fortæller, hvad det koster, nemlig ingenting, uden reklamer og uden daglige grænser.
faq:
  heading: Spørgsmål
  items:
    - q: Skal alle i gruppen have en konto?
      a: Ja. Folk tilmelder sig med et link eller en QR-kode og en gratis konto.
    - q: Kan Side Badger opkræve pengene?
      a: Nej. I betaler, som I vil, og registrerer så betalingen, så saldiene stemmer.
    - q: Skal jeg vælge én slags gruppe?
      a: Nej. Anvendelserne er eksempler, ikke indstillinger. Alle grupper har de samme funktioner, så brug den kombination, der passer.
