meta:
  title: "Kirayı oda büyüklüğüne göre nasıl bölüşürsünüz | Side Badger"
  description: "Büyük oda, büyük pay. Ortak odaları ayırın, kalanı taban alanına göre bölüşün ve yüzdeleri bir kez girin. Üç ev arkadaşı için hesaplarla."
h1: "Kirayı oda büyüklüğüne göre nasıl bölüşürsünüz"
navLabel: "Oda büyüklüğüne göre kira"
lead: "Kiranın ne kadarının ortak odalara gittiğine karar verin ve o kısmı eşit bölüşün; kalanı her yatak odasının taban alanına göre bölüşün. Tam yüzdelere yuvarlayın, Side Badger'da kiraya bir kez girin ve harcamayı her ay kopyalayın."
cta:
  heading: "Kirayı bir kez girin"
  body: "Ücretsiz bir hesap oluşturun, daire için bir grup kurun ve kirayı kararlaştırdığınız yüzdelerle girin. Gelecek ay bir kopyadan ibaret. Önce tura mı çıkmak istersiniz? [Nasıl çalışır](page:how-it-works) ya da [ücretsiz olan neleri kapsıyor](page:pricing) sayfalarına bakın."
sections:
  - heading: "Üç kişi, tek daire, tek tartışma"
    body: "Priya, Tom ve Aisha aylık 1.950 £'a bir daireyi paylaşıyor. Bir yıl boyunca kolay olduğu için üçe böldüler. Sonra Aisha yatak odasını ölçtü. Priya'nın odası 16 m², Tom'un 12 m², Aisha'nın 10 m²; yani Aisha, üçte birinden fazla küçük bir oda için Priya'nın ödediğini ödüyordu. Kimse mantıksız davranmamıştı. Kimse hesabı yapmamıştı. Bir paket yemeğin başında önce tek bir kuralda anlaştılar: Kiranın %40'ı mutfak, banyo ve salon için; üçü de bu odaları kullanıyor."
  - heading: "Yöntem, hesaplarla birlikte"
    body: "Dört adım, bir şerit metre ve telefondaki hesap makinesi."
    items:
      - "**Ortak kısmı ayırın.** Grup, kiranın herkesin kullandığı odalara düşen payı konusunda anlaşır. Bu dairede bu pay %40; üç kişi arasında kişi başı %13,33 eder."
      - "**Kalanı taban alanına göre bölüşün.** Diğer %60 yatak odası büyüklüğüne göre gider. Yatak odaları toplam 38 m² eder (16 + 12 + 10); dolayısıyla Priya'nın payı %60 × 16/38, yani %25,26."
      - "**İki parçayı toplayın.** Priya: %25,26 + %13,33 = %38,6. Tom: %60 × 12/38 = %18,95, artı %13,33 ile %32,3. Aisha: %60 × 10/38 = %15,79, artı %13,33 ile %29,1."
      - "**Yuvarlayın ve kontrol edin.** Tam yüzdeleri yazmak da tartışmak da daha kolaydır; bu yüzden %38,6 %39, %32,3 %32 ve %29,1 %29 olur. 39 + 32 + 29'un 100 ettiğini kontrol edin. Yuvarlamanız 99 ya da 101'e çıkarsa grup, kimin rakamının bir puan oynayacağına karar verir."
  - heading: "Dairenin ayını okumak"
    body: "%39, %32 ve %29 üzerinden kira 760,50 £, 624,00 £ ve 565,50 £ eder. Ev sahibine Priya ödedi; dolayısıyla ay boyunca 1.142,50 £ alacaklı, Tom 566,00 £ ve Aisha 576,50 £ borçlu. Side Badger ikisi de Priya'ya giden iki ödeme önerir."
  - heading: "Side Badger'da kurulumu"
    body: "Bir akşam; çoğu %40'ı tartışmakla geçer."
    items:
      - "**Grubu kurun.** Panelde **Grup Oluştur**'u seçin ve gruba dairenin adını verin. **Başkalarını davet et**'i seçip bağlantıyı ya da QR kodunu gönderin. Herkes giriş yapar ya da ücretsiz bir hesap oluşturur ve bu grupta görünmek istediği adı seçer."
      - "**Kirayı ekleyin.** **Harcama Ekle**'yi seçin. Açıklamayı ve tutarı girin, **Kim ödedi?** altında ev sahibine ödeyeni seçin. Üç kişiyi de **Şunlar arasında bölüştür** altında bırakın, sonra **Nasıl bölüştürülsün** altında **Yüzde**'yi seçip 39, 32 ve 29 yazın. Yüzdeler 100 etmezse form sizi uyarır. **Harcamayı Kaydet**'i seçin."
      - "**Faturaları ekleyin.** Enerji ve internet, kendi ödeyenleriyle ayrı harcamalardır. **Nasıl bölüştürülsün** seçeneğini **Eşit** üzerinde bırakın."
      - "**Gelecek ay kopyalayın.** Geçen ayın kirasını açın ve **Harcamayı kopyala**'yı seçin. Kopya ödeyeni, tutarı ve bölüşümü korur, tarih olarak bugünü alır. Kira değiştiyse tutarı değiştirin, sonra **Kopya oluştur**'u seçin."
      - "**Kimin kime borçlu olduğuna bakın.** **Bakiyeler** bölümü bunu gösterir. Birbirinize istediğiniz yolla ödeyin, sonra ödemeyi **Ödeş** altında kaydedin."
  - heading: "Banyolu odalar, küçük odalar ve ayrılanlar"
    items:
      - "**Banyolu odalar ve küçük odalar.** Taban alanı bir başlangıç noktasıdır. Kendi banyosu olan oda, banyosuz aynı alandan daha değerlidir; bir yatağın ve umutlu bir sandalyenin sığdığı küçük oda ise daha az değerlidir. Yüzdeleri anlaşarak ayarlayın, hâlâ 100 ettiklerini kontrol edin ve son rakamları bütün dairenin göreceği bir yere yazın."
      - "**Biri ay ortasında taşınıyor.** O ay için herkesin ne borçlu olduğunu hesaplayın ve o ayın kirasını **Yüzde** yerine **Tam tutarlar** ile girin. Tutarlar toplamda kirayı vermelidir. Bunu onlar gitmeden yapın. Borçluyken ya da alacaklıyken kimse gruptan ayrılamaz ve ayrılan birini ilgilendiren harcama salt okunur olur."
      - "**Biri taşınıp geliyor.** Yeniden ölçün, hesapları yeni oda büyüklükleriyle yapın ve yeni yüzdeleri bir sonraki kiradan itibaren kullanın. Önceki aylar olduğu gibi kalır."
  - heading: "Side Badger burada neyi yapmaz"
    items:
      - "Odalarınızı ölçmez, yüzdeleri de seçmez. Taban alanları ve %40 grubun anlaşacağı şeylerdir."
      - "Yinelenen fatura yok; bu yüzden her ay geçen ayın kirasını kopyalarsınız."
      - "Parayı hiç taşımaz ve ev sahibine ödeme yapmaz. Birbirinize istediğiniz yolla ödersiniz ve kaydedersiniz."
      - "Kira sözleşmenizin ne dediğini bilmez. Gruptaki insanlar arasındaki hesabı tutar."
