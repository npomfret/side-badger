faq:
  heading: "Maswali kuhusu villa"
  items:
    - q: "Je, kama mtu anaghairi?"
      a: "Toa usiku wake, fanya hesabu upya na uhariri gharama ya villa ili kiasi halisi kijumlishe bei tena. Toleo la awali linahifadhiwa na mabadiliko yanaonekana kwenye shughuli za kikundi, kwa hivyo hakuna anayebadilisha nambari kimyakimya. Nani anaweza kuhariri inategemea ruhusa za kikundi."
    - q: "Je, aliyeweka nafasi alipe kidogo?"
      a: "Hilo ni kwa kikundi kuamua. Kuweka nafasi ni kazi, na vikundi hutofautiana kama inastahili punguzo. Chochote mtakachokubaliana, kiweke kwenye kiasi halisi na ukiandike kwenye dokezo la gharama, au kwenye maoni kando yake, ili hakuna anayehitaji kukumbuka makubaliano."
    - q: "Je, tunaweza kugawanya ada za usafi tofauti?"
      a: "Ndiyo. Weka ada kama gharama tofauti na uipe mgawanyo wake. Sawa inafaa ada ya kiwango kimoja kwa nyumba nzima. Kiasi halisi kinafaa kikundi kinachotaka ada ifuate usiku pia."
