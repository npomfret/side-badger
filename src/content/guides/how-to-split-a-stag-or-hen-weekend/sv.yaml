faq:
  heading: Frågor
  items:
    - q: Betalar bästa mannen eller bästa kvinnan mer?
      a: Bara om gruppen kommer överens om det. Appen ger ingen någon särskild roll i uträkningen. Om någon täcker mer, välj **Exakta belopp** eller **Procentandel** under **Hur ska det delas?** och skriv in de andelar ni kom överens om.
    - q: Hur är det med drinkar som några inte drack?
      a: Lägg in drinkarna som en egen utgift och kryssa bara i dem som drack. Om alla hade olika mycket, välj **Exakta belopp** och skriv in var och ens andel. Ingen betalar för det hen inte fick.
    - q: Kan hedersgästen se gruppen senare?
      a: Ja, när överraskningen är över. Bjud in hen, så kan en administratör göra hen till **Tittare** under **Säkerhet och behörigheter** i gruppens inställningar. En tittare ser allt och ändrar inget, så vänta tills inget är hemligt. Hen behöver ett gratis konto för att gå med.
