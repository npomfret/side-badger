sections:
  - heading: Povídání o penězích hned u peněz
    body: Sdílené peníze přinášejí povídání, pochybnosti a plány. Side Badger drží všechny tři věci vedle čísel, takže nikdo nemusí listovat zpátky ve skupinovém chatu.
    items:
      - "**Komentáře tam, kam patří.** Komentujte samotnou skupinu nebo jakýkoli výdaj, seznam či hlasování a nechte debatu u toho, čeho se týká."
      - "**Účtenky a fotky.** U každého výdaje uložte až tři účtenky a ke komentářům u skupiny, seznamu nebo hlasování přidejte fotky či PDF."
      - "**Otázky, ne hádky.** Administrátor může otázky zapnout a pak se u výdaje může zeptat kdokoli, kdo v něm je. Do zůstatků se nepočítá, dokud se to nevyjasní."
      - "**Seznamy a hlasování.** Nákupní seznam mějte vedle účtů z nákupů a užší výběr vil dejte hlasovat, klidně anonymně."
      - "**Troška potlesku.** Reagujte na výdaje, platby a komentáře a oslavte platbu, když dorazí."
  - heading: Vaše skupina, vaše pravidla
    body: Centrum nápovědy Splitwise uvádí, že nepodporuje administrátory skupin ani zvláštní oprávnění. Side Badger má role a oprávnění, pro skupiny, které potřebují někoho, kdo drží čísla v pořádku.
    items:
      - "**Administrátoři, členové a diváci.** Udělejte z někoho diváka: vidí všechno a nic nemění."
      - "**Dvě předvolby, nebo vlastní.** Začněte s Otevřenou spoluprací nebo Spravovanou skupinou, anebo si každé oprávnění nastavte sami: kdo upravuje a maže výdaje, upravuje seznamy, zve a pouští dovnitř nové lidi."
      - "**Schválení při vstupu.** Zapněte schvalování a administrátor pustí dovnitř každého zvlášť."
      - "**Vlastní nastavení skupiny.** Omezte ji na měny, které opravdu používáte, vyberte její výchozí měnu a dejte jí obrázek záhlaví."
      - "**Uzamkněte ji, když je po všem.** Čísla zůstanou, jak jsou, dokud administrátor skupinu neodemkne."
  - heading: Tady zdarma, tam za peníze
    body: Splitwise Pro je placený plán Splitwise a jeho vlastní stránka Pro prodává tři věci, které v Side Badger nestojí nic.
    items:
      - "**Skenování účtenek.** Splitwise Pro naskenuje fotografii účtenky. Side Badger to dělá zdarma a bez kreditů na skeny: doplní celkovou částku, datum a místo ke kontrole."
      - "**Převod měn.** Splitwise Pro převede výdaje skupiny do vaší výchozí měny, když klepnete na „Convert“. Side Badger převádí každý výdaj při zadání, podle aktuálního směnného kurzu nebo toho, který jste skutečně dostali, a původní částka na výdaji zůstane."
      - "**Žádné denní limity.** Splitwise Pro prodává neomezený počet výdajů a jeho centrum nápovědy uvádí, že bezplatní uživatelé mohou přidat až 4 výdaje každý den. Side Badger denní limity nemá."
  - heading: Vaše banka zůstává stranou
    body: Side Badger se nepropojuje s vaší bankou a nežádá údaje o vašem bankovním účtu. Vede záznam o tom, kdo komu dluží; platíte si, jak chcete, a pak platbu zaznamenáte. Žádné bankovní přihlášení k předání, takže o starost míň.
  - heading: Jedna aplikace, v prohlížeči i v telefonu
    body: Side Badger běží v prohlížeči. Přihlaste se, přidejte ho na domovskou obrazovku a otevře se jako aplikace. V obou případech je to tatáž aplikace, takže nová funkce je v telefonu, jakmile ho příště otevřete, bez čekání na aktualizaci z obchodu s aplikacemi.
  - heading: A pár vychytávek
    items:
      - "**Zeptejte se asistenta.** Side Badger funguje s ChatGPT a Claude: požádejte svého, ať přidá výdaj, naskenuje účtenku nebo zaznamená platbu."
      - "**Každý ve svém jazyce.** Side Badger mluví 39 jazyky a každý si vybere svůj. Domovská stránka Splitwise uvádí 7+. Zvládá i 133 měn, pro výlet, který jede všude."
      - "**Nápověda, aniž opustíte aplikaci.** Zasekli jste se, nebo našli chybu? Napište nám z aplikace a odpověď si přečtěte hned tam."
  - heading: Kde Splitwise pořád vede
    body: Raději bychom, abyste si vybrali správnou aplikaci, než abyste to zjistili později. Pokud vaše skupina potřebuje něco z tohoto, Splitwise to má a Side Badger ne.
    items:
      - "**Aplikace z obchodu s aplikacemi.** Side Badger žije v prohlížeči a na domovské obrazovce, ne v obchodech s aplikacemi."
      - "**Režim offline.** Side Badger potřebuje připojení."
      - "**Platby v aplikaci.** V některých zemích umí Splitwise peníze i poslat. Side Badger vede jen záznam."
      - "**Dělení podle podílů nebo položek.** Side Badger má jednoho plátce na výdaj, který se dělí rovnoměrně, podle přesných částek nebo procentuálně. Jeho skenování účtenek nepřiřazuje položky lidem."
      - "**Grafy a výchozí rozdělení.** Splitwise Pro má obojí. Side Badger vede přehled, kdo komu dluží, a to je celý trik."
  - heading: Přechod vaší skupiny
    body: Import neexistuje, takže přechod znamená začít načisto. Nejdřív ve Splitwise uzavřete všechny dluhy, pak vytvořte skupinu v Side Badger a pozvěte všechny odkazem nebo QR kódem. Každý ve skupině potřebuje bezplatný účet a k registraci stačí e-mailová adresa.
