meta:
  title: "Sut i rannu rhent yn ôl maint ystafell | Side Badger"
  description: "Ystafell fwy, cyfran fwy. Neilltuwch yr ystafelloedd a rennir, rhannwch y gweddill yn ôl arwynebedd llawr a rhowch y canrannau unwaith. Symiau i dri chyd-letywr."
h1: "Sut i rannu rhent yn ôl maint ystafell"
navLabel: "Rhent yn ôl maint ystafell"
lead: "Penderfynwch faint o'r rhent sy'n talu am yr ystafelloedd a rennir a rhannwch y rhan honno'n gyfartal, yna rhannwch y gweddill yn ôl arwynebedd llawr pob ystafell wely. Talgrynnwch i ganrannau cyfan, rhowch nhw ar y rhent yn Side Badger unwaith, a chopïwch y gost bob mis."
cta:
  heading: "Rhowch y rhent i mewn unwaith"
  body: "Creu cyfrif am ddim, cychwyn grŵp ar gyfer y fflat a rhoi'r rhent i mewn gyda'r canrannau y cytunoch arnynt. Copi yw'r mis nesaf. Eisiau'r daith yn gyntaf? Gweler [sut mae'n gweithio](page:how-it-works) neu [beth mae am ddim yn ei gynnwys](page:pricing)."
sections:
  - heading: "Tri pherson, un fflat, un ddadl"
    body: "Mae Priya, Tom ac Aisha yn rhannu fflat am £1,950 y mis. Am flwyddyn roedden nhw'n ei rannu'n dri, am ei fod yn hawdd. Yna mesurodd Aisha ei hystafell wely. Mae ystafell Priya yn 16 m², un Tom yn 12 m² ac un Aisha yn 10 m², felly roedd Aisha yn talu'r un faint â Priya am ystafell dros draean yn llai. Doedd neb wedi bod yn afresymol. Doedd neb wedi gwneud y cyfrifiad. Dros bryd tecawê, cytunodd y tri ar un rheol yn gyntaf. O'r rhent, mae 40% yn talu am y gegin, yr ystafell ymolchi a'r lolfa, sy'n cael eu defnyddio gan bob un o'r tri."
  - heading: "Y dull, gyda'r symiau wedi'u dangos"
    body: "Pedwar cam, un tâp mesur a chyfrifiannell ffôn."
    items:
      - "**Neilltuo'r rhan a rennir.** Mae'r grŵp yn cytuno ar gyfran o'r rhent ar gyfer yr ystafelloedd y mae pawb yn eu defnyddio. Ar gyfer y fflat, 40% yw hi, sef 13.33% yr un rhwng tri pherson."
      - "**Rhannu'r gweddill yn ôl arwynebedd llawr.** Mae'r 60% arall yn mynd yn ôl maint yr ystafell wely. Mae'r ystafelloedd gwely yn adio i 38 m² (16 + 12 + 10), felly rhan Priya yw 60% × 16/38, sef 25.26%."
      - "**Adio'r ddwy ran.** Priya: 25.26% + 13.33% = 38.6%. Tom: 60% × 12/38 = 18.95%, ac mae ychwanegu 13.33% yn rhoi 32.3%. Aisha: 60% × 10/38 = 15.79%, ac mae ychwanegu 13.33% yn rhoi 29.1%."
      - "**Talgrynnu a gwirio.** Mae canrannau cyfan yn haws i'w teipio ac i ddadlau yn eu cylch, felly mae 38.6% yn dod yn 39%, 32.3% yn dod yn 32% a 29.1% yn dod yn 29%. Gwiriwch fod 39 + 32 + 29 yn gwneud 100. Os yw'r talgrynnu'n dod i 99 neu 101, mae'r grŵp yn cytuno ar ffigur pwy sy'n symud un pwynt."
  - heading: "Darllen mis y fflat"
    body: "Mae'r rhent ar 39%, 32% a 29% yn dod i £760.50, £624.00 a £565.50. Priya a dalodd y landlord, felly dros y mis mae £1,142.50 yn ddyledus iddi, tra bod £566.00 yn ddyledus gan Tom a £576.50 gan Aisha. Mae Side Badger yn awgrymu dau daliad, y ddau i Priya."
  - heading: "Ei sefydlu yn Side Badger"
    body: "Un noson, a'r rhan fwyaf ohoni'n mynd ar drafod y 40%."
    items:
      - "**Gwneud y grŵp.** Ar y dangosfwrdd dewiswch **Creu Grŵp** a'i enwi ar ôl y fflat. Dewiswch **Gwahodd Eraill** ac anfon y ddolen neu'r cod QR. Mae pawb yn mewngofnodi neu'n creu cyfrif am ddim, ac yn dewis yr enw maen nhw eisiau ei ddangos yn y grŵp hwn."
      - "**Ychwanegu'r rhent.** Dewiswch **Ychwanegu Cost**. Rhowch y disgrifiad a'r swm, ac o dan **Pwy dalodd?** dewiswch pwy dalodd y landlord. Cadwch y tri pherson o dan **Rhannu rhwng**, yna o dan **Sut i rannu** dewiswch **Canran** a theipiwch 39, 32 a 29. Mae'r ffurflen yn nodi hynny os nad yw'r canrannau'n adio i 100. Dewiswch **Cadw Cost**."
      - "**Ychwanegu'r biliau.** Mae ynni a band eang yn gostau ar wahân, pob un â'i dalwr ei hun. Gadewch **Sut i rannu** ar **Cyfartal**."
      - "**Ei gopïo'r mis nesaf.** Agorwch rent y mis diwethaf a dewiswch **Copïo cost**. Mae'r copi'n cadw'r talwr, y swm a'r rhaniad, ac yn cymryd dyddiad heddiw. Newidiwch y swm os yw'r rhent wedi newid, yna dewiswch **Creu Copi**."
      - "**Gwirio pwy sy'n ddyledus i bwy.** Mae'r adran **Balansau** yn ei ddangos. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad o dan **Setlo**."
  - heading: "Ystafelloedd en-suite, ystafelloedd bach a phobl yn gadael"
    items:
      - "**Ystafelloedd en-suite ac ystafelloedd bach.** Dim ond man cychwyn yw arwynebedd llawr. Mae ystafell â'i hystafell ymolchi ei hun yn werth mwy nag ystafell o'r un maint hebddi, ac mae ystafell fach sy'n dal gwely a chadair obeithiol yn werth llai. Addaswch y canrannau trwy gytundeb, gwiriwch eu bod yn dal i adio i 100 ac ysgrifennwch y ffigurau terfynol i lawr lle gall y fflat cyfan eu gweld."
      - "**Rhywun yn symud allan ynghanol y mis.** Cyfrifwch beth sy'n ddyledus gan bob person am y mis hwnnw a rhowch rent y mis hwnnw i mewn gyda **Union symiau** yn lle **Canran**. Rhaid i'r symiau adio i'r rhent. Gwnewch hynny cyn iddyn nhw fynd. All neb adael grŵp tra bo arian yn ddyledus ganddyn nhw neu iddyn nhw, ac mae cost sy'n cynnwys rhywun sydd wedi gadael yn troi'n ddarllen yn unig."
      - "**Rhywun yn symud i mewn.** Mesurwch eto, ailwnewch y cyfrifiadau gyda meintiau'r ystafelloedd newydd a defnyddiwch y canrannau newydd o'r rhent nesaf. Mae'r misoedd blaenorol yn aros fel yr oeddent."
  - heading: "Beth nad yw Side Badger yn ei wneud yma"
    items:
      - "Dyw Side Badger ddim yn mesur eich ystafelloedd nac yn dewis y canrannau. Mater i'r grŵp yw cytuno ar yr arwynebeddau llawr a'r 40%."
      - "Does dim biliau cylchol, felly rydych yn copïo rhent y mis diwethaf bob tro."
      - "Dyw Side Badger byth yn symud arian ac nid yw'n talu'r landlord. Rydych yn talu eich gilydd sut bynnag y dymunwch ac yn ei gofnodi."
      - "Dyw Side Badger ddim yn gwybod beth mae eich cytundeb tenantiaeth yn ei ddweud. Mae'n cadw'r cyfrif rhwng y bobl yn y grŵp."
