faq:
  heading: "Ceisteanna faoin teach saoire"
  items:
    - q: "Cad má chealaíonn duine?"
      a: "Bain a n-oícheanta amach, déan na suimeanna arís agus cuir costas an tí saoire in eagar ionas go mbeidh na méideanna cruinne cothrom leis an bpraghas arís. Coinnítear an leagan níos luaithe agus feictear an t-athrú i ngníomhaíocht an ghrúpa, mar sin ní athraíonn aon duine uimhir go ciúin. Braitheann cé a fhéadfaidh cur in eagar ar cheadanna an ghrúpa."
    - q: "Ar cheart don duine a rinne an áirithint níos lú a íoc?"
      a: "Is faoin ngrúpa é sin. Is cúram é an áirithint, agus tá grúpaí éagsúil maidir le cé acu an bhfaigheann sé lascaine. Pé rud a aontaíonn sibh, cuir sna méideanna cruinne é agus scríobh i nóta ar an gcostas é, nó i dtrácht in aice leis, ionas nach gcaithfidh aon duine cuimhneamh ar an margadh."
    - q: "An féidir táillí glantacháin a roinnt ar bhealach difriúil?"
      a: "Is féidir. Cuir isteach an táille mar chostas ar leith agus tabhair a roinnt féin dó. Oireann roinnt chothrom do tháille sheasta don teach ar fad. Oireann méideanna cruinne do ghrúpa ar mian leis go leanfadh an táille na hoícheanta freisin."
