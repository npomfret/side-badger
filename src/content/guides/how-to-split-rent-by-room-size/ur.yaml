meta:
  title: "کرایہ کمرے کے سائز کے حساب سے کیسے بانٹیں | Side Badger"
  description: "بڑا کمرہ، بڑا حصہ۔ مشترکہ کمرے الگ رکھیں، باقی کرایہ رقبے کے مطابق بانٹیں اور فیصد ایک بار درج کریں۔ تین ساتھیوں کا حساب دکھایا گیا ہے۔"
h1: "کرایہ کمرے کے سائز کے حساب سے کیسے بانٹیں"
navLabel: "کمرے کے سائز پر کرایہ"
lead: "پہلے طے کریں کہ کرائے کا کتنا حصہ مشترکہ کمروں کے لیے ہے اور اسے برابر بانٹیں، پھر باقی کو ہر خواب گاہ کے رقبے کے مطابق بانٹیں۔ مکمل فیصد میں گول کریں، Side Badger میں کرائے پر ایک بار درج کریں، اور ہر مہینے وہ خرچہ کاپی کر لیں۔"
cta:
  heading: "کرایہ ایک بار درج کریں"
  body: "مفت اکاؤنٹ بنائیں، فلیٹ کے لیے گروپ شروع کریں اور طے شدہ فیصد کے ساتھ کرایہ درج کریں۔ اگلا مہینہ بس ایک کاپی ہے۔ پہلے سیر کرنا چاہتے ہیں؟ [یہ کیسے کام کرتا ہے](page:how-it-works) یا [مفت میں کیا شامل ہے](page:pricing) دیکھیں۔"
sections:
  - heading: "تین لوگ، ایک فلیٹ، ایک بحث"
    body: "پریا، ٹام اور عائشہ ایک فلیٹ میں £1,950 ماہانہ پر رہتے ہیں۔ ایک سال تک وہ اسے تین برابر حصوں میں بانٹتے رہے، کیونکہ یہ آسان تھا۔ پھر عائشہ نے اپنی خواب گاہ ناپ لی۔ پریا کا کمرہ 16 مربع میٹر کا ہے، ٹام کا 12 کا اور عائشہ کا 10 کا، یعنی عائشہ اتنا دے رہی تھی جتنا پریا اپنے اس کمرے کا دیتی ہے جو عائشہ کے کمرے سے ایک تہائی سے زیادہ بڑا ہے۔ کسی نے ناانصافی نہیں کی تھی۔ کسی نے حساب ہی نہیں لگایا تھا۔ ٹیک اوے کھاتے ہوئے انہوں نے پہلے ایک اصول طے کیا۔ کرائے کا 40% باورچی خانے، غسل خانے اور لاؤنج کا ہے، جو تینوں استعمال کرتے ہیں۔"
  - heading: "طریقہ، حساب کے ساتھ"
    body: "چار مراحل، ایک فیتہ اور فون کا کیلکولیٹر۔"
    items:
      - "**مشترکہ حصہ الگ کریں۔** گروپ طے کرتا ہے کہ کرائے کا کتنا حصہ ان کمروں کا ہے جو سب استعمال کرتے ہیں۔ اس فلیٹ میں یہ 40% ہے، یعنی تین لوگوں میں فی کس 13.33%۔"
      - "**باقی کو رقبے کے مطابق بانٹیں۔** باقی 60% خواب گاہ کے سائز کے مطابق جاتا ہے۔ خواب گاہیں مل کر 38 مربع میٹر بنتی ہیں (16 + 12 + 10)، اس لیے پریا کا حصہ 60% × 16/38 ہے، یعنی 25.26%۔"
      - "**دونوں حصے جمع کریں۔** پریا: 25.26% + 13.33% = 38.6%۔ ٹام: 60% × 12/38 = 18.95%، اور 13.33% ملا کر 32.3%۔ عائشہ: 60% × 10/38 = 15.79%، اور 13.33% ملا کر 29.1%۔"
      - "**گول کریں اور جانچیں۔** مکمل فیصد ٹائپ کرنا اور ان پر بحث کرنا آسان ہے، اس لیے 38.6% کا 39%، 32.3% کا 32% اور 29.1% کا 29% ہو جاتا ہے۔ جانچیں کہ 39 + 32 + 29 کا مجموعہ 100 ہے۔ اگر گول کرنے سے 99 یا 101 آئے تو گروپ طے کرتا ہے کہ کس کا عدد ایک پوائنٹ ہلے۔"
  - heading: "فلیٹ کا مہینہ پڑھنا"
    body: "39%، 32% اور 29% پر کرایہ £760.50، £624.00 اور £565.50 بنتا ہے۔ مالک مکان کو پریا نے ادا کیا، اس لیے مہینے بھر میں اسے £1,142.50 ملنے ہیں، جبکہ ٹام کو £566.00 دینے ہیں اور عائشہ کو £576.50۔ Side Badger دو ادائیگیاں تجویز کرتا ہے، دونوں پریا کو۔"
  - heading: "Side Badger میں ترتیب دیں"
    body: "ایک شام، جس کا بیشتر حصہ اس 40% پر بحث میں گزرے گا۔"
    items:
      - "**گروپ بنائیں۔** ڈیش بورڈ پر **گروپ بنائیں** چنیں اور اس کا نام فلیٹ کے نام پر رکھیں۔ **دوسروں کو مدعو کریں** چنیں اور لنک یا QR کوڈ بھیجیں۔ ہر کوئی سائن ان کرتا ہے یا مفت اکاؤنٹ بناتا ہے، اور وہ نام چنتا ہے جو وہ اس گروپ میں دکھانا چاہتا ہے۔"
      - "**کرایہ شامل کریں۔** **خرچہ شامل کریں** چنیں۔ تفصیل اور رقم درج کریں، اور **کس نے ادائیگی کی؟** کے تحت اسے چنیں جس نے مالک مکان کو ادا کیا۔ **کے درمیان تقسیم کریں** کے تحت تینوں لوگ رہنے دیں، پھر **کیسے تقسیم کریں** کے تحت **فیصد** چنیں اور 39، 32 اور 29 ٹائپ کریں۔ اگر فیصد کا مجموعہ 100 نہ ہو تو فارم نشاندہی کر دیتا ہے۔ **خرچہ محفوظ کریں** چنیں۔"
      - "**بل شامل کریں۔** بجلی گیس اور براڈ بینڈ الگ اخراجات ہیں، ہر ایک کے اپنے ادا کنندہ کے ساتھ۔ **کیسے تقسیم کریں** کو **برابر** پر رہنے دیں۔"
      - "**اگلے مہینے کاپی کریں۔** پچھلے مہینے کا کرایہ کھولیں اور **خرچہ کاپی کریں** چنیں۔ کاپی میں ادا کنندہ، رقم اور تقسیم وہی رہتی ہے اور تاریخ آج کی ہو جاتی ہے۔ اگر کرایہ بدلا ہو تو رقم بدلیں، پھر **کاپی بنائیں** چنیں۔"
      - "**دیکھیں کس کو کس کا دینا ہے۔** **بیلنسز** کا حصہ یہ دکھاتا ہے۔ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ادائیگی **تصفیہ کریں** کے تحت ریکارڈ کریں۔"
  - heading: "اٹیچڈ باتھ والے کمرے، چھوٹے کمرے اور جانے والے لوگ"
    items:
      - "**اٹیچڈ باتھ والے اور چھوٹے کمرے۔** رقبہ صرف آغاز ہے۔ اپنے غسل خانے والا کمرہ اسی رقبے کے بغیر غسل خانے والے کمرے سے زیادہ قیمتی ہے، اور وہ چھوٹا کمرہ جس میں ایک بستر اور ایک امید بھری کرسی ہی سماتی ہے کم قیمتی۔ باہمی رضامندی سے فیصد ایڈجسٹ کریں، جانچیں کہ مجموعہ پھر بھی 100 ہے اور حتمی اعداد ایسی جگہ لکھ دیں جہاں پورا فلیٹ دیکھ سکے۔"
      - "**کوئی مہینے کے بیچ میں چلا جائے۔** حساب لگائیں کہ اس مہینے ہر شخص کا کیا بنتا ہے، اور اس مہینے کا کرایہ **فیصد** کی بجائے **عین رقمیں** کے ساتھ درج کریں۔ رقمیں کرائے کے برابر بنیں۔ یہ اس کے جانے سے پہلے کریں۔ جب تک کسی کو دینا یا لینا ہو وہ گروپ نہیں چھوڑ سکتا، اور جو شخص جا چکا ہو اس سے متعلق خرچہ صرف پڑھنے کے لیے رہ جاتا ہے۔"
      - "**کوئی نیا آ جائے۔** دوبارہ ناپیں، کمروں کے نئے سائز سے حساب دوبارہ لگائیں اور اگلے کرائے سے نئے فیصد استعمال کریں۔ پچھلے مہینے جیسے تھے ویسے ہی رہتے ہیں۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ آپ کے کمرے نہیں ناپتا اور فیصد نہیں چنتا۔ رقبے اور 40% گروپ کو باہمی طور پر طے کرنے ہیں۔"
      - "اس میں بار بار آنے والے بل نہیں ہیں، اس لیے آپ ہر بار پچھلے مہینے کا کرایہ کاپی کرتے ہیں۔"
      - "یہ کبھی رقم نہیں منتقل کرتا اور مالک مکان کو ادا نہیں کرتا۔ آپ ایک دوسرے کو جیسے چاہیں ادا کرتے ہیں اور اسے ریکارڈ کرتے ہیں۔"
      - "یہ نہیں جانتا کہ آپ کے کرایہ نامے میں کیا لکھا ہے۔ یہ گروپ کے لوگوں کے درمیان حساب رکھتا ہے۔"
