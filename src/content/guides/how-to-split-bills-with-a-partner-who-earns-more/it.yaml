faq:
  heading: "Domande"
  items:
    - q: "Dobbiamo usare lo stipendio lordo o netto?"
      a: "Decidete voi. Il netto è la scelta più comune, perché sono i soldi che avete davvero da spendere. Lo stipendio lordo ignora il fatto che tasse, contributi pensionistici e rate di prestiti tolgono importi diversi da stipendi diversi. Qualunque scelta facciate, usate lo stesso criterio per entrambi."
    - q: "Side Badger vede i nostri stipendi?"
      a: "No. Inserisci solo le percentuali, mai gli stipendi. Le percentuali sono visibili ai membri del gruppo, e per una coppia siete voi due."
    - q: "Possiamo impostare 62/38 una volta per tutto?"
      a: "La divisione si imposta per spesa, non per gruppo. Copia una spesa che ha già 62 e 38, poi cambia ciò che differisce. [Dividere le spese](page:feature/split-expenses) spiega le altre opzioni."
