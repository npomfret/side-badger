faq:
  heading: Frågor
  items:
    - q: Vilket är rättvisast, rummens storlek eller inkomst?
      a: Inget av dem är alltid rättvisast. Rummens storlek passar rumskamrater som betalar för ytan de sover på. Inkomst passar par och vänner med mycket olika lön. Bestäm det före första hyresdagen, inte efter.
    - q: Ska räkningarna delas på samma sätt?
      a: För rumskamrater, oftast inte. Alla använder el och bredband, så lika är enklare, som i exemplet. Efter inkomst ger kalkylatorn räkningarna samma andelar som hyran.
    - q: Kan jag använda kvadratfot?
      a: Ja. Välj ft² och skriv in dina ytor i kvadratfot. Enheten är bara en etikett, och andelarna blir desamma så länge alla använder en och samma.
    - q: Är kalkylatorn gratis?
      a: Ja. Gratis. Utan annonser. Utan dagliga gränser. Du behöver inget konto heller.
