meta:
  title: Jaa ryhmämatkan kulut 140 valuutassa
  description: Seuraa, kuka maksoi mitä ryhmämatkalla, syötä kulut paikallisessa valuutassa, muunna ne tai älä, ja tasaa kerralla lopuksi. Ilmainen, selaimessa.
h1: Jaa ryhmämatkan kulut 140 valuutassa
navLabel: Ryhmämatkat
lead: Seuraa huvilaa, takseja ja sitä yhtä cocktail-kierrosta, jonka tarjoamiseen kukaan ei muista ilmoittautuneensa. Side Badger pitää kirjaa matkan ajan, [hoitaa punnat, eurot ja 138 muuta valuuttaa](page:feature/multiple-currencies) ja antaa kotiin tultua [lyhyen maksulistan](page:feature/settle-up).
cta:
  heading: Lomalaskut hoidettu, ennen kuin rusketus haalenee
  body: Perusta ryhmä, lähetä kutsulinkki matkalaisille ja lisää kulut sitä mukaa kuin ne syntyvät.
  button: Luo ilmainen tili
scenario:
  heading: Jokainen maksoi jotain, jollain valuutalla
  body: Joku varasi lennot, toinen laittoi huvilan kortille ja kolmas maksoi illallisen käteisellä. Kolmanteen päivään mennessä kukaan ei tiedä, kuka on plussalla. Kysymys on yksinkertainen, vaikka vastaus on yleensä taulukossa, jota kukaan ei halua avata. Kuka maksoi mitä, millä valuutalla, ja miten kaikki tasaavat tilit kerralla lopuksi?
sections:
  - heading: Ennen lähtöä
    body: Laita huvilakandidaatit äänestykseen, halutessasi nimettömänä, jotta päätös kuuluu ryhmälle eikä sille, joka mököttää pisimpään. Pidä sitten yhteinen ostoslista ostoslaskujen vieressä, ettei kukaan osta kolmea aurinkovoidetta eikä yhtään pistokesovitinta.
  - heading: Matkan aikana
    body: Lisää jokainen kulu sitä mukaa kuin se syntyy, valuutalla, jolla maksoit. Ota kuva kuitista, niin Side Badger täyttää summan, päivämäärän ja paikan tarkistettavaksesi; Googlen tekoälypalvelu lukee kuittikuvat. Muunna summa nykyisellä valuuttakurssilla, jonka voit vaihtaa kurssiin, jonka todella sait, ja alkuperäinen summa säilyy kulussa. Tai jätä eurot euroiksi ja päätä myöhemmin. Ryhmä voi myös valita yhden valuutan, ja uudet kulut muunnetaan siihen automaattisesti.
  - heading: Kaikki eivät tehneet kaikkea
    body: Jotkut ohittivat illallisen, jotkut jättivät veneen väliin. Jätä heidät pois kuluista, joihin he eivät osallistuneet, ja jaa loput [tasan, tarkoilla summilla tai prosenteilla](page:feature/split-expenses). Kukaan ei maksa matkan osasta, jonka nukkui.
  - heading: Tasaa kerralla kotona
    body: Side Badger ehdottaa lyhyttä maksulistaa, joka tasaa kaikki. Maksakaa toisillenne miten haluatte ja kirjatkaa se sitten. Sekavaluuttaisessa matkassa voit pitää jokaisen valuutan erillään tai muuntaa matkan varrella; alla oleva Lissabon-esimerkki näyttää molemmat.
  - heading: Polttariviikonloput
    body: Viikonloppu kunniavieraan kanssa vaatii hieman enemmän järjestelyä. Tee siitä hallittu ryhmä, jossa ylläpitäjät hyväksyvät uudet jäsenet ja vain luojat ja ylläpitäjät voivat muuttaa kuluja. Käytä tarkkoja summia kunniavieraan osuudelle, rajaa ryhmä valuuttoihin, joita oikeasti käytät, ja lukitse ryhmä, kun se on ohi, jotta luvut pysyvät paikoillaan.
