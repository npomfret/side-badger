meta:
  title: "Dijeli troškove jednako, točno ili po postocima | Side Badger"
  description: "Podijeli zajednički trošak jednako, po točnim iznosima ili po postocima i izostavi svakoga tko nije bio tamo. Besplatno, bez oglasa i bez dnevnih ograničenja."
h1: "Dijeli troškove jednako, točno ili po postocima"
navLabel: "Podjela troškova"
lead: "Nije sve 50/50. Side Badger se snalazi. Reci tko je platio, odaberi osobe koje dijele trošak i podijeli ga **jednako, po točnim iznosima ili po postocima**. Zamjerke se prodaju zasebno."
cta:
  heading: "Podijeli sljedeći kako treba"
  body: "Napravi besplatan korisnički račun, osnuj grupu i dodaj trošak koji već dugo namjeravaš srediti. Ne znaš što slijedi? Pogledaj [kako radi](page:how-it-works) ili provjeri [što pokriva besplatna verzija](page:pricing)."
  button: "Napravi besplatan račun"
problem:
  heading: "Nije sve 50/50"
  body: "Najamnina ovisi o veličini sobe. Dar o tome tko je što obećao. Večera o tome tko je ostao na desert. Dijeljenje računa napola funkcionira do prvog računa koji nije takav, a tada netko otvori tablicu. Side Badger bilježi tko je platio, tko dijeli trošak i kako se dijeli, pa stanja izlaze točna, a nitko za stolom ne mora pisano dijeliti."
workflow:
  heading: "Dodavanje troška od početka do kraja"
  steps:
    - title: "Reci tko je platio i za što"
      body: "Unesi iznos, kratak opis i osobu koja je platila. Za svaki trošak plaća jedna osoba, što računicu drži poštenom."
      shot: S05
      shotAlt: "Obrazac troška s najamninom za kućicu podijeljenom po postocima na troje ljudi"
    - title: "Odaberi podjelu"
      body: "Odaberi jednako, točne iznose ili postotke. Postoci moraju zajedno davati 100, a točni iznosi moraju zajedno davati ukupni iznos."
      shot: S06
      shotAlt: "Obrazac troška s točnim iznosima unesenima za svaku osobu za dar"
    - title: "Dodaj priču"
      body: "Postavi datum, dodaj oznake, mjesto i bilješku. Svi u grupi vide iste pojedinosti i mogu odmah tamo komentirati."
      shot: S08
      shotAlt: "Trošak s pojedinostima, nitom komentara i izvornim iznosom u kojem je unesen"
    - title: "Postavi pitanje ako nešto izgleda čudno"
      body: "Ako je grupa uključila pitanja o troškovima, svatko tko je uključen u trošak može ga dovesti u pitanje, a popis troškova može prikazivati samo one dovedene u pitanje."
      shot: S18
      shotAlt: "Popis troškova s oznakom Dovedeno u pitanje i filtrom Samo dovedeno u pitanje"
options:
  heading: "Tri načina podjele"
  items:
    - title: "Jednako"
      body: "Zadano za večere, taksije i sve što su svi dijelili ravnomjerno. Ako se ukupni iznos ne dijeli bez ostatka, preostali cent ide jednoj osobi nasumično, ne uvijek istoj. U taksiju ispod to je Ana."
    - title: "Po točnim iznosima"
      body: "Upiši koliko tko duguje. Dobro za dar gdje je svatko odabrao drugu cijenu ili kupnju u kojoj je nečija košarica sadržavala više od zajedničkih namirnica. Iznosi moraju zajedno davati ukupni iznos."
    - title: "Po postocima"
      body: "Daj svakome udio u ukupnom iznosu. Najamnina prema veličini sobe je klasik: najveća soba plaća najveći udio i nitko se ne pretvara drukčije."
