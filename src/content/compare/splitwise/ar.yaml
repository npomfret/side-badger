sections:
  - heading: حديث المال بجانب المال
    body: المال المشترك يأتي معه كلام وشكوك وخطط. يُبقي Side Badger الثلاثة بجانب الأرقام، فلا يضطر أحد إلى العودة والتمرير في دردشة المجموعة.
    items:
      - "**تعليقات في مكانها.** علّق على المجموعة نفسها، أو على أي مصروف أو قائمة أو استطلاع، وأبقِ الحديث بجانب ما يخصه."
      - "**إيصالات وصور.** احتفظ بما يصل إلى ثلاثة إيصالات في كل مصروف، وأضف صوراً أو ملفات PDF إلى التعليقات على المجموعة أو على قائمة أو استطلاع."
      - "**أسئلة، لا خلافات.** يستطيع المسؤول تفعيل الأسئلة، ثم يستطيع أي شخص في المصروف أن يسأل عنه. ويبقى خارج الأرصدة حتى يُحسم."
      - "**قوائم واستطلاعات.** ضع قائمة التسوق المشتركة بجانب فواتير التسوق، واعرض قائمة الفيلات المرشحة على التصويت، بسرّية إن أحببت."
      - "**قليل من التصفيق.** تفاعل مع المصروفات والدفعات والتعليقات، واحتفل بدفعة حين تصل."
  - heading: مجموعتك، قواعدك
    body: يقول مركز مساعدة Splitwise إنه لا يدعم مسؤولي المجموعات ولا الأذونات الخاصة. أما Side Badger فله أدوار وأذونات، للمجموعات التي تحتاج من يُبقي الأرقام مرتبة.
    items:
      - "**مسؤولون وأعضاء ومشاهدون.** اجعل أحدهم مشاهداً: يرى كل شيء ولا يغيّر شيئاً."
      - "**إعدادان مسبقان، أو إعداداتك.** ابدأ بـ«تعاون مفتوح» أو «مجموعة مُدارة»، أو اضبط كل إذن بنفسك: من يعدّل المصروفات ويحذفها، ومن يعدّل القوائم، ومن يدعو ويُدخل أشخاصاً جدداً."
      - "**موافقة للانضمام.** فعّل الموافقة فيُدخل مسؤول كل شخص بنفسه."
      - "**إعدادات المجموعة نفسها.** اقصرها على العملات التي تستخدمها فعلاً، واختر عملتها الافتراضية، وأضف لها صورة غلاف في الأعلى."
      - "**اقفلها حين ينتهي الأمر.** تبقى الأرقام مكانها حتى يفتح المسؤول القفل."
  - heading: مجاني هنا، مدفوع هناك
    body: Splitwise Pro هو خطة Splitwise المدفوعة، وتبيع صفحة Pro الخاصة به ثلاثة أشياء لا تكلّف شيئاً في Side Badger.
    items:
      - "**مسح الإيصالات.** يمسح Splitwise Pro صورة إيصالك. أما Side Badger فيفعل ذلك مجاناً، بلا أرصدة للمسح: فهو يملأ الإجمالي والتاريخ والمكان لتراجعها."
      - "**تحويل العملات.** يحوّل Splitwise Pro مصروفات المجموعة إلى عملتك الافتراضية حين تضغط «Convert». أما Side Badger فيحوّل كل مصروف أثناء إدخاله، بسعر صرف حالي أو بالسعر الذي حصلت عليه فعلاً، ويبقى المبلغ الأصلي على المصروف."
      - "**بلا حدود يومية.** يبيع Splitwise Pro مصروفات غير محدودة، ويذكر مركز المساعدة فيه أن المستخدمين المجانيين يستطيعون إضافة 4 مصروفات كحد أقصى كل يوم. أما Side Badger فلا حدود يومية فيه."
  - heading: مصرفك يبقى بعيداً عن الأمر
    body: لا يتصل Side Badger بمصرفك ولا يطلب بيانات حسابك المصرفي. يحتفظ بسجل من يدين لمن؛ ويتم الدفع بينكم بالطريقة التي تناسبكم، ثم تُسجَّل الدفعة. لا بيانات دخول مصرفية لتسلّمها، فهذا همّ أقل عليك.
  - heading: تطبيق واحد، في متصفحك وعلى هاتفك
    body: يعمل Side Badger في متصفحك. سجّل الدخول وأضفه إلى شاشتك الرئيسية فيفتح كأنه تطبيق. هو التطبيق نفسه في الحالتين، فتصل الميزة الجديدة إلى هاتفك في المرة التالية التي تفتحه فيها، بلا تحديث من متجر التطبيقات تنتظره.
  - heading: وبضع مفاجآت لطيفة
    items:
      - "**اسأل مساعدك.** يعمل Side Badger مع ChatGPT وClaude: اطلب من مساعدك أن يضيف مصروفاً أو يمسح إيصالاً أو يسجّل دفعة."
      - "**كل واحد بلغته.** يتحدث Side Badger 39 لغة ويختار كل فرد لغته. أما صفحة Splitwise الرئيسية فتقول 7 لغات فأكثر. ويتعامل أيضاً مع 133 عملة، للرحلة التي تذهب إلى كل مكان."
      - "**مساعدة دون مغادرة التطبيق.** علقت في شيء أو وجدت خللاً؟ أخبرنا من التطبيق واقرأ ردنا هناك مباشرة."
  - heading: حيث لا يزال Splitwise يتفوق
    body: نفضّل أن تختار التطبيق المناسب على أن تكتشف لاحقاً. فإن احتاجت مجموعتك إلى أحد هذه، فعند Splitwise وليس عند Side Badger.
    items:
      - "**تطبيقات متاجر التطبيقات.** يعيش Side Badger في متصفحك وعلى شاشتك الرئيسية، لا في متاجر التطبيقات."
      - "**وضع عدم الاتصال.** يحتاج Side Badger إلى اتصال."
      - "**الدفعات داخل التطبيق.** في بعض البلدان يستطيع Splitwise تحريك المال أيضاً. أما Side Badger فيحتفظ بالسجل فقط."
      - "**التقسيم بالحصص أو بالبند.** في Side Badger دافع واحد لكل مصروف، يُقسَّم بالتساوي أو بمبالغ محددة أو بنسبة مئوية. ولا يوزّع مسح الإيصالات فيه البنود على الأشخاص."
      - "**المخططات والتقسيمات الافتراضية.** في Splitwise Pro الاثنان. أما Side Badger فيحتفظ بحساب من يدين لمن، وهذا كل السرّ."
  - heading: نقل مجموعتك إليه
    body: لا توجد أداة استيراد، فالانتقال يعني بداية جديدة. سوِّ الحسابات في Splitwise أولاً، ثم أنشئ مجموعة في Side Badger وادعُ الجميع برابط أو برمز QR. ويحتاج كل فرد في المجموعة إلى حساب مجاني، وكل ما يلزم للتسجيل هو عنوان بريد إلكتروني.
