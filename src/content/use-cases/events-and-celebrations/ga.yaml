meta:
  title: "Roinn costais cóisirí, póstaí agus bronntanas grúpa"
  description: "Roinn costais cóisire, bainise nó bronntanais ghrúpa nuair a chuireann daoine méideanna difriúla isteach. Vótáil ar an bplean, roinn de réir suimeanna cruinne agus féach cé atá i bhfiacha le cé."
h1: "Roinn costais cóisirí, póstaí agus bronntanas grúpa"
navLabel: "Imeachtaí agus ceiliúradh"
lead: "Roinn éarlaisí, maisiúcháin agus scátha báistí éigeandála. Fág an plean suí ag duine éigin níos cróga. Coinníonn Side Badger **cé a chuir cad isteach** in aon áit amháin, ionas gur féidir leis an eagraí taitneamh a bhaint as an gcóisir freisin."
cta:
  heading: "Tosaigh leis an gcéad cheiliúradh eile"
  body: "Cruthaigh cuntas, déan grúpa don imeacht agus seol an nasc cuiridh. Tá Side Badger saor in aisce, gan fógraí agus gan teorainneacha laethúla."
  button: "Cruthaigh cuntas saor in aisce"
scenario:
  heading: "Cuireann gach duine isteach, ní i gcónaí an méid céanna"
  body: "Íocann duine amháin an éarlais ar an ionad, ceannaíonn duine eile an císte, agus cuireann tríú duine bronntanas an ghrúpa ar a gcárta féin. Tagann roinnt aíonna chuig gach rud agus tagann roinnt chuig an dinnéar amháin. Is jab nár chuir aon duine isteach air é cuntas cothrom a choinneáil de sin i snáithe comhrá. Coinníonn grúpa Side Badger an lot, pé meascán méideanna atá ann, agus taispeánann sé do gach duine cad atá dlite acu nó dlite dóibh. Féach [conas a oibríonn sé](page:how-it-works) le haghaidh na mbunrudaí, nó léigh ar aghaidh le haghaidh imeachta."
sections:
  - heading: "Déanaigí cinneadh le chéile"
    body: "Sula mbogann aon airgead, cuir an rogha chun **vótála**. Cuir suas le 10 rogha leis, mar dhá ionad nó trí smaoineamh bronntanais, agus lig do gach duine vótáil. Is féidir leat a cheilt cé a vótáil ar cad, ionas go bhfaigheann gach rogha éisteacht chothrom, agus taispeántar an buaiteoir nuair a dúntar an vóta. Ní gá d'aon duine scrollú ar ais trí daichead teachtaireacht chun a fháil amach cad a socraíodh."
  - heading: "Cé atá istigh do cad"
    body: "Ní íocann gach duine mar a chéile, agus ní bhíonn gach duine páirteach i ngach costas. Roinn costas go cothrom, de réir céatadáin nó de réir **suimeanna cruinne**, ionas gurb é sciar gach duine an figiúr a d'aontaigh sibh. Fág amach aon duine nach raibh páirteach, mar na haíonna a scipeáil an dinnéar nó na cairde nár chuaigh isteach sa bhronntanas. Tá duine amháin ag íoc as gach costas, agus tá a sciar dlite ag gach duine eile sa roinnt don duine sin. Tá na sonraí ar an leathanach [roinn costais](page:feature/split-expenses)."
  - heading: "Coinnigh an páipéarachas"
    body: "Cuir nótaí le costas, mar cad a chlúdaigh an costas. Fanann tráchtanna **in aice leis an gcostas** a bhfuil siad faoi, mar sin tá an cheist “an raibh an císte £45 nó £54?” agus a freagra san áit chéanna. Is féidir le tráchtanna a bheith 500 carachtar ar fad, rud atá go leor do cheist faoi éarlais."
  - heading: "Rialuithe don eagraí"
    body: "Ligeann comhoibriú oscailte d'aon bhall costais a chur leis agus a chur in eagar, rud atá ceart go leor do bhronntanas beag. Do bhainis nó do chóisir níos mó, roghnaigh an réamhshocrú **Grúpa bainistithe**. Ceadaíonn riarthóirí gach ball nua, agus ní féidir ach le cruthaitheoirí agus riarthóirí costais a athrú. Tabhair cuireadh do dhaoine le nasc nó cód QR; le ceadú ar siúl, ligeann riarthóir gach duine isteach, mar sin fanann liosta na n-aíonna ina liosta na n-aíonna. Nuair a bhíonn an t-imeacht thart, glasáil an grúpa ionas go bhfanann na huimhreacha mar atá."
  - heading: "Socraigh tar éis na cóisire"
    body: "Nuair a bhíonn an sonrasc deireanach isteach, taispeánann na hiarmhéideanna **cé atá i bhfiacha le cé**, agus molann Side Badger liosta gearr íocaíochtaí a shocraíonn gach duine. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht sa ghrúpa. Ní bhogann Side Badger airgead riamh, mar sin coinníonn an grúpa an cuntas agus tarlaíonn na haistrithe i d'aipeanna baincéireachta féin. Taispeánann an leathanach [socraigh suas](page:feature/settle-up) conas a éiríonn praiseach ina liosta gearr."
