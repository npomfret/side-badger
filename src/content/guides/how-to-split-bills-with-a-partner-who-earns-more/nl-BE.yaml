faq:
  heading: "Vragen"
  items:
    - q: "Gebruiken we best brutoloon of nettoloon?"
      a: "Dat beslist de groep. Nettoloon is gebruikelijk, want het is het geld dat je echt kunt uitgeven. Brutoloon negeert het feit dat belastingen, pensioenbijdragen en leningaflossingen verschillende bedragen van verschillende lonen afnemen. Welke je ook kiest, gebruik dezelfde maatstaf voor jullie allebei."
    - q: "Ziet Side Badger onze inkomens?"
      a: "Nee. Je voert enkel percentages in, nooit lonen. De percentages zijn zichtbaar voor de leden van de groep, en voor een koppel zijn dat jullie tweeën."
    - q: "Kunnen we 62/38 één keer voor alles instellen?"
      a: "De verdeling wordt per uitgave ingesteld, niet per groep. Kopieer een uitgave die al 62 en 38 heeft en wijzig wat anders is. [Uitgaven verdelen](page:feature/split-expenses) behandelt de andere opties."
