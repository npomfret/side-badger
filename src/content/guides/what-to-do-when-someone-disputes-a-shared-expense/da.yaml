faq:
  heading: "Spørgsmål"
  items:
    - q: "Kan jeg stille spørgsmål til kun min andel?"
      a: "Nej. Et spørgsmål holder hele udgiften ude, for alle i den. Hvis det kun er fordelingen, der er forkert, er løsningen at rette fordelingen."
    - q: "Hvem kan lukke et spørgsmål?"
      a: "Den, der stillede det, eller en gruppeadministrator. Hvis den, der tilføjede udgiften, ikke er administrator, kan vedkommende ikke lukke det på spørgerens vegne."
    - q: "Sletter en rettelse af en udgift originalen?"
      a: "Nej. Den tidligere version bliver gemt. Hvem der kan redigere, afgøres af gruppens rettigheder, så det er værd at sige det til huset først, fordi saldiene ændrer sig."
