meta:
  title: Lo que Side Badger hace y lo que no
  description: Dividir, saldar cuentas y varias monedas, además de grupos, listas y encuestas. El kit completo y una lista sincera de lo que Side Badger deja fuera.
h1: Lo que hace Side Badger
navLabel: Funciones
lead: Todo lo que hay en la caja, y lo que no.
intro: Este es el kit completo. Dejamos fuera la hoja de cálculo a propósito. Empieza por los tres trabajos que Side Badger hace cada día y luego repasa el resto de la lista y la lista corta de cosas que no hace.
cta:
  heading: ¿Hace lo que necesita tu grupo?
  body: Crea una cuenta gratis y pruébalo primero con un grupo pequeño.
  button: Crear una cuenta gratis
cardsHeading: Los tres trabajos, al detalle
sections:
  - heading: Escaneo de recibos
    body: Haz una foto del recibo y Side Badger rellena el total, la fecha y el lugar para que lo revises. El servicio de IA de Google lee las imágenes de los recibos.
  - heading: Grupos y permisos
    body: Haz un grupo para cada casa, viaje o evento, con hasta 50 personas. Invita a la gente con un enlace o un código QR. En un grupo más grande, convierte a alguien en espectador, que lo ve todo y no cambia nada.
  - heading: Listas y encuestas
    body: Ten la lista de la compra compartida junto a las facturas de la compra. Pon la lista corta de villas a votación, de forma anónima si quieres.
  - heading: Todo lo demás
    items:
      - "**Actualizaciones al momento:** añade un gasto y todo el mundo lo ve enseguida."
      - "**Idiomas:** usa Side Badger en 39 idiomas. Cada persona del grupo puede elegir el suyo."
      - "**Pantalla de inicio:** no hace falta tienda de aplicaciones. Añade Side Badger a tu pantalla de inicio y se abre como una app."
      - "**Comentarios:** ¿has encontrado un error? Cuéntanoslo desde la app y lee allí nuestra respuesta."
  - heading: Lo que Side Badger no hace
    items:
      - "**Mover dinero.** Side Badger nunca toca tu dinero. Pagaos como queráis. Las solicitudes de pago están previstas."
      - "**Repetir facturas.** No hay gastos recurrentes. Copia la factura del mes pasado en dos toques."
      - "**Dividir por artículo.** Un solo pagador por gasto. Divide a partes iguales, por importes exactos o por porcentaje."
      - "**Ofrecer una app nativa.** Funciona en tu navegador. Añádela a tu pantalla de inicio."
      - "**Funcionar sin conexión.** Necesita conexión."
      - "**Enviar avisos por correo o SMS.** Las notificaciones aparecen en la app. Las notificaciones push están previstas."
      - "**Dibujar gráficos o presupuestos.** Lleva la cuenta de quién debe a quién, y ese es todo el truco."
      - "**Iniciar sesión con Google o Apple.** Regístrate con el correo. El inicio de sesión con Google y Apple está previsto."
      - "**Dejar entrar a gente sin cuenta.** Todo el mundo en el grupo necesita una cuenta gratis."
faq:
  heading: Preguntas
  items:
    - q: ¿Puedo pagar a través de Side Badger?
      a: No. Side Badger lleva la cuenta y nunca toca tu dinero. Pagaos como queráis y después registra el pago.
    - q: ¿Hay una app móvil?
      a: No en una tienda de aplicaciones. Side Badger funciona en tu navegador, y puedes añadirlo a tu pantalla de inicio para que se abra como una app.
    - q: ¿Puedo dividir por artículo?
      a: No. Cada gasto tiene un solo pagador, y lo divides a partes iguales, por importes exactos o por porcentaje.
    - q: ¿Funciona sin conexión?
      a: No, necesita conexión.
    - q: ¿Necesita cuenta todo el mundo en el grupo?
      a: Sí. Todo el mundo en el grupo necesita una cuenta gratis, y para registrarse solo hace falta una dirección de correo electrónico.
