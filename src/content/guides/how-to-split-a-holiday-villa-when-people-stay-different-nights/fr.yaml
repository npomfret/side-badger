faq:
  heading: "Questions sur la villa"
  items:
    - q: "Et si quelqu'un annule ?"
      a: "Retirez ses nuits, refaites les calculs et modifiez la dépense de la villa pour que les montants exacts égalent de nouveau le prix. La version précédente est conservée et la modification apparaît dans l'activité du groupe, donc personne ne change un chiffre en douce. Qui peut modifier dépend des permissions du groupe."
    - q: "Celui qui a réservé doit-il payer moins ?"
      a: "C'est au groupe d'en décider. Réserver est une corvée, et les groupes sont divisés sur la question de savoir si elle mérite une remise. Quoi que vous conveniez, mettez-le dans les montants exacts et écrivez-le dans une note sur la dépense, ou dans un commentaire à côté, pour que personne n'ait à se rappeler l'arrangement."
    - q: "Peut-on partager les frais de ménage différemment ?"
      a: "Oui. Saisissez les frais comme une dépense séparée et donnez-leur leur propre partage. Le partage à parts égales convient à un forfait pour toute la maison. Les montants exacts conviennent à un groupe qui veut que les frais suivent aussi les nuits."
