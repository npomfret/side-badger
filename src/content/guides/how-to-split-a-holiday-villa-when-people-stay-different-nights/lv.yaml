faq:
  heading: "Jautājumi par villu"
  items:
    - q: "Ko darīt, ja kāds atsakās?"
      a: "Izņemiet šī cilvēka naktis, pārrēķiniet un rediģējiet villas izdevumu, lai precīzās summas atkal kopā dotu cenu. Iepriekšējā versija tiek saglabāta, un labojums redzams grupas aktivitātē, tāpēc neviens klusām nemaina skaitli. Kurš drīkst rediģēt, atkarīgs no grupas atļaujām."
    - q: "Vai tam, kurš rezervēja, jāmaksā mazāk?"
      a: "Tas jālemj grupai. Rezervēšana ir ņemšanās, un grupas atšķiras, vai par to pienākas atlaide. Par ko arī vienotos, ierakstiet to precīzajās summās un pierakstiet piezīmē pie izdevuma vai komentārā blakus tam, lai nevienam nebūtu jāatceras vienošanās."
    - q: "Vai tīrīšanas maksu var sadalīt citādi?"
      a: "Jā. Ievadiet maksu kā atsevišķu izdevumu un dodiet tam savu sadali. Vienādi der fiksētai maksai par visu māju. Precīzas summas der grupai, kas grib, lai arī maksa seko naktīm."
