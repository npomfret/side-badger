faq:
  heading: "Kérdések"
  items:
    - q: "Ingyenes a kalkulátor?"
      a: "Igen. Ingyenes. Hirdetések nélkül. Napi korlátok nélkül. Fiók sem kell hozzá."
    - q: "Elmenti, amit beírok?"
      a: "Nem. Semmit nem mentünk el, és sehova nem küldünk el. Ha meg akarod őrizni a számokat, használd a Link másolása gombot, és mentsd el valahová a linket."
    - q: "Ki láthatja a linket, amit kimásolok?"
      a: "Bárki, akinél megvan. A számok magában a linkben vannak, a # után, ezért csak azokkal oszd meg, akiknek látniuk kell őket."
    - q: "Mozgat pénzt?"
      a: "Nem. Kiszámolja, ki kinek fizessen, ti pedig fizettek egymásnak, ahogy akartok. A Side Badger sem nyúl soha a pénzedhez. Lásd az [elszámolást](page:feature/settle-up)."
    - q: "Fel tudok osztani egy két pénznemben fizetett utazást?"
      a: "Itt nem, mert egy számításnak egy pénzneme van. Egy csoportban minden pénznemnek külön egyenlege van. Lásd a [több pénznemet](page:feature/multiple-currencies)."
    - q: "Mi van, ha az összegek nem jönnek ki?"
      a: "A kalkulátor ezt jelzi a költség alatt, és addig nem mutat eredményt, amíg ki nem jönnek. A pontos összegeknek ki kell adniuk a végösszeget, a százalékoknak pedig 100-at."
