featuresHeading: "A funkciók, amelyeket egy pár használ"
faq:
  heading: "Kérdések"
  items:
    - q: "Beállíthatjuk egyszer a 60/40-et mindenre?"
      a: "Nem. A felosztás költségenként külön van. Állítsd be a százalékokat az elsőn, aztán másold le legközelebb, és változtasd meg, ami más. A [költségek felosztása](page:feature/split-expenses) mind a három felosztási módot bemutatja."
    - q: "Kapcsolódik a bankunkhoz?"
      a: "Nem. A Side Badger sosem nyúl a pénzedhez. Fizettek egymásnak, ahogy akartok, aztán rögzítitek, ahogy az [elszámolás](page:feature/settle-up) elmagyarázza."
    - q: "Láthatja valaki más a csoportunkat?"
      a: "Csak a tagjai, és egy pár csoportjának kettő van. Aki érvényes meghívó linket használ, csatlakozhat, ezért egyetlen embernek add oda, és adj neki rövid lejáratot."
    - q: "Mi van, ha mindketten fizettünk egy részt ugyanabból a számlából?"
      a: "Egy költségnek egy fizetője van. Rögzíts két költséget, egyet-egyet mindkettőtöknek, és az egyenleg ugyanúgy jön ki."
    - q: "Emlékeztetni fogja a páromat a fizetésre?"
      a: "Nem. Emlékeztetők nincsenek, így a noszogatás továbbra is rád marad. Legalább mindketten ugyanazt a számot nézitek."
    - q: "Mi történik, ha abbahagyjuk a költségek közös viselését?"
      a: "Számoljatok el, és rögzítsétek a kifizetést, hogy senki ne tartozzon semmivel. Aztán egy adminisztrátor zárolhatja a csoportot, ami úgy tartja a számokat, ahogy vannak, vagy végleg bezárhatja, amitől mindenki számára elérhetetlenné válik. Csak akkor zárd be, ha egyikőtöknek sincs szüksége az előzményekre."
