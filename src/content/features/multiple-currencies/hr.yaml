sections:
  - heading: "Jedna valuta za cijelu grupu"
    body: "Ako grupa o tome radije ne misli, odaberi valutu grupe i obrazac u nju pretvara svaki novi trošak, po tečaju koji i dalje vidiš i možeš promijeniti. To vrijedi samo za nove i kopirane troškove. Uređivanja i postojeći troškovi ostaju kakvi jesu, pa se ništa već zabilježeno ne mijenja ispod tebe."
  - heading: "Duguješ eure, plaćaš u funtama"
    body: "Plaćeno u jenima, a poravnavaš u funtama? U redu. Kad bilježiš uplatu, možeš je također pretvoriti, pa tko duguje eure može platiti u funtama, a stanje u eurima i dalje izlazi točno. Platite si kako god želite, a zatim zabilježite."
  - heading: "Pravila za grupu"
    body: "Ograniči grupu na valute koje stvarno koristite i postavi zadanu da se obrazac otvara na pravoj. Odmor u Portugalu ne treba 139 drugih opcija uz račun za večeru, a [vjenčanje u inozemstvu](page:use-case/events-and-celebrations) vjerojatno treba dvije."
limits:
  heading: "Ograničenja"
  items:
    - "Tečaj se utvrđuje kad se trošak spremi. Stari troškovi se nikad ne revaloriziraju."
    - "Side Badger dohvaća aktualni tečaj gdje može. Nije svaki par zajamčen, a tečaj uvijek možeš upisati sam."
    - "Automatska pretvorba u grupi vrijedi samo za nove i kopirane troškove, ne za uređivanja ni postojeće troškove."
    - "Svaki trošak ograničen je na 999.999,99 u svojoj valuti."
    - "Postoji 140 valuta. Kriptovalute i metali nisu među njima."
    - "Side Badger bilježi uplate. Nikad ne premješta ni ne mijenja novac."
useCasesHeading: "Gdje ovo pomaže"
faq:
  heading: "Pitanja"
  items:
    - q: "Koji tečaj koristite?"
      a: "Aktualni tečaj, dohvaćen pri unosu troška gdje je dostupan. Možeš ga promijeniti u onaj koji je vrijedio pri zamjeni i pretvoreni iznos se ažurira."
    - q: "Revaloriziraju li se stari troškovi?"
      a: "Ne. Tečaj se utvrđuje kad se trošak spremi, pa stanje ne odlazi samo zato što se tržište pomaknulo."
    - q: "Podržavate li kripto?"
      a: "Ne. Postoji 140 valuta, a kriptovalute nisu među njima."
    - q: "Zašto ne mogu unijeti 2.000.000 indonezijskih rupija?"
      a: "Svaki trošak ograničen je na 999.999,99 u svojoj valuti. Unesi ga u drugoj valuti i pretvori ili ga podijeli na dva troška."
    - q: "Košta li pretvorba išta?"
      a: "Ne. Pretvorba je besplatna, kao i ostatak Side Badgera. Vidi [cjenik](page:pricing)."
    - q: "Moram li pretvarati?"
      a: "Ne. Valute ostaju zasebne osim ako ti ili tvoja grupa odlučite pretvarati, a svaka valuta ima vlastiti kratak popis uplata."
