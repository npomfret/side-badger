meta:
  title: "Roinn billí le do pháirtí, 50/50 nó de réir ioncaim | Side Badger"
  description: "Roinn na costais leadránacha gan oíche amach a iompú ina athbhreithniú airgeadais ráithiúil. Roinn 50/50, de réir ioncaim nó bille ar bhille, agus féach cé atá i bhfiacha le cé. Saor in aisce."
h1: "Roinn costais mar lánúin, go cothrom"
navLabel: "Lánúineacha"
lead: "Roinn na costais leadránacha gan oíche amach a iompú ina athbhreithniú airgeadais ráithiúil. Coinníonn Side Badger aon chuntas reatha amháin den chíos, na billí agus an tsiopadóireacht do **lánúineacha** a roinneann teach, tolg agus cuimhne doiléir ar cé a d'íoc as an leathanbhanda. Roinn 50/50, de réir ioncaim nó bille ar bhille, agus féach cé atá i bhfiacha le cé."
cta:
  heading: "Tosaigh grúpa don bheirt agaibh"
  body: "Cruthaigh cuntas, déan grúpa agus seol an nasc cuiridh chuig do pháirtí. Is féidir leis an mbéile beir leat anocht a bheith ar an gcéad chostas."
scenario:
  heading: "Ní gá go gciallódh cothrom 50/50"
  body: "Roinneann Sam agus Alex teach. Tuilleann Sam níos mó, mar sin d'aontaigh siad go mbeadh 60% den chíos ar Sam agus 40% ar Alex. Íocann Sam leis an tiarna talún, déanann Alex an tsiopadóireacht, agus tá an bheirt acu measartha cinnte go n-éiríonn gach rud cothrom ar deireadh. Is é “measartha cinnte” an chaoi a n-éiríonn nóta ar fhón duine ina dhíospóid bhuan. Mar sin déan grúpa don bheirt agaibh, roghnaigh an t-ainm is mian leat a bheith feicthe ag do pháirtí, agus seol an nasc cuiridh nó an cód QR chuig an duine sin. Cuir gach costas leis nuair a tharlaíonn sé, abair cé a d'íoc agus conas a roinntear é, agus lig don ghrúpa an cuntas a choinneáil. Déan grúpa ar leith do gach saoire (féach [turais ghrúpa](page:use-case/group-trips)), ionas go bhfanann na heitiltí amach as na hearraí grósaera."
sections:
  - heading: "50/50, de réir ioncaim, nó bille ar bhille"
    body: "Níl aon roinnt ann atá cothrom go huilíoch, ach amháin an ceann a aontaíonn an bheirt agaibh, go hidéalach roimh an gcéad bhille seachas tar éis na chéad osna. Seo na trí cheann is coitianta."
    items:
      - "**50/50.** Roghnaigh **Cothrom** agus tá leath dlite ag gach duine agaibh. Oireann sé do chostais chomhroinnte nuair atá bhur n-ioncam gar dá chéile, agus ní theastaíonn aon uimhríocht uaidh."
      - "**De réir ioncaim.** Má thuilleann duine agaibh níos mó, roinn de réir sciar gach duine den airgead atá ag teacht isteach. Aontaigh ar dtús cad a chomhaireamh (is é pá glan an rogha coitianta), cuir an dá cheann le chéile agus roinn do cheann féin ar an iomlán. Má thógann duine agaibh trí chuid abhaile in aghaidh dhá chuid an duine eile, sin 3 ÷ (3 + 2) = 60%, mar sin clúdaíonn duine agaibh 60% agus an duine eile 40%. Cruinnigh go céatadáin iomlána agus cuir isteach iad faoi **Céatadán**, áit a gcaithfidh siad suim go 100. Níl aon áit chun do phá a chur isteach, mar sin ní chlóscríobhann tú ach na céatadáin."
      - "**Bille ar bhille.** Tá a roinnt féin ag gach costas, mar sin is féidir leat meascadh: cíos de réir ioncaim, earraí grósaera 50/50, agus bronntanas comhroinnte de réir **Méideanna cruinne** más rud é gur roghnaigh gach duine agaibh cé mhéad a chur isteach."
      - "**Nuair a athraíonn pá,** úsáid na céatadáin nua ón gcéad chostas eile. Coinníonn costais níos luaithe an roinnt lenar cuireadh isteach iad. Chun na suimeanna a fheiceáil á ndéanamh le duillíní pá fíora, léigh [conas billí a roinnt le páirtí a thuilleann níos mó](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "An cuntas míosúil"
    body: "Uair sa mhí, nó aon uair a thosaíonn na huimhreacha ag tochas, oscail an grúpa agus seiceáil **Iarmhéideanna**. Le beirt agaibh, níl ach íocaíocht amháin ann i ngach airgeadra, ón duine atá i bhfiacha chuig an duine a bhfuil an t-airgead dlite dó. Tóg mí Sam agus Alex mar shampla. D'íoc Sam an cíos £1,500, agus is é £600 sciar 40% Alex de. D'íoc Alex £90 as earraí grósaera, roinnte go cothrom, mar sin is é £45 leath Sam. Cuireann Side Badger ceann i gcoinne an chinn eile, £600 lúide £45, agus íocann Alex £555 le Sam. Íoc é mar is mian leat, trí aistriú bainc, in airgead tirim nó le fabhar atá dlite, ansin taifead é faoi **Socraigh** ionas go dtéann an t-iarmhéid ar ais go nialas. Ní dhéantar billí a athrá, mar sin cóipeáil cíos na míosa seo caite, athraigh an dáta agus lean ort. Ní bhogann Side Badger an t-airgead ná ní sheolann sé meabhrúcháin, mar sin is leatsa an priocadh fós."
  - heading: "Díreach an bheirt agaibh"
    body: "Tá beirt bhall i ngrúpa de bheirt, agus ní féidir ach le baill grúpa é a fheiceáil. Téann do pháirtí isteach leis an nasc cuiridh nó an cód QR. Is féidir le nasc maireachtáil aon áit ó 15 nóiméad go 5 lá, mar sin roghnaigh an ceann is giorra a thugann am do do pháirtí é a úsáid. Ní chuireann nasc nua na cinn eile ar ceal, mar sin ná fág iad i gcomhrá a bhfuil daoine eile ann. Is féidir le duine ar bith a úsáideann nasc beo dul isteach, mar sin más mian leat a bheith cinnte, cas ar cheadú agus ligeann riarthóir gach duine isteach. Teastaíonn cuntas dá chuid féin ó do pháirtí, atá saor in aisce."
