faq:
  heading: "Pitanja"
  items:
    - q: "Je li Side Badger besplatna alternativa Splitwiseu?"
      a: "Za dijeljenje računa u grupi, da. Skeniranje računa, pretvorba valuta i izostanak oglasa besplatni su, bez dnevnih ograničenja. Ako ti trebaju izvorna aplikacija, rad izvan mreže, ponavljajući troškovi ili plaćanje unutar aplikacije, to Splitwise radi, a Side Badger ne."
    - q: "Odakle potječu podaci o Splitwiseu?"
      a: "Sa Splitwiseovih stranica: njegove početne stranice, stranice Pro i centra za pomoć. Svaki redak tablice vodi na stranicu iz koje potječe, a datum iznad tablice kaže kada smo ih pročitali. Provjeravamo ih svako tromjesečje."
    - q: "Hoće li Side Badger ostati besplatan?"
      a: "Sve u Side Badgeru danas je besplatno i nema plaćene razine. Ako se to ikad promijeni, prvo ćemo te obavijestiti. [Stranica s cjenikom](page:pricing) ima pojedinosti."
    - q: "Moraju li svi u mojoj grupi prijeći?"
      a: "Da. Svatko u grupi treba besplatan korisnički račun za Side Badger, a može se pridružiti poveznicom ili QR kodom."
    - q: "Ima li Side Badger mobilnu aplikaciju?"
      a: "Ne u trgovini aplikacijama. Radi u pregledniku: prijavi se na telefonu, a zatim ga dodaj na početni zaslon da se otvara kao aplikacija. [Kako radi](page:how-it-works) pokazuje kako."
