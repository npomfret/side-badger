sections:
  - heading: "돈 이야기는 돈 옆에서"
    body: "공동 비용에는 수다와 의문, 계획이 따라붙기 마련이에요. 사이드 배저는 이 셋을 숫자 옆에 두어서, 채팅을 위로 올려 뒤질 필요가 없어요."
    items:
      - "**댓글은 있어야 할 자리에.** 그룹 자체에도, 지출, 목록, 투표 어디에든 댓글을 달고 대화를 해당 항목 옆에 두세요."
      - "**영수증과 사진.** 지출마다 영수증을 최대 세 장까지 보관하고, 그룹, 목록, 투표의 댓글에는 사진이나 PDF를 붙일 수 있어요."
      - "**다툼 대신 질문.** 관리자가 질문을 켜 두면 지출에 포함된 누구든 그 지출에 대해 질문할 수 있어요. 해결될 때까지는 잔액에 반영되지 않아요."
      - "**목록과 투표.** 공동 장보기 목록을 장보기 비용 옆에 두고, 빌라 후보는 투표로 정하세요. 원하면 익명으로도 할 수 있어요."
      - "**박수 한 번.** 지출, 결제, 댓글에 반응을 남기고, 결제가 들어오면 축하해 주세요."
  - heading: "우리 그룹, 우리 규칙"
    body: "Splitwise 도움말 센터에는 그룹 관리자나 특별 권한을 지원하지 않는다고 나와 있어요. 사이드 배저에는 역할과 권한이 있어요. 숫자를 깔끔하게 챙겨 줄 사람이 필요한 그룹을 위해서요."
    items:
      - "**관리자, 멤버, 뷰어.** 누군가를 뷰어로 지정하면 모든 걸 볼 수 있지만 아무것도 바꿀 수 없어요."
      - "**사전 설정 두 가지, 또는 직접 설정.** 공개 협업이나 관리 그룹으로 시작하거나, 권한을 하나하나 직접 정하세요. 누가 지출을 수정하고 삭제하는지, 목록을 수정하는지, 초대하고 새 사람을 받아들이는지요."
      - "**참여 승인.** 승인을 켜 두면 관리자가 한 명씩 들여보내요."
      - "**그룹만의 설정.** 실제로 쓰는 통화만 쓰도록 제한하고, 기본 통화를 고르고, 헤더 이미지를 넣을 수 있어요."
      - "**끝나면 잠그세요.** 관리자가 잠금을 풀 때까지 숫자는 그대로 있어요."
  - heading: "여기선 무료, 저기선 유료"
    body: "Splitwise Pro는 Splitwise의 유료 요금제이고, Splitwise의 Pro 페이지는 사이드 배저에서는 무료인 세 가지를 내세워요."
    items:
      - "**영수증 스캔.** Splitwise Pro는 영수증 사진을 스캔해요. 사이드 배저는 스캔 크레딧 없이 무료로 해 주고, 합계, 날짜, 장소를 채워 줄 테니 확인만 하면 돼요."
      - "**통화 환산.** Splitwise Pro는 “변환” 버튼을 누르면 그룹의 지출을 기본 통화로 환산해요. 사이드 배저는 지출을 입력할 때마다 현재 환율이나 실제로 적용받은 환율로 환산하고, 원래 금액은 지출에 그대로 남아요."
      - "**일일 한도 없음.** Splitwise Pro는 무제한 지출을 내세우고, 도움말 센터에는 무료 사용자가 하루에 최대 4건의 지출을 추가할 수 있다고 나와 있어요. 사이드 배저에는 일일 한도가 없어요."
  - heading: "은행은 빼고 갑니다"
    body: "사이드 배저는 은행에 연결하지 않고 은행 정보도 요구하지 않아요. 누가 누구에게 얼마를 빚졌는지 기록만 하고, 결제는 원하는 방법으로 서로 한 다음 기록하면 됩니다. 은행 로그인을 넘겨줄 일이 없으니 신경 쓸 것도 하나 줄죠."
  - heading: "하나의 앱, 브라우저에서도 휴대폰에서도"
    body: "사이드 배저는 브라우저에서 실행돼요. 로그인한 다음 홈 화면에 추가하면 앱처럼 열려요. 어느 쪽이든 같은 앱이라서, 새 기능은 다음에 앱을 열 때 휴대폰에 바로 나타나고, 앱 스토어 업데이트를 기다릴 필요가 없어요."
  - heading: "그리고 깜짝 장기 몇 가지"
    items:
      - "**어시스턴트에게 물어보세요.** 사이드 배저는 ChatGPT, Claude와 함께 작동해요. 지출 추가, 영수증 스캔, 결제 기록을 어시스턴트에게 시켜 보세요."
      - "**각자 자기 언어로.** 사이드 배저는 39개 언어를 지원하고 각자 원하는 언어를 골라요. Splitwise 홈페이지에는 7개 이상이라고 나와 있어요. 통화도 133개를 다뤄서, 어디든 가는 여행에 딱이에요."
      - "**앱을 떠나지 않고 받는 도움.** 막히거나 버그를 발견했나요? 앱에서 알려 주시면 답변도 바로 거기서 읽을 수 있어요."
  - heading: "그래도 Splitwise가 나은 점"
    body: "나중에 알게 되는 것보다 처음부터 맞는 앱을 고르는 편이 낫잖아요. 그룹에 아래 중 하나가 필요하다면 Splitwise에는 있고 사이드 배저에는 없어요."
    items:
      - "**앱 스토어 앱.** 사이드 배저는 브라우저와 홈 화면에서 쓰는 서비스라 앱 스토어에는 없어요."
      - "**오프라인 모드.** 사이드 배저는 인터넷 연결이 필요해요."
      - "**앱 안에서의 결제.** 일부 국가에서는 Splitwise가 돈도 옮길 수 있어요. 사이드 배저는 기록만 해요."
      - "**지분별 또는 품목별 분할.** 사이드 배저는 지출 하나에 결제자가 한 명이고, 똑같이, 정확한 금액으로, 또는 비율로 나눕니다. 영수증 스캔은 품목을 사람에게 배정하지 않아요."
      - "**차트와 기본 분할.** Splitwise Pro에는 둘 다 있어요. 사이드 배저는 누가 누구에게 빚졌는지 세어 두는 게 전부예요. 그게 이 서비스의 묘수죠."
  - heading: "그룹 옮기기"
    body: "가져오기 기능이 없으므로 옮긴다는 건 새로 시작한다는 뜻이에요. 먼저 Splitwise에서 정산을 마친 다음, 사이드 배저에서 그룹을 만들고 링크나 QR 코드로 모두를 초대하세요. 그룹의 모든 사람에게 무료 계정이 필요하며, 가입에는 이메일 주소만 있으면 돼요."
table:
  heading: "나란히 비교"
  caption: "{date} 기준 Splitwise 세부 내용, Splitwise 자체 페이지에서 가져왔어요."
