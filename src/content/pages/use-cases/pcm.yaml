meta:
  title: "Side Badger for housemates, trips and parties"
  description: "Share money with housemates, for group trips, and for parties, weddings and group gifts. See wetin Side Badger dey do for each kind of group."
h1: "Side Badger for your kind of group"
navLabel: "Use cases"
lead: "Housemates, holidays, hen dos. Pick your own wahala, then see how group like yours dey keep count."
intro: "Every group dey share money small-small different. Dis pages follow one **realistic scenario** from di first expense to di last payment wey dem record, with di sums for show, so you fit see wetin your own group go end with."
cta:
  heading: "You don see your kind of group?"
  body: "Create account, start group and add di first expense. E go take small minutes."
  button: "Create free account"
cardsHeading: "Pick di situation wey close pass to yours"
sections:
  - heading: "Group trips"
    body: "Flights for pounds, villa for euros and dinner wey only three people chop. Set di group make e convert to pounds and four friends for Lisbon go finish with three payments, instead of six when di currencies dey separate. [Share group trip costs](page:use-case/group-trips)."
  - heading: "Housemates"
    body: "One person dey pay di landlord, another person remember di light bill, and nobody agree who buy di toilet roll. With rent wey dem share by room size and di other bills wey dem share equal-equal, four housemates go end di month with three payments, all to di one wey pay di rent. [Share household bills with housemates](page:use-case/housemates)."
  - heading: "Parties, weddings and group gifts"
    body: "Six people vote for di gift, one person buy am, and not everybody put di same amount. £150 gift wey dem share by exact amounts leave five payments to di person wey buy am, £120 in all. [Share di costs of an event](page:use-case/events-and-celebrations)."
  - heading: "Couples"
    body: "Share di boring costs without turning date night to quarterly money meeting. Rent wey dem share 60/40 and groceries wey dem share equal-equal go net down to one payment between una two."
  - heading: "See how e dey work first"
    body: "Every example wey dey above use di same steps, from creating group to recording di payments. [How e dey work](page:how-it-works) go show you, and [pricing](page:pricing) talk how much e cost, wey be nothing, with no ads and no daily limits."
faq:
  heading: "Questions"
  items:
    - q: "Everybody for di group need account?"
      a: "Yes. People dey join with link or QR code and free account."
    - q: "Side Badger fit collect di money?"
      a: "No. You go pay anyhow you like, then record di payment so di balances go correct."
    - q: "I must pick one kind of group?"
      a: "No. Di use cases na examples, no be settings. Every group get di same features, so use whichever combination fit you."
