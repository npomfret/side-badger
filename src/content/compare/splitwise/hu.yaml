faq:
  heading: "Kérdések"
  items:
    - q: "A Side Badger ingyenes alternatíva a Splitwise-hoz?"
      a: "Számlák csoportos felosztására igen. A nyugtaszkennelés, a pénznemátváltás és a hirdetésmentesség ingyenes, napi korlátok nélkül. Ha natív alkalmazásra, offline használatra, ismétlődő költségekre vagy alkalmazáson belüli fizetésre van szükséged, azokat a Splitwise tudja, a Side Badger nem."
    - q: "Honnan származnak a Splitwise adatai?"
      a: "A Splitwise saját oldalairól: a kezdőlapjáról, a Pro-oldaláról és a súgóközpontjából. A táblázat minden sora arra az oldalra mutat, ahonnan származik, a táblázat feletti dátum pedig megmondja, mikor olvastuk el őket. Negyedévente ellenőrizzük őket."
    - q: "Ingyenes marad a Side Badger?"
      a: "A Side Badgerben ma minden ingyenes, és nincs fizetős szint. Ha ez valaha változna, előre szólunk. A részleteket az [árak](page:pricing) oldalon találod."
    - q: "Mindenkinek át kell állnia a csoportomban?"
      a: "Igen. A csoport minden tagjának kell egy ingyenes Side Badger-fiók, és linkkel vagy QR-kóddal csatlakozhatnak."
    - q: "Van a Side Badgernek mobilalkalmazása?"
      a: "Alkalmazásboltban nincs. A böngésződben fut: jelentkezz be a telefonodon, aztán add hozzá a kezdőképernyődhöz, hogy úgy nyíljon meg, mint egy alkalmazás. A [hogyan működik](page:how-it-works) megmutatja, hogyan."
