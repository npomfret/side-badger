      sideBadger: Günlük sınır yok.
      source: pro-help
    - feature: Grup rolleri ve izinler
      other: Yardım merkezi, grup yöneticilerini ya da özel izinleri desteklemediğini söylüyor.
      sideBadger: Yöneticiler, üyeler ve izleyiciler. İki şablon ya da kendi izinleriniz, katılmak için onay ve iş bitince bir kilit.
      source: permissions-help
    - feature: Makbuz tarama
      other: Bir Pro özelliği. Bir makbuzun fotoğrafını tarar ve Pro'nun kalem kalem bölme özelliği kalemleri kişilere atamanıza izin verir.
