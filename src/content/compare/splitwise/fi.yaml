faq:
  heading: Kysymyksiä
  items:
    - q: Onko Side Badger ilmainen vaihtoehto Splitwiselle?
      a: "Laskujen jakamiseen ryhmässä, kyllä. Kuittien skannaus, valuuttojen muunnos ja mainoksettomuus ovat ilmaisia, eikä päivittäisiä rajoja ole. Jos tarvitset natiivisovelluksen, offline-käyttöä, toistuvia kuluja tai maksuja sovelluksen sisällä, Splitwise tekee ne eikä Side Badger."
    - q: Mistä Splitwisen tiedot ovat peräisin?
      a: "Splitwisen omilta sivuilta: sen etusivulta, Pro-sivulta ja ohjekeskuksesta. Jokainen taulukon rivi linkittää sivuun, josta se on peräisin, ja taulukon yläpuolella oleva päivämäärä kertoo, milloin luimme ne. Tarkistamme ne neljännesvuosittain."
    - q: Pysyykö Side Badger ilmaisena?
      a: "Kaikki Side Badgerissa on tänään ilmaista, eikä maksullista tasoa ole. Jos se joskus muuttuu, ilmoitamme siitä ensin. [Hinnoittelusivulla](page:pricing) on lisätietoja."
    - q: Pitääkö kaikkien ryhmässäni vaihtaa?
      a: "Kyllä. Jokainen ryhmässä tarvitsee ilmaisen Side Badger -tilin, ja he voivat liittyä linkillä tai QR-koodilla."
    - q: Onko Side Badgerilla mobiilisovellusta?
      a: "Ei sovelluskaupassa. Se toimii selaimessa: kirjaudu sisään puhelimella ja lisää se sitten aloitusnäytölle, jolloin se avautuu kuin sovellus. [Näin se toimii](page:how-it-works) näyttää, miten."
