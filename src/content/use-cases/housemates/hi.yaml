faq:
  heading: "सवाल"
  items:
    - q: "क्या किराया अपने आप दोहराया जा सकता है?"
      a: "नहीं, दोहराए जाने वाले बिल नहीं हैं। पिछले महीने का किराया कुछ टैप में कॉपी करें, तारीख बदलें और काम हो गया।"
    - q: "क्या हम कमरे के आकार से बांट सकते हैं?"
      a: "हाँ, प्रतिशत से। हर रूममेट को उसके कमरे के हिसाब से एक हिस्सा दें, बस हिस्सों का जोड़ 100 होना चाहिए। बांटने के बाकी तरीकों के लिए [खर्च बांटना](page:feature/split-expenses) देखें।"
    - q: "अगर कोई रूममेट पैसे देने बाकी रहते हुए घर छोड़ दे तो?"
      a: "वे ग्रुप तब तक नहीं छोड़ सकते जब तक हिसाब चुकता न हो, क्योंकि जिसका कुछ देना या पाना बाकी है वह ग्रुप नहीं छोड़ सकता। संख्याएं तब तक ईमानदार रहती हैं जब तक सबका हिसाब बराबर न हो जाए।"
    - q: "क्या Side Badger बिल भरता है?"
      a: "नहीं। यह हिसाब रखता है और पेमेंट की एक छोटी सूची सुझाता है। आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं, फिर उसे रिकॉर्ड करते हैं, जैसा [हिसाब चुकता करना](page:feature/settle-up) समझाता है।"
    - q: "क्या एक रूममेट हिसाब-किताब रख सकता है?"
      a: "हाँ। उसे एडमिन बनाएं और मैनेज्ड ग्रुप इस्तेमाल करें, जहां नए सदस्यों को मंज़ूरी चाहिए और सिर्फ क्रिएटर और एडमिन खर्च बदल सकते हैं।"
