meta:
  title: "Κοινές λίστες, ψηφοφορίες και σχόλια για έξοδα | Side Badger"
  description: "Σχολιάστε έξοδα, αμφισβητήστε το περίεργο, κρατήστε κοινή λίστα ψωνιών και ψηφίστε τη βίλα. Σχεδιάστε μαζί και μετά χωρίστε. Δωρεάν, χωρίς διαφημίσεις."
h1: "Σχεδιάστε το μαζί, χωρίστε το μετά"
navLabel: "Σχεδιάστε μαζί"
lead: "Η λίστα των ψωνιών και ο λογαριασμός των ψωνιών, επιτέλους ξαναμιλιούνται. Το Side Badger δίνει στην ομάδα σας ένα μέρος να μιλά για τα χρήματα πριν και αφού ξοδευτούν, με σχόλια σε κάθε έξοδο, έναν τρόπο να αμφισβητείτε όσα φαίνονται λάθος, κοινές λίστες και ψηφοφορίες για τις μεγάλες αποφάσεις. Μετά [χωρίζετε τα έξοδα](page:feature/split-expenses) όπως πάντα."
cta:
  heading: "Σχεδιάστε το, μετά χωρίστε το"
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα και βάλτε την πρώτη λίστα, ψηφοφορία ή ερώτηση ακριβώς δίπλα στα χρήματα. Δεν ξέρετε τι ακολουθεί; Δείτε [πώς λειτουργεί](page:how-it-works)."
problem:
  heading: "Η συνομιλία είναι εδώ, ο λογαριασμός εκεί"
  body: "Τα έξοδα μιας ομάδας συνήθως ζουν σε δύο μέρη. Οι αριθμοί είναι στο ένα και ο καβγάς για τους αριθμούς σε μια συνομιλία που κύλησε προς τα πάνω και χάθηκε την Τρίτη. Η λίστα των ψωνιών είναι μια φωτογραφία ενός ψυγείου. Τη βίλα την αποφάσισαν οι περισσότεροι με έναν αντίχειρα προς τα πάνω, μάλλον. Το Side Badger κρατά τον σχεδιασμό μέσα στην ομάδα, δίπλα στα έξοδα που αφορά, οπότε υπάρχει ένα σχόλιο εκεί που είναι το κόστος, μια λίστα εκεί που είναι τα ψώνια, μια ψηφοφορία για τη μεγάλη απόφαση και ένας τρόπος να πείτε «μισό λεπτό, αυτό είναι σωστό;» χωρίς να γράψετε παράγραφο. Όλα μένουν γύρω από τα χρήματα της ομάδας, που είναι άλλωστε ο λόγος ύπαρξης της ομάδας."
workflow:
  heading: "Από την ψηφοφορία για τη βίλα ως τον λογαριασμό των ψωνιών"
  steps:
    - title: "Βάλτε τη μεγάλη απόφαση σε ψηφοφορία"
      body: "Προσθέστε μια ψηφοφορία για την απόφαση που ορίζει τον λογαριασμό, όπως ποια βίλα. Διαλέξτε δύο έως δέκα επιλογές, πείτε πόσες ψήφους έχει ο καθένας και κλείστε την όταν έχουν ψηφίσει όλοι και ο νικητής σημειώνεται."
      shot: S17
      shotAlt: "Μια κλειστή ψηφοφορία με σημειωμένη τη νικήτρια επιλογή και τον αριθμό των ψήφων δίπλα σε κάθε επιλογή"
    - title: "Γράψτε μαζί τη λίστα των ψωνιών"
      body: "Ξεκινήστε μια κοινή λίστα, προσθέστε τα είδη και τσεκάρετέ τα καθώς φτάνουν στο καλάθι. Τα ψώνια μπαίνουν μετά ως έξοδο."
      shot: S16
      shotAlt: "Μια κοινή λίστα ψωνιών με μερικά είδη τσεκαρισμένα και μια μέτρηση προόδου"
    - title: "Μιλήστε για το κόστος εκεί που ζει"
      body: "Σχολιάστε το ίδιο το έξοδο, επισυνάψτε την απόδειξη και αντιδράστε με ένα emoji. Η συζήτηση μένει δίπλα στον αριθμό που αφορά."
      shot: S08
      shotAlt: "Ένα έξοδο με τις λεπτομέρειές του, μια μικρογραφία απόδειξης, ένα νήμα σχολίων και αντιδράσεις emoji"
    - title: "Αμφισβητήστε αυτό που φαίνεται λάθος"
      body: "Αν η ομάδα έχει ενεργοποιήσει τις ερωτήσεις εξόδων, όποιος περιλαμβάνεται σε ένα έξοδο μπορεί να επιλέξει **Έχω μια ερώτηση**. Το έξοδο μένει εκτός υπολοίπων μέχρι να λυθεί η ερώτηση."
      shot: S18
      shotAlt: "Η λίστα εξόδων με ένδειξη Αμφισβητήθηκε και το φίλτρο Μόνο υπό αμφισβήτηση"
    - title: "Δείτε τι άλλαξε και ποιος το άλλαξε"
      body: "Η ροή δραστηριότητας και το καμπανάκι ειδοποιήσεων δείχνουν τι νέο υπάρχει στις ομάδες σας. Οι ειδοποιήσεις push υπάρχουν αν τις θέλετε."
      shot: S19
      shotAlt: "Το αναπτυσσόμενο μενού ειδοποιήσεων με μια λίστα πρόσφατης δραστηριότητας"
