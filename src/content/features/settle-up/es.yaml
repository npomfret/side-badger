meta:
  title: Salda cuentas con menos pagos | Side Badger
  description: Mira quién debe a quién en tu grupo, obtén una lista corta de pagos que deja a todos saldados y registra cada pago según ocurre. Gratis.
h1: Salda cuentas con menos pagos
navLabel: Saldar cuentas
lead: Side Badger lleva un saldo al día para cada persona del grupo y sugiere una lista corta de pagos que lo salda. Vosotros os pagáis como queráis y después lo registráis. Si primero quieres ver cómo se reparten los números, empieza por [dividir gastos](page:feature/split-expenses).
cta:
  heading: ¿Listo para desenredar quién debe a quién?
  body: Crea una cuenta, empieza un grupo y añade el primer gasto. Los saldos se encargan del resto.
  button: Crear una cuenta gratis
problem:
  heading: Saldos que se actualizan sobre la marcha
  body: Cada gasto cambia quién debe a quién, así que Side Badger mantiene los saldos al día según se añaden gastos y pagos. Todo el mundo en el grupo ve un cambio enseguida, y ve qué cambió y quién lo cambió. Los saldos se llevan por moneda, así que los euros y las libras se quedan en sus propias columnas salvo que un gasto se convirtiera al introducirlo. Por defecto ves las deudas que te afectan; **Mostrar todo** enseña las de todo el grupo.
workflow:
  heading: Tres pasos hasta quedar en paz
  steps:
    - title: Mira quién debe a quién
      body: Abre los saldos del grupo para ver lo que debes, lo que te deben y una lista corta de pagos que deja saldado a todo el mundo, calculada por moneda. Los gastos en duda quedan fuera de las cuentas hasta que se aclaran. En el ejemplo de compañeros de piso de abajo, seis pagos se convierten en dos.
      shot: S10
      shotAlt: La pantalla de saldos con las deudas simplificadas en dos monedas y la opción «Mostrar todo» activada
    - title: Paga como quieras y después regístralo
      body: Transferencia bancaria, efectivo, un favor que te deben de las últimas vacaciones. Side Badger no mueve el dinero. Cuando el dinero ha cambiado de manos, registra el pago y el saldo se actualiza para todos.
      shot: S11
      shotAlt: El formulario de pago con botones de liquidación rápida y el aviso que aparece en un pago parcial
    - title: Comprueba que ha llegado
      body: El pago pasa al historial del grupo, donde todo el mundo en el grupo puede verlo y reaccionar con un emoji. Celebra un pago cuando llegue.
      shot: S12
      shotAlt: El historial de pagos con reacciones con emojis en un pago
