meta:
  title: "Kalkulator bagi tagihan: siapa utang ke siapa, beres | Side Badger"
  description: "Siapa bayar, siapa utang, siapa bayar siapa: beres dalam detik. Rata, jumlah pasti, atau persentase. Gratis, di peramban, tak ada yang disimpan atau dikirim."
h1: "Kalkulator bagi tagihan"
navLabel: "Kalkulator bagi tagihan"
lead: "Masukkan siapa membayar apa, dan kalkulator menunjukkan siapa berutang kepada siapa, lengkap dengan daftar pembayaran singkat untuk melunasinya. Kalkulator ini berjalan di peramban Anda, tidak menyimpan apa pun, dan tidak memindahkan uang. Jika grup Anda butuh hitungannya bertahan setelah tab ditutup, fitur [bagi pengeluaran](page:feature/split-expenses) dan [pelunasan](page:feature/settle-up) di Side Badger melakukan hitungan yang sama dan menyimpannya."
cta:
  heading: "Suka hitungannya? Simpan saja."
  body: "Kalkulator ini melupakan semuanya begitu tab ditutup, persis seperti siapa pun yang yakin sekali sudah membayar terakhir kali. Grup di Side Badger menyimpan pengeluaran, memperbarui saldo semua orang, dan mencatat pembayaran. Gratis, tanpa iklan, tanpa batas harian."
sections:
  - heading: "Cara perhitungannya bekerja"
    body: "Untuk setiap pengeluaran, kalkulator menghitung bagian tiap orang. Anda bisa membaginya rata, menurut jumlah pasti, atau persentase, di antara orang yang Anda pilih. Saldo tiap orang adalah jumlah yang mereka bayar dikurangi jumlah yang menjadi tanggungan mereka. Tanda plus berarti grup berutang kepada mereka, dan tanda minus berarti mereka berutang kepada grup. Saldo selalu berjumlah nol, karena berapa pun yang dihutangi seseorang, orang lain yang berutang."
  - heading: "Mengapa daftar pembayarannya singkat"
    body: "Tidak ada yang perlu melunasi tiap struk satu per satu. Setelah semua saldo diketahui, kalkulator memasangkan orang yang paling banyak berutang dengan orang yang paling banyak dihutangi, melunasi sebanyak yang bisa dicakup satu pembayaran, lalu melanjutkan menyusuri daftar sampai semua orang berada di nol. Jumlah pembayarannya tidak pernah melebihi jumlah orang yang punya saldo dikurangi satu, dan sering kali lebih sedikit daripada melunasi tagihan satu per satu. Hasilnya daftar pembayaran yang singkat, tanpa janji menjadi yang paling singkat."
  - heading: "Yang tidak dilakukan kalkulator ini"
    items:
      - "**Menangani lebih dari satu mata uang.** Pilih satu dan pakai untuk seluruh perhitungan. Aplikasi menyimpan saldo terpisah untuk tiap mata uang, dan bisa mengonversi pengeluaran dengan kurs terkini, yang bisa Anda ubah."
      - "**Menyimpan apa pun.** Tutup tab dan angkanya hilang. Untuk menyimpannya, salin tautannya. Tautan itu memuat angka Anda setelah tanda #, yang tidak pernah dikirim peramban ke server, dan siapa pun yang Anda kirimi tautan itu bisa membacanya."
      - "**Memindahkan uang.** Kalkulator hanya menunjukkan siapa yang sebaiknya membayar siapa. Anda membayar satu sama lain dengan cara apa pun yang disuka, lalu mencatat pembayarannya di aplikasi jika grup Anda menyimpan hitungannya di sana."
      - "**Memilih sisa sen secara acak.** Saat tagihan tidak habis dibagi, sisa sen diberikan kepada orang-orang pertama di daftar, agar totalnya tetap cocok. Di aplikasi, sisa sen diberikan kepada satu orang secara acak, jadi tidak selalu orang yang sama."
      - "**Melewati batas.** Kalkulator menerima 2 sampai 20 orang, dan satu pengeluaran bisa hingga 999.999,99, seperti di aplikasi."
