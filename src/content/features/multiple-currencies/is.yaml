sections:
  - heading: "Einn gjaldmiðill fyrir allan hópinn"
    body: "Ef hópurinn vill helst ekki hugsa um þetta skaltu velja gjaldmiðil hópsins og eyðublaðið umreiknar hvert nýtt útgjald í hann, á gengi sem þú getur samt séð og breytt. Þetta gildir aðeins um ný og afrituð útgjöld. Breytingar og núverandi útgjöld haldast eins og þau eru, svo ekkert sem þegar er skráð breytist undir þér."
  - heading: "Skuldar evrur, borgar í pundum"
    body: "Greiddir í jenum, gerir upp í pundum? Ekkert mál. Þegar þú skráir greiðslu geturðu umreiknað hana líka, svo sá sem skuldar evrur getur borgað í pundum og evrustaðan kemur samt rétt út. Borgið hvert öðru eins og ykkur hentar og skráið það svo."
  - heading: "Reglur fyrir hópinn"
    body: "Takmarkaðu hóp við gjaldmiðlana sem þú notar í raun og stilltu sjálfgefinn svo eyðublaðið opnist á þeim rétta. Frí í Portúgal þarf ekki 139 aðra valkosti við hliðina á kvöldverðarreikningnum, og [brúðkaup erlendis](page:use-case/events-and-celebrations) þarf líklega tvo."
limits:
  heading: "Takmörk"
  items:
    - "Gengið festist þegar útgjaldið er vistað. Gömul útgjöld eru aldrei endurmetin."
    - "Side Badger sækir núverandi gengi þar sem það getur. Ekki er tryggt að öll pör hafi gengi og þú getur alltaf slegið gengið inn sjálf(ur)."
    - "Sjálfvirkur umreikningur hópsins gildir aðeins um ný og afrituð útgjöld, ekki breytingar eða núverandi útgjöld."
    - "Hvert útgjald er takmarkað við 999.999,99 í eigin gjaldmiðli."
    - "Gjaldmiðlarnir eru 140. Rafmyntir og málmar eru ekki þar á meðal."
    - "Side Badger skráir greiðslur. Það flytur aldrei peninga eða skiptir þeim."
useCasesHeading: "Hvar þetta hjálpar"
faq:
  heading: "Spurningar"
  items:
    - q: "Hvaða gengi notið þið?"
      a: "Núverandi gengi, sótt þegar þú skráir útgjaldið þar sem það er í boði. Þú getur breytt því í gengið sem þú fékkst í raun og umreiknaða upphæðin uppfærist."
    - q: "Eru gömul útgjöld endurmetin?"
      a: "Nei. Gengið festist þegar útgjaldið er vistað, svo staða rekur ekki af leið þótt markaðurinn geri það."
    - q: "Styðjið þið rafmyntir?"
      a: "Nei. Gjaldmiðlarnir eru 140 og rafmyntir eru ekki þar á meðal."
    - q: "Af hverju get ég ekki skráð 2.000.000 rúpíur?"
      a: "Hvert útgjald er takmarkað við 999.999,99 í eigin gjaldmiðli. Skráðu það í öðrum gjaldmiðli og umreiknaðu, eða skiptu því í tvö útgjöld."
    - q: "Kostar umreikningur eitthvað?"
      a: "Nei. Umreikningur er ókeypis, eins og allt annað í Side Badger. Sjá [verðskrá](page:pricing)."
    - q: "Þarf ég að umreikna?"
      a: "Nei. Gjaldmiðlar haldast aðskildir nema þú eða hópurinn þinn veljið að umreikna, og hver gjaldmiðill fær sinn eigin stutta lista yfir greiðslur."
