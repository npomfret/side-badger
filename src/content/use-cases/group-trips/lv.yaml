meta:
  title: "Sadaliet grupas ceļojuma izmaksas 140 valūtās"
  description: "Sekojiet, kurš par ko maksāja grupas ceļojumā, ievadiet izmaksas vietējā valūtā, konvertējiet tās vai ne un norēķinieties vienreiz beigās. Bez maksas, jūsu pārlūkprogrammā."
h1: "Sadaliet grupas ceļojuma izmaksas 140 valūtās"
navLabel: "Grupu ceļojumi"
lead: "Sekojiet villai, taksometriem un tai kokteiļu kārtai, ko neviens neatceras brīvprātīgi apņēmies pirkt. Side Badger uztur kārtējo uzskaiti, kamēr esat prom, [apstrādā mārciņas, eiro un 138 citas valūtas](page:feature/multiple-currencies) un, kad atgriezīsieties mājās, iedod [īsu maksājumu sarakstu](page:feature/settle-up)."
cta:
  heading: "Atvaļinājuma aprēķini, pirms nodziest iedegums"
  body: "Izveidojiet grupu, nosūtiet uzaicinājuma saiti ceļojuma dalībniekiem un pievienojiet izmaksas, kad tās rodas."
scenario:
  heading: "Visi par kaut ko samaksāja, kādā valūtā"
  body: "Kāds rezervēja lidojumus, cits villu apmaksāja ar karti, un trešais vakariņas apmaksāja skaidrā naudā. Līdz trešajai dienai neviens nezina, kurš ir uz plus. Jautājums ir vienkāršs, kaut arī atbilde parasti mājo izklājlapā, ko neviens negrib atvērt. Kurš par ko maksāja, kādā valūtā un kā visi norēķinās vienreiz beigās?"
sections:
  - heading: "Pirms došanās"
    body: "Ļaujiet balsot par villu izvēli, ja vēlaties, anonīmi, lai lēmums pieder grupai, nevis tam, kurš ilgāk saceras. Tad turiet kopīgo iepirkumu sarakstu blakus iepirkumu rēķiniem, lai neviens nenopērk trīs saules krēma tūbiņas un nevienu kontaktdakšu adapteri."
  - heading: "Kamēr esat prom"
    body: "Pievienojiet katras izmaksas, kad tās rodas, valūtā, kurā maksājāt. Nofotografējiet čeku, un Side Badger aizpilda kopsummu, datumu un vietu, lai jūs tos pārbaudītu; čeku attēlus nolasa Google AI pakalpojums. Konvertējiet summu pēc pašreizējā valūtas kursa, ko varat nomainīt uz kursu, ko patiešām saņēmāt, un sākotnējā summa paliek pie izdevuma. Vai arī atstājiet eiro kā eiro un izlemiet vēlāk. Grupa var izvēlēties arī vienu valūtu, un jaunie izdevumi tajā konvertējas automātiski."
  - heading: "Ne visi darīja visu"
    body: "Daži izlaida vakariņas, daži palika malā no laivas. Izlaidiet tos no izmaksām, kurās viņi nepiedalījās, un pārējo sadaliet [vienādi, pēc precīzām summām vai procentuāli](page:feature/split-expenses). Neviens nemaksā par to ceļojuma daļu, ko pagulēja."
  - heading: "Norēķinieties, kad esat mājās"
    body: "Side Badger iesaka īsu maksājumu sarakstu, kas nokārto visus. Samaksājiet viens otram, kā vēlaties, tad to reģistrējiet. Ar jauktām valūtām turiet katru atsevišķi vai konvertējiet līdzi; Lisabonas piemērs tālāk parāda abus."
  - heading: "Vecpuišu un vecmeitu nedēļas nogales"
    body: "Nedēļas nogalei ar goda viesi vajag mazliet vairāk administrēšanas. Padariet to par pārvaldītu grupu, kur administratori apstiprina jaunus dalībniekus un izdevumus var mainīt tikai veidotāji un administratori. Izmantojiet precīzas summas goda viesa daļai, ierobežojiet grupu ar valūtām, ko patiešām izmantojat, un bloķējiet grupu, kad viss beidzies, lai skaitļi paliktu nemainīgi."
