meta:
  title: "تقسیم هزینه‌های سفر گروهی، در 140 ارز"
  description: "ثبت کنید چه کسی برای چه چیزی در سفر گروهی پرداخت کرده، هزینه‌ها را با ارز محلی وارد کنید، تبدیل کنید یا نکنید و آخر سفر یک‌جا تسویه کنید. رایگان، در مرورگر شما."
h1: "تقسیم هزینه‌های سفر گروهی، در 140 ارز"
navLabel: "سفرهای گروهی"
lead: "ویلا، تاکسی‌ها و همان دور نوشیدنی را که کسی یادش نیست داوطلب پرداختش شده بود دنبال کنید. Side Badger وقتی دور هستید حساب جاری را نگه می‌دارد، [با پوند، یورو و 138 ارز دیگر کار می‌کند](page:feature/multiple-currencies) و وقتی برگشتید [فهرست کوتاهی از پرداخت‌ها](page:feature/settle-up) به شما می‌دهد."
cta:
  heading: "حساب‌وکتاب تعطیلات، پیش از آنکه برنزگی‌تان محو شود"
  body: "یک گروه بسازید، پیوند دعوت را برای افراد سفر بفرستید و هزینه‌ها را همان لحظه اضافه کنید."
  button: "ساخت حساب رایگان"
scenario:
  heading: "همه برای چیزی پرداخت کردند، با یک ارزی"
  body: "یک نفر بلیت پرواز را رزرو کرد، یکی دیگر ویلا را با کارتش پرداخت کرد و سومی شام را نقدی حساب کرد. تا روز سوم هیچ‌کس نمی‌داند چه کسی جلو است. پرسش ساده است، هرچند جوابش معمولاً در جدولی است که کسی نمی‌خواهد بازش کند. چه کسی چه چیزی را با کدام ارز پرداخت کرد و همه آخر سر چطور یک‌جا تسویه می‌کنند؟"
sections:
  - heading: "پیش از رفتن"
    body: "فهرست ویلاها را به رأی بگذارید، اگر خواستید ناشناس، تا تصمیم مال گروه باشد نه مال کسی که بیشتر قهر می‌کند. بعد فهرست خرید مشترک را کنار صورت‌حساب‌های خرید نگه دارید تا کسی سه تیوب ضدآفتاب نخرد و هیچ مبدل پریزی نخرد."
  - heading: "وقتی دور هستید"
    body: "هر هزینه را همان لحظه و با ارزی که پرداخت کرده‌اید اضافه کنید. از رسید عکس بگیرید تا Side Badger جمع کل، تاریخ و مکان را برای بررسی شما پر کند؛ تصاویر رسید توسط سرویس هوش مصنوعی Google خوانده می‌شوند. مبلغ را با نرخ تبدیل روز تبدیل کنید که می‌توانید به نرخی که واقعاً گرفته‌اید تغییرش دهید و مبلغ اصلی روی هزینه می‌ماند. یا یورو را یورو بگذارید و بعداً تصمیم بگیرید. گروه می‌تواند یک ارز هم انتخاب کند و هزینه‌های جدید خودکار به آن تبدیل شوند."
  - heading: "همه در همه‌چیز نبودند"
    body: "بعضی‌ها شام را رد کردند، بعضی‌ها از قایق‌سواری کنار ماندند. آن‌ها را از هزینه‌هایی که در آن نبودند کنار بگذارید و بقیه را [مساوی، با مبلغ دقیق یا با درصد](page:feature/split-expenses) تقسیم کنید. هیچ‌کس بابت بخشی از سفر که خواب بود پول نمی‌دهد."
  - heading: "وقتی به خانه رسیدید تسویه کنید"
    body: "Side Badger فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد که همه را تسویه می‌کند. هر طور دوست دارید به هم پرداخت کنید، بعد ثبتش کنید. با ارزهای مختلط، هر کدام را جدا نگه دارید یا همراه با ثبت تبدیل کنید؛ مثال لیسبون پایین هر دو را نشان می‌دهد."
  - heading: "مهمانی‌های پیش از عروسی"
    body: "یک آخر هفته با مهمان افتخاری کمی کار اداری بیشتر می‌خواهد. آن را گروه مدیریت‌شده کنید، جایی که مدیرها اعضای جدید را تأیید می‌کنند و فقط سازنده‌ها و مدیرها می‌توانند هزینه‌ها را تغییر دهند. برای سهم مهمان افتخاری از مبلغ دقیق استفاده کنید، گروه را به ارزهایی که واقعاً استفاده می‌کنید محدود کنید و وقتی تمام شد گروه را قفل کنید تا اعداد سر جایشان بمانند."
