meta:
  title: "Μοιράστε ένα σαββατοκύριακο bachelor ή bachelorette | Side Badger"
  description: "Το άτομο που γιορτάζει δεν πληρώνει τίποτα και τη Δευτέρα όλοι ακόμα μιλιούνται. Πώς να μοιράσετε ένα σαββατοκύριακο bachelor ή bachelorette, με τις πράξεις."
h1: "Πώς να μοιράσετε το κόστος ενός σαββατοκύριακου bachelor ή bachelorette"
navLabel: "Bachelor ή bachelorette"
lead: "Το άτομο που γιορτάζει δεν πληρώνει τίποτα, οπότε οι υπόλοιποι στην παρέα μοιράζουν κάθε κόστος [εξίσου](page:feature/split-expenses) ανάμεσά τους. Αφήστε έξω από κάθε κόστος όσους το παραλείπουν και κρατήστε το άτομο που γιορτάζει έξω από την ομάδα, ώστε να μείνει η έκπληξη."
cta:
  heading: "Κρατήστε τον λογαριασμό, κρατήστε την έκπληξη"
  body: "Φτιάξτε μια ομάδα, στείλτε τον σύνδεσμο σε όλους εκτός από το άτομο που γιορτάζει και προσθέστε κάθε κόστος μόλις προκύπτει. Το Side Badger είναι δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
sections:
  - heading: "Τέσσερις φίλες και μία έκπληξη"
    body: "Η Χάνα, η Άιλα, η Τζες και η Κατ παίρνουν τη Γκρέις για το bachelorette σαββατοκύριακό της. Η Γκρέις είναι το άτομο που γιορτάζει, οπότε δεν πληρώνει τίποτα. Επίσης δεν είναι στην ομάδα, οπότε δεν μπορεί να δει τι ξοδεύουν οι φίλες της γι' αυτήν. Η Χάνα κλείνει το εξοχικό, η Άιλα πληρώνει τη μέρα στο σπα, η Τζες καλύπτει το δείπνο και η Κατ αναλαμβάνει το ταξί. Ως την Κυριακή όλες έχουν πληρώσει κάτι και κανείς δεν μπορεί να πει ποιος είναι μπροστά. Οι πράξεις είναι ίδιες για ένα σαββατοκύριακο bachelor ή bachelorette, όποιος κι αν γιορτάζει."
  - heading: "Μοιράστε σε όσους πληρώνουν, όχι σε όσους είναι εκεί"
    body: "Το μερίδιο του ατόμου που γιορτάζει δεν εξαφανίζεται. Μοιράζεται στους υπόλοιπους. Το εξοχικό κοστίζει 720 £ και το πληρώνουν τέσσερις φίλες, άρα είναι 180 £ η καθεμία, και η θέση της Γκρέις περιλαμβάνεται ήδη σε αυτό το ποσό. Το δείπνο είναι 260 £, άρα 65 £ η καθεμία. Το ταξί είναι 44 £, άρα 11 £ η καθεμία. Όποια παραλείπει κάτι μένει έξω μόνο από εκείνο το έξοδο. Η Κατ παραλείπει το σπα, οπότε τα 360 £ του, που καλύπτουν και τη θέση της Γκρέις, μοιράζονται σε Χάνα, Άιλα και Τζες με 120 £ την καθεμία. Αθροίστε τα και η Χάνα, η Άιλα και η Τζες χρωστούν η καθεμία 376 £ για το σαββατοκύριακο, και η Κατ χρωστά 256 £."
  - heading: "Στήστε το στο Side Badger"
    items:
      - "Φτιάξτε μια ομάδα για το σαββατοκύριακο και δώστε της ένα βαρετό όνομα, όπως «Σαββατοκύριακο στο εξοχικό». Η Γκρέις δεν είναι μέλος και μόνο τα μέλη μιας ομάδας μπορούν να τη δουν."
      - "Επιλέξτε **Πρόσκληση Άλλων** και στείλτε τον σύνδεσμο ή δείξτε τον κωδικό QR μόνο εκεί που δεν θα τον δει η Γκρέις. Ο σύνδεσμος δείχνει μια προεπισκόπηση της ομάδας πριν μπει κανείς. Επιλέξτε πόσο θα διαρκέσει, από 15 λεπτά έως 5 ημέρες. Ένας παλιός σύνδεσμος συνεχίζει να λειτουργεί μέχρι να λήξει, οπότε μην τον αφήνετε περισσότερο από όσο χρειάζεται."
      - "Για κάθε κόστος επιλέξτε **Προσθήκη Εξόδου**, πληκτρολογήστε το ποσό και διαλέξτε τον πληρωτή στο **Ποιος πλήρωσε;** Στο **Μοιράζεται μεταξύ** τσεκάρετε όσους πληρώνουν, αφήνοντας έξω όποιον το παρέλειψε, όπως την Κατ στο σπα. Επιλέξτε **Εξίσου** στο **Τρόπος διαχωρισμού**."
      - "Όταν γυρίσετε σπίτι, ανοίξτε τα **Υπόλοιπα** της ομάδας. Το Side Badger δείχνει ποιος χρωστά σε ποιον και προτείνει μια σύντομη λίστα πληρωμών. Εδώ είναι τρεις: η Κατ πληρώνει στη Χάνα 212 £, η Τζες πληρώνει στη Χάνα 116 £ και η Άιλα πληρώνει στη Χάνα 16 £. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά χρησιμοποιήστε την **Τακτοποίηση** για να καταγράψετε κάθε πληρωμή."
  - heading: "Πριν κλείσετε, ένας προϋπολογισμός και μια προκαταβολή"
    body: "Συμφωνήστε τον προϋπολογισμό πριν κλείσει κανείς. Επιλέξτε **Προσθήκη Ψηφοφορίας**, ρωτήστε πόσα θα δώσει η ομάδα για το εξοχικό και προσφέρετε μερικά ποσά ως επιλογές. Ενεργοποιήστε την **Ανώνυμη ψηφοφορία** όταν τη δημιουργείτε, για να κρύβεται ποιος ψήφισε τι, ώστε κανείς να μη χρειάζεται να υπερασπιστεί φωναχτά έναν μικρότερο προϋπολογισμό. Κλείστε την ψηφοφορία όταν ψηφίσουν όλοι και εμφανιστεί ο νικητής. Μετά έρχεται η προκαταβολή. Όποιος κάνει την κράτηση την πληρώνει και την προσθέτει ως έξοδο, με εξίσου διαχωρισμό, και το υπόλοιπο ποσό μπαίνει ως δεύτερο έξοδο όταν πρέπει να πληρωθεί. Οι υπόλοιποι μπορούν να στείλουν το μερίδιό τους αμέσως και να καταγράψουν την πληρωμή ή να περιμένουν τον τελικό λογαριασμό. Τα υπόλοιπα βγαίνουν ίδια και στις δύο περιπτώσεις."
  - heading: "Όταν κάποιος έρχεται για μία νύχτα"
    body: "Όποιος φτάνει μόνο για το Σάββατο δεν πρέπει να πληρώσει για την Παρασκευή. Αφήστε τον έξω από τα κόστη στα οποία δεν συμμετείχε. Όπου το κόστος εξαρτάται από το πόσο μένει ο καθένας, όπως ένα δωμάτιο, επιλέξτε **Ακριβή ποσά** στο **Τρόπος διαχωρισμού** και πληκτρολογήστε το μερίδιο του καθενός, που πρέπει να βγάζει το σύνολο. Υπολογίστε πρώτα μια τιμή ανά άτομο και ανά νύχτα και μετά πολλαπλασιάστε με τις νύχτες που μένει ο καθένας. Η σελίδα για τα [ομαδικά ταξίδια](page:use-case/group-trips) έχει περισσότερα για κόστη που δεν είναι ίδια για όλους."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν μετακινεί ποτέ χρήματα. Πληρώνετε ο ένας τον άλλον με τραπεζική μεταφορά, μετρητά ή ό,τι σας βολεύει και μετά καταγράφετε την πληρωμή ώστε να ενημερωθούν τα υπόλοιπα για όλους."
      - "Δεν στέλνει υπενθυμίσεις πληρωμής. Ένα φιλικό σκούντημα στη συνομιλία της παρέας μένει υπόθεση ανθρώπου."
      - "Κάθε έξοδο έχει έναν πληρωτή και το Side Badger δεν μπορεί να χωρίσει μια απόδειξη γραμμή προς γραμμή. Αν δύο κάρτες πλήρωσαν το εξοχικό, καταχωρίστε το ως δύο έξοδα. Αν κάποιοι παρήγγειλαν έξτρα στο δείπνο, καταχωρίστε τα έξτρα ως δικό τους έξοδο."
      - "Κρατά τα χρήματα, όχι το πρόγραμμα. Οι ψηφοφορίες και τα σχόλια μένουν στα κόστη, οπότε τα σχέδια για το σαββατοκύριακο μένουν στη συνομιλία της παρέας."
exampleAfter: 2
