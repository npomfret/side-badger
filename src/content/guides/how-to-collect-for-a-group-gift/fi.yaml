faq:
  heading: Kysymyksiä
  items:
    - q: Entä jos keräämme enemmän kuin lahja maksaa?
      a: Tarkkojen summien on oltava yhteensä hinta, joten karsi osuuksia, kunnes ne täsmäävät. Tai käytä ylijäämä johonkin oikeaan, kuten kukkiin, ja syötä se toisena kuluna, kuten kortti ja käärepaperi esimerkissä.
    - q: Voiko joku osallistua liittymättä ryhmään?
      a: Ei, jos haluat hänet mukaan laskuun. Jokainen jaossa mukana oleva tarvitsee ilmaisen tilin ja paikan ryhmässä. Jos jollakulla on vain käteistä, Priya voisi ottaa sen vastaan ja syöttää lahjan sillä summalla, jonka ryhmä vielä on velkaa. Jos esimerkiksi Sam antaisi hänelle 40 £ käteisenä, hän syöttäisi 200 £ ja jakaisi sen 60, 60 ja 80 itsensä, Omarin ja Lenan kesken.
    - q: Voiko äänestys päättää, kuinka paljon kukin laittaa?
      a: Ei. Äänestyksellä sovitaan yksi luku koko ryhmälle, kuten budjetti. Kunkin osuudesta sovitte keskenänne ja kirjoitatte sen sitten kuluun **Tarkat summat** -jakona.
