meta:
  title: "Roinn billí le comhpháirtí a thuilleann níos mó | Side Badger"
  description: "Éiríonn 50/50 míchompordach nuair a thuilleann duine díobh i bhfad níos mó. Roinn na billí de réir ioncaim, le suimeanna do bheirt agus gan scarbhileog."
h1: "Conas billí a roinnt le comhpháirtí a thuilleann níos mó"
navLabel: "Comhpháirtí le pá níos airde"
lead: "Cuir pá glan an bheirt agaibh le chéile, oibrigh amach sciar gach duine den iomlán agus cruinnigh go céatadáin iomlána. Tá pá glan £2,800 ag Maya agus £1,700 ag Jon, mar sin roinneann siad na billí comhroinnte 62/38. Cuir isteach na céatadáin sin ar chostas comhroinnte i Side Badger, ansin cóipeáil é aon uair a thagann an bille céanna thart."
cta:
  heading: "Déan an ríomh uair amháin"
  body: "Cruthaigh cuntas saor in aisce, déan grúpa don bheirt agaibh agus cuir an cíos isteach le do chéatadáin. Is cóip í cíos na míosa seo chugainn. Ar mhaith leat léargas a fháil ar dtús? Féach [conas a oibríonn sé](page:how-it-works) nó [cad a chlúdaíonn saor in aisce](page:pricing)."
sections:
  - heading: "Dhá phá, árasán amháin, tost béasach amháin"
    body: "Tá Maya agus Jon ina gcónaí le chéile. Tá £2,800 sa mhí mar phá glan ag Maya agus £1,700 ag Jon. Ar feadh dhá bhliain roinn siad gach rud 50/50, mar bhí sé simplí agus níor theastaigh ó cheachtar acu a bheith ar an duine a thógfadh an t-ábhar. Ansin d'fhéach Jon ar an gcíos ina aonar. Is £700 leath de £1,400, rud is ceathrú de phá glan Maya é agus 41% de phá glan Jon. Ní raibh aon duine éagórach. Ní dhearna aon duine an ríomh. Sroicheann go leor [lánúineacha](page:use-case/couples) an pointe seo ar deireadh. Agus bia le tabhairt leat á ithe acu, d'aontaigh siad gur cheart do na billí comhroinnte greim den chineál céanna a thógáil as gach pá."
  - heading: "An modh, agus na suimeanna léirithe"
    body: "Ceithre chéim, áireamhán amháin agus comhrá a bhí le déanamh agat ar aon nós."
    items:
      - "**Aontaigh cad a chuirtear san áireamh mar phá.** Úsáideann Maya agus Jon pá glan, an t-airgead a thiteann sa bhanc gach mí. Le chéile is é £2,800 + £1,700 = £4,500 é."
      - "**Oibrigh amach gach sciar.** Is é 2,800 ÷ 4,500 sciar Maya, is é sin 62.2%. Is é 1,700 ÷ 4,500 sciar Jon, is é sin 37.8%."
      - "**Cruinnigh go céatadáin iomlána.** Cruinníonn 62.2% go 62 agus cruinníonn 37.8% go 38. Le beirt, cruinnigh figiúr amháin agus bain ó 100 é chun an ceann eile a fháil, agus déanann siad 100 le chéile i gcónaí."
      - "**Seiceáil cad a chiallaíonn sé.** Ar an gcíos £1,400, íocann Maya £868 (62%) agus íocann Jon £532 (38%). Is é sin thart ar 31% de phá glan gach duine. Dá n-íocfadh siad leath an duine, thógfadh sé 25% de phá Maya agus 41% de phá Jon."
  - heading: "An mhí a léamh"
    body: "D'íoc Maya an cíos £1,400 agus d'íoc Jon an £216 eile. Is é £868.00 + £111.60 + £18.00 = £997.60 sciar Maya den mhí, agus d'íoc sí £1,400, mar sin tá £402.40 dlite di. Is é £532.00 + £68.40 + £18.00 = £618.40 sciar Jon, agus d'íoc sé £216, mar sin tá £402.40 dlite aige. Molann Side Badger íocaíocht amháin: íocann Jon £402.40 le Maya, agus nuair a bheidh sé íoctha, taifeadann tú é le [socraigh suas](page:feature/settle-up). Dá roinnfí 50/50 an mhí chéanna, bheadh £592.00 le híoc ag Jon le Maya."
  - heading: "Cuir ar bun i Side Badger é"
    body: "Deich nóiméad, a chaitear den chuid is mó ar na céatadáin."
    items:
      - "**Déan an grúpa.** Ar an bpainéal, roghnaigh **Cruthaigh Grúpa** agus ainmnigh é i ndiaidh an árasáin. Roghnaigh **Tabhair Cuireadh do Dhaoine Eile** agus seol an nasc nó an cód QR chuig Jon. Síníonn sé isteach nó cruthaíonn sé cuntas saor in aisce, agus roghnaíonn sé an t-ainm is mian leis a thaispeáint sa ghrúpa seo. Ní fheiceann ach baill grúpa, mar sin níl ann ach an bheirt agaibh."
      - "**Cuir an cíos leis.** Roghnaigh **Cuir Costas Leis**. Cuir isteach an cur síos agus an méid, agus faoi **Cé a d'íoc?** roghnaigh Maya. Fág an bheirt acu faoi **Roinn idir**, ansin faoi **Conas a roinntear** roghnaigh **Céatadán** agus clóscríobh 62 agus 38. Tugann an fhoirm rabhadh mura ndéanann na céatadáin 100 le chéile. Roghnaigh **Sábháil an Costas**."
      - "**Cuir na billí eile leis.** Téann fuinneamh agus idirlíon isteach ar an mbealach céanna, le Jon mar an t-íocóir agus an 62 agus an 38 céanna. Is costas ar leith é an bia le tabhairt leat, agus **Conas a roinntear** fágtha ar **Cothrom**."
      - "**Cóipeáil é an mhí seo chugainn.** Oscail cíos na míosa seo caite agus roghnaigh **Cóipeáil an costas**. Coinníonn an chóip an t-íocóir, an méid agus an roinnt, agus glacann sí dáta an lae inniu. Athraigh an méid má d'athraigh an cíos, ansin roghnaigh **Cruthaigh Cóip**. Oibríonn an bille fuinnimh ar an mbealach céanna."
      - "**Seiceáil cé atá i bhfiacha le cé.** Taispeánann an chuid **Iarmhéideanna** é agus molann sé liosta gearr íocaíochtaí. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead an íocaíocht faoi **Socraigh**."
  - heading: "50/50, de réir ioncaim, nó bille ar bhille"
    body: "Níl aon fhreagra ceart ann, ach amháin an ceann is féidir libh beirt maireachtáil leis. Trí cinn choitianta."
    items:
      - "**Leath an duine do gach rud.** An ceann is éasca le coinneáil, agus oireann sé do lánúineacha a bhfuil a bpá gar dá chéile."
      - "**De réir ioncaim do gach rud comhroinnte.** An rud a dhéanann Maya agus Jon. Comhrá amháin, péire céatadán amháin."
      - "**Bille ar bhille.** Cíos agus billí de réir ioncaim, laethanta saoire agus cóireanna 50/50 nó cibé rud eile a aontaíonn sibh, agus faigheann gach bille an riail is fearr dó."
  - heading: "Aontaigh cad a bheidh comhroinnte"
    body: "Is faoin liosta a bhíonn na hargóintí de ghnáth, ní faoi na céatadáin. Meastar cíos, fuinneamh, idirlíon, an tsiopadóireacht sheachtainiúil agus an tolg mar chostais chomhroinnte i bhformhór na dtithe. B'fhéidir nach gcomhroinntear ballraíocht Maya sa ghiomnáisiam agus síntiús peile Jon. Aontaigh an liosta uair amháin, scríobh síos é agus ná cuir ach na costais chomhroinnte sa ghrúpa."
  - heading: "Fanann an bia le tabhairt leat 50/50, d'aon ghnó"
    body: "Bíonn cóireanna beag agus roghnach, agus níor cheart go mbeadh áireamhán de dhíth ar aon duine le dumplings a ordú. I Side Badger is costas eile é an bia le tabhairt leat. Íocann Jon £36, fanann **Conas a roinntear** ar **Cothrom** agus is é £18 sciar gach duine acu."
  - heading: "Nuair a athraíonn pá duine"
    body: "Athraíonn ardú pá, post nua nó saoire ón obair an ríomh. Oibrigh amach na céatadáin nua ar an mbealach céanna agus úsáid iad ón gcéad chostas eile. Fanann costais níos luaithe mar a bhí siad. Cóipeáil cíos na míosa seo caite, athraigh na céatadáin, ansin roghnaigh **Cruthaigh Cóip**. Chun ceann atá isteach cheana a cheartú, cuir in eagar é má cheadaíonn ceadanna an ghrúpa é, agus inis do do chomhpháirtí ar dtús, mar athraíonn na hiarmhéideanna. Coinnítear an leagan níos luaithe. Aontaigh cathain a dhéanfaidh sibh an ríomh arís, mar uair sa bhliain, agus socraigh suas sula n-athraíonn sibh ionas go gcríochnóidh an seanroinnt le comhaireamh glan."
  - heading: "Cad nach ndéanann Side Badger anseo"
    items:
      - "Ní fhiafraíonn sé riamh cad a thuilleann aon duine agus ní oibríonn sé amach na céatadáin. Clóscríobhann tú na figiúirí a d'aontaigh sibh."
      - "Ní féidir leis roinnt réamhshocraithe a shocrú don ghrúpa ar fad. Téann na céatadáin ar gach costas, mar sin cóipeáil ceann a bhfuil siad air cheana."
      - "Ní féidir billí a athrá go huathoibríoch, mar sin cóipeálann tú cíos na míosa seo caite gach uair."
      - "Ní bhogann sé airgead riamh. Íocaigí a chéile ar an gcaoi is fearr libh agus taifead é."
