faq:
  heading: "Spurningar"
  items:
    - q: "Eigum við að nota brúttólaun eða útborguð laun?"
      a: "Það ákveður hópurinn. Útborguð laun eru algeng, því það eru peningarnir sem þú hefur í raun til að eyða. Brúttólaun taka ekki tillit til þess að skattur, iðgjöld í lífeyrissjóð og afborganir af lánum taka mismikið af mismunandi launum. Hvort sem þið veljið skuluð þið nota sama mælikvarða fyrir ykkur bæði."
    - q: "Sér Side Badger tekjurnar okkar?"
      a: "Nei. Þú slærð aðeins inn prósentur, aldrei laun. Meðlimir hópsins sjá prósenturnar og hjá pari eruð það þið tvö."
    - q: "Getum við stillt 62/38 einu sinni fyrir allt?"
      a: "Skiptingin er stillt á hvert útgjald, ekki á hópinn. Afritaðu útgjald sem hefur þegar 62 og 38 og breyttu því sem er öðruvísi. [Skipting útgjalda](page:feature/split-expenses) fjallar um aðra valkosti."
