  rows:
    - feature: Vad det kostar
      other: Splitwise Pro är en månads- eller årsprenumeration. Årsplaner inkluderar ett Trip Pass, som ger en resegrupp Pro-funktioner i 30 dagar.
      sideBadger: Gratis.
      source: pro-help
    - feature: Utgifter per dag
      other: Dess hjälpcenter säger att gratisanvändare kan lägga till upp till 4 utgifter per dag. Pro har ingen daglig gräns.
      sideBadger: Inga dagliga gränser.
      source: pro-help
    - feature: Grupproller och behörigheter
      other: Dess hjälpcenter säger att det inte stöder gruppadministratörer eller särskilda behörigheter.
      sideBadger: Administratörer, medlemmar och tittare. Två förinställningar eller egna behörigheter, godkännande för att gå med och ett lås när det är över.
      source: permissions-help
    - feature: Kvittoskanning
      other: En Pro-funktion. Skannar en bild av ett kvitto, och Pros delning per post låter dig tilldela posterna till personer.
      sideBadger: Gratis, utan skanningskrediter. Den fyller i summa, datum och plats så att du kan kontrollera dem, och tilldelar inte poster till personer.
      source: pro
    - feature: Valutaomräkning
      other: En Pro-funktion. Tryck på Convert så räknar Splitwise om en grupps utgifter till din standardvaluta med det ögonblickets växelkurs.
      sideBadger: Gratis. Räkna om varje utgift när du lägger in den, med en aktuell växelkurs eller den du faktiskt fick. Det ursprungliga beloppet finns kvar på utgiften.
      source: currencies-help
    - feature: Valutor och språk
      other: Över 100 valutor och över 7 språk, som startsidan uttrycker det.
      sideBadger: 133 valutor och 39 språk. Alla i gruppen kan välja sitt eget språk.
      source: home
    - feature: Var du använder det
      other: Appar för iPhone och Android, och webben.
      sideBadger: I webbläsaren. Logga in, lägg sedan till den på hemskärmen så öppnas den som en app. Finns inte i appbutikerna.
      source: home
    - feature: Sätt att dela
      other: Lika, efter exakta belopp, i procent, efter andelar, efter justering eller per post.
      sideBadger: Lika, efter exakta belopp eller i procent, med en betalare per utgift. Inte efter andelar eller per post.
      source: split-help
    - feature: Offlineanvändning
      other: Listar ett offlineläge bland sina kärnfunktioner.
      sideBadger: Nej. Den behöver en uppkoppling.
      source: home
    - feature: Betalningar och din bank
      other: "På vissa platser kan den skicka pengar inifrån appen: Splitwise Pay i USA, Venmo för saldon i amerikanska dollar, PayPal och Pay by Bank i utvalda europeiska länder, vilket kopplar ett privatkonto."
      sideBadger: Rör aldrig dina pengar och ber inte om dina bankuppgifter. Betala varandra hur ni vill och registrera sedan betalningen.
      source: payments-help
    - feature: Diagram och standarddelningar
      other: Båda är Pro-funktioner.
      sideBadger: Ingetdera.
      source: pro
faq:
  heading: Frågor
  items:
    - q: Är Side Badger ett gratis alternativ till Splitwise?
      a: "För att dela utgifter i en grupp, ja, och den gör mer än matten: kommentarer, frågor, listor, omröstningar och grupproller, med kvittoskanning och valutaomräkning gratis. Om du behöver en app från appbutiken, offlineläge eller betalningar inne i appen gör Splitwise det och Side Badger inte."
    - q: Var kommer Splitwise-uppgifterna ifrån?
      a: "Från Splitwises egna sidor: dess startsida, dess Pro-sida och dess hjälpcenter. Varje rad i tabellen länkar till sidan den kom från, och datumet ovanför tabellen säger när vi läste dem. Vi kontrollerar dem varje kvartal."
    - q: Kommer Side Badger att förbli gratis?
      a: Allt i Side Badger är gratis i dag. Om det någonsin ändras ger vi dig besked först. [Prissidan](page:pricing) har detaljerna.
    - q: Måste alla i min grupp byta?
      a: Ja. Alla i en grupp behöver ett gratis Side Badger-konto, och de kan gå med via en länk eller en QR-kod.
    - q: Har Side Badger en mobilapp?
      a: "Inte i en appbutik. Den fungerar i din webbläsare: logga in på telefonen och lägg till den på hemskärmen så öppnas den som en app. [Så fungerar det](page:how-it-works) visar hur."
