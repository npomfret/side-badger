meta:
  title: "Norēķinieties ar mazāk maksājumiem | Side Badger"
  description: "Skatiet, kurš kam ir parādā jūsu grupā, saņemiet īsu maksājumu sarakstu, kas nokārto visus, un reģistrējiet katru maksājumu, kad tas notiek. Lietošana bez maksas."
h1: "Norēķinieties ar mazāk maksājumiem"
navLabel: "Norēķināšanās"
lead: "Side Badger uztur kārtējo atlikumu katram grupā un iesaka īsu maksājumu sarakstu, kas to nokārto. Jūs samaksājat viens otram, kā vēlaties, tad to reģistrējat. Ja vispirms vēlaties redzēt, kā skaitļi tiek sadalīti, sāciet ar [izdevumu sadali](page:feature/split-expenses)."
cta:
  heading: "Gatavi izmezglot, kurš kam ir parādā?"
  body: "Izveidojiet kontu, sāciet grupu un pievienojiet pirmo izdevumu. Atlikumi parūpēsies par pārējo."
  button: "Izveidot bezmaksas kontu"
problem:
  heading: "Atlikumi, kas atjaunojas līdzi"
  body: "Katrs izdevums maina to, kurš kam ir parādā, tāpēc Side Badger uztur atlikumus aktuālus, kad tiek pievienoti izdevumi un maksājumi. Ikviens grupā izmaiņas redz uzreiz un redz, kas mainīts un kurš to mainīja. Atlikumi tiek uzturēti katrā valūtā, tāpēc eiro un mārciņas paliek savās kolonnās, ja vien izdevums netika konvertēts, kad tas tika ievadīts. Pēc noklusējuma redzat parādus, kas skar jūs; **Rādīt visu** parāda visu grupu."
workflow:
  heading: "Trīs soļi līdz kvitiem"
  steps:
    - title: "Skatiet, kurš kam ir parādā"
      body: "Atveriet grupas atlikumus, lai redzētu, cik esat parādā, cik jums pienākas un īsu maksājumu sarakstu, kas nokārto visus, aprēķinātu katrā valūtā. Apšaubītie izdevumi paliek ārpus summām, kamēr tie nav nokārtoti. Tālāk redzamajā mājokļa biedru piemērā seši maksājumi kļūst par diviem."
      shot: S10
      shotAlt: "Atlikumu ekrāns ar vienkāršotiem parādiem divās valūtās, kad ieslēgts „Rādīt visu”"
    - title: "Samaksājiet, kā vēlaties, tad reģistrējiet"
      body: "Bankas pārskaitījums, skaidra nauda, pakalpojums, ko esat parādā kopš pagājušā atvaļinājuma. Side Badger naudu nepārvieto. Kad nauda ir mainījusi īpašnieku, reģistrējiet maksājumu, un atlikums visiem atjaunojas."
      shot: S11
      shotAlt: "Maksājuma veidlapa ar ātrā norēķina pogām un paziņojumu, kas parādās daļējam maksājumam"
    - title: "Pārbaudiet, vai tas ir ienācis"
      body: "Maksājums nonāk grupas vēsturē, kur ikviens grupā to redz un var reaģēt ar emocijzīmi. Nosvinēiet maksājumu, kad tas ir ienācis."
      shot: S12
      shotAlt: "Maksājumu vēsture ar emocijzīmju reakcijām uz maksājumu"
