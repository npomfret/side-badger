sections:
  - heading: "Regista um pagamento"
    body: "Quando alguém paga, regista-o junto da pessoa certa. Os botões de acerto rápido preenchem o valor a partir dos pagamentos sugeridos, e podes acrescentar uma nota como “transferência bancária” (até 500 caracteres). Se pagares só parte do que deves, o resto fica no saldo. Se introduzires de menos ou de mais, o Side Badger avisa-te antes de guardares. Registar um pagamento exige permissão para editar despesas, e a data não pode estar no futuro."
  - heading: "Pagaste noutra moeda?"
    body: "Os saldos ficam na moeda em que foram pagos, por isso uma dívida em euros continua a ser uma dívida em euros. Deves euros e pagas em libras? Converte o pagamento ao introduzi-lo, a uma taxa de câmbio atual ou à taxa que realmente tiveste. A taxa fica fixa quando o pagamento é guardado. [Várias moedas](page:feature/multiple-currencies) explica como funciona a conversão, e as [viagens em grupo](page:use-case/group-trips) mostram-na em uso."
  - heading: "Um histórico que podes verificar"
    body: "Cada pagamento registado fica no histórico do grupo com a sua data, valor e nota. Só quem registou um pagamento o pode editar, e essa pessoa ou um administrador do grupo pode apagá-lo. Um pagamento que envolva alguém que saiu do grupo fica bloqueado. Para um cenário concreto de colegas de casa, vê [colegas de casa](page:use-case/housemates)."
limits:
  heading: "O que o Side Badger não faz"
  items:
    - "O Side Badger não movimenta dinheiro, não envia links de pagamento nem pedidos de pagamento. Um pagamento na app é o registo de um pagamento feito noutro sítio."
    - "Os pagamentos sugeridos vêm de um método de correspondência simples, aplicado por moeda. Sugere sempre menos pagamentos do que o número de pessoas com saldo nessa moeda (quatro pessoas, no máximo três pagamentos), mas nem sempre encontra o menor número possível."
    - "Não podes desligar as sugestões. **Mostrar tudo** lista todos os pagamentos sugeridos no grupo, não só os teus."
    - "As moedas nunca são compensadas umas com as outras, a menos que as despesas tenham sido convertidas quando foram introduzidas."
    - "Não há lembretes, por isso andar atrás de um pagamento continua a ser contigo."
useCasesHeading: "Onde acertar contas faz diferença"
faq:
  heading: "Perguntas"
  items:
    - q: "O Side Badger envia o dinheiro?"
      a: "Não. Paguem-se como preferirem e depois registem o pagamento no Side Badger para o saldo se atualizar."
    - q: "Posso desligar os pagamentos sugeridos?"
      a: "Não. A simplificação fica sempre ativa, e **Mostrar tudo** lista todos os pagamentos sugeridos no grupo, não só os que te envolvem."
    - q: "Porque são os euros e as libras mantidos em separado?"
      a: "Os saldos ficam na moeda em que pagaste, a menos que convertas ao introduzir uma despesa ou pagamento. As dívidas em moedas diferentes nunca são compensadas umas com as outras."
    - q: "E se alguém pagar só parte do que deve?"
      a: "Regista a parte que pagou. O resto fica no saldo até ser pago."
    - q: "É sempre o menor número possível de pagamentos?"
      a: "Não está garantido. Sugere sempre menos pagamentos do que o número de pessoas com saldo nessa moeda, por isso para quatro pessoas nunca sugere mais de três. No exemplo dos colegas de casa, são dois pagamentos, quando pagar diretamente a cada pessoa levava seis."
