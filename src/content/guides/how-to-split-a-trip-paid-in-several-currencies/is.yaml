faq:
  heading: "Spurningar"
  items:
    - q: "Hvaða gengi notar Side Badger?"
      a: "Núverandi gengi, sótt þegar þú skráir útgjaldið þar sem það er í boði. Þú getur breytt því í gengið sem þú fékkst í raun."
    - q: "Getur hópurinn haldið sig við pund og jen?"
      a: "Já. Í **Stillingum** hópsins skaltu kveikja á **Takmarka gjaldmiðla fyrir þennan hóp** undir **Gjaldmiðlastillingar**, velja **Leyfðir gjaldmiðlar** og stilla **Sjálfgefinn gjaldmiðill fyrir ný útgjöld**. Færri valkostir á listanum þýða færri mistök við kassann."
    - q: "Þurfum við að umreikna yfirleitt?"
      a: "Nei. Gjaldmiðlar haldast aðskildir nema þú eða hópurinn þinn veljið að umreikna, og hver gjaldmiðill fær sinn eigin stutta lista yfir greiðslur."
