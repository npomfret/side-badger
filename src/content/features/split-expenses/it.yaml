sections:
  - heading: Solo le persone che c'erano
    body: Dividi un costo tra tutti, o solo tra le persone che l'hanno condiviso. Escludi chi non faceva parte di una spesa e i saldi ne tengono conto. Il coinquilino che è stato via tutta la settimana non deve niente per il cibo da asporto, cosa che i [coinquilini](page:use-case/housemates) riconosceranno come semplice giustizia.
  - heading: I dettagli che evitano discussioni dopo
    items:
      - Imposta la **data** e un'ora facoltativa. Scorciatoie come oggi, ieri, stamattina e ieri sera fanno risparmiare un po' di digitazione.
      - Aggiungi fino a tre **etichette** per raggruppare le spese, come spesa o viaggi.
      - Aggiungi il **luogo**. Incolla un link di una mappa e il nome del luogo si compila da solo.
      - Aggiungi una **nota** per la storia dietro il numero, con un po' di formattazione se la storia lo richiede.
      - "Allega fino a tre **ricevute**, come foto o PDF, così la prova resta con la spesa."
      - Usa i **commenti** per tenere la conversazione accanto alla spesa di cui parla, invece che in una chat che nessuno rilegge.
  - heading: Copia, modifica e guarda cosa è cambiato
    body: Copia l'affitto del mese scorso invece di riscriverlo, poi cambia ciò che è diverso. Se un numero era sbagliato, modifica la spesa. La versione precedente viene conservata e la modifica compare nell'attività del gruppo, così nessuno cambia un numero di nascosto. Cosa può modificare ciascuno dipende dai permessi del gruppo.
  - heading: Quando qualcosa sembra sbagliato
    body: Un gruppo può attivare le domande sulle spese. Chiunque sia incluso in una spesa può sollevare una domanda e dire perché, e la spesa resta fuori dai saldi finché chi l'ha posta, o un admin, la chiude. È disattivata di default e un admin la attiva per il gruppo. Si adatta a [eventi e feste](page:use-case/events-and-celebrations), dove la caparra che nessuno ricorda diventa all'improvviso affare di tutti.
limits:
  heading: Limiti
  items:
    - Una sola persona paga ogni spesa. Se hanno pagato in due, registra due spese.
    - Non c'è la divisione per voce né per quote. Parti uguali, importi esatti e percentuali sono ciò che c'è.
    - Le percentuali devono sommare a 100.
    - Una spesa può arrivare a 999.999,99 nella sua valuta, con i decimali abituali di quella valuta.
    - Le spese non possono ripetersi da sole. Copia invece quella del mese scorso.
    - Le date non possono essere nel futuro né risalire a più di 10 anni fa.
    - Una spesa che coinvolge qualcuno che ha lasciato il gruppo diventa di sola lettura.
useCasesHeading: Dove aiuta dividere così
faq:
  heading: Domande
  items:
    - q: Due persone possono pagare una stessa spesa?
      a: Non in una sola spesa. Registrane due, una per ogni pagatore, e i saldi tornano uguali.
    - q: Posso dividere uno scontrino per voce?
      a: No. Una divisione è in parti uguali, per importi esatti o per percentuale. Per un conto con voci diverse, inserisci quanto deve ciascuno come importi esatti.
    - q: Posso impostare una divisione predefinita?
      a: No. Copia una spesa precedente per riusarne la divisione e cambia ciò che è diverso.
    - q: I conti possono ripetersi ogni mese?
      a: No. Copia invece la spesa del mese scorso, e ci vogliono pochi secondi.
    - q: Chi può modificare una spesa?
      a: Chi è autorizzato dai permessi del gruppo. Ogni modifica compare nell'attività del gruppo, quindi i cambiamenti non sono mai nascosti.
    - q: Cosa succede ai saldi dopo?
      a: Si aggiornano man mano che arrivano le spese, e [saldare i conti](page:feature/settle-up) li trasforma in una breve lista di pagamenti. Se una spesa è in un'altra valuta, vedi [più valute](page:feature/multiple-currencies).
