faq:
  heading: "أسئلة"
  items:
    - q: "ماذا لو جمعنا أكثر مما تكلّفه الهدية؟"
      a: "يجب أن يكون مجموع المبالغ الدقيقة مساوياً للسعر، فقلّصوا الحصص إلى أن يتحقق ذلك. أو اصرفوا الزيادة على شيء حقيقي، مثل الزهور، وأدخلوه مصروفاً ثانياً، كما في البطاقة وورق التغليف في المثال."
    - q: "هل يستطيع أحد المساهمة دون الانضمام إلى المجموعة؟"
      a: "ليس إذا أردتم احتسابه. فكل من يشارك في التقسيم يحتاج إلى حساب مجاني وإلى مكان في المجموعة. أما من لديه نقد فقط، فتستطيع بريا أن تأخذه منه وتدخل الهدية بالمبلغ الذي لا يزال مطلوباً من المجموعة. فمثلاً، إذا أعطاها سام £40 نقداً، فتدخل £200 وتقسّمها 60 و60 و80 بينها وبين عمر ولينا."
    - q: "هل يستطيع الاستطلاع تحديد ما يضعه كل شخص؟"
      a: "لا. يتفق الاستطلاع على رقم للمجموعة كلها، مثل الميزانية. أما حصة كل شخص فتتفقون عليها بينكم، ثم تكتبونها في المصروف بوصفها **مبالغ دقيقة**."
