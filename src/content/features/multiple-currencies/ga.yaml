meta:
  title: "Roinn costais i 140 airgeadra, tiontaithe nó coinnithe ar leith"
  description: "Cuir isteach gach costas san airgeadra inar íoc tú, coinnigh na hiarmhéideanna ar leith nó tiontaigh ar ráta a fheiceann tú agus is féidir leat a athrú, ansin socraigh suas le liosta gearr íocaíochtaí."
h1: "Roinn costais i 140 airgeadra"
navLabel: "Ilairgeadraí"
lead: "Euro, yen, agus an tacsaí sin amháin i mbaht. Glacann Side Badger le gach costas san airgeadra inar íoc tú, coinníonn sé na hiarmhéideanna ceart, agus is féidir leis tiontú nuair is fearr le do ghrúpa socrú uair amháin. Oibríonn sé i 140 airgeadra, agus oireann sé go nádúrtha do [thurais ghrúpa](page:use-case/group-trips)."
cta:
  heading: "Tabhair leat do euro, tabhair leat do yen"
  body: "Cruthaigh cuntas, tosaigh grúpa agus cuir an chéad chostas leis in aon airgeadra a tharla a bheith agat."
  button: "Cruthaigh cuntas saor in aisce"
problem:
  heading: "Cuir isteach é mar a d'íoc tú é"
  body: "Is annamh a íoctar as turas in aon airgeadra amháin. Cuireadh an t-óstán in áirithe sa bhaile i bpunt, íocadh as an dinnéar i yen, agus bhí caife an aerfoirt in aon airgeadra a d'úsáid an stad idir eitiltí. Is amhlaidh a thréigtear scarbhileoga nuair a chaithfidh tú gach rud a thiontú de láimh sula bhfuil tú in ann é a chlóscríobh isteach. I Side Badger cuireann tú isteach gach costas san airgeadra atá ar an admháil, agus leanann gach suim rialacha a hairgeadra, mar sin níl aon deachúlacha ag an yen agus tá trí cinn ag an dinar. Tagann na hairgeadraí a d'úsáid tú le déanaí ar dtús sa liosta."
workflow:
  heading: "Coinnigh airgeadraí ar leith, nó tiontaigh de réir a chéile"
  steps:
    - title: "Cuir an costas leis ina airgeadra féin"
      body: "Roghnaigh an t-airgeadra, clóscríobh an tsuim, abair cé a d'íoc agus cé a roinn é. Níl aon rud eile de dhíth. Is é seo an réamhshocrú, agus coinníonn sé an tsuim bhunaidh díreach mar a chuir tú isteach í."
      shot: S07
      shotAlt: "An fhoirm costais le suim yen curtha isteach"
    - title: "Féach ar iarmhéid do gach airgeadra"
      body: "Coinnítear iarmhéideanna ar leith in aghaidh an airgeadra, agus faigheann gach ceann a liosta gearr féin d'íocaíochtaí molta. Socraítear punt i bpunt agus yen i yen."
      shot: S10
      shotAlt: "An scáileán iarmhéideanna le fiacha simplithe i dhá airgeadra"
    - title: "Nó tiontaigh, nuair is fearr leis an ngrúpa socrú uair amháin"
      body: "Roghnaigh airgeadra eile agus tú ag cur an chostais isteach agus is féidir le Side Badger é a thiontú ar ráta malairte reatha, rud is féidir leat a athrú go dtí an ráta a fuair tú i ndáiríre. Téann an tsuim thiontaithe isteach san iarmhéid san airgeadra sin. Is rogha é tiontú a dhéanann an grúpa, ní rud a tharlaíonn taobh thiar de do dhroim."
options:
  heading: "Ráta is féidir leat a fheiceáil agus a athrú"
  items:
    - title: "Taispeántar an ráta"
      body: "Nuair a thiontaíonn tú, taispeántar an ráta agus an tsuim thiontaithe ar an bhfoirm, mar sin ní gá d'aon duine uimhir a ghlacadh ar iontaoibh."
    - title: "Clóscríobh do cheann féin"
      body: "An bhfuair tú ráta níos fearr ó dheasc airgid thirim, nó ceann níos measa ó aerfort? Cuir an ráta in eagar go dtí an ceann a fuair tú i ndáiríre agus nuashonraítear an tsuim thiontaithe."
    - title: "Fanann an bunleagan"
      body: "Fanann an tsuim bhunaidh ar an gcostas, in aice leis an gceann tiontaithe, do dhuine ar bith a fhiafraíonn cad a bhí ann i yen."
    - title: "Saor in aisce le tiontú"
      body: "Ní chosnaíonn tiontú tada. Níl aon táille ann as costas a chur isteach in airgeadra eile."
