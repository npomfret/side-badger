sections:
  - heading: Eine Währung für die ganze Gruppe
    body: Wenn deine Gruppe lieber nicht darüber nachdenken will, wähle eine Gruppenwährung, und das Formular rechnet jede neue Ausgabe in sie um, zu einem Kurs, den du weiterhin sehen und ändern kannst. Das gilt nur für neue und kopierte Ausgaben. Bearbeitungen und bestehende Ausgaben bleiben, wie sie sind, nichts bereits Erfasstes ändert sich also unter dir.
  - heading: Du schuldest Euro, zahlst in Pfund
    body: In Yen bezahlt, in Pfund abgerechnet? Kein Problem. Beim Erfassen einer Zahlung kannst du sie ebenfalls umrechnen, sodass, wer Euro schuldet, in Pfund zahlen kann und der Euro-Saldo trotzdem stimmt. Zahlt einander, wie ihr wollt, und erfasst es dann.
  - heading: Regeln für die Gruppe
    body: Beschränke eine Gruppe auf die Währungen, die ihr wirklich nutzt, und lege eine Voreinstellung fest, damit das Formular mit der richtigen öffnet. Ein Urlaub in Portugal braucht neben der Abendessenrechnung keine 139 anderen Optionen, und eine [Hochzeit im Ausland](page:use-case/events-and-celebrations) braucht wohl zwei.
limits:
  heading: Grenzen
  items:
    - Der Kurs wird beim Speichern der Ausgabe festgelegt. Alte Ausgaben werden nie neu bewertet.
    - Side Badger holt einen aktuellen Kurs, wo es geht. Nicht für jedes Paar ist einer garantiert, und du kannst den Kurs immer selbst eintippen.
    - Die automatische Umrechnung der Gruppe gilt nur für neue und kopierte Ausgaben, nicht für Bearbeitungen oder bestehende Ausgaben.
    - Jede Ausgabe ist auf 999.999,99 in der jeweiligen Währung begrenzt.
    - Es gibt 140 Währungen. Kryptowährungen und Metalle gehören nicht dazu.
    - Side Badger erfasst Zahlungen. Es bewegt oder tauscht nie Geld.
useCasesHeading: Wo das hilft
faq:
  heading: Fragen
  items:
    - q: Welchen Wechselkurs verwendet ihr?
      a: Einen aktuellen Wechselkurs, der beim Erfassen der Ausgabe abgerufen wird, wo einer verfügbar ist. Du kannst ihn auf den Kurs ändern, den du tatsächlich bekommen hast, und der umgerechnete Betrag aktualisiert sich.
    - q: Werden alte Ausgaben neu bewertet?
      a: Nein. Der Kurs wird beim Speichern der Ausgabe festgelegt, ein Saldo driftet also nicht, nur weil sich der Markt bewegt hat.
    - q: Unterstützt ihr Krypto?
      a: Nein. Es gibt 140 Währungen, und Kryptowährungen gehören nicht dazu.
    - q: Warum kann ich keine 2.000.000 Rupiah eingeben?
      a: Jede Ausgabe ist auf 999.999,99 in der jeweiligen Währung begrenzt. Gib sie in einer anderen Währung ein und rechne um, oder teile sie in zwei Ausgaben.
    - q: Kostet das Umrechnen etwas?
      a: Nein. Umrechnen ist kostenlos, wie der Rest von Side Badger. Siehe [Preise](page:pricing).
    - q: Muss ich umrechnen?
      a: Nein. Währungen bleiben getrennt, es sei denn, du oder deine Gruppe entscheidet sich fürs Umrechnen, und jede Währung bekommt ihre eigene kurze Liste von Zahlungen.
