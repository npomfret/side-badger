meta:
  title: "గ్రూప్ ట్రిప్ ఖర్చులను 140 కరెన్సీలలో పంచండి"
  description: "గ్రూప్ ట్రిప్‌లో ఎవరు ఏం చెల్లించారో ట్రాక్ చేయండి, ఖర్చులను స్థానిక కరెన్సీలో నమోదు చేయండి, మార్చండి లేదా మార్చకండి, చివర్లో ఒకేసారి లెక్క తేల్చండి. ఉచితం, మీ బ్రౌజర్‌లో."
h1: "గ్రూప్ ట్రిప్ ఖర్చులను 140 కరెన్సీలలో పంచండి"
navLabel: "గ్రూప్ ట్రిప్‌లు"
lead: "విల్లా, ట్యాక్సీలు, ఎవరూ కొనడానికి ఒప్పుకున్నట్టు గుర్తులేని ఆ కాక్‌టైల్ రౌండ్ లెక్క ఉంచండి. మీరు దూరంగా ఉన్నప్పుడు Side Badger నడుస్తున్న లెక్కను ఉంచుతుంది, [పౌండ్లు, యూరోలు, మరో 138 కరెన్సీలను సంభాళిస్తుంది](page:feature/multiple-currencies), మీరు ఇంటికి వచ్చాక [పేమెంట్ల చిన్న జాబితా](page:feature/settle-up) ఇస్తుంది."
cta:
  heading: "టాన్ మాసిపోయేలోపే సెలవుల లెక్క పూర్తి"
  body: "గ్రూప్ సృష్టించండి, ట్రిప్‌లో ఉన్నవాళ్లకు ఆహ్వాన లింక్ పంపండి, ఖర్చులు జరిగినప్పుడే జోడించండి."
  button: "ఉచిత ఖాతా తెరవండి"
scenario:
  heading: "అందరూ ఏదో ఒకటి చెల్లించారు, ఏదో ఒక కరెన్సీలో"
  body: "ఒకరు విమాన టికెట్లు బుక్ చేశారు, మరొకరు విల్లాను కార్డుపై పెట్టారు, ఇంకొకరు డిన్నర్‌ను నగదుతో చెల్లించారు. మూడో రోజుకి ఎవరు ముందున్నారో ఎవరికీ తెలియదు. ప్రశ్న సులువే, సమాధానం మాత్రం ఎవరూ తెరవాలనుకోని స్ప్రెడ్‌షీట్‌లో ఉంటుంది. ఎవరు ఏం చెల్లించారు, ఏ కరెన్సీలో, చివర్లో అందరూ ఒకేసారి ఎలా లెక్క తేల్చుకుంటారు?"
sections:
  - heading: "వెళ్లే ముందు"
    body: "విల్లా షార్ట్‌లిస్ట్‌ను ఓటింగ్‌కు పెట్టండి, కావాలంటే పేర్లు చెప్పకుండా, అప్పుడు నిర్ణయం గ్రూప్‌కు చెందుతుంది, ఎక్కువసేపు ముఖం ముడుచుకునే వాళ్లది కాదు. తర్వాత షాపింగ్ బిల్లుల పక్కనే ఉమ్మడి షాపింగ్ జాబితాను ఉంచండి, అప్పుడు ఎవరూ మూడు సన్‌క్రీమ్ ట్యూబులు కొని, ప్లగ్ అడాప్టర్లు ఒక్కటీ కొనరు."
  - heading: "మీరు దూరంగా ఉన్నప్పుడు"
    body: "ప్రతి ఖర్చును జరిగినప్పుడే, మీరు చెల్లించిన కరెన్సీలో జోడించండి. రసీదు ఫొటో తీయండి, Side Badger మొత్తం, తేదీ, చోటు నింపుతుంది, మీరు సరిచూసుకోండి; రసీదు చిత్రాలను Google AI సేవ చదువుతుంది. మొత్తాన్ని ప్రస్తుత ఎక్స్ఛేంజ్ రేటుతో మార్చండి, మీకు నిజంగా వచ్చిన రేటుకు మీరు దాన్ని మార్చుకోవచ్చు, అసలు మొత్తం ఖర్చుతోనే ఉంటుంది. లేదా యూరోలను యూరోలుగానే ఉంచి తర్వాత నిర్ణయించండి. గ్రూప్ ఒక కరెన్సీని కూడా ఎంచుకోవచ్చు, కొత్త ఖర్చులు తనంతట తామే దానిలోకి మారతాయి."
  - heading: "అందరూ అన్నీ చేయలేదు"
    body: "కొందరు డిన్నర్ మానేశారు, కొందరు బోటు యాత్రకు రాలేదు. వాళ్లు భాగం కాని ఖర్చుల నుండి వాళ్లను వదిలేయండి, మిగతావాటిని [సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో](page:feature/split-expenses) పంచండి. ట్రిప్‌లో నిద్రపోయి గడిపిన భాగానికి ఎవరూ చెల్లించరు."
  - heading: "ఇంటికొచ్చాక లెక్క తేల్చండి"
    body: "Side Badger అందరి లెక్క తేల్చే పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత రికార్డ్ చేయండి. కలగలిసిన కరెన్సీలు ఉంటే, ప్రతిదాన్ని విడిగా ఉంచండి లేదా వెళ్తూ మార్చండి; కింద ఉన్న లిస్బన్ ఉదాహరణ రెండింటినీ చూపిస్తుంది."
  - heading: "బ్యాచిలర్, హెన్ వారాంతాలు"
    body: "గౌరవ అతిథితో వారాంతానికి కొంచెం ఎక్కువ ఏర్పాటు కావాలి. దాన్ని మేనేజ్డ్ గ్రూప్‌గా చేయండి, అక్కడ అడ్మిన్లు కొత్త సభ్యులను ఆమోదిస్తారు, సృష్టికర్తలు, అడ్మిన్లు మాత్రమే ఖర్చులను మార్చగలరు. గౌరవ అతిథి వాటాకు ఖచ్చితమైన మొత్తాలు వాడండి, గ్రూప్‌ను మీరు నిజంగా వాడుతున్న కరెన్సీలకు పరిమితం చేయండి, ముగిశాక గ్రూప్‌ను లాక్ చేయండి, అంకెలు ఉన్నచోటే ఉంటాయి."
exampleAfter: 4
