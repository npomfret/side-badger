faq:
  heading: "Cwestiynau"
  items:
    - q: "Alla i adael allan pobl a hepgorodd swper?"
      a: "Gallwch. Dewiswch bwy oedd yn rhan o bob cost a dim ond nhw sy'n talu amdani."
    - q: "Ydy e'n gweithio heb signal?"
      a: "Nac ydy. Mae Side Badger angen cysylltiad, felly ychwanegwch y costau unwaith y byddwch yn ôl ar wifi."
    - q: "Oes angen i bawb osod rhywbeth?"
      a: "Nac oes. Mae'n rhedeg yn y porwr. Anfonwch y ddolen wahodd ac mae pobl yn ymuno o'u ffonau."
    - q: "Pa gyfradd gyfnewid mae'n ei defnyddio?"
      a: "Cyfradd gyfnewid gyfredol pan fyddwch yn rhoi'r gost, neu eich un chi os cawsoch un wahanol. Mae'r gyfradd yn sefydlog pan gaiff y gost ei chadw, felly nid yw hen gostau byth yn cael eu hailbrisio."
    - q: "Allwn ni rewi'r grŵp ar ôl y daith?"
      a: "Gallwch. Gall gweinyddwr gloi'r grŵp fel bod y rhifau'n aros yn eu lle."
    - q: "Oes terfyn ar symiau?"
      a: "Oes. 999,999.99 fesul cost, yn ei harian cyfred ei hun."
