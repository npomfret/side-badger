faq:
  heading: Questions
  items:
    - q: "Side Badger est-il une alternative gratuite à Splitwise ?"
      a: "Pour partager des frais en groupe, oui. Le scan de reçus, la conversion de devises et l'absence de publicité sont gratuits, sans limite quotidienne. Si vous avez besoin d'une appli native, d'un usage hors connexion, de dépenses récurrentes ou de paiements dans l'appli, Splitwise les propose et Side Badger non."
    - q: "D'où viennent les informations sur Splitwise ?"
      a: "Des pages de Splitwise elles-mêmes : sa page d'accueil, sa page Pro et son centre d'aide. Chaque ligne du tableau renvoie à la page d'où elle vient, et la date au-dessus du tableau dit quand nous les avons lues. Nous les revérifions chaque trimestre."
    - q: "Side Badger restera-t-il gratuit ?"
      a: "Tout dans Side Badger est gratuit aujourd'hui, et il n'y a pas d'offre payante. Si cela change un jour, nous vous préviendrons d'abord. La [page des tarifs](page:pricing) donne les détails."
    - q: "Tout mon groupe doit-il changer ?"
      a: "Oui. Chaque membre d'un groupe a besoin d'un compte Side Badger gratuit, et on peut rejoindre avec un lien ou un code QR."
    - q: "Side Badger a-t-il une appli mobile ?"
      a: "Pas dans une boutique d'applications. Il fonctionne dans votre navigateur : connectez-vous sur votre téléphone, puis ajoutez-le à votre écran d'accueil pour qu'il s'ouvre comme une appli. [Comment ça marche](page:how-it-works) montre comment."
