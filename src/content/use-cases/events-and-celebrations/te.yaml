faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "అతిథులు చేరకుండానే గ్రూప్‌ను చూడగలరా?"
      a: "లేదు. వాళ్లు లింక్ లేదా QR కోడ్, ఉచిత ఖాతాతో చేరతారు, కాబట్టి లోపలికి వచ్చాకే గ్రూప్‌ను చూడగలరు."
    - q: "Side Badger డబ్బు వసూలు చేయగలదా?"
      a: "లేదు. Side Badger లెక్క ఉంచుతుంది, డబ్బును ఎప్పుడూ కదిలించదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి. ఇది ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు; [ధరలు](page:pricing) చూడండి."
    - q: "ఓట్లు పేర్లు లేకుండా ఉండవచ్చా?"
      a: "అవును. పోల్ సృష్టించేటప్పుడు ఎవరు ఎవరికి ఓటు వేశారో దాచవచ్చు. సెట్టింగ్‌లు మొదటి ఓటుకు ముందు మాత్రమే మార్చవచ్చు."
    - q: "వేర్వేరు మొత్తాలు ఇవ్వవచ్చా?"
      a: "అవును. ఖర్చును ఖచ్చితమైన మొత్తాలతో పంచండి, అప్పుడు ప్రతి వ్యక్తి వాటా మీరు అంగీకరించిన అంకెనే అవుతుంది, లేదా భాగం కాని వాళ్లను వదిలేయండి."
    - q: "నిర్వాహకుడు లెక్కలు చూడవచ్చా?"
      a: "అవును. మేనేజ్డ్ గ్రూప్ ప్రీసెట్ వాడండి, అప్పుడు సృష్టికర్తలు, అడ్మిన్లు మాత్రమే ఖర్చులను మార్చగలరు, అడ్మిన్లు కొత్త సభ్యులను ఆమోదిస్తారు."
