meta:
  title: レシートをスキャンして支出を追加 | Side Badger
  description: レシートはアナグマにお任せ。合計、日付、場所を入力するので確認してください。スキャンのクレジットはありません。画像を読み取るのはGoogleのAIサービスです。
h1: レシートをスキャンして、確認して、割り勘
navLabel: レシートのスキャン
lead: レシートはアナグマに読ませて、その宿題の採点はあなたが。新しい支出に写真を追加すると、Side Badgerが合計、日付、場所を入力するので、確認してください。そのあとは、ほかの支出と同じように[割り勘の仕方](page:feature/split-expenses)で分けます。スキャンは無料で、スキャンのクレジットはありません。入力されるのは1件の支出で、請求書を品目ごとに分けることはしません。レシート画像はGoogleのAIサービスが読み取ります。
cta:
  heading: 撮って、確認して、割り勘。
  body: 無料アカウントを作成し、グループを始めて、レシートの写真付きで支出を追加しましょう。入力された内容を見て、おかしいところは直し、納得したら保存します。
problem:
  heading: タクシー乗り場の行列で、レシートを打ち込みたい人はいない
  body: 旅行や盛大な夜遊びには、紙がついてきます。夕食、タクシー、1杯のつもりが6杯になった飲み会。冷えた指で、後ろに行列を背負いながら1枚ずつスマートフォンに打ち込めば、支出を忘れてしまうのも当然です。そこで、Side Badgerがレシートを読み取ります。下書きは任せて、確認はあなたの仕事です。レシートが誰も処理したくないペースで溜まっていく[グループ旅行](page:use-case/group-trips)や[イベントやお祝い](page:use-case/events-and-celebrations)に向いています。
workflow:
  heading: 写真から支出まで、3ステップ
  steps:
    - title: 新しい支出にレシートを追加する
      body: "新しい支出を始めて**レシートをスキャン**をタップするか、ダッシュボードの**レシートをスキャン**クイックアクションを使います。写真を撮るか、すでにある写真を選びます。フォームの**レシートまたは添付を追加**からでも同じです。"
    - title: レシートを読み取らせる
      body: "Side BadgerのAIが画像を読み取っている間、フォームには**レシートを解析中...**と表示されます。そのあと、見つかった内容（説明、合計、通貨、日付、時刻、場所など）を入力します。すでに入力済みの内容には手を付けません。"
      shot: S09
      shotAlt: 「レシートを解析中...」と表示された新しい支出フォームと、詳細が入力された同じフォーム
    - title: 確認して、それから割り勘
      body: フォームと紙を見比べます。おかしいところは直し、誰が支払い、誰が費用を分け合ったかを入力し、分け方を選んで保存します。保存するまで、支出は存在しません。分け方は[割り勘の仕方](page:feature/split-expenses)で説明しています。
options:
  heading: オプション
  items: []
sections:
  - heading: 入力される内容
    body: 新しい支出にレシート画像を追加すると、次の項目が入力されることがあります。誰が支払ったか、誰が費用を分け合ったか、どう分けるかは、これまでどおりあなたが決めます。
    items:
      - 支出の**説明**。
      - "**合計**。"
      - "**通貨**（グループで許可されている場合）。"
      - "**日付**と**時刻**。"
      - "**場所**。"
      - "レシートのテキストコピーが**メモ**に入ります。紙のレシートが色あせたり、洗濯機に入ってしまったりしたときのために。"
  - heading: それでも確認すること
    body: 全部です。入力された内容は下書きとして扱ってください。合計を紙と照らし合わせ、そのあと通貨、日付、場所を確認します。ぼやけた写真やくしゃくしゃの紙は、どんな読み手でも惑わされることがあり、すべてのレシートを正しく読み取れるとはお約束できません。保存する前に必ず目を通してください。おかしいところは、上書きして直します。レシートが円で、グループがポンドで精算する場合は、そのあとどうなるかを[複数の通貨](page:feature/multiple-currencies)で説明しています。
  - heading: レシートを支出と一緒に残す
    body: スキャンしてもしなくても、レシートは支出と一緒に残せます。写真またはPDFを、1つの支出につき最大3つ、それぞれ10MBまで添付できます。グループのメンバーは、支出の上でそれを見られます。画像はサムネイルで表示されてビューアで開き、PDFはリンクとして開きます。スキャンした写真も、保存前に外さない限り一緒に添付されます。あの夕食に実際いくらかかったのかと聞かれたら、証拠はすぐそこにあります。
  - heading: レシートの行き先
    body: レシート画像はGoogleのAIサービスが読み取ります。フォームに入力するために、画像はGoogleの米国マルチリージョンにあるGoogle Vertex AI（Gemini）が読み取ります。新しい支出に画像を追加すると、読み取られます。PDFや、すでにある支出に追加した写真は、読み取られずに保存されます。添付したレシートはグループのメンバーに見えるので、共有したくない内容が写っているレシートは、写真を使わずにその支出を手入力してください。
limits:
  heading: 制限
  items:
    - 読み取れるのは画像だけです。JPEG、PNG、WebPと、変換後のHEICです。PDFは支出に添付できますが、読み取られません。
    - スキャンは新しい支出のみです。すでにある支出にはレシートを添付できますが、読み取りは行われません。
    - 入力されるのは手を付けていない項目だけで、通貨はグループで許可されている場合に限ります。
    - 品目ごとの分割や、品目を人に割り当てることはしません。入力されるのは1件の支出で、それをいつもどおりご自身で分割します。
    - 入力内容が正しいこと、スキャンが毎回うまくいくことは保証されません。保存する前に確認し、スキャンが失敗したり使えなかったりしたときは、支出を手入力で追加してください。
    - 1つの支出には、JPEG、PNG、WebP、HEIC、PDFの添付を最大3つ、それぞれ10MBまで付けられます。
    - レシート画像はGoogleの米国マルチリージョンにあるGoogle Vertex AI（Gemini）が読み取り、添付したレシートはグループのメンバーに見えます。
useCasesHeading: レシートが溜まる場面
faq:
  heading: よくある質問
  items:
    - q: レシートを品目ごとに分けられますか？
      a: いいえ。合計を含めて支出を入力するだけで、それを均等、金額指定、割合指定で分けます。全員が違うものを注文した請求書は、各自の負担額を金額指定で入力してください。詳しくは[割り勘の仕方](page:feature/split-expenses)をご覧ください。
    - q: PDFを読み取れますか？
      a: いいえ。PDFを支出に添付して数字と一緒に残すことはできますが、読み取られるのは画像だけです。
    - q: スキャンの回数に制限はありますか？
      a: 使い切ってしまうスキャンのクレジットはなく、スキャンは無料です。ファイルには制限があり、1つの支出につき添付は最大3つ、それぞれ10MBまでです。そのほかは[無料で使える範囲](page:pricing)をご覧ください。
    - q: レシートは誰に見えますか？
      a: 支出に添付したレシートは、グループのメンバーに見えます。レシート画像はGoogleのAIサービスも読み取ります。それでフォームに入力されます。
    - q: すでに追加した支出のレシートをスキャンできますか？
      a: いいえ、スキャンは新しい支出のためのものです。すでにある支出にレシートを添付することはでき、その場合は読み取られずに保存されます。
    - q: 間違った内容が入力されたら？
      a: 上書きしてください。保存するまですべての項目を編集できますし、どのみち全部確認してください。スキャンが失敗したり使えなかったりしたときは、いつもどおり支出を手入力で追加します。
