sections:
  - heading: 聊钱的事，就挨着钱聊
    body: "共同的钱总会带来闲聊、疑问和计划。Side Badger 把这三样都放在数字旁边，没人需要再去翻聊天记录。"
    items:
      - "**评论就在该在的地方。**可以评论群组本身，也可以评论任何一笔支出、清单或投票，话题始终挨着它说的那件事。"
      - "**收据和照片。**每笔支出最多可保存三张收据，也可以给群组、清单或投票的评论添加照片或 PDF。"
      - "**提问，不吵架。**管理员可以打开提问功能，之后支出的参与者都可以对它提问。问题没解决之前，这笔支出不计入结余。"
      - "**清单和投票。**把共同的购物清单放在购物账单旁边，把别墅候选名单交给大家投票，想的话还可以匿名。"
      - "**来点掌声。**可以对支出、付款和评论做出回应，款项到账时还能庆祝一下。"
  - heading: 你们的群组，你们定规矩
    body: "Splitwise 的帮助中心说它不支持群组管理员或特殊权限。Side Badger 有角色和权限，给那些需要有人把账目管整齐的群组。"
    items:
      - "**管理员、成员和观察者。**把某人设为观察者：他什么都能看，什么都改不了。"
      - "**两种配置，或者自己定。**可以从“开放”或“受管”开始，也可以自己逐项设置权限：谁能编辑和删除支出、谁能编辑清单、谁能邀请、谁能批准新人加入。"
      - "**加入需批准。**打开批准后，由管理员让每个人加入。"
      - "**群组自己的设置。**只保留你们实际在用的货币，选好它的默认货币，再配一张封面图。"
      - "**结束了就锁上。**数字原封不动，直到管理员解锁。"
  - heading: 这里免费，那里收费
    body: "Splitwise Pro 是 Splitwise 的付费方案，它自己的 Pro 页面卖的三样东西，在 Side Badger 里都不花钱。"
    items:
      - "**收据扫描。**Splitwise Pro 可以扫描收据照片。Side Badger 免费提供，且没有扫描额度：它会填好总额、日期和地点，供你核对。"
      - "**货币换算。**Splitwise Pro 在你点击 Convert 时，把群组的支出换算成你的默认货币。Side Badger 在你录入每笔支出时就换算，按当前汇率或你实际换到的汇率，原始金额会保留在这笔支出上。"
      - "**无每日限制。**Splitwise Pro 卖的是无限支出，它的帮助中心说免费用户每天最多可添加 4 笔支出。Side Badger 没有每日限制。"
  - heading: 你的银行不必牵涉其中
    body: "Side Badger 不连接你的银行，也不会索取你的银行信息。它只记谁欠谁；你们想怎么付就怎么付，然后记录这笔付款。不用交出银行登录信息，要操心的事就少了一件。"
  - heading: 一个应用，浏览器和手机通用
    body: "Side Badger 在你的浏览器里运行。登录后添加到主屏幕，它就会像应用一样打开。两种用法是同一个应用，所以新功能下次打开手机上就有了，不用等应用商店更新。"
  - heading: 还有几个小花样
    items:
      - "**问问你的助手。**Side Badger 能和 ChatGPT 和 Claude 配合：让你的助手添加一笔支出、扫描收据或记录一笔付款。"
      - "**人人用自己的语言。**Side Badger 支持 39 种语言，每个人选自己的。Splitwise 的首页写的是 7 种以上。它还支持 133 种货币，走到哪儿都用得上，旅行也不怕。"
      - "**不用离开应用就能求助。**卡住了，或者发现了 bug？直接在应用里告诉我们，并当场看我们的回复。"
  - heading: Splitwise 依然领先的地方
    body: "我们宁愿你选对应用，也不愿你日后才发现。如果你们群组需要下面这些，Splitwise 有，Side Badger 没有。"
    items:
      - "**应用商店里的应用。**Side Badger 就在你的浏览器和主屏幕上，不在应用商店里。"
      - "**离线模式。**Side Badger 需要联网。"
      - "**应用内付款。**在一些国家，Splitwise 还能转钱。Side Badger 只记账。"
      - "**按份数或按项目分摊。**Side Badger 每笔支出只有一位付款人，可平均分摊、按确切金额或按百分比分摊。它的收据扫描也不会把项目分配给个人。"
      - "**图表和默认分摊。**Splitwise Pro 两者都有。Side Badger 只记下谁欠谁，全部本事就这些。"
  - heading: 把你们的群组搬过来
    body: "没有导入工具，所以搬家意味着重新开始。先在 Splitwise 里结清，再在 Side Badger 里建一个群组，用链接或二维码邀请所有人。群组里每个人都需要一个免费账户，注册只需要一个电子邮箱地址。"
