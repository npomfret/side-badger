meta:
  title: "Díospóid faoi chostas comhroinnte: cad atá le déanamh | Side Badger"
  description: "Scipeáil an teachtaireacht ghéar. Ardaigh ceist faoin gcostas ina áit agus fágann sé iarmhéideanna gach duine agus sibh ag caint. Oibrithe amach le £45 fíona."
h1: "Cad atá le déanamh nuair a bhíonn díospóid ann faoi chostas comhroinnte"
navLabel: "Costais faoi dhíospóid"
lead: "Ardaigh ceist faoin gcostas in ionad teachtaireacht ghéar a sheoladh. Fad is atá an cheist oscailte, fanann an costas ar fad as iarmhéideanna gach duine. Pléigh é sna tráchtanna, cuir an roinnt in eagar má aontaíonn an grúpa, agus lig don duine a chuir an cheist, nó do riarthóir, an cheist a dhúnadh."
cta:
  heading: "Cuir an cheist chiotach go múinte"
  body: "Cruthaigh cuntas saor in aisce, tosaigh grúpa don árasán agus iarr ar riarthóir ceisteanna costais a chur ar siúl, atá múchta go dtí go ndéanann duine éigin amhlaidh. An bhfuil léargas gasta uait ar dtús? Féach [conas a oibríonn sé](page:how-it-works) nó [cad a chlúdaíonn saor in aisce](page:pricing)."
sections:
  - heading: "Triúr comhchónaitheoirí agus £45 fíona"
    body: "Tar éis na cóisire, cuireann Tom an fíon le grúpa an árasáin. Is £45 é, íoctha ag Tom, roinnte go cothrom idir Tom, Priya agus Aisha, is é sin £15 an duine. Ní bhíonn Aisha ag ól. Cheannaigh Tom é don chóisir, agus bhí an chóisir don [árasán](page:use-case/housemates), mar sin ní dhearna sé aon rud mícheart. Níl Aisha mícheart ach an oiread as ceist a chur. Níl aon drochdhuine sa scéal seo. Níl ann ach £15 fíona faoi dhíospóid agus neart bealaí chun é a dhéanamh ciotach. Is bealach amháin é teachtaireacht ghéar chuig an teach. Is bealach níos séimhe é ceist ar an gcostas."
  - heading: "Cad a dhéanann ceist"
    body: "Osclaíonn Aisha an costas agus ardaíonn sí ceist. Titeann an costas ar fad as iarmhéideanna gach duine, ní hamháin a sciar féin, agus ní chuirtear isteach ar aon rud eile. Áirítear an tsiopadóireacht mhór (£84) agus an glantóir (£60) fós, is é sin £28 + £20 = £48 an duine. Mar sin, fad is atá an fíon ar fionraí, tá £48 dlite ag Aisha, tá £36 dlite do Tom agus tá £12 dlite do Priya. Cibé rud a shocraíonn an t-árasán faoin bhfíon, níl sé san áireamh in iarmhéid aon duine idir an dá linn. Is féidir le haon duine eile sa chostas ceist dá chuid féin a ardú freisin. Ní théann an fíon ar ais isteach sna hiarmhéideanna ach nuair a dhúntar an cheist oscailte dheireanach air, agus dúnann an duine a chuir an cheist, nó riarthóir, ceist."
  - heading: "Pléigh é, ansin ceartaigh é"
    body: "Feictear ceist Aisha i dtráchtanna an chostais, mar sin bíonn na freagraí díreach faoina bun. Tá tuilleadh faoi thráchtanna agus faoi cheisteanna in [Pleanáil le chéile](page:feature/plan-together). Léann Tom agus Priya é agus bíonn comhrá ag an árasán. Socraíonn siad gur le Tom agus Priya an fíon, mar gur ól siad é. D'fhéadfadh árasán eile an roinnt trí bhealach a choinneáil, nó aontú ar rud éigin eatarthu, agus bheadh sin ceart go leor freisin. Stórálann Side Badger an méid a aontaíonn sibh agus níl aon tuairim aige faoin bhfíon. Cuireann Tom an costas in eagar ionas go roinntear go cothrom idir é féin agus Priya é, is é sin £22.50 an duine (£45 ÷ 2). Níl Aisha ann a thuilleadh, mar sin imíonn a ceist leis an seanleagan agus filleann an fíon ar na hiarmhéideanna. Coinnítear an leagan roimhe."
  - heading: "An toradh a léamh"
    body: "Leis an bhfíon ar ais isteach, tá £58.50 dlite do Tom, tá £10.50 dlite ag Priya agus tá £48 dlite ag Aisha. Molann Side Badger dhá íocaíocht, an dá cheann chuig Tom. Is é £48 Aisha an figiúr a bhí aici agus an fíon ar fionraí, mar níl sí ann. Chuaigh Priya ó £12 a bheith dlite di go £10.50 a bheith dlite aici, is é sin a leath den fhíon, £22.50. Dá bhfanfadh an roinnt idir an triúr, bheadh £63 dlite ag Aisha (£28 + £20 + £15). Ní raibh san easaontas ar fad ach £15. Íocaigí a chéile ar an gcaoi is fearr libh, ansin taifead gach íocaíocht faoi **Socraigh**. Clúdaíonn [socrú suas](page:feature/settle-up) an chuid eile."
  - heading: "Foclaíocht a choinníonn daoine ag caint leat"
    body: "Ceist Aisha: “Níor ól mé aon deoir den fhíon. An bhféadfaimis féachaint ar an roinnt?” Tá sí gearr, ainmníonn sí an costas agus fiafraíonn sí in ionad cúisiú. Cabhraíonn cúpla nós."
    items:
      - "**Fiafraigh faoin gcostas, ní faoin duine.** Cuireann “An bhféadfaimis an roinnt ar an bhfíon a sheiceáil?” comhrá ar bun. Tosaíonn “Cén fáth ar gearradh orm as d'fhíon?” comhrá de chineál eile."
      - "**Abair cad ba mhaith leat a tharlú.** Tugann “An bhféadfadh sé a bheith ar na daoine a d'ól é amháin?” rud éigin don ghrúpa le haontú leis nó le freagairt."
      - "**Tabhair cúis in abairt nó dhó.** Is é **Do cheist** an réimse agus ní féidir é a fhágáil folamh."
      - "**Coinnigh na freagraí in aon áit amháin.** Téann freagraí isteach i dtráchtanna an chostais, in aice leis na huimhreacha a bhaineann leo."
  - heading: "Socraigh é i Side Badger"
    items:
      - "**Cuir ceisteanna ar siúl.** Tá siad múchta de réir réamhshocraithe. Osclaíonn riarthóir **Socruithe** an ghrúpa, cuireann **Cead ceisteanna faoi chaiteachais** ar siúl faoi **Gnéithe** ar an gcluaisín **Ginearálta** agus roghnaíonn **Sábháil**. Má mhúchtar é níos déanaí, glantar gach ceist oscailte."
      - "**Ardaigh ceann.** Oscail an costas agus, in aice le d'ainm féin sa roinnt, roghnaigh **Tá ceist agam**. Scríobh do chúis in **Do cheist** agus roghnaigh **Tá ceist agam** arís. Ní féidir ach le daoine atá sa chostas é seo a dhéanamh. Taispeánann an costas suaitheantas **Ceistithe** anois."
      - "**Aimsigh cad atá ar fionraí.** Sa liosta costas, taispeánann **Ceistithe amháin** na costais a bhfuil ceist oscailte orthu."
      - "**Ceartaigh é, má aontaíonn an grúpa.** Oscail an costas, roghnaigh **Cuir in eagar**, athraigh **Roinn idir** agus roghnaigh **Nuashonraigh an Costas**. Braitheann cé a fhéadann é a chur in eagar ar cheadanna an ghrúpa."
      - "**Dún é, mura bhfuil aon rud le ceartú.** Is féidir leis an duine a chuir an cheist an cnaipe dúnta ar a suaitheantas **Ceistithe** a úsáid, ar a bhfuil **Dún an cheist** scríofa, agus is féidir le riarthóir amhlaidh a dhéanamh. Filleann an costas ar na hiarmhéideanna a luaithe a dhúntar an cheist dheireanach air."
  - heading: "Nuair nach bhfuil sé chomh néata sin"
    items:
      - "**Coinníonn an t-athrú an duine a chuir an cheist sa chostas.** Má tá an duine a chuir an cheist fós sa chostas, téann an cheist ar aghaidh chuig an leagan athraithe agus fanann sí go ndúnfaidh an duine sin í, nó riarthóir. Ní hionann an méid a cheartú agus aontú go bhfuil sé ceartaithe."
      - "**Ní raibh tú sa chostas.** Ní féidir ach le daoine atá i gcostas ceist a ardú air. Má fhéachann rud éigin mícheart duit, abair é sna tráchtanna air nó fiafraigh den té a chuir leis é."
      - "**Tá duine ag iarraidh an grúpa a fhágáil.** Cuireann ceist oscailte cosc ar na daoine sa chostas sin imeacht. Dún an cheist, nó cuir an costas in eagar ionas nach bhfuil siad ann a thuilleadh, agus is féidir leo imeacht."
  - heading: "Cad nach ndéanann Side Badger anseo"
    items:
      - "Ní chinneann sé cé atá ceart. Coinníonn sé an costas as na hiarmhéideanna agus coinníonn sé an méid a aontaíonn sibh."
      - "Ní iarrann sé ar aon duine costais a cheadú sula n-áirítear iad. Ní choinnítear ach costas ceistithe."
      - "Ní féidir leis cuid de chostas a choinneáil siar. Ceistigh é agus fágann an costas ar fad na hiarmhéideanna."
      - "Ní bhogann sé airgead. Íocann sibh a chéile ar an gcaoi is fearr libh agus taifeadann sibh é."
