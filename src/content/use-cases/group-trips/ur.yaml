faq:
  heading: "سوالات"
  items:
    - q: "کیا جنہوں نے ڈنر چھوڑا انہیں نکالا جا سکتا ہے؟"
      a: "جی ہاں۔ چنیں کہ ہر خرچے میں کون شریک تھا، اور صرف ان سے وصول کیا جاتا ہے۔"
    - q: "کیا یہ سگنل کے بغیر کام کرتا ہے؟"
      a: "نہیں۔ Side Badger کو کنکشن چاہیے، اس لیے وائی فائی پر واپس آ کر اخراجات شامل کریں۔"
    - q: "کیا ہر ایک کو کچھ انسٹال کرنا پڑتا ہے؟"
      a: "نہیں۔ یہ براؤزر میں چلتا ہے۔ دعوتی لنک بھیجیں اور لوگ اپنے فون سے شامل ہو جاتے ہیں۔"
    - q: "یہ کون سا ایکسچینج ریٹ استعمال کرتا ہے؟"
      a: "خرچہ درج کرتے وقت ایک موجودہ ایکسچینج ریٹ، یا آپ کا اپنا اگر آپ کو مختلف ملا۔ خرچہ محفوظ ہوتے ہی ریٹ طے ہو جاتا ہے، اس لیے پرانے اخراجات کی قدر دوبارہ کبھی نہیں لگتی۔"
    - q: "کیا سفر کے بعد ہم گروپ کو منجمد کر سکتے ہیں؟"
      a: "جی ہاں۔ ایڈمن گروپ کو مقفل کر سکتا ہے تاکہ اعداد اپنی جگہ رہیں۔"
    - q: "کیا رقم کی کوئی حد ہے؟"
      a: "جی ہاں۔ فی خرچہ 999,999.99، اس کی اپنی کرنسی میں۔"
