faq:
  heading: "Pertanyaan soal vila"
  items:
    - q: "Bagaimana jika ada yang batal?"
      a: "Keluarkan malam mereka, hitung ulang, dan ubah pengeluaran vila agar jumlah pastinya kembali berjumlah sama dengan harga. Versi sebelumnya disimpan dan perubahannya tampak di aktivitas grup, jadi tak ada yang mengubah angka diam-diam. Siapa yang boleh mengubah bergantung pada izin grup."
    - q: "Haruskah orang yang memesan membayar lebih sedikit?"
      a: "Itu keputusan grup. Memesan itu repot, dan tiap grup berbeda pendapat soal apakah itu pantas mendapat potongan. Apa pun yang Anda sepakati, masukkan ke jumlah pasti dan tulis di catatan pada pengeluaran, atau di komentar di sampingnya, supaya tak ada yang harus mengingat kesepakatannya."
    - q: "Bisakah biaya kebersihan dibagi dengan cara berbeda?"
      a: "Bisa. Masukkan biayanya sebagai pengeluaran terpisah dan beri pembagiannya sendiri. Rata cocok untuk biaya tetap seluruh rumah. Jumlah pasti cocok untuk grup yang ingin biaya itu juga mengikuti jumlah malam."
