meta:
  title: Hatiin ang gastos sa group trip, sa 140 pera
  description: Subaybayan kung sino ang nagbayad ng ano sa group trip, ilagay ang gastos sa lokal na pera, i-convert o hindi, at mag-settle nang isang beses sa dulo. Libre, sa browser mo.
h1: Hatiin ang gastos sa group trip, sa 140 pera
navLabel: Mga group trip
lead: Subaybayan ang villa, ang taxi, at ang isang round ng cocktail na walang naaalalang nag-volunteer bumili. Nagtatabi ang Side Badger ng tumatakbong bilang habang wala ka, [kayang hawakan ang pounds, euro, at 138 pang pera](page:feature/multiple-currencies), at ibibigay ang [maikling listahan ng mga bayad](page:feature/settle-up) pag-uwi ninyo.
cta:
  heading: Kuwenta ng bakasyon, tapos bago pa kumupas ang tan
  body: Gumawa ng grupo, ipadala ang invite link sa mga kasama sa biyahe, at idagdag ang mga gastos habang nangyayari.
  button: Gumawa ng libreng account
scenario:
  heading: Lahat ay nagbayad ng kung ano, sa kung anong pera
  body: May nag-book ng mga flight, may isa pang naglagay ng villa sa card, at may ikatlong nagbayad ng hapunan nang cash. Pagdating ng ikatlong araw, walang nakakaalam kung sino ang nauuna. Simple ang tanong, kahit madalas nasa spreadsheet na ayaw buksan ng sinuman ang sagot. Sino ang nagbayad ng ano, sa anong pera, at paano mag-settle ang lahat nang isang beses sa dulo?
sections:
  - heading: Bago kayo umalis
    body: Ipaboto ang shortlist ng villa, nang anonymous kung gusto, para sa grupo ang desisyon at hindi sa pinakamatagal magtampo. Saka ilagay ang shared na listahan ng bibilhin sa tabi ng mga bayarin sa pamimili, para walang bibili ng tatlong sunscreen at walang plug adaptor.
  - heading: Habang wala kayo
    body: Idagdag ang bawat gastos habang nangyayari, sa perang ginamit mo sa pagbayad. Kunan ng litrato ang resibo at pupunan ng Side Badger ang kabuuan, petsa, at lugar para suriin mo; binabasa ng AI service ng Google ang mga larawan ng resibo. I-convert ang halaga sa kasalukuyang exchange rate, na mababago mo sa rate na aktuwal mong nakuha, at mananatili sa gastos ang orihinal na halaga. O hayaang euro ang euro at magpasya mamaya. Puwede ring pumili ng isang pera ang grupo, at kusang iko-convert dito ang mga bagong gastos.
  - heading: Hindi lahat ay sumali sa lahat
    body: May nilaktawan ang hapunan, may hindi sumama sa bangka. Huwag silang isama sa mga gastos na hindi nila kasali, at hatiin ang natitira [nang pantay, ayon sa eksaktong halaga, o ayon sa porsyento](page:feature/split-expenses). Walang magbabayad para sa bahagi ng biyaheng ginugol nila sa pagtulog.
  - heading: Mag-settle pag-uwi
    body: Nagmumungkahi ang Side Badger ng maikling listahan ng mga bayad na nagse-settle sa lahat. Magbayaran kayo sa paraang gusto ninyo, saka itala. Kung magkakaiba ang pera, panatilihing magkahiwalay ang bawat isa o mag-convert habang tumatakbo; ipinapakita ng halimbawa sa Lisbon sa ibaba ang dalawa.
  - heading: Bachelor at bachelorette weekend
    body: Mas maraming asikaso ang weekend na may bida. Gawin itong pinamamahalaang grupo, kung saan inaaprubahan ng mga admin ang mga bagong miyembro at tanging mga creator at admin lang ang makakapagbago ng mga gastos. Gumamit ng eksaktong halaga para sa bahagi ng bida, limitahan ang grupo sa mga perang talagang ginagamit ninyo, at i-lock ang grupo kapag tapos na para manatili ang mga numero.
