meta:
  title: "ماذا تفعل حين يعترض أحد على مصروف مشترك | Side Badger"
  description: "تجاوز الرسالة اللاذعة. اطرح سؤالاً على المصروف فيخرج من أرصدة الجميع أثناء حديثكم. مثال محسوب بـ£45 من نبيذ الحفلة."
h1: "ماذا تفعل حين يعترض أحد على مصروف مشترك"
navLabel: "مصروفات محل خلاف"
lead: "اطرح سؤالاً على المصروف بدل أن ترسل رسالة لاذعة. وما دام السؤال مفتوحاً، يبقى المصروف كله خارج أرصدة الجميع. تحدثوا في التعليقات، وعدّلوا التقسيم إن وافقت المجموعة، ودعوا من سأل، أو أحد المشرفين، يغلق السؤال."
cta:
  heading: "اطرح السؤال المحرج بلباقة"
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة للشقة، واطلب من أحد المشرفين تفعيل أسئلة المصروفات، فهي معطّلة إلى أن يفعّلها أحد. تريد الجولة أولاً؟ انظر [كيف يعمل](page:how-it-works) أو [ما الذي يشمله الاستخدام المجاني](page:pricing)."
sections:
  - heading: "ثلاثة من زملاء السكن و£45 من النبيذ"
    body: "بعد الحفلة، يضيف توم النبيذ إلى مجموعة الشقة. ثمنه £45، دفعها توم، ويُقسَّم بالتساوي بين توم وبريا وعائشة، أي £15 لكل واحد. وعائشة لا تشرب. اشترى توم النبيذ للحفلة، وكانت الحفلة لـ[الشقة](page:use-case/housemates) كلها، فلم يخطئ في شيء. وعائشة ليست مخطئة في السؤال أيضاً. لا يوجد هنا شرير. هناك فقط نبيذ بقيمة £15 محل خلاف، وطرق كثيرة لجعل الأمر محرجاً. الرسالة اللاذعة إلى البيت واحدة منها. أما السؤال على المصروف فطريقة ألطف."
  - heading: "ماذا يفعل السؤال"
    body: "تفتح عائشة المصروف وتطرح سؤالاً. يخرج المصروف كله من أرصدة الجميع، لا حصتها وحدها، ولا يتأثر شيء آخر. ويبقى التسوق الكبير (£84) وخدمة التنظيف (£60) محسوبين، أي £28 + £20 = £48 لكل واحد. فما دام النبيذ معلّقاً، تدين عائشة بمبلغ £48، ويستحق توم £36، وتستحق بريا £12. وأياً كان ما تقرره الشقة بشأن النبيذ، فلا يتضمنه رصيد أحد في هذه الأثناء. ويستطيع أي شخص آخر في المصروف أن يطرح سؤالاً خاصاً به أيضاً. ولا يعود النبيذ إلى الأرصدة إلا حين يُغلق آخر سؤال مفتوح عليه، ويغلق السؤال من طرحه أو أحد المشرفين."
  - heading: "الحديث أولاً، ثم الإصلاح"
    body: "يصل سؤال عائشة إلى تعليقات المصروف، فتقع الردود تحته مباشرة. وفي [خططوا معاً](page:feature/plan-together) المزيد عن التعليقات والأسئلة. يقرأ توم وبريا السؤال وتتحدث الشقة. فيقرّرون أن النبيذ كان لتوم وبريا، لأنهما هما من شربه. وقد تحتفظ شقة أخرى بالتقسيم الثلاثي، أو تتفق على شيء بينهما، وهذا مقبول أيضاً. يحفظ Side Badger ما تتفقون عليه ولا رأي له في النبيذ. يعدّل توم المصروف ليُقسَّم بالتساوي بينه وبين بريا، أي £22.50 لكل منهما (£45 ÷ 2). ولم تعد عائشة فيه، فيذهب سؤالها مع النسخة القديمة ويعود النبيذ إلى الأرصدة. وتُحفظ النسخة السابقة."
  - heading: "قراءة النتيجة"
    body: "مع عودة النبيذ، يستحق توم £58.50، وتدين بريا بمبلغ £10.50، وتدين عائشة بمبلغ £48. ويقترح Side Badger دفعتين، كلتاهما إلى توم. ومبلغ عائشة £48 هو الرقم الذي كان عليها وقت تعليق النبيذ، لأنها ليست فيه. أما بريا فانتقلت من استحقاق £12 إلى دَين قدره £10.50، والفرق هو نصيبها من النبيذ، أي £22.50. ولو بقي التقسيم الثلاثي لكانت عائشة مدينة بمبلغ £63 (£28 + £20 + £15). والخلاف كله كان يساوي £15. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا كل دفعة تحت **تسوية**. وفي [تسوية الحسابات](page:feature/settle-up) بقية التفاصيل."
  - heading: "صياغته بحيث يبقى الناس يكلّمونك"
    body: "سؤال عائشة: «لم أشرب شيئاً من النبيذ. هل يمكننا إعادة النظر في التقسيم؟» إنه قصير، ويذكر المصروف، ويسأل ولا يتهم. وتفيد بضع عادات."
    items:
      - "**اسأل عن المصروف لا عن الشخص.** «هل يمكننا مراجعة تقسيم النبيذ؟» تبدأ حواراً. أما «لماذا حُمِّلت ثمن نبيذك؟» فتبدأ حواراً من النوع الآخر."
      - "**قل ما تتمنى أن يحدث.** «هل يمكن أن يقتصر على من شربوه؟» تمنح المجموعة شيئاً توافق عليه أو تجيب عنه."
      - "**اذكر سبباً في جملة أو جملتين.** الحقل اسمه **سؤالك** ولا يمكن تركه فارغاً."
      - "**أبقِ الردود في مكان واحد.** تذهب الإجابات إلى تعليقات المصروف، بجانب الأرقام التي تخصها."
  - heading: "أعدّ ذلك في Side Badger"
    items:
      - "**فعّل الأسئلة.** هي معطّلة افتراضياً. يفتح أحد المشرفين **الإعدادات** الخاصة بالمجموعة، ويفعّل **السماح بأسئلة المصاريف** تحت **الميزات** في تبويب **عام**، ثم يختار **حفظ**. وتعطيلها لاحقاً يمسح كل الأسئلة المفتوحة."
      - "**اطرح سؤالاً.** افتح المصروف، واختر **لدي سؤال** بجانب اسمك في التقسيم. اكتب سببك في **سؤالك**، ثم اختر **لدي سؤال** مرة أخرى. لا يستطيع ذلك إلا من هم في المصروف. ويعرض المصروف الآن شارة **مستفسر عنه**."
      - "**اعثر على المعلّق.** في قائمة المصروفات، يعرض **المستفسر عنها فقط** المصروفات التي عليها سؤال مفتوح."
      - "**أصلحه إن وافقت المجموعة.** افتح المصروف، واختر **تعديل**، وغيّر **تقسيم بين**، ثم اختر **تحديث المصروف**. ومن يستطيع التعديل تحدده أذونات المجموعة."
      - "**أغلقه إن لم يحتج إلى إصلاح.** يستطيع من سأل استخدام زر الإغلاق على شارة **مستفسر عنه** الخاصة به، واسمه **إغلاق السؤال**، وكذلك المشرف. ويعود المصروف إلى الأرصدة حين يُغلق آخر أسئلته."
  - heading: "حين لا يكون الأمر مرتباً إلى هذا الحد"
    items:
      - "**التعديل يُبقي السائل في المصروف.** إذا ظل من سأل في المصروف، ينتقل سؤاله إلى النسخة المعدّلة وينتظر أن يغلقه هو أو أحد المشرفين. فإصلاح المبلغ لا يعني الاتفاق على أنه صار صحيحاً."
      - "**لم تكن في المصروف.** لا يستطيع طرح سؤال على المصروف إلا من هم فيه. فإذا بدا لك شيء غير صحيح، فقله في تعليقاته أو اسأل من أضافه."
      - "**أحدهم يريد مغادرة المجموعة.** السؤال المفتوح يمنع من هم في ذلك المصروف من المغادرة. أغلق السؤال، أو عدّل المصروف بحيث لا يكونون فيه، فيستطيعون الذهاب."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا يقرر من على حق. إنه يُبقي المصروف خارج الأرصدة ويحفظ ما تتفقون عليه."
      - "لا يطلب من أحد الموافقة على المصروفات قبل أن تُحتسب. فالمصروف المستفسر عنه وحده هو الذي يُعلَّق."
      - "لا يستطيع حجب جزء من المصروف. اسأل عنه فيخرج كله من الأرصدة."
      - "لا ينقل المال. تدفعون لبعضكم بالطريقة التي تناسبكم وتسجّلون ذلك."
