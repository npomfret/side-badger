featuresHeading: "Les fonctionnalités qu'un logement utilise"
faq:
  heading: Questions
  items:
    - q: "Le loyer peut-il se répéter automatiquement ?"
      a: "Non, il n'y a pas de factures récurrentes. Copiez le loyer du mois dernier en quelques touches, changez la date et c'est fait."
    - q: "Peut-on partager selon la taille des chambres ?"
      a: "Oui, par pourcentage. Donnez à chaque colocataire une part qui reflète sa chambre, tant que les parts font 100 au total. [Partager les dépenses](page:feature/split-expenses) présente les autres façons de partager."
    - q: "Et si un colocataire déménage en devant de l'argent ?"
      a: "Il ne peut pas quitter le groupe avant d'avoir réglé, car personne ne peut partir tant qu'il doit de l'argent ou qu'on lui en doit. Les chiffres restent honnêtes jusqu'à ce que tout le monde soit quitte."
    - q: "Side Badger paie-t-il les factures ?"
      a: "Non. Il tient le compte et suggère une courte liste de paiements. Vous vous remboursez comme vous voulez, puis vous l'enregistrez, comme l'explique [régler les comptes](page:feature/settle-up)."
    - q: "Un colocataire peut-il tenir les comptes ?"
      a: "Oui. Faites de lui un admin et utilisez un groupe géré, où les nouveaux membres ont besoin d'une approbation et où seuls les créateurs et les admins peuvent modifier les dépenses."
