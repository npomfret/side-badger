faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "Side Badger ఏ మారకం రేటు వాడుతుంది?"
      a: "ప్రస్తుత మారకం రేటు, అందుబాటులో ఉన్న చోట మీరు ఖర్చు నమోదు చేసేటప్పుడు తెస్తుంది. మీకు నిజంగా దొరికిన రేటుకు దాన్ని మార్చవచ్చు."
    - q: "గ్రూప్ పౌండ్లు, యెన్‌లకే పరిమితం కావచ్చా?"
      a: "అవును. గ్రూప్ **సెట్టింగ్‌లు**లో **కరెన్సీ సెట్టింగ్‌లు** కింద **ఈ సమూహం కోసం కరెన్సీలను పరిమితం చేయండి** ఆన్ చేయండి, **అనుమతించబడిన కరెన్సీలు** ఎంచుకోండి, **కొత్త ఖర్చుల కోసం ప్రామాణిక కరెన్సీ** సెట్ చేయండి. జాబితాలో ఎంపికలు తక్కువ, కౌంటర్ దగ్గర తప్పు అంచనాలు తక్కువ."
    - q: "అసలు మనం మార్చాల్సిందేనా?"
      a: "లేదు. మీరు లేదా మీ గ్రూప్ మార్చాలని నిర్ణయించుకుంటే తప్ప కరెన్సీలు విడిగానే ఉంటాయి, ప్రతి కరెన్సీకి దాని సొంత చిన్న పేమెంట్ల జాబితా వస్తుంది."
