faq:
  heading: "سوالات"
  items:
    - q: "کون سا زیادہ منصفانہ ہے، کمرے کا سائز یا آمدنی؟"
      a: "ہمیشہ کوئی ایک نہیں۔ کمرے کا سائز ان ساتھیوں کے لیے موزوں ہے جو اس جگہ کی قیمت دیتے ہیں جس میں وہ سوتے ہیں۔ آمدنی ان جوڑوں اور دوستوں کے لیے موزوں ہے جن کی تنخواہیں بہت مختلف ہیں۔ اتفاق پہلے کرائے کی تاریخ سے پہلے کر لیں، بعد میں نہیں۔"
    - q: "کیا بل بھی اسی طرح تقسیم ہونے چاہئیں؟"
      a: "ساتھ رہنے والوں کے لیے عموماً نہیں۔ بجلی اور براڈبینڈ سب استعمال کرتے ہیں، اس لیے برابر تقسیم آسان ہے، جیسا مثال میں ہے۔ آمدنی کے مطابق ہو تو کیلکولیٹر بلوں کو کرائے والے ہی حصے دیتا ہے۔"
    - q: "کیا میں مربع فٹ استعمال کر سکتا ہوں؟"
      a: "جی ہاں۔ ft² چنیں اور اپنے رقبے مربع فٹ میں لکھیں۔ اکائی صرف ایک لیبل ہے، اور جب تک سب ایک ہی اکائی استعمال کریں حصے وہی نکلتے ہیں۔"
    - q: "کیا کیلکولیٹر مفت ہے؟"
      a: "جی ہاں۔ مفت۔ کوئی اشتہار نہیں۔ کوئی یومیہ حد نہیں۔ اکاؤنٹ کی بھی ضرورت نہیں۔"
