meta:
  title: "స్టాగ్ లేదా హెన్ వీకెండ్ ఖర్చును ఎలా పంచాలి | Side Badger"
  description: "గౌరవ అతిథి ఏమీ చెల్లించరు, సోమవారానికి కూడా అందరూ మాట్లాడుకుంటూనే ఉంటారు. స్టాగ్ లేదా హెన్ వీకెండ్ ఖర్చును లెక్కలతో ఎలా పంచాలి."
h1: "స్టాగ్ లేదా హెన్ వీకెండ్ ఖర్చును ఎలా పంచాలి"
navLabel: "స్టాగ్ లేదా హెన్ వీకెండ్"
lead: "గౌరవ అతిథి ఏమీ చెల్లించరు, కాబట్టి మిగతా గ్రూప్ ప్రతి ఖర్చునూ తమలో [సమానంగా](page:feature/split-expenses) పంచుకుంటుంది. ఎవరైనా దేనికైనా రాకపోతే ఆ ఖర్చు నుంచి వాళ్లను వదిలేయండి, సర్ప్రైజ్ నిలబడేలా గౌరవ అతిథిని గ్రూప్ బయటే ఉంచండి."
cta:
  heading: లెక్క ఉంచండి, సర్ప్రైజ్ ఉంచండి
  body: "గ్రూప్ చేసి, గౌరవ అతిథి తప్ప అందరికీ లింక్ పంపి, ప్రతి ఖర్చును జరిగినప్పుడే జోడించండి. Side Badger ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
sections:
  - heading: "నలుగురు స్నేహితులు, ఒక సర్ప్రైజ్"
    body: "Hannah, Isla, Jess, Kat కలిసి Graceను ఆమె హెన్ వీకెండ్‌కు తీసుకెళ్తున్నారు. Grace గౌరవ అతిథి, కాబట్టి ఆమె దేనికీ చెల్లించదు. ఆమె గ్రూప్‌లో కూడా లేదు, కాబట్టి స్నేహితులు తనపై ఎంత ఖర్చు పెడుతున్నారో చూడలేదు. Hannah కాటేజ్ బుక్ చేస్తుంది, Isla స్పా రోజుకు చెల్లిస్తుంది, Jess డిన్నర్ చూసుకుంటుంది, Kat ట్యాక్సీ తీసుకుంటుంది. ఆదివారానికి ప్రతి ఒక్కరూ ఏదో ఒకదానికి చెల్లించారు, ఎవరు ముందున్నారో ఎవరికీ తెలియదు. గౌరవ అతిథి ఎవరైనా సరే, స్టాగ్ అయినా హెన్ అయినా లెక్కలు ఒకటే."
  - heading: "ఉన్నవాళ్లతో కాదు, చెల్లించేవాళ్లతో భాగించండి"
    body: "గౌరవ అతిథి వాటా మాయం కాదు. అది పంచబడుతుంది. కాటేజ్ £720, నలుగురు స్నేహితులు చెల్లిస్తారు, కాబట్టి ఒక్కొక్కరికి £180, Grace స్థానం ఇప్పటికే ఆ అంకెలో ఉంది. డిన్నర్ £260, అంటే ఒక్కొక్కరికి £65. ట్యాక్సీ £44, అంటే ఒక్కొక్కరికి £11. ఎవరైనా దేన్నైనా వదిలేస్తే, అది ఆ ఖర్చు నుంచి మాత్రమే పోతుంది. Kat స్పాకు రాదు, కాబట్టి దాని £360 (Grace స్థానమూ అందులో ఉంది) Hannah, Isla, Jess మధ్య ఒక్కొక్కరికి £120 చొప్పున పంచబడుతుంది. అన్నీ కలిపితే, Hannah, Isla, Jess ఒక్కొక్కరు వీకెండ్‌లో £376 ఇవ్వాలి, Kat £256 ఇవ్వాలి."
  - heading: "Side Badgerలో సెట్ చేయడం"
    items:
      - "వీకెండ్ కోసం ఒక గ్రూప్ చేసి దానికి చప్పగా ఉండే పేరు పెట్టండి, ఉదాహరణకు Cottage weekend. Grace సభ్యురాలు కాదు, గ్రూప్‌ను చూడగలవాళ్లు సభ్యులు మాత్రమే."
      - >-
        **ఇతరులను ఆహ్వానించండి** ఎంచుకుని, Grace చూడని చోట మాత్రమే లింక్ పంపండి లేదా QR కోడ్ చూపండి. ఎవరైనా చేరే ముందు లింక్ గ్రూప్ ప్రివ్యూ చూపిస్తుంది. అది ఎంతసేపు ఉండాలో 15 నిమిషాల నుంచి 5 రోజుల మధ్య ఎంచుకోండి. పాత లింక్ గడువు ముగిసే వరకు పనిచేస్తూనే ఉంటుంది, కాబట్టి అవసరమైనంత కంటే ఎక్కువసేపు ఉంచకండి.
      - >-
        ప్రతి ఖర్చుకు **ఖర్చును జోడించు** ఎంచుకుని, మొత్తం నింపి, **ఎవరు చెల్లించారు?** కింద చెల్లించినవారిని ఎంచుకోండి. **ఎవరి మధ్య విభజించాలి** కింద చెల్లించేవాళ్లను టిక్ చేయండి, స్పాకు Kat లాగా ఏదైనా వదిలేసినవాళ్లను టిక్ చేయకండి. **ఎలా విభజించాలి** కింద **సమానం** ఎంచుకోండి.
      - >-
        ఇంటికి వచ్చాక గ్రూప్ **బ్యాలెన్స్‌లు** తెరవండి. Side Badger ఎవరు ఎవరికి బాకీనో చూపించి, పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది. ఇక్కడ అవి మూడు: Kat Hannahకు £212 చెల్లిస్తుంది, Jess Hannahకు £116 చెల్లిస్తుంది, Isla Hannahకు £16 చెల్లిస్తుంది. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుని, ప్రతి పేమెంట్‌ను **సెటిల్ చేయి** ఉపయోగించి రికార్డ్ చేయండి.
  - heading: "బుక్ చేసే ముందు, బడ్జెట్, డిపాజిట్"
    body: "ఎవరైనా బుక్ చేసే ముందే బడ్జెట్ ఒప్పుకోండి. **పోల్‌ను జోడించు** ఎంచుకుని, కాటేజ్‌పై గ్రూప్ ఎంత ఖర్చు పెడుతుందో అడిగి, కొన్ని అంకెలను ఎంపికలుగా ఇవ్వండి. ఎవరు ఎవరికి ఓటు వేశారో దాచడానికి, దాన్ని సృష్టించేటప్పుడు **అనామక ఓటింగ్**ను ఆన్ చేయండి, అప్పుడు చిన్న బడ్జెట్‌ను ఎవరూ అందరి ముందు సమర్థించుకోనక్కర్లేదు. అందరూ ఓటు వేశాక పోల్‌ను మూసేస్తే గెలిచింది కనిపిస్తుంది. తర్వాత డిపాజిట్. బుక్ చేసినవాళ్లు దాన్ని చెల్లించి ఖర్చుగా జోడిస్తారు, సమానంగా పంచుతారు, బ్యాలెన్స్ గడువు వచ్చినప్పుడు రెండో ఖర్చుగా చేరుతుంది. మిగతావాళ్లు తమ వాటాను వెంటనే పంపి పేమెంట్‌ను రికార్డ్ చేయవచ్చు, లేదా తుది లెక్క వరకు ఆగవచ్చు. ఎలా చేసినా బ్యాలెన్స్‌లు ఒకేలా వస్తాయి."
  - heading: "ఒక్క రాత్రికే ఎవరైనా చేరితే"
    body: "శనివారం మాత్రమే వచ్చే స్నేహితుడు శుక్రవారానికి చెల్లించకూడదు. వాళ్లు లేని ఖర్చుల నుంచి వాళ్లను వదిలేయండి. గది లాంటి, ప్రతి ఒక్కరు ఉన్న సమయంపై ఆధారపడే ఖర్చు అయితే, **ఎలా విభజించాలి** కింద **కచ్చితమైన మొత్తాలు** ఎంచుకుని, ప్రతి ఒక్కరి వాటా టైప్ చేయండి, అవి కలిపితే మొత్తం అవ్వాలి. ముందు ఒక్కొక్కరికి ఒక్క రాత్రికి ధర లెక్క వేసి, తర్వాత ప్రతి ఒక్కరు ఉండే రాత్రులతో గుణించండి. అందరికీ ఒకేలా లేని ఖర్చుల గురించి [గ్రూప్ ట్రిప్‌లు](page:use-case/group-trips) పేజీలో మరింత ఉంది."
  - heading: "ఇక్కడ Side Badger చేయనివి"
    items:
      - "ఇది డబ్బు కదపదు. మీరు బ్యాంక్ ట్రాన్స్‌ఫర్, నగదు లేదా మీకు సరిపోయే మార్గంలో ఒకరికొకరు చెల్లించుకుని, అందరికీ బ్యాలెన్స్‌లు అప్‌డేట్ అయ్యేలా పేమెంట్‌ను రికార్డ్ చేస్తారు."
      - "ఇది పేమెంట్ రిమైండర్లు పంపదు. గ్రూప్ చాట్‌లో స్నేహపూర్వకంగా గుర్తు చేయడం ఇంకా మనిషి పనే."
      - "ప్రతి ఖర్చుకు ఒక చెల్లింపుదారు మాత్రమే, రసీదును లైన్ల వారీగా Side Badger పంచలేదు. కాటేజ్‌కు రెండు కార్డులు చెల్లిస్తే, దాన్ని రెండు ఖర్చులుగా నమోదు చేయండి. డిన్నర్‌లో కొందరు అదనంగా ఆర్డర్ చేస్తే, ఆ అదనపు వాటిని వాటి సొంత ఖర్చుగా నమోదు చేయండి."
      - "ఇది ప్రయాణ షెడ్యూల్ కాదు, డబ్బును మాత్రమే ఉంచుతుంది. పోల్‌లు, కామెంట్లు ఖర్చులపైనే ఉంటాయి, కాబట్టి వీకెండ్ ప్లాన్లు మీ గ్రూప్ చాట్‌లోనే ఉంటాయి."
exampleAfter: 2
example:
  heading: "Grace హెన్ వీకెండ్, నలుగురి మధ్య"
  currency: GBP
  people:
    - id: hannah
      name: Hannah
    - id: isla
      name: Isla
    - id: jess
      name: Jess
    - id: kat
      name: Kat
  expenses:
    - label: "కాటేజ్"
      payer: hannah
      amount: 720
      split:
        method: equal
    - label: "స్పా రోజు"
      payer: isla
      amount: 360
      split:
        method: equal
        shares:
          hannah: 1
          isla: 1
          jess: 1
    - label: "డిన్నర్"
      payer: jess
      amount: 260
      split:
        method: equal
    - label: "ట్యాక్సీ"
      payer: kat
      amount: 44
      split:
        method: equal
faq:
  heading: ప్రశ్నలు
  items:
    - q: "బెస్ట్ మ్యాన్ లేదా మెయిడ్ ఆఫ్ ఆనర్ ఎక్కువ చెల్లించాలా?"
      a: "గ్రూప్ ఒప్పుకుంటేనే. లెక్కల్లో యాప్ ఎవరికీ ప్రత్యేక పాత్ర ఇవ్వదు. ఎవరైనా ఎక్కువ భరిస్తుంటే, **ఎలా విభజించాలి** కింద **కచ్చితమైన మొత్తాలు** లేదా **శాతం** ఎంచుకుని, మీరు ఒప్పుకున్న వాటాలను నమోదు చేయండి."
    - q: "కొందరు తాగని డ్రింక్స్ సంగతి ఏంటి?"
      a: "డ్రింక్స్‌ను వాటి సొంత ఖర్చుగా జోడించి, తాగినవాళ్లను మాత్రమే టిక్ చేయండి. ఒక్కొక్కరు ఒక్కో మొత్తం తాగితే **కచ్చితమైన మొత్తాలు** ఎంచుకుని ప్రతి ఒక్కరి వాటా టైప్ చేయండి. తాగనిదానికి ఎవరూ చెల్లించరు."
    - q: "గౌరవ అతిథి తర్వాత గ్రూప్‌ను చూడవచ్చా?"
      a: "అవును, సర్ప్రైజ్ అయిపోయాక. వాళ్లను ఆహ్వానించండి, తర్వాత అడ్మిన్ గ్రూప్ సెట్టింగ్‌లలో **భద్రత** కింద వాళ్లను **వీక్షకుడు**గా చేయవచ్చు. వీక్షకుడు అన్నీ చూస్తారు, ఏదీ మార్చరు, కాబట్టి ఏదీ రహస్యం కానంత వరకు ఆగండి. చేరడానికి వాళ్లకు ఉచిత ఖాతా కావాలి."
