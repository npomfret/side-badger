meta:
  title: "با اسکن رسید هزینه اضافه کنید | Side Badger"
  description: "بگذارید گورکن رسید را بخواند. جمع کل، تاریخ و مکان را برای بررسی شما پر می‌کند، بدون اعتبار اسکن. سرویس هوش مصنوعی Google تصویر را می‌خواند."
h1: "رسید را اسکن کنید، جزئیات را بررسی کنید، تقسیمش کنید"
navLabel: "اسکن رسید"
lead: "بگذارید گورکن رسید را بخواند، و تکلیفش را وارسی کنید. به یک هزینه جدید عکس اضافه کنید و Side Badger جمع کل، تاریخ و مکان را برای بررسی شما پر می‌کند. بعد مثل هر هزینه دیگری [تقسیمش می‌کنید](page:feature/split-expenses). اسکن رایگان است و اعتبار اسکن ندارد. یک هزینه را پر می‌کند و صورت‌حساب را بر اساس قلم تقسیم نمی‌کند. تصاویر رسید توسط سرویس هوش مصنوعی Google خوانده می‌شوند."
cta:
  heading: "عکس بگیرید. بررسی کنید. تقسیم کنید."
  body: "یک حساب رایگان بسازید، گروه را شروع کنید و هزینه‌ای را با عکس رسید اضافه کنید. ببینید چه چیزی را پر می‌کند، هر چه غلط است عوض کنید و وقتی راضی بودید ذخیره کنید."
problem:
  heading: "هیچ‌کس نمی‌خواهد توی صف تاکسی رسید تایپ کند"
  body: "سفرها و شب‌های بزرگ کاغذ همراه می‌آورند. شام، تاکسی، دوری که شد شش دور. تایپ کردن هر کدام روی گوشی، با انگشت‌های یخ‌زده و صفی پشت سرتان، همان راهی است که هزینه‌ها فراموش می‌شوند. پس Side Badger رسید را برایتان می‌خواند. پیش‌نویس اول را او می‌زند و بررسی با شماست. به [سفرهای گروهی](page:use-case/group-trips) و [مراسم و جشن‌ها](page:use-case/events-and-celebrations) می‌خورد، جایی که رسیدها سریع‌تر از آنچه کسی بخواهد به آن‌ها برسد روی هم تلنبار می‌شوند."
workflow:
  heading: "از عکس تا هزینه در سه مرحله"
  steps:
    - title: "رسید را به یک هزینه جدید اضافه کنید"
      body: "هزینه جدیدی شروع کنید و روی **اسکن رسید** بزنید، یا از اقدام سریع **اسکن رسید** در داشبورد استفاده کنید. عکس بگیرید یا یکی را که دارید انتخاب کنید. **افزودن رسید یا پیوست** در فرم هم کار می‌کند."
    - title: "بگذارید رسید را بخواند"
      body: "تا وقتی هوش مصنوعی Side Badger تصویر را می‌خواند، فرم می‌گوید **در حال تجزیه رسید...**. بعد آنچه را پیدا کرده پر می‌کند، مثل توضیحات، جمع کل، ارز، تاریخ، ساعت و مکان. هر چه پیش‌تر خودتان تایپ کرده باشید دست‌نخورده می‌ماند."
      shot: S09
      shotAlt: "فرم هزینه جدید که «در حال تجزیه رسید...» را نشان می‌دهد، و بعد همان فرم با جزئیات پرشده"
    - title: "بررسی کنید، بعد تقسیمش کنید"
      body: "فرم را با کاغذ مقایسه کنید. هر چه غلط است درست کنید، بگویید چه کسی پرداخت کرد و چه کسانی در هزینه سهم داشتند، روش تقسیم را انتخاب کنید و ذخیره کنید. تا ذخیره نکنید هزینه وجود ندارد. [تقسیم هزینه‌ها](page:feature/split-expenses) خود تقسیم را توضیح می‌دهد."
options:
  heading: "گزینه‌ها"
  items: []
sections:
  - heading: "چه چیزهایی را پر می‌کند"
    body: "به یک هزینه جدید تصویر رسید اضافه کنید تا این فیلدها پر شوند. اینکه چه کسی پرداخت کرد، چه کسانی در هزینه سهم داشتند و چطور تقسیم شود هنوز با شماست."
    items:
      - "یک **توضیحات** برای هزینه."
      - "**جمع کل**."
      - "**ارز**، اگر گروه شما اجازه بدهد."
      - "**تاریخ** و **ساعت**."
      - "**مکان**."
      - "یک نسخه متنی از رسید در **یادداشت‌ها**، برای وقتی که کاغذش رنگ می‌بازد یا به ماشین لباسشویی می‌رود."
  - heading: "چه چیزی را هنوز خودتان بررسی می‌کنید"
    body: "همه‌چیز را. آنچه پر می‌کند را پیش‌نویس بدانید. جمع کل را با کاغذ بسنجید، بعد ارز، تاریخ و مکان را. عکس‌های تار و کاغذهای چروک هر خواننده‌ای را گول می‌زنند و ما قول نمی‌دهیم هر رسیدی را درست بخواند، پس پیش از ذخیره نگاه کنید. اگر چیزی غلط بود، رویش تایپ کنید. اگر رسید به ین است و گروه با پوند تسویه می‌کند، [چند ارز](page:feature/multiple-currencies) توضیح می‌دهد بعدش چه می‌شود."
  - heading: "رسید را کنار هزینه نگه دارید"
    body: "اسکن شده یا نه، رسید می‌تواند کنار هزینه بماند. عکس یا PDF پیوست کنید، تا سه تا برای هر هزینه و هرکدام تا 10 MB. اعضای گروه آن‌ها را روی هزینه می‌بینند. تصویرها به‌صورت پیش‌نمایش کوچک نشان داده می‌شوند که در یک نمایشگر باز می‌شوند و PDFها به‌صورت لینک باز می‌شوند. عکسی که اسکن می‌کنید هم پیوست می‌شود، مگر اینکه پیش از ذخیره حذفش کنید. وقتی کسی می‌پرسد آن شام واقعاً چقدر شد، مدرکش همان‌جاست."
  - heading: "رسید شما کجا می‌رود"
    body: "تصاویر رسید توسط سرویس هوش مصنوعی Google خوانده می‌شوند. برای پر کردن فرم، تصویر توسط Google Vertex AI (Gemini) در چندمنطقه‌ای ایالات متحده Google خوانده می‌شود. به یک هزینه جدید تصویر اضافه کنید و خوانده می‌شود. یک PDF، یا عکسی که به هزینه‌ای از قبل موجود اضافه شده، بدون خوانده شدن ذخیره می‌شود. رسیدهای پیوست‌شده برای اعضای گروه دیده می‌شوند، پس اگر رسیدی چیزی نشان می‌دهد که ترجیح می‌دهید به اشتراک نگذارید، عکس را رد کنید و آن هزینه را تایپ کنید."
limits:
  heading: "محدودیت‌ها"
  items:
    - "فقط تصویر. JPEG، PNG و WebP، و HEIC پس از تبدیل. می‌توان PDF را به یک هزینه پیوست کرد، اما خوانده نمی‌شود."
    - "اسکن فقط برای هزینه‌های جدید است. روی هزینه‌ای که از قبل هست می‌توانید رسید پیوست کنید، اما چیزی خوانده نمی‌شود."
    - "فقط فیلدهایی را پر می‌کند که به آن‌ها دست نزده‌اید، و ارز را فقط اگر گروه شما اجازه بدهد."
    - "بر اساس قلم تقسیم نمی‌کند و قلم‌های رسید را به افراد اختصاص نمی‌دهد. یک هزینه را پر می‌کند و شما آن را طبق معمول تقسیم می‌کنید."
    - "قولی نیست که آنچه پر می‌کند درست باشد یا اسکن هر بار کار کند. پیش از ذخیره بررسی کنید، و اگر اسکن شکست خورد یا در دسترس نبود هزینه را دستی اضافه کنید."
    - "یک هزینه تا سه پیوست دارد، هرکدام تا 10 MB، به‌صورت JPEG، PNG، WebP، HEIC یا PDF."
    - "تصاویر رسید توسط Google Vertex AI (Gemini) در چندمنطقه‌ای ایالات متحده Google خوانده می‌شوند و رسیدهای پیوست‌شده برای اعضای گروه دیده می‌شوند."
useCasesHeading: "جایی که رسیدها تلنبار می‌شوند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "می‌تواند رسید را بر اساس قلم تقسیم کند؟"
      a: "نه. هزینه، از جمله جمع کل، را پر می‌کند و شما آن را مساوی، با مبلغ دقیق یا با درصد تقسیم می‌کنید. برای صورت‌حسابی که هر کس چیز متفاوتی سفارش داده، آنچه هر نفر بدهکار است را به‌صورت مبلغ دقیق وارد کنید. [تقسیم هزینه‌ها](page:feature/split-expenses) جزئیات را دارد."
    - q: "می‌تواند PDF بخواند؟"
      a: "نه. می‌توانید PDF را به یک هزینه پیوست کنید تا همراه عددها بماند، اما فقط تصویرها خوانده می‌شوند."
    - q: "برای اسکن محدودیتی هست؟"
      a: "اعتبار اسکنی نیست که تمام شود و اسکن رایگان است. فایل‌ها محدودیت دارند، یعنی تا سه پیوست برای هر هزینه و هرکدام 10 MB. بقیه را [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing) دارد."
    - q: "چه کسی رسید من را می‌بیند؟"
      a: "اعضای گروه رسیدهای پیوست‌شده به یک هزینه را می‌بینند. تصاویر رسید توسط سرویس هوش مصنوعی Google هم خوانده می‌شوند، که راهی است که فرم پر می‌شود."
    - q: "می‌توانم رسید هزینه‌ای را که از قبل اضافه کرده‌ام اسکن کنم؟"
      a: "نه، اسکن برای هزینه‌های جدید است. هنوز می‌توانید رسید را به هزینه‌ای از قبل موجود پیوست کنید، و بدون خوانده شدن ذخیره می‌شود."
    - q: "اگر چیزی را غلط پر کند چه؟"
      a: "رویش تایپ کنید. هر فیلد تا وقتی ذخیره نکرده‌اید قابل ویرایش می‌ماند و به‌هرحال باید همه را بررسی کنید. اگر اسکن شکست خورد یا در دسترس نبود، هزینه را مثل همیشه دستی اضافه کنید."
