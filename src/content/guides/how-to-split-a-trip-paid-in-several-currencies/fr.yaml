faq:
  heading: Questions
  items:
    - q: "Quel taux de change Side Badger utilise-t-il ?"
      a: "Un taux de change actuel, récupéré quand vous saisissez la dépense, lorsqu'il y en a un de disponible. Vous pouvez le remplacer par le taux que vous avez réellement obtenu."
    - q: "Le groupe peut-il s'en tenir aux livres et aux yens ?"
      a: "Oui. Dans les **Paramètres** du groupe, activez **Restreindre les devises pour ce groupe** sous **Paramètres de Devise**, choisissez les **Devises autorisées** et réglez la **Devise par défaut pour les nouvelles dépenses**. Moins d'options dans la liste, moins de paris ratés à la caisse."
    - q: "Est-on obligé de convertir ?"
      a: "Non. Les devises restent séparées, sauf si vous ou votre groupe choisissez de convertir, et chaque devise a sa propre courte liste de paiements."
