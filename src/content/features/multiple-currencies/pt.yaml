sections:
  - heading: "Uma moeda para o grupo todo"
    body: "Se o teu grupo preferir não pensar nisso, escolhe uma moeda do grupo e o formulário converte cada nova despesa para ela, a uma taxa que podes continuar a ver e alterar. Isto aplica-se apenas a despesas novas e copiadas. As edições e as despesas existentes ficam como estão, por isso nada do que já foi registado muda debaixo dos teus pés."
  - heading: "Deves euros, pagas em libras"
    body: "Pagaste em ienes e vais acertar em libras? Sem problema. Quando registas um pagamento também o podes converter, por isso quem deve euros pode pagar em libras e o saldo em euros continua a sair certo. Paguem-se como preferirem e depois registem."
  - heading: "Regras para o grupo"
    body: "Limita um grupo às moedas que realmente usas e define uma por defeito para o formulário abrir na certa. Umas férias em Portugal não precisam de outras 139 opções ao lado da conta do jantar, e um [casamento no estrangeiro](page:use-case/events-and-celebrations) provavelmente precisa de duas."
limits:
  heading: "Limites"
  items:
    - "A taxa fica fixa quando a despesa é guardada. As despesas antigas nunca são reavaliadas."
    - "O Side Badger obtém uma taxa atual sempre que consegue. Nem todos os pares têm essa garantia, e podes sempre escrever a taxa tu mesmo."
    - "A conversão automática do grupo aplica-se apenas a despesas novas e copiadas, não a edições nem a despesas existentes."
    - "Cada despesa tem o máximo de 999,999.99 na sua própria moeda."
    - "Existem 140 moedas. As criptomoedas e os metais não estão entre elas."
    - "O Side Badger regista pagamentos. Nunca movimenta nem troca dinheiro."
useCasesHeading: "Onde isto ajuda"
faq:
  heading: "Perguntas"
  items:
    - q: "Que taxa de câmbio usam?"
      a: "Uma taxa de câmbio atual, obtida quando introduzes a despesa, sempre que houver uma disponível. Podes alterá-la para a taxa que realmente tiveste e o valor convertido atualiza-se."
    - q: "As despesas antigas são reavaliadas?"
      a: "Não. A taxa fica fixa quando a despesa é guardada, por isso um saldo não se desvia só porque o mercado se mexeu."
    - q: "Suportam criptomoedas?"
      a: "Não. Existem 140 moedas e as criptomoedas não estão entre elas."
    - q: "Porque não consigo introduzir 2,000,000 rupias?"
      a: "Cada despesa tem o máximo de 999,999.99 na sua própria moeda. Introduz noutra moeda e converte, ou divide em duas despesas."
    - q: "A conversão custa alguma coisa?"
      a: "Não. Converter é grátis, como o resto do Side Badger. Vê os [preços](page:pricing)."
    - q: "Tenho de converter?"
      a: "Não. As moedas ficam separadas, a menos que tu ou o teu grupo escolham converter, e cada moeda tem a sua própria lista curta de pagamentos."
