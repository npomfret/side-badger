faq:
  heading: "Kérdések"
  items:
    - q: "Többet fizet a tanú vagy a koszorúslány?"
      a: "Csak ha a csoport úgy dönt. Az alkalmazás senkinek nem ad különleges szerepet a számolásban. Ha valaki többet vállal, a **Felosztás módja** alatt válaszd a **Pontos összegek** vagy a **Százalék** lehetőséget, és írd be a megbeszélt részeket."
    - q: "És az italok, amelyeket páran nem ittak?"
      a: "Add hozzá az italokat külön költségként, és csak azokat jelöld be, akik ittak. Ha mindenki másmennyit ivott, válaszd a **Pontos összegek** lehetőséget, és írd be az egyes emberek részét. Senki nem fizet azért, amit nem fogyasztott."
    - q: "Láthatja az ünnepelt később a csoportot?"
      a: "Igen, ha vége a meglepetésnek. Hívd meg, aztán egy adminisztrátor a csoport beállításaiban a **Biztonság és jogosultságok** alatt **Megfigyelő** szerepet adhat neki. A megfigyelő mindent lát, és semmit nem változtat, ezért várj, amíg már nincs titok. A csatlakozáshoz ingyenes fiók kell."
