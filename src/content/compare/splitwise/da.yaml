sections:
  - heading: Det, Splitwise gør godt
    body: "Hvis din gruppe har brug for en native app, offline-brug eller betalinger i selve appen, er Splitwise det fornuftige valg, og vi vil hellere have, at du vælger den, end at du finder ud af det senere. Dets egne sider nævner:"
    items:
      - "**Apps og offline-brug.** Apps til iPhone og Android ud over weben og en offline-tilstand."
      - "**Flere måder at dele på.** Andele, justeringer og deling pr. vare, oven i ligeligt, nøjagtigt og i procent."
      - "**Tilbagevendende udgifter.** Lad huslejen gentage sig, og glem den."
      - "**Betalinger i appen.** I nogle lande kan den også flytte pengene, via Splitwise Pay, Venmo, PayPal eller Pay by Bank."
  - heading: Gratis her, betalt dér
    body: "Splitwise Pro er Splitwises betalte abonnement, og dets egen Pro-side sælger fire ting, der ikke koster noget i Side Badger."
    items:
      - "**Kvitteringsscanning.** Splitwise Pro scanner et billede af din kvittering. Side Badger gør det gratis, uden scanningskreditter: den udfylder total, dato og sted, så du kan tjekke dem. Kvitteringsbilleder læses af Googles AI-tjeneste."
      - "**Valutaomregning.** Splitwise Pro omregner en gruppes udgifter til din standardvaluta, når du trykker på Convert. Side Badger omregner hver udgift, mens du indtaster den, med en aktuel valutakurs eller den, du faktisk fik, og det oprindelige beløb bliver stående på udgiften."
      - "**Ingen reklamer.** Splitwise opfører en helt reklamefri oplevelse som en Pro-funktion. Side Badger har ingen reklamer."
      - "**Ingen daglige grænser.** Splitwise Pro sælger ubegrænsede udgifter, og dets hjælpecenter siger, at gratis brugere kan tilføje op til 4 udgifter om dagen. Side Badger har ingen daglige grænser."
  - heading: Hvad Splitwise har, som Side Badger ikke har
    body: "Det er ikke alle Splitwises funktioner, kun dem, der plejer at afgøre det. Splitwises egne sider har den fulde liste. Her er det, hvor Side Badger kommer til kort."
    items:
      - "**Native apps.** Side Badger virker i din browser. Log ind, og føj den så til din startskærm, så åbner den som en app."
      - "**Offline-tilstand.** Side Badger kræver en forbindelse."
      - "**Betalinger i appen.** Side Badger rører aldrig dine penge. Betal hinanden, som I vil, og registrer så betalingen."
      - "**Tilbagevendende udgifter.** Det har Side Badger ikke. Kopiér sidste måneds husleje i stedet for at skrive den igen."
      - "**Deling efter andele eller pr. vare.** Side Badger har én betaler pr. udgift, delt ligeligt, efter nøjagtige beløb eller i procent. Kvitteringsscanningen fordeler ikke varer på personer."
      - "**Diagrammer og standardfordelinger.** Splitwise Pro har begge dele. Side Badger holder regnskab med, hvem der skylder hvem, og det er hele tricket."
  - heading: Flyt din gruppe over
    body: "Der er ingen importfunktion, så en flytning betyder en frisk start. Gør først op i Splitwise, opret så en gruppe i Side Badger, og inviter alle med et link eller en QR-kode. Alle i gruppen skal have en gratis konto, og det eneste, der skal til for at tilmelde sig, er en e-mailadresse."
