faq:
  heading: "Perguntas"
  items:
    - q: "Devemos usar o salário bruto ou o líquido?"
      a: "O grupo decide. O líquido é o mais comum, porque é o dinheiro que realmente tens para gastar. O bruto ignora o facto de os impostos, as contribuições para a reforma e as prestações de empréstimos tirarem quantias diferentes de salários diferentes. Escolham o que escolherem, usem a mesma medida para os dois."
    - q: "O Side Badger vê os nossos rendimentos?"
      a: "Não. Só introduzes percentagens, nunca salários. As percentagens são visíveis para os membros do grupo, e num casal isso são os dois."
    - q: "Podemos definir 62/38 uma só vez para tudo?"
      a: "A divisão é definida por despesa, não por grupo. Copia uma despesa que já tenha 62 e 38 e muda o que for diferente. [Dividir despesas](page:feature/split-expenses) explica as outras opções."
