faq:
  heading: "Pitanja"
  items:
    - q: "Što ako skupimo više nego što dar košta?"
      a: "Točni iznosi moraju zajedno davati cijenu, zato smanji udjele dok ne zbrajaju. Ili višak potroši na nešto stvarno, primjerice cvijeće, i unesi to kao drugi trošak, poput čestitke i papira za pakiranje u primjeru."
    - q: "Može li netko sudjelovati bez pridruživanja grupi?"
      a: "Ne, ako ga želiš u računici. Svatko u podjeli treba besplatan korisnički račun i mjesto u grupi. Za nekoga tko ima samo gotovinu, Priya bi je mogla uzeti i unijeti dar za iznos koji grupa još duguje. Primjerice, ako joj Sam da 40 £ u gotovini, unijela bi 200 £ i podijelila ih 60, 60 i 80 između sebe, Omara i Lene."
    - q: "Može li anketa odlučiti koliko tko daje?"
      a: "Ne. Anketa dogovara iznos za cijelu grupu, primjerice proračun. Udio svake osobe dogovorite među sobom, a zatim ga upišite u trošak kao **Točni iznosi**."
