sections:
  - heading: Prat om pengar, bredvid pengarna
    body: Delade pengar kommer med snack, tvivel och planer. Side Badger håller alla tre bredvid siffrorna, så ingen behöver scrolla tillbaka i chatten.
    items:
      - "**Kommentarer där de hör hemma.** Kommentera själva gruppen eller vilken utgift, lista eller omröstning som helst, och håll samtalet intill det som det handlar om."
      - "**Kvitton och foton.** Spara upp till tre kvitton på varje utgift, och lägg till foton eller PDF-filer i kommentarer på gruppen, en lista eller en omröstning."
      - "**Frågor, inte gräl.** En administratör kan slå på frågor, och sedan kan vem som helst i en utgift fråga om den. Den räknas inte med i saldona tills det är utrett."
      - "**Listor och omröstningar.** Ha den gemensamma inköpslistan bredvid utgifterna för inköp, och låt gruppen rösta om villaalternativen, anonymt om du vill."
      - "**Lite applåder.** Reagera på utgifter, betalningar och kommentarer, och fira en betalning när den når fram."
  - heading: Din grupp, dina regler
    body: Splitwises hjälpcenter säger att det inte stöder gruppadministratörer eller särskilda behörigheter. Side Badger har roller och behörigheter, för grupper som behöver någon som håller ordning på siffrorna.
    items:
      - "**Administratörer, medlemmar och tittare.** Gör någon till tittare: de ser allt och ändrar inget."
      - "**Två förinställningar, eller dina egna.** Börja med Öppet samarbete eller Hanterad grupp, eller ställ in varje behörighet själv: vem som redigerar och raderar utgifter, redigerar listor, bjuder in och släpper in nya."
      - "**Godkännande för att gå med.** Slå på godkännande så släpper en administratör in var och en."
      - "**Gruppens egna inställningar.** Begränsa den till de valutor du faktiskt använder, välj dess standardvaluta och ge den en omslagsbild."
      - "**Lås när det är över.** Siffrorna ligger fast tills en administratör låser upp."
  - heading: Gratis här, betalt där
    body: Splitwise Pro är Splitwises betalplan, och dess egen Pro-sida säljer tre saker som inte kostar något i Side Badger.
    items:
      - "**Kvittoskanning.** Splitwise Pro skannar en bild av ditt kvitto. Side Badger gör det gratis, utan skanningskrediter: den fyller i summa, datum och plats så att du kan kontrollera dem."
      - "**Valutaomräkning.** Splitwise Pro räknar om en grupps utgifter till din standardvaluta när du trycker på Convert. Side Badger räknar om varje utgift när du lägger in den, med en aktuell växelkurs eller den du faktiskt fick, och det ursprungliga beloppet finns kvar på utgiften."
      - "**Inga dagliga gränser.** Splitwise Pro säljer obegränsade utgifter, och dess hjälpcenter säger att gratisanvändare kan lägga till upp till 4 utgifter per dag. Side Badger har inga dagliga gränser."
  - heading: Din bank står utanför
    body: Side Badger kopplas inte till din bank och ber inte om dina bankuppgifter. Det håller reda på vem som är skyldig vem; ni betalar varandra hur ni vill och registrerar sedan betalningen. Ingen bankinloggning att lämna ifrån sig, så en sak mindre att hålla säker.
  - heading: En app, i webbläsaren och på telefonen
    body: Side Badger fungerar i din webbläsare. Logga in, lägg till den på hemskärmen så öppnas den som en app. Det är samma app oavsett, så en ny funktion finns på telefonen nästa gång du öppnar den, utan appbutiksuppdatering att vänta på.
  - heading: Och några festtrick
    items:
      - "**Fråga din assistent.** Side Badger fungerar med ChatGPT och Claude: be din lägga till en utgift, skanna ett kvitto eller registrera en betalning."
      - "**Alla på sitt eget språk.** Side Badger talar 39 språk och var och en väljer sitt eget. Splitwises startsida säger 7+. Den hanterar 133 valutor också, för resor som går överallt."
      - "**Hjälp utan att lämna appen.** Fastnat eller hittat ett fel? Berätta det i appen och läs vårt svar direkt där."
  - heading: Där Splitwise fortfarande vinner
    body: Vi vill hellre att du väljer rätt app än att du upptäcker det senare. Om din grupp behöver något av detta har Splitwise det och Side Badger inte.
    items:
      - "**Appar i appbutiker.** Side Badger bor i din webbläsare och på hemskärmen, inte i appbutikerna."
      - "**Offlineläge.** Side Badger behöver en uppkoppling."
      - "**Betalningar i appen.** I vissa länder kan Splitwise flytta pengarna också. Side Badger håller bara reda på vem som är skyldig vem."
      - "**Delning per andel eller post.** Side Badger har en betalare per utgift, delad lika, efter exakta belopp eller i procent. Kvittoskanningen tilldelar inte poster till personer."
      - "**Diagram och standarddelningar.** Splitwise Pro har båda. Side Badger håller räkningen på vem som är skyldig vem, och det är hela tricket."
  - heading: Flytta över din grupp
    body: Det finns ingen importfunktion, så en flytt innebär en ny start. Gör upp i Splitwise först, skapa sedan en grupp i Side Badger och bjud in alla med en länk eller en QR-kod. Alla i gruppen behöver ett gratiskonto, och allt som krävs för att registrera sig är en e-postadress.
table:
