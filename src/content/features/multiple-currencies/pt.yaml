meta:
  title: "Divide custos em 140 moedas, convertidas ou em separado"
  description: "Introduz cada despesa na moeda em que pagaste, mantém os saldos em separado ou converte a uma taxa que podes ver e alterar, e depois acerta tudo com uma lista curta de pagamentos."
h1: "Divide custos em 140 moedas"
navLabel: "Várias moedas"
lead: "Euros, ienes e aquele táxi em bahts. O Side Badger aceita cada despesa na moeda em que pagaste, mantém os saldos em ordem e pode converter quando o teu grupo preferir acertar tudo de uma vez. Funciona em 140 moedas e encaixa que nem uma luva nas [viagens em grupo](page:use-case/group-trips)."
cta:
  heading: "Traz os teus euros, traz os teus ienes"
  body: "Cria uma conta, começa um grupo e adiciona a primeira despesa na moeda que tinhas à mão."
  button: "Criar uma conta grátis"
problem:
  heading: "Introduz como pagaste"
  body: "Uma viagem raramente se paga numa só moeda. O hotel foi reservado em casa, em libras, o jantar foi pago em ienes e o café do aeroporto na moeda da escala. Converter tudo à mão antes de poderes sequer escrever é assim que as folhas de cálculo são abandonadas. No Side Badger introduzes cada despesa na moeda do recibo e cada valor segue as regras da sua moeda, por isso os ienes não têm decimais e os dinares têm três. As moedas que usaste recentemente aparecem primeiro na lista."
workflow:
  heading: "Mantém as moedas separadas ou converte à medida que avanças"
  steps:
    - title: "Adiciona a despesa na sua própria moeda"
      body: "Escolhe a moeda, escreve o valor, diz quem pagou e quem partilhou. Não é preciso mais nada. Esta é a opção por defeito e mantém o valor original exatamente como o introduziste."
      shot: S07
      shotAlt: "O formulário de despesa com um valor em ienes introduzido"
    - title: "Acompanha um saldo para cada moeda"
      body: "Os saldos são mantidos em separado por moeda, e cada um tem a sua própria lista curta de pagamentos sugeridos. As libras acertam-se em libras e os ienes em ienes."
      shot: S10
      shotAlt: "O ecrã de saldos com dívidas simplificadas em duas moedas"
    - title: "Ou converte, quando o grupo preferir acertar tudo de uma vez"
      body: "Escolhe outra moeda ao introduzir a despesa e o Side Badger pode convertê-la a uma taxa de câmbio atual, que podes alterar para a taxa que realmente tiveste. O valor convertido junta-se ao saldo nessa moeda. A conversão é uma escolha do grupo, nunca algo que acontece nas tuas costas."
options:
  heading: "Uma taxa que podes ver e alterar"
  items:
    - title: "A taxa é mostrada"
      body: "Quando converteres, a taxa e o valor convertido aparecem no formulário, por isso ninguém tem de acreditar num número sem o ver."
    - title: "Escreve a tua"
      body: "Tiveste uma taxa melhor numa casa de câmbio ou pior num aeroporto? Edita a taxa para a que realmente tiveste e o valor convertido atualiza-se."
    - title: "O original fica"
      body: "O valor original fica na despesa, ao lado do convertido, para quem perguntar quanto foi em ienes."
    - title: "Converter é grátis"
      body: "Converter não custa nada. Não há comissão por introduzir uma despesa noutra moeda."
