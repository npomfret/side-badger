meta:
  title: "Skiptu kostnaði í 140 gjaldmiðlum, umreiknuðum eða aðskildum"
  description: "Skráðu hvert útgjald í gjaldmiðlinum sem þú greiddir í, haltu stöðunni aðskilinni eða umreiknaðu á gengi sem þú sérð og getur breytt, og gerðu svo upp með stuttum lista yfir greiðslur."
h1: "Skiptu kostnaði í 140 gjaldmiðlum"
navLabel: "Margir gjaldmiðlar"
lead: "Evrur, jen og þessi eini leigubíll í bahtum. Side Badger tekur við hverju útgjaldi í gjaldmiðlinum sem þú greiddir í, heldur stöðunni réttri og getur umreiknað þegar hópurinn vill frekar gera upp í einu lagi. Það virkar í 140 gjaldmiðlum og á vel við [hópferðir](page:use-case/group-trips)."
cta:
  heading: "Komdu með evrurnar þínar, komdu með jenin þín"
  body: "Stofnaðu aðgang, byrjaðu hóp og bættu við fyrsta útgjaldinu í hvaða gjaldmiðli sem þú varst með í höndunum."
problem:
  heading: "Skráðu það eins og þú greiddir það"
  body: "Sjaldan er allt greitt í einum gjaldmiðli á ferðalagi. Hótelið var bókað heima í pundum, kvöldverðurinn var greiddur í jenum og flugvallarkaffið í því sem millilendingin notaði. Að umreikna allt í höndunum áður en þú getur slegið það inn er ástæðan fyrir því að töflureiknum er hent. Í Side Badger skráirðu hvert útgjald í gjaldmiðlinum á kvittuninni og hver upphæð fylgir reglum síns gjaldmiðils, svo jen hafa enga aukastafi og dínarar hafa þrjá. Gjaldmiðlarnir sem þú notaðir nýlega koma fyrst á listanum."
workflow:
  heading: "Hafðu gjaldmiðla aðskilda, eða umreiknaðu jafnóðum"
  steps:
    - title: "Bættu útgjaldinu við í eigin gjaldmiðli"
      body: "Veldu gjaldmiðilinn, sláðu inn upphæðina og segðu hver greiddi og hverjir deildu því. Ekkert annað þarf. Þetta er sjálfgefið og það heldur upphaflegu upphæðinni nákvæmlega eins og þú slóst hana inn."
      shot: S07
      shotAlt: "Útgjaldaeyðublað með upphæð í jenum"
    - title: "Fylgstu með stöðu í hverjum gjaldmiðli"
      body: "Staðan er haldin sérstaklega fyrir hvern gjaldmiðil og hver fær sinn eigin stutta lista yfir greiðslur sem lagðar eru til. Pund eru gerð upp í pundum og jen í jenum."
      shot: S10
      shotAlt: "Stöðuskjár með einfölduðum skuldum í tveimur gjaldmiðlum"
    - title: "Eða umreiknaðu þegar hópurinn vill frekar gera upp í einu lagi"
      body: "Veldu annan gjaldmiðil um leið og þú skráir útgjaldið og Side Badger getur umreiknað það á núverandi gengi, sem þú getur breytt í gengið sem þú fékkst í raun. Umreiknaða upphæðin bætist við stöðuna í þeim gjaldmiðli. Umreikningur er val sem hópurinn tekur, aldrei eitthvað sem gerist á bak við þig."
options:
  heading: "Gengi sem þú sérð og getur breytt"
  items:
    - title: "Gengið er sýnt"
      body: "Þegar þú umreiknar birtast gengið og umreiknaða upphæðin á eyðublaðinu, svo enginn þarf að taka tölu trúanlega."
    - title: "Sláðu inn þitt eigið"
      body: "Fékkstu betra gengi hjá gjaldeyrisafgreiðslu, eða verra á flugvelli? Breyttu genginu í það sem þú fékkst í raun og umreiknaða upphæðin uppfærist."
    - title: "Upphaflega upphæðin helst"
      body: "Upphaflega upphæðin helst á útgjaldinu, við hlið þeirrar umreiknuðu, fyrir þá sem spyrja hvað hún var í jenum."
    - title: "Ókeypis að umreikna"
      body: "Umreikningur kostar ekkert. Það er ekkert gjald fyrir að skrá útgjald í öðrum gjaldmiðli."
