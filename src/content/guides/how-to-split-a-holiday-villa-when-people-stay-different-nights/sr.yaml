meta:
  title: "Подела виле кад људи бораве различит број ноћи | Side Badger"
  description: "Дев је дошао само три ноћи, зашто да плаћа шест? Подели вилу за одмор према ноћима које су људи заиста провели, а рачун одради Side Badger."
h1: "Како поделити вилу за одмор кад људи бораве различит број ноћи"
navLabel: "Подела виле по ноћима"
lead: "Израчунај цену по особи по ноћи, помножи је са бројем ноћи сваке особе и унеси вилу као **један трошак са тачним износима**. Side Badger води рачуна о стању и предлаже кратак списак уплата кад дође време за поравнање."
cta:
  heading: "Дај вили један уредан трошак"
  body: "Направи групу, позови све везом или QR кодом и унеси вилу са тачним износима. Side Badger води текуће стање док ти уживаш у одмору."
sections:
  - heading: "Шест ноћи, четворо људи, једна кредитна картица"
    body: "[Групно путовање](page:use-case/group-trips) обично почне са једном картицом. Овде је то Анина. Она резервише вилу за шест ноћи, 2.100 €, јер неко мора први. Ана, Бен и Клои бораве свих шест ноћи. Дев може само последње три и стиже возом. Бен изнајми ауто у који Дев никад не седа. Дев обави велику куповину намирница. Поделити вилу на четворо је очигледан потез. Тако Дев плаћа три ноћи које је провео код куће, а такве ствари испливају око Божића. Подела по ноћима избегава свађу, а рачун траје минут."
  - heading: "Израчунај цену једне особо-ноћи"
    body: "Особо-ноћ је једна особа која борави једну ноћ. Вила кошта колико кошта, зато цену распореди на све особо-ноћи, па свакоме урачунај оне које је искористио."
    items:
      - "**Преброј особо-ноћи.** Ана, Бен и Клои бораве по шест ноћи, а Дев три: 6 + 6 + 6 + 3 = 21."
      - "**Одреди цену једне.** 2.100 € ÷ 21 = 100 € по особо-ноћи."
      - "**Помножи са ноћима сваке особе.** Ана, Бен и Клои плаћају 6 × 100 € = 600 € свако. Дев плаћа 3 × 100 € = 300 €."
      - "**Провери збир.** 600 € + 600 € + 600 € + 300 € = 2.100 €. Ако удели не дају цену, нека ноћ недостаје или је избројана двапут."
  - heading: "Унеси у Side Badger"
    body: "Направи групу, позови остале троје везом или QR кодом, па додај трошкове. Прво вила."
    items:
      - "Изабери **Додај трошак**. Опиши га, унеси 2.100 и постави **Ко је платио?** на Ану."
      - "Под **Подели између** провери да су сва четворо ту."
      - "Под **Начин поделе** изабери **Тачни износи**. Укуцај 600 за Ану, Бена и Клои и 300 за Дева. Износи морају давати укупан збир."
      - "Изабери **Сачувај трошак**."
      - "Додај изнајмљивање аутомобила на исти начин. Платио је Бен, подела је **Једнако**, а Дев је изостављен јер је дошао возом. Остале начине поделе трошка описује [подела трошкова](page:feature/split-expenses)."
      - "Додај намирнице. Платио је Дев, подела је **Једнако** и сва четворо су укључена."
  - heading: "Прочитај резултат, па се поравнајте"
    body: "Рачун сваке особе је њен део виле плус њен део аута и куповине. Ана, Бен и Клои долазе на по 725 €, што је 600 € + 80 € + 45 €. Дев долази на 345 €, што је 300 € + 45 €. Одузми шта је ко платио и стања изађу сама. Ана је платила 2.100 €, па јој припада 1.375 €. Бен је платио 240 € и дугује 485 €. Дев је платио 180 € и дугује 165 €. Клои није платила ништа и дугује 725 €. Кад би се то оставило тако, дугови би кружили на шест страна по групи. Side Badger уместо тога предлаже три уплате, све Ани. Плати јој како год желиш, затим изабери **Поравнај** и за сваку уплату користи **Забележи поравнање**, да се стања ажурирају. Дугмад за брзо поравнање попуњавају износ. Више о [поравнању](page:feature/settle-up)."
  - heading: "Кад вила није једна уредна цена"
    items:
      - "**Собе су различите.** Ако апартман вреди више од мале собе, прво договорите колико кошта свака соба, па рачунајте особо-ноћи једну по једну собу. Вилу унеси као један трошак са укупним износом сваке особе или као један трошак по соби. У оба случаја тачни износи на трошку морају давати његов укупан збир."
      - "**Депозит плаћен месецима раније.** Ко га је платио добија свој трошак, са датумом кад је платио. Подели га по ноћима у истим односима као остатак."
      - "**Резервација је у другој валути.** Унеси вилу у валути у којој си платио. Ако група конвертује током уноса, користи актуелни девизни курс или укуцај курс који си заиста добио. Изворни износ остаје уз трошак. Детаље има [више валута](page:feature/multiple-currencies)."
      - "**Делимичне ноћи.** Неко стигне у поноћ, неко оде пре доручка. Договорите једно правило за бројање ноћи и примените га на све."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Не броји ноћи уместо тебе. Нема поделе по ноћима или по уделима, па сваки износ израчунаш као изнад и унесеш као **тачне износе**."
      - "Не премешта новац. Платите једни другима како год желите, па забележите уплату."
      - "Дозвољава једног платиоца по трошку. Ако су вилу платиле две особе, унеси два трошка."
      - "Нема приступа за госте. Сви у групи, па и Дев, морају имати бесплатан кориснички налог."
