meta:
  title: Gør op med færre betalinger | Side Badger
  description: Se, hvem der skylder hvem i din gruppe, få en kort liste over betalinger, der gør op for alle, og registrer hver betaling, når den sker. Gratis at bruge.
h1: Gør op med færre betalinger
navLabel: Gør op
lead: Side Badger fører en løbende saldo for alle i gruppen og foreslår en kort liste over betalinger, der gør op. I betaler hinanden, som I vil, og registrerer det bagefter. Hvis du først vil se, hvordan beløbene deles, så start med [del udgifter](page:feature/split-expenses).
cta:
  heading: Klar til at rede trådene ud, så man kan se, hvem der skylder hvem?
  body: Opret en konto, start en gruppe, og tilføj den første udgift. Saldiene klarer resten.
  button: Opret en gratis konto
problem:
  heading: Saldi, der opdateres undervejs
  body: Hver udgift ændrer, hvem der skylder hvem, så Side Badger holder saldiene opdaterede, efterhånden som udgifter og betalinger tilføjes. Alle i gruppen ser en ændring med det samme og ser, hvad der blev ændret, og hvem der ændrede det. Saldi føres pr. valuta, så euro og pund bliver i hver sin kolonne, medmindre en udgift blev omregnet, da den blev indtastet. Som standard ser du den gæld, der involverer dig, mens **Vis alle** viser hele gruppen.
workflow:
  heading: Tre trin til at stå lige
  steps:
    - title: Se, hvem der skylder hvem
      body: Åbn gruppens saldi for at se, hvad du skylder, hvad du har til gode, og en kort liste over betalinger, der gør op for alle, udregnet pr. valuta. Udgifter med spørgsmål holdes uden for beregningerne, til det er afklaret. I bofælle-eksemplet nedenfor bliver seks betalinger til to.
      shot: S10
      shotAlt: Saldoskærmen med forenklet gæld i to valutaer og Vis alle slået til
    - title: Betal, som du vil, og registrer det så
      body: Bankoverførsel, kontanter, en tjeneste, man skylder fra sidste ferie. Side Badger flytter ikke pengene. Når de har skiftet hænder, registrerer du betalingen, og saldoen opdateres for alle.
      shot: S11
      shotAlt: Betalingsformularen med hurtigafregningsknapper og beskeden, der vises ved en delbetaling
    - title: Tjek, at den er landet
      body: Betalingen kommer i gruppens historik, hvor alle i gruppen kan se den og reagere med en emoji. Fejr en betaling, når den er landet.
      shot: S12
      shotAlt: Betalingshistorikken med emoji-reaktioner på en betaling
