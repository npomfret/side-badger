meta:
  title: "ولا کا خرچ الگ الگ راتوں پر کیسے بانٹیں | Side Badger"
  description: "دیو صرف تین راتوں کے لیے آیا تھا، تو چھ کیوں دے؟ چھٹیوں کے ولا کو لوگوں کی اصل راتوں کے حساب سے بانٹیں، حساب ہم دکھا دیتے ہیں۔"
h1: "چھٹیوں کے ولا کا خرچ کیسے بانٹیں جب لوگ الگ الگ راتیں رکیں"
navLabel: "راتوں پر ولا بانٹیں"
lead: "ایک شخص کی ایک رات کی قیمت نکالیں، اسے ہر شخص کی راتوں سے ضرب دیں، اور ولا کو **عین رقموں کے ساتھ ایک ہی خرچے** کے طور پر درج کریں۔ Side Badger حساب رکھتا ہے اور تصفیے کے وقت ادائیگیوں کی مختصر فہرست تجویز کرتا ہے۔"
cta:
  heading: "ولا کو ایک صاف ستھرا خرچہ دیں"
  body: "گروپ بنائیں، سب کو لنک یا QR کوڈ سے مدعو کریں اور ولا کو عین رقموں کے ساتھ درج کریں۔ آپ چھٹیوں کا مزہ لیں، چلتا ہوا حساب Side Badger رکھے گا۔"
sections:
  - heading: "چھ راتیں، چار لوگ، ایک کریڈٹ کارڈ"
    body: "[گروپ ٹرپ](page:use-case/group-trips) عموماً کسی ایک کے کارڈ سے شروع ہوتا ہے۔ یہاں وہ انا کا ہے۔ وہ چھ راتوں کا ولا €2,100 میں بُک کرتی ہے، کیونکہ کسی کو تو پہلے قدم اٹھانا ہوتا ہے۔ انا، بین اور کلوئی چھ کی چھ راتیں رکتے ہیں۔ دیو صرف آخری تین راتوں کے لیے آ سکتا ہے، اور ٹرین سے آتا ہے۔ بین کار کرائے پر لیتا ہے، جس میں دیو کبھی نہیں بیٹھتا۔ دیو گروسری کی بڑی خریداری کرتا ہے۔ ولا کو چار برابر حصوں میں بانٹنا سیدھا راستہ ہے۔ اس میں دیو ان تین راتوں کے پیسے دیتا ہے جو اس نے گھر پر گزاریں، اور ایسی باتیں کرسمس پر پھر نکل آتی ہیں۔ راتوں کے حساب سے بانٹنے سے بحث ٹل جاتی ہے، اور حساب میں ایک منٹ لگتا ہے۔"
  - heading: "ایک شخص کی ایک رات کی قیمت نکالیں"
    body: "شخص-رات کا مطلب ہے ایک شخص کا ایک رات رکنا۔ ولا کی قیمت جو ہے سو ہے، اس لیے قیمت کو تمام شخص-راتوں میں بانٹیں، پھر ہر شخص کو اس کی استعمال کی ہوئی راتیں دیں۔"
    items:
      - "**شخص-راتیں گنیں۔** انا، بین اور کلوئی چھ چھ راتیں رکتے ہیں اور دیو تین: 6 + 6 + 6 + 3 = 21۔"
      - "**ایک کی قیمت نکالیں۔** €2,100 ÷ 21 = €100 فی شخص-رات۔"
      - "**ہر شخص کی راتوں سے ضرب دیں۔** انا، بین اور کلوئی ہر ایک 6 × €100 = €600 دیتے ہیں۔ دیو 3 × €100 = €300 دیتا ہے۔"
      - "**کل جانچیں۔** €600 + €600 + €600 + €300 = €2,100۔ اگر آپ کے حصوں کا مجموعہ قیمت کے برابر نہ ہو تو کوئی رات رہ گئی ہے یا دو بار گنی گئی ہے۔"
  - heading: "اسے Side Badger میں درج کریں"
    body: "گروپ بنائیں، باقی تینوں کو لنک یا QR کوڈ سے مدعو کریں، پھر اخراجات شامل کریں۔ پہلے ولا۔"
    items:
      - "**خرچہ شامل کریں** چنیں۔ اس کی تفصیل لکھیں، 2,100 درج کریں اور **کس نے ادائیگی کی؟** میں انا کو چنیں۔"
      - "**کے درمیان تقسیم کریں** کے تحت یقینی بنائیں کہ چاروں لوگ شامل ہیں۔"
      - "**کیسے تقسیم کریں** کے تحت **عین رقمیں** چنیں۔ انا، بین اور کلوئی کے لیے 600 اور دیو کے لیے 300 ٹائپ کریں۔ رقموں کا مجموعہ کل کے برابر ہونا چاہیے۔"
      - "**خرچہ محفوظ کریں** چنیں۔"
      - "کار کا کرایہ اسی طرح شامل کریں۔ ادائیگی بین نے کی، تقسیم **برابر** ہے، اور دیو باہر ہے، کیونکہ وہ ٹرین سے آیا تھا۔ [اخراجات کی تقسیم](page:feature/split-expenses) خرچ بانٹنے کے دوسرے طریقے بتاتا ہے۔"
      - "گروسری شامل کریں۔ ادائیگی دیو نے کی، تقسیم **برابر** ہے، اور چاروں شامل ہیں۔"
  - heading: "نتیجہ پڑھیں، پھر حساب برابر کریں"
    body: "ہر شخص کا بل اس کے ولا کے حصے کے ساتھ کار اور خریداری میں اس کا حصہ ہے۔ انا، بین اور کلوئی میں سے ہر ایک کا €725 بنتا ہے، یعنی €600 + €80 + €45۔ دیو کا €345 بنتا ہے، یعنی €300 + €45۔ ہر شخص نے جو ادا کیا وہ گھٹائیں تو بیلنس سامنے آ جاتے ہیں۔ انا نے €2,100 ادا کیے، اس لیے اسے €1,375 ملنے ہیں۔ بین نے €240 ادا کیے اور اسے €485 دینے ہیں۔ دیو نے €180 ادا کیے اور اسے €165 دینے ہیں۔ کلوئی نے کچھ ادا نہیں کیا اور اسے €725 دینے ہیں۔ اگر یونہی چھوڑ دیا جائے تو یہ قرض گروپ میں چھ طرف گھومیں گے۔ Side Badger اس کی بجائے تین ادائیگیاں تجویز کرتا ہے، سب انا کو۔ اسے جیسے چاہیں ادا کریں، پھر **تصفیہ کریں** چنیں اور ہر ادائیگی کے لیے **تصفیہ ریکارڈ کریں** استعمال کریں، تاکہ بیلنس اپ ڈیٹ ہو جائیں۔ فوری تصفیہ کے بٹن رقم خود بھر دیتے ہیں۔ [حساب برابر کرنا](page:feature/settle-up) میں مزید تفصیل ہے۔"
  - heading: "جب ولا ایک صاف قیمت نہ ہو"
    items:
      - "**کمرے مختلف ہوں۔** اگر سوئٹ چھوٹے کمرے سے زیادہ قیمتی ہے تو پہلے طے کریں کہ ہر کمرے کی قیمت کیا ہے، پھر شخص-رات کا حساب ایک ایک کمرے کے لیے لگائیں۔ ولا کو سب کے کل کے ساتھ ایک خرچے کے طور پر درج کریں، یا ہر کمرے کے لیے ایک خرچہ۔ دونوں صورتوں میں کسی خرچے کی عین رقموں کا مجموعہ اس کے کل کے برابر ہونا چاہیے۔"
      - "**مہینوں پہلے ادا کیا ہوا ڈپازٹ۔** جس نے ادا کیا اس کا اپنا خرچہ بنتا ہے، ادائیگی کے دن کی تاریخ کے ساتھ۔ اسے راتوں کے حساب سے انہی تناسب میں بانٹیں جن میں بقیہ رقم بانٹی تھی۔"
      - "**بکنگ دوسری کرنسی میں ہو۔** ولا کو اس کرنسی میں درج کریں جس میں آپ نے ادا کیا۔ اگر گروپ ساتھ ساتھ تبدیل کرتا ہے تو موجودہ ایکسچینج ریٹ استعمال کریں، یا وہ ریٹ ٹائپ کریں جو آپ کو واقعی ملا۔ اصل رقم خرچے پر برقرار رہتی ہے۔ [متعدد کرنسیاں](page:feature/multiple-currencies) میں تفصیل ہے۔"
      - "**جزوی راتیں۔** کوئی آدھی رات کو پہنچتا ہے، کوئی ناشتے سے پہلے نکل جاتا ہے۔ راتیں گننے کا ایک اصول طے کریں اور سب کے لیے وہی استعمال کریں۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ آپ کے لیے راتیں نہیں گنتا۔ راتوں یا حصوں کے مطابق تقسیم نہیں ہے، اس لیے ہر رقم اوپر کی طرح خود نکالیں اور **عین رقمیں** درج کریں۔"
      - "یہ رقم نہیں منتقل کرتا۔ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر ادائیگی ریکارڈ کریں۔"
      - "یہ ہر خرچے پر ایک ہی ادا کنندہ کی اجازت دیتا ہے۔ اگر ولا کے لیے دو لوگوں نے ادا کیا تو دو اخراجات درج کریں۔"
      - "اس میں مہمان کے طور پر رسائی نہیں ہے۔ گروپ کے ہر فرد کو، دیو سمیت، مفت اکاؤنٹ چاہیے۔"
