meta:
  title: "حاسبة تقسيم الإيجار: بحسب مساحة الغرفة أو الدخل | Side Badger"
  description: "غرفة أكبر، حصة أكبر؟ اعرف كم يدفع كل زميل سكن، بحسب مساحة الغرفة أو الدخل. تعمل في متصفحك، ولا يُحفظ شيء ولا يُرسل."
h1: "حاسبة تقسيم الإيجار"
navLabel: "حاسبة تقسيم الإيجار"
lead: "غرفة نوم أكبر، حصة أكبر؟ اكتب الإيجار وانظر كم يدفع كل شخص، بحسب مساحة الغرفة أو الدخل، حتى آخر فلس. تعمل في متصفحك ولا تحفظ شيئاً ولا تنقل أي مال. وحين يريد البيت أن يبقى الحساب محفوظاً، [قسّموا المصروفات](page:feature/split-expenses) في Side Badger وانسخوا الإيجار كل شهر."
cta:
  heading: "اتفقوا على النسب مرة واحدة، وانسخوها إلى الأبد."
  body: "تنسى هذه الحاسبة كل شيء حين تغلق التبويب، تماماً مثل زميل السكن الذي يقسم أنه دفع فاتورة الإنترنت. أما مجموعة Side Badger فتحتفظ بالإيجار والفواتير ومن دفع ماذا. وهي مجانية، بلا إعلانات وبلا حدود يومية."
sections:
  - heading: "طريقتان لتقاسم الإيجار"
    items:
      - "**بحسب مساحة الغرفة.** جزء من الإيجار يقابل المطبخ والحمام وغرفة الجلوس، التي يستخدمها الجميع. أنت تختار هذه الحصة (40% في البداية) وتُقسَّم بالتساوي. ويذهب الباقي بحسب مساحة غرف النوم، فتدفع الغرفة الكبيرة أكثر وتنال الغرفة الصغيرة الخصم الذي استحقته عن جدارة."
      - "**بحسب الدخل.** يدفع كل شخص من الإيجار نسبة تساوي نسبة ما يكسبه من مجموع دخل الجميع. وإذا أضفت فواتير مشتركة فإنها تتبع الحصص نفسها."
  - heading: "كيف تعمل الحسابات"
    body: "يحصل كل شخص على حصة دقيقة، ثم على نسبة مئوية بعدد صحيح، لأن الأعداد الصحيحة أسهل في الكتابة وفي الجدال حولها. والتقريب بطريقة الباقي الأكبر: يحتفظ كل شخص بالعدد الصحيح الأقل من حصته، وتذهب النقاط المتبقية إلى من خسر أكثر. ويكون مجموع النسب 100 دائماً. وفي الشقة أدناه، تكون حصة الـ 40% المشتركة 13.33% لكل واحد. غرفة بريا 16 من أصل 38 م² في الشقة، فتكون 60% × 16/38 مساوية لـ 25.26%، وبإضافة 13.33% تصير 38.6%، وتُقرَّب إلى 39%. ويصل توم وعائشة إلى 32% و29%، ومجموع 39 + 32 + 29 هو 100. وكل مبلغ هو تلك النسبة من الإيجار: 39% من £1,950 تساوي £760.50."
  - heading: "ثم اكتبها في Side Badger"
    body: "للقصة كاملة، بما فيها متر القياس، انظر [كيف تقسّم الإيجار بحسب مساحة الغرف](page:guide/how-to-split-rent-by-room-size)، أو [شريك يكسب أكثر](page:guide/how-to-split-bills-with-a-partner-who-earns-more) للأزواج."
    items:
      - "**أضف الإيجار.** في مجموعتك اختر **إضافة مصروف**، وحدّد من دفع للمالك تحت **من دفع؟**، وأبقِ الجميع تحت **تقسيم بين**."
      - "**اختر نسبة مئوية.** تحت **كيفية التقسيم** اختر **نسبة مئوية** واكتب النسب بأعداد صحيحة. وينبّهك النموذج إذا لم يكن مجموعها 100."
      - "**انسخه الشهر القادم.** افتح إيجار الشهر الماضي واختر **نسخ المصروف**. ويأتي التقسيم معه."
  - heading: "ما لا تفعله الحاسبة"
    items:
      - "**قياس غرفكم.** المساحة نقطة بداية فقط. الغرفة التي فيها حمام خاص تساوي أكثر من المساحة نفسها بلا حمام، والغرفة الصغيرة التي لا تتسع إلا لسرير وكرسي يأمل أن يجد مكاناً تساوي أقل."
      - "**تحديد ما يُحسب دخلاً.** الصافي أم الإجمالي، الراتب أم العمل الجانبي: تقرر المجموعة ذلك. واستخدموا الفترة نفسها للجميع."
      - "**حفظ أي شيء.** أغلق التبويب وتختفي الأرقام. وللاحتفاظ بها انسخ الرابط. فهو يحمل أرقامك بعد علامة #، وهي جزء لا ترسله المتصفحات إلى أي خادم، ويستطيع كل من لديه الرابط قراءتها."
      - "**نقل الأموال.** تدفعون للمالك بالطريقة التي تناسبكم."
      - "**الجمع بين العملات أو تجاوز الحدود.** اختر عملة واحدة. تقبل الحاسبة من 2 إلى 10 أشخاص وإيجاراً يصل إلى 999,999.99، كما في التطبيق."
