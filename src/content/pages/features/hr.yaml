meta:
  title: "Što Side Badger radi, a što ne"
  description: "Podjela, poravnanje i više valuta, plus grupe, popisi i ankete. Cijeli paket i iskren popis onoga što Side Badger izostavlja."
h1: "Što Side Badger radi"
navLabel: "Značajke"
lead: "Sve što je u kutiji, i ono što nije."
intro: "Evo cijelog paketa. Tablicu smo namjerno izostavili. Odaberi značajku ispod za dugu verziju ili preleti ostatak popisa i kratak popis stvari koje Side Badger ne radi."
cta:
  heading: "Radi li ono što tvojoj grupi treba?"
  body: "Napravi besplatan korisnički račun i prvo ga isprobaj s malom grupom."
cardsHeading: "Svaka značajka, detaljno"
sections:
  - heading: "Skeniranje računa"
    body: "Slikaj račun, a Side Badger popuni ukupni iznos, datum i mjesto da ih provjeriš. Slike računa čita Googleova AI usluga. [Kako radi skeniranje računa](page:feature/receipt-scanning)."
  - heading: "Grupe i dopuštenja"
    body: "Napravi grupu za svaku kuću, putovanje ili događaj, s do 50 osoba. Pozovi ljude poveznicom ili QR kodom. U većoj grupi nekoga možeš učiniti promatračem, koji vidi sve i ništa ne mijenja. [Grupe i dopuštenja](page:feature/groups-and-permissions) imaju sitni tisak."
  - heading: "Popisi i ankete"
    body: "Zajednički popis za kupnju drži uz račune za kupnju. Uži izbor vila stavi na glasanje, po želji anonimno. [Planiranje zajedno](page:feature/plan-together) obuhvaća komentare, pitanja, popise i ankete."
  - heading: "Sve ostalo"
    items:
      - "**Ažuriranja uživo:** dodaj trošak i svi ga odmah vide."
      - "**Jezici:** koristi Side Badger na 39 jezika. Svatko u grupi može odabrati svoj."
      - "**Početni zaslon:** trgovina aplikacijama nije potrebna. Prijavi se, a zatim dodaj Side Badger na početni zaslon i otvara se kao aplikacija. Postavke u aplikaciji pokazuju kako. [Više o web-aplikaciji](page:feature/web-app)."
      - "**Obavijesti:** uključi push obavijesti u Postavkama i dobit ćeš obavijest kad u tvojim grupama ima novih aktivnosti. Na iPhoneu i iPadu najprije dodaj Side Badger na početni zaslon."
      - "**Povratne informacije:** naiđeš na grešku? Javi nam iz aplikacije i tamo pročitaj naš odgovor."
  - heading: "Što Side Badger ne radi"
    items:
      - "**Ne premješta novac.** Side Badger nikad ne dira tvoj novac. Platite si kako god želite. Zahtjevi za uplatu su u planu."
      - "**Ne ponavlja račune.** Nema ponavljajućih troškova. Kopiraj prošlomjesečni račun u dva dodira."
      - "**Ne dijeli po stavkama.** Jedna osoba plaća po trošku. Dijeli jednako, točno ili po postocima."
      - "**Nema izvornu aplikaciju.** Radi u pregledniku. Prijavi se, a zatim ga dodaj na početni zaslon."
      - "**Ne radi izvan mreže.** Treba mu veza."
      - "**Ne šalje upozorenja e-poštom ni SMS-om.** Nove aktivnosti vide se u aplikaciji, a ako ih uključiš, i kao push obavijesti."
      - "**Ne crta grafikone ni proračune.** Vodi evidenciju tko kome duguje, i to je cijeli trik."
      - "**Ne prijavljuje preko Googlea ni Applea.** Registriraj se e-poštom. Prijava preko Googlea i Applea je u planu."
      - "**Ne pušta ljude bez korisničkog računa.** Svatko u grupi treba besplatan korisnički račun."
faq:
  heading: "Pitanja"
  items:
    - q: "Mogu li plaćati preko Side Badgera?"
      a: "Ne. Side Badger vodi evidenciju i nikad ne dira tvoj novac. Platite si kako god želite, a zatim zabilježi uplatu."
    - q: "Postoji li mobilna aplikacija?"
      a: "Ne u trgovini aplikacijama. Side Badger radi u pregledniku. Prijavi se na telefonu, a zatim ga dodaj na početni zaslon da se otvara kao aplikacija. Postavke u aplikaciji pokazuju kako."
    - q: "Mogu li dijeliti po stavkama?"
      a: "Ne. Svaki trošak ima jednog platitelja, a dijeliš ga jednako, točno ili po postocima."
    - q: "Radi li izvan mreže?"
      a: "Ne, treba mu veza."
    - q: "Treba li svatko u grupi korisnički račun?"
      a: "Da. Svatko u grupi treba besplatan korisnički račun, a za registraciju je dovoljna e-adresa."
