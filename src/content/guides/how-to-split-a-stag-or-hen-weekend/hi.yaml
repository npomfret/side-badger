meta:
  title: "स्टैग या हेन वीकेंड का खर्च कैसे बांटें | Side Badger"
  description: "मेहमान-ए-खास कुछ नहीं देता, और सोमवार तक सब आपस में बात भी कर रहे हैं। स्टैग या हेन वीकेंड का खर्च कैसे बांटें, हिसाब के साथ।"
h1: "स्टैग या हेन वीकेंड का खर्च कैसे बांटें"
navLabel: "स्टैग या हेन वीकेंड"
lead: "मेहमान-ए-खास कुछ नहीं देता, इसलिए बाकी ग्रुप हर खर्च आपस में [बराबर](page:feature/split-expenses) बांटता है। जो लोग किसी खर्च में शामिल नहीं थे उन्हें उससे बाहर रखें, और मेहमान-ए-खास को ग्रुप से बाहर रखें ताकि सरप्राइज़ बना रहे।"
cta:
  heading: "हिसाब रखें, सरप्राइज़ बचाएं"
  body: "ग्रुप बनाएं, मेहमान-ए-खास को छोड़कर सबको लिंक भेजें और हर खर्च होते ही जोड़ते जाएं। Side Badger मुफ्त है, इसमें कोई विज्ञापन नहीं और रोज़ाना की कोई सीमा नहीं।"
sections:
  - heading: "चार दोस्त और एक सरप्राइज़"
    body: "Hannah, Isla, Jess और Kat, Grace को उसके हेन वीकेंड पर ले जा रही हैं। Grace मेहमान-ए-खास है, इसलिए वह किसी चीज़ का पैसा नहीं देती। वह ग्रुप में भी नहीं है, इसलिए उसकी दोस्त उस पर क्या खर्च कर रही हैं, यह वह नहीं देख सकती। Hannah कॉटेज बुक करती है, Isla स्पा डे का पैसा देती है, Jess डिनर का खर्च उठाती है और Kat टैक्सी का। रविवार तक सबने कुछ न कुछ दिया है, और कोई नहीं बता सकता कि कौन आगे है। हिसाब स्टैग और हेन वीकेंड, दोनों में वही रहता है, मेहमान-ए-खास कोई भी हो।"
  - heading: "देने वालों के बीच बांटें, मौजूद लोगों के बीच नहीं"
    body: "मेहमान-ए-खास का हिस्सा गायब नहीं होता। वह बंट जाता है। कॉटेज £720 का है और उसे चार दोस्त चुकाती हैं, इसलिए हर एक के £180 आते हैं, और Grace की जगह इस आंकड़े में पहले से शामिल है। डिनर £260 का है, यानी हर एक के £65। टैक्सी £44 की है, यानी हर एक के £11। जो भी किसी चीज़ को छोड़े, वह सिर्फ़ उसी खर्च से बाहर होता है। Kat स्पा छोड़ती है, इसलिए स्पा के £360, जिनमें Grace की जगह भी शामिल है, Hannah, Isla और Jess में £120 प्रत्येक के हिसाब से बंटते हैं। सब जोड़ें तो Hannah, Isla और Jess में से हर एक पर वीकेंड के £376 बनते हैं, और Kat पर £256।"
  - heading: "Side Badger में सेट करें"
    items:
      - "वीकेंड के लिए एक ग्रुप बनाएं और उसे कोई नीरस-सा नाम दें, जैसे कॉटेज वीकेंड। Grace सदस्य नहीं है, और किसी ग्रुप को सिर्फ़ उसके सदस्य देख सकते हैं।"
      - "**दूसरों को आमंत्रित करें** चुनें और लिंक सिर्फ़ वहीं भेजें, या QR कोड सिर्फ़ वहीं दिखाएं, जहां Grace को न दिखे। लिंक से ग्रुप के शामिल होने से पहले उसका एक प्रीव्यू दिखता है। तय करें कि वह कितनी देर चलेगा, 15 मिनट से 5 दिन तक। पुराना लिंक अपनी समय-सीमा खत्म होने तक काम करता रहता है, इसलिए उसे ज़रूरत से ज़्यादा देर न रखें।"
      - "हर खर्च के लिए **व्यय जोड़ें** चुनें, राशि डालें और **किसने भुगतान किया?** में पेमेंट करने वाले को चुनें। **विभाजित करें** में उन लोगों को टिक करें जो पैसे दे रहे हैं, और जिसने उस खर्च को छोड़ा उसे छोड़ दें, जैसे स्पा के लिए Kat। **विभाजन कैसे करें** में **समान रूप से** चुनें।"
      - "घर लौटकर ग्रुप के **शेष** खोलें। Side Badger दिखाता है कि किसे किसका देना है और पेमेंट की एक छोटी सूची सुझाता है। यहां वह तीन है: Kat, Hannah को £212 देती है, Jess, Hannah को £116 और Isla, Hannah को £16। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर हर पेमेंट को रिकॉर्ड करने के लिए **हिसाब बराबर करें** इस्तेमाल करें।"
  - heading: "बुकिंग से पहले, बजट और डिपॉज़िट"
    body: "किसी के बुकिंग करने से पहले बजट तय करें। **पोल जोड़ें** चुनें, पूछें कि ग्रुप कॉटेज पर कितना खर्च करेगा और कुछ आंकड़े विकल्प के रूप में दें। पोल बनाते समय **गुमनाम मतदान** चालू करें, ताकि यह छुपा रहे कि किसने किसे वोट दिया, और छोटे बजट के लिए किसी को सबके सामने सफाई न देनी पड़े। जब सब वोट दे दें और विजेता दिखने लगे, तो पोल बंद करें। फिर डिपॉज़िट की बारी आती है। जो बुकिंग करता है वह उसे देता है और खर्च के रूप में जोड़ता है, बराबर बंटा हुआ, और बाकी रकम दूसरे खर्च के रूप में तब जोड़ी जाती है जब वह देय हो। बाकी लोग अपना हिस्सा तुरंत भेज सकते हैं और पेमेंट रिकॉर्ड कर सकते हैं, या अंतिम गिनती का इंतज़ार कर सकते हैं। बैलेंस दोनों तरह से एक ही निकलते हैं।"
  - heading: "जब कोई सिर्फ़ एक रात के लिए जुड़े"
    body: "जो दोस्त सिर्फ़ शनिवार के लिए आता है उसे शुक्रवार का पैसा नहीं देना चाहिए। उसे उन खर्चों से बाहर रखें जिनका वह हिस्सा नहीं था। जहां खर्च इस पर निर्भर हो कि हर कोई कितना रुका, जैसे कमरा, वहां **विभाजन कैसे करें** में **सटीक राशियाँ** चुनें और हर व्यक्ति का हिस्सा टाइप करें, जिसका जोड़ कुल के बराबर होना चाहिए। पहले प्रति व्यक्ति प्रति रात का दाम निकालें, फिर उसे हर व्यक्ति के रुकने की रातों से गुणा करें। जिन खर्चों में हर किसी का हिस्सा बराबर नहीं होता, उनके बारे में और जानकारी [ग्रुप ट्रिप](page:use-case/group-trips) पेज पर है।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह कभी पैसे नहीं भेजता। आप बैंक ट्रांसफर, कैश या जो भी ठीक लगे उससे एक-दूसरे को पेमेंट करते हैं, फिर पेमेंट रिकॉर्ड करते हैं ताकि सबके लिए बैलेंस अपडेट हो जाएं।"
      - "यह पेमेंट रिमाइंडर नहीं भेजता। ग्रुप चैट में प्यार से याद दिलाना अब भी किसी इंसान का काम है।"
      - "हर खर्च का एक ही पेमेंट करने वाला होता है, और Side Badger रसीद को लाइन-दर-लाइन नहीं बांट सकता। अगर कॉटेज का पेमेंट दो कार्डों से हुआ, तो उसे दो खर्चों के रूप में डालें। अगर कुछ लोगों ने डिनर में एक्स्ट्रा मंगाया, तो एक्स्ट्रा को अलग खर्च के रूप में डालें।"
      - "यह पैसे का हिसाब रखता है, यात्रा का कार्यक्रम नहीं। पोल और कमेंट खर्चों तक ही रहते हैं, इसलिए वीकेंड की योजनाएं आपकी ग्रुप चैट में ही रहें।"
exampleAfter: 2
