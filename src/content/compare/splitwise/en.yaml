meta:
  title: "Side Badger vs Splitwise: the whole group, not just the sums | Side Badger"
  description: "A free Splitwise alternative for the whole group: comments, questions, lists, polls and proper roles, plus free receipt scanning and currency conversion."
h1: "Side Badger vs Splitwise: the whole group, not just the sums"
navLabel: Side Badger vs Splitwise
lead: "Someone in your group has probably said \"just use Splitwise\". Fair enough: it's good at the maths. Side Badger does the maths too, then gives the group somewhere to talk it through: comments, questions, lists, polls and proper group roles. Receipt scanning and currency conversion come free."
cta:
  heading: Try it on your next shared bill
  body: "Create a free account, make a group and add one real expense. If it isn't for you, you've spent a few minutes, not a subscription."
asOf: 2026-11-22
asOfNote: "We read Splitwise's own pages on {date} so you don't have to, and everything here about Splitwise comes from them. Each row of the table links to its source. Plans change, so we check again every quarter, and if Splitwise's pages disagree with this one, believe them."
