faq:
  heading: "Galderak"
  items:
    - q: "Zein da bidezkoagoa, gelen tamaina ala diru-sarrerak?"
      a: "Bietako bat ere ez da beti bidezkoagoa. Gelen tamaina egokia da lo egiten duten espazioagatik ordaintzen duten pisukideentzat. Diru-sarrerak egokiak dira bikoteentzat eta soldata oso desberdinak dituzten lagunentzat. Adostu lehen alokairu-egunaren aurretik, ez ondoren."
    - q: "Fakturak modu berean banatu behar dira?"
      a: "Pisukideentzat, normalean ez. Denek erabiltzen dituzte energia eta Interneta, beraz berdin banatzea errazagoa da, adibidean bezala. Diru-sarreren arabera, kalkulagailuak fakturei alokairuaren zati berberak ematen dizkie."
    - q: "Oin karratuak erabil ditzaket?"
      a: "Bai. Aukeratu ft² eta idatzi zure azalerak oin karratutan. Unitatea etiketa bat besterik ez da, eta zatiak berdinak ateratzen dira denek unitate bera erabiltzen duten bitartean."
    - q: "Kalkulagailua doakoa al da?"
      a: "Bai. Doakoa. Iragarkirik ez. Eguneko mugarik ez. Ez duzu kontu bat behar ere."
