meta:
  title: "Side Badger dhidi ya Splitwise: kikundi kizima, si hesabu tu | Side Badger"
  description: "Mbadala wa bure wa Splitwise kwa kikundi kizima: maoni, maswali, orodha, kura na majukumu halisi, pamoja na kuchanganua risiti na kubadilisha sarafu bila malipo."
h1: "Side Badger dhidi ya Splitwise: kikundi kizima, si hesabu tu"
navLabel: Side Badger dhidi ya Splitwise
lead: 'Huenda mtu kwenye kikundi chenu ameshasema "tumia tu Splitwise". Sawa: ni mzuri kwenye hesabu. Side Badger nayo inafanya hesabu, kisha inakipa kikundi mahali pa kuzijadili: maoni, maswali, orodha, kura na majukumu halisi ya kikundi. Kuchanganua risiti na kubadilisha sarafu ni bure.'
cta:
  heading: Ijaribu kwenye bili yenu ya pamoja ijayo
  body: Fungua akaunti ya bure, tengeneza kikundi na ongeza gharama moja halisi. Isipokufaa, umetumia dakika chache, si malipo ya usajili.
asOf: 2026-11-22
asOfNote: Tulisoma kurasa za Splitwise yenyewe tarehe {date} ili wewe usilazimike, na kila kitu kinachosemwa hapa kuhusu Splitwise kinatoka huko. Kila safu ya jedwali ina kiungo cha chanzo chake. Mipango hubadilika, kwa hivyo tunakagua tena kila robo mwaka, na kurasa za Splitwise zikipingana na ukurasa huu, ziamini zenyewe.
