sections:
  - heading: "W czym Splitwise jest dobry"
    body: "Jeśli twoja grupa potrzebuje natywnej aplikacji, pracy offline albo płatności w aplikacji, Splitwise jest rozsądnym wyborem i wolimy, żebyście go wybrali, niż przekonali się o tym później. Jego własne strony wymieniają:"
    items:
      - "**Aplikacje i praca offline.** Aplikacje na iPhone'a i Androida oraz wersja internetowa, a do tego tryb offline."
      - "**Więcej sposobów dzielenia.** Udziały, korekty i podział według pozycji, oprócz podziału po równo, według dokładnych kwot i procentowo."
      - "**Wydatki cykliczne.** Ustaw, żeby czynsz się powtarzał, i zapomnij o nim."
      - "**Płatności w aplikacji.** W niektórych krajach potrafi też przesyłać pieniądze, przez Splitwise Pay, Venmo, PayPal lub Pay by Bank."
  - heading: "Tu za darmo, tam płatne"
    body: "Splitwise Pro to płatny plan Splitwise, a jego własna strona Pro sprzedaje cztery rzeczy, które w Side Badger nic nie kosztują."
    items:
      - "**Skanowanie paragonów.** Splitwise Pro skanuje zdjęcie paragonu. Side Badger robi to za darmo, bez kredytów na skany: uzupełnia sumę, datę i miejsce do sprawdzenia. Obrazy paragonów są odczytywane przez usługę AI Google."
      - "**Przeliczanie walut.** Splitwise Pro przelicza wydatki grupy na twoją domyślną walutę, gdy dotkniesz Convert. Side Badger przelicza każdy wydatek przy wpisywaniu, po aktualnym kursie albo po tym, który faktycznie obowiązywał, a oryginalna kwota zostaje przy wydatku."
      - "**Bez reklam.** Splitwise wymienia całkowity brak reklam jako funkcję Pro. Side Badger nie ma reklam."
      - "**Bez dziennych limitów.** Splitwise Pro sprzedaje nieograniczoną liczbę wydatków, a jego centrum pomocy mówi, że darmowi użytkownicy mogą dodawać do 4 wydatków dziennie. Side Badger nie ma dziennych limitów."
  - heading: "Co ma Splitwise, a Side Badger nie"
    body: "To nie wszystkie funkcje Splitwise, tylko te, które zwykle decydują. Pełną listę mają strony samego Splitwise. Tu Side Badger wypada gorzej."
    items:
      - "**Natywne aplikacje.** Side Badger działa w przeglądarce. Zaloguj się, a potem dodaj go do ekranu głównego, a otworzy się jak aplikacja."
      - "**Tryb offline.** Side Badger potrzebuje połączenia."
      - "**Płatności w aplikacji.** Side Badger nigdy nie dotyka twoich pieniędzy. Płaćcie sobie, jak chcecie, a potem zarejestrujcie płatność."
      - "**Wydatki cykliczne.** Side Badger ich nie ma. Skopiuj zeszłomiesięczny czynsz zamiast wpisywać go od nowa."
      - "**Dzielenie według udziałów lub pozycji.** W Side Badger każdy wydatek ma jednego płatnika i dzieli się go po równo, według dokładnych kwot albo procentowo. Skanowanie paragonów nie przypisuje pozycji do osób."
      - "**Wykresy i domyślne podziały.** Splitwise Pro ma jedno i drugie. Side Badger prowadzi rachunek, kto komu jest winien, i na tym cała sztuczka polega."
  - heading: "Przenosiny grupy"
    body: "Nie ma importera, więc przenosiny oznaczają nowy start. Najpierw rozliczcie się w Splitwise, potem utwórzcie grupę w Side Badger i zaproście wszystkich linkiem lub kodem QR. Każdy w grupie potrzebuje darmowego konta, a do rejestracji wystarczy adres e-mail."
