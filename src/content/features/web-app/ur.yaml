meta:
  title: "ڈاؤن لوڈ کے بغیر بل تقسیم کرنے والی ایپ | Side Badger"
  description: "آپ کا فون بھرا ہوا ہے، ہم سمجھتے ہیں۔ Side Badger براؤزر میں چلتا ہے، ایپ اسٹور اور ڈاؤن لوڈ کے بغیر۔ ہوم اسکرین میں شامل کریں تو ایپ کی طرح کھلتا ہے۔"
h1: "ایپ اسٹور نہیں۔ ڈاؤن لوڈ نہیں۔ پھر بھی ایپ جیسا"
navLabel: "ویب ایپ"
lead: "Side Badger آپ کے براؤزر میں رہتا ہے۔ ڈھونڈنے کو کوئی ایپ اسٹور نہیں اور پہلے ڈاؤن لوڈ کرنے کو کچھ نہیں۔ فون یا کمپیوٹر پر سائن ان کریں، اپنے گروپ کے ساتھ آن لائن اخراجات تقسیم کریں، اور جب ایک ٹیپ پر چاہیے ہو تو اسے ہوم اسکرین یا Dock میں شامل کر لیں۔"
cta:
  heading: "کھولیں۔ سائن ان کریں۔ گروپ شروع کریں۔"
  body: "اکاؤنٹ بنائیں، گروپ شروع کریں اور پہلا خرچہ شامل کریں، سب کچھ اسی براؤزر سے جو آپ کے پاس پہلے سے کھلا ہے۔ پہلے سیر چاہیے؟ [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں، یا [مفت میں کیا شامل ہے](page:pricing) جانچیں۔"
problem:
  heading: "آپ کا فون بھرا ہوا ہے۔ ہم سمجھتے ہیں۔"
  body: "اس میں کہیں ایک ہی غروب آفتاب کی چار ہزار تصویریں ہیں اور اسٹوریج کی وہ وارننگ جسے آپ بہار سے ہٹاتے آ رہے ہیں۔ ایک ڈنر تقسیم کرنے کے لیے اسے آخری چیز ایک اور ایپ چاہیے۔ اس لیے Side Badger ایک ویب ایپ ہے۔ یہ فون یا کمپیوٹر پر جدید براؤزر میں چلتی ہے۔ فون پر یہ موبائل لے آؤٹ استعمال کرتی ہے، جس میں گروپ کا صفحہ ٹیبز میں بٹا ہوتا ہے اور کنٹرول ٹچ کے لیے آسان ہیں۔ کچھ اضافی چیزیں، جیسے ہوم اسکرین میں شامل کرنا، آپ کے براؤزر پر منحصر ہیں، اور ہم بتاتے ہیں کہاں۔"
workflow:
  heading: "براؤزر ٹیب سے ہوم اسکرین تک تین مراحل میں"
  steps:
    - title: "کھولیں اور سائن ان کریں"
      body: "اپنے براؤزر میں Side Badger پر جائیں اور سائن ان کریں۔ آپ کو صرف ای میل ایڈریس اور پاس ورڈ چاہیے، اور کچھ شامل کرنے سے پہلے آپ ای میل کی تصدیق کرتے ہیں۔ گروپ کے ہر شخص کو اکاؤنٹ چاہیے، اس لیے جنہیں آپ مدعو کریں گے وہ بھی یہی کریں گے۔"
    - title: "اسے ہوم اسکرین یا Dock میں شامل کریں"
      body: "سائن ان ہونے کے بعد ایپ خود کو انسٹال کرنے کی پیشکش کرتی ہے۔ جہاں آپ کا براؤزر اجازت دے وہاں **انسٹال کریں** کا بٹن ملتا ہے، اور جہاں نہ دے وہاں **طریقہ دکھائیں**۔ چوک گئے، یا منع کر دیا؟ **ترتیبات** میں یہی مدد **ہوم اسکرین یا Dock میں شامل کریں** کے تحت ہے۔ iPhone یا iPad پر ترتیبات پہلے iPhone کے مراحل دکھاتی ہیں اور باقی آلات کو **دیگر آلات** کے تحت رکھتی ہیں۔ جیسے بھی ہو، ایپ پھر اپنی الگ ونڈو میں کھلتی ہے۔"
      shot: S20
      shotAlt: "ترتیبات کا ہوم اسکرین یا Dock میں شامل کریں والا حصہ، جس میں آلے پر ایپ شامل کرنے کے مراحل ہیں"
    - title: "اطلاعات آن کریں، اگر آپ چاہیں"
      body: "اطلاعات آپ کے آن کرنے تک آف رہتی ہیں، اور ہر آلہ الگ آن ہوتا ہے۔ اطلاعات کی گھنٹی جو **آن کریں** کا بٹن پیش کرتی ہے اسے استعمال کریں، یا **ترتیبات** میں **پش اطلاعات** کا سوئچ۔ iPhone یا iPad پر پہلے ایپ کو ہوم اسکرین سے کھولیں۔ وہاں اطلاعات صرف اسی جگہ کام کرتی ہیں۔"
      shot: S19
      shotAlt: "اطلاعات کا ڈراپ ڈاؤن کھلا ہوا، جس میں گروپ کی حالیہ سرگرمی کی فہرست ہے"
options:
  heading: "اسے شامل کرنے کا طریقہ، آلے کے حساب سے"
  items:
    - title: "iPhone اور iPad"
      body: "شیئر کا بٹن دبائیں، یعنی اوپر کی طرف تیر والا چوکور۔ اگر نظر نہ آئے تو پہلے تین نقطوں (•••) پر ٹیپ کریں، پھر شیئر۔ نیچے اسکرول کریں اور **Add to Home Screen** پر ٹیپ کریں۔ **Open as Web App** کو آن رکھیں، پھر **Add** دبائیں۔ اگر کوئی لنک کسی اور ایپ کے اندر کھلا ہو تو صفحہ پہلے Safari میں کھولیں، کیونکہ وہ بلٹ ان براؤزر اسے شامل نہیں کر سکتا۔"
    - title: "Android"
      body: "براؤزر کا مینو کھولیں اور **Add to Home screen** یا **Install app** چنیں۔"
    - title: "کمپیوٹر پر Chrome یا Edge"
      body: "براؤزر کا مینو کھولیں اور اس سائٹ کو ایپ کے طور پر انسٹال کرنے کا اختیار چنیں۔ پھر اسے اپنی ونڈو اور اپنا آئیکن ملتا ہے۔"
    - title: "Mac پر Safari"
      body: "**File** چنیں، پھر **Add to Dock**۔"
sections:
  - heading: "اطلاعات، صرف اگر آپ مانگیں"
    body: "پش اطلاعات اختیاری ہیں۔ انہیں آن کریں تو جب آپ کے گروپوں میں نئی سرگرمی ہو، جیسے کوئی خرچہ شامل کرے، تبصرہ چھوڑے یا ادائیگی ریکارڈ کرے، آپ کو اطلاع ملتی ہے۔ یہ ایک وقت میں ایک آلے پر آن ہوتی ہیں، اطلاعات کی گھنٹی سے یا **ترتیبات** سے، اور آپ وہیں سے انہیں دوبارہ آف کر سکتے ہیں۔ انہیں ایسا براؤزر چاہیے جو انہیں سپورٹ کرے اور آپ کی اجازت۔ اگر آپ کے براؤزر نے سائٹ کے لیے انہیں بلاک کر رکھا ہو تو پہلے براؤزر کی ترتیبات میں اجازت دیں۔ iPhone یا iPad پر یہ صرف ہوم اسکرین میں شامل کی گئی ایپ سے کام کرتی ہیں، براؤزر ٹیب سے نہیں۔ ترسیل کی ضمانت نہیں، اس لیے اطلاع کو اشارہ سمجھیں، وعدہ نہیں۔ فیڈ میں کیا آتا ہے، اس کے لیے [مل کر منصوبہ بنائیں](page:feature/plan-together) دیکھیں۔"
  - heading: "لائیو اپ ڈیٹس، ریفریش کا بٹن نہیں"
    body: "خرچہ شامل کریں اور سب اسے فوراً دیکھتے ہیں، ساتھ یہ بھی کہ کیا بدلا اور کس نے بدلا۔ ہر گروپ سرگرمی کی تاریخ رکھتا ہے، اور اطلاعات کی گھنٹی آپ کے تمام گروپوں کی سرگرمی دکھاتی ہے۔ کسی کو پوچھنے کی ضرورت نہیں کہ آپ نے وہ چیز دیکھی جو آپ نے ابھی ڈالی۔ وہ ان کی اسکرین پر ہے۔"
  - heading: "39 زبانیں، ہر شخص کی اپنی"
    body: "Side Badger 39 زبانوں میں استعمال کریں، جن میں دائیں سے بائیں لکھی جانے والی عربی، فارسی اور اردو شامل ہیں۔ گروپ کا ہر شخص اپنی زبان چنتا ہے، اس لیے ایک ہی گروپ کا صفحہ ایک کے لیے عربی میں اور اگلے کے لیے انگریزی میں ہو سکتا ہے۔ گروپ کو صرف اعداد پر متفق ہونا ہے۔"
  - heading: "ایک سے زیادہ قسم کے صارفین کے لیے بنایا گیا"
    body: "Side Badger کی بناوٹ میں کی بورڈ اور اسکرین ریڈر استعمال کرنے والوں کا خیال رکھا گیا ہے۔ ارکان کے رنگوں کے ساتھ پیٹرن ہوتے ہیں، اس لیے آپ کو ہرے اور سرخ میں فرق کرنا نہیں پڑتا۔"
    items:
      - "اسکپ لنکس، تاکہ کی بورڈ استعمال کرنے والے سیدھے مواد پر جا سکیں۔"
      - "ڈائیلاگ کی بورڈ فوکس سنبھالتے ہیں۔"
      - "کنٹرولز پر لیبل ہیں، اسکرین ریڈرز کے لیے۔"
      - "دائیں سے بائیں زبانوں کے لیے لے آؤٹ پلٹ جاتے ہیں۔"
limits:
  heading: "ویب ایپ کیا نہیں کرتی"
  items:
    - "آف لائن استعمال نہیں ہے۔ Side Badger کو کنکشن چاہیے، اس لیے وائی فائی کے بغیر جہاز میں یہ آپ کا گروپ نہیں کھولے گا۔"
    - "ایپ اسٹور کی ایپ اور مقامی iPhone یا Android ایپ نہیں ہے۔ Side Badger ایک ویب ایپ ہے، اور ایپ جیسا ورژن ہوم اسکرین یا Dock میں شامل کرنے سے ملتا ہے۔"
    - "ہوم اسکرین یا Dock میں شامل کرنا آپ کے براؤزر پر منحصر ہے۔ مینو کے نام براؤزرز اور ورژنز کے درمیان مختلف ہوتے ہیں، اور کچھ براؤزر اسے پیش ہی نہیں کرتے۔"
    - "پش اطلاعات ہر آلے کے لیے اختیاری ہیں، اور انہیں ایسا براؤزر چاہیے جو انہیں سپورٹ کرے اور آپ کی اجازت۔ iPhone یا iPad پر یہ صرف ہوم اسکرین میں شامل کی گئی ایپ سے کام کرتی ہیں۔ ترسیل کی ضمانت نہیں۔"
    - "ای میل یا ٹیکسٹ الرٹ اور ادائیگی کی یاد دہانیاں نہیں ہیں۔ نئی سرگرمی ایپ میں نظر آتی ہے، اور اگر آپ آن کریں تو پش اطلاعات کے طور پر۔ ادائیگی کا پیچھا کرنا اب بھی آپ پر ہے۔"
    - "سرگرمی 90 دن تک رکھی جاتی ہے۔"
    - "آپ ای میل ایڈریس اور پاس ورڈ سے سائن ان کرتے ہیں۔ Google یا Apple سے سائن ان نہیں ہے، اور آپ کی عمر 18 سال یا اس سے زیادہ ہونی چاہیے۔"
    - "ہم یہ دعویٰ نہیں کرتے کہ Side Badger مکمل طور پر قابل رسائی ہے، یا رسائی کا کوئی باضابطہ معیار پورا کرتا ہے۔ اگر کوئی چیز آپ کے راستے میں آئے تو ایپ کے اندر سے ہمیں بتائیں اور ہمارا جواب آپ کو وہیں ملے گا۔"
useCasesHeading: "جہاں ایپ کی ضرورت نہ ہونا کام آتا ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا کسی ایپ اسٹور میں Side Badger کی ایپ ہے؟"
      a: "نہیں۔ Side Badger ایک ویب ایپ ہے۔ آپ اسے اپنے براؤزر میں کھولتے ہیں، اور اسے ہوم اسکرین یا Dock میں شامل کر سکتے ہیں تاکہ وہ ایپ کی طرح کھلے۔ ایپ اسٹور سے ڈاؤن لوڈ کرنے کو کچھ نہیں۔"
    - q: "کیا میں ایپ ڈاؤن لوڈ کیے بغیر بل تقسیم کر سکتا ہوں؟"
      a: "جی ہاں۔ فون یا کمپیوٹر کے براؤزر میں Side Badger کھولیں، سائن ان کریں اور گروپ شروع کریں۔ اسے ہوم اسکرین یا Dock میں شامل کرنا اختیاری ہے۔"
    - q: "کیا یہ آف لائن کام کرتی ہے؟"
      a: "نہیں۔ Side Badger کو کنکشن چاہیے، چاہے وہ ہوم اسکرین یا Dock میں شامل ہو۔"
    - q: "مجھے اپنے iPhone پر اطلاعات کیوں نہیں مل رہیں؟"
      a: "iPhone یا iPad پر اطلاعات صرف ہوم اسکرین میں شامل کی گئی ایپ سے کام کرتی ہیں، براؤزر ٹیب سے نہیں۔ اسے شامل کریں، ہوم اسکرین کے آئیکن سے کھولیں، پھر **ترتیبات** میں اطلاعات آن کریں۔ ترسیل کی ضمانت نہیں، اس لیے اگر کوئی گم ہو جائے تو گروپ کی سرگرمی کی تاریخ پھر بھی دکھاتی ہے کہ کیا شامل ہوا۔"
    - q: "کیا مجھے اطلاعات آن کرنی ہی ہوں گی؟"
      a: "نہیں۔ وہ آپ کے آن کرنے تک آف رہتی ہیں، ایک وقت میں ایک آلہ۔ ان کے بغیر بھی نئی سرگرمی ایپ میں نظر آتی ہے، اور کھلی ایپ والے ہر شخص کو تبدیلی فوراً دکھائی دیتی ہے۔"
    - q: "کیا گروپ کے ہر شخص کو اکاؤنٹ چاہیے؟"
      a: "جی ہاں۔ آپ کو صرف ای میل ایڈریس اور پاس ورڈ چاہیے، اور کچھ شامل کرنے سے پہلے آپ ای میل کی تصدیق کرتے ہیں۔ گروپ میں شامل ہونے والا ہر شخص یہی کرتا ہے، اپنی پسند کے فون یا کمپیوٹر پر۔"
