faq:
  heading: "Galderak"
  items:
    - q: "Kalkulagailua doakoa al da?"
      a: "Bai. Doakoa. Iragarkirik ez. Eguneko mugarik ez. Ez duzu kontu bat behar ere."
    - q: "Idazten dudana gordetzen al du?"
      a: "Ez. Ez da ezer gordetzen edo inora bidaltzen. Zifrak gordetzeko, erabili “Kopiatu esteka” eta gorde esteka nonbait."
    - q: "Nork ikus dezake kopiatzen dudan esteka?"
      a: "Esteka duen edonork. Zifrak estekan bertan daude, # ikurraren ondoren, beraz partekatu ikusi behar dituzten pertsonekin bakarrik."
    - q: "Dirua mugitzen al du?"
      a: "Ez. Nork nori ordaindu behar dion kalkulatzen du, eta zuek ordaintzen duzue nahi duzuen moduan. Side Badger-ek ere ez du inoiz zure dirua ukitzen. Ikusi [kitatzea](page:feature/settle-up)."
    - q: "Bi monetatan ordaindutako bidaia bat banatu dezaket?"
      a: "Hemen ez, kalkulu batek moneta bakarra duelako. Talde batean, moneta bakoitzak bere saldoa du. Ikusi [moneta anitz](page:feature/multiple-currencies)."
    - q: "Zer gertatzen da zenbatekoak ez badatoz bat?"
      a: "Kalkulagailuak gastuaren azpian esaten du, eta ez du emaitzarik erakusten bat etorri arte. Zenbateko zehatzek guztizkoa osatu behar dute, eta ehunekoek 100."
