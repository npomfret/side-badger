meta:
  title: "O que o Side Badger faz e não faz"
  description: "Dividir, acertar contas e várias moedas, mais grupos, listas e sondagens. O conjunto completo e uma lista honesta do que o Side Badger deixa de fora."
h1: "O que o Side Badger faz"
navLabel: "Funcionalidades"
lead: "Tudo o que vem na caixa, e o que não vem."
intro: "Aqui está o conjunto completo. Deixámos a folha de cálculo de fora de propósito. Começa pelas três tarefas que o Side Badger faz todos os dias, depois vê o resto da lista e a lista curta do que não faz."
cta:
  heading: "Faz o que o teu grupo precisa?"
  body: "Cria uma conta grátis e experimenta primeiro com um grupo pequeno."
  button: "Criar uma conta grátis"
cardsHeading: "As três tarefas, em detalhe"
sections:
  - heading: "Leitura de recibos"
    body: "Tira uma foto ao recibo e o Side Badger preenche o total, a data e o local para tu confirmares. As imagens dos recibos são lidas pelo serviço de IA da Google."
  - heading: "Grupos e permissões"
    body: "Cria um grupo para cada casa, viagem ou evento, com até 50 pessoas. Convida pessoas com um link ou um código QR. Num grupo maior, podes tornar alguém visualizador, que vê tudo e não altera nada."
  - heading: "Listas e sondagens"
    body: "Mantém a lista de compras partilhada ao lado das contas das compras. Põe a lista de villas a votos, de forma anónima se preferires."
  - heading: "Tudo o resto"
    items:
      - "**Atualizações em direto:** adiciona uma despesa e todos a veem logo."
      - "**Idiomas:** usa o Side Badger em 39 idiomas. Cada pessoa do grupo pode escolher o seu."
      - "**Ecrã principal:** sem loja de aplicações. Adiciona o Side Badger ao ecrã principal e ele abre como uma app."
      - "**Feedback:** encontraste um erro? Diz-nos de dentro da app e vê lá a nossa resposta."
  - heading: "O que o Side Badger não faz"
    items:
      - "**Movimentar dinheiro.** O Side Badger nunca toca no teu dinheiro. Paguem-se como preferirem. Os pedidos de pagamento estão previstos."
      - "**Repetir contas.** Não há despesas recorrentes. Copia a conta do mês passado em dois toques."
      - "**Dividir por item.** Um pagador por despesa. Divide em partes iguais, por valores exatos ou por percentagem."
      - "**Ter uma app nativa.** Funciona no navegador. Adiciona-o ao ecrã principal."
      - "**Funcionar offline.** Precisa de ligação."
      - "**Enviar alertas por e-mail ou SMS.** As notificações aparecem na app. As notificações push estão previstas."
      - "**Desenhar gráficos ou orçamentos.** Mantém a conta de quem deve a quem, e esse é o truque todo."
      - "**Iniciar sessão com Google ou Apple.** Regista-te com e-mail. O início de sessão com Google e Apple está previsto."
      - "**Deixar entrar pessoas sem conta.** Todas as pessoas do grupo precisam de uma conta grátis."
faq:
  heading: "Perguntas"
  items:
    - q: "Posso pagar através do Side Badger?"
      a: "Não. O Side Badger mantém a conta e nunca toca no teu dinheiro. Paguem-se como preferirem e depois registem o pagamento."
    - q: "Existe uma app para telemóvel?"
      a: "Não numa loja de aplicações. O Side Badger funciona no navegador e podes adicioná-lo ao ecrã principal para abrir como uma app."
    - q: "Posso dividir por item?"
      a: "Não. Cada despesa tem um pagador e divides em partes iguais, por valores exatos ou por percentagem."
    - q: "Funciona offline?"
      a: "Não, precisa de ligação."
    - q: "Todas as pessoas do grupo precisam de uma conta?"
      a: "Sim. Todas as pessoas do grupo precisam de uma conta grátis e, para te registares, basta um endereço de e-mail."
