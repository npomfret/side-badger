meta:
  title: "Side Badger vs Splitwise: co je zdarma, porovnáno | Side Badger"
  description: "Bezplatná alternativa ke Splitwise, srovnaná férově. Skenování účtenek, převod měn a žádné reklamy tu nestojí nic a uvádíme, co Splitwise umí lépe."
h1: "Side Badger vs Splitwise: co je zdarma, porovnáno"
navLabel: "Side Badger vs Splitwise"
lead: "Někdo ve vaší skupině už nejspíš řekl: „Použijme Splitwise.“ To je fér. Side Badger je bezplatná webová aplikace se skenováním účtenek, převodem měn a bez reklam, bez předplatného, které by je odemykalo. Která z nich vaší skupině sedne, závisí na tom, co potřebuje, a proto tu je srovnání, v němž je strana Splitwise převzatá jen z vlastních stránek Splitwise."
cta:
  heading: "Vyzkoušejte to na dalším společném účtu"
  body: "Vytvořte si bezplatný účet, založte skupinu a přidejte jeden skutečný výdaj. Pokud to nebude pro vás, stálo vás to pár minut, ne předplatné."
asOf: 2026-10-21
asOfNote: "Vlastní stránky Splitwise jsme přečetli dne {date}, abyste to nemuseli vy, a všechno, co se tu o Splitwise píše, pochází z nich. Každý řádek tabulky odkazuje na svůj zdroj. Tarify se mění, proto je kontrolujeme znovu každé čtvrtletí, a pokud se stránky Splitwise s touto neshodují, věřte jim."
