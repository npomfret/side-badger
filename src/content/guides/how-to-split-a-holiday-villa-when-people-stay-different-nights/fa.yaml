faq:
  heading: "پرسش‌هایی درباره ویلا"
  items:
    - q: "اگر کسی لغو کند چه؟"
      a: "شب‌های او را کم کنید، حساب را دوباره بکنید و هزینه ویلا را ویرایش کنید تا مبالغ دقیق دوباره با قیمت جمع شوند. نسخه قبلی نگه داشته می‌شود و ویرایش در فعالیت گروه دیده می‌شود، پس هیچ‌کس بی‌سروصدا عددی را عوض نمی‌کند. اینکه چه کسی می‌تواند ویرایش کند به مجوزهای گروه بستگی دارد."
    - q: "کسی که رزرو کرده باید کمتر بدهد؟"
      a: "این را گروه تصمیم می‌گیرد. رزرو کردن یک زحمت است و گروه‌ها درباره اینکه تخفیف می‌ارزد یا نه فرق دارند. هر چه توافق کردید، در مبالغ دقیق بگذارید و در یادداشت هزینه یا در یک نظر کنار آن بنویسید تا کسی مجبور نباشد قرار را یادش نگه دارد."
    - q: "می‌توانیم هزینه نظافت را جور دیگری تقسیم کنیم؟"
      a: "بله. هزینه را جداگانه وارد کنید و تقسیم خودش را بدهید. مساوی برای هزینه ثابتی مناسب است که کل خانه را می‌پوشاند. مبالغ دقیق برای گروهی مناسب است که می‌خواهد هزینه نظافت هم به شب‌ها بچسبد."
