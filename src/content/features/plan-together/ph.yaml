meta:
  title: "Shared na listahan, poll, at komento ng grupo | Side Badger"
  description: "Magkomento sa gastos, kuwestyunin ang kakaiba, magtabi ng listahan ng bibilhin, at bumoto sa villa. Planuhin muna ang gastos, saka hatiin. Libre, walang ad."
h1: "Planuhin nang sama-sama, hatiin pagkatapos"
navLabel: "Magplano nang sama-sama"
lead: "Ang listahan ng bibilhin at ang bayarin sa pamimili, sa wakas, nag-uusap na. Binibigyan ng Side Badger ang grupo mo ng lugar para pag-usapan ang pera bago at pagkatapos itong gastusin: may komento sa bawat gastos, paraan para kuwestyunin ang mukhang mali, shared na listahan, at poll para sa malalaking desisyon. Saka ninyo [hahatiin ang gastos](page:feature/split-expenses) gaya ng dati."
cta:
  heading: "Magplano, saka maghati"
  body: "Gumawa ng libreng account, magsimula ng grupo, at ilagay ang unang listahan, poll, o tanong sa tabi mismo ng pera. Hindi sigurado sa susunod na mangyayari? Tingnan ang [paano ito gumagana](page:how-it-works)."
problem:
  heading: "Nandito ang chat, nandoon ang bayarin"
  body: "Karaniwang nasa dalawang lugar ang gastos ng grupo. Nasa isa ang mga numero, at nasa chat na nawala na sa scroll noong Martes ang pagtatalo tungkol sa mga numero. Ang listahan ng bibilhin ay litrato ng ref. Ang villa ay napagdesisyunan ng thumbs-up ng karamihan, siguro. Pinapanatili ng Side Badger ang pagpaplano sa loob ng grupo, sa tabi ng mga gastos na tinutukoy nito, kaya may komento kung nasaan ang gastos, listahan kung nasaan ang pamimili, poll para sa malaking desisyon, at paraan para sabihing “teka, tama ba ito?” nang hindi nagsusulat ng isang talata. Lahat ng ito ay nananatiling tungkol sa pera ng grupo, na siyang dahilan kung bakit may grupo."
workflow:
  heading: "Mula sa botohan sa villa hanggang sa bayarin sa pamimili"
  steps:
    - title: "Ipaboto ang malaking desisyon"
      body: "Magdagdag ng poll para sa desisyong magtatakda ng bayarin, gaya ng kung aling villa. Pumili ng dalawa hanggang sampung opsyon, sabihin kung ilang boto ang makukuha ng bawat tao, saka isara ito kapag nakaboto na ang lahat at namarkahan na ang panalo."
      shot: S17
      shotAlt: "Isang saradong poll na may markadong panalong opsyon at bilang ng boto sa tabi ng bawat opsyon"
    - title: "Sabay na isulat ang listahan ng bibilhin"
      body: "Magsimula ng shared na listahan, idagdag ang mga item, at i-tick ang mga ito kapag nasa cart na. Idadagdag ang pamimili bilang gastos pagkatapos."
      shot: S16
      shotAlt: "Isang shared na listahan ng bibilhin na may ilang item na na-tick na at bilang ng progress"
    - title: "Pag-usapan ang gastos kung nasaan ito"
      body: "Magkomento mismo sa gastos, mag-attach ng resibo, at mag-react gamit ang emoji. Nananatili ang usapan sa tabi ng numerong pinag-uusapan."
      shot: S08
      shotAlt: "Isang gastos na may mga detalye, thumbnail ng resibo, thread ng komento, at mga emoji reaction"
    - title: "Kuwestyunin ang mukhang mali"
      body: "Kung in-on ng grupo ang mga tanong sa gastos, sinumang kasali sa isang gastos ay puwedeng pumili ng **Mayroon akong tanong**. Mananatili sa labas ng mga balanse ang gastos hanggang maayos ang tanong."
      shot: S18
      shotAlt: "Ang listahan ng mga gastos na may badge na Kinukuwestyon at ang filter na Kinukuwestyon lang"
    - title: "Tingnan kung ano ang nagbago, at sino ang nagbago"
      body: "Ipinapakita ng activity feed at ng bell ng mga abiso kung ano ang bago sa lahat ng grupo mo. Nariyan ang mga push notification kung gusto mo."
      shot: S19
      shotAlt: "Ang dropdown ng mga abiso na may listahan ng kamakailang aktibidad"
