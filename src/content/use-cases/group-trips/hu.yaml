      payer: ana
      amount: 480
      split:
        method: equal
    - label: Villa
      payer: ben
      amount: 900
      currency: EUR
      split:
        method: equal
    - label: "Vacsora"
      payer: chloe
      amount: 120
      currency: EUR
      split:
        method: equal
        shares:
          ana: 1
          ben: 1
          chloe: 1
    - label: "Hajókirándulás"
