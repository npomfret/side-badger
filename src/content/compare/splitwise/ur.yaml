faq:
  heading: "سوالات"
  items:
    - q: "کیا Side Badger، Splitwise کا مفت متبادل ہے؟"
      a: "گروپ میں بل تقسیم کرنے کے لیے، جی ہاں۔ رسید اسکین، کرنسی تبدیلی اور بغیر اشتہارات مفت ہیں، بغیر یومیہ حد کے۔ اگر آپ کو نیٹو ایپ، آف لائن استعمال، بار بار آنے والے اخراجات یا ایپ کے اندر ادائیگیاں چاہییں تو یہ Splitwise کرتا ہے اور Side Badger نہیں کرتا۔"
    - q: "Splitwise کی تفصیلات کہاں سے آتی ہیں؟"
      a: "Splitwise کے اپنے صفحات سے: اس کا ہوم پیج، اس کا Pro صفحہ اور اس کا ہیلپ سینٹر۔ جدول کی ہر قطار اس صفحے سے جڑی ہے جہاں سے وہ آئی، اور جدول کے اوپر کی تاریخ بتاتی ہے کہ ہم نے انہیں کب پڑھا۔ ہم انہیں ہر سہ ماہی دیکھتے ہیں۔"
    - q: "کیا Side Badger مفت رہے گا؟"
      a: "Side Badger میں آج سب کچھ مفت ہے، اور کوئی ادائیگی والا درجہ نہیں۔ اگر یہ کبھی بدلا تو ہم پہلے آپ کو اطلاع دیں گے۔ [قیمتوں کا صفحہ](page:pricing) میں تفصیل ہے۔"
    - q: "کیا میرے گروپ کے ہر شخص کو منتقل ہونا پڑے گا؟"
      a: "جی ہاں۔ گروپ میں ہر ایک کو مفت Side Badger اکاؤنٹ چاہیے، اور وہ لنک یا QR کوڈ سے شامل ہو سکتے ہیں۔"
    - q: "کیا Side Badger کی موبائل ایپ ہے؟"
      a: "ایپ اسٹور میں نہیں۔ یہ آپ کے براؤزر میں چلتا ہے: اپنے فون پر سائن ان کریں، پھر اسے ہوم اسکرین میں شامل کریں تاکہ یہ ایپ کی طرح کھلے۔ [یہ کیسے کام کرتا ہے](page:how-it-works) طریقہ دکھاتا ہے۔"
