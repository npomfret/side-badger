meta:
  title: "সঙ্গীর সঙ্গে বিল ভাগ করুন, 50/50 বা আয় অনুযায়ী | Side Badger"
  description: "একঘেয়ে খরচগুলো ভাগ করুন, ডেট নাইটকে ত্রৈমাসিক আর্থিক পর্যালোচনা না বানিয়ে। 50/50, আয় অনুযায়ী বা বিল ধরে ভাগ করুন, আর দেখুন কে কার কাছে ঋণী। বিনামূল্যে।"
h1: "দম্পতি হিসেবে খরচ ভাগ করুন, ন্যায্যভাবে"
navLabel: "দম্পতি"
lead: "একঘেয়ে খরচগুলো ভাগ করুন, ডেট নাইটকে ত্রৈমাসিক আর্থিক পর্যালোচনা না বানিয়ে। যে **দম্পতিরা** একটা বাড়ি, একটা সোফা আর ব্রডব্যান্ডের বিল কে দিয়েছিল তার একটা ঝাপসা স্মৃতি ভাগ করে নেয়, Side Badger তাদের জন্য ভাড়া, বিল আর বাজারের একটি চলমান হিসাব রাখে। 50/50, আয় অনুযায়ী বা বিল ধরে ভাগ করুন, আর দেখুন কে কার কাছে ঋণী।"
cta:
  heading: "দুজনের জন্য একটি গ্রুপ শুরু করুন"
  body: "অ্যাকাউন্ট খুলুন, একটি গ্রুপ বানান আর আপনার সঙ্গীকে আমন্ত্রণ লিঙ্ক পাঠান। আজ রাতের টেকঅ্যাওয়েই হতে পারে প্রথম খরচ।"
scenario:
  heading: "ন্যায্য মানে 50/50 হতেই হবে এমন নয়"
  body: "Sam আর Alex একটা বাড়ি ভাগ করে থাকে। Sam বেশি আয় করে, তাই তারা ঠিক করেছে ভাড়ার 60% নেবে Sam আর 40% Alex। Sam বাড়িওয়ালাকে দেয়, Alex বাজার করে, আর দুজনেই মোটামুটি নিশ্চিত যে সব সমান হয়ে যায়। “মোটামুটি নিশ্চিত” দিয়েই কারও ফোনের একটা নোট স্থায়ী মতভেদে পরিণত হয়। তাই আপনাদের দুজনের জন্য একটি গ্রুপ বানান, আপনার সঙ্গী আপনাকে যে নামে দেখবে সেটা বেছে নিন, আর তাকে আমন্ত্রণ লিঙ্ক বা QR কোড পাঠান। প্রতিটি খরচ হওয়ামাত্র যোগ করুন, বলুন কে দিয়েছে আর কীভাবে ভাগ হবে, আর হিসাব রাখাটা গ্রুপকে করতে দিন। প্রতিটি ছুটির জন্য আলাদা গ্রুপ বানান ([গ্রুপ ট্রিপ](page:use-case/group-trips) দেখুন), যাতে বিমানের টিকিট বাজারের খরচের মধ্যে না ঢোকে।"
sections:
  - heading: "50/50, আয় অনুযায়ী, বা বিল ধরে"
    body: "সবার কাছে ন্যায্য বলে কোনো ভাগ নেই, আছে শুধু সেটাই যাতে দুজনেই রাজি, আদর্শভাবে প্রথম বিলের আগে, প্রথম দীর্ঘশ্বাসের পরে নয়। সাধারণ তিনটি এই।"
    items:
      - "**50/50।** **সমান** বেছে নিন, আর দুজনের প্রত্যেকের অর্ধেক দেওয়ার থাকে। আপনাদের আয় কাছাকাছি হলে যৌথ খরচের জন্য এটি মানানসই, আর এতে কোনো অঙ্কই কষতে হয় না।"
      - "**আয় অনুযায়ী।** একজন বেশি আয় করলে, ঘরে আসা টাকায় প্রত্যেকের ভাগ অনুযায়ী ভাগ করুন। আগে ঠিক করুন কী ধরা হবে (হাতে পাওয়া বেতন একটি সাধারণ বাছাই), দুজনের আয় যোগ করুন আর আপনার আয়কে মোট দিয়ে ভাগ করুন। একজনের হাতে তিন ভাগ আর অন্যজনের দুই ভাগ এলে সেটা 3 ÷ (3 + 2) = 60%, তাই একজন 60% আর অন্যজন 40% দেয়। পূর্ণ শতাংশে রাউন্ড করুন আর **শতাংশ**-এর অধীনে লিখুন, যেখানে সেগুলোর যোগফল 100 হতে হবে। বেতন লেখার কোনো জায়গা নেই, তাই আপনি শুধু শতাংশগুলোই টাইপ করেন।"
      - "**বিল ধরে ধরে।** প্রতিটি খরচের নিজস্ব ভাগ আছে, তাই মেশাতে পারেন: ভাড়া আয় অনুযায়ী, বাজার 50/50, আর যৌথ উপহার **সঠিক পরিমাণ**-এ, যদি আপনারা প্রত্যেকে নিজে ঠিক করে থাকেন কত দেবেন।"
      - "**আয় বদলালে** পরের খরচ থেকে নতুন শতাংশ ব্যবহার করুন। আগের খরচগুলো যে ভাগে লেখা হয়েছিল সেই ভাগেই থাকে। আসল বেতনের স্লিপ দিয়ে অঙ্কগুলো কষা দেখতে পড়ুন [যে সঙ্গীর আয় বেশি তার সঙ্গে বিল কীভাবে ভাগ করবেন](page:guide/how-to-split-bills-with-a-partner-who-earns-more)।"
  - heading: "মাসিক হিসাব মেলানো"
    body: "মাসে একবার, বা সংখ্যাগুলো নিয়ে মনটা খচখচ করলেই, গ্রুপটি খুলে **ব্যালেন্স** দেখুন। আপনারা দুজন হলে প্রতিটি মুদ্রায় পেমেন্ট হয় সবসময় একটিই, যার দেওয়ার আছে তার কাছ থেকে যার পাওনা আছে তার কাছে। Sam আর Alex-এর মাসটা ধরুন। Sam £1,500 ভাড়া দিয়েছে, আর তার মধ্যে Alex-এর 40% হলো £600। Alex বাজারের জন্য £90 দিয়েছে, সমান ভাগে, তাই Sam-এর অর্ধেক £45। Side Badger একটাকে অন্যটার সঙ্গে কাটাকাটি করে, £600 থেকে £45 বাদ দিয়ে, আর Alex Sam-কে £555 দেয়। যেভাবে খুশি দিন, ব্যাংক ট্রান্সফারে, নগদে বা কোনো উপকারের বদলে, তারপর **সব শোধ করুন** থেকে রেকর্ড করুন যাতে ব্যালেন্স আবার শূন্যে ফেরে। পুনরাবৃত্ত বিল নেই, তাই গত মাসের ভাড়া কপি করুন, তারিখ বদলান আর এগিয়ে যান। Side Badger টাকা নাড়াচাড়া করে না বা রিমাইন্ডার পাঠায় না, তাই তাগাদাটা এখনও আপনার।"
  - heading: "শুধু আপনারা দুজন"
    body: "দুজনের গ্রুপে সদস্য দুজন, আর গ্রুপটি দেখতে পায় শুধু তার সদস্যরা। আপনার সঙ্গী যোগ দেয় আমন্ত্রণ লিঙ্ক বা QR কোড দিয়ে। একটি লিঙ্ক 15 মিনিট থেকে 5 দিন পর্যন্ত চলতে পারে, তাই এমন সবচেয়ে ছোটটি বেছে নিন যাতে আপনার সঙ্গী সেটি ব্যবহারের সময় পায়। নতুন লিঙ্ক বানালে পুরনোগুলো বাতিল হয় না, তাই সেগুলো এমন কোনো চ্যাটে ফেলে রাখবেন না যেখানে অন্য মানুষও আছে। যে-ই একটি চালু লিঙ্ক ব্যবহার করে সে-ই যোগ দিতে পারে, তাই নিশ্চিত হতে চাইলে অনুমোদন চালু করুন, তখন একজন অ্যাডমিন প্রত্যেককে ঢুকতে দেন। আপনার সঙ্গীর নিজের একটি অ্যাকাউন্ট লাগবে, যা বিনামূল্যে।"
exampleAfter: 2
