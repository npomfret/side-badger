meta:
  title: "قسّم التكاليف بـ 140 عملة، محوَّلة أو منفصلة"
  description: "أدخل كل مصروف بالعملة التي دفعت بها، وأبقِ الأرصدة منفصلة أو حوّلها بسعر تراه وتستطيع تغييره، ثم سوِّ الحسابات بقائمة قصيرة من الدفعات."
h1: "قسّم التكاليف بـ 140 عملة"
navLabel: "العملات المتعددة"
lead: "اليورو والين، وتلك سيارة الأجرة الواحدة بالبات. يأخذ Side Badger كل مصروف بالعملة التي دفعت بها، ويُبقي الأرصدة مرتبة، ويمكنه التحويل حين تفضّل مجموعتك التسوية مرة واحدة. يعمل بـ 140 عملة، وهو مناسب تماماً لـ[رحلات المجموعات](page:use-case/group-trips)."
cta:
  heading: "أحضِر يوروهاتك وأحضِر يناتك"
  body: "أنشئ حساباً، وابدأ مجموعة، وأضف أول مصروف بأي عملة صادف أن كانت في يدك."
  button: "أنشئ حساباً مجانياً"
problem:
  heading: "أدخله كما دفعته"
  body: "نادراً ما تُدفع الرحلة بعملة واحدة. حُجز الفندق من البيت بالجنيه الإسترليني، ودُفع العشاء بالين، وقهوة المطار بأي عملة استعملها مكان الترانزيت. أن تحوّل كل شيء بيدك قبل أن تتمكن حتى من إدخاله هو ما يجعل الناس يهجرون جداول البيانات. في Side Badger تدخل كل مصروف بالعملة المكتوبة على الإيصال، ويتبع كل مبلغ قواعد عملته، فلا كسور عشرية في الين وثلاث منازل في الدينار. وتأتي عملاتك المستخدمة مؤخراً أولاً في القائمة."
workflow:
  heading: "أبقِ العملات منفصلة، أو حوّل أولاً بأول"
  steps:
    - title: "أضف المصروف بعملته"
      body: "اختر العملة، واكتب المبلغ، وحدّد من دفع ومن شارك. لا شيء آخر مطلوب. هذا هو الوضع الافتراضي، وهو يحفظ المبلغ الأصلي تماماً كما أدخلته."
      shot: S07
      shotAlt: "نموذج المصروف مع مبلغ بالين"
    - title: "تابع رصيداً لكل عملة"
      body: "تُحفظ الأرصدة منفصلة لكل عملة، ولكل منها قائمتها القصيرة من الدفعات المقترحة. تُسوّى الجنيهات بالجنيهات والين بالين."
      shot: S10
      shotAlt: "شاشة الأرصدة مع ديون مبسّطة بعملتين"
    - title: "أو حوّل، حين تفضّل المجموعة التسوية مرة واحدة"
      body: "اختر عملة أخرى وأنت تدخل المصروف ويمكن لـ Side Badger تحويله بسعر صرف حالي، ويمكنك تغييره إلى السعر الذي حصلت عليه فعلاً. ينضم المبلغ المحوَّل إلى الرصيد بتلك العملة. والتحويل خيار تتخذه المجموعة، ولا يحدث أبداً من وراء ظهرك."
options:
  heading: "سعر تراه وتستطيع تغييره"
  items:
    - title: "السعر ظاهر"
      body: "حين تحوّل، يظهر السعر والمبلغ المحوَّل في النموذج، فلا يضطر أحد إلى تصديق رقم على الثقة."
    - title: "اكتب سعرك"
      body: "حصلت على سعر أفضل من مكتب صرافة، أو أسوأ من المطار؟ عدّل السعر إلى ما حصلت عليه فعلاً ويتحدّث المبلغ المحوَّل."
    - title: "الأصلي يبقى"
      body: "يبقى المبلغ الأصلي مع المصروف، بجانب المحوَّل، لمن يسأل كم كان بالين."
    - title: "التحويل مجاني"
      body: "التحويل لا يكلّف شيئاً. لا توجد رسوم على إدخال مصروف بعملة أخرى."
