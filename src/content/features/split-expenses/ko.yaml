meta:
  title: "지출을 똑같이, 정확한 금액으로, 비율로 나누기 | 사이드 배저"
  description: "공동 비용을 똑같이, 정확한 금액으로, 또는 비율로 나누고, 그 자리에 없던 사람은 빼세요. 무료이며 광고도 일일 한도도 없습니다."
h1: "지출을 똑같이, 정확한 금액으로, 비율로 나누기"
navLabel: "지출 나누기"
lead: "모든 게 반반은 아니잖아요. 사이드 배저는 그걸 감당합니다. 누가 결제했는지 말하고, 비용을 나눈 사람을 고른 다음, **똑같이, 정확한 금액으로, 또는 비율로** 나누세요. 앙금은 별도 판매입니다."
cta:
  heading: "다음 지출은 제대로 나눠 보세요"
  body: "무료 계정을 만들고, 그룹을 시작하고, 미뤄 왔던 지출을 추가하세요. 그다음이 궁금하다면 [사용 방법](page:how-it-works)을 보거나 [무료로 제공되는 것](page:pricing)을 확인하세요."
  button: "무료 계정 만들기"
problem:
  heading: "모든 게 반반은 아니에요"
  body: "월세는 방 크기를 따라가고, 선물은 누가 무엇을 약속했는지를 따라가고, 저녁 식사는 누가 디저트까지 남았는지를 따라갑니다. 계산서를 반으로 나누는 건 반반이 아닌 첫 계산서가 나올 때까지만 통하고, 그때부터 누군가 스프레드시트를 엽니다. 사이드 배저는 누가 결제했는지, 누가 비용을 나눴는지, 어떻게 나뉘는지를 기록하므로 아무도 식탁에서 긴 나눗셈을 하지 않아도 잔액이 맞게 나옵니다."
workflow:
  heading: "지출 추가, 처음부터 끝까지"
  steps:
    - title: "누가 무엇을 결제했는지 말하기"
      body: "금액, 짧은 설명, 결제한 사람을 입력하세요. 지출마다 결제자는 한 명이어서 계산이 정직하게 유지됩니다."
      shot: S05
      shotAlt: "시골집 월세를 세 사람이 비율로 나눈 지출 양식"
    - title: "분할 방식 고르기"
      body: "똑같이, 정확한 금액, 비율 중에서 고르세요. 비율은 합이 100이 되어야 하고, 정확한 금액은 합이 총액과 같아야 합니다."
      shot: S06
      shotAlt: "선물 지출에 사람마다 정확한 금액을 입력한 지출 양식"
    - title: "사연 덧붙이기"
      body: "날짜를 정하고, 라벨, 장소, 메모를 추가하세요. 그룹의 모든 사람이 같은 내용을 보고, 바로 그 자리에서 댓글도 달 수 있어요."
      shot: S08
      shotAlt: "세부 정보, 댓글 스레드, 입력했던 원래 금액이 표시된 지출"
    - title: "이상하면 질문 제기하기"
      body: "그룹에서 지출 질문 기능을 켰다면, 지출에 포함된 사람은 누구나 그 지출에 대해 질문할 수 있고, 지출 목록에서 질문이 제기된 것만 따로 볼 수도 있습니다."
      shot: S18
      shotAlt: "‘질문 제기됨’ 배지와 ‘질문된 것만’ 필터가 보이는 지출 목록"
options:
  heading: "나누는 세 가지 방법"
  items:
    - title: "똑같이"
      body: "저녁 식사, 택시, 모두가 고르게 나눈 모든 것의 기본값입니다. 총액이 딱 나누어떨어지지 않으면 남는 한 푼은 매번 같은 사람이 아니라 무작위로 한 사람에게 갑니다. 아래 택시에서는 Ana입니다."
    - title: "정확한 금액으로"
      body: "각자 낼 금액을 직접 입력하세요. 모두가 다른 가격을 고른 선물이나, 한 사람의 카트에 공용 장보기보다 더 많은 물건이 담긴 가게에 좋습니다. 금액의 합은 총액과 같아야 합니다."
    - title: "비율로"
      body: "총액에서 각자의 몫을 정하세요. 방 크기에 따른 월세가 대표적이에요. 가장 큰 방이 가장 큰 몫을 내고, 아무도 아닌 척하지 않습니다."
example:
  heading: "시골집 주말, 지출 네 건, 분할 방식 세 가지"
  currency: GBP
  people:
    - id: ana
      name: Ana
    - id: ben
      name: Ben
    - id: cara
      name: Cara
  expenses:
    - label: "방 크기에 따른 시골집 숙박비"
      payer: ana
      amount: 600
      split:
        method: percent
        shares:
          ana: 50
          ben: 30
          cara: 20
    - label: "저녁 식사"
      payer: ben
      amount: 84
      split:
        method: equal
    - label: "장보기"
      payer: cara
      amount: 64.5
      split:
        method: exact
        shares:
          ana: 25
          ben: 21.5
          cara: 18
    - label: "집으로 돌아오는 택시"
      payer: ana
      amount: 100
      split:
        method: equal
sections:
  - heading: "그 자리에 있던 사람만"
    body: "비용은 모두에게 나누거나, 비용을 함께한 사람에게만 나눌 수 있습니다. 참여하지 않은 비용에서는 사람을 빼면 잔액에도 그대로 반영돼요. 일주일 내내 집을 비운 룸메이트는 배달 음식 값을 내지 않으며, [룸메이트](page:use-case/housemates)라면 이를 기본적인 공정함으로 알아볼 거예요."
  - heading: "나중에 다툼을 줄여 주는 세부 사항"
    items:
      - "**날짜**와 선택 사항인 시간을 정하세요. 오늘, 어제, 오늘 아침, 어젯밤 같은 단축 입력으로 타이핑을 줄일 수 있어요."
      - "지출을 묶을 수 있는 **라벨**을 최대 세 개까지 추가하세요. 예를 들어 장보기나 여행이 있어요."
      - "**장소**를 추가하세요. 지도 링크를 붙여 넣으면 장소 이름이 저절로 채워집니다."
      - "숫자 뒤의 사연은 **메모**로 남기세요. 사연이 필요하다면 서식도 쓸 수 있어요."
      - "**댓글**로 대화를 아무도 거슬러 올라가 보지 않는 채팅 스레드가 아니라 해당 지출 옆에 두세요."
  - heading: "복사하고, 수정하고, 바뀐 점 확인하기"
    body: "지난달 월세를 다시 입력하는 대신 복사한 다음, 달라진 부분만 바꾸세요. 숫자가 틀렸다면 지출을 수정하면 됩니다. 이전 버전은 보관되고 수정 내용은 그룹의 활동에 표시되므로 아무도 몰래 숫자를 바꿀 수 없어요. 누가 무엇을 수정할 수 있는지는 그룹의 권한에 따라 달라집니다."
  - heading: "뭔가 이상해 보일 때"
    body: "그룹은 지출 질문 기능을 켤 수 있습니다. 지출에 포함된 사람은 누구나 이유와 함께 질문을 제기할 수 있고, 질문한 사람이나 관리자가 질문을 닫을 때까지 그 지출은 잔액에서 제외됩니다. 기본값은 꺼짐이며, 관리자가 그룹에 켤 수 있습니다. 아무도 기억하지 못하던 보증금이 갑자기 모두의 일이 되는 [행사와 기념 모임](page:use-case/events-and-celebrations)에 잘 맞습니다."
limits:
  heading: "한도"
  items:
    - "지출 하나에 결제자는 한 명입니다. 두 사람이 결제했다면 지출을 두 건 기록하세요."
    - "품목별 분할이나 지분별 분할은 없습니다. 똑같이, 정확한 금액, 비율이 제공되는 전부입니다."
    - "비율은 합이 100이 되어야 합니다."
    - "지출은 해당 통화로 최대 999,999.99까지 입력할 수 있으며, 소수점 자릿수는 그 통화의 일반 규칙을 따릅니다."
    - "지출은 저절로 반복되지 않습니다. 대신 지난달 지출을 복사하세요."
    - "날짜는 미래이거나 10년을 넘게 지난 날짜일 수 없습니다."
    - "그룹을 나간 사람이 포함된 지출은 읽기 전용이 됩니다."
useCasesHeading: "이런 분할이 도움이 되는 곳"
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "두 사람이 지출 하나를 결제할 수 있나요?"
      a: "한 건으로는 안 됩니다. 결제자마다 한 건씩 두 건을 기록하면 잔액은 똑같이 나옵니다."
    - q: "영수증을 품목별로 나눌 수 있나요?"
      a: "아니요. 분할은 똑같이, 정확한 금액으로, 또는 비율로 합니다. 품목이 다른 계산서라면 각자 낼 금액을 정확한 금액으로 입력하세요."
    - q: "기본 분할 방식을 정할 수 있나요?"
      a: "아니요. 이전 지출을 복사해서 분할 방식을 재사용하고, 달라진 부분만 바꾸세요."
    - q: "청구서가 매달 반복될 수 있나요?"
      a: "아니요. 대신 지난달 지출을 복사하세요. 몇 초면 됩니다."
    - q: "누가 지출을 수정할 수 있나요?"
      a: "그룹의 권한이 허용하는 사람입니다. 모든 수정은 그룹의 활동에 표시되므로 변경이 몰래 이뤄지는 일은 없습니다."
    - q: "그 뒤에 잔액은 어떻게 되나요?"
      a: "지출이 들어올 때마다 업데이트되고, [정산하기](page:feature/settle-up)가 이를 짧은 결제 목록으로 바꿔 줍니다. 지출이 다른 통화라면 [여러 통화](page:feature/multiple-currencies)를 참고하세요."
