meta:
  title: "খরচ সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করুন | Side Badger"
  description: "যৌথ খরচ সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করুন, আর যে ছিল না তাকে বাদ দিন। বিনামূল্যে, কোনো বিজ্ঞাপন ছাড়া আর দৈনিক কোনো সীমা ছাড়া।"
h1: "খরচ সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে ভাগ করুন"
navLabel: "খরচ ভাগ করা"
lead: "সবকিছু 50/50 হয় না। Side Badger সেটা সামলে নেয়। বলুন কে দিয়েছে, যারা খরচটা ভাগ করেছে তাদের বেছে নিন, আর সেটা **সমান ভাগে, নির্দিষ্ট পরিমাণে বা শতাংশে** ভাগ করুন। মনোমালিন্য আলাদা বিক্রি হয়।"
cta:
  heading: "পরের খরচটা ঠিকমতো ভাগ করুন"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর যে খরচটা মেটাবেন ভাবছিলেন সেটা যোগ করুন। এরপর কী হয় নিশ্চিত নন? দেখুন [কীভাবে কাজ করে](page:how-it-works), অথবা [বিনামূল্যে কী কী মেলে](page:pricing)।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
problem:
  heading: "সবকিছু 50/50 হয় না"
  body: "ভাড়া চলে ঘরের আকার ধরে। উপহার চলে কে কী কথা দিয়েছিল তা ধরে। ডিনার চলে মিষ্টি পর্যন্ত কে ছিল তা ধরে। বিল দুভাগ করা ততক্ষণই চলে যতক্ষণ না প্রথম এমন বিল আসে যা দুভাগ হয় না, আর তখন কেউ একজন স্প্রেডশিট খোলে। Side Badger রেকর্ড রাখে কে দিয়েছে, কে খরচটা ভাগ করেছে আর সেটা কীভাবে ভাগ হয়, যাতে ব্যালেন্স ঠিক আসে আর টেবিলে বসে কাউকে ভাগ অঙ্ক কষতে না হয়।"
workflow:
  heading: "খরচ যোগ করা, শুরু থেকে শেষ"
  steps:
    - title: "বলুন কে কীসের জন্য দিয়েছে"
      body: "পরিমাণ, একটি ছোট বিবরণ আর যে দিয়েছে তার নাম লিখুন। প্রতিটি খরচে একজনই দেয়, তাতে অঙ্কটা সৎ থাকে।"
      shot: S05
      shotAlt: "খরচের ফর্ম, তিনজনের মধ্যে একটি কটেজের ভাড়া শতাংশে ভাগ করা"
    - title: "ভাগের ধরন বেছে নিন"
      body: "সমান, নির্দিষ্ট পরিমাণ বা শতাংশ বেছে নিন। শতাংশের যোগফল 100 হতে হবে, আর নির্দিষ্ট পরিমাণের যোগফল মোটের সমান।"
      shot: S06
      shotAlt: "খরচের ফর্ম, একটি উপহারের জন্য প্রত্যেকের নির্দিষ্ট পরিমাণ লেখা"
    - title: "গল্পটাও যোগ করুন"
      body: "তারিখ দিন, লেবেল, জায়গা আর একটি নোট যোগ করুন। গ্রুপের সবাই একই বিবরণ দেখে, আর সেখানেই মন্তব্য করতে পারে।"
      shot: S08
      shotAlt: "একটি খরচ তার বিবরণ, মন্তব্যের সুতো আর যে মূল পরিমাণে এটি লেখা হয়েছিল সেটিসহ"
    - title: "কিছু গোলমেলে লাগলে প্রশ্ন তুলুন"
      body: "গ্রুপ যদি খরচ নিয়ে প্রশ্ন তোলা চালু করে থাকে, তাহলে খরচে অন্তর্ভুক্ত যে কেউ সেটা নিয়ে প্রশ্ন তুলতে পারে, আর খরচের তালিকায় শুধু প্রশ্ন তোলাগুলো দেখানো যায়।"
      shot: S18
      shotAlt: "খরচের তালিকা, প্রশ্ন তোলা ব্যাজ আর শুধু প্রশ্ন তোলাগুলোর ফিল্টারসহ"
options:
  heading: "ভাগ করার তিনটি উপায়"
  items:
    - title: "সমান ভাগে"
      body: "ডিনার, ট্যাক্সি আর সবাই সমান ভাগ করেছে এমন সবকিছুর ডিফল্ট। মোট পরিমাণ ঠিকমতো না ভাগ হলে বাড়তি পয়সাটা এলোমেলোভাবে একজনের ঘরে যায়, প্রতিবার একই জনের নয়। নিচের ট্যাক্সিতে সেটা Ana।"
    - title: "নির্দিষ্ট পরিমাণে"
      body: "প্রত্যেকের কত দেওয়ার তা লিখুন। উপহারের জন্য ভালো, যেখানে সবাই আলাদা দাম বেছেছে, বা সেই বাজারের জন্য, যেখানে একজনের ট্রলিতে যৌথ বাজারের চেয়ে বেশি ছিল। পরিমাণগুলোর যোগফল মোটের সমান হতে হবে।"
    - title: "শতাংশে"
      body: "প্রত্যেককে মোটের একটি অংশ দিন। ঘরের আকার অনুযায়ী ভাড়া এর সবচেয়ে পুরনো উদাহরণ, যেখানে সবচেয়ে বড় ঘর সবচেয়ে বড় ভাগ দেয় আর কেউ অন্যরকম ভান করে না।"
