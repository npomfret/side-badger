meta:
  title: "چطور برای یک هدیه گروهی پول جمع کنیم | Side Badger"
  description: "هرکس مبلغ متفاوتی می‌گذارد و کارت یک نفر ضربه‌اش را می‌خورد. نظرسنجی بودجه بگذارید، مبلغ‌های دقیق را وارد کنید و حساب را به Side Badger بسپارید."
h1: "چطور برای یک هدیه گروهی پول جمع کنیم"
navLabel: "جمع کردن پول برای هدیه"
lead: "جمع کردن پول برای هدیه گروهی یعنی یک نفر پول را از جیب خودش پیش می‌دهد و بقیه سهمشان را به او بدهکارند. با یک نظرسنجی روی بودجه توافق کنید، بگذارید خریدار هدیه را با کارتش بخرد، بعد آن را یک هزینه با [مبلغ‌های دقیق](page:feature/split-expenses) وارد کنید، یعنی یک عدد برای هر نفر. Side Badger نشان می‌دهد چه کسی چقدر به خریدار بدهکار است و هر کس سهمش را هر طور که دوست دارد می‌فرستد."
cta:
  heading: "کلاه را بچرخانید، بدون کلاه"
  body: "یک گروه بسازید، کسی را که هدیه می‌گیرد از آن بیرون بگذارید و هدیه را با مبلغ‌های دقیق وارد کنید. Side Badger رایگان است، بدون تبلیغات و بدون محدودیت روزانه. اول تور می‌خواهید؟ ببینید [چطور کار می‌کند](page:how-it-works) یا [نسخه رایگان چه چیزهایی را شامل می‌شود](page:pricing)."
sections:
  - heading: "چهار دوست، یک گرامافون، چهار مبلغ متفاوت"
    body: "بئا دارد 30 ساله می‌شود و یک گرامافون می‌خواهد. پریا، عمر، لنا و سام آن را برایش می‌خرند. پریا یکی را £240 پیدا می‌کند و با کارت خودش می‌خرد، چون یکی باید اول برود. این چهار نفر مساوی سهم نمی‌گذارند. پریا و عمر هرکدام £60 می‌گذارند، لنا £80 و سام £40. هیچ‌کس عددش را توضیح نمی‌دهد و هیچ‌کس هم نمی‌پرسد. عمر یک کارت تبریک و کاغذ کادو هم به مبلغ £12 می‌خرد. هر چهار نفر کارت را امضا می‌کنند، پس آن یکی مساوی تقسیم می‌شود."
  - heading: "پیش از اینکه کسی روی خرید بزند، بودجه را توافق کنید"
    body: "یک نظرسنجی بودجه جلوی بحث سر یک گرامافون £400 را می‌گیرد. در گروه **افزودن نظرسنجی** را انتخاب کنید و بپرسید هدیه چقدر باید خرج داشته باشد. گزینه‌ها را مبلغ بگذارید، مثلاً تا £150، تا £200 و تا £250. **رأی‌گیری ناشناس** را روشن کنید، که پنهان می‌کند چه کسی به چه چیزی رأی داده، تا کسی مجبور نباشد عدد کمتری را بلند بلند توجیه کند. تنظیمات پس از اولین رأی دیگر تغییر نمی‌کنند، پس پیش از آن بررسی‌شان کنید. نظرسنجی خودش بسته نمی‌شود. وقتی همه رأی دادند، **بستن نظرسنجی** را انتخاب کنید تا **برنده** نشان داده شود. نظرسنجی مبلغ کل را توافق می‌کند. سهم هیچ‌کس را تعیین نمی‌کند."
  - heading: "خواندن شمارش"
    body: "هدیه به £60، £60، £80 و £40 تقسیم می‌شود که جمعشان همان £240 روی رسید است. کارت و کاغذ کادو بین چهار نفر تقسیم می‌شود، هرکدام £3. صورت‌حساب پریا £60 + £3 است، یعنی £63، و او £240 پرداخت کرده، پس £177 طلبکار می‌ماند. صورت‌حساب عمر هم £63 است، اما او £12 پرداخت کرده، پس £51 بدهکار است. لنا £80 + £3 بدهکار است، یعنی £83، و سام £40 + £3، یعنی £43. این سه روی هم همان £177 پریا می‌شود. اگر به حال خودشان رها شوند، بدهی‌ها به پنج مسیر مختلف در گروه پخش می‌شوند. Side Badger به‌جایش سه پرداخت پیشنهاد می‌دهد، همه به پریا. [تسویه حساب](page:feature/settle-up) جزئیات را دارد."
  - heading: "در Side Badger واردش کنید"
    body: "سهم پریا حدود پنج دقیقه طول می‌کشد."
    items:
      - "**گروه را بسازید.** در داشبورد **ایجاد گروه** را انتخاب کنید. **دعوت دیگران** را انتخاب کنید و لینک یا کد QR را برای کسانی که سهم می‌گذارند بفرستید، و برای هیچ‌کس دیگر."
      - "**هدیه را اضافه کنید.** **افزودن هزینه** را انتخاب کنید، توضیحش بدهید، 240 را وارد کنید و زیر **چه کسی پرداخت کرد؟** پریا را انتخاب کنید. هر چهار نفر را زیر **تقسیم بین** نگه دارید، بعد زیر **نحوه تقسیم** گزینه **مبالغ دقیق** را انتخاب کنید و 60، 60، 80 و 40 را بنویسید. مبلغ‌ها باید روی هم 240 شوند. اگر خواستید تأییدیه سفارش را پیوست کنید. **ذخیره هزینه** را انتخاب کنید."
      - "**کارت را اضافه کنید.** عمر £12 را خودش اضافه می‌کند، زیر **چه کسی پرداخت کرد؟** خودش را انتخاب می‌کند و **نحوه تقسیم** را روی **به طور مساوی** می‌گذارد، با تیک هر چهار نفر."
      - "**بشمارید، بعد بپردازید.** همه **موجودی‌ها** را نگاه می‌کنند، که نشان می‌دهد چه کسی به چه کسی بدهکار است، و سهمشان را هر طور که دوست دارند برای پریا می‌فرستند. بعد با **تسویه حساب** و **ثبت تسویه حساب** ثبتش می‌کنند. تسویه سریع مبلغ را برایتان پر می‌کند."
  - heading: "اول بخرید، یا اول جمع کنید"
    body: "Side Badger پول جمع‌شده را نگه نمی‌دارد، پس «جمع کردن» در واقع یعنی شمردن. دو ترتیب جواب می‌دهد."
    items:
      - "**اول بخرید.** خریدار می‌پردازد، هزینه را با قیمت واقعی اضافه می‌کند و همه بلافاصله سهمشان را می‌بینند. مرتب‌تر است، اما خریدار تا وقتی بقیه پرداخت کنند هزینه را به دوش می‌کشد، پس خریداری را انتخاب کنید که از پسش برمی‌آید."
      - "**اول جمع کنید.** افراد پیش از خرید مبلغشان را برای خریدار می‌فرستند. وقتی قیمت را داشتید، هدیه را وارد کنید، بعد هر پرداخت را با تاریخی که پول واقعاً جابه‌جا شد ثبت کنید. هدیه را اول اضافه کنید، تا هر پرداخت مانده‌ای داشته باشد که رویش بنشیند."
      - "**قیمت تغییر می‌کند.** هزینه ارسال، یک کد تخفیف، افزایش قیمت در لحظه آخر. هدیه را ویرایش کنید و مبلغ‌های دقیق را طوری تغییر دهید که باز هم جمعشان درست شود. نسخه قبلی نگه داشته می‌شود، اما اول به گروه بگویید، چون مانده‌هایشان تغییر می‌کند."
  - heading: "بئا را بیرون نگه دارید"
    body: "فقط اعضای یک گروه آن را می‌بینند، پس بئا گروهی را که عضوش نیست نمی‌بیند. فقط کسانی را که سهم می‌گذارند دعوت کنید و هیچ‌کس دیگر را. لینک تا وقتی منقضی نشود کار می‌کند و می‌توانید هر مدتی از 15 دقیقه تا 5 روز انتخاب کنید، پس مدت کوتاهی بگذارید و لینک را جایی بفرستید که بئا نبیند. لینک به هر کسی که بازش کند پیش‌نمایشی از گروه نشان می‌دهد، پس اسم گروه را چیزی کسل‌کننده بگذارید، مثل «صندوق شنبه»، و اسم بئا را از عنوان هزینه‌ها و گزینه‌های نظرسنجی هم بیرون نگه دارید."
  - heading: "کارهایی که Side Badger اینجا نمی‌کند"
    items:
      - "پول را نگه نمی‌دارد و جمع نمی‌کند. سهم‌ها با انتقال بانکی، پول نقد یا هر چیزی که استفاده می‌کنید به خریدار می‌رسد، و بعد کسی آن‌ها را ثبت می‌کند."
      - "یادآور پرداخت نمی‌فرستد. سقلمه زدن به کسی که پرداخت نکرده هنوز کار آدم‌هاست."
      - "سهم هیچ‌کس را حساب نمی‌کند. نظرسنجی بودجه را توافق می‌کند و گزینه «باقی‌مانده را تقسیم کن» وجود ندارد، پس هر مبلغ را خودتان تایپ می‌کنید."
      - "هر هزینه یک پرداخت‌کننده دارد. اگر دو نفر بخش‌های مختلف هدیه را خریدند، دو هزینه وارد کنید."
      - "هر کس در تقسیم هست به یک حساب رایگان و جایی در گروه نیاز دارد."
