featuresHeading: "وہ خصوصیات جو یہ استعمال کرتا ہے"
faq:
  heading: "سوالات"
  items:
    - q: "کیا مہمان شامل ہوئے بغیر گروپ دیکھ سکتے ہیں؟"
      a: "نہیں۔ لوگ لنک یا QR کوڈ اور مفت اکاؤنٹ سے شامل ہوتے ہیں، اس لیے اندر آنے کے بعد وہ گروپ دیکھ سکتے ہیں۔"
    - q: "کیا Side Badger رقم جمع کر سکتا ہے؟"
      a: "نہیں۔ Side Badger حساب رکھتا ہے اور کبھی رقم نہیں منتقل کرتا۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر ادائیگی ریکارڈ کریں۔ یہ مفت ہے، بغیر اشتہارات اور بغیر یومیہ حد کے؛ [قیمتیں](page:pricing) دیکھیں۔"
    - q: "کیا ووٹ گمنام ہو سکتے ہیں؟"
      a: "جی ہاں۔ پول بناتے وقت آپ چھپا سکتے ہیں کہ کس نے کس کو ووٹ دیا۔ سیٹنگز صرف پہلے ووٹ سے پہلے بدلی جا سکتی ہیں۔"
    - q: "کیا لوگ مختلف رقوم ڈال سکتے ہیں؟"
      a: "جی ہاں۔ خرچہ عین رقم کے مطابق تقسیم کریں، تاکہ ہر شخص کا حصہ وہی عدد ہو جس پر آپ نے اتفاق کیا، یا جو شامل نہیں تھے انہیں نکال دیں۔"
    - q: "کیا منتظم کھاتے رکھ سکتا ہے؟"
      a: "جی ہاں۔ منظم گروپ پری سیٹ استعمال کریں، تاکہ صرف تخلیق کار اور ایڈمن اخراجات بدلیں اور ایڈمن نئے ارکان کو منظور کریں۔"
