featuresHeading: "Funkce, které dům využívá"
faq:
  heading: "Otázky"
  items:
    - q: "Může se nájem opakovat automaticky?"
      a: "Ne, opakované účty neexistují. Zkopírujte nájem z minulého měsíce několika klepnutími, změňte datum a máte hotovo."
    - q: "Můžeme dělit podle velikosti pokoje?"
      a: "Ano, procentuálně. Dejte každému spolubydlícímu podíl odpovídající jeho pokoji, pokud podíly dávají dohromady 100. O dalších způsobech dělení se dočtete v části [dělení výdajů](page:feature/split-expenses)."
    - q: "Co když se spolubydlící odstěhuje a dluží peníze?"
      a: "Nemůže skupinu opustit, dokud se nevyrovná, protože nikdo nemůže odejít, dokud dluží nebo se mu dluží peníze. Čísla zůstávají poctivá, dokud si nejsou všichni kvit."
    - q: "Platí Side Badger účty?"
      a: "Ne. Vede přehled a navrhuje krátký seznam plateb. Platíte si, jak chcete, a pak to zaznamenáte, jak vysvětluje [vyrovnání](page:feature/settle-up)."
    - q: "Může jeden spolubydlící vést účetnictví?"
      a: "Ano. Nastavte ho jako správce a použijte spravovanou skupinu, kde nové členy schvaluje správce a výdaje mohou měnit jen zakladatelé a správci."
