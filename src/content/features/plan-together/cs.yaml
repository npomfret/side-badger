meta:
  title: "Sdílené seznamy, hlasování a komentáře k výdajům | Side Badger"
  description: "Komentujte výdaje, zpochybněte ten divný, veďte společný nákupní seznam a hlasujte o vile. Plánujte útratu spolu, pak ji rozdělte. Zdarma, bez reklam."
h1: "Plánujte to spolu, rozdělte to potom"
navLabel: "Plánujte spolu"
lead: "Nákupní seznam a účet z nákupu spolu konečně mluví. Side Badger dává vaší skupině místo, kde probrat peníze před výdajem i po něm: komentáře ke každému výdaji, způsob, jak zpochybnit ty, které vypadají špatně, sdílené seznamy a hlasování pro velká rozhodnutí. Pak [výdaje rozdělíte](page:feature/split-expenses) jako obvykle."
cta:
  heading: "Naplánujte to, pak rozdělte"
  body: "Vytvořte si bezplatný účet, založte skupinu a dejte první seznam, hlasování nebo dotaz hned vedle peněz. Nevíte, co bude dál? Podívejte se, [jak to funguje](page:how-it-works)."
problem:
  heading: "Chat je tady, účet je tamhle"
  body: "Skupinové výdaje obvykle žijí na dvou místech. Čísla jsou v jednom a hádka o čísla v chatu, který se v úterý odroloval z dohledu. Nákupní seznam je fotka lednice. O vile rozhodl palec nahoru od většiny lidí, asi. Side Badger drží plánování ve skupině, vedle výdajů, kterých se týká, takže je tu komentář tam, kde je cena, seznam tam, kde je nákup, hlasování pro velké rozhodnutí a způsob, jak říct „počkat, je tohle správně?“, aniž byste psali odstavec. Všechno se točí kolem peněz skupiny, kvůli kterým skupina existuje."
workflow:
  heading: "Od hlasování o vile po účet z nákupu"
  steps:
    - title: "Nechte o velkém rozhodnutí hlasovat"
      body: "Přidejte hlasování o rozhodnutí, které určí účet, třeba o tom, která vila. Zvolte dvě až deset možností, řekněte, kolik hlasů má každý člověk, a jakmile odhlasují všichni, hlasování uzavřete a vítěz se označí."
      shot: S17
      shotAlt: "Uzavřené hlasování s označenou vítěznou možností a počtem hlasů u každé možnosti"
    - title: "Napište nákupní seznam společně"
      body: "Založte sdílený seznam, přidejte položky a odškrtávejte je, jak se dostanou do vozíku. Nákup pak přijde jako výdaj."
      shot: S16
      shotAlt: "Sdílený nákupní seznam s několika odškrtnutými položkami a počtem hotových"
    - title: "Mluvte o ceně tam, kde bydlí"
      body: "Okomentujte přímo výdaj, přiložte účtenku a zareagujte emoji. Konverzace zůstává vedle čísla, kterého se týká."
      shot: S08
      shotAlt: "Výdaj s podrobnostmi, náhledem účtenky, vláknem komentářů a reakcemi emoji"
    - title: "Zpochybněte ten, který vypadá divně"
      body: "Pokud skupina zapnula dotazy k výdajům, může kdokoli, koho se výdaj týká, zvolit **Mám dotaz**. Výdaj zůstává mimo zůstatky, dokud se dotaz nevyřeší."
      shot: S18
      shotAlt: "Seznam výdajů se štítkem Zpochybněno a filtrem Pouze zpochybněno"
    - title: "Podívejte se, co se změnilo a kdo to změnil"
      body: "Aktivita skupiny a zvonek oznámení ukazují, co je nového ve vašich skupinách. Push oznámení jsou k dispozici, pokud je chcete."
      shot: S19
      shotAlt: "Rozbalená nabídka oznámení se seznamem nedávné aktivity"
