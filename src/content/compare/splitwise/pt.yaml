meta:
  title: "Side Badger vs Splitwise: o que é grátis, comparado | Side Badger"
  description: "Uma alternativa grátis ao Splitwise, comparada com justiça. Ler recibos, converter moedas e dispensar anúncios é grátis aqui, e dizemos o que ele faz melhor."
h1: "Side Badger vs Splitwise: o que é grátis, comparado"
navLabel: "Side Badger vs Splitwise"
lead: "Provavelmente alguém no teu grupo já disse “usem o Splitwise”. Faz sentido. O Side Badger é uma app web grátis, com leitura de recibos, conversão de moedas e sem anúncios, e sem subscrição para os desbloquear. Qual serve melhor depende do que o teu grupo precisa, por isso aqui está a comparação, com o lado do Splitwise retirado só das páginas do próprio Splitwise."
cta:
  heading: "Experimenta na tua próxima conta partilhada"
  body: "Cria uma conta grátis, faz um grupo e adiciona uma despesa a sério. Se não for para ti, gastaste uns minutos, não uma subscrição."
asOf: 2026-10-21
asOfNote: "Lemos as páginas do próprio Splitwise em {date} para não teres de as ler, e tudo o que aqui se diz sobre o Splitwise vem delas. Cada linha da tabela liga à sua fonte. Os planos mudam, por isso voltamos a verificar todos os trimestres, e se as páginas do Splitwise discordarem desta, acredita nelas."
