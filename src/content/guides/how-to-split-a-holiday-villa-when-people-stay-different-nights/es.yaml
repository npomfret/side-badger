          ben: 1
          chloe: 1
    - label: "la compra"
      payer: dev
      amount: 180
      split:
        method: equal
faq:
  heading: "Preguntas sobre la villa"
  items:
    - q: "¿Y si alguien cancela?"
      a: "Quita sus noches, rehaz las cuentas y edita el gasto de la villa para que los importes exactos vuelvan a sumar el precio. La versión anterior se conserva y la edición aparece en la actividad del grupo, así que nadie cambia una cifra a escondidas. Quién puede editar depende de los permisos del grupo."
    - q: "¿Debería pagar menos quien hizo la reserva?"
      a: "Eso lo decide el grupo. Reservar es una tarea, y los grupos no se ponen de acuerdo sobre si merece un descuento. Sea lo que sea lo que acordéis, ponedlo en los importes exactos y escribidlo en una nota del gasto, o en un comentario junto a él, para que nadie tenga que acordarse del trato."
    - q: "¿Podemos dividir la tarifa de limpieza de otra manera?"
      a: "Sí. Introduce la tarifa como un gasto aparte y dale su propia división. Dividir a partes iguales sirve para una tarifa fija por toda la casa. Los importes exactos sirven para un grupo que quiere que la tarifa también siga las noches."
