faq:
  heading: "Galderak"
  items:
    - q: "Nork erregistratu behar du ordainketa bat, ordaintzen duenak ala ordaintzen zaionak?"
      a: "Ordainketa bat erregistratzeko gastuak editatzeko baimena behar da, eta formularioak **Nork ordaindu du?** eta **Nork jaso du ordainketa?** galdetzen ditu. Erregistratu duenak bakarrik edita dezake gero, beraz normalean errazena ordaintzen duenak egitea da, likidazio azkarreko botoia erabiliz."
    - q: "Eta bidaia bi monetatan egin bada?"
      a: "Saldoak moneta bakoitzeko gordetzen dira, beraz euro-zor bat euro-zor izaten jarraitzen du eta moneta bakoitzak bere ordainketa-zerrenda labur propioa du, gastuak sartzean bihurtu ez badira. [Hainbat monetatako bidaiak](page:guide/how-to-split-a-trip-paid-in-several-currencies) orriak bi moduak erakusten ditu."
    - q: "Bidaian zehar kitatu behar dugu ala amaieran?"
      a: "Biak balio dute. Erregistratutako ordainketa bakoitzak saldoak aldatzen ditu, beraz bidaiaren erdian egindako ordainketa bat azken zerrendan kontatzen da. Amaieran errazagoa da, [bidaia osoa](page:use-case/group-trips) toki bakarrean dagoelako."
