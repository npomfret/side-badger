featuresHeading: "Les fonctionnalités qu'un couple utilise"
faq:
  heading: Questions
  items:
    - q: "Peut-on fixer le 60/40 une fois pour tout ?"
      a: "Non. Le partage appartient à chaque dépense. Réglez les pourcentages sur la première, puis copiez-la la fois suivante et changez ce qui diffère. [Partager les dépenses](page:feature/split-expenses) présente les trois façons de partager."
    - q: "Est-il relié à notre banque ?"
      a: "Non. Side Badger ne touche jamais à votre argent. Vous vous remboursez comme vous voulez, puis vous l'enregistrez, comme l'explique [régler les comptes](page:feature/settle-up)."
    - q: "Quelqu'un d'autre peut-il voir notre groupe ?"
      a: "Seulement ses membres, et le groupe d'un couple en a deux. Toute personne qui utilise un lien d'invitation encore actif peut rejoindre, donc partagez-le avec une seule personne et donnez-lui une expiration courte."
    - q: "Et si nous avons chacun payé une partie de la même facture ?"
      a: "Une dépense n'a qu'une seule personne qui a payé. Saisissez deux dépenses, une pour chacun de vous, et le solde est le même."
    - q: "Rappellera-t-il à mon partenaire de payer ?"
      a: "Non. Il n'y a pas de rappels, donc relancer reste à votre charge. Au moins, vous regarderez tous les deux le même chiffre."
    - q: "Que se passe-t-il quand on arrête de partager les frais ?"
      a: "Réglez le solde et enregistrez le paiement, pour que plus personne ne doive rien. Ensuite, un admin peut verrouiller le groupe, ce qui garde les chiffres tels quels, ou le fermer pour de bon, ce qui le rend inaccessible à tous. Ne le fermez que si aucun de vous deux n'a besoin de l'historique."
