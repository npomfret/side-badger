featuresHeading: "De functies die een huis gebruikt"
faq:
  heading: "Vragen"
  items:
    - q: "Kan de huur zich automatisch herhalen?"
      a: "Nee, er zijn geen terugkerende rekeningen. Kopieer de huur van vorige maand in een paar tikken, wijzig de datum en je bent klaar."
    - q: "Kunnen we verdelen naar kamergrootte?"
      a: "Ja, op percentage. Geef elke huisgenoot een aandeel dat bij zijn of haar kamer past, zolang de aandelen samen 100 zijn. [Uitgaven verdelen](page:feature/split-expenses) behandelt de andere manieren om te verdelen."
    - q: "Wat als een huisgenoot uitverhuist met een openstaande schuld?"
      a: "Die kan de groep niet verlaten voor er is afgerekend, want niemand kan vertrekken zolang die geld schuldig is of tegoed heeft. De cijfers blijven eerlijk tot iedereen quitte staat."
    - q: "Betaalt Side Badger de rekeningen?"
      a: "Nee. Het houdt de rekening bij en stelt een korte lijst betalingen voor. Jullie betalen elkaar zoals jullie willen en registreren het dan, zoals [afrekenen](page:feature/settle-up) uitlegt."
    - q: "Kan één huisgenoot de boekhouding bijhouden?"
      a: "Ja. Maak die persoon beheerder en gebruik een beheerde groep, waar nieuwe leden goedkeuring nodig hebben en enkel makers en beheerders uitgaven kunnen wijzigen."
