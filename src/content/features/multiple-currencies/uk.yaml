sections:
  - heading: "Одна валюта для всієї групи"
    body: "Якщо групі краще про це не думати, оберіть валюту групи, і форма конвертуватиме в неї кожну нову витрату за курсом, який ви й надалі бачите та можете змінити. Це стосується лише нових і скопійованих витрат. Редагування та наявні витрати лишаються як є, тож нічого вже записаного не змінюється під вами."
  - heading: "Винні євро, платите у фунтах"
    body: "Сплачено в єнах, а розраховуєтеся у фунтах? Нічого страшного. Коли ви записуєте платіж, його теж можна конвертувати, тож той, хто винен євро, може заплатити у фунтах, а баланс у євро все одно зійдеться. Платіть одне одному як зручно, а потім запишіть."
  - heading: "Правила для групи"
    body: "Обмежте групу валютами, якими ви справді користуєтеся, і задайте типову, щоб форма відкривалася на правильній. Відпустці в Португалії не потрібні 139 інших варіантів поруч із рахунком за вечерю, а [весіллю за кордоном](page:use-case/events-and-celebrations), мабуть, потрібні дві."
limits:
  heading: "Обмеження"
  items:
    - "Курс фіксується, коли витрату збережено. Старі витрати ніколи не переоцінюються."
    - "Side Badger отримує актуальний курс, де може. Не для кожної пари його гарантовано, а курс завжди можна ввести самому."
    - "Автоконвертація в групі стосується лише нових і скопійованих витрат, а не редагувань чи наявних витрат."
    - "Кожна витрата обмежена 999 999,99 у власній валюті."
    - "Є 140 валют. Криптовалют і металів серед них немає."
    - "Side Badger записує платежі. Він ніколи не переказує й не обмінює гроші."
useCasesHeading: "Де це допомагає"
faq:
  heading: "Запитання"
  items:
    - q: "Який курс обміну ви використовуєте?"
      a: "Актуальний курс обміну, отриманий під час введення витрати, де він доступний. Його можна змінити на той, що діяв під час обміну, і конвертована сума оновиться."
    - q: "Чи переоцінюються старі витрати?"
      a: "Ні. Курс фіксується, коли витрату збережено, тож баланс не дрейфує через те, що зрушився ринок."
    - q: "Чи підтримуєте ви криптовалюту?"
      a: "Ні. Є 140 валют, і криптовалют серед них немає."
    - q: "Чому я не можу ввести 2 000 000 індонезійських рупій?"
      a: "Кожна витрата обмежена 999 999,99 у власній валюті. Введіть її в іншій валюті й конвертуйте або розділіть на дві витрати."
    - q: "Чи коштує конвертація щось?"
      a: "Ні. Конвертація безкоштовна, як і решта Side Badger. Див. [ціни](page:pricing)."
    - q: "Чи треба конвертувати?"
      a: "Ні. Валюти лишаються окремо, доки ви чи ваша група не вирішите конвертувати, а кожна валюта має свій короткий список платежів."
