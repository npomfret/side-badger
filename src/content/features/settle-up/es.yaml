sections:
  - heading: Registrar un pago
    body: Cuando alguien paga, regístralo contra la persona correcta. Los botones de liquidación rápida rellenan el importe a partir de tus pagos sugeridos, y puedes añadir una nota como «transferencia bancaria» (hasta 500 caracteres). Si pagas solo una parte de lo que debes, el resto se queda en el saldo. Si introduces de menos o de más, Side Badger te avisa antes de guardar. Registrar un pago requiere permiso para editar gastos, y la fecha no puede ser futura.
  - heading: ¿Pagaste en otra moneda?
    body: Los saldos se quedan en la moneda en la que se pagaron, así que una deuda en euros sigue siendo una deuda en euros. ¿Debes euros y pagas en libras? Convierte el pago al introducirlo, con un tipo de cambio actual o con el tipo que te aplicaron de verdad. El tipo queda fijado al guardar el pago. [Varias monedas](page:feature/multiple-currencies) explica cómo funciona la conversión, y [viajes en grupo](page:use-case/group-trips) la muestra en uso.
  - heading: Un historial que puedes consultar
    body: Cada pago registrado se queda en el historial del grupo con su fecha, importe y nota. Solo quien registró un pago puede editarlo, y esa persona o un administrador del grupo pueden borrarlo. Un pago en el que participa alguien que ha salido del grupo queda bloqueado. Para un escenario completo de compañeros de piso, consulta [compañeros de piso](page:use-case/housemates).
limits:
  heading: Lo que Side Badger no hace
  items:
    - Side Badger no mueve dinero, no envía enlaces de pago ni solicitudes de pago. Un pago en la app es el registro de un pago hecho en otro sitio.
    - Los pagos sugeridos salen de un método sencillo de emparejamiento, aplicado por moneda. Siempre sugiere menos pagos que personas con saldo en esa moneda (cuatro personas, tres pagos como máximo), pero no siempre encuentra el menor número posible.
    - No puedes desactivar las sugerencias. **Mostrar todo** enseña todos los pagos sugeridos del grupo, no solo los tuyos.
    - Las monedas nunca se compensan entre sí salvo que los gastos se convirtieran al introducirlos.
    - No hay recordatorios, así que reclamar un pago sigue siendo cosa tuya.
useCasesHeading: Dónde importa saldar cuentas
faq:
  heading: Preguntas
  items:
    - q: ¿Envía Side Badger el dinero?
      a: No. Pagaos como queráis y después registra el pago en Side Badger para que el saldo se actualice.
    - q: ¿Puedo desactivar los pagos sugeridos?
      a: No. La simplificación se queda activada, y **Mostrar todo** enseña todos los pagos sugeridos del grupo, no solo los que te afectan.
    - q: ¿Por qué se llevan por separado los euros y las libras?
      a: Los saldos se quedan en la moneda en la que pagaste salvo que conviertas al introducir un gasto o un pago. Las deudas en monedas distintas nunca se compensan entre sí.
    - q: ¿Y si alguien paga solo una parte de lo que debe?
      a: Registra la parte que pagó. El resto se queda en el saldo hasta que se pague.
    - q: ¿Es siempre el menor número posible de pagos?
      a: No está garantizado. Siempre sugiere menos pagos que personas con saldo en esa moneda, así que para cuatro personas nunca sugiere más de tres. En el ejemplo de compañeros de piso, son dos pagos, cuando devolver el dinero a cada persona directamente llevaba seis.
