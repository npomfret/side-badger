sections:
  - heading: "Razgovor o novcu, uz novac"
    body: "Uz zajednički novac idu čavrljanje, sumnje i planovi. Side Badger drži sve troje uz brojke, pa nitko ne mora listati unatrag kroz grupni chat."
    items:
      - "**Komentari na pravom mjestu.** Komentiraj samu grupu ili bilo koji trošak, popis ili anketu i drži razgovor uz ono o čemu je riječ."
      - "**Računi i fotografije.** Čuvaj do tri računa uz svaki trošak, a komentarima na grupu, popis ili anketu dodaj fotografije ili PDF-ove."
      - "**Pitanja, ne svađe.** Administrator može uključiti pitanja, a onda se svatko tko je u trošku može o njemu raspitati. Trošak ostaje izvan stanja dok se ne razjasni."
      - "**Popisi i ankete.** Drži zajednički popis za kupnju uz troškove kupnje i pusti uži izbor vila na glasanje, anonimno ako želiš."
      - "**Mali pljesak.** Reagiraj na troškove, uplate i komentare i proslavi uplatu kad stigne."
  - heading: "Tvoja grupa, tvoja pravila"
    body: "Splitwiseov centar za pomoć kaže da ne podržava administratore grupe ni posebna dopuštenja. Side Badger ima uloge i dopuštenja, za grupe kojima treba netko tko će držati brojke u redu."
    items:
      - "**Administratori, članovi i promatrači.** Neka netko bude promatrač: vidi sve i ne mijenja ništa."
      - "**Dva predloška ili vlastiti.** Kreni od Otvorene suradnje ili Upravljane grupe ili sam postavi svako dopuštenje: tko uređuje i briše troškove, uređuje popise, poziva i pušta nove ljude unutra."
      - "**Odobrenje za pridruživanje.** Uključi odobrenje i administrator pušta svaku osobu unutra."
      - "**Vlastite postavke grupe.** Ograniči je na valute koje stvarno koristiš, odaberi njezinu zadanu valutu i daj joj sliku zaglavlja."
      - "**Zaključaj kad je gotovo.** Brojke ostaju kakve jesu dok ih administrator ne otključa."
  - heading: "Ovdje besplatno, tamo plaćeno"
    body: "Splitwise Pro je Splitwiseov plaćeni plan, a njegova vlastita stranica Pro prodaje tri stvari koje u Side Badgeru ne koštaju ništa."
    items:
      - "**Skeniranje računa.** Splitwise Pro skenira fotografiju tvog računa. Side Badger to radi besplatno, bez kredita za skeniranje: popunjava ukupni iznos, datum i mjesto da ih provjeriš."
      - "**Pretvorba valuta.** Splitwise Pro pretvara troškove grupe u tvoju zadanu valutu kad dodirneš Convert. Side Badger pretvara svaki trošak dok ga unosiš, po aktualnom tečaju ili po stvarno ostvarenom tečaju, a izvorni iznos ostaje uz trošak."
      - "**Bez dnevnih ograničenja.** Splitwise Pro prodaje neograničen broj troškova, a njegov centar za pomoć kaže da besplatni korisnici mogu dodati do 4 troška dnevno. Side Badger nema dnevnih ograničenja."
  - heading: "Tvoja banka ostaje po strani"
    body: "Side Badger se ne povezuje s tvojom bankom i ne traži podatke o tvojoj banci. Vodi evidenciju tko kome duguje; vi se isplaćujete kako god želite, a zatim zabilježite uplatu. Nema bankovne prijave koju bi trebalo prepustiti, pa je jedna stvar manje za čuvati."
  - heading: "Jedna aplikacija, u pregledniku i na telefonu"
    body: "Side Badger radi u pregledniku. Prijavi se, dodaj ga na početni zaslon i otvara se kao aplikacija. Na oba mjesta to je ista aplikacija, pa je nova značajka na tvom telefonu čim sljedeći put otvoriš aplikaciju, bez ažuriranja iz trgovine aplikacija koje bi trebalo čekati."
  - heading: "A tu su i trikovi za zabavu"
    items:
      - "**Pitaj svog asistenta.** Side Badger radi s ChatGPT-jem i Claudeom: zamoli svog asistenta da doda trošak, skenira račun ili zabilježi uplatu."
      - "**Svatko na svom jeziku.** Side Badger govori 39 jezika i svatko bira svoj. Splitwiseova početna stranica navodi 7+. Podržava i 133 valute, za putovanje koje ide posvuda."
      - "**Pomoć bez izlaska iz aplikacije.** Zapeo si ili naišao na grešku? Javi nam iz aplikacije i ondje odmah pročitaj naš odgovor."
  - heading: "Gdje Splitwise i dalje pobjeđuje"
    body: "Radije bismo da odabereš pravu aplikaciju nego da to otkriješ poslije. Ako tvojoj grupi treba nešto od ovoga, Splitwise to ima, a Side Badger nema."
    items:
      - "**Aplikacije iz trgovina aplikacija.** Side Badger živi u pregledniku i na početnom zaslonu, a ne u trgovinama aplikacija."
      - "**Rad izvan mreže.** Side Badgeru treba veza."
      - "**Plaćanje u aplikaciji.** U nekim zemljama Splitwise može prenijeti i sam novac. Side Badger samo vodi evidenciju."
      - "**Podjela po udjelima ili po stavkama.** Side Badger ima jednog platitelja po trošku, a trošak se dijeli jednako, po točnim iznosima ili po postocima. Njegovo skeniranje računa ne dodjeljuje stavke osobama."
      - "**Grafikoni i zadane podjele.** Splitwise Pro ima oboje. Side Badger vodi evidenciju tko kome duguje, i to je cijeli trik."
  - heading: "Prelazak tvoje grupe"
    body: "Nema uvoznika, pa selidba znači novi početak. Najprije se poravnajte u Splitwiseu, zatim napravi grupu u Side Badgeru i pozovi sve poveznicom ili QR kodom. Svatko u grupi treba besplatan korisnički račun, a za registraciju je dovoljna e-adresa."
