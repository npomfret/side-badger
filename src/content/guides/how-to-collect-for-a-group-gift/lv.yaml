faq:
  heading: "Jautājumi"
  items:
    - q: "Ko darīt, ja savācam vairāk, nekā dāvana maksā?"
      a: "Precīzām summām kopā jādod cena, tāpēc samaziniet daļas, līdz tā sanāk. Vai arī iztērējiet lieko uz kaut ko īstu, piemēram, ziediem, un ievadiet to kā otru izdevumu, tāpat kā kartiņu un iesaiņojumu piemērā."
    - q: "Vai kāds var ieguldīt, nepievienojoties grupai?"
      a: "Ne tad, ja vēlaties, lai viņš tiktu ieskaitīts. Ikvienam sadalē vajadzīgs bezmaksas konts un vieta grupā. Cilvēkam, kam ir tikai skaidra nauda, Priya var naudu paņemt un ievadīt dāvanu par summu, ko grupa vēl ir parādā. Piemēram, ja Sam viņai skaidrā naudā iedeva 40 £, viņa ievadītu 200 £ un sadalītu to tā: Priya 60 £, Omar 60 £ un Lena 80 £."
    - q: "Vai aptauja var izlemt, cik katrs ieliek?"
      a: "Nē. Aptauja vienojas par skaitli visai grupai, piemēram, budžetu. Katra daļa jums jāsaskaņo savā starpā, tad jāieraksta izdevumā kā **Precīzas summas**."
