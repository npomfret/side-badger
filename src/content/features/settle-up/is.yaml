meta:
  title: "Gerðu upp með færri greiðslum | Side Badger"
  description: "Sjáðu hver skuldar hverjum í hópnum þínum, fáðu stuttan lista yfir greiðslur sem gerir upp við alla og skráðu hverja greiðslu um leið og hún á sér stað. Ókeypis."
h1: "Gerðu upp með færri greiðslum"
navLabel: "Uppgjör"
lead: "Side Badger heldur utan um stöðu allra í hópnum og leggur til stuttan lista yfir greiðslur sem gerir upp. Þið borgið hvert öðru eins og ykkur hentar og skráið það svo. Ef þú vilt sjá fyrst hvernig tölurnar skiptast skaltu byrja á [skiptingu útgjalda](page:feature/split-expenses)."
cta:
  heading: "Tilbúin að leysa úr flækjunni um hver skuldar hverjum?"
  body: "Stofnaðu aðgang, byrjaðu hóp og bættu við fyrsta útgjaldinu. Staðan sér um restina."
  button: "Stofna ókeypis aðgang"
problem:
  heading: "Staða sem uppfærist jafnóðum"
  body: "Hvert útgjald breytir því hver skuldar hverjum, svo Side Badger heldur stöðunni nýrri eftir því sem útgjöldum og greiðslum er bætt við. Allir í hópnum sjá breytingu strax, og sjá hvað breyttist og hver breytti því. Staðan er haldin fyrir hvern gjaldmiðil, svo evrur og pund haldast í sínum dálkum nema útgjald hafi verið umreiknað þegar það var skráð. Sjálfgefið sérðu skuldirnar sem tengjast þér; **Sýna allt** birtir allan hópinn."
workflow:
  heading: "Þrjú skref að því að verða kvitt"
  steps:
    - title: "Sjáðu hver skuldar hverjum"
      body: "Opnaðu stöðu hópsins til að sjá hvað þú skuldar, hvað þú átt inni og stuttan lista yfir greiðslur sem gerir upp við alla, reiknaðan fyrir hvern gjaldmiðil. Útgjöld sem eru dregin í efa eru utan útreikninganna þar til úr þeim er leyst. Í dæminu um meðleigjendur hér að neðan verða sex greiðslur að tveimur."
      shot: S10
      shotAlt: "Stöðuskjár með einfölduðum skuldum í tveimur gjaldmiðlum og kveikt á Sýna allt"
    - title: "Borgaðu eins og þér hentar, skráðu það svo"
      body: "Millifærsla, reiðufé, greiði sem þú skuldar frá síðasta fríi. Side Badger flytur ekki peningana. Þegar þeir hafa skipt um hendur skaltu skrá greiðsluna og staðan uppfærist hjá öllum."
      shot: S11
      shotAlt: "Greiðslueyðublað með hnöppum fyrir fljótlegt uppgjör og tilkynningunni sem birtist við hlutagreiðslu"
    - title: "Athugaðu að hún hafi skilað sér"
      body: "Greiðslan fer í sögu hópsins þar sem allir í hópnum geta séð hana og brugðist við með emoji. Fagnaðu greiðslu þegar hún skilar sér."
      shot: S12
      shotAlt: "Greiðslusagan með emoji-viðbrögðum við greiðslu"
