meta:
  title: "Side Badger vs Splitwise: hele gruppen, ikke bare regnestykkene | Side Badger"
  description: "Et gratis Splitwise-alternativ for hele gruppen: kommentarer, spørsmål, lister, avstemninger og ordentlige roller, pluss gratis kvitteringsskanning og valutakonvertering."
h1: "Side Badger vs Splitwise: hele gruppen, ikke bare regnestykkene"
navLabel: Side Badger vs Splitwise
lead: "Noen i gruppen din har sikkert sagt «bare bruk Splitwise». Greit nok: den er god på regnestykkene. Side Badger gjør regnestykkene også, og gir så gruppen et sted å snakke dem gjennom: kommentarer, spørsmål, lister, avstemninger og ordentlige grupperoller. Kvitteringsskanning og valutakonvertering er gratis."
cta:
  heading: Prøv det på neste felles regning
  body: "Opprett en gratis konto, lag en gruppe og legg til én ekte utgift. Hvis det ikke er noe for deg, har du brukt noen minutter, ikke et abonnement."
asOf: 2026-11-22
asOfNote: "Vi leste Splitwises egne sider {date} så du slipper det, og alt her om Splitwise kommer fra dem. Hver rad i tabellen lenker til kilden sin. Planer endres, så vi sjekker på nytt hvert kvartal, og hvis Splitwises sider er uenige med denne, tro dem."
