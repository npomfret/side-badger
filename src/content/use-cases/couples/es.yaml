featuresHeading: Las funciones que usa una pareja
faq:
  heading: Preguntas
  items:
    - q: ¿Podemos fijar 60/40 una vez para todo?
      a: No. La división pertenece a cada gasto. Fija los porcentajes en el primero, y la próxima vez cópialo y cambia lo que sea distinto. [Dividir gastos](page:feature/split-expenses) explica las tres formas de dividir.
    - q: ¿Se conecta con nuestro banco?
      a: No. Side Badger nunca toca el dinero. Cada uno paga al otro como quiera y después lo registras, como explica [saldar cuentas](page:feature/settle-up).
    - q: ¿Puede ver alguien más nuestro grupo?
      a: Solo sus miembros, y el grupo de una pareja tiene dos. Cualquiera que use un enlace de invitación vigente puede unirse, así que compártelo con una sola persona y ponle una caducidad corta.
    - q: ¿Y si cada uno pagó una parte de la misma factura?
      a: Un gasto tiene un solo pagador. Registra dos gastos, uno por cada uno, y el saldo sale igual.
    - q: ¿Le recordará a mi pareja que pague?
      a: No. No hay recordatorios, así que avisar sigue siendo cosa tuya. Al menos los dos estaréis mirando el mismo número.
    - q: ¿Qué pasa cuando dejamos de compartir gastos?
      a: Liquida el saldo y registra el pago, para que nadie deba nada. Después un administrador puede bloquear el grupo, que deja los números como están, o cerrarlo para siempre, lo que lo deja inaccesible para todos. Ciérralo solo cuando ninguno de los dos necesite el historial.
