meta:
  title: "Näin jaat laskut, kun kumppani ansaitsee enemmän | Side Badger"
  description: "50/50 käy kiusalliseksi, kun toinen ansaitsee selvästi enemmän. Jaa yhteiset laskut tulojen mukaan, laskuesimerkki kahdelle ja ilman taulukkoa."
h1: "Näin jaat laskut, kun kumppanisi ansaitsee enemmän"
navLabel: "Kumppani ansaitsee enemmän"
lead: "Laske nettopalkkanne yhteen, selvitä kummankin osuus summasta ja pyöristä kokonaisiin prosentteihin. Mayalle jää käteen 2 800 £ ja Jonille 1 700 £, joten he jakavat yhteiset laskut 62/38. Syötä prosentit yhteiseen kuluun Side Badgerissa ja kopioi kulu aina, kun sama lasku tulee uudelleen."
cta:
  heading: "Laske kerran"
  body: "Luo ilmainen tili, perusta ryhmä kahdestaan ja syötä vuokra prosenteillanne. Ensi kuun vuokra on pelkkä kopio. Haluatko ensin esittelykierroksen? Katso [näin se toimii](page:how-it-works) tai [mitä ilmaiseen kuuluu](page:pricing)."
sections:
  - heading: "Kaksi palkkaa, yksi asunto, yksi kohtelias hiljaisuus"
    body: "Maya ja Jon asuvat yhdessä. Mayalle jää käteen 2 800 £ kuussa ja Jonille 1 700 £. Kaksi vuotta he jakoivat kaiken 50/50, koska se oli yksinkertaista eikä kumpikaan halunnut ottaa asiaa puheeksi. Sitten Jon katsoi pelkkää vuokraa. Vuokra on 1 400 £, ja sen puolikas on 700 £, mikä on neljännes Mayan nettopalkasta ja 41 % Jonin palkasta. Kukaan ei ollut toiminut epäreilusti. Kukaan ei vain ollut laskenut. Moni [pariskunta](page:use-case/couples) päätyy tähän lopulta. Noutoruoan äärellä he sopivat, että yhteisten laskujen pitäisi viedä kummankin palkasta suunnilleen yhtä suuri pala."
  - heading: "Menetelmä ja laskut näkyvissä"
    body: "Neljä vaihetta, yksi laskin ja keskustelu, joka piti joka tapauksessa käydä."
    items:
      - "**Sopikaa, mikä lasketaan palkaksi.** Maya ja Jon käyttävät nettopalkkaa, eli rahaa, joka tulee pankkitilille joka kuukausi. Yhteensä se on 2 800 £ + 1 700 £ = 4 500 £."
      - "**Laske kummankin osuus.** Mayan osuus on 2 800 ÷ 4 500, eli 62,2 %. Jonin osuus on 1 700 ÷ 4 500, eli 37,8 %."
      - "**Pyöristä kokonaisiin prosentteihin.** 62,2 %:sta tulee 62 ja 37,8 %:sta 38. Kahden ihmisen kesken pyöristä toinen luku ja vähennä se sadasta, niin saat toisen. Yhteensä ne ovat aina 100."
      - "**Tarkista, mitä se tarkoittaa.** Kun vuokra on 1 400 £, Maya maksaa 868 £ (62 %) ja Jon 532 £ (38 %). Se on noin 31 % kummankin nettopalkasta. Puolet kummallekin olisi vienyt 25 % Mayan ja 41 % Jonin palkasta."
  - heading: "Kuukausi luettuna"
    body: "Maya maksoi vuokran, 1 400 £, ja Jon maksoi loput, 216 £. Mayan osuus kuukaudesta on 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, ja hän maksoi 1 400 £, joten hänen saatavansa on 402,40 £. Jonin osuus on 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, ja hän maksoi 216 £, joten hän on velkaa 402,40 £. Side Badger ehdottaa yhtä maksua, Jonilta Mayalle, 402,40 £, ja [tilien tasauksessa](page:feature/settle-up) se kirjataan sen jälkeen, kun maksu on tehty. Jaettuna 50/50 sama kuukausi olisi tarkoittanut, että Jon maksaa Mayalle 592,00 £."
  - heading: "Näin se tehdään Side Badgerissa"
    body: "Kymmenen minuuttia, joista suurin osa kuluu prosentteihin."
    items:
      - "**Perusta ryhmä.** Valitse kojelaudalla **Luo ryhmä** ja anna sille asunnon nimi. Valitse **Kutsu muita** ja lähetä Jonille linkki tai QR-koodi. Hän kirjautuu sisään tai luo ilmaisen tilin ja valitsee nimen, jolla haluaa näkyä tässä ryhmässä. Ryhmän näkevät vain jäsenet, joten tämä on vain teidän kahden."
      - "**Lisää vuokra.** Valitse **Lisää kulu**. Syötä kuvaus ja summa ja valitse kohdasta **Kuka maksoi?** Maya. Pidä molemmat mukana kohdassa **Jaa seuraavien kesken**, valitse sitten kohdasta **Miten jaetaan** vaihtoehto **Prosentteina** ja kirjoita 62 ja 38. Lomake huomauttaa, jos prosenttien summa ei ole 100. Valitse **Tallenna kulu**."
      - "**Lisää muut laskut.** Sähkö ja internet lisätään samalla tavalla, maksajana Jon ja samat 62 ja 38. Noutoruoka on oma kulunsa, ja kohtaan **Miten jaetaan** jää **Tasan**."
      - "**Kopioi se ensi kuussa.** Avaa viime kuun vuokra ja valitse **Kopioi kulu**. Kopio säilyttää maksajan, summan ja jaon, ja siihen tulee tämän päivän päivämäärä. Muuta summaa, jos vuokra muuttui, ja valitse sitten **Luo kopio**. Sähkölasku toimii samoin."
      - "**Katso, kuka on velkaa kenelle.** Sen näyttää **Saldot**-osio, joka ehdottaa myös lyhyttä maksulistaa. Maksakaa toisillenne miten haluatte ja kirjatkaa maksu kohdassa **Maksa velat**."
  - heading: "50/50, tulojen mukaan vai lasku kerrallaan"
    body: "Oikeaa vastausta ei ole, on vain se, jonka kanssa kumpikin voi elää. Kolme yleistä vaihtoehtoa."
    items:
      - "**Puolet kummallekin kaikesta.** Helpoin pitää yllä, ja sopii pareille, joiden palkat ovat lähellä toisiaan."
      - "**Tulojen mukaan kaikesta yhteisestä.** Näin Maya ja Jon tekevät. Yksi keskustelu, yksi prosenttipari."
      - "**Lasku kerrallaan.** Vuokra ja laskut tulojen mukaan, lomat ja herkut 50/50 tai miten ikinä sovitte, ja jokainen lasku saa sen säännön, joka sille sopii."
  - heading: "Sopikaa, mikä lasketaan yhteiseksi"
    body: "Riidat koskevat yleensä listaa, eivät prosentteja. Vuokra, sähkö, internet, viikoittaiset ruokaostokset ja sohva lasketaan yhteisiksi useimmissa kodeissa. Mayan kuntosalijäsenyys ja Jonin jalkapallotilaus eivät ehkä ole. Sopikaa lista kerran, kirjoittakaa se ylös ja laittakaa ryhmään vain yhteiset kulut."
  - heading: "Noutoruoka jaetaan tarkoituksella 50/50"
    body: "Herkut ovat pieniä ja vapaaehtoisia, eikä kenenkään pitäisi tarvita laskinta dumplingien tilaamiseen. Side Badgerissa noutoruoka on vain yksi kulu. Jon maksaa 36 £, kohtaan **Miten jaetaan** jää **Tasan** ja kumpikin on velkaa 18 £."
  - heading: "Kun jonkun palkka muuttuu"
    body: "Palkankorotus, uusi työ tai työstä pois jääminen muuttaa laskelmaa. Laske uudet prosentit samalla tavalla ja käytä niitä seuraavasta kulusta alkaen. Aiemmat kulut pysyvät ennallaan. Kopioi viime kuun vuokra, muuta prosentit ja valitse sitten **Luo kopio**. Jos haluat korjata jo syötetyn kulun, muokkaa sitä, jos ryhmän oikeudet sen sallivat, ja kerro siitä ensin kumppanillesi, koska saldot muuttuvat. Aiempi versio säilyy. Sopikaa, milloin lasketaan uudelleen, vaikkapa kerran vuodessa, ja tasatkaa tilit ennen vaihtoa, jotta vanha jako päättyy siistiin lukuun."
  - heading: "Mitä Side Badger ei tee tässä"
    items:
      - "Se ei koskaan kysy, paljonko kukaan ansaitsee, eikä laske prosentteja. Syötät sovitut luvut."
      - "Se ei voi asettaa koko ryhmälle oletusjakoa. Prosentit annetaan jokaiselle kululle, joten kopioi kulu, jossa ne jo ovat."
      - "Toistuvia laskuja ei ole, joten kopioit viime kuun vuokran joka kerta."
      - "Se ei koskaan siirrä rahaa. Maksatte toisillenne miten haluatte ja kirjaatte maksun."
