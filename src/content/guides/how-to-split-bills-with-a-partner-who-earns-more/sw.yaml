meta:
  title: "Gawanya bili na mpenzi anayepata zaidi | Side Badger"
  description: "50/50 inakuwa vigumu mmoja wenu akipata zaidi sana. Gawanya bili za pamoja kwa kipato, hesabu zikionyeshwa kwa watu wawili, bila lahajedwali."
h1: "Jinsi ya kugawanya bili na mpenzi anayepata zaidi"
navLabel: "Mpenzi anayepata zaidi"
lead: "Jumlisha mshahara wa mkononi, kokotoa sehemu ya kila mtu ya jumla na uzungushe hadi asilimia nzima. Maya anapokea £2,800 na Jon £1,700, kwa hivyo wanagawanya bili za pamoja 62/38. Weka asilimia hizo kwenye gharama ya pamoja ndani ya Side Badger, kisha nakili gharama hiyo kila bili hiyohiyo inapokuja tena."
cta:
  heading: "Fanya hesabu mara moja"
  body: "Fungua akaunti ya bure, tengeneza kikundi cha ninyi wawili na uweke kodi pamoja na asilimia zenu. Kodi ya mwezi ujao ni nakala. Unataka kuona kwanza? Tazama [jinsi inavyofanya kazi](page:how-it-works) au [kinachojumuishwa bure](page:pricing)."
sections:
  - heading: "Mishahara miwili, nyumba moja, ukimya mmoja wa adabu"
    body: "Maya na Jon wanaishi pamoja. Maya anapokea £2,800 kwa mwezi na Jon anapokea £1,700. Kwa miaka miwili waligawanya kila kitu 50/50, kwa sababu ilikuwa rahisi na hakuna aliyetaka kuwa wa kulizungumzia. Kisha Jon akaangalia kodi peke yake. Nusu ya £1,400 ni £700, ambayo ni robo ya mshahara wa mkononi wa Maya na 41% ya wake. Hakuna aliyekuwa si mwadilifu. Hakuna aliyefanya hesabu. [Wapenzi](page:use-case/couples) wengi hufika hapa mwishowe. Wakila chakula cha kuchukua walikubaliana kwamba bili za pamoja zinapaswa kuchukua sehemu inayofanana kutoka kwa kila mshahara."
  - heading: "Njia, pamoja na hesabu zilizoonyeshwa"
    body: "Hatua nne, kikokotoo kimoja na mazungumzo ambayo ungeyafanya hata hivyo."
    items:
      - "**Kubalianeni nini kinahesabiwa kama mshahara.** Maya na Jon wanatumia mshahara wa mkononi, pesa inayoingia benki kila mwezi. Kwa pamoja ni £2,800 + £1,700 = £4,500."
      - "**Kokotoa sehemu ya kila mtu.** Ya Maya ni 2,800 ÷ 4,500, yaani 62.2%. Ya Jon ni 1,700 ÷ 4,500, yaani 37.8%."
      - "**Zungusha hadi asilimia nzima.** 62.2% inakuwa 62 na 37.8% inakuwa 38. Kwa watu wawili, zungusha nambari moja na uitoe kwenye 100 upate nyingine, na zitajumlisha 100 kila mara."
      - "**Hakiki maana yake.** Kwenye kodi ya £1,400, Maya analipa £868 (62%) na Jon analipa £532 (38%). Hiyo ni takriban 31% ya mshahara wa mkononi wa kila mtu. Nusu kila mmoja ingechukua 25% ya wa Maya na 41% ya wa Jon."
  - heading: "Kusoma mwezi"
    body: "Maya alilipa kodi ya £1,400 na Jon alilipa £216 nyingine. Sehemu ya Maya ya mwezi ni £868.00 + £111.60 + £18.00 = £997.60, na alilipa £1,400, kwa hivyo anadai £402.40. Sehemu ya Jon ni £532.00 + £68.40 + £18.00 = £618.40, na alilipa £216, kwa hivyo anadaiwa £402.40. Side Badger inapendekeza malipo moja, Jon kwa Maya, ya £402.40, na [kumaliza hesabu](page:feature/settle-up) kunayarekodi yakishafanywa. Ukigawanywa 50/50, mwezi uleule ungekuwa na Jon akimlipa Maya £592.00."
  - heading: "Isanidi kwenye Side Badger"
    body: "Dakika kumi, sehemu kubwa yake ikitumika kwenye asilimia."
    items:
      - "**Tengeneza kikundi.** Kwenye dashibodi chagua **Unda Kikundi** na ukipe jina la nyumba. Chagua **Alika wengine** na umtumie Jon kiungo au msimbo wa QR. Anaingia au anafungua akaunti ya bure, na anachagua jina analotaka lionyeshwe kwenye kikundi hiki. Ni wanachama tu wanaoweza kuona kikundi, kwa hivyo hiki ni cha ninyi wawili tu."
      - "**Ongeza kodi.** Chagua **Ongeza Gharama**. Weka maelezo na kiasi, na chini ya **Nani alilipa?** chagua Maya. Waache watu wote wawili chini ya **Gawanya kati ya**, kisha chini ya **Jinsi ya kugawanya** chagua **Asilimia** na uandike 62 na 38. Fomu inaonya asilimia zisipojumlisha 100. Chagua **Hifadhi Gharama**."
      - "**Ongeza bili nyingine.** Nishati na intaneti zinaingia kwa njia hiyohiyo, Jon akiwa mlipaji na 62 na 38 zilezile. Chakula cha kuchukua ni gharama yake yenyewe, na **Jinsi ya kugawanya** ikiachwa kwenye **Sawa**."
      - "**Nakili mwezi ujao.** Fungua kodi ya mwezi uliopita na uchague **Kopi gharama**. Nakala inabaki na mlipaji, kiasi na mgawanyo, na inachukua tarehe ya leo. Badilisha kiasi kama kodi imebadilika, kisha chagua **Unda kopi**. Bili ya nishati inafanya kazi vivyo hivyo."
      - "**Angalia nani anadaiwa na nani.** Sehemu ya **Salio** inaonyesha na kupendekeza orodha fupi ya malipo. Lipaneni mtakavyo, kisha rekodi malipo chini ya **Lipa deni**."
  - heading: "50/50, kwa kipato, au bili kwa bili"
    body: "Hakuna jibu sahihi, ni lile tu mnaloweza kuishi nalo nyote wawili. Matatu ya kawaida."
    items:
      - "**Nusu kila mmoja kwa kila kitu.** Rahisi zaidi kuweka, na inafaa wapenzi ambao mishahara yao inakaribiana."
      - "**Kwa kipato kwa kila kitu cha pamoja.** Wanachofanya Maya na Jon. Mazungumzo moja, jozi moja ya asilimia."
      - "**Bili kwa bili.** Kodi na bili kwa kipato, likizo na zawadi ndogo 50/50 au chochote mnachokubaliana, na kila bili inapata kanuni inayoifaa."
  - heading: "Kubalianeni nini ni cha pamoja"
    body: "Mabishano kwa kawaida ni kuhusu orodha, si asilimia. Kodi, nishati, intaneti, ununuzi wa wiki na sofa huhesabiwa kuwa za pamoja katika nyumba nyingi. Uanachama wa gym wa Maya na usajili wa mpira wa miguu wa Jon huenda visiwe. Kubalianeni orodha mara moja, iandikeni na muweke gharama za pamoja tu kwenye kikundi."
  - heading: "Chakula cha kuchukua kinabaki 50/50, kwa makusudi"
    body: "Zawadi ndogo ni ndogo na si lazima, na hakuna anayepaswa kuhitaji kikokotoo kuagiza dumplings. Ndani ya Side Badger chakula cha kuchukua ni gharama nyingine tu. Jon analipa £36, **Jinsi ya kugawanya** inabaki kwenye **Sawa** na kila mmoja anadaiwa £18."
  - heading: "Mshahara wa mtu ukibadilika"
    body: "Nyongeza ya mshahara, kazi mpya au likizo ya kazi hubadilisha hesabu. Kokotoa asilimia mpya kwa njia ileile na uzitumie kuanzia gharama inayofuata. Gharama za awali zinabaki kama zilivyokuwa. Nakili kodi ya mwezi uliopita, badilisha asilimia, kisha chagua **Unda kopi**. Kusahihisha gharama iliyokwisha ingia, ihariri ikiwa ruhusa za kikundi zinaruhusu, na umwambie mpenzi wako kwanza, kwa sababu salio hubadilika. Toleo la awali linahifadhiwa. Kubalianeni mtakapohesabu upya, kama mara moja kwa mwaka, na mumalize hesabu kabla ya kubadilisha ili mgawanyo wa zamani ufungwe na hesabu safi."
  - heading: "Kile ambacho Side Badger haifanyi hapa"
    items:
      - "Haiulizi kamwe mtu anapata kiasi gani na haikokotoi asilimia. Unaandika nambari mlizokubaliana."
      - "Haiwezi kuweka mgawanyo wa kawaida kwa kikundi kizima. Asilimia zinawekwa kwenye kila gharama, kwa hivyo nakili gharama ambayo tayari ina asilimia hizo."
      - "Haina bili zinazojirudia, kwa hivyo unanakili kodi ya mwezi uliopita kila mara."
      - "Haihamishi pesa kamwe. Mnalipana mtakavyo na kurekodi."
