  expenses:
    - label: "Спільний подарунок"
      payer: priya
      amount: 150
      split:
        method: exact
        shares:
          priya: 30
          tom: 30
          jess: 30
          mo: 20
          lee: 20
          kat: 20
featuresHeading: "Можливості, які це використовує"
faq:
  heading: "Запитання"
  items:
    - q: "Чи можуть гості бачити групу, не приєднавшись?"
      a: "Ні. Люди приєднуються за посиланням чи QR-кодом із безкоштовним обліковим записом, тож групу вони бачать, лише коли увійдуть."
    - q: "Чи може Side Badger збирати гроші?"
      a: "Ні. Side Badger веде облік і ніколи не переказує гроші. Платіть одне одному як зручно, а потім запишіть платіж. Він безкоштовний, без реклами та без денних обмежень; див. [ціни](page:pricing)."
    - q: "Чи можуть голоси бути анонімними?"
      a: "Так. Створюючи опитування, можна приховати, хто за що голосував. Налаштування можна змінити лише до першого голосу."
    - q: "Чи можуть люди вносити різні суми?"
      a: "Так. Розділіть витрату за точними сумами, щоб частка кожного була сумою, про яку ви домовилися, або пропустіть тих, хто не брав участі."
    - q: "Чи може організатор вести облік?"
      a: "Так. Використовуйте шаблон керованої групи, щоб витрати змінювали лише творці й адміністратори, а адміністратори схвалювали нових учасників."
