sections:
  - heading: "Tylko osoby, które tam były"
    body: "Podziel koszt między wszystkich albo tylko między osoby, które go dzieliły. Pomiń ludzi w kosztach, w których nie uczestniczyli, a salda to uwzględnią. Współlokator, którego cały tydzień nie było, nie jest nic winien za jedzenie na wynos, co [współlokatorzy](page:use-case/housemates) uznają za elementarną sprawiedliwość."
  - heading: "Szczegóły, które oszczędzają kłótni później"
    items:
      - "Ustaw **datę** i opcjonalnie godzinę. Skróty takie jak dzisiaj, wczoraj, dziś rano i wczoraj wieczorem oszczędzają trochę pisania."
      - "Dodaj do trzech **etykiet**, żeby grupować wydatki, na przykład zakupy albo podróże."
      - "Dodaj **miejsce**. Wklej link do mapy, a nazwa miejsca uzupełni się sama."
      - "Dodaj **notatkę** z historią stojącą za kwotą, z odrobiną formatowania, jeśli historia tego wymaga."
      - "Załącz maksymalnie trzy **paragony** jako zdjęcia lub pliki PDF, żeby dowód został przy wydatku."
      - "Używaj **komentarzy**, żeby rozmowa była obok wydatku, którego dotyczy, a nie w wątku czatu, do którego nikt nie wraca."
  - heading: "Kopiuj, edytuj i zobacz, co się zmieniło"
    body: "Skopiuj zeszłomiesięczny czynsz zamiast wpisywać go od nowa, a potem zmień to, co się różni. Jeśli kwota była zła, edytuj wydatek. Wcześniejsza wersja jest zachowana, a edycja widoczna w aktywności grupy, więc nikt nie zmienia kwoty po cichu. To, co każdy może edytować, zależy od uprawnień grupy."
  - heading: "Gdy coś wygląda źle"
    body: "Grupa może włączyć pytania do wydatków. Każdy uwzględniony w wydatku może zgłosić pytanie i napisać dlaczego, a wydatek zostaje poza saldami, dopóki osoba, która zapytała, albo administrator go nie zamknie. Domyślnie jest to wyłączone, a administrator włącza je dla grupy. Pasuje do [wydarzeń i uroczystości](page:use-case/events-and-celebrations), gdzie zaliczka, której nikt nie pamięta, nagle obchodzi wszystkich."
limits:
  heading: "Limity"
  items:
    - "Za każdy wydatek płaci jedna osoba. Jeśli zapłaciły dwie, zarejestruj dwa wydatki."
    - "Nie ma dzielenia według pozycji ani według udziałów. Jest po równo, według dokładnych kwot i procentowo."
    - "Procenty muszą dawać w sumie 100."
    - "Wydatek może wynosić do 999 999,99 w swojej walucie, z liczbą miejsc po przecinku zwykłą dla tej waluty."
    - "Wydatki nie powtarzają się same. Skopiuj zeszłomiesięczny."
    - "Daty nie mogą być w przyszłości ani starsze niż 10 lat."
    - "Wydatek z udziałem osoby, która opuściła grupę, staje się tylko do odczytu."
useCasesHeading: "Gdzie takie dzielenie pomaga"
faq:
  heading: "Pytania"
  items:
    - q: "Czy dwie osoby mogą zapłacić za jeden wydatek?"
      a: "Nie w jednym wydatku. Zarejestruj dwa, po jednym dla każdego płatnika, a salda wyjdą tak samo."
    - q: "Czy mogę podzielić paragon według pozycji?"
      a: "Nie. Podział jest po równo, według dokładnych kwot albo procentowo. Przy rachunku z różnymi pozycjami wpisz, ile jest winna każda osoba, jako dokładne kwoty."
    - q: "Czy mogę ustawić domyślny podział?"
      a: "Nie. Skopiuj wcześniejszy wydatek, żeby użyć jego podziału, i zmień to, co się różni."
    - q: "Czy rachunki mogą powtarzać się co miesiąc?"
      a: "Nie. Skopiuj zamiast tego zeszłomiesięczny wydatek, co zajmuje kilka sekund."
    - q: "Kto może edytować wydatek?"
      a: "Ten, komu pozwalają na to uprawnienia grupy. Każda edycja jest widoczna w aktywności grupy, więc zmiany nigdy nie są ciche."
    - q: "Co dzieje się potem z saldami?"
      a: "Aktualizują się wraz z napływem wydatków, a [rozliczanie](page:feature/settle-up) zamienia je w krótką listę płatności. Jeśli wydatek jest w innej walucie, zobacz [wiele walut](page:feature/multiple-currencies)."
