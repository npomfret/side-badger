faq:
  heading: Frågor om villan
  items:
    - q: Tänk om någon ställer in?
      a: Ta bort deras nätter, räkna om och redigera villautgiften så att de exakta beloppen återigen summerar till priset. Den tidigare versionen sparas och ändringen syns i gruppens aktivitet, så ingen ändrar en siffra i smyg. Vem som får redigera beror på gruppens behörigheter.
    - q: Ska den som bokade betala mindre?
      a: Det avgör gruppen. Att boka är ett ansvar, och grupper har olika syn på om det ger rabatt. Vad ni än kommer överens om, lägg in det i de exakta beloppen och skriv det i en anteckning på utgiften eller i en kommentar bredvid, så att ingen behöver komma ihåg överenskommelsen.
    - q: Kan vi dela städavgiften på ett annat sätt?
      a: Ja. Lägg in avgiften som en egen utgift och ge den en egen delning. Lika passar en fast avgift för hela huset. Exakta belopp passar en grupp som vill att avgiften också ska följa nätterna.
