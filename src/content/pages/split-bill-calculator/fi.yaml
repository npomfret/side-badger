faq:
  heading: Kysymyksiä
  items:
    - q: Onko laskuri ilmainen?
      a: Kyllä. Ilmainen. Ei mainoksia. Ei päivittäisiä rajoja. Et tarvitse myöskään tiliä.
    - q: Tallentaako se kirjoittamani?
      a: "Ei. Mitään ei tallenneta eikä lähetetä minnekään. Säilyttääksesi luvut käytä Kopioi linkki -painiketta ja tallenna linkki jonnekin."
    - q: Kuka voi nähdä kopioimani linkin?
      a: "Jokainen, jolla se on. Luvut ovat itse linkissä #-merkin jälkeen, joten jaa se vain niiden kanssa, joiden kuuluu nähdä ne."
    - q: Siirtääkö se rahaa?
      a: Ei. Se selvittää, kuka kenelle pitäisi maksaa, ja te maksatte toisillenne miten haluatte. Side Badger ei myöskään koskaan koske rahoihisi. Katso [tilien tasaus](page:feature/settle-up).
    - q: Voinko jakaa kahdella valuutalla maksetun matkan?
      a: Ei täällä, koska laskelmassa on yksi valuutta. Ryhmässä jokaisella valuutalla on oma saldonsa. Katso [useita valuuttoja](page:feature/multiple-currencies).
    - q: Entä jos summat eivät täsmää?
      a: Laskuri kertoo siitä kulun alla eikä näytä tulosta, ennen kuin ne täsmäävät. Tarkkojen summien on oltava yhteensä loppusumma, ja prosenttien summan on oltava 100.
