sections:
  - heading: "Розмови про гроші, поруч із грошима"
    body: "Спільні гроші приносять балачки, сумніви й плани. Side Badger тримає все це поруч із цифрами, тож нікому не доведеться гортати чат назад."
    items:
      - "**Коментарі там, де їм місце.** Коментуйте саму групу або будь-яку витрату, список чи опитування, і розмова лишається поруч із тим, про що вона."
      - "**Чеки й фото.** Зберігайте до трьох чеків до кожної витрати, а до коментарів у групі, списку чи опитуванні додавайте фото або PDF."
      - "**Запитання, а не сварки.** Адмін може увімкнути запитання, і тоді кожен учасник витрати зможе про неї запитати. Витрата не потрапляє в баланси, доки все не з'ясують."
      - "**Списки й опитування.** Тримайте спільний список покупок поруч із витратами на покупки й ставте короткий список вілл на голосування, анонімно, якщо хочете."
      - "**Трохи оплесків.** Реагуйте на витрати, платежі й коментарі та святкуйте платіж, коли він надійшов."
  - heading: "Ваша група, ваші правила"
    body: "У довідковому центрі Splitwise сказано, що він не підтримує адмінів групи чи особливі дозволи. У Side Badger є ролі й дозволи, для груп, яким потрібен хтось, хто тримає цифри в порядку."
    items:
      - "**Адміни, учасники й глядачі.** Зробіть когось глядачем: він бачить усе й нічого не змінює."
      - "**Два пресети або свої налаштування.** Почніть із «Відкрита співпраця» чи «Керована група» або налаштуйте кожен дозвіл самі: хто редагує й видаляє витрати, редагує списки, запрошує й впускає нових людей."
      - "**Схвалення для вступу.** Увімкніть схвалення, і адмін впускає кожного окремо."
      - "**Власні налаштування групи.** Обмежте її валютами, якими ви справді користуєтеся, виберіть валюту за замовчуванням і додайте верхнє зображення."
      - "**Заблокуйте, коли все скінчено.** Цифри лишаються на місці, доки адмін не розблокує групу."
  - heading: "Тут безкоштовно, там платно"
    body: "Splitwise Pro — платний план Splitwise, і на його власній сторінці Pro продаються три речі, що в Side Badger нічого не коштують."
    items:
      - "**Сканування чеків.** Splitwise Pro сканує фото вашого чека. Side Badger робить це безкоштовно, без кредитів на сканування: він заповнює загальну суму, дату й місце, щоб ви їх перевірили."
      - "**Конвертація валют.** Splitwise Pro конвертує витрати групи у вашу валюту за замовчуванням, коли ви торкаєтеся «Convert». Side Badger конвертує кожну витрату під час введення, за актуальним курсом обміну або за тим, який ви справді отримали, а початкова сума лишається біля витрати."
      - "**Без щоденних обмежень.** Splitwise Pro продає необмежену кількість витрат, а в його довідковому центрі сказано, що безкоштовні користувачі можуть додавати до 4 витрат на день. У Side Badger щоденних обмежень немає."
  - heading: "Ваш банк лишається осторонь"
    body: "Side Badger не підключається до вашого банку й не просить ваших банківських даних. Він веде облік, хто кому винен; ви платите одне одному як зручно, а потім записуєте платіж. Дані для входу в банк віддавати не треба, тож одним клопотом менше."
  - heading: "Один застосунок, у браузері й на телефоні"
    body: "Side Badger працює у вашому браузері. Увійдіть, додайте його на головний екран, і він відкриватиметься як застосунок. Це той самий застосунок в обох випадках, тож нова функція з'явиться на телефоні, щойно ви його наступного разу відкриєте, без оновлення з магазину застосунків."
  - heading: "І ще кілька фокусів"
    items:
      - "**Спитайте свого асистента.** Side Badger працює з ChatGPT і Claude: попросіть свого додати витрату, відсканувати чек чи записати платіж."
      - "**Кожен своєю мовою.** Side Badger говорить 39 мовами, і кожен обирає свою. На головній сторінці Splitwise їх понад 7. Він підтримує й 133 валюти, для подорожей, що ведуть усюди."
      - "**Допомога без виходу із застосунку.** Застрягли чи знайшли помилку? Напишіть нам із застосунку й читайте нашу відповідь просто там."
  - heading: "Де Splitwise все ще попереду"
    body: "Ми б хотіли, щоб ви обрали правильний застосунок, а не дізналися пізніше. Якщо вашій групі потрібне щось із цього, у Splitwise воно є, а в Side Badger ні."
    items:
      - "**Застосунки з магазину.** Side Badger живе у вашому браузері й на головному екрані, а не в магазинах застосунків."
      - "**Офлайн-режим.** Side Badger потребує з'єднання."
      - "**Платежі в застосунку.** У деяких країнах Splitwise може ще й переказувати гроші. Side Badger лише веде облік."
      - "**Розподіл за частками чи за позиціями.** У Side Badger одна людина платить за витрату, а розподіл іде порівну, за точними сумами або у відсотках. Його сканування чеків не розподіляє позиції між людьми."
      - "**Діаграми й типові розподіли.** У Splitwise Pro є обидва. Side Badger веде облік, хто кому винен, і в цьому весь фокус."
  - heading: "Переїзд вашої групи"
    body: "Інструмента імпорту немає, тож переїзд означає новий початок. Спершу розрахуйтеся в Splitwise, потім заведіть групу в Side Badger і запросіть усіх за посиланням або QR-кодом. Кожному в групі потрібен безкоштовний обліковий запис, а для реєстрації достатньо електронної адреси."
