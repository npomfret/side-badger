featuresHeading: Die Funktionen, die ein Paar nutzt
faq:
  heading: Fragen
  items:
    - q: Können wir 60/40 einmal für alles festlegen?
      a: Nein. Die Aufteilung gehört zu jeder einzelnen Ausgabe. Lege die Prozentsätze bei der ersten fest, kopiere sie beim nächsten Mal und ändere, was anders ist. [Ausgaben teilen](page:feature/split-expenses) behandelt alle drei Arten zu teilen.
    - q: Ist es mit unserer Bank verbunden?
      a: Nein. Side Badger fasst euer Geld nie an. Ihr zahlt einander, wie ihr wollt, und erfasst es dann, wie [Abrechnen](page:feature/settle-up) erklärt.
    - q: Kann sonst jemand unsere Gruppe sehen?
      a: Nur ihre Mitglieder, und die Gruppe eines Paares hat zwei. Wer einen gültigen Einladungslink nutzt, kann beitreten, teile ihn also mit einer einzigen Person und gib ihm ein kurzes Ablaufdatum.
    - q: Was, wenn wir beide einen Teil derselben Rechnung bezahlt haben?
      a: Eine Ausgabe hat eine zahlende Person. Erfasse zwei Ausgaben, eine für jede von euch, und der Saldo kommt gleich heraus.
    - q: Erinnert es meinen Partner oder meine Partnerin ans Zahlen?
      a: Nein. Es gibt keine Erinnerungen, das Anstupsen bleibt also deine Sache. Immerhin schaut ihr beide auf dieselbe Zahl.
    - q: Was passiert, wenn wir keine Kosten mehr teilen?
      a: Gleicht den Saldo aus und erfasst die Zahlung, damit niemand etwas schuldet. Dann kann ein Admin die Gruppe sperren, wodurch die Zahlen bleiben, wie sie sind, oder sie endgültig schließen, wodurch sie für alle unzugänglich wird. Schließt sie nur, wenn niemand von euch beiden den Verlauf mehr braucht.
