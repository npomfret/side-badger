sections:
  - heading: "Înregistrează o plată"
    body: "Când cineva plătește, înregistrează plata pe persoana potrivită. Butoanele de decontare rapidă completează suma din plățile sugerate și poți adăuga o notă, de exemplu „transfer bancar” (până la 500 de caractere). Dacă plătești doar o parte din ce datorezi, restul rămâne în sold. Dacă introduci prea puțin sau prea mult, Side Badger te avertizează înainte de salvare. Pentru a înregistra o plată ai nevoie de permisiunea de a edita cheltuieli, iar data nu poate fi în viitor."
  - heading: "Ai plătit în altă valută?"
    body: "Soldurile rămân în valuta în care s-au plătit, așa că o datorie în euro rămâne o datorie în euro. Datorezi euro, dar plătești în lire? Convertește plata la introducere, la un curs de schimb actual sau la cursul pe care l-ai primit de fapt. Cursul se fixează la salvarea plății. [Mai multe valute](page:feature/multiple-currencies) explică cum funcționează conversia, iar [excursiile de grup](page:use-case/group-trips) o arată în practică."
  - heading: "Un istoric pe care îl poți verifica"
    body: "Fiecare plată înregistrată rămâne în istoricul grupului, cu data, suma și nota ei. Doar persoana care a înregistrat o plată o poate edita, iar ea sau un administrator al grupului o poate șterge. O plată la care participă cineva care a părăsit grupul este blocată. Pentru un scenariu detaliat cu colegi de casă, vezi [colegi de casă](page:use-case/housemates)."
limits:
  heading: "Ce nu face Side Badger"
  items:
    - "Side Badger nu mută bani, nu trimite linkuri de plată și nu trimite cereri de plată. O plată din aplicație este o înregistrare a unei plăți făcute în altă parte."
    - "Plățile sugerate vin dintr-o metodă simplă de potrivire, aplicată pe valute. Sugerează mereu mai puține plăți decât numărul de persoane cu sold în acea valută (patru persoane, cel mult trei plăți), dar nu găsește mereu cel mai mic număr posibil."
    - "Nu poți opri sugestiile. **Arată tot** listează fiecare plată sugerată din grup, nu doar pe ale tale."
    - "Valutele nu se compensează niciodată între ele, decât dacă cheltuielile au fost convertite la introducere."
    - "Nu există mementouri, așa că urmărirea unei plăți rămâne treaba ta."
useCasesHeading: "Unde contează decontarea"
faq:
  heading: "Întrebări"
  items:
    - q: "Trimite Side Badger banii?"
      a: "Nu. Plătiți-vă unii altora cum preferați, apoi înregistrați plata în Side Badger, ca soldul să se actualizeze."
    - q: "Pot opri plățile sugerate?"
      a: "Nu. Simplificarea rămâne activă, iar **Arată tot** listează fiecare plată sugerată din grup, nu doar pe cele care te privesc."
    - q: "De ce sunt euro și lirele ținute separat?"
      a: "Soldurile rămân în valuta în care ai plătit, dacă nu convertești la introducerea unei cheltuieli sau a unei plăți. Datoriile în valute diferite nu se compensează niciodată între ele."
    - q: "Ce se întâmplă dacă cineva plătește doar o parte din ce datorează?"
      a: "Înregistrează partea plătită. Restul rămâne în sold până e plătit."
    - q: "Este mereu cel mai mic număr posibil de plăți?"
      a: "Nu e garantat. Sugerează mereu mai puține plăți decât numărul de persoane cu sold în acea valută, deci pentru patru persoane nu sugerează niciodată mai mult de trei. În exemplul cu colegii de casă, asta înseamnă două plăți, acolo unde plata directă către fiecare persoană a cerut șase."
