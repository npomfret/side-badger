meta:
  title: "Side Badger mod Splitwise: det gratis, sammenlignet | Side Badger"
  description: "Et gratis Splitwise-alternativ, sammenlignet fair. Kvitteringsscanning, valutaomregning og ingen reklamer er gratis her, og vi lister, hvad Splitwise gør bedre."
h1: "Side Badger mod Splitwise: de gratis dele, sammenlignet"
navLabel: Side Badger mod Splitwise
lead: "Nogen i din gruppe har sikkert sagt »brug bare Splitwise«. Fair nok. Side Badger er en gratis webapp med kvitteringsscanning, valutaomregning og ingen reklamer, og uden abonnement for at låse dem op. Hvilken der passer til din gruppe, afhænger af, hvad den har brug for, så her er sammenligningen, med Splitwises side hentet alene fra Splitwises egne sider."
cta:
  heading: Prøv den på din næste fælles regning
  body: "Opret en gratis konto, lav en gruppe, og tilføj én rigtig udgift. Hvis den ikke er noget for dig, har du brugt et par minutter, ikke et abonnement."
asOf: 2026-10-21
asOfNote: "Vi læste Splitwises egne sider den {date}, så du ikke behøver, og alt her om Splitwise stammer derfra. Hver række i tabellen linker til sin kilde. Abonnementerne ændrer sig, så vi tjekker igen hvert kvartal, og hvis Splitwises sider er uenige med denne, så tro på dem."
