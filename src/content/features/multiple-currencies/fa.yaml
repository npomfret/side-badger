sections:
  - heading: "یک ارز برای کل گروه"
    body: "اگر گروه ترجیح می‌دهد به این موضوع فکر نکند، یک ارز گروه انتخاب کنید تا فرم هر هزینه جدید را به آن تبدیل کند، با نرخی که هنوز می‌توانید ببینید و تغییر دهید. این فقط برای هزینه‌های جدید و کپی‌شده اعمال می‌شود. ویرایش‌ها و هزینه‌های موجود همان‌طور که هستند می‌مانند، پس چیزی که قبلاً ثبت شده زیر دست شما تغییر نمی‌کند."
  - heading: "یورو بدهکارید، با پوند می‌پردازید"
    body: "با ین پرداخت شد و با پوند تسویه می‌کنید؟ اشکالی ندارد. وقتی پرداخت را ثبت می‌کنید می‌توانید آن را هم تبدیل کنید، پس کسی که یورو بدهکار است می‌تواند با پوند بپردازد و مانده یورو باز هم درست درمی‌آید. هر طور دوست دارید به هم پرداخت کنید، بعد ثبتش کنید."
  - heading: "قواعد گروه"
    body: "گروه را به ارزهایی که واقعاً استفاده می‌کنید محدود کنید و یک پیش‌فرض تعیین کنید تا فرم روی ارز درست باز شود. تعطیلات در پرتغال کنار صورت‌حساب شام به 139 گزینه دیگر نیاز ندارد و یک [عروسی در خارج از کشور](page:use-case/events-and-celebrations) احتمالاً به دو ارز نیاز دارد."
limits:
  heading: "محدودیت‌ها"
  items:
    - "نرخ هنگام ذخیره هزینه ثابت می‌شود. هزینه‌های قدیمی هرگز دوباره ارزش‌گذاری نمی‌شوند."
    - "Side Badger هر جا بتواند نرخ روز را می‌گیرد. برای هر جفت ارز تضمینی نیست و همیشه می‌توانید نرخ را خودتان بنویسید."
    - "تبدیل خودکار گروه فقط برای هزینه‌های جدید و کپی‌شده اعمال می‌شود، نه برای ویرایش‌ها یا هزینه‌های موجود."
    - "هر هزینه به 999,999.99 به ارز خودش محدود است."
    - "140 ارز وجود دارد. ارزهای دیجیتال و فلزات جزو آن‌ها نیستند."
    - "Side Badger پرداخت‌ها را ثبت می‌کند. هرگز پول را جابه‌جا یا معاوضه نمی‌کند."
useCasesHeading: "جایی که کمک می‌کند"
faq:
  heading: "پرسش‌ها"
  items:
    - q: "از کدام نرخ تبدیل استفاده می‌کنید؟"
      a: "نرخ تبدیل روز، که هنگام وارد کردن هزینه در صورت وجود گرفته می‌شود. می‌توانید آن را به نرخی که واقعاً گرفته‌اید تغییر دهید و مبلغ تبدیل‌شده به‌روز می‌شود."
    - q: "هزینه‌های قدیمی دوباره ارزش‌گذاری می‌شوند؟"
      a: "نه. نرخ هنگام ذخیره هزینه ثابت می‌شود، پس مانده فقط به این دلیل که بازار جابه‌جا شده تغییر نمی‌کند."
    - q: "آیا از ارز دیجیتال پشتیبانی می‌کنید؟"
      a: "نه. 140 ارز وجود دارد و ارزهای دیجیتال جزو آن‌ها نیستند."
    - q: "چرا نمی‌توانم 2,000,000 روپیه اندونزی وارد کنم؟"
      a: "هر هزینه به 999,999.99 به ارز خودش محدود است. آن را با ارز دیگری وارد و تبدیل کنید، یا به دو هزینه تقسیم کنید."
    - q: "تبدیل هزینه‌ای دارد؟"
      a: "نه. تبدیل مثل بقیه Side Badger رایگان است. [قیمت‌ها](page:pricing) را ببینید."
    - q: "باید حتماً تبدیل کنم؟"
      a: "نه. ارزها جدا می‌مانند مگر اینکه شما یا گروه‌تان تبدیل را انتخاب کنید و هر ارز فهرست کوتاه پرداخت‌های خودش را دارد."
