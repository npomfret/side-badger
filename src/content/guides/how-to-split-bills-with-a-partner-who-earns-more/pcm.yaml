meta:
  title: "How to share bills with partner wey earn more | Side Badger"
  description: "50/50 dey awkward when one of una earn far more. Share di shared bills by income instead, with di sums for two people and no spreadsheet."
h1: "How to share bills with partner wey earn more"
navLabel: "Partner wey earn more"
lead: "Add up your take-home pay, work out each person share of di total and round am to whole percentages. Maya dey take home £2,800 and Jon £1,700, so dem share di shared bills 62/38. Enter those percentages on shared expense for Side Badger, then copy am whenever di same bill come round."
cta:
  heading: "Do di sum once"
  body: "Create free account, make group for di two of una and put di rent in with your percentages. Next month rent na copy. You wan see di tour first? See [how e dey work](page:how-it-works) or check [wetin free cover](page:pricing)."
sections:
  - heading: "Two salaries, one flat, one polite silence"
    body: "Maya and Jon dey live together. Maya dey take home £2,800 every month and Jon dey take home £1,700. For two years dem share everything 50/50, because e simple and neither of dem wan be di one to talk am first. Then Jon look di rent on im own. Half of £1,400 na £700, wey be one quarter of Maya take-home pay and 41% of Jon own. Nobody dey unfair. Nobody just do di sum. Plenty [couples](page:use-case/couples) dey reach dis point eventually. As dem dey chop takeaway, dem agree say di shared bills suppose take similar bite from each pay."
  - heading: "Di method, with di sums wey we show"
    body: "Four steps, one calculator and one conversation wey you go still have anyway."
    items:
      - "**Agree wetin count as pay.** Maya and Jon dey use take-home pay, di money wey dey land for bank every month. Together, na £2,800 + £1,700 = £4,500."
      - "**Work out each share.** Maya own na 2,800 ÷ 4,500, wey be 62.2%. Jon own na 1,700 ÷ 4,500, wey be 37.8%."
      - "**Round am to whole percentages.** 62.2% become 62 and 37.8% become 38. With two people, round one figure and comot am from 100 to get di other, and dem go always total 100."
      - "**Check wetin e mean.** On di £1,400 rent, Maya pay £868 (62%) and Jon pay £532 (38%). Dat na about 31% of each person take-home pay. If dem share half each, e go take 25% of Maya own and 41% of Jon own."
  - heading: "How to read di month"
    body: "Maya pay di £1,400 rent and Jon pay di other £216. Maya share of di month na £868.00 + £111.60 + £18.00 = £997.60, and Maya pay £1,400, so dem owe am £402.40. Jon share na £532.00 + £68.40 + £18.00 = £618.40, and Jon pay £216, so e owe £402.40. Side Badger suggest one payment, Jon to Maya, for £402.40, and [settle up](page:feature/settle-up) go record am once dem don make am. If dem share am 50/50, di same month go make Jon pay Maya £592.00."
  - heading: "Set am up for Side Badger"
    body: "Ten minutes, and most of am na for di percentages."
    items:
      - "**Make di group.** For di dashboard choose **Kreate Grup** and name am after di flat. Choose **Invite others** and send Jon di link or QR code. E go sign in or create free account, and pick di name wey e wan make people see for dis group. Only members fit see group, so dis one na just di two of una."
      - "**Add di rent.** Choose **Add expense**. Enter di description and amount, and under **Who pay?** pick Maya. Make di two people dey under **Split bitwin**, then under **How we go split am** choose **Pasentej** and type 62 and 38. Di form go flag am if di percentages no total 100. Choose **Sev Expense**."
      - "**Add di other bills.** Energy and broadband enter di same way, with Jon as di payer and di same 62 and 38. Di takeaway na im own expense, with **How we go split am** left on **Equal**."
      - "**Copy am next month.** Open last month rent and choose **Kopi expense**. Di copy go keep di payer, di amount and di split, and e go take today date. Change di amount if di rent change, then choose **Create copy**. Di energy bill work di same way."
      - "**Check who owe who.** Di **Balansis** section go show am and suggest short list of payments. Pay each other anyhow you like, then record di payment under **Settle up**."
  - heading: "50/50, by income, or one bill at a time"
    body: "No correct answer dey, only di one wey una both fit live with. Three common ones."
    items:
      - "**Half-half for everything.** Di easiest to keep, and e suit couples wey pay close."
      - "**By income for everything wey dem share.** Na wetin Maya and Jon dey do. One conversation, one pair of percentages."
      - "**Bill by bill.** Rent and bills by income, holidays and treats 50/50 or whatever else una agree, and each bill go get di rule wey suit am."
  - heading: "Agree wetin count as shared"
    body: "Di arguments usually dey about di list, no be di percentages. Rent, energy, broadband, di weekly shop and di sofa count as shared for most homes. Maya gym membership and Jon football subscription fit no count. Agree di list once, write am down and put only di shared costs inside di group."
  - heading: "Di takeaway stay 50/50, on purpose"
    body: "Treats small and optional, and nobody no suppose need calculator to order dumplings. For Side Badger di takeaway na just another expense. Jon pay £36, **How we go split am** stay on **Equal** and each of dem owe £18."
  - heading: "When somebody pay change"
    body: "Pay rise, new job or time off work go change di sum. Work out di new percentages di same way and use dem from di next expense. Earlier expenses go stay as dem be. Copy last month rent, change di percentages, then choose **Create copy**. To correct one wey don enter already, edit am if di group permissions allow, and tell your partner first, because di balances go change. Di earlier version dey kept. Agree when una go recalculate, like once a year, and settle up before una switch so di old split go close with clean count."
  - heading: "Wetin Side Badger no dey do here"
    items:
      - "E no dey ever ask wetin anybody earn and e no dey work out di percentages. You go type di figures wey una agree."
      - "E no fit set default split for di whole group. Di percentages dey go on each expense, so copy one wey already get dem."
      - "No recurring bills dey, so you go copy last month rent every time."
      - "E no dey ever move money. You pay each other anyhow you like and record am."
