meta:
  title: "Skiptu reikningum án niðurhals | Side Badger"
  description: "Síminn þinn er fullur, við skiljum það. Side Badger keyrir í vafranum, án appverslunar og án niðurhals. Bættu því við heimaskjáinn og það opnast eins og app."
h1: "Engin appverslun. Ekkert niðurhal. Samt eins og app"
navLabel: "Vefforrit"
lead: "Side Badger lifir í vafranum þínum. Það er engin appverslun til að leita í og ekkert til að sækja fyrst. Skráðu þig inn í síma eða tölvu, skiptu útgjöldum á netinu með hópnum þínum og bættu því við heimaskjáinn eða Dock-ið þegar þú vilt hafa það við höndina."
cta:
  heading: "Opnaðu það. Skráðu þig inn. Byrjaðu hóp."
  body: "Stofnaðu aðgang, byrjaðu hóp og bættu við fyrsta útgjaldinu, allt úr vafranum sem þú ert þegar með opinn. Viltu fá skoðunarferðina fyrst? Sjáðu [hvernig þetta virkar](page:how-it-works), eða kynntu þér [hvað ókeypis nær yfir](page:pricing)."
problem:
  heading: "Síminn þinn er fullur. Við skiljum það."
  body: "Einhvers staðar í honum eru fjögur þúsund myndir af sama sólarlaginu og viðvörun um geymslupláss sem þú hefur strokið burt síðan í vor. Það síðasta sem hann þarf er enn eitt appið, bara til að skipta einum kvöldverði. Þess vegna er Side Badger vefforrit. Það keyrir í nútímalegum vafra í síma eða tölvu. Í síma notar það farsímaútlit, með hópsíðunni skipt í flipa og stjórntækjum sem henta snertingu. Sumt aukalegt, eins og að bæta því við heimaskjáinn, fer eftir vafranum þínum, og við segjum hvar."
workflow:
  heading: "Frá vafraflipa að heimaskjá í þremur skrefum"
  steps:
    - title: "Opnaðu það og skráðu þig inn"
      body: "Farðu á Side Badger í vafranum og skráðu þig inn. Allt sem þarf er netfang og lykilorð, og þú staðfestir netfangið áður en þú getur bætt einhverju við. Allir í hópnum þurfa aðgang, svo fólkið sem þú býður gerir það sama."
    - title: "Bættu því við heimaskjáinn eða Dock-ið"
      body: "Þegar innskráningin er afstaðin býðst appið til að setja sig upp sjálft. Þú færð hnappinn **Setja upp** þar sem vafrinn leyfir það og **Sýndu mér hvernig** þar sem hann gerir það ekki. Misstirðu af því eða afþakkaðirðu? **Stillingar** bjóða upp á sömu hjálp undir **Bæta við heimaskjá eða Dock**. Á iPhone eða iPad sýna Stillingar iPhone-skrefin fyrst og setja hin tækin undir **Önnur tæki**. Hvort sem er opnast appið eftir það í sínum eigin glugga."
      shot: S20
      shotAlt: "Hlutinn Bæta við heimaskjá eða Dock í Stillingum, með skrefunum til að bæta appinu við tæki"
    - title: "Kveiktu á tilkynningum, ef þú vilt"
      body: "Slökkt er á tilkynningum þar til þú kveikir á þeim og kveikt er á hverju tæki fyrir sig. Notaðu hnappinn **Kveikja** sem tilkynningabjallan býður upp á, eða rofann **Ýtitilkynningar** í **Stillingar**. Á iPhone eða iPad skaltu opna appið af heimaskjánum fyrst. Það er eini staðurinn þar sem tilkynningar virka."
      shot: S19
      shotAlt: "Tilkynningavalmyndin opin með lista yfir nýlega virkni í hópnum"
options:
  heading: "Hvernig á að bæta því við, tæki fyrir tæki"
  items:
    - title: "iPhone og iPad"
      body: "Ýttu á Deila-hnappinn, ferning með ör sem vísar upp. Ef þú sérð hann ekki skaltu fyrst ýta á punktana þrjá (•••) og síðan á Deila. Skrunaðu niður og ýttu á **Bæta við heimaskjá**. Hafðu kveikt á **Opna sem vefforrit** og ýttu síðan á **Bæta við**. Ef tengill opnaðist inni í öðru forriti skaltu opna síðuna fyrst í Safari, því innbyggði vafrinn getur ekki bætt henni við."
    - title: "Android"
      body: "Opnaðu valmynd vafrans og veldu **Bæta við heimaskjá** eða **Setja upp forrit**."
    - title: "Chrome eða Edge í tölvu"
      body: "Opnaðu valmynd vafrans og veldu valkostinn til að setja þessa vefsíðu upp sem forrit. Hún fær þá sinn eigin glugga og sitt eigið tákn."
    - title: "Safari á Mac"
      body: "Veldu **Skrá** og síðan **Bæta við Dock**."
sections:
  - heading: "Tilkynningar, aðeins ef þú biður um þær"
    body: "Ýtitilkynningar eru valfrjálsar. Kveiktu á þeim og þú færð tilkynningu þegar ný virkni er í hópunum þínum, eins og þegar einhver bætir við útgjaldi, skrifar athugasemd eða skráir greiðslu. Kveikt er á þeim eitt tæki í einu, úr tilkynningabjöllunni eða úr **Stillingar**, og þar geturðu slökkt á þeim aftur. Þær krefjast vafra sem styður þær og leyfis frá þér. Ef vafrinn hefur lokað á þær fyrir vefsvæðið skaltu leyfa þær fyrst í stillingum vafrans. Á iPhone eða iPad virka þær aðeins úr appinu sem hefur verið bætt við heimaskjáinn, ekki úr vafraflipa. Afhending er ekki tryggð, svo líttu á tilkynningu sem létta ábendingu, ekki loforð. Um það sem birtist í virkninni, sjá [skipuleggja saman](page:feature/plan-together)."
  - heading: "Uppfærslur jafnóðum, enginn endurhleðsluhnappur"
    body: "Bættu við útgjaldi og allir sjá það strax, ásamt því hvað breyttist og hver breytti því. Hver hópur heldur utan um virknisögu og tilkynningabjallan sýnir virkni í öllum hópunum þínum. Enginn þarf að spyrja hvort þú hafir séð það sem þú varst að bæta við. Það er á skjánum hjá þeim."
  - heading: "39 tungumál, hver og einn með sitt"
    body: "Notaðu Side Badger á 39 tungumálum, þar á meðal arabísku, persnesku og úrdú sem eru skrifuð frá hægri til vinstri. Hver og einn í hópnum velur sitt eigið, svo sama hópsíðan getur verið á arabísku fyrir einn og ensku fyrir þann næsta. Það eina sem hópurinn þarf að vera sammála um eru tölurnar."
  - heading: "Gert fyrir fleiri en eina tegund notenda"
    body: "Side Badger er hannað með lyklaborðs- og skjálesaranotendur í huga. Litum meðlima fylgja mynstur, svo þú þarft ekki að greina grænt frá rauðu."
    items:
      - "Tenglar sem sleppa yfir valmyndir, svo lyklaborðsnotendur komist beint í efnið."
      - "Gluggar stýra fókus lyklaborðsins."
      - "Stjórntæki eru merkt, fyrir skjálesara."
      - "Útlit snýst við fyrir tungumál sem eru skrifuð frá hægri til vinstri."
limits:
  heading: "Það sem vefforritið gerir ekki"
  items:
    - "Það er engin ónettengd notkun. Side Badger þarf tengingu, svo það opnar ekki hópinn þinn í flugvél án wifi."
    - "Það er ekkert app í appverslun og ekkert innbyggt iPhone- eða Android-app. Side Badger er vefforrit og að bæta því við heimaskjáinn eða Dock-ið er leiðin til að fá útgáfuna sem er eins og app."
    - "Hvort hægt sé að bæta því við heimaskjá eða Dock fer eftir vafranum þínum. Heiti valmynda eru mismunandi eftir vöfrum og útgáfum og sumir vafrar bjóða ekki upp á það."
    - "Ýtitilkynningar eru valfrjálsar á hverju tæki og krefjast vafra sem styður þær og leyfis frá þér. Á iPhone eða iPad virka þær aðeins úr appinu sem hefur verið bætt við heimaskjáinn. Afhending er ekki tryggð."
    - "Það eru engar tilkynningar með tölvupósti eða SMS og engar greiðsluáminningar. Ný virkni birtist í appinu, og sem ýtitilkynningar ef þú kveikir á þeim. Að elta greiðslu er enn á þinni könnu."
    - "Virkni er geymd í 90 daga."
    - "Þú skráir þig inn með netfangi og lykilorði. Það er engin innskráning með Google eða Apple og þú þarft að vera 18 ára eða eldri."
    - "Við fullyrðum ekki að Side Badger sé fullkomlega aðgengilegt eða uppfylli formlegan aðgengisstaðal. Ef eitthvað stendur í vegi fyrir þér skaltu láta okkur vita úr appinu sjálfu og þú sérð svarið okkar þar."
useCasesHeading: "Þar sem gagnlegt er að þurfa ekki app"
faq:
  heading: "Spurningar"
  items:
    - q: "Er Side Badger app í appverslun?"
      a: "Nei. Side Badger er vefforrit. Þú opnar það í vafranum þínum og getur bætt því við heimaskjáinn eða Dock-ið svo það opnist eins og app. Það er ekkert til að sækja í appverslun."
    - q: "Get ég skipt reikningum án þess að sækja app?"
      a: "Já. Opnaðu Side Badger í vafra í símanum eða tölvunni, skráðu þig inn og byrjaðu hóp. Það er valfrjálst að bæta því við heimaskjáinn eða Dock-ið."
    - q: "Virkar það án nettengingar?"
      a: "Nei. Side Badger þarf tengingu, jafnvel þegar það er á heimaskjánum eða í Dock-inu."
    - q: "Af hverju fæ ég ekki tilkynningar á iPhone?"
      a: "Á iPhone eða iPad virka tilkynningar aðeins úr appinu sem hefur verið bætt við heimaskjáinn, ekki úr vafraflipa. Bættu því við, opnaðu það með tákninu á heimaskjánum og kveiktu svo á tilkynningum í **Stillingar**. Afhending er ekki tryggð, svo ef ein týnist sýnir virknisaga hópsins samt hvað var bætt við."
    - q: "Þarf ég að kveikja á tilkynningum?"
      a: "Nei. Slökkt er á þeim þar til þú kveikir á þeim, eitt tæki í einu. Án þeirra birtist ný virkni samt í appinu og allir sjá breytingu strax þegar þeir eru með appið opið."
    - q: "Þurfa allir í hópnum aðgang?"
      a: "Já. Allt sem þarf er netfang og lykilorð, og þú staðfestir netfangið áður en þú getur bætt einhverju við. Allir sem ganga í hóp gera það sama, í hvaða síma eða tölvu sem þeim hentar."
