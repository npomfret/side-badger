meta:
  title: "Side Badger fyrir meðleigjendur, ferðalög og veislur"
  description: "Skiptu kostnaði með meðleigjendum, í hópferðum og fyrir veislur, brúðkaup og hópgjafir. Sjáðu hvað Side Badger gerir fyrir hverja tegund hóps."
h1: "Side Badger fyrir þinn hóp"
navLabel: "Notkunardæmi"
lead: "Meðleigjendur, frí, gæsapartí. Veldu þitt kaos og sjáðu svo hvernig hópur eins og þinn heldur utan um sitt."
intro: "Hver hópur skiptir kostnaði aðeins öðruvísi. Þessar síður fylgja **raunhæfu dæmi** frá fyrsta útgjaldinu til síðustu skráðu greiðslunnar, með útreikningunum sýndum, svo þú sjáir hvað þinn eigin hópur myndi enda með."
cta:
  heading: "Fannstu þína tegund hóps?"
  body: "Stofnaðu aðgang, byrjaðu hóp og bættu við fyrsta útgjaldinu. Það tekur nokkrar mínútur."
  button: "Stofna ókeypis aðgang"
cardsHeading: "Veldu aðstæðurnar sem líkjast þínum mest"
sections:
  - heading: "Hópferðir"
    body: "Flug í pundum, orlofshús í evrum og kvöldverður sem aðeins þrír borðuðu. Stilltu hópinn á að umreikna í pund og fjórir vinir í Lissabon enda með þrjár greiðslur, í stað sex þegar gjaldmiðlarnir eru hafðir aðskildir. [Skiptu kostnaði við hópferð](page:use-case/group-trips)."
  - heading: "Meðleigjendur"
    body: "Einn borgar leigusalanum, annar man eftir rafmagnsreikningnum og enginn er sammála um hver keypti klósettpappírinn. Með leigunni skipt eftir stærð herbergja og öðrum reikningum skiptum jafnt enda fjórir meðleigjendur mánuðinn með þrjár greiðslur, allar til þess sem borgaði leiguna. [Skiptu heimilisreikningum með meðleigjendum](page:use-case/housemates)."
  - heading: "Veislur, brúðkaup og hópgjafir"
    body: "Sex manns kjósa um gjöfina, einn kaupir hana og ekki allir leggja jafnmikið til. Gjöf upp á £150 skipt eftir nákvæmum upphæðum skilur eftir fimm greiðslur til þess sem keypti hana, £120 alls. [Skiptu kostnaði við viðburð](page:use-case/events-and-celebrations)."
  - heading: "Pör"
    body: "Deildu leiðinlega kostnaðinum án þess að breyta stefnumótakvöldinu í ársfjórðungslegan fjármálafund. Leiga skipt 60/40 og matvörur skiptar jafnt jafnast út í eina greiðslu á milli ykkar tveggja."
  - heading: "Sjáðu fyrst hvernig þetta virkar"
    body: "Öll dæmin hér að ofan nota sömu skrefin, frá því að stofna hóp til þess að skrá greiðslurnar. [Hvernig þetta virkar](page:how-it-works) leiðir þig í gegnum þau og [verðskráin](page:pricing) segir hvað þetta kostar, sem er ekkert, án auglýsinga og án daglegra takmarka."
faq:
  heading: "Spurningar"
  items:
    - q: "Þurfa allir í hópnum aðgang?"
      a: "Já. Fólk gengur í hópinn með tengli eða QR-kóða og ókeypis aðgangi."
    - q: "Getur Side Badger innheimt peningana?"
      a: "Nei. Þið borgið eins og ykkur hentar og skráið svo greiðsluna svo staðan haldist rétt."
    - q: "Þarf ég að velja eina tegund hóps?"
      a: "Nei. Notkunardæmin eru dæmi, ekki stillingar. Allir hópar hafa sömu eiginleika, svo notaðu það sem passar."
