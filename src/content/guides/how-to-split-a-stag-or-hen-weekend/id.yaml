faq:
  heading: "Pertanyaan"
  items:
    - q: "Apakah pendamping utama pengantin membayar lebih banyak?"
      a: "Hanya jika grup sepakat. Aplikasi tidak memberi siapa pun peran khusus dalam hitungan. Jika seseorang menanggung lebih banyak, pilih **Jumlah pasti** atau **Persentase** di bawah **Cara membagi** dan masukkan bagian yang sudah disepakati."
    - q: "Bagaimana dengan minuman yang tidak diminum sebagian orang?"
      a: "Tambahkan minumannya sebagai pengeluaran tersendiri dan centang hanya orang yang meminumnya. Jika setiap orang berbeda jumlahnya, pilih **Jumlah pasti** dan ketik bagian tiap orang. Tak ada yang membayar untuk apa yang tidak ia minum."
    - q: "Bisakah tamu kehormatan melihat grup nanti?"
      a: "Bisa, setelah kejutannya usai. Undang dia, lalu admin bisa menjadikannya **Pengamat** di bawah **Keamanan & Izin** di pengaturan grup. Pengamat melihat semuanya dan tidak mengubah apa pun, jadi tunggu sampai tak ada lagi yang jadi rahasia. Dia perlu akun gratis untuk bergabung."
