faq:
  heading: "Spørgsmål"
  items:
    - q: "Hvilken valutakurs bruger Side Badger?"
      a: "En aktuel valutakurs, hentet når du indtaster udgiften, hvor der findes en. Du kan ændre den til den kurs, du faktisk fik."
    - q: "Kan gruppen holde sig til pund og yen?"
      a: "Ja. Slå **Begræns valutaer for denne gruppe** til under **Valutaindstillinger** i gruppens **Indstillinger**, vælg de **Tilladte valutaer**, og sæt **Standardvaluta for nye udgifter**. Færre valg på listen giver færre forkerte gæt ved kassen."
    - q: "Skal vi overhovedet omregne?"
      a: "Nej. Valutaerne forbliver adskilt, medmindre du eller din gruppe vælger at omregne, og hver valuta får sin egen korte liste over betalinger."
