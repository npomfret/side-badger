faq:
  heading: "Întrebări"
  items:
    - q: "Să folosim venitul brut sau net?"
      a: "Hotărăște grupul. Venitul net e des folosit, pentru că sunt banii pe care îi ai de fapt de cheltuit. Venitul brut ignoră faptul că impozitul, contribuțiile la pensie și ratele creditelor iau sume diferite din venituri diferite. Oricare ai alege, folosește aceeași măsură pentru amândoi."
    - q: "Vede Side Badger veniturile noastre?"
      a: "Nu. Introduci doar procente, niciodată salarii. Procentele le văd membrii grupului, iar pentru un cuplu sunteți voi doi."
    - q: "Putem seta 62/38 o singură dată pentru tot?"
      a: "Împărțirea se setează pe cheltuială, nu pe grup. Copiază o cheltuială care are deja 62 și 38, apoi schimbă ce diferă. [Împărțirea cheltuielilor](page:feature/split-expenses) explică celelalte opțiuni."
