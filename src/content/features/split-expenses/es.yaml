sections:
  - heading: Solo las personas que estuvieron
    body: Divide un gasto entre todos, o solo entre quienes lo compartieron. Deja fuera a la gente de los gastos en los que no participó y los saldos lo reflejarán. El compañero de piso que estuvo fuera toda la semana no debe nada de la comida para llevar, algo que los [compañeros de piso](page:use-case/housemates) reconocerán como justicia básica.
  - heading: Los detalles que ahorran discusiones después
    items:
      - Pon la **fecha** y una hora opcional. Atajos como hoy, ayer, esta mañana y anoche ahorran algo de escritura.
      - Añade hasta tres **etiquetas** para agrupar gastos, como compra o viajes.
      - Añade el **lugar**. Pega un enlace de mapa y el nombre del lugar se rellena solo.
      - Añade una **nota** con la historia que hay detrás del número, con algo de formato si la historia lo necesita.
      - Usa los **comentarios** para mantener la conversación junto al gasto del que trata, en lugar de en un chat al que nadie vuelve a hacer scroll.
  - heading: Copia, edita y mira qué cambió
    body: Copia el alquiler del mes pasado en lugar de escribirlo otra vez y cambia lo que sea distinto. Si un número estaba mal, edita el gasto. La versión anterior se conserva y la edición aparece en la actividad del grupo, así que nadie cambia un número a escondidas. Lo que cada persona puede editar depende de los permisos del grupo.
  - heading: Cuando algo parece raro
    body: Un grupo puede activar las dudas sobre gastos. Cualquier persona incluida en un gasto puede plantear una duda y explicar por qué, y el gasto queda fuera de los saldos hasta que la persona que preguntó, o un administrador, la cierre. Está desactivado por defecto y un administrador lo activa para el grupo. Encaja con [eventos y celebraciones](page:use-case/events-and-celebrations), donde la señal que nadie recuerda se vuelve de pronto asunto de todos.
limits:
  heading: Límites
  items:
    - Una persona paga cada gasto. Si pagaron dos personas, registra dos gastos.
    - No hay división por artículo ni por partes. Partes iguales, importes exactos y porcentajes es lo que hay.
    - Los porcentajes tienen que sumar 100.
    - Un gasto puede llegar a 999.999,99 en su propia moneda, con los decimales habituales de esa moneda.
    - Los gastos no pueden repetirse solos. Copia el del mes pasado.
    - Las fechas no pueden ser futuras ni de hace más de 10 años.
    - Un gasto en el que participa alguien que ha salido del grupo pasa a ser de solo lectura.
useCasesHeading: Dónde ayuda dividir así
faq:
  heading: Preguntas
  items:
    - q: ¿Pueden pagar dos personas un mismo gasto?
      a: No en un solo gasto. Registra dos, uno por cada pagador, y los saldos salen igual.
    - q: ¿Puedo dividir un recibo por artículo?
      a: No. Una división es a partes iguales, por importes exactos o por porcentaje. Para una cuenta con artículos distintos, introduce lo que debe cada persona como importes exactos.
    - q: ¿Puedo fijar una división por defecto?
      a: No. Copia un gasto anterior para reutilizar su división y cambia lo que sea distinto.
    - q: ¿Pueden repetirse las facturas cada mes?
      a: No. Copia el gasto del mes pasado, lo que lleva unos segundos.
    - q: ¿Quién puede editar un gasto?
      a: Quien permitan los permisos del grupo. Cada edición aparece en la actividad del grupo, así que los cambios nunca son silenciosos.
    - q: ¿Qué pasa con los saldos después?
      a: Se actualizan según llegan los gastos, y [saldar cuentas](page:feature/settle-up) los convierte en una lista corta de pagos. Si un gasto está en otra moneda, consulta [varias monedas](page:feature/multiple-currencies).
