meta:
  title: "मदद और सपोर्ट | Side Badger"
  description: "पासवर्ड भूल गए, लिंक नहीं खुल रहा, पेमेंट गलत रिकॉर्ड हो गया? Side Badger में लोग जहां अटकते हैं उसके छोटे जवाब, और हमसे संपर्क का तरीका।"
h1: "मदद और सपोर्ट, बिना होल्ड म्यूज़िक के"
navLabel: "मदद और सपोर्ट"
lead: "उन चीज़ों के छोटे जवाब जिन पर लोग अटक जाते हैं, भूले हुए पासवर्ड से लेकर ग्रुप को हमेशा के लिए बंद करने तक। हर जवाब उस पेज से जुड़ा है जो और विस्तार से समझाता है। आपका सवाल नहीं मिला? ऐप के अंदर से हमें बताएं, या हमें दो लाइनें लिख भेजें।"
cta:
  heading: "मदद के लिए आए थे, बांटने के लिए रुकेंगे?"
  body: "अभी अकाउंट नहीं है? ग्रुप शुरू करें, लिंक शेयर करें और पहला खर्च जोड़ें। मुफ्त, कोई विज्ञापन नहीं और रोज़ाना की कोई सीमा नहीं।"
groups:
  - heading: "साइन इन"
    items:
      - q: "पासवर्ड भूल गए?"
        a: "यह सबसे अच्छे बिज्जुओं के साथ भी होता है। **साइन इन** स्क्रीन पर **अपना पासवर्ड भूल गए?** चुनें, अपने अकाउंट का ईमेल डालें, फिर हम जो ईमेल भेजते हैं उसके लिंक से नया पासवर्ड चुनें। अकाउंट को और क्या चाहिए, यह [यह कैसे काम करता है](page:how-it-works) में है।"
      - q: "साइन अप तो हो गया, पर कुछ जोड़ा नहीं जा रहा। क्यों?"
        a: "अक्सर वजह यह होती है कि आपका ईमेल अभी वेरिफाई नहीं हुआ है, इसलिए वेरिफिकेशन ईमेल का लिंक खोलें, या नया ईमेल पाने के लिए रिमाइंडर बैनर पर **सत्यापन ईमेल दोबारा भेजें** चुनें। अगर आप वेरिफाई हो चुके हैं, तो हो सकता है ग्रुप लॉक हो या उसकी अनुमतियां आपको जोड़ने न दें, और व्यूअर सब कुछ देखता है पर कुछ बदलता नहीं, जैसा [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) समझाता है।"
      - q: "मैं अपना ईमेल या पासवर्ड कैसे बदलूं?"
        a: "**सेटिंग्स** में **ईमेल बदलें** या **पासवर्ड बदलें** चुनें। दोनों पहले आपका मौजूदा पासवर्ड मांगते हैं, और नए ईमेल पते को उस लिंक से वेरिफाई करना होता है जो हम उसी पते पर भेजते हैं। अकाउंट के बारे में [यह कैसे काम करता है](page:how-it-works) में है।"
      - q: "क्या Google या Apple से साइन इन किया जा सकता है?"
        a: "नहीं। आपको बस एक ईमेल पता और कम से कम 12 अक्षरों का पासवर्ड चाहिए, और अपने फ़ोन या कंप्यूटर पर आप **मुझे याद रखें** पर टिक कर सकते हैं। शुरू करने की बाकी बातें [वेब ऐप](page:feature/web-app) पेज पर हैं।"
  - heading: "ग्रुप में शामिल होना"
    items:
      - q: "किसी ने मुझे इनवाइट लिंक भेजा है। मैं कैसे जुड़ूं?"
        a: "उसे खोलें, फिर साइन इन करें या मुफ्त अकाउंट बनाएं। आपको ग्रुप की एक झलक दिखेगी, वहां वह नाम चुनें जिससे लोग आपको देखेंगे, और **समूह में शामिल हों** दबाएं। अंदर आने का पूरा रास्ता [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) में दिखाया गया है।"
      - q: "“स्वीकृति की प्रतीक्षा है” लिखा आ रहा है। क्या मुझसे कुछ गलत हुआ?"
        a: "बिल्कुल नहीं। इस ग्रुप में हर व्यक्ति को एडमिन अंदर आने देते हैं, इसलिए आपका अनुरोध ग्रुप के एडमिन के पास गया है, और जब तक उनमें से कोई मंज़ूर न करे आप अंदर नहीं देख सकते। आमने-सामने एक प्यार भरी याद दिलाने की छूट है, और मंज़ूरी के बारे में [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) में बताया गया है।"
      - q: "लिंक कहता है कि वह अमान्य है या उसकी समय-सीमा खत्म हो गई है।"
        a: "इनवाइट लिंक उतनी देर चलते हैं जितनी देर बनाने वाले ने चुनी थी, 15 मिनट से लेकर 5 दिन तक। ग्रुप में किसी से नया लिंक मांगें, या अगर आप एक ही कमरे में हैं तो QR कोड। इनवाइट के बारे में [यह कैसे काम करता है](page:how-it-works) में है।"
  - heading: "खर्च"
    items:
      - q: "मैं खर्च कैसे जोड़ूं?"
        a: "ग्रुप खोलें और **व्यय जोड़ें** चुनें। बताएं कि वह क्या था, कितने का था, किसने पेमेंट किया और किसने बांटा, फिर उसे बराबर, सटीक राशि या प्रतिशत से बांटें। हर विकल्प का ब्योरा [खर्च बांटना](page:feature/split-expenses) में है।"
      - q: "क्या किराया हर महीने दोहराया जा सकता है?"
        a: "अपने आप नहीं, क्योंकि दोहराए जाने वाले खर्च नहीं हैं। पिछले महीने का खर्च खोलें और **व्यय कॉपी करें** चुनें, और फॉर्म भरा हुआ आ जाता है, बस नई तारीख और जो बदला है वह डालना बाकी रहता है। कॉपी करने के बारे में और [खर्च बांटना](page:feature/split-expenses) में है।"
      - q: "मैंने गलत राशि डाल दी। क्या ठीक हो सकती है?"
        a: "हाँ। खर्च एडिट करें, बशर्ते ग्रुप की अनुमतियां आपको करने दें और ग्रुप लॉक न हो। पुराना वर्शन भी रखा जाता है, इसलिए क्या बदला इसके लिए किसी को आपकी बात पर भरोसा नहीं करना पड़ता, जैसा [खर्च बांटना](page:feature/split-expenses) समझाता है।"
      - q: "एक खर्च गलत लग रहा है, और वह मेरा नहीं है। अब क्या करें?"
        a: "उस पर **मेरा एक प्रश्न है** चुनें और वजह बताएं, और पूरा खर्च सबके बैलेंस से बाहर रहता है जब तक सवाल उठाने वाला व्यक्ति, या कोई एडमिन, उस सवाल को बंद न कर दे। ऐसा कोई बटन नहीं दिख रहा? सवाल सिर्फ वही लोग उठा सकते हैं जो उस खर्च में शामिल हैं, और पहले किसी एडमिन को ग्रुप की सेटिंग्स में **खर्च संबंधी प्रश्नों की अनुमति दें** चालू करना होता है। बात को सलीके से रखने के तरीके [विवादित खर्च की गाइड](page:guide/what-to-do-when-someone-disputes-a-shared-expense) में हैं।"
  - heading: "पेमेंट"
    items:
      - q: "क्या Side Badger पैसे भेजता है?"
        a: "नहीं, Side Badger कभी पैसे नहीं भेजता, न लेता है। एक-दूसरे को जैसे चाहें पेमेंट करें, बैंक ट्रांसफर, कैश या जो भी चले, फिर पेमेंट रिकॉर्ड करें ताकि बैलेंस अपडेट हो जाएं। [ग्रुप ट्रिप के बाद हिसाब कैसे चुकता करें](page:guide/how-to-settle-up-after-a-group-trip) में शुरू से आखिर तक पूरा तरीका है।"
      - q: "मैं पेमेंट कैसे रिकॉर्ड करूं?"
        a: "ग्रुप में **हिसाब बराबर करें** चुनें, बताएं किसने पेमेंट किया और किसे मिला, राशि डालें या **त्वरित निपटान** बटन से उसे भरवा लें, और **भुगतान रिकॉर्ड करें** चुनें। सिर्फ एक हिस्सा दिया? जितना दिया गया उतना रिकॉर्ड करें और बाकी बैलेंस पर रहता है, जैसा [हिसाब चुकता करना](page:feature/settle-up) समझाता है।"
      - q: "मैंने पेमेंट गलत रिकॉर्ड कर दिया। क्या ठीक हो सकता है?"
        a: "जिसने उसे रिकॉर्ड किया वह ग्रुप के **भुगतान** इतिहास से उसे एडिट कर सकता है, और वह या कोई एडमिन उसे हटा सकता है, जिससे वह बैलेंस से निकल जाता है। जिस पेमेंट में कोई ऐसा व्यक्ति शामिल है जो बाद में ग्रुप छोड़ चुका है, उसे एडिट नहीं किया जा सकता। इतिहास के बारे में [हिसाब चुकता करना](page:feature/settle-up) में है।"
  - heading: "सूचनाएं और होम स्क्रीन"
    items:
      - q: "मैं सूचनाएं कैसे चालू करूं?"
        a: "**सेटिंग्स** में **पुश सूचनाएं** चालू करें और जब ब्राउज़र पूछे तो उन्हें अनुमति दें। अगर ब्राउज़र उन्हें पहले ही ब्लॉक कर चुका है, तो पहले उसकी अपनी सेटिंग्स में अनुमति दें। हर डिवाइस पर अलग से चालू करना होता है और सूचना पहुंचने की गारंटी नहीं है, इसलिए सूचना को इशारा मानें, वादा नहीं, जैसा [वेब ऐप](page:feature/web-app) पेज समझाता है।"
      - q: "मेरे iPhone पर सूचनाएं क्यों नहीं आतीं?"
        a: "iPhone या iPad पर वे सिर्फ होम स्क्रीन में जोड़े गए ऐप में चलती हैं, ब्राउज़र टैब में कभी नहीं। उसे जोड़ें, होम स्क्रीन के आइकन से खोलें, फिर **सेटिंग्स** में उन्हें चालू करें। वे किस बारे में बताती हैं, यह [साथ मिलकर प्लान करें](page:feature/plan-together) में दिखाया गया है।"
      - q: "क्या डाउनलोड करने के लिए कोई ऐप है?"
        a: "ऐप स्टोर से नहीं, क्योंकि Side Badger आपके ब्राउज़र में चलता है। साइन इन करें, फिर **सेटिंग्स** में **होम स्क्रीन या Dock में जोड़ें** के कदम अपनाएं, और वह ऐप की तरह अपनी अलग विंडो में खुलता है। हर डिवाइस के कदम [वेब ऐप](page:feature/web-app) पेज पर हैं।"
  - heading: "ग्रुप छोड़ना, संग्रहीत करना, लॉक करना और बंद करना"
    items:
      - q: "मैं ग्रुप कैसे छोड़ूं?"
        a: "हिसाब चुकता करें, फिर **समूह छोड़ें** चुनें। आप तब नहीं छोड़ सकते जब आपको एक भी करेंसी में पैसे देने या पाने बाकी हों, जब आप जिस खर्च में शामिल हैं उस पर कोई सवाल खुला हो, या जब आप आखिरी एडमिन या अकेले सदस्य हों, और वापस आने के लिए नया इनवाइट चाहिए। ब्योरा [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) में है।"
      - q: "पुराने ग्रुप को अपने डैशबोर्ड से कैसे हटाऊं?"
        a: "**समूह संग्रहीत करें** चुनें। वह आपके डैशबोर्ड से हट जाता है, किसी और के नहीं, आप उसे अब भी खोल और इस्तेमाल कर सकते हैं, और **समूह पुनर्स्थापित करें** उसे वापस ले आता है। संग्रहीत करने, लॉक करने और बंद करने की तुलना [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) में है।"
      - q: "ट्रिप खत्म हो गई। क्या हम संख्याओं को बदलने से रोक सकते हैं?"
        a: "हाँ। एडमिन ग्रुप की सेटिंग्स में **समूह लॉक करें** चालू कर सकता है, और जब तक कोई एडमिन उसे अनलॉक न करे, कोई खर्च जोड़ या एडिट नहीं कर सकता, नए पेमेंट रिकॉर्ड नहीं कर सकता, और सूचियां या पोल नहीं बदल सकता। सब लोग ग्रुप और उसकी हिस्ट्री अब भी पढ़ सकते हैं, और देर से आई कोई टैक्सी चुपके से नहीं घुसती, जैसा [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) समझाता है।"
      - q: "क्या मैं ग्रुप डिलीट कर सकता हूँ?"
        a: "एडमिन उसे **समूह बंद करें** से बंद कर सकता है, पुष्टि के लिए ग्रुप का नाम टाइप करने के बाद। बंद करना स्थायी है और ग्रुप को सबके लिए पहुंच से बाहर कर देता है, इसलिए अगर आप बस उसे नज़र से हटाना चाहते हैं, तो उसकी जगह उसे संग्रहीत करें। बारीक शर्तें [ग्रुप और अनुमतियां](page:feature/groups-and-permissions) में हैं।"
contact:
  heading: "अब भी अटके हैं?"
  items:
    - q: "कोई बग मिला, या कुछ बदलवाना चाहते हैं?"
      a: "ऐप के अंदर से हमें बताएं। अपने अकाउंट मेन्यू में **प्रतिक्रिया** चुनें, फिर **प्रतिक्रिया भेजें**, और **समस्या रिपोर्ट**, **मदद का अनुरोध** या **फ़ीचर अनुरोध** में से एक चुनें। काम आए तो स्क्रीनशॉट जोड़ें, और जब हम जवाब देंगे वह आपको उसी थ्रेड में मिलेगा।"
    - q: "ईमेल करना पसंद करेंगे?"
      a: "नीचे दिए पते पर लिखें। बताएं कि यह किस ग्रुप के बारे में है, आपने क्या किया और आप क्या होने की उम्मीद कर रहे थे। भड़ास निकालना ठीक है; पासवर्ड नहीं, इसलिए अपना पासवर्ड कभी न भेजें।"
