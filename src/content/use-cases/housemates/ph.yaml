faq:
  heading: Mga tanong
  items:
    - q: Puwede bang kusang umulit ang upa?
      a: Hindi, walang umuulit na bayarin. Kopyahin ang upa noong nakaraang buwan sa ilang tap, baguhin ang petsa, at tapos na.
    - q: Puwede ba kaming maghati ayon sa laki ng kuwarto?
      a: Oo, ayon sa porsyento. Bigyan ang bawat housemate ng bahaging sumasalamin sa kuwarto niya, basta umabot sa 100 ang kabuuan. Tinatalakay ng [paghahati ng gastos](page:feature/split-expenses) ang iba pang paraan ng paghahati.
    - q: Paano kung may housemate na lumipat na may utang?
      a: Hindi siya makakaalis sa grupo hangga't hindi pa siya nakakapag-settle, dahil walang makakaalis habang may utang o may sisingilin pa. Nananatiling tapat ang mga numero hanggang quits na ang lahat.
    - q: Binabayaran ba ng Side Badger ang mga bayarin?
      a: Hindi. Nagbibilang lang ito at nagmumungkahi ng maikling listahan ng mga bayad. Magbayaran kayo sa paraang gusto ninyo, saka itala, gaya ng ipinaliliwanag ng [settle up](page:feature/settle-up).
    - q: Puwede bang may isang housemate na mag-asikaso ng pera?
      a: Oo. Gawin siyang admin at gumamit ng pinamamahalaang grupo, kung saan kailangan ng pag-apruba ang mga bagong miyembro at tanging mga creator at admin lang ang makakapagbago ng mga gastos.
