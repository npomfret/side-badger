sections:
  - heading: "کارهایی که Splitwise خوب انجام می‌دهد"
    body: "اگر گروه شما به برنامه بومی، کار آفلاین یا پرداخت داخل برنامه نیاز دارد، Splitwise انتخاب معقول است، و ترجیح می‌دهیم آن را انتخاب کنید تا اینکه بعداً بفهمید. صفحه‌های خودش این‌ها را فهرست می‌کنند:"
    items:
      - "**برنامه‌ها و کار آفلاین.** برنامه‌های iPhone و Android در کنار وب، و حالت آفلاین."
      - "**روش‌های بیشتر برای تقسیم.** تقسیم بر اساس سهم، تعدیل و تقسیم قلم‌به‌قلم، علاوه بر مساوی، دقیق و درصدی."
      - "**هزینه‌های تکراری.** اجاره را روی تکرار بگذارید و فراموشش کنید."
      - "**پرداخت داخل برنامه.** در برخی کشورها می‌تواند پول را هم جابه‌جا کند، از طریق Splitwise Pay، Venmo، PayPal یا Pay by Bank."
  - heading: "اینجا رایگان، آنجا پولی"
    body: "Splitwise Pro طرح پولی Splitwise است و صفحه Pro خودش چهار چیز می‌فروشد که در Side Badger هزینه‌ای ندارند."
    items:
      - "**اسکن رسید.** Splitwise Pro از عکس رسید شما اسکن می‌گیرد. Side Badger آن را رایگان و بدون اعتبار اسکن انجام می‌دهد: جمع کل، تاریخ و مکان را برای بررسی شما پر می‌کند. تصاویر رسید توسط سرویس هوش مصنوعی Google خوانده می‌شوند."
      - "**تبدیل ارز.** Splitwise Pro وقتی روی Convert بزنید هزینه‌های یک گروه را به ارز پیش‌فرض شما تبدیل می‌کند. Side Badger هر هزینه را همان موقع ورود تبدیل می‌کند، با یک نرخ تبدیل روز یا نرخی که واقعاً گرفته‌اید، و مبلغ اصلی روی هزینه می‌ماند."
      - "**بدون تبلیغات.** Splitwise تجربه‌ای کاملاً بدون تبلیغات را یکی از امکانات Pro می‌شمارد. Side Badger تبلیغات ندارد."
      - "**بدون محدودیت روزانه.** Splitwise Pro هزینه نامحدود می‌فروشد و مرکز راهنمای خودش می‌گوید کاربران رایگان هر روز می‌توانند تا 4 هزینه اضافه کنند. Side Badger محدودیت روزانه ندارد."
  - heading: "آنچه Splitwise دارد و Side Badger ندارد"
    body: "این همه امکانات Splitwise نیست، فقط آن‌هایی است که معمولاً تصمیم را می‌گیرند. فهرست کامل در صفحه‌های خود Splitwise هست. اینجا جاهایی است که Side Badger کم می‌آورد."
    items:
      - "**برنامه‌های بومی.** Side Badger در مرورگر شما کار می‌کند. وارد شوید و بعد آن را به صفحه اصلی اضافه کنید تا مثل یک برنامه باز شود."
      - "**حالت آفلاین.** Side Badger به اتصال نیاز دارد."
      - "**پرداخت داخل برنامه.** Side Badger هرگز به پول شما دست نمی‌زند. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را ثبت کنید."
      - "**هزینه‌های تکراری.** Side Badger ندارد. به‌جای تایپ دوباره، اجاره ماه قبل را کپی کنید."
      - "**تقسیم بر اساس سهم یا قلم.** Side Badger برای هر هزینه یک پرداخت‌کننده دارد، که مساوی، با مبلغ دقیق یا با درصد تقسیم می‌شود. اسکن رسیدش قلم‌ها را به افراد اختصاص نمی‌دهد."
      - "**نمودارها و تقسیم‌های پیش‌فرض.** Splitwise Pro هر دو را دارد. Side Badger حساب اینکه چه کسی به چه کسی بدهکار است را نگه می‌دارد، و همه ترفند همین است."
  - heading: "انتقال گروه‌تان به اینجا"
    body: "ابزار وارد کردن اطلاعات وجود ندارد، پس انتقال یعنی شروعی تازه. اول در Splitwise تسویه کنید، بعد در Side Badger یک گروه بسازید و همه را با لینک یا کد QR دعوت کنید. هر عضو گروه به یک حساب رایگان نیاز دارد و برای ثبت‌نام فقط یک نشانی ایمیل لازم است."
