meta:
  title: グループ旅行のあとで精算する方法 | Side Badger
  description: みんなが散らばる前に精算しましょう。絡み合った10件の貸し借りが4回の支払いになり、記録は届くたびに、一部支払いもOK。友だち5人の計算つきです。
h1: グループ旅行のあとで精算する方法
navLabel: 旅行後の精算
lead: みんなが散らばる前に精算しましょう。最後の支出を追加し、グループの残高を開いて、短いリストをもとに、借りている分を好きな方法で支払います。そのあとSide Badgerで各支払いを記録すれば、グループ全員の残高が消えます。友だち5人と5つの支出なら、絡み合った10件の貸し借りが4回の支払いに収まります。
cta:
  heading: 写真が届く前に、帳簿を閉じよう
  body: 無料アカウントを作成し、次の旅行のグループを始めて、費用はその都度追加しましょう。空港に着くころには、短い支払いリストができあがっています。先に[精算の仕組み](page:feature/settle-up)を見たい方は、こちらをどうぞ。
sections:
  - heading: 友だち5人、支出5つ、出発ロビー1つ
    body: Mo、Ines、Raf、Tess、Umaの5人は、海岸で1週間を過ごしました。Moがアパートを予約して食料品を買い、Inesがボートツアーの代金を払い、Rafが豪華な夕食を払いました。TessはUmaとMoと一緒に空港のタクシーに乗りました。InesとRafは電車だったからです。Umaのカードは家に置いてきたので、何も払っていません。支出は5つ、合計€1,700で、出発ロビーでは、誰が多めに払っているのか誰にも言えませんでした。
  - heading: 10件の貸し借りが、4回の支払いに
    body: アパート、ボートツアー、夕食、食料品は5人で均等に分けます。1人あたり€200、€50、€60、€18で、InesとRafの負担はそれぞれ€328です。タクシーは3人で分け、1人€20なので、Mo、Tess、Umaの負担は€348です。Moは€1,090を支払い、負担は€348なので、差し引きで€742を受け取る側になります。ほかの全員は、負担より支払った額が少なくなっています。不足額はUmaが€348、Tessが€288、Inesが€78、Rafが€28で、合計するとMoの€742になります。2人ずつ直接精算すると、10件の貸し借りが別々に残ります。Side Badgerは代わりに、すべてMo宛ての4回の支払いを提案します。
  - heading: みんなが散らばる前に精算する
    body: いちばんいいタイミングは最後の夜か帰り道で、全員がまだ同じ場所にいて、€28の貸し借りも切り出しやすいときです。まず、タクシーを含めてすべての支出を追加します。債務や債権が残っている間は誰もグループを退出できないので、どのみちどこかで精算を締める必要があります。
    items:
      - "**リストを確認する。** グループを開いて**残高**を見ます。初期設定では、自分に関係する債務が表示されます。**すべて表示**を選ぶと、グループ全体のリストが見られます。"
      - "**好きな方法で支払う。** 銀行振込、現金、前回の休暇で貸したままの恩返し。Side Badgerがお金を動かすことはありません。"
      - "**記録する。** **精算する**を選びます。**クイック精算**の下にある各ボタンは、自分に提案された支払いの1つで、選ぶと金額が自動で入力されます。「銀行振込」などの**メモ**を追加し、**日付**（未来の日付にはできません）を確認して、**精算を記録**を選びます。"
      - "**残高が消えるのを見届ける。** 残高は全員の画面で更新されます。最後の支払いが入ると、**残高**に「**すべて精算済みです！**」と表示されます。"
  - heading: 今は一部、残りはあとで
    body: Umaは今夜€200を送り、残りは月末に払うこともできます。Umaが€200を記録すると、フォームは、そのあともMoに€148を借りたままになると警告します。€348から€200を引いた額です。保存すると、残りを記録するまで€148がUmaの残高に残ります。警告は逆方向にも働きます。うっかり0が1つ増えて€348が€3,480になると、フォームは、UmaがMoに借りているのは€348だけで、保存すると逆方向の借金ができてしまうと知らせます。保存する前に、0を直しましょう。
  - heading: 間違いの修正と、支払いのお祝い
    items:
      - "**間違った支払い。** 支払いを編集できるのは、記録した本人だけです。削除できるのは本人かグループの管理者で、削除したあとは、もう一度記録し直せます。"
      - "**目に留めたい支払い。** 記録された支払いはすべて、日付とメモとともに**精算**に並び、グループの全員が見てリアクションできます。Umaの最後の€148が届いたら、Moは**お祝い**を選べます。"
      - "**おしまい。** すべての残高がゼロになったら、管理者がグループをロックして、数字を動かないようにできます。"
  - heading: ここでSide Badgerにできないこと
    items:
      - お金を動かすことは決してありません。支払いリンクも支払いリクエストもないので、アプリ内の支払いは、別の場所で行った支払いの記録です。
      - リマインダーは送りません。遅れている支払いの催促は、引き続きご自身で行ってください。
      - 期限は設定しません。Umaの残り€148をいつまでに払うかは、グループで決めてください。
      - 提案される支払いは短いリストであり、可能な限り最短であることの保証ではありません。通貨ごとに計算されるので、ユーロとポンドで支払った旅行には、それぞれのリストができます。
