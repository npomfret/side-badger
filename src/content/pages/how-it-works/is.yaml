meta:
  title: "Hvernig Side Badger virkar | Skiptu hópkostnaði í fimm skrefum"
  description: "Stofnaðu hóp, bjóddu fólki, bættu við útgjöldum og gerðu upp. Sjáðu hvað gerist á milli „einhver borgaði“ og „við erum kvitt“, með útreiknuðu dæmi."
h1: "Hvernig Side Badger virkar"
navLabel: "Hvernig þetta virkar"
lead: "Hvað gerist á milli „einhver borgaði“ og „við erum kvitt“? Fimm skref, enginn töflureiknir og einn greifingi sem er að mestu til skrauts. Hér er öll leiðin, frá fyrsta hópnum til síðustu skráðu greiðslunnar. Nánari upplýsingar um hvert skref eru í [skiptingu útgjalda](page:feature/split-expenses) og [uppgjöri](page:feature/settle-up)."
cta:
  heading: "Frá „ég tek þennan“ til „við erum kvitt“"
  body: "Stofnaðu ókeypis aðgang, byrjaðu hóp og bættu við fyrsta útgjaldinu. Greifinginn dæmir ekki kvittunina."
  button: "Stofna ókeypis aðgang"
steps:
  - title: "Stofnaðu hóp"
    body: "Búðu til einn hóp fyrir hvert heimili, hverja ferð og hvern viðburð, svo leigan endi aldrei á sama lista og brúðkaupsgjöfin. Gefðu hópnum nafn, veldu nafnið sem fólk sér þig undir og, ef þú vilt, takmarkaðu hvaða gjaldmiðla hann tekur við. Á stjórnborðinu sérðu síðan alla hópana, og hvar þú stendur í hverjum þeirra, á einum skjá."
    shot: S02
    shotAlt: "Gluggi til að stofna hóp með opnum hluta um takmörkun gjaldmiðla"
  - title: "Bjóddu fólkinu þínu"
    body: "Deildu boðstengli eða sýndu QR-kóða og veldu hve lengi hann gildir, frá 15 mínútum upp í 5 daga. Allir sem ganga í hópinn þurfa ókeypis aðgang og staðfest netfang, og í hópi geta verið allt að 50 manns. Ef þú vilt velja hverjir koma inn skaltu kveikja á samþykki og þá hleypir stjórnandi hverjum og einum inn."
    shot: S03
    shotAlt: "Boðsglugginn á tengilsflipanum með QR-kóða og valkostum fyrir gildistíma"
  - title: "Bættu við útgjöldum um leið og þau verða til"
    body: "Segðu hver greiddi, hversu mikið og fyrir hverja það var. Skiptu jafnt, eftir nákvæmum upphæðum eða í prósentum, og slepptu þeim sem voru ekki með. Bættu útgjaldinu við og allir sjá það strax, ásamt því hvað breyttist og hver breytti því."
    shot: S05
    shotAlt: "Útgjaldaeyðublað með prósentuskiptingu sem skiptir leigunni eftir stærð herbergja"
  - title: "Fylgstu með stöðunni"
    body: "Side Badger heldur utan um stöðuna í hverjum gjaldmiðli, svo þú sérð í fljótu bragði hver skuldar hverjum. Í stað þess að láta alla greiða úr flækju smáskulda leggur það til stuttan lista yfir greiðslur sem gerir upp við hópinn."
    shot: S10
    shotAlt: "Stöðuskjár með einfölduðum skuldum í tveimur gjaldmiðlum og kveikt á Sýna allt"
  - title: "Gerðu upp utan appsins, skráðu það inni í því"
    body: "Side Badger flytur aldrei peninga. Borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna svo staðan uppfærist, og skjár allra uppfærist án þess að endurhlaða. „Gert upp“ þýðir einfaldlega að staðan sé núll. Enginn getur yfirgefið hóp á meðan hann skuldar eða á inni pening, svo þeir sem stefna á dyrnar gera upp fyrst."
    shot: S11
    shotAlt: "Greiðslueyðublað með hnöppum fyrir fljótlegt uppgjör og tilkynningu um hlutagreiðslu"
requirements:
  heading: "Það sem þú þarft"
  items:
    - "Ókeypis aðgang. Allt sem þarf er netfang og lykilorð, og þú staðfestir netfangið áður en þú getur bætt einhverju við."
    - "Að vera 18 ára eða eldri."
    - "Nútímalegan vafra í síma eða tölvu og nettengingu. Side Badger er ekki app úr appverslun og virkar ekki án nettengingar."
    - "Valfrjálst: stað á heimaskjánum. Engin appverslun nauðsynleg: skráðu þig inn og bættu svo Side Badger við heimaskjáinn eða Dock-ið og það opnast eins og app. Stillingar í appinu sýna þér hvernig."
