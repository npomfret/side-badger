faq:
  heading: "Otázky"
  items:
    - q: "Co je spravedlivější, velikost pokoje, nebo příjem?"
      a: "Ani jedno není spravedlivější vždycky. Velikost pokoje se hodí pro spolubydlící, kteří platí za prostor, ve kterém spí. Příjem se hodí pro páry a přátele s velmi odlišným výdělkem. Domluvte se před prvním dnem placení nájmu, ne po něm."
    - q: "Mají se účty dělit stejně?"
      a: "U spolubydlících obvykle ne. Energie a internet využívají všichni, takže rovnoměrné dělení je jednodušší, jako v příkladu. Při dělení podle příjmu kalkulačka dá účtům stejné podíly jako nájmu."
    - q: "Mohu použít čtvereční stopy?"
      a: "Ano. Zvolte ft² a zadejte plochy ve čtverečních stopách. Jednotka je jen popisek a podíly vyjdou stejně, pokud všichni použijí tutéž."
    - q: "Je kalkulačka zdarma?"
      a: "Ano. Zdarma. Bez reklam. Bez denních limitů. Nepotřebujete ani účet."
