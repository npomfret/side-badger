faq:
  heading: "Maswali"
  items:
    - q: "Je, mpambe mkuu au mpambe wa bibi harusi analipa zaidi?"
      a: "Ni kama kikundi kinakubali tu. Programu haimpi mtu yeyote jukumu maalum kwenye hesabu. Kama mtu anagharimia zaidi, chagua **Kiasi halisi** au **Asilimia** chini ya **Jinsi ya kugawanya** na uweke sehemu mlizokubaliana."
    - q: "Vipi kuhusu vinywaji ambavyo baadhi ya watu hawakunywa?"
      a: "Ongeza vinywaji kama gharama yake yenyewe na uweke tiki kwa watu walivyokunywa tu. Kama kila mtu alikunywa kiasi tofauti, chagua **Kiasi halisi** na uandike sehemu ya kila mtu. Hakuna anayelipia asichokunywa."
    - q: "Je, mgeni rasmi anaweza kuona kikundi baadaye?"
      a: "Ndiyo, siri ikiisha. Mwalike, kisha msimamizi anaweza kumfanya **Mtazamaji** chini ya **Usalama** kwenye mipangilio ya kikundi. Mtazamaji anaona kila kitu na habadilishi chochote, kwa hivyo subiri hadi hakuna kitu cha siri. Anahitaji akaunti ya bure kujiunga."
