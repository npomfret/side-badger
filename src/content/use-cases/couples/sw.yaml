featuresHeading: "Vipengele wanavyotumia wapenzi"
faq:
  heading: "Maswali"
  items:
    - q: "Je, tunaweza kuweka 60/40 mara moja kwa kila kitu?"
      a: "Hapana. Mgawanyo ni wa kila gharama. Weka asilimia kwenye ya kwanza, kisha nakili wakati ujao na ubadilishe kilicho tofauti. [Kugawanya gharama](page:feature/split-expenses) kunaeleza njia zote tatu za kugawanya."
    - q: "Je, inaunganishwa na benki yetu?"
      a: "Hapana. Side Badger haigusi pesa zenu kamwe. Mnalipana mtakavyo, kisha mnarekodi, kama [kumaliza hesabu](page:feature/settle-up) kunavyoeleza."
    - q: "Je, mtu mwingine anaweza kuona kikundi chetu?"
      a: "Wanachama wake tu, na kikundi cha wapenzi kina wawili. Yeyote anayetumia kiungo cha mwaliko kilicho hai anaweza kujiunga, kwa hivyo mshirikishe mtu mmoja na uweke muda mfupi wa kuisha."
    - q: "Je, kila mmoja wetu akilipa sehemu ya bili hiyo hiyo?"
      a: "Gharama ina mlipaji mmoja. Rekodini gharama mbili, moja kwa kila mmoja wenu, na salio linatoka vile vile."
    - q: "Je, itamkumbusha mwenzi wangu kulipa?"
      a: "Hapana. Hakuna vikumbusho, kwa hivyo kumkumbusha bado ni kazi yako. Angalau wote wawili mtakuwa mnaangalia nambari ile ile."
    - q: "Nini kinatokea tukiacha kushiriki gharama?"
      a: "Maliza salio na urekodi malipo, ili hakuna anayedaiwa chochote. Kisha msimamizi anaweza kufunga kikundi, kinachoweka nambari kama zilivyo, au kukifunga kabisa, kinachokifanya kisifikike kwa kila mtu. Kifunge kabisa tu wakati hakuna mmoja wenu anayehitaji historia."
