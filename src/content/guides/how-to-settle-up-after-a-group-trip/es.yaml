faq:
  heading: Preguntas
  items:
    - q: ¿Quién debería registrar un pago, quien paga o quien cobra?
      a: Registrar un pago requiere permiso para editar gastos, y el formulario pregunta **¿Quién pagó?** y **¿Quién recibió el pago?** Solo quien lo registró puede editarlo después, así que normalmente es más sencillo que lo haga quien paga, con el botón de liquidación rápida.
    - q: ¿Y si el viaje fue en dos monedas?
      a: Los saldos se llevan por moneda, así que una deuda en euros sigue siendo una deuda en euros y cada moneda tiene su propia lista corta, salvo que los gastos se convirtieran al introducirlos. [Varias monedas](page:guide/how-to-split-a-trip-paid-in-several-currencies) muestra las dos maneras.
    - q: ¿Hay que saldar durante el viaje o al final?
      a: Vale cualquiera de los dos. Cada pago registrado cambia los saldos, así que un pago hecho a mitad de viaje cuenta para la lista final. Al final es más sencillo, porque [todo el viaje](page:use-case/group-trips) está en un solo sitio.
