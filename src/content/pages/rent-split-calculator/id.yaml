meta:
  title: "Kalkulator bagi sewa: luas kamar atau penghasilan | Side Badger"
  description: "Kamar lebih luas, bagian lebih besar? Hitung bayaran tiap teman serumah menurut ukuran kamar atau penghasilan. Di peramban: tak ada yang disimpan atau dikirim."
h1: "Kalkulator bagi sewa"
navLabel: "Kalkulator bagi sewa"
lead: "Kamar tidur lebih besar, bagian lebih besar? Masukkan sewanya dan lihat berapa yang dibayar tiap orang, menurut ukuran kamar atau penghasilan, sampai ke sen. Kalkulator ini berjalan di peramban Anda, tidak menyimpan apa pun, dan tidak memindahkan uang. Saat rumah ingin hitungannya tersimpan, [bagi pengeluaran](page:feature/split-expenses) di Side Badger dan salin sewanya tiap bulan."
cta:
  heading: "Tetapkan persentasenya sekali. Salin selamanya."
  body: "Kalkulator ini melupakan semuanya saat tab ditutup, persis seperti teman serumah yang yakin sekali sudah membayar tagihan internet. Grup di Side Badger menyimpan sewa, tagihan, dan siapa yang sudah membayar apa. Gratis, tanpa iklan, tanpa batas harian."
sections:
  - heading: "Dua cara membagi sewa"
    items:
      - "**Menurut ukuran kamar.** Sebagian sewa membayar dapur, kamar mandi, dan ruang tamu, yang dipakai semua orang. Anda yang menentukan bagian itu (awalnya 40%) dan bagian itu dibagi rata. Sisanya menurut luas kamar tidur, sehingga kamar besar membayar lebih dan kamar sempit mendapat diskon yang pantas didapatnya."
      - "**Menurut penghasilan.** Setiap orang membayar bagian sewa yang setara dengan bagiannya dari total penghasilan. Tambahkan tagihan bersama dan tagihan itu mengikuti bagian yang sama."
  - heading: "Cara hitungannya bekerja"
    body: "Setiap orang mendapat bagian persis, lalu persentase bulat, karena bilangan bulat lebih mudah diketik dan lebih mudah diperdebatkan. Pembulatannya memakai metode sisa terbesar: setiap orang mendapat bilangan bulat di bawah bagiannya, dan poin yang tersisa diberikan kepada yang kehilangan paling banyak. Persentasenya selalu berjumlah 100. Di apartemen di bawah, 40% bersama itu menjadi 13,33% per orang. Kamar Priya 16 dari 38 m² apartemen itu, jadi 60% × 16/38 adalah 25,26%, ditambah 13,33% menjadi 38,6%, yang dibulatkan menjadi 39%. Tom dan Aisha mendapat 32% dan 29%, dan 39 + 32 + 29 adalah 100. Setiap jumlah adalah persentase itu dari sewa: 39% dari £1.950 adalah £760,50."
  - heading: "Lalu ketik di Side Badger"
    body: "Untuk cerita lengkapnya, termasuk meteran, lihat [cara membagi sewa menurut ukuran kamar](page:guide/how-to-split-rent-by-room-size), atau, bagi pasangan, [pasangan yang berpenghasilan lebih besar](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
    items:
      - "**Tambahkan sewanya.** Di grup Anda, pilih **Tambah Pengeluaran**, pilih siapa yang membayar pemilik rumah di bawah **Siapa yang membayar?**, dan biarkan semua orang tetap terpilih di bawah **Dibagi antara**."
      - "**Pilih Persentase.** Di bawah **Cara membagi**, pilih **Persentase** dan ketik persentase bulatnya. Formulir akan menandainya jika totalnya bukan 100."
      - "**Salin bulan depan.** Buka sewa bulan lalu dan pilih **Salin pengeluaran**. Pembagiannya ikut tersalin."
  - heading: "Yang tidak dilakukan kalkulator ini"
    items:
      - "**Mengukur kamar Anda.** Luas lantai hanyalah titik awal. Kamar dengan kamar mandi dalam lebih berharga daripada kamar seluas itu tanpanya, dan kamar sempit yang cuma muat satu kasur dan satu kursi penuh harap bernilai lebih rendah."
      - "**Menentukan apa yang dihitung sebagai penghasilan.** Gaji bersih atau kotor, gaji tetap atau kerja sampingan: grup yang memutuskan. Pakai periode yang sama untuk semua orang."
      - "**Menyimpan apa pun.** Tutup tab dan angkanya hilang. Untuk menyimpannya, salin tautannya. Tautan itu memuat angka Anda setelah tanda #, yang tidak pernah dikirim peramban ke server, dan siapa pun yang memilikinya bisa membacanya."
      - "**Memindahkan uang.** Anda membayar pemilik rumah dengan cara apa pun yang disuka."
      - "**Mencampur mata uang, atau melewati batas.** Pilih satu mata uang. Kalkulator menerima 2 sampai 10 orang dan sewa hingga 999.999,99, seperti di aplikasi."
