faq:
  heading: "Запитання"
  items:
    - q: "Чи платить більше шафер або свідок чи свідкиня?"
      a: "Лише якщо група погодилася. Застосунок не дає нікому особливої ролі в розрахунках. Якщо хтось покриває більше, оберіть у полі **Як розділити** варіант **Точні суми** або **Відсоток** і введіть частки, про які ви домовилися."
    - q: "А що з напоями, яких дехто не пив?"
      a: "Додайте напої окремою витратою й позначте лише тих, хто їх пив. Якщо кожен випив різну кількість, оберіть **Точні суми** й уведіть частку кожного. Ніхто не платить за те, чого не мав."
    - q: "Чи може герой події пізніше бачити групу?"
      a: "Так, коли сюрприз закінчиться. Запросіть його, тоді адміністратор може призначити його **Глядачем** у розділі **Безпека та дозволи** в налаштуваннях групи. Глядач бачить усе й нічого не змінює, тож зачекайте, доки не лишиться таємниць. Для приєднання потрібен безкоштовний обліковий запис."
