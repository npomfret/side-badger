meta:
  title: "Side Badger ar gyfer cyd-letywyr, teithiau a phartïon"
  description: "Rhannu costau gyda chyd-letywyr, ar deithiau grŵp, ac ar gyfer partïon, priodasau ac anrhegion grŵp. Gweld beth mae Side Badger yn ei wneud ar gyfer pob math o grŵp."
h1: "Side Badger ar gyfer eich math chi o grŵp"
navLabel: "Achosion defnydd"
lead: "Cyd-letywyr, gwyliau, nosweithiau stag a phlu. Dewiswch eich anhrefn, yna gweld sut mae grŵp tebyg i'ch un chi yn cadw cyfrif."
intro: "Mae pob grŵp yn rhannu costau ychydig yn wahanol. Mae'r tudalennau hyn yn dilyn **sefyllfa realistig** o'r gost gyntaf i'r taliad olaf a gofnodwyd, gyda'r symiau wedi'u dangos, fel y gallwch weld beth fyddai eich grŵp eich hun yn ei gael."
cta:
  heading: "Wedi dod o hyd i'ch math chi o grŵp?"
  body: "Creu cyfrif, cychwyn grŵp ac ychwanegu'r gost gyntaf. Mae'n cymryd ychydig funudau."
cardsHeading: "Dewiswch y sefyllfa agosaf at eich un chi"
sections:
  - heading: "Teithiau grŵp"
    body: "Hediadau mewn punnoedd, fila mewn ewros a swper y bu dim ond tri yn ei fwyta. Gosodwch y grŵp i drosi i bunnoedd a bydd pedwar ffrind yn Lisbon yn gorffen gyda thri thaliad, yn lle chwech pan gedwir yr arian cyfred ar wahân. [Rhannu costau taith grŵp](page:use-case/group-trips)."
  - heading: "Cyd-letywyr"
    body: "Mae un person yn talu'r landlord, un arall yn cofio'r bil ynni, ac nid oes neb yn cytuno pwy brynodd y papur toiled. Gyda'r rhent wedi'i rannu yn ôl maint ystafell a'r biliau eraill wedi'u rhannu'n gyfartal, mae pedwar cyd-letywr yn gorffen y mis gyda thri thaliad, i gyd i'r un a dalodd y rhent. [Rhannu biliau'r cartref gyda chyd-letywyr](page:use-case/housemates)."
  - heading: "Partïon, priodasau ac anrhegion grŵp"
    body: "Mae chwech o bobl yn pleidleisio ar yr anrheg, mae un yn ei phrynu, ac nid yw pawb yn cyfrannu'r un swm. Mae anrheg £150 wedi'i rhannu yn ôl symiau union yn gadael pum taliad i'r sawl a'i prynodd, £120 i gyd. [Rhannu costau digwyddiad](page:use-case/events-and-celebrations)."
  - heading: "Cyplau"
    body: "Rhannwch y costau diflas heb droi noson ddêt yn adolygiad ariannol chwarterol. Mae rhent wedi'i rannu 60/40 a nwyddau wedi'u rhannu'n gyfartal yn netio i lawr i un taliad rhwng y ddau ohonoch. [Rhannu costau fel cwpl](page:use-case/couples)."
  - heading: "Gweld sut mae'n gweithio yn gyntaf"
    body: "Mae pob enghraifft uchod yn defnyddio'r un camau, o greu grŵp i gofnodi'r taliadau. Mae [sut mae'n gweithio](page:how-it-works) yn eu cerdded drwodd, mae'r [canllawiau](page:guides) yn gweithio drwy un sefyllfa ddyrys yr un, ac mae [prisiau](page:pricing) yn dweud beth mae'n ei gostio, sef dim, heb hysbysebion a heb gyfyngiadau dyddiol."
faq:
  heading: "Cwestiynau"
  items:
    - q: "Oes angen cyfrif ar bawb yn y grŵp?"
      a: "Oes. Mae pobl yn ymuno gyda dolen neu god QR a chyfrif am ddim."
    - q: "All Side Badger gasglu'r arian?"
      a: "Na. Rydych chi'n talu sut bynnag y dymunwch, yna'n cofnodi'r taliad fel bod y balansau'n aros yn gywir."
    - q: "Oes rhaid i mi ddewis un math o grŵp?"
      a: "Nac oes. Enghreifftiau yw'r achosion defnydd, nid gosodiadau. Mae gan bob grŵp yr un nodweddion, felly defnyddiwch pa gyfuniad bynnag sy'n addas."
