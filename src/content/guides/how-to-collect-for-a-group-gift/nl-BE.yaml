meta:
  title: "Geld inzamelen voor een groepscadeau | Side Badger"
  description: "Iedereen legt een ander bedrag bij en één bankkaart krijgt de klap. Hou een budgetpeiling, voer exacte bedragen in en laat Side Badger de sommen maken."
h1: "Zo zamel je geld in voor een groepscadeau"
navLabel: "Inzamelen voor een cadeau"
lead: "Bij een groepscadeau schiet één persoon het geld voor en zijn de anderen die persoon hun bijdrage schuldig. Spreek met een peiling een budget af, laat de koper het cadeau op de eigen kaart zetten en voer het dan in als één uitgave met [exacte bedragen](page:feature/split-expenses), een bedrag per persoon. Side Badger toont wie de koper wat schuldig is, en iedereen stuurt zijn of haar deel door zoals het hem of haar past."
cta:
  heading: "Een omhaling zonder hoed"
  body: "Maak een groep, laat de persoon die het cadeau krijgt erbuiten en voer het cadeau in met exacte bedragen. Side Badger is gratis, zonder advertenties en zonder dagelijkse limieten. Wil je eerst de rondleiding? Bekijk [zo werkt het](page:how-it-works) of [wat gratis inhoudt](page:pricing)."
sections:
  - heading: "Vier vrienden, één platenspeler, vier verschillende bedragen"
    body: "Bea wordt 30 en wil een platenspeler. Priya, Omar, Lena en Sam kopen er een voor haar. Priya vindt er een voor £ 240 en koopt hem met haar eigen kaart, want iemand moet de eerste zijn. De vier leggen niet evenveel in. Priya en Omar leggen elk £ 60 in, Lena £ 80 en Sam £ 40. Niemand legt zijn of haar bedrag uit en niemand vraagt ernaar. Omar koopt ook een wenskaart en inpakpapier voor £ 12. Alle vier ondertekenen de wenskaart, dus die wordt gelijk verdeeld."
  - heading: "Spreek het budget af voor iemand op Kopen klikt"
    body: "Een budgetpeiling bespaart je de ruzie over een draaitafel van £ 400. Kies in de groep **Poll toevoegen** en vraag hoeveel het cadeau mag kosten. Maak van de opties bedragen, zoals tot £ 150, tot £ 200 en tot £ 250. Zet **Anoniem stemmen** aan, dat verbergt wie op wat gestemd heeft, zodat niemand hardop een lager bedrag moet verdedigen. De instellingen van de peiling kunnen niet meer veranderen zodra de eerste stem binnen is, dus controleer ze eerst. Een peiling sluit niet vanzelf. Kies, als iedereen gestemd heeft, **Poll sluiten** en de **Winnaar** verschijnt. De peiling bepaalt het totaal. Ze bepaalt niemands aandeel."
  - heading: "De telling lezen"
    body: "Het cadeau wordt verdeeld in £ 60, £ 60, £ 80 en £ 40, samen de £ 240 op het bonnetje. De wenskaart en het inpakpapier worden in vier gedeeld, £ 3 per persoon. Priya’s rekening is £ 60 + £ 3, dus £ 63, en zij betaalde £ 240, waardoor ze £ 177 tegoed heeft. Omars rekening is ook £ 63, maar hij betaalde £ 12, dus hij is £ 51 schuldig. Lena is £ 80 + £ 3 schuldig, dat is £ 83, en Sam is £ 40 + £ 3 schuldig, dat is £ 43. Die drie samen zijn goed voor Priya’s £ 177. Zonder ingrijpen zouden de schulden in vijf richtingen door de groep lopen. Side Badger stelt in plaats daarvan drie betalingen voor, allemaal aan Priya. [Afrekenen](page:feature/settle-up) geeft de details."
  - heading: "Zet het in Side Badger"
    body: "Priya’s deel duurt ongeveer vijf minuten."
    items:
      - "**Maak de groep.** Kies op het overzicht **Groep aanmaken**. Kies **Anderen uitnodigen** en stuur de link of QR-code naar de mensen die bijdragen, en naar niemand anders."
      - "**Voeg het cadeau toe.** Kies **Uitgave toevoegen**, beschrijf het, voer 240 in en kies onder **Wie heeft betaald?** Priya. Laat alle vier staan onder **Verdelen tussen**, kies dan onder **Hoe te verdelen** voor **Exacte bedragen** en typ 60, 60, 80 en 40. De bedragen moeten samen 240 zijn. Voeg de orderbevestiging toe als je wilt. Kies **Uitgave opslaan**."
      - "**Voeg de wenskaart toe.** Omar voegt de £ 12 zelf toe, kiest zichzelf onder **Wie heeft betaald?** en laat **Hoe te verdelen** op **Gelijk** staan, met alle vier de mensen aangevinkt."
      - "**Tel, en betaal dan.** Iedereen bekijkt de **Saldi**, die tonen wie wie iets schuldig is, en stuurt Priya zijn of haar deel door, op de manier die hem of haar past. Registreer het daarna via **Vereffenen** en **Vereffening registreren**. Snelle vereffening vult het bedrag in."
  - heading: "Eerst kopen, of eerst inzamelen"
    body: "Side Badger beheert de pot niet, dus “inzamelen” betekent eigenlijk tellen. Twee volgordes werken."
    items:
      - "**Eerst kopen.** De koper betaalt, voegt de uitgave toe tegen de echte prijs en iedereen ziet meteen zijn of haar deel. Dat is netter, maar de koper draagt de kost tot mensen betalen, dus kies een koper die dat kan."
      - "**Eerst inzamelen.** Mensen sturen hun bedrag naar de koper vóór de aankoop. Zodra je de prijs hebt, voer je het cadeau in en registreer je elke betaling met de datum waarop het geld echt verschoof. Voeg het cadeau eerst toe, zodat elke betaling een saldo heeft waarop ze terechtkomt."
      - "**De prijs verandert.** Levering, een kortingscode, een late prijsstijging. Bewerk het cadeau en pas de exacte bedragen aan zodat het totaal nog klopt. De vorige versie blijft bewaard, maar zeg het de groep eerst, want hun saldi veranderen."
  - heading: "Hou Bea erbuiten"
    body: "Enkel leden van een groep kunnen ze zien, dus Bea kan geen groep zien waar ze niet in zit. Nodig de mensen uit die bijdragen en niemand anders. Een link werkt tot hij vervalt, en je kunt alles kiezen van 15 minuten tot 5 dagen, dus kies een korte en stuur hem waar Bea hem niet ziet. De link toont een voorbeeld van de groep aan wie hem opent, dus geef de groep een saaie naam, zoals Zaterdagpot, en hou Bea’s naam ook uit de omschrijvingen van uitgaven en de opties van de peiling."
  - heading: "Wat Side Badger hier niet doet"
    items:
      - "Het bewaart of int het geld niet. Bijdragen gaan naar de koper via bankoverschrijving, cash of wat jullie ook gebruiken, en dan registreert iemand ze."
      - "Het stuurt geen betalingsherinneringen. Wie niet betaald heeft een por geven blijft mensenwerk."
      - "Het berekent niemands aandeel. Een peiling bepaalt het budget en er is geen optie “verdeel wat overblijft”, dus je typt elk bedrag zelf in."
      - "Elke uitgave heeft één betaler. Kochten twee mensen verschillende delen van het cadeau, voer dan twee uitgaven in."
      - "Iedereen in de verdeling heeft een gratis account en een plek in de groep nodig."
