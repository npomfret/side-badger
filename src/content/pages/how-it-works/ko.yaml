meta:
  title: "사이드 배저 사용 방법 | 다섯 단계로 그룹 지출 나누기"
  description: "그룹을 만들고, 사람들을 초대하고, 지출을 추가하고, 정산하세요. 누군가 결제한 순간부터 서로 정산이 끝날 때까지 어떤 일이 일어나는지 예시와 함께 확인해 보세요."
h1: "사이드 배저 사용 방법"
navLabel: "사용 방법"
lead: "“누가 결제했다”에서 “이제 깔끔하게 정산됐다”까지 무슨 일이 일어날까요? 다섯 단계, 스프레드시트는 없고, 장식에 가까운 오소리 한 마리뿐입니다. 첫 그룹부터 마지막 결제 기록까지 전체 과정을 소개합니다. 각 단계의 자세한 내용은 [지출 나누기](page:feature/split-expenses)와 [정산하기](page:feature/settle-up)를 확인하세요."
cta:
  heading: "“이번엔 내가 낼게”에서 “이제 깔끔하게 정산”까지"
  body: "무료 계정을 만들고, 그룹을 시작하고, 첫 지출을 추가하세요. 오소리는 영수증을 보고 뭐라 하지 않아요."
  button: "무료 계정 만들기"
steps:
  - title: "그룹 만들기"
    body: "집, 여행, 행사마다 그룹을 하나씩 만들어서 월세가 결혼 선물과 같은 목록에 섞이지 않게 하세요. 이름을 정하고, 다른 사람에게 보일 내 이름을 고르고, 원하면 사용할 수 있는 통화를 제한할 수도 있어요. 그러면 대시보드 한 화면에서 모든 그룹과 각 그룹에서 내 상태를 볼 수 있습니다."
    shot: S02
    shotAlt: "통화 제한 섹션이 열려 있는 그룹 만들기 대화상자"
  - title: "사람들 초대하기"
    body: "참여 링크를 공유하거나 QR 코드를 보여 주고, 링크 유효 기간을 15분부터 최대 5일까지 정하세요. 참여하는 모든 사람은 무료 계정과 인증된 이메일이 필요하며, 한 그룹에는 최대 50명까지 들어올 수 있어요. 들어오는 사람을 직접 확인하고 싶다면 승인 기능을 켜면, 관리자가 한 명씩 허용합니다."
    shot: S03
    shotAlt: "QR 코드와 만료 시간 선택지가 보이는 링크 탭의 초대 대화상자"
  - title: "지출이 생길 때마다 추가하기"
    body: "누가 얼마를 결제했고 누구를 위한 것이었는지 입력하세요. 똑같이, 정확한 금액으로, 또는 비율로 나누고, 해당 지출에 참여하지 않은 사람은 빼면 됩니다. 지출을 추가하면 모두가 바로 확인할 수 있고, 무엇이 바뀌었는지, 누가 바꿨는지도 함께 볼 수 있어요."
    shot: S05
    shotAlt: "월세를 방 크기에 따라 비율로 나눈 지출 양식"
  - title: "잔액 확인하기"
    body: "사이드 배저는 통화마다 현재 잔액을 계속 기록하므로 누가 누구에게 얼마를 줘야 하는지 한눈에 볼 수 있어요. 작은 빚이 얽힌 그물을 각자 풀게 하는 대신, 그룹을 정산해 주는 짧은 결제 목록을 제안합니다."
    shot: S10
    shotAlt: "두 가지 통화로 간소화된 빚이 표시되고 ‘모두 보기’가 켜진 잔액 화면"
  - title: "앱 밖에서 정산하고, 앱 안에서 기록하기"
    body: "사이드 배저는 돈을 직접 옮기지 않습니다. 원하는 방법으로 서로 지불한 다음 결제를 기록하면 잔액이 맞춰지고, 새로고침 없이도 모두의 화면이 업데이트돼요. ‘정산’은 잔액이 0이 되었다는 뜻일 뿐입니다. 아직 줄 돈이나 받을 돈이 있으면 그룹을 나갈 수 없으므로, 떠나려는 사람은 먼저 정산해야 해요."
    shot: S11
    shotAlt: "빠른 정산 버튼과 일부 결제 안내가 보이는 결제 양식"
requirements:
  heading: "준비할 것"
  items:
    - "무료 계정. 이메일 주소와 비밀번호만 있으면 되고, 무언가를 추가하기 전에 이메일을 인증해야 합니다."
    - "만 18세 이상."
    - "휴대폰이나 컴퓨터의 최신 브라우저와 인터넷 연결. 사이드 배저는 앱 스토어 앱이 아니며 오프라인에서는 작동하지 않습니다."
    - "원한다면 홈 화면 바로가기. 앱 스토어는 필요 없어요. 사이드 배저를 홈 화면이나 독에 추가하면 앱처럼 열립니다."
