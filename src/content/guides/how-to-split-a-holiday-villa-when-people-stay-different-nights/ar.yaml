meta:
  title: "قسّم الفيلا حين يقيم الناس ليالي مختلفة | Side Badger"
  description: "ديف جاء ثلاث ليالٍ فقط، فلماذا يدفع عن ست؟ قسّم فيلا العطلة بحسب الليالي التي أقام فيها كل شخص فعلاً، والحسابات جاهزة."
h1: "كيف تقسّم فيلا العطلة حين يقيم الناس ليالي مختلفة"
navLabel: "تقسيم الفيلا بحسب الليالي"
lead: "سعّر الإقامة لكل شخص عن كل ليلة، واضرب في عدد ليالي كل شخص، وأدخل الفيلا **مصروفاً واحداً بمبالغ دقيقة**. يحتفظ Side Badger بالحساب ويقترح قائمة قصيرة من الدفعات حين يحين وقت التسوية."
cta:
  heading: "امنح الفيلا مصروفاً واحداً مرتباً"
  body: "أنشئ مجموعة، وادعُ الجميع برابط أو رمز QR، وأدخل الفيلا بمبالغ دقيقة. يحتفظ Side Badger بالحساب الجاري بينما تنصرفون إلى العطلة."
sections:
  - heading: "ست ليالٍ، وأربعة أشخاص، وبطاقة ائتمان واحدة"
    body: "تبدأ [رحلة المجموعة](page:use-case/group-trips) عادةً ببطاقة شخص واحد. وهنا هي بطاقة آنا. تحجز فيلا لست ليالٍ بمبلغ €2,100، لأن على أحدهم أن يبدأ. تقيم آنا وبن وكلوي الليالي الست كلها. أما ديف فلا يستطيع الانضمام إلا للثلاث الأخيرة، ويأتي بالقطار. يستأجر بن سيارة لا يركبها ديف أبداً. ويقوم ديف بتسوق البقالة الكبير. تقسيم الفيلا على أربعة هو الخطوة الأوضح، لكنه يجعل ديف يدفع عن ثلاث ليالٍ قضاها في بيته، وهذه الأمور لا تُنسى بل تعود إلى الظهور في أول لقاء عائلي. أما التقسيم بحسب الليالي فيجنّب الجدال، والحساب لا يستغرق أكثر من دقيقة."
  - heading: "سعّر ليلة-شخص واحدة"
    body: "ليلة-شخص هي إقامة شخص واحد ليلة واحدة. تكلفة الفيلا هي ما هي، فوزّع السعر على كل ليالي-الأشخاص، ثم أعطِ كل شخص الليالي التي استخدمها."
    items:
      - "**عدّ ليالي-الأشخاص.** تقيم آنا وبن وكلوي ست ليالٍ لكل منهم، ويقيم ديف ثلاثاً: 6 + 6 + 6 + 3 = 21."
      - "**سعّر واحدة.** €2,100 ÷ 21 = €100 لكل ليلة-شخص."
      - "**اضرب في ليالي كل شخص.** تدفع آنا وبن وكلوي 6 × €100 = €600 لكل منهم. ويدفع ديف 3 × €100 = €300."
      - "**تحقق من المجموع.** €600 + €600 + €600 + €300 = €2,100. وإذا لم يساوِ مجموع الحصص السعر، فهناك ليلة ناقصة أو محسوبة مرتين."
  - heading: "أدخلها في Side Badger"
    body: "أنشئ مجموعة، وادعُ الثلاثة الآخرين برابط أو رمز QR، ثم أضف التكاليف. الفيلا أولاً."
    items:
      - "اختر **إضافة مصروف**. صِفه، وأدخل 2,100، واجعل **من دفع؟** آنا."
      - "تحت **تقسيم بين**، تأكد أن الأشخاص الأربعة جميعاً موجودون."
      - "تحت **كيفية التقسيم**، اختر **مبالغ دقيقة**. اكتب 600 لآنا وبن وكلوي و300 لديف. يجب أن يساوي مجموع المبالغ الإجمالي."
      - "اختر **حفظ المصروف**."
      - "أضف استئجار السيارة بالطريقة نفسها. الدافع بن، والتقسيم **بالتساوي**، ويُستبعد ديف لأنه جاء بالقطار. يشرح [تقسيم المصروفات](page:feature/split-expenses) الطرق الأخرى لتقسيم التكلفة."
      - "أضف البقالة. الدافع ديف، والتقسيم **بالتساوي**، والأربعة جميعاً فيه."
  - heading: "اقرأ النتيجة، ثم سوِّ الحساب"
    body: "فاتورة كل شخص هي حصته من الفيلا زائد حصته من السيارة والتسوق. تبلغ حصة آنا وبن وكلوي €725 لكل منهم، أي €600 + €80 + €45. وتبلغ حصة ديف €345، أي €300 + €45. اطرح ما دفعه كل شخص فتظهر الأرصدة. دفعت آنا €2,100، فمستحق لها €1,375. دفع بن €240 ويدين بمبلغ €485. دفع ديف €180 ويدين بمبلغ €165. لم تدفع كلوي شيئاً وتدين بمبلغ €725. لو تُركت هذه الديون على حالها لدارت في ستة اتجاهات داخل المجموعة. أما Side Badger فيقترح بدلاً من ذلك ثلاث دفعات، كلها إلى آنا. ادفعوا لها بالطريقة التي تناسبكم، ثم اختاروا **تسوية** واستخدموا **تسجيل تسوية** لكل دفعة، لتلحق الأرصدة بالواقع. وتملأ أزرار التسوية السريعة المبلغ. وتجد المزيد عن [تسوية الحسابات](page:feature/settle-up)."
  - heading: "حين لا يكون سعر الفيلا واحداً مرتباً"
    items:
      - "**الغرف مختلفة.** إذا كان الجناح أغلى من الغرفة الصغيرة، فاتفقوا أولاً على تكلفة كل غرفة، ثم أجروا حسابات ليالي-الأشخاص غرفة غرفة. أدخلوا الفيلا مصروفاً واحداً بإجمالي كل شخص، أو مصروفاً لكل غرفة. وفي الحالتين يجب أن يساوي مجموع المبالغ الدقيقة في المصروف إجماليه."
      - "**عربون دُفع قبل شهور.** من دفعه يحصل على مصروف خاص به، بتاريخ اليوم الذي دفع فيه. قسّمه بحسب الليالي بالنسب نفسها التي يُقسَّم بها المبلغ المتبقي."
      - "**الحجز بعملة أخرى.** أدخل الفيلا بالعملة التي دفعت بها. وإذا كانت المجموعة تحوّل أولاً بأول، فاستخدم سعر صرف حالي، أو اكتب السعر الذي حصلت عليه فعلاً. يبقى المبلغ الأصلي مع المصروف. وتجد التفاصيل في [العملات المتعددة](page:feature/multiple-currencies)."
      - "**ليالٍ جزئية.** شخص يصل عند منتصف الليل، وآخر يغادر قبل الفطور. اتفقوا على قاعدة واحدة لعدّ الليالي وطبّقوها على الجميع."
  - heading: "ما لا يفعله Side Badger هنا"
    items:
      - "لا يعدّ الليالي عنك. لا يوجد تقسيم بحسب الليالي أو بحسب الحصص، فتحسب كل مبلغ كما سبق وتدخل **مبالغ دقيقة**."
      - "لا ينقل المال. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة."
      - "يسمح بدافع واحد لكل مصروف. فإذا دفع شخصان ثمن الفيلا، فأدخل مصروفين."
      - "ليس فيه دخول للضيوف. كل من في المجموعة، ديف أيضاً، يحتاج إلى حساب مجاني."
