  title: "راهنمای تقسیم منصفانه هزینه‌ها | Side Badger"
  description: "راهنماهای عملی برای تقسیم منصفانه اجاره، ویلای تعطیلات و هزینه‌های گروهی، هرکدام با یک گروه واقع‌نما و محاسبه‌هایی که نشان داده شده‌اند."
h1: "راهنماهایی برای تقسیم منصفانه هزینه‌ها"
navLabel: "راهنماها"
lead: "پرسش‌هایی که آدم‌ها درست پیش از باز کردن یک صفحه‌گسترده می‌پرسند، با گروهی که واقعی به نظر می‌رسد، محاسبه‌ها و مرحله‌های داخل برنامه پاسخ داده شده‌اند."
intro: "هر راهنما **یک گروه خیالی** را از اولین هزینه تا آخرین پرداخت ثبت‌شده دنبال می‌کند. عددها برایتان محاسبه شده‌اند و مرحله‌ها از صفحه‌ها با همان نام‌هایی استفاده می‌کنند که برنامه به آن‌ها می‌دهد."
cta:
  heading: "گروهی مثل این دارید؟"
  body: "یک حساب بسازید، گروه را شروع کنید و اولین هزینه را اضافه کنید. محاسبه‌ها برایتان انجام می‌شود."
cardsHeading: "پرسش خودتان را انتخاب کنید"
