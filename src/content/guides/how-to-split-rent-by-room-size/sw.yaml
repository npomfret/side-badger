faq:
  heading: "Maswali"
  items:
    - q: "Je, kama mtu ana chumba kikubwa lakini mwanga mdogo?"
      a: "Eneo la sakafu ni mahali pa kuanzia tu, kwa hivyo kikundi kinaweza kukubaliana kurekebisha. Punguza pointi moja au mbili kwa chumba cheusi, wapatie wengine na uhakikishe asilimia bado zinajumlisha 100. Side Badger inahifadhi mnachokubaliana na haihukumu."
    - q: "Je, bili nazo zigawanywe kwa ukubwa wa chumba?"
      a: "Kwa kawaida hapana. Nishati na intaneti hutumiwa na kila mtu, kwa hivyo mgawanyo wa usawa ni rahisi zaidi, kama kwenye mfano ulio juu. Kama mpangaji mwenza mmoja yuko nyumbani siku nzima, kikundi kinaweza kukubaliana kitu kingine, kama kiasi halisi. [Kugawanya gharama](page:feature/split-expenses) kunaeleza chaguo hizo."
    - q: "Je, tunaweza kubadilisha mgawanyo baadaye?"
      a: "Ndiyo, kwa gharama mpya. Badilisha asilimia unaponakili kodi na miezi ya awali inabaki kama ilivyokuwa. Kusahihisha gharama ya zamani, ihariri ikiwa ruhusa za kikundi zinaruhusu, na uiambie nyumba kwanza, kwa sababu salio hubadilika. Toleo la awali linahifadhiwa."
