meta:
  title: "بل تقسیم کیلکولیٹر: کس کو کس کا دینا ہے | Side Badger"
  description: "کس نے دیا، کس کے ذمے کیا ہے، کون کس کو ادا کرے: سیکنڈوں میں طے۔ برابر، عین رقم یا فیصد سے تقسیم کریں۔ مفت، آپ کے براؤزر میں، نہ کچھ محفوظ نہ کہیں بھیجا۔"
h1: "بل تقسیم کیلکولیٹر"
navLabel: "بل تقسیم کیلکولیٹر"
lead: "لکھ دیں کس نے کس چیز کے پیسے دیے، اور کیلکولیٹر بتا دے گا کس کو کس کا دینا ہے، ساتھ ادائیگیوں کی ایک مختصر فہرست جو سب برابر کر دے۔ یہ آپ کے براؤزر میں چلتا ہے، کچھ محفوظ نہیں کرتا اور رقم منتقل نہیں کرتا۔ اگر آپ کے گروپ کو حساب ٹیب سے آگے بھی چاہیے تو Side Badger میں [اخراجات کی تقسیم](page:feature/split-expenses) اور [حساب برابر کرنا](page:feature/settle-up) یہی حساب کرتے ہیں اور اسے سنبھال کر رکھتے ہیں۔"
cta:
  heading: "حساب پسند آیا؟ تو اسے رکھ لیں۔"
  body: "ٹیب بند کرتے ہی یہ کیلکولیٹر سب بھول جاتا ہے، بالکل اس شخص کی طرح جس نے پچھلی بار یقیناً پیسے دیے تھے۔ Side Badger کا گروپ اخراجات سنبھالتا ہے، سب کا بیلنس اپ ڈیٹ رکھتا ہے اور ادائیگیاں ریکارڈ کرتا ہے۔ یہ مفت ہے، بغیر اشتہارات اور بغیر یومیہ حد کے۔"
sections:
  - heading: "حساب کیسے ہوتا ہے"
    body: "ہر خرچے کے لیے کیلکولیٹر ہر شخص کا حصہ نکالتا ہے۔ آپ اسے ان لوگوں میں جنہیں آپ چنیں برابر، عین رقم یا فیصد کے مطابق بانٹ سکتے ہیں۔ پھر ہر شخص کا بیلنس وہ ہوتا ہے جو اس نے دیا منفی وہ جو اس کے ذمے ہے۔ جمع کا نشان مطلب گروپ نے اسے دینا ہے، اور منفی کا نشان مطلب اس نے گروپ کو دینا ہے۔ بیلنس کا مجموعہ ہمیشہ صفر ہوتا ہے، کیونکہ ایک شخص کا جو لینا ہے وہ دوسروں کے ذمے ہی ہوتا ہے۔"
  - heading: "ادائیگیوں کی فہرست چھوٹی کیوں ہوتی ہے"
    body: "کسی کو ہر رسید الگ الگ چکانے کی ضرورت نہیں۔ جب ہر بیلنس معلوم ہو جائے تو کیلکولیٹر سب سے زیادہ دینے والے کو سب سے زیادہ لینے والے سے ملاتا ہے، ایک ادائیگی میں جتنا ہو سکے نمٹاتا ہے، اور فہرست میں آگے بڑھتا رہتا ہے یہاں تک کہ سب صفر پر آ جائیں۔ بیلنس والے لوگوں کی تعداد سے ایک کم ادائیگیوں سے زیادہ کی اسے کبھی ضرورت نہیں پڑتی، اور بل بہ بل چکانے کے مقابلے میں اکثر کم ہی چاہیے ہوتی ہیں۔ یہ ادائیگیوں کی ایک مختصر فہرست دیتا ہے، اور یہ دعویٰ نہیں کرتا کہ یہی سب سے مختصر ممکنہ فہرست ہے۔"
  - heading: "کیلکولیٹر کیا نہیں کرتا"
    items:
      - "**ایک سے زیادہ کرنسیاں سنبھالنا۔** ایک چنیں اور پورے حساب میں وہی استعمال کریں۔ ایپ ہر کرنسی کا الگ بیلنس رکھتی ہے، اور کسی خرچے کو موجودہ ایکسچینج ریٹ پر تبدیل کر سکتی ہے، جسے آپ بدل سکتے ہیں۔"
      - "**کچھ بھی محفوظ کرنا۔** ٹیب بند کریں تو اعداد ختم۔ انہیں رکھنے کے لیے لنک کاپی کریں۔ اس میں آپ کے اعداد # کے بعد ہوتے ہیں، جو آپ کا براؤزر کبھی سرور کو نہیں بھیجتا، اور جسے بھی آپ بھیجیں وہ انہیں پڑھ سکتا ہے۔"
      - "**رقم منتقل کرنا۔** یہ بتاتا ہے کہ کس کو کس کو ادا کرنا چاہیے۔ آپ ایک دوسرے کو جیسے چاہیں ادا کریں، پھر اگر آپ کا گروپ حساب ایپ میں رکھتا ہے تو ادائیگی وہاں ریکارڈ کریں۔"
      - "**بچا ہوا پیسہ بے ترتیبی سے چننا۔** جب بل برابر تقسیم نہ ہو تو بچے ہوئے پیسے فہرست کے پہلے لوگوں کو جاتے ہیں، تاکہ کل پھر بھی پورا رہے۔ ایپ میں بچا ہوا پیسہ بے ترتیبی سے کسی ایک شخص کو جاتا ہے، اس لیے ہمیشہ وہی نہیں ہوتا۔"
      - "**حدود سے آگے جانا۔** کیلکولیٹر 2 سے 20 لوگ لیتا ہے، اور ایک خرچہ 999,999.99 تک ہو سکتا ہے، جیسا ایپ میں ہے۔"
