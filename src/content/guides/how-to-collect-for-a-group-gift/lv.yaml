meta:
  title: "Kā savākt naudu grupas dāvanai | Side Badger"
  description: "Katrs ieliek citu summu, un trieciens krīt uz viena cilvēka karti. Sarīkojiet aptauju par budžetu, ievadiet precīzas summas, un Side Badger izdarīs aprēķinus."
h1: "Kā savākt naudu grupas dāvanai"
navLabel: "Nauda grupas dāvanai"
lead: "Naudas vākšana grupas dāvanai nozīmē, ka viens cilvēks izliek naudu, un visi pārējie viņam ir parādā savu iemaksu. Vienojieties par budžetu ar aptauju, ļaujiet pircējam samaksāt par dāvanu ar savu karti, tad ievadiet to kā vienu izdevumu ar [precīzām summām](page:feature/split-expenses), skaitli katram cilvēkam. Side Badger parāda, kurš cik ir parādā pircējam, un katrs savu daļu nosūta, kā vēlas."
cta:
  heading: "Laidiet cepuri apkārt, bet bez cepures"
  body: "Izveidojiet grupu, neiekļaujiet tajā cilvēku, kuram dāvana domāta, un ievadiet dāvanu ar precīzām summām. Side Badger ir bez maksas, bez reklāmām un bez dienas ierobežojumiem. Gribat vispirms apskatīties, kā tas notiek? Skatiet [kā tas darbojas](page:how-it-works) vai [ko sedz bezmaksas versija](page:pricing)."
sections:
  - heading: "Četri draugi, viens vinila atskaņotājs, četras dažādas summas"
    body: "Bea svin 30. dzimšanas dienu un grib vinila atskaņotāju. Priya, Omar, Lena un Sam to dāvina viņai. Priya atrod vienu par 240 £ un nopērk to ar savu karti, jo kādam jāsāk pirmajam. Četri neiegulda vienādi. Priya un Omar ieliek pa 60 £, Lena 80 £ un Sam 40 £. Neviens savu summu nepaskaidro, un neviens nejautā. Omar nopērk arī kartiņu un iesaiņojamo papīru par 12 £. Kartiņu paraksta visi četri, tāpēc to sadala vienādi."
  - heading: "Vienojieties par budžetu, pirms kāds nospiež Pirkt"
    body: "Budžeta aptauja ietaupa strīdu par 400 £ vērtu atskaņotāju. Grupā izvēlieties **Pievienot aptauju** un pajautājiet, cik dāvanai jāmaksā. Iespējas izveidojiet kā summas, piemēram, līdz 150 £, līdz 200 £ un līdz 250 £. Ieslēdziet **Anonīma balsošana**, kas paslēpj, kurš par ko nobalsoja, lai nevienam nebūtu skaļi jāaizstāv mazāks skaitlis. Iestatījumus pēc pirmās balss vairs nevar mainīt, tāpēc vispirms tos pārbaudiet. Aptauja neaizveras pati. Kad visi ir nobalsojuši, izvēlieties **Aizvērt aptauju**, un parādās **Uzvarētājs**. Aptauja vienojas par kopsummu. Tā nenosaka, cik jāmaksā katram."
  - heading: "Kā sanāk rēķins"
    body: "Dāvana sadalās 60 £, 60 £, 80 £ un 40 £, kas kopā dod 240 £ no čeka. Kartiņa un papīrs sadalās četrās daļās pa 3 £. Priyas rēķins ir 60 £ + 3 £, tātad 63 £, un viņa samaksāja 240 £, tāpēc viņai pienākas 177 £. Omar arī sanāk 63 £, bet viņš samaksāja 12 £, tāpēc viņš ir parādā 51 £. Lena ir parādā 80 £ + 3 £, tas ir 83 £, un Sam ir parādā 40 £ + 3 £, tas ir 43 £. Šie trīs kopā dod Priyas 177 £. Ja to atstātu, kā ir, parādi pa grupu skrietu piecos virzienos. Side Badger tā vietā iesaka trīs maksājumus, visus Priya. [Norēķināšanās](page:feature/settle-up) apraksta sīkāk."
  - heading: "Ievadiet to Side Badger"
    body: "Priyas daļa aizņem apmēram piecas minūtes."
    items:
      - "**Izveidojiet grupu.** Panelī izvēlieties **Izveidot grupu**. Izvēlieties **Uzaicināt citus** un nosūtiet saiti vai QR kodu cilvēkiem, kas iegulda, un nevienam citam."
      - "**Pievienojiet dāvanu.** Izvēlieties **Pievienot izdevumus**, aprakstiet to, ievadiet 240 un sadaļā **Kas samaksāja?** izvēlieties Priya. Sadaļā **Sadalīt starp** atstājiet visus četrus, tad sadaļā **Kā sadalīt** izvēlieties **Precīzas summas** un ierakstiet 60, 60, 80 un 40. Summām kopā jādod 240. Ja vēlaties, pievienojiet pasūtījuma apstiprinājumu. Izvēlieties **Saglabāt izdevumus**."
      - "**Pievienojiet kartiņu.** Omar pats pievieno 12 £, sadaļā **Kas samaksāja?** izvēlas sevi un atstāj **Kā sadalīt** uz **Vienādi**, atzīmējot visus četrus cilvēkus."
      - "**Saskaitiet, tad maksājiet.** Visi pārbauda **Bilances**, kas rāda, kurš kam ir parādā, un nosūta Priya savu daļu, kā vēlas. Tad to reģistrējiet ar **Norēķināties** un **Ierakstīt norēķinu**. Ātrais norēķins aizpilda summu."
  - heading: "Vispirms pirkt vai vispirms vākt"
    body: "Side Badger neglabā kopkasi, tāpēc „vākšana” patiesībā nozīmē skaitīšanu. Der abas kārtības."
    items:
      - "**Vispirms pērk.** Pircējs samaksā, pievieno izdevumu par īsto cenu, un visi uzreiz redz savu daļu. Tas ir kārtīgāk, bet pircējs nes izmaksas, līdz cilvēki samaksā, tāpēc izvēlieties pircēju, kam tas ir pa spēkam."
      - "**Vispirms vāc.** Cilvēki nosūta savu summu pircējam pirms pirkuma. Kad cena zināma, ievadiet dāvanu, tad reģistrējiet katru maksājumu ar datumu, kad nauda patiešām pārvietojās. Dāvanu pievienojiet vispirms, lai katram maksājumam būtu atlikums, pret kuru tam nolaisties."
      - "**Cena mainās.** Piegāde, atlaižu kods, vēla cenas paaugstināšana. Rediģējiet dāvanu un mainiet precīzās summas tā, lai tās joprojām kopā dod cenu. Iepriekšējā versija tiek saglabāta, bet vispirms pasakiet grupai, jo viņu atlikumi mainās."
  - heading: "Lai Bea neko neuzzina"
    body: "Grupu redz tikai tās dalībnieki, tāpēc Bea nevar redzēt grupu, kurā nav. Uzaiciniet cilvēkus, kas iegulda, un nevienu citu. Saite darbojas, līdz beidzas tās derīgums, un varat izvēlēties jebko no 15 minūtēm līdz 5 dienām, tāpēc izvēlieties īsu un nosūtiet tur, kur Bea to neredzēs. Saite ikvienam, kas to atver, parāda grupas priekšskatījumu, tāpēc nosauciet grupu garlaicīgi, piemēram, Sestdienas kopkase, un turiet Beas vārdu prom arī no izdevumu nosaukumiem un aptaujas iespējām."
  - heading: "Ko Side Badger šeit nedara"
    items:
      - "Tas neglabā un nevāc naudu. Iemaksas pircējam nonāk ar bankas pārskaitījumu, skaidrā naudā vai kā nu jūs to darāt, un tad kāds tās reģistrē."
      - "Tas nesūta maksājumu atgādinājumus. Pamudināt tos, kas vēl nav samaksājuši, joprojām ir cilvēka darbs."
      - "Tas neaprēķina nevienam daļu. Aptauja vienojas par budžetu, un nav iespējas „sadalīt atlikušo”, tāpēc katru summu ierakstāt jūs."
      - "Katram izdevumam ir viens maksātājs. Ja divi cilvēki nopirka dažādas dāvanas daļas, ievadiet divus izdevumus."
      - "Ikvienam sadalē vajadzīgs bezmaksas konts un vieta grupā."
