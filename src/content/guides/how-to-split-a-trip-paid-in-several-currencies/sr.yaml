faq:
  heading: "Питања"
  items:
    - q: "Који девизни курс користи Side Badger?"
      a: "Актуелни девизни курс, преузет кад унесеш трошак где је доступан. Можеш га променити у курс који си заиста добио."
    - q: "Може ли група да остане на фунтама и јенима?"
      a: "Да. У **Подешавањима** групе укључи **Ограничи валуте за ову групу** под **Подешавања валута**, изабери **Дозвољене валуте** и постави **Подразумевана валута за нове трошкове**. Мање опција на списку, мање погрешних погађања на каси."
    - q: "Морамо ли уопште да претварамо?"
      a: "Не. Валуте остају одвојене осим ако ти или твоја група одлучите да претворите, а свака валута добија свој кратак списак уплата."
