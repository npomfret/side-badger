meta:
  title: "Canllawiau i rannu costau'n deg | Side Badger"
  description: "Canllawiau ymarferol i rannu rhent, filâu gwyliau a chostau grŵp yn deg, pob un wedi'i weithio drwodd gyda grŵp realistig a'r symiau wedi'u dangos."
h1: "Canllawiau i rannu costau'n deg"
navLabel: "Canllawiau"
lead: "Y cwestiynau y mae pobl yn eu gofyn ychydig cyn agor taenlen, wedi'u hateb gyda grŵp sy'n edrych yn real, y symiau a'r camau yn yr ap."
intro: "Mae pob canllaw yn dilyn **un grŵp dychmygol** o'r gost gyntaf i'r taliad olaf a gofnodwyd. Mae'r rhifau wedi'u gweithio allan i chi, ac mae'r camau'n defnyddio'r sgriniau fel mae'r ap yn eu henwi."
cta:
  heading: "Oes gennych chi grŵp tebyg i hwn?"
  body: "Creu cyfrif, cychwyn grŵp ac ychwanegu'r gost gyntaf. Mae'r symiau wedi'u gwneud i chi."
cardsHeading: "Dewiswch eich cwestiwn"
