meta:
  title: "Hatiin ang bayarin sa partner na mas malaki ang kita | Side Badger"
  description: "Nakakailang ang 50/50 kapag mas malaki ang kita ng isa. Hatiin ang shared na bayarin ayon sa kita, kasama ang kuwenta para sa dalawa at walang spreadsheet."
h1: "Paano hatiin ang bayarin kasama ang partner na mas malaki ang kita"
navLabel: "Partner na mas malaki ang kita"
lead: "Pagsamahin ang take-home pay ninyo, kuwentahin ang bahagi ng bawat tao sa kabuuan, at i-round sa buong porsyento. £2,800 ang take-home ni Maya at £1,700 ang kay Jon, kaya 62/38 ang hati nila sa mga shared na bayarin. Ilagay ang mga porsyentong iyon sa shared na gastos sa Side Badger, saka kopyahin ito tuwing darating ang parehong bayarin."
cta:
  heading: "Kuwentahin nang isang beses"
  body: "Gumawa ng libreng account, gumawa ng grupo para sa inyong dalawa, at ilagay ang upa kasama ang mga porsyento ninyo. Kopya na lang ang upa sa susunod na buwan. Gusto munang silipin ang app? Tingnan ang [paano ito gumagana](page:how-it-works) o ang [saklaw ng libre](page:pricing)."
sections:
  - heading: "Dalawang sahod, isang apartment, isang magalang na katahimikan"
    body: "Magkasama sa bahay sina Maya at Jon. £2,800 kada buwan ang take-home ni Maya at £1,700 ang kay Jon. Dalawang taon nilang hinati ang lahat nang 50/50, dahil simple iyon at walang gustong mag-open ng usapan. Tapos tiningnan ni Jon ang upa nang mag-isa. Ang kalahati ng £1,400 ay £700, na isang-kapat ng take-home ni Maya at 41% ng kanya. Walang naging hindi patas. Wala lang talagang nagkuwenta. Maraming [magkapareha](page:use-case/couples) ang nakararating din dito. Habang may take-out sa harap, nagkasundo silang dapat halos pantay ang kagat ng mga shared na bayarin sa sahod ng bawat isa."
  - heading: "Ang paraan, kasama ang kuwenta"
    body: "Apat na hakbang, isang calculator, at isang usapang mangyayari rin naman."
    items:
      - "**Magkasundo kung ano ang bibilangin bilang sahod.** Take-home pay ang gamit nina Maya at Jon, ang perang pumapasok sa bangko bawat buwan. Kabuuan, £2,800 + £1,700 = £4,500."
      - "**Kuwentahin ang bahagi ng bawat isa.** Kay Maya, 2,800 ÷ 4,500, na 62.2%. Kay Jon, 1,700 ÷ 4,500, na 37.8%."
      - "**I-round sa buong porsyento.** Ang 62.2% ay nagiging 62 at ang 37.8% ay nagiging 38. Kapag dalawang tao, i-round ang isang bilang at ibawas ito sa 100 para makuha ang isa pa, at palaging 100 ang kabuuan."
      - "**Suriin kung ano ang ibig sabihin nito.** Sa upa na £1,400, £868 (62%) ang babayaran ni Maya at £532 (38%) ang kay Jon. Halos 31% iyon ng take-home pay ng bawat isa. Kung tig-kalahati bawat isa, 25% ng kay Maya at 41% ng kay Jon ang kakainin."
  - heading: "Pagbasa sa buwan"
    body: "Si Maya ang nagbayad ng upa na £1,400 at si Jon ang nagbayad ng natitirang £216. Ang bahagi ni Maya sa buwan ay £868.00 + £111.60 + £18.00 = £997.60, at nagbayad siya ng £1,400, kaya may makukuha siyang £402.40. Ang bahagi ni Jon ay £532.00 + £68.40 + £18.00 = £618.40, at nagbayad siya ng £216, kaya may utang siyang £402.40. Nagmumungkahi ang Side Badger ng isang bayad, mula kay Jon kay Maya, na £402.40, at itinatala ito ng [settle up](page:feature/settle-up) kapag naibayad na. Kung 50/50 ang hati, sa parehong buwan ay magbabayad si Jon kay Maya ng £592.00."
  - heading: "I-set up sa Side Badger"
    body: "Sampung minuto, na halos nauubos sa mga porsyento."
    items:
      - "**Gawin ang grupo.** Sa dashboard, piliin ang **Gumawa ng Grupo** at ipangalan ito sa apartment. Piliin ang **Mag-imbita ng Iba** at ipadala kay Jon ang link o QR code. Magsa-sign in siya o gagawa ng libreng account, at pipiliin niya ang pangalang gusto niyang makita sa grupong ito. Mga miyembro lang ang nakakakita ng grupo, kaya kayong dalawa lang ang makakakita nito."
      - "**Idagdag ang upa.** Piliin ang **Magdagdag ng Gastusin**. Ilagay ang deskripsyon at halaga, at sa ilalim ng **Sino ang nagbayad?** piliin si Maya. Panatilihin ang dalawang tao sa ilalim ng **Hatiin sa pagitan ng**, saka sa ilalim ng **Paano hatiin** piliin ang **Porsyento** at i-type ang 62 at 38. Magbababala ang form kung hindi umabot sa 100 ang kabuuan ng mga porsyento. Piliin ang **I-save ang Gastusin**."
      - "**Idagdag ang iba pang bayarin.** Ganoon din ang kuryente at internet, si Jon ang nagbayad at pareho ring 62 at 38. Hiwalay na gastos ang take-out, at nananatili ang **Paano hatiin** sa **Pantay**."
      - "**Kopyahin ito sa susunod na buwan.** Buksan ang upa noong nakaraang buwan at piliin ang **Kopyahin ang gastusin**. Pinapanatili ng kopya ang nagbayad, ang halaga, at ang hati, at kinukuha nito ang petsa ngayon. Baguhin ang halaga kung nagbago ang upa, saka piliin ang **Gumawa ng Kopya**. Ganoon din ang gagawin sa kuryente."
      - "**Tingnan kung sino ang may utang kanino.** Ipinapakita ito ng seksyong **Mga Balanse** at nagmumungkahi ito ng maikling listahan ng mga bayad. Magbayaran kayo sa paraang gusto ninyo, saka itala ang bayad sa ilalim ng **Magbayad**."
  - heading: "50/50, ayon sa kita, o bayarin por bayarin"
    body: "Walang tamang sagot, kundi ang kaya ninyong pareho. Tatlong karaniwang paraan."
    items:
      - "**Kalahati bawat isa sa lahat.** Pinakamadaling panatilihin, at bagay ito sa magkapareha na magkalapit ang sahod."
      - "**Ayon sa kita sa lahat ng shared.** Ito ang ginagawa nina Maya at Jon. Isang usapan, isang pares ng porsyento."
      - "**Bayarin por bayarin.** Ayon sa kita ang upa at mga bayarin, 50/50 ang bakasyon at pa-treat o anumang iba pang napagkasunduan, at bawat bayarin ay may patakarang bagay dito."
  - heading: "Magkasundo kung ano ang shared"
    body: "Karaniwang tungkol sa listahan ang mga away, hindi sa mga porsyento. Shared sa karamihan ng bahay ang upa, kuryente, internet, lingguhang pamimili, at sofa. Maaaring hindi ang gym membership ni Maya at ang football subscription ni Jon. Pagkasunduan ang listahan nang isang beses, isulat ito, at ilagay lang sa grupo ang mga shared na gastos."
  - heading: "Nananatiling 50/50 ang take-out, sinadya ito"
    body: "Maliit at opsyonal ang mga pa-treat, at hindi dapat kailanganin ng calculator para umorder ng dumplings. Sa Side Badger, isa lang ding gastos ang take-out. Nagbabayad si Jon ng £36, nananatili ang **Paano hatiin** sa **Pantay**, at £18 ang bahagi ng bawat isa."
  - heading: "Kapag nagbago ang sahod ng isa"
    body: "Binabago ng pagtaas ng sahod, bagong trabaho, o leave sa trabaho ang kuwenta. Kuwentahin ang bagong porsyento sa parehong paraan at gamitin ito simula sa susunod na gastos. Nananatili ang mga naunang gastos kung ano ang mga ito. Kopyahin ang upa noong nakaraang buwan, baguhin ang mga porsyento, saka piliin ang **Gumawa ng Kopya**. Para itama ang nailagay na, i-edit ito kung pinapayagan ng mga pahintulot ng grupo, at sabihan muna ang partner mo, dahil magbabago ang mga balanse. Iniingatan ang naunang bersyon. Magkasundo kung kailan kayo muling magkukuwenta, gaya ng isang beses sa isang taon, at mag-settle up bago lumipat para magsara ang lumang hati nang malinis ang bilang."
  - heading: "Ang hindi ginagawa ng Side Badger dito"
    items:
      - "Hindi nito itinatanong kung magkano ang kita ng sinuman at hindi nito kinukuwenta ang mga porsyento. I-type mo ang mga bilang na napagkasunduan ninyo."
      - "Hindi ito makapagtakda ng default na hati para sa buong grupo. Nasa bawat gastos ang mga porsyento, kaya kopyahin ang gastos na mayroon na nito."
      - "Walang umuulit na bayarin, kaya kokopyahin mo ang upa noong nakaraang buwan tuwing kailangan."
      - "Hindi ito naglilipat ng pera. Magbayaran kayo sa paraang gusto ninyo at itala ito."
