  rows:
    - feature: Hvad det koster
      other: Splitwise Pro er et månedligt eller årligt abonnement. Årlige abonnementer inkluderer et Trip Pass, som giver en turgruppe Pro-funktioner i 30 dage.
      sideBadger: Gratis.
      source: pro-help
    - feature: Udgifter pr. dag
      other: Dets hjælpecenter siger, at gratis brugere kan tilføje op til 4 udgifter om dagen. Pro har ingen daglig grænse.
      sideBadger: Ingen daglige grænser.
      source: pro-help
    - feature: Grupperoller og tilladelser
      other: Dets hjælpecenter siger, at den ikke understøtter gruppeadministratorer eller særlige tilladelser.
      sideBadger: Admins, medlemmer og seere. To forudindstillinger eller dine egne tilladelser, godkendelse for at komme med og en lås, når det er slut.
      source: permissions-help
    - feature: Kvitteringsscanning
      other: En Pro-funktion. Scanner et billede af en kvittering, og Pros opdeling i varer lader dig fordele varerne på personer.
      sideBadger: Gratis, uden scanningskreditter. Den udfylder total, dato og sted, så du kan tjekke dem, og fordeler ikke varer på personer.
      source: pro
    - feature: Valutaomregning
      other: En Pro-funktion. Tryk på »Convert«, så omregner Splitwise en gruppes udgifter til din standardvaluta til øjeblikkets valutakurs.
      sideBadger: Gratis. Omregn hver udgift, mens du indtaster den, med en aktuel valutakurs eller den, du faktisk fik. Det oprindelige beløb bliver stående på udgiften.
      source: currencies-help
    - feature: Valutaer og sprog
      other: 100+ valutaer og 7+ sprog, som dets startside formulerer det.
      sideBadger: 133 valutaer og 39 sprog. Alle i gruppen kan vælge deres eget sprog.
      source: home
    - feature: Hvor du bruger den
      other: Apps til iPhone og Android og webben.
      sideBadger: I din browser. Log ind, og føj den så til din startskærm, så åbner den som en app. Ikke i app stores.
      source: home
    - feature: Måder at dele på
      other: Ligeligt, efter nøjagtige beløb, i procent, efter andele, efter justering eller pr. vare.
      sideBadger: Ligeligt, efter nøjagtige beløb eller i procent, med én betaler pr. udgift. Ikke efter andele eller pr. vare.
      source: split-help
    - feature: Offline-brug
      other: Nævner en offline-tilstand blandt sine kernefunktioner.
      sideBadger: Nej. Den kræver en forbindelse.
      source: home
    - feature: Betalinger og din bank
      other: "Nogle steder kan den sende penge inde fra appen: Splitwise Pay i USA, Venmo til saldi i amerikanske dollar, PayPal og Pay by Bank i udvalgte europæiske lande, som forbinder en personlig bankkonto."
      sideBadger: Rører aldrig dine penge og beder ikke om dine bankoplysninger. Betal hinanden, som du vil, og registrer så betalingen.
      source: payments-help
    - feature: Diagrammer og standardopdelinger
      other: Begge dele er Pro-funktioner.
      sideBadger: Ingen af delene.
      source: pro
faq:
  heading: Spørgsmål
  items:
    - q: Er Side Badger et gratis alternativ til Splitwise?
      a: "Til at dele regninger i en gruppe, ja, og den gør mere end regnestykkerne: kommentarer, spørgsmål, lister, afstemninger og grupperoller, med gratis kvitteringsscanning og valutaomregning. Hvis du har brug for en app store-app, offline-brug eller betalinger i selve appen, så kan Splitwise det, og Side Badger kan det ikke."
    - q: Hvor kommer oplysningerne om Splitwise fra?
      a: "Splitwises egne sider: dets startside, dets Pro-side og dets hjælpecenter. Hver række i tabellen linker til den side, den kom fra, og datoen over tabellen siger, hvornår vi læste dem. Vi tjekker dem hvert kvartal."
    - q: Forbliver Side Badger gratis?
      a: Alt i Side Badger er gratis i dag. Hvis det nogensinde ændrer sig, giver vi besked først. [Prissiden](page:pricing) har detaljerne.
    - q: Skal alle i min gruppe skifte?
      a: Ja. Alle i en gruppe skal have en gratis Side Badger-konto, og de kan deltage med et link eller en QR-kode.
    - q: Har Side Badger en mobilapp?
      a: "Ikke i en app store. Den kører i din browser: log ind på din telefon, og føj den så til din startskærm, så den åbner som en app. [Sådan virker det](page:how-it-works) viser hvordan."
