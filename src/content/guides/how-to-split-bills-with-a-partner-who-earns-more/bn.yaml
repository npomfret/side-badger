meta:
  title: "যে সঙ্গীর আয় বেশি, তার সঙ্গে বিল কীভাবে ভাগ করবেন | Side Badger"
  description: "দুজনের একজন অনেক বেশি আয় করলে 50/50 ভাগ অস্বস্তিকর হয়ে ওঠে। তার বদলে যৌথ বিল আয় অনুযায়ী ভাগ করুন, দুজনের অঙ্কসহ, স্প্রেডশিট ছাড়াই।"
h1: "যে সঙ্গীর আয় বেশি, তার সঙ্গে বিল কীভাবে ভাগ করবেন"
navLabel: "বেশি আয়ের সঙ্গী"
lead: "আপনাদের হাতে পাওয়া আয় যোগ করুন, মোটের মধ্যে প্রত্যেকের ভাগ বের করুন আর পূর্ণ শতাংশে গোল করুন। Maya-র হাতে আসে £2,800 আর Jon-এর £1,700, তাই তারা যৌথ বিল ভাগ করে 62/38 হিসাবে। Side Badger-এ একটি যৌথ খরচে সেই শতাংশগুলো লিখুন, তারপর একই বিল আবার এলে সেটা কপি করুন।"
cta:
  heading: "অঙ্কটা একবারই কষুন"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, দুজনের জন্য একটি গ্রুপ বানান আর আপনাদের শতাংশসহ ভাড়াটা লিখে ফেলুন। পরের মাসের ভাড়া শুধু একটা কপি। আগে একটু ঘুরে দেখতে চান? দেখুন [কীভাবে কাজ করে](page:how-it-works) অথবা [বিনামূল্যে কী কী মেলে](page:pricing)।"
sections:
  - heading: "দুটো বেতন, একটা ফ্ল্যাট, আর ভদ্র একটা নীরবতা"
    body: "Maya আর Jon একসঙ্গে থাকে। Maya-র হাতে মাসে আসে £2,800 আর Jon-এর হাতে আসে £1,700। দুই বছর ধরে তারা সবকিছু 50/50 হিসাবে ভাগ করেছে, কারণ সেটা সহজ ছিল আর কেউই প্রথমে কথাটা তুলতে চায়নি। তারপর Jon ভাড়াটাকে আলাদা করে দেখল। £1,400-এর অর্ধেক £700, যা Maya-র হাতে পাওয়া আয়ের এক-চতুর্থাংশ আর Jon-এর আয়ের 41%। কেউ অন্যায় করেনি। শুধু কেউ অঙ্কটা কষেনি। অনেক [দম্পতি](page:use-case/couples) শেষমেশ এই জায়গায় এসে পৌঁছায়। টেকঅ্যাওয়ে খেতে খেতে তারা একমত হলো যে যৌথ বিলে দুজনের আয়ের মোটামুটি একই অনুপাত যাবে।"
  - heading: "পদ্ধতিটা, অঙ্কসহ"
    body: "চারটি ধাপ, একটা ক্যালকুলেটর আর এমন একটা আলাপ যা আপনাদের এমনিতেই করতে হতো।"
    items:
      - "**কোনটা আয় হিসেবে ধরা হবে, ঠিক করুন।** Maya আর Jon ধরে হাতে পাওয়া আয়, অর্থাৎ প্রতি মাসে ব্যাংকে যে টাকা ঢোকে। দুজনের মিলিয়ে হয় £2,800 + £1,700 = £4,500।"
      - "**প্রত্যেকের ভাগ বের করুন।** Maya-র ভাগ 2,800 ÷ 4,500, মানে 62.2%। Jon-এর ভাগ 1,700 ÷ 4,500, মানে 37.8%।"
      - "**পূর্ণ শতাংশে গোল করুন।** 62.2% হয় 62 আর 37.8% হয় 38। দুজন মানুষের বেলায় একটি অঙ্ক গোল করে 100 থেকে বিয়োগ করলেই অন্যটা পাওয়া যায়, আর যোগফল সবসময় 100 হয়।"
      - "**মানেটা যাচাই করুন।** £1,400 ভাড়ায় Maya দেয় £868 (62%) আর Jon দেয় £532 (38%)। এটা দুজনেরই হাতে পাওয়া আয়ের প্রায় 31%। অর্ধেক-অর্ধেক হলে লাগত Maya-র 25% আর Jon-এর 41%।"
  - heading: "মাসটা পড়ে নেওয়া"
    body: "Maya £1,400 ভাড়া দিয়েছে আর Jon দিয়েছে বাকি £216। এই মাসে Maya-র ভাগ £868.00 + £111.60 + £18.00 = £997.60, আর সে দিয়েছে £1,400, তাই তার পাওনা £402.40। Jon-এর ভাগ £532.00 + £68.40 + £18.00 = £618.40, আর সে দিয়েছে £216, তাই তার দেওয়ার আছে £402.40। Side Badger একটি পেমেন্ট সাজেস্ট করে: Jon দেবে Maya-কে £402.40, আর পেমেন্টটা দেওয়া হয়ে গেলে [হিসাব মেটানো](page:feature/settle-up) সেটা রেকর্ড করে। 50/50 ভাগ হলে একই মাসে Jon-এর Maya-কে £592.00 দিতে হতো।"
  - heading: "Side Badger-এ সাজিয়ে নিন"
    body: "দশ মিনিটের কাজ, যার বেশিরভাগ যায় শতাংশগুলো নিয়ে।"
    items:
      - "**গ্রুপ বানান।** ড্যাশবোর্ডে **গ্রুপ তৈরি করুন** বেছে ফ্ল্যাটের নামে গ্রুপের নাম দিন। **অন্যদের আমন্ত্রণ জানান** বেছে Jon-কে লিঙ্ক বা QR কোড পাঠান। সে সাইন ইন করে বা বিনামূল্যে অ্যাকাউন্ট খুলে, আর এই গ্রুপে যে নামে দেখা যেতে চায় সেটা বেছে নেয়। গ্রুপ শুধু সদস্যরাই দেখতে পায়, তাই এখানে থাকবেন শুধু আপনারা দুজন।"
      - "**ভাড়া যোগ করুন।** **খরচ যোগ করুন** বেছে নিন। বিবরণ আর পরিমাণ লিখুন, আর **কে টাকা দিয়েছেন?** অংশে Maya-কে বেছে নিন। **যাদের মধ্যে ভাগ হবে** অংশে দুজনকেই রাখুন, তারপর **কীভাবে ভাগ হবে** অংশে **শতাংশ** বেছে 62 আর 38 লিখুন। শতাংশের যোগফল 100 না হলে ফর্ম সেটা জানিয়ে দেয়। **খরচ সংরক্ষণ করুন** বেছে নিন।"
      - "**বাকি বিলগুলো যোগ করুন।** বিদ্যুৎ আর ব্রডব্যান্ড একইভাবে যোগ হয়, দাতা Jon আর একই 62 ও 38 নিয়ে। টেকঅ্যাওয়ে আলাদা একটা খরচ, আর **কীভাবে ভাগ হবে** অংশে **সমান** যেমন আছে তেমনই থাকে।"
      - "**আগামী মাসে কপি করুন।** গত মাসের ভাড়াটা খুলে **খরচ কপি করুন** বেছে নিন। কপিতে দাতা, পরিমাণ আর ভাগ একই থাকে, আর তারিখ হয় আজকের। ভাড়া বদলে থাকলে পরিমাণটা বদলান, তারপর **কপি তৈরি করুন** বেছে নিন। বিদ্যুতের বিলও একইভাবে চলে।"
      - "**কে কার কাছে ঋণী দেখুন।** **ব্যালেন্স** অংশে সেটা দেখা যায়, সঙ্গে পেমেন্টের একটি ছোট তালিকাও সাজেস্ট করা হয়। যেভাবে খুশি একে অপরকে দিন, তারপর **সব শোধ করুন** থেকে পেমেন্টটা রেকর্ড করুন।"
  - heading: "50/50, আয় অনুযায়ী, নাকি বিল ধরে ধরে"
    body: "কোনো একটাই সঠিক উত্তর নেই, আছে শুধু সেটাই যা নিয়ে আপনারা দুজনেই থাকতে পারেন। তিনটি চালু উপায়।"
    items:
      - "**সবকিছুতে অর্ধেক-অর্ধেক।** মেনে চলা সবচেয়ে সহজ, আর যে দম্পতিদের আয় কাছাকাছি তাদের জন্য মানানসই।"
      - "**সব যৌথ খরচ আয় অনুযায়ী।** Maya আর Jon যা করে। একটাই আলাপ, এক জোড়া শতাংশ।"
      - "**বিল ধরে ধরে।** ভাড়া আর বিল আয় অনুযায়ী, ছুটি আর খুশির খরচ 50/50 বা আপনারা যা ঠিক করেন সেভাবে, আর প্রতিটি বিল পায় তার উপযোগী নিয়ম।"
  - heading: "কোনটা যৌথ, তা ঠিক করুন"
    body: "তর্ক সাধারণত তালিকা নিয়ে হয়, শতাংশ নিয়ে নয়। বেশিরভাগ বাড়িতে ভাড়া, বিদ্যুৎ, ব্রডব্যান্ড, সাপ্তাহিক বাজার আর সোফা যৌথ ধরা হয়। Maya-র জিমের সদস্যপদ আর Jon-এর ফুটবলের সাবস্ক্রিপশন হয়তো ধরা হয় না। তালিকাটা একবার ঠিক করুন, লিখে রাখুন, আর গ্রুপে শুধু যৌথ খরচগুলোই রাখুন।"
  - heading: "টেকঅ্যাওয়ে ইচ্ছে করেই 50/50 থাকে"
    body: "খুশির খরচ ছোট আর ঐচ্ছিক, আর ডাম্পলিং অর্ডার করতে কারও ক্যালকুলেটর লাগা উচিত নয়। Side Badger-এ টেকঅ্যাওয়ে আরেকটা সাধারণ খরচ। Jon দেয় £36, **কীভাবে ভাগ হবে** অংশে **সমান** থাকে, আর দুজনের প্রত্যেককে দিতে হয় £18।"
  - heading: "কারও আয় বদলে গেলে"
    body: "বেতন বাড়া, নতুন চাকরি বা কাজ থেকে ছুটি অঙ্কটা বদলে দেয়। নতুন শতাংশ একইভাবে বের করুন আর পরের খরচ থেকে সেগুলো ব্যবহার করুন। আগের খরচগুলো যেমন ছিল তেমনই থাকে। গত মাসের ভাড়া কপি করুন, শতাংশ বদলান, তারপর **কপি তৈরি করুন** বেছে নিন। যেটা আগেই যোগ হয়ে গেছে সেটা শুধরাতে চাইলে, গ্রুপের অনুমতি দিলে সম্পাদনা করুন, আর আগে সঙ্গীকে জানিয়ে দিন, কারণ ব্যালেন্স বদলে যায়। আগের সংস্করণ রাখা থাকে। কবে আবার হিসাব কষবেন তা ঠিক করে নিন, যেমন বছরে একবার, আর বদলানোর আগে হিসাব মিটিয়ে নিন, যাতে পুরোনো ভাগটা পরিষ্কার হিসাব নিয়ে শেষ হয়।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "এটা কখনও কারও আয় জানতে চায় না, আর শতাংশও হিসাব করে দেয় না। আপনারা যে অঙ্কগুলোতে একমত হয়েছেন সেগুলো আপনি লেখেন।"
      - "পুরো গ্রুপের জন্য ডিফল্ট ভাগ ঠিক করে রাখা যায় না। শতাংশ বসে প্রতিটি খরচে, তাই যেটায় আগে থেকেই শতাংশ আছে সেটা কপি করুন।"
      - "এতে পুনরাবৃত্ত বিল নেই, তাই প্রতিবার গত মাসের ভাড়া কপি করতে হয়।"
      - "এটা কখনও টাকা নাড়াচাড়া করে না। আপনারা যেভাবে খুশি একে অপরকে দেন আর সেটা রেকর্ড করেন।"
exampleAfter: 2
