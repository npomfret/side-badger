meta:
  title: "Администрација групе и дозволе за заједничке трошкове | Side Badger"
  description: "Позови људе везом или QR кодом, одобри ко улази, постави посматраче, подеси дозволе и закључај групу кад је готова. Твоја група, твоја правила, у разумној мери."
h1: "Администрација групе и дозволе: твоја правила, у разумној мери"
navLabel: "Групе и дозволе"
lead: "Неким групама треба благајник. Side Badger има подешавање за то. Позови људе везом или QR кодом, одлучи ко улази и изабери ко може да мења бројеве. Мала група пријатеља све ово може да занемари, јер нове групе почињу потпуно отворене."
cta:
  heading: "Спремни за уредну групу?"
  body: "Направи кориснички налог, оснуј групу и пошаљи везу за позивницу. Остави је отвореном или пооштри правила кад група порасте или постане гњаважнија."
problem:
  heading: "Неко мора да води рачуна да бројеви буду уредни"
  body: "Четворо цимера може да живи на поверењу. Тридесет гостију на венчању преко викенда вероватно не може. Направи групу за сваку кућу, путовање или догађај, са до 50 људи у њој, и свака група има своје чланове, своје улоге и своја правила. Твоја контролна табла их све приказује, заједно с тим где стојиш у свакој, на једном екрану. Већина група никад не дира подешавања. Оне које их дирају обично имају некога довољно организованог да их жели."
workflow:
  heading: "Од празне до закључане групе"
  steps:
    - title: "Позови везом или QR кодом"
      body: "Отвори **Позови друге**, изабери колико дуго веза треба да траје (15 минута, 1 сат, 1 дан или 5 дана), а затим копирај везу или покажи QR код да га људи скенирају. Можеш позвати и људе са којима већ делиш другу групу, из саме апликације."
      shot: S03
      shotAlt: "Прозор за позивање са везом до групе, њеним QR кодом и избором колико дуго веза траје"
    - title: "Нека погледају пре него што уђу"
      body: "Свако са везом се пријави или направи налог, види преглед групе и бира име које жели да користи у њој. Затим притисне **Придружи се групи**."
      shot: S04
      shotAlt: "Преглед групе који се приказује пријављеној особи пре него што јој се придружи"
    - title: "Одобри ко улази"
      body: "Укључи одобравање и људи који користе везу чекају као чланови на чекању док их администратор не пусти унутра. Администратори их налазе под **Чланови на чекању** у **Безбедност**, и бирају **Одобри** или **Одбиј**. До тада особа на чекању не може да види ништа у групи."
      shot: S14
      shotAlt: "Чланови на чекању које администратор треба да одобри или одбије"
    - title: "Изабери ко шта може да мења"
      body: "Изабери **Отворено** или **Управљано**, или подеси дозволе једну по једну. Затим сваком додели улогу: администратор, члан или посматрач. Само администратори могу да мењају дозволе и улоге."
      shot: S13
      shotAlt: "Картица безбедности у подешавањима групе са два унапред подешена режима и прилагођеним дозволама"
    - title: "Закључај је кад је готова"
      body: "Кад је путовање завршено и бројеви поравнати, администратор може да укључи **Закључај групу**. Нико не може да додаје или мења трошкове, бележи уплате или уређује спискове и анкете, а трака на врху то каже. Нико не може тихо да дода закаснели такси. Ако се неки ипак појави, администратор може да откључа групу."
      shot: S15
      shotAlt: "Група са траком која каже да је закључана"
options:
  heading: "Администратори, чланови и посматрачи"
  items:
    - title: "Администратор"
      body: "Води групу. Администратори одобравају нове чланове, мењају улоге и дозволе, закључавају и откључавају групу и затварају је. Ко направи групу, почиње као њен администратор, а група никад не остаје без администратора, јер последњег администратора није могуће разжаловати."
    - title: "Члан"
      body: "Учествује. Шта члан може зависи од дозвола групе. У групи са отвореном сарадњом то је скоро све. У управљаној групи чланови могу да мењају само трошкове и спискове које су сами направили."
    - title: "Посматрач"
      body: "Види све, а не мења ништа. Посматрач не може да додаје или уређује трошкове и спискове, позива људе, мења подешавања нити дира насловну слику. Згодно за особу која жели да прати бројеве и обећава да неће да их дира."
sections:
  - heading: "Отворено, управљано или твоја правила"
    body: "Нове групе почињу са **Отворено**, где свако може да позива људе, мења трошкове и уређује спискове, а нови чланови улазе аутоматски. **Управљано** је за кад неко мора да буде одрастао. Седам дозвола можеш подесити и једну по једну, а ручна промена било које групу пребацује на прилагођено. Шта год изабереш, само администратори могу да мењају саме дозволе, а свака промена се види у дневнику активности. Стан [цимера](page:use-case/housemates) може све да остави отворено. Велики [догађај или прослава](page:use-case/events-and-celebrations) често жели управљано, да неко води рачуна о томе ко улази. Нов си у овоме? [Како функционише](page:how-it-works) води кроз цело путовање, од првог трошка до поравнања."
    items:
      - "**Ко може да уређује трошкове.** Отворена сарадња: сваки члан. Управљана група: аутори и администратори."
      - "**Ко може да брише трошкове.** Отворена сарадња: сваки члан. Управљана група: аутори и администратори."
      - "**Ко може да уређује спискове.** Отворена сарадња: сваки члан. Управљана група: аутори и администратори."
      - "**Ко може да позива чланове.** Отворена сарадња: сваки члан. Управљана група: само администратори."
      - "**Одобравање нових чланова.** Отворена сарадња: аутоматски. Управљана група: потребно је одобрење администратора."
      - "**Ко може да мења подешавања.** Отворена сарадња: сваки члан. Управљана група: само администратори."
      - "**Ко може да мења насловну слику.** Отворена сарадња: сваки члан. Управљана група: само администратори."
  - heading: "Твоје име, твоја слика, твоја насловна слика"
    body: "Свака група има своју поделу улога. Изабери име које људи виде у свакој групи (од 2 до 50 знакова, и јединствено у групи) и коју од својих профилних слика ту носиш. Буди **Сем** у кући, а **Сем (има кола)** на путовању. Свако коме је дозвољено да мења подешавања може да преименује групу и уређује њен опис. Насловна слика, JPEG, PNG, GIF или WebP до 10 MB, има своју посебну дозволу."
  - heading: "Архивирај, закључај или затвори"
    body: "Три начина да одложиш групу, од најблажег до најозбиљнијег."
    items:
      - "**Архивирај** скрива групу са твоје контролне табле, и ничије друге. И даље можеш да је отвориш и користиш као раније, а **Врати групу из архиве** је враћа."
      - "**Закључај** замрзава промене док их администратор не откључа. Сви и даље могу да читају групу и њену историју."
      - "**Затвори** је трајно и за све. Може само администратор, уз куцање имена групе ради потврде, и нико више не може да отвори групу."
  - heading: "Напуштање групе"
    body: "Свако може да оде кад се поравна. Не можеш отићи док дугујеш или ти се дугује новац макар у једној валути, док те се тиче нерешено питање о трошку, нити ако си последњи администратор или једини члан. [Забележи уплату](page:feature/settle-up), реши [питање о трошку](page:guide/what-to-do-when-someone-disputes-a-shared-expense) или постави још некога за администратора, па иди. Да се вратиш, треба ти нова позивница."
limits:
  heading: "У разумној мери: ситна слова"
  items:
    - "Група може да има до 50 људи."
    - "Само администратори могу да мењају дозволе и улоге. Последњег администратора није могуће разжаловати."
    - "Подешавање уређивања трошкова на **Само администратори** значи и да само администратори могу да додају трошкове."
    - "Закључавање зауставља промене трошкова, нове уплате, спискове и анкете. Сви и даље могу да читају групу и њену историју и да реагују на уплате."
    - "Затварање је трајно. Апликација нема начин да поново отвори затворену групу."
    - "Прављење нове везе за позивницу не поништава старе. Свака веза траје до свог истека, зато изабери кратку ако те мучи где би могла да заврши."
    - "Позивнице из апликације наводе људе из твојих 10 најскорије активних група. Свима осталима треба веза, а ко сме да позива зависи од дозвола групе."
    - "За придруживање је потребан налог, а људи морају да потврде адресу е-поште пре него што било шта могу да додају."
useCasesHeading: "Где мало реда помаже"
faq:
  heading: "Питања"
  items:
    - q: "Може ли посматрач да додаје трошкове?"
      a: "Не. Посматрач види све, а не мења ништа. Не може да додаје или уређује трошкове и спискове, позива људе нити мења подешавања."
    - q: "Може ли неко да напусти групу док дугује новац?"
      a: "Не. Нико не може да напусти групу док дугује или му се дугује новац макар у једној валути. Прво се поравнајте, па одите."
    - q: "Шта се дешава кад се група затвори?"
      a: "Нико више не може да је отвори. Групу може да затвори само администратор, мора да откуца име групе ради потврде, и група постаје недоступна свима. Ако само желиш да зауставиш промене, закључај је. Ако је само желиш склонити са своје контролне табле, архивирај је."
    - q: "Могу ли да поништим закључавање?"
      a: "Да. Администратор може да откључа групу и промене поново раде."
    - q: "Морам ли да одобравам људе пре него што уђу?"
      a: "Само ако желиш. Нове групе почињу са отвореном сарадњом, где људи који користе везу улазе аутоматски. Укључи одобравање администратора или изабери управљану групу и свако чека док га администратор не пусти унутра."
    - q: "Колико људи може да буде у групи?"
      a: "До 50."
