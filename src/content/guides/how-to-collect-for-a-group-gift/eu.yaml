faq:
  heading: "Galderak"
  items:
    - q: "Zer gertatzen da oparia baino diru gehiago biltzen badugu?"
      a: "Zenbateko zehatzek prezioa batu behar dute, beraz txikitu zatiak halaxe izan arte. Edo jarri soberakina benetako zerbaitetan, hala nola loreetan, eta sartu bigarren gastu gisa, adibideko txartela eta biltzeko papera bezala."
    - q: "Norbaitek ekarpena egin dezake taldean sartu gabe?"
      a: "Ez, zenbaketan egon nahi badu behintzat. Banaketako guztiek doako kontu bat behar dute eta taldean egon behar dute. Eskudirua bakarrik duen norbaitentzat, Priyak eskudirua hartu eta taldeak oraindik zor duen zenbatekoarekin sar dezake oparia. Adibidez, Samek 40 £ eskudirutan eman badizkio, 200 £ sartuko lituzke eta 60, 60 eta 80 banatuko lituzke bere, Omarren eta Lenaren artean."
    - q: "Inkestak erabaki dezake pertsona bakoitzak zenbat jartzen duen?"
      a: "Ez. Inkesta batek talde osoarentzako zifra bat adosten du, hala nola aurrekontua. Pertsona bakoitzaren zatia zuek adosteko da, eta gero gastuan idazten da **Zenbateko zehatzak** gisa."
