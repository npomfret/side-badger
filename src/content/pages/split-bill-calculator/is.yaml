meta:
  title: "Reiknivél: hver skuldar hverjum, komið á hreint | Side Badger"
  description: "Hver greiddi, hver skuldar, hver borgar hverjum: komið á hreint á sekúndum. Skiptu jafnt, nákvæmt eða í prósentum. Ókeypis, í vafranum, ekkert vistað eða sent."
h1: "Reiknivél til að skipta reikningi"
navLabel: "Reiknivél: skipta reikningi"
lead: "Sláðu inn hver greiddi fyrir hvað og reiknivélin segir þér hver skuldar hverjum, ásamt stuttum lista yfir greiðslur sem gerir upp. Hún keyrir í vafranum þínum, vistar ekkert og flytur enga peninga. Ef hópurinn þarf að halda utan um bókhaldið lengur en flipinn lifir gera [skipting útgjalda](page:feature/split-expenses) og [uppgjör](page:feature/settle-up) í Side Badger sömu reikningsdæmin og geyma þau."
cta:
  heading: "Líkar þér útreikningarnir? Geymdu þá."
  body: "Þessi reiknivél gleymir öllu þegar þú lokar flipanum, rétt eins og sá sem borgaði örugglega síðast. Hópur í Side Badger geymir útgjöldin, uppfærir stöðu allra og skráir greiðslurnar. Það er ókeypis, án auglýsinga og án daglegra takmarka."
sections:
  - heading: "Hvernig útreikningurinn virkar"
    body: "Fyrir hvert útgjald reiknar reiknivélin út hlut hvers og eins. Þú getur skipt því jafnt, eftir nákvæmum upphæðum eða í prósentum milli þeirra sem þú velur. Staða hvers og eins er svo það sem viðkomandi greiddi að frádregnu því sem viðkomandi skuldar. Plúsmerki þýðir að hópurinn skuldar viðkomandi og mínusmerki að viðkomandi skuldar hópnum. Stöðurnar leggjast alltaf saman í núll, því það sem einn á inni skulda aðrir."
  - heading: "Af hverju listinn yfir greiðslur er stuttur"
    body: "Enginn þarf að gera upp hverja kvittun fyrir sig. Þegar staða allra er þekkt para reiknivélin saman þann sem skuldar mest og þann sem á mest inni, gerir upp eins mikið og ein greiðsla ræður við og heldur áfram niður listann þar til allir eru komnir í núll. Hún þarf aldrei fleiri greiðslur en fjöldi þeirra sem eru með stöðu að frádreginni einni, og oft færri en þegar gert er upp reikning fyrir reikning. Hún gefur stuttan lista yfir greiðslur og lofar ekki að hann sé sá stysti sem mögulegt er."
  - heading: "Það sem reiknivélin gerir ekki"
    items:
      - "**Ráða við fleiri en einn gjaldmiðil.** Veldu einn og notaðu hann í allan útreikninginn. Appið heldur sérstaka stöðu fyrir hvern gjaldmiðil og getur umreiknað útgjald á núverandi gengi, sem þú getur breytt."
      - "**Vista neitt.** Lokaðu flipanum og tölurnar eru horfnar. Til að halda þeim skaltu afrita tengilinn. Hann geymir tölurnar þínar fyrir aftan #, sem vafrinn þinn sendir aldrei á netþjón, og allir sem fá hann frá þér geta lesið þær."
      - "**Flytja peninga.** Hún segir þér hver ætti að borga hverjum. Þið borgið hvert öðru eins og ykkur hentar og skráið svo greiðsluna í appinu ef hópurinn heldur utan um stöðuna þar."
      - "**Velja afgangseyri af handahófi.** Þegar reikningur skiptist ekki jafnt fer afgangseyririnn til þeirra fyrstu á listanum, svo heildartölurnar ganga samt upp. Í appinu fer afgangseyririnn til einnar manneskju af handahófi, svo það er ekki alltaf sama manneskjan."
      - "**Fara yfir mörkin.** Reiknivélin tekur 2 til 20 manns og eitt útgjald getur verið allt að 999.999,99, eins og í appinu."
