faq:
  heading: "Domande"
  items:
    - q: "Posso mettere in discussione solo la mia parte?"
      a: "No. Una domanda trattiene l'intera spesa, per tutti quelli che ne fanno parte. Se a essere sbagliata è solo la divisione, la soluzione è modificarla."
    - q: "Chi può chiudere una domanda?"
      a: "La persona che l'ha fatta, o un admin del gruppo. Se chi ha aggiunto la spesa non è un admin, non può chiuderla al posto di chi ha fatto la domanda."
    - q: "Modificare una spesa cancella l'originale?"
      a: "No. La versione precedente resta salvata. Chi può modificare lo decidono i permessi del gruppo, quindi conviene avvisare prima la casa, perché i saldi cambiano."
