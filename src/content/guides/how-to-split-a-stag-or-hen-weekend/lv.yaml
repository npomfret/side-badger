meta:
  title: "Vecpuišu vai vecmeitu nedēļas nogales izmaksu sadale | Side Badger"
  description: "Goda viesis nemaksā neko, un pirmdienā visi joprojām runā savā starpā. Kā sadalīt vecpuišu vai vecmeitu nedēļas nogales izmaksas, ar aprēķiniem."
h1: "Kā sadalīt vecpuišu vai vecmeitu nedēļas nogales izmaksas"
navLabel: "Vecpuišu/vecmeitu nedēļas nogale"
lead: "Goda viesis nemaksā neko, tāpēc pārējā grupa katru izmaksu sadala [vienādi](page:feature/split-expenses) savā starpā. Izlaidiet cilvēkus no izmaksām, kurās viņi nepiedalās, un neiekļaujiet goda viesi grupā, lai pārsteigums saglabātos."
cta:
  heading: "Sekojiet izmaksām un saglabājiet pārsteigumu"
  body: "Izveidojiet grupu, nosūtiet saiti visiem, izņemot goda viesi, un pievienojiet katru izmaksu, kad tā rodas. Side Badger ir bez maksas, bez reklāmām un bez dienas ierobežojumiem."
sections:
  - heading: "Četras draudzenes un viens pārsteigums"
    body: "Hannah, Isla, Jess un Kat aizved draudzeni Grace uz viņas vecmeitu nedēļas nogali. Grace ir goda viešņa, tāpēc viņa par neko nemaksā. Viņa arī nav grupā, tāpēc neredz, cik draudzenes tērē viņas labā. Hannah rezervē mājiņu, Isla apmaksā spa dienu, Jess sedz vakariņas, bet Kat apmaksā taksometru. Līdz svētdienai katra par kaut ko ir samaksājusi, un neviena nevar pateikt, kura ir plusā. Aprēķini ir tādi paši vecpuišu vai vecmeitu nedēļas nogalei, lai kas būtu goda viesis."
  - heading: "Dalīt starp maksātājiem, nevis klātesošajiem"
    body: "Goda viesa daļa nepazūd. Tā tiek sadalīta pārējiem. Mājiņa maksā 720 £, un par to maksā četras draudzenes, tātad 180 £ katrai, un goda viešņas vieta jau ir ietverta šajā summā. Vakariņas ir 260 £, tātad 65 £ katrai. Taksometrs ir 44 £, tātad 11 £ katrai. Viss, ko kāds izlaiž, tiek izņemts tikai no attiecīgā izdevuma. Kat izlaiž spa, tāpēc spa dienas izmaksas 360 £, kas aptver arī goda viešņas vietu, dala Hannah, Isla un Jess, katra pa 120 £. Saskaitot kopā, personām Hannah, Isla un Jess par nedēļas nogali sanāk 376 £ katrai, bet personai Kat 256 £."
  - heading: "Iestatiet to Side Badger"
    items:
      - "Izveidojiet grupu nedēļas nogalei un dodiet tai garlaicīgu nosaukumu, piemēram, Mājiņas nedēļas nogale. Grace nav dalībniece, un grupu var redzēt tikai tās dalībnieki."
      - "Izvēlieties **Uzaicināt citus** un nosūtiet saiti vai parādiet QR kodu tikai tur, kur to neredzēs Grace. Saite parāda grupas priekšskatījumu, pirms kāds pievienojas. Izvēlieties, cik ilgi tā ir derīga, no 15 minūtēm līdz 5 dienām. Sena saite turpina darboties, līdz beidzas tās derīgums, tāpēc neizvēlieties ilgāku termiņu, nekā vajag."
      - "Katrai izmaksai izvēlieties **Pievienot izdevumus**, ievadiet summu un laukā **Kas samaksāja?** izvēlieties maksātāju. Laukā **Sadalīt starp** atķeksējiet cilvēkus, kas maksā, un neatķeksējiet tos, kuri izmaksu izlaiž, piemēram, Kat spa dienai. Laukā **Kā sadalīt** izvēlieties **Vienādi**."
      - "Kad esat mājās, atveriet grupas **Bilances**. Side Badger parāda, kurš kam ir parādā, un iesaka īsu maksājumu sarakstu. Šoreiz tie ir trīs: Kat maksā personai Hannah 212 £, Jess maksā personai Hannah 116 £ un Isla maksā personai Hannah 16 £. Samaksājiet viens otram, kā vēlaties, tad ar **Norēķināties** reģistrējiet katru maksājumu."
  - heading: "Pirms rezervējat: budžets un depozīts"
    body: "Vienojieties par budžetu, pirms kāds rezervē. Izvēlieties **Pievienot aptauju**, pajautājiet, cik grupa tērēs mājiņai, un piedāvājiet dažus variantus. Veidojot aptauju, ieslēdziet opciju **Anonīma balsošana**, lai paslēptu, kurš par ko balsoja, un nevienam nebūtu skaļi jāaizstāv mazāks budžets. Kad visi ir nobalsojuši un uzvarētājs redzams, aizveriet aptauju. Tad nāk depozīts. Kurš rezervē, tas to samaksā un pievieno kā izdevumu, sadalītu vienādi, bet atlikusī summa tiek ievadīta kā otrs izdevums, kad tā jāmaksā. Pārējie var savu daļu nosūtīt uzreiz un reģistrēt maksājumu vai pagaidīt galīgo aprēķinu. Atlikumi abos gadījumos sanāk vienādi."
  - heading: "Kad kāds pievienojas tikai uz vienu nakti"
    body: "Cilvēkam, kurš ierodas tikai uz sestdienu, nevajadzētu maksāt par piektdienu. Izlaidiet viņu no izmaksām, kurās viņš nepiedalījās. Ja izmaksas ir atkarīgas no tā, cik ilgi katrs uzturas, piemēram, istaba, laukā **Kā sadalīt** izvēlieties **Precīzas summas** un ievadiet katra cilvēka daļu, kuru summai jāsakrīt ar kopsummu. Vispirms aprēķiniet cenu uz cilvēku uz nakti, tad reiziniet ar naktīm, ko katrs uzturas. Lapā [grupu ceļojumi](page:use-case/group-trips) ir vairāk par izmaksām, kas nav vienādas visiem."
  - heading: "Ko Side Badger šeit nedara"
    items:
      - "Tas nekad nepārvieto naudu. Jūs samaksājat viens otram ar bankas pārskaitījumu, skaidru naudu vai kā ērtāk, tad reģistrējat maksājumu, lai atlikumi atjaunotos visiem."
      - "Tas nesūta maksājumu atgādinājumus. Draudzīgs pagrūdiens grupas čatā joprojām jāveic cilvēkam."
      - "Katram izdevumam ir viens maksātājs, un Side Badger nevar sadalīt čeku pa rindiņām. Ja mājiņu apmaksāja divas kartes, ievadiet to kā divus izdevumus. Ja daži vakariņās pasūtīja papildus, ievadiet šos papildu pasūtījumus kā atsevišķu izdevumu."
      - "Tas uztur naudas uzskaiti, nevis ceļojuma programmu. Aptaujas un komentāri paliek pie izmaksām, tāpēc nedēļas nogales plāni paliek jūsu grupas čatā."
