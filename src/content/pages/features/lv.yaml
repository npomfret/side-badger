meta:
  title: "Ko Side Badger dara un nedara"
  description: "Sadale, norēķināšanās un vairākas valūtas, kā arī grupas, saraksti un aptaujas. Viss komplekts un godīgs saraksts ar to, ko Side Badger neietver."
h1: "Ko Side Badger dara"
navLabel: "Funkcijas"
lead: "Viss, kas ir kastē, un tas, kā nav."
intro: "Lūk, viss komplekts. Izklājlapu mēs izlaidām ar nodomu. Sāciet ar trim darbiem, ko Side Badger veic katru dienu, tad pārlūkojiet pārējo sarakstu un īso sarakstu ar to, ko tas nedara."
cta:
  heading: "Vai tas dara to, kas vajadzīgs jūsu grupai?"
  body: "Izveidojiet bezmaksas kontu un vispirms izmēģiniet ar nelielu grupu."
  button: "Izveidot bezmaksas kontu"
cardsHeading: "Trīs darbi sīkāk"
sections:
  - heading: "Čeku skenēšana"
    body: "Nofotografējiet čeku, un Side Badger aizpilda kopsummu, datumu un vietu, lai jūs tos pārbaudītu. Čeku attēlus nolasa Google AI pakalpojums."
  - heading: "Grupas un atļaujas"
    body: "Izveidojiet grupu katrai mājai, ceļojumam vai pasākumam, ar līdz 50 cilvēkiem. Uzaiciniet cilvēkus ar saiti vai QR kodu. Lielākā grupā kādu var padarīt par skatītāju, kas visu redz, bet neko nemaina."
  - heading: "Saraksti un aptaujas"
    body: "Turiet kopīgo iepirkumu sarakstu blakus iepirkumu rēķiniem. Ļaujiet balsot par villu izvēli, ja vēlaties, anonīmi."
  - heading: "Pārējais"
    items:
      - "**Tiešie atjauninājumi:** pievienojiet izdevumu, un visi to uzreiz redz."
      - "**Valodas:** izmantojiet Side Badger 39 valodās. Katrs grupas dalībnieks var izvēlēties savu."
      - "**Sākuma ekrāns:** lietotņu veikals nav vajadzīgs. Pievienojiet Side Badger sākuma ekrānam, un tas atveras kā lietotne."
      - "**Atsauksmes:** atradāt kļūdu? Pastāstiet mums lietotnē un tur pat izlasiet mūsu atbildi."
  - heading: "Ko Side Badger nedara"
    items:
      - "**Nepārvieto naudu.** Side Badger nekad neskar jūsu naudu. Samaksājiet viens otram, kā vēlaties. Maksājumu pieprasījumi ir plānoti."
      - "**Neatkārto rēķinus.** Atkārtotu izdevumu nav. Nokopējiet pagājušā mēneša rēķinu divos pieskārienos."
      - "**Nedala pa pozīcijām.** Katram izdevumam ir viens maksātājs. Sadaliet vienādi, precīzi vai procentuāli."
      - "**Nepiegādā vietējo lietotni.** Tas darbojas jūsu pārlūkprogrammā. Pievienojiet to sākuma ekrānam."
      - "**Nedarbojas bezsaistē.** Vajadzīgs savienojums."
      - "**Nesūta brīdinājumus e-pastā vai īsziņā.** Paziņojumi parādās lietotnē. Push paziņojumi ir plānoti."
      - "**Nezīmē diagrammas vai budžetus.** Tas uztur uzskaiti, kurš kam ir parādā, un tas arī viss triks."
      - "**Neļauj pieteikties ar Google vai Apple.** Reģistrējieties ar e-pastu. Pieteikšanās ar Google un Apple ir plānota."
      - "**Neielaiž cilvēkus bez konta.** Ikvienam grupā vajadzīgs bezmaksas konts."
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai varu maksāt, izmantojot Side Badger?"
      a: "Nē. Side Badger uztur uzskaiti un nekad neskar jūsu naudu. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu."
    - q: "Vai ir mobilā lietotne?"
      a: "Ne lietotņu veikalā. Side Badger darbojas jūsu pārlūkprogrammā, un varat to pievienot sākuma ekrānam, lai tā atvērtos kā lietotne."
    - q: "Vai varu sadalīt pa pozīcijām?"
      a: "Nē. Katram izdevumam ir viens maksātājs, un to sadala vienādi, precīzi vai procentuāli."
    - q: "Vai tas darbojas bezsaistē?"
      a: "Nē, vajadzīgs savienojums."
    - q: "Vai ikvienam grupā vajadzīgs konts?"
      a: "Jā. Ikvienam grupā vajadzīgs bezmaksas konts, un reģistrācijai pietiek ar e-pasta adresi."
