meta:
  title: "Side Badger vs Splitwise：無料の機能を比較 | Side Badger"
  description: "Splitwiseの無料の代替サービスを、公平に比較。レシートスキャン、通貨の換算、広告なしがここでは無料で、Splitwiseのほうが優れている点も挙げています。"
h1: "Side Badger vs Splitwise：無料の機能を比較"
navLabel: Side BadgerとSplitwiseの比較
lead: "グループの誰かが、きっと「Splitwiseを使えばいいじゃん」と言ったことでしょう。ごもっともです。Side Badgerは、レシートスキャン、通貨の換算、広告なしを備えた無料のウェブアプリで、それらを使うのにサブスクリプションは要りません。どちらがグループに合うかは、グループに何が必要かで決まります。そこで比較を用意しました。Splitwiseの側は、Splitwise自身のページからのみ引用しています。"
cta:
  heading: 次の割り勘で試してみよう
  body: "無料アカウントを作成し、グループを作って、実際の支出を1つ追加してみてください。合わなければ、使ったのは数分で、サブスクリプションではありません。"
asOf: 2026-10-21
asOfNote: "{date}にSplitwise自身のページを読みました。みなさんが読まなくて済むようにです。ここに書いたSplitwiseについての内容は、すべてそのページに基づいています。表の各行に出典へのリンクがあります。プランは変わるので、3か月ごとに確認し直しています。Splitwiseのページとこのページの内容が食い違う場合は、Splitwiseのページを信じてください。"
