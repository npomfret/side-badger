faq:
  heading: "Pitanja"
  items:
    - q: "Tko bi trebao zabilježiti uplatu, onaj tko plaća ili onaj tko prima?"
      a: "Za bilježenje uplate potrebno je dopuštenje za uređivanje troškova, a obrazac pita **Tko je platio?** i **Tko je primio uplatu?** Samo osoba koja ju je zabilježila može je kasnije urediti, pa je obično najjednostavnije da je zabilježi platitelj, gumbom za brzo poravnanje."
    - q: "Što ako je putovanje bilo u dvije valute?"
      a: "Stanja se vode po valutama, pa dug u eurima ostaje dug u eurima i svaka valuta dobiva vlastiti kratak popis, osim ako su troškovi pretvoreni pri unosu. [Više valuta](page:guide/how-to-split-a-trip-paid-in-several-currencies) pokazuje oba načina."
    - q: "Trebamo li se poravnati tijekom putovanja ili na kraju?"
      a: "Oboje je u redu. Svaka zabilježena uplata mijenja stanja, pa uplata tijekom putovanja ulazi u završni popis. Na kraju je jednostavnije, jer je [cijelo putovanje](page:use-case/group-trips) na jednom mjestu."
