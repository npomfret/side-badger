faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Είναι το Side Badger δωρεάν εναλλακτική του Splitwise;"
      a: "Για το μοίρασμα λογαριασμών σε μια ομάδα, ναι. Η σάρωση αποδείξεων, η μετατροπή νομισμάτων και η απουσία διαφημίσεων είναι δωρεάν, χωρίς ημερήσια όρια. Αν χρειάζεστε εγγενή εφαρμογή, χρήση χωρίς σύνδεση, επαναλαμβανόμενα έξοδα ή πληρωμές μέσα στην εφαρμογή, αυτά τα κάνει το Splitwise και όχι το Side Badger."
    - q: "Από πού προέρχονται τα στοιχεία για το Splitwise;"
      a: "Από τις δικές του σελίδες: την αρχική του σελίδα, τη σελίδα Pro και το κέντρο βοήθειάς του. Κάθε γραμμή του πίνακα παραπέμπει στη σελίδα από την οποία προήλθε και η ημερομηνία πάνω από τον πίνακα λέει πότε τις διαβάσαμε. Τις ελέγχουμε κάθε τρίμηνο."
    - q: "Θα μείνει δωρεάν το Side Badger;"
      a: "Τα πάντα στο Side Badger είναι σήμερα δωρεάν και δεν υπάρχει επί πληρωμή επίπεδο. Αν αυτό αλλάξει ποτέ, θα σας ειδοποιήσουμε πρώτα. Η [σελίδα τιμών](page:pricing) έχει τις λεπτομέρειες."
    - q: "Πρέπει να αλλάξουν όλοι στην ομάδα μου;"
      a: "Ναι. Ο καθένας σε μια ομάδα χρειάζεται δωρεάν λογαριασμό στο Side Badger και μπορεί να μπει με σύνδεσμο ή κωδικό QR."
    - q: "Έχει το Side Badger εφαρμογή για κινητό;"
      a: "Όχι σε κατάστημα εφαρμογών. Τρέχει στο πρόγραμμα περιήγησής σας: συνδεθείτε στο τηλέφωνό σας και μετά προσθέστε το στην αρχική οθόνη ώστε να ανοίγει σαν εφαρμογή. Το [πώς λειτουργεί](page:how-it-works) δείχνει πώς."
