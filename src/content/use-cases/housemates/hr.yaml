featuresHeading: "Značajke koje kuća koristi"
faq:
  heading: "Pitanja"
  items:
    - q: "Može li se najamnina ponavljati automatski?"
      a: "Ne, nema ponavljajućih računa. Kopiraj prošlomjesečnu najamninu u par dodira, promijeni datum i gotovo."
    - q: "Možemo li dijeliti prema veličini sobe?"
      a: "Da, po postocima. Daj svakom cimeru udio koji odražava njegovu sobu, sve dok udjeli zajedno daju 100. O drugim načinima dijeljenja pročitaj u [podjeli troškova](page:feature/split-expenses)."
    - q: "Što ako se cimer iseli dok duguje novac?"
      a: "Ne može napustiti grupu dok se ne poravna, jer nitko ne može otići dok duguje ili mu se duguje novac. Brojevi ostaju pošteni dok svi nisu kvit."
    - q: "Plaća li Side Badger račune?"
      a: "Ne. Vodi evidenciju i predlaže kratak popis uplata. Platite si kako god želite, a zatim zabilježite, kako objašnjava [poravnanje](page:feature/settle-up)."
    - q: "Može li jedan cimer voditi knjige?"
      a: "Da. Postavi ga za administratora i koristi upravljanu grupu, gdje nove članove odobrava administrator, a troškove mogu mijenjati samo osnivači i administratori."
