faq:
  heading: "Pytania"
  items:
    - q: "Czy mogę zakwestionować tylko swoją część?"
      a: "Nie. Pytanie wstrzymuje cały wydatek, dla wszystkich w nim. Jeśli zły jest tylko podział, naprawą jest edycja podziału."
    - q: "Kto może zamknąć pytanie?"
      a: "Osoba, która zapytała, albo administrator grupy. Jeśli osoba, która dodała wydatek, nie jest administratorem, nie może go zamknąć w imieniu pytającego."
    - q: "Czy edycja wydatku kasuje oryginał?"
      a: "Nie. Wcześniejsza wersja zostaje zachowana. O tym, kto może edytować, decydują uprawnienia grupy, więc warto najpierw powiedzieć o tym domownikom, bo salda się zmienią."
