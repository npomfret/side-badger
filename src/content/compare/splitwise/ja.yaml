meta:
  title: "Side Badger vs Splitwise: 計算だけでなく、グループみんなのために | Side Badger"
  description: "グループみんなのための無料のSplitwise代替サービス。コメント、質問、リスト、投票、しっかりした役割に加え、レシートスキャンと通貨の換算も無料です。"
h1: "Side Badger vs Splitwise: 計算だけでなく、グループみんなのために"
navLabel: Side BadgerとSplitwiseの比較
lead: "グループの誰かが「Splitwiseでいいんじゃない？」と言ったことがあるかもしれません。もっともです。計算は得意ですから。Side Badgerも計算はこなしたうえで、グループが話し合う場所を用意します。コメント、質問、リスト、投票、そしてしっかりしたグループの役割です。レシートスキャンと通貨の換算は無料で付いてきます。"
cta:
  heading: 次の割り勘で試してみましょう
  body: 無料アカウントを作成し、グループを作って、実際の支出を1つ追加してみてください。合わなくても、使ったのは数分の時間だけで、サブスクリプション料金はかかりません。
asOf: 2026-11-22
asOfNote: "{date}に、あなたが読まなくて済むように、Splitwise自身のページを読みました。ここに書いたSplitwiseについての内容は、すべてそのページに基づいています。表の各行に出典へのリンクがあります。プランは変わるので、3か月ごとに確認し直しています。Splitwiseのページとこのページの内容が食い違う場合は、Splitwiseのページを信じてください。"
