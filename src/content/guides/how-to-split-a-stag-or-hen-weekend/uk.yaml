meta:
  title: "Як розділити витрати на парубоцький чи дівич-вечір на вихідних | Side Badger"
  description: "Герой події нічого не платить, а в понеділок усі ще розмовляють. Як розділити витрати на парубоцький чи дівич-вечір, із розрахунками."
h1: "Як розділити витрати на парубоцький чи дівич-вечір на вихідних"
navLabel: "Парубоцький чи дівич-вечір"
lead: "Герой події нічого не платить, тож решта групи ділить кожну витрату між собою [порівну](page:feature/split-expenses). Виключайте людей із витрат, яких вони уникли, і тримайте героя події поза групою, щоб сюрприз вцілів."
cta:
  heading: "Ведіть облік і бережіть сюрприз"
  body: "Заведіть групу, надішліть посилання всім, крім героя події, і додавайте кожну витрату, щойно вона з'являється. Side Badger безкоштовний, без реклами й без денних обмежень."
sections:
  - heading: "Четверо друзів і один сюрприз"
    body: "Ханна, Айла, Джесс і Кет везуть Грейс на її дівич-вечір. Грейс — героїня події, тож вона не платить ні за що. Її також немає в групі, тож вона не бачить, що подруги витрачають на неї. Ханна бронює котедж, Айла платить за день у спа, Джесс бере на себе вечерю, а Кет — таксі. До неділі кожна за щось заплатила, і ніхто не годен сказати, хто в плюсі. Арифметика однакова для парубоцького й дівич-вечора, хто б не був героєм події."
  - heading: "Діліть на тих, хто платить, а не на тих, хто є"
    body: "Частка героя події не зникає. Її розподіляють. Котедж коштує 720 £, і платять за нього четверо подруг, тож це по 180 £, і місце Грейс уже входить у цю цифру. Вечеря — 260 £, тобто по 65 £. Таксі — 44 £, тобто по 11 £. Усе, чого хтось уник, виключається лише з цієї витрати. Кет пропускає спа, тож його 360 £, куди входить і місце Грейс, ділять Ханна, Айла й Джесс по 120 £. Підсумуйте, і Ханна, Айла та Джесс винні по 376 £ за вихідні, а Кет винна 256 £."
  - heading: "Налаштування в Side Badger"
    items:
      - "Заведіть групу для вихідних і дайте їй нудну назву, наприклад «Вихідні в котеджі». Грейс не учасниця, а групу бачать лише її учасники."
      - >-
        Оберіть **Запросити інших** і надсилайте посилання або показуйте QR-код лише там, де Грейс його не побачить. Посилання показує попередній перегляд групи, перш ніж хтось приєднається. Оберіть, як довго воно діятиме, від 15 хвилин до 5 днів. Старе посилання працює, доки не спливе, тож не лишайте його довше, ніж потрібно.
      - >-
        Для кожної витрати оберіть **Додати витрату**, уведіть суму й виберіть платника в полі **Хто заплатив?** У полі **Розділити між** позначте тих, хто платить, виключивши всіх, хто це пропустив, як-от Кет для спа. У полі **Як розділити** оберіть **Порівну**.
      - >-
        Коли повернетеся додому, відкрийте розділ **Баланси** групи. Side Badger покаже, хто кому винен, і підкаже короткий список платежів. Тут їх три: Кет платить Ханні 212 £, Джесс платить Ханні 116 £, а Айла платить Ханні 16 £. Платіть одне одному як зручно, а потім у розділі **Розрахуватися** запишіть кожен платіж.
  - heading: "Перш ніж бронювати, бюджет і завдаток"
    body: "Погодьте бюджет, перш ніж хтось бронюватиме. Оберіть **Додати опитування**, запитайте, скільки група витратить на котедж, і запропонуйте кілька цифр як варіанти. Увімкніть **Анонімне голосування** під час створення, щоб приховати, хто за що голосував, тож нікому не доведеться вголос захищати меншу суму. Закрийте опитування, коли всі проголосують і з'явиться переможець. Далі завдаток. Хто бронює, той його платить і додає як витрату, розділену порівну, а залишок вноситься другою витратою, коли настане строк. Решта може одразу надіслати свою частку й записати платіж або почекати остаточного підрахунку. Баланси виходять однакові в обох випадках."
  - heading: "Коли хтось приєднується на одну ніч"
    body: "Друг, який з'являється лише на суботу, не повинен платити за п'ятницю. Виключіть його з витрат, до яких він не причетний. Де витрата залежить від того, скільки кожен живе, як-от кімната, оберіть у полі **Як розділити** варіант **Точні суми** й уведіть частку кожного, яка має дорівнювати загальній сумі. Спершу порахуйте ціну за людину за ніч, а потім помножте на кількість ночей кожного. Більше про витрати, які не однакові для всіх, на сторінці про [поїздки групою](page:use-case/group-trips)."
  - heading: "Чого Side Badger тут не робить"
    items:
      - "Він ніколи не переказує гроші. Ви платите одне одному банківським переказом, готівкою чи як вам зручно, а потім записуєте платіж, щоб баланси оновилися для всіх."
      - "Він не надсилає нагадувань про платежі. Дружній поштовх у груповому чаті залишається за людиною."
      - "У кожної витрати один платник, а Side Badger не вміє ділити чек за рядками. Якщо за котедж платили двома картками, внесіть дві витрати. Якщо хтось замовив на вечері щось зайве, внесіть це окремою витратою."
      - "Він веде гроші, а не маршрут. Опитування та коментарі лишаються біля витрат, тож плани на вихідні залишаються у вашому груповому чаті."
