meta:
  title: "अलग-अलग रातों के हिसाब से विला का खर्च बांटें | Side Badger"
  description: "Dev सिर्फ़ तीन रातों के लिए आया था, तो छह का पैसा क्यों दे? हॉलिडे विला का खर्च लोगों के असल में रुकी रातों के हिसाब से बांटें, हिसाब निकला हुआ।"
h1: "अलग-अलग रातें रुकने वालों के बीच हॉलिडे विला का खर्च कैसे बांटें"
navLabel: "रातों से विला बांटें"
lead: "एक व्यक्ति की एक रात का दाम निकालें, उसे हर व्यक्ति की रातों से गुणा करें, और विला को **सटीक राशियों वाले एक खर्च** के रूप में डालें। Side Badger हिसाब रखता है और हिसाब चुकता करने का समय आने पर पेमेंट की एक छोटी सूची सुझाता है।"
cta:
  heading: "विला को एक साफ-सुथरा खर्च दें"
  body: "ग्रुप बनाएं, सबको लिंक या QR कोड से बुलाएं और विला को सटीक राशियों के साथ डालें। आप छुट्टी का मज़ा लें, Side Badger चलता हुआ हिसाब रखता है।"
sections:
  - heading: "छह रातें, चार लोग, एक क्रेडिट कार्ड"
    body: "[ग्रुप ट्रिप](page:use-case/group-trips) आमतौर पर किसी एक के कार्ड से शुरू होती है। यहां वह Ana का है। वह छह रातों के लिए €2,100 का एक विला बुक करती है, क्योंकि किसी को तो पहले आगे आना ही होता है। Ana, Ben और Chloe छहों रातें रुकते हैं। Dev सिर्फ़ आखिरी तीन रातों के लिए जुड़ पाता है, और ट्रेन से आता है। Ben एक कार किराये पर लेता है, जिसमें Dev कभी नहीं बैठता। Dev किराने की बड़ी खरीदारी करता है। विला को चार हिस्सों में बांटना सबसे सीधा रास्ता है। उसमें Dev उन तीन रातों के पैसे देता है जो उसने घर पर बिताईं, और ऐसी बातें क्रिसमस पर फिर उभर आती हैं। रातों के हिसाब से बांटने से बहस टल जाती है, और गणित में एक मिनट लगता है।"
  - heading: "एक व्यक्ति-रात का दाम निकालें"
    body: "व्यक्ति-रात का मतलब है एक व्यक्ति का एक रात रुकना। विला की कीमत जो है सो है, इसलिए कीमत को सारी व्यक्ति-रातों में बांटें, फिर हर व्यक्ति को वे रातें दें जो उसने इस्तेमाल कीं।"
    items:
      - "**व्यक्ति-रातें गिनें।** Ana, Ben और Chloe छह-छह रातें रुकते हैं और Dev तीन: 6 + 6 + 6 + 3 = 21।"
      - "**एक का दाम निकालें।** €2,100 ÷ 21 = €100 प्रति व्यक्ति-रात।"
      - "**हर व्यक्ति की रातों से गुणा करें।** Ana, Ben और Chloe हर एक 6 × €100 = €600 देते हैं। Dev 3 × €100 = €300 देता है।"
      - "**कुल जांचें।** €600 + €600 + €600 + €300 = €2,100। अगर आपके हिस्सों का जोड़ कीमत के बराबर नहीं बैठता, तो कोई रात छूट गई है या दो बार गिनी गई है।"
  - heading: "Side Badger में डालें"
    body: "ग्रुप बनाएं, बाकी तीनों को लिंक या QR कोड से बुलाएं, फिर खर्च जोड़ें। पहले विला।"
    items:
      - "**व्यय जोड़ें** चुनें। उसका विवरण लिखें, 2,100 डालें और **किसने भुगतान किया?** में Ana को चुनें।"
      - "**विभाजित करें** में पक्का करें कि चारों लोग शामिल हैं।"
      - "**विभाजन कैसे करें** में **सटीक राशियाँ** चुनें। Ana, Ben और Chloe के लिए 600 और Dev के लिए 300 टाइप करें। राशियों का जोड़ कुल के बराबर होना चाहिए।"
      - "**व्यय सहेजें** चुनें।"
      - "कार का किराया भी इसी तरह जोड़ें। पेमेंट Ben ने किया, बंटवारा **समान रूप से** है, और Dev बाहर है, क्योंकि वह ट्रेन से आया। खर्च बांटने के बाकी तरीके [खर्च बांटना](page:feature/split-expenses) में हैं।"
      - "किराना जोड़ें। पेमेंट Dev ने किया, बंटवारा **समान रूप से** है, और चारों शामिल हैं।"
  - heading: "नतीजा पढ़ें, फिर हिसाब चुकता करें"
    body: "हर व्यक्ति का बिल उसके विला के हिस्से और कार व किराने में उसके हिस्से का जोड़ है। Ana, Ben और Chloe, तीनों का बिल €725 बनता है, यानी €600 + €80 + €45। Dev का बिल €345 बनता है, यानी €300 + €45। हर व्यक्ति ने जितना दिया उसे घटाएं तो बैलेंस निकल आते हैं। Ana ने €2,100 दिए, इसलिए उसे €1,375 मिलने हैं। Ben ने €240 दिए और उसे €485 देने हैं। Dev ने €180 दिए और उसे €165 देने हैं। Chloe ने कुछ नहीं दिया और उसे €725 देने हैं। यूं ही छोड़ दें तो ये उधारियां ग्रुप में छह अलग-अलग रास्तों से घूमतीं। Side Badger इसकी जगह तीन पेमेंट सुझाता है, सब Ana को। उसे जैसे चाहें पेमेंट करें, फिर **हिसाब बराबर करें** चुनें और हर पेमेंट के लिए **भुगतान रिकॉर्ड करें** इस्तेमाल करें, ताकि बैलेंस अपडेट हो जाएं। त्वरित निपटान बटन राशि भर देते हैं। [हिसाब चुकता करना](page:feature/settle-up) में और जानकारी है।"
  - heading: "जब विला का एक साफ दाम न हो"
    items:
      - "**कमरे अलग-अलग हैं।** अगर सुइट का दाम बॉक्स रूम से ज़्यादा है, तो पहले तय करें कि हर कमरे की कीमत क्या है, फिर व्यक्ति-रात का हिसाब एक-एक कमरे के लिए लगाएं। विला को हर व्यक्ति के कुल के साथ एक खर्च के रूप में डालें, या हर कमरे का एक खर्च। जो भी करें, किसी खर्च की सटीक राशियों का जोड़ उसके कुल के बराबर होना चाहिए।"
      - "**महीनों पहले दिया डिपॉज़िट।** जिसने उसे दिया उसके नाम अलग खर्च बनता है, उस दिन की तारीख के साथ जिस दिन उसने पेमेंट किया। उसे रातों के हिसाब से उसी अनुपात में बांटें जिसमें बाकी रकम बंटी।"
      - "**बुकिंग दूसरी करेंसी में है।** विला को उसी करेंसी में डालें जिसमें आपने पेमेंट किया। अगर ग्रुप साथ-साथ बदलता चलता है, तो मौजूदा एक्सचेंज रेट इस्तेमाल करें, या वह रेट टाइप करें जो आपको असल में मिला। मूल राशि खर्च पर बनी रहती है। पूरी जानकारी [कई करेंसी](page:feature/multiple-currencies) में है।"
      - "**आधी रातें।** कोई आधी रात को पहुंचता है, कोई नाश्ते से पहले निकल जाता है। रातें गिनने का एक नियम तय करें और सब पर वही लगाएं।"
  - heading: "Side Badger यहां क्या नहीं करता"
    items:
      - "यह आपके लिए रातें नहीं गिनता। रातों या हिस्सों के हिसाब से बंटवारा नहीं है, इसलिए हर राशि ऊपर की तरह खुद निकालें और **सटीक राशियाँ** डालें।"
      - "यह पैसे नहीं भेजता। जैसे चाहें एक-दूसरे को पेमेंट करें, फिर पेमेंट रिकॉर्ड करें।"
      - "हर खर्च में पेमेंट करने वाला एक ही हो सकता है। अगर विला का पेमेंट दो लोगों ने किया, तो दो खर्च डालें।"
      - "इसमें गेस्ट एक्सेस नहीं है। ग्रुप में सबको, Dev को भी, मुफ्त अकाउंट चाहिए।"
exampleAfter: 2
