faq:
  heading: "Vprašanja"
  items:
    - q: "Kdo naj zabeleži plačilo, tisti, ki plačuje, ali tisti, ki prejme?"
      a: "Za beleženje plačila je potrebno dovoljenje za urejanje stroškov, obrazec pa vpraša **Kdo je plačal?** in **Kdo je prejel plačilo?** Zabeleženo plačilo lahko pozneje ureja samo oseba, ki ga je zabeležila, zato je običajno najlažje, če to stori plačnik z gumbom za hitro poravnavo."
    - q: "Kaj, če je potovanje potekalo v dveh valutah?"
      a: "Stanja se vodijo po valutah, zato evrski dolg ostane evrski dolg in vsaka valuta dobi svoj kratek seznam, razen če so bili stroški pretvorjeni ob vnosu. [Več valut](page:guide/how-to-split-a-trip-paid-in-several-currencies) prikaže obe poti."
    - q: "Ali naj se poravnamo med potovanjem ali na koncu?"
      a: "Obe možnosti delujeta. Vsako zabeleženo plačilo spremeni stanja, zato plačilo sredi potovanja šteje k končnemu seznamu. Na koncu je preprosteje, ker je [celotno potovanje](page:use-case/group-trips) na enem mestu."
