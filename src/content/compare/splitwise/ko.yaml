meta:
  title: "사이드 배저 vs Splitwise: 계산만이 아니라 그룹 전체를 위해 | 사이드 배저"
  description: "무료 Splitwise 대안, 그룹 전체를 위해: 댓글, 질문, 목록, 투표, 제대로 된 역할에 더해 영수증 스캔과 통화 환산도 무료예요."
h1: "사이드 배저 vs Splitwise: 계산만이 아니라 그룹 전체를 위해"
navLabel: "사이드 배저 vs Splitwise"
lead: "그룹의 누군가는 아마 “그냥 Splitwise 쓰자”고 말했을 거예요. 틀린 말은 아니에요. 계산은 잘하니까요. 사이드 배저도 계산은 하고, 거기에 더해 그룹이 함께 이야기하며 풀어 갈 공간을 줍니다. 댓글, 질문, 목록, 투표, 제대로 된 그룹 역할이죠. 영수증 스캔과 통화 환산은 무료예요."
cta:
  heading: "다음 공동 비용으로 써 보세요"
  body: "무료 계정을 만들고, 그룹을 만들고, 실제 지출 하나를 추가해 보세요. 맞지 않더라도 구독료가 아니라 몇 분을 쓴 것뿐이에요."
asOf: 2026-11-22
asOfNote: "번거롭지 않게 {date}에 Splitwise 자체 페이지를 우리가 대신 읽어 봤고, 여기 적힌 Splitwise 관련 내용은 전부 그 페이지에서 가져왔어요. 표의 각 행은 출처로 연결돼요. 요금제는 바뀔 수 있어서 분기마다 다시 확인하고, Splitwise 페이지가 이 페이지와 다르면 Splitwise 쪽을 믿으세요."
