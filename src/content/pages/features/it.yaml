meta:
  title: Cosa fa e cosa non fa Side Badger
  description: Dividere le spese, saldare i conti e più valute, più gruppi, liste e sondaggi. Il kit completo e un elenco onesto di ciò che Side Badger non fa.
h1: Cosa fa Side Badger
navLabel: Funzionalità
lead: Tutto ciò che c'è nella scatola, e ciò che non c'è.
intro: Ecco il kit completo. Il foglio di calcolo l'abbiamo lasciato fuori di proposito. Scegli una funzionalità qui sotto per la versione lunga, oppure dai un'occhiata al resto dell'elenco e alla breve lista delle cose che Side Badger non fa.
cta:
  heading: Fa quello che serve al tuo gruppo?
  body: Crea un account gratuito e provalo prima con un gruppo piccolo.
cardsHeading: Ogni funzionalità, nel dettaglio
sections:
  - heading: Scansione degli scontrini
    body: Fotografa lo scontrino e Side Badger compila totale, data e luogo perché tu li controlli. Le immagini degli scontrini vengono lette dal servizio di IA di Google. [Come funziona la scansione degli scontrini](page:feature/receipt-scanning).
  - heading: Gruppi e permessi
    body: Crea un gruppo per ogni casa, viaggio o evento, con fino a 50 persone. Invita le persone con un link o un codice QR. In un gruppo più grande, puoi rendere qualcuno un visitatore, che vede tutto e non modifica nulla. [Gruppi e permessi](page:feature/groups-and-permissions) ha il testo in piccolo.
  - heading: Liste e sondaggi
    body: Tieni la lista della spesa condivisa accanto ai conti della spesa. Metti la rosa delle ville ai voti, in forma anonima se preferisci. [Pianificalo insieme](page:feature/plan-together) copre commenti, domande, liste e sondaggi.
  - heading: Tutto il resto
    items:
      - "**Aggiornamenti in tempo reale:** aggiungi una spesa e tutti la vedono subito."
      - "**Lingue:** usa Side Badger in 39 lingue. Ognuno nel gruppo può scegliere la propria."
      - "**Schermata Home:** non serve nessuno store. Accedi, poi aggiungi Side Badger alla schermata Home e si apre come un'app. Le Impostazioni nell'app ti mostrano come. [Di più sull'app web](page:feature/web-app)."
      - "**Notifiche:** attiva le notifiche push nelle Impostazioni per ricevere una notifica quando c'è una nuova attività nei tuoi gruppi. Su iPhone e iPad, aggiungi prima Side Badger alla schermata Home."
      - "**Feedback:** hai trovato un bug? Dillo a noi dall'interno dell'app e leggi lì la nostra risposta."
  - heading: Cosa Side Badger non fa
    items:
      - "**Spostare denaro.** Side Badger non tocca mai i tuoi soldi. Pagatevi come vi fa più comodo. Le richieste di pagamento sono in programma."
      - "**Ripetere i conti.** Non ci sono spese ricorrenti. Copia il conto del mese scorso in due tocchi."
      - "**Dividere per voce.** Un solo pagatore per spesa. Dividi in parti uguali, per importi esatti o per percentuale."
      - "**Offrire un'app nativa.** Funziona nel browser. Accedi, poi aggiungila alla schermata Home."
      - "**Funzionare offline.** Serve una connessione."
      - "**Mandare avvisi via email o SMS.** Le nuove attività compaiono nell'app e, se le attivi, come notifiche push."
      - "**Disegnare grafici o budget.** Tiene il conto di chi deve cosa a chi, e il trucco è tutto lì."
      - "**Accedere con Google o Apple.** Ci si registra con l'email. L'accesso con Google e Apple è in programma."
      - "**Far entrare persone senza account.** Tutti nel gruppo hanno bisogno di un account gratuito."
faq:
  heading: Domande
  items:
    - q: Posso pagare tramite Side Badger?
      a: No. Side Badger tiene il conto e non tocca mai i tuoi soldi. Pagatevi come vi fa più comodo, poi registrate il pagamento.
    - q: Esiste un'app per il telefono?
      a: Non in uno store. Side Badger funziona nel browser. Accedi dal telefono, poi aggiungilo alla schermata Home così si apre come un'app. Le Impostazioni nell'app ti mostrano come.
    - q: Posso dividere per voce?
      a: No. Ogni spesa ha un solo pagatore e la dividi in parti uguali, per importi esatti o per percentuale.
    - q: Funziona offline?
      a: No, serve una connessione.
    - q: Serve un account a tutti nel gruppo?
      a: Sì. Tutti nel gruppo hanno bisogno di un account gratuito, e per registrarsi basta un indirizzo email.
