faq:
  heading: "Ceisteanna"
  items:
    - q: "An féidir leis an gcíos athrá go huathoibríoch?"
      a: "Ní féidir, ní dhéantar billí a athrá. Cóipeáil cíos na míosa seo caite go tapa, athraigh an dáta agus tá tú réidh."
    - q: "An féidir linn roinnt de réir méid an tseomra?"
      a: "Is féidir, de réir céatadáin. Tabhair sciar do gach comhchónaitheoir a léiríonn a sheomra, fad is a dhéanann na sciar 100 le chéile. Clúdaíonn [roinn costais](page:feature/split-expenses) na bealaí eile le roinnt."
    - q: "Cad má bhogann comhchónaitheoir amach agus airgead dlite aige?"
      a: "Ní féidir leo an grúpa a fhágáil go dtí go mbeidh socraithe acu, mar ní féidir le haon duine imeacht fad is atá airgead dlite acu nó dlite dóibh. Fanann na huimhreacha macánta go dtí go mbíonn gach duine cothrom."
    - q: "An n-íocann Side Badger na billí?"
      a: "Ní íocann. Coinníonn sé an chuntas agus molann sé liosta gearr íocaíochtaí. Íocann sibh a chéile ar an gcaoi is fearr libh, ansin taifeadann tú é, mar a mhíníonn [socraigh suas](page:feature/settle-up)."
    - q: "An féidir le comhchónaitheoir amháin na leabhair a choinneáil?"
      a: "Is féidir. Déan riarthóir de agus úsáid grúpa bainistithe, áit a dteastaíonn ceadú ó bhaill nua agus nach féidir ach le cruthaitheoirí agus riarthóirí costais a athrú."
