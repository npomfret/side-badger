meta:
  title: 无需下载的分账应用 | Side Badger
  description: 你的手机已经够满了，我们懂。Side Badger 在浏览器里运行，无需应用商店，无需下载。添加到主屏幕后，它就像应用一样打开。
h1: 没有应用商店，不用下载，用起来却像应用
navLabel: 网页应用
lead: Side Badger 就在你的浏览器里。不用去应用商店搜索，也不用先下载什么。在手机或电脑上登录，和群组一起在线分摊支出，想一键打开时再把它添加到主屏幕或程序坞。
cta:
  heading: 打开，登录，建个群组。
  body: 创建账户，建一个群组，添加第一笔支出，全在你已经打开的浏览器里完成。想先看看流程？看看[使用方式](page:how-it-works)，或者查看[免费包含什么](page:pricing)。
problem:
  heading: 你的手机已经满了，我们懂。
  body: 里面某处有四千张同一个日落的照片，还有一条你从春天起一直划掉的存储空间警告。它最不需要的，就是再多一个应用，只为了分摊一顿晚餐。所以 Side Badger 是网页应用。它在手机或电脑的现代浏览器中运行。在手机上，它使用移动端布局，群组页面分成选项卡，控件也便于触摸。有些附加功能，比如添加到主屏幕，取决于你的浏览器，我们会说明是哪些。
workflow:
  heading: 三步从浏览器标签页到主屏幕
  steps:
    - title: 打开并登录
      body: 在浏览器里打开 Side Badger 并登录。你只需要一个电子邮箱和密码，添加任何内容之前要先验证邮箱。群组里的每个人都需要账户，所以你邀请的人也要这样做。
    - title: 添加到主屏幕或程序坞
      body: 登录后，应用会提示安装自己。浏览器允许时会出现**安装**按钮，不允许时则是**查看方法**。错过了，或者点了不要？**设置**的**添加到主屏幕或程序坞**下有同样的帮助。在 iPhone 或 iPad 上，设置会先显示 iPhone 的步骤，其他设备收在**其他设备**下。无论哪种，之后应用都会在自己的窗口中打开。
      shot: S20
      shotAlt: 设置中的“添加到主屏幕或程序坞”部分，列出把应用添加到设备的步骤
    - title: 想要的话，开启通知
      body: 通知在你开启之前是关闭的，而且每台设备要分别开启。使用通知铃铛提供的**开启**按钮，或**设置**里的**推送通知**开关。在 iPhone 或 iPad 上，请先从主屏幕打开应用。那里只有这一个地方通知才有效。
      shot: S19
      shotAlt: 打开的通知下拉菜单，列出群组里的最近动态
options:
  heading: 各设备的添加方法
  items:
    - title: iPhone 和 iPad
      body: 轻点“分享”按钮，即带有向上箭头的方块。如果看不到，请先轻点“•••”，再轻点“分享”。向下滚动，轻点**添加到主屏幕**。保持**作为网页 App 打开**开启，然后轻点**添加**。如果链接是在另一个应用里打开的，请先在 Safari 中打开该页面，因为那个内置浏览器无法添加。
    - title: Android
      body: 打开浏览器菜单，选择**添加到主屏幕**或**安装应用**。
    - title: 电脑上的 Chrome 或 Edge
      body: 打开浏览器菜单，选择将此网站安装为应用的选项。之后它会有自己的窗口和图标。
    - title: Mac 上的 Safari
      body: 选择**文件**，然后选择**添加到程序坞**。
sections:
  - heading: 通知，要了才有
    body: 推送通知需要主动开启。开启后，当你的群组有新动态时你会收到通知，比如有人添加了支出、留了评论或记录了付款。它们按设备逐台开启，可以从通知铃铛或**设置**里开启，也可以在那里再关掉。它们需要支持推送的浏览器和你的许可。如果浏览器已对该网站屏蔽通知，请先在浏览器设置中允许。在 iPhone 或 iPad 上，只有添加到主屏幕的应用才能使用，浏览器标签页不行。不保证一定送达，所以请把通知当作提醒，而不是承诺。关于动态里会出现什么，请看[一起规划](page:feature/plan-together)。
  - heading: 实时更新，没有刷新按钮
    body: 添加一笔支出，所有人立刻就能看到，连同改了什么、是谁改的。每个群组都保留一份活动历史，通知铃铛则显示你所有群组的动态。没人需要问你有没有看到刚添加的东西，它已经在他们的屏幕上了。
  - heading: 39 种语言，各用各的
    body: Side Badger 支持 39 种语言，包括从右向左书写的阿拉伯语、波斯语和乌尔都语。群组里每个人各选各的，所以同一个群组页面，对一个人可以是阿拉伯语，对下一个人可以是英语。群组唯一需要达成一致的，是数字。
  - heading: 不只为一种用户而做
    body: Side Badger 在设计时考虑了键盘用户和屏幕阅读器用户。成员颜色配有图案，所以你不必分辨绿色和红色。
    items:
      - 跳转链接，让键盘用户可以直接跳到内容。
      - 对话框会管理键盘焦点。
      - 控件带有标签，供屏幕阅读器使用。
      - 从右向左的语言会翻转布局。
limits:
  heading: 网页应用做不到的事
  items:
    - 不能离线使用。Side Badger 需要网络连接，所以在没有 Wi-Fi 的飞机上打不开你的群组。
    - 没有应用商店里的应用，也没有原生的 iPhone 或 Android 应用。Side Badger 是网页应用，添加到主屏幕或程序坞就是获得类似应用的版本的方式。
    - 能否添加到主屏幕或程序坞取决于你的浏览器。菜单名称因浏览器和版本而异，有些浏览器不提供这个功能。
    - 推送通知需要在每台设备上主动开启，还需要支持推送的浏览器和你的许可。在 iPhone 或 iPad 上，只有添加到主屏幕的应用才能使用。不保证一定送达。
    - 没有电子邮件或短信提醒，也没有付款提醒。新动态会显示在应用里，开启推送通知后也会通过推送送达。催款仍然得靠你自己。
    - 活动保留 90 天。
    - 你用电子邮箱和密码登录。没有 Google 或 Apple 登录，而且你需要年满 18 岁。
    - 我们不声称 Side Badger 完全无障碍，也不声称它符合某项正式的无障碍标准。如果有什么妨碍了你，请在应用内告诉我们，你会在那里看到我们的回复。
useCasesHeading: 不用装应用的好处
faq:
  heading: 常见问题
  items:
    - q: 应用商店里有 Side Badger 的应用吗？
      a: 没有。Side Badger 是网页应用。你在浏览器里打开它，可以把它添加到主屏幕或程序坞，让它像应用一样打开。不需要从应用商店下载任何东西。
    - q: 不下载应用也能分账吗？
      a: 可以。在手机或电脑的浏览器里打开 Side Badger，登录，建一个群组即可。添加到主屏幕或程序坞是可选的。
    - q: 可以离线使用吗？
      a: 不可以。即使已添加到主屏幕或程序坞，Side Badger 也需要网络连接。
    - q: 为什么我的 iPhone 收不到通知？
      a: 在 iPhone 或 iPad 上，只有添加到主屏幕的应用才能使用通知，浏览器标签页不行。先添加，再从主屏幕图标打开，然后在**设置**里开启通知。不保证一定送达，所以如果漏了一条，群组的活动历史里仍能看到添加了什么。
    - q: 我必须开启通知吗？
      a: 不必。通知在你开启之前是关闭的，而且按设备逐台开启。没有通知，新动态仍会显示在应用里，打开着的人也会立刻看到变化。
    - q: 群组里的每个人都需要账户吗？
      a: 需要。你只需要一个电子邮箱和密码，添加任何内容之前要先验证邮箱。每位加入群组的人都一样，用哪部手机或电脑都行。
