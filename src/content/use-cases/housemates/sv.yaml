featuresHeading: Funktionerna ett hushåll använder
faq:
  heading: Frågor
  items:
    - q: Kan hyran upprepas automatiskt?
      a: Nej, det finns inga återkommande räkningar. Kopiera förra månadens hyra med ett par tryck, ändra datumet så är du klar.
    - q: Kan vi dela efter rummens storlek?
      a: Ja, i procent. Ge varje rumskamrat en andel som speglar rummet, så länge andelarna blir 100 tillsammans. [Dela utgifter](page:feature/split-expenses) tar upp de andra sätten att dela.
    - q: Vad händer om en rumskamrat flyttar ut med en skuld?
      a: Hen kan inte lämna gruppen förrän hen har gjort upp, eftersom ingen kan lämna så länge hen är skyldig eller har pengar att få. Siffrorna förblir ärliga tills alla är kvitt.
    - q: Betalar Side Badger räkningarna?
      a: Nej. Det håller räkningen och föreslår en kort lista med betalningar. Ni betalar varandra hur ni vill och registrerar det sedan, som [göra upp](page:feature/settle-up) förklarar.
    - q: Kan en rumskamrat sköta bokföringen?
      a: Ja. Gör hen till administratör och använd en hanterad grupp, där nya medlemmar behöver godkännande och bara skapare och administratörer kan ändra utgifter.
