sections:
  - heading: 39 idiomas, y pensado para más gente
    body: Usa Side Badger en 39 idiomas, incluidos el árabe, el persa y el urdu, que se escriben de derecha a izquierda. Cada persona del grupo puede elegir el suyo, así que la página del grupo puede estar en árabe para una persona y en español para la siguiente. También está pensado para quienes usan teclado y lector de pantalla, y los colores de los miembros llevan patrones, para que no tengas que distinguir el verde del rojo.
faq:
  heading: Preguntas
  items:
    - q: ¿Necesita cuenta todo el mundo?
      a: Sí, una gratis. Cada persona verifica su correo antes de añadir nada.
    - q: ¿Hay una app?
      a: Funciona en el navegador. Inicia sesión y luego añádela a tu pantalla de inicio o a tu dock para que se abra como una app. Los Ajustes de la app te muestran cómo. No hay versión de tienda de aplicaciones ni modo sin conexión.
    - q: ¿Side Badger mueve dinero?
      a: No. Lleva la cuenta y sugiere pagos, y vosotros os pagáis como queráis. Después registras el pago. Consulta [saldar cuentas](page:feature/settle-up).
    - q: ¿Puede alguien irse debiendo dinero?
      a: No. Nadie puede salir de un grupo mientras deba o le deban dinero, así que primero se salda.
    - q: ¿Cuántas personas pueden unirse a un grupo?
      a: Hasta 50 personas por grupo. Invítalas con un enlace o un código QR, y activa la aprobación si quieres que un administrador deje entrar a cada persona.
    - q: ¿Y los viajes con más de una moneda?
      a: Los saldos se llevan por separado para cada moneda. Consulta [varias monedas](page:feature/multiple-currencies).
