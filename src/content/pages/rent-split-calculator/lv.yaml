faq:
  heading: "Jautājumi"
  items:
    - q: "Kas ir godīgāk, istabas lielums vai ienākumi?"
      a: "Neviens no tiem nav vienmēr godīgāks. Istabas lielums der kopīrniekiem, kas maksā par telpu, kurā guļ. Ienākumi der pāriem un draugiem ar ļoti atšķirīgu algu. Vienojieties par to pirms pirmās īres dienas, nevis pēc tās."
    - q: "Vai rēķini jādala tāpat?"
      a: "Kopīrniekiem parasti nē. Enerģiju un internetu izmanto visi, tāpēc vienādi ir vienkāršāk, kā piemērā. Pēc ienākumiem kalkulators rēķiniem dod tādas pašas daļas kā īrei."
    - q: "Vai varu izmantot kvadrātpēdas?"
      a: "Jā. Izvēlieties ft² un ierakstiet platības kvadrātpēdās. Vienība ir tikai apzīmējums, un daļas sanāk tādas pašas, ja vien visi izmanto vienu un to pašu."
    - q: "Vai kalkulators ir bez maksas?"
      a: "Jā. Bez maksas. Bez reklāmām. Bez dienas ierobežojumiem. Arī konts nav vajadzīgs."
