meta:
  title: "گروپ سفر کے اخراجات 140 کرنسیوں میں تقسیم کریں"
  description: "گروپ سفر میں ٹریک کریں کس نے کیا ادا کیا، اخراجات مقامی کرنسی میں درج کریں، انہیں تبدیل کریں یا نہ کریں، اور آخر میں ایک بار حساب برابر کریں۔ مفت، آپ کے براؤزر میں۔"
h1: "گروپ سفر کے اخراجات 140 کرنسیوں میں تقسیم کریں"
navLabel: "گروپ سفر"
lead: "ولا، ٹیکسیاں، اور مشروبات کا وہ ایک دور جس کے لیے کسی کو یاد نہیں کہ اس نے ادا کرنے کی حامی کب بھری۔ آپ کے باہر ہوتے ہوئے Side Badger چلتا ہوا حساب رکھتا ہے، [پاؤنڈ، یورو اور 138 دوسری کرنسیاں سنبھالتا ہے](page:feature/multiple-currencies)، اور گھر پہنچنے پر آپ کو [ادائیگیوں کی مختصر فہرست](page:feature/settle-up) دیتا ہے۔"
cta:
  heading: "چھٹیوں کا حساب، رنگت اترنے سے پہلے نمٹا ہوا"
  body: "گروپ بنائیں، سفر والوں کو دعوتی لنک بھیجیں، اور اخراجات ہوتے ہی شامل کریں۔"
  button: "مفت اکاؤنٹ بنائیں"
scenario:
  heading: "سب نے کسی نہ کسی کرنسی میں کچھ نہ کچھ ادا کیا"
  body: "کسی نے پروازیں بک کیں، کسی اور نے ولا کارڈ پر ڈالا، اور تیسرے نے ڈنر نقد ادا کیا۔ تیسرے دن تک کسی کو معلوم نہیں کہ کون آگے ہے۔ سوال سادہ ہے، چاہے جواب عموماً ایسی اسپریڈشیٹ میں رہتا ہو جسے کوئی کھولنا نہیں چاہتا۔ کس نے کیا ادا کیا، کس کرنسی میں، اور سب آخر میں ایک بار حساب برابر کیسے کریں؟"
sections:
  - heading: "جانے سے پہلے"
    body: "ولا کی مختصر فہرست ووٹ کے لیے رکھیں، چاہیں تو گمنام طور پر، تاکہ فیصلہ گروپ کا ہو نہ کہ اس کا جو سب سے دیر تک منہ پھلائے۔ پھر مشترکہ خریداری کی فہرست کو خریداری کے بلوں کے ساتھ رکھیں، تاکہ کوئی سن کریم کی تین ٹیوبیں نہ خریدے اور ایک بھی پلگ ایڈاپٹر نہ لے۔"
  - heading: "جب آپ باہر ہوں"
    body: "ہر خرچہ ہوتے ہی اسی کرنسی میں شامل کریں جس میں آپ نے ادا کیا۔ رسید کی تصویر لیں اور Side Badger کل رقم، تاریخ اور جگہ آپ کے جانچنے کے لیے بھر دیتا ہے؛ رسید کی تصاویر Google کی AI سروس پڑھتی ہے۔ رقم کو موجودہ ایکسچینج ریٹ پر تبدیل کریں، جسے آپ اس ریٹ پر بدل سکتے ہیں جو آپ کو واقعی ملا، اور اصل رقم خرچے پر رہتی ہے۔ یا یورو کو یورو ہی رہنے دیں اور بعد میں طے کریں۔ گروپ ایک کرنسی بھی چن سکتا ہے، اور نئے اخراجات خود بخود اس میں تبدیل ہو جاتے ہیں۔"
  - heading: "ہر ایک نے سب کچھ نہیں کیا"
    body: "کچھ لوگوں نے ڈنر چھوڑ دیا، کچھ کشتی کی سیر سے الگ رہے۔ انہیں ان اخراجات سے نکال دیں جن کا وہ حصہ نہیں تھے، اور باقی [برابر، عین رقم یا فیصد کے مطابق](page:feature/split-expenses) تقسیم کریں۔ کوئی سفر کے اس حصے کی ادائیگی نہیں کرتا جو اس نے سو کر گزارا۔"
  - heading: "گھر پہنچ کر حساب برابر کریں"
    body: "Side Badger ادائیگیوں کی ایک مختصر فہرست تجویز کرتا ہے جو سب کا حساب برابر کر دیتی ہے۔ جیسے چاہیں ایک دوسرے کو ادا کریں، پھر اسے ریکارڈ کریں۔ ملی جلی کرنسیوں کے ساتھ، ہر ایک کو الگ رکھیں یا ساتھ ساتھ تبدیل کریں؛ نیچے لزبن کی مثال دونوں دکھاتی ہے۔"
  - heading: "دلہا دلہن کے ہفتے کے اختتامی پروگرام"
    body: "مہمانِ خصوصی کے ساتھ ہفتے کے آخر کا سفر کو کچھ زیادہ انتظام چاہیے۔ اسے منظم گروپ بنائیں، جہاں ایڈمن نئے ارکان کو منظور کرتے ہیں اور صرف تخلیق کار اور ایڈمن اخراجات بدل سکتے ہیں۔ مہمانِ خصوصی کے حصے کے لیے عین رقم استعمال کریں، گروپ کو ان کرنسیوں تک محدود کریں جو آپ واقعی استعمال کر رہے ہیں، اور ختم ہونے پر گروپ مقفل کر دیں تاکہ اعداد اپنی جگہ رہیں۔"
exampleAfter: 4
