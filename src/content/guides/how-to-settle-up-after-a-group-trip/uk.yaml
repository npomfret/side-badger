faq:
  heading: "Запитання"
  items:
    - q: "Хто має записувати платіж: той, хто платить, чи той, кому платять?"
      a: "Щоб записати платіж, потрібен дозвіл редагувати витрати, а форма питає **Хто заплатив?** і **Хто отримав платіж?** Редагувати запис пізніше може лише той, хто його створив, тож зазвичай найпростіше, коли це робить платник кнопкою швидкого розрахунку."
    - q: "Що, якщо поїздка була у двох валютах?"
      a: "Баланси ведуться окремо для кожної валюти, тож борг в євро лишається боргом в євро, і кожна валюта отримує власний короткий список, хіба що витрати конвертували, коли їх вносили. [Кілька валют](page:guide/how-to-split-a-trip-paid-in-several-currencies) показують обидва способи."
    - q: "Розраховуватися під час поїздки чи наприкінці?"
      a: "Підходить будь-що. Кожен записаний платіж змінює баланси, тож платіж, здійснений посеред поїздки, зараховується в підсумковий список. Наприкінці простіше, бо [вся поїздка](page:use-case/group-trips) в одному місці."
