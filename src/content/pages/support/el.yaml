meta:
  title: "Βοήθεια και υποστήριξη | Side Badger"
  description: "Ξεχάσατε τον κωδικό, σύνδεσμος που δεν δουλεύει, πληρωμή που καταγράφηκε λάθος; Σύντομες απαντήσεις σε ό,τι μπλοκάρει τον κόσμο και πώς να μας βρείτε."
h1: "Βοήθεια και υποστήριξη, χωρίς μουσική αναμονής"
navLabel: "Βοήθεια και υποστήριξη"
lead: "Σύντομες απαντήσεις σε όσα μπλοκάρουν τον κόσμο, από έναν ξεχασμένο κωδικό ως το οριστικό κλείσιμο μιας ομάδας. Κάθε μία παραπέμπει στη σελίδα που εξηγεί περισσότερα. Δεν βρίσκετε τη δική σας; Πείτε μας το μέσα από την εφαρμογή ή στείλτε μας μια γραμμή."
cta:
  heading: "Ήρθατε για βοήθεια, μένετε για το μοίρασμα;"
  body: "Δεν έχετε λογαριασμό ακόμα; Ξεκινήστε μια ομάδα, μοιραστείτε τον σύνδεσμο και προσθέστε το πρώτο έξοδο. Δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
groups:
  - heading: "Σύνδεση"
    items:
      - q: "Ξεχάσατε τον κωδικό σας;"
        a: "Συμβαίνει και στους καλύτερους ασβούς. Επιλέξτε **Ξεχάσατε τον κωδικό;** στην οθόνη **Σύνδεση**, πληκτρολογήστε το email του λογαριασμού σας και ακολουθήστε τον σύνδεσμο στο email που θα σας στείλουμε για να ορίσετε νέο. Το [πώς λειτουργεί](page:how-it-works) καλύπτει τι άλλο χρειάζεται ένας λογαριασμός."
      - q: "Έχω εγγραφεί, αλλά δεν μπορώ να προσθέσω τίποτα. Γιατί;"
        a: "Τις περισσότερες φορές το email σας δεν έχει επαληθευτεί ακόμα, οπότε ανοίξτε τον σύνδεσμο στο email επαλήθευσης ή επιλέξτε **Επαναποστολή email επαλήθευσης** στη γραμμή υπενθύμισης για να πάρετε καινούργιο. Αν έχετε επαληθευτεί, η ομάδα μπορεί να είναι κλειδωμένη ή τα δικαιώματά της να μην σας το επιτρέπουν, και ο θεατής βλέπει τα πάντα και δεν αλλάζει τίποτα, όπως εξηγούν οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions)."
      - q: "Πώς αλλάζω το email ή τον κωδικό μου;"
        a: "Στις **Ρυθμίσεις** επιλέξτε **Αλλαγή Email** ή **Αλλαγή Κωδικού**. Και τα δύο ζητούν πρώτα τον τρέχοντα κωδικό σας και μια νέα διεύθυνση email πρέπει να επαληθευτεί από τον σύνδεσμο που θα στείλουμε σε αυτήν. Το [πώς λειτουργεί](page:how-it-works) καλύπτει τους λογαριασμούς."
      - q: "Μπορώ να συνδεθώ με Google ή Apple;"
        a: "Όχι. Χρειάζεστε μόνο μια διεύθυνση email και έναν κωδικό τουλάχιστον 12 χαρακτήρων, και μπορείτε να τσεκάρετε το **Να με θυμάσαι** στο δικό σας κινητό ή υπολογιστή. Η σελίδα για τη [web εφαρμογή](page:feature/web-app) καλύπτει τα υπόλοιπα για να ξεκινήσετε."
  - heading: "Συμμετοχή σε ομάδα"
    items:
      - q: "Κάποιος μου έστειλε σύνδεσμο πρόσκλησης. Πώς μπαίνω;"
        a: "Ανοίξτε τον και μετά συνδεθείτε ή δημιουργήστε δωρεάν λογαριασμό. Θα δείτε μια προεπισκόπηση της ομάδας, θα διαλέξετε το όνομα με το οποίο θα σας βλέπουν εκεί και θα πατήσετε **Συμμετοχή στην Ομάδα**. Οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions) δείχνουν ολόκληρη τη διαδρομή."
      - q: "Γράφει «Αναμονή έγκρισης». Έκανα κάτι λάθος;"
        a: "Καθόλου. Αυτή η ομάδα θέλει έναν διαχειριστή να αφήνει μέσα τον καθένα, οπότε το αίτημά σας έχει πάει στους διαχειριστές της και δεν βλέπετε τι υπάρχει μέσα μέχρι να το εγκρίνει κάποιος. Ένα φιλικό σκούντημα από κοντά επιτρέπεται, και οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions) εξηγούν την έγκριση."
      - q: "Ο σύνδεσμος γράφει ότι δεν είναι έγκυρος ή ότι έχει λήξει."
        a: "Οι σύνδεσμοι πρόσκλησης διαρκούν όσο διάλεξε όποιος τους έφτιαξε, από 15 λεπτά έως 5 ημέρες. Ζητήστε από κάποιον στην ομάδα καινούργιο σύνδεσμο ή τον κωδικό QR αν βρίσκεστε στο ίδιο δωμάτιο. Το [πώς λειτουργεί](page:how-it-works) καλύπτει τις προσκλήσεις."
  - heading: "Έξοδα"
    items:
      - q: "Πώς προσθέτω ένα έξοδο;"
        a: "Ανοίξτε την ομάδα και επιλέξτε **Προσθήκη Εξόδου**. Πείτε τι ήταν, πόσο κόστισε, ποιος πλήρωσε και ποιοι το μοιράστηκαν και μετά χωρίστε το εξίσου, με ακριβή ποσά ή με ποσοστά. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) εξηγεί βήμα βήμα κάθε επιλογή."
      - q: "Μπορεί το ενοίκιο να επαναλαμβάνεται κάθε μήνα;"
        a: "Όχι αυτόματα, γιατί δεν υπάρχουν επαναλαμβανόμενα έξοδα. Ανοίξτε το ενοίκιο του προηγούμενου μήνα και επιλέξτε **Αντιγραφή εξόδου**, και η φόρμα έρχεται συμπληρωμένη, έτοιμη για νέα ημερομηνία και ό,τι άλλαξε. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) λέει περισσότερα για την αντιγραφή."
      - q: "Πληκτρολόγησα λάθος ποσό. Μπορώ να το διορθώσω;"
        a: "Ναι. Επεξεργαστείτε το έξοδο, εφόσον τα δικαιώματα της ομάδας σάς το επιτρέπουν και η ομάδα δεν είναι κλειδωμένη. Η προηγούμενη έκδοση διατηρείται, οπότε κανείς δεν χρειάζεται να σας πιστέψει στον λόγο σας για το τι άλλαξε, όπως εξηγεί ο [διαχωρισμός εξόδων](page:feature/split-expenses)."
      - q: "Ένα έξοδο δείχνει λάθος και δεν είναι δικό μου. Τι κάνω;"
        a: "Επιλέξτε **Έχω μια ερώτηση** σε αυτό και πείτε γιατί, και ολόκληρο το έξοδο μένει εκτός των υπολοίπων όλων μέχρι να κλείσει την ερώτηση το άτομο που ρώτησε ή ένας διαχειριστής. Δεν υπάρχει τέτοιο κουμπί; Μόνο όσοι περιλαμβάνονται σε ένα έξοδο μπορούν να ρωτήσουν, ένας διαχειριστής πρέπει πρώτα να ενεργοποιήσει το **Να επιτρέπονται ερωτήσεις για έξοδα** στις ρυθμίσεις της ομάδας, και ο [οδηγός για το αμφισβητούμενο έξοδο](page:guide/what-to-do-when-someone-disputes-a-shared-expense) έχει τη διπλωματία."
  - heading: "Πληρωμές"
    items:
      - q: "Στέλνει το Side Badger τα χρήματα;"
        a: "Όχι, το Side Badger δεν μετακινεί ποτέ χρήματα. Πληρώστε ο ένας τον άλλον όπως θέλετε, με τραπεζική μεταφορά, μετρητά ή ό,τι σας βολεύει, και μετά καταγράψτε την πληρωμή ώστε να ενημερωθούν τα υπόλοιπα. Ο οδηγός [Πώς να τακτοποιηθείτε μετά από ένα ομαδικό ταξίδι](page:guide/how-to-settle-up-after-a-group-trip) περνά τη διαδικασία από την αρχή ως το τέλος."
      - q: "Πώς καταγράφω μια πληρωμή;"
        a: "Επιλέξτε **Τακτοποίηση** στην ομάδα, πείτε ποιος πλήρωσε και ποιος την έλαβε, πληκτρολογήστε το ποσό ή αφήστε ένα κουμπί **Γρήγορη τακτοποίηση** να το συμπληρώσει, και επιλέξτε **Καταγραφή Εκκαθάρισης**. Πληρώθηκε μόνο ένα μέρος; Καταγράψτε όσα πληρώθηκαν και τα υπόλοιπα μένουν στο υπόλοιπο, όπως εξηγεί η [εκκαθάριση](page:feature/settle-up)."
      - q: "Κατέγραψα μια πληρωμή λάθος. Μπορώ να τη διορθώσω;"
        a: "Όποιος την κατέγραψε μπορεί να την επεξεργαστεί από το ιστορικό **Εκκαθαρίσεις** της ομάδας, και αυτός ή ένας διαχειριστής μπορεί να τη διαγράψει, κάτι που την αφαιρεί από τα υπόλοιπα. Μια πληρωμή που αφορά κάποιον που έχει έκτοτε φύγει από την ομάδα δεν μπορεί να επεξεργαστεί. Η [εκκαθάριση](page:feature/settle-up) καλύπτει το ιστορικό."
  - heading: "Ειδοποιήσεις και αρχική οθόνη"
    items:
      - q: "Πώς ενεργοποιώ τις ειδοποιήσεις;"
        a: "Ενεργοποιήστε τις **Ειδοποιήσεις push** στις **Ρυθμίσεις** και επιτρέψτε τες όταν το ρωτήσει το πρόγραμμα περιήγησής σας. Αν το πρόγραμμα περιήγησης τις έχει ήδη αποκλείσει, επιτρέψτε τες πρώτα στις δικές του ρυθμίσεις. Κάθε συσκευή ενεργοποιείται ξεχωριστά και η παράδοση δεν είναι εγγυημένη, οπότε δείτε μια ειδοποίηση ως σκούντημα και όχι ως υπόσχεση, όπως εξηγεί η σελίδα για τη [web εφαρμογή](page:feature/web-app)."
      - q: "Γιατί δεν δουλεύουν οι ειδοποιήσεις στο iPhone μου;"
        a: "Σε iPhone ή iPad δουλεύουν μόνο στην εφαρμογή που έχετε προσθέσει στην αρχική οθόνη, ποτέ σε καρτέλα του προγράμματος περιήγησης. Προσθέστε την, ανοίξτε την από το εικονίδιο στην αρχική οθόνη και μετά ενεργοποιήστε τις στις **Ρυθμίσεις**. Η σελίδα [Σχεδιάστε μαζί](page:feature/plan-together) δείχνει για τι σας ενημερώνουν."
      - q: "Υπάρχει εφαρμογή για λήψη;"
        a: "Όχι από κατάστημα εφαρμογών, επειδή το Side Badger τρέχει στο πρόγραμμα περιήγησής σας. Συνδεθείτε και μετά ακολουθήστε το **Προσθήκη στην αρχική οθόνη ή στο Dock** στις **Ρυθμίσεις**, και ανοίγει σαν εφαρμογή, σε δικό του παράθυρο. Η σελίδα για τη [web εφαρμογή](page:feature/web-app) έχει τα βήματα για κάθε συσκευή."
  - heading: "Αποχώρηση, αρχειοθέτηση, κλείδωμα και κλείσιμο"
    items:
      - q: "Πώς αποχωρώ από μια ομάδα;"
        a: "Τακτοποιηθείτε και μετά επιλέξτε **Αποχώρηση Ομάδας**. Δεν μπορείτε να φύγετε όσο χρωστάτε ή σας οφείλονται χρήματα έστω και σε ένα νόμισμα, όσο ένα έξοδο στο οποίο συμμετέχετε έχει ανοιχτή ερώτηση, ή αν είστε ο τελευταίος διαχειριστής ή το μοναδικό μέλος, και για να γυρίσετε χρειάζεστε νέα πρόσκληση. Οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions) έχουν τις λεπτομέρειες."
      - q: "Πώς βγάζω μια παλιά ομάδα από τον πίνακα ελέγχου μου;"
        a: "Επιλέξτε **Αρχειοθέτηση Ομάδας**. Εξαφανίζεται από τον δικό σας πίνακα και όχι των άλλων, μπορείτε ακόμα να την ανοίξετε και να τη χρησιμοποιήσετε, και η **Επαναφορά Ομάδας** την επαναφέρει. Οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions) συγκρίνουν την αρχειοθέτηση, το κλείδωμα και το κλείσιμο."
      - q: "Το ταξίδι τελείωσε. Μπορούμε να σταματήσουμε τους αριθμούς από το να αλλάζουν;"
        a: "Ναι. Ένας διαχειριστής μπορεί να ενεργοποιήσει το **Κλείδωμα Ομάδας** στις ρυθμίσεις της ομάδας και κανείς δεν μπορεί να προσθέσει ή να επεξεργαστεί έξοδα, να καταγράψει νέες πληρωμές ή να αλλάξει λίστες και δημοσκοπήσεις μέχρι να την ξεκλειδώσει ένας διαχειριστής. Όλοι μπορούν ακόμα να διαβάσουν την ομάδα και το ιστορικό της, και κανένα ταξί της τελευταίας στιγμής δεν χώνεται μέσα, όπως εξηγούν οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions)."
      - q: "Μπορώ να διαγράψω μια ομάδα;"
        a: "Ένας διαχειριστής μπορεί να την κλείσει με το **Κλείσιμο ομάδας**, αφού πληκτρολογήσει το όνομα της ομάδας για επιβεβαίωση. Το κλείσιμο είναι οριστικό και κάνει την ομάδα μη διαθέσιμη για όλους, οπότε αν θέλετε απλώς να μην φαίνεται, αρχειοθετήστε την. Οι [ομάδες και δικαιώματα](page:feature/groups-and-permissions) έχουν τα ψιλά γράμματα."
contact:
  heading: "Ακόμα κολλημένοι;"
  items:
    - q: "Βρήκατε σφάλμα ή θέλετε να αλλάξει κάτι;"
      a: "Πείτε μας το μέσα από την εφαρμογή. Επιλέξτε **Σχόλια** στο μενού του λογαριασμού σας, μετά **Αποστολή σχολίων**, και διαλέξτε **Αναφορά προβλήματος**, **Αίτημα βοήθειας** ή **Αίτημα λειτουργίας**. Επισυνάψτε στιγμιότυπο οθόνης αν βοηθά, και όταν απαντήσουμε θα βρείτε την απάντηση στο ίδιο νήμα."
    - q: "Προτιμάτε email;"
      a: "Γράψτε στη διεύθυνση παρακάτω. Πείτε για ποια ομάδα πρόκειται, τι κάνατε και τι περιμένατε να γίνει. Το ξέσπασμα επιτρέπεται, οι κωδικοί όχι, οπότε μην στείλετε ποτέ τον δικό σας."
  emailLabel: "Στείλτε μας email στη διεύθυνση"
  email: support@sidebadger.me
