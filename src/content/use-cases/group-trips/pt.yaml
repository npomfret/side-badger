meta:
  title: "Divide os custos de uma viagem em grupo, em 140 moedas"
  description: "Regista quem pagou o quê numa viagem em grupo, introduz os custos na moeda local, converte-os ou não, e acerta tudo uma só vez no fim. Grátis, no teu navegador."
h1: "Divide os custos de uma viagem em grupo, em 140 moedas"
navLabel: "Viagens em grupo"
lead: "Regista a villa, o táxi e a ronda de cocktails que ninguém se lembra de ter oferecido pagar. O Side Badger mantém a conta enquanto estás fora, [lida com libras, euros e outras 138 moedas](page:feature/multiple-currencies) e dá-te uma [lista curta de pagamentos](page:feature/settle-up) quando chegares a casa."
cta:
  heading: "As contas das férias, feitas antes de o bronze desaparecer"
  body: "Cria um grupo, envia o link de convite às pessoas da viagem e adiciona os custos à medida que acontecem."
  button: "Criar uma conta grátis"
scenario:
  heading: "Toda a gente pagou alguma coisa, em alguma moeda"
  body: "Alguém reservou os voos, outra pessoa pôs a villa no cartão e uma terceira pagou o jantar em dinheiro. Ao terceiro dia ninguém sabe quem está à frente. A pergunta é simples, mesmo que a resposta costume viver numa folha de cálculo que ninguém quer abrir. Quem pagou o quê, em que moeda, e como é que todos acertam as contas uma só vez no fim?"
sections:
  - heading: "Antes de partir"
    body: "Põe a lista de villas a votos, de forma anónima se preferires, para a decisão pertencer ao grupo e não a quem amua durante mais tempo. Depois mantém a lista de compras partilhada junto das contas das compras, para ninguém comprar três tubos de protetor solar e nenhum adaptador de tomada."
  - heading: "Enquanto estás fora"
    body: "Adiciona cada custo quando acontece, na moeda em que o pagaste. Tira uma foto ao recibo e o Side Badger preenche o total, a data e o local para tu confirmares; as imagens dos recibos são lidas pelo serviço de IA da Google. Converte o valor a uma taxa de câmbio atual, que podes alterar para a taxa que realmente tiveste, e o valor original fica na despesa. Ou deixa os euros como euros e decide mais tarde. Um grupo também pode escolher uma só moeda, e as novas despesas convertem-se para ela automaticamente."
  - heading: "Nem todos fizeram tudo"
    body: "Alguns saltaram o jantar, outros ficaram em terra no passeio de barco. Deixa-os de fora dos custos de que não fizeram parte e divide o resto [em partes iguais, por valores exatos ou por percentagem](page:feature/split-expenses). Ninguém paga pela parte da viagem que passou a dormir."
  - heading: "Acerta tudo quando chegares a casa"
    body: "O Side Badger sugere uma lista curta de pagamentos que acerta as contas de todos. Paguem-se como preferirem e depois registem. Com várias moedas, mantém cada uma em separado ou converte à medida que avanças; o exemplo de Lisboa abaixo mostra ambas."
  - heading: "Despedidas de solteiro e de solteira"
    body: "Um fim de semana fora com uma pessoa homenageada dá um pouco mais de trabalho. Faz dele um grupo gerido, onde os administradores aprovam novos membros e só os criadores e administradores podem alterar despesas. Usa valores exatos para a parte da pessoa homenageada, limita o grupo às moedas que realmente usas e bloqueia o grupo quando acabar para os números ficarem como estão."
