faq:
  heading: "Запитання"
  items:
    - q: "Чи є Side Badger безкоштовною альтернативою Splitwise?"
      a: "Для розподілу рахунків у групі так. Сканування чеків, конвертація валют і відсутність реклами безкоштовні, без денних обмежень. Якщо вам потрібні нативний застосунок, офлайн-режим, регулярні витрати чи платежі всередині застосунку, це робить Splitwise, а Side Badger ні."
    - q: "Звідки беруться відомості про Splitwise?"
      a: "З власних сторінок Splitwise: його головної сторінки, сторінки Pro і довідкового центру. Кожен рядок таблиці веде на сторінку, звідки він узятий, а дата над таблицею каже, коли ми їх прочитали. Ми перевіряємо їх щокварталу."
    - q: "Чи лишиться Side Badger безкоштовним?"
      a: "Усе в Side Badger сьогодні безкоштовне, і платного рівня немає. Якщо це колись зміниться, ми попередимо вас заздалегідь. Подробиці на [сторінці цін](page:pricing)."
    - q: "Чи мусить уся моя група переходити?"
      a: "Так. Кожному в групі потрібен безкоштовний обліковий запис Side Badger, і приєднатися можна за посиланням або QR-кодом."
    - q: "Чи є в Side Badger мобільний застосунок?"
      a: "Не в магазині застосунків. Він працює у вашому браузері: увійдіть на телефоні, а потім додайте його на головний екран, щоб він відкривався як застосунок. Як це зробити, показує [як це працює](page:how-it-works)."
