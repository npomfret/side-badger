featuresHeading: "A funkciók, amelyeket egy ház használ"
faq:
  heading: "Kérdések"
  items:
    - q: "Ismétlődhet automatikusan a lakbér?"
      a: "Nem, ismétlődő számlák nincsenek. Másold le a múlt havi lakbért pár koppintással, írd át a dátumot, és kész."
    - q: "Oszthatunk a szobaméret szerint?"
      a: "Igen, százalékosan. Adj minden lakótársnak a szobáját tükröző részt, amíg a részek együtt 100-at adnak. A többi felosztási módról a [költségek felosztása](page:feature/split-expenses) oldalon olvashatsz."
    - q: "Mi van, ha egy lakótárs tartozással költözik ki?"
      a: "Nem hagyhatja el a csoportot, amíg el nem számol, mert senki nem mehet el, amíg tartozik, vagy neki tartoznak. A számok addig maradnak becsületesek, amíg mindenki kvitt nem lesz."
    - q: "A Side Badger fizeti a számlákat?"
      a: "Nem. Vezeti a számolást és egy rövid kifizetéslistát javasol. Fizettek egymásnak, ahogy akartok, aztán rögzítitek, ahogy az [elszámolás](page:feature/settle-up) elmagyarázza."
    - q: "Vezetheti egy lakótárs a könyvelést?"
      a: "Igen. Tedd adminisztrátorrá, és használj felügyelt csoportot, ahol az új tagokat jóvá kell hagyni, és a költségeket csak a létrehozók és az adminisztrátorok változtathatják."
