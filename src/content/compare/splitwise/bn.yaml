sections:
  - heading: "Splitwise যা ভালো করে"
    body: "আপনার গ্রুপের নেটিভ অ্যাপ, অফলাইনে ব্যবহার বা অ্যাপের ভেতরে পেমেন্ট দরকার হলে Splitwise-ই বুদ্ধিমানের বাছাই। পরে ঠেকে শেখার চেয়ে আপনি সেটাই বেছে নিন, আমরা তা-ই চাই। এর নিজের পৃষ্ঠাগুলোতে আছে:"
    items:
      - "**অ্যাপ আর অফলাইনে ব্যবহার।** ওয়েবের পাশাপাশি iPhone ও Android অ্যাপ, আর একটি অফলাইন মোড।"
      - "**ভাগ করার আরও উপায়।** সমান, সঠিক পরিমাণ আর শতাংশের ওপরে শেয়ার, অ্যাডজাস্টমেন্ট আর আইটেম ধরে ভাগ।"
      - "**পুনরাবৃত্ত খরচ।** ভাড়া নিজে থেকে পুনরাবৃত্ত হতে ঠিক করে দিয়ে ভুলে যান।"
      - "**অ্যাপের ভেতরে পেমেন্ট।** কিছু দেশে এটি টাকাও পাঠাতে পারে, Splitwise Pay, Venmo, PayPal বা Pay by Bank-এর মাধ্যমে।"
  - heading: "এখানে বিনামূল্যে, ওখানে টাকা দিয়ে"
    body: "Splitwise Pro হলো Splitwise-এর পেইড প্ল্যান, আর এর নিজের Pro পৃষ্ঠা এমন চারটি জিনিস বিক্রি করে যেগুলোর জন্য Side Badger-এ কিছু লাগে না।"
    items:
      - "**রসিদ স্ক্যান।** Splitwise Pro আপনার রসিদের ছবি স্ক্যান করে। Side Badger সেটা বিনামূল্যে করে, কোনো স্ক্যান ক্রেডিট ছাড়া: এটি মোট, তারিখ আর জায়গা ভরে দেয় আপনার দেখে নেওয়ার জন্য। রসিদের ছবি Google-এর AI পরিষেবা পড়ে।"
      - "**মুদ্রা রূপান্তর।** Splitwise Pro আপনি “Convert” চাপলে একটি গ্রুপের খরচগুলো আপনার ডিফল্ট মুদ্রায় রূপান্তর করে। Side Badger প্রতিটি খরচ লেখার সময়ই রূপান্তর করে, বর্তমান এক্সচেঞ্জ রেটে বা আপনি আসলে যে রেট পেয়েছেন সেটায়, আর মূল পরিমাণ খরচের সঙ্গেই থাকে।"
      - "**কোনো বিজ্ঞাপন নেই।** Splitwise সম্পূর্ণ বিজ্ঞাপনমুক্ত অভিজ্ঞতাকে Pro ফিচার হিসেবে তালিকাভুক্ত করে। Side Badger-এ কোনো বিজ্ঞাপন নেই।"
      - "**দৈনিক কোনো সীমা নেই।** Splitwise Pro সীমাহীন খরচ বিক্রি করে, আর এর সহায়তা কেন্দ্র বলে বিনামূল্যের ব্যবহারকারীরা প্রতিদিন 4টি পর্যন্ত খরচ যোগ করতে পারে। Side Badger-এ দৈনিক কোনো সীমা নেই।"
  - heading: "Splitwise-এ যা আছে, Side Badger-এ নেই"
    body: "এটি Splitwise-এর সব ফিচার নয়, শুধু সেগুলো যেগুলো সাধারণত সিদ্ধান্ত ঠিক করে দেয়। পুরো তালিকা Splitwise-এর নিজের পৃষ্ঠাগুলোতে আছে। এখানে Side Badger যেখানে পিছিয়ে।"
    items:
      - "**নেটিভ অ্যাপ।** Side Badger আপনার ব্রাউজারে চলে। সাইন ইন করুন, তারপর হোম স্ক্রিনে যোগ করুন, এটি অ্যাপের মতো খোলে।"
      - "**অফলাইন মোড।** Side Badger-এর সংযোগ লাগে।"
      - "**অ্যাপের ভেতরে পেমেন্ট।** Side Badger আপনার টাকা কখনও ছোঁয় না। যেভাবে খুশি একে অপরকে দিন, তারপর পেমেন্টটা রেকর্ড করুন।"
      - "**পুনরাবৃত্ত খরচ।** Side Badger-এ নেই। আবার টাইপ না করে গত মাসের ভাড়াটা কপি করুন।"
      - "**শেয়ার বা আইটেম ধরে ভাগ।** Side Badger-এ প্রতি খরচে একজন পেমেন্টকারী, যা সমান ভাগে, সঠিক পরিমাণে বা শতাংশে ভাগ হয়। এর রসিদ স্ক্যান আইটেমগুলো আলাদা আলাদা মানুষের নামে বসায় না।"
      - "**চার্ট আর ডিফল্ট ভাগ।** Splitwise Pro-তে দুটোই আছে। Side Badger কে কার কাছে ঋণী তার হিসাব রাখে, আর পুরো কৌশলটা ওইটুকুই।"
  - heading: "আপনার গ্রুপকে নিয়ে আসা"
    body: "কোনো ইমপোর্টার নেই, তাই চলে আসা মানে নতুন করে শুরু। আগে Splitwise-এ হিসাব মিটিয়ে নিন, তারপর Side Badger-এ একটি গ্রুপ বানিয়ে সবাইকে লিঙ্ক বা QR কোড দিয়ে ডাকুন। গ্রুপের প্রত্যেকের একটি বিনামূল্যের অ্যাকাউন্ট লাগে, আর সাইন আপ করতে শুধু একটি ইমেইল ঠিকানাই লাগে।"
