meta:
  title: "సహాయం, సపోర్ట్ | Side Badger"
  description: "పాస్‌వర్డ్ మర్చిపోయారా, లింక్ పనిచేయడం లేదా, పేమెంట్ తప్పుగా రికార్డ్ అయిందా? Side Badgerలో జనం ఇరుక్కునే వాటికి చిన్న సమాధానాలు, మమ్మల్ని ఎలా సంప్రదించాలో."
h1: "సహాయం, సపోర్ట్, హోల్డ్ మ్యూజిక్ లేకుండా"
navLabel: "సహాయం, సపోర్ట్"
lead: "జనం ఇరుక్కునే వాటికి చిన్న సమాధానాలు, పాస్‌వర్డ్ మర్చిపోవడం నుండి గ్రూప్‌ను శాశ్వతంగా మూసివేయడం వరకు. ప్రతి ఒక్కటి మరింత వివరించే పేజీకి లింక్ చేస్తుంది. మీ ప్రశ్న కనిపించలేదా? యాప్ లోపలి నుండే మాకు చెప్పండి, లేదా మాకు ఒక లైన్ రాయండి."
cta:
  heading: "సహాయం కోసం వచ్చారు, పంపకం కోసం ఉంటారా?"
  body: "ఇంకా ఖాతా లేదా? గ్రూప్ మొదలుపెట్టండి, లింక్ షేర్ చేయండి, మొదటి ఖర్చును జోడించండి. ఉచితం, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
groups:
  - heading: "సైన్ ఇన్"
    items:
      - q: "పాస్‌వర్డ్ మర్చిపోయారా?"
        a: "ఉత్తమ బ్యాడ్జర్లకు కూడా జరుగుతుంది. **లాగిన్** స్క్రీన్‌లో **పాస్‌వర్డ్ మర్చిపోయారా?** ఎంచుకోండి, మీ ఖాతా ఈమెయిల్ ఇవ్వండి, తర్వాత మేము పంపే ఈమెయిల్‌లోని లింక్‌తో కొత్తది ఎంచుకోండి. ఖాతాకు ఇంకా ఏం కావాలో [ఎలా పనిచేస్తుంది](page:how-it-works) చెబుతుంది."
      - q: "నేను సైన్ అప్ చేశాను, కానీ ఏదీ జోడించలేకపోతున్నాను. ఎందుకు?"
        a: "చాలా సార్లు మీ ఈమెయిల్ ఇంకా ధృవీకరించబడి ఉండదు, కాబట్టి ధృవీకరణ ఈమెయిల్‌లోని లింక్ తెరవండి, లేదా కొత్తది కోసం రిమైండర్ బ్యానర్‌లో **ధృవీకరణ ఈమెయిల్‌ను మళ్ళీ పంపు** ఎంచుకోండి. మీరు ధృవీకరించబడి ఉంటే, గ్రూప్ లాక్ అయి ఉండవచ్చు లేదా దాని అనుమతులు మిమ్మల్ని అనుమతించకపోవచ్చు, వ్యూయర్ అన్నీ చూస్తారు, ఏదీ మార్చరు, [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions) వివరిస్తుంది."
      - q: "నా ఈమెయిల్ లేదా పాస్‌వర్డ్‌ను ఎలా మార్చాలి?"
        a: "**సెట్టింగ్‌లు**లో **ఈమెయిల్‌ను మార్చండి** లేదా **పాస్‌వర్డ్‌ను మార్చండి** ఎంచుకోండి. రెండూ ముందు మీ ప్రస్తుత పాస్‌వర్డ్ అడుగుతాయి, కొత్త ఈమెయిల్ చిరునామాను దానికి మేము పంపే లింక్‌తో ధృవీకరించాలి. ఖాతాల గురించి [ఎలా పనిచేస్తుంది](page:how-it-works) చెబుతుంది."
      - q: "Google లేదా Appleతో సైన్ ఇన్ చేయవచ్చా?"
        a: "లేదు. కావలసింది ఒక ఈమెయిల్ చిరునామా, కనీసం 12 అక్షరాల పాస్‌వర్డ్ మాత్రమే, మీ సొంత ఫోన్ లేదా కంప్యూటర్‌లో **నన్ను గుర్తుంచుకో** టిక్ చేయవచ్చు. మొదలుపెట్టడం గురించి మిగిలినది [వెబ్ యాప్](page:feature/web-app) పేజీలో ఉంది."
  - heading: "గ్రూప్‌లో చేరడం"
    items:
      - q: "ఎవరో ఆహ్వాన లింక్ పంపారు. ఎలా చేరాలి?"
        a: "దాన్ని తెరిచి, సైన్ ఇన్ చేయండి లేదా ఉచిత ఖాతా తెరవండి. మీకు గ్రూప్ ప్రివ్యూ కనిపిస్తుంది, అక్కడ ప్రజలకు మీరు ఏ పేరుతో కనిపించాలో ఎంచుకుని, **సమూహంలో చేరు** నొక్కండి. లోపలికి వచ్చే పూర్తి దారిని [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions) చూపిస్తుంది."
      - q: "“ఆమోదం కోసం వేచి ఉంది” అని వస్తోంది. నేను ఏమైనా తప్పు చేశానా?"
        a: "అస్సలు లేదు. ఈ గ్రూప్‌లో ప్రతి వ్యక్తిని అడ్మిన్ లోపలికి రానిస్తారు, కాబట్టి మీ అభ్యర్థన దాని అడ్మిన్లకు వెళ్లింది, వాళ్లలో ఒకరు ఆమోదించే వరకు మీరు లోపల చూడలేరు. ప్రత్యక్షంగా ఒక స్నేహపూర్వక గుర్తుచేత అనుమతే, ఆమోదం గురించి [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions) వివరిస్తుంది."
      - q: "లింక్ చెల్లదని లేదా గడువు ముగిసిందని వస్తోంది."
        a: "ఆహ్వాన లింక్‌లను చేసినవాళ్లు ఎంచుకున్నంత కాలం ఉంటాయి, 15 నిమిషాల నుండి 5 రోజుల వరకు. గ్రూప్‌లో ఎవరినైనా కొత్త లింక్ అడగండి, లేదా ఒకే గదిలో ఉంటే QR కోడ్ అడగండి. ఆహ్వానాల గురించి [ఎలా పనిచేస్తుంది](page:how-it-works) చెబుతుంది."
  - heading: "ఖర్చులు"
    items:
      - q: "ఖర్చును ఎలా జోడించాలి?"
        a: "గ్రూప్ తెరిచి **ఖర్చును జోడించు** ఎంచుకోండి. అది దేనికో, ఎంతో, ఎవరు చెల్లించారో, ఎవరు పంచుకున్నారో చెప్పి, సమానంగా, కచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచండి. ప్రతి ఎంపికను [ఖర్చుల పంపకం](page:feature/split-expenses) వివరిస్తుంది."
      - q: "అద్దె ప్రతి నెలా దానంతట అదే రిపీట్ అవుతుందా?"
        a: "తనంతట తాను కాదు, ఎందుకంటే పునరావృత ఖర్చులు లేవు. గత నెలది తెరిచి **ఖర్చును కాపీ చేయి** ఎంచుకోండి, ఫారం నింపబడి వస్తుంది, కొత్త తేదీ, మారిన వాటి కోసం సిద్ధంగా. కాపీ చేయడం గురించి [ఖర్చుల పంపకం](page:feature/split-expenses)లో మరింత ఉంది."
      - q: "తప్పు మొత్తం టైప్ చేశాను. సరిచేయవచ్చా?"
        a: "అవును. గ్రూప్ అనుమతులు మిమ్మల్ని అనుమతించి, గ్రూప్ లాక్ కాకపోతే ఖర్చును సవరించండి. ముందటి వెర్షన్ ఉంచబడుతుంది, కాబట్టి ఏం మారిందో మీ మాటే నమ్మాల్సిన అవసరం ఎవరికీ లేదు, [ఖర్చుల పంపకం](page:feature/split-expenses) వివరించినట్టు."
      - q: "ఒక ఖర్చు తప్పుగా కనిపిస్తోంది, అది నాది కాదు. ఇప్పుడేం చేయాలి?"
        a: "దానిపై **నాకు ఒక ప్రశ్న ఉంది** ఎంచుకుని కారణం చెప్పండి, అడిగిన వ్యక్తి లేదా ఒక అడ్మిన్ ప్రశ్నను మూసివేసే వరకు ఆ ఖర్చు మొత్తం ఎవరి బ్యాలెన్స్‌లలోనూ ఉండదు. ఆ బటన్ లేదా? ఖర్చులో ఉన్నవాళ్లు మాత్రమే అడగగలరు, ముందు ఒక అడ్మిన్ గ్రూప్ సెట్టింగ్‌లలో **ఖర్చు ప్రశ్నలను అనుమతించండి** ఆన్ చేయాలి, దౌత్యం కోసం [వివాదంలో ఉన్న ఖర్చు గైడ్](page:guide/what-to-do-when-someone-disputes-a-shared-expense) ఉంది."
  - heading: "పేమెంట్లు"
    items:
      - q: "Side Badger డబ్బు పంపుతుందా?"
        a: "లేదు, Side Badger డబ్బును ఎప్పుడూ కదిలించదు. బ్యాంక్ ట్రాన్స్‌ఫర్, నగదు, లేదా ఏది కుదిరితే అలా ఒకరికొకరు చెల్లించుకోండి, తర్వాత బ్యాలెన్స్‌లు సరిపోయేలా పేమెంట్‌ను రికార్డ్ చేయండి. మొదటి నుండి చివరి వరకు [గ్రూప్ ట్రిప్ తర్వాత లెక్క ఎలా తేల్చాలి](page:guide/how-to-settle-up-after-a-group-trip) చెబుతుంది."
      - q: "పేమెంట్‌ను ఎలా రికార్డ్ చేయాలి?"
        a: "గ్రూప్‌లో **సెటిల్ చేయి** ఎంచుకోండి, ఎవరు చెల్లించారో, ఎవరు అందుకున్నారో చెప్పండి, మొత్తాన్ని నమోదు చేయండి లేదా **త్వరిత సెటిల్మెంట్** బటన్ నింపనివ్వండి, తర్వాత **సెటిల్మెంట్‌ను నమోదు చేయి** ఎంచుకోండి. కొంతే చెల్లించారా? చెల్లించినది రికార్డ్ చేయండి, మిగిలినది బ్యాలెన్స్‌లో ఉంటుంది, [లెక్క తేల్చడం](page:feature/settle-up) వివరించినట్టు."
      - q: "పేమెంట్‌ను తప్పుగా రికార్డ్ చేశాను. సరిచేయవచ్చా?"
        a: "రికార్డ్ చేసినవాళ్లు గ్రూప్ **సెటిల్మెంట్స్** చరిత్ర నుండి దాన్ని సవరించవచ్చు, వాళ్లు లేదా ఒక అడ్మిన్ దాన్ని తొలగించవచ్చు, అప్పుడు అది బ్యాలెన్స్‌ల నుండి పోతుంది. ఆ తర్వాత గ్రూప్ వదిలివెళ్లిన వ్యక్తి ఉన్న పేమెంట్‌ను సవరించలేరు. చరిత్ర గురించి [లెక్క తేల్చడం](page:feature/settle-up) చెబుతుంది."
  - heading: "నోటిఫికేషన్లు, హోమ్ స్క్రీన్"
    items:
      - q: "నోటిఫికేషన్లను ఎలా ఆన్ చేయాలి?"
        a: "**సెట్టింగ్‌లు**లో **పుష్ నోటిఫికేషన్లు** ఆన్ చేసి, మీ బ్రౌజర్ అడిగినప్పుడు అనుమతించండి. బ్రౌజర్ ఇప్పటికే వాటిని బ్లాక్ చేసి ఉంటే, ముందు దాని సొంత సెట్టింగ్‌లలో అనుమతించండి. ప్రతి పరికరాన్ని విడిగా ఆన్ చేయాలి, డెలివరీకి హామీ లేదు, కాబట్టి నోటిఫికేషన్‌ను గుర్తుచేతగా చూడండి, వాగ్దానంగా కాదు, [వెబ్ యాప్](page:feature/web-app) పేజీ వివరించినట్టు."
      - q: "నా iPhoneలో నోటిఫికేషన్లు ఎందుకు పనిచేయడం లేదు?"
        a: "iPhone లేదా iPadలో అవి మీ హోమ్ స్క్రీన్‌కు జోడించిన యాప్‌లో మాత్రమే పనిచేస్తాయి, బ్రౌజర్ ట్యాబ్‌లో ఎప్పుడూ కాదు. దాన్ని జోడించి, హోమ్ స్క్రీన్ ఐకాన్ నుండి తెరిచి, తర్వాత **సెట్టింగ్‌లు**లో ఆన్ చేయండి. అవి దేని గురించి చెబుతాయో [కలిసి ప్లాన్ చేయండి](page:feature/plan-together) చూపిస్తుంది."
      - q: "డౌన్‌లోడ్ చేసుకోవడానికి యాప్ ఉందా?"
        a: "యాప్ స్టోర్ నుండి కాదు, ఎందుకంటే Side Badger మీ బ్రౌజర్‌లో నడుస్తుంది. సైన్ ఇన్ చేసి, **సెట్టింగ్‌లు**లో **హోమ్ స్క్రీన్ లేదా Dock కు జోడించండి** అనుసరించండి, అది యాప్‌లా, దాని సొంత విండోలో తెరుచుకుంటుంది. ప్రతి పరికరానికి దశలు [వెబ్ యాప్](page:feature/web-app) పేజీలో ఉన్నాయి."
  - heading: "వదిలివెళ్లడం, ఆర్కైవ్, లాక్, మూసివేయడం"
    items:
      - q: "గ్రూప్‌ను ఎలా వదిలివెళ్లాలి?"
        a: "లెక్క తేల్చుకుని, **సమూహం నుండి వైదొలగండి** ఎంచుకోండి. ఒక్క కరెన్సీలో అయినా మీరు ఇవ్వాల్సి ఉన్నా లేదా రావాల్సి ఉన్నా, మీరు ఉన్న ఖర్చుపై ప్రశ్న తెరిచి ఉన్నా, లేదా మీరే చివరి అడ్మిన్ లేదా ఏకైక సభ్యులైనా వదిలివెళ్లలేరు, తిరిగి రావడానికి కొత్త ఆహ్వానం కావాలి. వివరాలు [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions)లో ఉన్నాయి."
      - q: "పాత గ్రూప్‌ను నా డాష్‌బోర్డ్ నుండి ఎలా తీసివేయాలి?"
        a: "**సమూహాన్ని ఆర్కైవ్ చేయి** ఎంచుకోండి. అది మీ డాష్‌బోర్డ్ నుండి మాయమవుతుంది, ఇతరులది కాదు, మీరు ఇంకా దాన్ని తెరిచి వాడవచ్చు, **ఆర్కైవ్ నుండి వెలికితీయి** దాన్ని తిరిగి తెస్తుంది. ఆర్కైవ్, లాక్, మూసివేతను [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions) పోలుస్తుంది."
      - q: "ట్రిప్ అయిపోయింది. అంకెలు మారకుండా ఆపవచ్చా?"
        a: "అవును. అడ్మిన్ గ్రూప్ సెట్టింగ్‌లలో **సమూహాన్ని లాక్ చేయి** ఆన్ చేయవచ్చు, అప్పుడు అడ్మిన్ అన్‌లాక్ చేసే వరకు ఎవరూ ఖర్చులను జోడించలేరు, సవరించలేరు, కొత్త పేమెంట్లను రికార్డ్ చేయలేరు, జాబితాలను, పోల్స్‌ను మార్చలేరు. అందరూ ఇంకా గ్రూప్‌ను, దాని చరిత్రను చదవగలరు, ఆలస్యంగా వచ్చే ట్యాక్సీ లెక్కలోకి దూరదు, [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions) వివరించినట్టు."
      - q: "గ్రూప్‌ను తొలగించవచ్చా?"
        a: "ఒక అడ్మిన్ గ్రూప్ పేరును టైప్ చేసి నిర్ధారించిన తర్వాత **సమూహాన్ని మూసివేయండి**తో దాన్ని మూసివేయవచ్చు. మూసివేత శాశ్వతం, గ్రూప్ అందరికీ అందుబాటులో లేకుండా పోతుంది, కాబట్టి కంటికి కనబడకుండా చేయాలనుకుంటే బదులుగా ఆర్కైవ్ చేయండి. చిన్న అక్షరాల వివరాలు [గ్రూపులు, అనుమతులు](page:feature/groups-and-permissions)లో ఉన్నాయి."
contact:
  heading: "ఇంకా ఇరుక్కున్నారా?"
  items:
    - q: "బగ్ కనిపించిందా, లేదా ఏదైనా మార్చాలా?"
      a: "యాప్ లోపలి నుండే మాకు చెప్పండి. మీ ఖాతా మెనూలో **ఫీడ్‌బ్యాక్** ఎంచుకుని, తర్వాత **ఫీడ్‌బ్యాక్ పంపండి**, **బగ్‌ను నివేదించండి**, **సహాయం పొందండి** లేదా **కొత్త ఫీచర్** ఎంచుకోండి. అవసరమైతే స్క్రీన్‌షాట్ జోడించండి, మేము సమాధానమిచ్చినప్పుడు అదే థ్రెడ్‌లో కనిపిస్తుంది."
    - q: "ఈమెయిల్ చేయడమే మీకు ఇష్టమా?"
      a: "కింది చిరునామాకు రాయండి. ఏ గ్రూప్ గురించో, మీరు ఏం చేశారో, ఏం జరుగుతుందని ఆశించారో చెప్పండి. కోపం చూపడం పర్వాలేదు; పాస్‌వర్డ్‌లు వద్దు, కాబట్టి మీదాన్ని ఎప్పుడూ పంపకండి."
  emailLabel: "మాకు ఈమెయిల్ చేయండి"
  email: support@sidebadger.me
