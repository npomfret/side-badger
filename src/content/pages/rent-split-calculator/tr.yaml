faq:
  heading: "Sorular"
  items:
    - q: "Hangisi daha adil, oda büyüklüğü mü gelir mi?"
      a: "Her zaman biri değil. Oda büyüklüğü, uyudukları alan için ödeyen ev arkadaşlarına uyar. Gelir, çiftlere ve maaşları çok farklı arkadaşlara uyar. Kira gününden önce kararlaştırın, sonra değil."
    - q: "Faturalar da aynı şekilde mi bölünmeli?"
      a: "Ev arkadaşları için genellikle hayır. Enerjiyi ve interneti herkes kullanır, bu yüzden örnekteki gibi eşit bölmek daha basittir. Gelire göre seçince hesaplayıcı faturalara kiranın paylarını verir."
    - q: "Fit kare kullanabilir miyim?"
      a: "Evet. ft²'yi seçin ve alanlarınızı fit kare olarak yazın. Birim yalnızca bir etikettir; herkes aynı birimi kullandığı sürece paylar aynı çıkar."
    - q: "Hesaplayıcı ücretsiz mi?"
      a: "Evet. Ücretsiz. Reklam yok. Günlük sınır yok. Hesap açmanız da gerekmez."
