meta:
  title: 适合室友、旅行和派对的 Side Badger
  description: 与室友分摊费用、团体旅行，以及派对、婚礼和集体礼物。看看 Side Badger 为每一种群组做了什么。
h1: 适合你这种群组的 Side Badger
navLabel: 使用场景
lead: 室友、假期、单身派对。挑一个你的“混乱”，然后看看和你们类似的群组是怎么记账的。
intro: 每个群组分摊费用的方式都略有不同。这些页面会跟着一个**真实的场景**，从第一笔支出走到最后一笔已记录的付款，并展示计算过程，让你看到自己的群组最终会是什么样。
cta:
  heading: 找到你这种群组了吗？
  body: 创建账户，建一个群组，添加第一笔支出。只需要几分钟。
cardsHeading: 选一个最接近你的情形
sections:
  - heading: 团体旅行
    body: 机票用英镑付，别墅用欧元付，还有一顿只有三个人吃的晚餐。把群组设为换算成英镑，里斯本的四位朋友只需三笔付款，而货币分开记的话要六笔。[分摊团体旅行的费用](page:use-case/group-trips)。
  - heading: 室友
    body: 一个人付房东，另一个人记得交电费，谁买了卫生纸却没人说得清。房租按房间大小分，其他账单平均分，四位室友到月底只需三笔付款，全部付给付了房租的那位。[与室友分摊家庭账单](page:use-case/housemates)。
  - heading: 派对、婚礼和集体礼物
    body: 六个人投票选礼物，一个人去买，每个人出的钱还不一样。一份 £150 的礼物按确切金额分摊，最后是五笔付给买礼物那位的付款，一共 £120。[分摊活动的费用](page:use-case/events-and-celebrations)。
  - heading: 情侣
    body: 分摊那些无聊的开销，别让约会之夜变成季度财务复盘。房租六四分，杂货平均分，两人之间最后只剩一笔付款。[以情侣身份分摊开销](page:use-case/couples)。
  - heading: 先看看它是怎么运作的
    body: 上面每个例子用的都是同样的步骤，从创建群组到记录付款。[使用方式](page:how-it-works)带你走一遍，[指南](page:guides)各讲一个棘手的情形；[定价](page:pricing)说明了费用，也就是一分钱不要，没有广告，也没有每日限制。
faq:
  heading: 常见问题
  items:
    - q: 群组里每个人都需要账户吗？
      a: 是的。大家通过链接或二维码加入，并使用免费账户。
    - q: Side Badger 能代收款项吗？
      a: 不能。你们想怎么付就怎么付，然后记录这笔付款，让余额保持准确。
    - q: 我必须选一种群组类型吗？
      a: 不用。这些使用场景只是示例，不是设置。每个群组的功能都一样，哪种组合合适就用哪种。
