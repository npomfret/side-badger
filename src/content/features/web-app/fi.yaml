meta:
  title: Kulujen jakosovellus ilman latausta | Side Badger
  description: Puhelimesi on täynnä, me tiedämme. Side Badger toimii selaimessa ilman sovelluskauppaa ja latausta. Lisää se aloitusnäytölle, niin se avautuu kuin sovellus.
h1: Ei sovelluskauppaa. Ei latausta. Silti kuin sovellus
navLabel: Verkkosovellus
lead: Side Badger asuu selaimessasi. Sovelluskauppaa ei tarvitse etsiä, eikä mitään tarvitse ladata etukäteen. Kirjaudu sisään puhelimella tai tietokoneella, jaa kulut ryhmäsi kanssa verkossa ja lisää se aloitusnäytölle tai Dockiin, kun haluat sen yhden napautuksen päähän.
cta:
  heading: Avaa. Kirjaudu. Perusta ryhmä.
  body: Luo tili, perusta ryhmä ja lisää ensimmäinen kulu, kaikki selaimessa, joka sinulla on jo auki. Haluatko ensin kierroksen? Katso [näin se toimii](page:how-it-works) tai tarkista, [mitä ilmaiseen kuuluu](page:pricing).
problem:
  heading: Puhelimesi on täynnä. Me tiedämme.
  body: Jossain siellä on neljätuhatta kuvaa samasta auringonlaskusta ja tallennustilavaroitus, jonka olet pyyhkäissyt pois keväästä asti. Viimeinen asia, jota se kaipaa, on vielä yksi sovellus yhden illallisen jakamiseen. Siksi Side Badger on verkkosovellus. Se toimii nykyaikaisessa selaimessa puhelimella tai tietokoneella. Puhelimella se käyttää mobiilinäkymiä, joissa ryhmän sivu on jaettu välilehtiin ja ohjaimet sopivat kosketukseen. Jotkin lisäominaisuudet, kuten sen lisääminen aloitusnäytölle, riippuvat selaimestasi, ja kerromme, missä.
workflow:
  heading: Selaimen välilehdestä aloitusnäytölle kolmessa vaiheessa
  steps:
    - title: Avaa ja kirjaudu
      body: Mene Side Badgeriin selaimessasi ja kirjaudu sisään. Tarvitset vain sähköpostiosoitteen ja salasanan, ja vahvistat sähköpostin, ennen kuin voit lisätä mitään. Jokainen ryhmässä tarvitsee tilin, joten kutsumasi ihmiset tekevät samoin.
    - title: Lisää se aloitusnäytölle tai Dockiin
      body: Kun olet kirjautunut sisään, sovellus tarjoutuu asentamaan itsensä. Saat **Asenna**-painikkeen, jos selaimesi sallii sen, ja **Näytä miten** muuten. Jäikö väliin tai sanoitko ei? **Asetukset** sisältää saman ohjeen kohdassa **Lisää Koti-valikkoon tai Dockiin**. iPhonessa ja iPadissa Asetukset näyttää iPhonen vaiheet ensin ja piilottaa muut laitteet kohtaan **Muut laitteet**. Kummassakin tapauksessa sovellus avautuu sen jälkeen omassa ikkunassaan.
      shot: S20
      shotAlt: Asetusten Lisää Koti-valikkoon tai Dockiin -osio, jossa ohjeet sovelluksen lisäämiseen laitteelle
    - title: Ota ilmoitukset käyttöön, jos haluat
      body: Ilmoitukset ovat pois päältä, kunnes otat ne käyttöön, ja jokainen laite otetaan käyttöön erikseen. Käytä ilmoituskellon tarjoamaa **Ota käyttöön** -painiketta tai **Push-ilmoitukset**-kytkintä kohdassa **Asetukset**. iPhonessa ja iPadissa avaa sovellus ensin aloitusnäytöltä. Se on ainoa paikka, jossa ilmoitukset siellä toimivat.
      shot: S19
      shotAlt: Avattu ilmoitusvalikko, jossa ryhmän viimeaikainen toiminta
options:
  heading: Näin lisäät sen, laite laitteelta
  items:
    - title: iPhone ja iPad
      body: Napauta Jaa-painiketta, neliötä, jossa on ylöspäin osoittava nuoli. Jos et näe sitä, napauta ensin kolmea pistettä (•••) ja sitten Jaa. Vieritä alas ja napauta **Lisää Koti-valikkoon**. Pidä **Avaa verkkosovelluksena** päällä ja napauta sitten **Lisää**. Jos linkki avautui toisen sovelluksen sisällä, avaa sivu ensin Safarissa, koska sovelluksen sisäinen selain ei voi lisätä sitä.
    - title: Android
      body: Avaa selaimen valikko ja valitse **Lisää aloitusnäyttöön** tai **Asenna sovellus**.
    - title: Chrome tai Edge tietokoneella
      body: Avaa selaimen valikko ja valitse vaihtoehto, jolla sivusto asennetaan sovellukseksi. Se saa sitten oman ikkunansa ja oman kuvakkeensa.
    - title: Safari Macilla
      body: Valitse **Arkisto** ja sitten **Lisää Dockiin**.
sections:
  - heading: Ilmoitukset vain, jos pyydät niitä
    body: Push-ilmoitukset ovat valinnaisia. Ota ne käyttöön, niin saat ilmoituksen, kun ryhmissäsi on uutta toimintaa, esimerkiksi kun joku lisää kulun, jättää kommentin tai kirjaa maksun. Ne otetaan käyttöön yksi laite kerrallaan ilmoituskellosta tai kohdasta **Asetukset**, ja voit poistaa ne käytöstä samoissa paikoissa. Ne vaativat selaimen, joka tukee niitä, ja sinun lupasi. Jos selaimesi on estänyt ne sivustolta, salli ne ensin selaimen asetuksissa. iPhonessa ja iPadissa ne toimivat vain aloitusnäytölle lisätystä sovelluksesta, eivät selaimen välilehdestä. Toimitusta ei taata, joten pidä ilmoitusta muistutuksena, älä lupauksena. Mitä syötteeseen ilmestyy, selviää kohdasta [suunnitelkaa yhdessä](page:feature/plan-together).
  - heading: Päivitykset heti, ilman päivityspainiketta
    body: Lisää kulu, niin kaikki näkevät sen heti, samoin sen, mikä muuttui ja kuka muutti. Jokainen ryhmä pitää toimintahistoriaa, ja ilmoituskello näyttää toiminnan kaikissa ryhmissäsi. Kenenkään ei tarvitse kysyä muilta, ovatko he nähneet juuri lisäämäsi asian. Se on jo heidän näytöllään.
  - heading: 39 kieltä, jokaiselle omansa
    body: Käytä Side Badgeria 39 kielellä, myös oikealta vasemmalle kirjoitettavilla arabialla, persialla ja urdulla. Jokainen ryhmässä valitsee omansa, joten sama ryhmäsivu voi olla yhdelle arabiaa ja seuraavalle englantia. Ainoa asia, josta ryhmän on oltava yhtä mieltä, ovat luvut.
  - heading: Tehty useammalle kuin yhdenlaiselle käyttäjälle
    body: Side Badger on tehty näppäimistön ja ruudunlukijan käyttäjät mielessä. Jäsenten väreihin kuuluu kuvioita, joten sinun ei tarvitse erottaa vihreää punaisesta.
    items:
      - Ohituslinkit, joilla näppäimistön käyttäjät pääsevät suoraan sisältöön.
      - Valintaikkunat hallitsevat näppäimistön kohdistusta.
      - Ohjaimet on nimetty ruudunlukijoita varten.
      - Asettelut kääntyvät oikealta vasemmalle kirjoitettaville kielille.
limits:
  heading: Mitä verkkosovellus ei tee
  items:
    - Offline-käyttöä ei ole. Side Badger tarvitsee yhteyden, joten se ei avaa ryhmääsi lentokoneessa ilman wifiä.
    - Sovelluskaupan sovellusta ei ole, eikä natiivia iPhone- tai Android-sovellusta. Side Badger on verkkosovellus, ja sen lisääminen aloitusnäytölle tai Dockiin on tapa saada sovelluksen kaltainen versio.
    - Aloitusnäytölle tai Dockiin lisääminen riippuu selaimestasi. Valikkojen nimet vaihtelevat selaimen ja version mukaan, eivätkä kaikki selaimet tarjoa sitä.
    - Push-ilmoitukset otetaan käyttöön laitekohtaisesti, ja ne vaativat selaimen, joka tukee niitä, sekä sinun lupasi. iPhonessa ja iPadissa ne toimivat vain aloitusnäytölle lisätystä sovelluksesta. Toimitusta ei taata.
    - Sähköposti- tai tekstiviestihälytyksiä ei ole, eikä maksumuistutuksia. Uusi toiminta näkyy sovelluksessa ja push-ilmoituksina, jos otat ne käyttöön. Maksun perään kyseleminen on edelleen sinun vastuullasi.
    - Toimintaa säilytetään 90 päivää.
    - Kirjaudut sähköpostiosoitteella ja salasanalla. Google- tai Apple-kirjautumista ei ole, ja sinun on oltava vähintään 18-vuotias.
    - Emme väitä, että Side Badger on täysin saavutettava tai että se täyttää virallisen saavutettavuusstandardin. Jos jokin tulee tielle, kerro siitä meille sovelluksen sisällä, niin näet vastauksemme siellä.
useCasesHeading: Missä apuna on se, ettei sovellusta tarvita
faq:
  heading: Kysymyksiä
  items:
    - q: Onko Side Badgerilla sovellusta sovelluskaupassa?
      a: Ei. Side Badger on verkkosovellus. Avaat sen selaimessa ja voit lisätä sen aloitusnäytölle tai Dockiin, jolloin se avautuu kuin sovellus. Sovelluskaupasta ei tarvitse ladata mitään.
    - q: Voinko jakaa kulut lataamatta sovellusta?
      a: Kyllä. Avaa Side Badger puhelimen tai tietokoneen selaimessa, kirjaudu sisään ja perusta ryhmä. Aloitusnäytölle tai Dockiin lisääminen on valinnaista.
    - q: Toimiiko se offline-tilassa?
      a: Ei. Side Badger tarvitsee yhteyden, vaikka se olisi lisätty aloitusnäytölle tai Dockiin.
    - q: Miksi en saa ilmoituksia iPhonellani?
      a: iPhonessa ja iPadissa ilmoitukset toimivat vain aloitusnäytölle lisätystä sovelluksesta, eivät selaimen välilehdestä. Lisää se, avaa se aloitusnäytön kuvakkeesta ja ota sitten ilmoitukset käyttöön kohdassa **Asetukset**. Toimitusta ei taata, joten jos yksi jää tulematta, ryhmän toimintahistoria näyttää silti, mitä lisättiin.
    - q: Onko minun pakko ottaa ilmoitukset käyttöön?
      a: Ei. Ne ovat pois päältä, kunnes otat ne käyttöön yksi laite kerrallaan. Ilman niitä uusi toiminta näkyy silti sovelluksessa, ja kaikki näkevät muutoksen heti, kun heillä on sovellus auki.
    - q: Tarvitseeko jokainen ryhmässä tilin?
      a: Kyllä. Tarvitset vain sähköpostiosoitteen ja salasanan, ja vahvistat sähköpostin, ennen kuin voit lisätä mitään. Jokainen ryhmään liittyvä tekee saman millä puhelimella tai tietokoneella tahansa.
