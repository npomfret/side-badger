faq:
  heading: "सवाल"
  items:
    - q: "Side Badger कौन-सा एक्सचेंज रेट इस्तेमाल करता है?"
      a: "मौजूदा एक्सचेंज रेट, जो खर्च डालते समय लाया जाता है जहां उपलब्ध हो। आप उसे उस रेट में बदल सकते हैं जो आपको सच में मिला।"
    - q: "क्या ग्रुप सिर्फ पाउंड और येन तक सीमित रह सकता है?"
      a: "हाँ। ग्रुप की **सेटिंग्स** में **मुद्रा सेटिंग्स** के तहत **इस समूह के लिए मुद्राओं को प्रतिबंधित करें** चालू करें, **अनुमति प्राप्त मुद्राएं** चुनें और **नए खर्चों के लिए डिफ़ॉल्ट मुद्रा** तय करें। सूची में विकल्प कम होंगे, तो काउंटर पर गलत अंदाज़े भी कम।"
    - q: "क्या हमें बदलना ज़रूरी है?"
      a: "नहीं। करेंसी तब तक अलग रहती हैं जब तक आप या आपका ग्रुप बदलने का फैसला न करे, और हर करेंसी को पेमेंट की अपनी छोटी सूची मिलती है।"
