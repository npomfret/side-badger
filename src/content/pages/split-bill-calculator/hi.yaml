faq:
  heading: "सवाल"
  items:
    - q: "क्या कैलकुलेटर मुफ्त है?"
      a: "हाँ। मुफ्त। कोई विज्ञापन नहीं। रोज़ाना की कोई सीमा नहीं। अकाउंट की भी ज़रूरत नहीं।"
    - q: "क्या यह मेरा डाला हुआ सेव करता है?"
      a: "नहीं। कुछ भी कहीं सेव या भेजा नहीं जाता। अपने आंकड़े रखने के लिए “लिंक कॉपी करें” इस्तेमाल करें और लिंक को कहीं सहेज लें।"
    - q: "मेरा कॉपी किया हुआ लिंक कौन देख सकता है?"
      a: "जिसके पास भी वह हो। आंकड़े खुद लिंक में ही रहते हैं, # के बाद, इसलिए उसे सिर्फ उन्हीं लोगों को भेजें जिन्हें उन्हें देखना चाहिए।"
    - q: "क्या यह पैसे भेजता है?"
      a: "नहीं। यह निकालता है कि कौन किसे पेमेंट करे, और आप एक-दूसरे को जैसे चाहें पेमेंट करते हैं। Side Badger भी आपके पैसों को कभी हाथ नहीं लगाता। देखें [हिसाब चुकता करना](page:feature/settle-up)।"
    - q: "क्या मैं दो करेंसी में हुई ट्रिप बांट सकता हूँ?"
      a: "यहां नहीं, क्योंकि एक हिसाब में एक ही करेंसी होती है। ग्रुप में हर करेंसी का अपना बैलेंस रहता है। देखें [कई करेंसी](page:feature/multiple-currencies)।"
    - q: "अगर राशियों का जोड़ न बैठे तो?"
      a: "कैलकुलेटर खर्च के नीचे यह बता देता है और तब तक कोई नतीजा नहीं दिखाता जब तक जोड़ ठीक न हो जाए। सटीक राशियों का जोड़ कुल के बराबर होना चाहिए, और प्रतिशत मिलकर 100 बनने चाहिए।"
