meta:
  title: "Dělte náklady na oslavy, svatby a společné dárky"
  description: "Sdílejte náklady na oslavu, svatbu nebo společný dárek, když lidé přispívají různými částkami. Hlasujte o plánu, dělte podle přesných částek a sledujte, kdo komu dluží."
h1: "Dělte náklady na oslavy, svatby a společné dárky"
navLabel: "Akce a oslavy"
lead: "Rozdělte zálohy, výzdobu a nouzové deštníky. Zasedací pořádek nechte někomu odvážnějšímu. Side Badger drží na jednom místě, **kdo kolik přispěl**, aby se mohl bavit i pořadatel."
cta:
  heading: "Začněte další oslavou"
  body: "Vytvořte účet, založte skupinu pro akci a pošlete odkaz s pozvánkou. Side Badger je zdarma, bez reklam a bez denních limitů."
  button: "Vytvořit účet zdarma"
scenario:
  heading: "Každý přispívá, ne vždy stejnou částkou"
  body: "Někdo platí zálohu za sál, někdo jiný kupuje dort a třetí dá společný dárek na vlastní kartu. Někteří hosté přijdou na všechno a někteří jen na večeři. Vést o tom spravedlivý přehled ve vlákně chatu je práce, o kterou se nikdo neucházel. Skupina v Side Badger drží všechno, ať je mix částek jakýkoli, a ukazuje každému, co dluží nebo co se dluží jemu. Základy najdete v části [jak to funguje](page:how-it-works), nebo čtěte dál o akci."
sections:
  - heading: "Rozhodněte společně"
    body: "Než se pohnou jakékoli peníze, dejte volbu do **hlasování**. Přidejte až 10 možností, například dva sály nebo tři nápady na dárek, a nechte všechny hlasovat. Můžete skrýt, kdo pro co hlasoval, aby každá možnost dostala férovou šanci, a vítěz se zobrazí po uzavření hlasování. Nikdo nemusí listovat čtyřiceti zprávami, aby zjistil, co se rozhodlo."
  - heading: "Kdo je v čem"
    body: "Ne každý platí stejně a ne každý se podílí na každém nákladu. Rozdělte výdaj rovnoměrně, procentuálně nebo podle **přesných částek**, aby podíl každé osoby byl číslem, na kterém jste se dohodli. Vynechte každého, kdo se nezúčastnil, například hosty, kteří vynechali večeři, nebo přátele, kteří se na dárek nesložili. Každý výdaj má jednoho plátce a všichni ostatní v rozdělení mu dluží svůj podíl. Podrobnosti jsou na stránce [dělení výdajů](page:feature/split-expenses)."
  - heading: "Uchovejte papírování"
    body: "Přidávejte k výdaji poznámky, například co náklad pokrýval. Komentáře zůstávají **vedle výdaje**, kterého se týkají, takže otázka „byl dort za £45, nebo za £54?“ a její odpověď jsou na stejném místě. Komentáře mohou mít až 500 znaků, což na otázku o záloze bohatě stačí."
  - heading: "Ovládání pro pořadatele"
    body: "Otevřená spolupráce umožňuje každému členovi přidávat a upravovat výdaje, což u malého dárku stačí. Pro svatbu nebo větší oslavu zvolte předvolbu **Spravovaná skupina**. Správci schvalují každého nového člena a výdaje mohou měnit jen zakladatelé a správci. Zvěte lidi odkazem nebo QR kódem; při zapnutém schvalování správce každou osobu pustí dovnitř, takže seznam hostů zůstane seznamem hostů. Po skončení akce skupinu zamkněte, aby čísla zůstala."
  - heading: "Vyrovnejte se po oslavě"
    body: "Jakmile přijde poslední faktura, zůstatky ukážou, **kdo komu dluží**, a Side Badger navrhne krátký seznam plateb, který vyrovná všechny. Platíte si, jak chcete, a pak platbu zaznamenáte ve skupině. Side Badger nikdy nepřesouvá peníze, takže skupina vede přehled, zatímco převody probíhají ve vašich vlastních bankovních aplikacích. Stránka [vyrovnání](page:feature/settle-up) ukazuje, jak se změť změní na krátký seznam."
