faq:
  heading: "Sorular"
  items:
    - q: "Ödemeyi kim kaydetmeli, ödeyen mi ödenen mi?"
      a: "Bir ödemeyi kaydetmek için harcamaları düzenleme izni gerekir ve form **Kim ödedi?** ile **Kim ödeme aldı?** diye sorar. Bir ödemeyi sonradan yalnızca onu kaydeden kişi düzenleyebilir, bu yüzden hızlı ödeşme düğmesini kullanarak ödeyenin yapması genellikle en basitidir."
    - q: "Gezi iki para biriminde geçtiyse ne olur?"
      a: "Bakiyeler para birimi başına tutulur, yani euro borcu euro borcu olarak kalır ve harcamalar girilirken çevrilmediyse her para biriminin kendi kısa listesi olur. [Birden fazla para birimi](page:guide/how-to-split-a-trip-paid-in-several-currencies) iki yolu da gösterir."
    - q: "Gezi sırasında mı ödeşmeliyiz, sonunda mı?"
      a: "İkisi de olur. Kaydedilen her ödeme bakiyeleri değiştirir, yani gezi sırasında yapılan bir ödeme son listeye sayılır. Sonda olması daha basittir, çünkü [bütün gezi](page:use-case/group-trips) tek yerdedir."
