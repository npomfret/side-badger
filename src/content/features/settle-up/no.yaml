meta:
  title: Gjør opp med færre betalinger | Side Badger
  description: Se hvem som skylder hvem i gruppen din, få en kort liste over betalinger som gjør opp for alle, og registrer hver betaling etter hvert som den skjer. Gratis å bruke.
h1: Gjør opp med færre betalinger
navLabel: Gjøre opp
lead: Side Badger fører en løpende saldo for alle i gruppen og foreslår en kort liste over betalinger som gjør opp for den. Dere betaler hverandre slik dere vil, og registrerer det deretter. Vil du først se hvordan tallene deles, start med [dele utgifter](page:feature/split-expenses).
cta:
  heading: Klar til å nøste opp i hvem som skylder hvem?
  body: Opprett en konto, start en gruppe og legg til den første utgiften. Saldoene tar det derfra.
problem:
  heading: Saldoer som oppdateres underveis
  body: Hver utgift endrer hvem som skylder hvem, så Side Badger holder saldoene oppdatert etter hvert som utgifter og betalinger kommer til. Alle i gruppen ser en endring med en gang, og ser hva som ble endret og hvem som endret det. Saldoer føres per valuta, så euro og pund holdes i hver sin kolonne med mindre en utgift ble konvertert da den ble lagt inn. Som standard ser du gjelden som angår deg; **Vis alle** lister hele gruppen.
workflow:
  heading: Tre steg til kvitt
  steps:
    - title: Se hvem som skylder hvem
      body: Åpne gruppens saldoer for å se hva du skylder, hva du har til gode, og en kort liste over betalinger som gjør opp for alle, regnet ut per valuta. Utgifter det er stilt spørsmål ved, holdes utenfor summene til de er avklart. I romkamerateksemplet nedenfor blir seks betalinger til to.
      shot: S10
      shotAlt: Saldoskjermen med forenklet gjeld i to valutaer og «Vis alle» slått på
    - title: Betal slik du vil, og registrer det
      body: Bankoverføring, kontanter, en tjeneste du skylder fra forrige ferie. Side Badger flytter ikke pengene. Når pengene har skiftet hender, registrerer du betalingen, og saldoen oppdateres for alle.
      shot: S11
      shotAlt: Betalingsskjemaet med hurtigoppgjørsknapper og varselet som vises for en delbetaling
    - title: Sjekk at den kom frem
      body: Betalingen havner i gruppehistorikken, der alle i gruppen kan se den og reagere med en emoji. Feir en betaling når den kommer frem.
      shot: S12
      shotAlt: Betalingshistorikken med emoji-reaksjoner på en betaling
