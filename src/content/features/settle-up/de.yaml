meta:
  title: Mit weniger Zahlungen abrechnen | Side Badger
  description: Sieh, wer in deiner Gruppe wem was schuldet, erhalte eine kurze Liste von Zahlungen, die alle ausgleicht, und erfasse jede Zahlung, wenn sie passiert. Kostenlos nutzbar.
h1: Mit weniger Zahlungen abrechnen
navLabel: Abrechnen
lead: Side Badger führt für alle in der Gruppe einen laufenden Saldo und schlägt eine kurze Liste von Zahlungen vor, die ihn ausgleicht. Ihr zahlt einander, wie ihr wollt, und erfasst es dann. Wenn du zuerst sehen willst, wie die Zahlen aufgeteilt werden, fang mit [Ausgaben teilen](page:feature/split-expenses) an.
cta:
  heading: Bereit zu entwirren, wer wem was schuldet?
  body: Erstelle ein Konto, starte eine Gruppe und füge die erste Ausgabe hinzu. Die Salden erledigen den Rest.
  button: Kostenloses Konto erstellen
problem:
  heading: Salden, die sich laufend aktualisieren
  body: Jede Ausgabe ändert, wer wem was schuldet, deshalb hält Side Badger die Salden aktuell, wenn Ausgaben und Zahlungen hinzukommen. Alle in der Gruppe sehen eine Änderung sofort und sehen, was sich geändert hat und wer es geändert hat. Salden werden pro Währung geführt, Euro und Pfund bleiben also in ihren eigenen Spalten, es sei denn, eine Ausgabe wurde bei der Eingabe umgerechnet. Standardmäßig siehst du die Schulden, die dich betreffen; **Alle anzeigen** listet die ganze Gruppe.
workflow:
  heading: Drei Schritte zu quitt
  steps:
    - title: Sieh, wer wem was schuldet
      body: Öffne die Salden der Gruppe, um zu sehen, was du schuldest, was du bekommst und eine kurze Liste von Zahlungen, die alle ausgleicht, pro Währung berechnet. Hinterfragte Ausgaben bleiben aus den Summen, bis sie geklärt sind. Im Mitbewohner-Beispiel unten werden aus sechs Zahlungen zwei.
      shot: S10
      shotAlt: Der Salden-Bildschirm mit vereinfachten Schulden in zwei Währungen und eingeschaltetem "Alle anzeigen"
    - title: Zahle, wie du willst, und erfasse es dann
      body: Banküberweisung, Bargeld, ein Gefallen aus dem letzten Urlaub. Side Badger bewegt das Geld nicht. Sobald es den Besitzer gewechselt hat, erfasse die Zahlung, und der Saldo aktualisiert sich für alle.
      shot: S11
      shotAlt: Das Zahlungsformular mit Schnellausgleich-Schaltflächen und dem Hinweis bei einer Teilzahlung
    - title: Prüfe, ob es angekommen ist
      body: Die Zahlung landet im Gruppenverlauf, wo alle in der Gruppe sie sehen und mit einem Emoji reagieren können. Feiere eine Zahlung, wenn sie ankommt.
      shot: S12
      shotAlt: Der Zahlungsverlauf mit Emoji-Reaktionen auf eine Zahlung
