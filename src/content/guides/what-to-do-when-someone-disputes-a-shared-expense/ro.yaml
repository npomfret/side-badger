meta:
  title: "Ce faci când cineva contestă o cheltuială comună | Side Badger"
  description: "Lasă mesajul cu ghimpi. Pune cheltuiala în discuție și iese din soldurile tuturor cât vorbiți. Exemplu cu vin de petrecere de 45 £."
h1: "Ce faci când cineva contestă o cheltuială comună"
navLabel: "Cheltuieli contestate"
lead: "Ridică o întrebare pe cheltuială în loc să trimiți un mesaj cu ghimpi. Cât timp întrebarea e deschisă, întreaga cheltuială rămâne în afara soldurilor tuturor. Discutați în comentarii, editați împărțirea dacă grupul e de acord, iar cel care a întrebat, sau un administrator, închide întrebarea."
cta:
  heading: "Pune politicos întrebarea incomodă"
  body: "Creează un cont gratuit, începe un grup pentru casă și roagă un administrator să pornească întrebările despre cheltuieli, care sunt oprite până le pornește cineva. Vrei mai întâi un tur? Vezi [cum funcționează](page:how-it-works) sau [ce acoperă gratuitul](page:pricing)."
sections:
  - heading: "Trei colegi de casă și 45 £ de vin"
    body: "După petrecere, Tom adaugă vinul în grupul casei. Costă 45 £, plătit de Tom, împărțit egal între Tom, Priya și Aisha, adică 15 £ fiecare. Aisha nu bea. Tom l-a cumpărat pentru petrecere, iar petrecerea a fost pentru [casă](page:use-case/housemates), așa că n-a greșit cu nimic. Nici Aisha nu greșește când întreabă. Aici nu e nimeni răufăcător. Sunt doar 15 £ de vin în discuție și destule moduri de a o face incomodă. Un mesaj cu ghimpi către toată casa e unul. O întrebare pe cheltuială e unul mai blând."
  - heading: "Ce face o întrebare"
    body: "Aisha deschide cheltuiala și ridică o întrebare. Întreaga cheltuială iese din soldurile tuturor, nu doar partea ei, și nimic altceva nu e afectat. Cumpărăturile mari (84 £) și curățenia (60 £) tot contează, ceea ce înseamnă 28 £ + 20 £ = 48 £ de persoană. Așadar, cât timp vinul e în așteptare, Aisha datorează 48 £, lui Tom i se datorează 36 £, iar lui Priya 12 £. Orice ar decide casa despre vin, între timp soldul nimănui nu-l include. Oricine altcineva din cheltuială poate ridica și el o întrebare proprie. Vinul se întoarce în solduri abia când se închide ultima întrebare deschisă despre el, iar o întrebare o închide cel care a pus-o sau un administrator."
  - heading: "Discutați, apoi reparați"
    body: "Întrebarea Aishei ajunge în comentariile cheltuielii, așa că răspunsurile stau chiar sub ea. [Planificați împreună](page:feature/plan-together) are mai multe despre comentarii și întrebări. Tom și Priya o citesc și casa stă de vorbă. Hotărăsc că vinul a fost al lui Tom și al lui Priya, pentru că ei l-au băut. Altă casă ar putea păstra împărțirea în trei sau ar putea conveni ceva la mijloc, și ar fi în regulă și asta. Side Badger păstrează ce convenți și nu are nicio părere despre vin. Tom editează cheltuiala ca să se împartă egal între el și Priya, adică 22,50 £ fiecare (45 £ ÷ 2). Aisha nu mai e în ea, așa că întrebarea ei pleacă odată cu versiunea veche, iar vinul revine în solduri. Versiunea anterioară se păstrează."
  - heading: "Citirea rezultatului"
    body: "Cu vinul revenit, lui Tom i se datorează 58,50 £, Priya datorează 10,50 £, iar Aisha datorează 48 £. Side Badger sugerează două plăți, amândouă către Tom. Cei 48 £ ai Aishei sunt aceeași sumă pe care o avea cât vinul a fost în așteptare, pentru că ea nu e în el. Priya, căreia i se datorau 12 £, acum datorează 10,50 £, adică jumătatea ei de 22,50 £ din vin. Dacă împărțirea în trei ar fi rămas valabilă, Aisha ar fi datorat 63 £ (28 £ + 20 £ + 15 £). Toată neînțelegerea a valorat 15 £. Plătiți-vă unii altora cum preferați, apoi înregistrați fiecare plată la **Decontează**. [Decontarea](page:feature/settle-up) explică restul."
  - heading: "Cum formulezi ca lumea să-ți mai vorbească"
    body: "Întrebarea Aishei: „N-am băut deloc din vin. Putem să ne uităm la împărțire?” E scurtă, numește cheltuiala și întreabă în loc să acuze. Câteva obiceiuri ajută."
    items:
      - "**Întreabă despre cheltuială, nu despre persoană.** „Putem verifica împărțirea la vin?” începe o conversație. „De ce plătesc eu pentru vinul tău?” începe altfel de conversație."
      - "**Spune ce ți-ai dori să se întâmple.** „Se poate doar între cei care l-au băut?” oferă grupului ceva cu care să fie de acord sau la care să răspundă."
      - "**Dă un motiv într-o propoziție sau două.** Câmpul se numește **Întrebarea dvs.** și nu poate rămâne gol."
      - "**Ține răspunsurile într-un singur loc.** Răspunsurile merg în comentariile cheltuielii, lângă cifrele despre care e vorba."
  - heading: "Pregătește totul în Side Badger"
    items:
      - "**Pornește întrebările.** Sunt oprite implicit. Un administrator deschide **Setări** ale grupului, activează **Permite întrebări despre cheltuieli** la **Funcționalități**, în fila **Setări generale**, și alege **Salvează**. Dacă le oprești mai târziu, toate întrebările deschise se șterg."
      - "**Ridică una.** Deschide cheltuiala și, lângă propriul nume din împărțire, alege **Am o întrebare**. Scrie motivul în **Întrebarea dvs.** și alege din nou **Am o întrebare**. Doar cei din cheltuială pot face asta. Cheltuiala arată acum o insignă **Pus în discuție**."
      - "**Găsește ce e în așteptare.** În lista de cheltuieli, **Doar pus în discuție** arată cheltuielile cu o întrebare deschisă."
      - "**Repară-o, dacă grupul e de acord.** Deschide cheltuiala, alege **Editează**, schimbă **Împarte între** și alege **Actualizează Cheltuiala**. Cine poate edita depinde de permisiunile grupului."
      - "**Închide-o, dacă nu e nimic de reparat.** Cel care a întrebat poate folosi butonul de închidere de pe insigna **Pus în discuție**, numit **Închide întrebarea**, la fel și un administrator. Cheltuiala revine în solduri odată ce i se închide ultima întrebare."
  - heading: "Când nu iese chiar atât de curat"
    items:
      - "**Editarea nu-l scoate pe cel care a întrebat.** Dacă persoana care a întrebat este în continuare în cheltuială, întrebarea ei trece la versiunea editată și așteaptă ca ea, sau un administrator, să o închidă. A repara suma nu e același lucru cu a conveni că e reparată."
      - "**Nu erai în cheltuială.** Doar cei din cheltuială o pot pune în discuție. Dacă ceva nu ți se pare în regulă, spune în comentariile ei sau întreabă-l pe cel care a adăugat-o."
      - "**Cineva vrea să părăsească grupul.** O întrebare deschisă îi împiedică să plece pe cei din acea cheltuială. Închideți întrebarea sau editați cheltuiala ca ei să nu mai fie în ea, și pot pleca."
  - heading: "Ce nu face Side Badger aici"
    items:
      - "Nu hotărăște cine are dreptate. Ține cheltuiala în afara soldurilor și păstrează ce convenți."
      - "Nu cere nimănui să aprobe cheltuielile înainte să conteze. Doar o cheltuială pusă în discuție este ținută la o parte."
      - "Nu poate reține o parte dintr-o cheltuială. Pune-o în discuție și iese toată din solduri."
      - "Nu mută bani. Vă plătiți unii altora cum preferați și înregistrați."
