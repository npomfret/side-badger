faq:
  heading: "Ceisteanna"
  items:
    - q: "Cad má tá seomra níos mó ag duine ach níos lú solais?"
      a: "Ní bhíonn san achar urláir ach pointe tosaigh, mar sin is féidir leis an ngrúpa a aontú é a athrú. Bain pointe nó dhó den seomra dorcha, tabhair do na daoine eile iad agus seiceáil go ndéanann na céatadáin 100 fós. Stórálann Side Badger cibé rud a aontaíonn sibh agus ní thugann sé breith air."
    - q: "Ar cheart billí a roinnt de réir méid an tseomra freisin?"
      a: "De ghnáth níor cheart. Úsáideann gach duine fuinneamh agus idirlíon, mar sin tá roinnt chothrom níos simplí, mar atá sa sampla thuas. Má bhíonn comhchónaitheoir amháin sa bhaile an lá ar fad, is féidir leis an ngrúpa rud éigin eile a aontú, mar shuimeanna cruinne. Clúdaíonn [roinn costais](page:feature/split-expenses) na roghanna."
    - q: "An féidir linn an roinnt a athrú ar ball?"
      a: "Is féidir, do chostais nua. Athraigh na céatadáin nuair a chóipeálann tú an cíos agus fanann míonna níos luaithe mar a bhí siad. Chun costas atá caite a cheartú, cuir in eagar é má cheadaíonn ceadanna an ghrúpa é, agus inis don teach ar dtús, mar athraíonn na hiarmhéideanna. Coinnítear an leagan níos luaithe."
