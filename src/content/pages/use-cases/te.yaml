meta:
  title: "రూమ్‌మేట్లు, ట్రిప్‌లు, పార్టీల కోసం Side Badger"
  description: "రూమ్‌మేట్లతో, గ్రూప్ ట్రిప్‌లలో, పార్టీలు, పెళ్లిళ్లు, గ్రూప్ బహుమతుల కోసం ఖర్చులు పంచండి. ప్రతి రకం గ్రూప్‌కు Side Badger ఏం చేస్తుందో చూడండి."
h1: "మీ రకం గ్రూప్ కోసం Side Badger"
navLabel: "వినియోగ సందర్భాలు"
lead: "రూమ్‌మేట్లు, సెలవులు, బ్యాచిలర్ పార్టీలు. మీ గందరగోళాన్ని ఎంచుకోండి, మీలాంటి గ్రూప్ లెక్క ఎలా ఉంచుతుందో చూడండి."
intro: "ప్రతి గ్రూప్ ఖర్చులను కొంచెం భిన్నంగా పంచుకుంటుంది. ఈ పేజీలు మొదటి ఖర్చు నుండి చివరి రికార్డ్ చేసిన పేమెంట్ వరకు ఒక **వాస్తవికమైన సన్నివేశాన్ని** లెక్కలతో సహా అనుసరిస్తాయి, మీ సొంత గ్రూప్‌కు ఏం మిగులుతుందో మీరు చూడవచ్చు."
cta:
  heading: "మీ రకం గ్రూప్ దొరికిందా?"
  body: "ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి ఖర్చును జోడించండి. రెండు నిమిషాలు పడుతుంది."
  button: "ఉచిత ఖాతా తెరవండి"
cardsHeading: "మీ పరిస్థితికి దగ్గరగా ఉన్నదాన్ని ఎంచుకోండి"
sections:
  - heading: "గ్రూప్ ట్రిప్‌లు"
    body: "పౌండ్లలో విమాన టికెట్లు, యూరోలలో విల్లా, ముగ్గురు మాత్రమే తిన్న డిన్నర్. గ్రూప్‌ను పౌండ్లలోకి మార్చేలా సెట్ చేస్తే, లిస్బన్‌లో నలుగురు స్నేహితులు మూడు పేమెంట్లతో ముగిస్తారు, కరెన్సీలను విడిగా ఉంచితే ఆరు అయ్యేవి. [గ్రూప్ ట్రిప్ ఖర్చులను పంచండి](page:use-case/group-trips)."
  - heading: "రూమ్‌మేట్లు"
    body: "ఒకరు ఇంటి యజమానికి చెల్లిస్తారు, మరొకరికి కరెంటు బిల్లు గుర్తుంటుంది, టాయిలెట్ రోల్ ఎవరు కొన్నారో ఎవరికీ ఏకాభిప్రాయం లేదు. అద్దెను గది పరిమాణం ప్రకారం, మిగతా బిల్లులను సమానంగా పంచితే, నలుగురు రూమ్‌మేట్లు నెలను మూడు పేమెంట్లతో ముగిస్తారు, అన్నీ అద్దె చెల్లించిన వ్యక్తికే. [రూమ్‌మేట్లతో ఇంటి బిల్లులు పంచండి](page:use-case/housemates)."
  - heading: "పార్టీలు, పెళ్లిళ్లు, గ్రూప్ బహుమతులు"
    body: "ఆరుగురు బహుమతి కోసం ఓటు వేస్తారు, ఒకరు కొంటారు, అందరూ ఒకే మొత్తం ఇవ్వరు. ఖచ్చితమైన మొత్తాలతో పంచిన £150 బహుమతిలో కొన్న వ్యక్తికి అయిదు పేమెంట్లు వస్తాయి, మొత్తం £120. [ఈవెంట్ ఖర్చులను పంచండి](page:use-case/events-and-celebrations)."
  - heading: "జంటలు"
    body: "బోరింగ్ ఖర్చులను పంచుకోండి, డేట్ నైట్‌ను త్రైమాసిక ఆర్థిక సమీక్షగా మార్చకుండా. అద్దె 60/40గా, సరుకులు సమానంగా పంచితే, లెక్క మీ ఇద్దరి మధ్య ఒకే పేమెంట్‌గా తేలుతుంది."
  - heading: "ముందు ఇది ఎలా పనిచేస్తుందో చూడండి"
    body: "పైన ఉన్న ప్రతి ఉదాహరణలో గ్రూప్ సృష్టించడం నుండి పేమెంట్లను రికార్డ్ చేయడం వరకు అవే దశలు ఉంటాయి. [ఎలా పనిచేస్తుంది](page:how-it-works) వాటిని వివరిస్తుంది, [ధరలు](page:pricing) దీనికి ఎంత అవుతుందో చెబుతుంది, అంటే ఏమీ కాదు, ప్రకటనలు లేవు, రోజువారీ పరిమితులు లేవు."
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "గ్రూప్‌లో అందరికీ ఖాతా కావాలా?"
      a: "అవును. వాళ్లు లింక్ లేదా QR కోడ్, ఉచిత ఖాతాతో చేరతారు."
    - q: "Side Badger డబ్బు వసూలు చేయగలదా?"
      a: "లేదు. మీకు నచ్చిన విధంగా చెల్లించండి, తర్వాత బ్యాలెన్స్‌లు సరిగ్గా ఉండేలా పేమెంట్‌ను రికార్డ్ చేయండి."
    - q: "నేను ఒకే రకం గ్రూప్‌ను ఎంచుకోవాలా?"
      a: "లేదు. వినియోగ సందర్భాలు ఉదాహరణలు మాత్రమే, సెట్టింగ్‌లు కావు. ప్రతి గ్రూప్‌లో ఒకే ఫీచర్లు ఉంటాయి, కాబట్టి మీకు సరిపడే కలయికను వాడండి."
