    - feature: Pretvorba valut
      other: Funkcija Pro. Pritisneš Convert in Splitwise pretvori stroške skupine v tvojo privzeto valuto po menjalnem tečaju tistega trenutka.
      sideBadger: Brezplačno. Vsak strošek pretvoriš, ko ga vneseš, po trenutnem menjalnem tečaju ali tistem, ki ga res dobiš. Izvirni znesek ostane pri stroških.
      source: currencies-help
    - feature: Valute in jeziki
      other: Več kot 100 valut in več kot 7 jezikov, kot navaja njegova domača stran.
      sideBadger: 133 valut in 39 jezikov. Vsak v skupini lahko izbere svoj jezik.
      source: home
    - feature: Kje ga uporabljaš
      other: Aplikaciji za iPhone in Android ter splet.
      sideBadger: V brskalniku. Prijavi se, nato ga dodaj na domači zaslon in odpre se kot aplikacija. Ni v trgovinah z aplikacijami.
      source: home
    - feature: Načini delitve
      other: Enako, po točnih zneskih, po odstotkih, po deležih, s prilagoditvijo ali po postavkah.
      sideBadger: Enako, po točnih zneskih ali po odstotkih, z enim plačnikom na strošek. Ne po deležih ali postavkah.
      source: split-help
    - feature: Uporaba brez povezave
      other: Način brez povezave navaja med svojimi osnovnimi funkcijami.
      sideBadger: Ne. Potrebuje povezavo.
      source: home
    - feature: Plačila in tvoja banka
      other: "Na nekaterih krajih lahko pošlje denar iz aplikacije: Splitwise Pay v ZDA, Venmo za stanja v ameriških dolarjih, PayPal in Pay by Bank v izbranih evropskih državah, pri čemer se poveže osebni tekoči račun."
      sideBadger: Tvojega denarja se nikoli ne dotakne in ne prosi za podatke o tvoji banki. Plačajte si, kakor želite, nato plačilo zabeležite.
      source: payments-help
    - feature: Grafikoni in privzete delitve
      other: Oboje sta funkciji Pro.
      sideBadger: Nobeno od obojega.
      source: pro
faq:
  heading: Vprašanja
  items:
    - q: Ali je Side Badger brezplačna alternativa Splitwisu?
      a: "Za delitev računov v skupini, da, in zna več kot samo računanje: komentarje, vprašanja, sezname, ankete in vloge v skupini, skeniranje računov in pretvorba valut pa sta brezplačna. Če potrebuješ aplikacijo iz trgovine, uporabo brez povezave ali plačila znotraj aplikacije, to dela Splitwise, Side Badger pa ne."
    - q: Od kod so podrobnosti o Splitwisu?
      a: "S Splitwisovih lastnih strani: njegove domače strani, strani Pro in centra za pomoč. Vsaka vrstica tabele vodi do strani, od koder izvira, datum nad tabelo pa pove, kdaj smo jih prebrali. Preverimo jih vsako četrtletje."
    - q: Ali bo Side Badger ostal brezplačen?
      a: Vse v Side Badgerju je danes brezplačno. Če se to kdaj spremeni, te bomo prej obvestili. Podrobnosti ima [stran s cenikom](page:pricing).
    - q: Ali mora vsak v moji skupini preklopiti?
      a: Da. Vsak v skupini potrebuje brezplačen uporabniški račun Side Badger in se lahko pridruži s povezavo ali kodo QR.
    - q: Ali ima Side Badger mobilno aplikacijo?
      a: "Ne v trgovini z aplikacijami. Deluje v brskalniku: prijavi se na telefonu, nato ga dodaj na domači zaslon, da se odpre kot aplikacija. [Kako deluje](page:how-it-works) pokaže, kako."
