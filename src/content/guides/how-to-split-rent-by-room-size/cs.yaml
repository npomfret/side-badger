faq:
  heading: "Otázky"
  items:
    - q: "Co když má někdo větší pokoj, ale méně světla?"
      a: "Podlahová plocha je jen výchozí bod, takže se skupina může dohodnout na úpravě. Uberte tmavému pokoji bod či dva, přidejte je ostatním a ověřte, že procenta stále dávají dohromady 100. Side Badger uloží, na čem se dohodnete, a nijak to nehodnotí."
    - q: "Mají se podle velikosti pokoje dělit i účty?"
      a: "Obvykle ne. Energie a internet používají všichni, takže je jednodušší rovnoměrné dělení, jako v příkladu výše. Pokud je jeden spolubydlící doma celý den, může se skupina dohodnout jinak, například na přesných částkách. Možnosti shrnuje [dělení výdajů](page:feature/split-expenses)."
    - q: "Můžeme rozdělení později změnit?"
      a: "Ano, u nových výdajů. Změňte procenta při kopírování nájmu a dřívější měsíce zůstanou, jaké byly. Chcete-li opravit starší výdaj, upravte ho, pokud to oprávnění skupiny dovolují, a nejdřív to řekněte ostatním v bytě, protože se změní zůstatky. Předchozí verze se uchovává."
