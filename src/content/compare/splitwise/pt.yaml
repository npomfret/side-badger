sections:
  - heading: Conversa de dinheiro, ao lado do dinheiro
    body: O dinheiro partilhado traz conversa, dúvidas e planos. O Side Badger põe os três ao lado dos números, para ninguém ter de andar a subir pelo chat acima.
    items:
      - "**Comentários no sítio certo.** Comenta o próprio grupo, ou qualquer despesa, lista ou sondagem, e mantém a conversa junto daquilo de que fala."
      - "**Recibos e fotos.** Guarda até três recibos em cada despesa e junta fotos ou PDF aos comentários no grupo, numa lista ou numa sondagem."
      - "**Perguntas, não discussões.** Um administrador pode ativar as perguntas, e qualquer pessoa numa despesa pode perguntar sobre ela. Fica fora dos saldos até estar esclarecida."
      - "**Listas e sondagens.** Põe a lista de compras partilhada ao lado das contas das compras e põe a votos a lista curta da villa, em anónimo se quiseres."
      - "**Uns aplausos.** Reage a despesas, pagamentos e comentários, e celebra um pagamento quando ele chega."
  - heading: O teu grupo, as tuas regras
    body: O centro de ajuda do Splitwise diz que não suporta administradores de grupo nem permissões especiais. O Side Badger tem funções e permissões, para os grupos que precisam de alguém a manter as contas arrumadas.
    items:
      - "**Administradores, membros e visualizadores.** Faz de alguém um visualizador: vê tudo e não muda nada."
      - "**Duas predefinições, ou as tuas.** Começa com Colaboração aberta ou Grupo gerido, ou define tu cada permissão: quem edita e apaga despesas, edita listas, convida e deixa entrar pessoas novas."
      - "**Aprovação para entrar.** Ativa a aprovação e um administrador deixa entrar cada pessoa."
      - "**As definições do próprio grupo.** Limita-o às moedas que realmente usas, escolhe a sua moeda por defeito e põe-lhe uma imagem de cabeçalho."
      - "**Bloqueia quando acabar.** Os números ficam como estão até um administrador desbloquear."
  - heading: Grátis aqui, pago lá
    body: O Splitwise Pro é o plano pago do Splitwise, e a sua própria página Pro vende três coisas que não custam nada no Side Badger.
    items:
      - "**Digitalização de recibos.** O Splitwise Pro digitaliza uma foto do teu recibo. O Side Badger faz isso de graça, sem créditos de digitalização: preenche o total, a data e o local para tu confirmares."
      - "**Conversão de moedas.** O Splitwise Pro converte as despesas de um grupo para a tua moeda por defeito quando tocas em Converter. O Side Badger converte cada despesa à medida que a introduzes, a uma taxa de câmbio atual ou à que realmente tiveste, e o valor original fica na despesa."
      - "**Sem limites diários.** O Splitwise Pro vende despesas ilimitadas, e o seu centro de ajuda diz que os utilizadores gratuitos podem adicionar até 4 despesas por dia. O Side Badger não tem limites diários."
  - heading: O teu banco fica de fora
    body: "O Side Badger não se liga ao teu banco nem pede os dados do teu banco. Guarda o registo de quem deve a quem; pagas como preferires e depois registas o pagamento. Não há credenciais do banco para entregar, por isso é uma coisa a menos para proteger."
  - heading: Uma app só, no navegador e no telemóvel
    body: O Side Badger corre no teu navegador. Inicia sessão, adiciona-o ao ecrã principal e ele abre como uma app. É a mesma app nos dois sítios, por isso uma novidade está no teu telemóvel da próxima vez que abrires a app, sem esperar por uma atualização da loja de aplicações.
  - heading: E uns truques para animar a festa
    items:
      - "**Pergunta ao teu assistente.** O Side Badger funciona com o ChatGPT e o Claude: pede ao teu para adicionar uma despesa, digitalizar um recibo ou registar um pagamento."
      - "**Cada um no seu idioma.** O Side Badger fala 39 idiomas e cada pessoa escolhe o seu. A página inicial do Splitwise indica 7+. Também lida com 133 moedas, para a viagem que vai a todo o lado."
      - "**Ajuda sem sair da app.** Estás com dificuldades ou encontraste um erro? Diz-nos a partir da app e lê lá mesmo a nossa resposta."
  - heading: Onde o Splitwise ainda ganha
    body: Preferimos que escolhas a app certa a descobrires mais tarde. Se o teu grupo precisa de uma destas coisas, o Splitwise tem e o Side Badger não.
    items:
      - "**Apps das lojas de aplicações.** O Side Badger vive no navegador e no ecrã principal, não nas lojas de aplicações."
      - "**Modo offline.** O Side Badger precisa de ligação."
      - "**Pagamentos na app.** Em alguns países o Splitwise também consegue movimentar o dinheiro. O Side Badger só guarda o registo."
      - "**Dividir por partes ou por item.** O Side Badger tem um só pagador por despesa, dividida em partes iguais, por valores exatos ou por percentagem. A digitalização de recibos não atribui itens a pessoas."
      - "**Gráficos e divisões por defeito.** O Splitwise Pro tem ambos. O Side Badger mantém a conta de quem deve a quem, e é nisso que está o truque todo."
  - heading: Mudar o teu grupo para cá
    body: Não há importador, por isso mudar é recomeçar do zero. Primeiro acerta as contas no Splitwise, depois cria um grupo no Side Badger e convida toda a gente com um link ou um código QR. Todas as pessoas do grupo precisam de uma conta grátis, e para se registarem basta um endereço de e-mail.
table:
  heading: Lado a lado
  caption: Detalhes do Splitwise a {date}, retirados das páginas do próprio Splitwise.
