faq:
  heading: "Vprašanja"
  items:
    - q: "Ali je kalkulator brezplačen?"
      a: "Da. Brezplačno. Brez oglasov. Brez dnevnih omejitev. Tudi uporabniški račun ni potreben."
    - q: "Ali shrani, kar vpišem?"
      a: "Ne. Nič se ne shrani ali pošlje nikamor. Če želiš obdržati številke, uporabi Kopiraj povezavo in povezavo shrani kam drugam."
    - q: "Kdo lahko vidi povezavo, ki jo kopiram?"
      a: "Vsak, ki jo ima. Številke so v sami povezavi, za znakom #, zato jo deli samo z ljudmi, ki jih smejo videti."
    - q: "Ali premika denar?"
      a: "Ne. Izračuna, kdo naj komu plača, vi pa si plačajte, kakor želite. Tudi Side Badger se tvojega denarja nikoli ne dotakne. Glej [poravnavo](page:feature/settle-up)."
    - q: "Ali lahko razdelim potovanje, plačano v dveh valutah?"
      a: "Tukaj ne, ker ima izračun eno valuto. V skupini ima vsaka valuta svoje stanje. Glej [več valut](page:feature/multiple-currencies)."
    - q: "Kaj, če se zneski ne izidejo?"
      a: "Kalkulator to pove pod stroškom in ne pokaže rezultata, dokler se ne izidejo. Točni zneski morajo dati skupni znesek, odstotki pa 100."
