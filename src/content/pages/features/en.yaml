meta:
  title: What Side Badger does and doesn't do
  description: Splitting, settling up and multiple currencies, plus groups, lists and polls. The full kit, and an honest list of what Side Badger leaves out.
h1: What Side Badger does
navLabel: Features
lead: Everything in the box, and what isn't.
intro: Here's the full kit. We left out the spreadsheet on purpose. Start with the three jobs Side Badger does every day, then check the rest of the list and the short list of things it doesn't do.
cta:
  heading: Does it do what your group needs?
  body: Create a free account and try it with a small group first. The first expense takes about a minute.
  button: Create a free account
cardsHeading: The three jobs, in detail
sections:
  - heading: Receipt scanning
    body: Keep the receipt with the expense, as photos or PDFs, up to three per expense. Or snap the receipt and Side Badger fills in the total, date and place for you to check. Scanning is free, with no scan credits. Receipt images are read by Google's AI service.
  - heading: Groups and permissions
    body: Make a group for each house, trip or event, with up to 50 people in it. Invite people with a link or a QR code. In a bigger group, make someone a viewer, who sees everything and changes nothing.
  - heading: Lists and polls
    body: Keep the shared shopping list next to the shopping bills. Put the villa shortlist to a vote, anonymously if you like.
  - heading: Everything else
    items:
      - "**Live updates:** add an expense and everyone sees it straight away."
      - "**Languages:** use Side Badger in 39 languages. Everyone in the group can pick their own."
      - "**Home screen:** no app store needed. Add Side Badger to your home screen and it opens like an app."
      - "**Feedback:** found a bug? Tell us from inside the app and see our reply there."
  - heading: What Side Badger doesn't do
    items:
      - "**Move money.** Side Badger never touches your money. Pay each other however you like. Payment requests are planned."
      - "**Repeat bills.** There are no recurring expenses. Copy last month's bill in two taps."
      - "**Split by item.** One payer per expense. Split equally, exactly or by percentage."
      - "**Ship a native app.** It works in your browser. Add it to your home screen."
      - "**Work offline.** It needs a connection."
      - "**Send alerts by email or text.** Notifications appear in the app. Push notifications are planned."
      - "**Draw charts or budgets.** It keeps the count of who owes whom, and that's the whole trick."
      - "**Sign in with Google or Apple.** Sign up with email. Google and Apple sign-in are planned."
      - "**Let people in without an account.** Everyone in the group needs a free account."
faq:
  heading: Questions
  items:
    - q: Can I pay through Side Badger?
      a: No. Side Badger keeps the count and never touches your money. Pay each other however you like, then record the payment.
    - q: Is there a mobile app?
      a: Not in an app store. Side Badger runs in your browser, and you can add it to your home screen so it opens like an app.
    - q: Can I split by item?
      a: No. Each expense has one payer, and you split it equally, exactly or by percentage.
    - q: Does it work offline?
      a: No, it needs a connection.
    - q: Does everyone in the group need an account?
      a: Yes. Everyone in the group needs a free account, and all you need to sign up is an email address.
