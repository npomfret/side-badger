faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Ποιος πρέπει να καταγράφει μια πληρωμή, αυτός που πληρώνει ή αυτός που πληρώνεται;"
      a: "Η καταγραφή μιας πληρωμής απαιτεί δικαίωμα επεξεργασίας εξόδων και η φόρμα ρωτά **Ποιος πλήρωσε;** και **Ποιος έλαβε την πληρωμή;** Μόνο το άτομο που την κατέγραψε μπορεί να την επεξεργαστεί αργότερα, οπότε συνήθως είναι πιο απλό να το κάνει ο πληρωτής, με το κουμπί γρήγορης τακτοποίησης."
    - q: "Τι γίνεται αν το ταξίδι έτρεξε σε δύο νομίσματα;"
      a: "Τα υπόλοιπα τηρούνται ανά νόμισμα, οπότε ένα χρέος σε ευρώ μένει χρέος σε ευρώ και κάθε νόμισμα παίρνει τη δική του σύντομη λίστα, εκτός αν τα έξοδα μετατράπηκαν όταν καταχωρίστηκαν. Ο οδηγός για το [ταξίδι σε πολλά νομίσματα](page:guide/how-to-split-a-trip-paid-in-several-currencies) δείχνει και τους δύο τρόπους."
    - q: "Να τακτοποιηθούμε κατά τη διάρκεια του ταξιδιού ή στο τέλος;"
      a: "Και τα δύο δουλεύουν. Κάθε καταγεγραμμένη πληρωμή αλλάζει τα υπόλοιπα, οπότε μια πληρωμή που έγινε στη μέση του ταξιδιού μετράει στην τελική λίστα. Στο τέλος είναι πιο απλό, επειδή [ολόκληρο το ταξίδι](page:use-case/group-trips) είναι σε ένα μέρος."
