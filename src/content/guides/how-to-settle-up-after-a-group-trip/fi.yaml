meta:
  title: Näin tasaat tilit ryhmämatkan jälkeen | Side Badger
  description: Tasaa tilit, ennen kuin kaikki hajaantuvat. Kymmenen sekavaa velkaa muuttuu neljäksi maksuksi, jotka kirjataan sitä mukaa kuin ne saapuvat, ja osamaksukin käy. Laskut viidelle ystävälle.
h1: Näin tasaat tilit ryhmämatkan jälkeen
navLabel: Tasaa tilit matkan jälkeen
lead: Tasaa tilit, ennen kuin kaikki hajaantuvat. Lisää viimeinen kulu, avaa ryhmän saldot ja maksa lyhyen listan mukaan se, mitä olet velkaa, miten haluat. Kirjaa sitten jokainen maksu Side Badgeriin, jotta saldo nollautuu koko ryhmän osalta. Viiden ystävän ja viiden kulun tapauksessa kymmenen sekavaa velkaa supistuu neljäksi maksuksi.
cta:
  heading: Sulje kirjat, ennen kuin kuvat saapuvat
  body: Luo ilmainen tili, perusta ryhmä seuraavaa matkaa varten ja lisää jokainen kulu sitä mukaa kuin se syntyy. Lyhyt maksulista odottaa jo, kun saavut lentokentälle. Haluatko nähdä ensin, [miten tilien tasaus toimii](page:feature/settle-up)?
sections:
  - heading: Viisi ystävää, viisi kulua, yksi lähtöaula
    body: Mo, Ines, Raf, Tess ja Uma viettivät viikon rannikolla. Mo varasi asunnon ja osti ruokaostokset, Ines maksoi venematkan ja Raf maksoi ison illallisen. Tess otti lentokenttätaksin Uman ja Mon kanssa, koska Ines ja Raf menivät junalla. Uman kortti oli jäänyt kotiin, joten hän ei maksanut mitään. Kuluja on yhteensä viisi, summaltaan 1 700 €, ja lähtöaulassa kukaan ei osannut sanoa, kuka oli plussalla.
  - heading: Kymmenen velkaa, neljä maksua
    body: Asunto, vene, illallinen ja ruokaostokset jaetaan tasan viidelle. Se on 200 €, 50 €, 60 € ja 18 € kullekin, joten Ines ja Raf ovat velkaa 328 € kumpikin. Taksi jaetaan kolmelle, 20 € kullekin, joten Mo, Tess ja Uma ovat velkaa 348 €. Mo maksoi 1 090 € ja on velkaa 348 €, joten hänelle ollaan velkaa 742 €. Kaikki muut maksoivat vähemmän kuin ovat velkaa. Uma on 348 € miinuksella, Tess 288 €, Ines 78 € ja Raf 28 €, ja nämä tekevät yhteensä Mon 742 €. Jos tasaat jokaisen ihmisparin välit suoraan, saat kymmenen erillistä velkaa. Side Badger ehdottaa sen sijaan neljää maksua, kaikki Molle.
  - heading: Tasaa tilit, ennen kuin kaikki hajaantuvat
    body: Paras hetki on viimeinen ilta tai kotimatka, kun kaikki ovat vielä samassa paikassa ja 28 € velan mainitseminen on helppoa. Lisää ensin kaikki kulut, taksi mukaan lukien. Kukaan ei voi poistua ryhmästä, jos hän on velkaa tai hänelle ollaan velkaa, joten laskenta on joka tapauksessa suljettava jossain vaiheessa.
    items:
      - "**Tarkista lista.** Avaa ryhmä ja katso **Saldot**. Oletuksena näet sinua koskevat velat. Valitse **Näytä kaikki** nähdäksesi koko ryhmän listan."
      - "**Maksa miten haluat.** Pankkisiirto, käteinen, edellisen loman palvelus. Side Badger ei siirrä rahaa."
      - "**Kirjaa se.** Valitse **Maksa velat**. Kohdassa **Pikaselvitys** jokainen painike on yksi ehdotetuista maksuistasi, ja yhden valitseminen täyttää summan. Lisää **Huomautus**, esimerkiksi pankkisiirto, tarkista **Päivämäärä** (se ei voi olla tulevaisuudessa) ja valitse **Kirjaa tilitys**."
      - "**Seuraa, kuinka se tyhjenee.** Saldo päivittyy kaikille. Kun viimeinenkin maksu on kirjattu, **Saldot**-kohdassa lukee **Kaikki tilit tasan!**"
  - heading: Osa nyt, loput myöhemmin
    body: Uma voi lähettää 200 € tänä iltana ja loput kuun lopussa. Hän kirjaa 200 €, ja lomake varoittaa, että hän on sen jälkeen yhä velkaa Molle 148 €, eli 348 € miinus 200 €. Tallenna se, niin 148 € jää hänen saldolleen, kunnes hän kirjaa loput. Varoitus toimii myös toisinpäin. Jos ylimääräinen nolla muuttaa 348 € luvuksi 3 480 €, lomake kertoo, että hän on velkaa Molle vain 348 € ja että tallentaminen loisi velan vastakkaiseen suuntaan. Korjaa nolla ennen tallennusta.
  - heading: Virheiden korjaus ja maksujen juhlinta
    items:
      - "**Väärä maksu.** Vain maksun kirjannut voi muokata sitä. Hän tai ryhmän ylläpitäjä voi poistaa sen, minkä jälkeen se voidaan kirjata uudelleen."
      - "**Huomionarvoinen maksu.** Jokainen kirjattu maksu on kohdassa **Tilitykset** päivämäärineen ja huomautuksineen, jossa kaikki ryhmässä näkevät sen ja voivat reagoida. Mo voi valita **Juhli**, kun Uman viimeiset 148 € saapuvat."
      - "**Loppu.** Kun jokainen saldo on nollassa, ylläpitäjä voi lukita ryhmän, jotta luvut pysyvät paikoillaan."
  - heading: Mitä Side Badger ei tee tässä
    items:
      - Se ei koskaan siirrä rahaa. Siinä ei ole maksulinkkejä eikä maksupyyntöjä, joten sovelluksen maksu on kirjaus muualla tehdystä maksusta.
      - Se ei lähetä muistutuksia. Myöhässä olevan maksun perään kysyminen on edelleen sinun vastuullasi.
      - Se ei aseta määräaikoja. Milloin Uman loput 148 € erääntyvät, on ryhmän sovittavissa.
      - Ehdotetut maksut ovat lyhyt lista, eivät lupaus lyhyimmästä mahdollisesta. Ne lasketaan valuutoittain, joten euroina ja puntina maksettu matka saa listan kummallekin.
