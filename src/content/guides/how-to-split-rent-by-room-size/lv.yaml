faq:
  heading: "Jautājumi"
  items:
    - q: "Ko darīt, ja kādam ir lielāka istaba, bet mazāk gaismas?"
      a: "Platība ir tikai sākumpunkts, tāpēc grupa var vienoties to pielāgot. Noņemiet tumšajai istabai vienu vai divus procentpunktus, iedodiet tos pārējiem un pārbaudiet, vai procenti joprojām kopā dod 100. Side Badger saglabā to, par ko vienojāties, un to nenosoda."
    - q: "Vai arī rēķini jādala pēc istabu lieluma?"
      a: "Parasti nē. Enerģiju un internetu lieto visi, tāpēc vienāda sadale ir vienkāršāka, kā iepriekš redzamajā piemērā. Ja kāds mājokļa biedrs visu dienu ir mājās, grupa var vienoties par ko citu, piemēram, par precīzām summām. [Izdevumu sadale](page:feature/split-expenses) apraksta iespējas."
    - q: "Vai sadali vēlāk var mainīt?"
      a: "Jā, jauniem izdevumiem. Nomainiet procentus, kopējot īri, un iepriekšējie mēneši paliek tādi, kādi bija. Lai izlabotu agrāku izdevumu, rediģējiet to, ja to ļauj grupas atļaujas, un vispirms pastāstiet mājas iemītniekiem, jo atlikumi mainīsies. Iepriekšējā versija tiek saglabāta."
