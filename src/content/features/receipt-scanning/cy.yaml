meta:
  title: "Sganio derbynneb i ychwanegu cost | Side Badger"
  description: "Gadewch i'r mochyn daear ddarllen y dderbynneb. Mae'n llenwi'r cyfanswm, y dyddiad a'r lle i'w gwirio. Dim credydau sganio. Gwasanaeth AI Google sy'n ei darllen."
h1: "Sganiwch dderbynneb, gwiriwch y manylion, rhannwch hi"
navLabel: "Sganio derbynebau"
lead: "Gadewch i'r mochyn daear ddarllen y dderbynneb, a gwiriwch ei waith cartref. Ychwanegwch lun at gost newydd ac mae Side Badger yn llenwi'r cyfanswm, y dyddiad a'r lle i chi eu gwirio. Yna rydych yn [ei rhannu](page:feature/split-expenses) fel unrhyw gost arall. Mae sganio am ddim, heb unrhyw gredydau sganio. Mae'n llenwi un gost ac nid yw'n rhannu'r bil fesul eitem. Mae delweddau derbynebau yn cael eu darllen gan wasanaeth AI Google."
cta:
  heading: "Tynnu llun. Gwirio. Rhannu."
  body: "Creu cyfrif am ddim, cychwyn grŵp ac ychwanegu cost gyda llun derbynneb. Gweld beth mae'n ei lenwi, newid beth bynnag sydd o'i le, a chadw pan fyddwch yn hapus."
problem:
  heading: "Does neb eisiau teipio derbynneb mewn ciw tacsis"
  body: "Daw papur gyda theithiau a nosweithiau mawr allan. Swper, y tacsi, y rownd a drodd yn chwech. Teipio pob un i ffôn gyda bodiau oer a chiw y tu ôl i chi yw'r ffordd y mae costau'n cael eu hanghofio. Felly bydd Side Badger yn darllen y dderbynneb i chi. Mae'n gwneud y drafft cyntaf ac rydych chi'n gwneud y gwirio. Mae'n gweddu i [deithiau grŵp](page:use-case/group-trips) a [digwyddiadau a dathliadau](page:use-case/events-and-celebrations), lle mae'r derbynebau'n pentyrru'n gyflymach nag y mae neb eisiau delio â nhw."
workflow:
  heading: "O lun i gost mewn tri cham"
  steps:
    - title: "Ychwanegu derbynneb at gost newydd"
      body: "Dechreuwch gost newydd a thapiwch **Sganio derbynneb**, neu defnyddiwch y weithred gyflym **Sganio derbynneb** ar eich dangosfwrdd. Tynnwch lun neu dewiswch un sydd gennych eisoes. Mae **Ychwanegu derbynneb neu atodiad** ar y ffurflen yn gweithio hefyd."
    - title: "Gadael iddo ddarllen y dderbynneb"
      body: "Mae'r ffurflen yn dweud **Dadansoddi derbyneb...** tra bo AI Side Badger yn darllen y ddelwedd. Yna mae'n llenwi'r hyn a ddarganfu, fel y disgrifiad, y cyfanswm, yr arian cyfred, y dyddiad, yr amser a'r lle. Mae unrhyw beth yr oeddech eisoes wedi'i deipio yn cael ei adael yn llonydd."
      shot: S09
      shotAlt: "Y ffurflen cost newydd yn dangos Dadansoddi derbyneb..., yna'r un ffurflen gyda'r manylion wedi'u llenwi"
    - title: "Gwirio, yna rhannu"
      body: "Cymharwch y ffurflen â'r papur. Cywirwch unrhyw beth sydd o'i le, dywedwch pwy dalodd a phwy a rannodd y gost, dewiswch sut i'w rhannu a chadwch. Dyw'r gost ddim yn bodoli nes i chi wneud hynny. Mae [rhannu treuliau](page:feature/split-expenses) yn trafod y rhannu."
options:
  heading: "Opsiynau"
  items: []
sections:
  - heading: "Beth mae'n ei lenwi"
    body: "Ychwanegwch lun derbynneb at gost newydd a gall y meysydd hyn lenwi. Chi sy'n dal i benderfynu pwy dalodd, pwy rannodd y gost a sut i'w rhannu."
    items:
      - "**Disgrifiad** ar gyfer y gost."
      - "Y **cyfanswm**."
      - "Yr **arian cyfred**, os yw eich grŵp yn ei ganiatáu."
      - "Y **dyddiad** a'r **amser**."
      - "Y **lle**."
      - "Copi testun o'r dderbynneb yn y **nodiadau**, ar gyfer pan fydd yr un papur yn pylu neu'n mynd drwy'r peiriant golchi."
  - heading: "Beth rydych chi'n dal i'w wirio"
    body: "Y cyfan. Ystyriwch yr hyn y mae'n ei lenwi fel drafft. Gwiriwch y cyfanswm yn erbyn y papur, yna'r arian cyfred, y dyddiad a'r lle. Gall lluniau aneglur a phapur crychlyd dwyllo unrhyw ddarllenydd, ac nid ydym yn addo y bydd yn cael pob derbynneb yn iawn, felly edrychwch cyn i chi gadw. Os oes rhywbeth o'i le, teipiwch drosto. Os yw'r dderbynneb mewn yen a'r grŵp yn setlo mewn punnoedd, mae [arian cyfred lluosog](page:feature/multiple-currencies) yn trafod beth sy'n digwydd nesaf."
  - heading: "Cadw'r dderbynneb gyda'r gost"
    body: "Wedi'i sganio neu beidio, gall derbynneb aros gyda'r gost. Atodwch luniau neu PDFs, hyd at dri fesul cost a hyd at 10 MB yr un. Mae aelodau'r grŵp yn eu gweld ar y gost. Mae delweddau'n ymddangos fel mân-luniau sy'n agor mewn gwyliwr, ac mae PDFs yn agor fel dolenni. Mae'r llun a sganiwch wedi'i atodi hefyd, oni fyddwch yn ei dynnu cyn i chi gadw. Pan fydd rhywun yn gofyn faint gostiodd y swper hwnnw mewn gwirionedd, mae'r prawf reit yno."
  - heading: "I ble mae eich derbynneb yn mynd"
    body: "Mae delweddau derbynebau yn cael eu darllen gan wasanaeth AI Google. I lenwi'r ffurflen, mae'r ddelwedd yn cael ei darllen gan Google Vertex AI (Gemini) yn aml-ranbarth Google yn yr Unol Daleithiau. Ychwanegwch ddelwedd at gost newydd ac mae'n cael ei darllen. Caiff PDF, neu lun a ychwanegir at gost sydd eisoes yn bodoli, ei storio heb ei ddarllen. Mae derbynebau wedi'u hatodi yn weladwy i aelodau'r grŵp, felly os yw derbynneb yn dangos rhywbeth y byddai'n well gennych beidio â'i rannu, hepgorwch y llun a theipiwch y gost honno i mewn â llaw."
limits:
  heading: "Cyfyngiadau"
  items:
    - "Delweddau yn unig. JPEG, PNG a WebP, a HEIC ar ôl ei drosi. Gellir atodi PDFs at gost ond ni chânt eu darllen."
    - "Mae sganio ar gyfer costau newydd yn unig. Ar gost sy'n bodoli eisoes gallwch atodi derbynebau, ond ni chaiff dim ei ddarllen."
    - "Mae'n llenwi dim ond y meysydd nad ydych wedi cyffwrdd â nhw, a'r arian cyfred dim ond os yw eich grŵp yn ei ganiatáu."
    - "Nid yw'n rhannu fesul eitem nac yn neilltuo llinellau'r dderbynneb i bobl. Mae'n llenwi un gost ac rydych chi'n ei rhannu fel arfer."
    - "Does dim addewid bod yr hyn y mae'n ei lenwi yn gywir, na bod sganio yn gweithio bob tro. Gwiriwch cyn i chi gadw, ac ychwanegwch y gost â llaw os bydd sganio'n methu neu os nad yw ar gael."
    - "Mae cost yn dal hyd at dri atodiad, pob un hyd at 10 MB, fel JPEG, PNG, WebP, HEIC neu PDF."
    - "Mae delweddau derbynebau yn cael eu darllen gan Google Vertex AI (Gemini) yn aml-ranbarth Google yn yr Unol Daleithiau, ac mae derbynebau wedi'u hatodi yn weladwy i aelodau'r grŵp."
