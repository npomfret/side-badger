    - label: "일본에서의 저녁"
      payer: ben
      amount: 40000
      currency: JPY
      split:
        method: equal
    - label: "기차표"
      payer: chloe
      amount: 24000
      currency: JPY
      split:
        method: equal
    - label: "사찰 입장료"
      payer: dev
      amount: 4000
      currency: JPY
      split:
        method: equal
