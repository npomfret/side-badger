sections:
  - heading: "Eén valuta voor de hele groep"
    body: "Als je groep er liever niet over nadenkt, kies dan een groepsvaluta en het formulier rekent elke nieuwe uitgave ernaar om, tegen een koers die je nog steeds kunt zien en aanpassen. Dit geldt enkel voor nieuwe en gekopieerde uitgaven. Wijzigingen en bestaande uitgaven blijven zoals ze zijn, zodat niets wat al geregistreerd is onder je handen verandert."
  - heading: "Euro’s schuldig, in ponden betalen"
    body: "In yen betaald, in ponden afrekenen? Geen probleem. Wanneer je een betaling registreert, kun je ze ook omrekenen, zodat wie euro’s schuldig is in ponden kan betalen en het saldo in euro toch klopt. Betaal elkaar zoals je wilt en registreer het dan."
  - heading: "Regels voor de groep"
    body: "Beperk een groep tot de valuta’s die je echt gebruikt en stel een standaard in, zodat het formulier op de juiste opent. Een vakantie in Portugal heeft naast de dinerrekening geen 139 andere opties nodig, en een [bruiloft in het buitenland](page:use-case/events-and-celebrations) waarschijnlijk twee."
limits:
  heading: "Beperkingen"
  items:
    - "De koers ligt vast wanneer de uitgave wordt opgeslagen. Oude uitgaven worden nooit herwaardeerd."
    - "Side Badger haalt een actuele koers op waar het kan. Niet voor elk paar is er gegarandeerd een, en je kunt de koers altijd zelf typen."
    - "Automatisch omrekenen voor de groep geldt enkel voor nieuwe en gekopieerde uitgaven, niet voor wijzigingen of bestaande uitgaven."
    - "Elke uitgave is begrensd op 999.999,99 in haar eigen valuta."
    - "Er zijn 140 valuta’s. Cryptovaluta en metalen horen daar niet bij."
    - "Side Badger registreert betalingen. Het verplaatst of wisselt nooit geld."
useCasesHeading: "Waar dit helpt"
faq:
  heading: "Vragen"
  items:
    - q: "Welke wisselkoers gebruiken jullie?"
      a: "Een actuele wisselkoers, opgehaald wanneer je de uitgave invoert, waar er een beschikbaar is. Je kunt hem aanpassen naar de koers die je echt kreeg en het omgerekende bedrag wordt bijgewerkt."
    - q: "Worden oude uitgaven herwaardeerd?"
      a: "Nee. De koers ligt vast wanneer de uitgave wordt opgeslagen, dus een saldo verschuift niet omdat de markt dat deed."
    - q: "Ondersteunen jullie crypto?"
      a: "Nee. Er zijn 140 valuta’s en cryptovaluta horen daar niet bij."
    - q: "Waarom kan ik geen 2,000,000 roepia invoeren?"
      a: "Elke uitgave is begrensd op 999.999,99 in haar eigen valuta. Voer ze in een andere valuta in en reken om, of splits ze op in twee uitgaven."
    - q: "Kost omrekenen iets?"
      a: "Nee. Omrekenen is gratis, zoals de rest van Side Badger. Zie [prijzen](page:pricing)."
    - q: "Moet ik omrekenen?"
      a: "Nee. Valuta’s blijven apart, tenzij jij of je groep ervoor kiest om om te rekenen, en elke valuta krijgt zijn eigen korte lijst betalingen."
