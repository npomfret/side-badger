meta:
  title: "Side Badger vs. Splitwise: die ganze Gruppe, nicht nur die Summen | Side Badger"
  description: "Kostenlose Splitwise-Alternative für die ganze Gruppe: Kommentare, Fragen, Listen, Umfragen und echte Rollen, dazu kostenloser Belegscan und Währungsumrechnung."
h1: "Side Badger vs. Splitwise: die ganze Gruppe, nicht nur die Summen"
navLabel: Side Badger vs. Splitwise
lead: "Irgendwer in deiner Gruppe hat wahrscheinlich schon gesagt: „Nimm doch einfach Splitwise.“ Verständlich: Beim Rechnen ist es gut. Side Badger rechnet auch und gibt der Gruppe dann einen Ort, alles durchzusprechen: Kommentare, Fragen, Listen, Umfragen und echte Gruppenrollen. Belegscan und Währungsumrechnung gibt es gratis dazu."
cta:
  heading: Probier es bei deiner nächsten gemeinsamen Rechnung aus
  body: Erstelle ein kostenloses Konto, lege eine Gruppe an und füge eine echte Ausgabe hinzu. Wenn es nichts für dich ist, hast du ein paar Minuten investiert, kein Abo.
asOf: 2026-11-22
asOfNote: Wir haben Splitwises eigene Seiten am {date} gelesen, damit du es nicht musst, und alles hier über Splitwise stammt von dort. Jede Zeile der Tabelle verlinkt auf ihre Quelle. Pläne ändern sich, deshalb prüfen wir jedes Quartal neu, und wenn Splitwises Seiten dieser hier widersprechen, glaube ihnen.
