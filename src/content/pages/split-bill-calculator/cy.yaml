meta:
  title: "Cyfrifiannell rhannu bil: pwy sy'n ddyledus i bwy | Side Badger"
  description: "Pwy dalodd a phwy sy'n ddyledus, wedi'i drefnu mewn eiliadau. Rhannwch yn gyfartal, yn union neu yn ôl canran. Am ddim, yn eich porwr, a dim yn cael ei gadw na'i anfon."
h1: "Cyfrifiannell rhannu bil"
navLabel: "Cyfrifiannell rhannu bil"
lead: "Teipiwch pwy dalodd am beth ac mae'r gyfrifiannell yn dweud pwy sy'n ddyledus i bwy, gyda rhestr fer o daliadau i'w setlo. Mae'n rhedeg yn eich porwr, yn cadw dim ac yn symud dim arian. Os oes angen i'r cyfrif oroesi'r tab ar eich grŵp, mae [rhannu treuliau](page:feature/split-expenses) a [setlo](page:feature/settle-up) yn Side Badger yn gwneud yr un symiau ac yn eu cadw."
cta:
  heading: "Hoffi'r symiau? Cadwch nhw."
  body: "Mae'r gyfrifiannell hon yn anghofio popeth pan fyddwch yn cau'r tab, yn union fel pwy bynnag sy'n taeru iddyn nhw dalu y tro diwethaf. Mae grŵp Side Badger yn cadw'r costau, yn diweddaru balans pawb ac yn cofnodi'r taliadau. Mae am ddim, heb hysbysebion a heb gyfyngiadau dyddiol."
sections:
  - heading: "Sut mae'r symiau'n gweithio"
    body: "Ar gyfer pob cost, mae'r gyfrifiannell yn gweithio allan cyfran pob person. Gallwch ei rhannu'n gyfartal, yn ôl symiau union neu yn ôl canran, rhwng y bobl a ddewiswch. Balans pob person wedyn yw'r hyn a dalodd minws yr hyn sy'n ddyledus ganddo. Mae arwydd plws yn golygu bod y grŵp yn ddyledus iddo, ac mae arwydd minws yn golygu ei fod yn ddyledus i'r grŵp. Mae'r balansau bob amser yn adio i sero, oherwydd mae beth bynnag sy'n ddyledus i un person yn ddyledus gan bobl eraill."
  - heading: "Pam mae'r rhestr o daliadau yn fyr"
    body: "Does dim angen i neb setlo pob derbynneb ar ei phen ei hun. Unwaith y bydd pob balans yn hysbys, mae'r gyfrifiannell yn paru'r sawl sydd â'r ddyled fwyaf â'r sawl y mae'r mwyaf yn ddyledus iddo, yn setlo cymaint ag y gall un taliad, ac yn mynd ymlaen i lawr y rhestr nes bod pawb ar sero. Y mwyaf sydd ei angen yw un taliad yn llai na nifer y bobl sydd â balans, ac yn aml mae angen llai na setlo bil wrth fil. Mae'n rhoi rhestr fer o daliadau, ac nid yw'n addo mai hon yw'r fyrraf bosibl."
  - heading: "Beth nad yw'r gyfrifiannell yn ei wneud"
    items:
      - "**Trin mwy nag un arian cyfred.** Dewiswch un a'i ddefnyddio ar gyfer y symiau i gyd. Mae'r ap yn cadw balans ar wahân ar gyfer pob arian cyfred, a gall drosi cost ar gyfradd gyfnewid gyfredol, y gallwch ei newid."
      - "**Cadw dim.** Caewch y tab ac mae'r ffigurau wedi mynd. I'w cadw, copïwch y ddolen. Mae'n dal eich ffigurau ar ôl yr arwydd #, nad yw eich porwr byth yn ei anfon at weinydd, a gall unrhyw un yr anfonwch y ddolen ato eu darllen."
      - "**Symud arian.** Mae'n dweud wrthych pwy ddylai dalu i bwy. Rydych yn talu eich gilydd sut bynnag y dymunwch, yna'n cofnodi'r taliad yn yr ap os yw eich grŵp yn cadw ei gyfrif yno."
      - "**Dewis y geiniog weddilliol ar hap.** Pan nad yw bil yn rhannu'n daclus, mae'r ceiniogau sy'n weddill yn mynd i'r bobl gyntaf yn y rhestr, fel bod y cyfansymiau'n dal i adio. Yn yr ap, mae'r geiniog weddilliol yn mynd i un person ar hap, felly nid yr un person ydyw bob tro."
      - "**Mynd dros y cyfyngiadau.** Mae'r gyfrifiannell yn derbyn 2 i 20 o bobl, a gall un gost fod hyd at 999,999.99, fel yn yr ap."
