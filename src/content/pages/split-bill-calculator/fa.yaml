faq:
  heading: "پرسش‌ها"
  items:
    - q: "ماشین‌حساب رایگان است؟"
      a: "بله. رایگان. بدون تبلیغات. بدون محدودیت روزانه. حساب کاربری هم لازم ندارید."
    - q: "آنچه را تایپ می‌کنم ذخیره می‌کند؟"
      a: "نه. هیچ‌چیز ذخیره یا به جایی فرستاده نمی‌شود. برای نگه داشتن عددها از «کپی لینک» استفاده کنید و لینک را جایی ذخیره کنید."
    - q: "چه کسی می‌تواند لینکی را که کپی می‌کنم ببیند؟"
      a: "هر کسی که آن را داشته باشد. عددها در خود لینک و بعد از # هستند، پس آن را فقط با کسانی به اشتراک بگذارید که باید ببینندشان."
    - q: "پول جابه‌جا می‌کند؟"
      a: "نه. فقط حساب می‌کند چه کسی باید به چه کسی بپردازد و شما هر طور دوست دارید به هم پرداخت می‌کنید. Side Badger هم هرگز به پول شما دست نمی‌زند. [تسویه حساب](page:feature/settle-up) را ببینید."
    - q: "می‌توانم سفری را که با دو ارز پرداخت شده تقسیم کنم؟"
      a: "اینجا نه، چون هر محاسبه یک ارز دارد. در یک گروه، هر ارز مانده جداگانه خودش را دارد. [چند ارز](page:feature/multiple-currencies) را ببینید."
    - q: "اگر مبلغ‌ها جمع نشوند چه؟"
      a: "ماشین‌حساب زیر همان هزینه این را می‌گوید و تا وقتی درست نشوند نتیجه‌ای نشان نمی‌دهد. مبلغ‌های دقیق باید جمعشان برابر کل شود و درصدها باید 100 شوند."
