meta:
  title: "Side Badger para colegas de casa, viagens e festas"
  description: "Divide custos com colegas de casa, em viagens de grupo e em festas, casamentos e presentes de grupo. Vê o que o Side Badger faz por cada tipo de grupo."
h1: "Side Badger para o teu tipo de grupo"
navLabel: "Casos de utilização"
lead: "Colegas de casa, férias, despedidas. Escolhe o teu caos e vê como um grupo como o teu mantém a conta."
intro: "Cada grupo divide os custos de forma um pouco diferente. Estas páginas seguem um **cenário realista** desde a primeira despesa até ao último pagamento registado, com as contas à vista, para veres onde o teu grupo iria parar."
cta:
  heading: "Encontraste o teu tipo de grupo?"
  body: "Cria uma conta, começa um grupo e adiciona a primeira despesa. Demora alguns minutos."
  button: "Criar uma conta grátis"
cardsHeading: "Escolhe a situação mais parecida com a tua"
sections:
  - heading: "Viagens em grupo"
    body: "Voos em libras, uma villa em euros e um jantar em que só três pessoas comeram. Define o grupo para converter para libras e quatro amigos em Lisboa terminam com três pagamentos, em vez de seis quando as moedas ficam separadas. [Dividir os custos de uma viagem em grupo](page:use-case/group-trips)."
  - heading: "Colegas de casa"
    body: "Uma pessoa paga ao senhorio, outra lembra-se da conta da luz, e ninguém concorda sobre quem comprou o papel higiénico. Com a renda dividida pelo tamanho dos quartos e as outras contas em partes iguais, quatro colegas de casa terminam o mês com três pagamentos, todos para quem pagou a renda. [Dividir as contas da casa com colegas](page:use-case/housemates)."
  - heading: "Festas, casamentos e presentes de grupo"
    body: "Seis pessoas votam no presente, uma compra-o, e nem todas contribuem com o mesmo valor. Um presente de 150 £ dividido por valores exatos deixa cinco pagamentos para quem o comprou, 120 £ no total. [Dividir os custos de um evento](page:use-case/events-and-celebrations)."
  - heading: "Casais"
    body: "Partilha os custos aborrecidos sem transformar o jantar a dois numa reunião trimestral de finanças. A renda dividida 60/40 e as compras em partes iguais resumem-se a um único pagamento entre os dois."
  - heading: "Vê primeiro como funciona"
    body: "Todos os exemplos acima usam os mesmos passos, desde criar um grupo até registar os pagamentos. [Como funciona](page:how-it-works) percorre-os, e os [preços](page:pricing) dizem quanto custa, que é nada, sem anúncios e sem limites diários."
faq:
  heading: "Perguntas"
  items:
    - q: "Todas as pessoas do grupo precisam de uma conta?"
      a: "Sim. As pessoas entram com um link ou código QR e uma conta grátis."
    - q: "O Side Badger pode cobrar o dinheiro?"
      a: "Não. Pagas como preferires e depois registas o pagamento para os saldos ficarem certos."
    - q: "Tenho de escolher um só tipo de grupo?"
      a: "Não. Os casos de utilização são exemplos, não definições. Todos os grupos têm as mesmas funcionalidades, por isso usa a combinação que te servir."
