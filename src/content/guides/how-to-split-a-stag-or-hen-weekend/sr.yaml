meta:
  title: "Како поделити трошкове момачке или девојачке вечери | Side Badger"
  description: "Почасни гост не плаћа ништа, а у понедељак сви још причају једни с другима. Како поделити викенд за момачко или девојачко вече, са рачуном."
h1: "Како поделити трошкове викенда за момачко или девојачко вече"
navLabel: "Момачко или девојачко вече"
lead: "Почасни гост не плаћа ништа, па остали сваки трошак деле [једнако](page:feature/split-expenses) међу собом. Изостави људе из трошкова које прескачу, а почасног госта држи ван групе да изненађење опстане."
cta:
  heading: "Води рачуна и сачувај изненађење"
  body: "Направи групу, пошаљи везу свима осим почасном госту и додај сваки трошак чим настане. Side Badger је бесплатан, без огласа и без дневних ограничења."
sections:
  - heading: "Четири пријатељице и једно изненађење"
    body: "Хана, Ајла, Џес и Кет воде Грејс на њен викенд за девојачко вече. Грејс је почасни гост, па не плаћа ништа. Она није ни у групи, па не може да види колико пријатељице троше на њу. Хана резервише викендицу, Ајла плаћа спа дан, Џес вечеру, а Кет такси. До недеље је свако платио нешто и нико не зна ко је у плусу. Рачун је исти за момачко и за девојачко вече, ма ко био почасни гост."
  - heading: "Дели на оне који плаћају, а не на оне који су ту"
    body: "Удео почасног госта не нестаје. Он се распореди. Викендица кошта 720 £ и плаћају је четири пријатељице, што је по 180 £, а Грејсино место је већ у том износу. Вечера је 260 £, дакле по 65 £. Такси је 44 £, по 11 £. Све што неко прескочи изузима се само из тог трошка. Кет прескаче спа, па тих 360 £, што покрива и Грејсино место, деле Хана, Ајла и Џес по 120 £. Сабери све и Хана, Ајла и Џес дугују по 376 £ за викенд, а Кет 256 £."
  - heading: "Подеси у Side Badger-у"
    items:
      - "Направи групу за викенд и дај јој досадно име, на пример Викендица. Грејс није члан, а групу виде само чланови."
      - >-
        Изабери **Позови друге** и пошаљи везу или покажи QR код само тамо где Грејс неће видети. Веза показује преглед групе пре него што се неко придружи. Изабери колико траје, од 15 минута до 5 дана. Стара веза ради док не истекне, зато је не остављај дуже него што је потребно.
      - >-
        За сваки трошак изабери **Додај трошак**, унеси износ и изабери платиоца под **Ко је платио?** Под **Подели између** означи људе који плаћају, а изостави оне који су га прескочили, као Кет за спа. Под **Начин поделе** изабери **Једнако**.
      - >-
        Кад се вратите, отвори **Стања** у групи. Side Badger показује ко коме дугује и предлаже кратак списак уплата. Овде су три: Кет плаћа Хани 212 £, Џес плаћа Хани 116 £, а Ајла плаћа Хани 16 £. Платите једни другима како год желите, па помоћу **Поравнај** забележите сваку уплату.
  - heading: "Пре резервације, буџет и депозит"
    body: "Договорите буџет пре него што било ко резервише. Изабери **Додај анкету**, питај колико група жели да потроши на викендицу и понуди неколико износа као опције. Укључи **Анонимно гласање** кад је правиш, да се сакрије ко је за шта гласао, па нико не мора наглас да брани мањи буџет. Затворите анкету кад сви гласају и победник се појави. Онда долази депозит. Ко резервише, плаћа га и уноси као трошак, подељен једнако, а остатак иде као други трошак кад доспе. Остали могу одмах да пошаљу свој део и забележе уплату или да сачекају коначни обрачун. Стања су иста у оба случаја."
  - heading: "Кад се неко придружи само на једну ноћ"
    body: "Пријатељ који дође само у суботу не треба да плати петак. Изостави га из трошкова у којима није учествовао. Тамо где трошак зависи од дужине боравка, као соба, изабери **Тачни износи** под **Начин поделе** и укуцај део сваке особе, који мора давати укупан износ. Прво израчунај цену по особи по ноћи, па је помножи бројем ноћи које свака особа остаје. Страница о [групним путовањима](page:use-case/group-trips) има више о трошковима који нису исти за све."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Никад не премешта новац. Плаћате једни другима банковним преносом, кешом или како вам одговара, а затим забележите уплату да се стања ажурирају за све."
      - "Не шаље подсетнике за плаћање. Пријатељско гурање у групном ћаскању и даље остаје на људима."
      - "Сваки трошак има једног платиоца, а Side Badger не може да подели рачун ставку по ставку. Ако су викендицу платиле две картице, унеси је као два трошка. Ако су неки наручили додатке на вечери, унеси додатке као посебан трошак."
      - "Води новац, а не програм путовања. Анкете и коментари остају уз трошкове, па се планови за викенд договарају у групном ћаскању."
