meta:
  title: "Bill splitting app na walang download | Side Badger"
  description: "Puno na ang phone mo, naiintindihan namin. Tumatakbo ang Side Badger sa browser, walang app store o download. Idagdag sa home screen at bubukas na parang app."
h1: "Walang app store. Walang download. Pero parang app pa rin"
navLabel: "Web app"
lead: "Nasa browser mo ang Side Badger. Walang app store na hahanapin at walang kailangang i-download muna. Mag-sign in sa phone o computer, maghati ng gastos online kasama ang grupo mo, at idagdag ito sa home screen o dock kapag gusto mo itong isang tap lang."
cta:
  heading: "Buksan. Mag-sign in. Magsimula ng grupo."
  body: "Gumawa ng account, magsimula ng grupo, at idagdag ang unang gastos, lahat mula sa browser na nakabukas mo na. Gusto munang libutin? Tingnan ang [paano ito gumagana](page:how-it-works), o ang [saklaw ng libre](page:pricing)."
problem:
  heading: "Puno na ang phone mo. Naiintindihan namin."
  body: "Sa isang sulok nito ang apat na libong litrato ng iisang paglubog ng araw at isang babala sa storage na ilang buwan mo nang ini-swipe palayo. Ang huling kailangan nito ay isa pang app, para lang maghati ng isang hapunan. Kaya web app ang Side Badger. Tumatakbo ito sa makabagong browser sa phone o computer. Sa phone, gumagamit ito ng mobile layout, na may page ng grupo na hinati sa mga tab at mga kontrol na madaling tapikin. May ilang dagdag, gaya ng pagdaragdag nito sa home screen, na nakadepende sa browser mo, at sinasabi namin kung alin."
workflow:
  heading: "Mula browser tab hanggang home screen sa tatlong hakbang"
  steps:
    - title: "Buksan at mag-sign in"
      body: "Pumunta sa Side Badger sa browser mo at mag-sign in. Email address at password lang ang kailangan mo, at kailangan mong i-verify ang email bago ka makapagdagdag ng anuman. Kailangan ng account ng bawat tao sa grupo, kaya ganoon din ang gagawin ng mga iimbitahan mo."
    - title: "Idagdag sa home screen o dock"
      body: "Kapag naka-sign in ka na, mag-aalok ang app na i-install ang sarili nito. May button na **I-install** kung saan ito pinapayagan ng browser mo, at **Ipakita kung paano** kung hindi. Hindi mo ba ito nakita, o tumanggi ka? Nasa **Mga Setting** ang parehong tulong sa ilalim ng **Idagdag sa Home Screen o Dock**. Sa iPhone o iPad, unang ipinapakita ng Mga Setting ang mga hakbang para sa iPhone at inilalagay sa ilalim ng **Iba pang device** ang iba. Sa alinmang paraan, bubukas na ang app sa sarili nitong window."
      shot: S20
      shotAlt: "Ang seksyong Idagdag sa Home Screen o Dock ng Mga Setting, na may mga hakbang sa pagdaragdag ng app sa isang device"
    - title: "I-on ang mga abiso, kung gusto mo"
      body: "Naka-off ang mga abiso hangga't hindi mo ino-on, at hiwalay na ino-on ang bawat device. Gamitin ang button na **I-on** na iniaalok ng bell ng mga abiso, o ang switch na **Mga push notification** sa **Mga Setting**. Sa iPhone o iPad, buksan muna ang app mula sa Home Screen. Iyon lang ang lugar kung saan gumagana ang mga abiso roon."
      shot: S19
      shotAlt: "Nakabukas ang dropdown ng mga abiso, na naglilista ng kamakailang aktibidad sa grupo"
options:
  heading: "Paano ito idagdag, bawat device"
  items:
    - title: "iPhone at iPad"
      body: "I-tap ang button na Ibahagi, isang parisukat na may arrow na nakaturo pataas. Kung hindi mo ito makita, i-tap muna ang tatlong tuldok (•••), saka Ibahagi. Mag-scroll pababa at i-tap ang **Idagdag sa Home Screen**. Panatilihing naka-on ang **Buksan bilang Web App**, saka i-tap ang **Idagdag**. Kung may link na bumukas sa loob ng ibang app, buksan muna ang page sa Safari, dahil hindi ito maidaragdag ng built-in na browser na iyon."
    - title: "Android"
      body: "Buksan ang menu ng browser at piliin ang **Idagdag sa Home screen** o **I-install ang app**."
    - title: "Chrome o Edge sa computer"
      body: "Buksan ang menu ng browser at piliin ang opsyon para i-install ang site na ito bilang app. Magkakaroon ito ng sarili nitong window at sarili nitong icon."
    - title: "Safari sa Mac"
      body: "Piliin ang **File**, saka **Idagdag sa Dock**."
sections:
  - heading: "Mga abiso, kung hihilingin mo lang"
    body: "Opt-in ang mga push notification. I-on ang mga ito at makakatanggap ka ng abiso kapag may bagong aktibidad sa mga grupo mo, gaya ng may nagdagdag ng gastos, nag-iwan ng komento, o nagtala ng bayad. Isa-isang device ang pag-on, mula sa bell ng mga abiso o sa **Mga Setting**, at puwede mo rin silang i-off doon. Kailangan nila ng browser na sumusuporta sa mga ito at ng pahintulot mo. Kung hinarang ng browser mo ang mga ito para sa site, payagan muna ang mga ito sa mga setting ng browser. Sa iPhone o iPad, gumagana lang ang mga ito mula sa app na nakadagdag sa Home Screen, hindi sa browser tab. Hindi garantisado ang pagdating, kaya ituring na pagsundot lang ang abiso, hindi pangako. Para sa kung ano ang lumalabas sa feed, tingnan ang [magplano nang sama-sama](page:feature/plan-together)."
  - heading: "Mga live update, walang refresh button"
    body: "Magdagdag ng gastos at makikita ito agad ng lahat, kasama kung ano ang nagbago at kung sino ang nagbago. May activity history ang bawat grupo, at ipinapakita ng bell ng mga abiso ang aktibidad sa lahat ng grupo mo. Walang kailangang magtanong kung nakita mo na ang katatapos mo lang idagdag. Nasa screen na nila ito."
  - heading: "39 na wika, kanya-kanya"
    body: "Gamitin ang Side Badger sa 39 na wika, kasama ang right-to-left na Arabic, Persian, at Urdu. Pumipili ang bawat tao sa grupo ng sarili niyang wika, kaya ang iisang page ng grupo ay puwedeng Arabic para sa isa at English para sa kasunod. Ang tanging kailangang pagkasunduan ng grupo ay ang mga numero."
  - heading: "Ginawa para sa higit sa isang uri ng user"
    body: "Binuo ang Side Badger nang may isip sa mga gumagamit ng keyboard at screen reader. May kasamang pattern ang mga kulay ng miyembro, kaya hindi mo kailangang pagkaibahin ang berde at pula."
    items:
      - "Mga skip link, para diretsong makalundag ang mga gumagamit ng keyboard sa nilalaman."
      - "Pinamamahalaan ng mga dialog ang keyboard focus."
      - "May label ang mga kontrol, para sa mga screen reader."
      - "Bumabaligtad ang mga layout para sa mga wikang right-to-left."
limits:
  heading: "Ang hindi ginagawa ng web app"
  items:
    - "Walang offline na paggamit. Kailangan ng koneksyon ng Side Badger, kaya hindi nito bubuksan ang grupo mo sa eroplanong walang wifi."
    - "Walang app sa app store at walang native na app para sa iPhone o Android. Web app ang Side Badger, at ang pagdaragdag nito sa home screen o dock ang paraan para makuha ang parang-app na bersyon."
    - "Nakadepende sa browser mo ang pagdaragdag nito sa home screen o dock. Nag-iiba ang mga pangalan ng menu sa bawat browser at bersyon, at may ilang browser na hindi ito inaalok."
    - "Opt-in ang mga push notification sa bawat device, at kailangan nila ng browser na sumusuporta sa mga ito at ng pahintulot mo. Sa iPhone o iPad, gumagana lang ang mga ito mula sa app na nakadagdag sa Home Screen. Hindi garantisado ang pagdating."
    - "Walang email o text alert at walang paalala sa bayad. Lumalabas sa app ang bagong aktibidad, at bilang push notification kung ino-on mo ito. Ikaw pa rin ang maniningil ng bayad."
    - "Pinapanatili ang aktibidad sa loob ng 90 araw."
    - "Nagsa-sign in ka gamit ang email address at password. Walang Google o Apple sign-in, at kailangan mong 18 taong gulang pataas."
    - "Hindi namin sinasabing ganap na accessible ang Side Badger, o na sumusunod ito sa pormal na pamantayan sa accessibility. Kung may humahadlang sa iyo, sabihin sa amin mula sa loob ng app at makikita mo roon ang sagot namin."
useCasesHeading: "Saan nakakatulong ang hindi na kailangan ng app"
faq:
  heading: "Mga tanong"
  items:
    - q: "May Side Badger app ba sa app store?"
      a: "Wala. Web app ang Side Badger. Binubuksan mo ito sa browser, at puwede mo itong idagdag sa home screen o dock para bumukas na parang app. Walang ida-download mula sa app store."
    - q: "Puwede ba akong maghati ng bayarin nang walang dina-download na app?"
      a: "Oo. Buksan ang Side Badger sa browser sa phone o computer, mag-sign in, at magsimula ng grupo. Opsyonal ang pagdaragdag nito sa home screen o dock."
    - q: "Gumagana ba ito offline?"
      a: "Hindi. Kailangan ng koneksyon ng Side Badger, kahit nakadagdag na ito sa home screen o dock."
    - q: "Bakit hindi ako nakakakuha ng abiso sa iPhone ko?"
      a: "Sa iPhone o iPad, gumagana lang ang mga abiso mula sa app na nakadagdag sa Home Screen, hindi sa browser tab. Idagdag ito, buksan mula sa icon sa Home Screen, saka i-on ang mga abiso sa **Mga Setting**. Hindi garantisado ang pagdating, kaya kung may nawala, ipinapakita pa rin ng activity history ng grupo ang mga naidagdag."
    - q: "Kailangan ko bang i-on ang mga abiso?"
      a: "Hindi. Naka-off ang mga ito hangga't hindi mo ino-on, isa-isang device. Kahit wala ang mga ito, lumalabas pa rin sa app ang bagong aktibidad, at nakikita agad ng lahat ang pagbabago kapag nakabukas ito."
    - q: "Kailangan ba ng account ng lahat sa grupo?"
      a: "Oo. Email address at password lang ang kailangan, at kailangang i-verify ang email bago makapagdagdag ng anuman. Ganoon din ang ginagawa ng lahat ng sumasali sa grupo, sa anumang phone o computer na gusto nila."
