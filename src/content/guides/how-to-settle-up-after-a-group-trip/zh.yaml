faq:
  heading: 常见问题
  items:
    - q: 谁应该记录付款，付钱的人还是收钱的人？
      a: 记录付款需要编辑支出的权限，表单会问**谁付的钱？**和**谁收到了付款？**只有记录它的人以后才能编辑它，所以通常由付款的人用快速结算按钮来记最简单。
    - q: 如果这趟旅行用了两种货币呢？
      a: 余额按货币分别记录，所以欧元的债务仍是欧元的债务，每种货币各有自己的简短清单，除非支出在录入时做了换算。[多种货币](page:guide/how-to-split-a-trip-paid-in-several-currencies)展示了两种办法。
    - q: 应该在旅行中结清，还是结束时再结？
      a: 都行。每笔记录下来的付款都会改变余额，所以旅行中途的付款会计入最终清单。结束时更简单，因为[整趟旅行](page:use-case/group-trips)都在一个地方。
