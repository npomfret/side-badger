meta:
  title: "قسّم تكاليف الحفلات وحفلات الزفاف والهدايا الجماعية"
  description: "تقاسموا تكاليف حفلة أو زفاف أو هدية جماعية حين يساهم كل واحد بمبلغ مختلف. صوّتوا على الخطة، وقسّموا بمبالغ محددة، واعرفوا من يدين لمن."
h1: "قسّم تكاليف الحفلات وحفلات الزفاف والهدايا الجماعية"
navLabel: "المناسبات والاحتفالات"
lead: "قسّموا العربون والزينة والمظلات الطارئة. واتركوا مخطط الجلوس لمن هو أشجع. يحتفظ Side Badger بـ**من ساهم بماذا** في مكان واحد، ليستمتع المنظِّم بالحفلة أيضاً."
cta:
  heading: "ابدأ بالاحتفال القادم"
  body: "أنشئ حساباً، وأنشئ مجموعة للمناسبة، وأرسل رابط الدعوة. Side Badger مجاني، بلا إعلانات وبلا حدود يومية."
scenario:
  heading: "الجميع يساهمون، ولا يساهمون دائماً بالمبلغ نفسه"
  body: "يدفع أحدهم عربون القاعة، ويشتري آخر الكعكة، ويضع ثالث الهدية الجماعية على بطاقته. بعض الضيوف يحضرون كل شيء، وبعضهم يحضر العشاء فقط. وإبقاء حساب عادل لذلك في سلسلة دردشة عمل لم يتقدّم له أحد. أما مجموعة Side Badger فتحمل كل شيء، مهما اختلطت المبالغ، وتُظهر لكل شخص ما عليه أو ما له. انظر [كيف يعمل](page:how-it-works) للأساسيات، أو تابع القراءة لمعرفة الأمر في مناسبة."
sections:
  - heading: "قرّروا معاً"
    body: "قبل أن يتحرك أي مال، اعرضوا الخيار على **استطلاع**. أضف حتى 10 خيارات، مثل قاعتين أو ثلاث أفكار للهدايا، ودع الجميع يصوّتون. ويمكنك إخفاء من صوّت لماذا، فينال كل خيار فرصة عادلة، ويظهر الفائز حين يُغلق الاستطلاع. لا أحد يضطر إلى التمرير عبر أربعين رسالة ليعرف ما تقرر."
  - heading: "من شارك في ماذا"
    body: "ليس كل واحد يدفع المبلغ نفسه، وليس كل واحد طرفاً في كل تكلفة. قسّم المصروف بالتساوي أو بنسبة مئوية أو **بمبالغ محددة**، لتكون حصة كل شخص هي الرقم الذي اتفقتم عليه. واستبعد كل من لم يشارك، مثل الضيوف الذين تخطّوا العشاء أو الأصدقاء الذين لم ينضموا إلى الهدية. لكل مصروف دافع واحد، وكل من في التقسيم يدين له بحصته. وتجد التفاصيل في صفحة [تقسيم المصروفات](page:feature/split-expenses)."
  - heading: "احفظ الأوراق"
    body: "أضف ملاحظات إلى المصروف، مثل ما غطّته التكلفة. وتبقى التعليقات **بجانب المصروف** الذي تخصه، فيعيش سؤال «هل كانت الكعكة £45 أم £54؟» وجوابه في المكان نفسه. تصل التعليقات إلى 500 حرف، وهذا يكفي لسؤال عن عربون."
  - heading: "أدوات المنظِّم"
    body: "التعاون المفتوح يتيح لأي عضو إضافة المصروفات وتعديلها، وهذا مناسب لهدية صغيرة. أما لحفل زفاف أو حفلة أكبر فاختر إعداد **المجموعة المُدارة**. يوافق المشرفون على كل عضو جديد، ولا يغيّر المصروفات إلا المنشئون والمشرفون. ادعُ الناس برابط أو برمز QR؛ ومع تفعيل الموافقة يسمح المشرف لكل شخص بالدخول، فتبقى قائمة الضيوف هي قائمة الضيوف. وحين تنتهي المناسبة، أقفل المجموعة ليبقى كل رقم في مكانه."
  - heading: "سوّوا الحساب بعد الحفلة"
    body: "حين تصل آخر فاتورة، تُظهر الأرصدة **من يدين لمن**، ويقترح Side Badger قائمة قصيرة من الدفعات تسوّي حساب الجميع. ادفعوا لبعضكم بالطريقة التي تناسبكم، ثم سجّلوا الدفعة في المجموعة. لا ينقل Side Badger المال أبداً، فتحتفظ المجموعة بالحساب بينما تتم التحويلات في تطبيقاتكم المصرفية. وتوضح صفحة [تسوية الحسابات](page:feature/settle-up) كيف يتحول التشابك إلى قائمة قصيرة."
exampleAfter: 5
