meta:
  title: 房租怎么按房间大小分摊 | Side Badger
  description: 房间越大，份额越大。先划出公共空间，其余按面积分，百分比只需录入一次。以三位室友为例，算式全程展示。
h1: 房租怎么按房间大小分摊
navLabel: 按房间大小分房租
lead: 先定下房租里有多少是用来付公共空间的，这部分平均分；其余的按各人卧室面积分。取整成整数百分比，在 Side Badger 的房租支出里录入一次，之后每个月复制就行。
cta:
  heading: 把房租一次录好
  body: 创建免费账户，为这套房子建一个群组，按你们谈好的百分比录入房租。下个月只需复制。想先看看全貌？请见[使用方式](page:how-it-works)或[免费版包含什么](page:pricing)。
sections:
  - heading: 三个人，一套房，一场争论
    body: Priya、Tom 和 Aisha 合租一套房，每月房租 £1,950。整整一年，他们都是三人平分，因为省事。后来 Aisha 量了量自己的卧室。Priya 的房间 16 m²，Tom 的 12 m²，Aisha 的 10 m²，也就是说，Aisha 付的钱和 Priya 一样，房间却小了三分之一还多。谁也没有不讲理，只是谁也没算过这笔账。一顿外卖的工夫，他们先定了一条规矩：房租的 40% 用来付厨房、卫生间和客厅，这些是三个人都在用的。
  - heading: 方法，算式全展示
    body: 四个步骤，一把卷尺，一个手机计算器。
    items:
      - "**划出公共部分。**由群组商定房租中有多少份额用于大家共用的空间。这套房定为 40%，三个人各占 13.33%。"
      - "**其余按面积分。**另外 60% 按卧室大小分。三间卧室合计 38 m²（16 + 12 + 10），所以 Priya 这部分是 60% × 16/38，即 25.26%。"
      - "**两部分相加。**Priya：25.26% + 13.33% = 38.6%。Tom：60% × 12/38 = 18.95%，加上 13.33% 是 32.3%。Aisha：60% × 10/38 = 15.79%，加上 13.33% 是 29.1%。"
      - "**取整并核对。**整数百分比更好输入，也更好商量，所以 38.6% 记为 39%，32.3% 记为 32%，29.1% 记为 29%。核对一下 39 + 32 + 29 是不是 100。如果取整后变成了 99 或 101，就由群组商定调整谁的那一个百分点。"
  - heading: 看看这套房这个月的账
    body: 房租按 39%、32% 和 29% 分，各是 £760.50、£624.00 和 £565.50。房租是 Priya 付给房东的，所以这个月她可收 £1,142.50，Tom 欠 £566.00，Aisha 欠 £576.50。Side Badger 建议两笔付款，都付给 Priya。
  - heading: 在 Side Badger 里设置
    body: 一个晚上就够，大部分时间都花在讨论那个 40% 上。
    items:
      - "**建群组。**在仪表盘上选择**创建群组**，用这套房的名字命名。选择**邀请他人**，把链接或二维码发出去。每个人登录或创建免费账户，并选择自己在这个群组里想显示的名字。"
      - "**添加房租。**选择**添加费用**。填写描述和金额，在**谁付的钱？**里选付给房东的那位。**分摊给**里保留三个人，再在**如何拆分**里选择**百分比**，输入 39、32 和 29。如果百分比加起来不是 100，表单会提示。选择**保存费用**。"
      - "**添加账单。**能源费和网费是各自独立的支出，各有各的付款人。**如何拆分**保持**平分**。"
      - "**下个月复制。**打开上个月的房租，选择**复制费用**。副本会保留付款人、金额和分摊方式，日期用今天的。如果房租变了，就改一下金额，然后选择**创建副本**。"
      - "**查看谁欠谁。**在**余额**部分就能看到。你们想怎么付就怎么付，然后在**结算**里记录这笔付款。"
  - heading: 带卫生间的房、储物间似的小房，以及有人搬走
    items:
      - "**带独立卫生间的房和储物间似的小房。**面积只是个起点。带独立卫生间的房间比同样面积没有卫生间的更值钱，而只放得下一张床和一把充满希望的椅子的小房间则没那么值钱。经大家同意后调整百分比，核对总数仍是 100，并把最终数字写在全家都看得到的地方。"
      - "**有人月中搬走。**算出每个人在那个月应付多少，那个月的房租改用**确切金额**而不是**百分比**来录入。金额加起来必须等于房租。要在对方走之前做好。只要还欠钱或还有钱没收回，谁都不能退出群组，涉及已离开成员的支出会变成只读。"
      - "**有人搬进来。**重新量一遍，按新的房间大小重算，从下一次房租起使用新的百分比。之前的月份保持原样。"
  - heading: Side Badger 在这里不做的事
    items:
      - 它不会替你量房间，也不会替你选百分比。面积和那个 40% 要由群组自己商定。
      - 它没有定期账单，所以每个月要复制上个月的房租。
      - 它从不转移资金，也不会替你付给房东。你们想怎么付就怎么付，然后记录下来。
      - 它不知道你们的租约怎么写。它只记录群组里这些人之间的账。
