meta:
  title: "Како ради Side Badger | Подела трошкова групе у пет корака"
  description: "Оснуј групу, позови људе, додај трошкове и поравнајте се. Погледај шта се дешава између „неко је платио“ и „квит смо“, уз пример корак по корак."
h1: "Како ради Side Badger"
navLabel: "Како ради"
lead: "Шта се дешава између „неко је платио“ и „квит смо“? Пет корака, никаква табела и један јазавац који је углавном за украс. Ево целог пута, од прве групе до последње забележене уплате. Детаље о било ком кораку потражи у деловима [подела трошкова](page:feature/split-expenses) и [поравнање](page:feature/settle-up)."
cta:
  heading: "Од „ја ћу платити“ до „квит смо“"
  body: "Направи бесплатан кориснички налог, оснуј групу и додај први трошак. Јазавац неће осуђивати рачун."
steps:
  - title: "Оснуј групу"
    body: "Направи по једну групу за сваку кућу, путовање или догађај, да кирија никад не заврши на истом списку као свадбени поклон. Дај јој име, изабери име под којим ће те људи видети и, ако желиш, ограничи валуте које прима. Твоја контролна табла затим на једном екрану приказује све групе и где стојиш у свакој."
    shot: S02
    shotAlt: "Дијалог за прављење групе са отвореним одељком ограничења валута"
  - title: "Позови своје људе"
    body: "Подели везу за придруживање или покажи QR код и подеси колико дуго важи, од 15 минута до 5 дана. Свако ко се придружи треба бесплатан кориснички налог и потврђену имејл адресу, а у групи може бити до 50 особа. Ако желиш да бираш ко улази, укључи одобравање и администратор ће сваку особу пустити унутра."
    shot: S03
    shotAlt: "Дијалог позивнице на картици са везом, са QR кодом и избором рока важења"
  - title: "Додај трошкове како настају"
    body: "Реци ко је платио, колико и за кога. Подели једнако, по тачним износима или по процентима и изостави свакога ко није учествовао. Додај трошак и сви га одмах виде, заједно са тим шта се променило и ко је то променио."
    shot: S05
    shotAlt: "Образац трошка са процентуалном поделом кирије према величини собе"
  - title: "Прати стања"
    body: "Side Badger води текуће стање за сваку валуту, па на први поглед видиш ко коме дугује. Уместо да све препусти развезивању мреже ситних дугова, предлаже кратак списак уплата који поравнава групу."
    shot: S10
    shotAlt: "Екран стања са поједностављеним дуговима у две валуте и укљученом опцијом Прикажи све"
  - title: "Поравнај се ван апликације, забележи у њој"
    body: "Side Badger никад не премешта новац. Платите једни другима како год желите, па забележите уплату да се стања ажурирају, а екран сваког освежи без поновног учитавања. „Поравнато“ једноставно значи да су стања нула. Нико не може напустити групу док дугује или му се дугује новац, па се онај који иде ка излазу прво поравнава."
    shot: S11
    shotAlt: "Образац уплате са дугмадима за брзо поравнање и обавештењем о делимичној уплати"
requirements:
  heading: "Шта ти треба"
  items:
    - "Бесплатан кориснички налог. Довољна је имејл адреса и лозинка, а имејл потврђујеш пре него што можеш да додаш било шта."
    - "Имати најмање 18 година."
    - "Савремен прегледач на телефону или рачунару и везу. Side Badger није апликација из продавнице и не ради ван мреже."
    - "По жељи место на почетном екрану. Продавница апликација није потребна: пријави се, па додај Side Badger на почетни екран или у док, а отвара се као апликација. Подешавања у апликацији ти показују како."
example:
  heading: "Троје пријатеља после вечери у граду"
  currency: GBP
  people:
