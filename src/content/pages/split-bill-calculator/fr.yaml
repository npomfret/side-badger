faq:
  heading: Questions
  items:
    - q: "Le calculateur est-il gratuit ?"
      a: "Oui. Gratuit. Sans publicité. Sans limite quotidienne. Il ne faut pas de compte non plus."
    - q: "Enregistre-t-il ce que je saisis ?"
      a: "Non. Rien n'est enregistré ni envoyé nulle part. Pour garder vos chiffres, utilisez « Copier le lien » et conservez le lien quelque part."
    - q: "Qui peut voir le lien que je copie ?"
      a: "Toute personne qui l'a. Les chiffres vivent dans le lien lui-même, après le #, donc ne le partagez qu'avec les personnes qui doivent les voir."
    - q: "Fait-il circuler de l'argent ?"
      a: "Non. Il calcule qui doit payer qui, et vous vous remboursez comme vous voulez. Side Badger ne touche jamais non plus à votre argent. Voir [régler les comptes](page:feature/settle-up)."
    - q: "Puis-je partager un voyage payé en deux devises ?"
      a: "Pas ici, car un calcul n'a qu'une devise. Dans un groupe, chaque devise garde son propre solde. Voir [plusieurs devises](page:feature/multiple-currencies)."
    - q: "Et si les montants ne tombent pas juste ?"
      a: "Le calculateur le signale sous la dépense et n'affiche aucun résultat tant que ce n'est pas le cas. Les montants exacts doivent égaler le total, et les pourcentages doivent faire 100."
