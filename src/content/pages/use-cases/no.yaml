meta:
  title: Side Badger for romkamerater, reiser og fester
  description: Del utgifter med romkamerater, på gruppereiser og til fester, bryllup og felles gaver. Se hva Side Badger gjør for hver type gruppe.
h1: Side Badger for din type gruppe
navLabel: Bruksområder
lead: Romkamerater, ferier, utdrikningslag. Velg ditt kaos, og se hvordan en gruppe som din holder orden.
intro: Hver gruppe deler utgifter litt forskjellig. Disse sidene følger et **realistisk scenario** fra den første utgiften til den siste registrerte betalingen, med regnestykkene vist, slik at du ser hva din egen gruppe ville ende opp med.
cta:
  heading: Fant du din type gruppe?
  body: Opprett en konto, start en gruppe og legg til den første utgiften. Det tar et par minutter.
  button: Opprett en gratis konto
cardsHeading: Velg situasjonen som ligner mest på din
sections:
  - heading: Gruppereiser
    body: Fly i pund, en villa i euro og en middag bare tre spiste. Sett gruppen til å konvertere til pund, så ender fire venner i Lisboa opp med tre betalinger, i stedet for seks når valutaene holdes adskilt. [Del utgiftene på gruppereisen](page:use-case/group-trips).
  - heading: Romkamerater
    body: Én betaler utleieren, en annen husker strømregningen, og ingen er enige om hvem som kjøpte dopapiret. Med husleien delt etter romstørrelse og de andre regningene delt likt avslutter fire romkamerater måneden med tre betalinger, alle til den som la ut for husleien. [Del husholdningsregningene med romkamerater](page:use-case/housemates).
  - heading: Fester, bryllup og felles gaver
    body: Seks personer stemmer på gaven, én kjøper den, og ikke alle bidrar med like mye. En gave på £150 delt etter nøyaktige beløp gir fem betalinger til den som kjøpte den, £120 til sammen. [Del utgiftene til et arrangement](page:use-case/events-and-celebrations).
  - heading: Par
    body: Del de kjedelige kostnadene uten å gjøre date-kvelden til en kvartalsvis økonomigjennomgang. Husleie delt 60/40 og dagligvarer delt likt går opp i én betaling mellom dere to.
  - heading: Se hvordan det fungerer først
    body: Alle eksemplene ovenfor bruker de samme stegene, fra å opprette en gruppe til å registrere betalingene. [Slik fungerer det](page:how-it-works) går gjennom dem, og [priser](page:pricing) forteller hva det koster, nemlig ingenting, uten annonser og uten daglige grenser.
faq:
  heading: Spørsmål
  items:
    - q: Må alle i gruppen ha en konto?
      a: Ja. Folk blir med via en lenke eller QR-kode og en gratis konto.
    - q: Kan Side Badger kreve inn pengene?
      a: Nei. Dere betaler slik dere vil, og registrerer så betalingen slik at saldoene stemmer.
    - q: Må jeg velge én type gruppe?
      a: Nei. Bruksområdene er eksempler, ikke innstillinger. Alle grupper har de samme funksjonene, så bruk den kombinasjonen som passer.
