meta:
  title: "تقسیم هزینه با شریک زندگی، 50/50 یا بر اساس درآمد | Side Badger"
  description: "هزینه‌های خسته‌کننده را تقسیم کنید، بی‌آنکه قرار شام تبدیل به جلسه مالی فصلی شود. 50/50، بر اساس درآمد یا هزینه‌به‌هزینه، و ببینید چه کسی به چه کسی بدهکار است. رایگان."
h1: "هزینه‌ها را به‌عنوان زوج، منصفانه تقسیم کنید"
navLabel: "زوج‌ها"
lead: "هزینه‌های خسته‌کننده را تقسیم کنید، بی‌آنکه قرار شام تبدیل به جلسه مالی فصلی شود. Side Badger یک حساب جاری برای اجاره، قبض‌ها و خرید **زوج‌هایی** نگه می‌دارد که یک خانه، یک کاناپه و خاطره‌ای مبهم از اینکه چه کسی پول اینترنت را داد با هم دارند. 50/50، بر اساس درآمد یا هزینه‌به‌هزینه تقسیمش کنید و ببینید چه کسی به چه کسی بدهکار است."
cta:
  heading: "گروهی برای دو نفر شروع کنید"
  body: "یک حساب بسازید، گروهی درست کنید و لینک دعوت را برای شریک زندگی‌تان بفرستید. غذای بیرون‌بر امشب می‌تواند اولین هزینه باشد."
scenario:
  heading: "منصفانه لازم نیست 50/50 باشد"
  body: "سام و الکس با هم در یک خانه زندگی می‌کنند. سام درآمد بیشتری دارد، پس توافق کرده‌اند که سام 60% اجاره را بدهد و الکس 40%. سام به صاحب‌خانه پرداخت می‌کند، الکس خرید می‌کند و هر دو تقریباً مطمئن‌اند که همه‌چیز برابر می‌شود. «تقریباً مطمئن» همان راهی است که یادداشتی روی گوشی کسی به اختلافی دائمی تبدیل می‌شود. پس گروهی برای خودتان دو نفر بسازید، نامی را که می‌خواهید شریک زندگی‌تان ببیند انتخاب کنید و لینک دعوت یا کد QR را برایش بفرستید. هر هزینه را وقتی پیش می‌آید اضافه کنید، بگویید چه کسی پرداخت کرد و چطور تقسیم می‌شود، و بگذارید گروه حساب را نگه دارد. برای هر تعطیلات گروه جداگانه‌ای بسازید (ببینید [سفرهای گروهی](page:use-case/group-trips))، تا بلیت پرواز از خواربار جدا بماند."
sections:
  - heading: "50/50، بر اساس درآمد، یا هزینه‌به‌هزینه"
    body: "تقسیم منصفانه‌ای که برای همه درست باشد وجود ندارد، فقط تقسیمی هست که هر دو با آن موافقید، ترجیحاً پیش از اولین صورت‌حساب نه بعد از اولین آه. این‌ها سه روش معمول‌اند."
    items:
      - "**50/50.** **به طور مساوی** را بزنید و هر کدام نصف را بدهکارید. وقتی درآمدتان نزدیک به هم است برای هزینه‌های مشترک مناسب است و اصلاً حساب لازم ندارد."
      - "**بر اساس درآمد.** اگر یکی از شما درآمد بیشتری دارد، بر اساس سهم هر نفر از پولی که وارد می‌شود تقسیم کنید. اول توافق کنید چه چیزی حساب می‌شود (حقوق خالص انتخاب رایج است)، دو درآمد را جمع کنید و سهم خودتان را بر کل تقسیم کنید. اگر حقوق خالص یکی از شما سه بخش باشد در برابر دو بخشِ دیگری، آن می‌شود 3 ÷ (3 + 2) = 60%، پس یکی 60% را می‌پردازد و دیگری 40% را. به درصدهای صحیح گرد کنید و آن‌ها را زیر **درصد** وارد کنید، جایی که باید جمعشان 100 شود. جایی برای وارد کردن حقوق نیست، پس همیشه فقط درصدها را تایپ می‌کنید."
      - "**هزینه‌به‌هزینه.** هر هزینه تقسیم خودش را دارد، پس می‌توانید ترکیب کنید: اجاره بر اساس درآمد، خواربار 50/50، و یک کادوی مشترک با **مبالغ دقیق** اگر هر کدام خودتان انتخاب کرده‌اید چقدر بگذارید."
      - "**وقتی حقوق عوض می‌شود،** از هزینه بعدی درصدهای جدید را به کار ببرید. هزینه‌های قبلی همان تقسیمی را نگه می‌دارند که با آن وارد شده‌اند. برای دیدن محاسبه با فیش حقوقی واقعی، [چطور صورت‌حساب‌ها را با شریک زندگی‌ای که درآمد بیشتری دارد تقسیم کنیم](page:guide/how-to-split-bills-with-a-partner-who-earns-more) را بخوانید."
  - heading: "جمع‌بندی ماهانه"
    body: "ماهی یک بار، یا هر وقت اعداد شروع به خارش کردند، گروه را باز کنید و **موجودی‌ها** را ببینید. وقتی دو نفرید، در هر ارز فقط یک پرداخت هست، از کسی که بدهکار است به کسی که طلبکار است. ماه سام و الکس را مثال بزنیم. سام اجاره £1,500 را پرداخت، و 40% الکس از آن £600 است. الکس £90 خواربار پرداخت، که مساوی تقسیم شده، پس نصف سام £45 است. Side Badger یکی را با دیگری خنثی می‌کند، £600 منهای £45، و الکس £555 به سام می‌پردازد. هر طور دوست دارید پرداخت کنید، با انتقال بانکی، نقدی یا با لطفی که به هم بدهکارید، بعد زیر **تسویه حساب** ثبتش کنید تا مانده به صفر برگردد. صورت‌حساب تکراری وجود ندارد، پس اجاره ماه قبل را کپی کنید، تاریخ را عوض کنید و ادامه دهید. Side Badger پول را جابه‌جا نمی‌کند و یادآوری نمی‌فرستد، پس تلنگر هنوز با شماست."
  - heading: "فقط شما دو نفر"
    body: "گروه دو نفره دو عضو دارد و فقط اعضای یک گروه می‌توانند آن را ببینند. شریک زندگی‌تان با لینک دعوت یا کد QR می‌پیوندد. یک لینک می‌تواند از 15 دقیقه تا 5 روز اعتبار داشته باشد، پس کوتاه‌ترینی را انتخاب کنید که به شریک زندگی‌تان وقت می‌دهد از آن استفاده کند. ساختن لینک جدید لینک‌های قبلی را لغو نمی‌کند، پس آن‌ها را در گپی که دیگران هم در آن هستند رها نکنید. هر که از لینک زنده استفاده کند می‌تواند بپیوندد، پس اگر می‌خواهید مطمئن باشید، تأیید را روشن کنید تا یک مدیر هر نفر را راه بدهد. شریک زندگی‌تان حسابی مخصوص خودش لازم دارد، که رایگان است."
