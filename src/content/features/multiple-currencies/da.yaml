meta:
  title: Del udgifter i 140 valutaer, omregnet eller holdt adskilt
  description: Indtast hver udgift i den valuta, du betalte i, hold saldiene adskilt eller omregn med en kurs, du kan se og ændre, og gør så op med en kort liste over betalinger.
h1: Del udgifter i 140 valutaer
navLabel: Flere valutaer
lead: Euro, yen og den ene taxa i baht. Side Badger tager hver udgift i den valuta, du betalte i, holder styr på saldiene og kan omregne, når gruppen hellere vil gøre op én gang. Den virker i 140 valutaer og passer naturligt til [gruppeture](page:use-case/group-trips).
cta:
  heading: Tag dine euro med, tag dine yen med
  body: Opret en konto, start en gruppe, og tilføj den første udgift i den valuta, du tilfældigvis havde ved hånden.
  button: Opret en gratis konto
problem:
  heading: Indtast den, som du betalte den
  body: En tur betales sjældent i kun én valuta. Hotellet blev booket hjemme i pund, middagen blev betalt i yen, og kaffen i lufthavnen i det, der nu gjaldt på mellemlandingen. At omregne alt i hånden, før man overhovedet kan skrive det ind, er sådan, regneark bliver opgivet. I Side Badger indtaster du hver udgift i den valuta, der står på kvitteringen, og hvert beløb følger sin valutas regler, så yen har ingen decimaler, og dinarer har tre. Dine senest brugte valutaer står først på listen.
workflow:
  heading: Hold valutaerne adskilt, eller omregn undervejs
  steps:
    - title: Tilføj udgiften i dens egen valuta
      body: Vælg valutaen, skriv beløbet, og sig, hvem der betalte, og hvem der var med til at dele. Mere skal der ikke til. Det er standarden, og den bevarer det oprindelige beløb præcis, som du indtastede det.
      shot: S07
      shotAlt: Udgiftsformularen med et beløb i yen indtastet
    - title: Følg en saldo for hver valuta
      body: Saldi føres adskilt pr. valuta, og hver af dem får sin egen korte liste over foreslåede betalinger. Pund gøres op i pund og yen i yen.
      shot: S10
      shotAlt: Saldoskærmen med forenklet gæld i to valutaer
    - title: Eller omregn, når gruppen hellere vil gøre op én gang
      body: Vælg en anden valuta, mens du indtaster udgiften, så kan Side Badger omregne den med en aktuel valutakurs, som du kan ændre til den kurs, du faktisk fik. Det omregnede beløb indgår i saldoen i den valuta. Omregning er et valg, gruppen træffer, aldrig noget, der sker bag din ryg.
options:
  heading: En kurs, du kan se og ændre
  items:
    - title: Kursen vises
      body: Når du omregner, vises kursen og det omregnede beløb i formularen, så ingen behøver at tage et tal på tro og love.
    - title: Skriv din egen
      body: Fik du en bedre kurs ved en vekselbod eller en dårligere i en lufthavn? Ret kursen til den, du faktisk fik, så opdateres det omregnede beløb.
    - title: Originalen bliver
      body: Det oprindelige beløb bliver stående på udgiften ved siden af det omregnede, til dem, der spørger, hvad det var i yen.
    - title: Gratis at omregne
      body: Omregning koster ingenting. Der er intet gebyr for at indtaste en udgift i en anden valuta.
