featuresHeading: "Eiginleikarnir sem par notar"
faq:
  heading: "Spurningar"
  items:
    - q: "Getum við stillt 60/40 einu sinni fyrir allt?"
      a: "Nei. Skiptingin tilheyrir hverju útgjaldi. Settu prósenturnar á það fyrsta, afritaðu það svo næst og breyttu því sem er öðruvísi. [Skipting útgjalda](page:feature/split-expenses) fjallar um allar þrjár leiðirnar til að skipta."
    - q: "Tengist það bankanum okkar?"
      a: "Nei. Side Badger snertir aldrei peningana þína. Þið borgið hvort öðru eins og ykkur hentar og skráið það svo, eins og [uppgjör](page:feature/settle-up) útskýrir."
    - q: "Getur einhver annar séð hópinn okkar?"
      a: "Aðeins meðlimir hans, og hópur fyrir tvö hefur tvo. Hver sem notar tengil sem enn gildir getur gengið í hópinn, svo deildu honum með einni manneskju og hafðu gildistímann stuttan."
    - q: "Hvað ef við greiddum sitt hvorn hluta sama reiknings?"
      a: "Útgjald hefur einn greiðanda. Skráðu tvö útgjöld, eitt fyrir hvort ykkar, og staðan verður sú sama."
    - q: "Minnir það makann minn á að borga?"
      a: "Nei. Það eru engar áminningar, svo að ýta við makanum er áfram á þinni könnu. Að minnsta kosti horfið þið þá bæði á sömu töluna."
    - q: "Hvað gerist þegar við hættum að deila kostnaði?"
      a: "Gerið upp stöðuna og skráið greiðsluna, svo enginn skuldi neitt. Þá getur stjórnandi læst hópnum, sem heldur tölunum eins og þær eru, eða lokað honum fyrir fullt og allt, sem gerir hann óaðgengilegan öllum. Lokið honum aðeins þegar hvorugt ykkar þarf á sögunni að halda."
