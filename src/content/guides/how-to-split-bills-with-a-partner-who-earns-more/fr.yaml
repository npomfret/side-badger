faq:
  heading: Questions
  items:
    - q: "Faut-il prendre le salaire brut ou net ?"
      a: "C'est au groupe de décider. Le net est courant, parce que c'est l'argent dont vous disposez vraiment. Le brut ignore que les impôts, les cotisations de retraite et les remboursements de prêts prélèvent des montants différents sur des salaires différents. Quel que soit votre choix, utilisez la même mesure pour vous deux."
    - q: "Side Badger voit-il nos revenus ?"
      a: "Non. Vous ne saisissez que des pourcentages, jamais des salaires. Les pourcentages sont visibles pour les membres du groupe, et pour un couple, c'est vous deux."
    - q: "Peut-on fixer 62/38 une fois pour tout ?"
      a: "Le partage se définit par dépense, pas par groupe. Copiez une dépense qui a déjà 62 et 38, puis changez ce qui diffère. [Partager les dépenses](page:feature/split-expenses) présente les autres options."
