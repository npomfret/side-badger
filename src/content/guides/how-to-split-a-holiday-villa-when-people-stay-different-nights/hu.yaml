faq:
  heading: "Kérdések a villáról"
  items:
    - q: "Mi van, ha valaki lemondja a részvételét?"
      a: "Vedd ki az ő éjszakáit, számolj újra, és szerkeszd a villa költségét, hogy a pontos összegek újra kiadják az árat. A korábbi változat megmarad, a szerkesztés pedig megjelenik a csoport tevékenységében, így senki nem változtat meg egy számot csendben. Hogy ki szerkeszthet, a csoport jogosultságaitól függ."
    - q: "Fizessen kevesebbet, aki lefoglalta?"
      a: "Ezt a csoport dönti el. A foglalás fáradságos teendő, és a csoportok különböznek abban, hogy jár-e érte kedvezmény. Bármiben egyeztek meg, tegyétek bele a pontos összegekbe, és írjátok le egy megjegyzésbe a költségnél, vagy egy kommentbe mellette, hogy senkinek ne kelljen emlékeznie az alkura."
    - q: "Oszthatjuk másképp a takarítási díjat?"
      a: "Igen. Vidd be a díjat külön költségként, és adj neki saját felosztást. Az egyenlő felosztás az egész házra szóló átalánydíjhoz illik. A pontos összegek annak a csoportnak valók, amely azt szeretné, hogy a díj is kövesse az éjszakákat."
