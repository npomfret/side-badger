faq:
  heading: Mga tanong
  items:
    - q: Alin ang mas patas, laki ng kuwarto o kita?
      a: Walang laging mas patas sa dalawa. Bagay ang laki ng kuwarto sa mga housemate na nagbabayad para sa espasyong tinutulugan nila. Bagay ang kita sa magkapareha at magkakaibigang malaki ang agwat ng sahod. Pagkasunduan ito bago ang unang araw ng upa, hindi pagkatapos.
    - q: Dapat bang ganoon din ang paghahati ng mga bayarin?
      a: Para sa mga housemate, kadalasan ay hindi. Ginagamit ng lahat ang kuryente at broadband, kaya mas simple ang pantay, gaya sa halimbawa. Kapag ayon sa kita, binibigyan ng calculator ang mga bayarin ng parehong bahagi tulad ng sa upa.
    - q: Puwede ba ang square feet?
      a: Oo. Piliin ang ft² at i-type ang mga sukat sa square feet. Label lang ang yunit, at pareho ang lalabas na bahagi basta iisang yunit ang gamit ng lahat.
    - q: Libre ba ang calculator?
      a: Oo. Libre. Walang ad. Walang pang-araw-araw na limitasyon. Hindi mo rin kailangan ng account.
