faq:
  heading: "Cwestiynau"
  items:
    - q: "Ydy'r gwas priodas neu'r brif forwyn briodas yn talu mwy?"
      a: "Dim ond os yw'r grŵp yn cytuno. Dyw'r ap ddim yn rhoi rôl arbennig i neb yn y symiau. Os yw rhywun yn talu mwy, dewiswch **Union symiau** neu **Canran** o dan **Sut i rannu** a rhowch y cyfrannau y cytunoch arnynt."
    - q: "Beth am ddiodydd nad oedd rhai pobl wedi'u cael?"
      a: "Ychwanegwch y diodydd fel cost ar wahân a ticiwch dim ond y bobl a'u cafodd. Os cafodd pawb swm gwahanol, dewiswch **Union symiau** a theipiwch gyfran pob person. Does neb yn talu am yr hyn na chafodd."
    - q: "All y gwestai anrhydedd weld y grŵp yn nes ymlaen?"
      a: "Gall, unwaith y bydd y syrpréis drosodd. Gwahoddwch nhw, yna gall gweinyddwr eu gwneud yn **Gwyliwr** o dan **Diogelwch a Chaniatâd** yng ngosodiadau'r grŵp. Mae gwyliwr yn gweld popeth ac nid yw'n newid dim, felly arhoswch nes nad oes dim yn gyfrinach. Mae angen cyfrif am ddim arnynt i ymuno."
