meta:
  title: "Bayarin ng magkapareha: 50/50 o ayon sa kita | Side Badger"
  description: "Hatiin ang nakakabagot na gastos nang hindi ginagawang quarterly finance review ang date night. 50/50, ayon sa kita, o bayarin kada bayarin. Libre."
h1: "Maghati ng gastos bilang magkapareha, nang patas"
navLabel: "Magkapareha"
lead: "Hatiin ang mga nakakabagot na gastos nang hindi ginagawang quarterly finance review ang date night. Nagtatabi ang Side Badger ng iisang tumatakbong bilang ng upa, bayarin, at pamimili para sa **magkapareha** na may iisang bahay, iisang sofa, at malabong alaala kung sino ang nagbayad ng broadband. Hatiin ito nang 50/50, ayon sa kita, o bayarin kada bayarin, at tingnan kung sino ang may utang kanino."
cta:
  heading: "Magsimula ng grupo para sa dalawa"
  body: "Gumawa ng account, gumawa ng grupo, at ipadala sa partner mo ang invite link. Puwedeng ang takeout ngayong gabi ang unang gastos."
scenario:
  heading: "Hindi kailangang 50/50 para maging patas"
  body: "Magkasama sa bahay sina Sam at Alex. Mas malaki ang kita ni Sam, kaya napagkasunduan nilang 60% ng upa ang kay Sam at 40% ang kay Alex. Si Sam ang nagbabayad sa landlord, si Alex ang namimili, at pareho silang medyo sigurado na nagtatabla ang lahat sa huli. Ang “medyo sigurado” ang dahilan kung bakit nagiging matagal na tampuhan ang isang tala sa phone ng isang tao. Kaya gumawa ng grupo para sa inyong dalawa, piliin ang pangalang gusto mong makita ng partner mo, at ipadala sa kanya ang invite link o QR code. Idagdag ang bawat gastos kapag nangyari, sabihin kung sino ang nagbayad at paano ito hinati, at hayaang ang grupo ang magtala ng bilang. Gumawa ng hiwalay na grupo para sa bawat bakasyon (tingnan ang [group trip](page:use-case/group-trips)), para hindi mapasama ang mga flight sa grocery."
sections:
  - heading: "50/50, ayon sa kita, o bayarin kada bayarin"
    body: "Walang unibersal na patas na hati, tanging ang hating pareho ninyong sinang-ayunan, mas mabuti bago ang unang bayarin kaysa pagkatapos ng unang buntong-hininga. Ito ang karaniwang tatlo."
    items:
      - "**50/50.** Piliin ang **Pantay** at kalahati ang utang ng bawat isa sa inyo. Bagay ito sa mga pinagsasaluhang gastos kapag magkalapit ang kita ninyo, at hindi na kailangan ng kahit anong aritmetika."
      - "**Ayon sa kita.** Kung mas malaki ang kita ng isa sa inyo, hatiin ayon sa bahagi ng bawat isa sa perang pumapasok. Pagkasunduan muna kung ano ang bibilangin (take-home pay ang karaniwang pinipili), pagsamahin ang dalawa, at hatiin ang sa iyo sa kabuuan. Kung tatlong bahagi ang take-home ng isa at dalawa ang sa isa pa, 3 ÷ (3 + 2) = 60%, kaya 60% ang sasagutin ng isa at 40% ang isa pa. I-round sa buong porsyento at ilagay ang mga ito sa **Porsyento**, kung saan dapat umabot sa 100 ang kabuuan. Walang lugar para ilagay ang sahod mo, kaya mga porsyento lang ang tina-type mo."
      - "**Bayarin kada bayarin.** May sariling hati ang bawat gastos, kaya puwede kayong maghalo: upa ayon sa kita, grocery nang 50/50, at pinagsamang regalo gamit ang **Eksaktong halaga** kung bawat isa sa inyo ay pumili ng ilalagay."
      - "**Kapag nagbago ang sahod,** gamitin ang bagong porsyento mula sa susunod na gastos. Nananatili sa mga naunang gastos ang hating inilagay noon. Para makita ang mga kuwenta gamit ang totoong payslip, basahin ang [paano maghati ng bayarin kasama ang partner na mas malaki ang kita](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "Ang buwanang round-up"
    body: "Isang beses kada buwan, o kapag nangangati na ang mga numero, buksan ang grupo at tingnan ang **Mga Balanse**. Kapag dalawa kayo, laging isang bayad lang sa bawat pera, mula sa may utang papunta sa may sisingilin. Halimbawa, ang buwan nina Sam at Alex. Nagbayad si Sam ng £1,500 na upa, at £600 ang 40% ni Alex dito. Nagbayad si Alex ng £90 para sa grocery, hinati nang pantay, kaya £45 ang kalahati ni Sam. Pinagtatapat ng Side Badger ang dalawa, £600 bawas £45, at magbabayad si Alex kay Sam ng £555. Magbayaran kayo sa paraang gusto ninyo, bank transfer, cash, o utang na loob, saka itala ito sa **Magbayad** para bumalik sa zero ang balanse. Walang umuulit na bayarin, kaya kopyahin ang upa noong nakaraang buwan, palitan ang petsa, at tuloy. Hindi inililipat ng Side Badger ang pera at hindi ito nagpapadala ng paalala, kaya sa inyo pa rin ang pagsundot."
  - heading: "Kayong dalawa lang"
    body: "Dalawang miyembro ang grupo ng dalawa, at mga miyembro lang ng grupo ang nakakakita nito. Sasali ang partner mo gamit ang invite link o QR code. Maaaring tumagal ang link mula 15 minuto hanggang 5 araw, kaya piliin ang pinakamaikling may sapat na oras para magamit ito ng partner mo. Hindi kinakansela ng paggawa ng bagong link ang mga luma, kaya huwag iwan ang mga ito sa chat na may ibang kasama. Makakasali ang sinumang gumamit ng link na hindi pa nag-e-expire, kaya kung gusto mong makasigurado, i-on ang pag-apruba at papapasukin ng admin ang bawat tao. Kailangan ng partner mo ng sarili niyang account, na libre."
