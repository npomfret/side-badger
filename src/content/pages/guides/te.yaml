meta:
  title: "ఖర్చులను న్యాయంగా పంచే గైడ్‌లు | Side Badger"
  description: "అద్దె, హాలిడే విల్లాలు, గ్రూప్ ఖర్చులను న్యాయంగా పంచడానికి ఆచరణాత్మక గైడ్‌లు, ప్రతిదీ వాస్తవికంగా ఉండే గ్రూప్‌తో, లెక్కలతో సహా వివరించబడింది."
h1: "ఖర్చులను న్యాయంగా పంచే గైడ్‌లు"
navLabel: "గైడ్‌లు"
lead: "స్ప్రెడ్‌షీట్ తెరిచే ముందు జనం అడిగే ప్రశ్నలకు, నిజమైనట్టే ఉండే గ్రూప్‌తో, లెక్కలతో, యాప్‌లోని దశలతో సమాధానాలు."
intro: "ప్రతి గైడ్ **ఒక కల్పిత గ్రూప్‌ను** మొదటి ఖర్చు నుండి చివరి రికార్డ్ చేసిన పేమెంట్ వరకు అనుసరిస్తుంది. అంకెలు మీ కోసం లెక్కించబడ్డాయి, దశలు యాప్ పేరు పెట్టిన స్క్రీన్‌లనే వాడతాయి."
cta:
  heading: "మీ దగ్గర ఇలాంటి గ్రూప్ ఉందా?"
  body: "ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి ఖర్చును జోడించండి. లెక్కలు మీ కోసం పూర్తవుతాయి."
cardsHeading: "మీ ప్రశ్నను ఎంచుకోండి"
