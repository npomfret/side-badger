featuresHeading: "Funkcijas, ko izmanto māja"
faq:
  heading: "Jautājumi"
  items:
    - q: "Vai īre var atkārtoties automātiski?"
      a: "Nē, atkārtotu rēķinu nav. Nokopējiet pagājušā mēneša īri pāris pieskārienos, nomainiet datumu, un viss."
    - q: "Vai varam sadalīt pēc istabas lieluma?"
      a: "Jā, procentuāli. Dodiet katram mājokļa biedram daļu, kas atspoguļo viņa istabu, ja vien daļas kopā dod 100. [Izdevumu sadale](page:feature/split-expenses) apraksta citus sadales veidus."
    - q: "Ko darīt, ja mājokļa biedrs izvācas, būdams parādā?"
      a: "Viņš nevar pamest grupu, kamēr nav norēķinājies, jo neviens nevar aiziet, kamēr viņam kāds ir parādā vai viņš ir parādā. Skaitļi paliek godīgi, līdz visi ir kvit."
    - q: "Vai Side Badger maksā rēķinus?"
      a: "Nē. Tas uztur uzskaiti un iesaka īsu maksājumu sarakstu. Jūs samaksājat viens otram, kā vēlaties, tad to reģistrējat, kā skaidro [norēķināšanās](page:feature/settle-up)."
    - q: "Vai viens mājokļa biedrs var turēt grāmatvedību?"
      a: "Jā. Padariet viņu par administratoru un izmantojiet pārvaldītu grupu, kur jaunajiem dalībniekiem vajag apstiprinājumu un izdevumus var mainīt tikai veidotāji un administratori."
