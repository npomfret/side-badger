meta:
  title: "Jinsi ya kumaliza hesabu baada ya safari ya kikundi | Side Badger"
  description: "Maliza kabla kila mtu hajatawanyika. Madeni kumi yaliyochanganyika yanakuwa malipo manne, yakirekodiwa yanapofika, na malipo ya sehemu yanafaa. Hesabu za marafiki watano."
h1: "Jinsi ya kumaliza hesabu baada ya safari ya kikundi"
navLabel: "Maliza hesabu baada ya safari"
lead: "Maliza kabla kila mtu hajatawanyika. Ongeza gharama ya mwisho, fungua salio la kikundi na ulipe unachodaiwa kutoka kwenye orodha fupi, mtakavyo. Kisha rekodi kila malipo kwenye Side Badger ili salio lifutike kwa kikundi kizima. Kwa marafiki watano na gharama tano, madeni kumi yaliyochanganyika yanashuka hadi malipo manne."
cta:
  heading: "Funga vitabu kabla picha hazijafika"
  body: "Fungua akaunti ya bure, anzisha kikundi cha safari ijayo na ongeza kila gharama inapotokea. Orodha fupi ya malipo inakusubiri ukifika uwanja wa ndege. Unataka kuona kwanza [jinsi kumaliza hesabu kunavyofanya kazi](page:feature/settle-up)?"
sections:
  - heading: "Marafiki watano, gharama tano, ukumbi mmoja wa kuondokea"
    body: "Mo, Ines, Raf, Tess na Uma walitumia wiki moja pwani. Mo alihifadhi nyumba na kununua vyakula, Ines alilipia safari ya mashua na Raf alilipia chakula kikubwa cha jioni. Tess alichukua teksi ya uwanja wa ndege na Uma na Mo, kwa sababu Ines na Raf walikuwa na treni. Kadi ya Uma ilibaki nyumbani, kwa hivyo hakulipia chochote. Hizo ni gharama tano na €1,700 kwa jumla, na kwenye ukumbi wa kuondokea hakuna aliyeweza kusema nani alikuwa mbele."
  - heading: "Madeni kumi, malipo manne"
    body: "Nyumba, mashua, chakula cha jioni na vyakula vinagawanywa sawa kwa watano. Hiyo ni €200, €50, €60 na €18 kila mmoja, kwa hivyo Ines na Raf kila mmoja anadaiwa €328. Teksi inagawanywa kwa watatu kwa €20 kila mmoja, kwa hivyo Mo, Tess na Uma wanadaiwa €348. Mo alilipa €1,090 na anadaiwa €348, ambayo inamwacha akidai €742. Kila mtu mwingine alilipa chini ya anachodaiwa. Uma ana upungufu wa €348, Tess €288, Ines €78 na Raf €28, na hizo zinajumlisha €742 za Mo. Maliza kila jozi ya watu moja kwa moja na unapata madeni kumi tofauti. Side Badger inapendekeza malipo manne badala yake, yote kwa Mo."
  - heading: "Maliza kabla kila mtu hajatawanyika"
    body: "Wakati bora ni jioni ya mwisho au safari ya kurudi, kila mtu akiwa bado mahali pamoja na deni la €28 ni rahisi kulitaja. Ongeza kwanza kila gharama, teksi ikiwemo. Hakuna anayeweza kuondoka kwenye kikundi akiwa anadaiwa au anadai pesa, kwa hivyo hesabu lazima ifungwe wakati fulani vyovyote vile."
    items:
      - "**Angalia orodha.** Fungua kikundi na uangalie **Salio**. Kwa chaguomsingi unaona madeni yanayokuhusu. Chagua **Onyesha yote** kuona orodha ya kikundi kizima."
      - "**Lipa upendavyo.** Uhamisho wa benki, taslimu, fadhila iliyobaki kutoka likizo iliyopita. Side Badger haihamishi pesa."
      - "**Irekodi.** Chagua **Lipa deni**. Chini ya **Lipa haraka** kila kitufe ni moja ya malipo yako yaliyopendekezwa, na kuchagua kimoja kunajaza kiasi. Ongeza **Kumbuka** kama uhamisho wa benki, hakiki **Tarehe** (haiwezi kuwa ya baadaye) na uchague **Rekodi Malipo**."
      - "**Tazama likifutika.** Salio linasasishwa kwa kila mtu. Malipo ya mwisho yakiingia, **Salio** linasomeka **Kila mtu amelipa!**"
  - heading: "Kulipa sehemu sasa, iliyobaki baadaye"
    body: "Uma anaweza kutuma €200 usiku huu na zilizobaki mwisho wa mwezi. Anarekodi €200, na fomu inamwonya kwamba bado atadaiwa €148 na Mo baadaye, yaani €348 kasoro €200. Ukihifadhi, €148 zinabaki kwenye salio lake hadi atakaporekodi zilizobaki. Onyo linafanya kazi upande mwingine pia. Sifuri ya ziada ikigeuza €348 kuwa €3,480, fomu inasema anadaiwa tu €348 na Mo na kwamba kuhifadhi kungeunda deni upande wa pili. Rekebisha sifuri kabla ya kuhifadhi."
  - heading: "Kurekebisha makosa, na kushangilia malipo"
    items:
      - "**Malipo mabaya.** Aliyerekodi malipo pekee ndiye anayeweza kuyahariri. Yeye au msimamizi wa kikundi anaweza kuyafuta, kisha yanaweza kurekodiwa tena."
      - "**Malipo yanayostahili kutambuliwa.** Kila malipo yaliyorekodiwa yanakaa chini ya **Malipo** pamoja na tarehe na kumbukumbu yake, ambapo kila mtu kwenye kikundi anaweza kuyaona na kuguswa nayo. Mo anaweza kuchagua **Sherehekea** €148 za mwisho za Uma zikifika."
      - "**Mwisho.** Kila salio likiwa sifuri, msimamizi anaweza kufunga kikundi ili nambari zibaki palepale."
  - heading: "Kile ambacho Side Badger haifanyi hapa"
    items:
      - "Haihamishi pesa kamwe. Haina viungo vya malipo wala maombi ya malipo, kwa hivyo malipo kwenye programu ni rekodi ya malipo yaliyofanywa mahali pengine."
      - "Haitumi vikumbusho. Kufukuzia malipo yaliyochelewa bado ni kazi yako."
      - "Haiwekei tarehe za mwisho. €148 zilizobaki za Uma zinatakiwa lini ni kwa kikundi kukubaliana."
      - "Malipo yanayopendekezwa ni orodha fupi, si ahadi ya fupi kuliko zote inayowezekana. Yanahesabiwa kwa kila sarafu, kwa hivyo safari iliyolipwa kwa euro na pauni inapata orodha kwa kila moja."
