meta:
  title: "گروپ سفر کے بعد حساب کیسے برابر کریں | Side Badger"
  description: "سب کے بکھرنے سے پہلے حساب برابر کریں۔ دس الجھے قرض چار ادائیگیاں بن جاتے ہیں، جیسے جیسے پہنچیں ریکارڈ ہوتی ہیں، اور جزوی ادائیگی بھی ٹھیک ہے۔ پانچ دوستوں کا حساب۔"
h1: "گروپ سفر کے بعد حساب کیسے برابر کریں"
navLabel: "سفر کے بعد حساب برابر کریں"
lead: "سب کے بکھرنے سے پہلے حساب برابر کریں۔ آخری خرچہ شامل کریں، گروپ کے بیلنس کھولیں اور مختصر فہرست سے جو آپ کے ذمے ہے جیسے چاہیں ادا کریں۔ پھر ہر ادائیگی Side Badger میں ریکارڈ کریں تاکہ پورے گروپ کا بیلنس صاف ہو جائے۔ پانچ دوستوں اور پانچ اخراجات کے دس الجھے قرض چار ادائیگیوں میں سمٹ جاتے ہیں۔"
cta:
  heading: "تصویریں آنے سے پہلے کھاتا بند کریں"
  body: "مفت اکاؤنٹ بنائیں، اگلے سفر کے لیے گروپ شروع کریں اور ہر خرچہ ہوتے ہی شامل کریں۔ ایئرپورٹ پہنچنے تک ادائیگیوں کی مختصر فہرست تیار ہوتی ہے۔ پہلے دیکھنا ہے کہ [حساب برابر کرنا کیسے کام کرتا ہے](page:feature/settle-up)؟"
sections:
  - heading: "پانچ دوست، پانچ اخراجات، ایک ڈیپارچر لاؤنج"
    body: "مو، اینیس، رف، ٹیس اور اوما نے ساحل پر ایک ہفتہ گزارا۔ مو نے اپارٹمنٹ بک کیا اور گروسری خریدی، اینیس نے کشتی کی سیر کا بل دیا اور رف نے بڑا ڈنر اٹھایا۔ ٹیس نے ایئرپورٹ ٹیکسی اوما اور مو کے ساتھ لی، کیونکہ اینیس اور رف ٹرین سے گئے۔ اوما کا کارڈ گھر رہ گیا تھا، اس لیے اس نے کسی چیز کی ادائیگی نہیں کی۔ یوں پانچ اخراجات ہوئے، کل €1,700، اور ڈیپارچر لاؤنج میں کوئی نہیں بتا سکتا تھا کہ کون آگے ہے۔"
  - heading: "دس قرض، چار ادائیگیاں"
    body: "اپارٹمنٹ، کشتی، ڈنر اور گروسری پانچوں میں برابر بٹتے ہیں۔ یعنی فی کس €200، €50، €60 اور €18، اس لیے اینیس اور رف دونوں پر €328 واجب ہیں۔ ٹیکسی تین میں بٹی ہے، €20 فی کس، اس لیے مو، ٹیس اور اوما پر €348 واجب ہیں۔ مو نے €1,090 دیے اور اس پر €348 واجب ہیں، یوں اسے €742 ملنے ہیں۔ باقی سب نے اپنے واجب سے کم ادا کیا۔ اوما €348 پیچھے ہے، ٹیس €288، اینیس €78 اور رف €28، اور یہ مل کر مو کے €742 بنتے ہیں۔ ہر جوڑی کا آپس میں براہ راست حساب کریں تو دس الگ قرض بنتے ہیں۔ Side Badger اس کی جگہ چار ادائیگیاں تجویز کرتا ہے، سب مو کو۔"
  - heading: "سب کے بکھرنے سے پہلے حساب برابر کریں"
    body: "بہترین موقع آخری شام یا گھر کی سواری ہے، جب سب ایک جگہ ہوں اور €28 کے قرض کا ذکر کرنا آسان ہو۔ پہلے ہر خرچہ شامل کریں، ٹیکسی سمیت۔ جب تک کسی کو دینا یا لینا ہو وہ گروپ نہیں چھوڑ سکتا، اس لیے گنتی کو کبھی نہ کبھی بند ہونا ہی ہے۔"
    items:
      - "**فہرست دیکھیں۔** گروپ کھولیں اور **بیلنسز** دیکھیں۔ ڈیفالٹ میں آپ کو وہ قرض نظر آتے ہیں جن کا آپ سے تعلق ہے۔ پورے گروپ کی فہرست دیکھنے کے لیے **سب دکھائیں** چنیں۔"
      - "**جیسے چاہیں ادا کریں۔** بینک ٹرانسفر، نقد، پچھلی چھٹیوں کا کوئی احسان۔ Side Badger رقم نہیں منتقل کرتا۔"
      - "**ریکارڈ کریں۔** **تصفیہ کریں** چنیں۔ **فوری تصفیہ** کے نیچے ہر بٹن آپ کی تجویز کردہ ایک ادائیگی ہے، اور اسے چننے سے رقم بھر جاتی ہے۔ **نوٹ** میں «بینک ٹرانسفر» جیسا کچھ لکھیں، **تاریخ** دیکھ لیں (وہ مستقبل کی نہیں ہو سکتی) اور **تصفیہ ریکارڈ کریں** چنیں۔"
      - "**اسے صاف ہوتا دیکھیں۔** بیلنس سب کے لیے اپ ڈیٹ ہو جاتا ہے۔ آخری ادائیگی آ جائے تو **بیلنسز** پر **سب حساب برابر!** لکھا آتا ہے۔"
  - heading: "کچھ ابھی، باقی بعد میں"
    body: "اوما آج رات €200 بھیج سکتی ہے اور باقی مہینے کے آخر میں۔ وہ €200 ریکارڈ کرتی ہے، اور فارم اسے خبردار کرتا ہے کہ اس کے بعد بھی مو کے €148 اس کے ذمے رہیں گے، یعنی €348 منفی €200۔ محفوظ کریں تو €148 اس کے بیلنس پر رہتے ہیں جب تک وہ باقی ریکارڈ نہ کرے۔ یہ تنبیہ دوسری طرف بھی کام کرتی ہے۔ اگر کوئی فالتو صفر €348 کو €3,480 بنا دے تو فارم بتاتا ہے کہ اس پر مو کے صرف €348 واجب ہیں اور محفوظ کرنے سے الٹی سمت میں قرض بن جائے گا۔ محفوظ کرنے سے پہلے صفر درست کریں۔"
  - heading: "غلطیاں ٹھیک کرنا، اور ادائیگیوں پر خوشی"
    items:
      - "**غلط ادائیگی۔** ادائیگی میں ترمیم صرف وہی شخص کر سکتا ہے جس نے اسے ریکارڈ کیا۔ وہ یا گروپ کا ایڈمن اسے حذف کر سکتا ہے، پھر اسے دوبارہ ریکارڈ کیا جا سکتا ہے۔"
      - "**قابل توجہ ادائیگی۔** ہر ریکارڈ شدہ ادائیگی اپنی تاریخ اور نوٹ کے ساتھ **تصفیے** کے نیچے ہوتی ہے، جہاں گروپ کا ہر فرد اسے دیکھ سکتا اور ردعمل دے سکتا ہے۔ جب اوما کے آخری €148 پہنچیں تو مو **جشن** چن سکتا ہے۔"
      - "**اختتام۔** جب ہر بیلنس صفر ہو تو ایڈمن گروپ مقفل کر سکتا ہے تاکہ اعداد اپنی جگہ رہیں۔"
  - heading: "یہاں Side Badger کیا نہیں کرتا"
    items:
      - "یہ کبھی پیسے نہیں بھیجتا۔ اس میں ادائیگی کے لنک ہیں نہ ادائیگی کی درخواستیں، اس لیے ایپ میں ادائیگی کہیں اور کی گئی ادائیگی کا ریکارڈ ہے۔"
      - "یہ کوئی یاد دہانی نہیں بھیجتا۔ دیر سے ادائیگی کا پیچھا کرنا اب بھی آپ کا کام ہے۔"
      - "یہ کوئی آخری تاریخ مقرر نہیں کرتا۔ اوما کے باقی €148 کب واجب ہیں، یہ گروپ کو آپس میں طے کرنا ہے۔"
      - "تجویز کردہ ادائیگیاں ایک مختصر فہرست ہیں، ممکنہ مختصر ترین ہونے کا وعدہ نہیں۔ وہ ہر کرنسی کے لحاظ سے نکالی جاتی ہیں، اس لیے یورو اور پاؤنڈ میں ادا ہوئے سفر کو ہر کرنسی کی اپنی فہرست ملتی ہے۔"
