meta:
  title: "Cara kerja Side Badger | Bagi pengeluaran grup dalam lima langkah"
  description: "Buat grup, undang orang, tambahkan pengeluaran, lalu lunasi. Lihat apa yang terjadi antara \"seseorang sudah bayar\" dan \"kita impas\", lengkap dengan contoh hitungan."
h1: "Cara kerja Side Badger"
navLabel: "Cara kerja"
lead: "Apa yang terjadi antara \"seseorang sudah bayar\" dan \"kita impas\"? Lima langkah, tanpa spreadsheet, dan satu badger yang sebagian besar hanya hiasan. Ini seluruh perjalanannya, dari grup pertama sampai pembayaran terakhir yang dicatat. Untuk rincian tiap langkah, lihat [bagi pengeluaran](page:feature/split-expenses) dan [pelunasan](page:feature/settle-up)."
cta:
  heading: "Dari \"biar aku yang bayar\" ke \"kita impas\""
  body: "Buat akun gratis, mulai grup, dan tambahkan pengeluaran pertama. Badger tidak akan menghakimi strukmu."
  button: "Buat akun gratis"
steps:
  - title: "Buat grup"
    body: "Buat satu grup untuk tiap rumah, perjalanan, atau acara, supaya uang sewa tidak pernah bercampur dengan daftar kado pernikahan. Beri nama, pilih nama yang akan dilihat orang untuk Anda, dan jika mau, batasi mata uang yang diterima. Dasbor Anda lalu menampilkan semua grup, dan posisi Anda di masing-masing, dalam satu layar."
    shot: S02
    shotAlt: "Dialog buat grup dengan bagian pembatasan mata uang terbuka"
  - title: "Undang orang-orang Anda"
    body: "Bagikan tautan bergabung atau tampilkan kode QR, dan atur berapa lama berlakunya, dari 15 menit hingga 5 hari. Setiap orang yang bergabung perlu akun gratis dan email terverifikasi, dan satu grup bisa berisi hingga 50 orang. Jika ingin menyeleksi siapa yang masuk, aktifkan persetujuan dan admin akan meloloskan tiap orang."
    shot: S03
    shotAlt: "Dialog undangan pada tab tautan, menampilkan kode QR dan pilihan masa berlaku"
  - title: "Tambahkan pengeluaran saat terjadi"
    body: "Catat siapa yang membayar, berapa, dan untuk siapa. Bagi rata, berdasarkan jumlah pasti, atau persentase, dan keluarkan siapa pun yang tidak ikut. Tambahkan pengeluarannya dan semua orang langsung melihatnya, beserta apa yang berubah dan siapa yang mengubahnya."
    shot: S05
    shotAlt: "Formulir pengeluaran dengan pembagian persentase, membagi uang sewa menurut ukuran kamar"
  - title: "Pantau saldo"
    body: "Side Badger menyimpan saldo berjalan untuk setiap mata uang, jadi Anda bisa melihat siapa berutang kepada siapa sekilas. Daripada membiarkan semua orang mengurai jaring utang kecil, Side Badger menyarankan daftar pembayaran singkat yang melunasi grup."
    shot: S10
    shotAlt: "Layar saldo yang menampilkan utang yang disederhanakan dalam dua mata uang, dengan Tampilkan semua diaktifkan"
  - title: "Lunasi di luar aplikasi, catat di dalamnya"
    body: "Side Badger tidak pernah memindahkan uang. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya agar saldo menyesuaikan, dan layar semua orang diperbarui tanpa perlu menyegarkan. \"Lunas\" berarti saldo menunjukkan nol. Tidak ada yang bisa keluar dari grup selagi masih berutang atau dihutangi, jadi siapa pun yang hendak pergi melunasi dulu."
    shot: S11
    shotAlt: "Formulir pembayaran dengan tombol lunasi cepat dan pemberitahuan pembayaran sebagian"
requirements:
  heading: "Yang Anda perlukan"
  items:
    - "Akun gratis. Yang Anda perlukan hanya alamat email dan kata sandi, dan Anda memverifikasi email sebelum bisa menambahkan apa pun."
    - "Berusia 18 tahun atau lebih."
    - "Peramban modern di ponsel atau komputer, dan koneksi internet. Side Badger bukan aplikasi toko aplikasi dan tidak berfungsi secara offline."
    - "Opsional, tempat di layar utama Anda. Tidak perlu toko aplikasi: masuk, lalu tambahkan Side Badger ke layar utama atau dock dan ia terbuka seperti aplikasi. Pengaturan di dalam aplikasi menunjukkan caranya."
