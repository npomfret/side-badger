meta:
  title: "Oszd fel a költségeket egyenlően, pontosan vagy százalékosan | Side Badger"
  description: "Oszd fel a közös költséget egyenlően, pontos összegek szerint vagy százalékosan, és hagyd ki azt, aki nem volt ott. Ingyenes, hirdetések és napi korlátok nélkül."
h1: "Oszd fel a költségeket egyenlően, pontosan vagy százalékosan"
navLabel: "Költségek felosztása"
lead: "Nem minden megy 50/50-ben. A Side Badger megbirkózik vele. Mondd meg, ki fizetett, válaszd ki a költséget megosztó embereket, és oszd fel **egyenlően, pontos összegek szerint vagy százalékosan**. A sértődések külön kaphatók."
cta:
  heading: "Oszd fel a következőt rendesen"
  body: "Hozz létre ingyenes fiókot, indíts csoportot, és add hozzá azt a költséget, amelyet már régen rendezni akarsz. Nem tudod, mi jön ezután? Nézd meg, [hogyan működik](page:how-it-works), vagy azt, [mit fed le az ingyenes csomag](page:pricing)."
  button: "Ingyenes fiók létrehozása"
problem:
  heading: "Nem minden megy 50/50-ben"
  body: "A lakbér a szoba méretét követi. Egy ajándék azt, ki mit ígért. Egy vacsora azt, ki maradt desszertre. A számla félbeosztása addig működik, amíg el nem jön az első számla, amely nem ilyen, és akkor valaki megnyit egy táblázatot. A Side Badger rögzíti, ki fizetett, ki osztozott a költségen, és hogyan oszlik meg, így az egyenlegek helyesen jönnek ki, anélkül hogy bárkinek az asztalnál írásbeli osztást kellene végeznie."
workflow:
  heading: "Egy költség hozzáadása az elejétől a végéig"
  steps:
    - title: "Mondd meg, ki fizetett és mire"
      body: "Add meg az összeget, egy rövid leírást és a fizető személyt. Minden költséget egy ember fizet, ami becsületesen tartja a számolást."
      shot: S05
      shotAlt: "A költségűrlap egy nyaraló bérleti díjával, három ember között százalékosan felosztva"
    - title: "Válaszd ki a felosztást"
      body: "Válassz egyenlőt, pontos összegeket vagy százalékokat. A százalékoknak együtt 100-at kell kiadniuk, a pontos összegeknek pedig a teljes összeget."
      shot: S06
      shotAlt: "A költségűrlap egy ajándékhoz minden emberre beírt pontos összegekkel"
    - title: "Add hozzá a történetet"
      body: "Állítsd be a dátumot, adj hozzá címkéket, helyet és megjegyzést. A csoport minden tagja ugyanazokat a részleteket látja, és rögtön ott kommentelhet."
      shot: S08
      shotAlt: "Egy költség a részleteivel, egy kommentszállal és az eredeti összeggel, amelyben beírták"
    - title: "Tegyél fel kérdést, ha valami nem stimmel"
      body: "Ha a csoport bekapcsolta a költségkérdéseket, bárki, aki szerepel egy költségben, kérdőre vonhatja, a költséglista pedig csak a kérdőre vontakat mutathatja."
      shot: S18
      shotAlt: "A költséglista egy Kérdőre vont jelvénnyel és a Csak kérdőre vont szűrővel"
options:
  heading: "Háromféle felosztás"
  items:
    - title: "Egyenlően"
      body: "Az alapértelmezett vacsorákra, taxikra és mindenre, amit mindenki egyenlően osztott meg. Ha az összeg nem osztható maradék nélkül, a felesleges penny véletlenszerűen egy emberhez kerül, nem mindig ugyanahhoz. Az alábbi taxinál ez Ana."
    - title: "Pontos összegek szerint"
      body: "Írd be, ki mennyivel tartozik. Jó az olyan ajándékhoz, ahol mindenki más árat választott, vagy olyan vásárláshoz, ahol valakinek a kosarában több volt, mint a közös bevásárlás. Az összegeknek együtt a teljes összeget kell kiadniuk."
    - title: "Százalékosan"
      body: "Adj mindenkinek részt az összegből. A lakbér a szoba mérete szerint a klasszikus: a legnagyobb szoba fizeti a legnagyobb részt, és senki nem tesz úgy, mintha másképp lenne."
