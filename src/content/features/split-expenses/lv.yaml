meta:
  title: "Sadaliet izdevumus vienādi, precīzi vai procentuāli | Side Badger"
  description: "Sadaliet kopīgas izmaksas vienādi, pēc precīzām summām vai procentuāli un izlaidiet tos, kas tur nebija. Bez maksas, bez reklāmām un bez dienas ierobežojumiem."
h1: "Sadaliet izdevumus vienādi, precīzi vai procentuāli"
navLabel: "Izdevumu sadale"
lead: "Ne viss ir 50/50. Side Badger tiek galā. Norādiet, kas maksāja, izvēlieties cilvēkus, kas dalījās izmaksās, un sadaliet **vienādi, pēc precīzām summām vai procentuāli**. Aizvainojumi tiek pārdoti atsevišķi."
cta:
  heading: "Sadaliet nākamo kārtīgi"
  body: "Izveidojiet bezmaksas kontu, sāciet grupu un pievienojiet izdevumu, ko jau sen gribējāt nokārtot. Neesat pārliecināti, kas notiks tālāk? Skatiet [kā tas darbojas](page:how-it-works) vai [ko sedz bezmaksas versija](page:pricing)."
  button: "Izveidot bezmaksas kontu"
problem:
  heading: "Ne viss ir 50/50"
  body: "Īre seko istabas lielumam. Dāvana seko tam, kurš ko apsolīja. Vakariņas seko tam, kurš palika uz desertu. Rēķina dalīšana uz pusēm der līdz pirmajam rēķinam, kas tāds nav, un tad kāds atver izklājlapu. Side Badger reģistrē, kas maksāja, kas dalījās izmaksās un kā tās dalās, lai atlikumi sanāk pareizi un neviens pie galda nedara garo dalīšanu."
workflow:
  heading: "Izdevuma pievienošana no sākuma līdz beigām"
  steps:
    - title: "Norādiet, kas maksāja un par ko"
      body: "Ievadiet summu, īsu aprakstu un personu, kas maksāja. Par katru izdevumu maksā viens cilvēks, un tas uztur aritmētiku godīgu."
      shot: S05
      shotAlt: "Izdevuma veidlapa ar lauku mājas īri, procentuāli sadalītu starp trim cilvēkiem"
    - title: "Izvēlieties sadali"
      body: "Izvēlieties vienādi, precīzas summas vai procentus. Procentiem jāsakrīt ar 100, un precīzām summām jāsakrīt ar kopsummu."
      shot: S06
      shotAlt: "Izdevuma veidlapa ar precīzām summām, ievadītām katram cilvēkam par dāvanu"
    - title: "Pievienojiet stāstu"
      body: "Iestatiet datumu, pievienojiet birkas, vietu un piezīmi. Visi grupā redz tās pašas detaļas un var komentēt tur pat."
      shot: S08
      shotAlt: "Izdevums ar detaļām, komentāru pavedienu un sākotnējo summu, kādā tas ievadīts"
    - title: "Uzdodiet jautājumu, ja kaut kas šķiet nepareizs"
      body: "Ja grupa ir ieslēgusi izdevumu jautājumus, ikviens, kas iekļauts izdevumā, var to apšaubīt, un izdevumu sarakstā var rādīt tikai apšaubītos."
      shot: S18
      shotAlt: "Izdevumu saraksts ar zīmi „Apšaubīts” un filtru „Tikai apšaubīti”"
options:
  heading: "Trīs sadales veidi"
  items:
    - title: "Vienādi"
      body: "Noklusējums vakariņām, taksometriem un visam, ko visi dalīja vienādi. Ja kopsumma nedalās bez atlikuma, atlikušais santīms nonāk pie viena cilvēka nejauši, ne vienmēr pie viena un tā paša. Tālāk redzamajā taksi tā ir Ana."
    - title: "Pēc precīzām summām"
      body: "Ierakstiet, cik katrs ir parādā. Der dāvanai, kurā katrs izvēlējās citu cenu, vai veikalam, kur viena cilvēka ratos bija vairāk nekā kopīgie pārtikas pirkumi. Summām jāsakrīt ar kopsummu."
    - title: "Procentuāli"
      body: "Dodiet katram cilvēkam daļu no kopsummas. Īre pēc istabas lieluma ir klasika, kur lielākā istaba maksā lielāko daļu un neviens neizliekas citādi."
