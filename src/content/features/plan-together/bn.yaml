sections:
  - heading: "মন্তব্য আর রিঅ্যাকশন, সংখ্যার পাশেই"
    body: "প্রতিটি খরচের নিজস্ব মন্তব্যের সুতো আছে, গ্রুপের, প্রতিটি তালিকার আর প্রতিটি পোলেরও। ট্যাক্সির ভাড়া এত কেন, তা জিজ্ঞেস করুন ট্যাক্সির খরচের নিচেই, এমন চ্যাটে নয় যেখানে কেউ পেছনে স্ক্রল করে না। রসিদের ছবি বা বুকিংয়ের PDF জুড়ে দিন, তারপর খরচ, পেমেন্ট আর মন্তব্যে থাম্বস-আপ, হার্ট, হাসি, ওয়াও, মন খারাপ বা উদযাপন দিয়ে রিঅ্যাক্ট করুন। পেমেন্ট এসে পৌঁছালে উদযাপন করুন। করতালির রাউন্ডের সবচেয়ে কাছাকাছি যা Side Badger দিতে পারে, এটাই।"
  - heading: "ঝগড়া না বাধিয়ে খরচ নিয়ে প্রশ্ন তুলুন"
    body: "গ্রুপ খরচ নিয়ে প্রশ্ন তোলা চালু করে থাকলে, খরচে অন্তর্ভুক্ত যে কেউ **আমার একটি প্রশ্ন আছে** বেছে নিয়ে কারণটা লিখতে পারে। প্রশ্নটা খরচের মন্তব্য হিসেবে পোস্ট হয়, খরচটা একটি **প্রশ্নবিদ্ধ** ব্যাজ পায়, আর প্রশ্নটার সুরাহা না হওয়া পর্যন্ত পুরো খরচটাই সবার ব্যালেন্স থেকে বাদ পড়ে।"
    items:
      - "**চালু করা।** এটি ডিফল্টে বন্ধ থাকে। একজন অ্যাডমিন গ্রুপের সেটিংসে **বৈশিষ্ট্য**-এর নিচে **খরচ সম্পর্কিত প্রশ্নের অনুমতি দিন** চালু করেন।"
      - "**বন্ধ করা।** যে প্রশ্ন তুলেছে সে, বা একজন অ্যাডমিন, **প্রশ্ন বন্ধ করুন** বেছে নেন। কয়েকজন একই খরচ নিয়ে প্রশ্ন তুললে শেষ প্রশ্নটি বন্ধ হলে খরচটা ব্যালেন্সে ফিরে যায়।"
      - "**সম্পাদনা।** খরচ সম্পাদনা করা হলে একটি খোলা প্রশ্ন নতুন সংস্করণে চলে আসে তাদের জন্য, যাদের এখনও তাতে ভাগ আছে। সম্পাদনায় যারা বাদ পড়ে, তাদের প্রশ্ন পুরনো সংস্করণের সঙ্গেই শেষ হয়ে যায়, তাই তাদের বন্ধ করার মতো আর কিছু থাকে না।"
      - "**খুঁজে পাওয়া।** খরচের তালিকায় একটি **শুধুমাত্র প্রশ্নবিদ্ধ** ফিল্টার আছে। এটি অনুমোদনের কোনো ধাপ নয়: শুধু যে খরচগুলো নিয়ে কেউ প্রশ্ন তোলে সেগুলোই স্থগিত থাকে, বাকি সবকিছু যোগ হওয়ামাত্র গণনায় ধরা হয়।"
  - heading: "একটি প্রশ্ন কীভাবে এগোয়"
    body: "Tom £45-এর পার্টির ওয়াইন যোগ করে, তিন রুমমেটের মধ্যে ভাগ করে। Aisha খায়নি, তাই সে একটি প্রশ্ন তোলে, আর সেটা খোলা থাকা পর্যন্ত ওয়াইন কারও হিসাবেই ধরা হয় না। বাড়ির সবাই রাজি হয় যে ওয়াইনটা Tom আর Priya-র, তাই Tom ভাগটা সম্পাদনা করে দুজনের মধ্যে করে দেয়। Aisha আর খরচটায় নেই, তাই তার প্রশ্ন আগের সংস্করণের সঙ্গে শেষ হয়ে যায়, সেই সংস্করণ রাখা থাকে, আর ওয়াইন সঙ্গে সঙ্গে জনপ্রতি £15-এর জায়গায় জনপ্রতি £22.50 হয়ে ব্যালেন্সে ফিরে আসে। Aisha খরচটায় থেকে গেলে তার প্রশ্ন সঙ্গে চলে আসত আর তার বা একজন অ্যাডমিনের বন্ধ করার অপেক্ষায় থাকত। নিচে Aisha-র £48 হলো বাজারের £28 আর ক্লিনারের £20, আর Priya-র £10.50 হলো তার £70.50 ভাগ (£28, £20 আর £22.50) থেকে সে যে £60 দিয়েছে তা বাদ দিলে যা থাকে। একেবারে [রুমমেটদের](page:use-case/housemates) মতো তর্ক। প্রশ্নটা কীভাবে লিখবেন তার জন্য দেখুন [কেউ যৌথ খরচ নিয়ে আপত্তি তুললে কী করবেন](page:guide/what-to-do-when-someone-disputes-a-shared-expense)।"
  - heading: "যৌথ তালিকা, বাজারের জন্য"
    body: "গ্রুপে একটি তালিকা শুরু করুন, নাম দিন “বাজারের তালিকা”-র মতো কিছু, আইটেম যোগ করুন আর টিক দিন। আইটেমগুলো টেনে ভালো ক্রমে সাজান, এগিয়ে চলার সংখ্যা বাড়তে দেখুন, আর কেউ ভুল ওট মিল্ক কিনে আনলে তালিকায় মন্তব্য করুন। শেষ হয়ে যাওয়া তালিকা আর্কাইভ করে গুছিয়ে রাখুন (**আর্কাইভ করাগুলো দেখুন** সেটা ফিরিয়ে আনে), অথবা তালিকা কপি করে আবার কাজে লাগান। যৌথ বাজারের তালিকা বাজারের বিলের পাশে রাখুন, যাতে তালিকা বলে কী কিনতে হবে আর খরচ বলে তার দাম কত হলো। তালিকা কে বানাতে ও সম্পাদনা করতে পারবে তা গ্রুপের অনুমতির ওপর নির্ভর করে, যা [গ্রুপ ও অনুমতি](page:feature/groups-and-permissions) ব্যাখ্যা করে।"
  - heading: "পোল, চাইলে নাম না জানিয়ে"
    body: "গ্রুপকে এমন কিছু জিজ্ঞেস করুন যা বিলের অঙ্ক ঠিক করে দেয়, যেমন কোন ভিলা, উপহারে কত খরচ করা হবে, বা নৌকাভ্রমণ কি সত্যিই মূল্যবান। একটি পোলে থাকে একটি প্রশ্ন আর দুই থেকে দশটি বিকল্প। প্রত্যেকের কতটি ভোট থাকবে তা আপনি ঠিক করেন, একটি পছন্দ থেকে দশটি পর্যন্ত, আর ভোটদান বেনামী হবে কি না তাও। **বেনামী ভোটদান** কে কীসে ভোট দিয়েছে তা লুকিয়ে রাখে, আর প্রথম ভোট পড়ে গেলে সেটা আর বদলানো যায় না। পোল বন্ধ না হওয়া পর্যন্ত মানুষজন নিজেদের ভোট বদলাতে বা সরাতে পারে, আর গ্রুপের মত বদলালে আপনি পোলটা আবার খুলতে পারেন। ভিলা বাছাই তো [গ্রুপ ট্রিপের](page:use-case/group-trips) প্রাণ, আর উপহারের বাজেট ঠিক করা [অনুষ্ঠান ও উদযাপনের](page:use-case/events-and-celebrations) পুরনো ক্লাসিক।"
  - heading: "কার্যকলাপের ফিড, যাতে কিছু নীরবে না বদলায়"
    body: "প্রতিটি গ্রুপের একটি কার্যকলাপের ইতিহাস আছে, আর বিজ্ঞপ্তির ঘণ্টা আপনার সব গ্রুপের কার্যকলাপ এক জায়গায় জড়ো করে। একটি খরচ যোগ করলে সবাই সঙ্গে সঙ্গে দেখে, রিফ্রেশ ছাড়াই, আর ফিড দেখায় কী বদলেছে আর কে বদলেছে। এর মধ্যে আছে খরচ যোগ, সম্পাদনা বা মোছা, প্রশ্ন তোলা ও বন্ধ করা, মন্তব্য, তালিকা ও পোলের পরিবর্তন, আর রেকর্ড করা পেমেন্ট।"
  - heading: "পুশ বিজ্ঞপ্তি, চাইলে"
    body: "পুশ বিজ্ঞপ্তি ঐচ্ছিক। আপনার অ্যাকাউন্টের **সেটিংস**-এ **বিজ্ঞপ্তিসমূহ**-এর নিচে এগুলো চালু করুন, তাহলে আপনার গ্রুপে নতুন কার্যকলাপ হলে, যেমন নতুন খরচ বা মন্তব্য, আপনার ডিভাইস আপনাকে জানায়। প্রতিটি ডিভাইস আলাদাভাবে চালু করতে হয়, আর আপনার ব্রাউজার আগে অনুমতি চায়। iPhone বা iPad-এ এগুলো কাজ করে শুধু হোম স্ক্রিনে যোগ করা অ্যাপে, যা [ওয়েব অ্যাপ](page:feature/web-app) পৃষ্ঠা ব্যাখ্যা করে। এগুলোকে সুবিধা হিসেবে ধরুন, প্রতিশ্রুতি হিসেবে নয়, কারণ পৌঁছে যাওয়ার নিশ্চয়তা নেই।"
limits:
  heading: "সীমা"
  items:
    - "মন্তব্য, তালিকা আর পোল গ্রুপের টাকার জন্য। [পরিষেবার শর্তাবলী](page:terms) চায় যা-ই পোস্ট করা হোক তা গ্রুপের আর্থিক বিষয়ের সঙ্গে সম্পর্কিত হোক, তাই এটা খরচের পরিকল্পনার জায়গা, সাধারণ আড্ডা বা টু-ডু অ্যাপ নয়।"
    - "একটি মন্তব্য 500 অক্ষর পর্যন্ত হতে পারে, সঙ্গে ছবি বা PDF আকারে তিনটি পর্যন্ত সংযুক্তি, প্রতিটি 5 MB পর্যন্ত। মন্তব্য মুছতে পারে শুধু যে লিখেছে সে।"
    - "খরচ নিয়ে প্রশ্ন তোলা ডিফল্টে বন্ধ থাকে, আর প্রতিটি গ্রুপের জন্য একজন অ্যাডমিন সেটি চালু করেন। শুধু খরচে অন্তর্ভুক্ত মানুষরাই সেটি নিয়ে প্রশ্ন তুলতে পারে, ফিচারটি বন্ধ করলে প্রতিটি খোলা প্রশ্ন মুছে যায়, আর যে খরচে কেউ আছে সেটিতে খোলা প্রশ্ন থাকলে সে গ্রুপ ছাড়তে পারে না।"
    - "একটি গ্রুপে 100টি তালিকা পর্যন্ত থাকতে পারে, প্রতিটিতে 200টি পর্যন্ত আইটেম, প্রতিটি আইটেম 500 অক্ষর পর্যন্ত। কে তালিকা বানাতে, সম্পাদনা করতে ও মুছতে পারবে তা গ্রুপের অনুমতি ঠিক করে, আর লক করা গ্রুপে কোনো পরিবর্তন চলে না।"
    - "একটি গ্রুপে 50টি পোল পর্যন্ত থাকতে পারে, প্রতিটিতে দুই থেকে দশটি বিকল্প আর জনপ্রতি দশটি পর্যন্ত ভোট। পোলের কোনো শেষ তারিখ নেই আর সেগুলো নিজে থেকে বন্ধ হয় না।"
    - "কার্যকলাপের ইতিহাস 90 দিন রাখা হয়।"
    - "পুশ বিজ্ঞপ্তি প্রতিটি অ্যাকাউন্ট আর প্রতিটি ডিভাইসে নিজে চালু করলে তবেই আসে। এর জন্য এমন ব্রাউজার লাগে যা এটি সমর্থন করে, আর আপনার অনুমতি লাগে; iPhone ও iPad-এ এগুলো কাজ করে শুধু হোম স্ক্রিনে যোগ করা অ্যাপ থেকে, আর পৌঁছে যাওয়ার নিশ্চয়তা নেই। কার্যকলাপের জন্য কোনো ইমেইল বা টেক্সট সতর্কবার্তা নেই এবং পেমেন্টের কোনো রিমাইন্ডার নেই, তাই পেমেন্টের তাগাদা দেওয়া এখনও আপনার ওপরই।"
useCasesHeading: "যেখানে একসঙ্গে পরিকল্পনা কাজে লাগে"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "ভোট কি বেনামী হতে পারে?"
      a: "হ্যাঁ। পোল বানানোর সময় **বেনামী ভোটদান** চালু করুন, তাহলে কে কীসে ভোট দিয়েছে তা লুকিয়ে থাকে। প্রথম ভোটের আগেই ঠিক করুন, কারণ পরে এটি বদলানো যায় না।"
    - q: "পোল কি নিজে থেকে বন্ধ হতে পারে?"
      a: "না। পোলের কোনো শেষ তারিখ নেই, তাই গ্রুপ সিদ্ধান্ত নিলে যে বানিয়েছে সে **পোল বন্ধ করুন** বেছে নেয়। গ্রুপের মত বদলালে **পোল আবার খুলুন** সেটা ফিরিয়ে আনে।"
    - q: "একটি তালিকায় কয়টি আইটেম থাকতে পারে?"
      a: "প্রতি তালিকায় 200টি পর্যন্ত আইটেম আর প্রতি গ্রুপে 100টি পর্যন্ত তালিকা। প্রতিটি আইটেম 500 অক্ষর পর্যন্ত হতে পারে, যা ওট মিল্ক নিয়ে লেখার পক্ষে যথেষ্টের চেয়েও বেশি।"
    - q: "প্রশ্ন কে বন্ধ করতে পারে, আর ততক্ষণ খরচটার কী হয়?"
      a: "যে প্রশ্ন তুলেছে সে, বা গ্রুপের একজন অ্যাডমিন। প্রশ্ন খোলা থাকা পর্যন্ত পুরো খরচটাই সবার ব্যালেন্সের বাইরে থাকে। খরচটার শেষ খোলা প্রশ্নটি বন্ধ হলে, বা কোনো সম্পাদনায় প্রশ্নকারী খরচ থেকে বাদ পড়লে, সেটি ব্যালেন্সে ফিরে আসে।"
    - q: "তালিকা আর মন্তব্য কি টু-ডু অ্যাপ বা গ্রুপ চ্যাট হিসেবে ব্যবহার করা যায়?"
      a: "না। মন্তব্য, তালিকা আর পোল গ্রুপের টাকার জন্য, [পরিষেবার শর্তাবলী](page:terms) যা চায়। ভাবুন বাজারের তালিকা, বাজেটের পোল আর “এটা £45 কেন?”।"
    - q: "Side Badger কি কার্যকলাপ নিয়ে আমাকে ইমেইল করবে?"
      a: "না। কার্যকলাপের জন্য কোনো ইমেইল বা টেক্সট সতর্কবার্তা নেই। প্রতিটি ডিভাইসে আপনি পুশ বিজ্ঞপ্তি চালু করতে পারেন, আর অ্যাপের বিজ্ঞপ্তির ঘণ্টা দেখায় নতুন কী হয়েছে।"
