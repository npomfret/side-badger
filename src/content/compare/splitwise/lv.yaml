sections:
  - heading: "Ko Splitwise dara labi"
    body: "Ja jūsu grupai vajadzīga vietējā lietotne, lietošana bezsaistē vai maksājumi lietotnes iekšienē, Splitwise ir saprātīga izvēle, un mēs labāk gribētu, lai jūs to izvēlētos, nekā vēlāk uzzinātu. Tā paša lapas min:"
    items:
      - "**Lietotnes un lietošana bezsaistē.** iPhone un Android lietotnes papildus tīmeklim un bezsaistes režīms."
      - "**Vairāk sadales veidu.** Daļas, korekcijas un sadale pa pozīcijām papildus vienādai, precīzai un procentuālai."
      - "**Atkārtoti izdevumi.** Iestatiet īri atkārtoties un aizmirstiet par to."
      - "**Maksājumi lietotnē.** Dažās valstīs tā var arī pārvietot naudu, izmantojot Splitwise Pay, Venmo, PayPal vai Pay by Bank."
  - heading: "Šeit bez maksas, tur par maksu"
    body: "Splitwise Pro ir Splitwise maksas plāns, un tā paša Pro lapa pārdod četras lietas, kas Side Badger neko nemaksā."
    items:
      - "**Čeku skenēšana.** Splitwise Pro skenē jūsu čeka fotogrāfiju. Side Badger to dara bez maksas un bez skenēšanas kredītiem: tas aizpilda kopsummu, datumu un vietu, lai jūs tos pārbaudītu. Čeku attēlus nolasa Google AI pakalpojums."
      - "**Valūtu konvertēšana.** Splitwise Pro konvertē grupas izdevumus uz jūsu noklusējuma valūtu, kad pieskaraties pogai „Konvertēt”. Side Badger konvertē katru izdevumu, kad to ievadāt, pēc pašreizējā valūtas kursa vai kursa, ko patiešām saņēmāt, un sākotnējā summa paliek pie izdevuma."
      - "**Bez reklāmām.** Splitwise kā Pro funkciju min pilnīgi bezreklāmu pieredzi. Side Badger reklāmu nav."
      - "**Bez dienas ierobežojumiem.** Splitwise Pro pārdod neierobežotu izdevumu skaitu, un tā palīdzības centrs saka, ka bezmaksas lietotāji dienā var pievienot līdz 4 izdevumiem. Side Badger dienas ierobežojumu nav."
  - heading: "Kas Splitwise ir, bet Side Badger nav"
    body: "Šīs nav visas Splitwise funkcijas, tikai tās, kas parasti izšķir. Pilnu sarakstu sniedz Splitwise paša lapas. Lūk, kur Side Badger atpaliek."
    items:
      - "**Vietējās lietotnes.** Side Badger darbojas jūsu pārlūkprogrammā. Pierakstieties, tad pievienojiet to sākuma ekrānam, un tas atveras kā lietotne."
      - "**Bezsaistes režīms.** Side Badger vajadzīgs savienojums."
      - "**Maksājumi lietotnē.** Side Badger nekad neskar jūsu naudu. Samaksājiet viens otram, kā vēlaties, tad reģistrējiet maksājumu."
      - "**Atkārtoti izdevumi.** Side Badger to nav. Nokopējiet pagājušā mēneša īri, nevis ierakstiet to vēlreiz."
      - "**Sadale pa daļām vai pa pozīcijām.** Side Badger katram izdevumam ir viens maksātājs, un to sadala vienādi, pēc precīzām summām vai procentuāli. Čeku skenēšana nepiešķir pozīcijas cilvēkiem."
      - "**Diagrammas un noklusējuma sadales.** Splitwise Pro ir abas. Side Badger uztur uzskaiti, kurš kam ir parādā, un tas arī viss triks."
  - heading: "Grupas pārcelšana"
    body: "Importēšanas rīka nav, tāpēc pārcelšanās nozīmē jaunu sākumu. Vispirms norēķinieties Splitwise, tad izveidojiet grupu Side Badger un uzaiciniet visus ar saiti vai QR kodu. Ikvienam grupā vajadzīgs bezmaksas konts, un reģistrācijai pietiek ar e-pasta adresi."
