meta:
  title: "Roinn costas deireadh seachtaine stag nó hen | Side Badger"
  description: "Ní íocann an t-aoi onóra tada agus tá cách fós ag caint le chéile faoin Luan. Conas deireadh seachtaine stag nó hen a roinnt, suimeanna san áireamh."
h1: "Conas costas deireadh seachtaine stag nó hen a roinnt"
navLabel: "Deireadh seachtaine stag nó hen"
lead: "Ní íocann an t-aoi onóra tada, mar sin roinneann an chuid eile den ghrúpa gach costas [go cothrom](page:feature/split-expenses) eatarthu. Fág daoine amach as na costais a scipeálann siad, agus coinnigh an t-aoi onóra amach as an ngrúpa ionas go bhfanann an t-iontas faoi cheilt."
cta:
  heading: "Coinnigh an cuntas, coinnigh an t-iontas"
  body: "Déan grúpa, seol an nasc chuig gach duine ach an t-aoi onóra agus cuir gach costas leis de réir mar a tharlaíonn sé. Tá Side Badger saor in aisce, gan fógraí agus gan teorainneacha laethúla."
sections:
  - heading: "Ceathrar cairde agus iontas amháin"
    body: "Tá Hannah, Isla, Jess agus Kat ag tabhairt Grace ar shiúl le haghaidh a deireadh seachtaine hen. Is í Grace an t-aoi onóra, mar sin ní íocann sí as aon rud. Níl sí sa ghrúpa ach an oiread, mar sin ní féidir léi a fheiceáil cad atá á chaitheamh ag a cairde uirthi. Cuireann Hannah an teachín in áirithe, íocann Isla as an lá spa, clúdaíonn Jess an dinnéar agus íocann Kat an tacsaí. Faoin Domhnach tá rud éigin íoctha ag gach duine, agus ní féidir le haon duine a rá cé atá chun cinn. Is iad na suimeanna céanna iad do dheireadh seachtaine stag nó hen, pé duine an t-aoi onóra."
  - heading: "Roinn idir na daoine a íocann, ní idir na daoine atá ann"
    body: "Ní imíonn sciar an aoi onóra. Roinntear amach é. Cosnaíonn an teachín £720 agus íocann ceathrar cairde as, mar sin is £180 an duine é, agus tá áit Grace sa fhigiúr sin cheana féin. Is £260 an dinnéar, mar sin £65 an duine. Is £44 an tacsaí, mar sin £11 an duine. Ní fhágtar duine amach ach as an gcostas a scipeálann sé. Scipeálann Kat an spa, mar sin roinneann Hannah, Isla agus Jess a £360, a chlúdaíonn áit Grace freisin, ar £120 an duine. Cuir le chéile é agus tá £376 den deireadh seachtaine dlite ag Hannah, Isla agus Jess an duine, agus £256 ag Kat."
  - heading: "Cuir ar bun i Side Badger é"
    items:
      - "Déan grúpa don deireadh seachtaine agus tabhair ainm leamh air, mar Deireadh seachtaine sa teachín. Ní ball í Grace, agus ní féidir ach le baill grúpa é a fheiceáil."
      - "Roghnaigh **Tabhair Cuireadh do Dhaoine Eile** agus seol an nasc, nó taispeáin an cód QR, agus ná déan sin ach in áit nach bhfeicfidh Grace é. Taispeánann an nasc réamhamharc den ghrúpa sula dtéann duine ar bith isteach. Roghnaigh cá fhad a mhaireann sé, ó 15 nóiméad go 5 lá. Leanann seannasc ag obair go dtí go rachaidh sé in éag, mar sin ná fág níos faide é ná mar is gá."
      - "Do gach costas, roghnaigh **Cuir Costas Leis**, cuir isteach an méid agus roghnaigh an t-íocóir faoi **Cé a d'íoc?** Faoi **Roinn idir**, cuir tic ar na daoine atá ag íoc, agus fág amach aon duine a scipeáil é, mar Kat don spa. Roghnaigh **Cothrom** faoi **Conas a roinntear**."
      - "Nuair a bhíonn tú sa bhaile, oscail **Iarmhéideanna** an ghrúpa. Taispeánann Side Badger cé atá i bhfiacha le cé agus molann sé liosta gearr íocaíochtaí. Anseo is trí cinn iad: íocann Kat £212 le Hannah, íocann Jess £116 le Hannah agus íocann Isla £16 le Hannah. Íocaigí a chéile ar an gcaoi is fearr libh, ansin úsáid **Socraigh** chun gach íocaíocht a thaifeadadh."
  - heading: "Sula gcuireann tú in áirithe, buiséad agus éarlais"
    body: "Aontaigh an buiséad sula gcuireann aon duine in áirithe. Roghnaigh **Cuir Vótaíocht Leis**, fiafraigh cé mhéad a chaithfidh an grúpa ar an teachín agus tabhair cúpla figiúr mar roghanna. Cas air **Vótáil gan ainm** nuair a chruthaíonn tú é, chun a cheilt cé a vótáil ar cad, ionas nach gcaithfidh aon duine buiséad níos lú a chosaint os ard. Dún an vótaíocht nuair a bhíonn gach duine tar éis vótáil agus taispeántar an buaiteoir. Ansin tagann an éarlais. Íocann an té a chuireann in áirithe í agus cuireann sé leis mar chostas í, roinnte go cothrom, agus téann an t-iarmhéid isteach mar dhara costas nuair atá sé dlite. Is féidir leis na daoine eile a sciar a sheoladh láithreach agus an íocaíocht a thaifeadadh, nó fanacht leis an gcomhaireamh deiridh. Tagann na hiarmhéideanna amach mar a chéile ar an dá bhealach."
  - heading: "Nuair a thagann duine isteach ar feadh oíche amháin"
    body: "Níor cheart do chara nach dtagann ach don Satharn íoc as an Aoine. Fág amach iad as na costais nach raibh siad páirteach iontu. Nuair a bhraitheann an costas ar cé chomh fada a fhanann gach duine, mar sheomra, roghnaigh **Méideanna cruinne** faoi **Conas a roinntear** agus clóscríobh sciar gach duine, a chaithfidh an t-iomlán a bhaint amach le chéile. Oibrigh amach praghas an duine in aghaidh na hoíche ar dtús, ansin méadaigh faoi líon na n-oícheanta a fhanann gach duine. Tá tuilleadh ar chostais nach mar a chéile do gach duine ar an leathanach [turais ghrúpa](page:use-case/group-trips)."
  - heading: "Cad nach ndéanann Side Badger anseo"
    items:
      - "Ní bhogann sé airgead riamh. Íocann sibh a chéile trí aistriú bainc, airgead tirim nó cibé a oireann, ansin taifeadann sibh an íocaíocht ionas go nuashonraítear na hiarmhéideanna do gach duine."
      - "Ní sheolann sé meabhrúcháin íocaíochta. Is ar dhuine fós atá sé spreagadh cairdiúil a thabhairt sa chomhrá grúpa."
      - "Níl ach íocóir amháin ar gach costas, agus ní féidir le Side Badger admháil a roinnt líne ar líne. Má d'íoc dhá chárta as an teachín, cuir isteach mar dhá chostas é. Má d'ordaigh roinnt daoine rudaí breise ag an dinnéar, cuir isteach na rudaí breise mar chostas ar leith."
      - "Coinníonn sé an t-airgead, ní plean an turais. Fanann vótaíochtaí agus tráchtanna ar na costais, mar sin fanann pleananna an deiridh seachtaine i do chomhrá grúpa."
