featuresHeading: Las funciones que usa una casa
faq:
  heading: Preguntas
  items:
    - q: ¿Puede repetirse el alquiler automáticamente?
      a: No, no hay facturas recurrentes. Copia el alquiler del mes pasado en un par de toques, cambia la fecha y listo.
    - q: ¿Podemos dividir según el tamaño de la habitación?
      a: Sí, por porcentaje. Da a cada compañero una parte que refleje su habitación, siempre que las partes sumen 100. [Dividir gastos](page:feature/split-expenses) explica las otras formas de dividir.
    - q: ¿Y si un compañero se muda debiendo dinero?
      a: No puede salir del grupo hasta que haya saldado, porque nadie puede salir mientras deba o le deban dinero. Los números siguen siendo honestos hasta que todos estéis en paz.
    - q: ¿Paga Side Badger las facturas?
      a: No. Lleva la cuenta y sugiere una lista corta de pagos. Pagaos como queráis y después registradlo, como explica [saldar cuentas](page:feature/settle-up).
    - q: ¿Puede un compañero llevar las cuentas?
      a: Sí. Hazlo administrador y usa un grupo administrado, donde los nuevos miembros necesitan aprobación y solo quien creó cada gasto y los administradores pueden cambiar gastos.
