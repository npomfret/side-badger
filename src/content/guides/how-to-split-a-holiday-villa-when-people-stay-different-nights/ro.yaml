faq:
  heading: "Întrebări despre vilă"
  items:
    - q: "Ce se întâmplă dacă cineva renunță?"
      a: "Scoate-i nopțile, refă socotelile și editează cheltuiala cu vila, ca sumele exacte să dea din nou prețul. Versiunea anterioară se păstrează, iar editarea apare în activitatea grupului, așa că nimeni nu schimbă o cifră pe tăcute. Cine are voie să editeze depinde de permisiunile grupului."
    - q: "Cel care a făcut rezervarea ar trebui să plătească mai puțin?"
      a: "Hotărăște grupul. Rezervarea e o corvoadă, iar grupurile nu sunt de acord dacă merită o reducere. Orice ați stabili, treceți asta în sumele exacte și scrieți-o într-o notă pe cheltuială sau într-un comentariu lângă ea, ca nimeni să nu fie nevoit să-și amintească înțelegerea."
    - q: "Putem împărți altfel taxele de curățenie?"
      a: "Da. Introdu taxa ca o cheltuială separată și dă-i propria împărțire. O împărțire egală se potrivește pentru o taxă fixă pentru toată casa. Sumele exacte se potrivesc unui grup care vrea ca și taxa să urmeze nopțile."
