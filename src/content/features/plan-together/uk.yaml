sections:
  - heading: "Коментарі й реакції поруч із цифрами"
    body: "У кожної витрати своя гілка коментарів, так само в групи, кожного списку й кожного опитування. Питайте, чому таксі коштувало стільки, під таксі, а не в чаті, який ніхто не гортає назад. Додайте фото чека чи PDF бронювання, а потім реагуйте великим пальцем угору, серцем, сміхом, «вау», сумом чи святкуванням на витрати, платежі та коментарі. Святкуйте платіж, коли він надійшов. Це найближче до оплесків, що може дати Side Badger."
  - heading: "Поставте витрату під сумнів без сварки"
    body: "Коли в групі ввімкнено запитання щодо витрат, кожен, кого включено у витрату, може обрати **Маю запитання** й сказати чому. Запитання з'являється коментарем до витрати, витрата отримує значок **Поставлено під сумнів**, а вся витрата випадає з усіх балансів, доки запитання не розглянуть."
    items:
      - "**Як увімкнути.** Типово вимкнено. Адміністратор вмикає **Дозволити запитання щодо витрат** у налаштуваннях групи, в розділі **Функції**."
      - "**Як закрити.** Той, хто запитав, або адміністратор обирає **Закрити запитання**. Якщо кілька людей поставили під сумнів ту саму витрату, вона повертається до балансів, коли закрито останнє запитання."
      - "**Як редагувати.** Коли витрату змінюють, відкрите запитання переходить до нової версії для всіх, хто досі має в ній частку. Тим, кого редагування виключило, запитання закінчується зі старою версією, тож закривати їм нічого."
      - "**Як знайти.** У списку витрат є фільтр **Тільки поставлено під сумнів**. Це не етап схвалення: утримуються лише ті витрати, які хтось поставив під сумнів, а все інше враховується, щойно додане."
  - heading: "Як розгортається запитання"
    body: "Том додає 45 £ за вино для вечірки, розділені між усіма трьома сусідами. Айша не пила, тож ставить запитання, і поки воно відкрите, вино не враховується ні для кого. Будинок погоджується, що вино належить Тому й Пріє, тож Том змінює розподіл на них двох. Айши у витраті більше немає, тож її запитання закінчується зі старою версією, яку збережено, а вино повертається до балансів одразу, по 22,50 £ кожному замість 15 £. Якби Айша лишилася у витраті, її запитання перейшло б далі й чекало, доки вона чи адміністратор його закриє. Нижче 48 £ Айші — це 28 £ із закупів і 20 £ із прибиральниці, а 10,50 £ Пріі — це її частка 70,50 £ (28 £, 20 £ і 22,50 £) мінус 60 £, які вона заплатила. Дуже [сусідська](page:use-case/housemates) суперечка. Як сформулювати запитання, читайте в [що робити, коли хтось оскаржує спільну витрату](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "Спільні списки для покупок"
    body: "Заведіть у групі список, назвіть його, наприклад, «Список покупок», додайте позиції й відзначайте їх. Перетягуйте позиції в кращий порядок, дивіться, як росте лічильник прогресу, і коментуйте список, коли хтось купив не те вівсяне молоко. Заархівуйте завершений список, щоб прибрати його (**Показати архівовані** повертає його), або скопіюйте список, щоб використати знову. Тримайте спільний список покупок поруч із чеками за покупки: список каже, що купити, а витрата — скільки це коштувало. Хто може створювати й редагувати списки, залежить від дозволів групи, які пояснює [групи та дозволи](page:feature/groups-and-permissions)."
  - heading: "Опитування, анонімні за бажанням"
    body: "Запитайте групу про те, від чого залежить рахунок, наприклад яку віллу обрати, скільки витратити на подарунок чи чи вартий поїздки на човні. В опитування є запитання і від двох до десяти варіантів. Ви обираєте, скільки голосів має кожен, від одного вибору до десяти, і чи буде голосування анонімним. **Анонімне голосування** приховує, хто за що голосував, і його не можна змінити, щойно надійшов перший голос. Люди можуть змінити чи зняти свій голос, доки опитування не закрито, а ви можете відкрити його знову, якщо група передумала. Вибір вілли — це саме те, з чого складаються [групові подорожі](page:use-case/group-trips), а узгодження бюджету подарунка — класика для [подій і свят](page:use-case/events-and-celebrations)."
  - heading: "Стрічка активності, щоб нічого не змінювалося тихо"
    body: "У кожної групи є історія активності, а дзвіночок сповіщень збирає активність з усіх ваших груп в одному місці. Додайте витрату, і всі побачать її одразу, без оновлення сторінки, а стрічка покаже, що змінилося і хто це змінив. Це охоплює додані, змінені чи видалені витрати, поставлені й закриті запитання, коментарі, зміни списків та опитувань і записані платежі."
  - heading: "Push-сповіщення, якщо хочете"
    body: "Push-сповіщення необов'язкові. Увімкніть їх у **Налаштуваннях** облікового запису, в розділі **Сповіщення**, і ваш пристрій даватиме знати про нову активність у ваших групах, як-от нову витрату чи коментар. Кожен пристрій вмикається окремо, а браузер спершу запитає дозволу. На iPhone чи iPad вони працюють лише в застосунку, доданому на головний екран, про що розповідає сторінка про [вебзастосунок](page:feature/web-app). Вважайте їх зручністю, а не обіцянкою, бо доставку не гарантовано."
limits:
  heading: "Обмеження"
  items:
    - "Коментарі, списки й опитування призначені для грошей групи. [Умови](page:terms) просять, щоб усе опубліковане стосувалося групових фінансів, тож це місце для планування витрат, а не загальний чат чи застосунок для завдань."
    - "Коментар може містити до 500 символів і до трьох вкладень, зображень або PDF, до 5 МБ кожне. Видалити коментар може лише його автор."
    - "Запитання щодо витрат типово вимкнено, і адміністратор вмикає їх для кожної групи. Поставити витрату під сумнів можуть лише люди, включені до неї, вимкнення функції очищує всі відкриті запитання, а вийти з групи не можна, поки відкрите запитання стосується витрати, в якій ви берете участь."
    - "У групі може бути до 100 списків, кожен до 200 позицій по 500 символів. Дозволи групи визначають, хто може створювати, редагувати й видаляти списки, а заблокована група не допускає змін."
    - "У групі може бути до 50 опитувань, кожне з двома–десятьма варіантами й до десяти голосів на людину. Опитування не мають строку й самі не закриваються."
    - "Історію активності зберігають 90 днів."
    - "Push-сповіщення вмикаються окремо для кожного облікового запису й кожного пристрою. Їм потрібен браузер, що їх підтримує, і ваш дозвіл, на iPhone і iPad вони працюють лише із застосунку, доданого на головний екран, а доставку не гарантовано. Сповіщень про активність електронною поштою чи SMS немає, як і нагадувань про платежі, тож наздоганяти платіж усе одно вам."
useCasesHeading: "Де допомагає спільне планування"
faq:
  heading: "Запитання"
  items:
    - q: "Чи можуть голоси бути анонімними?"
      a: "Так. Увімкніть **Анонімне голосування**, коли створюєте опитування, і воно приховає, хто за що голосував. Вирішіть до першого голосу, бо потім змінити не можна."
    - q: "Чи може опитування закритися само?"
      a: "Ні. Опитування не має строку, тож той, хто його створив, обирає **Закрити опитування**, коли група вирішила. Якщо група передумала, **Відкрити опитування знову** повертає його."
    - q: "Скільки позицій може вмістити список?"
      a: "До 200 позицій у списку й до 100 списків у групі. Кожна позиція може містити до 500 символів, а це багато вівсяного молока."
    - q: "Хто може закрити запитання і що тим часом із витратою?"
      a: "Той, хто запитав, або адміністратор групи. Поки запитання відкрите, вся витрата поза балансами всіх. Вона повертається, коли закрито останнє відкрите запитання щодо неї або коли редагування виключає з витрати того, хто запитав."
    - q: "Чи можна використовувати списки й коментарі як застосунок для завдань або груповий чат?"
      a: "Ні. Коментарі, списки й опитування призначені для грошей групи, чого й просять [умови](page:terms). Думайте про списки покупок, бюджетні опитування та «чому це 45 £?»."
    - q: "Чи надсилатиме Side Badger електронні листи про активність?"
      a: "Ні. Сповіщень про активність електронною поштою чи SMS немає. Ви можете ввімкнути push-сповіщення на кожному пристрої, а дзвіночок сповіщень у застосунку показує, що нового."
