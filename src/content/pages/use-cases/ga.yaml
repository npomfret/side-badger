meta:
  title: "Side Badger do chomhchónaitheoirí, turais agus cóisirí"
  description: "Roinn costais le comhchónaitheoirí, ar thurais ghrúpa, agus do chóisirí, póstaí agus bronntanais ghrúpa. Féach cad a dhéanann Side Badger do gach cineál grúpa."
h1: "Side Badger do do chineál grúpa"
navLabel: "Cásanna úsáide"
lead: "Comhchónaitheoirí, laethanta saoire, cóisirí. Roghnaigh do chaos, ansin féach conas a choinníonn grúpa cosúil le do ghrúpa féin an cuntas."
intro: "Roinneann gach grúpa costais beagán difriúil. Leanann na leathanaigh seo **cás réalaíoch** ón gcéad chostas go dtí an íocaíocht dheireanach a taifeadadh, agus na suimeanna léirithe, ionas gur féidir leat a fheiceáil cad a gheobhadh do ghrúpa féin."
cta:
  heading: "An bhfuair tú do chineál grúpa?"
  body: "Cruthaigh cuntas, tosaigh grúpa agus cuir an chéad chostas leis. Tógann sé cúpla nóiméad."
  button: "Cruthaigh cuntas saor in aisce"
cardsHeading: "Roghnaigh an cás is gaire do do chás féin"
sections:
  - heading: "Turais ghrúpa"
    body: "Eitiltí i bpunt, teach saoire in euro agus dinnéar nár ith ach triúr. Socraigh an grúpa le tiontú go punt agus bíonn trí íocaíocht ag ceathrar cairde i Liospóin, in ionad sé cinn nuair a choinnítear na hairgeadraí ar leith. [Roinn costais turais ghrúpa](page:use-case/group-trips)."
  - heading: "Comhchónaitheoirí"
    body: "Íocann duine amháin an tiarna talún, cuimhníonn duine eile ar bhille fuinnimh, agus ní aontaíonn aon duine cé a cheannaigh an páipéar leithris. Le cíos roinnte de réir méid an tseomra agus na billí eile roinnte go cothrom, críochnaíonn ceathrar comhchónaitheoirí an mhí le trí íocaíocht, gach ceann acu chuig an té a d'íoc an cíos. [Roinn billí tí le comhchónaitheoirí](page:use-case/housemates)."
  - heading: "Cóisirí, póstaí agus bronntanais ghrúpa"
    body: "Vótálann seisear ar an mbronntanas, ceannaíonn duine amháin é, agus ní chuireann gach duine an méid céanna isteach. Fágann bronntanas £150 roinnte de réir suimeanna cruinne cúig íocaíocht chuig an duine a cheannaigh é, £120 san iomlán. [Roinn costais imeachta](page:use-case/events-and-celebrations)."
  - heading: "Lánúineacha"
    body: "Roinn na costais leadránacha gan oíche amach a iompú ina athbhreithniú airgeadais ráithiúil. Laghdaítear cíos roinnte 60/40 agus earraí grósaera roinnte go cothrom go dtí aon íocaíocht amháin eadraibh."
  - heading: "Féach conas a oibríonn sé ar dtús"
    body: "Úsáideann gach sampla thuas na céimeanna céanna, ó ghrúpa a chruthú go dtí íocaíochtaí a thaifeadadh. Siúlann [conas a oibríonn sé](page:how-it-works) tríd na céimeanna, agus insíonn [praghsáil](page:pricing) cad a chosnaíonn sé, rud nach bhfuil tada, gan fógraí agus gan teorainneacha laethúla."
faq:
  heading: "Ceisteanna"
  items:
    - q: "An gcaithfidh cuntas a bheith ag gach duine sa ghrúpa?"
      a: "Caithfidh. Téann daoine isteach le nasc nó cód QR agus cuntas saor in aisce."
    - q: "An féidir le Side Badger an t-airgead a bhailiú?"
      a: "Ní féidir. Íocann tú ar an gcaoi is fearr leat, ansin taifeadann tú an íocaíocht ionas go bhfuil na hiarmhéideanna ceart."
    - q: "An gcaithfidh mé aon chineál grúpa amháin a roghnú?"
      a: "Ní chaithfidh. Samplaí iad na cásanna úsáide, ní socruithe. Tá na gnéithe céanna ag gach grúpa, mar sin úsáid cibé meascán a oireann."
