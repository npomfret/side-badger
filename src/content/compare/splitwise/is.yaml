meta:
  title: "Side Badger á móti Splitwise: ókeypis borið saman | Side Badger"
  description: "Ókeypis valkostur við Splitwise, sanngjarn samanburður. Kvittanaskönnun, umreikningur og engar auglýsingar kosta ekkert og við segjum hvað Splitwise gerir betur."
h1: "Side Badger á móti Splitwise: ókeypis atriðin borin saman"
navLabel: "Side Badger á móti Splitwise"
lead: "Einhver í hópnum þínum hefur sennilega sagt „notið bara Splitwise“. Sanngjarnt. Side Badger er ókeypis vefapp með kvittanaskönnun, gjaldmiðlaumreikningi og án auglýsinga, og engin áskrift þarf til að opna þessa eiginleika. Hvort hentar hópnum þínum fer eftir því hvað hann þarf, svo hér er samanburðurinn, þar sem allt um Splitwise er tekið eingöngu af síðum Splitwise sjálfs."
cta:
  heading: "Prófaðu það á næsta sameiginlega reikningi"
  body: "Stofnaðu ókeypis aðgang, búðu til hóp og bættu við einu raunverulegu útgjaldi. Ef þetta hentar þér ekki hefurðu eytt nokkrum mínútum, ekki áskrift."
asOf: 2026-10-21
asOfNote: "Við lásum síður Splitwise sjálfs þann {date} svo þú þurfir þess ekki, og allt sem hér stendur um Splitwise kemur þaðan. Hver lína í töflunni vísar á heimild sína. Áskriftarleiðir breytast, svo við athugum aftur ársfjórðungslega, og ef síður Splitwise stangast á við þessa síðu skaltu trúa þeim."
