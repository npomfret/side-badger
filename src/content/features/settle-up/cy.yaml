sections:
  - heading: "Cofnodi taliad"
    body: "Pan fydd rhywun yn talu, cofnodwch ef yn erbyn y person iawn. Mae'r botymau setlo cyflym yn llenwi'r swm o'ch taliadau a awgrymir, a gallwch ychwanegu nodyn fel “trosglwyddiad banc” (hyd at 500 nod). Talwch ran yn unig o'r hyn sy'n ddyledus gennych ac mae'r gweddill yn aros ar y balans. Os ydych yn rhoi rhy ychydig neu ormod, mae Side Badger yn eich rhybuddio cyn i chi gadw. Mae cofnodi taliad angen caniatâd i olygu costau, ac ni all y dyddiad fod yn y dyfodol."
  - heading: "Talu mewn arian cyfred gwahanol?"
    body: "Mae balansau'n aros yn yr arian cyfred y'u talwyd ynddo, felly mae dyled ewro yn aros yn ddyled ewro. Yn ddyledus mewn ewros, ond am dalu mewn punnoedd? Dim problem. Gallwch drosi'r taliad wrth ei roi, ar gyfradd gyfnewid gyfredol neu ar y gyfradd a gawsoch mewn gwirionedd. Mae'r gyfradd yn sefydlog pan gaiff y taliad ei gadw. Mae [arian cyfred lluosog](page:feature/multiple-currencies) yn trafod sut mae trosi'n gweithio, ac mae [teithiau grŵp](page:use-case/group-trips) yn ei ddangos ar waith."
  - heading: "Hanes y gallwch ei wirio"
    body: "Mae pob taliad a gofnodir yn aros yn hanes y grŵp gyda'i ddyddiad, ei swm a'i nodyn. Dim ond y person a gofnododd daliad all ei olygu, a gall y person hwnnw neu weinyddwr y grŵp ei ddileu. Mae taliad sy'n cynnwys rhywun sydd wedi gadael y grŵp wedi'i gloi. Am senario cyd-letywyr wedi'i gweithio, gweler [cyd-letywyr](page:use-case/housemates)."
limits:
  heading: "Beth nad yw Side Badger yn ei wneud"
  items:
    - "Dyw Side Badger ddim yn symud arian, yn anfon dolenni talu nac yn anfon ceisiadau am daliad. Cofnod o daliad a wnaed mewn man arall yw taliad yn yr ap."
    - "Daw'r taliadau a awgrymir o ddull paru syml, a gymhwysir fesul arian cyfred. Mae bob amser yn awgrymu llai o daliadau na'r nifer o bobl sydd â balans yn yr arian cyfred hwnnw (pedwar person, tri thaliad ar y mwyaf), ond nid yw bob amser yn dod o hyd i'r nifer lleiaf posibl."
    - "Ni allwch ddiffodd yr awgrymiadau. Mae **Dangos y cyfan** yn rhestru pob taliad a awgrymir yn y grŵp, nid dim ond eich rhai chi."
    - "Ni chaiff arian cyfred byth eu netio yn erbyn ei gilydd oni bai bod y costau wedi'u trosi pan gawsant eu rhoi."
    - "Does dim nodiadau atgoffa, felly mae mynd ar ôl taliad yn dal i fod yn fater i chi."
useCasesHeading: "Lle mae setlo'n bwysig"
faq:
  heading: "Cwestiynau"
  items:
    - q: "Ydy Side Badger yn anfon yr arian?"
      a: "Nac ydy. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch y taliad yn Side Badger fel bod y balans yn diweddaru."
    - q: "Alla i ddiffodd y taliadau a awgrymir?"
      a: "Na. Mae symleiddio'n aros ymlaen, ac mae **Dangos y cyfan** yn rhestru pob taliad a awgrymir yn y grŵp, nid dim ond y rhai sy'n eich cynnwys chi."
    - q: "Pam mae ewros a phunnoedd yn cael eu cadw ar wahân?"
      a: "Mae balansau'n aros yn yr arian cyfred y gwnaethoch dalu ynddo oni bai eich bod yn trosi pan fyddwch yn rhoi cost neu daliad. Ni chaiff dyledion mewn gwahanol arian cyfred byth eu netio yn erbyn ei gilydd."
    - q: "Beth os yw rhywun yn talu rhan yn unig o'r hyn sy'n ddyledus ganddo?"
      a: "Cofnodwch y rhan a dalodd. Mae'r gweddill yn aros ar y balans nes ei dalu."
    - q: "Ai hwn yw'r nifer lleiaf posibl o daliadau bob amser?"
      a: "Nid yw wedi'i warantu. Mae bob amser yn awgrymu llai o daliadau na'r nifer o bobl sydd â balans yn yr arian cyfred hwnnw, felly ar gyfer pedwar person nid yw byth yn awgrymu mwy na thri. Yn enghraifft y cyd-letywyr, dau daliad yw hynny, lle roedd talu pob person yn ôl yn uniongyrchol yn cymryd chwech."
