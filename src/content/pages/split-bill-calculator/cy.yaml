faq:
  heading: "Cwestiynau"
  items:
    - q: "Ydy'r gyfrifiannell am ddim?"
      a: "Ydy. Am ddim. Dim hysbysebion. Dim cyfyngiadau dyddiol. Does dim angen cyfrif arnoch chwaith."
    - q: "Ydy hi'n cadw'r hyn rwy'n ei deipio?"
      a: "Nac ydy. Does dim yn cael ei gadw na'i anfon i unman. I gadw eich ffigurau, defnyddiwch Copïo dolen a chadwch y ddolen yn rhywle."
    - q: "Pwy all weld y ddolen rwy'n ei chopïo?"
      a: "Unrhyw un sydd â hi. Mae'r ffigurau yn y ddolen ei hun, ar ôl yr arwydd #, felly rhannwch hi dim ond â'r bobl a ddylai eu gweld."
    - q: "Ydy hi'n symud arian?"
      a: "Nac ydy. Mae'n gweithio allan pwy ddylai dalu i bwy, ac rydych chi'n talu eich gilydd sut bynnag y dymunwch. Dyw Side Badger byth yn cyffwrdd â'ch arian chwaith. Gweler [setlo](page:feature/settle-up)."
    - q: "Alla i rannu taith a dalwyd mewn dau arian cyfred?"
      a: "Nid yma, oherwydd mae gan y symiau un arian cyfred. Mewn grŵp, mae pob arian cyfred yn cadw ei falans ei hun. Gweler [arian cyfred lluosog](page:feature/multiple-currencies)."
    - q: "Beth os nad yw'r symiau'n adio?"
      a: "Mae'r gyfrifiannell yn dweud hynny o dan y gost ac nid yw'n dangos canlyniad nes eu bod yn adio. Rhaid i symiau union adio i'r cyfanswm, a rhaid i ganrannau wneud 100."
