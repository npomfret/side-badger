sections:
  - heading: "التعليقات والتفاعلات، بجانب الأرقام"
    body: "لكل مصروف سلسلة تعليقات خاصة به، وكذلك للمجموعة ولكل قائمة ولكل استطلاع. اسأل لماذا كلّف التاكسي هذا المبلغ تحت مصروف التاكسي نفسه، لا في دردشة لا يعود إليها أحد. أضف صورة للإيصال أو ملف PDF للحجز، ثم تفاعل بإبهام مرفوع أو قلب أو ضحكة أو دهشة أو حزن أو احتفال على المصروفات والدفعات والتعليقات. احتفل بالدفعة حين تصل. وهذا أقرب ما يصل إليه Side Badger من جولة تصفيق."
  - heading: "استفسر عن مصروف دون أن تبدأ شجاراً"
    body: "حين تكون أسئلة المصروفات مفعّلة في المجموعة، يستطيع كل من يشمله المصروف اختيار **لدي سؤال** وذكر السبب. يُنشر السؤال تعليقاً على المصروف، ويحصل المصروف على شارة **مستفسر عنه**، ويخرج المصروف كله من أرصدة الجميع إلى أن يُحسم السؤال."
    items:
      - "**تفعيلها.** هي معطّلة افتراضياً. يفعّل المشرف **السماح بأسئلة المصاريف** في إعدادات المجموعة، تحت **الميزات**."
      - "**إغلاقها.** يختار من سأل، أو مشرف، **إغلاق السؤال**. وإذا استفسر عدة أشخاص عن المصروف نفسه، فإنه يعود إلى الأرصدة حين يُغلق آخر سؤال."
      - "**عند تعديل المصروف.** حين يُعدَّل مصروف، ينتقل السؤال المفتوح إلى النسخة الجديدة لكل من ما زالت له حصة فيه. ومن يُخرجه التعديل من المصروف ينتهي سؤاله مع النسخة القديمة، فلا يبقى شيء ليغلقه."
      - "**العثور عليها.** في قائمة المصروفات مرشّح **المستفسر عنها فقط**. وهذه ليست خطوة موافقة: لا يُحجز إلا المصروفات التي يستفسر عنها أحد، وكل ما عداها يُحتسب بمجرد إضافته."
  - heading: "كيف يجري السؤال"
    body: "يضيف توم نبيذ حفلة بـ£45، مقسّماً بين زملاء السكن الثلاثة. لم تشرب عائشة، فتطرح سؤالاً، وما دام مفتوحاً فلا يُحتسب النبيذ على أحد. يتفق البيت على أن النبيذ لتوم وبريا، فيعدّل توم التقسيم ليكون بينهما. لم تعد عائشة في المصروف، فينتهي سؤالها مع النسخة السابقة التي تُحفظ، ويعود النبيذ إلى الأرصدة فوراً، £22.50 لكل منهما بدلاً من £15 لكل واحد. ولو بقيت عائشة في المصروف لانتقل سؤالها وانتظر أن تغلقه هي أو مشرف. وفي المثال أدناه، ما تدين به عائشة، £48، هو £28 من التسوق و£20 من خدمة التنظيف، وما تدين به بريا، £10.50، هو حصتها £70.50 (£28 و£20 و£22.50) ناقص £60 دفعتها. جدال من النوع الذي لا يعرفه إلا [زملاء السكن](page:use-case/housemates). وعن كيفية صياغة السؤال، انظر [ماذا تفعل حين ينازع أحد في مصروف مشترك](page:guide/what-to-do-when-someone-disputes-a-shared-expense)."
  - heading: "قوائم مشتركة، للتسوق"
    body: "ابدأ قائمة في المجموعة، وسمّها شيئاً مثل قائمة التسوق، وأضف العناصر وضع عليها علامات. اسحب العناصر إلى ترتيب أفضل، وشاهد عدّاد التقدم يرتفع، وعلّق على القائمة حين يشتري أحدهم حليب الشوفان الخطأ. أرشف القائمة المنتهية لترتيبها بعيداً (و**إظهار المؤرشفة** يعيدها)، أو انسخ قائمة لإعادة استخدامها. أبقِ قائمة التسوق المشتركة بجانب فواتير التسوق، فتقول القائمة ما يُشترى ويقول المصروف كم كلّف. ومن يستطيع إنشاء القوائم وتعديلها يعتمد على أذونات المجموعة، وهذا ما تشرحه [المجموعات والأذونات](page:feature/groups-and-permissions)."
  - heading: "الاستطلاعات، مجهولة إن شئت"
    body: "اسأل المجموعة عمّا يحدد الفاتورة، مثل أي فيلا، أو كم ننفق على الهدية، أو هل تستحق رحلة القارب العناء. للاستطلاع سؤال وخيارات من خيارين إلى عشرة. وتختار عدد الأصوات لكل شخص، من اختيار واحد حتى عشرة، وهل يكون التصويت مجهولاً. يخفي **التصويت المجهول** من صوّت لماذا، ولا يمكن تغييره بعد وصول أول صوت. ويستطيع الناس تغيير أصواتهم أو إزالتها إلى أن يُغلق الاستطلاع، وتستطيع إعادة فتحه إن راجعت المجموعة رأيها. واختيار الفيلا هو مادة [رحلات المجموعات](page:use-case/group-trips) تماماً، والاتفاق على ميزانية الهدية أمر كلاسيكي في [المناسبات والاحتفالات](page:use-case/events-and-celebrations)."
  - heading: "سجل النشاط، حتى لا يتغيّر شيء بصمت"
    body: "لكل مجموعة سجل نشاط، ويجمع جرس الإشعارات النشاط من كل مجموعاتك في مكان واحد. أضف مصروفاً فيراه الجميع على الفور، دون تحديث الصفحة، ويعرض السجل ما تغيّر ومن غيّره. ويشمل ذلك المصروفات المضافة أو المعدّلة أو المحذوفة، والأسئلة المطروحة والمغلقة، والتعليقات، وتغييرات القوائم والاستطلاعات، والدفعات المسجّلة."
  - heading: "الإشعارات الفورية، إن أردتها"
    body: "الإشعارات الفورية اختيارية. فعّلها في **الإعدادات** الخاصة بحسابك، تحت **الإشعارات**، فينبّهك جهازك حين يكون هناك نشاط جديد في مجموعاتك، مثل مصروف جديد أو تعليق. ويُفعَّل كل جهاز على حدة، ويطلب متصفحك الإذن أولاً. وعلى iPhone أو iPad لا تعمل إلا في التطبيق المضاف إلى الشاشة الرئيسية، وهذا ما توضحه صفحة [تطبيق الويب](page:feature/web-app). اعتبرها وسيلة راحة لا وعداً، لأن وصولها غير مضمون."
limits:
  heading: "الحدود"
  items:
    - "التعليقات والقوائم والاستطلاعات مخصصة لمال المجموعة. تطلب [الشروط](page:terms) أن يتعلق كل ما يُنشر بالشؤون المالية للمجموعة، فهذا مكان للتخطيط للإنفاق، لا للدردشة العامة ولا لتطبيق المهام."
    - "يمكن أن يصل التعليق إلى 500 حرف، مع ما يصل إلى ثلاثة مرفقات من الصور أو ملفات PDF بحجم يصل إلى 5 MB لكل منها. ولا يحذف التعليق إلا كاتبه."
    - "أسئلة المصروفات معطّلة افتراضياً، ويفعّلها المشرف لكل مجموعة. ولا يستفسر عن المصروف إلا من يشمله، وإيقاف الميزة يمسح كل الأسئلة المفتوحة، ولا يستطيع أحد مغادرة المجموعة ما دام هناك سؤال مفتوح عن مصروف هو طرف فيه."
    - "تتسع المجموعة لما يصل إلى 100 قائمة، في كل منها ما يصل إلى 200 عنصر، وطول كل عنصر يصل إلى 500 حرف. وتحدد أذونات المجموعة من يستطيع إنشاء القوائم وتعديلها وحذفها، والمجموعة المقفلة لا تسمح بأي تغيير."
    - "تتسع المجموعة لما يصل إلى 50 استطلاعاً، في كل منها من خيارين إلى عشرة خيارات وحتى عشرة أصوات للشخص. وليس للاستطلاعات موعد نهائي ولا تُغلق من تلقاء نفسها."
    - "يُحفظ سجل النشاط 90 يوماً."
    - "الإشعارات الفورية اختيارية لكل حساب ولكل جهاز. وتحتاج إلى متصفح يدعمها وإلى إذنك، وتعمل على iPhone وiPad من التطبيق المضاف إلى الشاشة الرئيسية فقط، ووصولها غير مضمون. ولا توجد تنبيهات بالبريد الإلكتروني أو بالرسائل النصية للنشاط ولا تذكيرات بالدفع، فمطالبة الناس بالدفع تبقى عليك."
