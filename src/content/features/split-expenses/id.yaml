meta:
  title: "Bagi pengeluaran secara merata, pasti, atau persentase | Side Badger"
  description: "Bagi biaya bersama secara merata, berdasarkan jumlah pasti, atau persentase, dan keluarkan siapa pun yang tidak hadir. Gratis, tanpa iklan dan tanpa batas harian."
h1: "Bagi pengeluaran secara merata, pasti, atau persentase"
navLabel: "Bagi pengeluaran"
lead: "Tidak semuanya 50/50. Side Badger bisa menanganinya. Catat siapa yang membayar, pilih orang yang ikut menanggung biaya, lalu bagi **secara merata, berdasarkan jumlah pasti, atau persentase**. Dendam dijual terpisah."
cta:
  heading: "Bagi yang berikutnya dengan benar"
  body: "Buat akun gratis, mulai grup, dan tambahkan pengeluaran yang sudah lama ingin Anda bereskan. Tidak yakin apa yang terjadi selanjutnya? Lihat [cara kerja](page:how-it-works), atau cek [apa saja yang gratis](page:pricing)."
  button: "Buat akun gratis"
problem:
  heading: "Tidak semuanya 50/50"
  body: "Sewa mengikuti ukuran kamar. Kado mengikuti siapa yang menjanjikan apa. Makan malam mengikuti siapa yang bertahan sampai makan pencuci mulut. Membagi tagihan dua berhasil sampai tagihan pertama yang tidak bisa, dan setelah itu seseorang membuka spreadsheet. Side Badger mencatat siapa yang membayar, siapa yang ikut menanggung, dan bagaimana pembagiannya, sehingga saldo keluar dengan benar tanpa ada yang berhitung panjang di meja makan."
workflow:
  heading: "Menambahkan pengeluaran, dari awal sampai akhir"
  steps:
    - title: "Catat siapa yang membayar dan untuk apa"
      body: "Masukkan jumlah, deskripsi singkat, dan orang yang membayar. Satu orang membayar untuk setiap pengeluaran, sehingga hitungannya tetap jujur."
      shot: S05
      shotAlt: "Formulir pengeluaran dengan sewa pondok dibagi persentase di antara tiga orang"
    - title: "Pilih pembagiannya"
      body: "Pilih rata, jumlah pasti, atau persentase. Persentase harus berjumlah 100, dan jumlah pasti harus berjumlah sama dengan totalnya."
      shot: S06
      shotAlt: "Formulir pengeluaran dengan jumlah pasti yang dimasukkan untuk setiap orang pada sebuah kado"
    - title: "Tambahkan ceritanya"
      body: "Atur tanggal, tambahkan label, tempat, dan catatan. Semua orang dalam grup melihat detail yang sama, dan bisa berkomentar langsung di sana."
      shot: S08
      shotAlt: "Sebuah pengeluaran dengan detailnya, utas komentar, dan jumlah asli saat dimasukkan"
    - title: "Ajukan pertanyaan jika ada yang janggal"
      body: "Jika grup mengaktifkan pertanyaan pengeluaran, siapa pun yang termasuk dalam sebuah pengeluaran bisa mempertanyakannya, dan daftar pengeluaran bisa menampilkan hanya yang dipertanyakan."
      shot: S18
      shotAlt: "Daftar pengeluaran dengan lencana Dipertanyakan dan filter Hanya yang dipertanyakan"
options:
  heading: "Tiga cara membagi"
  items:
    - title: "Merata"
      body: "Bawaan untuk makan malam, taksi, dan apa pun yang dinikmati bersama secara merata. Jika totalnya tidak habis dibagi, sisa sen diberikan kepada satu orang secara acak, tidak selalu orang yang sama. Pada taksi di bawah, itu Ana."
    - title: "Berdasarkan jumlah pasti"
      body: "Ketik berapa yang harus dibayar tiap orang. Cocok untuk kado yang harganya dipilih berbeda-beda, atau belanja ketika troli satu orang berisi lebih banyak daripada belanjaan bersama. Jumlahnya harus berjumlah sama dengan totalnya."
    - title: "Berdasarkan persentase"
      body: "Beri tiap orang bagian dari total. Sewa menurut ukuran kamar adalah contoh klasiknya, dengan kamar terbesar menanggung bagian terbesar dan tak ada yang berpura-pura sebaliknya."
