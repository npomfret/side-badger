meta:
  title: "ماشین‌حساب تقسیم صورت‌حساب: بدهکار و طلبکار مشخص | Side Badger"
  description: "چه کسی پرداخت کرد و چه کسی به چه کسی بدهکار است، در چند ثانیه مشخص می‌شود. مساوی، دقیق یا درصدی تقسیم کنید. رایگان، در مرورگر شما، بدون ذخیره یا ارسال."
h1: "ماشین‌حساب تقسیم صورت‌حساب"
navLabel: "ماشین‌حساب تقسیم صورت‌حساب"
lead: "بنویسید چه کسی برای چه چیزی پول داده تا ماشین‌حساب بگوید چه کسی به چه کسی بدهکار است و فهرست کوتاهی از پرداخت‌ها برای تسویه‌اش بدهد. در مرورگر شما اجرا می‌شود، چیزی ذخیره نمی‌کند و پولی جابه‌جا نمی‌کند. اگر گروه شما می‌خواهد حساب بعد از بسته شدن زبانه هم بماند، [تقسیم هزینه‌ها](page:feature/split-expenses) و [تسویه حساب](page:feature/settle-up) در Side Badger همین محاسبه‌ها را انجام می‌دهند و نگه‌شان می‌دارند."
cta:
  heading: "از حساب‌کتاب خوشتان آمد؟ نگهش دارید."
  body: "این ماشین‌حساب وقتی زبانه را ببندید همه‌چیز را فراموش می‌کند، درست مثل آن‌که مطمئن است دفعه قبل خودش پرداخت کرده. یک گروه در Side Badger هزینه‌ها را نگه می‌دارد، مانده همه را به‌روز می‌کند و پرداخت‌ها را ثبت می‌کند. رایگان است، بدون تبلیغات و بدون محدودیت روزانه."
sections:
  - heading: "محاسبه چطور کار می‌کند"
    body: "ماشین‌حساب برای هر هزینه سهم هر نفر را حساب می‌کند. می‌توانید آن را بین افرادی که انتخاب می‌کنید مساوی، با مبلغ دقیق یا با درصد تقسیم کنید. مانده هر نفر برابر است با آنچه پرداخته منهای آنچه بدهکار است. علامت مثبت یعنی گروه به او بدهکار است و علامت منفی یعنی او به گروه بدهکار است. جمع مانده‌ها همیشه صفر می‌شود، چون هر چه یک نفر طلبکار است، دیگران بدهکارند."
  - heading: "چرا فهرست پرداخت‌ها کوتاه است"
    body: "لازم نیست هر رسید جداگانه تسویه شود. وقتی مانده همه معلوم شد، ماشین‌حساب کسی را که بیشترین بدهی را دارد با کسی که بیشترین طلب را دارد جفت می‌کند، تا جایی که با یک پرداخت می‌شود تسویه می‌کند، و همین‌طور فهرست را پایین می‌رود تا همه به صفر برسند. هرگز بیش از «تعداد افراد دارای مانده، منهای یک» پرداخت لازم ندارد، و اغلب پرداخت‌هایش از تسویه صورت‌حساب‌به‌صورت‌حساب کمتر است. فهرست کوتاهی از پرداخت‌ها می‌دهد و قول نمی‌دهد کوتاه‌ترین فهرست ممکن باشد."
  - heading: "کارهایی که ماشین‌حساب نمی‌کند"
    items:
      - "**کار با بیش از یک ارز.** یک ارز انتخاب کنید و در کل محاسبه از همان استفاده کنید. برنامه برای هر ارز مانده جداگانه نگه می‌دارد و می‌تواند یک هزینه را با نرخ تبدیل روز تبدیل کند، که می‌توانید آن را تغییر دهید."
      - "**ذخیره کردن چیزی.** زبانه را ببندید، عددها از بین می‌روند. برای نگه داشتنشان لینک را کپی کنید. عددهای شما بعد از # در لینک هستند، که مرورگر هرگز آن را به سرور نمی‌فرستد، و هر کسی که لینک را برایش بفرستید می‌تواند آن‌ها را بخواند."
      - "**جابه‌جا کردن پول.** فقط می‌گوید چه کسی باید به چه کسی بپردازد. هر طور دوست دارید به هم پرداخت می‌کنید و اگر گروهتان حسابش را در برنامه نگه می‌دارد، بعد پرداخت را آنجا ثبت می‌کنید."
      - "**انتخاب تصادفی پول خرد اضافه.** وقتی صورت‌حسابی دقیق تقسیم نمی‌شود، پول خرد باقی‌مانده به اولین نفرهای فهرست می‌رسد تا جمع‌ها همچنان درست دربیاید. در برنامه، پول خرد اضافه به‌صورت تصادفی به یک نفر می‌رسد، پس همیشه همان یک نفر نیست."
      - "**فراتر رفتن از محدودیت‌ها.** ماشین‌حساب از 2 تا 20 نفر را می‌پذیرد و هر هزینه می‌تواند تا 999,999.99 باشد، مثل برنامه."
