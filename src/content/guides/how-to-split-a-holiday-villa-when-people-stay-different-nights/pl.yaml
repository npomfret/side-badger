faq:
  heading: "Pytania o willę"
  items:
    - q: "A jeśli ktoś zrezygnuje?"
      a: "Odejmij noce tej osoby, przelicz i edytuj wydatek za willę, żeby dokładne kwoty znów dawały w sumie cenę. Wcześniejsza wersja zostaje zachowana, a edycja widnieje w aktywności grupy, więc nikt nie zmienia liczby po cichu. Kto może edytować, zależy od uprawnień grupy."
    - q: "Czy osoba, która rezerwowała, powinna płacić mniej?"
      a: "To decyzja grupy. Rezerwacja to obowiązek i grupy różnie podchodzą do tego, czy należy się za nią zniżka. Cokolwiek ustalicie, wpiszcie to w dokładne kwoty i zapiszcie w notatce przy wydatku albo w komentarzu obok, żeby nikt nie musiał pamiętać umowy."
    - q: "Czy opłatę za sprzątanie możemy podzielić inaczej?"
      a: "Tak. Wpisz opłatę jako osobny wydatek i nadaj mu własny podział. Po równo pasuje do stałej opłaty za cały dom. Dokładne kwoty pasują do grupy, która chce, żeby opłata też podążała za nocami."
