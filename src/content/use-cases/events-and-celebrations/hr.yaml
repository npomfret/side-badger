featuresHeading: "Značajke koje ovo koristi"
faq:
  heading: "Pitanja"
  items:
    - q: "Mogu li gosti vidjeti grupu bez pridruživanja?"
      a: "Ne. Ljudi se pridružuju poveznicom ili QR kodom i besplatnim korisničkim računom, pa grupu vide tek kad uđu."
    - q: "Može li Side Badger prikupljati novac?"
      a: "Ne. Side Badger vodi evidenciju i nikad ne premješta novac. Platite si kako god želite, a zatim zabilježite uplatu. Besplatan je, bez oglasa i bez dnevnih ograničenja; vidi [cjenik](page:pricing)."
    - q: "Mogu li glasovi biti anonimni?"
      a: "Da. Pri stvaranju ankete možeš sakriti tko je za što glasao. Postavke se mogu mijenjati samo prije prvog glasa."
    - q: "Mogu li ljudi doprinijeti različite iznose?"
      a: "Da. Podijeli trošak po točnim iznosima, pa je udio svake osobe iznos o kojem ste se dogovorili, ili izostavi osobe koje nisu sudjelovale."
    - q: "Može li organizator voditi knjige?"
      a: "Da. Koristi predložak upravljane grupe, pa troškove mijenjaju samo osnivači i administratori, a administratori odobravaju nove članove."
