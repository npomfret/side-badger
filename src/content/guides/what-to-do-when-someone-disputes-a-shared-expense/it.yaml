meta:
  title: "Cosa fare se qualcuno contesta una spesa condivisa | Side Badger"
  description: "Basta frecciatine. Fai una domanda sulla spesa e, finché ne parlate, esce dai saldi di tutti. Esempio svolto con 45 £ di vino per la festa."
h1: "Cosa fare se qualcuno contesta una spesa condivisa"
navLabel: "Spese contestate"
lead: "Fai una domanda sulla spesa invece di mandare un messaggio con la frecciatina. Finché la domanda è aperta, l'intera spesa resta fuori dai saldi di tutti. Parlatene nei commenti, modifica la divisione se il gruppo è d'accordo e lascia che a chiudere la domanda sia la persona che l'ha fatta, o un admin."
cta:
  heading: "Fai la domanda scomoda con garbo"
  body: "Crea un account gratuito, avvia un gruppo per la casa e chiedi a un admin di attivare le domande sulle spese, che restano disattivate finché qualcuno non lo fa. Vuoi prima fare un giro? Vedi [come funziona](page:how-it-works) oppure [cosa include la versione gratuita](page:pricing)."
sections:
  - heading: "Tre coinquilini e 45 £ di vino"
    body: "Dopo la festa, Tom aggiunge il vino al gruppo della casa. Sono 45 £, pagate da Tom, divise in parti uguali tra Tom, Priya e Aisha, cioè 15 £ a testa. Aisha non beve. Tom l'ha comprato per la festa, e la festa era per la [casa](page:use-case/housemates), quindi non ha fatto niente di sbagliato. Nemmeno Aisha sbaglia a chiedere. Qui nessuno è il cattivo. Ci sono solo 15 £ di vino in ballo e molti modi per renderlo imbarazzante. Un messaggio con la frecciatina a tutta la casa è uno. Una domanda sulla spesa è uno più gentile."
  - heading: "Cosa fa una domanda"
    body: "Aisha apre la spesa e fa una domanda. L'intera spesa esce dai saldi di tutti, non solo la sua parte, e nient'altro cambia. La maxi spesa (84 £) e le pulizie (60 £) contano ancora, cioè 28 £ + 20 £ = 48 £ a testa. Quindi, mentre il vino è in sospeso, Aisha deve 48 £, Tom deve ricevere 36 £ e Priya 12 £. Qualunque cosa decida la casa sul vino, nel frattempo il saldo di nessuno lo include. Anche chiunque altro faccia parte della spesa può fare una domanda per conto suo. Il vino torna nei saldi solo quando si chiude l'ultima domanda aperta su di esso, e una domanda la chiude la persona che l'ha fatta o un admin."
  - heading: "Parlarne, poi sistemarla"
    body: "La domanda di Aisha finisce nei commenti della spesa, quindi le risposte stanno proprio sotto. [Pianificare insieme](page:feature/plan-together) spiega meglio commenti e domande. Tom e Priya la leggono e la casa fa due chiacchiere. Decidono che il vino era di Tom e Priya, perché se lo sono bevuto loro. Un'altra casa potrebbe tenere la divisione in tre, o accordarsi su qualcosa nel mezzo, e andrebbe bene lo stesso. Side Badger conserva ciò che concordate e sul vino non ha opinioni. Tom modifica la spesa in modo che sia divisa in parti uguali tra lui e Priya, cioè 22,50 £ a testa (45 £ ÷ 2). Aisha non ne fa più parte, quindi la sua domanda se ne va con la vecchia versione e il vino rientra nei saldi. La versione precedente resta salvata."
  - heading: "Leggere il risultato"
    body: "Con il vino di nuovo dentro, Tom deve ricevere 58,50 £, Priya deve 10,50 £ e Aisha deve 48 £. Side Badger suggerisce due pagamenti, entrambi a Tom. Le 48 £ di Aisha sono la cifra che aveva mentre il vino era in sospeso, perché lei non ne fa parte. Priya è passata da dover ricevere 12 £ a doverne 10,50 £, che è la sua metà del vino, 22,50 £. Se la divisione in tre fosse rimasta, Aisha avrebbe dovuto 63 £ (28 £ + 20 £ + 15 £). Tutto il disaccordo valeva 15 £. Pagatevi come vi fa più comodo, poi registrate ogni pagamento sotto **Salda**. [Saldare i conti](page:feature/settle-up) spiega il resto."
  - heading: "Come scriverla perché le persone continuino a parlarti"
    body: "La domanda di Aisha: \"Non ho bevuto niente di quel vino. Possiamo guardare la divisione?\" È breve, nomina la spesa e chiede invece di accusare. Qualche abitudine aiuta."
    items:
      - "**Chiedi della spesa, non della persona.** \"Possiamo controllare la divisione sul vino?\" apre una conversazione. \"Perché mi hai fatto pagare il tuo vino?\" ne apre una di tutt'altro genere."
      - "**Di' cosa vorresti che succedesse.** \"Potremmo dividerlo solo tra chi l'ha bevuto?\" dà al gruppo qualcosa a cui dire sì o a cui rispondere."
      - "**Dai un motivo in una o due frasi.** Il campo è **La tua domanda** e non può restare vuoto."
      - "**Tieni le risposte in un posto solo.** Le risposte vanno nei commenti della spesa, accanto ai numeri di cui parlano."
  - heading: "Impostalo in Side Badger"
    items:
      - "**Attiva le domande.** Sono disattivate di default. Un admin apre le **Impostazioni** del gruppo, attiva **Consenti domande sulle spese** sotto **Funzionalità** nella scheda **Generale** e sceglie **Salva**. Disattivarle in seguito cancella ogni domanda aperta."
      - "**Falla.** Apri la spesa e, accanto al tuo nome nella divisione, scegli **Ho una domanda**. Scrivi il motivo in **La tua domanda** e scegli di nuovo **Ho una domanda**. Possono farlo solo le persone coinvolte nella spesa. La spesa ora mostra l'etichetta **In discussione**."
      - "**Trova cosa è in sospeso.** Nell'elenco delle spese, **Solo in discussione** mostra le spese con una domanda aperta."
      - "**Sistemala, se il gruppo è d'accordo.** Apri la spesa, scegli **Modifica**, cambia **Dividi tra** e scegli **Aggiorna spesa**. Chi può modificare dipende dai permessi del gruppo."
      - "**Chiudila, se non c'è niente da sistemare.** La persona che l'ha fatta può usare il pulsante di chiusura sulla sua etichetta **In discussione**, chiamato **Chiudi domanda**, e lo stesso vale per un admin. La spesa torna nei saldi quando l'ultima domanda è chiusa."
  - heading: "Quando non è così ordinato"
    items:
      - "**La modifica tiene dentro chi ha chiesto.** Se la persona che ha fatto la domanda è ancora nella spesa, la sua domanda passa alla versione modificata e aspetta che lei, o un admin, la chiuda. Correggere l'importo non significa essere d'accordo che sia sistemato."
      - "**Non eri nella spesa.** Solo le persone coinvolte in una spesa possono metterla in discussione. Se a te qualcosa non torna, scrivilo nei commenti o chiedilo a chi l'ha aggiunta."
      - "**Qualcuno vuole lasciare il gruppo.** Una domanda aperta impedisce alle persone coinvolte nella spesa di andarsene. Chiudi la domanda, o modifica la spesa in modo che non ne facciano più parte, e potranno andare."
  - heading: "Cosa Side Badger non fa qui"
    items:
      - "Non decide chi ha ragione. Tiene la spesa fuori dai saldi e conserva ciò che concordate."
      - "Non chiede a nessuno di approvare le spese prima che contino. Viene trattenuta solo una spesa messa in discussione."
      - "Non può trattenere una parte di una spesa. Fai una domanda e l'intera spesa esce dai saldi."
      - "Non sposta denaro. Vi pagate come vi fa più comodo e lo registrate."
