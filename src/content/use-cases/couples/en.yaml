featuresHeading: The features a couple uses
faq:
  heading: Questions
  items:
    - q: Can we set 60/40 once for everything?
      a: No. The split belongs to each expense. Set the percentages on the first one, then copy it next time and change what's different. [Split expenses](page:feature/split-expenses) covers all three ways to split.
    - q: Does it link to our bank?
      a: No. Side Badger never touches your money. You pay each other however you like, then record it, as [settle up](page:feature/settle-up) explains.
    - q: Can anyone else see our group?
      a: Only its members, and a couple's group has two. Anyone who uses a live invite link can join, so share it with one person and give it a short expiry.
    - q: What if we each paid part of the same bill?
      a: An expense has one payer. Record two expenses, one for each of you, and the balance comes out the same.
    - q: Will it remind my partner to pay?
      a: No. There are no reminders, so the nudge is still yours. At least you will both be looking at the same number.
    - q: What happens when we stop sharing costs?
      a: Settle the balance and record the payment, so nobody owes anything. Then an admin can lock the group, which keeps the numbers as they are, or close it for good, which makes it inaccessible to everyone. Close it only when neither of you needs the history.
