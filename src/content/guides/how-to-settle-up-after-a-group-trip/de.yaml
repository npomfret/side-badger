faq:
  heading: "Fragen"
  items:
    - q: "Wer sollte eine Zahlung erfassen, die zahlende oder die empfangende Person?"
      a: "Zum Erfassen einer Zahlung brauchst du die Berechtigung, Ausgaben zu bearbeiten, und das Formular fragt **Wer hat bezahlt?** und **Wer hat die Zahlung erhalten?** Nur die Person, die sie erfasst hat, kann sie später bearbeiten, am einfachsten ist es also meist, wenn die zahlende Person es mit der Schnellausgleich-Schaltfläche macht."
    - q: "Was, wenn die Reise in zwei Währungen lief?"
      a: "Salden werden pro Währung geführt, eine Euro-Schuld bleibt also eine Euro-Schuld, und jede Währung bekommt ihre eigene kurze Liste, es sei denn, Ausgaben wurden bei der Eingabe umgerechnet. [Mehrere Währungen](page:guide/how-to-split-a-trip-paid-in-several-currencies) zeigt beide Wege."
    - q: "Sollten wir während der Reise abrechnen oder am Ende?"
      a: "Beides geht. Jede erfasste Zahlung ändert die Salden, eine Zahlung mitten auf der Reise zählt also für die endgültige Liste. Am Ende ist es einfacher, weil [die ganze Reise](page:use-case/group-trips) an einem Ort liegt."
