meta:
  title: "家賃の割り勘計算機：部屋の広さか収入で分ける | Side Badger"
  description: "広い部屋は、多めの負担？ルームメイトそれぞれの家賃を、部屋の広さか収入で計算できます。ブラウザ上で動作し、保存も送信もしません。"
h1: 家賃の割り勘計算機
navLabel: 家賃の割り勘計算機
lead: 寝室が広ければ、負担も多め？家賃を入力すると、部屋の広さか収入に応じて、一人ひとりがいくら払うかが1ペニー単位でわかります。ブラウザ上で動作し、何も保存せず、お金も動かしません。家で記録を残したくなったら、Side Badgerで[支出を割り勘](page:feature/split-expenses)して、毎月家賃をコピーしましょう。
cta:
  heading: 割合は一度決めたら、ずっとコピー
  body: この計算機は、タブを閉じるとすべて忘れます。インターネット代は絶対に払ったと言い張るルームメイトのように。Side Badgerのグループなら、家賃も請求書も、誰が何を払ったかも保存されます。無料で、広告も1日の制限もありません。
sections:
  - heading: 家賃の分け方は2通り
    items:
      - "**部屋の広さで**。家賃の一部は、全員が使うキッチン、バスルーム、リビングの分です。その割合を自分で選び（最初は40%）、均等に分けます。残りは寝室の広さで分けるので、広い部屋は多く払い、納戸サイズの部屋は、それにふさわしい割引を受けられます。"
      - "**収入で**。全員の収入の合計に占める自分の収入の割合と同じだけ、家賃を負担します。共有の請求書を加えると、同じ割合で分けます。"
  - heading: 計算の仕組み
    body: "一人ひとりにまず正確な負担割合を出し、次に整数のパーセンテージにします。整数のほうが入力しやすく、言い争いもしやすいからです。端数処理は最大剰余方式です。全員がまず負担割合の整数部分を受け取り、余ったポイントは、切り捨てで失った分が一番大きい人から順に配られます。割合の合計はつねに100になります。下の家では、共用部分の40%は、1人あたり13.33%です。Priyaの部屋は、この家の38m²のうち16m²なので、60% × 16/38 は25.26%で、これに13.33%を足すと38.6%、四捨五入して39%になります。TomとAishaは32%と29%になり、39 + 32 + 29 は100です。各金額は、この割合を家賃にかけたものです。£1,950の39%は£760.50です。"
  - heading: そのあと、Side Badgerに入力する
    body: "メジャーも含めた一部始終は、[部屋の広さで家賃を分ける方法](page:guide/how-to-split-rent-by-room-size)を、カップルなら[収入の多いパートナーとの割り勘](page:guide/how-to-split-bills-with-a-partner-who-earns-more)をご覧ください。"
    items:
      - "**家賃を追加する**。グループで**経費を追加**を選び、「**誰が支払いましたか？**」で大家さんに支払った人を選び、**割り勘相手**は全員のままにします。"
      - "**パーセンテージを選ぶ**。フォームの**割り勘方法**で**パーセンテージ**を選び、整数の割合を入力します。合計が100にならない場合は、フォームが知らせます。"
      - "**来月はコピーする**。先月の家賃を開いて**経費をコピー**を選びます。分け方もそのままついてきます。"
  - heading: 計算機にできないこと
    items:
      - "**部屋の価値を測ること**。床面積は出発点にすぎません。専用のバス・トイレ付きの部屋は、同じ広さでも付いていない部屋より価値があり、ベッドと、置けたらいいなと思う椅子がやっと入る納戸は、それより価値が下がります。"
      - "**何が収入かを決めること**。手取りか額面か、給料か副業か。それはグループで決めてください。全員同じ期間で入力してください。"
      - "**保存**。タブを閉じると数字は消えます。残すにはリンクをコピーしてください。リンクには数字が#の後ろに入っていて、ブラウザがその部分をサーバーに送ることはありませんが、リンクを持っている人は誰でも読めます。"
      - "**お金を動かすこと**。大家さんへの支払いは好きな方法で行ってください。"
      - "**通貨を混ぜること、上限を超えること**。通貨は1つ選んでください。扱えるのは2～10人、家賃は999,999.99までで、アプリと同じです。"
exampleAfter: 2
