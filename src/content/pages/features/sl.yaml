meta:
  title: "Kaj Side Badger zna in česa ne"
  description: "Delitev, poravnava in več valut, poleg tega skupine, seznami in ankete. Celoten nabor in pošten seznam tega, česar Side Badger ne dela."
h1: "Kaj zna Side Badger"
navLabel: "Funkcije"
lead: "Vse, kar je v škatli, in kar ni."
intro: "Tu je celoten nabor. Preglednico smo namerno izpustili. Začni s tremi opravili, ki jih Side Badger opravlja vsak dan, nato preglej preostanek seznama in kratek seznam stvari, ki jih ne počne."
cta:
  heading: "Ali naredi, kar tvoja skupina potrebuje?"
  body: "Ustvari brezplačen uporabniški račun in ga najprej preizkusi z majhno skupino."
  button: "Ustvari brezplačen račun"
cardsHeading: "Tri opravila podrobno"
sections:
  - heading: "Skeniranje računov"
    body: "Slikaj račun in Side Badger izpolni skupni znesek, datum in kraj, da jih preveriš. Slike računov bere Googlova storitev umetne inteligence."
  - heading: "Skupine in dovoljenja"
    body: "Ustanovi skupino za vsako hišo, potovanje ali dogodek, z do 50 osebami. Povabi ljudi s povezavo ali kodo QR. V večji skupini lahko koga narediš za gledalca, ki vidi vse in ničesar ne spreminja."
  - heading: "Seznami in ankete"
    body: "Skupni nakupovalni seznam imej ob računih za nakupe. O ožjem izboru vil pusti glasovati, po želji anonimno."
  - heading: "Vse ostalo"
    items:
      - "**Posodobitve v živo:** dodaj strošek in vsi ga takoj vidijo."
      - "**Jeziki:** Side Badger uporabljaj v 39 jezikih. Vsak v skupini lahko izbere svojega."
      - "**Začetni zaslon:** trgovina z aplikacijami ni potrebna. Prijavi se, nato Side Badger dodaj na začetni zaslon in odpre se kot aplikacija. Kako, ti pokažejo nastavitve v aplikaciji."
      - "**Povratne informacije:** naletiš na napako? Sporoči nam iz aplikacije in tam preberi naš odgovor."
  - heading: "Česa Side Badger ne počne"
    items:
      - "**Ne premika denarja.** Side Badger se tvojega denarja nikoli ne dotakne. Plačajte si, kakor želite. Zahtevki za plačilo so v načrtu."
      - "**Ne ponavlja računov.** Ponavljajočih se stroškov ni. Račun prejšnjega meseca kopiraj z dvema dotikoma."
      - "**Ne deli po postavkah.** Za strošek plača ena oseba. Deli enako, točno ali po odstotkih."
      - "**Nima domače aplikacije.** Deluje v brskalniku. Prijavi se, nato ga dodaj na začetni zaslon."
      - "**Ne deluje brez povezave.** Potrebuje povezavo."
      - "**Ne pošilja opozoril po e-pošti ali SMS.** Obvestila se prikažejo v aplikaciji. Potisna obvestila so v načrtu."
      - "**Ne riše grafikonov ali proračunov.** Vodi štetje, kdo komu dolguje, in to je ves trik."
      - "**Ne omogoča prijave z Googlom ali Applom.** Registriraj se z e-pošto. Prijava z Googlom in Applom je v načrtu."
      - "**Ne spusti ljudi brez uporabniškega računa.** Vsak v skupini potrebuje brezplačen uporabniški račun."
faq:
  heading: "Vprašanja"
  items:
    - q: "Ali lahko plačam prek Side Badger?"
      a: "Ne. Side Badger vodi štetje in se tvojega denarja nikoli ne dotakne. Plačajte si, kakor želite, nato plačilo zabeleži."
    - q: "Ali obstaja mobilna aplikacija?"
      a: "Ne v trgovini z aplikacijami. Side Badger deluje v brskalniku. Prijavi se v telefonu, nato ga dodaj na začetni zaslon, da se odpre kot aplikacija. Kako, ti pokažejo nastavitve v aplikaciji."
    - q: "Ali lahko delim po postavkah?"
      a: "Ne. Vsak strošek ima enega plačnika in ga razdeliš enako, točno ali po odstotkih."
    - q: "Ali deluje brez povezave?"
      a: "Ne, potrebuje povezavo."
    - q: "Ali vsak v skupini potrebuje uporabniški račun?"
      a: "Da. Vsak v skupini potrebuje brezplačen uporabniški račun, za registracijo pa je dovolj e-poštni naslov."
