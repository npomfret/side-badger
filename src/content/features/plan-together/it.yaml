faq:
  heading: Domande
  items:
    - q: I voti possono essere anonimi?
      a: Sì. Attiva **Voto anonimo** quando crei il sondaggio e nasconde chi ha votato per cosa. Decidilo prima del primo voto, perché dopo non si può cambiare.
    - q: Un sondaggio può chiudersi da solo?
      a: No. Un sondaggio non ha scadenza, quindi la persona che l'ha creato sceglie **Chiudi sondaggio** quando il gruppo ha deciso. Se il gruppo ci ripensa, **Riapri sondaggio** lo riporta indietro.
    - q: Quante voci può contenere una lista?
      a: Fino a 200 voci per lista e fino a 100 liste per gruppo. Ogni voce può arrivare a 500 caratteri, che è un sacco di latte d'avena.
    - q: Chi può chiudere una domanda, e cosa succede intanto alla spesa?
      a: La persona che l'ha posta, o un admin del gruppo. Finché una domanda è aperta, l'intera spesa è fuori dai saldi di tutti. Rientra quando viene chiusa l'ultima domanda aperta su di essa, oppure quando una modifica toglie dalla spesa la persona che l'ha posta.
    - q: Posso usare liste e commenti come app di to-do o chat di gruppo?
      a: No. Commenti, liste e sondaggi riguardano i soldi del gruppo, come chiedono i [termini](page:terms). Pensa a liste della spesa, sondaggi sul budget e "perché questi 45 £?".
    - q: Side Badger mi manda email sull'attività?
      a: No. Non ci sono avvisi via email o SMS per l'attività. Puoi attivare le notifiche push su ogni dispositivo, e la campanella delle notifiche nell'app mostra le novità.
