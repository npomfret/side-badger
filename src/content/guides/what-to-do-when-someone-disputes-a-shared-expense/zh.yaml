meta:
  title: 有人对共同支出有异议时怎么办 | Side Badger
  description: 别发那种意有所指的消息，直接对支出提问。商量期间它不计入任何人的余额。以 £45 的派对红酒为例算给你看。
h1: 有人对共同支出有异议时怎么办
navLabel: 有争议的支出
lead: 与其发一条意有所指的消息，不如对这笔支出提一个问题。问题未关闭期间，整笔支出都不计入任何人的余额。在评论里聊开，如果群组同意就修改分摊，再由提问的人或管理员关闭问题。
cta:
  heading: 礼貌地问出那个尴尬的问题
  body: 创建免费账户，为合租的家建一个群组，请管理员打开费用问题功能，在有人打开之前它是关闭的。想先了解一下？请看[使用方式](page:how-it-works)或[免费包含什么](page:pricing)。
sections:
  - heading: 三个室友和 £45 的红酒
    body: 派对结束后，Tom 把红酒记进了这个家的群组。£45，Tom 付的，在 Tom、Priya 和 Aisha 之间平均分摊，每人 £15。Aisha 不喝酒。Tom 买酒是为了派对，而派对是为这个[家](page:use-case/housemates)办的，所以他没做错什么。Aisha 提出疑问也没有错。这里没有反派。只是有 £15 的红酒存在争议，而让它变得尴尬的办法有很多。给全家发一条意有所指的消息就是其中一种。对支出提一个问题则温和得多。
  - heading: 提问会发生什么
    body: Aisha 打开这笔支出，提出一个问题。整笔支出从所有人的余额里移出，不只是她那一份，其他一切都不受影响。大采购（£84）和清洁工（£60）仍然计算在内，每人 £28 + £20 = £48。所以在红酒被搁置期间，Aisha 欠 £48，Tom 应收 £36，Priya 应收 £12。无论这个家对红酒作何决定，在此期间谁的余额都不含它。这笔支出里的其他人也可以各自提出问题。只有当这笔支出上最后一个未关闭的问题被关闭，红酒才会回到余额里，而问题由提问的人或管理员关闭。
  - heading: 先聊开，再修正
    body: Aisha 的问题出现在这笔支出的评论里，所以回复就在它的正下方。关于评论和问题，[一起计划](page:feature/plan-together)有更多介绍。Tom 和 Priya 看完后，这个家聊了聊。他们认定这瓶红酒是 Tom 和 Priya 的，因为是他们喝的。换一个家也许会保留三人平分，或者约定介于两者之间的办法，那也完全可以。Side Badger 只存下你们约定的内容，对红酒本身不发表意见。Tom 编辑这笔支出，改为只在他自己和 Priya 之间平均分摊，每人 £22.50（£45 ÷ 2）。Aisha 已不在其中，所以她的问题随旧版本一起离开，红酒回到余额里。先前的版本会保留。
  - heading: 看结果
    body: 红酒回来后，Tom 应收 £58.50，Priya 欠 £10.50，Aisha 欠 £48。Side Badger 建议两笔付款，都付给 Tom。Aisha 的 £48 就是红酒被搁置时她的数字，因为她不在其中。Priya 从应收 £12 变成了欠 £10.50，这是她那份 £22.50 的红酒。如果三人平分维持不变，Aisha 本来要欠 £63（£28 + £20 + £15）。整场分歧值 £15。你们想怎么付就怎么付，然后在**结算**下记录每笔付款。其余内容见[结算](page:feature/settle-up)。
  - heading: 怎么措辞，别人才愿意继续跟你说话
    body: "Aisha 的问题：“我一口红酒都没喝。我们能看看这个分摊吗？”它很短，点明了是哪笔支出，是在询问而不是指责。有几个习惯会有帮助。"
    items:
      - >-
        **问支出，别问人。** “我们能核对一下红酒的分摊吗？”能开启一场对话。“凭什么让我为你的红酒付钱？”开启的则是另一种。
      - >-
        **说出你希望怎样。** “能不能只让喝了的人分摊？”给了群组一个可以同意或回应的东西。
      - >-
        **用一两句话给出理由。** 这个字段叫**您的问题**，不能留空。
      - >-
        **回复都放在一个地方。** 答复放在这笔支出的评论里，紧挨着它们所说的数字。
  - heading: 在 Side Badger 里设置
    items:
      - >-
        **打开提问功能。** 默认是关闭的。管理员打开群组的**设置**，在**常规**标签页的**功能**下打开**允许费用问题**，然后选择**保存**。之后再关掉它，会清除所有未关闭的问题。
      - >-
        **提一个问题。** 打开这笔支出，在分摊里你自己的名字旁选择**我有一个问题**。在**您的问题**里写下理由，再次选择**我有一个问题**。只有这笔支出里的人可以这样做。这笔支出随后会显示**已提问**标记。
      - >-
        **找出搁置的支出。** 在支出列表里，**仅已提问**会显示有未关闭问题的支出。
      - >-
        **如果群组同意，就修正。** 打开这笔支出，选择**编辑**，修改**分摊给**，然后选择**更新费用**。谁可以编辑取决于群组的权限。
      - >-
        **如果无需修正，就关闭。** 提问的人可以使用其**已提问**标记上的关闭按钮，标签是**关闭问题**，管理员也可以。最后一个问题关闭后，这笔支出就回到余额里。
  - heading: 没那么整齐的时候
    items:
      - >-
        **编辑后提问的人仍在其中。** 如果提问的人还在这笔支出里，他的问题会带到编辑后的版本上，等他或管理员来关闭。改了金额不等于同意这样就改好了。
      - >-
        **你不在这笔支出里。** 只有支出里的人才能对它提问。如果你觉得哪里不对，就在它的评论里说出来，或者问问添加它的人。
      - >-
        **有人想退出群组。** 未关闭的问题会让这笔支出里的人不能退出。关闭问题，或者编辑这笔支出让他们不再在其中，他们就可以走了。
  - heading: Side Badger 在这件事上不做什么
    items:
      - 它不裁决谁对谁错。它只把这笔支出搁在余额之外，并保存你们约定的内容。
      - 它不要求任何人在支出生效前先批准。只有被提问的支出才会被搁置。
      - 它不能只搁置一笔支出的一部分。一旦提问，整笔都会离开余额。
      - 它不转移资金。你们想怎么付就怎么付，然后记录下来。
