example:
  heading: "One month for Maya and Jon flat"
  currency: GBP
  people:
    - id: maya
      name: Maya
    - id: jon
      name: Jon
  expenses:
    - label: "di rent"
      payer: maya
      amount: 1400
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "di energy and broadband"
      payer: jon
      amount: 180
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "di takeaway"
      payer: jon
      amount: 36
      split:
        method: equal
faq:
  heading: "Question dem"
  items:
    - q: "We suppose use gross or take-home pay?"
      a: "Di group go decide. Take-home common, because na di money wey you really get to spend. Gross pay no consider say tax, pension contributions and loan repayments dey take different amounts from different pay. Whichever you pick, use di same measure for both of una."
    - q: "Side Badger dey see our incomes?"
      a: "No. You go enter percentages only, no be pay. Di members of di group fit see di percentages, and for couple na di two of una."
    - q: "We fit set 62/38 once for everything?"
      a: "Di split dey set per expense, no be per group. Copy expense wey already get 62 and 38, then change wetin different. [Share expenses](page:feature/split-expenses) cover di other options."
