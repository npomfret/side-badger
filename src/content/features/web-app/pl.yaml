meta:
  title: "Dzielenie rachunków bez pobierania aplikacji | Side Badger"
  description: "Telefon pełny? Rozumiemy. Side Badger działa w przeglądarce, bez sklepu i bez pobierania. Dodaj go do ekranu początkowego, a otworzy się jak aplikacja."
h1: "Bez sklepu z aplikacjami. Bez pobierania. A i tak jak aplikacja"
navLabel: "Aplikacja internetowa"
lead: "Side Badger mieszka w twojej przeglądarce. Nie ma sklepu z aplikacjami do przeszukiwania i niczego do pobrania na start. Zaloguj się na telefonie albo komputerze, dziel wydatki online z grupą i dodaj go do ekranu początkowego albo Docka, gdy chcesz mieć go o jedno stuknięcie od siebie."
cta:
  heading: "Otwórz. Zaloguj się. Załóż grupę."
  body: "Załóż konto, utwórz grupę i dodaj pierwszy wydatek, wszystko z przeglądarki, którą masz już otwartą. Chcesz najpierw zobaczyć, jak to wygląda? Zobacz [jak to działa](page:how-it-works) albo sprawdź, [co obejmuje darmowy plan](page:pricing)."
problem:
  heading: "Twój telefon jest pełny. Rozumiemy."
  body: "Gdzieś na nim leżą cztery tysiące zdjęć tego samego zachodu słońca i ostrzeżenie o zapełnionej pamięci, które od wiosny odsuwasz machnięciem. Ostatnia rzecz, jakiej mu trzeba, to kolejna aplikacja tylko po to, żeby podzielić jedną kolację. Dlatego Side Badger jest aplikacją internetową. Działa w nowoczesnej przeglądarce na telefonie albo komputerze. Na telefonie używa układów mobilnych, ze stroną grupy podzieloną na zakładki i wygodnymi w dotyku elementami. Niektóre dodatki, takie jak dodanie do ekranu początkowego, zależą od przeglądarki, i zaznaczamy, które."
workflow:
  heading: "Od karty przeglądarki do ekranu początkowego w trzech krokach"
  steps:
    - title: "Otwórz i zaloguj się"
      body: "Wejdź na Side Badger w przeglądarce i zaloguj się. Wystarczy adres e-mail i hasło, a przed dodaniem czegokolwiek weryfikujesz e-mail. Każdy w grupie potrzebuje konta, więc osoby, które zaprosisz, zrobią to samo."
    - title: "Dodaj go do ekranu początkowego lub Docka"
      body: "Po zalogowaniu aplikacja sama proponuje instalację. Dostajesz przycisk **Zainstaluj** tam, gdzie pozwala na to przeglądarka, a **Pokaż, jak** tam, gdzie nie pozwala. Propozycja przeoczona albo odrzucona? **Ustawienia** mają tę samą pomoc w sekcji **Dodaj do ekranu początkowego lub Docka**. Na iPhonie lub iPadzie Ustawienia pokazują najpierw kroki dla iPhone'a, a inne urządzenia chowają pod **Inne urządzenia**. Tak czy inaczej aplikacja otwiera się potem we własnym oknie."
      shot: S20
      shotAlt: "Sekcja Dodaj do ekranu początkowego lub Docka w Ustawieniach, z krokami dodawania aplikacji do urządzenia"
    - title: "Włącz powiadomienia, jeśli chcesz"
      body: "Powiadomienia są wyłączone, dopóki ich nie włączysz, a każde urządzenie włącza się osobno. Użyj przycisku **Włącz**, który proponuje dzwonek powiadomień, albo przełącznika **Powiadomienia push** na stronie **Ustawienia**. Na iPhonie lub iPadzie najpierw otwórz aplikację z ekranu początkowego. Tylko tam powiadomienia działają."
      shot: S19
      shotAlt: "Otwarte powiadomienia z listą ostatniej aktywności w grupie"
options:
  heading: "Jak go dodać, urządzenie po urządzeniu"
  items:
    - title: "iPhone i iPad"
      body: "Stuknij przycisk Udostępnij, czyli kwadrat ze strzałką skierowaną w górę. Jeśli go nie widzisz, najpierw stuknij trzy kropki (•••), a potem Udostępnij. Przewiń w dół i stuknij **Dodaj do ekranu początkowego**. Zostaw włączoną opcję **Otwórz jako aplikację internetową**, a następnie stuknij **Dodaj**. Jeśli link otworzył się wewnątrz innej aplikacji, najpierw otwórz stronę w Safari, bo ta wbudowana przeglądarka nie potrafi jej dodać."
    - title: "Android"
      body: "Otwórz menu przeglądarki i wybierz **Dodaj do ekranu głównego** lub **Zainstaluj aplikację**."
    - title: "Chrome lub Edge na komputerze"
      body: "Otwórz menu przeglądarki i wybierz opcję instalacji tej strony jako aplikacji. Dostaje wtedy własne okno i własną ikonę."
    - title: "Safari na Macu"
      body: "Wybierz **Plik**, a potem **Dodaj do Docka**."
sections:
  - heading: "Powiadomienia, tylko jeśli o nie poprosisz"
    body: "Powiadomienia push są wyłączone, dopóki ich nie włączysz. Włącz je, a dostaniesz powiadomienie, gdy w twoich grupach pojawi się nowa aktywność, na przykład ktoś doda wydatek, zostawi komentarz albo zarejestruje płatność. Włącza się je po jednym urządzeniu, z dzwonka powiadomień albo na stronie **Ustawienia**, i tam też możesz je z powrotem wyłączyć. Potrzebują przeglądarki, która je obsługuje, i twojej zgody. Jeśli przeglądarka zablokowała je dla tej strony, najpierw zezwól na nie w ustawieniach przeglądarki. Na iPhonie lub iPadzie działają tylko z aplikacji dodanej do ekranu początkowego, nie z karty przeglądarki. Dostarczenie nie jest gwarantowane, więc traktuj powiadomienie jak szturchnięcie, a nie obietnicę. O tym, co pojawia się w historii aktywności, przeczytasz w [planowaniu razem](page:feature/plan-together)."
  - heading: "Aktualizacje na żywo, bez przycisku odświeżania"
    body: "Dodaj wydatek, a wszyscy zobaczą go od razu, razem z informacją, co się zmieniło i kto to zmienił. Każda grupa prowadzi historię aktywności, a dzwonek powiadomień pokazuje aktywność we wszystkich twoich grupach. Nikt nie musi pytać, czy ktoś widział to, co właśnie dodano. Jest już na ekranie każdego."
  - heading: "39 języków, każdy ma własny"
    body: "Korzystaj z Side Badger w 39 językach, w tym w arabskim, perskim i urdu, pisanych od prawej do lewej. Każdy w grupie wybiera własny, więc ta sama strona grupy może być po arabsku dla jednej osoby i po angielsku dla następnej. Jedyne, w czym grupa musi się zgodzić, to liczby."
  - heading: "Zbudowane dla różnych użytkowników"
    body: "Side Badger powstał z myślą o osobach korzystających z klawiatury i czytników ekranu. Kolory członków mają wzory, więc nie trzeba odróżniać zieleni od czerwieni."
    items:
      - "Linki pomijania, dzięki którym osoby korzystające z klawiatury mogą przejść prosto do treści."
      - "Okna dialogowe zarządzają fokusem klawiatury."
      - "Elementy sterujące mają etykiety, dla czytników ekranu."
      - "Układy odwracają się w językach pisanych od prawej do lewej."
limits:
  heading: "Czego aplikacja internetowa nie robi"
  items:
    - "Nie ma trybu offline. Side Badger potrzebuje połączenia, więc nie otworzy twojej grupy w samolocie bez wifi."
    - "Nie ma aplikacji w sklepie ani natywnej aplikacji na iPhone'a czy Androida. Side Badger jest aplikacją internetową, a dodanie go do ekranu początkowego lub Docka to sposób na wersję podobną do aplikacji."
    - "Dodanie do ekranu początkowego lub Docka zależy od przeglądarki. Nazwy w menu różnią się między przeglądarkami i wersjami, a niektóre przeglądarki w ogóle tego nie oferują."
    - "Powiadomienia push trzeba włączyć osobno na każdym urządzeniu, a wymagają one przeglądarki, która je obsługuje, oraz twojej zgody. Na iPhonie i iPadzie działają tylko z aplikacji dodanej do ekranu początkowego. Dostarczenie nie jest gwarantowane."
    - "Nie ma powiadomień e-mail ani SMS i nie ma przypomnień o płatnościach. Nowa aktywność pokazuje się w aplikacji, a także jako powiadomienia push, jeśli je włączysz. Ponaglanie z płatnością nadal zależy od ciebie."
    - "Aktywność jest przechowywana przez 90 dni."
    - "Logujesz się adresem e-mail i hasłem. Nie ma logowania przez Google ani Apple, a trzeba mieć ukończone 18 lat."
    - "Nie twierdzimy, że Side Badger jest w pełni dostępny, ani że spełnia formalny standard dostępności. Jeśli coś ci przeszkadza, napisz do nas z poziomu aplikacji, a odpowiedź zobaczysz tam."
useCasesHeading: "Gdzie pomaga to, że nie trzeba aplikacji"
faq:
  heading: "Pytania"
  items:
    - q: "Czy Side Badger jest dostępny w sklepie z aplikacjami?"
      a: "Nie. Side Badger jest aplikacją internetową. Otwierasz go w przeglądarce i możesz dodać do ekranu początkowego lub Docka, żeby otwierał się jak aplikacja. Nie ma niczego do pobrania ze sklepu z aplikacjami."
    - q: "Czy mogę dzielić rachunki bez pobierania aplikacji?"
      a: "Tak. Otwórz Side Badger w przeglądarce na telefonie albo komputerze, zaloguj się i załóż grupę. Dodanie do ekranu początkowego lub Docka jest opcjonalne."
    - q: "Czy działa offline?"
      a: "Nie. Side Badger potrzebuje połączenia, nawet gdy jest dodany do ekranu początkowego lub Docka."
    - q: "Dlaczego nie dostaję powiadomień na iPhonie?"
      a: "Na iPhonie i iPadzie powiadomienia działają tylko z aplikacji dodanej do ekranu początkowego, a nie z karty przeglądarki. Dodaj ją, otwórz z ikony na ekranie początkowym, a potem włącz powiadomienia na stronie **Ustawienia**. Dostarczenie nie jest gwarantowane, więc jeśli któreś zaginie, historia aktywności grupy nadal pokazuje, co dodano."
    - q: "Czy muszę włączać powiadomienia?"
      a: "Nie. Są wyłączone, dopóki ich nie włączysz, po jednym urządzeniu. Bez nich nowa aktywność nadal pokazuje się w aplikacji, a każdy widzi zmianę od razu, gdy ma ją otwartą."
    - q: "Czy każdy w grupie potrzebuje konta?"
      a: "Tak. Wystarczy adres e-mail i hasło, a przed dodaniem czegokolwiek weryfikujesz e-mail. Każdy, kto dołącza do grupy, robi to samo, na dowolnym telefonie lub komputerze."
