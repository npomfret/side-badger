faq:
  heading: "Huvilakysymyksiä"
  items:
    - q: "Entä jos joku peruu?"
      a: "Ota hänen yönsä pois, laske uudelleen ja muokkaa huvilan kulua niin, että tarkat summat taas vastaavat hintaa. Aiempi versio säilyy ja muokkaus näkyy ryhmän toimintahistoriassa, joten kukaan ei muuta lukua huomaamatta. Se, kuka saa muokata, riippuu ryhmän oikeuksista."
    - q: "Pitäisikö varaajan maksaa vähemmän?"
      a: "Siitä päättää ryhmä. Varaaminen on vaivaa, ja ryhmät ovat eri mieltä siitä, ansaitseeko se alennuksen. Mistä tahansa sovitte, laita se tarkkoihin summiin ja kirjoita se kulun muistiinpanoon tai sen viereiseen kommenttiin, jotta kenenkään ei tarvitse muistaa sopimusta."
    - q: "Voiko siivousmaksut jakaa toisin?"
      a: "Kyllä. Syötä maksu erillisenä kuluna ja anna sille oma jako. Tasan sopii kiinteälle maksulle koko talosta. Tarkat summat sopivat ryhmälle, joka haluaa maksun seuraavan myös öitä."
