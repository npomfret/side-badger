faq:
  heading: "Sorular"
  items:
    - q: "Side Badger hangi döviz kurunu kullanır?"
      a: "Harcamayı girdiğinizde, varsa güncel bir döviz kuru getirilir. Bunu gerçekten aldığınız kurla değiştirebilirsiniz."
    - q: "Grup yalnızca sterlin ve yenle sınırlı kalabilir mi?"
      a: "Evet. Grubun **Ayarlar**'ında, **Para Birimi Ayarları** altında **Bu grup için para birimlerini kısıtla**'yı açın, **İzin verilen para birimleri**'ni seçin ve **Yeni harcamalar için varsayılan para birimi**'ni belirleyin. Listede daha az seçenek, kasada daha az yanlış tahmin demek."
    - q: "Hiç çevirmek zorunda mıyız?"
      a: "Hayır. Siz ya da grubunuz çevirmeyi seçmedikçe para birimleri ayrı kalır ve her para biriminin kendi kısa ödeme listesi olur."
