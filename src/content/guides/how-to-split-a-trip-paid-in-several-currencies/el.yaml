meta:
  title: "Πώς να μοιράσετε ένα ταξίδι σε πολλά νομίσματα | Side Badger"
  description: "Λίρες για το ξενοδοχείο, γεν για το ράμεν. Τακτοποιήστε κάθε νόμισμα χωριστά ή μετατρέψτε με ισοτιμία που βλέπετε. Και οι δύο τρόποι, με τις πράξεις."
h1: "Πώς να μοιράσετε ένα ταξίδι που πληρώθηκε σε πολλά νομίσματα"
navLabel: "Ταξίδι με πολλά νομίσματα"
lead: "Καταχωρίστε κάθε έξοδο στο νόμισμα που πληρώσατε και μετά διαλέξτε τρόπο. Κρατήστε τα νομίσματα ξεχωριστά και τακτοποιήστε το καθένα στα δικά του χρήματα ή μετατρέψτε με μια τρέχουσα συναλλαγματική ισοτιμία και τακτοποιηθείτε μία φορά. Το ίδιο ταξίδι στην Ιαπωνία βγάζει τέσσερις πληρωμές με τον πρώτο τρόπο και δύο με τον δεύτερο."
cta:
  heading: "Καταχωρίστε το στο νόμισμα που πληρώσατε"
  body: "Δημιουργήστε δωρεάν λογαριασμό, ξεκινήστε μια ομάδα για το ταξίδι και προσθέστε κάθε έξοδο στο νόμισμα που αναγράφεται στην απόδειξη. Θέλετε πρώτα τις λεπτομέρειες; Δείτε τα [πολλά νομίσματα](page:feature/multiple-currencies) ή [τι καλύπτει το δωρεάν](page:pricing)."
sections:
  - heading: "Τρεις φίλοι, ένα ξενοδοχείο, πάρα πολλά γεν"
    body: "Η Ζόι, ο Κένζι και η Λούσι περνούν μια εβδομάδα στην Ιαπωνία σε ένα [ομαδικό ταξίδι](page:use-case/group-trips) και κάθε κόστος μοιράζεται εξίσου στα τρία. Η Ζόι έκλεισε το ξενοδοχείο από το σπίτι, σε λίρες, με 600 £. Η Λούσι αγόρασε τα πάσα τρένου στο Τόκιο με 90.000 ¥. Ο Κένζι πλήρωσε τη βραδιά με ράμεν, 9.000 ¥, και από τότε την αναφέρει καθημερινά. Κανείς δεν θέλει να μετατρέπει τρεις αποδείξεις σε μια αποβάθρα σταθμού. Για τις πράξεις εδώ, 1 ¥ είναι 0,005 £, μια στρογγυλή ισοτιμία που επινοήθηκε για αυτόν τον οδηγό. Στην εφαρμογή θα χρησιμοποιούσατε μια τρέχουσα συναλλαγματική ισοτιμία ή θα πληκτρολογούσατε αυτήν που πήρατε πραγματικά."
  - heading: "Καταχωρίστε το καθένα στο νόμισμα της απόδειξης"
    body: "Αυτό το μέρος το κάνετε όποιον τρόπο κι αν διαλέξετε. Προς το παρόν τίποτα δεν χρειάζεται μετατροπή."
    items:
      - "**Φτιάξτε την ομάδα.** Στον πίνακα ελέγχου επιλέξτε **Δημιουργία Ομάδας**, δώστε της το όνομα του ταξιδιού, μετά επιλέξτε **Πρόσκληση Άλλων** και στείλτε τον σύνδεσμο ή τον κωδικό QR."
      - "**Προσθέστε το ξενοδοχείο.** Επιλέξτε **Προσθήκη Εξόδου** και πληκτρολογήστε 600, με λίρες ως νόμισμα δίπλα στο ποσό. Στο **Ποιος πλήρωσε;** διαλέξτε τη Ζόι. Κρατήστε και τους τρεις στο **Μοιράζεται μεταξύ**, αφήστε το **Τρόπος διαχωρισμού** στο **Εξίσου** και επιλέξτε **Αποθήκευση Εξόδου**."
      - "**Προσθέστε τα γεν.** Κάντε το ίδιο για τα πάσα τρένου (πλήρωσε η Λούσι) και το ράμεν (πλήρωσε ο Κένζι), με γεν ως νόμισμα. Τα γεν δεν έχουν δεκαδικά, οπότε η φόρμα δεν ζητά κανένα."
  - heading: "Πρώτος τρόπος: κρατήστε τα νομίσματα ξεχωριστά"
    body: "Το Side Badger κρατά ξεχωριστό υπόλοιπο για κάθε νόμισμα και δεν συμψηφίζει το ένα με το άλλο. Σε λίρες, το ξενοδοχείο βγαίνει 200 £ το άτομο, οπότε ο Κένζι και η Λούσι χρωστούν από 200 £ στη Ζόι. Σε γεν, τα πάσα τρένου και το ράμεν κάνουν 99.000 ¥, δηλαδή 33.000 ¥ το άτομο. Η Λούσι πλήρωσε 90.000 ¥ και της οφείλονται 57.000 ¥. Η Ζόι δεν πλήρωσε γεν και χρωστά 33.000 ¥. Ο Κένζι πλήρωσε 9.000 ¥, άρα χρωστά 24.000 ¥."
    items:
      - "**Λίρες.** Ο Κένζι πληρώνει τη Ζόι 200 £ και η Λούσι πληρώνει τη Ζόι 200 £."
      - "**Γεν.** Η Ζόι πληρώνει τη Λούσι 33.000 ¥ και ο Κένζι πληρώνει τη Λούσι 24.000 ¥."
      - "**Τέσσερις πληρωμές συνολικά.** Η Ζόι και η Λούσι χρωστούν η μία στην άλλη σε δύο νομίσματα που δεν αλληλοεξουδετερώνονται. Δεν μπαίνει καμία ισοτιμία στη μέση, οπότε δεν υπάρχει τίποτα για να μαλώσετε."
      - "**Χρωστάτε γεν, πληρώνετε σε λίρες.** Όποιος δεν έχει γεν μπορεί και πάλι να πληρώσει σε λίρες. Όταν καταγράφετε την πληρωμή, ανοίξτε το **Διαφορετικό νόμισμα;**, επιλέξτε **Μετατροπή σε** λίρες και ελέγξτε την ισοτιμία. Τα 33.000 ¥ της Ζόι είναι 165 £ με την ισοτιμία αυτού του οδηγού και το υπόλοιπο σε γεν βγαίνει και πάλι σωστά."
      - "**Καταγράψτε κάθε πληρωμή.** Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά επιλέξτε **Τακτοποίηση** και χρησιμοποιήστε την **Καταγραφή Εκκαθάρισης**. Περισσότερα υπάρχουν στην [εκκαθάριση](page:feature/settle-up)."
  - heading: "Δεύτερος τρόπος: μετατρέψτε στην πορεία"
    body: "Αν η ομάδα προτιμά να βλέπει έναν αριθμό για τον καθένα, μετατρέψτε όταν καταχωρίζετε το έξοδο."
    items:
      - "**Μετατρέψτε στη φόρμα.** Στην **Προσθήκη Εξόδου** επιλέξτε **Μετατροπή σε** και διαλέξτε λίρες. Το Side Badger δείχνει την ισοτιμία και το ποσό μετά τη μετατροπή, σημειωμένο με ≈. Αλλάξτε την ισοτιμία αν πήρατε διαφορετική. Το αρχικό ποσό σε γεν μένει στο έξοδο."
      - "**Διαβάστε τις λίρες.** Με 1 ¥ = 0,005 £, τα πάσα τρένου γίνονται 450 £ και το ράμεν 45 £. Μαζί με το ξενοδοχείο των 600 £, αυτό κάνει 600 £ + 450 £ + 45 £ = 1.095 £, δηλαδή 365 £ το άτομο. Η Ζόι πλήρωσε 600 £, άρα της οφείλονται 235 £. Η Λούσι πλήρωσε 450 £ και της οφείλονται 85 £. Ο Κένζι πλήρωσε 45 £ και χρωστά 320 £."
      - "**Δύο πληρωμές.** Και οι δύο από τον Κένζι: 235 £ στη Ζόι και 85 £ στη Λούσι. Η Ζόι και η Λούσι δεν πληρώνουν πια καθόλου η μία την άλλη."
      - "**Ή ορίστε νόμισμα ομάδας.** Για να παραλείψετε το επιπλέον βήμα, ανοίξτε τις **Ρυθμίσεις** της ομάδας, βρείτε τις **Ρυθμίσεις Νομισμάτων** και επιλέξτε **Αυτόματη μετατροπή δαπανών σε**. Κάθε νέο έξοδο μετατρέπεται τότε σε αυτό το νόμισμα, πάντα με ισοτιμία που βλέπετε και αλλάζετε."
  - heading: "Ποιον τρόπο να διαλέξετε;"
    items:
      - "**Κρατήστε τα ξεχωριστά** όταν οι άνθρωποι έχουν ακόμα γεν στα πορτοφόλια τους ή όταν προτιμάτε να μην μαλώσετε για μια ισοτιμία. Το κόστος είναι περισσότερες πληρωμές, σε πάνω από ένα νόμισμα."
      - "**Μετατρέψτε** όταν η ομάδα ζει σε ένα νόμισμα και θέλει έναν αριθμό για τον καθένα και πιο σύντομη λίστα, όπως τις δύο μεταφορές του Κένζι. Το κόστος είναι ότι η ομάδα εμπιστεύεται μια ισοτιμία και η ισοτιμία κλειδώνει σε κάθε έξοδο όταν αποθηκευτεί."
      - "**Αποφασίστε νωρίς.** Ένα νόμισμα ομάδας μετατρέπει μόνο τα νέα και τα αντιγραμμένα έξοδα. Δεν γυρίζει πίσω να τακτοποιήσει όσα έχετε ήδη καταχωρίσει."
  - heading: "Η ισοτιμία και το όριο"
    items:
      - "**Η ισοτιμία κλειδώνει όταν αποθηκεύετε.** Τα παλιά έξοδα δεν επανεκτιμώνται ποτέ, οπότε ένα υπόλοιπο δεν ξεφεύγει επειδή κινήθηκε η αγορά. Έξοδα που καταχωρίστηκαν διαφορετικές μέρες μπορεί να έχουν διαφορετικές ισοτιμίες, οπότε αν η ομάδα θέλει μία ισοτιμία για όλο το ταξίδι, συμφωνήστε την και πληκτρολογήστε την κάθε φορά."
      - "**Δεν υπάρχει ισοτιμία; Πληκτρολογήστε μία.** Το Side Badger φέρνει μια τρέχουσα συναλλαγματική ισοτιμία όπου μπορεί, αλλά δεν είναι εγγυημένο ότι υπάρχει για κάθε ζεύγος. Αν δεν υπάρχει ή αν ένα γραφείο συναλλάγματος σας έδωσε καλύτερη τιμή, πληκτρολογήστε τη δική σας."
      - "**999.999,99 ανά έξοδο, στο δικό του νόμισμα.** Ένα όριο, όποιο κι αν είναι το νόμισμα. Σε γεν είναι λίγο κάτω από 1.000.000 ¥, περίπου 5.000 £ με την ισοτιμία αυτού του οδηγού. Σε νόμισμα με μεγάλους αριθμούς, όπως η ρουπία Ινδονησίας, ένας μόνο λογαριασμός μπορεί να το φτάσει νωρίτερα. Χωρίστε τον λογαριασμό σε δύο έξοδα ή καταχωρίστε τον σε άλλο νόμισμα και μετατρέψτε."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν μετακινεί ούτε ανταλλάσσει ποτέ χρήματα. Πληρώνετε ο ένας τον άλλον όπως θέλετε και μετά καταγράφετε την πληρωμή."
      - "Έχει 140 νομίσματα. Τα κρυπτονομίσματα και τα μέταλλα δεν είναι ανάμεσά τους."
