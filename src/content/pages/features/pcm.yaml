meta:
  title: "Wetin Side Badger dey do and wetin e no dey do"
  description: "Sharing expenses, settling up and multiple currencies, plus groups, lists and polls. Di full kit, and honest list of wetin Side Badger leave out."
h1: "Wetin Side Badger dey do"
navLabel: "Features"
lead: "Everything wey dey di box, and wetin no dey."
intro: "Na di full kit be dis. We leave di spreadsheet out on purpose. Start with di three jobs wey Side Badger dey do every day, then check di rest of di list and di short list of things wey e no dey do."
cta:
  heading: "E dey do wetin your group need?"
  body: "Create free account and try am with small group first."
  button: "Create free account"
cardsHeading: "Di three jobs, in detail"
sections:
  - heading: "Receipt scanning"
    body: "Snap di receipt and Side Badger go fill di total, date and place make you check am. Google AI service dey read receipt images."
  - heading: "Groups and permissions"
    body: "Make group for each house, trip or event, with up to 50 people inside. Invite people with link or QR code. For bigger group, make somebody viewer, wey go see everything and change nothing."
  - heading: "Lists and polls"
    body: "Keep di shared shopping list near di shopping bills. Put di villa shortlist to vote, anonymously if you like."
  - heading: "Everything else"
    items:
      - "**Live updates:** add expense and everybody go see am sharp sharp."
      - "**Languages:** use Side Badger for 39 languages. Everybody for di group fit pick im own."
      - "**Home screen:** no need app store. Add Side Badger to your home screen and e go open like an app."
      - "**Feedback:** you see bug? Tell us from inside di app and see our reply there."
  - heading: "Wetin Side Badger no dey do"
    items:
      - "**Move money.** Side Badger no dey ever touch your money. Pay each other anyhow you like. Payment requests dey for plan."
      - "**Repeat bills.** No recurring expenses dey. Copy last month bill with two taps."
      - "**Share by item.** One payer for each expense. Share equal-equal, exactly or by percentage."
      - "**Ship native app.** E dey work for your browser. Add am to your home screen."
      - "**Work offline.** E need connection."
      - "**Send alerts by email or text.** Notifications dey show for di app. Push notifications dey for plan."
      - "**Draw charts or budgets.** E dey keep count of who owe who, and na dat be di whole trick."
      - "**Sign in with Google or Apple.** Sign up with email. Google and Apple sign-in dey for plan."
      - "**Let people in without account.** Everybody for di group need free account."
faq:
  heading: "Questions"
  items:
    - q: "I fit pay through Side Badger?"
      a: "No. Side Badger dey keep di count and e no dey ever touch your money. Pay each other anyhow you like, then record di payment."
    - q: "Mobile app dey?"
      a: "No for app store. Side Badger dey run for your browser, and you fit add am to your home screen so e go open like an app."
    - q: "I fit share by item?"
      a: "No. Each expense get one payer, and you go share am equal-equal, exactly or by percentage."
    - q: "E dey work offline?"
      a: "No, e need connection."
    - q: "Everybody for di group need account?"
      a: "Yes. Everybody for di group need free account, and email address na all you need to sign up."
