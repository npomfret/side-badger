meta:
  title: "収入が多いパートナーと請求を分ける方法 | Side Badger"
  description: "50/50は、収入に大きな差があると気まずくなります。共有の請求を収入に応じて分ける方法を、2人分の計算つきで紹介します。表計算シートは不要です。"
h1: "収入が多いパートナーと請求を分ける方法"
navLabel: "収入が多いパートナー"
lead: "手取りを合計し、合計に対する各自の割合を出して、整数のパーセントに丸めます。Mayaの手取りは£2,800、Jonは£1,700なので、2人は共有の請求を62/38で分けています。そのパーセンテージをSide Badgerの共有の支出に入力し、同じ請求が来たらコピーしましょう。"
cta:
  heading: "計算は一度だけ"
  body: "無料アカウントを作成し、2人のグループを作って、決めたパーセンテージで家賃を入力しましょう。来月の家賃はコピーするだけです。先に全体を知りたい方は、[使い方](page:how-it-works)または[無料で使える範囲](page:pricing)をご覧ください。"
sections:
  - heading: "収入は2つ、アパートは1つ、そして礼儀正しい沈黙"
    body: "MayaとJonは一緒に暮らしています。Mayaの手取りは月£2,800、Jonは月£1,700です。2年間、2人はすべてを50/50で分けてきました。簡単だったし、どちらも自分から切り出したくなかったからです。そこへ、Jonが家賃だけを見直しました。£1,400の半分は£700で、Mayaの手取りの4分の1、Jonの手取りの41%にあたります。誰も不公平なことはしていません。ただ、誰も計算していなかっただけです。[カップル](page:use-case/couples)の多くが、いずれここにたどり着きます。テイクアウトを囲みながら、共有の請求が2人の収入に同じくらいの割合でのしかかるようにしよう、と合意しました。"
  - heading: "計算の手順（式つき）"
    body: "4つのステップ。必要なのは電卓1つと、どうせいつかはする話し合いです。"
    items:
      - "**何を収入とみなすか決める。** MayaとJonは手取り、つまり毎月銀行に入るお金を使います。合計は£2,800 + £1,700 = £4,500です。"
      - "**各自の割合を出す。** Mayaは2,800 ÷ 4,500で62.2%、Jonは1,700 ÷ 4,500で37.8%です。"
      - "**整数のパーセントに丸める。** 62.2%は62、37.8%は38になります。2人の場合は、片方の数字を丸めて100から引けばもう片方が出るので、合計は必ず100になります。"
      - "**意味を確かめる。** £1,400の家賃では、Mayaが£868（62%）、Jonが£532（38%）を払います。どちらも手取りのおよそ31%です。半分ずつだったら、Mayaは25%、Jonは41%でした。"
  - heading: "1か月を読み解く"
    body: "£1,400の家賃を払ったのはMaya、残りの£216を払ったのはJonです。Mayaの1か月分の負担は£868.00 + £111.60 + £18.00 = £997.60で、£1,400を支払ったので、£402.40を受け取る側です。Jonの負担は£532.00 + £68.40 + £18.00 = £618.40で、£216を支払ったので、£402.40を支払う側です。Side Badgerは、JonからMayaへ£402.40の支払い1回を提案し、支払いが済んだら[精算](page:feature/settle-up)で記録します。50/50で分けていたら、同じ月でもJonがMayaに払う額は£592.00でした。"
  - heading: "Side Badgerで設定する"
    body: "所要時間は10分ほど。その大半は、パーセンテージの話し合いに使われます。"
    items:
      - "**グループを作る。** ダッシュボードで**グループを作成**を選び、アパートの名前を付けます。**他の人を招待**を選び、JonにリンクまたはQRコードを送ります。Jonはサインインするか無料アカウントを作成し、このグループで表示したい名前を選びます。グループを見られるのはメンバーだけなので、このグループは2人だけのものです。"
      - "**家賃を追加する。** **経費を追加**を選びます。説明と金額を入力し、**誰が支払いましたか？**でMayaを選びます。**割り勘相手**は2人とも残したまま、**割り勘方法**で**パーセンテージ**を選び、62と38を入力します。パーセンテージの合計が100でない場合は、フォームが警告します。**経費を保存**を選びます。"
      - "**ほかの請求を追加する。** エネルギー代とブロードバンドも同じ方法で、支払った人はJon、割合は同じ62と38で入力します。テイクアウトは別の支出で、**割り勘方法**は**均等**のままにします。"
      - "**来月はコピーする。** 先月の家賃を開いて**経費をコピー**を選びます。コピーには支払った人、金額、分け方がそのまま引き継がれ、日付は今日になります。家賃が変わった場合は金額を変更してから、**コピーを作成**を選びます。エネルギー代も同じ要領です。"
      - "**誰が誰に借りているかを確認する。** **残高**セクションに表示され、短い支払いリストが提案されます。支払いは好きな方法で行い、そのあと**精算する**で記録します。"
  - heading: "50/50、収入に応じて、請求ごとに"
    body: "唯一の正解はなく、2人とも納得できる方法があるだけです。よくある3つを挙げます。"
    items:
      - "**すべて半分ずつ。** いちばん続けやすく、収入が近いカップルに向いています。"
      - "**共有のものはすべて収入に応じて。** MayaとJonの方法です。話し合いは1回、パーセンテージは1組で済みます。"
      - "**請求ごとに決める。** 家賃と光熱費は収入に応じて、旅行やご褒美は50/50かほかの合意した方法で。それぞれの請求に合うルールを使います。"
  - heading: "何を共有とするか決める"
    body: "揉めるのは、たいていパーセンテージではなくリストのほうです。家賃、エネルギー代、ブロードバンド、毎週の買い物、ソファは、たいていの家で共有に数えられます。Mayaのジムの会費やJonのサッカーの有料配信は、そうとは限りません。リストは一度合意して書き留め、共有の費用だけをグループに入れましょう。"
  - heading: "テイクアウトはあえて50/50のまま"
    body: "ご褒美は小さくて任意のものですし、餃子を頼むのに電卓がいるようではいけません。Side Badgerでは、テイクアウトもほかと同じ1件の支出です。Jonが£36を支払い、**割り勘方法**は**均等**のままで、2人はそれぞれ£18を負担します。"
  - heading: "収入が変わったとき"
    body: "昇給、転職、休職があれば、計算も変わります。同じ手順で新しいパーセンテージを出し、次の支出から使います。それ以前の支出はそのままです。先月の家賃をコピーし、パーセンテージを変えて、**コピーを作成**を選びます。すでに入力した支出を直すには、グループの権限で許可されていれば編集できますが、残高が変わるので、先にパートナーに伝えましょう。以前のバージョンは保存されます。いつ計算し直すかを、たとえば年に1回と決めておき、切り替える前に精算して、古い分け方がきれいな集計で終わるようにしましょう。"
  - heading: "ここでSide Badgerにできないこと"
    items:
      - "収入を尋ねることはなく、パーセンテージを計算することもしません。合意した数字を入力するだけです。"
      - "グループ全体のデフォルトの分け方は設定できません。パーセンテージは支出ごとに付くので、すでに設定してある支出をコピーしてください。"
      - "定期的な請求はないので、毎回先月の家賃をコピーします。"
      - "お金を動かすことはありません。支払いは好きな方法で行い、そのあと記録します。"
exampleAfter: 2
example:
  heading: "MayaとJonのアパートのある1か月"
  currency: GBP
  people:
    - id: maya
      name: Maya
    - id: jon
      name: Jon
  expenses:
    - label: "家賃"
      payer: maya
      amount: 1400
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "エネルギー代とブロードバンド"
      payer: jon
      amount: 180
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "テイクアウト"
      payer: jon
      amount: 36
      split:
        method: equal
faq:
  heading: "よくある質問"
  items:
    - q: "額面と手取りのどちらを使うべきですか？"
      a: "グループで決めます。実際に使えるお金なので、手取りがよく使われます。額面では、税金、年金の掛け金、ローンの返済が、収入ごとに異なる額を差し引いていく事実が考慮されません。どちらを選ぶにしても、2人とも同じ基準を使ってください。"
    - q: "Side Badgerは私たちの収入を見るのですか？"
      a: "いいえ。入力するのはパーセンテージだけで、収入は入力しません。パーセンテージはグループのメンバーに見えます。カップルなら、それは2人だけです。"
    - q: "62/38を一度設定して、すべてに使えますか？"
      a: "分け方は、グループ単位ではなく支出ごとに設定します。62と38がすでに設定された支出をコピーして、違う部分だけ変更してください。ほかの選択肢は[割り勘の仕方](page:feature/split-expenses)で説明しています。"
