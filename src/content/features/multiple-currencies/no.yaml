sections:
  - heading: Én valuta for hele gruppen
    body: Vil gruppen helst slippe å tenke på det, velger dere en gruppevaluta, og skjemaet konverterer hver nye utgift til den, med en kurs du fortsatt kan se og endre. Dette gjelder bare nye og kopierte utgifter. Redigeringer og eksisterende utgifter blir som de er, så ingenting som allerede er registrert endres under deg.
  - heading: Skylder euro, betaler i pund
    body: Betalt i yen, gjør opp i pund? Greit. Når du registrerer en betaling, kan du konvertere den også, så den som skylder euro kan betale i pund og euro-saldoen likevel går opp. Betal hverandre slik dere vil, og registrer det.
  - heading: Regler for gruppen
    body: Begrens en gruppe til valutaene dere faktisk bruker, og sett en standard så skjemaet åpnes på den riktige. En ferie i Portugal trenger ikke 139 andre alternativer ved siden av middagsregningen, og et [bryllup i utlandet](page:use-case/events-and-celebrations) trenger nok to.
limits:
  heading: Grenser
  items:
    - Kursen låses når utgiften lagres. Gamle utgifter revurderes aldri.
    - Side Badger henter en gjeldende kurs der det er mulig. Ikke alle valutapar er garantert å få en, og du kan alltid skrive inn kursen selv.
    - Automatisk konvertering for gruppen gjelder bare nye og kopierte utgifter, ikke redigeringer eller eksisterende utgifter.
    - Hver utgift er begrenset til 999 999,99 i sin egen valuta.
    - Det finnes 140 valutaer. Kryptovalutaer og metaller er ikke blant dem.
    - Side Badger registrerer betalinger. Den flytter eller veksler aldri penger.
useCasesHeading: Hvor dette hjelper
faq:
  heading: Spørsmål
  items:
    - q: Hvilken valutakurs bruker dere?
      a: En gjeldende valutakurs, hentet når du legger inn utgiften der en er tilgjengelig. Du kan endre den til kursen du faktisk fikk, og det konverterte beløpet oppdateres.
    - q: Revurderes gamle utgifter?
      a: Nei. Kursen låses når utgiften lagres, så en saldo driver ikke bare fordi markedet gjorde det.
    - q: Støtter dere krypto?
      a: Nei. Det finnes 140 valutaer, og kryptovalutaer er ikke blant dem.
    - q: Hvorfor kan jeg ikke legge inn 2 000 000 rupiah?
      a: Hver utgift er begrenset til 999 999,99 i sin egen valuta. Legg den inn i en annen valuta og konverter, eller del den i to utgifter.
    - q: Koster konvertering noe?
      a: Nei. Konvertering er gratis, som resten av Side Badger. Se [priser](page:pricing).
    - q: Må jeg konvertere?
      a: Nei. Valutaer holdes adskilt med mindre du eller gruppen velger å konvertere, og hver valuta får sin egen korte liste over betalinger.
