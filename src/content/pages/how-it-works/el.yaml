        method: equal
sections:
  - heading: "39 γλώσσες και φτιαγμένο για περισσότερους ανθρώπους"
    body: "Χρησιμοποιήστε το Side Badger σε 39 γλώσσες, μεταξύ αυτών τα αραβικά, τα περσικά και τα ουρντού, που γράφονται από δεξιά προς τα αριστερά. Ο καθένας στην ομάδα μπορεί να διαλέξει τη δική του, οπότε η σελίδα της ομάδας μπορεί να είναι στα αραβικά για ένα άτομο και στα αγγλικά για το επόμενο. Είναι φτιαγμένο και με γνώμονα όσους χρησιμοποιούν πληκτρολόγιο και αναγνώστες οθόνης, ενώ τα χρώματα των μελών έχουν μοτίβα, ώστε να μην χρειάζεται να ξεχωρίζετε το πράσινο από το κόκκινο."
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Χρειάζεται λογαριασμό ο καθένας;"
      a: "Ναι, δωρεάν. Κάθε άτομο επαληθεύει το email του πριν προσθέσει οτιδήποτε."
    - q: "Υπάρχει εφαρμογή;"
      a: "Τρέχει στο πρόγραμμα περιήγησης και μπορείτε να την προσθέσετε στην αρχική οθόνη ή στο dock ώστε να ανοίγει σαν εφαρμογή. Δεν υπάρχει έκδοση καταστήματος ούτε λειτουργία χωρίς σύνδεση."
    - q: "Μετακινεί χρήματα το Side Badger;"
      a: "Όχι. Κρατά τον λογαριασμό και προτείνει πληρωμές, και εσείς πληρώνετε ο ένας τον άλλον όπως θέλετε. Έπειτα καταγράφετε την πληρωμή. Δείτε την [εκκαθάριση](page:feature/settle-up)."
    - q: "Μπορεί κάποιος να φύγει χρωστώντας χρήματα;"
      a: "Όχι. Κανείς δεν μπορεί να αφήσει μια ομάδα όσο χρωστά ή του χρωστούν χρήματα, οπότε τακτοποιείται πρώτα."
    - q: "Πόσα άτομα μπορούν να μπουν σε μια ομάδα;"
      a: "Έως 50 άτομα σε μια ομάδα. Προσκαλέστε τα με σύνδεσμο ή κωδικό QR και ενεργοποιήστε την έγκριση αν θέλετε ένας διαχειριστής να αφήνει μέσα κάθε άτομο."
    - q: "Και τα ταξίδια με περισσότερα από ένα νομίσματα;"
      a: "Τα υπόλοιπα τηρούνται ξεχωριστά για κάθε νόμισμα. Δείτε τα [πολλά νομίσματα](page:feature/multiple-currencies)."
