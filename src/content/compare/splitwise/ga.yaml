sections:
  - heading: "Caint airgid, cois an airgid"
    body: "Bíonn comhrá, amhras agus pleananna mar chuid d'airgead comhroinnte. Coinníonn Side Badger an triúr acu cois na bhfigiúirí, ionas nach gcaithfidh aon duine scrollú siar tríd an gcomhrá grúpa."
    items:
      - "**Tráchtanna san áit cheart.** Déan trácht ar an ngrúpa féin, nó ar aon chostas, liosta nó vótaíocht, agus coinnigh an comhrá lena bhfuil á phlé."
      - "**Admhálacha agus grianghraif.** Coinnigh suas le trí admháil ar gach costas, agus cuir grianghraif nó PDFanna le tráchtanna ar an ngrúpa, ar liosta nó ar vótaíocht."
      - "**Ceisteanna, ní argóintí.** Is féidir le riarthóir ceisteanna a chur ar siúl, agus ansin is féidir le duine ar bith atá i gcostas ceist a chur faoi. Fanann sé amach as na hiarmhéideanna go dtí go mbíonn sé réitithe."
      - "**Liostaí agus vótaíochtaí.** Coinnigh an liosta siopadóireachta comhroinnte cois na mbillí siopadóireachta, agus cuir gearrliosta na víleanna faoi vóta, gan ainm más mian leat."
      - "**Bualadh bos beag.** Freagair do chostais, d'íocaíochtaí agus do thráchtanna, agus ceiliúir íocaíocht nuair a thagann sí."
  - heading: "Do ghrúpa, do rialacha"
    body: "Deir lárionad cabhrach Splitwise nach dtacaíonn sé le riarthóirí grúpa ná le ceadanna speisialta. Tá róil agus ceadanna ag Side Badger, do na grúpaí a theastaíonn duine uathu chun na figiúirí a choinneáil néata."
    items:
      - "**Riarthóirí, baill agus breathnóirí.** Déan breathnóir de dhuine: feiceann siad gach rud agus ní athraíonn siad aon rud."
      - "**Dhá réamhshocrú, nó do cheann féin.** Tosaigh le Comhoibriú oscailte nó le Grúpa bainistithe, nó socraigh gach cead tú féin: cé a chuireann in eagar agus a scriosann costais, a chuireann liostaí in eagar, a thugann cuireadh agus a ligeann daoine nua isteach."
      - "**Faomhadh chun páirt a ghlacadh.** Cuir faomhadh ar siúl agus ligeann riarthóir gach duine isteach."
      - "**Socruithe an ghrúpa féin.** Cuir teorainn leis na hairgeadraí a úsáideann tú i ndáiríre, roghnaigh a airgeadra réamhshocraithe agus tabhair íomhá cheannteidil dó."
      - "**Cuir faoi ghlas é nuair a bhíonn sé thart.** Fanann na figiúirí mar atá go dtí go scaoileann riarthóir an glas."
  - heading: "Saor in aisce anseo, íoctha ansin"
    body: "Is é Splitwise Pro plean íoctha Splitwise, agus díolann a leathanach Pro féin trí rud nach gcosnaíonn tada i Side Badger."
    items:
      - "**Scanadh admhálacha.** Scanann Splitwise Pro grianghraf d'admháil. Déanann Side Badger é saor in aisce, gan creidmheasanna scanta: líonann sé isteach an t-iomlán, an dáta agus an áit duit le seiceáil."
      - "**Tiontú airgeadra.** Tiontaíonn Splitwise Pro costais grúpa go dtí d'airgeadra réamhshocraithe nuair a thapálann tú Convert. Tiontaíonn Side Badger gach costas agus tú á chur isteach, ar ráta malairte reatha nó ar an ráta a fuair tú i ndáiríre, agus fanann an tsuim bhunaidh ar an gcostas."
      - "**Gan teorainneacha laethúla.** Díolann Splitwise Pro costais gan teorainn, agus deir a lárionad cabhrach gur féidir le húsáideoirí saor in aisce suas le 4 chostas a chur leis gach lá. Níl aon teorainneacha laethúla i Side Badger."
  - heading: "Fanann do bhanc amach as"
    body: "Ní nascann Side Badger le do bhanc agus ní iarrann sé sonraí do bhainc. Coinníonn sé an taifead ar cé atá i bhfiacha le cé; íocann sibh a chéile ar an gcaoi is fearr libh, ansin taifeadann sibh an íocaíocht. Gan logáil isteach bainc le tabhairt uait, mar sin rud amháin níos lú le coinneáil slán."
  - heading: "Aip amháin, i do bhrabhsálaí agus ar do ghuthán"
    body: "Ritheann Side Badger i do bhrabhsálaí. Sínigh isteach, cuir le do scáileán baile é, agus osclaíonn sé cosúil le haip. Is é an aip chéanna é ar an dá bhealach, mar sin tá gné nua ar do ghuthán an chéad uair eile a osclaíonn tú é, gan nuashonrú siopa aipeanna le fanacht air."
  - heading: "Agus cúpla cleas cóisire"
    items:
      - "**Fiafraigh de do chúntóir.** Oibríonn Side Badger le ChatGPT agus le Claude: iarr ar do chúntóir costas a chur leis, admháil a scanadh nó íocaíocht a thaifeadadh."
      - "**Gach duine ina rogha teanga.** Labhraíonn Side Badger 39 teanga agus roghnaíonn gach duine a rogha féin. Deir leathanach baile Splitwise 7+. Láimhseálann sé 133 airgeadra freisin, don turas a théann i ngach áit."
      - "**Cabhair gan an aip a fhágáil.** I do sháinn, nó fuair tú fabht? Inis dúinn ón aip agus léigh ár bhfreagra ansin ar an toirt."
  - heading: "Cá bhfuil Splitwise fós chun tosaigh"
    body: "B'fhearr linn gur roghnaigh tú an aip cheart ná go bhfaighfeá amach níos déanaí. Má theastaíonn ceann de na rudaí seo ó do ghrúpa, tá sé ag Splitwise agus níl ag Side Badger."
    items:
      - "**Aipeanna siopa aipeanna.** Maireann Side Badger i do bhrabhsálaí agus ar do scáileán baile, ní sna siopaí aipeanna."
      - "**Mód as líne.** Teastaíonn nasc ó Side Badger."
      - "**Íocaíochtaí san aip.** I roinnt tíortha is féidir le Splitwise an t-airgead a aistriú freisin. Ní choinníonn Side Badger ach an taifead."
      - "**Roinnt de réir sciar nó de réir míre.** Tá duine amháin ag íoc as gach costas i Side Badger, roinnte go cothrom, de réir suimeanna cruinne nó de réir céatadáin. Ní shanntaíonn a scanadh admhálacha míreanna do dhaoine."
      - "**Cairteacha agus roinnt réamhshocraithe.** Tá an dá cheann ag Splitwise Pro. Coinníonn Side Badger cuntas ar cé atá i bhfiacha le cé, agus sin an cleas ar fad."
  - heading: "Do ghrúpa a aistriú anall"
    body: "Níl aon uirlis allmhairithe ann, mar sin ciallaíonn aistriú tús nua. Glan na fiacha i Splitwise ar dtús, ansin cruthaigh grúpa i Side Badger agus tabhair cuireadh do gach duine le nasc nó le cód QR. Teastaíonn cuntas saor in aisce ó gach duine sa ghrúpa, agus níl uait chun clárú ach seoladh ríomhphoist."
