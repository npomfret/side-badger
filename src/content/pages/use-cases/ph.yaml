meta:
  title: Side Badger para sa housemates, biyahe, at handaan
  description: Hatiin ang gastos kasama ang housemates, sa mga group trip, at para sa handaan, kasal, at regalo ng grupo. Tingnan ang ginagawa ng Side Badger sa bawat uri ng grupo.
h1: Side Badger para sa uri ng grupo mo
navLabel: Mga use case
lead: Housemates, bakasyon, bachelorette. Piliin ang sarili mong kaguluhan, saka tingnan kung paano nagbibilang ang grupong tulad ng sa iyo.
intro: Magkakaiba ang paraan ng paghahati ng bawat grupo. Sinusundan ng mga pahinang ito ang isang **makatotohanang sitwasyon** mula sa unang gastos hanggang sa huling naitalang bayad, kasama ang mga kuwenta, para makita mo ang kahihinatnan ng sarili mong grupo.
cta:
  heading: Nakita mo na ba ang uri ng grupo mo?
  body: Gumawa ng account, magsimula ng grupo, at idagdag ang unang gastos. Ilang minuto lang.
cardsHeading: Piliin ang pinakamalapit sa sitwasyon mo
sections:
  - heading: Mga group trip
    body: Mga flight sa pounds, villa sa euro, at hapunang tatlo lang ang kumain. Itakda ang grupo na mag-convert sa pounds at apat na magkakaibigan sa Lisbon ang matatapos sa tatlong bayad, sa halip na anim kapag magkahiwalay ang mga pera. [Hatiin ang gastos sa group trip](page:use-case/group-trips).
  - heading: Mga housemate
    body: Isa ang nagbabayad sa may-ari ng bahay, isa ang nakakaalala sa kuryente, at walang nagkakasundo kung sino ang bumili ng toilet paper. Kapag hinati ang upa ayon sa laki ng kuwarto at pantay ang iba pang bayarin, apat na housemate ang matatapos ang buwan sa tatlong bayad, lahat sa nagbayad ng upa. [Hatiin ang bayarin sa bahay kasama ang housemates](page:use-case/housemates).
  - heading: Handaan, kasal, at regalo ng grupo
    body: Anim na tao ang bumoboto sa regalo, isa ang bumibili, at hindi pare-pareho ang ambag ng bawat isa. Ang £150 na regalo na hinati ayon sa eksaktong halaga ay nag-iiwan ng limang bayad sa bumili, £120 lahat. [Hatiin ang gastos sa isang event](page:use-case/events-and-celebrations).
  - heading: Magkapareha
    body: Hatiin ang mga nakakabagot na gastos nang hindi ginagawang budget meeting ang date night. Ang upang hinati sa 60/40 at ang grocery na hinati nang pantay ay nagiging isang bayad na lang sa pagitan ninyong dalawa.
  - heading: Tingnan muna kung paano ito gumagana
    body: Pare-pareho ang mga hakbang sa bawat halimbawa sa itaas, mula sa paggawa ng grupo hanggang sa pagtatala ng mga bayad. Ipinapakita ng [paano ito gumagana](page:how-it-works) ang mga ito, at sinasabi ng [presyo](page:pricing) kung magkano ito, na wala, walang ad at walang pang-araw-araw na limitasyon.
faq:
  heading: Mga tanong
  items:
    - q: Kailangan ba ng account ng lahat sa grupo?
      a: Oo. Sumasali ang mga tao gamit ang link o QR code at isang libreng account.
    - q: Puwede bang mangolekta ng pera ang Side Badger?
      a: Hindi. Magbayad kayo sa paraang gusto ninyo, saka itala ang bayad para tama ang mga balanse.
    - q: Kailangan ko bang pumili ng isang uri ng grupo?
      a: Hindi. Mga halimbawa lang ang mga use case, hindi mga setting. Pareho ang mga feature ng bawat grupo, kaya gamitin ang kumbinasyong bagay sa iyo.
