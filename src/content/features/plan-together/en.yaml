sections:
  - heading: Comments and reactions, next to the numbers
    body: Every expense has its own comment thread, and so do the group, each list and each poll. Ask why the taxi cost that much under the taxi, not in a chat nobody scrolls back through. Add a photo of the receipt or a PDF of the booking, then react with a thumbs up, heart, laugh, wow, sad or celebrate on expenses, payments and comments. Celebrate a payment when it lands. It is the closest Side Badger gets to a round of applause.
  - heading: Question an expense without starting a row
    body: When the group has expense questions switched on, anyone included in an expense can choose **I have a question** and say why. The question is posted as a comment on the expense, the expense gets a **Questioned** badge, and the whole expense drops out of everyone's balances until the question is dealt with.
    items:
      - "**Turning it on.** It is off by default. An admin switches on **Allow expense questions** in the group's settings, under **Features**."
      - "**Closing it.** The person who asked, or an admin, chooses **Close question**. If several people questioned the same expense, it goes back into the balances when the last question is closed."
      - "**Editing it.** When an expense is edited, an open question carries over to the new version for everyone who still has a share in it. Anyone the edit leaves out has their question end with the old version, so there is nothing left for them to close."
      - "**Finding them.** The expenses list has an **Only questioned** filter. This is not an approval step: only the expenses somebody questions are held, and everything else counts as soon as it's added."
  - heading: How a question plays out
    body: Tom adds £45 of party wine, split between all three housemates. Aisha didn't drink, so she raises a question, and while it's open the wine counts for nobody. The house agrees the wine is Tom and Priya's, so Tom edits the split to the two of them. Aisha is no longer in the expense, so her question ends with the earlier version, which is kept, and the wine rejoins the balances straight away at £22.50 each instead of £15 each. Had Aisha stayed in the expense, her question would have carried over and waited for her or an admin to close it. Below, Aisha's £48 is £28 of the shop and £20 of the cleaner, and Priya's £10.50 is her £70.50 share (£28, £20 and £22.50) less the £60 she paid. A very [housemates](page:use-case/housemates) kind of argument. For how to word a question, see [what to do when someone disputes a shared expense](page:guide/what-to-do-when-someone-disputes-a-shared-expense).
  - heading: Shared lists, for the shopping
    body: Start a list in the group, name it something like Shopping List, add items and tick them off. Drag items into a better order, watch the progress count climb and comment on the list when someone buys the wrong oat milk. Archive a finished list to tidy it away (**Show archived** brings it back), or copy a list to reuse it. Keep the shared shopping list next to the shopping bills, so the list says what to buy and the expense says what it cost. Who can create and edit lists depends on the group's permissions, which [groups and permissions](page:feature/groups-and-permissions) explains.
  - heading: Polls, anonymous if you like
    body: Ask the group something that decides the bill, such as which villa, how much to spend on the gift or whether the boat trip is worth it. A poll has a question and two to ten options. You choose how many votes each person gets, from a single choice up to ten, and whether voting is anonymous. **Anonymous voting** hides who voted for what, and it can't be changed once the first vote is in. People can change or remove their vote until the poll closes, and you can reopen it if the group has second thoughts. Choosing the villa is exactly what [group trips](page:use-case/group-trips) are made of, and agreeing the gift budget is a classic for [events and celebrations](page:use-case/events-and-celebrations).
  - heading: The activity feed, so nothing changes quietly
    body: Every group has an activity history, and the notifications bell collects activity from all your groups in one place. Add an expense and everyone sees it straight away, without refreshing, and the feed shows what changed and who changed it. That covers expenses added, edited or deleted, questions raised and closed, comments, list and poll changes, and payments recorded.
  - heading: Push notifications, if you want them
    body: Push notifications are optional. Turn them on in your account **Settings**, under **Notifications**, and your device lets you know when there is new activity in your groups, such as a new expense or a comment. Each device is switched on separately, and your browser asks for permission first. On an iPhone or iPad they work only in the app added to the Home Screen, which the [web app](page:feature/web-app) page explains. Treat them as a convenience, not a promise, because delivery isn't guaranteed.
limits:
  heading: Limits
  items:
    - Comments, lists and polls are for the group's money. The [terms](page:terms) ask that everything posted relates to group finances, so this is a place to plan the spending, not a general chat or a to-do app.
    - A comment can be up to 500 characters, with up to three attachments that are images or PDFs of up to 5 MB each. Only the author can delete a comment.
    - Expense questions are off by default, and an admin turns them on for each group. Only people included in an expense can question it, turning the feature off clears every open question, and nobody can leave the group while an expense they're part of has an open question.
    - A group can hold up to 100 lists, each with up to 200 items of up to 500 characters. Group permissions decide who can create, edit and delete lists, and a locked group allows no changes.
    - A group can hold up to 50 polls, each with two to ten options and up to ten votes per person. Polls have no deadline and don't close on their own.
    - The activity history is kept for 90 days.
    - Push notifications are opt-in for each account and each device. They need a browser that supports them and your permission, they work on iPhone and iPad only from the app added to the Home Screen, and delivery isn't guaranteed. There are no email or text alerts for activity and no payment reminders, so chasing a payment is still up to you.
useCasesHeading: Where planning together helps
faq:
  heading: Questions
  items:
    - q: Can votes be anonymous?
      a: Yes. Switch on **Anonymous voting** when you create the poll and it hides who voted for what. Decide before the first vote, because it can't be changed afterwards.
    - q: Can a poll close on its own?
      a: No. A poll has no deadline, so the person who created it chooses **Close poll** once the group has decided. If the group has second thoughts, **Reopen poll** brings it back.
    - q: How many items can a list hold?
      a: Up to 200 items per list and up to 100 lists per group. Each item can be up to 500 characters, which is a lot of oat milk.
    - q: Who can close a question, and what happens to the expense meanwhile?
      a: The person who asked, or a group admin. While a question is open, the whole expense is out of everyone's balances. It goes back in when the last open question on it is closed, or when an edit takes the person who asked out of the expense.
    - q: Can I use lists and comments as a to-do app or a group chat?
      a: No. Comments, lists and polls are for the group's money, which is what the [terms](page:terms) ask. Think shopping lists, budget polls and "why is this £45?".
    - q: Will Side Badger email me about activity?
      a: No. There are no email or text alerts for activity. You can turn on push notifications on each device, and the notifications bell in the app shows what's new.
