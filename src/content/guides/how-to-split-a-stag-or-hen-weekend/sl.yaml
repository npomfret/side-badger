faq:
  heading: "Vprašanja"
  items:
    - q: "Ali priča ali glavni organizator plača več?"
      a: "Samo če se skupina tako dogovori. Aplikacija nikomur ne daje posebne vloge pri računih. Če kdo krije več, pod **Način razdelitve** izberi **Točni zneski** ali **Odstotek** in vnesi dogovorjene deleže."
    - q: "Kaj pa pijača, ki je nekateri niso pili?"
      a: "Pijačo dodaj kot samostojen strošek in označi samo tiste, ki so jo pili. Če je vsak popil drugače, izberi **Točni zneski** in vtipkaj delež vsake osebe. Nihče ne plača tistega, česar ni imel."
    - q: "Ali slavljenec pozneje lahko vidi skupino?"
      a: "Da, ko presenečenja ni več. Povabi ga, nato ga lahko skrbnik pod **Varnost** v nastavitvah skupine nastavi za **Gledalca**. Gledalec vidi vse in ne spreminja ničesar, zato počakaj, da ni več nobene skrivnosti. Za pridružitev potrebuje brezplačen uporabniški račun."
