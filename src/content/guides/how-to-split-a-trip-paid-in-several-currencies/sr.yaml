meta:
  title: "Како поделити путовање плаћено у више валута | Side Badger"
  description: "Фунте за хотел, јени за рамен. Поравнај сваку валуту посебно или претвори по курсу који видиш. Оба пута израчуната, рачуница приказана."
h1: "Како поделити путовање плаћено у више валута"
navLabel: "Путовања у више валута"
lead: "Унеси сваки трошак у валути у којој си платио, па изабери пут. Држи валуте одвојено и поравнај сваку у њеном новцу, или претвори по актуелном девизном курсу и поравнај једном. Исто путовање у Јапан износи четири уплате на први начин и две на други."
cta:
  heading: "Унеси то у новцу у ком си платио"
  body: "Направи бесплатан налог, оснуј групу за путовање и додај сваки трошак у валути која пише на рачуну. Желиш прво детаље? Погледај [више валута](page:feature/multiple-currencies) или [шта покрива бесплатан налог](page:pricing)."
sections:
  - heading: "Троје пријатеља, један хотел, много јена"
    body: "Зои, Кенџи и Луси проводе недељу дана у Јапану на [групном путовању](page:use-case/group-trips) и сваки трошак се дели једнако на троје. Зои је код куће резервисала хотел у фунтама, за 600 £. Луси је у Токију купила возне карте за 90.000 ¥. Кенџи је платио рамен вече, 9.000 ¥, и то помиње сваког дана. Нико не жели да претвара три рачуна на перону. За рачуницу овде, 1 ¥ је 0,005 £, округао курс измишљен за овај водич. У апликацији би користио актуелни девизни курс или укуцао онај који си заиста добио."
  - heading: "Унеси сваки у новцу са рачуна"
    body: "Овај део радиш без обзира на пут који изабереш. Још ништа не треба претварати."
    items:
      - "**Оснуј групу.** На контролној табли изабери **Креирај групу**, назови је по путовању, затим изабери **Позови друге** и пошаљи везу или QR код."
      - "**Додај хотел.** Изабери **Додај трошак** и унеси 600, са фунтама као валутом поред износа. Под **Ко је платио?** изабери Зои. Остави сву тројицу под **Подели између**, остави **Начин поделе** на **Једнако** и изабери **Сачувај трошак**."
      - "**Додај јене.** Уради исто за возне карте (платила Луси) и рамен (платио Кенџи), са јенима као валутом. Јен нема децимале, па их образац и не тражи."
  - heading: "Први пут: држи валуте одвојено"
    body: "Side Badger води стање за сваку валуту и не пребија једну са другом. У фунтама, хотел је 200 £ по особи, па Кенџи и Луси дугују Зои по 200 £. У јенима, возне карте и рамен износе 99.000 ¥, а то је 33.000 ¥ по особи. Луси је платила 90.000 ¥ и потражује 57.000 ¥. Зои није платила ниједан јен и дугује 33.000 ¥. Кенџи је платио 9.000 ¥, па дугује 24.000 ¥."
    items:
      - "**Фунте.** Кенџи плаћа Зои 200 £ и Луси плаћа Зои 200 £."
      - "**Јени.** Зои плаћа Луси 33.000 ¥ и Кенџи плаћа Луси 24.000 ¥."
      - "**Укупно четири уплате.** Зои и Луси дугују једна другој у две валуте које се не пребијају. Курс ту не игра никакву улогу, па нема о чему да се свађате."
      - "**Дугујеш јене, плаћаш у фунтама.** Ко нема јене и даље може да плати у фунтама. Кад бележиш уплату, отвори **Друга валута?**, изабери **Конвертуј у** фунте и провери курс. Зоиних 33.000 ¥ је 165 £ по курсу из овог водича, а стање у јенима и даље излази тачно."
      - "**Забележи сваку уплату.** Платите једни другима како год желите, па изабери **Поравнај** и користи **Забележи поравнање**. Више о томе у делу о [поравнању](page:feature/settle-up)."
  - heading: "Други пут: претварај успут"
    body: "Ако група радије види по један број за сваког, претвори кад уносиш трошак."
    items:
      - "**Претвори у обрасцу.** На **Додај трошак** изабери **Конвертуј у** и одабери фунте. Side Badger показује курс и претворени износ, означен знаком ≈. Измени курс ако си добио другачији. Изворни износ у јенима остаје уз трошак."
      - "**Прочитај фунте.** Уз 1 ¥ = 0,005 £, возне карте постају 450 £, а рамен 45 £. Са хотелом од 600 £ то је 600 £ + 450 £ + 45 £ = 1.095 £, или 365 £ по особи. Зои је платила 600 £, па потражује 235 £. Луси је платила 450 £ и потражује 85 £. Кенџи је платио 45 £ и дугује 320 £."
      - "**Две уплате.** Обе од Кенџија: 235 £ Зои и 85 £ Луси. Зои и Луси више уопште не плаћају једна другој."
      - "**Или постави валуту групе.** Да прескочиш додатни корак, отвори **Подешавања** групе, пронађи **Подешавања валута** и изабери **Аутоматски претвори трошкове у**. Сваки нови трошак се тада претвара у ту валуту, и даље по курсу који видиш и можеш да измениш."
  - heading: "Који пут да изабереш?"
    items:
      - "**Држи их одвојено** кад људи још имају јене у новчаницима или кад радије не би да се свађате око курса. Цена су више уплата, у више од једне валуте."
      - "**Претвори** кад група живи у једној валути и жели по један број за сваког и краћи списак, као Кенџијеве две уплате. Цена је то што група верује курсу, а курс се утврђује на сваком трошку кад се сачува."
      - "**Одлучите рано.** Валута групе претвара само нове и копиране трошкове. Неће се вратити и средити оно што си већ унео."
  - heading: "Курс и ограничење"
    items:
      - "**Курс се утврђује кад сачуваш.** Стари трошкови се никад не прерачунавају, па стање не клизи зато што се променило тржиште. Трошкови унети различитих дана могу имати различите курсеве, па ако група жели један курс за цело путовање, договорите га и укуцајте сваки пут."
      - "**Нема курса? Укуцај га.** Side Badger преузима актуелни девизни курс где може, али није за сваки пар загарантован. Ако га нема, или ти је мењачница дала бољи договор, укуцај свој."
      - "**999.999,99 по трошку, у његовој валути.** Једно ограничење, без обзира на новац. У јенима то је нешто мање од 1.000.000 ¥, око 5.000 £ по курсу из овог водича. У валути са великим бројевима, као што је индонежанска рупија, један рачун га може достићи пре. Подели рачун на два трошка или га унеси у другој валути и претвори."
  - heading: "Шта Side Badger овде не ради"
    items:
      - "Никад не премешта нити мења новац. Платите једни другима како год желите, па забележите уплату."
      - "Има 140 валута. Криптовалуте и метали нису међу њима."
