faq:
  heading: "Spørsmål"
  items:
    - q: "Kan jeg stille spørsmål ved bare min andel?"
      a: "Nei. Et spørsmål holder hele utgiften utenfor, for alle som er med i den. Er det bare delingen som er feil, er løsningen å redigere delingen."
    - q: "Hvem kan lukke et spørsmål?"
      a: "Den som spurte, eller en gruppeadministrator. Hvis den som la inn utgiften ikke er administrator, kan vedkommende ikke lukke spørsmålet på vegne av den som spurte."
    - q: "Sletter en redigering originalen?"
      a: "Nei. Den tidligere versjonen blir lagret. Hvem som kan redigere, avgjøres av gruppens tillatelser, så det er verdt å si fra til huset først, fordi saldoene endres."
