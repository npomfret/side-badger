faq:
  heading: "Vragen"
  items:
    - q: "Wat als we meer inzamelen dan het cadeau kost?"
      a: "De exacte bedragen moeten samen de prijs vormen, dus snoei in de aandelen tot dat zo is. Of besteed het surplus aan iets echts, zoals bloemen, en voer dat in als tweede uitgave, zoals de wenskaart en het inpakpapier in het voorbeeld."
    - q: "Kan iemand bijdragen zonder lid van de groep te worden?"
      a: "Niet als je die persoon in de telling wilt. Iedereen in de verdeling heeft een gratis account nodig en moet in de groep zitten. Heeft iemand enkel cash, dan kan Priya dat aannemen en het cadeau invoeren voor wat de groep nog schuldig is. Als Sam haar bijvoorbeeld £ 40 cash gaf, voert ze £ 200 in en verdeelt ze het 60, 60 en 80 tussen zichzelf, Omar en Lena."
    - q: "Kan de peiling bepalen hoeveel elke persoon bijdraagt?"
      a: "Nee. Een peiling bepaalt één bedrag voor de hele groep, zoals het budget. Het aandeel van elke persoon spreken jullie onderling af, en dan typ je het in de uitgave in als **Exacte bedragen**."
