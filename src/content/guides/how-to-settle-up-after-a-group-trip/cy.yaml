faq:
  heading: "Cwestiynau"
  items:
    - q: "Pwy ddylai gofnodi taliad, y person sy'n talu neu'r person sy'n cael ei dalu?"
      a: "Mae cofnodi taliad angen caniatâd i olygu costau, ac mae'r ffurflen yn gofyn **Pwy dalodd?** a **Pwy dderbyniodd y taliad?** Dim ond y person a gofnododd y taliad all ei olygu'n ddiweddarach, felly mae'n symlaf fel arfer os mai'r talwr sy'n ei wneud, gan ddefnyddio'r botwm setlo cyflym."
    - q: "Beth os oedd y daith mewn dau arian cyfred?"
      a: "Cedwir balansau fesul arian cyfred, felly mae dyled ewro yn aros yn ddyled ewro ac mae pob arian cyfred yn cael ei restr fer ei hun, oni bai bod costau wedi'u trosi pan gawsant eu rhoi i mewn. Mae [sawl arian cyfred](page:guide/how-to-split-a-trip-paid-in-several-currencies) yn dangos y ddwy ffordd."
    - q: "A ddylem setlo yn ystod y daith neu ar y diwedd?"
      a: "Mae'r naill neu'r llall yn gweithio. Mae pob taliad a gofnodir yn newid y balansau, felly mae taliad a wneir hanner ffordd drwy'r daith yn cyfrif tuag at y rhestr olaf. Mae setlo ar y diwedd yn symlach, oherwydd bod [y daith gyfan](page:use-case/group-trips) mewn un lle."
