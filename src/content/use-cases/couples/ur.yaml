meta:
  title: "جوڑے کے لیے بل تقسیم کریں، آدھا آدھا یا آمدنی کے مطابق | Side Badger"
  description: "عام اخراجات بانٹیں، بغیر ڈیٹ نائٹ کو سہ ماہی مالی جائزہ بنائے۔ آدھا آدھا، آمدنی کے مطابق یا بل بہ بل تقسیم کریں، اور دیکھیں کس کو کس کا دینا ہے۔ مفت۔"
h1: "جوڑے کے طور پر اخراجات منصفانہ بانٹیں"
navLabel: "جوڑے"
lead: "عام اخراجات بانٹیں، بغیر ڈیٹ نائٹ کو سہ ماہی مالی جائزہ بنائے۔ Side Badger ان **جوڑوں** کے لیے کرائے، بلوں اور خریداری کا ایک چلتا ہوا حساب رکھتا ہے جو گھر، صوفہ اور اس دھندلی سی یاد میں شریک ہیں کہ براڈ بینڈ کس نے بھرا تھا۔ اسے آدھا آدھا، آمدنی کے مطابق یا بل بہ بل تقسیم کریں، اور دیکھیں کس کو کس کا دینا ہے۔"
cta:
  heading: "دو کا گروپ شروع کریں"
  body: "اکاؤنٹ بنائیں، گروپ بنائیں اور اپنے ساتھی کو دعوتی لنک بھیجیں۔ آج رات کا ٹیک اوے پہلا خرچہ ہو سکتا ہے۔"
scenario:
  heading: "منصفانہ کا مطلب آدھا آدھا ہونا ضروری نہیں"
  body: "سیم اور ایلکس ایک گھر بانٹتے ہیں۔ سیم زیادہ کماتا ہے، اس لیے انہوں نے طے کیا کہ کرائے کا 60% سیم دے گا اور 40% ایلکس۔ سیم مالک مکان کو ادا کرتا ہے، ایلکس خریداری کرتا ہے، اور دونوں کو کافی یقین ہے کہ سب برابر ہو جاتا ہے۔ «کافی یقین» ہی وہ جگہ ہے جہاں کسی کے فون کا نوٹ مستقل اختلاف بن جاتا ہے۔ اس لیے اپنے دونوں کے لیے گروپ بنائیں، وہ نام چنیں جو آپ چاہتے ہیں آپ کا ساتھی دیکھے، اور اسے دعوتی لنک یا QR کوڈ بھیجیں۔ ہر خرچہ ہوتے ہی شامل کریں، بتائیں کس نے ادا کیا اور کیسے بٹتا ہے، اور حساب گروپ کو رکھنے دیں۔ ہر چھٹی کے لیے الگ گروپ بنائیں ([گروپ سفر](page:use-case/group-trips) دیکھیں)، تاکہ پروازیں گروسری سے الگ رہیں۔"
sections:
  - heading: "آدھا آدھا، آمدنی کے مطابق، یا بل بہ بل"
    body: "کوئی عالمگیر منصفانہ تقسیم نہیں ہوتی، صرف وہ جس پر آپ دونوں متفق ہوں، بہتر ہے پہلے بل سے پہلے، نہ کہ پہلی آہ کے بعد۔ عام طور پر یہ تین ہیں۔"
    items:
      - "**آدھا آدھا۔** **برابر** چنیں اور ہر ایک آدھا دیتا ہے۔ یہ تب موزوں ہے جب آپ کی آمدنیاں قریب ہوں، اور اس میں حساب کی کوئی ضرورت نہیں۔"
      - "**آمدنی کے مطابق۔** اگر ایک زیادہ کماتا ہے تو ہر شخص کی آنے والی رقم کے حصے کے مطابق تقسیم کریں۔ پہلے طے کریں کہ کیا شمار ہوگا (ہاتھ میں آنے والی تنخواہ عام انتخاب ہے)، دونوں کو جمع کریں اور اپنی کو کل پر تقسیم کریں۔ اگر ایک کو تین حصے ملیں اور دوسرے کو دو، تو یہ 3 ÷ (3 + 2) = 60% ہے، یعنی ایک 60% اٹھاتا ہے اور دوسرا 40%۔ پورے فیصد تک راؤنڈ کریں اور انہیں **فیصد** کے تحت درج کریں، جہاں ان کا مجموعہ 100 ہونا ضروری ہے۔ تنخواہ درج کرنے کی کوئی جگہ نہیں، اس لیے آپ صرف فیصد ہی ٹائپ کرتے ہیں۔"
      - "**بل بہ بل۔** ہر خرچے کی اپنی تقسیم ہوتی ہے، اس لیے آپ ملا سکتے ہیں: کرایہ آمدنی کے مطابق، گروسری آدھا آدھا، اور مشترکہ تحفہ **عین رقمیں** سے اگر آپ دونوں نے اپنی مرضی کی رقم ڈالی۔"
      - "**جب تنخواہ بدلے،** اگلے خرچے سے نئے فیصد استعمال کریں۔ پچھلے اخراجات اس تقسیم کے ساتھ رہتے ہیں جس کے ساتھ درج ہوئے تھے۔ اصل تنخواہ کی پرچیوں کے ساتھ حساب دیکھنے کے لیے [زیادہ کمانے والے ساتھی کے ساتھ بل کیسے تقسیم کریں](page:guide/how-to-split-bills-with-a-partner-who-earns-more) پڑھیں۔"
  - heading: "ماہانہ جائزہ"
    body: "مہینے میں ایک بار، یا جب اعداد کھجانے لگیں، گروپ کھولیں اور **بیلنسز** دیکھیں۔ آپ دونوں ہوں تو ہر کرنسی میں ہمیشہ صرف ایک ہی ادائیگی ہوتی ہے، جس کے ذمے ہے اس سے جسے ملنا ہے۔ سیم اور ایلکس کا مہینہ لیں۔ سیم نے £1,500 کرایہ ادا کیا، اور اس میں ایلکس کا 40% £600 ہے۔ ایلکس نے گروسری کے £90 ادا کیے، برابر تقسیم، تو سیم کا آدھا £45 ہے۔ Side Badger ایک کو دوسرے سے کاٹتا ہے، £600 منفی £45، اور ایلکس سیم کو £555 دیتا ہے۔ جیسے چاہیں ادا کریں، بینک ٹرانسفر، نقد یا کسی احسان کے بدلے، پھر اسے **تصفیہ کریں** کے تحت ریکارڈ کریں تاکہ بیلنس واپس صفر ہو جائے۔ بار بار آنے والے بل نہیں ہیں، اس لیے پچھلے مہینے کا کرایہ کاپی کریں، تاریخ بدلیں اور آگے بڑھیں۔ Side Badger رقم نہیں منتقل کرتا اور یاد دہانیاں نہیں بھیجتا، اس لیے یاد دلانا اب بھی آپ کا کام ہے۔"
  - heading: "بس آپ دونوں"
    body: "دو کے گروپ میں دو ارکان ہوتے ہیں، اور اسے صرف گروپ کے ارکان دیکھ سکتے ہیں۔ آپ کا ساتھی دعوتی لنک یا QR کوڈ سے شامل ہوتا ہے۔ لنک 15 منٹ سے 5 دن تک چل سکتا ہے، اس لیے سب سے چھوٹی مدت چنیں جو آپ کے ساتھی کو استعمال کرنے کا وقت دے۔ نیا لنک بنانے سے پرانے منسوخ نہیں ہوتے، اس لیے انہیں ایسی چیٹ میں نہ چھوڑیں جس میں اور لوگ بھی ہوں۔ فعال لنک استعمال کرنے والا کوئی بھی شامل ہو سکتا ہے، اس لیے پکا کرنا چاہیں تو منظوری آن کریں اور ایڈمن ہر شخص کو اندر آنے دے۔ آپ کے ساتھی کو اپنا اکاؤنٹ چاہیے، جو مفت ہے۔"
exampleAfter: 2
