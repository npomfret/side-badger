meta:
  title: "রুমমেট, ট্রিপ আর পার্টির জন্য Side Badger"
  description: "রুমমেটদের সঙ্গে, গ্রুপ ট্রিপে, আর পার্টি, বিয়ে ও গ্রুপ উপহারের খরচ ভাগ করুন। প্রতিটি ধরনের গ্রুপের জন্য Side Badger কী করে দেখুন।"
h1: "আপনার ধরনের গ্রুপের জন্য Side Badger"
navLabel: "ব্যবহারের ক্ষেত্র"
lead: "রুমমেট, ছুটি, বন্ধুদের আড্ডা। আপনার বিশৃঙ্খলাটা বেছে নিন, তারপর দেখুন আপনার মতো একটা গ্রুপ কীভাবে হিসাব রাখে।"
intro: "প্রতিটি গ্রুপ খরচ একটু আলাদাভাবে ভাগ করে। এই পৃষ্ঠাগুলো প্রথম খরচ থেকে শেষ রেকর্ড করা পেমেন্ট পর্যন্ত একটি **বাস্তবসম্মত পরিস্থিতি** অনুসরণ করে, পুরো হিসাবসহ, যাতে আপনি দেখতে পান আপনার নিজের গ্রুপের শেষে কী দাঁড়াবে।"
cta:
  heading: "আপনার ধরনের গ্রুপ খুঁজে পেলেন?"
  body: "অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম খরচটা যোগ করুন। কয়েক মিনিটই লাগে।"
  button: "বিনামূল্যে অ্যাকাউন্ট খুলুন"
cardsHeading: "আপনার পরিস্থিতির সবচেয়ে কাছেরটি বেছে নিন"
sections:
  - heading: "গ্রুপ ট্রিপ"
    body: "পাউন্ডে বিমানের টিকিট, ইউরোতে একটা ভিলা, আর এমন একটা ডিনার যেটা মাত্র তিনজন খেয়েছে। গ্রুপটাকে পাউন্ডে রূপান্তরের জন্য সেট করুন, তাহলে লিসবনে চার বন্ধু তিনটি পেমেন্টে শেষ করে, মুদ্রা আলাদা রাখলে যেখানে ছয়টি লাগত। [গ্রুপ ট্রিপের খরচ ভাগ করুন](page:use-case/group-trips)।"
  - heading: "রুমমেট"
    body: "একজন বাড়িওয়ালাকে দেয়, আরেকজনের বিদ্যুতের বিলটা মনে থাকে, আর টয়লেট রোল কে কিনেছে তা নিয়ে কারও মিল নেই। ভাড়া ঘরের আকার অনুযায়ী আর বাকি বিল সমান ভাগে করলে, চার রুমমেট মাস শেষ করে তিনটি পেমেন্টে, সবই যে ভাড়া দিয়েছে তার কাছে। [রুমমেটদের সঙ্গে বাড়ির বিল ভাগ করুন](page:use-case/housemates)।"
  - heading: "পার্টি, বিয়ে ও গ্রুপ উপহার"
    body: "ছয়জন উপহারের জন্য ভোট দেয়, একজন সেটা কেনে, আর সবাই একই পরিমাণ দেয় না। নির্দিষ্ট পরিমাণে ভাগ করা £150-এর উপহারে যে কিনেছে তার কাছে পাঁচটি পেমেন্ট যায়, সব মিলিয়ে £120। [অনুষ্ঠানের খরচ ভাগ করুন](page:use-case/events-and-celebrations)।"
  - heading: "দম্পতি"
    body: "একঘেয়ে খরচগুলো ভাগ করুন, ডেট নাইটকে ত্রৈমাসিক আর্থিক পর্যালোচনা না বানিয়ে। ভাড়া 60/40 ভাগে আর বাজার সমান ভাগে হলে হিসাব কমে আপনাদের দুজনের মধ্যে একটাই পেমেন্টে দাঁড়ায়।"
  - heading: "আগে দেখুন কীভাবে কাজ করে"
    body: "ওপরের প্রতিটি উদাহরণে একই ধাপ, গ্রুপ খোলা থেকে পেমেন্ট রেকর্ড করা পর্যন্ত। [কীভাবে কাজ করে](page:how-it-works) সেগুলো দেখিয়ে দেয়, আর [দাম](page:pricing) বলে এর দাম কত, মানে কিছুই না, কোনো বিজ্ঞাপন নেই আর দৈনিক কোনো সীমা নেই।"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "গ্রুপের প্রত্যেকের কি অ্যাকাউন্ট লাগবে?"
      a: "হ্যাঁ। মানুষজন লিঙ্ক বা QR কোড আর একটি বিনামূল্যের অ্যাকাউন্ট দিয়ে যোগ দেয়।"
    - q: "Side Badger কি টাকা তুলতে পারে?"
      a: "না। আপনারা যেভাবে খুশি দিন, তারপর পেমেন্টটা রেকর্ড করুন যাতে ব্যালেন্স ঠিক থাকে।"
    - q: "আমাকে কি একটাই ধরনের গ্রুপ বেছে নিতে হবে?"
      a: "না। এই ক্ষেত্রগুলো উদাহরণ, সেটিং নয়। প্রতিটি গ্রুপে একই ফিচার আছে, তাই যেটা মেলে সেটাই ব্যবহার করুন।"
