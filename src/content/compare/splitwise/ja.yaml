sections:
  - heading: Splitwiseが得意なこと
    body: "グループにネイティブアプリ、オフラインでの利用、アプリ内での支払いが必要なら、Splitwiseが賢い選択です。あとで気づくより、最初から選んでもらうほうがありがたいくらいです。Splitwise自身のページには、次のように書かれています。"
    items:
      - "**アプリとオフライン利用**。ウェブに加えて、iPhoneとAndroidのアプリがあり、オフラインモードもあります。"
      - "**より多くの分け方**。均等、金額指定、割合指定に加えて、持ち分（シェア）、調整、品目ごとの分割があります。"
      - "**定期的な支出**。家賃を繰り返しに設定すれば、あとは忘れて大丈夫です。"
      - "**アプリ内での支払い**。一部の国では、Splitwise Pay、Venmo、PayPal、Pay by Bankを通じて、お金を動かすこともできます。"
  - heading: こちらは無料、あちらは有料
    body: "Splitwise ProはSplitwiseの有料プランで、そのProのページでは、Side Badgerなら無料の4つの機能が売りにされています。"
    items:
      - "**レシートスキャン**。Splitwise Proはレシートの写真をスキャンします。Side Badgerは、スキャンのクレジットなしで無料です。合計・日付・場所を入力するので、確認してください。レシート画像はGoogleのAIサービスが読み取ります。"
      - "**通貨の換算**。Splitwise Proは、「Convert」をタップすると、グループの支出を既定の通貨に換算します。Side Badgerは、各支出を入力するときに、現在の為替レートか、実際に適用されたレートで換算し、元の金額は支出にそのまま残ります。"
      - "**広告なし**。Splitwiseは、完全に広告のない体験をProの機能として挙げています。Side Badgerに広告はありません。"
      - "**1日の制限なし**。Splitwise Proは無制限の支出を売りにしており、ヘルプセンターには、無料ユーザーが追加できる支出は1日あたり最大4件と書かれています。Side Badgerに1日の制限はありません。"
  - heading: Splitwiseにあって、Side Badgerにないもの
    body: "Splitwiseの全機能ではなく、決め手になりやすいものだけです。全リストはSplitwise自身のページにあります。ここからは、Side Badgerが及ばない点です。"
    items:
      - "**ネイティブアプリ**。Side Badgerはブラウザで動作します。ログインしてからホーム画面に追加すれば、アプリのように開きます。"
      - "**オフラインモード**。Side Badgerは接続が必要です。"
      - "**アプリ内での支払い**。Side Badgerがあなたのお金に触れることはありません。支払いは好きな方法で行い、そのあと記録してください。"
      - "**定期的な支出**。Side Badgerにはありません。入力し直す代わりに、先月の家賃をコピーしてください。"
      - "**持ち分や品目ごとの分割**。Side Badgerは1つの支出につき支払う人は1人で、均等、金額指定、割合指定で分割します。レシートスキャンでも、品目を人に割り当てることはありません。"
      - "**グラフと既定の分け方**。Splitwise Proには両方あります。Side Badgerは誰が誰に借りているかを記録するだけで、それがすべてです。"
  - heading: グループを移す
    body: "インポート機能はないので、移行は新しいスタートになります。先にSplitwiseで精算し、そのあとSide Badgerでグループを作って、リンクまたはQRコードで全員を招待してください。グループの全員に無料アカウントが必要で、登録に必要なのはメールアドレスだけです。"
