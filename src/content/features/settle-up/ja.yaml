exampleAfter: 0
sections:
  - heading: 支払いを記録する
    body: 誰かが支払ったら、正しい相手に対して記録します。クイック精算ボタンは、提案された支払いから金額を入力してくれ、「銀行振込」などのメモ（500文字まで）も追加できます。支払う金額の一部だけを支払った場合、残りは残高に残ります。金額が少なすぎたり多すぎたりすると、保存の前にSide Badgerが警告します。支払いの記録には支出を編集する権限が必要で、日付を未来にすることはできません。
  - heading: 別の通貨で支払った場合は？
    body: 残高は支払われた通貨のままなので、ユーロの債務はユーロのままです。ユーロを借りていて、ポンドで支払いますか？入力時に支払いを換算できます。現在の為替レートでも、実際に適用されたレートでも構いません。レートは支払いを保存した時点で固定されます。換算の仕組みは[複数の通貨](page:feature/multiple-currencies)で、実際の使い方は[グループ旅行](page:use-case/group-trips)で紹介しています。
  - heading: 確認できる履歴
    body: 記録された支払いはすべて、日付、金額、メモとともにグループの履歴に残ります。支払いを編集できるのは記録した本人だけで、削除できるのは本人かグループの管理者です。グループを退出した人が関わる支払いはロックされます。ルームメイトの具体例は、[ルームメイト](page:use-case/housemates)をご覧ください。
limits:
  heading: Side Badgerにできないこと
  items:
    - Side Badgerは、お金を動かしたり、支払いリンクや支払いリクエストを送ったりしません。アプリ内の支払いは、別の場所で行った支払いの記録です。
    - 提案される支払いは、通貨ごとに適用される単純なマッチング方法で求められます。その通貨で残高のある人数より常に少ない回数を提案しますが（4人なら最大3回）、可能な最小の回数が見つかるとは限りません。
    - 提案をオフにすることはできません。**すべて表示**は、自分に関するものだけでなく、グループ内で提案されたすべての支払いを一覧にします。
    - 入力時に換算された支出を除き、異なる通貨同士が相殺されることはありません。
    - リマインダーはないので、支払いの催促は引き続きご自身で行ってください。
useCasesHeading: 精算が役立つ場面
faq:
  heading: よくある質問
  items:
    - q: Side Badgerがお金を送りますか？
      a: いいえ。支払いは好きな方法で行い、そのあとSide Badgerに支払いを記録すると残高が更新されます。
    - q: 提案される支払いをオフにできますか？
      a: いいえ。簡略化は常にオンで、**すべて表示**は、自分に関係するものだけでなく、グループ内で提案されたすべての支払いを一覧にします。
    - q: なぜユーロとポンドは別々なのですか？
      a: 支出や支払いの入力時に換算しない限り、残高は支払った通貨のままです。異なる通貨の債務が互いに相殺されることはありません。
    - q: 誰かが借りている金額の一部だけを支払った場合は？
      a: 支払った分を記録してください。残りは、支払われるまで残高に残ります。
    - q: これは常に最小の支払い回数ですか？
      a: 保証はされません。その通貨で残高のある人数より常に少ない回数を提案するので、4人なら3回を超えることはありません。ルームメイトの例では、一人ひとりに直接返すと6回かかるところが、2回になります。
