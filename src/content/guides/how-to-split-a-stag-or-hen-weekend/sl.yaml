meta:
  title: "Kako deliti stroške fantovščine ali dekliščine | Side Badger"
  description: "Slavljenec ne plača ničesar, v ponedeljek pa se vsi še pogovarjajo. Kako razdeliti stroške fantovščine ali dekliščine, z računi vred."
h1: "Kako deliti stroške fantovščine ali dekliščine"
navLabel: "Fantovščina ali dekliščina"
lead: "Slavljenec ne plača ničesar, zato preostala skupina vsak strošek med seboj deli [enako](page:feature/split-expenses). Ljudi izpusti iz stroškov, ki jih preskočijo, slavljenca pa pusti zunaj skupine, da presenečenje ostane presenečenje."
cta:
  heading: "Vodi štetje, ohrani presenečenje"
  body: "Ustanovi skupino, povezavo pošlji vsem razen slavljencu in dodajaj vsak strošek sproti. Side Badger je brezplačen, brez oglasov in brez dnevnih omejitev."
sections:
  - heading: "Štiri prijateljice in eno presenečenje"
    body: "Hannah, Isla, Jess in Kat peljejo Grace na njeno dekliščino. Grace je slavljenka, zato ne plača ničesar. V skupini je tudi ni, zato ne more videti, koliko prijateljice zapravljajo zanjo. Hannah rezervira kočo, Isla plača dan v toplicah, Jess pokrije večerjo, Kat pa taksi. Do nedelje je vsaka plačala kaj in nihče ne ve, kdo je v prednosti. Račun je enak za fantovščino in dekliščino, ne glede na to, kdo je slavljenec."
  - heading: "Deli med tiste, ki plačujejo, ne med tiste, ki so zraven"
    body: "Slavljenčev delež ne izgine. Razdeli se. Koča stane 720 £ in jo plačajo štiri prijateljice, torej 180 £ na osebo, Gracein del pa je v tej številki že všteta. Večerja je 260 £, torej 65 £ na osebo. Taksi je 44 £, torej 11 £ na osebo. Karkoli kdo preskoči, gre samo iz tistega stroška. Kat preskoči toplice, zato njihovih 360 £, ki pokrijejo tudi Gracein del, razdelijo Hannah, Isla in Jess po 120 £. Seštej in Hannah, Isla in Jess za vikend dolgujejo vsaka 376 £, Kat pa 256 £."
  - heading: "Nastavitev v Side Badgerju"
    items:
      - "Za vikend ustanovi skupino in ji daj dolgočasno ime, na primer Vikend v koči. Grace ni članica, skupino pa vidijo samo člani."
      - >-
        Izberi **Povabi druge** in pošlji povezavo ali pokaži kodo QR samo tam, kjer je Grace ne bo videla. Povezava pokaže predogled skupine, še preden se kdo pridruži. Izberi, kako dolgo velja, od 15 minut do 5 dni. Stara povezava deluje, dokler ne poteče, zato je ne pusti dlje, kot je treba.
      - >-
        Za vsak strošek izberi **Dodaj strošek**, vnesi znesek in pod **Kdo je plačal?** izberi plačnika. Pod **Razdeli med** označi ljudi, ki plačujejo, in izpusti tiste, ki so ga preskočili, na primer Kat pri toplicah. Pod **Način razdelitve** izberi **Enako**.
      - >-
        Ko se vrneš domov, odpri **Stanja** skupine. Side Badger pokaže, kdo komu dolguje, in predlaga kratek seznam plačil. Tukaj so tri: Kat plača Hannah 212 £, Jess plača Hannah 116 £ in Isla plača Hannah 16 £. Plačajte si, kakor želite, nato vsako plačilo zabeležite pod **Poravnaj**.
  - heading: "Pred rezervacijo: proračun in polog"
    body: "Dogovorite se o proračunu, preden kdo rezervira. Izberi **Dodaj anketo**, vprašaj, koliko bo skupina porabila za kočo, in ponudi nekaj zneskov kot možnosti. Ob ustvarjanju vklopi **Anonimno glasovanje**, da se skrije, kdo je za kaj glasoval in nihče ne mora na glas zagovarjati manjšega proračuna. Anketo zapri, ko vsi glasujejo in se pokaže zmagovalec. Nato pride polog. Kdor rezervira, ga plača in doda kot strošek, razdeljen enako, preostanek pa vneseš kot drugi strošek, ko zapade. Ostali lahko svoj del pošljejo takoj in plačilo zabeležijo ali počakajo na končno štetje. Stanja so v obeh primerih enaka."
  - heading: "Ko se kdo pridruži samo za eno noč"
    body: "Prijatelj, ki se pojavi samo za soboto, ne bi smel plačati petka. Izpusti ga iz stroškov, pri katerih ni bil. Kjer je strošek odvisen od tega, kako dolgo kdo ostane, na primer soba, pod **Način razdelitve** izberi **Točni zneski** in vtipkaj deleže vseh, ki morajo skupaj dati skupni znesek. Najprej izračunaj ceno na osebo na noč, nato jo pomnoži s številom noči vsake osebe. Več o stroških, ki niso enaki za vse, je na strani o [skupinskih potovanjih](page:use-case/group-trips)."
  - heading: "Česa Side Badger tu ne naredi"
    items:
      - "Nikoli ne prenaša denarja. Plačate si z bančnim nakazilom, z gotovino ali kakor vam ustreza, nato plačilo zabeležite, da se stanja posodobijo za vse."
      - "Ne pošilja opomnikov za plačilo. Prijazen opomin v klepetu skupine še vedno opravi človek."
      - "Vsak strošek ima enega plačnika, Side Badger pa ne zna razdeliti računa po vrsticah. Če sta kočo plačali dve kartici, vnesi dva stroška. Če so nekateri pri večerji naročili dodatke, vnesi dodatke kot samostojen strošek."
      - "Vodi denar, ne načrta potovanja. Ankete in komentarji ostanejo pri stroških, načrti za vikend pa v klepetu skupine."
