featuresHeading: "Les fonctionnalités utilisées ici"
faq:
  heading: Questions
  items:
    - q: "Les invités peuvent-ils voir le groupe sans le rejoindre ?"
      a: "Non. On rejoint avec un lien ou un code QR et un compte gratuit, et on voit le groupe une fois dedans."
    - q: "Side Badger peut-il collecter l'argent ?"
      a: "Non. Side Badger tient le compte et ne fait jamais circuler l'argent. Remboursez-vous comme vous voulez, puis enregistrez le paiement. Il est gratuit, sans publicité et sans limite quotidienne ; voir les [tarifs](page:pricing)."
    - q: "Les votes peuvent-ils être anonymes ?"
      a: "Oui. En créant un sondage, vous pouvez masquer qui a voté pour quoi. Les réglages ne peuvent changer qu'avant le premier vote."
    - q: "Chacun peut-il participer d'un montant différent ?"
      a: "Oui. Partagez une dépense par montants exacts, pour que la part de chacun soit le chiffre convenu, ou laissez de côté ceux qui n'étaient pas concernés."
    - q: "Un organisateur peut-il tenir les comptes ?"
      a: "Oui. Utilisez le préréglage de groupe géré, pour que seuls les créateurs et les admins modifient les dépenses et que les admins approuvent les nouveaux membres."
