meta:
  title: "Jinsi ya kugawanya kodi kwa ukubwa wa chumba | Side Badger"
  description: "Chumba kikubwa, sehemu kubwa. Tenga vyumba vya pamoja, gawanya kilichobaki kwa eneo la sakafu na weka asilimia mara moja. Hesabu zimeonyeshwa kwa watu watatu."
h1: "Jinsi ya kugawanya kodi kwa ukubwa wa chumba"
navLabel: "Kodi kwa ukubwa wa chumba"
lead: "Amueni ni kiasi gani cha kodi kinalipia vyumba vya pamoja na mgawanye sehemu hiyo kwa usawa, kisha gawanyeni kilichobaki kwa eneo la sakafu la kila chumba cha kulala. Zungusheni hadi asilimia nzima, ziwekeni kwenye kodi ndani ya Side Badger mara moja, na nakili gharama hiyo kila mwezi."
cta:
  heading: "Weka kodi mara moja tu"
  body: "Fungua akaunti ya bure, anzisha kikundi cha nyumba na uweke kodi pamoja na asilimia mlizokubaliana. Mwezi ujao ni nakala tu. Unataka kuona kwanza? Tazama [jinsi inavyofanya kazi](page:how-it-works) au [kinachojumuishwa bure](page:pricing)."
sections:
  - heading: "Watu watatu, nyumba moja, mjadala mmoja"
    body: "Priya, Tom na Aisha wanashiriki nyumba kwa £1,950 kwa mwezi. Kwa mwaka mzima waligawanya kwa watatu, kwa sababu ilikuwa rahisi. Kisha Aisha akapima chumba chake. Chumba cha Priya ni 16 m², cha Tom ni 12 m² na cha Aisha ni 10 m², kwa hivyo Aisha alikuwa analipa kile Priya analipa kwa chumba kilicho kidogo kwa zaidi ya theluthi moja. Hakuna aliyekuwa si mwadilifu. Hakuna aliyefanya hesabu. Wakiwa wanakula chakula cha kuchukua, walikubaliana kanuni moja kwanza. Kati ya kodi, 40% inalipia jiko, bafu na sebule, ambavyo wote watatu hutumia."
  - heading: "Njia, pamoja na hesabu zilizoonyeshwa"
    body: "Hatua nne, kipimo kimoja cha mkanda na kikokotoo cha simu."
    items:
      - "**Tenga sehemu ya pamoja.** Kikundi kinakubaliana sehemu ya kodi kwa vyumba ambavyo kila mtu hutumia. Kwa nyumba hii ni 40%, ambayo ni 13.33% kwa kila mmoja kati ya watu watatu."
      - "**Gawanya kilichobaki kwa eneo la sakafu.** Hiyo 60% nyingine inagawanywa kwa ukubwa wa chumba cha kulala. Vyumba vya kulala vinajumlisha 38 m² (16 + 12 + 10), kwa hivyo sehemu ya Priya ni 60% × 16/38, yaani 25.26%."
      - "**Jumlisha sehemu mbili.** Priya: 25.26% + 13.33% = 38.6%. Tom: 60% × 12/38 = 18.95%, pamoja na 13.33% ni 32.3%. Aisha: 60% × 10/38 = 15.79%, pamoja na 13.33% ni 29.1%."
      - "**Zungusha na uhakiki.** Asilimia nzima ni rahisi kuandika na kubishania, kwa hivyo 38.6% inakuwa 39%, 32.3% inakuwa 32% na 29.1% inakuwa 29%. Hakikisha 39 + 32 + 29 ni 100. Kuzungusha kukifika 99 au 101, kikundi kinakubaliana nambari ya nani inahamishwa kwa pointi moja."
  - heading: "Kusoma mwezi wa nyumba"
    body: "Kodi ya 39%, 32% na 29% inakuwa £760.50, £624.00 na £565.50. Priya alimlipa mwenye nyumba, kwa hivyo kwa mwezi mzima anadai £1,142.50, huku Tom akidaiwa £566.00 na Aisha £576.50. Side Badger inapendekeza malipo mawili, yote kwa Priya."
  - heading: "Isanidi kwenye Side Badger"
    body: "Jioni moja, na sehemu kubwa yake ikitumika kujadili ile 40%."
    items:
      - "**Tengeneza kikundi.** Kwenye dashibodi chagua **Unda Kikundi** na ukipe jina la nyumba. Chagua **Alika wengine** na utume kiungo au msimbo wa QR. Kila mtu anaingia au anafungua akaunti ya bure, na anachagua jina analotaka lionyeshwe kwenye kikundi hiki."
      - "**Ongeza kodi.** Chagua **Ongeza Gharama**. Weka maelezo na kiasi, na chini ya **Nani alilipa?** chagua aliyemlipa mwenye nyumba. Waache watu wote watatu chini ya **Gawanya kati ya**, kisha chini ya **Jinsi ya kugawanya** chagua **Asilimia** na uandike 39, 32 na 29. Fomu inaonya asilimia zisipojumlisha 100. Chagua **Hifadhi Gharama**."
      - "**Ongeza bili.** Nishati na intaneti ni gharama tofauti zenye walipaji wao. Acha **Jinsi ya kugawanya** kwenye **Sawa**."
      - "**Nakili mwezi ujao.** Fungua kodi ya mwezi uliopita na uchague **Kopi gharama**. Nakala inabaki na mlipaji, kiasi na mgawanyo, na inachukua tarehe ya leo. Badilisha kiasi kama kodi imebadilika, kisha chagua **Unda kopi**."
      - "**Angalia nani anadaiwa na nani.** Sehemu ya **Salio** inaonyesha. Lipaneni mtakavyo, kisha rekodi malipo chini ya **Lipa deni**."
  - heading: "Vyumba vyenye bafu, vyumba vidogo na watu wanaoondoka"
    items:
      - "**Vyumba vyenye bafu na vyumba vidogo.** Eneo la sakafu ni mahali pa kuanzia tu. Chumba chenye bafu lake kina thamani kubwa kuliko eneo hilohilo bila bafu, na chumba kidogo kinachotosha kitanda na kiti cha matumaini kina thamani ndogo. Rekebisheni asilimia kwa makubaliano, hakikisheni bado zinajumlisha 100 na andikeni nambari za mwisho mahali ambapo nyumba nzima inaweza kuziona."
      - "**Mtu anahama katikati ya mwezi.** Kokotoa kila mtu anadaiwa kiasi gani kwa mwezi huo na uweke kodi ya mwezi huo kwa **Kiasi halisi** badala ya **Asilimia**. Kiasi lazima kijumlishe kodi. Fanya hivyo kabla hajaondoka. Hakuna anayeweza kuondoka kwenye kikundi akiwa anadaiwa au anadai pesa, na gharama inayomhusisha aliyeondoka inakuwa ya kusomwa tu."
      - "**Mtu anahamia.** Pima tena, fanya hesabu upya na ukubwa mpya wa vyumba na utumie asilimia mpya kuanzia kodi inayofuata. Miezi ya awali inabaki kama ilivyokuwa."
  - heading: "Kile ambacho Side Badger haifanyi hapa"
    items:
      - "Haipimi vyumba vyako wala kuchagua asilimia. Maeneo ya sakafu na ile 40% ni ya kikundi kukubaliana."
      - "Haina bili zinazojirudia, kwa hivyo unanakili kodi ya mwezi uliopita kila mara."
      - "Haihamishi pesa kamwe na haimlipi mwenye nyumba. Mnalipana mtakavyo na kurekodi."
      - "Haijui mkataba wako wa upangaji unasema nini. Inaweka hesabu kati ya watu walio kwenye kikundi."
