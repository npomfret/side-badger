faq:
  heading: "सवाल"
  items:
    - q: "पेमेंट कौन रिकॉर्ड करे, देने वाला या पाने वाला?"
      a: "पेमेंट रिकॉर्ड करने के लिए खर्च एडिट करने की अनुमति चाहिए, और फॉर्म पूछता है **किसने भुगतान किया?** और **भुगतान किसे मिला?** इसे बाद में सिर्फ वही व्यक्ति एडिट कर सकता है जिसने रिकॉर्ड किया, इसलिए आमतौर पर सबसे आसान यह है कि देने वाला ही त्वरित निपटान बटन से उसे रिकॉर्ड करे।"
    - q: "अगर ट्रिप दो करेंसी में चली हो तो?"
      a: "बैलेंस हर करेंसी के हिसाब से रखे जाते हैं, इसलिए यूरो का कर्ज़ यूरो का ही रहता है और हर करेंसी को पेमेंट की अपनी छोटी सूची मिलती है, जब तक खर्च दर्ज करते समय बदले न गए हों। [कई करेंसी](page:guide/how-to-split-a-trip-paid-in-several-currencies) दोनों तरीके दिखाता है।"
    - q: "हिसाब ट्रिप के दौरान चुकता करें या आखिर में?"
      a: "दोनों चलता है। हर रिकॉर्ड किया गया पेमेंट बैलेंस बदलता है, इसलिए ट्रिप के बीच में किया गया पेमेंट आखिरी सूची में गिना जाता है। आखिर में करना ज़्यादा आसान है, क्योंकि [पूरी ट्रिप](page:use-case/group-trips) एक ही जगह है।"
