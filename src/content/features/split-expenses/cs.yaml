sections:
  - heading: "Jen lidé, kteří tam byli"
    body: "Rozdělte náklad mezi všechny, nebo jen mezi ty, kdo se na něm podíleli. Vynechte lidi z nákladů, na kterých se nepodíleli, a zůstatky to zohlední. Spolubydlící, který byl celý týden pryč, nedluží za jídlo s sebou, což [spolubydlící](page:use-case/housemates) poznají jako základní spravedlnost."
  - heading: "Podrobnosti, které později ušetří hádky"
    items:
      - "Nastavte **datum** a volitelně čas. Zkratky jako dnes, včera, dnes ráno a včera večer ušetří trochu psaní."
      - "Přidejte až tři **štítky** pro seskupení výdajů, například nákupy nebo cestování."
      - "Přidejte **místo**. Vložte odkaz na mapu a název místa se doplní sám."
      - "Přidejte **poznámku** k příběhu za číslem, s trochou formátování, pokud to příběh vyžaduje."
      - "Připojte až tři **účtenky** jako fotky nebo PDF, aby doklad zůstal u výdaje."
      - "Používejte **komentáře**, aby rozhovor byl vedle výdaje, o který jde, a ne ve vlákně chatu, do kterého se nikdo nevrací."
  - heading: "Kopírujte, upravujte a sledujte, co se změnilo"
    body: "Zkopírujte nájem z minulého měsíce, místo abyste ho psali znovu, a změňte to, co je jiné. Pokud bylo číslo špatně, upravte výdaj. Dřívější verze se uchová a úprava se zobrazí v aktivitě skupiny, takže nikdo nemění číslo potichu. Co kdo smí upravovat, závisí na oprávněních skupiny."
  - heading: "Když něco vypadá špatně"
    body: "Skupina může zapnout otázky k výdajům. Kdokoli, koho se výdaj týká, může vznést otázku a říct proč, a výdaj zůstane mimo zůstatky, dokud ji osoba, která se ptala, nebo správce neuzavře. Ve výchozím stavu je vypnuto a správce to pro skupinu zapíná. Hodí se pro [akce a oslavy](page:use-case/events-and-celebrations), kde se záloha, na kterou si nikdo nevzpomíná, najednou stane věcí všech."
limits:
  heading: "Limity"
  items:
    - "Za každý výdaj platí jedna osoba. Pokud platily dvě, zaznamenejte dva výdaje."
    - "Neexistuje dělení podle položek ani podle podílů. Je rovnoměrně, podle přesných částek a procentuálně."
    - "Procenta musí dávat dohromady 100."
    - "Výdaj může činit až 999 999,99 ve své měně, s obvyklým počtem desetinných míst této měny."
    - "Výdaje se samy neopakují. Zkopírujte místo toho výdaj z minulého měsíce."
    - "Data nemohou být v budoucnosti ani starší než 10 let."
    - "Výdaj, kterého se týká někdo, kdo opustil skupinu, je jen ke čtení."
useCasesHeading: "Kde takové dělení pomáhá"
faq:
  heading: "Otázky"
  items:
    - q: "Mohou za jeden výdaj platit dvě osoby?"
      a: "Ne v jednom výdaji. Zaznamenejte dva, po jednom pro každého plátce, a zůstatky vyjdou stejně."
    - q: "Mohu rozdělit účtenku podle položek?"
      a: "Ne. Rozdělení je rovnoměrné, podle přesných částek nebo procentuální. U účtu s různými položkami zadejte, kolik dluží kdo, jako přesné částky."
    - q: "Mohu nastavit výchozí rozdělení?"
      a: "Ne. Zkopírujte dřívější výdaj, abyste použili jeho rozdělení, a změňte to, co je jiné."
    - q: "Mohou se účty opakovat každý měsíc?"
      a: "Ne. Zkopírujte místo toho výdaj z minulého měsíce, což trvá pár sekund."
    - q: "Kdo může upravit výdaj?"
      a: "Ten, komu to dovolují oprávnění skupiny. Každá úprava se zobrazí v aktivitě skupiny, takže změny nikdy nejsou tiché."
    - q: "Co se pak děje se zůstatky?"
      a: "Aktualizují se, jak výdaje přibývají, a [vyrovnání](page:feature/settle-up) je promění v krátký seznam plateb. Pokud je výdaj v jiné měně, viz [více měn](page:feature/multiple-currencies)."
