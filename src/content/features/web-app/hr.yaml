meta:
  title: "Aplikacija za dijeljenje računa bez preuzimanja | Side Badger"
  description: "Telefon ti je pun, razumijemo. Side Badger radi u pregledniku, bez trgovine aplikacija i preuzimanja. Dodaj ga na početni zaslon i otvara se kao aplikacija."
h1: "Bez trgovine aplikacija. Bez preuzimanja. A ipak kao aplikacija"
navLabel: "Web-aplikacija"
lead: "Side Badger živi u tvom pregledniku. Nema trgovine aplikacija koju treba pretraživati ni ičega što treba prvo preuzeti. Prijavi se na telefonu ili računalu, dijeli troškove online sa svojom grupom i dodaj ga na početni zaslon ili u dock kad ga želiš na dohvat jednog dodira."
cta:
  heading: "Otvori. Prijavi se. Osnuj grupu."
  body: "Napravi korisnički račun, osnuj grupu i dodaj prvi trošak, sve iz preglednika koji već imaš otvoren. Želiš prvo obilazak? Pogledaj [kako radi](page:how-it-works) ili provjeri [što pokriva besplatna verzija](page:pricing)."
problem:
  heading: "Telefon ti je pun. Razumijemo."
  body: "Negdje na njemu je četiri tisuće fotografija istog zalaska sunca i upozorenje o memoriji koje odbacuješ od proljeća. Zadnje što mu treba je još jedna aplikacija, samo da podijeliš jednu večeru. Zato je Side Badger web-aplikacija. Radi u modernom pregledniku na telefonu ili računalu. Na telefonu koristi mobilni raspored, sa stranicom grupe podijeljenom u kartice i kontrolama prilagođenima dodiru. Neki dodaci, primjerice dodavanje na početni zaslon, ovise o tvom pregledniku, a mi kažemo gdje."
workflow:
  heading: "Od kartice preglednika do početnog zaslona u tri koraka"
  steps:
    - title: "Otvori i prijavi se"
      body: "Otvori Side Badger u pregledniku i prijavi se. Treba ti samo e-adresa i lozinka, a e-adresu potvrđuješ prije nego što išta možeš dodati. Svatko u grupi treba korisnički račun, pa će ljudi koje pozoveš učiniti isto."
    - title: "Dodaj ga na početni zaslon ili u dock"
      body: "Kad se prijaviš, aplikacija ti ponudi da se instalira. Dobivaš gumb **Instaliraj** ondje gdje to tvoj preglednik dopušta, a **Pokaži kako** ondje gdje ne dopušta. Propuštena ili odbijena ponuda? Postavke imaju istu pomoć pod **Dodaj na početni zaslon ili u Dock**. Na iPhoneu ili iPadu Postavke najprije prikazuju korake za iPhone, a ostale uređaje skrivaju pod **Ostali uređaji**. U oba slučaja se aplikacija zatim otvara u vlastitom prozoru."
      shot: S20
      shotAlt: "Odjeljak Dodaj na početni zaslon ili u Dock u Postavkama, s koracima za dodavanje aplikacije na uređaj"
    - title: "Uključi obavijesti, ako ih želiš"
      body: "Obavijesti su isključene dok ih ne uključiš, a svaki se uređaj uključuje zasebno. Koristi gumb **Uključi** koji nudi zvonce obavijesti ili prekidač **Push obavijesti** u odjeljku **Postavke**. Na iPhoneu ili iPadu prvo otvori aplikaciju s početnog zaslona. Samo ondje obavijesti rade."
      shot: S19
      shotAlt: "Otvoreni padajući izbornik obavijesti s popisom nedavne aktivnosti u grupi"
options:
  heading: "Kako je dodati, uređaj po uređaj"
  items:
    - title: "iPhone i iPad"
      body: "Dodirni gumb Dijeli, kvadrat sa strelicom usmjerenom prema gore. Ako ga ne vidiš, prvo dodirni tri točkice (•••), a zatim Dijeli. Pomakni se prema dolje i dodirni **Dodaj na početni zaslon**. Ostavi uključeno **Otvori kao web-aplikaciju**, a zatim dodirni **Dodaj**. Ako se poveznica otvorila unutar druge aplikacije, prvo otvori stranicu u Safariju, jer taj ugrađeni preglednik ne može dodati."
    - title: "Android"
      body: "Otvori izbornik preglednika i odaberi **Dodaj na početni zaslon** ili **Instaliraj aplikaciju**."
    - title: "Chrome ili Edge na računalu"
      body: "Otvori izbornik preglednika i odaberi opciju za instalaciju ove web-stranice kao aplikacije. Tada dobiva vlastiti prozor i vlastitu ikonu."
    - title: "Safari na Macu"
      body: "Odaberi **Datoteka**, a zatim **Dodaj u Dock**."
sections:
  - heading: "Obavijesti, samo ako ih zatražiš"
    body: "Push obavijesti su izborne. Uključi ih i dobivaš obavijest kad u tvojim grupama ima nove aktivnosti, primjerice kad netko doda trošak, ostavi komentar ili zabilježi uplatu. Uključuju se jedan uređaj po jedan, preko zvonca obavijesti ili iz odjeljka **Postavke**, a ondje ih možeš i ponovno isključiti. Trebaju preglednik koji ih podržava i tvoje dopuštenje. Ako ih je tvoj preglednik blokirao za ovu stranicu, prvo ih dopusti u postavkama preglednika. Na iPhoneu ili iPadu rade samo iz aplikacije dodane na početni zaslon, a ne iz kartice preglednika. Isporuka nije zajamčena, pa obavijest shvati kao gurkanje laktom, a ne kao obećanje. Što se pojavljuje u aktivnosti, vidi u [planiranju zajedno](page:feature/plan-together)."
  - heading: "Ažuriranja uživo, bez gumba za osvježavanje"
    body: "Dodaj trošak i svi ga odmah vide, zajedno s time što se promijenilo i tko je to promijenio. Svaka grupa vodi povijest aktivnosti, a zvonce obavijesti prikazuje aktivnost iz svih tvojih grupa. Nitko ne mora pitati jesu li svi vidjeli što si upravo dodao. Već je na njihovim zaslonima."
  - heading: "39 jezika, svatko svoj"
    body: "Koristi Side Badger na 39 jezika, uključujući arapski, perzijski i urdu, koji se pišu zdesna nalijevo. Svatko u grupi bira vlastiti, pa ista stranica grupe može biti na arapskom za jednu osobu, a na engleskom za sljedeću. Jedino oko čega se grupa mora složiti su brojevi."
  - heading: "Izgrađen za više od jedne vrste korisnika"
    body: "Side Badger je izgrađen s mislima na korisnike tipkovnice i čitača zaslona. Boje članova dolaze s uzorcima, pa ne moraš razlikovati zeleno od crvenog."
    items:
      - "Poveznice za preskakanje, da korisnici tipkovnice mogu skočiti ravno na sadržaj."
      - "Dijalozi upravljaju fokusom tipkovnice."
      - "Kontrole su označene, za čitače zaslona."
      - "Rasporedi se zrcale za jezike koji se pišu zdesna nalijevo."
limits:
  heading: "Što web-aplikacija ne radi"
  items:
    - "Nema korištenja bez mreže. Side Badger treba vezu, pa neće otvoriti tvoju grupu u avionu bez wifija."
    - "Nema aplikacije u trgovini aplikacija ni izvorne aplikacije za iPhone ili Android. Side Badger je web-aplikacija, a dodavanje na početni zaslon ili u dock način je na koji dobivaš verziju nalik aplikaciji."
    - "Dodavanje na početni zaslon ili u dock ovisi o tvom pregledniku. Nazivi izbornika razlikuju se među preglednicima i verzijama, a neki preglednici to ne nude."
    - "Push obavijesti su izborne za svaki uređaj i trebaju preglednik koji ih podržava i tvoje dopuštenje. Na iPhoneu ili iPadu rade samo iz aplikacije dodane na početni zaslon. Isporuka nije zajamčena."
    - "Nema obavijesti e-poštom ni SMS-om i nema podsjetnika na uplate. Nova aktivnost prikazuje se u aplikaciji, a kao push obavijest ako ih uključiš. Potjerivanje uplate i dalje je na tebi."
    - "Aktivnost se čuva 90 dana."
    - "Prijavljuješ se e-adresom i lozinkom. Nema prijave Googleom ni Appleom, a moraš imati 18 godina ili više."
    - "Ne tvrdimo da je Side Badger potpuno pristupačan niti da zadovoljava formalni standard pristupačnosti. Ako ti nešto smeta, javi nam iz same aplikacije i ondje ćeš vidjeti naš odgovor."
useCasesHeading: "Gdje pomaže što ne treba aplikacija"
faq:
  heading: "Pitanja"
  items:
    - q: "Postoji li aplikacija Side Badger u trgovini aplikacija?"
      a: "Ne. Side Badger je web-aplikacija. Otvaraš je u pregledniku, a možeš je dodati na početni zaslon ili u dock da se otvara kao aplikacija. Ništa se ne preuzima iz trgovine aplikacija."
    - q: "Mogu li dijeliti račune bez preuzimanja aplikacije?"
      a: "Da. Otvori Side Badger u pregledniku na telefonu ili računalu, prijavi se i osnuj grupu. Dodavanje na početni zaslon ili u dock nije obvezno."
    - q: "Radi li bez mreže?"
      a: "Ne. Side Badger treba vezu, čak i kad je dodan na početni zaslon ili u dock."
    - q: "Zašto ne dobivam obavijesti na iPhoneu?"
      a: "Na iPhoneu ili iPadu obavijesti rade samo iz aplikacije dodane na početni zaslon, a ne iz kartice preglednika. Dodaj je, otvori s ikone na početnom zaslonu, a zatim uključi obavijesti u odjeljku **Postavke**. Isporuka nije zajamčena, pa ako neka nestane, povijest aktivnosti grupe i dalje pokazuje što je dodano."
    - q: "Moram li uključiti obavijesti?"
      a: "Ne. Isključene su dok ih ne uključiš, jedan uređaj po jedan. Bez njih se nova aktivnost i dalje prikazuje u aplikaciji, a svi vide promjenu odmah kad imaju aplikaciju otvorenu."
    - q: "Treba li svatko u grupi korisnički račun?"
      a: "Da. Treba samo e-adresa i lozinka, a e-adresu potvrđuješ prije nego što išta možeš dodati. Svatko tko se pridruži grupi radi isto, na kojem god telefonu ili računalu želi."
