meta:
  title: Bill splitting app without a download | Side Badger
  description: Your phone is full, we get it. Side Badger runs in your browser, with no app store and no download. Add it to your home screen and it opens like an app.
h1: No app store. No download. Still feels like an app
navLabel: Web app
lead: Side Badger lives in your browser. There is no app store to search and nothing to download first. Sign in on a phone or a computer, split expenses online with your group, and add it to your home screen or dock when you want it one tap away.
cta:
  heading: Open it. Sign in. Start a group.
  body: Create an account, start a group and add the first expense, all from the browser you already have open. Want the tour first? See [how it works](page:how-it-works), or check [what free covers](page:pricing).
problem:
  heading: Your phone is full. We get it.
  body: Somewhere on it are four thousand photos of the same sunset and a storage warning you have been swiping away since spring. The last thing it needs is another app, just to split one dinner. So Side Badger is a web app. It runs in a modern browser on a phone or a computer. On a phone it uses mobile layouts, with the group page split into tabs and touch-friendly controls. Some extras, such as adding it to your home screen, depend on your browser, and we say where.
workflow:
  heading: From browser tab to home screen in three steps
  steps:
    - title: Open it and sign in
      body: Go to Side Badger in your browser and sign in. All you need is an email address and a password, and you verify the email before you can add anything. Everyone in the group needs an account, so the people you invite will do the same.
    - title: Add it to your home screen or dock
      body: Once you are signed in, the app offers to install itself. You get an **Install** button where your browser allows it, and **Show me how** where it doesn't. Missed it, or said no? **Settings** has the same help under **Add to Home Screen or Dock**. On an iPhone or iPad, Settings shows the iPhone steps first and tucks the other devices under **Other devices**. Either way, the app then opens in a window of its own.
      shot: S20
      shotAlt: The Add to Home Screen or Dock section of Settings, with the steps for adding the app to a device
    - title: Turn on notifications, if you want them
      body: Notifications are off until you switch them on, and each device is switched on separately. Use the **Turn on** button the notifications bell offers, or the **Push notifications** switch in **Settings**. On an iPhone or iPad, open the app from the Home Screen first. That is the only place notifications work there.
      shot: S19
      shotAlt: The notifications dropdown open, listing recent activity in the group
options:
  heading: How to add it, device by device
  items:
    - title: iPhone and iPad
      body: Tap the Share button, a square with an arrow pointing up. If you don't see it, tap the three dots (•••) first, then Share. Scroll down and tap **Add to Home Screen**. Keep **Open as Web App** switched on, then tap **Add**. If a link opened inside another app, open the page in Safari first, because that built-in browser can't add it.
    - title: Android
      body: Open the browser menu and choose **Add to Home screen** or **Install app**.
    - title: Chrome or Edge on a computer
      body: Open the browser menu and choose the option to install this site as an app. It then gets its own window and its own icon.
    - title: Safari on a Mac
      body: Choose **File**, then **Add to Dock**.
sections:
  - heading: Notifications, only if you ask for them
    body: Push notifications are opt-in. Switch them on and you get a notification when there is new activity in your groups, such as someone adding an expense, leaving a comment or recording a payment. They are switched on one device at a time, from the notifications bell or from **Settings**, and you can switch them off again there. They need a browser that supports them and your permission. If your browser has blocked them for the site, allow them in the browser's settings first. On an iPhone or iPad they work only from the app added to the Home Screen, not from a browser tab. Delivery is not guaranteed, so treat a notification as a nudge, not a promise. For what turns up in the feed, see [plan together](page:feature/plan-together).
  - heading: Live updates, no refresh button
    body: Add an expense and everyone sees it straight away, along with what changed and who changed it. Each group keeps an activity history, and the notifications bell shows activity across all your groups. Nobody has to ask whether you have seen the thing you just added. It is on their screen.
  - heading: 39 languages, each person their own
    body: Use Side Badger in 39 languages, including right-to-left Arabic, Persian and Urdu. Everyone in the group picks their own, so the same group page can be in Arabic for one person and English for the next. The only thing the group has to agree on is the numbers.
  - heading: Built for more than one kind of user
    body: Side Badger is built with keyboard and screen-reader users in mind. Member colours come with patterns, so you don't have to tell green from red.
    items:
      - Skip links, so keyboard users can jump straight to the content.
      - Dialogs manage keyboard focus.
      - Controls are labelled, for screen readers.
      - Layouts flip for right-to-left languages.
limits:
  heading: What the web app doesn't do
  items:
    - There is no offline use. Side Badger needs a connection, so it won't open your group on a plane with no wifi.
    - There is no app-store app and no native iPhone or Android app. Side Badger is a web app, and adding it to your home screen or dock is how you get the app-like version.
    - Adding it to a home screen or dock depends on your browser. Menu names vary between browsers and versions, and some browsers don't offer it.
    - Push notifications are opt-in per device, and need a browser that supports them and your permission. On an iPhone or iPad they work only from the app added to the Home Screen. Delivery is not guaranteed.
    - There are no email or text alerts and no payment reminders. New activity shows in the app, and as push notifications if you turn them on. Chasing a payment is still up to you.
    - Activity is kept for 90 days.
    - You sign in with an email address and a password. There is no Google or Apple sign-in, and you need to be 18 or over.
    - We don't claim Side Badger is fully accessible, or that it meets a formal accessibility standard. If something gets in your way, tell us from inside the app and you will see our reply there.
useCasesHeading: Where not needing an app helps
faq:
  heading: Questions
  items:
    - q: Is there a Side Badger app in an app store?
      a: No. Side Badger is a web app. You open it in your browser, and you can add it to your home screen or dock so it opens like an app. There is nothing to download from an app store.
    - q: Can I split bills without downloading an app?
      a: Yes. Open Side Badger in a browser on your phone or computer, sign in, and start a group. Adding it to your home screen or dock is optional.
    - q: Does it work offline?
      a: No. Side Badger needs a connection, even when it is added to your home screen or dock.
    - q: Why am I not getting notifications on my iPhone?
      a: On an iPhone or iPad, notifications work only from the app added to the Home Screen, not from a browser tab. Add it, open it from the Home Screen icon, then turn notifications on in **Settings**. Delivery is not guaranteed, so if one goes missing, the group's activity history still shows what was added.
    - q: Do I have to turn notifications on?
      a: No. They are off until you switch them on, one device at a time. Without them, new activity still shows in the app, and everyone sees a change straight away when they have it open.
    - q: Does everyone in the group need an account?
      a: Yes. All you need is an email address and a password, and you verify the email before you can add anything. Everyone who joins a group does the same, on whichever phone or computer they like.
