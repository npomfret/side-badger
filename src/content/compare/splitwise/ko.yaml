sections:
  - heading: "Splitwise가 잘하는 것"
    body: "그룹에 네이티브 앱, 오프라인 사용, 앱 안에서의 결제가 필요하다면 Splitwise가 현명한 선택이에요. 나중에 알게 되는 것보다 처음부터 그쪽을 고르는 편이 낫습니다. Splitwise 자체 페이지에 나와 있는 내용은 다음과 같아요."
    items:
      - "**앱과 오프라인 사용.** 웹뿐 아니라 iPhone과 Android 앱이 있고, 오프라인 모드도 있습니다."
      - "**더 다양한 분할 방식.** 똑같이, 정확한 금액으로, 비율로 나누는 방식 외에 지분별, 조정별, 품목별 분할도 있어요."
      - "**반복 지출.** 월세를 반복으로 설정해 두고 잊어버리세요."
      - "**앱 안에서의 결제.** 일부 국가에서는 Splitwise Pay, Venmo, PayPal, Pay by Bank를 통해 돈도 옮길 수 있습니다."
  - heading: "여기선 무료, 저기선 유료"
    body: "Splitwise Pro는 Splitwise의 유료 요금제이고, Splitwise의 Pro 페이지는 사이드 배저에서는 무료인 네 가지를 내세웁니다."
    items:
      - "**영수증 스캔.** Splitwise Pro는 영수증 사진을 스캔합니다. 사이드 배저는 스캔 크레딧 없이 무료로 해 주며, 합계, 날짜, 장소를 채워 줄 테니 확인만 하면 됩니다. 영수증 이미지는 Google의 AI 서비스가 읽습니다."
      - "**통화 환산.** Splitwise Pro는 “Convert” 버튼을 누르면 그룹의 지출을 기본 통화로 환산합니다. 사이드 배저는 지출을 입력할 때마다 현재 환율이나 실제로 적용받은 환율로 환산하고, 원래 금액은 지출에 그대로 남습니다."
      - "**광고 없음.** Splitwise는 완전히 광고 없는 환경을 Pro 기능으로 소개합니다. 사이드 배저에는 광고가 없습니다."
      - "**일일 한도 없음.** Splitwise Pro는 무제한 지출을 내세우며, 도움말 센터에는 무료 사용자가 하루에 최대 4건의 지출을 추가할 수 있다고 나와 있습니다. 사이드 배저에는 일일 한도가 없습니다."
  - heading: "Splitwise에는 있고 사이드 배저에는 없는 것"
    body: "Splitwise의 모든 기능이 아니라 선택에 영향을 주는 기능만 꼽았어요. 전체 목록은 Splitwise 자체 페이지에 있습니다. 사이드 배저가 부족한 부분은 다음과 같아요."
    items:
      - "**네이티브 앱.** 사이드 배저는 브라우저에서 작동합니다. 로그인한 다음 홈 화면에 추가하면 앱처럼 열려요."
      - "**오프라인 모드.** 사이드 배저는 인터넷 연결이 필요합니다."
      - "**앱 안에서의 결제.** 사이드 배저는 여러분의 돈을 절대 건드리지 않습니다. 원하는 방법으로 서로 지불한 다음 결제를 기록하세요."
      - "**반복 지출.** 사이드 배저에는 없습니다. 다시 입력하는 대신 지난달 월세를 복사하세요."
      - "**지분별 또는 품목별 분할.** 사이드 배저는 지출 하나에 결제자가 한 명이고, 똑같이, 정확한 금액으로, 또는 비율로 나눕니다. 영수증 스캔은 품목을 사람에게 배정하지 않아요."
      - "**차트와 기본 분할.** Splitwise Pro에는 둘 다 있습니다. 사이드 배저는 누가 누구에게 빚졌는지 기록하는 데 집중하는데, 그게 이 서비스의 전부예요."
  - heading: "그룹 옮기기"
    body: "가져오기 기능이 없으므로 옮긴다는 건 새로 시작한다는 뜻이에요. 먼저 Splitwise에서 정산을 마친 다음, 사이드 배저에서 그룹을 만들고 링크나 QR 코드로 모두를 초대하세요. 그룹의 모든 사람에게 무료 계정이 필요하며, 가입에는 이메일 주소만 있으면 됩니다."
