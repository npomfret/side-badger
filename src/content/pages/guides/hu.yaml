intro: "Minden útmutató **egy kitalált csoportot** követ az első költségtől az utolsó rögzített kifizetésig. A számokat kiszámoltuk helyetted, a lépések pedig úgy használják a képernyőket, ahogy az alkalmazás nevezi őket."
cta:
