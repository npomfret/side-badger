meta:
  title: Divide gastos a partes iguales, por importes exactos o por porcentaje | Side Badger
  description: Divide un gasto compartido a partes iguales, por importes exactos o por porcentaje, y deja fuera a quien no estuvo. Gratis, sin anuncios y sin límites diarios.
h1: Divide gastos a partes iguales, por importes exactos o por porcentaje
navLabel: Dividir gastos
lead: No todo es 50/50. Side Badger lo entiende. Indica quién pagó, elige a las personas que compartieron el gasto y divídelo **a partes iguales, por importes exactos o por porcentaje**. Los rencores se venden aparte.
cta:
  heading: Divide el próximo como es debido
  body: Crea una cuenta gratis, empieza un grupo y añade ese gasto que llevas tiempo queriendo arreglar. ¿No sabes qué pasa después? Mira [cómo funciona](page:how-it-works) o consulta [qué cubre lo gratis](page:pricing).
  button: Crear una cuenta gratis
problem:
  heading: No todo es 50/50
  body: El alquiler sigue el tamaño de la habitación. Un regalo sigue lo que prometió cada uno. Una cena sigue a quien se quedó al postre. Dividir una cuenta por la mitad funciona hasta la primera cuenta que no se deja, y entonces alguien abre una hoja de cálculo. Side Badger registra quién pagó, quién compartió el gasto y cómo se reparte, para que los saldos salgan bien sin que nadie haga divisiones largas en la mesa.
workflow:
  heading: Añadir un gasto, de principio a fin
  steps:
    - title: Indica quién pagó y por qué
      body: Escribe el importe, una descripción corta y la persona que pagó. Una sola persona paga cada gasto, lo que mantiene honesta la aritmética.
      shot: S05
      shotAlt: El formulario de gasto con el alquiler de una casa rural dividido por porcentaje entre tres personas
    - title: Elige cómo dividir
      body: Elige partes iguales, importes exactos o porcentajes. Los porcentajes tienen que sumar 100 y los importes exactos tienen que sumar el total.
      shot: S06
      shotAlt: El formulario de gasto con importes exactos escritos para cada persona en un regalo
    - title: Añade la historia
      body: Pon la fecha, añade etiquetas, un lugar y una nota. Todo el mundo en el grupo ve los mismos detalles y puede comentar ahí mismo.
      shot: S08
      shotAlt: Un gasto con sus detalles, un hilo de comentarios y el importe original con el que se introdujo
    - title: Plantea una duda si algo no cuadra
      body: Si el grupo ha activado las dudas sobre gastos, cualquier persona incluida en un gasto puede ponerlo en duda, y la lista de gastos puede mostrar solo los que tienen dudas.
      shot: S18
      shotAlt: La lista de gastos con una etiqueta de Cuestionado y el filtro Solo cuestionado
options:
  heading: Tres formas de dividir
  items:
    - title: A partes iguales
      body: Lo habitual para cenas, taxis y todo lo que todos compartieron a medias. Si el total no se divide exactamente, el céntimo sobrante va a una persona al azar, no siempre a la misma. En el taxi de abajo, le toca a Ana.
    - title: Por importes exactos
      body: Escribe lo que debe cada persona. Va bien para el regalo en el que cada uno eligió un precio distinto, o para la tienda donde el carrito de una persona llevaba más que la compra compartida. Los importes tienen que sumar el total.
    - title: Por porcentaje
      body: "Da a cada persona una parte del total. El alquiler según el tamaño de la habitación es el clásico: la habitación más grande paga la parte más grande y nadie finge lo contrario."
