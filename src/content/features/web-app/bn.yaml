meta:
  title: "ডাউনলোড ছাড়া বিল ভাগের অ্যাপ | Side Badger"
  description: "আপনার ফোন ভর্তি, আমরা বুঝি। Side Badger চলে আপনার ব্রাউজারে, অ্যাপ স্টোর ছাড়া, ডাউনলোড ছাড়া। হোম স্ক্রিনে যোগ করুন, আর এটি অ্যাপের মতো খোলে।"
h1: "অ্যাপ স্টোর নেই। ডাউনলোড নেই। তবু অ্যাপের মতোই লাগে"
navLabel: "ওয়েব অ্যাপ"
lead: "Side Badger থাকে আপনার ব্রাউজারে। খুঁজতে হয় না কোনো অ্যাপ স্টোর, আগে ডাউনলোড করারও কিছু নেই। ফোনে বা কম্পিউটারে সাইন ইন করুন, গ্রুপের সঙ্গে অনলাইনে খরচ ভাগ করুন, আর এক ট্যাপেই খুলতে চাইলে এটি হোম স্ক্রিনে বা ডকে যোগ করে নিন।"
cta:
  heading: "খুলুন। সাইন ইন করুন। গ্রুপ শুরু করুন।"
  body: "অ্যাকাউন্ট খুলুন, গ্রুপ শুরু করুন আর প্রথম খরচটা যোগ করুন, সবই আপনার এখনই খোলা ব্রাউজার থেকে। আগে একটু ঘুরে দেখতে চান? দেখুন [কীভাবে কাজ করে](page:how-it-works), অথবা [বিনামূল্যে কী কী মেলে](page:pricing)।"
problem:
  heading: "আপনার ফোন ভর্তি। আমরা বুঝি।"
  body: "ফোনের কোথাও আছে একই সূর্যাস্তের চার হাজার ছবি আর বহু মাস ধরে সরিয়ে দিয়ে আসা একটি স্টোরেজ সতর্কবার্তা। আরেকটা অ্যাপ ফোনটার সবচেয়ে কম দরকার, তাও শুধু একটা ডিনার ভাগ করার জন্য। তাই Side Badger একটি ওয়েব অ্যাপ। এটি ফোনে বা কম্পিউটারে একটি আধুনিক ব্রাউজারে চলে। ফোনে এটি মোবাইল লেআউট ব্যবহার করে, যেখানে গ্রুপের পাতা ট্যাবে ভাগ করা আর কন্ট্রোলগুলো টাচ-বান্ধব। কিছু বাড়তি সুবিধা, যেমন হোম স্ক্রিনে যোগ করা, আপনার ব্রাউজারের ওপর নির্ভর করে, আর কোথায় কোথায় করে তা আমরা জানিয়ে দিই।"
workflow:
  heading: "ব্রাউজারের ট্যাব থেকে হোম স্ক্রিন, তিন ধাপে"
  steps:
    - title: "খুলুন আর সাইন ইন করুন"
      body: "আপনার ব্রাউজারে Side Badger-এ যান আর সাইন ইন করুন। লাগে শুধু একটি ইমেইল ঠিকানা আর একটি পাসওয়ার্ড, আর কিছু যোগ করার আগে ইমেইলটি যাচাই করতে হয়। গ্রুপের প্রত্যেকের একটি অ্যাকাউন্ট লাগে, তাই যাদের আমন্ত্রণ জানান তারাও একই কাজ করবে।"
    - title: "হোম স্ক্রিনে বা ডকে যোগ করুন"
      body: "সাইন ইন করার পর অ্যাপটি নিজেই ইনস্টল করার প্রস্তাব দেয়। আপনার ব্রাউজার যেখানে অনুমতি দেয় সেখানে পাবেন **ইনস্টল করুন** বোতাম, আর যেখানে দেয় না সেখানে **কীভাবে করবেন দেখান**। চোখ এড়িয়ে গেছে, বা না বলে দিয়েছেন? **সেটিংস**-এ **হোম স্ক্রিন বা Dock-এ যোগ করুন**-এর নিচে একই সাহায্য আছে। iPhone বা iPad-এ সেটিংস আগে iPhone-এর ধাপগুলো দেখায় আর অন্য ডিভাইসগুলো রাখে **অন্যান্য ডিভাইস**-এর নিচে। যেভাবেই করুন, অ্যাপটি তারপর খোলে নিজস্ব একটি উইন্ডোতে।"
      shot: S20
      shotAlt: "সেটিংসের হোম স্ক্রিন বা Dock-এ যোগ করার অংশ, ডিভাইসে অ্যাপটি যোগ করার ধাপসহ"
    - title: "বিজ্ঞপ্তি চালু করুন, চাইলে"
      body: "আপনি চালু না করা পর্যন্ত বিজ্ঞপ্তি বন্ধ থাকে, আর প্রতিটি ডিভাইস আলাদাভাবে চালু করতে হয়। বিজ্ঞপ্তির ঘণ্টা যে **চালু করুন** বোতাম দেয় সেটি ব্যবহার করুন, অথবা **সেটিংস**-এর **পুশ বিজ্ঞপ্তি** সুইচ। iPhone বা iPad-এ আগে হোম স্ক্রিন থেকে অ্যাপটি খুলুন। সেখানে বিজ্ঞপ্তি কাজ করে শুধু ওই জায়গাতেই।"
      shot: S19
      shotAlt: "খোলা বিজ্ঞপ্তির ড্রপডাউন, গ্রুপের সাম্প্রতিক কার্যকলাপের তালিকাসহ"
options:
  heading: "ডিভাইস ধরে ধরে কীভাবে যোগ করবেন"
  items:
    - title: "iPhone ও iPad"
      body: "“শেয়ার” বোতামে ট্যাপ করুন, ওপরের দিকে তীর সহ একটি বর্গ। এটি না দেখলে আগে তিনটি বিন্দু (•••) ট্যাপ করুন, তারপর “শেয়ার”। নিচে স্ক্রল করে **হোম স্ক্রিনে যোগ করুন** ট্যাপ করুন। **ওয়েব অ্যাপ হিসেবে খুলুন** চালু রাখুন, তারপর **যোগ করুন** ট্যাপ করুন। কোনো লিঙ্ক অন্য একটি অ্যাপের ভেতরে খুলে থাকলে আগে পাতাটি Safari-তে খুলুন, কারণ ওই বিল্ট-ইন ব্রাউজার এটি যোগ করতে পারে না।"
    - title: "Android"
      body: "ব্রাউজারের মেনু খুলুন এবং **হোম স্ক্রিনে যোগ করুন** অথবা **অ্যাপ ইনস্টল করুন** বেছে নিন।"
    - title: "কম্পিউটারে Chrome বা Edge"
      body: "ব্রাউজারের মেনু খুলুন এবং এই সাইটটি অ্যাপ হিসেবে ইনস্টল করার বিকল্পটি বেছে নিন। তখন এটি পায় নিজস্ব উইন্ডো আর নিজস্ব আইকন।"
    - title: "Mac-এ Safari"
      body: "**ফাইল** বেছে নিন, তারপর **Dock-এ যোগ করুন**।"
sections:
  - heading: "বিজ্ঞপ্তি, শুধু আপনি চাইলে"
    body: "পুশ বিজ্ঞপ্তি ঐচ্ছিক। এগুলো চালু করলে আপনার গ্রুপে নতুন কার্যকলাপ হলে, যেমন কেউ খরচ যোগ করলে, মন্তব্য করলে বা পেমেন্ট রেকর্ড করলে, আপনি বিজ্ঞপ্তি পান। এগুলো একবারে একটি ডিভাইসে চালু করা হয়, বিজ্ঞপ্তির ঘণ্টা থেকে বা **সেটিংস** থেকে, আর সেখান থেকেই আবার বন্ধও করতে পারেন। এর জন্য এমন একটি ব্রাউজার লাগে যা এটি সমর্থন করে, আর আপনার অনুমতি লাগে। আপনার ব্রাউজার সাইটটির জন্য এগুলো ব্লক করে রাখলে আগে ব্রাউজারের সেটিংসে অনুমতি দিন। iPhone বা iPad-এ এগুলো কাজ করে শুধু হোম স্ক্রিনে যোগ করা অ্যাপ থেকে, ব্রাউজারের ট্যাব থেকে নয়। পৌঁছে যাওয়ার নিশ্চয়তা নেই, তাই বিজ্ঞপ্তিকে ধরুন একটা খোঁচা হিসেবে, প্রতিশ্রুতি হিসেবে নয়। ফিডে কী কী আসে তা জানতে দেখুন [একসঙ্গে পরিকল্পনা](page:feature/plan-together)।"
  - heading: "লাইভ আপডেট, রিফ্রেশ বোতাম ছাড়াই"
    body: "একটি খরচ যোগ করুন, আর সবাই সঙ্গে সঙ্গে দেখতে পায়, সঙ্গে কী বদলেছে আর কে বদলেছে সেটাও। প্রতিটি গ্রুপ একটি কার্যকলাপের ইতিহাস রাখে, আর বিজ্ঞপ্তির ঘণ্টা আপনার সব গ্রুপের কার্যকলাপ দেখায়। আপনি এইমাত্র যা যোগ করলেন তা দেখেছেন কি না, কাউকে জিজ্ঞেস করতে হয় না। সেটা তাদের স্ক্রিনেই আছে।"
  - heading: "39টি ভাষা, প্রত্যেকের নিজের"
    body: "Side Badger ব্যবহার করুন 39টি ভাষায়, ডান থেকে বাঁয়ে লেখা আরবি, ফার্সি ও উর্দু সহ। গ্রুপের প্রত্যেকে নিজের ভাষা বেছে নেয়, তাই একই গ্রুপের পাতা একজনের কাছে আরবিতে আর পরের জনের কাছে ইংরেজিতে হতে পারে। গ্রুপকে শুধু একটা বিষয়ে একমত হতে হয়, সংখ্যাগুলো।"
  - heading: "একাধিক ধরনের ব্যবহারকারীর কথা ভেবে তৈরি"
    body: "Side Badger তৈরি হয়েছে কিবোর্ড আর স্ক্রিন-রিডার ব্যবহারকারীদের কথা মাথায় রেখে। সদস্যদের রঙের সঙ্গে প্যাটার্ন থাকে, তাই সবুজ আর লাল আলাদা করে চেনার দরকার পড়ে না।"
    items:
      - "স্কিপ লিঙ্ক, যাতে কিবোর্ড ব্যবহারকারীরা সোজা বিষয়বস্তুতে চলে যেতে পারে।"
      - "ডায়ালগ কিবোর্ড ফোকাস সামলায়।"
      - "কন্ট্রোলগুলোতে লেবেল দেওয়া আছে, স্ক্রিন রিডারের জন্য।"
      - "ডান থেকে বাঁয়ে লেখা ভাষার জন্য লেআউট উল্টে যায়।"
limits:
  heading: "ওয়েব অ্যাপ যা করে না"
  items:
    - "অফলাইনে ব্যবহার করা যায় না। Side Badger-এর সংযোগ লাগে, তাই ওয়াইফাইবিহীন বিমানে এটি আপনার গ্রুপ খুলবে না।"
    - "অ্যাপ স্টোরে কোনো অ্যাপ নেই, আর iPhone বা Android-এর কোনো নেটিভ অ্যাপও নেই। Side Badger একটি ওয়েব অ্যাপ, আর হোম স্ক্রিনে বা ডকে যোগ করাই অ্যাপের মতো সংস্করণটি পাওয়ার উপায়।"
    - "হোম স্ক্রিনে বা ডকে যোগ করা আপনার ব্রাউজারের ওপর নির্ভর করে। মেনুর নাম ব্রাউজার ও সংস্করণ অনুযায়ী আলাদা হয়, আর কিছু ব্রাউজার এটি দেয়ই না।"
    - "পুশ বিজ্ঞপ্তি প্রতিটি ডিভাইসে নিজে চালু করলে তবেই আসে, আর এর জন্য এমন একটি ব্রাউজার লাগে যা এটি সমর্থন করে, সঙ্গে আপনার অনুমতি। iPhone বা iPad-এ এগুলো কাজ করে শুধু হোম স্ক্রিনে যোগ করা অ্যাপ থেকে। পৌঁছে যাওয়ার নিশ্চয়তা নেই।"
    - "কোনো ইমেইল বা টেক্সট সতর্কবার্তা নেই, আর পেমেন্টের কোনো রিমাইন্ডারও নেই। নতুন কার্যকলাপ অ্যাপে দেখা যায়, আর পুশ বিজ্ঞপ্তি চালু করলে সেভাবেও। পেমেন্টের তাগাদা দেওয়া এখনও আপনার ওপরই।"
    - "কার্যকলাপ 90 দিন রাখা হয়।"
    - "আপনি ইমেইল ঠিকানা আর পাসওয়ার্ড দিয়ে সাইন ইন করেন। Google বা Apple দিয়ে সাইন ইন নেই, আর আপনার বয়স 18 বা তার বেশি হতে হবে।"
    - "আমরা দাবি করি না যে Side Badger পুরোপুরি অ্যাক্সেসযোগ্য, বা এটি কোনো আনুষ্ঠানিক অ্যাক্সেসিবিলিটি মানদণ্ড পূরণ করে। কোনো কিছু আপনার পথে বাধা হলে অ্যাপের ভেতর থেকেই আমাদের জানান, আর আমাদের উত্তর সেখানেই দেখতে পাবেন।"
useCasesHeading: "যেখানে অ্যাপ না লাগা কাজে দেয়"
faq:
  heading: "প্রশ্ন"
  items:
    - q: "অ্যাপ স্টোরে কি Side Badger-এর কোনো অ্যাপ আছে?"
      a: "না। Side Badger একটি ওয়েব অ্যাপ। আপনি এটি ব্রাউজারে খোলেন, আর হোম স্ক্রিনে বা ডকে যোগ করতে পারেন যাতে এটি অ্যাপের মতো খোলে। অ্যাপ স্টোর থেকে ডাউনলোড করার কিছু নেই।"
    - q: "অ্যাপ ডাউনলোড না করে কি বিল ভাগ করা যায়?"
      a: "হ্যাঁ। ফোনে বা কম্পিউটারে একটি ব্রাউজারে Side Badger খুলুন, সাইন ইন করুন আর একটি গ্রুপ শুরু করুন। হোম স্ক্রিনে বা ডকে যোগ করা ঐচ্ছিক।"
    - q: "অফলাইনে কি কাজ করে?"
      a: "না। হোম স্ক্রিনে বা ডকে যোগ করা থাকলেও Side Badger-এর সংযোগ লাগে।"
    - q: "আমার iPhone-এ বিজ্ঞপ্তি আসছে না কেন?"
      a: "iPhone বা iPad-এ বিজ্ঞপ্তি কাজ করে শুধু হোম স্ক্রিনে যোগ করা অ্যাপ থেকে, ব্রাউজারের ট্যাব থেকে নয়। অ্যাপটি যোগ করুন, হোম স্ক্রিনের আইকন থেকে খুলুন, তারপর **সেটিংস**-এ বিজ্ঞপ্তি চালু করুন। পৌঁছে যাওয়ার নিশ্চয়তা নেই, তাই কোনোটি হারিয়ে গেলেও গ্রুপের কার্যকলাপের ইতিহাসে দেখা যায় কী যোগ হয়েছিল।"
    - q: "বিজ্ঞপ্তি কি চালু করতেই হবে?"
      a: "না। আপনি চালু না করা পর্যন্ত এগুলো বন্ধ থাকে, একবারে একটি ডিভাইসে। এগুলো ছাড়াও নতুন কার্যকলাপ অ্যাপে দেখা যায়, আর অ্যাপ খোলা থাকলে সবাই পরিবর্তনটা সঙ্গে সঙ্গে দেখে।"
    - q: "গ্রুপের প্রত্যেকের কি অ্যাকাউন্ট লাগবে?"
      a: "হ্যাঁ। লাগে শুধু একটি ইমেইল ঠিকানা আর একটি পাসওয়ার্ড, আর কিছু যোগ করার আগে ইমেইলটি যাচাই করতে হয়। গ্রুপে যে-ই যোগ দেয় সে একই কাজ করে, যে ফোন বা কম্পিউটারে তার খুশি।"
