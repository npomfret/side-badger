faq:
  heading: "Galderak"
  items:
    - q: "Soldata gordina ala garbia erabili behar dugu?"
      a: "Zuek erabakitzen duzue. Garbia ohikoa da, benetan gastatzeko duzun dirua delako. Soldata gordinak ez du kontuan hartzen zergek, pentsio-ekarpenek eta maileguen ordainketek soldata desberdinetatik zenbateko desberdinak kentzen dituztela. Zein aukeratu ere, erabili neurri bera biontzat."
    - q: "Side Badger-ek ikusten al ditu gure diru-sarrerak?"
      a: "Ez. Ehunekoak bakarrik sartzen dituzu, inoiz ez soldatak. Ehunekoak taldeko kideek ikus ditzakete, eta bikote baten kasuan zuek biok zarete."
    - q: "62/38 behin ezarri al dezakegu denerako?"
      a: "Banaketa gastu bakoitzeko ezartzen da, ez talde bakoitzeko. Kopiatu 62 eta 38 dituen gastu bat eta aldatu desberdina dena. [Gastuak banatzea](page:feature/split-expenses) orriak beste aukerak azaltzen ditu."
