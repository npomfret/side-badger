sections:
  - heading: Én valuta til hele gruppen
    body: Hvis gruppen helst ikke vil tænke over det, så vælg en gruppevaluta, og formularen omregner hver ny udgift til den med en kurs, du stadig kan se og ændre. Det gælder kun nye og kopierede udgifter. Redigeringer og eksisterende udgifter lades, som de er, så intet, der allerede er registreret, ændrer sig under dig.
  - heading: Skylder euro, betaler i pund
    body: Betalt i yen, men gør I op i pund? Det går fint. Når du registrerer en betaling, kan du omregne den også, så den, der skylder euro, kan betale i pund, og eurosaldoen stadig stemmer. Betal hinanden, som I vil, og registrer det bagefter.
  - heading: Regler for gruppen
    body: Begræns en gruppe til de valutaer, I rent faktisk bruger, og sæt en standard, så formularen åbner på den rigtige. En ferie i Portugal behøver ikke 139 andre valg ved siden af middagsregningen, og et [bryllup i udlandet](page:use-case/events-and-celebrations) behøver nok to.
limits:
  heading: Grænser
  items:
    - Kursen fastlåses, når udgiften gemmes. Gamle udgifter omvurderes aldrig.
    - Side Badger henter en aktuel kurs, hvor det er muligt. Ikke alle par er garanteret en, og du kan altid selv skrive kursen.
    - Automatisk omregning til gruppens valuta gælder kun nye og kopierede udgifter, ikke redigeringer eller eksisterende udgifter.
    - Hver udgift er begrænset til 999.999,99 i sin egen valuta.
    - Der er 140 valutaer. Kryptovalutaer og metaller er ikke iblandt dem.
    - Side Badger registrerer betalinger. Den flytter eller veksler aldrig penge.
useCasesHeading: Hvor det hjælper
faq:
  heading: Spørgsmål
  items:
    - q: Hvilken valutakurs bruger I?
      a: En aktuel valutakurs, hentet når du indtaster udgiften, hvor der findes en. Du kan ændre den til den kurs, du faktisk fik, og det omregnede beløb opdateres.
    - q: Bliver gamle udgifter omvurderet?
      a: Nej. Kursen fastlåses, når udgiften gemmes, så en saldo ikke driver, fordi markedet gjorde.
    - q: Understøtter I kryptovaluta?
      a: Nej. Der er 140 valutaer, og kryptovalutaer er ikke iblandt dem.
    - q: Hvorfor kan jeg ikke indtaste 2.000.000 rupiah?
      a: Hver udgift er begrænset til 999.999,99 i sin egen valuta. Indtast den i en anden valuta, og omregn, eller del den op i to udgifter.
    - q: Koster omregning noget?
      a: Nej. Omregning er gratis, ligesom resten af Side Badger. Se [priser](page:pricing).
    - q: Skal jeg omregne?
      a: Nej. Valutaerne forbliver adskilt, medmindre du eller din gruppe vælger at omregne, og hver valuta får sin egen korte liste over betalinger.
