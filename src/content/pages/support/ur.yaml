meta:
  title: "مدد اور سپورٹ | Side Badger"
  description: "پاس ورڈ بھول گئے، لنک کام نہیں کر رہا، ادائیگی غلط ریکارڈ ہو گئی؟ Side Badger میں لوگ جہاں اٹکتے ہیں ان کے مختصر جواب، اور ہم سے رابطہ کیسے کریں۔"
h1: "مدد اور سپورٹ، بغیر ہولڈ میوزک کے"
navLabel: "مدد اور سپورٹ"
lead: "ان باتوں کے مختصر جواب جہاں لوگ اٹکتے ہیں، بھولے ہوئے پاس ورڈ سے لے کر گروپ ہمیشہ کے لیے بند کرنے تک۔ ہر جواب اس صفحے سے جڑا ہے جو مزید بتاتا ہے۔ آپ کا سوال نہیں ملا؟ ایپ کے اندر سے ہمیں بتائیں، یا ہمیں ایک سطر لکھ دیں۔"
cta:
  heading: "مدد لینے آئے تھے، تقسیم کے لیے رک جائیں؟"
  body: "ابھی اکاؤنٹ نہیں ہے؟ گروپ شروع کریں، لنک بھیجیں اور پہلا خرچہ شامل کریں۔ مفت، بغیر اشتہارات اور بغیر یومیہ حد کے۔"
groups:
  - heading: "سائن ان"
    items:
      - q: "پاس ورڈ بھول گئے؟"
        a: "یہ بہترین بیجرز کے ساتھ بھی ہوتا ہے۔ **سائن ان** اسکرین پر **پاس ورڈ بھول گئے؟** چنیں، اپنے اکاؤنٹ کی ای میل لکھیں، پھر ہماری بھیجی ہوئی ای میل کے لنک سے نیا پاس ورڈ چنیں۔ اکاؤنٹ کو اور کیا چاہیے، اس کے لیے [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں۔"
      - q: "میں نے سائن اپ کر لیا ہے، مگر کچھ شامل نہیں کر پا رہا۔ کیوں؟"
        a: "اکثر وجہ یہ ہوتی ہے کہ آپ کی ای میل ابھی تصدیق شدہ نہیں، تو تصدیقی ای میل کا لنک کھولیں، یا یاد دہانی والے بینر پر **تصدیقی ای میل دوبارہ بھیجیں** چنیں تاکہ نئی آ جائے۔ اگر آپ تصدیق شدہ ہیں تو ہو سکتا ہے گروپ لاک ہو یا اس کی اجازتیں آپ کو اجازت نہ دیتی ہوں، اور ناظر سب کچھ دیکھتا ہے مگر کچھ نہیں بدلتا، جیسا کہ [گروپس اور اجازتیں](page:feature/groups-and-permissions) بتاتا ہے۔"
      - q: "میں اپنی ای میل یا پاس ورڈ کیسے بدلوں؟"
        a: "**ترتیبات** میں **ای میل تبدیل کریں** یا **پاس ورڈ تبدیل کریں** چنیں۔ دونوں پہلے آپ کا موجودہ پاس ورڈ مانگتے ہیں، اور نئے ای میل ایڈریس کی تصدیق اس لنک سے کرنی ہوتی ہے جو ہم اسے بھیجتے ہیں۔ اکاؤنٹس کے بارے میں [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں۔"
      - q: "کیا میں Google یا Apple سے سائن ان کر سکتا ہوں؟"
        a: "نہیں۔ آپ کو بس ایک ای میل ایڈریس اور کم از کم 12 حروف کا پاس ورڈ چاہیے، اور اپنے فون یا کمپیوٹر پر **مجھے یاد رکھیں** پر ٹک کر سکتے ہیں۔ شروع کرنے کی باقی باتیں [ویب ایپ](page:feature/web-app) کے صفحے پر ہیں۔"
  - heading: "گروپ میں شامل ہونا"
    items:
      - q: "کسی نے مجھے دعوتی لنک بھیجا ہے۔ میں کیسے شامل ہوں؟"
        a: "اسے کھولیں، پھر سائن ان کریں یا مفت اکاؤنٹ بنائیں۔ آپ کو گروپ کا پیش منظر نظر آئے گا، وہاں وہ نام چنیں جس سے لوگ آپ کو دیکھیں گے، اور **گروپ میں شامل ہوں** دبائیں۔ پورا راستہ [گروپس اور اجازتیں](page:feature/groups-and-permissions) دکھاتا ہے۔"
      - q: "لکھا ہے «منظوری کا انتظار»۔ کیا مجھ سے کوئی غلطی ہوئی؟"
        a: "بالکل نہیں۔ اس گروپ میں ایڈمن ہر شخص کو اندر آنے دیتا ہے، اس لیے آپ کی درخواست اس کے ایڈمنز کو چلی گئی ہے، اور جب تک ان میں سے کوئی منظور نہ کرے آپ اندر نہیں دیکھ سکتے۔ روبرو ایک دوستانہ یاد دہانی کی اجازت ہے، اور [گروپس اور اجازتیں](page:feature/groups-and-permissions) منظوری کی وضاحت کرتا ہے۔"
      - q: "لنک کہتا ہے کہ غلط ہے یا اس کی میعاد ختم ہو گئی ہے۔"
        a: "دعوتی لنک اتنی دیر چلتے ہیں جتنی بنانے والے نے چنی ہو، 15 منٹ سے لے کر 5 دن تک۔ گروپ میں کسی سے نیا لنک مانگیں، یا اگر آپ ایک ہی کمرے میں ہیں تو QR کوڈ۔ دعوتوں کے بارے میں [یہ کیسے کام کرتا ہے](page:how-it-works) دیکھیں۔"
  - heading: "اخراجات"
    items:
      - q: "میں خرچہ کیسے شامل کروں؟"
        a: "گروپ کھولیں اور **خرچہ شامل کریں** چنیں۔ بتائیں یہ کس چیز کا تھا، کتنا تھا، کس نے ادا کیا اور کس کس نے بانٹا، پھر اسے برابر، عین رقم یا فیصد کے مطابق تقسیم کریں۔ ہر اختیار [اخراجات کی تقسیم](page:feature/split-expenses) میں سمجھایا گیا ہے۔"
      - q: "کیا کرایہ ہر مہینے خود دہرایا جا سکتا ہے؟"
        a: "خود نہیں، کیونکہ بار بار آنے والے اخراجات نہیں ہیں۔ پچھلے مہینے کا کھولیں اور **خرچہ کاپی کریں** چنیں، فارم بھرا ہوا آ جاتا ہے، نئی تاریخ اور جو کچھ بدلا ہے اس کے لیے تیار۔ کاپی کرنے کے بارے میں مزید [اخراجات کی تقسیم](page:feature/split-expenses) میں ہے۔"
      - q: "میں نے رقم غلط لکھ دی۔ کیا ٹھیک ہو سکتی ہے؟"
        a: "جی ہاں۔ خرچہ ایڈٹ کریں، بشرطیکہ گروپ کی اجازتیں آپ کو دیں اور گروپ لاک نہ ہو۔ پچھلا ورژن محفوظ رہتا ہے، تاکہ کسی کو آپ کی بات پر یقین نہ کرنا پڑے کہ کیا بدلا، جیسا کہ [اخراجات کی تقسیم](page:feature/split-expenses) بتاتا ہے۔"
      - q: "ایک خرچہ غلط لگ رہا ہے، اور وہ میرا نہیں۔ اب کیا کروں؟"
        a: "اس پر **میرا ایک سوال ہے** چنیں اور وجہ لکھیں، اور پورا خرچہ سب کے بیلنس سے باہر رہتا ہے جب تک سوال اٹھانے والا شخص، یا کوئی ایڈمن، سوال بند نہ کر دے۔ یہ بٹن نہیں ملا؟ سوال صرف وہ لوگ اٹھا سکتے ہیں جو خرچے میں شامل ہوں، اور ایڈمن کو پہلے گروپ کی ترتیبات میں **اخراجات کے سوالات کی اجازت دیں** آن کرنا ہوتا ہے، اور [متنازع خرچے کی گائیڈ](page:guide/what-to-do-when-someone-disputes-a-shared-expense) میں سفارت کاری کے طریقے ہیں۔"
  - heading: "ادائیگیاں"
    items:
      - q: "کیا Side Badger رقم بھیجتا ہے؟"
        a: "نہیں، Side Badger رقم کبھی منتقل نہیں کرتا۔ ایک دوسرے کو جیسے چاہیں ادا کریں، بینک ٹرانسفر سے، نقد یا جو بھی چلے، پھر ادائیگی ریکارڈ کریں تاکہ بیلنس ساتھ آ جائیں۔ [گروپ سفر کے بعد حساب برابر کیسے کریں](page:guide/how-to-settle-up-after-a-group-trip) شروع سے آخر تک سمجھاتی ہے۔"
      - q: "میں ادائیگی کیسے ریکارڈ کروں؟"
        a: "گروپ میں **تصفیہ کریں** چنیں، بتائیں کس نے ادا کیا اور کس نے وصول کیا، رقم لکھیں یا **فوری تصفیہ** کا بٹن اسے بھرنے دیں، اور **تصفیہ ریکارڈ کریں** چنیں۔ صرف کچھ حصہ دیا؟ جو ادا ہوا وہ ریکارڈ کریں اور باقی بیلنس پر رہتا ہے، جیسا کہ [حساب برابر کرنا](page:feature/settle-up) بتاتا ہے۔"
      - q: "میں نے ادائیگی غلط ریکارڈ کر دی۔ کیا ٹھیک ہو سکتی ہے؟"
        a: "جس نے ریکارڈ کی وہ اسے گروپ کی **تصفیے** کی تاریخ سے ایڈٹ کر سکتا ہے، اور وہ یا کوئی ایڈمن اسے حذف کر سکتا ہے، جس سے وہ بیلنس سے ہٹ جاتی ہے۔ ایسی ادائیگی جس میں شامل کوئی شخص بعد میں گروپ چھوڑ گیا ہو ایڈٹ نہیں ہو سکتی۔ تاریخ کے بارے میں [حساب برابر کرنا](page:feature/settle-up) دیکھیں۔"
  - heading: "اطلاعات اور ہوم اسکرین"
    items:
      - q: "میں اطلاعات کیسے آن کروں؟"
        a: "**ترتیبات** میں **پش اطلاعات** آن کریں اور جب آپ کا براؤزر پوچھے تو اجازت دیں۔ اگر براؤزر انہیں پہلے ہی بلاک کر چکا ہو تو پہلے اس کی اپنی ترتیبات میں اجازت دیں۔ ہر ڈیوائس الگ سے آن ہوتی ہے اور ترسیل کی ضمانت نہیں، اس لیے اطلاع کو یاد دہانی سمجھیں، وعدہ نہیں، جیسا کہ [ویب ایپ](page:feature/web-app) کا صفحہ بتاتا ہے۔"
      - q: "میرے iPhone پر اطلاعات کیوں کام نہیں کرتیں؟"
        a: "iPhone یا iPad پر یہ صرف اس ایپ میں کام کرتی ہیں جو آپ کی ہوم اسکرین پر شامل ہو، براؤزر ٹیب میں کبھی نہیں۔ اسے شامل کریں، ہوم اسکرین کے آئیکن سے کھولیں، پھر **ترتیبات** میں آن کریں۔ یہ آپ کو کس بارے میں بتاتی ہیں، یہ [مل کر منصوبہ بنائیں](page:feature/plan-together) دکھاتا ہے۔"
      - q: "کیا ڈاؤن لوڈ کرنے کے لیے ایپ ہے؟"
        a: "ایپ اسٹور سے نہیں، کیونکہ Side Badger آپ کے براؤزر میں چلتا ہے۔ سائن ان کریں، پھر **ترتیبات** میں **ہوم اسکرین یا Dock میں شامل کریں** پر چلیں، اور یہ ایپ کی طرح، اپنی الگ ونڈو میں کھلتا ہے۔ ہر ڈیوائس کے مراحل [ویب ایپ](page:feature/web-app) کے صفحے پر ہیں۔"
  - heading: "چھوڑنا، محفوظ کرنا، لاک کرنا اور بند کرنا"
    items:
      - q: "میں گروپ کیسے چھوڑوں؟"
        a: "حساب برابر کریں، پھر **گروپ چھوڑیں** چنیں۔ آپ نہیں چھوڑ سکتے اگر کسی ایک کرنسی میں بھی آپ کو دینا یا لینا ہو، یا جس خرچے میں آپ شامل ہیں اس پر سوال کھلا ہو، یا آپ آخری ایڈمن یا اکلوتے رکن ہوں، اور واپس آنے کے لیے نئی دعوت چاہیے۔ تفصیل [گروپس اور اجازتیں](page:feature/groups-and-permissions) میں ہے۔"
      - q: "میں پرانے گروپ کو اپنے ڈیش بورڈ سے کیسے ہٹاؤں؟"
        a: "**گروپ محفوظ کریں** چنیں۔ وہ آپ کے ڈیش بورڈ سے غائب ہو جاتا ہے، کسی اور کے سے نہیں، آپ پھر بھی اسے کھول اور استعمال کر سکتے ہیں، اور **گروپ غیر محفوظ کریں** اسے واپس لے آتا ہے۔ محفوظ کرنے، لاک کرنے اور بند کرنے کا موازنہ [گروپس اور اجازتیں](page:feature/groups-and-permissions) میں ہے۔"
      - q: "سفر ختم ہو گیا۔ کیا ہم اعداد کو بدلنے سے روک سکتے ہیں؟"
        a: "جی ہاں۔ ایڈمن گروپ کی ترتیبات میں **گروپ لاک کریں** آن کر سکتا ہے، اور جب تک ایڈمن اسے کھول نہ دے کوئی خرچہ شامل یا ایڈٹ نہیں کر سکتا، نئی ادائیگیاں ریکارڈ نہیں کر سکتا یا فہرستیں اور پولز نہیں بدل سکتا۔ ہر کوئی گروپ اور اس کی تاریخ پڑھ سکتا ہے، اور کوئی دیر سے آئی ٹیکسی چپکے سے نہیں گھس سکتی، جیسا کہ [گروپس اور اجازتیں](page:feature/groups-and-permissions) بتاتا ہے۔"
      - q: "کیا میں گروپ حذف کر سکتا ہوں؟"
        a: "ایڈمن اسے **گروپ بند کریں** سے بند کر سکتا ہے، تصدیق کے لیے گروپ کا نام لکھنے کے بعد۔ بند کرنا مستقل ہے اور گروپ کو سب کے لیے ناقابل رسائی کر دیتا ہے، اس لیے اگر آپ بس اسے نظروں سے ہٹانا چاہتے ہیں تو اسے محفوظ کر دیں۔ باریک چھپی باتیں [گروپس اور اجازتیں](page:feature/groups-and-permissions) میں ہیں۔"
contact:
  heading: "پھر بھی اٹکے ہیں؟"
  items:
    - q: "کوئی خرابی ملی، یا کچھ بدلوانا ہے؟"
      a: "ایپ کے اندر سے ہمیں بتائیں۔ اپنے اکاؤنٹ مینو میں **رائے** چنیں، پھر **رائے بھیجیں**، اور **مسئلہ رپورٹ کریں**، **مدد کی درخواست** یا **خصوصیت کی درخواست** میں سے ایک چنیں۔ اگر مدد ملے تو اسکرین شاٹ لگا دیں، اور جب ہم جواب دیں گے تو وہ آپ کو اسی تھریڈ میں ملے گا۔"
    - q: "یا آپ ای میل کرنا چاہیں گے؟"
      a: "نیچے دیے گئے ایڈریس پر لکھیں۔ بتائیں کس گروپ کے بارے میں ہے، آپ نے کیا کیا اور آپ کو کیا ہونے کی توقع تھی۔ بھڑاس نکالنا ٹھیک ہے؛ پاس ورڈ نہیں، اس لیے اپنا کبھی نہ بھیجیں۔"
  emailLabel: "ہمیں ای میل کریں:"
  email: support@sidebadger.me
