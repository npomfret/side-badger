faq:
  heading: "أسئلة"
  items:
    - q: "أي سعر صرف يستخدمه Side Badger؟"
      a: "سعر صرف حالي، يُجلب عند إدخال المصروف حيثما توفّر. ويمكنك تغييره إلى السعر الذي حصلت عليه فعلاً."
    - q: "هل تستطيع المجموعة الاكتفاء بالجنيه والين؟"
      a: "نعم. في **الإعدادات** الخاصة بالمجموعة، فعّل **تقييد العملات لهذه المجموعة** ضمن **إعدادات العملة**، وحدّد **العملات المسموح بها** واضبط **العملة الافتراضية للمصروفات الجديدة**. خيارات أقل في القائمة، وتخمينات خاطئة أقل عند الصندوق."
    - q: "هل علينا أن نحوّل أصلاً؟"
      a: "لا. تبقى العملات منفصلة ما لم تختر أنت أو مجموعتك التحويل، ولكل عملة قائمتها القصيرة من الدفعات."
