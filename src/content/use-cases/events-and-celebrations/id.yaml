faq:
  heading: "Pertanyaan"
  items:
    - q: "Bisakah tamu melihat grup tanpa bergabung?"
      a: "Tidak. Orang bergabung dengan tautan atau kode QR dan akun gratis, jadi mereka bisa melihat grup setelah masuk."
    - q: "Bisakah Side Badger menagih uangnya?"
      a: "Tidak. Side Badger menyimpan hitungan dan tidak pernah memindahkan uang. Bayar satu sama lain dengan cara apa pun yang Anda suka, lalu catat pembayarannya. Gratis, tanpa iklan dan tanpa batas harian; lihat [harga](page:pricing)."
    - q: "Bisakah suara dibuat anonim?"
      a: "Ya. Saat membuat polling Anda bisa menyembunyikan siapa memilih apa. Pengaturannya hanya bisa diubah sebelum suara pertama."
    - q: "Bisakah orang urunan dengan jumlah berbeda?"
      a: "Ya. Bagi pengeluaran berdasarkan jumlah pasti, sehingga bagian tiap orang adalah angka yang disepakati, atau keluarkan orang yang tidak terlibat."
    - q: "Bisakah penyelenggara memegang pembukuan?"
      a: "Ya. Pakai preset grup terkelola, sehingga hanya pembuat dan admin yang mengubah pengeluaran dan admin menyetujui anggota baru."
