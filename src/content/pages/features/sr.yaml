meta:
  title: "Шта Side Badger ради, а шта не"
  description: "Подела, поравнање и више валута, плус групе, спискови и анкете. Цео пакет и искрен списак онога што Side Badger изоставља."
h1: "Шта Side Badger ради"
navLabel: "Функције"
lead: "Све што је у кутији, и оно што није."
intro: "Ево целог пакета. Табелу смо намерно изоставили. Почни са три посла која Side Badger ради сваки дан, а затим погледај остатак списка и кратак списак ствари које не ради."
cta:
  heading: "Да ли ради оно што твојој групи треба?"
  body: "Направи бесплатан кориснички налог и прво га испробај са малом групом."
  button: "Направи бесплатан налог"
cardsHeading: "Три посла, детаљно"
sections:
  - heading: "Скенирање рачуна"
    body: "Сликај рачун, а Side Badger попуни укупан износ, датум и место да их провериш. Слике рачуна чита Гуглов AI сервис."
  - heading: "Групе и дозволе"
    body: "Направи групу за сваку кућу, путовање или догађај, са до 50 особа. Позови људе везом или QR кодом. У већој групи некога можеш учинити посматрачем, који види све и ништа не мења."
  - heading: "Спискови и анкете"
    body: "Заједнички списак за куповину држи уз рачуне за куповину. Избор виле стави на гласање, по жељи анонимно."
  - heading: "Све остало"
    items:
      - "**Ажурирања уживо:** додај трошак и сви га одмах виде."
      - "**Језици:** користи Side Badger на 39 језика. Свако у групи може изабрати свој."
      - "**Почетни екран:** продавница апликација није потребна. Додај Side Badger на почетни екран и отвара се као апликација."
      - "**Повратне информације:** наишао си на грешку? Јави нам из апликације и тамо прочитај наш одговор."
  - heading: "Шта Side Badger не ради"
    items:
      - "**Не премешта новац.** Side Badger никад не дира твој новац. Платите једни другима како год желите. Захтеви за уплату су у плану."
      - "**Не понавља рачуне.** Нема понављајућих трошкова. Копирај прошломесечни рачун у два додира."
      - "**Не дели по ставкама.** Једна особа плаћа по трошку. Дели једнако, тачно или по процентима."
      - "**Нема изворну апликацију.** Ради у прегледачу. Додај га на почетни екран."
      - "**Не ради ван мреже.** Потребна му је веза."
      - "**Не шаље упозорења имејлом ни СМС-ом.** Обавештења се појављују у апликацији. Пуш обавештења су у плану."
      - "**Не црта графиконе ни буџете.** Води евиденцију ко коме дугује, и то је цео трик."
      - "**Не пријављује преко Гугла ни Епла.** Региструј се имејлом. Пријава преко Гугла и Епла је у плану."
      - "**Не пушта људе без корисничког налога.** Свако у групи треба бесплатан кориснички налог."
faq:
  heading: "Питања"
  items:
    - q: "Могу ли да плаћам преко Side Badger-а?"
      a: "Не. Side Badger води евиденцију и никад не дира твој новац. Платите једни другима како год желите, а затим забележи уплату."
    - q: "Постоји ли мобилна апликација?"
      a: "Не у продавници апликација. Side Badger ради у прегледачу, а можеш га додати на почетни екран да се отвара као апликација."
    - q: "Могу ли да делим по ставкама?"
      a: "Не. Сваки трошак има једног платиоца, а делиш га једнако, тачно или по процентима."
    - q: "Ради ли ван мреже?"
      a: "Не, потребна му је веза."
    - q: "Да ли свако у групи треба кориснички налог?"
      a: "Да. Свако у групи треба бесплатан кориснички налог, а за регистрацију је довољна имејл адреса."
