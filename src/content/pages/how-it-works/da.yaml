meta:
  title: Sådan virker Side Badger | Del gruppeudgifter i fem trin
  description: Opret en gruppe, inviter folk, tilføj udgifter og gør op. Se, hvad der sker mellem »nogen har betalt« og »nu står vi lige«, med et gennemregnet eksempel.
h1: Sådan virker Side Badger
navLabel: Sådan virker det
lead: "Hvad sker der mellem »nogen har betalt« og »nu står vi lige«? Fem trin, intet regneark og én grævling, der mest er til pynt. Her er hele turen, fra den første gruppe til den sidste registrerede betaling. Du kan læse mere om de enkelte trin under [del udgifter](page:feature/split-expenses) og [gør op](page:feature/settle-up)."
cta:
  heading: Fra »jeg tager lige den her« til »nu står vi lige«
  body: Opret en gratis konto, start en gruppe, og tilføj den første udgift. Grævlingen dømmer ikke kvitteringen.
  button: Opret en gratis konto
steps:
  - title: Opret en gruppe
    body: Lav én gruppe til hvert hus, hver tur og hver begivenhed, så huslejen aldrig havner på samme liste som bryllupsgaven. Giv den et navn, vælg det navn, folk skal se dig som, og begræns om ønsket, hvilke valutaer den tager imod. Dit overblik viser så alle dine grupper og din status i hver af dem på én skærm.
    shot: S02
    shotAlt: Dialogen til at oprette en gruppe med afsnittet om valutabegrænsninger åbent
  - title: Inviter dine folk
    body: Del et link, eller vis en QR-kode, og vælg, hvor længe den gælder, fra 15 minutter op til 5 dage. Alle, der tilmelder sig, skal have en gratis konto og en bekræftet e-mail, og en gruppe rummer op til 50 personer. Vil du kontrollere, hvem der kommer ind, så slå godkendelse til, så en administrator lukker hver person ind.
    shot: S03
    shotAlt: Invitationsdialogen på linkfanen med en QR-kode og valg af udløbstid
  - title: Tilføj udgifter, mens de sker
    body: Sig, hvem der betalte, hvor meget, og hvem det var til. Del det ligeligt, efter nøjagtige beløb eller i procent, og udelad dem, der ikke var med. Tilføj udgiften, og alle ser den med det samme, sammen med hvad der blev ændret, og hvem der ændrede det.
    shot: S05
    shotAlt: Udgiftsformularen med en procentdeling, der fordeler huslejen efter værelsernes størrelse
  - title: Følg med i saldiene
    body: Side Badger fører en løbende saldo for hver valuta, så du med et enkelt blik kan se, hvem der skylder hvem. I stedet for at lade alle rode et net af små gældsposter ud, foreslår den en kort liste over betalinger, der gør op for gruppen.
    shot: S10
    shotAlt: Saldoskærmen med forenklet gæld i to valutaer og Vis alle slået til
  - title: Gør op uden for appen, registrer det i den
    body: Side Badger flytter aldrig penge. Betal hinanden, som I vil, og registrer så betalingen, så saldiene følger med, og alles skærm opdateres uden at skulle genindlæses. »Gjort op« betyder blot, at saldiene viser nul. Ingen kan forlade en gruppe, mens vedkommende stadig skylder eller er til gode, så alle, der er på vej ud, gør først op.
    shot: S11
    shotAlt: Betalingsformularen med hurtigafregningsknapper og beskeden om delbetaling
requirements:
  heading: Hvad du skal bruge
  items:
    - En gratis konto. Du skal bare bruge en e-mailadresse og en adgangskode, og du bekræfter e-mailen, før du kan tilføje noget.
    - At være fyldt 18 år.
    - En moderne browser på en telefon eller en computer og en forbindelse. Side Badger er ikke en app fra en app store og virker ikke offline.
    - Eventuelt en plads på din startskærm. Ingen app store nødvendig, for du kan føje Side Badger til din startskærm eller dock, og så åbner den som en app.
