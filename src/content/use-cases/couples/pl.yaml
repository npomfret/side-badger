featuresHeading: "Funkcje, z których korzysta para"
faq:
  heading: "Pytania"
  items:
    - q: "Czy możemy raz ustawić 60/40 dla wszystkiego?"
      a: "Nie. Podział należy do każdego wydatku. Ustaw procenty przy pierwszym, a następnym razem skopiuj go i zmień to, co się różni. Wszystkie trzy sposoby podziału opisuje [dzielenie wydatków](page:feature/split-expenses)."
    - q: "Czy łączy się z naszym bankiem?"
      a: "Nie. Side Badger nigdy nie dotyka waszych pieniędzy. Płacicie sobie, jak chcecie, a potem to rejestrujecie, jak wyjaśnia [rozliczanie](page:feature/settle-up)."
    - q: "Czy ktoś jeszcze widzi naszą grupę?"
      a: "Tylko jej członkowie, a grupa pary ma dwoje. Każdy, kto użyje ważnego linku z zaproszeniem, może dołączyć, więc udostępnij go jednej osobie i ustaw krótki termin ważności."
    - q: "Co, jeśli każde z nas zapłaciło część tego samego rachunku?"
      a: "Wydatek ma jednego płatnika. Zarejestruj dwa wydatki, po jednym dla każdego z was, a saldo wyjdzie tak samo."
    - q: "Czy Side Badger przypomni mojej drugiej połówce o płatności?"
      a: "Nie. Nie ma przypomnień, więc ponaglanie nadal należy do ciebie. Przynajmniej patrzycie na tę samą liczbę."
    - q: "Co się dzieje, gdy przestaniemy dzielić koszty?"
      a: "Rozliczcie saldo i zarejestrujcie płatność, żeby nikt nic nie był winien. Potem administrator może zablokować grupę, co zostawia liczby tak, jak są, albo zamknąć ją na dobre, co czyni ją niedostępną dla wszystkich. Zamykajcie ją dopiero wtedy, gdy żadne z was nie potrzebuje historii."
