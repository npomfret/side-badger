faq:
  heading: "Sorular"
  items:
    - q: "Biri daha büyük bir odadaysa ama odası daha az ışık alıyorsa?"
      a: "Taban alanı yalnızca başlangıç noktasıdır; grup ayarlamak konusunda anlaşabilir. Karanlık odadan bir iki puan düşün, diğerlerine verin ve yüzdelerin hâlâ 100 ettiğini kontrol edin. Side Badger anlaştığınız her neyse saklar ve yargılamaz."
    - q: "Faturalar da oda büyüklüğüne göre mi bölüşülmeli?"
      a: "Genellikle hayır. Enerji ve internet herkes tarafından kullanılır, bu yüzden yukarıdaki örnekteki gibi eşit bölüşüm daha basittir. Bir ev arkadaşı bütün gün evdeyse grup tam tutarlar gibi başka bir şey üzerinde anlaşabilir. Seçenekler [harcamaları bölüşme](page:feature/split-expenses) sayfasında."
    - q: "Bölüşümü sonradan değiştirebilir miyiz?"
      a: "Evet, yeni harcamalar için. Kirayı kopyalarken yüzdeleri değiştirin; önceki aylar olduğu gibi kalır. Geçmiş bir harcamayı düzeltmek için grubun izinleri izin veriyorsa onu düzenleyin ve önce eve haber verin, çünkü bakiyeler değişir. Önceki sürüm saklanır."
