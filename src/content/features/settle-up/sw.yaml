sections:
  - heading: "Rekodi malipo"
    body: "Mtu anapolipa, rekodi dhidi ya mtu sahihi. Vitufe vya Lipa haraka vinajaza kiasi kutoka kwenye malipo yaliyopendekezwa, na unaweza kuongeza maelezo kama “uhamisho wa benki” (hadi herufi 500). Ukilipa sehemu tu ya unachodaiwa, kilichobaki hubaki kwenye salio. Ukiweka kidogo sana au nyingi sana, Side Badger inakuonya kabla ya kuhifadhi. Kurekodi malipo kunahitaji ruhusa ya kuhariri gharama, na tarehe haiwezi kuwa ya baadaye."
  - heading: "Umelipa kwa sarafu tofauti?"
    body: "Salio hubaki katika sarafu iliyotumika kulipa, kwa hivyo deni la euro linabaki deni la euro. Unadaiwa euro, lakini unalipa kwa pauni? Badilisha malipo unapoyaweka, kwa kiwango cha sasa cha kubadilisha fedha au kwa kiwango ulichopata kwa kweli. Kiwango hufungwa malipo yanapohifadhiwa. [Sarafu nyingi](page:feature/multiple-currencies) inaeleza jinsi ubadilishaji unavyofanya kazi, na [safari za kikundi](page:use-case/group-trips) inaonyesha ikitumika."
  - heading: "Historia unayoweza kuikagua"
    body: "Kila malipo yaliyorekodiwa hubaki kwenye historia ya kikundi pamoja na tarehe, kiasi na maelezo yake. Ni mtu aliyerekodi malipo tu anayeweza kuyahariri, na yeye au msimamizi wa kikundi anaweza kuyafuta. Malipo yanayomhusisha mtu aliyeondoka kwenye kikundi yamefungwa. Kwa mfano kamili wa wapangaji wenza, tazama [wapangaji wenza](page:use-case/housemates)."
limits:
  heading: "Kile Side Badger isichofanya"
  items:
    - "Side Badger haisogezi pesa, haitumi viungo vya malipo wala maombi ya malipo. Malipo kwenye programu ni rekodi ya malipo yaliyofanyika mahali pengine."
    - "Malipo yanayopendekezwa hutokana na njia rahisi ya kulinganisha, inayotumika kwa kila sarafu. Daima hupendekeza malipo machache kuliko idadi ya watu wenye salio katika sarafu hiyo (kwa watu wanne, malipo matatu kwa kiwango cha juu), lakini haipati idadi ndogo kabisa inayowezekana kila mara."
    - "Huwezi kuzima mapendekezo. **Onyesha yote** inaorodhesha kila malipo yaliyopendekezwa kwenye kikundi, si yako tu."
    - "Sarafu hazifutanishwi kamwe isipokuwa gharama zilibadilishwa zilipowekwa."
    - "Hakuna vikumbusho, kwa hivyo kufuatilia malipo bado ni jukumu lako."
useCasesHeading: "Mahali ambapo kumaliza hesabu kunajalisha"
faq:
  heading: "Maswali"
  items:
    - q: "Je, Side Badger inatuma pesa?"
      a: "Hapana. Lipaneni mtakavyo, kisha rekodi malipo kwenye Side Badger ili salio lisasishwe."
    - q: "Je, ninaweza kuzima malipo yanayopendekezwa?"
      a: "Hapana. Urahisishaji hubaki umewashwa, na **Onyesha yote** inaorodhesha kila malipo yaliyopendekezwa kwenye kikundi, si yale yanayokuhusu tu."
    - q: "Kwa nini euro na pauni zimetenganishwa?"
      a: "Salio hubaki katika sarafu uliyolipia isipokuwa ubadilishe unapoweka gharama au malipo. Madeni ya sarafu tofauti hayafutanishwi kamwe."
    - q: "Je, mtu akilipa sehemu tu ya anachodaiwa?"
      a: "Rekodi sehemu aliyolipa. Kilichobaki hubaki kwenye salio hadi kilipwe."
    - q: "Je, hii daima ni idadi ndogo kabisa ya malipo?"
      a: "Hakuna hakikisho. Daima inapendekeza malipo machache kuliko idadi ya watu wenye salio katika sarafu hiyo, kwa hivyo kwa watu wanne haipendekezi zaidi ya matatu. Katika mfano wa wapangaji wenza, hayo ni malipo mawili, ambapo kumlipa kila mtu moja kwa moja kulihitaji sita."
