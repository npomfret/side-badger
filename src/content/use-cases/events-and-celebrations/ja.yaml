featuresHeading: 使う機能
faq:
  heading: よくある質問
  items:
    - q: 参加しなくてもゲストはグループを見られますか？
      a: いいえ。リンクまたはQRコードと無料アカウントで参加するので、グループを見られるのは参加したあとです。
    - q: Side Badgerでお金を集められますか？
      a: いいえ。Side Badgerは残高を記録するだけで、お金を動かすことはありません。支払いは好きな方法で行い、そのあと支払いを記録してください。無料で、広告も1日の制限もありません。[料金](page:pricing)をご覧ください。
    - q: 投票は匿名にできますか？
      a: はい。投票を作成するときに、誰が何に投票したかを非表示にできます。設定を変更できるのは、最初の投票の前までです。
    - q: 人によって出す金額を変えられますか？
      a: はい。支出を金額指定で分ければ、各自の負担額は合意した数字になります。関わらなかった人を外すこともできます。
    - q: 幹事が家計簿を管理できますか？
      a: はい。管理グループのプリセットを使うと、支出を変更できるのは作成者と管理者だけになり、新しいメンバーは管理者が承認します。
