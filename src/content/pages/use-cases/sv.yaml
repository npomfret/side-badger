meta:
  title: Side Badger för rumskamrater, resor och fester
  description: Dela kostnader med rumskamrater, på gruppresor och för fester, bröllop och gruppgåvor. Se vad Side Badger gör för varje sorts grupp.
h1: Side Badger för just din sorts grupp
navLabel: Användningsområden
lead: Rumskamrater, semestrar, möhippor. Välj ditt kaos och se sedan hur en grupp som din håller räkningen.
intro: Varje grupp delar kostnader lite olika. De här sidorna följer ett **realistiskt scenario** från den första utgiften till den sista registrerade betalningen, med uträkningarna synliga, så att du kan se vad din egen grupp skulle få.
cta:
  heading: Hittade du din sorts grupp?
  body: Skapa ett konto, starta en grupp och lägg till den första utgiften. Det tar ett par minuter.
  button: Skapa ett gratiskonto
cardsHeading: Välj den situation som ligger närmast din
sections:
  - heading: Gruppresor
    body: Flyg i pund, en villa i euro och en middag som bara tre personer åt. Ställ in gruppen på att räkna om till pund så slutar fyra vänner i Lissabon med tre betalningar, i stället för sex när valutorna hålls separata. [Dela kostnaderna för en gruppresa](page:use-case/group-trips).
  - heading: Rumskamrater
    body: En person betalar hyresvärden, en annan kommer ihåg elräkningen, och ingen är överens om vem som köpte toapappret. Med hyran delad efter rummens storlek och de andra räkningarna delade lika slutar fyra rumskamrater månaden med tre betalningar, alla till den som betalade hyran. [Dela hushållsräkningarna med rumskamrater](page:use-case/housemates).
  - heading: Fester, bröllop och gruppgåvor
    body: Sex personer röstar om presenten, en köper den, och alla bidrar inte med lika mycket. En present för £150 delad efter exakta belopp ger fem betalningar till den som köpte den, £120 sammanlagt. [Dela kostnaderna för ett event](page:use-case/events-and-celebrations).
  - heading: Par
    body: Dela de tråkiga kostnaderna utan att göra dejtkvällen till en kvartalsgenomgång av ekonomin. Hyra delad 60/40 och matinköp delade lika landar i en enda betalning mellan er två.
  - heading: Se först hur det fungerar
    body: Alla exemplen ovan använder samma steg, från att skapa en grupp till att registrera betalningarna. [Så fungerar det](page:how-it-works) går igenom dem, och [prissättning](page:pricing) berättar vad det kostar, vilket är ingenting, utan annonser och utan dagliga gränser.
faq:
  heading: Frågor
  items:
    - q: Behöver alla i gruppen ett konto?
      a: Ja. Folk går med via en länk eller QR-kod och ett gratiskonto.
    - q: Kan Side Badger samla in pengarna?
      a: Nej. Ni betalar hur ni vill och registrerar sedan betalningen så att saldona stämmer.
    - q: Måste jag välja en sorts grupp?
      a: Nej. Användningsområdena är exempel, inte inställningar. Alla grupper har samma funktioner, så använd den kombination som passar.
