meta:
  title: "امسح إيصالاً لإضافة مصروف | Side Badger"
  description: "دع الغرير يقرأ الإيصال. يملأ الإجمالي والتاريخ والمكان لتراجعها، بلا رصيد مسح. وتقرأ خدمة الذكاء الاصطناعي من Google الصورة."
h1: "امسح الإيصال، وراجع التفاصيل، وقسّمه"
navLabel: "مسح الإيصالات"
lead: "دع الغرير يقرأ الإيصال، وراجع أنت واجبه. أضف صورة إلى مصروف جديد فيملأ Side Badger الإجمالي والتاريخ والمكان لتراجعها. ثم [تقسّمه](page:feature/split-expenses) كأي مصروف آخر. المسح مجاني، بلا رصيد مسح. وهو يملأ مصروفاً واحداً ولا يقسّم الفاتورة بحسب البنود. وتقرأ خدمة الذكاء الاصطناعي من Google صور الإيصالات."
cta:
  heading: "صوّر. راجع. قسّم."
  body: "أنشئ حساباً مجانياً، وابدأ مجموعة، وأضف مصروفاً مع صورة إيصال. شاهد ما يملؤه، وغيّر ما ليس صحيحاً، واحفظ حين تكون راضياً."
problem:
  heading: "لا أحد يريد كتابة إيصال في طابور التاكسي"
  body: "الرحلات والسهرات الكبيرة تأتي مع الورق. العشاء، والتاكسي، وجولة المشروبات التي صارت ست جولات. وكتابة كل منها في هاتف بأصابع باردة ومن خلفك طابور هي الطريقة التي تُنسى بها المصروفات. لذا يقرأ لك Side Badger الإيصال. يعدّ المسودة الأولى وتتولى أنت المراجعة. وهو يناسب [رحلات المجموعات](page:use-case/group-trips) و[المناسبات والاحتفالات](page:use-case/events-and-celebrations)، حيث تتراكم الإيصالات أسرع مما يريد أي أحد أن يتعامل معه."
workflow:
  heading: "من الصورة إلى المصروف في ثلاث خطوات"
  steps:
    - title: "أضف إيصالاً إلى مصروف جديد"
      body: "ابدأ مصروفاً جديداً واضغط **مسح الإيصال**، أو استخدم إجراء **مسح الإيصال** السريع في لوحة التحكم. التقط صورة أو اختر صورة موجودة عندك. ويعمل أيضاً **إضافة إيصال أو مرفق** في النموذج."
    - title: "دعه يقرأ الإيصال"
      body: "يعرض النموذج **جاري تحليل الإيصال...** بينما يقرأ الذكاء الاصطناعي في Side Badger الصورة. ثم يملأ ما وجده، مثل الوصف والإجمالي والعملة والتاريخ والوقت والمكان. وما كنت قد كتبته مسبقاً يُترك كما هو."
      shot: S09
      shotAlt: "نموذج المصروف الجديد يعرض «جاري تحليل الإيصال...»، ثم النموذج نفسه وقد امتلأت تفاصيله"
    - title: "راجعه، ثم قسّمه"
      body: "قارن النموذج بالورقة. صحّح ما ليس صحيحاً، وحدّد من دفع ومن شارك في التكلفة، واختر طريقة التقسيم، واحفظ. لا يوجد المصروف حتى تحفظ. ويشرح [تقسيم المصروفات](page:feature/split-expenses) كيفية التقسيم."
options:
  heading: "خيارات"
  items: []
sections:
  - heading: "ما الذي يملؤه"
    body: "أضف صورة إيصال إلى مصروف جديد وقد تُملأ هذه الحقول. أما من دفع ومن شارك في التكلفة وكيفية التقسيم فتبقى عليك."
    items:
      - "**الوصف** للمصروف."
      - "**الإجمالي**."
      - "**العملة**، إن كانت مجموعتك تسمح بذلك."
      - "**التاريخ** و**الوقت**."
      - "**المكان**."
      - "نسخة نصية من الإيصال في **الملاحظات**، لحالات يبهت فيها الإيصال الورقي أو يدخل الغسالة."
  - heading: "ما الذي تراجعه أنت"
    body: "كل شيء. اعتبر ما يملؤه مسودة. قارن الإجمالي بالورقة، ثم العملة والتاريخ والمكان. الصور الضبابية والورق المجعّد قد تخدع أي قارئ، ولا نعد بأنه يصيب في كل إيصال، فانظر قبل أن تحفظ. وإن كان شيء خاطئاً فاكتب فوقه. وإن كان الإيصال بالين وتسوّي المجموعة بالجنيه، فيشرح [العملات المتعددة](page:feature/multiple-currencies) ما يحدث بعد ذلك."
  - heading: "احتفظ بالإيصال مع المصروف"
    body: "ممسوحاً كان أو لا، يمكن أن يبقى الإيصال مع المصروف. أرفق صوراً أو ملفات PDF، ما يصل إلى ثلاثة لكل مصروف وما يصل إلى 10 MB لكل منها. يراها أعضاء المجموعة على المصروف. وتظهر الصور مصغّرة تُفتح في عارض، وتُفتح ملفات PDF كروابط. والصورة التي تمسحها تُرفق أيضاً، ما لم تزلها قبل أن تحفظ. وحين يسأل أحد كم كلّف ذلك العشاء فعلاً، فالدليل هناك."
  - heading: "إلى أين يذهب إيصالك"
    body: "تقرأ خدمة الذكاء الاصطناعي من Google صور الإيصالات. ولملء النموذج، تُقرأ الصورة بواسطة Google Vertex AI (Gemini) في المنطقة المتعددة للولايات المتحدة لدى Google. أضف صورة إلى مصروف جديد فتُقرأ. أما ملف PDF، أو صورة تُضاف إلى مصروف موجود بالفعل، فتُخزَّن دون أن تُقرأ. والإيصالات المرفقة يراها أعضاء المجموعة، فإن كان في إيصال ما لا تفضّل مشاركته، فتجاوز الصورة واكتب ذلك المصروف يدوياً."
limits:
  heading: "الحدود"
  items:
    - "الصور فقط. JPEG وPNG وWebP، وHEIC بعد تحويلها. يمكن إرفاق ملفات PDF بمصروف لكنها لا تُقرأ."
    - "المسح للمصروفات الجديدة فقط. في مصروف موجود يمكنك إرفاق إيصالات، لكن لا يُقرأ شيء."
    - "يملأ الحقول التي لم تلمسها فقط، والعملة فقط إن كانت مجموعتك تسمح بذلك."
    - "لا يقسّم بحسب البنود ولا يوزّع بنود الإيصال على الأشخاص. يملأ مصروفاً واحداً وتقسّمه أنت كالمعتاد."
    - "لا وعد بأن ما يملؤه صحيح، ولا بأن المسح سيعمل في كل مرة. راجع قبل أن تحفظ، وأضف المصروف يدوياً إن فشل المسح أو لم يكن متاحاً."
    - "يحتوي المصروف على ما يصل إلى ثلاثة مرفقات، كل منها بحجم يصل إلى 10 MB، بصيغة JPEG أو PNG أو WebP أو HEIC أو PDF."
    - "تُقرأ صور الإيصالات بواسطة Google Vertex AI (Gemini) في المنطقة المتعددة للولايات المتحدة لدى Google، ويرى أعضاء المجموعة الإيصالات المرفقة."
useCasesHeading: "حيث تتراكم الإيصالات"
faq:
  heading: "أسئلة"
  items:
    - q: "هل يستطيع تقسيم إيصال بحسب البنود؟"
      a: "لا. يملأ المصروف، بما فيه الإجمالي، وتقسّمه أنت بالتساوي أو بمبالغ دقيقة أو بنسبة مئوية. وفي فاتورة طلب فيها كل واحد شيئاً مختلفاً، أدخل ما على كل شخص بمبالغ دقيقة. ويتناول [تقسيم المصروفات](page:feature/split-expenses) التفاصيل."
    - q: "هل يستطيع قراءة ملف PDF؟"
      a: "لا. يمكنك إرفاق ملف PDF بمصروف ليسافر مع الأرقام، لكن الصور فقط هي التي تُقرأ."
    - q: "هل هناك حد لعدد عمليات المسح؟"
      a: "لا يوجد رصيد مسح ينفد، والمسح مجاني. أما الملفات ففيها حدود، وهي ما يصل إلى ثلاثة مرفقات لكل مصروف و10 MB لكل مرفق. وفي [ما تشمله الخدمة المجانية](page:pricing) بقية التفاصيل."
    - q: "من يستطيع رؤية إيصالي؟"
      a: "يستطيع أعضاء المجموعة رؤية الإيصالات المرفقة بالمصروف. وتقرأ خدمة الذكاء الاصطناعي من Google صور الإيصالات أيضاً، وبهذا يُملأ النموذج."
    - q: "هل أستطيع مسح إيصال لمصروف أضفته بالفعل؟"
      a: "لا، المسح للمصروفات الجديدة. ويمكنك مع ذلك إرفاق إيصال بمصروف موجود، فيُخزَّن دون أن يُقرأ."
    - q: "ماذا لو ملأ شيئاً خاطئاً؟"
      a: "اكتب فوقه. تبقى كل الحقول قابلة للتعديل إلى أن تحفظ، وعليك على أي حال أن تراجعها كلها. وإن فشل المسح أو لم يكن متاحاً، فأضف المصروف يدوياً كالمعتاد."
