meta:
  title: "Μοιράστε τα έξοδα με σύντροφο που βγάζει περισσότερα | Side Badger"
  description: "Το 50/50 γίνεται άβολο όταν ο ένας βγάζει πολύ περισσότερα. Μοιράστε τους κοινούς λογαριασμούς ανά εισόδημα, με τις πράξεις για δύο και χωρίς υπολογιστικό φύλλο."
h1: "Πώς να μοιράσετε τους λογαριασμούς με σύντροφο που βγάζει περισσότερα"
navLabel: "Σύντροφος που βγάζει περισσότερα"
lead: "Αθροίστε τις καθαρές αποδοχές σας, υπολογίστε το μερίδιο του καθενός στο σύνολο και στρογγυλέψτε σε ακέραια ποσοστά. Η Μάγια παίρνει καθαρά 2.800 £ και ο Τζον 1.700 £, οπότε μοιράζουν τους κοινούς λογαριασμούς 62/38. Βάλτε αυτά τα ποσοστά σε ένα κοινό έξοδο στο Side Badger και μετά αντιγράφετέ το κάθε φορά που ξαναέρχεται ο ίδιος λογαριασμός."
cta:
  heading: "Κάντε την πράξη μία φορά"
  body: "Δημιουργήστε έναν δωρεάν λογαριασμό, φτιάξτε μια ομάδα για τους δυο σας και καταχωρίστε το ενοίκιο με τα ποσοστά σας. Το ενοίκιο του επόμενου μήνα είναι ένα αντίγραφο. Θέλετε πρώτα μια ξενάγηση; Δείτε [πώς λειτουργεί](page:how-it-works) ή [τι καλύπτει το δωρεάν](page:pricing)."
sections:
  - heading: "Δύο μισθοί, ένα διαμέρισμα, μία ευγενική σιωπή"
    body: "Η Μάγια και ο Τζον ζουν μαζί. Η Μάγια παίρνει καθαρά 2.800 £ τον μήνα και ο Τζον 1.700 £. Για δύο χρόνια μοίραζαν τα πάντα 50/50, επειδή ήταν απλό και κανείς δεν ήθελε να είναι εκείνος που θα το φέρει στην κουβέντα. Μετά ο Τζον κοίταξε το ενοίκιο μόνο του. Τα μισά από 1.400 £ είναι 700 £, που είναι το ένα τέταρτο των καθαρών αποδοχών της Μάγιας και το 41% των δικών του. Κανείς δεν είχε φερθεί άδικα. Κανείς δεν είχε κάνει την πράξη. Πολλά [ζευγάρια](page:use-case/couples) φτάνουν εδώ κάποια στιγμή. Με ένα ντελίβερι στο τραπέζι συμφώνησαν ότι οι κοινοί λογαριασμοί πρέπει να παίρνουν παρόμοιο κομμάτι από τον μισθό του καθενός."
  - heading: "Η μέθοδος, με τις πράξεις στο τραπέζι"
    body: "Τέσσερα βήματα, μια αριθμομηχανή και μια κουβέντα που θα κάνατε ούτως ή άλλως."
    items:
      - "**Συμφωνήστε τι μετράει ως μισθός.** Η Μάγια και ο Τζον χρησιμοποιούν τις καθαρές αποδοχές, τα χρήματα που μπαίνουν στην τράπεζα κάθε μήνα. Μαζί είναι 2.800 £ + 1.700 £ = 4.500 £."
      - "**Υπολογίστε το μερίδιο του καθενός.** Της Μάγιας είναι 2.800 ÷ 4.500, δηλαδή 62,2%. Του Τζον είναι 1.700 ÷ 4.500, δηλαδή 37,8%."
      - "**Στρογγυλέψτε σε ακέραια ποσοστά.** Το 62,2% γίνεται 62 και το 37,8% γίνεται 38. Με δύο άτομα, στρογγυλέψτε το ένα νούμερο και αφαιρέστε το από το 100 για να βρείτε το άλλο, και θα κάνουν πάντα συνολικά 100."
      - "**Ελέγξτε τι σημαίνει.** Στο ενοίκιο των 1.400 £, η Μάγια πληρώνει 868 £ (62%) και ο Τζον 532 £ (38%). Αυτό είναι περίπου το 31% των καθαρών αποδοχών του καθενός. Αν έδινε ο καθένας τα μισά, θα έπαιρνε το 25% των αποδοχών της Μάγιας και το 41% των αποδοχών του Τζον."
  - heading: "Διαβάζοντας τον μήνα"
    body: "Η Μάγια πλήρωσε το ενοίκιο των 1.400 £ και ο Τζον τα υπόλοιπα 216 £. Το μερίδιο της Μάγιας για τον μήνα είναι 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £ και εκείνη πλήρωσε 1.400 £, οπότε της οφείλονται 402,40 £. Το μερίδιο του Τζον είναι 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £ και εκείνος πλήρωσε 216 £, οπότε χρωστά 402,40 £. Το Side Badger προτείνει μία πληρωμή, από τον Τζον στη Μάγια, 402,40 £. Μόλις γίνει, την καταγράφετε στην [εκκαθάριση](page:feature/settle-up). Με 50/50, τον ίδιο μήνα ο Τζον θα πλήρωνε στη Μάγια 592,00 £."
  - heading: "Στήστε το στο Side Badger"
    body: "Δέκα λεπτά, που τα περισσότερα φεύγουν στα ποσοστά."
    items:
      - "**Φτιάξτε την ομάδα.** Στον πίνακα ελέγχου επιλέξτε **Δημιουργία Ομάδας** και δώστε της το όνομα του διαμερίσματος. Επιλέξτε **Πρόσκληση Άλλων** και στείλτε στον Τζον τον σύνδεσμο ή τον κωδικό QR. Εκείνος συνδέεται ή δημιουργεί έναν δωρεάν λογαριασμό και διαλέγει το όνομα που θέλει να εμφανίζεται σε αυτή την ομάδα. Μόνο τα μέλη βλέπουν μια ομάδα, οπότε αυτή είναι μόνο για εσάς τους δύο."
      - "**Προσθέστε το ενοίκιο.** Επιλέξτε **Προσθήκη Εξόδου**. Συμπληρώστε την περιγραφή και το ποσό και, στο **Ποιος πλήρωσε;**, διαλέξτε τη Μάγια. Κρατήστε και τα δύο άτομα στο **Μοιράζεται μεταξύ** και μετά, στο **Τρόπος διαχωρισμού**, επιλέξτε **Ποσοστό** και πληκτρολογήστε 62 και 38. Η φόρμα το επισημαίνει αν τα ποσοστά δεν κάνουν συνολικά 100. Επιλέξτε **Αποθήκευση Εξόδου**."
      - "**Προσθέστε τους υπόλοιπους λογαριασμούς.** Το ρεύμα και το ίντερνετ μπαίνουν με τον ίδιο τρόπο, με πληρωτή τον Τζον και τα ίδια 62 και 38. Το ντελίβερι είναι ξεχωριστό έξοδο, με την επιλογή **Τρόπος διαχωρισμού** στο **Εξίσου**."
      - "**Αντιγράψτε το τον επόμενο μήνα.** Ανοίξτε το ενοίκιο του προηγούμενου μήνα και επιλέξτε **Αντιγραφή εξόδου**. Το αντίγραφο κρατά τον πληρωτή, το ποσό και τον διαχωρισμό και παίρνει τη σημερινή ημερομηνία. Αλλάξτε το ποσό αν άλλαξε το ενοίκιο και μετά επιλέξτε **Δημιουργία Αντιγράφου**. Ο λογαριασμός ρεύματος δουλεύει με τον ίδιο τρόπο."
      - "**Δείτε ποιος χρωστά σε ποιον.** Το δείχνει η ενότητα **Υπόλοιπα**, που προτείνει και μια σύντομη λίστα πληρωμών. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή στην **Τακτοποίηση**."
  - heading: "50/50, ανάλογα με το εισόδημα ή λογαριασμό προς λογαριασμό"
    body: "Δεν υπάρχει σωστή απάντηση, μόνο αυτή με την οποία μπορείτε να ζήσετε και οι δύο. Τρεις συνηθισμένες."
    items:
      - "**Τα μισά ο καθένας για όλα.** Η πιο εύκολη στην τήρηση και ταιριάζει σε ζευγάρια με κοντινούς μισθούς."
      - "**Ανάλογα με το εισόδημα για ό,τι είναι κοινό.** Αυτό που κάνουν η Μάγια και ο Τζον. Μία κουβέντα, ένα ζευγάρι ποσοστών."
      - "**Λογαριασμό προς λογαριασμό.** Ενοίκιο και λογαριασμοί ανάλογα με το εισόδημα, διακοπές και κεράσματα 50/50 ή όπως αλλιώς συμφωνήσετε, και κάθε λογαριασμός παίρνει τον κανόνα που του ταιριάζει."
  - heading: "Συμφωνήστε τι μετράει ως κοινό"
    body: "Οι καβγάδες συνήθως αφορούν τη λίστα και όχι τα ποσοστά. Το ενοίκιο, το ρεύμα, το ίντερνετ, τα εβδομαδιαία ψώνια και ο καναπές μετράνε ως κοινά στα περισσότερα σπίτια. Η συνδρομή της Μάγιας στο γυμναστήριο και η συνδρομή του Τζον για το ποδόσφαιρο ίσως όχι. Συμφωνήστε τη λίστα μία φορά, γράψτε την και βάλτε στην ομάδα μόνο τα κοινά κόστη."
  - heading: "Το ντελίβερι μένει 50/50, επίτηδες"
    body: "Τα κεράσματα είναι μικρά και προαιρετικά και κανείς δεν πρέπει να χρειάζεται αριθμομηχανή για να παραγγείλει ντάμπλινγκς. Στο Side Badger το ντελίβερι είναι απλώς ένα ακόμα έξοδο. Ο Τζον πληρώνει 36 £, η επιλογή **Τρόπος διαχωρισμού** μένει στο **Εξίσου** και ο καθένας τους χρωστά 18 £."
  - heading: "Όταν αλλάζει ο μισθός κάποιου"
    body: "Μια αύξηση, μια νέα δουλειά ή ένα διάστημα εκτός εργασίας αλλάζει την πράξη. Υπολογίστε τα νέα ποσοστά με τον ίδιο τρόπο και χρησιμοποιήστε τα από το επόμενο έξοδο. Τα προηγούμενα έξοδα μένουν όπως ήταν. Αντιγράψτε το ενοίκιο του προηγούμενου μήνα, αλλάξτε τα ποσοστά και μετά επιλέξτε **Δημιουργία Αντιγράφου**. Για να διορθώσετε ένα που έχει ήδη μπει, επεξεργαστείτε το αν το επιτρέπουν τα δικαιώματα της ομάδας και πείτε πρώτα στον σύντροφό σας, επειδή αλλάζουν τα υπόλοιπα. Η προηγούμενη έκδοση διατηρείται. Συμφωνήστε πότε θα ξαναϋπολογίζετε, για παράδειγμα μία φορά τον χρόνο, και τακτοποιηθείτε πριν αλλάξετε, ώστε ο παλιός διαχωρισμός να κλείσει με καθαρό λογαριασμό."
  - heading: "Τι δεν κάνει εδώ το Side Badger"
    items:
      - "Δεν ρωτά ποτέ τι βγάζει κάποιος και δεν υπολογίζει τα ποσοστά. Πληκτρολογείτε τα νούμερα που συμφωνήσατε."
      - "Δεν μπορεί να ορίσει προεπιλεγμένο διαχωρισμό για όλη την ομάδα. Τα ποσοστά μπαίνουν σε κάθε έξοδο, οπότε αντιγράψτε ένα που τα έχει ήδη."
      - "Δεν έχει επαναλαμβανόμενους λογαριασμούς, οπότε αντιγράφετε κάθε φορά το ενοίκιο του προηγούμενου μήνα."
      - "Δεν μετακινεί ποτέ χρήματα. Πληρώνετε ο ένας τον άλλον όπως θέλετε και το καταγράφετε."
exampleAfter: 2
example:
  heading: "Ένας μήνας στο διαμέρισμα της Μάγιας και του Τζον"
  currency: GBP
  people:
    - id: maya
      name: Μάγια
    - id: jon
      name: Τζον
  expenses:
    - label: "το ενοίκιο"
      payer: maya
      amount: 1400
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "το ρεύμα και το ίντερνετ"
      payer: jon
      amount: 180
      split:
        method: percent
        shares:
          maya: 62
          jon: 38
    - label: "το ντελίβερι"
      payer: jon
      amount: 36
      split:
        method: equal
faq:
  heading: "Ερωτήσεις"
  items:
    - q: "Να χρησιμοποιήσουμε μεικτές ή καθαρές αποδοχές;"
      a: "Αποφασίζει η ομάδα. Οι καθαρές αποδοχές είναι συνηθισμένη επιλογή, επειδή είναι τα χρήματα που πραγματικά έχετε να ξοδέψετε. Οι μεικτές αποδοχές αγνοούν ότι ο φόρος, οι εισφορές για τη σύνταξη και οι αποπληρωμές δανείων αφαιρούν διαφορετικά ποσά από διαφορετικούς μισθούς. Όποιο κι αν διαλέξετε, χρησιμοποιήστε το ίδιο μέτρο και για τους δύο."
    - q: "Βλέπει το Side Badger τα εισοδήματά μας;"
      a: "Όχι. Καταχωρίζετε μόνο ποσοστά, ποτέ μισθούς. Τα ποσοστά είναι ορατά στα μέλη της ομάδας και για ένα ζευγάρι αυτά είναι οι δυο σας."
    - q: "Μπορούμε να ορίσουμε το 62/38 μία φορά για όλα;"
      a: "Ο διαχωρισμός ορίζεται ανά έξοδο, όχι ανά ομάδα. Αντιγράψτε ένα έξοδο που έχει ήδη 62 και 38 και αλλάξτε ό,τι διαφέρει. Ο [διαχωρισμός εξόδων](page:feature/split-expenses) καλύπτει τις υπόλοιπες επιλογές."
