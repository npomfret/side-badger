meta:
  title: 与伴侣分账，五五分或按收入分 | Side Badger
  description: 分担日常开销，又不让约会之夜变成季度财务审查。五五分、按收入分或逐笔分，看清谁欠谁。免费。
h1: 情侣公平分担开销
navLabel: 情侣
lead: 分担日常开销，又不让约会之夜变成季度财务审查。Side Badger 为**情侣**持续记下房租、账单和采购，你们共享一个家、一张沙发，以及对宽带到底是谁付的这件事的模糊记忆。五五分、按收入分或逐笔分，都能看清谁欠谁。
cta:
  heading: 为两个人建一个群组
  body: 创建账户，建一个群组，把邀请链接发给你的伴侣。今晚的外卖就可以是第一笔支出。
scenario:
  heading: 公平不一定是五五开
  body: Sam 和 Alex 同住一个家。Sam 赚得多，所以他们商定 Sam 承担 60% 的房租，Alex 承担 40%。Sam 付房东，Alex 去采购，两人都相当确定最后会扯平。“相当确定”正是手机里的一条备忘录变成长期分歧的方式。所以为你们俩建一个群组，选一个你希望伴侣看到的名字，把邀请链接或二维码发给对方。每笔开销发生时就记下来，说明谁付了钱、怎么分，让群组替你们记账。每次假期另建一个群组（见[团体旅行](page:use-case/group-trips)），这样机票就不会混进杂货里。
sections:
  - heading: 五五分、按收入分，或逐笔分
    body: 不存在人人都认为公平的分法，只有你们俩都同意的那一种，最好是在第一张账单之前，而不是第一声叹气之后。常见的有这三种。
    items:
      - "**五五分。** 选择**平分**，你们各欠一半。当你们的收入差不多时，它适合共同开销，而且完全不用算术。"
      - "**按收入分。** 如果你们中有一人赚得更多，就按每个人占总收入的比例来分。先商定什么算收入（常见的选择是税后收入），把两人的加起来，再用你的除以总数。如果一人到手三份，另一人到手两份，那就是 3 ÷ (3 + 2) = 60%，所以一人承担 60%，另一人承担 40%。四舍五入到整数百分比，输入到**百分比**下，加起来必须是 100。没有地方输入你的收入，所以你只需要输入百分比。"
      - "**逐笔分。** 每笔支出都有自己的分法，所以可以混着用：房租按收入分，杂货五五分，共同送的礼物，如果你们各自选了出多少，就按**确切金额**。"
      - "**收入变动时，**从下一笔支出起使用新的百分比。之前的支出保持录入时的分法。想看用真实工资单算一遍的例子，请读[收入更高的伴侣怎么分账](page:guide/how-to-split-bills-with-a-partner-who-earns-more)。"
  - heading: 每月核算
    body: 每月一次，或者数字开始让人心痒时，打开群组查看**余额**。你们两个人，每种货币永远只有一笔付款，从欠钱的人付给被欠的人。以 Sam 和 Alex 的这个月为例。Sam 付了 £1,500 的房租，Alex 的 40% 是 £600。Alex 付了 £90 的杂货，平分，所以 Sam 的一半是 £45。Side Badger 把两者抵消，£600 减去 £45，Alex 付给 Sam £555。想怎么付都行，银行转账、现金，或者欠个人情，然后在**结算**下记录下来，余额就回到零。没有定期账单，所以复制上个月的房租，改一下日期，接着往下走。Side Badger 不转移资金，也不发送提醒，所以催一催仍然是你的事。
  - heading: 只有你们两个人
    body: 两个人的群组有两位成员，只有群组的成员才能看到它。你的伴侣通过邀请链接或二维码加入。链接的有效期可以从 15 分钟到 5 天，选个最短、够伴侣用的就好。生成新链接不会让旧链接失效，所以别把它们留在有其他人的聊天里。任何拿到有效链接的人都可以加入，所以如果想万无一失，就开启审批，由管理员放行每个人。你的伴侣需要自己的账户，账户是免费的。
exampleAfter: 2
