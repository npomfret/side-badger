sections:
  - heading: "39 భాషలు, మరింత మంది కోసం రూపొందించింది"
    body: "Side Badgerను 39 భాషలలో వాడండి, కుడి నుండి ఎడమకు రాసే అరబిక్, పర్షియన్, ఉర్దూతో సహా. గ్రూప్‌లో ప్రతి ఒక్కరూ తమ భాషను ఎంచుకోవచ్చు, కాబట్టి గ్రూప్ పేజీ ఒకరికి అరబిక్‌లో, మరొకరికి ఇంగ్లీషులో ఉండవచ్చు. కీబోర్డ్, స్క్రీన్-రీడర్ వాడేవాళ్లను దృష్టిలో ఉంచుకుని కూడా రూపొందించారు, సభ్యుల రంగులతో పాటు నమూనాలూ ఉంటాయి, కాబట్టి ఆకుపచ్చకు, ఎరుపుకు తేడా చెప్పాల్సిన పని లేదు."
faq:
  heading: "ప్రశ్నలు"
  items:
    - q: "అందరికీ ఖాతా కావాలా?"
      a: "అవును, ఉచిత ఖాతా. ప్రతి ఒక్కరూ ఏదైనా జోడించే ముందు తమ ఇమెయిల్‌ను ధృవీకరిస్తారు."
    - q: "యాప్ ఉందా?"
      a: "ఇది బ్రౌజర్‌లో నడుస్తుంది, మీ హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడిస్తే యాప్‌లా తెరుచుకుంటుంది. యాప్-స్టోర్ వెర్షన్ లేదు, ఆఫ్‌లైన్ మోడ్ లేదు."
    - q: "Side Badger డబ్బు కదిలిస్తుందా?"
      a: "లేదు. ఇది లెక్క ఉంచుతుంది, పేమెంట్లను సూచిస్తుంది, మీరు మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకుంటారు. తర్వాత పేమెంట్‌ను రికార్డ్ చేస్తారు. [లెక్క తేల్చడం](page:feature/settle-up) చూడండి."
    - q: "బాకీ ఉండగా ఎవరైనా వెళ్లిపోవచ్చా?"
      a: "లేదు. ఎవరికైనా ఇవ్వాల్సినవి లేదా రావాల్సినవి మిగిలి ఉన్నంత వరకు వాళ్లు గ్రూప్ వదలలేరు, కాబట్టి ముందు లెక్క తేల్చుకోవాలి."
    - q: "ఒక గ్రూప్‌లో ఎంత మంది చేరవచ్చు?"
      a: "ఒక గ్రూప్‌లో 50 మంది వరకు. వాళ్లను లింక్ లేదా QR కోడ్‌తో ఆహ్వానించండి, అడ్మిన్ ప్రతి ఒక్కరినీ లోపలికి రానివ్వాలంటే అనుమతి ఆన్ చేయండి."
    - q: "ఒకటి కంటే ఎక్కువ కరెన్సీలు ఉన్న ట్రిప్‌ల సంగతి?"
      a: "బ్యాలెన్స్‌లు ప్రతి కరెన్సీకి విడిగా ఉంచబడతాయి. [అనేక కరెన్సీలు](page:feature/multiple-currencies) చూడండి."
