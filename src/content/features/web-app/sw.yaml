meta:
  title: "Programu ya kugawanya bili bila kupakua | Side Badger"
  description: "Simu yako imejaa, tunaelewa. Side Badger inafanya kazi kwenye kivinjari, bila duka la programu wala kupakua. Iongeze kwenye skrini ya kwanza na inafunguka kama programu."
h1: "Hakuna duka la programu. Hakuna kupakua. Bado inahisi kama programu"
navLabel: "Programu ya wavuti"
lead: "Side Badger inaishi kwenye kivinjari chako. Hakuna duka la programu la kutafuta wala kitu cha kupakua kwanza. Ingia kwenye simu au kompyuta, gawanya gharama mtandaoni na kikundi chako, na uiongeze kwenye skrini ya kwanza au dock ukiitaka kwa mguso mmoja."
cta:
  heading: "Ifungue. Ingia. Anzisha kikundi."
  body: "Fungua akaunti, anzisha kikundi na ongeza gharama ya kwanza, vyote kutoka kwenye kivinjari ulichokifungua tayari. Unataka ziara kwanza? Tazama [jinsi inavyofanya kazi](page:how-it-works), au angalia [kile ambacho bure kinajumuisha](page:pricing)."
problem:
  heading: "Simu yako imejaa. Tunaelewa."
  body: "Mahali fulani ndani yake kuna picha elfu nne za machweo yale yale na onyo la nafasi ambalo umekuwa ukilipuuza tangu masika. Kitu cha mwisho inachohitaji ni programu nyingine, ili tu kugawanya chakula kimoja cha jioni. Kwa hivyo Side Badger ni programu ya wavuti. Inafanya kazi kwenye kivinjari cha kisasa kwenye simu au kompyuta. Kwenye simu inatumia muundo wa simu, ukurasa wa kikundi ukigawanywa kwenye vichupo na vidhibiti rafiki kwa mguso. Baadhi ya nyongeza, kama kuiongeza kwenye skrini ya kwanza, zinategemea kivinjari chako, na tunasema wapi."
workflow:
  heading: "Kutoka kichupo cha kivinjari hadi skrini ya kwanza kwa hatua tatu"
  steps:
    - title: "Ifungue na uingie"
      body: "Nenda kwa Side Badger kwenye kivinjari chako na uingie. Unachohitaji ni anwani ya barua pepe na nenosiri, na unathibitisha barua pepe kabla ya kuongeza chochote. Kila mtu kwenye kikundi anahitaji akaunti, kwa hivyo watu unaowaalika watafanya vivyo hivyo."
    - title: "Iongeze kwenye skrini ya kwanza au dock"
      body: "Ukishaingia, programu inajitolea kujisakinisha. Unapata kitufe cha **Sakinisha** pale kivinjari chako kinaporuhusu, na **Nionyeshe jinsi** pale kisipoporuhusu. Umekosa, au ulikataa? **Mipangilio** ina msaada huo huo chini ya **Ongeza kwenye Skrini ya Kwanza au Dock**. Kwenye iPhone au iPad, Mipangilio inaonyesha hatua za iPhone kwanza na kuweka vifaa vingine chini ya **Vifaa vingine**. Vyovyote vile, programu kisha inafunguka kwenye dirisha lake yenyewe."
      shot: S20
      shotAlt: "Sehemu ya Ongeza kwenye Skrini ya Kwanza au Dock ya Mipangilio, yenye hatua za kuongeza programu kwenye kifaa"
    - title: "Washa arifa, ukizitaka"
      body: "Arifa zimezimwa hadi uziwashe, na kila kifaa kinawashwa kivyake. Tumia kitufe cha **Washa** ambacho kengele ya arifa inatoa, au swichi ya **Arifa za push** katika **Mipangilio**. Kwenye iPhone au iPad, fungua programu kutoka Skrini ya Kwanza kwanza. Hapo ndipo mahali pekee arifa zinapofanya kazi."
      shot: S19
      shotAlt: "Orodha ya arifa iliyofunguka, ikiorodhesha shughuli za hivi karibuni kwenye kikundi"
options:
  heading: "Jinsi ya kuiongeza, kifaa kwa kifaa"
  items:
    - title: "iPhone na iPad"
      body: "Gusa kitufe cha Shiriki, mraba wenye mshale unaoelekea juu. Usipokiona, gusa nukta tatu (•••) kwanza, kisha Shiriki. Sogeza chini na uguse **Ongeza kwenye Skrini ya Kwanza**. Acha **Fungua kama Programu ya Wavuti** ikiwa imewashwa, kisha uguse **Ongeza**. Kiungo kikifunguka ndani ya programu nyingine, fungua ukurasa kwenye Safari kwanza, kwa sababu kivinjari hicho cha ndani hakiwezi kuiongeza."
    - title: "Android"
      body: "Fungua menyu ya kivinjari na uchague **Ongeza kwenye Skrini ya kwanza** au **Sakinisha programu**."
    - title: "Chrome au Edge kwenye kompyuta"
      body: "Fungua menyu ya kivinjari na uchague chaguo la kusakinisha tovuti hii kama programu. Kisha inapata dirisha lake na ikoni yake."
    - title: "Safari kwenye Mac"
      body: "Chagua **Faili**, kisha **Ongeza kwenye Dock**."
sections:
  - heading: "Arifa, tu ukiziomba"
    body: "Arifa za push ni za hiari. Ziwashe na unapata arifa kukiwa na shughuli mpya kwenye vikundi vyako, kama mtu kuongeza gharama, kuacha maoni au kurekodi malipo. Zinawashwa kifaa kimoja kwa wakati, kutoka kwenye kengele ya arifa au kutoka **Mipangilio**, na unaweza kuzizima tena hapo. Zinahitaji kivinjari kinachozitumia na ruhusa yako. Kama kivinjari chako kimezizuia kwa tovuti hii, ziruhusu kwenye mipangilio ya kivinjari kwanza. Kwenye iPhone au iPad zinafanya kazi tu kutoka kwenye programu iliyoongezwa kwenye Skrini ya Kwanza, si kutoka kwenye kichupo cha kivinjari. Kuwasilishwa hakuhakikishwi, kwa hivyo chukulia arifa kama kidokezo, si ahadi. Kuhusu kinachoonekana kwenye mlisho, tazama [pangeni pamoja](page:feature/plan-together)."
  - heading: "Masasisho ya moja kwa moja, bila kitufe cha kuonyesha upya"
    body: "Ongeza gharama na kila mtu anaiona mara moja, pamoja na nini kilibadilika na nani alibadilisha. Kila kikundi kinahifadhi historia ya shughuli, na kengele ya arifa inaonyesha shughuli katika vikundi vyako vyote. Hakuna anayehitaji kuuliza kama umeona kile ulichoongeza tu. Kiko kwenye skrini yake."
  - heading: "Lugha 39, kila mtu na yake"
    body: "Tumia Side Badger katika lugha 39, ikiwemo Kiarabu, Kiajemi na Kiurdu zinazoandikwa kutoka kulia kwenda kushoto. Kila mtu kwenye kikundi anachagua yake mwenyewe, kwa hivyo ukurasa huo huo wa kikundi unaweza kuwa kwa Kiarabu kwa mtu mmoja na Kiingereza kwa anayefuata. Kitu pekee ambacho kikundi kinapaswa kukubaliana ni nambari."
  - heading: "Imejengwa kwa zaidi ya aina moja ya mtumiaji"
    body: "Side Badger imejengwa ikizingatia watumiaji wa kibodi na visoma skrini. Rangi za wanachama huja na michoro, ili usihitaji kutofautisha kijani na nyekundu."
    items:
      - "Viungo vya kuruka, ili watumiaji wa kibodi waende moja kwa moja kwenye maudhui."
      - "Madirisha husimamia mwelekeo wa kibodi."
      - "Vidhibiti vina lebo, kwa visoma skrini."
      - "Muundo unageuka kwa lugha zinazoandikwa kutoka kulia kwenda kushoto."
limits:
  heading: "Programu ya wavuti isichofanya"
  items:
    - "Hakuna matumizi bila mtandao. Side Badger inahitaji muunganisho, kwa hivyo haitafungua kikundi chako kwenye ndege isiyo na wifi."
    - "Hakuna programu ya duka la programu wala programu asilia ya iPhone au Android. Side Badger ni programu ya wavuti, na kuiongeza kwenye skrini ya kwanza au dock ndiyo njia ya kupata toleo linalofanana na programu."
    - "Kuiongeza kwenye skrini ya kwanza au dock kunategemea kivinjari chako. Majina ya menyu hutofautiana kati ya vivinjari na matoleo, na baadhi ya vivinjari havitoi hilo."
    - "Arifa za push ni za hiari kwa kila kifaa, na zinahitaji kivinjari kinachozitumia na ruhusa yako. Kwenye iPhone au iPad zinafanya kazi tu kutoka kwenye programu iliyoongezwa kwenye Skrini ya Kwanza. Kuwasilishwa hakuhakikishwi."
    - "Hakuna arifa za barua pepe wala ujumbe mfupi na hakuna vikumbusho vya malipo. Shughuli mpya inaonekana ndani ya programu, na kama arifa za push ukiziwasha. Kufuatilia malipo bado ni kazi yako."
    - "Shughuli huhifadhiwa kwa siku 90."
    - "Unaingia kwa anwani ya barua pepe na nenosiri. Hakuna kuingia kwa Google au Apple, na lazima uwe na umri wa miaka 18 au zaidi."
    - "Hatudai kwamba Side Badger inapatikana kikamilifu kwa kila mtu, wala kwamba inakidhi kiwango rasmi cha ufikivu. Kitu kikikukwamisha, tuambie ukiwa ndani ya programu na utaona jibu letu huko."
useCasesHeading: "Mahali ambapo kutohitaji programu kunasaidia"
faq:
  heading: "Maswali"
  items:
    - q: "Je, kuna programu ya Side Badger kwenye duka la programu?"
      a: "Hapana. Side Badger ni programu ya wavuti. Unaifungua kwenye kivinjari chako, na unaweza kuiongeza kwenye skrini ya kwanza au dock ili ifunguke kama programu. Hakuna cha kupakua kutoka duka la programu."
    - q: "Je, naweza kugawanya bili bila kupakua programu?"
      a: "Ndiyo. Fungua Side Badger kwenye kivinjari kwenye simu au kompyuta yako, ingia na uanzishe kikundi. Kuiongeza kwenye skrini ya kwanza au dock ni hiari."
    - q: "Je, inafanya kazi bila mtandao?"
      a: "Hapana. Side Badger inahitaji muunganisho, hata ikiwa imeongezwa kwenye skrini yako ya kwanza au dock."
    - q: "Kwa nini sipati arifa kwenye iPhone yangu?"
      a: "Kwenye iPhone au iPad, arifa zinafanya kazi tu kutoka kwenye programu iliyoongezwa kwenye Skrini ya Kwanza, si kutoka kwenye kichupo cha kivinjari. Iongeze, ifungue kutoka kwenye ikoni ya Skrini ya Kwanza, kisha washa arifa katika **Mipangilio**. Kuwasilishwa hakuhakikishwi, kwa hivyo ikipotea moja, historia ya shughuli ya kikundi bado inaonyesha kilichoongezwa."
    - q: "Je, lazima niwashe arifa?"
      a: "Hapana. Zimezimwa hadi uziwashe, kifaa kimoja kwa wakati. Bila hizo, shughuli mpya bado inaonekana ndani ya programu, na kila mtu anaona badiliko mara moja akiwa ameifungua."
    - q: "Je, kila mtu kwenye kikundi anahitaji akaunti?"
      a: "Ndiyo. Unachohitaji ni anwani ya barua pepe na nenosiri, na unathibitisha barua pepe kabla ya kuongeza chochote. Kila anayejiunga na kikundi anafanya hivyo hivyo, kwenye simu au kompyuta yoyote apendayo."
