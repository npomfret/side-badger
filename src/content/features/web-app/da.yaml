meta:
  title: Webapp til at dele regninger, uden download | Side Badger
  description: Din telefon er fuld, vi forstår det. Side Badger kører i din browser, uden app store og uden download. Føj den til din hjemmeskærm, så åbner den som en app.
h1: Ingen app store. Ingen download. Føles stadig som en app
navLabel: Webapp
lead: Side Badger bor i din browser. Der er ingen app store at lede i og intet at hente først. Log ind på en telefon eller en computer, del udgifter online med din gruppe, og føj den til din hjemmeskærm eller dit Dock, når du vil have den ét tryk væk.
cta:
  heading: Åbn den. Log ind. Start en gruppe.
  body: Opret en konto, start en gruppe, og tilføj den første udgift, alt sammen fra den browser, du allerede har åben. Vil du have rundvisningen først? Se [sådan virker det](page:how-it-works), eller tjek [hvad gratis dækker](page:pricing).
problem:
  heading: Din telefon er fuld. Vi forstår det.
  body: Et sted derinde ligger fire tusind billeder af den samme solnedgang og en advarsel om lagerplads, du har swipet væk siden foråret. Det sidste, den har brug for, er endnu en app, bare for at dele én middag. Så Side Badger er en webapp. Den kører i en moderne browser på en telefon eller en computer. På en telefon bruger den mobillayouts, hvor gruppesiden er delt i faner, og med kontroller, der er lette at trykke på. Nogle ekstra ting, f.eks. at føje den til din hjemmeskærm, afhænger af din browser, og vi siger, hvor.
workflow:
  heading: Fra browserfane til hjemmeskærm i tre trin
  steps:
    - title: Åbn den, og log ind
      body: Gå til Side Badger i din browser, og log ind. Du skal bare bruge en e-mailadresse og en adgangskode, og du bekræfter e-mailadressen, før du kan tilføje noget. Alle i gruppen har brug for en konto, så de, du inviterer, gør det samme.
    - title: Føj den til din hjemmeskærm eller dit Dock
      body: Når du er logget ind, tilbyder appen at installere sig selv. Du får en knap, **Installér**, hvor din browser tillader det, og **Vis mig hvordan**, hvor den ikke gør. Overså du den, eller sagde du nej? **Indstillinger** har den samme hjælp under **Føj til hjemmeskærm eller Dock**. På en iPhone eller iPad viser Indstillinger iPhone-trinene først og gemmer de andre enheder under **Andre enheder**. Uanset hvad åbner appen derefter i et vindue for sig selv.
      shot: S20
      shotAlt: Afsnittet Føj til hjemmeskærm eller Dock i Indstillinger med trinene til at føje appen til en enhed
    - title: Slå notifikationer til, hvis du vil have dem
      body: Notifikationer er slået fra, til du slår dem til, og hver enhed slås til for sig. Brug knappen **Slå til**, som notifikationsklokken tilbyder, eller kontakten **Push-notifikationer** i **Indstillinger**. På en iPhone eller iPad skal du først åbne appen fra hjemmeskærmen. Det er det eneste sted, notifikationer virker dér.
      shot: S19
      shotAlt: Notifikationslisten åben med seneste aktivitet i gruppen
options:
  heading: Sådan føjer du den til, enhed for enhed
  items:
    - title: iPhone og iPad
      body: Tryk på Del-knappen, en firkant med en pil, der peger opad. Hvis du ikke kan se den, skal du først trykke på de tre prikker (•••) og derefter på Del. Rul ned, og tryk på **Føj til hjemmeskærm**. Lad **Åbn som webapp** være slået til, og tryk derefter på **Tilføj**. Hvis et link åbnede inde i en anden app, så åbn siden i Safari først, for den indbyggede browser kan ikke føje den til.
    - title: Android
      body: Åbn browserens menu, og vælg **Føj til startskærm** eller **Installer app**.
    - title: Chrome eller Edge på en computer
      body: Åbn browserens menu, og vælg indstillingen til at installere dette websted som en app. Så får den sit eget vindue og sit eget ikon.
    - title: Safari på en Mac
      body: Vælg **Arkiv** og derefter **Tilføj til Dock**.
sections:
  - heading: Notifikationer, kun hvis du beder om dem
    body: Push-notifikationer er valgfrie. Slå dem til, så får du en notifikation, når der er ny aktivitet i dine grupper, f.eks. at nogen tilføjer en udgift, skriver en kommentar eller registrerer en betaling. De slås til én enhed ad gangen, fra notifikationsklokken eller fra **Indstillinger**, og du kan slå dem fra igen dér. De kræver en browser, der understøtter dem, og din tilladelse. Hvis din browser har blokeret dem for webstedet, så tillad dem først i browserens indstillinger. På en iPhone eller iPad virker de kun fra appen føjet til hjemmeskærmen, ikke fra en browserfane. Levering er ikke garanteret, så se en notifikation som et puf, ikke et løfte. Hvad der dukker op i feedet, kan du læse om i [planlæg sammen](page:feature/plan-together).
  - heading: Opdateringer med det samme, uden en opdater-knap
    body: Tilføj en udgift, og alle ser den med det samme, sammen med hvad der er ændret, og hvem der ændrede det. Hver gruppe har en aktivitetshistorik, og notifikationsklokken viser aktivitet på tværs af alle dine grupper. Ingen behøver spørge, om du har set det, du lige har tilføjet. Det er allerede på deres skærm.
  - heading: 39 sprog, hver person sit eget
    body: Brug Side Badger på 39 sprog, herunder arabisk, persisk og urdu, som skrives fra højre mod venstre. Alle i gruppen vælger sit eget, så den samme gruppeside kan være på arabisk for den ene og engelsk for den næste. Det eneste, gruppen skal blive enig om, er tallene.
  - heading: Bygget til mere end én slags bruger
    body: Side Badger er bygget med tanke på brugere af tastatur og skærmlæser. Medlemsfarver kommer med mønstre, så du ikke behøver at kende forskel på grøn og rød.
    items:
      - Links til at springe over, så tastaturbrugere kan hoppe direkte til indholdet.
      - Dialoger styrer tastaturfokus.
      - Kontroller har etiketter, til skærmlæsere.
      - Layouts vendes for højre-til-venstre-sprog.
limits:
  heading: Hvad webappen ikke gør
  items:
    - Der er ingen offlinebrug. Side Badger har brug for en forbindelse, så den åbner ikke din gruppe i et fly uden wifi.
    - Der er ingen app i en app store og ingen indbygget iPhone- eller Android-app. Side Badger er en webapp, og at føje den til din hjemmeskærm eller dit Dock er sådan, du får den app-lignende version.
    - At føje den til en hjemmeskærm eller et Dock afhænger af din browser. Menunavne varierer mellem browsere og versioner, og nogle browsere tilbyder det ikke.
    - Push-notifikationer er valgfrie for hver enhed og kræver en browser, der understøtter dem, og din tilladelse. På en iPhone eller iPad virker de kun fra appen føjet til hjemmeskærmen. Levering er ikke garanteret.
    - Der er ingen e-mail- eller sms-advarsler og ingen betalingspåmindelser. Ny aktivitet vises i appen og som push-notifikationer, hvis du slår dem til. Det er stadig op til dig at rykke for en betaling.
    - Aktivitet gemmes i 90 dage.
    - Du logger ind med en e-mailadresse og en adgangskode. Der er intet login med Google eller Apple, og du skal være 18 år eller derover.
    - Vi påstår ikke, at Side Badger er fuldt tilgængelig, eller at den opfylder en formel tilgængelighedsstandard. Hvis noget står i vejen for dig, så sig det til os inde fra appen, så ser du vores svar dér.
useCasesHeading: Hvor det hjælper ikke at skulle bruge en app
faq:
  heading: Spørgsmål
  items:
    - q: Findes der en Side Badger-app i en app store?
      a: Nej. Side Badger er en webapp. Du åbner den i din browser, og du kan føje den til din hjemmeskærm eller dit Dock, så den åbner som en app. Der er intet at hente fra en app store.
    - q: Kan jeg dele regninger uden at hente en app?
      a: Ja. Åbn Side Badger i en browser på din telefon eller computer, log ind, og start en gruppe. Det er valgfrit at føje den til din hjemmeskærm eller dit Dock.
    - q: Virker den offline?
      a: Nej. Side Badger har brug for en forbindelse, selv når den er føjet til din hjemmeskærm eller dit Dock.
    - q: Hvorfor får jeg ikke notifikationer på min iPhone?
      a: På en iPhone eller iPad virker notifikationer kun fra appen føjet til hjemmeskærmen, ikke fra en browserfane. Føj den til, åbn den fra ikonet på hjemmeskærmen, og slå så notifikationer til i **Indstillinger**. Levering er ikke garanteret, så hvis en forsvinder, viser gruppens aktivitetshistorik stadig, hvad der blev tilføjet.
    - q: Skal jeg slå notifikationer til?
      a: Nej. De er slået fra, til du slår dem til, én enhed ad gangen. Uden dem vises ny aktivitet stadig i appen, og alle ser en ændring med det samme, når de har den åben.
    - q: Skal alle i gruppen have en konto?
      a: Ja. Du skal bare bruge en e-mailadresse og en adgangskode, og du bekræfter e-mailadressen, før du kan tilføje noget. Alle, der deltager i en gruppe, gør det samme, på den telefon eller computer, de foretrækker.
