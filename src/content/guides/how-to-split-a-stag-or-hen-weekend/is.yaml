meta:
  title: "Skiptu kostnaði við steggja- eða gæsahelgi | Side Badger"
  description: "Heiðursgesturinn borgar ekkert og öll tala enn saman á mánudegi. Hvernig á að skipta steggja- eða gæsahelgi, með útreikningum."
h1: "Hvernig á að skipta kostnaði við steggja- eða gæsahelgi"
navLabel: "Steggja- eða gæsahelgi"
lead: "Heiðursgesturinn borgar ekkert, svo restin af hópnum skiptir hverjum kostnaði [jafnt](page:feature/split-expenses) á milli sín. Slepptu fólki úr kostnaði sem það tekur ekki þátt í og hafðu heiðursgestinn utan hópsins svo leyndin haldist."
cta:
  heading: "Haltu utan um tölurnar og leyndina"
  body: "Búðu til hóp, sendu tengilinn til allra nema heiðursgestsins og bættu við hverjum kostnaði um leið og hann fellur til. Side Badger er ókeypis, án auglýsinga og án daglegra takmarka."
sections:
  - heading: "Fjórar vinkonur og ein óvænt uppákoma"
    body: "Hannah, Isla, Jess og Kat fara með Grace í gæsahelgi. Grace er heiðursgesturinn, svo hún borgar ekkert. Hún er heldur ekki í hópnum, svo hún sér ekki hverju vinkonur hennar eyða í hana. Hannah bókar bústaðinn, Isla borgar fyrir daginn í heilsulindinni, Jess tekur kvöldverðinn og Kat leigubílinn. Á sunnudegi hafa öll borgað eitthvað og enginn getur sagt hver er á undan. Útreikningarnir eru þeir sömu fyrir steggja- og gæsahelgi, hver sem heiðursgesturinn er."
  - heading: "Skiptu á milli þeirra sem borga, ekki þeirra sem mæta"
    body: "Hlutur heiðursgestsins hverfur ekki. Honum er deilt út. Bústaðurinn kostar 720 £ og fjórar vinkonur borga hann, svo það eru 180 £ á mann og pláss Grace er þegar í þeirri tölu. Kvöldverðurinn er 260 £, svo 65 £ á mann. Leigubíllinn er 44 £, svo 11 £ á mann. Allt sem einhver sleppir hefur aðeins áhrif á það útgjald. Kat sleppir heilsulindinni, svo 360 £ hennar, sem ná líka yfir pláss Grace, skiptast á milli Hannah, Isla og Jess, 120 £ á mann. Þegar allt er lagt saman eiga Hannah, Isla og Jess að bera 376 £ hver af helginni og Kat 256 £."
  - heading: "Settu það upp í Side Badger"
    items:
      - "Búðu til hóp fyrir helgina og gefðu honum leiðinlegt nafn, eins og Bústaðarhelgi. Grace er ekki meðlimur og aðeins meðlimir hóps geta séð hann."
      - "Veldu **Bjóða öðrum** og sendu tengilinn, eða sýndu QR-kóðann, aðeins þar sem Grace sér ekki til. Tengillinn sýnir forskoðun á hópnum áður en nokkur gengur í hann. Veldu hve lengi hann gildir, frá 15 mínútum upp í 5 daga. Gamall tengill virkar áfram þar til hann rennur út, svo láttu hann ekki gilda lengur en þú þarft."
      - "Fyrir hvern kostnað skaltu velja **Skrá útgjöld**, slá inn upphæðina og velja greiðandann undir **Hver greiddi?** Undir **Skipta á milli** skaltu haka við fólkið sem borgar og sleppa þeim sem slepptu kostnaðinum, eins og Kat við heilsulindina. Veldu **Jafnt** undir **Hvernig á að skipta**."
      - "Þegar þið eruð komin heim skaltu opna hlutann **Staða** í hópnum. Side Badger sýnir hver skuldar hverjum og leggur til stuttan lista yfir greiðslur. Hér eru þær þrjár: Kat borgar Hannah 212 £, Jess borgar Hannah 116 £ og Isla borgar Hannah 16 £. Borgið hvert öðru eins og ykkur hentar og notið svo **Gera upp** til að skrá hverja greiðslu."
  - heading: "Áður en þið bókið: kostnaðarmörk og innborgun"
    body: "Komið ykkur saman um kostnaðarmörkin áður en nokkur bókar. Veldu **Bæta við könnun**, spurðu hvað hópurinn ætli að eyða í bústaðinn og bjóddu nokkrar upphæðir sem valkosti. Kveiktu á **Nafnlæg atkvæðagreiðsla** þegar þú býrð hana til, til að fela hver kaus hvað, svo enginn þurfi að verja lægri upphæð upphátt. Lokaðu könnuninni þegar allir hafa kosið og sigurvegarinn birtist. Þá kemur innborgunin. Sá sem bókar borgar hana og skráir hana sem útgjald sem er skipt jafnt, og eftirstöðvarnar fara inn sem annað útgjald þegar þær falla til. Hin geta sent sinn hlut strax og skráð greiðsluna, eða beðið eftir lokatalningunni. Staðan verður sú sama hvort sem er."
  - heading: "Þegar einhver kemur í eina nótt"
    body: "Manneskja sem mætir aðeins á laugardag á ekki að borga fyrir föstudag. Slepptu henni úr kostnaði sem hún var ekki með í. Þar sem kostnaðurinn fer eftir því hve lengi hver gistir, eins og herbergi, skaltu velja **Nákvæmar upphæðir** undir **Hvernig á að skipta** og slá inn hlut hvers og eins, sem verður að ná heildarupphæðinni. Reiknaðu fyrst verð á mann á nótt og margfaldaðu svo með fjölda nátta hvers og eins. Á síðunni um [hópferðir](page:use-case/group-trips) er meira um kostnað sem er ekki sá sami fyrir alla."
  - heading: "Það sem Side Badger gerir ekki hér"
    items:
      - "Það flytur aldrei peninga. Þið borgið hvert öðru með millifærslu, reiðufé eða hverju sem hentar og skráið svo greiðsluna svo staðan uppfærist hjá öllum."
      - "Það sendir engar greiðsluáminningar. Vingjarnlegt pot í hópspjallinu er áfram á ábyrgð manneskju."
      - "Hvert útgjald hefur einn greiðanda og Side Badger getur ekki skipt kvittun línu fyrir línu. Ef tvö kort borguðu bústaðinn skaltu skrá hann sem tvö útgjöld. Ef sum pöntuðu aukalega í kvöldverðinum skaltu skrá aukahlutina sem sitt eigið útgjald."
      - "Það heldur utan um peningana, ekki dagskrána. Kannanir og athugasemdir haldast við kostnaðinn, svo áætlun helgarinnar er áfram í hópspjallinu ykkar."
