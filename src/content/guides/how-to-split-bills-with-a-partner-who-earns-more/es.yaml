faq:
  heading: "Preguntas"
  items:
    - q: "¿Usamos el sueldo bruto o el neto?"
      a: "Lo decide el grupo. El neto es lo habitual, porque es el dinero que de verdad tenéis para gastar. El bruto ignora que los impuestos, las aportaciones a la pensión y las cuotas de los préstamos se llevan cantidades distintas de sueldos distintos. Elijáis lo que elijáis, usad la misma medida para los dos."
    - q: "¿Ve Side Badger nuestros ingresos?"
      a: "No. Solo introduces porcentajes, nunca sueldos. Los porcentajes los ven los miembros del grupo, y en una pareja sois los dos."
    - q: "¿Podemos fijar 62/38 una vez para todo?"
      a: "La división se fija por gasto, no por grupo. Copia un gasto que ya tenga 62 y 38 y cambia lo que sea distinto. [Dividir gastos](page:feature/split-expenses) explica las otras opciones."
