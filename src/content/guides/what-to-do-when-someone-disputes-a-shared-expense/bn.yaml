meta:
  title: "কেউ যৌথ খরচ নিয়ে আপত্তি তুললে কী করবেন | Side Badger"
  description: "খোঁচা দেওয়া মেসেজটা বাদ দিন। বরং খরচ নিয়ে প্রশ্ন তুলুন, আলোচনার সময় সেটা সবার ব্যালেন্সের বাইরে থাকবে। £45-এর পার্টির ওয়াইন দিয়ে অঙ্কসহ দেখানো।"
h1: "কেউ যৌথ খরচ নিয়ে আপত্তি তুললে কী করবেন"
navLabel: "আপত্তি তোলা খরচ"
lead: "খোঁচা দেওয়া মেসেজ না পাঠিয়ে খরচটার ওপর একটি প্রশ্ন তুলুন। প্রশ্ন খোলা থাকলে পুরো খরচটা সবার ব্যালেন্সের বাইরে থাকে। মন্তব্যে কথা বলুন, গ্রুপ রাজি হলে ভাগ বদলে নিন, আর যে প্রশ্ন তুলেছে সে, বা একজন অ্যাডমিন, প্রশ্নটা বন্ধ করে দিক।"
cta:
  heading: "অস্বস্তিকর প্রশ্নটা ভদ্রভাবে করুন"
  body: "বিনামূল্যে অ্যাকাউন্ট খুলুন, ফ্ল্যাটের জন্য একটি গ্রুপ শুরু করুন আর একজন অ্যাডমিনকে খরচের প্রশ্ন চালু করতে বলুন, যা কেউ চালু না করা পর্যন্ত বন্ধ থাকে। আগে ঘুরে দেখতে চান? দেখুন [কীভাবে কাজ করে](page:how-it-works) বা [বিনামূল্যে কী কী মেলে](page:pricing)।"
sections:
  - heading: "তিন রুমমেট আর £45-এর ওয়াইন"
    body: "পার্টির পর Tom ফ্ল্যাটের গ্রুপে ওয়াইনটা যোগ করে। ওয়াইনের দাম £45, টাকা দিয়েছে Tom, আর ভাগ হয়েছে Tom, Priya ও Aisha-র মধ্যে সমান, অর্থাৎ জনপ্রতি £15। Aisha অ্যালকোহল খায় না। Tom ওয়াইন কিনেছিল পার্টির জন্য, আর পার্টিটা ছিল [ফ্ল্যাটের](page:use-case/housemates) জন্য, তাই সে কোনো ভুল করেনি। Aisha-র প্রশ্ন করাটাও ভুল নয়। এখানে কেউ খলনায়ক নয়। শুধু £15-এর ওয়াইন নিয়ে মতভেদ, আর সেটাকে অস্বস্তিকর বানানোর অনেক উপায়। বাড়ির সবাইকে খোঁচা দেওয়া একটা মেসেজ পাঠানো তার একটি। খরচের ওপর একটি প্রশ্ন তোলা তার নরম রূপ।"
  - heading: "প্রশ্ন কী করে"
    body: "Aisha খরচটা খুলে একটি প্রশ্ন তোলে। পুরো খরচটা সবার ব্যালেন্স থেকে বাদ পড়ে, শুধু তার ভাগ নয়, আর অন্য কিছুতে প্রভাব পড়ে না। বড় বাজার (£84) আর ক্লিনার (£60) তখনও গণনায় থাকে, যা £28 + £20 = জনপ্রতি £48। তাই ওয়াইন স্থগিত থাকা অবস্থায় Aisha-র দেওয়ার আছে £48, Tom-এর পাওনা £36 আর Priya-র পাওনা £12। ওয়াইন নিয়ে ফ্ল্যাট যা-ই ঠিক করুক, এর মধ্যে কারও ব্যালেন্সে সেটা ধরা হয় না। খরচে থাকা আর যে কেউ নিজের প্রশ্নও তুলতে পারে। ওয়াইন ব্যালেন্সে ফেরে শুধু তখনই, যখন তার শেষ খোলা প্রশ্নটি বন্ধ হয়, আর প্রশ্ন বন্ধ করতে পারে যে তুলেছে সে অথবা একজন অ্যাডমিন।"
  - heading: "আলোচনা, তারপর ঠিক করা"
    body: "Aisha-র প্রশ্ন খরচের মন্তব্যে গিয়ে বসে, তাই উত্তরগুলো তার ঠিক নিচেই থাকে। মন্তব্য আর প্রশ্ন নিয়ে আরও জানতে দেখুন [একসঙ্গে পরিকল্পনা](page:feature/plan-together)। Tom আর Priya সেটা পড়ে, ফ্ল্যাটে একটু কথা হয়। তারা ঠিক করে ওয়াইনটা ছিল Tom আর Priya-র, কারণ তারাই খেয়েছে। অন্য ফ্ল্যাট হয়তো তিনজনে ভাগই রাখত, বা মাঝামাঝি কিছু ঠিক করত, সেটাও ঠিক হতো। আপনারা যা ঠিক করেন Side Badger তা জমা রাখে, ওয়াইন নিয়ে তার কোনো মত নেই। Tom খরচটা সম্পাদনা করে নিজের আর Priya-র মধ্যে সমান ভাগ করে, অর্থাৎ জনপ্রতি £22.50 (£45 ÷ 2)। Aisha আর তাতে নেই, তাই তার প্রশ্ন পুরনো সংস্করণের সঙ্গে চলে যায় আর ওয়াইন ব্যালেন্সে ফিরে আসে। আগের সংস্করণটা রাখা থাকে।"
  - heading: "ফলাফল পড়া"
    body: "ওয়াইন ফিরে আসার পর Tom-এর পাওনা £58.50, Priya-র দেওয়ার আছে £10.50 আর Aisha-র £48। Side Badger দুটি পেমেন্ট সাজেস্ট করে, দুটিই Tom-কে। Aisha-র £48 হলো ওয়াইন স্থগিত থাকার সময়ের সেই একই অঙ্ক, কারণ সে তাতে নেই। Priya আগে £12 পেত, এখন তার £10.50 দেওয়ার আছে, কারণ ওয়াইনে তার অর্ধেক ভাগ £22.50। তিনজনে ভাগ থাকলে Aisha-র দেওয়ার থাকত £63 (£28 + £20 + £15)। পুরো মতভেদটার দাম ছিল £15। যেভাবে খুশি একে অপরকে দিন, তারপর **সব শোধ করুন** থেকে প্রতিটি পেমেন্ট রেকর্ড করুন। বাকিটা জানতে দেখুন [হিসাব মেটানো](page:feature/settle-up)।"
  - heading: "এমনভাবে লিখুন যাতে লোকে আপনার সঙ্গে কথা বলা বন্ধ না করে"
    body: "Aisha-র প্রশ্ন: “আমি ওয়াইনের কিছুই খাইনি। ভাগটা কি একটু দেখা যায়?” এটি ছোট, এটি খরচটার নাম নেয়, আর এটি অভিযোগ না করে জিজ্ঞেস করে। কয়েকটি অভ্যাস কাজে লাগে।"
    items:
      - "**মানুষকে নয়, খরচটাকে নিয়ে জিজ্ঞেস করুন।** “ওয়াইনের ভাগটা একটু দেখে নিই?” থেকে একটা কথোপকথন শুরু হয়। “তোমার ওয়াইনের টাকা আমার ঘাড়ে কেন?” শুরু করে অন্য ধরনের কথোপকথন।"
      - "**বলুন আপনি কী ঘটতে চান।** “যারা খেয়েছে শুধু তাদের মধ্যে হলে কেমন হয়?” গ্রুপকে সায় দেওয়ার বা উত্তর দেওয়ার মতো কিছু দেয়।"
      - "**এক-দুই বাক্যে কারণ দিন।** ঘরটির নাম **আপনার প্রশ্ন**, আর এটি ফাঁকা রাখা যায় না।"
      - "**উত্তরগুলো এক জায়গায় রাখুন।** উত্তর যায় খরচের মন্তব্যে, যে সংখ্যাগুলো নিয়ে কথা তার ঠিক পাশেই।"
  - heading: "Side Badger-এ চালু করুন"
    items:
      - "**প্রশ্ন চালু করুন।** এগুলো ডিফল্টে বন্ধ থাকে। একজন অ্যাডমিন গ্রুপের **সেটিংস** খোলেন, **সাধারণ** ট্যাবে **বৈশিষ্ট্য**-এর নিচে **খরচ সম্পর্কিত প্রশ্নের অনুমতি দিন** চালু করেন আর **সংরক্ষণ করুন** বেছে নেন। পরে বন্ধ করলে প্রতিটি খোলা প্রশ্ন মুছে যায়।"
      - "**একটি তুলুন।** খরচটা খুলুন আর ভাগের তালিকায় নিজের নামের পাশে **আমার একটি প্রশ্ন আছে** বেছে নিন। **আপনার প্রশ্ন** ঘরে কারণ লিখুন আর আবার **আমার একটি প্রশ্ন আছে** বেছে নিন। শুধু খরচে থাকা মানুষরাই এটা করতে পারে। খরচে তখন একটি **প্রশ্নবিদ্ধ** ব্যাজ দেখা যায়।"
      - "**কী স্থগিত আছে খুঁজুন।** খরচের তালিকায় **শুধুমাত্র প্রশ্নবিদ্ধ** বেছে নিলে খোলা প্রশ্ন থাকা খরচগুলো দেখায়।"
      - "**গ্রুপ রাজি হলে ঠিক করুন।** খরচটা খুলুন, **সম্পাদনা** বেছে নিন, **যাদের মধ্যে ভাগ হবে** বদলান আর **খরচ আপডেট করুন** বেছে নিন। কে সম্পাদনা করতে পারবে তা গ্রুপের অনুমতির ওপর নির্ভর করে।"
      - "**ঠিক করার কিছু না থাকলে বন্ধ করুন।** যে প্রশ্ন তুলেছে সে তার **প্রশ্নবিদ্ধ** ব্যাজের বন্ধ করার বোতাম, যার লেবেল **প্রশ্ন বন্ধ করুন**, ব্যবহার করতে পারে, একজন অ্যাডমিনও পারেন। শেষ প্রশ্নটি বন্ধ হলে খরচটা ব্যালেন্সে ফিরে আসে।"
  - heading: "যখন এত গোছানো থাকে না"
    items:
      - "**সম্পাদনার পরেও প্রশ্নকারী খরচে থাকলে।** যে প্রশ্ন তুলেছে সে যদি এখনও খরচে থাকে, তার প্রশ্ন সম্পাদিত সংস্করণে চলে আসে আর তার, বা একজন অ্যাডমিনের, বন্ধ করার অপেক্ষায় থাকে। অঙ্ক ঠিক করা মানে সবাই মেনে নিয়েছে যে ঠিক হয়েছে, তা নয়।"
      - "**আপনি খরচে ছিলেন না।** শুধু খরচে থাকা মানুষরাই সেটা নিয়ে প্রশ্ন তুলতে পারে। কিছু অদ্ভুত লাগলে তার মন্তব্যে বলুন, বা যে যোগ করেছে তাকে জিজ্ঞেস করুন।"
      - "**কেউ গ্রুপ ছাড়তে চাইলে।** একটি খোলা প্রশ্ন সেই খরচে থাকা মানুষদের গ্রুপ ছাড়তে দেয় না। প্রশ্নটা বন্ধ করুন, বা খরচ এমনভাবে সম্পাদনা করুন যাতে তারা আর তাতে না থাকে, তাহলে তারা যেতে পারে।"
  - heading: "এখানে Side Badger যা করে না"
    items:
      - "কে ঠিক সেটা এটি ঠিক করে না। এটি খরচটাকে ব্যালেন্সের বাইরে রাখে আর আপনারা যা ঠিক করেন তা জমা রাখে।"
      - "গণনায় ধরার আগে খরচ অনুমোদনের জন্য এটি কাউকে বলে না। শুধু প্রশ্নবিদ্ধ খরচই স্থগিত থাকে।"
      - "খরচের একটি অংশ এটি আটকে রাখতে পারে না। প্রশ্ন তুললে পুরোটাই ব্যালেন্স থেকে বেরিয়ে যায়।"
      - "এটি টাকা নাড়াচাড়া করে না। আপনারা যেভাবে খুশি একে অপরকে দেন আর রেকর্ড করেন।"
exampleAfter: 3
