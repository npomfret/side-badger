faq:
  heading: "Spurningar"
  items:
    - q: "Get ég dregið bara minn hluta í efa?"
      a: "Nei. Spurning heldur öllu útgjaldinu úti, fyrir alla í því. Ef aðeins skiptingin er röng er lausnin að breyta skiptingunni."
    - q: "Hver getur lokað spurningu?"
      a: "Sá sem spurði, eða stjórnandi hópsins. Ef sá sem bætti útgjaldinu við er ekki stjórnandi getur hann ekki lokað henni fyrir hönd spyrjandans."
    - q: "Eyðir breyting á útgjaldi upprunalegu útgáfunni?"
      a: "Nei. Fyrri útgáfan er geymd. Heimildir hópsins ákveða hver getur breytt, svo það er þess virði að láta heimilið vita fyrst, því staðan breytist."
