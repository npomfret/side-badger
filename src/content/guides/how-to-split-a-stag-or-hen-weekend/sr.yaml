faq:
  heading: "Питања"
  items:
    - q: "Да ли кум или кума плаћа више?"
      a: "Само ако се група сложи. Апликација никоме не даје посебну улогу у рачуну. Ако неко покрива више, изабери **Тачни износи** или **Проценат** под **Начин поделе** и унеси уделе око којих сте се договорили."
    - q: "Шта са пићем које неки нису пили?"
      a: "Додај пиће као посебан трошак и означи само оне који су га пили. Ако је свако попио другачије, изабери **Тачни износи** и укуцај део сваке особе. Нико не плаћа оно што није попио."
    - q: "Може ли почасни гост касније да види групу?"
      a: "Да, кад изненађење прође. Позови госта, па администратор може да му додели улогу **Посматрач** под **Безбедност** у подешавањима групе. Посматрач види све и ништа не мења, зато сачекај док ништа није тајна. Мора да има бесплатан кориснички налог да би се придружио."
