sections:
  - heading: "39개 언어, 더 많은 사람을 위한 설계"
    body: "사이드 배저는 오른쪽에서 왼쪽으로 쓰는 아랍어, 페르시아어, 우르두어를 포함해 39개 언어로 사용할 수 있습니다. 그룹원마다 자신의 언어를 고를 수 있어서, 한 사람은 아랍어로, 다음 사람은 영어로 그룹 페이지를 볼 수 있어요. 키보드와 화면 낭독기 사용자도 고려해 만들었고, 멤버 색상에는 패턴이 함께 표시되어 초록과 빨강을 구분하지 못해도 괜찮습니다."
faq:
  heading: "자주 묻는 질문"
  items:
    - q: "모두 계정이 필요한가요?"
      a: "네, 무료 계정이에요. 각자 이메일을 인증해야 무언가를 추가할 수 있습니다."
    - q: "앱이 있나요?"
      a: "브라우저에서 실행되며, 홈 화면이나 독에 추가하면 앱처럼 열립니다. 앱 스토어 버전이나 오프라인 모드는 없어요."
    - q: "사이드 배저가 돈을 옮겨 주나요?"
      a: "아니요. 금액을 계산하고 결제를 제안할 뿐이고, 지불은 원하는 방법으로 서로 하면 됩니다. 그런 다음 결제를 기록하세요. [정산하기](page:feature/settle-up)를 참고하세요."
    - q: "빚이 있는 채로 나갈 수 있나요?"
      a: "아니요. 줄 돈이나 받을 돈이 남아 있으면 그룹을 나갈 수 없으므로 먼저 정산해야 합니다."
    - q: "한 그룹에 몇 명까지 들어올 수 있나요?"
      a: "한 그룹에 최대 50명입니다. 링크나 QR 코드로 초대하고, 관리자가 한 명씩 허용하게 하려면 승인을 켜세요."
    - q: "통화가 둘 이상인 여행은요?"
      a: "잔액은 통화마다 따로 관리됩니다. [여러 통화](page:feature/multiple-currencies)를 참고하세요."
