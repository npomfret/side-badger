sections:
  - heading: "39 idiomas, e feito para mais pessoas"
    body: "Usa o Side Badger em 39 idiomas, incluindo o árabe, o persa e o urdu, escritos da direita para a esquerda. Cada pessoa do grupo pode escolher o seu, por isso a página do grupo pode estar em árabe para uma pessoa e em inglês para a seguinte. Também foi feito a pensar em quem usa teclado e leitores de ecrã, e as cores dos membros vêm com padrões, para não teres de distinguir o verde do vermelho."
faq:
  heading: "Perguntas"
  items:
    - q: "Todos precisam de uma conta?"
      a: "Sim, uma grátis. Cada pessoa verifica o e-mail antes de adicionar o que quer que seja."
    - q: "Existe uma app?"
      a: "Funciona no navegador e podes adicioná-lo ao ecrã principal ou ao dock para abrir como uma app. Não há versão em loja de aplicações nem modo offline."
    - q: "O Side Badger movimenta dinheiro?"
      a: "Não. Mantém a conta e sugere pagamentos, e vocês pagam-se como preferirem. Depois registam o pagamento. Vê [acertar contas](page:feature/settle-up)."
    - q: "Alguém pode sair a dever dinheiro?"
      a: "Não. Ninguém pode sair de um grupo enquanto deve ou tem dinheiro a receber, por isso acerta primeiro."
    - q: "Quantas pessoas podem entrar num grupo?"
      a: "Até 50 pessoas num grupo. Convida-as com um link ou um código QR e ativa a aprovação se quiseres que um administrador deixe entrar cada pessoa."
    - q: "E as viagens com mais de uma moeda?"
      a: "Os saldos são mantidos em separado para cada moeda. Vê [várias moedas](page:feature/multiple-currencies)."
