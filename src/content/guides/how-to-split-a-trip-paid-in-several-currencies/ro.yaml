faq:
  heading: "Întrebări"
  items:
    - q: "Ce curs de schimb folosește Side Badger?"
      a: "Un curs de schimb actual, luat când introduci cheltuiala, acolo unde există unul. Îl poți schimba cu cursul pe care l-ai primit de fapt."
    - q: "Putem rămâne doar la lire și yeni?"
      a: "Da. În **Setări** ale grupului, activează **Restricționează monedele pentru acest grup** la **Setări Monedă**, alege **Monede permise** și setează **Moneda implicită pentru cheltuieli noi**. Mai puține opțiuni în listă, mai puține alegeri greșite la casă."
    - q: "Trebuie să convertim deloc?"
      a: "Nu. Valutele rămân separate, dacă tu sau grupul nu alegeți să convertiți, iar fiecare valută primește propria listă scurtă de plăți."
