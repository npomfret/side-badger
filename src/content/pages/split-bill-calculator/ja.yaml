meta:
  title: "割り勘計算機：誰が誰に払うか、すっきり整理 | Side Badger"
  description: "誰が払い、誰が借りていて、誰が誰に払うか。数秒でスッキリ。均等、金額指定、割合指定で分けられます。無料でブラウザ上で動作し、保存も送信もしません。"
h1: 割り勘計算機
navLabel: 割り勘計算機
lead: 誰が何にいくら払ったかを入力すると、計算機が誰が誰に借りているかと、それを精算する短い支払いリストを表示します。ブラウザ上で動作し、何も保存せず、お金も動かしません。タブを閉じたあとも記録を残したいグループには、Side Badgerの[割り勘の仕方](page:feature/split-expenses)と[精算](page:feature/settle-up)が同じ計算をして、記録を保存します。
cta:
  heading: 計算が気に入ったら、残しておきましょう
  body: この計算機は、タブを閉じるとすべて忘れます。前回は絶対に自分が払ったと言い張る誰かさんのように。Side Badgerのグループなら、支出を保存し、全員の残高を更新し、支払いを記録します。無料で、広告も1日の制限もありません。
sections:
  - heading: 計算の仕組み
    body: 支出ごとに、計算機が一人ひとりの負担分を計算します。選んだ人の間で、均等、金額指定、割合指定のどれかで分けられます。各人の残高は、支払った額から負担分を引いたものです。プラスは、グループがその人に借りているということ、マイナスは、その人がグループに借りているということです。残高の合計はつねにゼロになります。誰かが受け取る分は、ほかの誰かが払う分だからです。
  - heading: 支払いリストが短い理由
    body: レシート1枚ずつ精算する必要はありません。全員の残高がわかったら、計算機は最も多く借りている人と最も多く受け取る人を組み合わせ、1回の支払いで精算できる分を精算して、全員がゼロになるまでリストを進めます。必要な支払いは、残高のある人の数より1回少ない回数が上限で、請求書ごとに精算するより少なくて済むことも多くあります。短い支払いリストを出しますが、可能な限り最短だとは約束しません。
  - heading: 計算機にできないこと
    items:
      - "**複数の通貨の扱い**。通貨を1つ選んで、計算全体で使います。アプリは通貨ごとに別の残高を管理し、現在の為替レートで支出を換算できます。レートは変更できます。"
      - "**保存**。タブを閉じると数字は消えます。残すにはリンクをコピーしてください。リンクには数字が#の後ろに入っていて、ブラウザがその部分をサーバーに送ることはありませんが、リンクを送った相手は誰でも読めます。"
      - "**お金を動かすこと**。誰が誰に払うべきかを示すだけです。支払いは好きな方法で行い、グループの記録をアプリで管理しているなら、そのあとアプリで支払いを記録してください。"
      - "**端数の1ペニーをランダムに決めること**。請求が割り切れないときは、余った端数のペニーがリストの先頭の人から順に回るので、合計は合います。アプリでは端数の1ペニーはランダムに1人へ回るので、いつも同じ人とは限りません。"
      - "**上限を超えること**。計算機で扱えるのは2～20人で、1件の支出は999,999.99までです。アプリと同じです。"
