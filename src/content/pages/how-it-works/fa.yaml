meta:
  title: "Side Badger چطور کار می‌کند | تقسیم هزینه‌های گروهی در پنج مرحله"
  description: "گروه بسازید، افراد را دعوت کنید، هزینه‌ها را اضافه کنید و تسویه حساب کنید. ببینید بین «یک نفر پرداخت کرد» و «حساب‌مان صاف شد» چه اتفاقی می‌افتد، با یک مثال کامل."
h1: "Side Badger چطور کار می‌کند"
navLabel: "نحوه کار"
lead: "بین «یک نفر پرداخت کرد» و «حساب‌مان صاف شد» چه اتفاقی می‌افتد؟ پنج مرحله، بدون صفحه‌گسترده، و یک گورکن که بیشتر برای دکور است. این کل مسیر است، از اولین گروه تا آخرین پرداخت ثبت‌شده. برای جزئیات هر مرحله، [تقسیم هزینه‌ها](page:feature/split-expenses) و [تسویه حساب](page:feature/settle-up) را ببینید."
cta:
  heading: "از «این یکی با من» تا «حساب‌مان صاف شد»"
  body: "یک حساب رایگان بسازید، گروه را شروع کنید و اولین هزینه را اضافه کنید. گورکن درباره رسید قضاوت نمی‌کند."
steps:
  - title: "یک گروه بسازید"
    body: "برای هر خانه، سفر یا مراسم یک گروه جدا بسازید تا اجاره‌خانه با کادوی عروسی در یک فهرست نیفتد. یک نام برایش بگذارید، نامی را که دیگران برای شما می‌بینند انتخاب کنید و اگر خواستید ارزهایی را که می‌پذیرد محدود کنید. بعد داشبورد شما همه گروه‌ها و وضعیت‌تان در هرکدام را در یک صفحه نشان می‌دهد."
    shot: S02
    shotAlt: "پنجره ساخت گروه با بخش محدودیت ارزها باز"
  - title: "افراد را دعوت کنید"
    body: "یک لینک دعوت بفرستید یا کد QR نشان دهید و مدت اعتبارش را از 15 دقیقه تا 5 روز تعیین کنید. هر کسی که می‌پیوندد به یک حساب رایگان و ایمیل تأییدشده نیاز دارد و هر گروه تا 50 نفر جا دارد. اگر می‌خواهید ورود افراد را کنترل کنید، تأیید را روشن کنید تا مدیر به هر نفر اجازه ورود بدهد."
    shot: S03
    shotAlt: "پنجره دعوت در زبانه لینک، با کد QR و گزینه‌های مدت اعتبار"
  - title: "هزینه‌ها را همان لحظه اضافه کنید"
    body: "بگویید چه کسی پرداخت کرد، چقدر، و برای چه کسانی. مساوی، با مبلغ دقیق یا با درصد تقسیم کنید و هر کسی را که در آن سهمی نداشت کنار بگذارید. هزینه را اضافه کنید تا همه بلافاصله آن را ببینند، همراه با اینکه چه چیزی تغییر کرده و چه کسی تغییر داده است."
    shot: S05
    shotAlt: "فرم هزینه با تقسیم درصدی که اجاره را بر اساس اندازه اتاق تقسیم می‌کند"
  - title: "مانده‌ها را زیر نظر بگیرید"
    body: "Side Badger برای هر ارز یک مانده جاری نگه می‌دارد تا در یک نگاه ببینید چه کسی به چه کسی بدهکار است. به‌جای اینکه همه را با شبکه‌ای از بدهی‌های کوچک تنها بگذارد، فهرست کوتاهی از پرداخت‌ها پیشنهاد می‌دهد که حساب گروه را صاف می‌کند."
    shot: S10
    shotAlt: "صفحه مانده‌ها با بدهی‌های ساده‌شده در دو ارز، با «نمایش همه» روشن"
  - title: "بیرون از برنامه تسویه کنید، داخل برنامه ثبت کنید"
    body: "Side Badger هرگز پول جابه‌جا نمی‌کند. هر طور دوست دارید به هم پرداخت کنید، بعد پرداخت را ثبت کنید تا مانده‌ها به‌روز شوند و صفحه همه بدون بارگذاری مجدد تازه شود. «تسویه» فقط یعنی مانده‌ها صفر شده‌اند. تا وقتی کسی بدهکار یا طلبکار است نمی‌تواند از گروه خارج شود، پس هر کس قصد رفتن دارد اول تسویه می‌کند."
    shot: S11
    shotAlt: "فرم پرداخت با دکمه‌های تسویه سریع و اعلان پرداخت جزئی"
requirements:
  heading: "به چه چیزی نیاز دارید"
  items:
    - "یک حساب رایگان. فقط یک نشانی ایمیل و یک گذرواژه لازم است و پیش از افزودن هر چیزی باید ایمیل را تأیید کنید."
    - "18 سال یا بیشتر سن داشته باشید."
    - "یک مرورگر امروزی روی گوشی یا رایانه و یک اتصال اینترنت. Side Badger برنامه فروشگاهی نیست و آفلاین کار نمی‌کند."
    - "اختیاری: جایی روی صفحه اصلی. به فروشگاه برنامه نیازی نیست: وارد شوید و بعد Side Badger را به صفحه اصلی یا داک اضافه کنید تا مثل یک برنامه باز شود. تنظیمات داخل برنامه روش کار را نشان می‌دهد."
