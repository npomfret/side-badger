meta:
  title: "Wat doe je als iemand een gedeelde uitgave betwist | Side Badger"
  description: "Geen scherp berichtje: stel de uitgave in vraag en ze verdwijnt uit ieders saldo terwijl jullie praten. Uitgewerkt met £ 45 aan feestwijn."
h1: "Wat doe je als iemand een gedeelde uitgave betwist"
navLabel: "Betwiste uitgaven"
lead: "Stel een vraag bij de uitgave in plaats van een scherp berichtje te sturen. Zolang de vraag openstaat, blijft de hele uitgave buiten ieders saldo. Praat het uit in de opmerkingen, pas de verdeling aan als de groep het eens is, en laat degene die de vraag stelde, of een beheerder, de vraag sluiten."
cta:
  heading: "Stel de lastige vraag beleefd"
  body: "Maak een gratis account aan, start een groep voor het huis en vraag een beheerder om vragen over uitgaven aan te zetten, want die staan uit tot iemand dat doet. Wil je eerst de rondleiding? Bekijk [zo werkt het](page:how-it-works) of [wat gratis inhoudt](page:pricing)."
sections:
  - heading: "Drie huisgenoten en £ 45 wijn"
    body: "Na het feestje voegt Tom de wijn toe aan de groep van het huis. Het is £ 45, betaald door Tom, gelijk verdeeld tussen Tom, Priya en Aisha, dus £ 15 per persoon. Aisha drinkt niet. Tom kocht de wijn voor het feestje, en het feestje was voor het [huis](page:use-case/housemates), dus hij heeft niets verkeerd gedaan. Aisha heeft ook geen ongelijk dat ze ernaar vraagt. Niemand hier is een schurk. Er is gewoon £ 15 wijn in discussie en tal van manieren om het ongemakkelijk te maken. Een scherp berichtje aan het hele huis is er één. Een vraag bij de uitgave is een zachtere."
  - heading: "Wat een vraag doet"
    body: "Aisha opent de uitgave en stelt een vraag. De hele uitgave verdwijnt uit ieders saldo, niet enkel haar deel, en niets anders wordt beïnvloed. De grote boodschappen (£ 84) en de schoonmaak (£ 60) tellen nog mee, dat is £ 28 + £ 20 = £ 48 per persoon. Zolang de wijn in de wacht staat, is Aisha dus £ 48 schuldig, heeft Tom £ 36 tegoed en heeft Priya £ 12 tegoed. Wat het huis ook over de wijn beslist, ondertussen zit hij in niemands saldo. Ook alle anderen in de uitgave kunnen een eigen vraag stellen. De wijn komt pas terug in de saldi wanneer de laatste openstaande vraag erover gesloten is, en een vraag wordt gesloten door degene die ze stelde of door een beheerder."
  - heading: "Uitpraten, en dan rechtzetten"
    body: "Aisha’s vraag komt in de opmerkingen bij de uitgave terecht, dus de antwoorden staan er meteen onder. [Samen plannen](page:feature/plan-together) vertelt meer over opmerkingen en vragen. Tom en Priya lezen de vraag en het huis voert een gesprek. Ze besluiten dat de wijn van Tom en Priya was, omdat zij hem dronken. Een ander huis zou de verdeling in drie kunnen houden, of iets daartussenin afspreken, en dat zou ook prima zijn. Side Badger bewaart wat jullie afspreken en heeft geen mening over wijn. Tom bewerkt de uitgave zodat ze gelijk verdeeld wordt tussen hemzelf en Priya, dat is £ 22,50 per persoon (£ 45 ÷ 2). Aisha zit er niet meer in, dus haar vraag gaat mee met de oude versie en de wijn komt weer in de saldi. De vorige versie blijft bewaard."
  - heading: "Het resultaat lezen"
    body: "Met de wijn er weer bij heeft Tom £ 58,50 tegoed, is Priya £ 10,50 schuldig en Aisha £ 48. Side Badger stelt twee betalingen voor, allebei aan Tom. Aisha’s £ 48 is hetzelfde bedrag als toen de wijn in de wacht stond, omdat ze er niet in zit. Priya ging van £ 12 tegoed naar £ 10,50 schuldig, en dat is haar helft van de wijn, £ 22,50. Als de verdeling in drie was blijven staan, was Aisha £ 63 schuldig geweest (£ 28 + £ 20 + £ 15). De hele onenigheid was £ 15 waard. Betaal elkaar zoals je wilt en registreer dan elke betaling onder **Vereffenen**. [Afrekenen](page:feature/settle-up) behandelt de rest."
  - heading: "Zo formuleer je het, zodat mensen nog met je blijven praten"
    body: "Aisha’s vraag: “Ik heb niets van de wijn gedronken. Kunnen we naar de verdeling kijken?” Ze is kort, ze noemt de uitgave en ze vraagt in plaats van te beschuldigen. Een paar gewoontes helpen."
    items:
      - "**Vraag over de uitgave, niet over de persoon.** “Kunnen we de verdeling van de wijn even nakijken?” opent een gesprek. “Waarom reken je mij je wijn aan?” opent het andere soort."
      - "**Zeg wat je graag zou zien gebeuren.** “Kan het enkel tussen de mensen die ervan dronken?” geeft de groep iets om mee in te stemmen of op te antwoorden."
      - "**Geef een reden in een zin of twee.** Het veld heet **Uw vraag** en kan niet leeg blijven."
      - "**Hou de antwoorden op één plek.** Antwoorden komen in de opmerkingen bij de uitgave, naast de cijfers waar ze over gaan."
  - heading: "Zet het op in Side Badger"
    items:
      - "**Zet vragen aan.** Ze staan standaard uit. Een beheerder opent de **Instellingen** van de groep, zet onder **Functies** op het tabblad **Algemeen** de optie **Vragen over uitgaven toestaan** aan en kiest **Opslaan**. Als je dit later uitzet, worden alle openstaande vragen gewist."
      - "**Stel er een.** Open de uitgave en kies naast je eigen naam in de verdeling **Ik heb een vraag**. Schrijf je reden in **Uw vraag** en kies opnieuw **Ik heb een vraag**. Enkel mensen die in de uitgave zitten, kunnen dit doen. De uitgave toont nu een badge **In vraag gesteld**."
      - "**Zoek wat in de wacht staat.** In de lijst met uitgaven toont **Alleen in vraag gesteld** de uitgaven met een openstaande vraag."
      - "**Herstel het, als de groep het eens is.** Open de uitgave, kies **Bewerken**, wijzig **Verdelen tussen** en kies **Uitgave bijwerken**. Wie mag bewerken, hangt af van de rechten van de groep."
      - "**Sluit de vraag, als er niets rechtgezet hoeft te worden.** Degene die de vraag stelde kan de sluitknop op de eigen badge **In vraag gesteld** gebruiken, met als label **Vraag sluiten**, en een beheerder kan dat ook. De uitgave komt terug in de saldi zodra de laatste vraag gesloten is."
  - heading: "Als het niet zo netjes loopt"
    items:
      - "**De bewerking houdt de vraagsteller erin.** Zit degene die de vraag stelde nog in de uitgave, dan gaat de vraag mee naar de bewerkte versie en wacht ze tot die persoon, of een beheerder, ze sluit. De uitgave aanpassen is niet hetzelfde als het ermee eens zijn dat het opgelost is."
      - "**Je zat niet in de uitgave.** Enkel mensen die in een uitgave zitten, kunnen ze in vraag stellen. Lijkt er iets niet te kloppen, zeg het dan in de opmerkingen of vraag het aan wie ze toevoegde."
      - "**Iemand wil de groep verlaten.** Een openstaande vraag houdt de mensen in die uitgave tegen om te vertrekken. Sluit de vraag, of bewerk de uitgave zodat ze er niet meer in zitten, en ze mogen gaan."
  - heading: "Wat Side Badger hier niet doet"
    items:
      - "Het beslist niet wie gelijk heeft. Het houdt de uitgave buiten de saldi en bewaart wat jullie afspreken."
      - "Het vraagt niemand om uitgaven goed te keuren voor ze meetellen. Enkel een uitgave die in vraag is gesteld wordt vastgehouden."
      - "Het kan een deel van een uitgave niet tegenhouden. Stel ze in vraag en ze verdwijnt volledig uit de saldi."
      - "Het verplaatst geen geld. Jullie betalen elkaar zoals jullie willen en registreren het."
