      amount: 44
      split:
        method: equal
faq:
  heading: Questions
  items:
    - q: "Le témoin ou la demoiselle d'honneur paient-ils plus ?"
      a: "Seulement si le groupe est d'accord. L'appli ne donne aucun rôle spécial à personne dans les calculs. Si quelqu'un prend en charge davantage, choisissez **Montants exacts** ou **Pourcentage** sous **Comment diviser** et saisissez les parts convenues."
    - q: "Et les boissons que certains n'ont pas prises ?"
      a: "Ajoutez les boissons comme leur propre dépense et cochez seulement ceux qui en ont pris. Si chacun en a pris une quantité différente, choisissez **Montants exacts** et saisissez la part de chacun. Personne ne paie ce qu'il n'a pas pris."
    - q: "La personne fêtée peut-elle voir le groupe plus tard ?"
      a: "Oui, une fois la surprise passée. Invitez-la, puis un admin peut lui donner le rôle de **Spectateur** sous **Sécurité & Permissions** dans les paramètres du groupe. Un spectateur voit tout et ne change rien, donc attendez qu'il n'y ait plus de secret. Elle a besoin d'un compte gratuit pour rejoindre le groupe."
