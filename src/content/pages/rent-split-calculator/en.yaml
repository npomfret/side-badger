faq:
  heading: Questions
  items:
    - q: Which is fairer, room size or income?
      a: Neither, always. Room size suits flatmates who pay for the space they sleep in. Income suits couples and friends on very different pay. Agree it before the first rent day, not after.
    - q: Should the bills be split the same way?
      a: For flatmates, usually not. Everyone uses the energy and broadband, so equal is simpler, as in the example. By income, the calculator gives the bills the same shares as the rent.
    - q: Can I use square feet?
      a: Yes. Choose ft² and type your areas in square feet. The unit is only a label, and the shares come out the same as long as everyone uses one.
    - q: Is the calculator free?
      a: Yes. Free. No ads. No daily limits. You don't need an account either.
