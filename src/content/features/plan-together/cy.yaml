meta:
  title: "Rhestrau, pleidleisiau a sylwadau ar gostau grŵp | Side Badger"
  description: "Sylwadau ar gostau, holi'r un od, rhestr siopa a rennir a phleidleisio ar y fila. Cynlluniwch y gwario, yna ei rannu. Am ddim, dim hysbysebion."
h1: "Cynlluniwch gyda'ch gilydd, rhannwch wedyn"
navLabel: "Cynllunio gyda'ch gilydd"
lead: "Y rhestr siopa a'r bil siopa, o'r diwedd yn siarad â'i gilydd. Mae Side Badger yn rhoi rhywle i'ch grŵp siarad am yr arian cyn ac ar ôl ei wario, gyda sylwadau ar bob cost, ffordd o holi'r rhai sy'n edrych yn anghywir, a rhestrau a phleidleisiau a rennir ar gyfer y penderfyniadau mawr. Yna rydych yn [rhannu treuliau](page:feature/split-expenses) fel arfer."
cta:
  heading: "Cynlluniwch, yna rhannwch"
  body: "Creu cyfrif am ddim, cychwyn grŵp a rhoi eich rhestr, pleidlais neu gwestiwn cyntaf reit wrth ymyl yr arian. Ddim yn siŵr beth sy'n digwydd nesaf? Gweler [sut mae'n gweithio](page:how-it-works)."
problem:
  heading: "Mae'r sgwrs fan hyn, mae'r bil fan draw"
  body: "Mae gwario grŵp fel arfer yn byw mewn dau le. Mae'r rhifau mewn un, ac mae'r ddadl am y rhifau mewn sgwrs a sgroliodd o'r golwg ddydd Mawrth. Llun o oergell yw'r rhestr siopa. Penderfynwyd ar y fila drwy fawd i fyny gan y rhan fwyaf o bobl, mae'n debyg. Mae Side Badger yn cadw'r cynllunio yn y grŵp, wrth ymyl y costau y mae'n ymwneud â nhw, felly mae sylw lle mae'r gost, rhestr lle mae'r siopa, pleidlais ar gyfer y penderfyniad mawr, a ffordd o ddweud “arhoswch funud, ydy hyn yn iawn?” heb ysgrifennu paragraff. Mae'r cyfan yn aros yn ymwneud ag arian y grŵp, a dyna beth yw pwrpas y grŵp."
workflow:
  heading: "O bleidlais y fila i'r bil siopa"
  steps:
    - title: "Rhoi'r penderfyniad mawr i bleidlais"
      body: "Ychwanegwch bleidlais ar gyfer y penderfyniad sy'n pennu'r bil, fel pa fila. Dewiswch ddau i ddeg opsiwn, dywedwch faint o bleidleisiau y mae pob person yn eu cael, yna caewch hi pan fydd pawb wedi pleidleisio a bod yr enillydd wedi'i nodi."
      shot: S17
      shotAlt: "Pleidlais gaeedig gyda'r opsiwn buddugol wedi'i nodi a nifer y pleidleisiau wrth ymyl pob opsiwn"
    - title: "Ysgrifennu'r rhestr siopa gyda'ch gilydd"
      body: "Cychwynnwch restr a rennir, ychwanegwch yr eitemau a thiciwch nhw wrth iddynt gyrraedd y troli. Yna mae'r siopa yn mynd i mewn fel cost."
      shot: S16
      shotAlt: "Rhestr siopa a rennir gyda rhai eitemau wedi'u ticio a chyfrif cynnydd"
    - title: "Siarad am y gost lle mae'n byw"
      body: "Gwnewch sylw ar y gost ei hun, atodwch y dderbynneb ac ymatebwch gydag emoji. Mae'r sgwrs yn aros wrth ymyl y rhif y mae'n ymwneud ag ef."
      shot: S08
      shotAlt: "Cost gyda'i manylion, mân-lun derbynneb, edefyn sylwadau ac ymatebion emoji"
    - title: "Holi'r un sy'n edrych yn od"
      body: "Os yw'r grŵp wedi troi cwestiynau am gostau ymlaen, gall unrhyw un sydd wedi'i gynnwys mewn cost ddewis **Mae gen i gwestiwn**. Mae'r gost yn aros allan o'r balansau nes bod y cwestiwn wedi'i ddatrys."
      shot: S18
      shotAlt: "Y rhestr gostau gyda bathodyn Wedi'i gwestiynu a'r hidlydd Wedi'i gwestiynu yn unig"
    - title: "Gweld beth newidiodd, a phwy a'i newidiodd"
      body: "Mae'r ffrwd gweithgaredd a chloch yr hysbysiadau yn dangos beth sy'n newydd ar draws eich grwpiau. Mae hysbysiadau gwthio ar gael os hoffech eu cael."
      shot: S19
      shotAlt: "Cwymplen yr hysbysiadau gyda rhestr o weithgaredd diweddar"
