meta:
  title: "Kalkylator för att dela notan: vem är skyldig vem | Side Badger"
  description: "Vem betalade, vem är skyldig, vem betalar vem: klart på några sekunder. Dela lika, exakt eller i procent. Gratis, i webbläsaren och inget sparas eller skickas."
h1: Kalkylator för att dela notan
navLabel: Kalkylator för att dela notan
lead: Skriv in vem som betalade vad så säger kalkylatorn vem som är skyldig vem, med en kort lista över betalningar för att göra upp. Den körs i din webbläsare, sparar ingenting och flyttar inga pengar. Om gruppen vill att räkningen ska överleva fliken gör [dela utgifter](page:feature/split-expenses) och [göra upp](page:feature/settle-up) i Side Badger samma uträkningar och behåller dem.
cta:
  heading: Gillar du uträkningarna? Behåll dem.
  body: Den här kalkylatorn glömmer allt när du stänger fliken, ungefär som den som definitivt betalade förra gången. En Side Badger-grupp behåller utgifterna, uppdaterar allas saldo och registrerar betalningarna. Det är gratis, utan annonser och utan dagliga gränser.
sections:
  - heading: Så fungerar uträkningen
    body: För varje utgift räknar kalkylatorn ut allas andel. Du kan dela den lika, efter exakta belopp eller i procent, mellan de personer du väljer. Varje persons saldo är sedan vad hen betalade minus vad hen är skyldig. Ett plustecken betyder att gruppen är skyldig hen, och ett minustecken betyder att hen är skyldig gruppen. Saldona blir alltid noll tillsammans, eftersom det som en person har att få är något andra är skyldiga.
  - heading: Varför listan med betalningar är kort
    body: Ingen behöver göra upp varje kvitto för sig. När alla saldon är kända parar kalkylatorn ihop den som är skyldig mest med den som har mest att få, gör upp så mycket som en betalning kan, och fortsätter nedåt i listan tills alla står på noll. Det behövs aldrig fler betalningar än antalet personer med ett saldo minus en, och ofta färre än om man gör upp räkning för räkning. Det blir en kort lista med betalningar, men kalkylatorn lovar inte att den är den kortaste möjliga.
  - heading: Vad kalkylatorn inte gör
    items:
      - "**Hantera mer än en valuta.** Välj en och använd den för hela uträkningen. Appen håller ett separat saldo för varje valuta och kan räkna om en utgift med en aktuell växelkurs, som du kan ändra."
      - "**Spara något.** Stänger du fliken är siffrorna borta. Vill du behålla dem, kopiera länken. Den innehåller dina siffror efter #, som din webbläsare aldrig skickar till en server, och alla du skickar den till kan läsa dem."
      - "**Flytta pengar.** Den talar om vem som ska betala vem. Ni betalar varandra hur ni vill och registrerar sedan betalningen i appen om gruppen håller räkningen där."
      - "**Välja udda öret på slumpen.** När en räkning inte går jämnt ut går de överblivna ören till de första i listan, så att summorna ändå stämmer. I appen går det udda öret till en person på slumpen, så det blir inte alltid samma."
      - "**Gå över gränserna.** Kalkylatorn tar 2 till 20 personer, och en utgift kan vara på upp till 999 999,99, som i appen."
