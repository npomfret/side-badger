sections:
  - heading: "Ena valuta za vso skupino"
    body: "Če skupina o tem raje ne razmišlja, izberi valuto skupine in obrazec vanjo pretvori vsak nov strošek, po tečaju, ki ga še vedno vidiš in lahko spremeniš. To velja samo za nove in kopirane stroške. Urejanja in obstoječi stroški ostanejo, kakršni so, zato se nič že zabeleženega ne spremeni pod tabo."
  - heading: "Dolguješ evre, plačaš v funtih"
    body: "Plačano v jenih, poravnavaš v funtih? V redu. Ko beležiš plačilo, ga lahko prav tako pretvoriš, zato lahko tisti, ki dolguje evre, plača v funtih, evrsko stanje pa še vedno izide pravilno. Plačajte si, kakor želite, nato zabeležite."
  - heading: "Pravila za skupino"
    body: "Skupino omeji na valute, ki jih res uporabljate, in nastavi privzeto, da se obrazec odpre na pravi. Počitnice na Portugalskem ne potrebujejo 139 drugih možnosti ob računu za večerjo, [poroka v tujini](page:use-case/events-and-celebrations) pa verjetno potrebuje dve."
limits:
  heading: "Omejitve"
  items:
    - "Tečaj se določi ob shranitvi stroška. Stari stroški se nikoli ne revalorizirajo."
    - "Side Badger pridobi trenutni tečaj, kjer more. Vsak par ga nima zagotovljenega, tečaj pa lahko vedno vneseš sam."
    - "Samodejna pretvorba v skupini velja samo za nove in kopirane stroške, ne za urejanja ali obstoječe stroške."
    - "Vsak strošek je omejen na 999.999,99 v svoji valuti."
    - "Valut je 140. Kriptovalut in kovin med njimi ni."
    - "Side Badger beleži plačila. Denarja nikoli ne premika ali menja."
useCasesHeading: "Kje to pomaga"
faq:
  heading: "Vprašanja"
  items:
    - q: "Kateri menjalni tečaj uporabljate?"
      a: "Trenutni menjalni tečaj, pridobljen ob vnosu stroška, kjer je na voljo. Spremeniš ga lahko v tistega, ki je veljal ob menjavi, pretvorjeni znesek pa se posodobi."
    - q: "Ali se stari stroški revalorizirajo?"
      a: "Ne. Tečaj se določi ob shranitvi stroška, zato stanje ne zdrsne samo zato, ker se je premaknil trg."
    - q: "Ali podpirate kripto?"
      a: "Ne. Valut je 140, kriptovalut med njimi ni."
    - q: "Zakaj ne morem vnesti 2.000.000 indonezijskih rupij?"
      a: "Vsak strošek je omejen na 999.999,99 v svoji valuti. Vnesi ga v drugi valuti in pretvori ali ga razdeli na dva stroška."
    - q: "Ali pretvorba kaj stane?"
      a: "Ne. Pretvorba je brezplačna, kakor vse v Side Badger. Glej [cenik](page:pricing)."
    - q: "Ali moram pretvarjati?"
      a: "Ne. Valute ostanejo ločene, razen če se ti ali tvoja skupina odločite za pretvorbo, vsaka valuta pa ima svoj kratek seznam plačil."
