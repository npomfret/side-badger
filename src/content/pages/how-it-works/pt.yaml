meta:
  title: "Como funciona o Side Badger | Divide despesas de grupo em cinco passos"
  description: "Cria um grupo, convida pessoas, adiciona despesas e acerta as contas. Vê o que acontece entre “alguém pagou” e “estamos quites”, com um exemplo concreto."
h1: "Como funciona o Side Badger"
navLabel: "Como funciona"
lead: "O que acontece entre “alguém pagou” e “estamos quites”? Cinco passos, nenhuma folha de cálculo e um texugo que é sobretudo decorativo. Aqui está a viagem toda, do primeiro grupo ao último pagamento registado. Para o detalhe de qualquer passo, vê [dividir despesas](page:feature/split-expenses) e [acertar contas](page:feature/settle-up)."
cta:
  heading: "De “este pago eu” a “estamos quites”"
  body: "Cria uma conta grátis, começa um grupo e adiciona a primeira despesa. O texugo não vai julgar o recibo."
  button: "Criar uma conta grátis"
steps:
  - title: "Cria um grupo"
    body: "Faz um grupo para cada casa, viagem ou evento, para a renda nunca acabar na mesma lista do presente de casamento. Dá-lhe um nome, escolhe o nome com que as pessoas te vão ver e, se quiseres, limita as moedas que aceita. O teu painel mostra depois todos os grupos, e a tua situação em cada um, num só ecrã."
    shot: S02
    shotAlt: "A janela de criação de grupo com a secção de restrições de moeda aberta"
  - title: "Convida as tuas pessoas"
    body: "Partilha um link de entrada ou mostra um código QR e define quanto tempo dura, de 15 minutos até 5 dias. Quem entra precisa de uma conta grátis e de um e-mail verificado, e um grupo comporta até 50 pessoas. Se quiseres escolher quem entra, ativa a aprovação e um administrador deixa passar cada pessoa."
    shot: S03
    shotAlt: "A janela de convite no separador do link, com um código QR e as opções de validade"
  - title: "Adiciona despesas à medida que acontecem"
    body: "Diz quem pagou, quanto e para quem foi. Divide em partes iguais, por valores exatos ou por percentagem, e deixa de fora quem não fez parte. Adiciona a despesa e todos a veem logo, juntamente com o que mudou e quem mudou."
    shot: S05
    shotAlt: "O formulário de despesa com uma divisão por percentagem, dividindo a renda pelo tamanho dos quartos"
  - title: "Acompanha os saldos"
    body: "O Side Badger mantém um saldo corrente para cada moeda, para veres quem deve a quem de relance. Em vez de deixar toda a gente a desembaraçar uma teia de pequenas dívidas, sugere uma lista curta de pagamentos que acerta as contas do grupo."
    shot: S10
    shotAlt: "O ecrã de saldos com dívidas simplificadas em duas moedas, com Mostrar tudo ativado"
  - title: "Acerta fora da app, regista dentro"
    body: "O Side Badger nunca movimenta dinheiro. Paguem-se como preferirem e depois registem o pagamento para os saldos acompanharem, e o ecrã de todos atualiza-se sem recarregar. “Acertar” significa apenas que os saldos chegam a zero. Ninguém pode sair de um grupo enquanto deve ou tem dinheiro a receber, por isso quem vai a caminho da saída acerta primeiro."
    shot: S11
    shotAlt: "O formulário de pagamento com botões de liquidação rápida e o aviso de pagamento parcial"
requirements:
  heading: "O que precisas"
  items:
    - "Uma conta grátis. Basta um endereço de e-mail e uma palavra-passe, e verificas o e-mail antes de poderes adicionar o que quer que seja."
    - "Ter 18 anos ou mais."
    - "Um navegador moderno num telemóvel ou computador, e ligação à internet. O Side Badger não é uma app de loja de aplicações e não funciona offline."
    - "Opcionalmente, um lugar no ecrã principal. Sem loja de aplicações, porque podes adicionar o Side Badger ao ecrã principal ou ao dock e ele abre como uma app."
