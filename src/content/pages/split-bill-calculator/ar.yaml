meta:
  title: "حاسبة تقسيم الفاتورة: من يدين لمن، بلا فوضى | Side Badger"
  description: "من دفع، ومن يدين، ومن يدفع لمن: كل شيء محسوم في ثوانٍ. قسّم بالتساوي أو بمبالغ محددة أو بنسبة مئوية. مجانية، تعمل في متصفحك، ولا يُحفظ شيء ولا يُرسل."
h1: "حاسبة تقسيم الفاتورة"
navLabel: "حاسبة تقسيم الفاتورة"
lead: "اكتب من دفع مقابل ماذا، وستخبرك الحاسبة من يدين لمن، مع قائمة قصيرة من الدفعات لتسوية ذلك. تعمل في متصفحك ولا تحفظ شيئاً ولا تنقل أي مال. وإذا أرادت مجموعتك أن يبقى الحساب بعد إغلاق التبويب، فإن [تقسيم المصروفات](page:feature/split-expenses) و[تسوية الحسابات](page:feature/settle-up) في Side Badger يجريان الحسابات نفسها ويحتفظان بها."
cta:
  heading: "أعجبتك الحسابات؟ احتفظ بها."
  body: "تنسى هذه الحاسبة كل شيء حين تغلق التبويب، تماماً مثل من يقسم أنه دفع في المرة الماضية. أما مجموعة Side Badger فتحتفظ بالمصروفات، وتحدّث رصيد كل فرد، وتسجّل الدفعات. وهي مجانية، بلا إعلانات وبلا حدود يومية."
sections:
  - heading: "كيف يجري الحساب"
    body: "تحسب الحاسبة لكل مصروف حصة كل شخص. ويمكنك تقسيمه بالتساوي أو بمبالغ محددة أو بنسبة مئوية بين الأشخاص الذين تختارهم. ثم يكون رصيد كل شخص هو ما دفعه مطروحاً منه ما عليه. وتعني علامة الجمع أن المجموعة تدين له، وتعني علامة الطرح أنه يدين للمجموعة. ويكون مجموع الأرصدة صفراً دائماً، لأن كل مبلغ يُستحق لشخص يدين به أشخاص آخرون."
  - heading: "لماذا تكون قائمة الدفعات قصيرة"
    body: "لا أحد يحتاج إلى تسوية كل إيصال على حدة. فبعد أن تُعرف كل الأرصدة، تقابل الحاسبة بين من عليه أكبر مبلغ ومن له أكبر مبلغ، وتسوّي بدفعة واحدة أكبر قدر ممكن، ثم تواصل النزول في القائمة حتى يصل الجميع إلى الصفر. ولا يزيد عدد الدفعات التي تحتاجها على عدد الأشخاص أصحاب الأرصدة ناقصاً واحداً، وغالباً ما تحتاج إلى دفعات أقل من تسوية الفواتير واحدة واحدة. إنها تعطيك قائمة قصيرة من الدفعات، ولا تعد بأن تكون أقصر قائمة ممكنة."
  - heading: "ما لا تفعله الحاسبة"
    items:
      - "**التعامل مع أكثر من عملة.** اختر عملة واحدة واستخدمها في الحساب كله. أما التطبيق فيحتفظ برصيد منفصل لكل عملة، ويستطيع تحويل المصروف بسعر صرف حالي يمكنك تغييره."
      - "**حفظ أي شيء.** أغلق التبويب وتختفي الأرقام. وللاحتفاظ بها انسخ الرابط. فهو يحمل أرقامك بعد علامة #، وهي جزء لا يرسله متصفحك إلى أي خادم، ويستطيع كل من ترسل إليه الرابط قراءتها."
      - "**نقل الأموال.** تخبرك بمن ينبغي أن يدفع لمن. وتدفعون لبعضكم بالطريقة التي تناسبكم، ثم تسجّلون الدفعة في التطبيق إن كانت مجموعتكم تحتفظ بحسابها هناك."
      - "**اختيار الفلس الزائد عشوائياً.** حين لا تنقسم الفاتورة بالتساوي، تذهب الفلوس المتبقية إلى أوائل الأشخاص في القائمة، فيبقى المجموع صحيحاً. أما في التطبيق فيذهب الفلس الزائد إلى شخص واحد عشوائياً، فلا يكون الشخص نفسه دائماً."
      - "**تجاوز الحدود.** تقبل الحاسبة من 2 إلى 20 شخصاً، ويصل المصروف الواحد إلى 999,999.99 كحد أقصى، كما في التطبيق."
exampleAfter: 2
