faq:
  heading: Spørgsmål om villaen
  items:
    - q: Hvad hvis nogen melder afbud?
      a: Tag deres nætter ud, regn efter, og redigér villaudgiften, så de præcise beløb igen giver prisen. Den tidligere version bliver gemt, og ændringen vises i gruppens aktivitet, så ingen ændrer et tal i stilhed. Hvem der må redigere, afhænger af gruppens rettigheder.
    - q: Skal den, der bookede, betale mindre?
      a: Det er op til gruppen. At booke er en pligt, og grupper er uenige om, om den fortjener rabat. Uanset hvad I aftaler, så læg det ind i de præcise beløb, og skriv det i en note på udgiften eller i en kommentar ved siden af den, så ingen skal huske aftalen.
    - q: Kan vi dele rengøringsgebyrer anderledes?
      a: Ja. Indtast gebyret som en separat udgift, og giv det sin egen deling. Ligeligt passer til et fast gebyr for hele huset. Præcise beløb passer til en gruppe, der vil have gebyret til at følge nætterne også.
