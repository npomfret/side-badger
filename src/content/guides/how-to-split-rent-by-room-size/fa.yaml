faq:
  heading: "پرسش‌ها"
  items:
    - q: "اگر کسی اتاق بزرگ‌تر ولی نور کمتر داشته باشد چه؟"
      a: "متراژ فقط نقطه شروع است، پس گروه می‌تواند برای تعدیل توافق کند. یکی دو درصد از اتاق تاریک کم کنید، به بقیه بدهید و بررسی کنید که درصدها هنوز جمعشان 100 است. Side Badger هر چه توافق کنید ذخیره می‌کند و قضاوتش نمی‌کند."
    - q: "قبض‌ها را هم باید بر اساس اندازه اتاق تقسیم کرد؟"
      a: "معمولاً نه. انرژی و اینترنت را همه استفاده می‌کنند، پس تقسیم مساوی ساده‌تر است، مثل مثال بالا. اگر یکی از هم‌خانه‌ها تمام روز خانه است، گروه می‌تواند روی چیز دیگری توافق کند، مثل مبالغ دقیق. [تقسیم هزینه‌ها](page:feature/split-expenses) گزینه‌ها را توضیح می‌دهد."
    - q: "می‌توانیم بعداً تقسیم را عوض کنیم؟"
      a: "بله، برای هزینه‌های جدید. هنگام کپی کردن اجاره درصدها را عوض کنید و ماه‌های قبل همان‌طور که بودند می‌مانند. برای اصلاح یک هزینه قدیمی، اگر مجوزهای گروه اجازه بدهد آن را ویرایش کنید و اول به بقیه خانه خبر بدهید، چون مانده‌ها تغییر می‌کنند. نسخه قبلی نگه داشته می‌شود."
