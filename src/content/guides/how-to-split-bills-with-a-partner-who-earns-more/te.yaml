faq:
  heading: ప్రశ్నలు
  items:
    - q: "స్థూల జీతం వాడాలా, చేతికి వచ్చేది వాడాలా?"
      a: "గ్రూప్ నిర్ణయిస్తుంది. చేతికి వచ్చే జీతం సాధారణం, ఎందుకంటే అదే మీరు నిజంగా ఖర్చు పెట్టగల డబ్బు. స్థూల జీతం పన్ను, పెన్షన్ చందాలు, రుణ వాయిదాలు వేర్వేరు జీతాల నుంచి వేర్వేరు మొత్తాలు తీసుకుంటాయన్న విషయాన్ని పట్టించుకోదు. ఏది ఎంచుకున్నా, ఇద్దరికీ అదే కొలత వాడండి."
    - q: "Side Badgerకు మా ఆదాయాలు కనిపిస్తాయా?"
      a: "లేదు. మీరు శాతాలు మాత్రమే నమోదు చేస్తారు, జీతాలు ఎప్పుడూ కాదు. శాతాలు గ్రూప్ సభ్యులకు కనిపిస్తాయి, జంటకు అంటే మీ ఇద్దరికే."
    - q: "62/38ను అన్నిటికీ ఒకేసారి సెట్ చేయవచ్చా?"
      a: "పంపకం ప్రతి ఖర్చుకు సెట్ అవుతుంది, గ్రూప్‌కు కాదు. ఇప్పటికే 62, 38 ఉన్న ఖర్చును కాపీ చేసి, తేడా ఉన్నదాన్ని మార్చండి. ఇతర ఎంపికలను [ఖర్చుల పంపకం](page:feature/split-expenses) వివరిస్తుంది."
