faq:
  heading: "Vragen"
  items:
    - q: "Wie registreert best een betaling, de betaler of de ontvanger?"
      a: "Een betaling registreren vraagt toestemming om uitgaven te bewerken, en het formulier vraagt **Wie heeft betaald?** en **Wie heeft de betaling ontvangen?** Enkel degene die ze registreerde kan ze later bewerken, dus het is meestal het eenvoudigst als de betaler het doet, met de knop voor snelle vereffening."
    - q: "Wat als de reis in twee valuta’s liep?"
      a: "Saldi worden per valuta bijgehouden, dus een schuld in euro blijft een schuld in euro en elke valuta krijgt haar eigen korte lijst, tenzij uitgaven bij het invoeren omgerekend werden. [Meerdere valuta’s](page:guide/how-to-split-a-trip-paid-in-several-currencies) toont beide manieren."
    - q: "Moeten we tijdens de reis afrekenen of op het einde?"
      a: "Allebei kan. Elke geregistreerde betaling verandert de saldi, dus een betaling halverwege de reis telt mee voor de eindlijst. Op het einde is eenvoudiger, omdat [de hele reis](page:use-case/group-trips) dan op één plek staat."
