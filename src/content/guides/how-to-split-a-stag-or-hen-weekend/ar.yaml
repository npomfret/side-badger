faq:
  heading: "أسئلة"
  items:
    - q: "هل يدفع وصيف العريس أو وصيفة العروس أكثر؟"
      a: "فقط إذا اتفقت المجموعة. لا يمنح التطبيق أحداً دوراً خاصاً في الحسابات. وإذا كان أحدهم يتحمّل أكثر، فاختر **مبالغ دقيقة** أو **نسبة مئوية** تحت **كيفية التقسيم** وأدخل الحصص التي اتفقتم عليها."
    - q: "ماذا عن المشروبات التي لم يتناولها بعضهم؟"
      a: "أضف المشروبات مصروفاً مستقلاً وحدّد الأشخاص الذين تناولوها فقط. وإذا كان لكل شخص مقدار مختلف، فاختر **مبالغ دقيقة** واكتب حصة كل شخص. لا أحد يدفع مقابل ما لم يتناوله."
    - q: "هل يستطيع ضيف الشرف رؤية المجموعة لاحقاً؟"
      a: "نعم، بعد انتهاء المفاجأة. ادعُه، ثم يستطيع المشرف أن يجعله **مشاهداً** تحت **الأمان والأذونات** في إعدادات المجموعة. يرى المشاهد كل شيء ولا يغيّر شيئاً، فانتظر حتى لا يبقى سر. ويحتاج إلى حساب مجاني للانضمام."
