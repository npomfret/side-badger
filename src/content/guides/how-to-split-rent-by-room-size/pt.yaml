faq:
  heading: "Perguntas"
  items:
    - q: "E se alguém tiver um quarto maior, mas com menos luz?"
      a: "A área é só o ponto de partida, por isso o grupo pode combinar um ajuste. Tira um ou dois pontos ao quarto escuro, dá-os aos outros e confirma que as percentagens continuam a somar 100. O Side Badger guarda o que combinarem e não julga."
    - q: "As contas também se devem dividir pelo tamanho do quarto?"
      a: "Normalmente não. A energia e a internet são usadas por todos, por isso uma divisão em partes iguais é mais simples, como no exemplo acima. Se um colega estiver em casa o dia todo, o grupo pode combinar outra coisa, como valores exatos. [Dividir despesas](page:feature/split-expenses) explica as opções."
    - q: "Podemos mudar a divisão mais tarde?"
      a: "Sim, nas novas despesas. Muda as percentagens quando copiares a renda e os meses anteriores ficam como estavam. Para corrigir uma despesa passada, edita-a se as permissões do grupo o permitirem e avisa primeiro os colegas de casa, porque os saldos mudam. A versão anterior fica guardada."
