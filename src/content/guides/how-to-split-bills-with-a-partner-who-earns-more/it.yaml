meta:
  title: "Dividere le spese con un partner che guadagna di più | Side Badger"
  description: "Il 50/50 diventa imbarazzante se uno guadagna molto di più. Dividi le spese comuni in base allo stipendio, con i calcoli per due e senza foglio di calcolo."
h1: "Come dividere le spese con un partner che guadagna di più"
navLabel: "Partner che guadagna di più"
lead: "Somma lo stipendio netto di entrambi, calcola la quota di ciascuno sul totale e arrotonda a percentuali intere. Maya porta a casa 2.800 £ e Jon 1.700 £, quindi si dividono le spese comuni 62/38. Inserisci queste percentuali su una spesa condivisa in Side Badger, poi copiala ogni volta che torna la stessa spesa."
cta:
  heading: "Fai il conto una volta sola"
  body: "Crea un account gratuito, avvia un gruppo per voi due e inserisci l'affitto con le vostre percentuali. L'affitto del mese prossimo è una copia. Vuoi prima fare un giro? Vedi [come funziona](page:how-it-works), oppure [cosa include il gratuito](page:pricing)."
sections:
  - heading: "Due stipendi, una casa, un educato silenzio"
    body: "Maya e Jon vivono insieme. Maya porta a casa 2.800 £ al mese e Jon ne porta a casa 1.700 £. Per due anni hanno diviso tutto 50/50, perché era semplice e nessuno dei due voleva essere il primo a tirare fuori l'argomento. Poi Jon ha guardato l'affitto da solo. La metà di 1.400 £ è 700 £, cioè un quarto dello stipendio netto di Maya e il 41% di quello di Jon. Nessuno era stato ingiusto. Nessuno aveva fatto il conto. Molte [coppie](page:use-case/couples) ci arrivano prima o poi. Davanti a una cena d'asporto hanno concordato che le spese comuni dovessero pesare in modo simile su ciascun stipendio."
  - heading: "Il metodo, con i calcoli in vista"
    body: "Quattro passaggi, una calcolatrice e una conversazione che prima o poi avreste fatto comunque."
    items:
      - "**Concordate cosa conta come stipendio.** Maya e Jon usano lo stipendio netto, i soldi che arrivano in banca ogni mese. Insieme fanno 2.800 £ + 1.700 £ = 4.500 £."
      - "**Calcolate la quota di ciascuno.** Quella di Maya è 2.800 ÷ 4.500, cioè 62,2%. Quella di Jon è 1.700 ÷ 4.500, cioè 37,8%."
      - "**Arrotondate a percentuali intere.** 62,2% diventa 62 e 37,8% diventa 38. Con due persone, arrotonda una cifra e sottraila da 100 per ottenere l'altra, e il totale fa sempre 100."
      - "**Controllate cosa significa.** Sull'affitto di 1.400 £, Maya paga 868 £ (62%) e Jon paga 532 £ (38%). È circa il 31% dello stipendio netto di ciascuno. Metà a testa avrebbe preso il 25% dello stipendio di Maya e il 41% di quello di Jon."
  - heading: "Leggere il mese"
    body: "Maya ha pagato l'affitto di 1.400 £ e Jon le altre 216 £. La quota di Maya per il mese è 868,00 £ + 111,60 £ + 18,00 £ = 997,60 £, e lei ha pagato 1.400 £, quindi deve ricevere 402,40 £. La quota di Jon è 532,00 £ + 68,40 £ + 18,00 £ = 618,40 £, e lui ha pagato 216 £, quindi deve 402,40 £. Side Badger suggerisce un solo pagamento, da Jon a Maya, di 402,40 £, e una volta fatto lo si registra con [Salda](page:feature/settle-up). Con il 50/50, lo stesso mese avrebbe visto Jon pagare 592,00 £ a Maya."
  - heading: "Impostalo in Side Badger"
    body: "Dieci minuti, quasi tutti passati sulle percentuali."
    items:
      - "**Crea il gruppo.** Nella dashboard scegli **Crea gruppo** e dagli il nome della casa. Scegli **Invita altri** e manda a Jon il link o il codice QR. Lui accede o crea un account gratuito e sceglie il nome con cui vuole essere visto in questo gruppo. Solo i membri possono vedere un gruppo, quindi questo è solo per voi due."
      - "**Aggiungi l'affitto.** Scegli **Aggiungi spesa**. Inserisci la descrizione e l'importo, e sotto **Chi ha pagato?** scegli Maya. Lascia entrambe le persone sotto **Dividi tra**, poi sotto **Come dividere** scegli **Percentuale** e digita 62 e 38. Il modulo ti avvisa se le percentuali non sommano a 100. Scegli **Salva spesa**."
      - "**Aggiungi le altre bollette.** Energia e internet si inseriscono allo stesso modo: le ha pagate Jon e la divisione è sempre 62 e 38. La cena d'asporto è una spesa a parte, con **Come dividere** lasciato su **Uguale**."
      - "**Copiala il mese prossimo.** Apri l'affitto del mese scorso e scegli **Copia spesa**. La copia mantiene chi ha pagato, l'importo e la divisione, e prende la data di oggi. Cambia l'importo se l'affitto è cambiato, poi scegli **Crea copia**. La bolletta dell'energia funziona allo stesso modo."
      - "**Controlla chi deve cosa a chi.** La sezione **Saldi** lo mostra e suggerisce una breve lista di pagamenti. Pagatevi come vi fa più comodo, poi registrate il pagamento con **Salda**."
  - heading: "50/50, in base allo stipendio, o spesa per spesa"
    body: "Non esiste una risposta giusta, solo quella con cui potete convivere entrambi. Tre scelte comuni."
    items:
      - "**Metà a testa per tutto.** La più facile da mantenere, e va bene per le coppie con stipendi simili."
      - "**In base allo stipendio per tutto ciò che è condiviso.** Quello che fanno Maya e Jon. Una conversazione, una coppia di percentuali."
      - "**Spesa per spesa.** Affitto e bollette in base allo stipendio, vacanze e sfizi 50/50 o come concordate, e ogni spesa riceve la regola che le si addice."
  - heading: "Concordate cosa conta come condiviso"
    body: "Le discussioni di solito riguardano la lista, non le percentuali. Affitto, energia, internet, la spesa settimanale e il divano contano come spese condivise nella maggior parte delle case. L'abbonamento alla palestra di Maya e quello alle partite di Jon forse no. Concordate la lista una volta, scrivetela e mettete nel gruppo solo i costi condivisi."
  - heading: "La cena d'asporto resta 50/50, di proposito"
    body: "Gli sfizi sono piccoli e facoltativi, e nessuno dovrebbe aver bisogno di una calcolatrice per ordinare la pizza. In Side Badger la cena d'asporto è una spesa come un'altra. Jon paga 36 £, **Come dividere** resta su **Uguale** e ognuno dei due deve 18 £."
  - heading: "Quando lo stipendio di qualcuno cambia"
    body: "Un aumento, un nuovo lavoro o un periodo lontano dal lavoro cambiano il calcolo. Calcola le nuove percentuali allo stesso modo e usale dalla spesa successiva. Le spese precedenti restano com'erano. Copia l'affitto del mese scorso, cambia le percentuali, poi scegli **Crea copia**. Per correggerne una già inserita, modificala se i permessi del gruppo lo consentono, e avvisa prima il tuo partner, perché i saldi cambiano. La versione precedente viene conservata. Concordate quando ricalcolare, per esempio una volta all'anno, e saldate i conti prima di cambiare, così la vecchia divisione si chiude con un conteggio pulito."
  - heading: "Cosa Side Badger non fa qui"
    items:
      - "Non chiede mai quanto guadagna qualcuno e non calcola le percentuali. Sei tu a digitare le cifre concordate."
      - "Non può impostare una divisione predefinita per tutto il gruppo. Le percentuali vanno su ogni spesa, quindi copia una spesa che le ha già."
      - "Non ha conti ricorrenti, quindi ogni volta copi l'affitto del mese scorso."
      - "Non sposta mai denaro. Vi pagate come vi fa più comodo e lo registrate."
