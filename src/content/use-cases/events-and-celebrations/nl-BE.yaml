featuresHeading: "De functies die dit gebruikt"
faq:
  heading: "Vragen"
  items:
    - q: "Kunnen gasten de groep zien zonder mee te doen?"
      a: "Nee. Mensen doen mee met een link of QR-code en een gratis account, dus ze kunnen de groep zien zodra ze erin zitten."
    - q: "Kan Side Badger het geld innen?"
      a: "Nee. Side Badger houdt de rekening bij en verplaatst nooit geld. Betaal elkaar zoals je wilt en registreer dan de betaling. Het is gratis, zonder advertenties en zonder dagelijkse limieten; zie [prijzen](page:pricing)."
    - q: "Kunnen stemmen anoniem zijn?"
      a: "Ja. Wanneer je een peiling maakt, kun je verbergen wie waarvoor stemde. De instellingen kunnen enkel voor de eerste stem nog veranderen."
    - q: "Kunnen mensen verschillende bedragen bijleggen?"
      a: "Ja. Verdeel een uitgave op exacte bedragen, zodat het aandeel van elke persoon het afgesproken bedrag is, of laat de mensen weg die er niet bij betrokken waren."
    - q: "Kan een organisator de boekhouding bijhouden?"
      a: "Ja. Gebruik de preset voor een beheerde groep, zodat enkel makers en beheerders uitgaven wijzigen en beheerders nieuwe leden goedkeuren."
