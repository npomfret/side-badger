meta:
  title: "قسّم الفواتير مع شريكك، 50/50 أو بحسب الدخل | Side Badger"
  description: "تقاسَما التكاليف المملة دون أن يتحول موعد العشاء إلى مراجعة مالية فصلية. قسّما 50/50 أو بحسب الدخل أو فاتورة بفاتورة، واعرفا من يدين لمن. مجاني."
h1: "تقاسَما التكاليف كزوجين، بإنصاف"
navLabel: "الأزواج"
lead: "تقاسَما التكاليف المملة دون أن يتحول موعد العشاء إلى مراجعة مالية فصلية. يحتفظ Side Badger بحساب واحد جارٍ للإيجار والفواتير والتسوق **للأزواج** الذين يتشاركون بيتاً وأريكة وذكرى غامضة عمّن دفع فاتورة الإنترنت. قسّماها 50/50 أو بحسب الدخل أو فاتورة بفاتورة، واعرفا من يدين لمن."
cta:
  heading: "ابدأ مجموعة لاثنين"
  body: "أنشئ حساباً، وأنشئ مجموعة، وأرسل إلى شريكك رابط الدعوة. ويمكن أن تكون وجبة الليلة الجاهزة أول مصروف."
scenario:
  heading: "العدل لا يعني بالضرورة 50/50"
  body: "يتشارك سام وأليكس بيتاً. يكسب سام أكثر، فاتفقا على أن يتحمل سام 60% من الإيجار وأليكس 40%. سام يدفع للمالك، وأليكس يتسوّق، وكلاهما شبه متأكد أن كل شيء يتعادل في النهاية. وعبارة «شبه متأكد» هذه هي ما يحوّل ملاحظة على هاتف أحدهما إلى خلاف دائم. لذا أنشئ مجموعة لكما، واختر الاسم الذي تريد أن يراه شريكك، وأرسل له رابط الدعوة أو رمز QR. أضف كل تكلفة حين تحدث، وحدّد من دفع وكيف تُقسَّم، ودع المجموعة تحتفظ بالحساب. وأنشئ مجموعة منفصلة لكل عطلة (انظر [رحلات المجموعات](page:use-case/group-trips))، لتبقى تذاكر الطيران بعيدة عن البقالة."
sections:
  - heading: "50/50 أو بحسب الدخل أو فاتورة بفاتورة"
    body: "لا يوجد تقسيم عادل للجميع، بل التقسيم الذي يتفق عليه كلاكما، ويُفضَّل قبل أول فاتورة لا بعد أول تنهيدة. وهذه هي الطرق الثلاث المعتادة."
    items:
      - "**50/50.** اختر **بالتساوي** فيدين كل منكما بالنصف. وهو يناسب التكاليف المشتركة حين تتقارب دخولكما، ولا يحتاج إلى أي حساب."
      - "**بحسب الدخل.** إذا كان أحدكما يكسب أكثر، فقسّما بحسب حصة كل واحد من المال الداخل. اتفقا أولاً على ما يُحسب (صافي الراتب هو الخيار الشائع)، واجمعا الرقمين وقسّما رقم كل منكما على المجموع. وإذا كان أحدكما يتقاضى ثلاثة أجزاء مقابل جزأين للآخر، فهذا 3 ÷ (3 + 2) = 60%، فيغطي أحدكما 60% والآخر 40%. قرّبا إلى نسب بأعداد صحيحة وأدخلاها تحت **نسبة مئوية**، حيث يجب أن يكون مجموعها 100. ولا مكان لإدخال الراتب، فلا تكتبان إلا النسب."
      - "**فاتورة بفاتورة.** لكل مصروف تقسيمه الخاص، فيمكنكما الخلط: الإيجار بحسب الدخل، والبقالة 50/50، وهدية مشتركة بـ**مبالغ دقيقة** إذا اختار كل منكما ما سيضعه."
      - "**حين يتغيّر الراتب،** استخدما النسب الجديدة من المصروف التالي. وتحتفظ المصروفات السابقة بالتقسيم الذي أُدخلت به. ولرؤية الحسابات على كشوف رواتب حقيقية، اقرأ [كيف تقسّم الفواتير مع شريك يكسب أكثر](page:guide/how-to-split-bills-with-a-partner-who-earns-more)."
  - heading: "الجرد الشهري"
    body: "مرة في الشهر، أو كلما بدأت الأرقام تحكّ لكما، افتحا المجموعة وتحققا من **الأرصدة**. مع اثنين منكما لا تكون هناك أبداً إلا دفعة واحدة بكل عملة، ممن يدين إلى من له. خذ شهر سام وأليكس. دفع سام إيجار £1,500، وحصة أليكس 40% منه هي £600. ودفع أليكس £90 للبقالة، مقسّمة بالتساوي، فحصة سام نصفها، £45. يوازن Side Badger أحدهما بالآخر، £600 ناقص £45، فيدفع أليكس لسام £555. ادفعا بالطريقة التي تشاءان، بتحويل مصرفي أو نقداً أو بمعروف مستحق، ثم سجّلاه تحت **تسوية** ليعود الرصيد إلى الصفر. لا توجد فواتير متكررة، فانسخا إيجار الشهر الماضي وغيّرا التاريخ وامضيا. ولا ينقل Side Badger المال ولا يرسل تذكيرات، فمهمة التذكير تبقى لكما."
  - heading: "أنتما الاثنان فقط"
    body: "مجموعة الاثنين فيها عضوان، ولا يرى المجموعة إلا أعضاؤها. ينضم شريكك برابط الدعوة أو رمز QR. ويمكن أن تدوم صلاحية الرابط من 15 دقيقة إلى 5 أيام، فاختر أقصر مدة تمنح شريكك وقتاً لاستخدامه. وإنشاء رابط جديد لا يلغي الروابط القديمة، فلا تتركها في دردشة فيها أشخاص آخرون. ومن يستخدم رابطاً ما زال صالحاً يستطيع الانضمام، فإن أردت اليقين فشغّل الموافقة ليسمح مشرف لكل شخص بالدخول. ويحتاج شريكك إلى حساب خاص به، وهو مجاني."
