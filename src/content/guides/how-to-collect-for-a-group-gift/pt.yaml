faq:
  heading: "Perguntas"
  items:
    - q: "E se juntarmos mais do que o presente custa?"
      a: "Os valores exatos têm de somar o preço, por isso reduz as partes até somarem. Ou põe o extra em algo real, como flores, e introduz isso como segunda despesa, como o cartão de parabéns e o embrulho do exemplo."
    - q: "Alguém pode contribuir sem entrar no grupo?"
      a: "Não, se quiseres a pessoa na conta. Todos os que estão na divisão precisam de uma conta grátis e de estar no grupo. Para quem só tem dinheiro vivo, a Priya podia ficar com ele e introduzir o presente pelo que o grupo ainda deve. Por exemplo, se o Sam lhe desse 40 £ em dinheiro, ela introduzia 200 £ e dividia 60, 60 e 80 entre si, o Omar e a Lena."
    - q: "A sondagem pode decidir quanto cada pessoa dá?"
      a: "Não. Uma sondagem combina um valor para o grupo todo, como o orçamento. A parte de cada pessoa é convosco: combinem-na e escrevam-na na despesa como **Valores exatos**."
