    - label: インターネット
      payer: aisha
      amount: 36
      split:
        method: equal
faq:
  heading: よくある質問
  items:
    - q: 部屋の広さと収入、どちらが公平ですか？
      a: どちらが常に公平、ということはありません。部屋の広さは、寝るスペースに対して払うルームメイトに向いています。収入は、カップルや、収入が大きく違う友だち同士に向いています。決めるのは最初の家賃の日の前で、あとではありません。
    - q: 請求書も同じ分け方にすべきですか？
      a: ルームメイトなら、たいていは違います。エネルギーもインターネットも全員が使うので、例のように均等のほうがシンプルです。収入で分ける場合は、計算機が請求書にも家賃と同じ割合を使います。
    - q: 平方フィートも使えますか？
      a: はい。ft²を選び、広さを平方フィートで入力してください。単位はただのラベルで、全員が同じ単位で入力していれば、負担割合は変わりません。
    - q: 計算機は無料ですか？
      a: はい。無料。広告なし。1日の制限なし。アカウントも不要です。
