meta:
  title: "Μοιραστείτε τα έξοδα πάρτι, γάμων και κοινών δώρων"
  description: "Μοιραστείτε τα έξοδα ενός πάρτι, γάμου ή κοινού δώρου όταν οι άνθρωποι συνεισφέρουν διαφορετικά ποσά. Ψηφίστε το πλάνο, χωρίστε με ακριβή ποσά και δείτε ποιος χρωστά σε ποιον."
h1: "Μοιραστείτε τα έξοδα πάρτι, γάμων και κοινών δώρων"
navLabel: "Εκδηλώσεις και γιορτές"
lead: "Μοιραστείτε προκαταβολές, διακοσμήσεις και ομπρέλες έκτακτης ανάγκης. Το πλάνο θέσεων αφήστε το σε κάποιον πιο τολμηρό. Το Side Badger κρατά σε ένα μέρος **ποιος συνεισέφερε τι**, ώστε να διασκεδάσει και ο διοργανωτής."
cta:
  heading: "Ξεκινήστε με την επόμενη γιορτή"
  body: "Δημιουργήστε λογαριασμό, φτιάξτε μια ομάδα για την εκδήλωση και στείλτε τον σύνδεσμο πρόσκλησης. Το Side Badger είναι δωρεάν, χωρίς διαφημίσεις και χωρίς ημερήσια όρια."
  button: "Δημιουργία δωρεάν λογαριασμού"
scenario:
  heading: "Όλοι συνεισφέρουν, όχι πάντα το ίδιο ποσό"
  body: "Κάποιος πληρώνει την προκαταβολή της αίθουσας, κάποιος άλλος αγοράζει την τούρτα και ένας τρίτος πληρώνει το κοινό δώρο με τη δική του κάρτα. Μερικοί καλεσμένοι έρχονται σε όλα και μερικοί μόνο στο δείπνο. Το να κρατάτε δίκαιο λογαριασμό για όλα αυτά σε ένα νήμα συνομιλίας είναι δουλειά για την οποία κανείς δεν έκανε αίτηση. Μια ομάδα στο Side Badger τα κρατά όλα, όποιο κι αν είναι το μείγμα ποσών, και δείχνει στον καθένα τι χρωστά ή τι του οφείλεται. Δείτε το [πώς λειτουργεί](page:how-it-works) για τα βασικά ή διαβάστε παρακάτω για μια εκδήλωση."
sections:
  - heading: "Αποφασίστε μαζί"
    body: "Πριν κινηθούν χρήματα, βάλτε την επιλογή σε μια **δημοσκόπηση**. Προσθέστε έως 10 επιλογές, όπως δύο αίθουσες ή τρεις ιδέες για δώρο, και αφήστε όλους να ψηφίσουν. Μπορείτε να κρύψετε ποιος ψήφισε τι, ώστε κάθε επιλογή να έχει δίκαιη ευκαιρία, και ο νικητής εμφανίζεται όταν κλείσει η δημοσκόπηση. Κανείς δεν χρειάζεται να ξαναδιαβάσει σαράντα μηνύματα για να μάθει τι αποφασίστηκε."
  - heading: "Ποιος συμμετέχει σε τι"
    body: "Δεν πληρώνουν όλοι το ίδιο και δεν συμμετέχουν όλοι σε κάθε κόστος. Χωρίστε ένα έξοδο εξίσου, με ποσοστά ή με **ακριβή ποσά**, ώστε το μερίδιο του καθενός να είναι το ποσό που συμφωνήσατε. Αφήστε έξω όποιον δεν συμμετείχε, όπως τους καλεσμένους που έχασαν το δείπνο ή τους φίλους που δεν μπήκαν στο δώρο. Κάθε έξοδο έχει έναν πληρωτή και όλοι οι άλλοι στον διαχωρισμό του οφείλουν το μερίδιό τους. Οι λεπτομέρειες είναι στη σελίδα [διαχωρισμός εξόδων](page:feature/split-expenses)."
  - heading: "Κρατήστε τα χαρτιά"
    body: "Προσθέστε σημειώσεις σε ένα έξοδο, όπως τι κάλυπτε το κόστος. Τα σχόλια μένουν **δίπλα στο έξοδο** στο οποίο αναφέρονται, οπότε η ερώτηση «η τούρτα ήταν £45 ή £54;» και η απάντησή της ζουν στο ίδιο μέρος. Τα σχόλια φτάνουν τους 500 χαρακτήρες, αρκετούς για μια ερώτηση σχετικά με μια προκαταβολή."
  - heading: "Έλεγχος για τον διοργανωτή"
    body: "Η ανοιχτή συνεργασία αφήνει κάθε μέλος να προσθέτει και να επεξεργάζεται έξοδα, κάτι που είναι εντάξει για ένα μικρό δώρο. Για έναν γάμο ή ένα μεγαλύτερο πάρτι, διαλέξτε την προεπιλογή **Διαχειριζόμενη ομάδα**. Οι διαχειριστές εγκρίνουν κάθε νέο μέλος και μόνο οι δημιουργοί και οι διαχειριστές αλλάζουν έξοδα. Προσκαλέστε άτομα με σύνδεσμο ή κωδικό QR· με ενεργή την έγκριση, ένας διαχειριστής αφήνει μέσα κάθε άτομο, ώστε η λίστα καλεσμένων να μένει λίστα καλεσμένων. Όταν τελειώσει η εκδήλωση, κλειδώστε την ομάδα ώστε τα νούμερα να μείνουν στη θέση τους."
  - heading: "Τακτοποιηθείτε μετά το πάρτι"
    body: "Μόλις φτάσει το τελευταίο τιμολόγιο, τα υπόλοιπα δείχνουν **ποιος χρωστά σε ποιον** και το Side Badger προτείνει μια σύντομη λίστα πληρωμών που τακτοποιεί όλους. Πληρώστε ο ένας τον άλλον όπως θέλετε και μετά καταγράψτε την πληρωμή στην ομάδα. Το Side Badger δεν μετακινεί ποτέ χρήματα, οπότε η ομάδα κρατά τον λογαριασμό ενώ οι μεταφορές γίνονται στις δικές σας τραπεζικές εφαρμογές. Η σελίδα [εκκαθάριση](page:feature/settle-up) δείχνει πώς ένας κόμπος γίνεται μια σύντομη λίστα."
exampleAfter: 5
