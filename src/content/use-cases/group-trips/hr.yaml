featuresHeading: "Na čemu putovanje stoji"
faq:
  heading: "Pitanja"
  items:
    - q: "Mogu li se izostaviti oni koji su preskočili večeru?"
      a: "Da. Odaberi tko je sudjelovao u svakom trošku i samo se njima naplaćuje."
    - q: "Radi li bez signala?"
      a: "Ne. Side Badger treba vezu, pa dodaj troškove kad se vratiš na wifi."
    - q: "Treba li svatko nešto instalirati?"
      a: "Ne. Radi u pregledniku. Pošalji poveznicu za poziv i ljudi se pridružuju sa svojih telefona."
    - q: "Koji tečaj koristi?"
      a: "Aktualni tečaj pri unosu troška ili tvoj vlastiti ako si dobio drukčiji. Tečaj se utvrđuje kad se trošak spremi, pa se stari troškovi nikad ne revaloriziraju."
    - q: "Možemo li zamrznuti grupu nakon putovanja?"
      a: "Da. Administrator može zaključati grupu da brojevi ostanu."
    - q: "Postoji li ograničenje iznosa?"
      a: "Da. 999.999,99 po trošku, u njegovoj valuti."
