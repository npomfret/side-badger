faq:
  heading: Frågor
  items:
    - q: Tänk om någon har ett större rum men mindre ljus?
      a: Golvytan är bara startpunkten, så gruppen kan komma överens om en justering. Dra av en procentenhet eller två från det mörka rummet, ge dem till de andra och kontrollera att procenten fortfarande blir 100 tillsammans. Side Badger sparar det ni kommer överens om och dömer inte.
    - q: Ska räkningarna också delas efter rumsstorlek?
      a: Oftast inte. El och bredband används av alla, så en lika delning är enklare, som i exemplet ovan. Om en rumskamrat är hemma hela dagen kan gruppen komma överens om något annat, till exempel exakta belopp. [Dela utgifter](page:feature/split-expenses) går igenom alternativen.
    - q: Kan vi ändra delningen senare?
      a: Ja, för nya utgifter. Ändra procenten när du kopierar hyran så förblir tidigare månader som de var. För att rätta en tidigare utgift redigerar du den om gruppens behörigheter tillåter det, och säger till i hushållet först, eftersom saldona ändras. Den tidigare versionen sparas.
