sections:
  - heading: "Un arian cyfred i'r grŵp cyfan"
    body: "Os byddai'n well gan eich grŵp beidio â meddwl am y peth, dewiswch arian cyfred grŵp ac mae'r ffurflen yn trosi pob cost newydd iddo, ar gyfradd y gallwch ei gweld a'i newid o hyd. Mae hyn yn berthnasol i gostau newydd a rhai a gopïwyd yn unig. Gadewir golygiadau a chostau presennol fel y maent, felly nid oes dim sydd eisoes wedi'i gofnodi yn newid oddi tanoch."
  - heading: "Yn ddyledus mewn ewros, talu mewn punnoedd"
    body: "Wedi talu mewn yen, yn setlo mewn punnoedd? Iawn. Pan fyddwch yn cofnodi taliad gallwch ei drosi hefyd, fel y gall pwy bynnag sy'n ddyledus mewn ewros dalu mewn punnoedd ac mae'r balans ewro yn dal i ddod allan yn iawn. Talwch eich gilydd sut bynnag y dymunwch, yna cofnodwch ef."
  - heading: "Rheolau i'r grŵp"
    body: "Cyfyngwch grŵp i'r arian cyfred rydych chi'n ei ddefnyddio mewn gwirionedd, a gosodwch ragosodiad fel bod y ffurflen yn agor ar yr un iawn. Does dim angen 139 o ddewisiadau eraill wrth ymyl y bil swper ar wyliau ym Mhortiwgal, ac mae [priodas dramor](page:use-case/events-and-celebrations) yn debygol o fod angen dau."
limits:
  heading: "Cyfyngiadau"
  items:
    - "Mae'r gyfradd yn sefydlog pan gaiff y gost ei chadw. Ni chaiff hen gostau byth eu hailbrisio."
    - "Mae Side Badger yn nôl cyfradd gyfredol lle bo modd. Nid oes sicrwydd o un ar gyfer pob pâr, a gallwch bob amser deipio'r gyfradd eich hun."
    - "Mae trosi awtomatig y grŵp yn berthnasol i gostau newydd a rhai a gopïwyd yn unig, nid i olygiadau na chostau presennol."
    - "Mae pob cost wedi'i chyfyngu i 999,999.99 yn ei harian cyfred ei hun."
    - "Mae 140 o arian cyfred. Nid yw arian crypto a metelau yn eu plith."
    - "Mae Side Badger yn cofnodi taliadau. Nid yw byth yn symud nac yn cyfnewid arian."
useCasesHeading: "Lle mae hyn yn helpu"
faq:
  heading: "Cwestiynau"
  items:
    - q: "Pa gyfradd gyfnewid ydych chi'n ei defnyddio?"
      a: "Cyfradd gyfnewid gyfredol, wedi'i nôl pan fyddwch yn rhoi'r gost lle bo un ar gael. Gallwch ei newid i'r gyfradd a gawsoch mewn gwirionedd, ac mae'r swm wedi'i drosi yn diweddaru."
    - q: "Ydy hen gostau'n cael eu hailbrisio?"
      a: "Nac ydyn. Mae'r gyfradd yn sefydlog pan gaiff y gost ei chadw, felly nid yw balans yn symud am fod y farchnad wedi symud."
    - q: "Ydych chi'n cefnogi crypto?"
      a: "Nac ydym. Mae 140 o arian cyfred, ac nid yw arian crypto yn eu plith."
    - q: "Pam na allaf roi 2,000,000 rwpia?"
      a: "Mae pob cost wedi'i chyfyngu i 999,999.99 yn ei harian cyfred ei hun. Rhowch hi mewn arian cyfred arall a throsi, neu ei rhannu'n ddwy gost."
    - q: "Ydy trosi yn costio unrhyw beth?"
      a: "Nac ydy. Mae trosi am ddim, fel gweddill Side Badger. Gweler [prisiau](page:pricing)."
    - q: "Oes rhaid i mi drosi?"
      a: "Nac oes. Mae arian cyfred yn aros ar wahân oni bai eich bod chi neu eich grŵp yn dewis trosi, ac mae pob arian cyfred yn cael ei restr fer ei hun o daliadau."
