meta:
  title: "Költségmegosztó kalkulátor: ki kinek tartozik | Side Badger"
  description: "Ki kinek tartozik, másodpercek alatt: egyenlően, pontosan vagy százalékosan osztva. Ingyenes, a böngésződben fut, semmit nem ment és nem küld el."
h1: "Költségmegosztó kalkulátor"
navLabel: "Költségmegosztó kalkulátor"
lead: "Írd be, ki mit fizetett, és a kalkulátor megmondja, ki kinek tartozik, egy rövid kifizetéslistával, amely mindent rendez. A böngésződben fut, semmit nem ment, és nem mozgat pénzt. Ha a csoportodnak az kell, hogy a számolás a fül bezárása után is megmaradjon, a Side Badger [költségfelosztása](page:feature/split-expenses) és [elszámolása](page:feature/settle-up) ugyanezeket a számításokat végzi, és meg is őrzi őket."
cta:
  heading: "Tetszenek a számok? Őrizd meg őket."
  body: "Ez a kalkulátor mindent elfelejt, amint bezárod a fület, nagyjából úgy, mint az, aki biztosan fizetett legutóbb. Egy Side Badger-csoport megőrzi a költségeket, frissíti mindenki egyenlegét, és rögzíti a kifizetéseket. Ingyenes, hirdetések és napi korlátok nélkül."
sections:
  - heading: "Hogyan működik a számítás"
    body: "Minden költségnél a kalkulátor kiszámolja mindenki részét. Egyenlően, pontos összegek szerint vagy százalékosan oszthatod fel, az általad kiválasztott emberek között. Mindenki egyenlege ezután az, amennyit fizetett, mínusz amennyivel tartozik. A plusz jel azt jelenti, hogy a csoport tartozik neki, a mínusz jel pedig azt, hogy ő tartozik a csoportnak. Az egyenlegek összege mindig nulla, mert amennyivel az egyik embernek tartoznak, azzal mások tartoznak."
  - heading: "Miért rövid a kifizetéslista"
    body: "Senkinek nem kell minden nyugtát külön rendeznie. Amint minden egyenleg ismert, a kalkulátor összepárosítja azt, aki a legtöbbel tartozik, azzal, akinek a legtöbbel tartoznak, annyit rendez, amennyit egyetlen kifizetés elbír, és halad tovább a listán lefelé, amíg mindenki nullán nem áll. Soha nem kell több kifizetés, mint ahány embernek van egyenlege, mínusz egy, és gyakran kevesebb is elég, mint ha számláról számlára rendeznétek. Rövid kifizetéslistát ad, és nem ígéri, hogy a lehető legrövidebb."
  - heading: "Amit a kalkulátor nem csinál"
    items:
      - "**Nem kezel több pénznemet.** Válassz egyet, és azt használd az egész számításhoz. Az alkalmazás pénznemenként külön egyenleget vezet, és egy költséget át tud váltani egy aktuális árfolyamon, amelyet módosíthatsz."
      - "**Nem ment semmit.** Ha bezárod a fület, a számok eltűnnek. Ha meg akarod őrizni őket, másold ki a linket. A számaid a # után vannak benne, amit a böngésződ sosem küld el a szervernek, és akinek elküldöd a linket, az el is olvashatja őket."
      - "**Nem mozgat pénzt.** Megmondja, ki kinek fizessen. Ti fizettek egymásnak, ahogy akartok, aztán rögzítsd a kifizetést az alkalmazásban, ha a csoportod ott vezeti a számolást."
      - "**Nem választja véletlenszerűen a felesleges fillért.** Ha egy számla nem osztható egyenletesen, a megmaradt fillérek a lista első embereihez kerülnek, így az összegek továbbra is kijönnek. Az alkalmazásban a felesleges fillér véletlenszerűen egy emberhez kerül, így nem mindig ugyanahhoz."
      - "**Nem lépi túl a korlátokat.** A kalkulátor 2–20 embert kezel, és egy költség legfeljebb 999 999,99 lehet, ahogy az alkalmazásban."
exampleAfter: 2
