meta:
  title: "Wetin to do when person dispute shared expense | Side Badger"
  description: "Skip di pointed message. Question di expense instead and e go leave everybody balances while una dey talk. We work am through with £45 party wine."
h1: "Wetin to do when person dispute shared expense"
navLabel: "Expense wey dem dispute"
lead: "Raise question on di expense instead of to send pointed message. While di question dey open, di whole expense go stay out of everybody balances. Talk am through for di comments, edit di split if di group agree, and make di person wey ask, or admin, close di question."
cta:
  heading: "Ask di awkward question politely"
  body: "Create free account, start group for di flat and ask admin to switch on expense questions, wey dey off until somebody turn dem on. You wan see di tour first? See [how e dey work](page:how-it-works) or [wetin free cover](page:pricing)."
sections:
  - heading: "Three housemates and £45 wine"
    body: "After di party, Tom add di wine to di flat group. Na £45, Tom pay am, dem split am equal between Tom, Priya and Aisha, wey be £15 each. Aisha no dey drink. Tom buy am for di party, and di party na for di [flat](page:use-case/housemates), so Tom no do anything wrong. Aisha no wrong to ask too. Nobody here na villain. Na just £15 wine dey dispute and plenty ways dey to make am awkward. Pointed message to di house na one. Question on di expense na gentler one."
  - heading: "Wetin question dey do"
    body: "Aisha open di expense and raise question. Di whole expense go drop out of everybody balances, no be only Aisha share, and nothing else go change. Di big shop (£84) and di cleaner (£60) still count, wey be £28 + £20 = £48 each. So while di wine dey on hold, Aisha owe £48, dem owe Tom £36 and dem owe Priya £12. Whatever di flat decide about di wine, nobody balance include am for now. Anybody else wey dey inside di expense fit raise im own question too. Di wine go go back into di balances only when di last open question on am close, and na di person wey ask or admin fit close question."
  - heading: "Talk am through, then fix am"
    body: "Aisha question land for di expense comments, so di replies go sit right underneath am. [Plan am together](page:feature/plan-together) get more about comments and questions. Tom and Priya read am and di flat chat. Dem decide say di wine na Tom and Priya own, because dem drink am. Another flat fit keep di three-way split, or agree something for between, and dat one go fine too. Side Badger dey store wetin una agree and e no get opinion about wine. Tom edit di expense so dem split am equal between Tom and Priya, wey be £22.50 each (£45 ÷ 2). Aisha no dey inside again, so Aisha question go with di old version and di wine join di balances again. Di earlier version dey kept."
  - heading: "Reading di result"
    body: "With di wine back inside, dem owe Tom £58.50, Priya owe £10.50 and Aisha owe £48. Side Badger suggest two payments, both to Tom. Aisha £48 no change from when di wine dey on hold, because Aisha no dey inside di wine. Priya don change from dem owe am £12 to e owe £10.50, wey be im £22.50 half of di wine. If di three-way split stand, Aisha for owe £63 (£28 + £20 + £15). Di whole disagreement worth just £15. Pay each other anyhow you like, then record each payment under **Settle up**. [Settle up](page:feature/settle-up) cover di rest."
  - heading: "Word am so people go still dey talk to you"
    body: "Aisha question: “I no drink any of di wine. We fit look di split?” E short, e name di expense and e ask instead of accuse. Few habits dey help."
    items:
      - "**Ask about di expense, no be di person.** “We fit check di split on di wine?” dey start conversation. “Why dem charge me for your wine?” dey start di other kind."
      - "**Talk wetin you wan make happen.** “E fit be just di people wey drink am?” dey give di group something to agree with or answer."
      - "**Give reason for one sentence or two.** Di field na **Your question** and e no fit dey empty."
      - "**Keep di replies for one place.** Answers go inside di expense comments, next to di numbers wey dem dey talk about."
  - heading: "Set am up for Side Badger"
    items:
      - "**Switch questions on.** Dem dey off by default. Admin go open di group **Settings page**, turn on **Allow expense questions** under **Features** for di **General tab** and choose **Sev**. If you turn am off later, e go clear every open question."
      - "**Raise one.** Open di expense and, next to your own name for di split, choose **I get question**. Write your reason for **Your question** and choose **I get question** again. Na only people wey dey inside di expense fit do dis. Di expense go now show **Questioned** badge."
      - "**Find wetin dey on hold.** For di expenses list, **Only questioned** go show di expenses wey get open question."
      - "**Fix am, if di group agree.** Open di expense, choose **Edit am**, change **Split bitwin** and choose **Update expense**. Who fit edit depend on di group permissions."
      - "**Close am, if nothing need fixing.** Di person wey ask fit use di close button for im **Questioned** badge, wey dem label **Close di question**, and admin fit do am too. Di expense go return to di balances once im last question don close."
  - heading: "When e no tidy like dat"
    items:
      - "**Di edit keep di questioner inside.** If di person wey ask still dey inside di expense, im question go carry over to di edited version and wait for am, or admin, to close am. To fix di amount no be same as to agree say e don fix."
      - "**You no dey inside di expense.** Na only people wey dey inside expense fit question am. If something look off to you, talk am for im comments or ask whoever add am."
      - "**Somebody wan leave di group.** Open question dey stop di people wey dey inside dat expense from to leave. Close di question, or edit di expense so dem no dey inside again, and dem fit go."
  - heading: "Wetin Side Badger no dey do here"
    items:
      - "E no dey decide who right. E dey hold di expense out of di balances and keep wetin una agree."
      - "E no dey ask anybody to approve expenses before dem count. Na only questioned expense dem dey hold."
      - "E no fit hold back part of expense. Question am and di whole of am go leave di balances."
      - "E no dey move money. You go pay each other anyhow you like and record am."
