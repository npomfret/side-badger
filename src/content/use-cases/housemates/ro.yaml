meta:
  title: "Împarte facturile casei cu colegii de casă"
  description: "Împarte chiria după mărimea camerei, împarte energia și alimentele egal și vezi cine cui datorează în fiecare lună. Un mod gratuit prin care colegii de casă țin evidența."
h1: "Împarte facturile casei cu colegii de casă"
navLabel: "Colegi de casă"
lead: "Pentru colegul care cumpără hârtia igienică și pentru colegii care nu văd niciodată asta întâmplându-se. Side Badger ține o singură evidență a chiriei, a facturilor și a cumpărăturilor pentru **colegi de casă, de apartament și de cameră**, așa că nimeni nu trebuie să alerge după nimeni, iar frigiderul poate redeveni doar un frigider."
cta:
  heading: "Începe cu propria ta casă"
  body: "Creează un cont, fă un grup pentru casă și trimite tuturor linkul de invitație. Facturile din această lună pot intra diseară."
  button: "Creează un cont gratuit"
scenario:
  heading: "Pune casa la punct"
  body: "Fă un grup pentru casă, alege numele sub care vrei să te vadă ceilalți și invită pe toată lumea cu un link sau un cod QR. Grupul poate fi deschis, unde toți adaugă și editează, sau administrat, unde membrii noi au nevoie de aprobarea unui administrator și doar creatorii și administratorii pot schimba cheltuielile, ceea ce se potrivește colegului care ține contabilitatea. Cine vrea doar să urmărească cifrele poate fi observator, care vede tot și nu schimbă nimic. Toți văd o cheltuială nouă imediat, așa că „o adaug mai târziu” are mai puține locuri unde să se ascundă."
sections:
  - heading: "Chiria și facturile"
    body: "Chiria rareori se împarte la patru, pentru că dormitoarele nu sunt egale. Împarte-o procentual, ca încăperea mare să plătească mai mult, iar debaraua cu fereastră mai puțin. Procentele trebuie să dea împreună 100. Facturile pe care le folosește toată lumea primesc o împărțire egală, iar un coleg care n-a avut nicio legătură cu o cheltuială poate fi exclus din ea. Când o împărțire egală lasă un ban în plus, acesta ajunge la o persoană aleasă la întâmplare. Nu există facturi recurente, așa că în fiecare lună copiezi chiria lunii trecute, schimbi data și mergi mai departe."
  - heading: "Cumpărăturile comune"
    body: "Ține lista de cumpărături comune în același grup cu notele de plată pentru cumpărături și bifează articolele pe măsură ce ajung în coș. Cine face cumpărăturile adaugă totalul chitanței ca o cheltuială și o împarte egal, sau doar între oamenii care vor mânca acel lucru. Cine tot cumpără laptele de ovăz pe care nu-l bea nimeni altcineva rămâne treaba casei, dar măcar lista de cheltuieli va fi corectă. Permisiunile grupului hotărăsc cine poate crea și edita liste. Pune laolaltă chiria, facturile și cumpărăturile și obții o lună ca cea de mai jos, într-o casă de patru: Jo plătește £2,000 chirie, împărțită 30%, 25%, 25% și 20% după mărimea camerei, apoi Kwame plătește £120 pentru energie, Lena £40 pentru internet și Matt £80 pentru alimente, fiecare împărțit egal. Lui Jo i se datorează în final £1,340, iar Side Badger sugerează trei plăți, toate către Jo."
  - heading: "Moduri corecte de a împărți costurile casei"
    items:
      - "**Egal** se potrivește la ce folosește toată lumea cam la fel, precum internetul, produsele de curățenie și cumpărăturile comune. E rapid și nimeni nu trebuie să se certe pe socoteli."
      - "**După mărimea camerei** se potrivește la chirie, pentru că și camerele, și ce sunt oamenii dispuși să plătească pentru ele diferă. Stabiliți procentele o dată, când se mută cineva, și refolosiți-le în fiecare lună."
      - "**După folosire** se potrivește la facturile la care cineva folosește clar mai mult, cum ar fi încălzirea unui birou de acasă sau un cont de streaming pe care îl văd doar doi oameni. Exclude oamenii care n-au avut nicio legătură cu el sau introdu sume exacte pentru fiecare persoană."
      - "Oricare ai alege, stabilește-o înainte de prima factură, nu după prima ceartă, și scrie regula undeva unde o vede toată casa."
  - heading: "Când cineva se mută"
    body: "Se achită mai întâi. Nimeni nu poate părăsi un grup cât timp datorează sau i se datorează bani, așa că cel care pleacă plătește sau e plătit, voi înregistrați, apoi el pleacă. Păstrează grupul pentru colegii care rămân și invită-l pe cel nou cu un link. Când casa însăși s-a terminat, un administrator poate bloca grupul, ca cifrele să rămână pe loc, sau îl poate închide definitiv, ceea ce îl face inaccesibil pentru toți, așa că fă asta doar când nimeni nu mai are nevoie de istoric."
