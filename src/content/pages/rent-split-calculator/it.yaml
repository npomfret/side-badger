faq:
  heading: Domande
  items:
    - q: Cosa è più giusto, la dimensione delle stanze o il reddito?
      a: Nessuno dei due è sempre più giusto. La dimensione delle stanze va bene per coinquilini che pagano lo spazio in cui dormono. Il reddito va bene per coppie e amici con stipendi molto diversi. Mettetevi d'accordo prima del primo giorno d'affitto, non dopo.
    - q: Le bollette vanno divise allo stesso modo?
      a: Per i coinquilini, di solito no. Energia e internet li usano tutti, quindi le parti uguali sono più semplici, come nell'esempio. In base al reddito, il calcolatore dà alle bollette le stesse quote dell'affitto.
    - q: Posso usare i piedi quadrati?
      a: Sì. Scegli ft² e scrivi le superfici in piedi quadrati. L'unità è solo un'etichetta, e le quote vengono uguali purché tutti usino la stessa.
    - q: Il calcolatore è gratuito?
      a: Sì. Gratis. Niente pubblicità. Nessun limite giornaliero. E non ti serve nemmeno un account.
