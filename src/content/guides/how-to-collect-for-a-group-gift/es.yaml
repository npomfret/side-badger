faq:
  heading: Preguntas
  items:
    - q: ¿Y si reunimos más de lo que cuesta el regalo?
      a: Las cantidades exactas tienen que sumar el precio, así que recorta las partes hasta que lo hagan. O destina el extra a algo real, como flores, e introdúcelo como un segundo gasto, igual que la felicitación y el papel del ejemplo.
    - q: ¿Puede alguien aportar sin unirse al grupo?
      a: No, si quieres que entre en la cuenta. Todos los que están en la división necesitan una cuenta gratuita y estar en el grupo. Para alguien que solo tiene efectivo, Priya podría cogerlo e introducir el regalo por lo que el grupo aún debe. Por ejemplo, si Sam le diera 40 £ en efectivo, ella introduciría 200 £ y las dividiría 60, 60 y 80 entre ella, Omar y Lena.
    - q: ¿Puede la encuesta decidir cuánto pone cada uno?
      a: No. Una encuesta acuerda una cifra para todo el grupo, como el presupuesto. La parte de cada persona la acordáis vosotros, y después la escribís en el gasto como **Cantidades exactas**.
