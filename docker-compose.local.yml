services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    # Local review flags (AGENTS.md), passed through only when set in the shell:
    # PREVIEW_UNPUBLISHED=1 I18N_MODE=english-first npm run dev
    environment:
      PREVIEW_UNPUBLISHED: ${PREVIEW_UNPUBLISHED:-}
      PREVIEW_PSEUDO: ${PREVIEW_PSEUDO:-}
      I18N_MODE: ${I18N_MODE:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4321/health"]
      interval: 30s
      timeout: 3s
      retries: 3
