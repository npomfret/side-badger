featuresHeading: De funktioner, et hus bruger
faq:
  heading: Spørgsmål
  items:
    - q: Kan huslejen gentages automatisk?
      a: Nej, der er ingen tilbagevendende regninger. Kopiér sidste måneds husleje med et par tryk, ændr datoen, så er du færdig.
    - q: Kan vi dele efter værelsesstørrelse?
      a: Ja, i procent. Giv hver bofælle en andel, der afspejler vedkommendes værelse, så længe andelene giver 100 i alt. [Del udgifter](page:feature/split-expenses) gennemgår de andre måder at dele på.
    - q: Hvad hvis en bofælle flytter ud og skylder penge?
      a: Vedkommende kan ikke forlade gruppen, før der er gjort op, fordi ingen kan forlade den, mens de skylder eller er til gode. Tallene bliver ærlige, indtil alle står lige.
    - q: Betaler Side Badger regningerne?
      a: Nej. Den fører regnskabet og foreslår en kort liste over betalinger. I betaler hinanden, som I vil, og registrerer det bagefter, som [gør op](page:feature/settle-up) forklarer.
    - q: Kan én bofælle føre regnskabet?
      a: Ja. Gør vedkommende til administrator, og brug en administreret gruppe, hvor nye medlemmer skal godkendes, og kun oprettere og administratorer kan ændre udgifter.
