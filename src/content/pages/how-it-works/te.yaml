meta:
  title: "Side Badger ఎలా పనిచేస్తుంది | ఐదు దశల్లో గ్రూప్ ఖర్చులను పంచండి"
  description: "గ్రూప్ సృష్టించండి, వాళ్లను ఆహ్వానించండి, ఖర్చులు జోడించండి, లెక్క తేల్చండి. “ఎవరో చెల్లించారు” నుండి “లెక్క సరిపోయింది” వరకు ఏం జరుగుతుందో ఒక పూర్తి ఉదాహరణతో చూడండి."
h1: "Side Badger ఎలా పనిచేస్తుంది"
navLabel: "ఎలా పనిచేస్తుంది"
lead: "“ఎవరో చెల్లించారు” మరియు “లెక్క సరిపోయింది” మధ్య ఏం జరుగుతుంది? ఐదు దశలు, స్ప్రెడ్‌షీట్ లేదు, ఎక్కువగా అలంకారానికే ఉండే ఒక బ్యాడ్జర్. మొదటి గ్రూప్ నుండి చివరి రికార్డ్ చేసిన పేమెంట్ వరకు మొత్తం ప్రయాణం ఇదే. ఏ దశ గురించైనా వివరాల కోసం [ఖర్చుల పంపకం](page:feature/split-expenses), [లెక్క తేల్చడం](page:feature/settle-up) చూడండి."
cta:
  heading: "“ఇది నేను ఇచ్చేస్తా” నుండి “లెక్క సరిపోయింది” వరకు"
  body: "ఉచిత ఖాతా తెరవండి, గ్రూప్ మొదలుపెట్టండి, మొదటి ఖర్చును జోడించండి. మీ రసీదును బ్యాడ్జర్ తప్పు పట్టదు."
  button: "ఉచిత ఖాతా తెరవండి"
steps:
  - title: "గ్రూప్ సృష్టించండి"
    body: "ప్రతి ఇంటికి, ట్రిప్‌కు లేదా ఈవెంట్‌కు ఒక గ్రూప్ చేయండి, అప్పుడు అద్దె ఎప్పుడూ పెళ్లి బహుమతి జాబితాలో కలవదు. దానికి పేరు పెట్టండి, వాళ్లకు మీరు ఏ పేరుతో కనిపించాలో ఎంచుకోండి, కావాలంటే అది తీసుకునే కరెన్సీలను పరిమితం చేయండి. అప్పుడు మీ డ్యాష్‌బోర్డ్ అన్ని గ్రూపులను, ప్రతిదానిలో మీ స్థితిని ఒకే స్క్రీన్‌పై చూపిస్తుంది."
    shot: S02
    shotAlt: "గ్రూప్ సృష్టించే డైలాగ్, కరెన్సీ పరిమితుల విభాగం తెరిచి ఉంది"
  - title: "మీ వాళ్లను ఆహ్వానించండి"
    body: "చేరే లింక్ షేర్ చేయండి లేదా QR కోడ్ చూపించండి, అది ఎంతసేపు పనిచేయాలో 15 నిమిషాల నుండి 5 రోజుల వరకు సెట్ చేయండి. చేరే ప్రతి ఒక్కరికీ ఉచిత ఖాతా, ధృవీకరించిన ఇమెయిల్ కావాలి, ఒక గ్రూప్‌లో 50 మంది వరకు ఉండవచ్చు. ఎవరు రావాలో మీరే చూడాలనుకుంటే అనుమతి ఆన్ చేయండి, అడ్మిన్ ప్రతి ఒక్కరినీ లోపలికి రానిస్తారు."
    shot: S03
    shotAlt: "ఆహ్వాన డైలాగ్‌లో లింక్ ట్యాబ్, QR కోడ్, గడువు ఎంపికలతో"
  - title: "ఖర్చులు జరిగినప్పుడే జోడించండి"
    body: "ఎవరు చెల్లించారో, ఎంత, ఎవరి కోసమో చెప్పండి. సమానంగా, ఖచ్చితమైన మొత్తాలతో లేదా శాతంతో పంచండి, అందులో భాగం కాని వాళ్లను వదిలేయండి. ఖర్చు జోడించగానే అందరికీ వెంటనే కనిపిస్తుంది, ఏం మారిందో, ఎవరు మార్చారో కూడా."
    shot: S05
    shotAlt: "శాతం పంపకంతో ఖర్చు ఫారం, గది పరిమాణం ప్రకారం అద్దెను పంచుతున్నారు"
  - title: "బ్యాలెన్స్‌లను గమనించండి"
    body: "Side Badger ప్రతి కరెన్సీకి నడుస్తున్న బ్యాలెన్స్ ఉంచుతుంది, కాబట్టి ఎవరు ఎవరికి బాకీనో ఒక్క చూపులో తెలుస్తుంది. చిన్న అప్పుల చిక్కును అందరూ తామే విప్పుకునేలా వదిలేయకుండా, గ్రూప్ లెక్క తేల్చే పేమెంట్ల చిన్న జాబితాను సూచిస్తుంది."
    shot: S10
    shotAlt: "రెండు కరెన్సీలలో సరళీకృత అప్పులు చూపుతున్న బ్యాలెన్స్ స్క్రీన్, అన్నీ చూపించు ఆన్‌లో ఉంది"
  - title: "యాప్ బయట లెక్క తేల్చండి, లోపల రికార్డ్ చేయండి"
    body: "Side Badger డబ్బును ఎప్పుడూ కదిలించదు. మీకు నచ్చిన విధంగా ఒకరికొకరు చెల్లించుకోండి, తర్వాత పేమెంట్‌ను రికార్డ్ చేయండి, బ్యాలెన్స్‌లు అందుకుంటాయి, రిఫ్రెష్ లేకుండానే అందరి స్క్రీన్ అప్‌డేట్ అవుతుంది. “సెటిల్” అంటే బ్యాలెన్స్‌లు సున్నా చూపడమే. ఎవరికైనా ఇవ్వాల్సినవి లేదా రావాల్సినవి మిగిలి ఉన్నంత వరకు వాళ్లు గ్రూప్ వదలలేరు, కాబట్టి బయటకు వెళ్లేవాళ్లు ముందు లెక్క తేల్చుకుంటారు."
    shot: S11
    shotAlt: "క్విక్-సెటిల్ బటన్లు, పాక్షిక పేమెంట్ నోటీసుతో పేమెంట్ ఫారం"
requirements:
  heading: "మీకు ఏం కావాలి"
  items:
    - "ఒక ఉచిత ఖాతా. కావలసింది ఇమెయిల్ చిరునామా, పాస్‌వర్డ్ మాత్రమే, ఏదైనా జోడించే ముందు ఇమెయిల్‌ను ధృవీకరించాలి."
    - "18 ఏళ్లు లేదా అంతకంటే ఎక్కువ వయసు."
    - "ఫోన్ లేదా కంప్యూటర్‌లో ఆధునిక బ్రౌజర్, ఇంటర్నెట్ కనెక్షన్. Side Badger యాప్-స్టోర్ యాప్ కాదు, ఆఫ్‌లైన్‌లో పనిచేయదు."
    - "కావాలంటే మీ హోమ్ స్క్రీన్‌పై ఒక చోటు. యాప్ స్టోర్ అవసరం లేదు, ఎందుకంటే Side Badgerను మీ హోమ్ స్క్రీన్‌కు లేదా డాక్‌కు జోడించవచ్చు, అది యాప్‌లా తెరుచుకుంటుంది."
example:
  heading: "రాత్రి బయటకు వెళ్లొచ్చాక ముగ్గురు స్నేహితులు"
  currency: GBP
