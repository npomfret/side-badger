meta:
  title: "Divide los gastos de una despedida de soltero/a | Side Badger"
  description: "La persona homenajeada no paga nada y el lunes todos se siguen hablando. Cómo dividir una despedida de soltero o soltera, con las cuentas hechas."
h1: "Cómo dividir los gastos de una despedida de soltero o soltera"
navLabel: "Despedida de soltero/a"
lead: "La persona homenajeada no paga nada, así que el resto del grupo divide cada gasto [a partes iguales](page:feature/split-expenses) entre quienes pagan. Deja fuera a cada persona de los gastos que se salta, y mantén a la persona homenajeada fuera del grupo para que la sorpresa aguante."
cta:
  heading: "Lleva la cuenta, guarda la sorpresa"
  body: "Haz un grupo, envía el enlace a todos menos a la persona homenajeada y añade cada gasto según ocurre. Side Badger es gratis, sin anuncios y sin límites diarios."
sections:
  - heading: "Cuatro amigos y una sorpresa"
    body: "Hannah, Isla, Jess y Kat se llevan a Grace de fin de semana por su despedida de soltera. Grace es la persona homenajeada, así que no paga nada. Tampoco está en el grupo, así que no puede ver lo que gastan sus amigos en ella. Hannah reserva la casa rural, Isla paga el día de spa, Jess se encarga de la cena y Kat coge el taxi. Para el domingo todo el mundo ha pagado algo, y nadie sabe quién va por delante. Las cuentas son las mismas para una despedida de soltero o de soltera, sea quien sea la persona homenajeada."
  - heading: "Divide entre quienes pagan, no entre quienes van"
    body: "La parte de la persona homenajeada no desaparece. Se reparte. La casa rural cuesta 720 £ y la pagan cuatro amigos, así que son 180 £ cada uno, y el sitio de Grace ya está incluido en esa cifra. La cena son 260 £, es decir, 65 £ cada uno. El taxi son 44 £, es decir, 11 £ cada uno. Lo que alguien se salta sale solo de ese gasto. Kat se salta el spa, así que sus 360 £, que cubren también el sitio de Grace, se reparten entre Hannah, Isla y Jess a 120 £ cada uno. Suma todo y Hannah, Isla y Jess deben cada uno 376 £ del fin de semana, y Kat debe 256 £."
  - heading: "Configúralo en Side Badger"
    items:
      - "Haz un grupo para el fin de semana y ponle un nombre aburrido, como Fin de semana en la casa rural. Grace no es miembro, y solo los miembros de un grupo pueden verlo."
      - "Elige **Invitar a otros** y envía el enlace, o enseña el código QR, solo donde Grace no lo vea. El enlace muestra una vista previa del grupo antes de que nadie se una. Elige cuánto dura, de 15 minutos a 5 días. Un enlace antiguo sigue funcionando hasta que caduca, así que no lo dejes más tiempo del necesario."
      - "Para cada gasto, elige **Añadir gasto**, escribe el importe y elige a quien pagó en **¿Quién pagó?** En **Dividir entre**, marca a las personas que pagan, dejando fuera a quien se lo saltó, como Kat en el spa. Elige **Igual** en **Cómo dividir**."
      - "Cuando estéis en casa, abre los **Saldos** del grupo. Side Badger muestra quién debe a quién y sugiere una lista corta de pagos. Aquí son tres: Kat paga 212 £ a Hannah, Jess paga 116 £ a Hannah e Isla paga 16 £ a Hannah. Pagaos como queráis y después usa **Liquidar** para registrar cada pago."
  - heading: "Antes de reservar, un presupuesto y una señal"
    body: "Acordad el presupuesto antes de que nadie reserve. Elige **Añadir encuesta**, pregunta cuánto va a gastar el grupo en la casa rural y ofrece algunas cifras como opciones. Activa **Votación anónima** al crearla, para ocultar quién votó qué, y que nadie tenga que defender en voz alta un presupuesto más pequeño. Cierra la encuesta cuando todo el mundo haya votado y aparezca la opción ganadora. Después viene la señal. Quien reserva la paga y la añade como un gasto, dividido a partes iguales, y el resto del importe entra como segundo gasto cuando venza. Los demás pueden mandar su parte enseguida y registrar el pago, o esperar a la cuenta final. Los saldos salen igual de las dos maneras."
  - heading: "Cuando alguien se une solo una noche"
    body: "Un amigo que solo se presenta el sábado no debería pagar el viernes. Déjalo fuera de los gastos en los que no participó. Cuando el coste depende de cuánto tiempo se queda cada persona, como una habitación, elige **Cantidades exactas** en **Cómo dividir** y escribe la parte de cada persona, que tiene que sumar el total. Calcula primero un precio por persona y noche y multiplícalo por las noches que se queda cada una. La página de [viajes en grupo](page:use-case/group-trips) cuenta más sobre los gastos que no son iguales para todos."
  - heading: "Lo que Side Badger no hace aquí"
    items:
      - "Nunca mueve dinero. Os pagáis por transferencia bancaria, en efectivo o como os venga bien, y después registráis el pago para que los saldos se actualicen para todos."
      - "No envía recordatorios de pago. Un toque amable en el chat del grupo sigue siendo cosa de una persona."
      - "Cada gasto tiene un solo pagador, y Side Badger no puede dividir un recibo línea por línea. Si dos tarjetas pagaron la casa rural, introdúcela como dos gastos. Si algunas personas pidieron extras en la cena, introduce los extras como un gasto aparte."
      - "Guarda el dinero, no el itinerario. Las encuestas y los comentarios se quedan en los gastos, así que los planes del fin de semana se quedan en el chat de vuestro grupo."
