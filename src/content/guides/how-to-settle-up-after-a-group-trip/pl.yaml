meta:
  title: "Jak rozliczyć się po wyjeździe grupowym | Side Badger"
  description: "Rozliczcie się, zanim wszyscy się rozjadą. Dziesięć splątanych długów to cztery płatności, a płatność częściowa jest w porządku. Rachunki dla pięciu osób."
h1: "Jak rozliczyć się po wyjeździe grupowym"
navLabel: "Rozliczenie po wyjeździe"
lead: "Rozliczcie się, zanim wszyscy się rozjadą. Dodaj ostatni wydatek, otwórz salda grupy i zapłać to, co wisisz, z krótkiej listy, jak chcesz. Potem zarejestruj każdą płatność w Side Badger, żeby saldo wyczyściło się dla całej grupy. Przy pięciu przyjaciołach i pięciu wydatkach dziesięć splątanych długów zmienia się w cztery płatności."
cta:
  heading: "Zamknij księgi, zanim wylądują zdjęcia"
  body: "Załóż darmowe konto, utwórz grupę na następny wyjazd i dodawaj każdy koszt na bieżąco. Krótka lista płatności czeka, zanim dojedziesz na lotnisko. Chcesz najpierw zobaczyć, [jak działa rozliczanie](page:feature/settle-up)?"
sections:
  - heading: "Pięcioro przyjaciół, pięć wydatków, jedna hala odlotów"
    body: "Mo, Ines, Raf, Tess i Uma spędzili tydzień na wybrzeżu. Mo zarezerwował apartament i zrobił zakupy spożywcze, Ines zapłaciła za rejs łodzią, a Raf wziął na siebie wielką kolację. Tess wzięła taksówkę na lotnisko z Umą i Mo, bo Ines i Raf jechali pociągiem. Karta Umy została w domu, więc Uma za nic nie płaciła. To pięć wydatków i 1 700 € w sumie, a w hali odlotów nikt nie umiał powiedzieć, kto jest na plusie."
  - heading: "Dziesięć długów, cztery płatności"
    body: "Apartament, rejs, kolacja i zakupy spożywcze dzielą się po równo na pięć osób. To 200 €, 50 €, 60 € i 18 € na osobę, więc Ines i Raf są winni po 328 €. Taksówkę dzielą trzy osoby po 20 €, więc Mo, Tess i Uma są winni po 348 €. Mo zapłacił 1 090 € i jest winien 348 €, więc należy mu się 742 €. Wszyscy inni zapłacili mniej, niż są winni. Umie brakuje 348 €, Tess 288 €, Ines 78 €, a Rafowi 28 €, i razem dają one 742 € Mo. Rozliczaj każdą parę osób bezpośrednio, a wyjdzie dziesięć osobnych długów. Zamiast tego Side Badger podpowiada cztery płatności, wszystkie do Mo."
  - heading: "Rozliczcie się, zanim wszyscy się rozjadą"
    body: "Najlepszy moment to ostatni wieczór albo droga do domu, gdy wszyscy są jeszcze w jednym miejscu, a dług 28 € łatwo przy okazji wspomnieć. Najpierw dodajcie każdy wydatek, także taksówkę. Nikt nie może opuścić grupy, dopóki jest komuś winien pieniądze albo ktoś jest winien jemu, więc i tak w którymś momencie rachunek trzeba zamknąć."
    items:
      - "**Sprawdź listę.** Otwórz grupę i spójrz na **Salda**. Domyślnie widzisz długi, które cię dotyczą. Wybierz **Pokaż wszystko**, żeby zobaczyć listę całej grupy."
      - "**Zapłać, jak chcesz.** Przelew, gotówka, przysługa z ostatnich wakacji. Side Badger nie przesyła pieniędzy."
      - "**Zarejestruj to.** Wybierz **Ureguluj**. W części **Szybkie rozliczenie** każdy przycisk to jedna z podpowiedzianych płatności, a wybranie go uzupełnia kwotę. Dodaj notatkę w polu **Notatka**, na przykład „przelew bankowy”, sprawdź datę w polu **Data** (nie może być w przyszłości) i wybierz **Zarejestruj rozliczenie**."
      - "**Patrz, jak znika.** Saldo aktualizuje się dla wszystkich. Gdy wpłynie ostatnia płatność, **Salda** pokazują **Wszystko rozliczone!**"
  - heading: "Część teraz, reszta później"
    body: "Uma może wysłać 200 € dziś wieczorem, a resztę pod koniec miesiąca. Rejestruje 200 €, a formularz ostrzega, że po tym nadal będzie winna Mo 148 €, czyli 348 € minus 200 €. Zapisz, a 148 € zostaje na jej saldzie, dopóki nie zarejestruje reszty. Ostrzeżenie działa też w drugą stronę. Jeśli zabłąkane zero zmieni 348 € w 3 480 €, formularz powie, że jest winna Mo tylko 348 €, a zapis stworzyłby dług w przeciwnym kierunku. Popraw zero przed zapisem."
  - heading: "Naprawianie błędów i świętowanie płatności"
    items:
      - "**Błędna płatność.** Tylko osoba, która zarejestrowała płatność, może ją edytować. Ona albo administrator grupy może ją usunąć, a wtedy można ją zarejestrować od nowa."
      - "**Płatność warta zauważenia.** Każda zarejestrowana płatność ląduje w sekcji **Rozliczenia** z datą i notatką, gdzie każdy w grupie może ją zobaczyć i zareagować. Mo może wybrać **Świętuj**, gdy dotrze ostatnie 148 € od Umy."
      - "**Koniec.** Gdy każde saldo wynosi zero, administrator może zablokować grupę, żeby liczby zostały na miejscu."
  - heading: "Czego Side Badger tu nie robi"
    items:
      - "Nigdy nie przesyła pieniędzy. Nie ma linków do płatności ani próśb o płatność, więc płatność w aplikacji to zapis płatności dokonanej gdzie indziej."
      - "Nie wysyła przypomnień. Ponaglanie spóźnionej płatności nadal należy do ciebie."
      - "Nie ustala terminów. Kiedy ma wpłynąć reszta 148 € Umy, uzgadnia grupa."
      - "Podpowiadane płatności to krótka lista, a nie obietnica najkrótszej możliwej. Są liczone osobno dla każdej waluty, więc wyjazd opłacany w euro i funtach dostaje osobną listę dla każdej."
