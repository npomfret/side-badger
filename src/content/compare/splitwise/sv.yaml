faq:
  heading: Frågor
  items:
    - q: Är Side Badger ett gratis alternativ till Splitwise?
      a: "För att dela räkningar i en grupp, ja. Kvittoskanning, valutaomräkning och inga annonser är gratis, utan dagliga gränser. Om du behöver en inbyggd app, offlineanvändning, återkommande utgifter eller betalningar i appen gör Splitwise det och Side Badger inte."
    - q: Var kommer Splitwise-uppgifterna ifrån?
      a: "Från Splitwises egna sidor: dess startsida, dess Pro-sida och dess hjälpcenter. Varje rad i tabellen länkar till sidan den kom från, och datumet ovanför tabellen säger när vi läste dem. Vi kontrollerar dem varje kvartal."
    - q: Kommer Side Badger att förbli gratis?
      a: "Allt i Side Badger är gratis i dag, och det finns ingen betalnivå. Om det någonsin ändras ger vi dig besked först. [Prissidan](page:pricing) har detaljerna."
    - q: Måste alla i min grupp byta?
      a: "Ja. Alla i en grupp behöver ett gratis Side Badger-konto, och de kan gå med via en länk eller en QR-kod."
    - q: Har Side Badger en mobilapp?
      a: "Inte i en appbutik. Den körs i din webbläsare: logga in på telefonen och lägg sedan till den på hemskärmen så öppnas den som en app. [Så fungerar det](page:how-it-works) visar hur."
