faq:
  heading: "Perguntas"
  items:
    - q: "Quem deve registar um pagamento, quem paga ou quem recebe?"
      a: "Registar um pagamento exige permissão para editar despesas, e o formulário pergunta **Quem pagou?** e **Quem recebeu o pagamento?** Só quem o registou o pode editar depois, por isso costuma ser mais simples que seja quem paga a fazê-lo, com o botão de acerto rápido."
    - q: "E se a viagem teve duas moedas?"
      a: "Os saldos são mantidos por moeda, por isso uma dívida em euros continua a ser uma dívida em euros e cada moeda tem a sua própria lista curta, a menos que as despesas tenham sido convertidas quando foram introduzidas. [Várias moedas](page:guide/how-to-split-a-trip-paid-in-several-currencies) mostra os dois caminhos."
    - q: "Devemos acertar durante a viagem ou no fim?"
      a: "Qualquer um serve. Cada pagamento registado muda os saldos, por isso um pagamento feito a meio da viagem conta para a lista final. No fim é mais simples, porque [a viagem toda](page:use-case/group-trips) está num só sítio."
